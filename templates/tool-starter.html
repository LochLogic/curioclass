<!doctype html>
<html lang="en" data-band="35">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Name · Curio Class</title>
<meta name="description" content="One line: what students do with this tool.">
<!--
CURIO CLASS TOOL STARTER
House rules: one file, works offline, no network requests, no tracking, no accounts,
WCAG 2.2 AA, sources and licenses cited below.

HOW TO USE
1. Copy this file to tools/<tool-id>/<tool-id>.html.
2. Set data-band on <html>: k2 | 35 | 68 | 912. Add ?band=k2 to the URL to preview other bands.
3. Replace the title, the meta description, the #tool-title/#tool-outcome text and the demo inside <main>.
4. Call Curio.celebrate(), Curio.say(text), Curio.bell() and Curio.mode from your tool code.
5. Fill in the SOURCES / LICENSE block and tools/<tool-id>/meta.json.

BANDS
k2  : teacher led on a projector or smartboard. Huge visuals, celebrations readable
      from the back of the room, read-aloud, nothing a child must read alone.
35  : colorful, light game elements, students may drive.
68  : cleaner, scores and streaks, smaller celebrations.
912 : dark "pro instrument" look, minimal celebration.

SOURCES: (cite every data source here)
LICENSE: Content CC BY 4.0, code MIT. Curio Class, curioclass.org
-->
<style>
:root{
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:Consolas,'Courier New',monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --focus:#2f5bd3;
}
/* Band skins: same layout and controls, different feel */
[data-band="k2"]{--bg:#fff7e8;--paper:#ffffff;--ink:#1f2a44;--muted:#5a6680;--line:#f0d9b5;--accent:#ff6b4a;--accent-2:#2bb3a3;--good:#2fae5f;--bad:#e05454;--radius:28px;--base:24px;--target:80px;--title:44px;--burst:90}
[data-band="35"]{--bg:#eef4ff;--paper:#ffffff;--ink:#1d2b4a;--muted:#55627d;--line:#cfdcf3;--accent:#5b5bf0;--accent-2:#f2a93b;--good:#2f9e5f;--bad:#d9534f;--radius:20px;--base:19px;--target:58px;--title:34px;--burst:50}
[data-band="68"]{--bg:#f3f5f7;--paper:#ffffff;--ink:#1b2430;--muted:#5b6673;--line:#d8dee5;--accent:#0f7c8c;--accent-2:#e2733a;--good:#2a8a55;--bad:#c94a4a;--radius:14px;--base:17px;--target:48px;--title:28px;--burst:24}
[data-band="912"]{--bg:#0a121a;--paper:#101c27;--ink:#e3eef5;--muted:#93a7b5;--line:#22384a;--accent:#36c6f0;--accent-2:#a78bfa;--good:#4ccf8a;--bad:#ff7a7a;--radius:10px;--base:16px;--target:44px;--title:24px;--burst:0;--focus:#ffffff}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--base)/1.5 var(--font);display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
button{min-height:var(--target);min-width:var(--target);padding:0 1em;border-radius:var(--radius);border:2px solid var(--line);background:var(--paper);cursor:pointer;transition:transform .12s var(--ease),border-color .12s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--paper))}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--paper);padding:8px 12px;border-radius:8px;z-index:20}
.skip:focus{top:8px}

/* Header: Curio Class mark, tool title, controls */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.mark{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em;font-size:15px;color:var(--muted);text-decoration:none;white-space:nowrap}
.mark svg{width:26px;height:26px}
.titles{flex:1;min-width:200px}
#tool-title{margin:0;font-size:var(--title);line-height:1.1;letter-spacing:-.02em}
#tool-outcome{margin:2px 0 0;color:var(--muted);font-size:.8em}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls button{font-size:15px;min-height:44px;min-width:44px}
[data-band="k2"] .controls button{min-height:60px;font-size:18px}

main{flex:1;padding:24px 20px;max-width:1200px;width:100%;margin:0 auto}
footer{padding:10px 20px;font-size:12px;color:var(--muted);text-align:center}
footer a{color:inherit}

/* Opening reveal: short, satisfying, skipped for reduced motion */
.reveal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--accent);pointer-events:none;animation:lift .75s var(--ease) .35s forwards}
.reveal svg{width:96px;height:96px;animation:pop .45s var(--ease) both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes lift{to{clip-path:inset(0 0 100% 0)}}
.reveal{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.reveal{display:none}*{animation:none!important;transition:none!important}}

/* Celebration layer */
#burst{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.bit{position:absolute;width:14px;height:14px;border-radius:3px;animation:fly 1.1s var(--ease) forwards}
[data-band="k2"] .bit{width:26px;height:26px}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* Demo activity (replace) */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.prompt{font-size:1.4em;margin:0 0 16px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.choices button{font-size:1.2em}
.choices button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--paper))}
.choices button.wrong{border-color:var(--bad)}
.status{margin-top:16px;min-height:1.6em;font-weight:600}
.score{font-family:var(--mono);color:var(--muted)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the activity</a>

<div class="reveal" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fff"/><path d="M15 25a9 9 0 1 1 9 9" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" style="color:var(--accent)"/><circle cx="24" cy="25" r="3" fill="var(--accent)"/></svg></div>

<header>
  <a class="mark" href="https://curioclass.org" aria-label="Curio Class home">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="var(--accent)"/><path d="M15 25a9 9 0 1 1 9 9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="25" r="3" fill="#fff"/></svg>
    Curio Class
  </a>
  <div class="titles">
    <h1 id="tool-title">Tool Name</h1>
    <p id="tool-outcome">Students will... (one line, what they do)</p>
  </div>
  <div class="controls" role="toolbar" aria-label="Tool controls">
    <button id="mode-practice" aria-pressed="true">Practice</button>
    <button id="mode-challenge" aria-pressed="false">Challenge</button>
    <button id="sound" aria-pressed="false" aria-label="Sound">🔇</button>
    <button id="read" aria-label="Read aloud">🔊 Read</button>
    <button id="full" aria-label="Full screen">⛶</button>
  </div>
</header>

<main id="main">
  <!-- DEMO: replace everything in <main> with the tool -->
  <section class="card" aria-labelledby="q">
    <p class="prompt" id="q">Which shape has three sides?</p>
    <div class="choices" id="choices">
      <button data-right>Triangle</button>
      <button>Square</button>
      <button>Circle</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="score" id="score" hidden></p>
  </section>
</main>

<footer>Curio Class · Free forever, no sign-up · Content CC BY 4.0, code MIT · <a href="https://curioclass.org">curioclass.org</a></footer>
<div id="burst" aria-hidden="true"></div>

<script>
/* Curio shared helpers: keep in every tool */
const Curio = (() => {
  const root = document.documentElement;
  const qp = new URLSearchParams(location.search).get('band');
  if (['k2','35','68','912'].includes(qp)) root.dataset.band = qp;
  const css = n => getComputedStyle(root).getPropertyValue(n).trim();

  let sound = false, ctx;
  const api = {
    mode: 'practice',
    onMode: () => {},
    bell(freq = 880) {
      if (!sound) return;
      ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(.25, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + 1.2);
      o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 1.2);
    },
    celebrate() {
      api.bell(1046);
      const n = +css('--burst');
      if (!n || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const layer = document.getElementById('burst');
      const colors = [css('--accent'), css('--accent-2'), css('--good'), '#ffd23f'];
      for (let i = 0; i < n; i++) {
        const b = document.createElement('span'); b.className = 'bit';
        b.style.left = '50%'; b.style.top = '45%';
        b.style.background = colors[i % colors.length];
        const a = Math.random() * Math.PI * 2, d = 200 + Math.random() * 450;
        b.style.setProperty('--dx', Math.cos(a) * d + 'px');
        b.style.setProperty('--dy', Math.sin(a) * d + 'px');
        b.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
        layer.append(b); setTimeout(() => b.remove(), 1200);
      }
    },
    say(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.rate = root.dataset.band === 'k2' ? .9 : 1;
      speechSynthesis.speak(u);
    },
    readTarget: () => document.querySelector('main').innerText
  };

  const setMode = m => {
    api.mode = m;
    document.getElementById('mode-practice').setAttribute('aria-pressed', m === 'practice');
    document.getElementById('mode-challenge').setAttribute('aria-pressed', m === 'challenge');
    api.onMode(m);
  };
  document.getElementById('mode-practice').onclick = () => setMode('practice');
  document.getElementById('mode-challenge').onclick = () => setMode('challenge');
  document.getElementById('sound').onclick = e => {
    sound = !sound; e.currentTarget.setAttribute('aria-pressed', sound);
    e.currentTarget.textContent = sound ? '🔔' : '🔇'; api.bell();
  };
  document.getElementById('read').onclick = () => api.say(api.readTarget());
  document.getElementById('full').onclick = () =>
    document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen?.();
  setTimeout(() => document.querySelector('.reveal')?.remove(), 1300);
  return api;
})();

/* DEMO tool code: replace */
(() => {
  let right = 0, tries = 0;
  const status = document.getElementById('status'), score = document.getElementById('score');
  Curio.onMode = m => { right = tries = 0; score.hidden = m !== 'challenge'; score.textContent = 'Score 0 / 0'; reset(); };
  const reset = () => document.querySelectorAll('#choices button').forEach(b => b.className = '');
  document.getElementById('choices').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    tries++;
    if (b.hasAttribute('data-right')) {
      right++; b.className = 'right'; status.textContent = 'Yes! A triangle has three sides.';
      Curio.celebrate();
    } else {
      b.className = 'wrong'; status.textContent = 'Not quite. Try again.';
    }
    score.textContent = `Score ${right} / ${tries}`;
  });
})();
</script>
</body>
</html>
