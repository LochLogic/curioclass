<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="Early fighting route schematic"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="18" fill="#172832" stroke="none"><text x="25" y="35">Teaching route. Not to scale.</text><path d="M80 160 L320 160 L560 160" fill="none" stroke="#172832" stroke-width="3"/><text x="35" y="140">Boston</text><text x="265" y="140">Lexington</text><text x="510" y="140">Concord</text><text x="30" y="260">Put dates on separate slips.</text><text x="30" y="300">This is a route, not a battle-outcome map.</text></g></svg>