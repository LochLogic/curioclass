<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"><title>Reserved sensitive plant evidence sequence</title><rect width="100%" height="100%" fill="white"/><text x="20" y="28" font-size="18" font-family="Arial" fill="#17283a">Invented sensitive-plant record. No rootless classroom specimen shown.</text><rect x="15" y="50" width="210" height="210" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="25" y="80" font-size="16" font-family="Arial" fill="#17283a">Monday: dry soil</text><path d="M120,220 L120,135" fill="none" stroke="#527c48" stroke-width="5"/><path d="M45,220 L190,220" fill="none" stroke="#8b765e" stroke-width="3"/><ellipse cx="95" cy="160" rx="20" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><ellipse cx="145" cy="150" rx="20" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><path d="M120,220 L90,242" fill="none" stroke="#527c48" stroke-width="3"/><path d="M120,220 L155,242" fill="none" stroke="#527c48" stroke-width="3"/><rect x="237" y="50" width="210" height="210" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="247" y="80" font-size="16" font-family="Arial" fill="#17283a">Tuesday: watered</text><path d="M342,220 L342,135" fill="none" stroke="#527c48" stroke-width="5"/><path d="M267,220 L412,220" fill="none" stroke="#8b765e" stroke-width="3"/><ellipse cx="317" cy="160" rx="20" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><ellipse cx="367" cy="150" rx="20" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><path d="M342,220 L312,242" fill="none" stroke="#527c48" stroke-width="3"/><path d="M342,220 L377,242" fill="none" stroke="#527c48" stroke-width="3"/><rect x="459" y="50" width="210" height="210" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="469" y="80" font-size="16" font-family="Arial" fill="#17283a">Later: larger leaves</text><path d="M564,220 L564,135" fill="none" stroke="#527c48" stroke-width="5"/><path d="M489,220 L634,220" fill="none" stroke="#8b765e" stroke-width="3"/><ellipse cx="539" cy="160" rx="30" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><ellipse cx="589" cy="150" rx="30" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><rect x="681" y="50" width="210" height="210" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="691" y="80" font-size="16" font-family="Arial" fill="#17283a">Touch, then reopen</text><path d="M786,220 L786,135" fill="none" stroke="#527c48" stroke-width="5"/><path d="M711,220 L856,220" fill="none" stroke="#8b765e" stroke-width="3"/><ellipse cx="761" cy="160" rx="20" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><ellipse cx="811" cy="150" rx="20" ry="8" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><text x="701" y="248" font-size="14" font-family="Arial" fill="#17283a">folded / reopened</text><text x="25" y="300" font-size="18" font-family="Arial" fill="#17283a">Pollen moves between flowers; later a whole pod appears.</text><ellipse cx="760" cy="295" rx="60" ry="18" fill="#c7d7ae" stroke="#25374a" stroke-width="2"/><text x="675" y="333" font-size="16" font-family="Arial" fill="#17283a">Whole pod, inside hidden</text><path d="M755,205 L755,135" fill="none" stroke="#527c48" stroke-width="4"/><ellipse cx="750" cy="160" rx="4" ry="16" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><ellipse cx="760" cy="160" rx="4" ry="16" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><path d="M825,205 L825,135" fill="none" stroke="#527c48" stroke-width="4"/><ellipse cx="805" cy="160" rx="16" ry="5" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><ellipse cx="845" cy="160" rx="16" ry="5" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><text x="715" y="110" font-size="14" font-family="Arial" fill="#17283a">closed / open</text></svg>