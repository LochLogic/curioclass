<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"><title>Reserved sea-otter structure and reproduction model</title><rect width="100%" height="100%" fill="white"/><text x="20" y="28" font-size="18" font-family="Arial" fill="#17283a">Invented sea-otter record. Separate symbols, not anatomical positions.</text><rect x="20" y="50" width="270" height="275" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="35" y="80" font-size="18" font-family="Arial" fill="#17283a">Fur and trapped air</text><path d="M50,145 L60,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="50" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M70,145 L80,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="70" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M90,145 L100,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="90" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M110,145 L120,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="110" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M130,145 L140,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="130" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M150,145 L160,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="150" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M170,145 L180,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="170" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M190,145 L200,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="190" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M210,145 L220,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="210" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M230,145 L240,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="230" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><path d="M250,145 L260,110" fill="none" stroke="#65707c" stroke-width="4"/><ellipse cx="250" cy="170" rx="5" ry="7" fill="#d2e5ef" stroke="#25374a" stroke-width="2"/><text x="35" y="215" font-size="16" font-family="Arial" fill="#17283a">Fur helps retain warmth.</text><text x="35" y="255" font-size="16" font-family="Arial" fill="#17283a">Air between hairs</text><rect x="315" y="50" width="270" height="275" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="330" y="80" font-size="18" font-family="Arial" fill="#17283a">Feeding and grooming</text><ellipse cx="435" cy="180" rx="70" ry="38" fill="#b5a89a" stroke="#25374a" stroke-width="2"/><ellipse cx="500" cy="155" rx="29" ry="28" fill="#b5a89a" stroke="#25374a" stroke-width="2"/><ellipse cx="510" cy="150" rx="3" ry="4" fill="#25374a" stroke="#25374a" stroke-width="2"/><path d="M440,195 L480,220" fill="none" stroke="#25374a" stroke-width="3"/><path d="M480,220 L510,190" fill="none" stroke="#25374a" stroke-width="3"/><text x="330" y="270" font-size="16" font-family="Arial" fill="#17283a">Paws / mouth / brain</text><text x="330" y="295" font-size="16" font-family="Arial" fill="#17283a">Digestive parts inside</text><rect x="610" y="50" width="270" height="275" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="625" y="80" font-size="18" font-family="Arial" fill="#17283a">Before and after birth</text><ellipse cx="675" cy="150" rx="38" ry="45" fill="#e5c6c9" stroke="#25374a" stroke-width="2"/><ellipse cx="675" cy="150" rx="12" ry="20" fill="#cbd5de" stroke="#25374a" stroke-width="2"/><text x="625" y="220" font-size="16" font-family="Arial" fill="#17283a">Uterus holds young.</text><ellipse cx="790" cy="150" rx="28" ry="20" fill="#cbd5de" stroke="#25374a" stroke-width="2"/><text x="625" y="255" font-size="16" font-family="Arial" fill="#17283a">Milk glands nourish</text><text x="625" y="280" font-size="16" font-family="Arial" fill="#17283a">young after birth.</text></svg>