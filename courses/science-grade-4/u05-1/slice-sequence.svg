<svg width="720" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title"><title id="title">Invented outlines of a solid mound, lower middle upper slices</title><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#777"/></pattern></defs><rect width="720" height="340" fill="white"/><g fill="#111" stroke="#111" stroke-width="2" font-family="Arial,sans-serif" font-size="22"><text x="20" y="30" stroke="none">Outline fallback: invented for practice</text><ellipse cx="125" cy="160" rx="90" ry="45" fill="none"/><text x="40" y="245" stroke="none">Lower slice</text><ellipse cx="365" cy="160" rx="65" ry="32" fill="none"/><text x="280" y="245" stroke="none">Middle slice</text><ellipse cx="605" cy="160" rx="30" ry="15" fill="none"/><text x="520" y="245" stroke="none">Upper slice</text><text x="25" y="305" stroke="none">Separate slices, viewed from above.</text></g></svg>