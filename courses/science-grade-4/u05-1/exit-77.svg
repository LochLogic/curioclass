<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title"><title id="title">Curved chain by a continent and a separate island earthquake dot</title><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#777"/></pattern></defs><rect width="720" height="430" fill="white"/><g fill="#111" stroke="#111" stroke-width="2" font-family="Arial,sans-serif" font-size="22"><text x="25" y="32" stroke="none">Inset Q: invented for practice</text><text x="25" y="70" stroke="none">North ↑</text><path d="M390 95Q315 150 370 220T355 345L690 345V95Z" fill="url(#hatch)"/><text x="480" y="125" stroke="none">Land</text><text x="45" y="125" stroke="none">Ocean</text><path d="M310 95L300 345" fill="none" stroke-dasharray="7 5"/><text x="360" y="380" stroke="none">Coastline</text><text x="45" y="405" stroke="none">Dashed: continental edge</text><circle cx="315" cy="155" r="5"/><circle cx="325" cy="185" r="5"/><circle cx="340" cy="215" r="5"/><circle cx="350" cy="245" r="5"/><circle cx="345" cy="278" r="5"/><ellipse cx="130" cy="230" rx="35" ry="20" fill="white"/><circle cx="130" cy="230" r="5"/><text x="30" y="340" stroke="none">● earthquake</text></g></svg>