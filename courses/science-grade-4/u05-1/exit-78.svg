<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title"><title id="title">High rim low center cross-section, reversed dark plan views and a separate seafloor key</title><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#777"/></pattern></defs><rect width="720" height="410" fill="white"/><g fill="#111" stroke="#111" stroke-width="2" font-family="Arial,sans-serif" font-size="22"><text x="20" y="30" stroke="none">Hill R and two land maps</text><path d="M30 120L80 60L120 100L160 60L210 120" fill="none"/><text x="35" y="155" stroke="none">Cross-section R</text><rect x="265" y="65" width="130" height="85" fill="#444"/><rect x="290" y="85" width="80" height="45" fill="white"/><text x="315" y="190" stroke="none">A</text><rect x="485" y="65" width="130" height="85" fill="white"/><rect x="510" y="85" width="80" height="45" fill="#444"/><text x="535" y="190" stroke="none">B</text><text x="20" y="240" stroke="none">Land key: darker means higher.</text><rect x="30" y="280" width="620" height="50" fill="#ddd"/><rect x="205" y="280" width="60" height="50" fill="#444"/><text x="20" y="380" stroke="none">Seafloor key: darker means deeper.</text></g></svg>