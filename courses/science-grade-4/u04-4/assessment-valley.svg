<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="22"><text x="20" y="28">Invented for practice. Undisturbed valley sides and distant exposure</text></g><g fill="none" stroke="#333" stroke-width="4"><path d="M20 80 H220 M20 140 H220 M20 200 H220 M440 80 H630 M440 140 H630 M440 200 H630"/></g><g font-family="sans-serif" font-size="22"><text x="30" y="65">R: no useful fossils</text><text x="30" y="120">Q: marine shells</text><text x="30" y="180">P: rooted plants</text><text x="460" y="65">R</text><text x="460" y="120">Q: shells</text><text x="460" y="180">P: roots</text><text x="255" y="140">Valley gap</text><text x="20" y="245">A distant exposure repeats this distinctive order and fossil pattern.</text><text x="20" y="285">Side record: all three bands bend and shift; the notch cuts their ends.</text><text x="20" y="325">Other exposure: same colors, reversed order, no rooted plants.</text></g></svg>