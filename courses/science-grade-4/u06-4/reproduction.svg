<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"><title>Chicken egg formation and nonhuman mammal reproductive parts</title><rect width="100%" height="100%" fill="white"/><text x="20" y="28" font-size="18" font-family="Arial" fill="#17283a">Separate reproduction models. Original diagrams, not to scale.</text><rect x="20" y="50" width="410" height="260" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="35" y="80" font-size="18" font-family="Arial" fill="#17283a">Chicken: inside egg formation</text><ellipse cx="80" cy="140" rx="25" ry="28" fill="#d9c8a2" stroke="#25374a" stroke-width="2"/><text x="35" y="195" font-size="18" font-family="Arial" fill="#17283a">ovary</text><path d="M115,140 L270,140" fill="none" stroke="#25374a" stroke-width="3"/><ellipse cx="315" cy="140" rx="38" ry="48" fill="#f0e9d7" stroke="#25374a" stroke-width="2"/><text x="230" y="215" font-size="18" font-family="Arial" fill="#17283a">shell and contents</text><text x="35" y="275" font-size="18" font-family="Arial" fill="#17283a">Fertile does not guarantee development.</text><rect x="465" y="50" width="410" height="260" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="480" y="80" font-size="18" font-family="Arial" fill="#17283a">Nonhuman mammal: separate parts</text><ellipse cx="555" cy="160" rx="48" ry="60" fill="#e6c8cd" stroke="#25374a" stroke-width="2"/><ellipse cx="555" cy="160" rx="15" ry="23" fill="#cbd6df" stroke="#25374a" stroke-width="2"/><text x="485" y="250" font-size="18" font-family="Arial" fill="#17283a">uterus before birth</text><ellipse cx="765" cy="160" rx="38" ry="30" fill="#d4ddeb" stroke="#25374a" stroke-width="2"/><text x="685" y="250" font-size="18" font-family="Arial" fill="#17283a">milk glands after birth</text></svg>