<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"><title>Held plant uptake and fox interaction diagrams</title><rect width="100%" height="100%" fill="white"/><text x="20" y="28" font-size="18" font-family="Arial" fill="#17283a">Invented for practice. Held until day 112 exit.</text><rect x="20" y="50" width="410" height="265" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="35" y="80" font-size="18" font-family="Arial" fill="#17283a">Diagram A: rooted plant</text><path d="M200,115 L200,250" fill="none" stroke="#527c48" stroke-width="10"/><path d="M70,235 L365,235" fill="none" stroke="#8b765e" stroke-width="3"/><path d="M200,240 L150,285" fill="none" stroke="#527c48" stroke-width="3"/><path d="M200,240 L175,285" fill="none" stroke="#527c48" stroke-width="3"/><path d="M200,240 L225,285" fill="none" stroke="#527c48" stroke-width="3"/><path d="M200,240 L250,285" fill="none" stroke="#527c48" stroke-width="3"/><ellipse cx="155" cy="150" rx="35" ry="12" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><ellipse cx="245" cy="175" rx="35" ry="12" fill="#b4cd9a" stroke="#25374a" stroke-width="2"/><text x="35" y="205" font-size="16" font-family="Arial" fill="#17283a">root uptake / inside transport</text><rect x="465" y="50" width="410" height="265" rx="7" fill="#fff" stroke="#25374a" stroke-width="2"/><text x="480" y="80" font-size="18" font-family="Arial" fill="#17283a">Diagram B: fox interaction roles</text><text x="480" y="120" font-size="17" font-family="Arial" fill="#17283a">Food intake to digestive processing</text><text x="480" y="165" font-size="17" font-family="Arial" fill="#17283a">Lungs and heart support body</text><text x="480" y="210" font-size="17" font-family="Arial" fill="#17283a">Brain guides leg movements</text><text x="480" y="255" font-size="17" font-family="Arial" fill="#17283a">Womb holds developing young</text></svg>