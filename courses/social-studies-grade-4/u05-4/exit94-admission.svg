<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270" role="img" aria-label="Patterned slavery status and applicant territory schematic"><title>Patterned slavery status and applicant territory schematic</title><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="22" fill="#152b39" stroke-linecap="round"><text x="20" y="28" font-size="22">Explanatory schematic, not a historical map.</text><defs><pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8 L8,0" stroke="#666" stroke-width="1"/></pattern></defs><rect x="40" y="65" width="180" height="100" fill="white" stroke="#111"/><path d="M40,100 L75,65 M40,140 L115,65 M55,165 L155,65 M95,165 L195,65 M135,165 L220,80 M175,165 L220,120" stroke="#666" fill="none"/><rect x="51" y="88" width="85" height="30" fill="white"/><rect x="260" y="65" width="180" height="100" fill="#eee" stroke="#111"/><rect x="480" y="65" width="180" height="100" fill="white" stroke="#111" stroke-dasharray="8 6"/><text x="55" y="112" font-size="22">State</text><text x="280" y="112" font-size="22">State</text><text x="495" y="112" font-size="22">Applicant</text><text x="20" y="205" font-size="22">Stripes: slavery allowed. Gray: slavery prohibited.</text><text x="20" y="238" font-size="22">Dashed: western territory seeking admission.</text></g></svg>