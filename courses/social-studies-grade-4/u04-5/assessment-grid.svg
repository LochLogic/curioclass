<svg xmlns="http://www.w3.org/2000/svg" width="140mm" height="68mm" viewBox="0 0 140 68" role="img"><title>Equal-year grid, 1515 to 1525</title><rect width="100%" height="100%" fill="white"/><g fill="black" stroke="black" stroke-width="0.5" font-family="Arial" font-size="4.94"><text x="3" y="7" stroke="none">One centimeter represents one year.</text><line x1="25" y1="18" x2="25" y2="62" stroke="#999"/><text x="21" y="11" stroke="none">1515</text><line x1="35" y1="18" x2="35" y2="62" stroke="#999"/><text x="31" y="18" stroke="none">1516</text><line x1="45" y1="18" x2="45" y2="62" stroke="#999"/><text x="41" y="11" stroke="none">1517</text><line x1="55" y1="18" x2="55" y2="62" stroke="#999"/><text x="51" y="18" stroke="none">1518</text><line x1="65" y1="18" x2="65" y2="62" stroke="#999"/><text x="61" y="11" stroke="none">1519</text><line x1="75" y1="18" x2="75" y2="62" stroke="#999"/><text x="71" y="18" stroke="none">1520</text><line x1="85" y1="18" x2="85" y2="62" stroke="#999"/><text x="81" y="11" stroke="none">1521</text><line x1="95" y1="18" x2="95" y2="62" stroke="#999"/><text x="91" y="18" stroke="none">1522</text><line x1="105" y1="18" x2="105" y2="62" stroke="#999"/><text x="101" y="11" stroke="none">1523</text><line x1="115" y1="18" x2="115" y2="62" stroke="#999"/><text x="111" y="18" stroke="none">1524</text><line x1="125" y1="18" x2="125" y2="62" stroke="#999"/><text x="121" y="11" stroke="none">1525</text><text x="1" y="32" stroke="none">Cortés</text><line x1="25" y1="32" x2="125" y2="32"/><text x="1" y="52" stroke="none">Sea route</text><line x1="25" y1="52" x2="125" y2="52"/></g></svg>