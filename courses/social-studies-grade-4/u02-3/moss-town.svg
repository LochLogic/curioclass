<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-label="Made-up inland town locator"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="21" fill="#152c40" stroke-linecap="round"><text x="20" y="30">Invented locator. North is up; not to scale.</text><path d="M520 50 L515 100 L540 160 L525 215 L700 215 L700 50Z" fill="#a9dceb"/><path d="M520 50 L515 100" fill="none" stroke="#284a57" stroke-width="3"/><path d="M515 100 L540 160" fill="none" stroke="#284a57" stroke-width="3"/><path d="M540 160 L525 215" fill="none" stroke="#284a57" stroke-width="3"/><circle cx="230" cy="135" r="8"/><text x="250" y="143">Moss Town</text><text x="580" y="130">Sea</text><text x="20" y="260">Key: dot = town; dark edge = coast.</text></g></svg>