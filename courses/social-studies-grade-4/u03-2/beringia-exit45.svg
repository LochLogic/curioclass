<svg xmlns="http://www.w3.org/2000/svg" width="6.6667in" height="2.1875in" viewBox="0 0 640 210"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#111"><text x="20" y="25">About 20,000 years ago: schematic, not to scale</text><rect x="50" y="60" width="460" height="48" fill="#ddd" stroke="black"/><text x="65" y="90">Asia</text><text x="210" y="90">Beringia: exposed land</text><text x="475" y="90">North America</text><rect x="380" y="120" width="200" height="40" fill="#cdf" stroke="black"/><text x="395" y="147">Ice farther south</text><text x="30" y="195">Key: gray = exposed land; blue = ice</text></g></svg>