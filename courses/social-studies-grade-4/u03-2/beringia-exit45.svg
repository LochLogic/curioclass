<svg xmlns="http://www.w3.org/2000/svg" width="6.6667in" height="1.7708in" viewBox="0 0 640 170"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#111"><text x="20" y="25">About 20,000 years ago: schematic, not to scale</text><rect x="50" y="40" width="560" height="40" fill="#ddd" stroke="black"/><text x="65" y="67">Asia</text><text x="210" y="67">Beringia: exposed land</text><text x="475" y="67">North America</text><rect x="380" y="92" width="200" height="32" fill="#cdf" stroke="black"/><text x="395" y="115">Ice farther south</text><text x="30" y="155">Key: gray = exposed land; blue = ice</text></g></svg>