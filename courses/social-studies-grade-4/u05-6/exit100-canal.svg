<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" role="img" aria-label="Made-up shipping canal crossing farm strip"><title>Made-up shipping canal crossing farm strip</title><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="22" fill="#152b39" stroke-linecap="round"><text x="20" y="28" font-size="22">Made up. Route-maker record, not to scale.</text><text x="25" y="90" font-size="22">Farm strip</text><rect x="25" y="105" width="250" height="90" fill="#eee" stroke="#444"/><path d="M20,150 L600,150" fill="none" stroke="#156683" stroke-width="3" stroke-dasharray=""/><text x="285" y="130" font-size="22">Canal</text><text x="515" y="185" font-size="22">Dock</text><text x="20" y="235" font-size="22">Route-maker: the canal gives shippers a cheaper route.</text></g></svg>