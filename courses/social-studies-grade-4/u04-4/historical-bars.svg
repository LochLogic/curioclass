<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="65mm" viewBox="0 0 180 65" role="img"><title>Historical practice bars, already drawn</title><rect width="100%" height="100%" fill="white"/><g fill="black" stroke="black" stroke-width="0.5" font-family="Arial" font-size="4.94"><text x="2" y="7" stroke="none">Supplied bars; one centimeter per year.</text><line x1="40" y1="18" x2="40" y2="58" stroke="#aaa"/><text x="36" y="11" stroke="none">1538</text><line x1="50" y1="18" x2="50" y2="58" stroke="#aaa"/><text x="46" y="18" stroke="none">1539</text><line x1="60" y1="18" x2="60" y2="58" stroke="#aaa"/><text x="56" y="11" stroke="none">1540</text><line x1="70" y1="18" x2="70" y2="58" stroke="#aaa"/><text x="66" y="18" stroke="none">1541</text><line x1="80" y1="18" x2="80" y2="58" stroke="#aaa"/><text x="76" y="11" stroke="none">1542</text><line x1="90" y1="18" x2="90" y2="58" stroke="#aaa"/><text x="86" y="18" stroke="none">1543</text><line x1="100" y1="18" x2="100" y2="58" stroke="#aaa"/><text x="96" y="11" stroke="none">1544</text><line x1="110" y1="18" x2="110" y2="58" stroke="#aaa"/><text x="106" y="18" stroke="none">1545</text><text x="2" y="33" stroke="none">Coronado</text><text x="2" y="53" stroke="none">Cartier</text><line x1="60" y1="30" x2="80" y2="30" stroke-width="2"/><line x1="70" y1="50" x2="80" y2="50" stroke-width="2"/><text x="118" y="33" stroke="none">Southwest</text><text x="118" y="53" stroke="none">St. Lawrence</text></g></svg>