<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-label="Made-up two-town bus route"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="21" fill="#152c40" stroke-linecap="round"><text x="20" y="35">Invented classroom route. Not to scale.</text><path d="M310 60 L310 230" fill="none" stroke="#555" stroke-width="2"/><path d="M110 160 L570 160" fill="none" stroke="#1d6a92" stroke-width="5"/><text x="65" y="100">Alder Town</text><text x="480" y="100">Birch Town</text><text x="280" y="260">Boundary</text><circle cx="110" cy="160" r="9"/><circle cx="570" cy="160" r="9"/><text x="30" y="220">Key: dot = stop; line = bus route</text></g></svg>