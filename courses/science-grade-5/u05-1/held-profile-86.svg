<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"><title>Reserved north-south profile</title><rect width="720" height="420" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="20" y="30" font-family="sans-serif" font-size="19" fill="black" stroke="none">Invented for practice: held until day 86 exit</text><path d="M45 270 L350 80 L665 270"/><text x="30" y="320" font-family="sans-serif" font-size="19" fill="black" stroke="none">North: usually rainy</text><text x="450" y="320" font-family="sans-serif" font-size="19" fill="black" stroke="none">South: usually dry</text><text x="30" y="365" font-family="sans-serif" font-size="19" fill="black" stroke="none">Incoming moist air: north. Annotation space is above the slopes.</text></g></svg>