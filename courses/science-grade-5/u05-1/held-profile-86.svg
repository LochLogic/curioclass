<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"><title>Reserved north-south profile</title><rect width="720" height="280" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="20" y="26" font-family="sans-serif" font-size="19" fill="black" stroke="none">Invented for practice: held until day 86 exit</text><path d="M45 165 L350 65 L665 165"/><text x="25" y="205" font-family="sans-serif" font-size="19" fill="black" stroke="none">North: usually rainy</text><text x="445" y="205" font-family="sans-serif" font-size="19" fill="black" stroke="none">South: usually dry</text><text x="25" y="250" font-family="sans-serif" font-size="19" fill="black" stroke="none">Moist air enters from north. Add annotations above the profile.</text></g></svg>