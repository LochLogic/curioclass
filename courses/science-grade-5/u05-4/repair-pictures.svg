<svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710"><title>Separate component repair pictures</title><rect width="720" height="710" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="20" y="25" font-family="sans-serif" font-size="19" fill="black" stroke="none">Invented for practice: separate repair components</text><rect x="15" y="55" width="690" height="65"/><text x="25" y="82" font-family="sans-serif" font-size="18" fill="black" stroke="none">A: Parts -&gt; observed action</text><rect x="15" y="135" width="690" height="65"/><text x="25" y="162" font-family="sans-serif" font-size="18" fill="black" stroke="none">B: Crack in place / grain travels</text><rect x="15" y="215" width="690" height="65"/><text x="25" y="242" font-family="sans-serif" font-size="18" fill="black" stroke="none">C: Air enters -&gt; bag bulges</text><rect x="15" y="295" width="690" height="65"/><text x="25" y="322" font-family="sans-serif" font-size="18" fill="black" stroke="none">D: Ocean / salty groundwater</text><rect x="15" y="375" width="690" height="65"/><text x="25" y="402" font-family="sans-serif" font-size="18" fill="black" stroke="none">E: 70 parent portions / 7 fresh portions</text><rect x="15" y="455" width="690" height="65"/><text x="25" y="482" font-family="sans-serif" font-size="18" fill="black" stroke="none">F: Surface and other: soil moisture included</text><rect x="15" y="535" width="690" height="65"/><text x="25" y="562" font-family="sans-serif" font-size="18" fill="black" stroke="none">G: Low salt / testing evidence</text><rect x="15" y="615" width="690" height="65"/><text x="25" y="642" font-family="sans-serif" font-size="18" fill="black" stroke="none">H: 0, 2, 4 / 0, 5, 10</text></g></svg>