<svg xmlns="http://www.w3.org/2000/svg" width="720" height="605" viewBox="0 0 720 605"><title>Schematic locator of polar land ice</title><rect width="720" height="605" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="20" y="30" font-family="sans-serif" font-size="19" fill="black" stroke="none">Schematic locator, not to scale</text><path d="M250 120 Q300 50 350 90 L380 145 L330 210 L280 190 Z M100 420 Q360 350 620 420 L600 475 H120 Z M490 225 L540 145 L590 225"/><text x="215" y="250" font-family="sans-serif" font-size="19" fill="black" stroke="none">Greenland: land ice</text><text x="225" y="520" font-family="sans-serif" font-size="19" fill="black" stroke="none">Antarctica: land ice</text><text x="440" y="275" font-family="sans-serif" font-size="19" fill="black" stroke="none">Mountain glacier</text><text x="30" y="570" font-family="sans-serif" font-size="19" fill="black" stroke="none">The locator identifies places; add your own category explanation.</text></g></svg>