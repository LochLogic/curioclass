<svg xmlns="http://www.w3.org/2000/svg" width="720" height="495" viewBox="0 0 720 495"><title>Reserved P Q R map</title><rect width="720" height="495" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="20" y="30" font-family="sans-serif" font-size="19" fill="black" stroke="none">Invented for practice: held until day 90 exit</text><path d="M80 130 Q260 190 350 210 T560 320"/><ellipse cx="560" cy="320" rx="90" ry="45"/><text x="30" y="105" font-family="sans-serif" font-size="19" fill="black" stroke="none">P: ridge, 90</text><text x="280" y="170" font-family="sans-serif" font-size="19" fill="black" stroke="none">Q: channel, 60</text><text x="480" y="405" font-family="sans-serif" font-size="19" fill="black" stroke="none">R: lake, 30</text><text x="30" y="460" font-family="sans-serif" font-size="19" fill="black" stroke="none">Height units are shared; the curved line is the connected channel.</text></g></svg>