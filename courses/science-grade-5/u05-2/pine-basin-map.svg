<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"><title>Invented Pine Basin map components</title><rect width="720" height="450" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="20" y="30" font-family="sans-serif" font-size="19" fill="black" stroke="none">Pine Basin: invented for practice; not to scale</text><path d="M30 200 L180 60 L310 200 M390 120 Q450 160 400 210 Q350 250 440 280"/><ellipse cx="560" cy="210" rx="90" ry="50"/><text x="60" y="245" font-family="sans-serif" font-size="19" fill="black" stroke="none">Ridge symbol</text><text x="345" y="325" font-family="sans-serif" font-size="19" fill="black" stroke="none">Channel symbol</text><text x="505" y="280" font-family="sans-serif" font-size="19" fill="black" stroke="none">Storage pond</text><text x="20" y="380" font-family="sans-serif" font-size="19" fill="black" stroke="none">Key: pointed outline = ridge; curved line = channel.</text><text x="20" y="415" font-family="sans-serif" font-size="19" fill="black" stroke="none">Oval = stored water. Separate features, not a complete route.</text></g></svg>