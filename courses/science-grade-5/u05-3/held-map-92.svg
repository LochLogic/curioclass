<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"><title>Reserved water stores map and cutaway</title><rect width="720" height="350" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="15" y="25" font-family="sans-serif" font-size="19" fill="black" stroke="none">Invented map and underground cutaway; held until day 92 exit</text><rect x="10" y="48" width="225" height="60"/><path d="M50 98 L120 56 L190 98 M90 74 H150"/><text x="10" y="129" font-family="sans-serif" font-size="19" fill="black" stroke="none">A: polar land ice</text><rect x="245" y="48" width="225" height="60"/><path d="M285 98 L355 56 L425 98 M325 74 H385"/><text x="245" y="129" font-family="sans-serif" font-size="19" fill="black" stroke="none">B: mountain ice</text><rect x="480" y="48" width="225" height="60"/><path d="M500 78 Q550 53 590 78 T680 78"/><text x="480" y="129" font-family="sans-serif" font-size="19" fill="black" stroke="none">C: open sea</text><rect x="10" y="142" width="225" height="60"/><ellipse cx="120" cy="172" rx="85" ry="20"/><text x="10" y="223" font-family="sans-serif" font-size="19" fill="black" stroke="none">D: fresh inland hollow</text><rect x="245" y="142" width="225" height="60"/><path d="M265 172 Q315 147 355 172 T445 172"/><text x="245" y="223" font-family="sans-serif" font-size="19" fill="black" stroke="none">E: flowing channel</text><rect x="480" y="142" width="225" height="60"/><ellipse cx="590" cy="172" rx="85" ry="20"/><text x="480" y="223" font-family="sans-serif" font-size="19" fill="black" stroke="none">G: salty inland hollow</text><rect x="10" y="236" width="225" height="60"/><rect x="50" y="244" width="22" height="22"/><rect x="72" y="244" width="22" height="22"/><rect x="94" y="244" width="22" height="22"/><rect x="116" y="244" width="22" height="22"/><rect x="138" y="244" width="22" height="22"/><rect x="50" y="266" width="22" height="22"/><rect x="72" y="266" width="22" height="22"/><rect x="94" y="266" width="22" height="22"/><rect x="116" y="266" width="22" height="22"/><rect x="138" y="266" width="22" height="22"/><path d="M50 256 H160 M50 276 H160"/><text x="10" y="317" font-family="sans-serif" font-size="19" fill="black" stroke="none">F: wet gaps below land</text><rect x="245" y="236" width="225" height="60"/><path d="M280 286 L355 246 L425 286"/><text x="245" y="317" font-family="sans-serif" font-size="19" fill="black" stroke="none">H: dry ridge</text><rect x="480" y="236" width="225" height="60"/><rect x="520" y="244" width="22" height="22"/><rect x="542" y="244" width="22" height="22"/><rect x="564" y="244" width="22" height="22"/><rect x="586" y="244" width="22" height="22"/><rect x="608" y="244" width="22" height="22"/><rect x="520" y="266" width="22" height="22"/><rect x="542" y="266" width="22" height="22"/><rect x="564" y="266" width="22" height="22"/><rect x="586" y="266" width="22" height="22"/><rect x="608" y="266" width="22" height="22"/><text x="480" y="314" font-family="sans-serif" font-size="19" fill="black" stroke="none">J: empty gaps</text><text x="480" y="334" font-family="sans-serif" font-size="19" fill="black" stroke="none">below land</text></g></svg>