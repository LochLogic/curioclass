<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Music: work time, quiet time, clean-up and game show · Curio Class</title>
<meta name="description" content="Free classroom music for the projector: work time, quiet time, clean-up and game show sets, with a stop timer and an end chime. Made in your browser as it plays. No sign-up, no ads.">
<link rel="canonical" href="https://curioclass.org/closet/teacher-desk/music/">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
{% raw %}
:root {
  --bg: #fbf8f1; --panel: #ffffff; --ink: #1f2430; --muted: #5e6472; --line: #e4dccb;
  --accent: #e4572e; --teal: #1d5c63; --focus: #2f5bd3;
  --work: #1d5c63; --quiet: #5b6fb3; --clean: #d9822b; --show: #b2457a;
  --sans: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
}
:root[data-lights="off"] {
  --bg: #12171d; --panel: #1b222b; --ink: #f3eee2; --muted: #a9b0bc; --line: #2c3540;
  --accent: #ff7a52; --teal: #5fb3bb; --focus: #8fb0ff;
  --work: #5fb3bb; --quiet: #9fb0f0; --clean: #f2a65a; --show: #e486b4;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 10px 16px; min-height: 48px; font-weight: 600; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .02em; }
header a.back { color: var(--muted); font-size: .95rem; text-decoration: none; }
header a.back:hover { text-decoration: underline; }
header .sp { flex: 1; }
header button { min-height: 40px; padding: 6px 12px; font-size: .95rem; }

main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(16px, 2.5vw, 34px); padding: clamp(14px, 2.5vw, 34px); align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }

.now { --c: var(--work); background: var(--panel); border: 1px solid var(--line); border-top: 8px solid var(--c); border-radius: 22px; padding: clamp(18px, 3vw, 34px); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 14px; }
.now .set { margin: 0; font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.now h2 { margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.05; }
.now .blurb { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.45; }
.viz { height: clamp(90px, 16vh, 170px); width: 100%; display: block; }
.left { margin: 0; min-height: 1.2em; font-size: clamp(1.6rem, 5vw, 3.4rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c); }
.left.done { color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
#play { min-width: 150px; min-height: 64px; font-size: 1.3rem; background: var(--c); border-color: var(--c); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 14px #0002; }
:root[data-lights="off"] #play { color: #0d1216; }
#play svg { width: 22px; height: 22px; }
.controls label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; }
.controls input[type=range] { width: 130px; accent-color: var(--c); }
.controls input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--c); }

.sets { display: grid; gap: 16px; }
.group { --c: var(--work); background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 18px; padding: 14px 16px 16px; }
.group h3 { margin: 0 0 2px; font-size: 1.15rem; color: var(--c); }
.group p { margin: 0 0 10px; color: var(--muted); font-size: .95rem; }
.group .pieces { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.piece { text-align: left; display: flex; align-items: center; gap: 10px; border-radius: 14px; }
.piece .k { font-size: .75rem; opacity: .6; border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: auto; }
.piece[aria-current="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--panel)); }
.piece .eq { display: none; gap: 2px; align-items: flex-end; height: 16px; }
.piece[aria-current="true"].playing .eq { display: inline-flex; }
.piece .eq i { width: 3px; background: var(--c); border-radius: 2px; animation: eq .9s ease-in-out infinite; }
.piece .eq i:nth-child(2) { animation-delay: -.3s; } .piece .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%, 100% { height: 4px; } 50% { height: 16px; } }
@media (prefers-reduced-motion: reduce) { .piece .eq i { animation: none; height: 10px; } }
.work { --c: var(--work); } .quiet { --c: var(--quiet); } .clean { --c: var(--clean); } .show { --c: var(--show); }
footer { padding: 8px 18px 16px; color: var(--muted); font-size: .88rem; text-align: center; }
{% endraw %}
</style>

<header>
  <h1>Classroom Music</h1>
  <a class="back" href="/closet/teacher-desk/">Teacher Desk</a>
  <a class="back" href="/closet/teacher-desk/dock/">Desk Dock</a>
  <span class="sp"></span>

</header>
<main>
  <section class="now work" id="now" aria-live="polite">
    <p class="set" id="nowSet">Work time</p>
    <h2 id="nowName">Desk Lamp</h2>
    <p class="blurb" id="nowBlurb"></p>
    <canvas class="viz" id="viz" aria-hidden="true"></canvas>
    <p class="left" id="left"></p>
    <div class="controls">
      <button id="play" title="Play or stop (Space)"></button>
      <label>Volume <input type="range" id="vol" min="0" max="100" value="70" title="Volume (up and down arrows)"></label>
      <label>Stop after
        <select id="stopAfter">
          <option value="0">Keep playing</option><option value="30">30 seconds</option><option value="60">1 minute</option>
          <option value="120">2 minutes</option><option value="180">3 minutes</option><option value="300">5 minutes</option>
          <option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1200">20 minutes</option>
        </select>
      </label>
      <label><input type="checkbox" id="chime" checked> Chime at the end</label>
    </div>
  </section>
  <div class="sets" id="sets"></div>
</main>
<footer>Every note is made in your browser as it plays, so each run comes out a little different. Original music for Curio Class, free to use in any classroom. Nothing to download, no ads, nothing recorded.</footer>

<script>
{% raw %}
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const calm = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- music helpers ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const C = (bass, ...v) => ({ bass, v, pcs: v.map(m => m % 12) });
function scale(root, steps, lo, hi) { const out = []; for (let m = lo; m <= hi; m++) if (steps.includes(((m - root) % 12 + 12) % 12)) out.push(m); return out; }
function near(r, pool, prev, k) {
  let c = pool.slice().sort((a, b) => Math.abs(a - prev) - Math.abs(b - prev));
  if (k > 1 && c.length > 1) c = c.filter(m => m !== prev);
  c = c.slice(0, k); return c[Math.floor(r() * c.length)];
}
// A short melody: chord tones on the beat, steps in between, ending home on the last chord's root.
function phrase(r, { pool, chords, bars = 4, rhythms, start }) {
  let prev = start; const out = [];
  for (let b = 0; b < bars; b++) {
    const rh = rhythms[Math.floor(r() * rhythms.length)], pcs = chords[b % chords.length].pcs, bar = [];
    rh.forEach((st, i) => {
      const len = (i + 1 < rh.length ? rh[i + 1] : 16) - st;
      let cand = st % 4 === 0 ? pool.filter(m => pcs.includes(m % 12)) : pool; if (!cand.length) cand = pool;
      const m = near(r, cand, prev, st % 4 === 0 ? 2 : 3); prev = m; bar.push([st, m, Math.min(len, 6)]);
    });
    out.push(bar);
  }
  const last = out[bars - 1], home = pool.filter(m => m % 12 === chords[(bars - 1) % chords.length].bass % 12);
  if (last.length && home.length) last[last.length - 1][1] = near(r, home, prev, 1);
  return out;
}
const play = (E, fn, B, bar, at, S, v, oct = 0) => (bar || []).forEach(([st, m, len]) => E[fn](B, at(st), m + oct, v * (st % 4 ? .85 : 1), len * S * .92));
const chord = (E, fn, B, t, c, v, d) => c.v.forEach(m => E[fn](B, t, m, v, d));
function sect(n, intro) { if (n < intro) return { sec: -1, L: 0, k: n % 4 }; const m = n - intro; return { sec: Math.floor(m / 4) % 4, L: Math.floor(m / 16), k: m % 4 }; }
function withB(s, L) { if (s.loop !== L) { s.B = s.mk(s.seed + L * 7919 + 1); s.loop = L; } return s.B; }
const hum = () => .88 + Math.random() * .24;

/* ---------- the sound engine: every instrument is built from oscillators and noise ---------- */

  comp.connect(dest);

  const NB = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); { const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  const osc = (type, f, t, end) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.start(t); o.stop(end); return o; };
  const filt = (f, q = .7, type = 'lowpass') => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };

    g.gain.linearRampToValueAtTime(pk, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec);
    s.connect(fl).connect(g); to(g, B, wet); s.start(t, Math.random() * 1.5); s.stop(t + a + dec + .05);
  }
  const E = {
    out: comp,
    bus(level) {
      const out = lvl(level), dry = lvl(1), wet = lvl(1); dry.connect(out); out.connect(comp); wet.connect(verb);

    keys(B, t, m, v, d, wet = .25) { // soft electric piano

    },
    piano(B, t, m, v, d) { E.keys(B, t, m, v, d, .6); },
    pad(B, t, m, v, d) {

    bass(B, t, m, v, d) {

      g2.gain.linearRampToValueAtTime(pk * .35, t + .002); g2.gain.exponentialRampToValueAtTime(.0001, t + .09);
      osc('sine', f, t, t + .75).connect(g); osc('sine', f * 4, t, t + .12).connect(g2); to(g, B, .2); to(g2, B, .2);
    },
    mbox(B, t, m, v) { // music box
      const f = mtof(m), g = g0(t), g2 = g0(t), pk = v * .17;
      g.gain.linearRampToValueAtTime(pk, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);
      g2.gain.linearRampToValueAtTime(pk * .3, t + .002); g2.gain.exponentialRampToValueAtTime(.0001, t + .4);
      osc('sine', f, t, t + 1.85).connect(g); osc('sine', f * 3.01, t, t + .45).connect(g2); to(g, B, .5); to(g2, B, .5);
    },
    vibe(B, t, m, v) {
      const f = mtof(m), g = g0(t), pk = v * .2, trem = lvl(.75), lfo = osc('sine', 5.2, t, t + 1.5);
      g.gain.linearRampToValueAtTime(pk, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
      lfo.connect(lvl(.25)).connect(trem.gain); osc('sine', f, t, t + 1.45).connect(trem).connect(g);

    },
    flute(B, t, m, v, d) {
      const f = mtof(m), end = t + d + .3, g = g0(t), pk = v * .15, o = osc('sine', f, t, end), lfo = osc('sine', 5.4, t, end);

    },
    brass(B, t, m, v, d) {
      const f = mtof(m), end = t + d + .4, g = g0(t), pk = v * .09, fl = filt(500, 1.2);
      fl.frequency.setValueAtTime(500, t); fl.frequency.linearRampToValueAtTime(2600, t + .05); fl.frequency.setTargetAtTime(1300, t + .05, .15);

/* ---------- the pieces ---------- */
// Each piece writes one bar (16 sixteenth steps) at a time. at(step) gives the time of a step, with swing.
const PIECES = [
  { id: 'desk-lamp', set: 'work', name: 'Desk Lamp', bpm: 78, swing: .28, level: 1,
    blurb: 'Soft keys over a slow, steady beat. Good for heads-down work.',
    init(r) { const chords = [C(41, 57, 60, 64, 65), C(38, 57, 60, 62, 65), C(43, 58, 62, 65, 67), C(36, 58, 60, 64, 67)];
      const pool = scale(5, [0, 2, 4, 7, 9], 65, 81), rhythms = [[0, 6, 10], [2, 8], [0, 3, 6, 12], [4, 10, 14], [0, 8]];
      const mk = seed => phrase(rng(seed), { pool, chords, rhythms, start: 72 }), seed = Math.floor(r() * 1e9);
      return { chords, mk, seed, A: mk(seed), loop: -1 }; },
    bar(E, B, n, at, S, s) { const { sec, L, k } = sect(n, 4), c = s.chords[n % 4];
      chord(E, 'keys', B, at(0), c, .42, 7 * S); chord(E, 'keys', B, at(10), c, .26, 3.5 * S);
      E.bass(B, at(0), c.bass, .8, 5 * S); E.bass(B, at(10), c.bass, .6, 2.5 * S); E.bass(B, at(14), c.bass + 7, .5, 1.5 * S);
      if (n >= 2) { E.kick(B, at(0), .8); E.kick(B, at(9), .55); if (n % 2) E.kick(B, at(11), .4);
        E.snare(B, at(4), .42); E.snare(B, at(12), .48); for (let i = 0; i < 16; i += 2) E.hat(B, at(i), .3 + Math.random() * .25); }
