{# Shared styles for the course pages (scripts/course_pages.py). Uses the site's colours and type from curio.css. #}
<style>
.cp-status { border-left: 4px solid var(--accent); background: var(--card); box-shadow: var(--shadow); border-radius: var(--radius); padding: 14px 18px; margin: 18px 0 6px; max-width: 72ch; }
.cp-status b { display: block; font: 600 15px var(--sans); margin-bottom: 4px; }
.cp-status p { margin: 0; color: var(--muted); font-size: 15px; }
.cp-promise { font: 600 14px var(--sans); color: var(--teal); margin: 10px 0 0; }
.cp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 8px; }
.cp-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.cp-card h3 { font-size: 18px; margin: 0 0 6px; }
.cp-card p, .cp-card li { font-size: 15px; margin: 0 0 4px; }
.cp-card ul { padding-left: 18px; margin: 0; }
.cp-year { list-style: none; padding: 0; margin: 0; }
.cp-year > li { border-top: 1px solid var(--line); padding: 14px 0; display: grid; grid-template-columns: 7.5rem 1fr; gap: 4px 16px; }
.cp-year .when { font: 600 13px/1.4 var(--sans); color: var(--muted); }
.cp-year .when b { display: block; font-size: 15px; color: var(--ink); }
.cp-year h3 { font-size: 19px; margin: 0; }
.cp-year h3 a { text-decoration: none; }
.cp-year h3 a:hover { text-decoration: underline; }
.cp-year .q { margin: 2px 0 6px; font-style: italic; }
.cp-year .check { background: var(--paper-2); border-radius: 10px; padding: 12px 14px; border-top: 0; margin: 6px 0; }
.cp-year .check p { font-size: 15px; margin: 4px 0 0; }
.cp-pill { display: inline-block; font: 600 12px/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--paper-2); color: var(--muted); border: 1px solid var(--line); }
.cp-note { margin: 10px 0 0; font-size: 14px; color: var(--muted); max-width: 68ch; }
.cp-std { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 4px 0 0; }
.cp-std li code, .cp-std li a { font: 600 13px Consolas, monospace; background: var(--paper-2); padding: 3px 8px; border-radius: 6px; white-space: nowrap; display: inline-block; }
.cp-prose { max-width: 72ch; }
.cp-prose p { margin: 0 0 10px; }
.cp-facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
.cp-facts li { font: 600 13px var(--sans); background: var(--paper-2); border-radius: 999px; padding: 6px 11px; }
.cp-pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 28px 0 40px; border-top: 1px solid var(--line); margin-top: 28px; }
.cp-pager a { font: 600 15px var(--sans); }
.cp-grade { padding: 18px 0 4px; border-top: 1px solid var(--line); }
.cp-grade h2 { font-size: 22px; margin: 0 0 10px; }
.cp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cp-grid > div { min-width: 0; }
.cp-grid .subj { display: none; }
.cp-course { display: block; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line)); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.cp-course b { display: block; font: 600 16px/1.3 var(--serif); }
.cp-course span { font-size: 13px; color: var(--muted); }
.cp-course:hover b { text-decoration: underline; }
.cp-head-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font: 600 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 0; }
@media (max-width: 760px) {
  .cp-year > li { grid-template-columns: 1fr; }
  .cp-grid { grid-template-columns: 1fr; }
  .cp-grid .subj { display: block; font: 600 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 4px 0; }
  .cp-head-row { display: none; }
}
@media print {
  .site-head, .site-foot, .cp-pager, .skip { display: none; }
  .cp-year > li { break-inside: avoid; }
}
</style>
