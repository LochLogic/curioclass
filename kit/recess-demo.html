<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recess shell demo</title>
<!-- A test bench for kit/recess.js, not a game: a 3x3 slide puzzle that uses every shell call. Open the file directly. -->
<link rel="stylesheet" href="recess.css">
<style>
body{background:radial-gradient(circle at 30% 20%,#3a2a6b,#120d26 70%);color:#fff;display:grid;place-items:center}
#board{display:grid;grid-template-columns:repeat(3,92px);gap:8px;padding:14px;border-radius:22px;background:#251a48;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.t{width:92px;height:92px;border:0;border-radius:16px;background:linear-gradient(#ffcf5c,#f59f1a);color:#3b2200;font:800 36px var(--rc-font);cursor:pointer;box-shadow:0 5px 0 #b86b00;transition:transform .12s}
.t:active{transform:translateY(3px)}
.gap{visibility:hidden}
p{text-align:center;opacity:.8}
</style></head>
<body>
<main><div id="board" role="grid" aria-label="Slide puzzle"></div><p id="moves">Moves: 0</p></main>
<script src="recess.js"></script>
<script>
let tiles, hist, moves;
const B = document.getElementById('board');
function shuffle() {
  const r = Recess.daily(); tiles = [1,2,3,4,5,6,7,8,0];
  for (let i = 0; i < 60; i++) { const z = tiles.indexOf(0), n = nb(z); slide(n[Math.floor(r() * n.length)], true); }
  hist = []; moves = 0; Recess.canUndo(false); draw();
}
const nb = z => [z-3, z+3, z%3 ? z-1 : -1, z%3 < 2 ? z+1 : -1].filter(i => i >= 0 && i < 9);
function slide(i, quiet) {
  const z = tiles.indexOf(0); if (!nb(z).includes(i)) { if (!quiet) Recess.play('nope'); return; }
  [tiles[z], tiles[i]] = [tiles[i], tiles[z]];
  if (quiet) return;
  hist.push(z); moves++; Recess.canUndo(true); Recess.play('slide'); draw();
  if (tiles.join() === '1,2,3,4,5,6,7,8,0') Recess.win({score: moves, stars: moves <= 22 ? 3 : moves <= 34 ? 2 : 1});
}
function draw() {
  B.replaceChildren(...tiles.map((v, i) => { const b = document.createElement('button'); b.className = v ? 't' : 't gap'; b.textContent = v || ''; b.onclick = () => slide(i); if (!v) b.tabIndex = -1; return b; }));
  document.getElementById('moves').textContent = `Moves: ${moves}`;
}
Recess.start({id: 'shell-demo', title: 'Shell demo', score: {label: 'Moves', lower: true},
  onRestart: shuffle,
  onUndo: () => { const z = hist.pop(); const cur = tiles.indexOf(0); [tiles[z], tiles[cur]] = [tiles[cur], tiles[z]]; moves--; Recess.canUndo(hist.length > 0); Recess.play('slide'); draw(); },
  onNext: shuffle});
Recess.level('daily', "Today's puzzle");
shuffle();
</script>
</body></html>
