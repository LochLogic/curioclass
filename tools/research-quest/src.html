    instruction.textContent = $('dialog-actions').querySelector('#reset-yes') ?
      'Tap Yes to clear those choices, or No to keep them.' : $('dialog-content').querySelector('[data-rewind]') ?
      'Tap a stop, or tap Back to desk.' : $('dialog-content').querySelector('[data-pack]') ?
      'Tap a pack item, or tap Back to desk.' : 'Use the controls below, or return to the desk.';
    $('dialog-content').append(instruction);
    V.hush();
    $('dialog').showModal();
    const first = $('dialog-content').querySelector('button:not(:disabled)') ||
      $('dialog-actions').querySelector('button:not(:disabled)');
    if (first) first.focus({preventScroll:true});
  }
  function closeDialog() {
    $('dialog').close();
    if (returnFocus && returnFocus.isConnected && !returnFocus.disabled) returnFocus.focus({preventScroll:true});
  }
  function confirmReset(stop) {
    const title = stop === 0 ? 'Clear this research desk?' : 'Rewind to ' + ['','Question','Sources','Notes','Outline'][stop] + '?';
    openDialog(title,`<p>${stop === 0 ? 'Your saved research choices will be cleared.' : 'Later research choices will be cleared. The reopened file keeps its choices.'}</p>`,
      btn('reset-no','No, keep my research',true,'') + `<button class="btn primary" id="reset-yes" data-reset="${stop}">Yes</button>`);
  }
  function rewindMenu() {
    openDialog('Revisit a file',`<p>Open any research file without clearing your work.</p>
      ${['Question','Sources','Notes','Outline'].map((name,i) =>
        `<button class="btn" data-desk="${i+1}">${name}</button>`).join('')}`);
  }
  function rewindTo(stop) {
    V.hush();
    if (stop === 0) {
      state = fresh();
      try {localStorage.removeItem('rq-run');} catch {}
      closeDialog();
      render('question-0');
      return;
    }
    state.stop = stop;
    if (stop < 2) state.places = [];
    if (stop < 3) state.notes = {};
    if (stop < 4) {
      state.headings = {};
      state.steps = [];
    }
    state.active = state.places[0] || null;
    state.way = null;
    state.selected = null;
    closeDialog();
    render();
    const next = $('chapter').querySelector('button:not(:disabled)');
    if (next) next.focus({preventScroll:true});
  }
  function openPack(key) {
    if (key === 'question') openDialog('Your question',`<p>${QUESTIONS[state.question]}</p><p class="reply">${REPLIES[state.question]}</p>`);
    else if (key === 'outline') openDialog('Your outline',slidesHtml());
    else if (state.stop === 3) {
      if ($('dialog').open) closeDialog();
      V.hush();
      state.active = key;
      state.way = null;
      render('pack-chip');
    } else if (state.notes[key]) openDialog(source(key).place,noteHtml(state.notes[key],true));
    else openDialog(source(key).place,`<img src="${art[key]}" alt="${source(key).place}" style="width:100%;max-height:260px;object-fit:cover">
      <p>${source(key).kind} · a planned visit</p>`);
  }
  function manual() {
    openDialog('Manual · Research Quest',`
      <h3>Using the desk</h3><p>Compare a passage with a saved note. Open Question, Sources, Notes, Outline or Evidence in any order.
      Tap a note then a heading, or drag it. Selecting a card exposes its full wording. Evidence routes update from your choices.</p>
      <h3>Reading the evidence map</h3><p>A solid route has supporting evidence. A dashed route exposes a gap, with the file that caused it.
      These are limited document rules, not a general fact checker. There is no score or final decision. Quoted notes with a source remain valid.</p>
      <h3>Things people have found</h3><p>A remembered source can still accompany changed meaning. A useful note in Not needed cannot support the outline.
      A quotation can be evidence; rewriting it asks a different kind of attention.</p>
      <h3>The real material and its limits</h3><p>The six source documents, people, school, notebook count of two monarchs,
      seed advertisement and local region are fictional examples by Curio Class, CC BY 4.0. Candidate notes can distort their sources.
      The biological facts below are real; the desk shows how changing wording or placement changes the evidence trail.
      This fictional region is not a planting guide for your location.</p>
      <p>Milkweed as caterpillar food, adult nectar feeding and eastern migration up to 3,000 miles:
      U.S. Fish and Wildlife Service, Monarch (Danaus plexippus), https://www.fws.gov/species/monarch-danaus-plexippus .
      Federal-authored factual text: public domain under 17 USC 105; no third-party images or text copied.
      FWS copyright notice: https://www.fws.gov/disclaimer .</p>
      <p>Native milkweed, fall nectar and avoiding pesticides: Xerces Society, Monarch Butterfly Conservation,
      https://xerces.org/monarchs . Facts paraphrased in original Curio Class writing, CC BY 4.0; no Xerces copyrighted text or images bundled.</p>
      <p>Common milkweed and butterfly weed plant identities: USDA PLANTS Database, https://plants.usda.gov/ .
      U.S. federal species information, public domain. These examples do not establish suitability in your region.</p>
      <p>Independent checks: National Park Service, Protecting Western Monarchs and Monarchs on the Move in Cuyahoga Valley;
      University of Connecticut, Milkweed. NPS federal text is public domain; UConn used for fact checking only.
      No external dataset is sampled. All six original example documents are bundled in full.</p>
      <p>Research practice reference: AASL Standards Framework for Learners (2018), https://standards.aasl.org/framework/ .
      Copyright AASL; codes and references only, no framework text reproduced. Collaborate is not claimed: the desk supplies its own responses.</p>
      <h3>Privacy and controls</h3><p>Choices save only on this device. Nothing leaves it. Motion removes animation; Sound controls voice and tones.
      Read speaks the working material. The browser supplies narration. Rewind asks before clearing later choices.</p>
      <h3>Making</h3><p>Code MIT. Original text CC BY 4.0. Illustrations generated for Curio Class, with two retained FLUX.1-schnell paintings
      (model Apache 2.0). No people appear. The Curiosity catalog number has not been assigned in the supplied spec.</p>`);
    $('dialog').classList.add('manual-drawer');
  }
  function trace(id) {
    const r = evaluate().results.find(r => r.id === id);
    const note = state.notes[r.target];
    const file = ['','Question','Sources','Notes','Outline','Evidence'][r.stop];
    let content = `<p><b>${COUNCIL[id][0]}: ${COUNCIL[id][1]}</b></p><p class="reply">${esc(traceEvidence(r))}</p>`;
    if (r.stop === 1 && state.question !== null) content += `<p class="note-sheet">${QUESTIONS[state.question]}</p>`;
    if (id === 3 && r.target) content += `<div class="note-sheet">${esc(answerText(r)).replace(/\n/g,'<br>')}</div>`;
    else if (note) content += noteHtml(note,true);
    if (id === 5 && note) content += `<p>Source's real words: “${esc(source(r.target).passage)}”</p>`;
    if ([2,4,6].includes(id)) content += `<p>Plan steps: ${state.steps.map(i => PLAN[i]).join('; ') || 'None selected'}</p>`;
    openDialog('Evidence · '+file,content,
      `<button class="btn primary" data-rewind="${r.stop}">Rewind to ${file}</button>` + btn('dialog-close','Back to desk',true,''));
  }
  function traceEvidence(r) {
    const note = state.notes[r.target];
    if (r.id === 0 && state.question !== 1) return state.question === null ? 'No research question selected.' : 'Your question: ' + QUESTIONS[state.question];
    if (r.id === 6) return 'Your plan includes Butterfly Blend; its ingredients were not given.';
    if (r.id === 3 && !r.target) return "There's nothing in the outline to point to.";
    if (r.stop === 2) return 'You did not plan a visit to ' + source(r.target).place + '.';
    if (!note) return 'No note saved from ' + source(r.target).place + '.';
    if (r.id === 3) return evaluate().citationIssues.length ? 'Check the wording and source of every outlined note below.' : 'Every outlined note keeps its source and quotation marks where needed.';
    if (r.id === 5 || note.way === '2') return 'The saved note changes the source’s meaning. Compare the words.';
    if (!inOutline(r.target)) return source(r.target).place + ': ' + (state.headings[r.target] === 3 ? 'placed in Not needed.' : 'not placed in the outline.');
    if (r.id === 0 || r.id === 1) return source(r.target).place + ': ' + HEADINGS[state.headings[r.target]] + '.';
    return source(r.target).place + ' + ' +
      (state.steps.includes(r.id === 2 ? 0 : 1) ? PLAN[r.id === 2 ? 0 : 1] : 'the matching plan step was not selected') + '.';
  }
  function highlightTrace(id) {
    const map = document.querySelector('.trail-back');
    if (!map) return;
    const result = evaluate().results.find(r => r.id === id);
    map.classList.toggle('tracing',!!result);
    map.querySelectorAll('[data-trace]').forEach(el => el.classList.toggle('active',Number(el.dataset.trace) === id));
    map.querySelectorAll('.back-stops span').forEach((el,i) => el.classList.toggle('active',!!result && result.stop === i+1));
  }
  for (const name of ['pointerover','focusin']) document.addEventListener(name,event => {
    const route = event.target.closest('[data-trace]');
    if (route) highlightTrace(Number(route.dataset.trace));
  });
  for (const name of ['pointerout','focusout']) document.addEventListener(name,event => {
    if (!event.target.closest('[data-trace]')) return;
    const route = event.relatedTarget?.closest('[data-trace]') ||
      (name === 'pointerout' ? document.activeElement.closest('[data-trace]') : null);
    highlightTrace(route ? Number(route.dataset.trace) : null);
  });
  function selectQuestion(i) {
    V.hush();
    state.question = i;
    document.querySelectorAll('.question').forEach(el => el.setAttribute('aria-pressed',Number(el.dataset.question) === i));
    $('ask-reply').textContent = REPLIES[i];
    $('ask-next').disabled = false;
    updatePack();
    save();
    how();

  }
  function pickPlace(id, el) {
    const at = state.places.indexOf(id);
    if (at < 0 && state.places.length === 4) {
      $('hint').textContent = 'Four visits. Unpick one first.';
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      Curio.tone(180,.08,.04);
      return;
    }
    if (at >= 0) {state.places.splice(at,1); delete state.notes[id]; delete state.headings[id];}
    else state.places.push(id);
    el.setAttribute('aria-pressed',at < 0);
    el.querySelector('.pick').textContent = at < 0 ? '✓' : '+';
    $('plan-go').disabled = state.places.length === 0;
    $('visit-count').textContent = state.places.length + ' of 4 visits in your plan';
    updatePack();
    how();
    save();
  }
  function chooseWay(way) {
    V.dropQueued();
    state.way = way;
    document.querySelectorAll('.way').forEach(el => el.setAttribute('aria-pressed',el.dataset.way === way));
    $('save-note').disabled = false;
    $('save-source').disabled = false;
    how();
    save();
  }
  function saveNote(withSource) {
    if (state.way === null || state.notes[state.active]) return;
    state.notes[state.active] = {id:state.active,way:state.way,withSource};
    state.way = null;
    V.dropQueued();
    render('redo');
    const sheet = $('chapter').querySelector('.note-sheet');
    if (sheet) sheet.classList.add('saved-flash');
    Curio.tone(620,.12,.05);
  }
  function placeNote(i) {
    if (!state.selected) {
      hint('Tap a note card first, then tap the heading where it belongs.');
      return;
    }
    const selected = state.selected;
    state.headings[selected] = i;
    state.selected = null;
    $('selected-note').hidden = true;
    document.querySelector('.notes-list').inert = false;
    $('note-' + selected).querySelector('.where').textContent = HEADINGS[i];
    document.querySelectorAll('.note-card').forEach(el => el.setAttribute('aria-pressed','false'));
    document.querySelectorAll('.heading').forEach((el,j) => {
      el.classList.remove('drop-over');
      const detail = el.querySelector('small');
      detail.textContent = state.places.filter(id => state.headings[id] === j)
        .map(id => source(id).place).join(' · ') || 'Place a note here';
      detail.title = detail.textContent;
    });
    $('organize-done').disabled = false;
    document.querySelector('.actions .status').textContent = Object.keys(state.headings).length + ' of 4 notes placed';
    updatePack();
    how();
    save();
    Curio.tone(540,.08,.04);
  }
  document.addEventListener('click',event => {
    const b = event.target.closest('button, .trace-path');
    if (!b || b.disabled) return;
    if (b.dataset.desk) {
      if ($('dialog').open) closeDialog();
      return move(Number(b.dataset.desk));
    }
    if (b.id === 'manual') return manual();
    if (!['motion','sound','read'].includes(b.id)) Curio.tone(370,.035,.018,'sine');
    if (b.dataset.question !== undefined) return selectQuestion(Number(b.dataset.question));
    if (b.dataset.place) return pickPlace(b.dataset.place,b);
    if (b.dataset.way !== undefined) return chooseWay(b.dataset.way);
    if (b.dataset.visit) {
      V.hush();
      state.active = b.dataset.visit;
      state.way = null;
      return render(b.id);
    }
    if (b.dataset.note) {
      state.selected = state.selected === b.dataset.note ? null : b.dataset.note;
      document.querySelectorAll('.note-card').forEach(el => el.setAttribute('aria-pressed',el.dataset.note === state.selected));
      const detail = $('selected-note');
      detail.hidden = !state.selected;
      detail.innerHTML = state.selected ? noteHtml(state.notes[state.selected]) + btn('close-note','Back to notes',true,'') : '';
      document.querySelector('.notes-list').inert = !!state.selected;
      if (state.selected) $('heading-0').focus({preventScroll:true});
      how();
      save();
      return;
    }
    if (b.dataset.heading !== undefined) return placeNote(Number(b.dataset.heading));
    if (b.dataset.step !== undefined) {
      const i = Number(b.dataset.step);
      state.steps = state.steps.includes(i) ? state.steps.filter(n => n !== i) : [...state.steps,i];
      document.querySelectorAll('[data-step]').forEach(el => {
        el.setAttribute('aria-pressed',state.steps.includes(Number(el.dataset.step)));
        el.disabled = state.steps.length === 3 && !state.steps.includes(Number(el.dataset.step));
      });
      const ready = state.places.every(id => Number.isInteger(state.headings[id])) && state.steps.length > 0;
      $('organize-done').disabled = false;
      document.querySelector('.steps-label span').textContent = state.steps.length === 3 ?
        'Three steps chosen. Unpick one to change it.' : state.steps.length + ' of 3 chosen';
      how();
      save();
      return;
    }
    if (b.dataset.pack) return openPack(b.dataset.pack);
    if (b.dataset.trace !== undefined) return trace(Number(b.dataset.trace));
    if (b.dataset.rewind) {
      closeDialog();
      return confirmReset(Number(b.dataset.rewind));
    }
    if (b.dataset.reset !== undefined) return rewindTo(Number(b.dataset.reset));
    const actions = {
      'ask-next':() => move(2), 'plan-go':() => move(3), 'gather-next':() => move(4),
      'organize-done':() => move(5), 'save-note':() => saveNote(false), 'save-source':() => saveNote(true),
      redo:() => {
        delete state.notes[state.active];
        state.way = null;
        render('way-0');
      },
      
      'show-trail':() => {
        V.hush();
        state.trail = true;
        render('trace-0');
      },
      rewind:rewindMenu, 'trail-rewind':rewindMenu,
      restart:() => confirmReset(0), 'trail-restart':() => confirmReset(0),
      'pack-chip':() => openDialog('Your research pack',packContent(),
        btn('dialog-rewind','Rewind',state.stop > 1,'') + btn('dialog-restart','Start over',true,'') + btn('dialog-close','Back to desk',true,'')),
      'desk-pack':() => $('pack-chip').click(),
      'dialog-rewind':() => {
        closeDialog();
        rewindMenu();
      },
      'dialog-restart':() => {
        closeDialog();
        confirmReset(0);
      },
      'close-note':() => {
        const id = state.selected;
        state.selected = null;
        render('note-' + id);
      },
      'dialog-read':() => V.read(), 'dialog-close':closeDialog, 'reset-no':closeDialog
    };
    if (actions[b.id]) actions[b.id]();
  });
  document.addEventListener('keydown',event => {
    if (!event.target.matches('.trace-path') || !['Enter',' '].includes(event.key)) return;
    event.preventDefault();
    trace(Number(event.target.dataset.trace));
  });
  let dragged = null;
  let pointerDrag = null;
  document.addEventListener('dragstart',event => {
    pointerDrag = null;
    const card = event.target.closest('[data-note]');
    if (!card) return;
    dragged = card.dataset.note;
    event.dataTransfer.setData('text/plain',dragged);
    event.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover',event => {
    const heading = event.target.closest('[data-heading]');
    if (!heading) return;
    event.preventDefault();
    heading.classList.add('drop-over');
  });
  document.addEventListener('dragleave',event => event.target.closest('[data-heading]')?.classList.remove('drop-over'));
  document.addEventListener('drop',event => {
    const heading = event.target.closest('[data-heading]');
    if (!heading || !dragged) return;
    event.preventDefault();
    state.selected = dragged;
    dragged = null;
    placeNote(Number(heading.dataset.heading));
  });
  document.addEventListener('pointercancel',() => {pointerDrag = null;});
  document.addEventListener('dragend',() => {dragged = null; pointerDrag = null;});
  addEventListener('blur',() => {dragged = null; pointerDrag = null;});
  document.addEventListener('pointerdown',event => {
    pointerDrag = null;
    const card = event.target.closest('[data-note]');
    if (card) pointerDrag = {id:card.dataset.note,x:event.clientX,y:event.clientY};
  });
  document.addEventListener('pointerup',event => {
    if (!pointerDrag) return;
    const drag = pointerDrag;
    pointerDrag = null;
    if (Math.hypot(event.clientX-drag.x,event.clientY-drag.y) < 8) return;
    const heading = document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-heading]');
    if (heading) {
      state.selected = drag.id;
      placeNote(Number(heading.dataset.heading));
    }
  });
  $('dialog').addEventListener('cancel',() => {
    if (returnFocus && returnFocus.isConnected) requestAnimationFrame(() => returnFocus.focus({preventScroll:true}));
  });
  Curio.init({clips:"voice:*",rate:.9});
  window.__tool = {
    get state() {return state;}, setMode:() => {}, allLines:V.allLines, vlog:V.log,
    get vq() {return V.queue;}, evaluate, render, rewindTo, source, noteText, readText,
    load:run => {
      V.hush();
      state = {...fresh(),...run};
      render();
    }
  };
  render();
})();
</script>
</body>
</html>
