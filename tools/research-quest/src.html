    if (r.id === 0 && state.question !== 1) return 'Your question: ' + QUESTIONS[state.question];
    if (r.id === 6) return 'Your plan includes Butterfly Blend; its ingredients were not given.';
    if (!note) return 'Your visits did not bring back this evidence.';
    if (r.id === 3) return note.way === 'copy' ? 'Exact words saved without quote marks.' :
      note.withSource ? 'You kept the source with this note.' : 'You saved the note without its source.';
    if (r.id === 5) return 'Compare the meaning of your note with the source.';
    if (!inOutline(r.target)) return source(r.target).place + ': placed in Not needed.';
    if (r.id === 0 || r.id === 1) return source(r.target).place + ': ' + HEADINGS[state.headings[r.target]] + '.';
    return source(r.target).place + ' + ' +
      (state.steps.includes(r.id === 2 ? 0 : 1) ? PLAN[r.id === 2 ? 0 : 1] : 'the matching plan step was not selected') + '.';
  }
  function highlightTrace(id) {
    const map = document.querySelector('.trail-back');
    if (!map) return;
    const result = evaluate().results.find(r => r.id === id);
    map.classList.toggle('tracing',!!result);
    map.querySelectorAll('[data-trace]').forEach(el => el.classList.toggle('active',Number(el.dataset.trace) === id));
    map.querySelectorAll('.back-stops span').forEach((el,i) => el.classList.toggle('active',!!result && result.stop === i+1));
  }
  for (const name of ['pointerover','focusin']) document.addEventListener(name,event => {
    const route = event.target.closest('[data-trace]');
    if (route) highlightTrace(Number(route.dataset.trace));
  });
  for (const name of ['pointerout','focusout']) document.addEventListener(name,event => {
    if (!event.target.closest('[data-trace]')) return;
    const route = event.relatedTarget?.closest('[data-trace]') ||
      (name === 'pointerout' ? document.activeElement.closest('[data-trace]') : null);
    highlightTrace(route ? Number(route.dataset.trace) : null);
  });
  function selectQuestion(i) {
    V.hush();
    state.question = i;
    document.querySelectorAll('.question').forEach(el => el.setAttribute('aria-pressed',Number(el.dataset.question) === i));
    $('ask-reply').textContent = REPLIES[i];
    $('ask-next').disabled = false;
    updatePack();
    save();
    $('hint').textContent = L.continueAsk;
    V.say(REPLIES[i],{valid:() => state.stop === 1 && state.question === i});
  }
  function pickPlace(id, el) {
    const at = state.places.indexOf(id);
    if (at < 0 && state.places.length === 4) {
      $('hint').textContent = 'Four visits. Unpick one first.';
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      Curio.tone(180,.08,.04);
      return;
    }
    if (at >= 0) state.places.splice(at,1);
    else state.places.push(id);
    el.setAttribute('aria-pressed',at < 0);
    el.querySelector('.pick').textContent = at < 0 ? '✓' : '+';
    $('plan-go').disabled = state.places.length !== 4;
    $('visit-count').textContent = state.places.length + ' of 4 visits in your plan';
    updatePack();
    how();
    save();
  }
  function chooseWay(way) {
    V.dropQueued();
    state.way = way;
    document.querySelectorAll('.way').forEach(el => el.setAttribute('aria-pressed',el.dataset.way === way));
    $('save-note').disabled = false;
    $('save-source').disabled = false;
    how();
    save();
  }
  function saveNote(withSource) {
    if (state.way === null || state.notes[state.active]) return;
    state.notes[state.active] = {id:state.active,way:state.way,withSource};
    state.way = null;
    V.dropQueued();
    render('redo');
    const sheet = $('chapter').querySelector('.note-sheet');
    if (sheet) sheet.classList.add('saved-flash');
    Curio.tone(620,.12,.05);
  }
  function placeNote(i) {
    if (!state.selected) {
      hint('Tap a note card first, then tap the heading where it belongs.');
      return;
    }
    const selected = state.selected;
    state.headings[selected] = i;
    state.selected = null;
    $('note-' + selected).querySelector('.where').textContent = HEADINGS[i];
    document.querySelectorAll('.note-card').forEach(el => el.setAttribute('aria-pressed','false'));
    document.querySelectorAll('.heading').forEach((el,j) => {
      el.classList.remove('drop-over');
      const detail = el.querySelector('small');
      detail.textContent = state.places.filter(id => state.headings[id] === j)
        .map(id => source(id).place).join(' · ') || 'Place a note here';
      detail.title = detail.textContent;
    });
    $('organize-done').disabled = !(state.places.every(id => Number.isInteger(state.headings[id])) && state.steps.length > 0);
    document.querySelector('.actions .status').textContent = Object.keys(state.headings).length + ' of 4 notes placed';
    updatePack();
    how();
    save();
    Curio.tone(540,.08,.04);
  }
  function nextCouncil() {
    V.hush();
    state.councilIndex++;
    const ev = evaluate();
    if (state.councilIndex >= ev.results.length) {
      state.finale = true;
      render('show-trail');
      V.say(ev.ending,{valid:() => state.finale && !state.trail});
      if (ev.tooClose) V.say('tooClose',{valid:() => state.finale && !state.trail});
      if (ev.ending === 'approved') Curio.yes();
    } else {
      const nextButton = $('next-question');
      render('next-question');
      if (nextButton) {
        nextButton.textContent = $('next-question').textContent;
        $('next-question').replaceWith(nextButton);
        nextButton.focus({preventScroll:true});
      }
      const index = state.councilIndex;
      V.say(L.council[ev.results[index].id],{valid:() => state.councilIndex === index && !state.finale});
    }
  }
  document.addEventListener('click',event => {
    const b = event.target.closest('button, .trace-path');
    if (!b || b.disabled) return;
    if (!['motion','sound','read'].includes(b.id)) Curio.tone(370,.035,.018,'sine');
    if (b.dataset.question !== undefined) return selectQuestion(Number(b.dataset.question));
    if (b.dataset.place) return pickPlace(b.dataset.place,b);
    if (b.dataset.way !== undefined) return chooseWay(b.dataset.way);
    if (b.dataset.visit) {
      V.hush();
      state.active = b.dataset.visit;
      state.way = null;
      return render(b.id);
    }
    if (b.dataset.note) {
      state.selected = state.selected === b.dataset.note ? null : b.dataset.note;
      document.querySelectorAll('.note-card').forEach(el => el.setAttribute('aria-pressed',el.dataset.note === state.selected));
      how();
      save();
      return;
    }
    if (b.dataset.heading !== undefined) return placeNote(Number(b.dataset.heading));
    if (b.dataset.step !== undefined) {
      const i = Number(b.dataset.step);
      state.steps = state.steps.includes(i) ? state.steps.filter(n => n !== i) : [...state.steps,i];
      document.querySelectorAll('[data-step]').forEach(el => {
        el.setAttribute('aria-pressed',state.steps.includes(Number(el.dataset.step)));
        el.disabled = state.steps.length === 3 && !state.steps.includes(Number(el.dataset.step));
      });
      const ready = state.places.every(id => Number.isInteger(state.headings[id])) && state.steps.length > 0;
      $('organize-done').disabled = !ready;
      document.querySelector('.steps-label span').textContent = state.steps.length === 3 ?
        'Three steps chosen. Unpick one to change it.' : state.steps.length + ' of 3 chosen';
      how();
      save();
      return;
    }
    if (b.dataset.pack) return openPack(b.dataset.pack);
    if (b.dataset.trace !== undefined) return trace(Number(b.dataset.trace));
    if (b.dataset.rewind) {
      closeDialog();
      return confirmReset(Number(b.dataset.rewind));
    }
    if (b.dataset.reset !== undefined) return rewindTo(Number(b.dataset.reset));
    const actions = {
      'ask-next':() => move(2), 'plan-go':() => move(3), 'gather-next':() => move(4),
      'organize-done':() => move(5), 'save-note':() => saveNote(false), 'save-source':() => saveNote(true),
      redo:() => {
        delete state.notes[state.active];
        state.way = null;
        render('way-0');
      },
      'next-question':nextCouncil,
      'show-trail':() => {
        V.hush();
        state.trail = true;
        render('trace-0');
      },
      rewind:rewindMenu, 'trail-rewind':rewindMenu,
      restart:() => confirmReset(0), 'trail-restart':() => confirmReset(0),
      'pack-chip':() => openDialog('Your research pack',packContent(),
        btn('dialog-rewind','Rewind',state.stop > 1,'') + btn('dialog-restart','Start over',true,'') + btn('dialog-close','Back to quest',true,'')),
      'dialog-rewind':() => {
        closeDialog();
        rewindMenu();
      },
      'dialog-restart':() => {
        closeDialog();
        confirmReset(0);
      },
      'dialog-close':closeDialog, 'reset-no':closeDialog
    };
    if (actions[b.id]) actions[b.id]();
  });
  document.addEventListener('keydown',event => {
    if (!event.target.matches('.trace-path') || !['Enter',' '].includes(event.key)) return;
    event.preventDefault();
    trace(Number(event.target.dataset.trace));
  });
  let dragged = null;
  let pointerDrag = null;
  document.addEventListener('dragstart',event => {
    const card = event.target.closest('[data-note]');
    if (!card) return;
    dragged = card.dataset.note;
    state.selected = dragged;
    event.dataTransfer.setData('text/plain',dragged);
    event.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover',event => {
    const heading = event.target.closest('[data-heading]');
    if (!heading) return;
    event.preventDefault();
    heading.classList.add('drop-over');
  });
  document.addEventListener('dragleave',event => event.target.closest('[data-heading]')?.classList.remove('drop-over'));
  document.addEventListener('drop',event => {
    const heading = event.target.closest('[data-heading]');
    if (!heading || !dragged) return;
    event.preventDefault();
    state.selected = dragged;
    dragged = null;
    placeNote(Number(heading.dataset.heading));
  });
  document.addEventListener('pointerdown',event => {
    const card = event.target.closest('[data-note]');
    if (card) pointerDrag = {id:card.dataset.note,x:event.clientX,y:event.clientY};
  });
  document.addEventListener('pointerup',event => {
    if (!pointerDrag) return;
    const drag = pointerDrag;
    pointerDrag = null;
    if (Math.hypot(event.clientX-drag.x,event.clientY-drag.y) < 8) return;
    const heading = document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-heading]');
    if (heading) {
      state.selected = drag.id;
      placeNote(Number(heading.dataset.heading));
    }
  });
  $('dialog').addEventListener('cancel',() => {
    if (returnFocus && returnFocus.isConnected) requestAnimationFrame(() => returnFocus.focus({preventScroll:true}));
  });
  Curio.init({clips:"voice:*",rate:.9});
  window.__tool = {
    get state() {return state;}, setMode:() => {}, allLines:V.allLines, vlog:V.log,
    get vq() {return V.queue;}, evaluate, render, rewindTo, source, noteText,
    load:run => {
      V.hush();
      state = {...fresh(),...run};
      render();
    }
  };
  render();
})();
</script>
</body>
</html>
