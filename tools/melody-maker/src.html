<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melody Maker · Melody and scales · Curio Class</title>
<meta name="description" content="Compose melodies on a solfege grid where every note sounds good, climb the major scale ladder to find its whole and half steps, echo patterns back to a singing robin, and pick the ending that makes a tune sound finished.">
<!--
MELODY MAKER (Curio Class)
Music, grades 3-5, National Core Arts Standards MU:Cr1 (imagine and generate musical ideas) and MU:Pr4 (analyze
and interpret), module "Melody and Scales": solfege and major scales.
Compose: a 16-beat grid with one row per solfege syllable (do re mi fa sol la ti do). Every note is in the scale,
so every tune sounds good. Play it back on four instruments, change key (the shape stays the same) or switch to
pentatonic or la-based minor. The melody is also written on a treble staff, and a shape helper names each move
(step, skip, leap, repeat) and checks whether the tune ends on home.
Scale ladder: the major scale as a ladder spaced by half steps, with a piano that shows the whole-whole-half,
whole-whole-whole-half pattern in four keys (and why G major needs F sharp).
Echo it: the robin sings a short pattern; play it back on the solfege bells. Six levels from sol-mi to the
whole scale.
Finish the tune: hear phrases from public domain folk songs and pick the last note. Answer phrases end on do;
question phrases end away from home.
Robin illustrations generated with Google Gemini, edited for Curio Class. Treble clef drawing public domain
(Wikimedia Commons). Sound synthesized in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<style>
:root{
  --paper:#f6eedf;--ink:#2a2118;--muted:#6b5d4f;--focus:#2f5bd3;--brand:#b4532a;--gold:#ffcf3a;--card:#fffaf1;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--brand);color:#fff5ec}
h1{margin:0 auto 0 0;font:800 clamp(22px,2.8vw,32px)/1.1 Georgia,'Times New Roman',serif}
h1 small{display:block;font:400 14px/1.3 'Segoe UI',sans-serif;color:#ffdcc8}
.icon-btn{border:1px solid #d9845f;background:#c9673c;color:#fff;border-radius:999px;min-height:46px;padding:0 16px;font-weight:700;font-size:15px}
.icon-btn[aria-pressed="false"]{background:#7e3518}

.stagewrap{position:relative;overflow:hidden;min-height:0;background:#6d4a2c}
.scene{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden}
.scene>img.bg{position:absolute;left:-130px;top:-90px;width:1700px;height:990px;object-fit:cover}
.top{position:absolute;left:24px;right:24px;top:14px;display:flex;align-items:center;gap:12px;z-index:6}
.tabs{display:inline-flex;border-radius:999px;overflow:hidden;background:#fffaf1f0;box-shadow:0 3px 0 #0003}
.tabs button{border:0;background:transparent;min-height:54px;padding:0 22px;font:800 19px 'Segoe UI',sans-serif;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff}
.b{border:0;border-radius:16px;min-height:52px;padding:0 18px;font:800 18px 'Segoe UI',sans-serif;background:#fffaf1;color:var(--ink);box-shadow:0 4px 0 #0003;white-space:nowrap}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.b.go{background:#2f8a4a;color:#fff;box-shadow:0 4px 0 #1d5e30}
.b.red{background:var(--brand);color:#fff;box-shadow:0 4px 0 #7e3518}
.b[aria-pressed="true"]{background:var(--gold);color:#3a2a00}
.b:disabled{opacity:.45;cursor:default}
.sel{border:0;border-radius:14px;min-height:48px;padding:0 10px;font:700 16px 'Segoe UI',sans-serif;background:#fffaf1;box-shadow:0 3px 0 #0003}
.lab{font:800 12px 'Segoe UI',sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px #0008;display:block;margin-bottom:2px}

.board{position:absolute;z-index:3;background:#fffaf1f4;border-radius:24px;box-shadow:0 6px 0 #0003;padding:12px 14px}
.grid{display:grid;gap:3px;user-select:none;touch-action:none}
.rowlab{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font:900 19px 'Segoe UI',sans-serif;border-radius:10px}
.cell{border:0;border-radius:9px;background:#efe5d4;padding:0;position:relative;min-width:0}
.cell:nth-child(4n+2){box-shadow:inset 3px 0 0 #d8c8ad}
.cell.on{color:#fff;font:900 16px 'Segoe UI',sans-serif;box-shadow:0 3px 0 #0003,inset 0 -4px 0 #0002}
.cell.ph{outline:3px solid #ffb300;outline-offset:-1px}
.cell.cur{outline:3px dashed var(--focus);outline-offset:-2px}
.colph{background:#ffe9a8}
.beats{display:grid;gap:3px;margin-top:2px;font:700 12px 'Segoe UI',sans-serif;color:var(--muted);text-align:center}
.staff svg{display:block;width:100%;overflow:visible}
.controls{position:absolute;z-index:4;display:flex;gap:10px;align-items:flex-end;flex-wrap:nowrap}
.side{position:absolute;z-index:3;background:#fffaf1f2;border-radius:22px;box-shadow:0 6px 0 #0003;padding:14px 16px}
.side h2{margin:0 0 6px;font:800 21px Georgia,serif}
.side p{margin:6px 0;font:500 16px/1.4 'Segoe UI',sans-serif}
.moves{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.moves span{border-radius:10px;padding:4px 9px;font:800 14px 'Segoe UI',sans-serif;background:#efe5d4}
.check{font:700 15px/1.4 'Segoe UI',sans-serif;margin:3px 0}
.bird{position:absolute;z-index:5;height:200px;filter:drop-shadow(0 8px 6px #0005);transform-origin:50% 100%;pointer-events:none}
.say{position:absolute;z-index:5;background:#fff;border-radius:24px;padding:12px 20px;font:600 19px/1.35 'Segoe UI',sans-serif;box-shadow:0 8px 20px #0004;display:flex;align-items:center;min-height:70px}
.say::after{content:'';position:absolute;right:-18px;top:50%;border:13px solid transparent;border-left:20px solid #fff;transform:translateY(-50%)}
.say b{color:var(--brand)}
.pop{position:absolute;z-index:6;font:900 34px 'Segoe UI',sans-serif;color:#fff;padding:4px 16px;border-radius:999px;pointer-events:none;box-shadow:0 6px 12px #0004;transform:translate(-50%,-50%)}

/* ladder */
.ladder{position:absolute;z-index:3}
.ladder svg{overflow:visible}
.rung{cursor:pointer}
.rung:hover rect{filter:brightness(1.08)}
.piano{position:absolute;z-index:3}

/* bells */
.bells{position:absolute;z-index:4;display:flex;gap:10px;align-items:flex-end}
.bell{border:0;border-radius:20px 20px 26px 26px;width:118px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;box-shadow:0 6px 0 #0004,inset 0 -8px 0 #0002;position:relative}
.bell b{font:900 28px 'Segoe UI',sans-serif;text-shadow:0 2px 0 #0003}
.bell kbd{font:700 13px 'Segoe UI',sans-serif;opacity:.85}
.bell:active,.bell.hit{transform:translateY(5px);box-shadow:0 1px 0 #0004}
.bell:disabled{opacity:.35;filter:grayscale(.6)}
.dots{display:flex;gap:14px;justify-content:center}
.dot{width:74px;height:74px;border-radius:50%;border:4px dashed #c9b79a;display:grid;place-items:center;font:900 20px 'Segoe UI',sans-serif;color:#fff;background:#fff8}
.dot.full{border:4px solid #0002}
.dot.bad{box-shadow:0 0 0 5px #c2402c}
.dot.good{box-shadow:0 0 0 5px #2f8a4a}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.levels .b{min-height:44px;font-size:15px;padding:0 12px}
.big{font:800 24px/1.3 'Segoe UI',sans-serif;text-align:center;margin:4px 0 12px}
.rounds{display:flex;gap:6px}
.rounds span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px 'Segoe UI',sans-serif;background:#efe5d4}
.rounds span.cur{outline:3px solid var(--brand)}
.rounds span.ok{background:#2f8a4a;color:#fff}
.rounds span.no{background:#d9a089;color:#fff}
</style>
</head>
<body>
<header>
  <h1>Melody Maker <small>Compose with do re mi, climb the scale, echo the robin.</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<div class="stagewrap" id="stagewrap">
  <div class="scene" id="scene">
    <img class="bg" src="art:room" alt="">
    <div class="top">
      <div class="tabs" role="group" aria-label="Mode">
        <button data-mode="compose" aria-pressed="true">🎼 Compose</button>
        <button data-mode="ladder" aria-pressed="false">🪜 Scale ladder</button>
        <button data-mode="echo" aria-pressed="false">👂 Echo it</button>
        <button data-mode="finish" aria-pressed="false">🏁 Finish the tune</button>
      </div>
    </div>
    <div id="view"></div>
    <div class="say" id="say" aria-live="polite"></div>
    <img class="bird" id="bird" src="art:bird" alt="Robin">
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));
  const anim = (el, kf, opt) => { if (reduce || !el || !el.animate) return null; return el.animate(kf, opt); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const BIRD = {sing: 'art:bird', listen: 'art:birdlisten'};

  // ---------- music ----------
  // Syllables carry their colors everywhere (the common classroom bell colors), always with the name on them.
  const COL = {do: '#d8392b', re: '#ef7d1a', mi: '#e9b500', fa: '#3c9a3c', sol: '#1f9bb5', la: '#3d5fc4', ti: '#8a4fbf'};
  const SCALES = {
    major: {name: 'Major', home: 'do', rows: [[0, 'do', 0], [2, 're', 1], [4, 'mi', 2], [5, 'fa', 3], [7, 'sol', 4], [9, 'la', 5], [11, 'ti', 6], [12, 'do', 7]]},
    penta: {name: 'Pentatonic', home: 'do', rows: [[0, 'do', 0], [2, 're', 1], [4, 'mi', 2], [7, 'sol', 4], [9, 'la', 5], [12, 'do', 7]]},
    minor: {name: 'Minor (la is home)', home: 'la', rows: [[-3, 'la', -2], [-1, 'ti', -1], [0, 'do', 0], [2, 're', 1], [4, 'mi', 2], [5, 'fa', 3], [7, 'sol', 4], [9, 'la', 5]]},
  };
  // key: do's pitch (semitones above middle C), letter of do, and the key signature
  const KEYS = {
    C: {semi: 0, letter: 0, sig: [], name: 'C'},
    D: {semi: 2, letter: 1, sig: ['F♯', 'C♯'], name: 'D'},
    F: {semi: 5, letter: 3, sig: ['B♭'], name: 'F'},
    G: {semi: 7, letter: 4, sig: ['F♯'], name: 'G'},
  };
  const MINOR_NAME = {C: 'A minor', D: 'B minor', F: 'D minor', G: 'E minor'};
  const freq = (key, semi) => 261.63 * Math.pow(2, (KEYS[key].semi + semi) / 12);

  let ac = null, soundOn = true, master, room;
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').textContent = soundOn ? '🔔 Sound' : '🔕 Sound'; };
  function ctx() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
      master = ac.createGain(); master.gain.value = .8; master.connect(ac.destination);
      const d = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain(), lp = ac.createBiquadFilter();
      d.delayTime.value = .13; fb.gain.value = .28; wet.gain.value = .22; lp.type = 'lowpass'; lp.frequency.value = 2400;
      room = ac.createGain(); room.connect(d); d.connect(lp).connect(fb).connect(d); lp.connect(wet).connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  const INSTR = {
    marimba: {name: '🪵 Marimba', play: (f, t, d) => pluck(f, t, Math.min(1.1, .5 + d), {gain: .32, partials: [[1, 1], [4, .18], [10, .04]]})},
    flute: {name: '🪈 Flute', play: (f, t, d) => blow(f, t, d)},
    piano: {name: '🎹 Piano', play: (f, t, d) => pluck(f, t, 1.4, {gain: .22, partials: [[1, 1], [2, .45], [3, .2], [4, .1], [5, .05]], type: 'triangle', cutoff: f * 9})},
    box: {name: '🎁 Music box', play: (f, t, d) => pluck(f * 2, t, 1.6, {gain: .16, partials: [[1, 1], [2.76, .25], [5.4, .08]]})},
  };
  function pluck(f, t, decay, {gain = .2, partials = [[1, 1]], type = 'sine', cutoff = 0} = {}) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + decay);
    let out = g;
    if (cutoff) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(cutoff, t); lp.frequency.exponentialRampToValueAtTime(cutoff * .3, t + decay); g.connect(lp); out = lp; }
    out.connect(master); out.connect(room);
    for (const [r, l] of partials) {
      const o = ac.createOscillator(), pg = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f * r, t); pg.gain.value = l;
      o.connect(pg).connect(g); o.start(t); o.stop(t + decay + .05);
    }
  }
  function blow(f, t, d) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), v = ac.createOscillator(), vg = ac.createGain();
    o.type = 'sine'; o.frequency.value = f; o2.type = 'triangle'; o2.frequency.value = f * 2;
    v.frequency.value = 5; vg.gain.value = f * .006; v.connect(vg).connect(o.frequency);
    const g2 = ac.createGain(); g2.gain.value = .12; o2.connect(g2).connect(g); o.connect(g);
    const len = Math.max(.25, d * .92);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.24, t + .06); g.gain.setValueAtTime(.22, t + len - .06); g.gain.exponentialRampToValueAtTime(.0001, t + len + .12);
    g.connect(master); g.connect(room);
    [o, o2, v].forEach(x => { x.start(t); x.stop(t + len + .15); });
  }
  let instr = 'marimba';
  function note(key, semi, at = 0, dur = .4) { const c = soundOn && ctx(); if (!c) return; INSTR[instr].play(freq(key, semi), c.currentTime + at + .02, dur); }
  function chime(good) {
    const c = soundOn && ctx(); if (!c) return;
    (good ? [0, 4, 7, 12] : [5, 4]).forEach((s, i) => pluck(523.25 * Math.pow(2, s / 12), c.currentTime + i * .09, .6, {gain: .12, partials: [[1, 1], [2.76, .2]]}));
  }

  // ---------- bird and speech ----------
  function say(html, {left = 520, top = 712, width = 680} = {}) {
    const s = $('say'); s.innerHTML = `<div>${html}</div>`;
    Object.assign(s.style, {left: left + 'px', top: top + 'px', width: width + 'px'});
  }
  function birdAt(x, y, h = 200) { Object.assign($('bird').style, {left: x + 'px', top: y + 'px', height: h + 'px'}); }
  function bob(pose = 'sing') {
    $('bird').src = BIRD[pose];
    anim($('bird'), [{transform: 'translateY(0) scaleY(1)'}, {transform: 'translateY(-12px) scaleY(1.04)'}, {transform: 'translateY(0) scaleY(.97)'}, {transform: 'none'}], {duration: 300});
  }
  function pop(text, syl, x, y) {
    const p = document.createElement('div'); p.className = 'pop'; p.textContent = text; p.style.background = COL[syl];
    p.style.left = x + 'px'; p.style.top = y + 'px'; $('scene').appendChild(p);
    const a = anim(p, [{transform: 'translate(-50%,-30%) scale(.6)', opacity: 0}, {transform: 'translate(-50%,-80%) scale(1)', opacity: 1, offset: .25}, {transform: 'translate(-50%,-140%) scale(1)', opacity: 0}], {duration: 900, easing: 'ease-out'});
    setTimeout(() => p.remove(), a ? 900 : 500);
  }

  // ---------- modes ----------
  const view = $('view');
  let mode = 'compose', playToken = 0;
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  function setMode(m) {
    stopPlay(); mode = m;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    $('bird').src = BIRD.sing; $('say').hidden = false;
    ({compose: renderCompose, ladder: renderLadder, echo: renderEcho, finish: renderFinish})[m]();
  }
  function stopPlay() { playToken++; document.querySelectorAll('.ph,.colph').forEach(e => e.classList.remove('ph', 'colph')); }

  // ---------- Compose ----------
  const COLS = 16;
  const C = {key: 'C', scale: 'major', tempo: 100, cells: Array(COLS).fill(null), cur: 0, shape: true};
  try { const s = JSON.parse(localStorage.getItem('melody-maker') || 'null'); if (s && s.cells && s.cells.length === COLS) Object.assign(C, s); } catch {}
  const save = () => { try { localStorage.setItem('melody-maker', JSON.stringify({key: C.key, scale: C.scale, tempo: C.tempo, cells: C.cells})); } catch {} };
  const rowsOf = sc => SCALES[sc].rows;
  // cells store the scale degree index (row index in the major-style list); switching scale snaps to the nearest row
  function renderCompose() {
    const rows = rowsOf(C.scale), n = rows.length, rh = Math.floor(352 / n) - 3;
    view.innerHTML = `
      <div class="board" style="left:24px;top:86px;width:1150px;height:530px">
        <div style="display:flex;gap:6px">
          <div style="width:76px;display:grid;gap:3px;grid-template-rows:repeat(${n},${rh}px)">${rows.slice().reverse().map(([s, syl]) => `<div class="rowlab" style="color:${COL[syl]}">${syl}${syl === SCALES[C.scale].home ? ' 🏠' : ''}</div>`).join('')}</div>
          <div style="flex:1"><div class="grid" id="grid" role="grid" aria-label="Melody grid: ${n} notes high, ${COLS} beats long" style="grid-template-columns:repeat(${COLS},1fr);grid-template-rows:repeat(${n},${rh}px)"></div>
          <div class="beats" style="grid-template-columns:repeat(${COLS},1fr)">${Array.from({length: COLS}, (_, i) => `<span>${i % 4 === 0 ? 'bar ' + (i / 4 + 1) : '·'}</span>`).join('')}</div></div>
        </div>
        <div class="staff" id="staff" style="margin-top:6px"></div>
      </div>
      <div class="controls" style="left:24px;top:630px">
        <button class="b go" id="play">▶ Play</button>
        <button class="b" id="surprise">🎲 Surprise me</button>
        <button class="b" id="clear">🧽 Clear</button>
        <label><span class="lab">Instrument</span><select class="sel" id="instr">${Object.entries(INSTR).map(([k, v]) => `<option value="${k}" ${k === instr ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label>
      </div>
      <div class="side" id="side" style="left:1192px;right:22px;top:86px;height:330px"></div>
      <div class="side" style="left:1192px;right:22px;top:428px;padding:10px 14px">
        <label><span class="lab" style="color:var(--muted);text-shadow:none">Key</span><select class="sel" id="key" style="width:100%">${Object.keys(KEYS).map(k => `<option value="${k}" ${k === C.key ? 'selected' : ''}>${C.scale === 'minor' ? MINOR_NAME[k] : k + ' major'}</option>`).join('')}</select></label>
        <label><span class="lab" style="color:var(--muted);text-shadow:none;margin-top:6px">Scale</span><select class="sel" id="scale" style="width:100%">${Object.entries(SCALES).map(([k, v]) => `<option value="${k}" ${k === C.scale ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label>
        <label><span class="lab" style="color:var(--muted);text-shadow:none;margin-top:6px">Speed: <span id="tv">${C.tempo}</span> beats a minute</span><input type="range" id="tempo" min="60" max="160" step="5" value="${C.tempo}" style="width:100%;accent-color:var(--brand)"></label>
      </div>`;
    birdAt(1236, 600, 200);
    say('Tap the grid to place notes, one per beat. Every row is in the scale, so <b>every note sounds good</b>. Then press <b>Play</b>.', {left: 24, top: 712, width: 1170});
    drawGrid(); drawStaff(); drawSide();
    $('play').onclick = () => { if (playing) { stopPlay(); playing = false; $('play').textContent = '▶ Play'; } else playMelody(); };
    $('clear').onclick = () => { C.cells.fill(null); save(); drawGrid(); drawStaff(); drawSide(); say('A blank page. Try starting on <b>do</b>.', {left: 24, top: 712, width: 1170}); };
    $('surprise').onclick = () => { surprise(); save(); drawGrid(); drawStaff(); drawSide(); playMelody(); };
    $('instr').onchange = e => { instr = e.target.value; note(C.key, rowsOf(C.scale)[0][0], 0, .5); };
    $('key').onchange = e => { C.key = e.target.value; save(); drawStaff(); drawSide(); playMelody(); say(`Same tune, new key. Every note moved, but the <b>shape</b> and the syllables stayed the same. That's why do re mi works in any key.`, {left: 24, top: 712, width: 1170}); };
    $('scale').onchange = e => { C.scale = e.target.value; C.cells = C.cells.map(v => v == null ? null : Math.min(v, rowsOf(C.scale).length - 1)); save(); renderCompose();

    const idx = s => BELLS.findIndex(b => b[0] === s);
    const pool = lv.notes.slice().sort((a, b) => idx(a) - idx(b));
    let p = pool.includes('sol') && E.lv < 3 ? pool.indexOf('sol') : pool.includes('mi') && E.lv === 2 ? pool.indexOf('mi') : Math.floor(Math.random() * pool.length);
    for (let i = 0; i < lv.len; i++) {
      pat.push(pool[p]);
      // mostly steps to a neighbor, sometimes a skip, and never the same note three times running
      const rep = i > 0 && pat[i - 1] === pat[i];
      const opts = [-1, 1, -1, 1, -2, 2, 0].filter(m => p + m >= 0 && p + m < pool.length && !(m === 0 && rep));
      p += opts[Math.floor(Math.random() * opts.length)];
    }
    if (pat.every(x => x === pat[0])) pat[pat.length - 1] = pool[(pool.indexOf(pat[0]) + 1) % pool.length];
    E.pat = pat; E.got = []; playPattern();
  }
  async function playPattern() {
    stopPlay(); const tok = ++playToken; E.state = 'listen'; E.got = []; dots();
    $('ebig').innerHTML = '🎵 Listen...'; $('listen').disabled = $('again').disabled = true;
    $('bird').src = BIRD.sing;
    await wait(400);
    for (const s of E.pat) {
      if (tok !== playToken) return;
      note('C', BELLS.find(b => b[0] === s)[1], 0, .5); bob('sing'); await wait(650);
    }
    if (tok !== playToken) return;
    await wait(500);
    E.state = 'echo'; $('bird').src = BIRD.listen; bob('listen');
    $('ebig').innerHTML = '🔔 Your turn: echo it!'; $('listen').disabled = false; $('again').disabled = false;
  }
  function bell(syl) {
    note('C', BELLS.find(b => b[0] === syl)[1], 0, .5);
    const b = document.querySelector(`[data-bell="${syl}"]`); b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 160);
    if (E.state !== 'echo') return;
    E.got.push(syl); dots();
    if (E.got.length === E.pat.length) {
      E.state = 'idle';
      const ok = E.got.every((g, i) => g === E.pat[i]);
      setTimeout(() => {
        dots(true); chime(ok);
        if (ok) { E.streak++; E.best = Math.max(E.best, E.streak); E.done[E.lv]++; $('ebig').innerHTML = `✅ Perfect echo! ${E.done[E.lv] === 3 && E.lv < LEVELS.length - 1 ? 'Level star earned. Try the next level!' : 'Press Listen for another.'}`; $('bird').src = BIRD.sing; bob(); }
        else { E.streak = 0; $('ebig').innerHTML = `Close! The robin sang <b>${E.pat.map(sylName).join(' ')}</b>. Hear it again and try once more.`; }
        score();
        if (ok && E.done[E.lv] === 3) document.querySelector(`[data-lv="${E.lv}"]`).textContent = `${E.lv + 1}. ${LEVELS[E.lv].name} ⭐`;
      }, 350);
    }
  }

  // ---------- Finish the tune ----------
  // Phrases from public domain folk songs, in do-based numbers (0 = do ... 7 = high do), null = rest.
  const SONGS = [
    {name: 'Hot Cross Buns', notes: [2, 1, 0, null, 2, 1, 0, null, 0, 0, 1, 1, 2, 1], end: 0, opts: [0, 1, 4], ask: 'answer'},
    {name: 'Mary Had a Little Lamb', notes: [2, 1, 0, 1, 2, 2, 2, null, 1, 1, 2, 1], end: 0, opts: [0, 2, 4], ask: 'answer'},
    {name: 'Twinkle, Twinkle (first line)', notes: [0, 0, 4, 4, 5, 5], end: 4, opts: [0, 4, 6], ask: 'question'},
    {name: 'Twinkle, Twinkle (second line)', notes: [3, 3, 2, 2, 1, 1], end: 0, opts: [0, 1, 4], ask: 'answer'},
    {name: 'Row, Row, Row Your Boat', notes: [7, 7, 7, 4, 4, 4, 2, 2, 2, 0, 0, 0, 4, 3, 2, 1], end: 0, opts: [0, 1, 6], ask: 'answer'},
    {name: 'Ode to Joy', notes: [2, 2, 3, 4, 4, 3, 2, 1, 0, 0, 1, 2], end: 1, opts: [0, 1, 3], ask: 'question'},
    {name: 'Ode to Joy (answer)', notes: [2, 2, 3, 4, 4, 3, 2, 1, 0, 0, 1, 2, 1, 0], end: 0, opts: [0, 1, 2], ask: 'answer'},
    {name: 'Frère Jacques', notes: [0, 1, 2, 0, 0, 1, 2, 0, 2, 3, 4, null, 2, 3], end: 4, opts: [0, 4, 6], ask: 'question'},
  ];
  const F = {i: 0, pick: null, res: []};
  const MAJ = SCALES.major.rows;
  function renderFinish() {
    const sg = SONGS[F.i], all = [...sg.notes, '?'], n = all.length, res = F.res[F.i];
    const okSet = sg.ask === 'answer' ? [0, 7] : [1, 2, 3, 4, 5, 6];
    view.innerHTML = `<div class="side" style="left:24px;top:86px;width:1120px;height:600px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">${sg.name}</h2>
          <div class="rounds">${SONGS.map((s, i) => `<span class="${i === F.i ? 'cur' : ''} ${F.res[i] === true ? 'ok' : F.res[i] === false ? 'no' : ''}">${i + 1}</span>`).join('')}</div>
        </div>
        <p style="font:700 20px/1.4 'Segoe UI',sans-serif;margin:10px 0">${sg.ask === 'answer' ? '🏠 This phrase should sound <b>finished</b>, like the end of a song. Which last note takes it home?' : '❓ This phrase should sound like a <b>question</b>: not finished yet, waiting for an answer. Which last note keeps it hanging?'}</p>
        <div class="grid" id="fgrid" style="grid-template-columns:54px repeat(${n},1fr);grid-template-rows:repeat(8,38px);margin:10px 0"></div>
        <div style="display:flex;gap:14px;justify-content:center;align-items:center;margin-top:16px">
          <button class="b" id="fplay">▶ Hear the phrase</button>
          <span style="font:800 18px 'Segoe UI',sans-serif">Try an ending:</span>
          ${sg.opts.map(o => `<button class="b" data-end="${o}" aria-pressed="${F.pick === o}" style="background:${F.pick === o ? '' : COL[MAJ[o][1]]};color:${F.pick === o ? '' : '#fff'}">${MAJ[o][1]}${o === 7 ? '′' : ''}</button>`).join('')}
          <button class="b go" id="lock" ${F.pick == null || res != null ? 'disabled' : ''}>✔ That's my ending</button>
        </div>
        <p class="big" id="fmsg" style="margin-top:16px">${res == null ? 'Tap each ending to hear the whole phrase with it.' : res ? '✅ Yes!' : '🤔 Listen again.'}</p>
        ${res != null ? `<div style="text-align:center"><button class="b red" id="fnext">${F.i < SONGS.length - 1 ? 'Next tune ▶' : 'Start over'}</button></div>` : ''}
      </div>`;
    birdAt(1170, 440, 230); $('bird').src = BIRD.sing; $('say').hidden = true;
    drawFGrid();
    $('fplay').onclick = () => playPhrase(F.pick);
    document.querySelectorAll('[data-end]').forEach(b => b.onclick = () => { F.pick = +b.dataset.end; renderFinish(); playPhrase(F.pick); });
    $('lock').onclick = () => {
      const ok = okSet.includes(F.pick); F.res[F.i] = ok; chime(ok);
      renderFinish();
      $('fmsg').innerHTML = ok ? (sg.ask === 'answer' ? `✅ Yes! Ending on <b>do</b> takes the tune home.` : `✅ Yes! Ending on <b>${MAJ[F.pick][1]}</b> leaves it hanging, like a question.`)
        : (sg.ask === 'answer' ? `🤔 Ending on <b>${MAJ[F.pick][1]}</b> sounds unfinished. The song really ends on <b>do</b>.` : `🤔 Ending on <b>do</b> sounds finished, but this phrase is a question. The song uses <b>${MAJ[sg.end][1]}</b>.`);
    };
    if ($('fnext')) $('fnext').onclick = () => { F.i = (F.i + 1) % SONGS.length; if (F.i === 0) F.res = []; F.pick = null; renderFinish(); playPhrase(null); };
  }
  function drawFGrid(ph = -1) {
    const sg = SONGS[F.i], all = [...sg.notes, F.pick == null ? '?' : F.pick], n = all.length;
    let h = '';
    for (let r = 7; r >= 0; r--) for (let c = -1; c < n; c++) {
      if (c < 0) { h += `<div class="rowlab" style="color:${COL[MAJ[r][1]]};font-size:17px">${MAJ[r][1]}</div>`; continue; }
      const v = all[c], on = v === r, last = c === n - 1, syl = MAJ[r][1];
      h += `<div class="cell ${on ? 'on' : ''} ${c === ph ? 'colph' : ''}" style="${on ? `background:${COL[syl]}` : last && v === '?' ? 'background:#ffe9a8' : ''};font-size:13px;display:grid;place-items:center">${on ? syl : last && v === '?' && r === 4 ? '<b style="font-size:22px;color:#b4532a">?</b>' : ''}</div>`;
    }
    $('fgrid').innerHTML = h;
  }
  async function playPhrase(end) {
    stopPlay(); const tok = ++playToken; const sg = SONGS[F.i], all = [...sg.notes, end];
    for (let c = 0; c < all.length; c++) {
      if (tok !== playToken) return;
      drawFGrid(c);
      const v = all[c];
      if (v != null) { note('C', MAJ[v][0], 0, c === all.length - 1 ? 1.2 : .4); bob(); }
      await wait(c === all.length - 2 ? 560 : 420);
    }
    if (tok === playToken) drawFGrid();
  }

  // ---------- keys ----------
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,select') || e.target.closest('.cell')) return;
    const n = +e.key;
    if (mode === 'echo' && n >= 1 && n <= 8) { const b = document.querySelector(`[data-bell="${BELLS[n - 1][0]}"]`); if (b && !b.disabled) bell(BELLS[n - 1][0]); }
    else if (mode === 'ladder' && n >= 1 && n <= 8) rung(n - 1);
    else if (mode === 'compose' && e.key === ' ') { e.preventDefault(); $('play').click(); }
  });

  if (!C.cells.some(v => v != null)) C.cells = [0, 1, 2, 0, 0, 1, 2, 0, 2, 3, 4, null, 2, 3, 4, null];
  setMode('compose');
  window.__mm = {C, E, F, SONGS, setMode, playMelody, newPattern, bell, surprise, renderFinish};
})();
</script>
