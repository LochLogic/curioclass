<style>
:root {

.quiet {background:transparent}

#app {height:100%;min-height:0}

.caption {padding:18px 17px;position:relative}

.reader-setting {position:relative;min-height:100%}

.reader-text {white-space:pre-line;font:21px/1.65 Georgia,serif;padding:24px 30px;margin:0}

label {font-size:12px;line-height:1.4;color:#cbd6df;display:block}

.field {display:flex;flex-direction:column;gap:4px}
.fact {font-size:12px;color:#d3e4dc;border-left:2px solid var(--brand);padding:7px 10px;background:#20312d}

.mark-tools {display:flex;gap:5px;align-items:center;flex-wrap:wrap}

.token {display:inline-flex;align-items:center;position:relative;vertical-align:middle;min-height:48px}

  padding:0 2px;color:inherit;font:inherit;line-height:1.55;border-radius:3px}

.overlay-token {display:inline-block;position:relative;white-space:nowrap;margin-right:.2em;padding:16px 2px 20px;line-height:1.5}
.actor-bar {position:absolute;top:0;left:-4px;color:var(--brand);font:700 22px Consolas,monospace;line-height:1}

<body>
<header>
  <h1>Monologue <span>Rehearsal</span><small>PREPARING AND PERFORMING A MONOLOGUE</small></h1>
  <button class="icon-btn" id="read">Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
</header>
<nav class="modebar" aria-label="Rehearsal modes">
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-choose" aria-pressed="true">Choose</button>
    <button id="m-prepare" aria-pressed="false" disabled>Prepare</button>
    <button id="m-rehearse" aria-pressed="false" disabled>Rehearse</button>
    <button id="m-perform" aria-pressed="false" disabled>Perform</button>
    <button id="m-compare" aria-pressed="false" disabled>Compare</button>
  </div>
  <span class="saved" id="saved">Work stays on this device</span>
</nav>
<main><div id="app"></div></main>
<footer>
  <p id="hint" class="hint" aria-live="polite"></p>
  <div class="privacy"><span class="privacy-brand">Curio Class · Grades 9-12<br></span>Work stays on this device</div>
</footer>
<dialog id="reader-dialog" aria-labelledby="reader-title"></dialog>
<dialog id="clear-dialog" aria-labelledby="clear-title" style="max-width:440px;height:240px">
  <div class="confirm-box">
    <h2 id="clear-title">Clear all saved work?</h2>
    <p>This removes every script plan, version, performance and reflection on this device.</p>
    <div class="confirm-actions">
      <button class="btn" id="cancel-clear">Keep work</button>
      <button class="btn danger" id="confirm-clear">Clear all</button>
    </div>
  </div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const D = "json:content";
  const ART = {
    viola:'art:mr-viola', marullus:'art:mr-marullus', helena:'art:mr-helena', hale:'art:mr-hale',
    panel:'art:mr-panel', class:'art:mr-class', young:'art:mr-young', community:'art:mr-community'
  };
  const TACTICS = [
    ['to beg','Lower, closer, smaller.'],
    ['to scold','Short sentences, hard consonants.'],
    ['to tease','Lift the ends of lines.'],
    ['to warn','Slow down on the danger word.'],
    ['to shame','Let silence do the work after the question.'],
    ['to charm','Smile into the vowels.'],
    ['to puzzle out','Let the thought arrive on the line, not before.'],
    ['to reassure','Warm and steady; no rush.'],
    ['to accuse','Point the words at one person.'],
    ['to confess',"Quiet, and don’t look away."],
    ['to rally','Build each line bigger than the last.'],
    ['to dare','Stillness, then a push.'],
    ['to mock','Copy their voice, then drop it.'],
    ['to plead','Reach with the voice and the hands.'],
    ['to comfort','Soften the ends of lines.'],
    ['to challenge','Lean in; make them answer.']
  ];
  const AUDIENCES = [
    ['panel','Audition panel',"Three strangers at a table. Say your name and the piece, then begin. They’re deciding."],
    ['class','Your class',"People who know you. Commit fully; they’ll notice if you hold back."],
    ['young','Younger students','Grade 6 visitors. Say who the character is and what just happened before you start.'],
    ['community','Community night','Families in a school theater. Speak to the back row.']
  ];
  const L = {
    welcomeChoose:'Tap a monologue to read it. Then tap Choose this one.',
    welcomeCirc:'Answer the six questions. Tap What the play says to check yourself.',
    scoreHow:'Tap between two words where your character changes tactics.',
    welcomeRehearse:'Tap Start, then say it out loud. Tap Next beat as you go.',
    singleRehearse:'Tap Start, then say the monologue aloud. To plan changes, open Prepare and Score.',
    breath:'Breathe out first. Then begin.',
    handHow:'Pick an audience and a version, then tap Hand to partner.',
    partnerHow:'Listen. Tap a word whenever you feel the actor change.',
    landed:'Every change you planned, they felt.',
    wantRead:'They heard exactly what you wanted.'
  };
  const KEY = 'curio-monologue-rehearsal';
  const fresh = () => ({choice:null, works:{}, performances:[]});
  const newBeat = () => ({tactic:6,pace:'middle',volume:'middle',body:'still'});
  const newVersion = () => ({marks:[],stress:[],pauses:[],beats:{0:newBeat()},closest:null});
  const newWork = () => ({circ:['','','','','',''],versions:[newVersion(),newVersion(),newVersion()]});
  let saved = fresh();
  let storageReady = true;
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && typeof raw.works === 'object' && Array.isArray(raw.performances)) saved = raw;
    if (saved.choice !== null && !D[saved.choice]) saved.choice = null;
  } catch {storageReady = false;}
  const state = {
    mode:'choose',tab:'circ',version:0,beat:0,word:null,running:false,startedAt:0,elapsed:0,
    phase:'setup',audience:0,flags:[],heardWant:null,otherWant:'',feeling:'',take:null,order:[],
    performance:saved.performances.length-1,sheet:false,reader:null
  };
  const esc = s => String(s).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const piece = () => D[saved.choice];
  const work = () => saved.works[saved.choice] || (saved.works[saved.choice] = newWork());
  const version = () => work().versions[state.version];
  const words = text => text.trim().split(/\s+/);
  const starts = v => [0,...v.marks.slice().sort((a,b) => a-b)];
  const selectedStart = () => starts(version())[Math.min(state.beat,starts(version()).length-1)];
  let toastTimer;
  let resizeTimer;
  function toast(text) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {$('toast').hidden = true;},4500);
  }
  function save() {
    try {
      localStorage.setItem(KEY,JSON.stringify(saved));
      storageReady = true;
      $('saved').textContent = 'Saved on this device';
    } catch {
      storageReady = false;
      $('saved').textContent = 'Could not save on this device';
      toast('Device storage is unavailable. Keep this page open to keep your work.');
    }
  }
  function hint(text) {$('hint').textContent = text;}
  function welcome() {
    if (state.reader !== null) return null;
    if (state.mode === 'choose') return ['welcomeChoose',{valid:() => state.reader === null}];
    if (state.mode === 'prepare' && state.tab === 'circ' && work().circ.every(x => !x)) {
      return ['welcomeCirc',{valid:() => state.tab === 'circ' && work().circ.every(x => !x)}];
    }
    if (state.mode === 'prepare' && state.tab === 'score') {
      return ['scoreHow',{valid:() => state.tab === 'score' && !version().marks.length}];
    }
    if (state.mode === 'rehearse' && !state.running) {
      const key = starts(version()).length === 1 ? 'singleRehearse' : 'welcomeRehearse';
      return [key,{valid:() => !state.running,needs:'#start'}];
    }
    if (state.mode === 'perform' && state.phase === 'setup') {
      return ['handHow',{valid:() => state.phase === 'setup',needs:'#hand'}];
    }
    if (state.mode === 'perform' && state.phase === 'partner' && !state.flags.length) {
      return ['partnerHow',{valid:() => state.phase === 'partner' && !state.flags.length}];
    }
    return null;
  }
  const V = Curio.voice({lines:L,scope:() => state.mode,hint:false,read:() => $('hint').textContent,welcome});
  function feedback() {Curio.tone(420,.045,.025,'sine');}
  function setMode(m) {
    if (m !== 'choose' && saved.choice === null) return;
    if (m === 'compare' && !saved.performances.length) return;
    V.hush();
    state.mode = m;
    state.running = false;
    state.sheet = false;
    if (m === 'perform') state.phase = 'setup';
    render();
    if (document.activeElement === document.body) $('m-'+m).focus({preventScroll:true});
    V.welcome();
    if (m === 'compare') compareVoice();
  }
  function navigation() {
    for (const m of ['choose','prepare','rehearse','perform','compare']) {
      const b = $('m-'+m);
      b.setAttribute('aria-pressed',state.mode === m);
      b.disabled = m === 'compare' ? !saved.performances.length : m !== 'choose' && saved.choice === null;
    }
  }
  function length(p) {
    const n = words(p.text).filter(w => w !== '[...]').length;
    const seconds = Math.round(n/150*60);
    return `${n} words · ~${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
  }
  function title(p=piece()) {
    return `<div class="script-head"><img class="setting-strip" src="${ART[p.id]}" alt="Painted ${esc(p.name)} setting">
      <div class="script-title"><span class="eyebrow">${esc(p.play)}</span><h2>${esc(p.name)}</h2>
      <small>${esc(p.author)} · ${p.year}</small></div></div>`;
  }
  function versionButtons() {
    return `<div class="versions" role="group" aria-label="Version">${['A','B','C'].map((x,i) =>
      `<button class="btn" data-version="${i}" aria-label="Version ${x}" aria-pressed="${state.version === i}">
      <span class="version-long">Version </span>${x}</button>`).join('')}</div>`;
  }
  function setVersion(i) {
    state.version = i;
    state.word = null;
    state.beat = Math.min(state.beat,starts(version()).length-1);
    feedback();
    render();
    document.querySelector(`[data-version="${i}"]`)?.focus({preventScroll:true});
    if (state.mode === 'rehearse' && state.running) scrollBeat();
  }
  function wireVersions() {
    document.querySelectorAll('[data-version]').forEach(b => {
      b.onclick = () => setVersion(Number(b.dataset.version));
    });
  }
  function choose() {
    hint(L.welcomeChoose);
    $('app').innerHTML = `<section class="choose"><div class="intro"><div><span class="eyebrow">The actor’s studio / 01</span>
      <h2>Whose words will you make your own?</h2></div><p>Four speeches. Your choices. One real listener.
      <br>Open a setting to read the full monologue.</p></div>
      <div class="cards">${D.map((p,i) => `<button class="piece" id="piece-${i}" aria-label="Read ${esc(p.name)}, ${esc(p.play)}">
      <div class="paint"><img src="${ART[p.id]}" alt="${esc(p.id === 'viola' ? 'A sunlit seaside street with a gold ring on cobbles' :
        p.id === 'marullus' ? 'A Roman street strewn with flowers' : p.id === 'helena' ? 'An Athenian palace garden at dusk' :
        'A cold farmhouse kitchen with bread and preserves')}"><span class="piece-number">0${i+1}</span></div>
      <div class="caption"><h3>${esc(p.name)}</h3><span class="play">${esc(p.play)}</span>
      <span class="credit">${esc(p.author)} · ${p.year}</span><span class="length">${length(p)}</span>
      <p>${esc(p.situation)}</p>${i === 3 ? `<small class="content-note">The play is about a woman held for her husband’s death;
      this speech is about loneliness and neighbors.</small>` : ''}
      <span class="open-label">Read the monologue ↗</span></div></button>`).join('')}</div></section>`;
    D.forEach((p,i) => {$('piece-'+i).onclick = () => openReader(i);});
  }
  function openReader(i) {
    V.hush();
    state.reader = i;
    const p = D[i];
    $('reader-dialog').innerHTML = `<div class="reader"><div class="reader-head"><h2 id="reader-title">${esc(p.name)}</h2>
      <button class="btn" id="close-reader">Close</button></div><div class="reader-body"><div class="reader-setting">
      <img src="${ART[p.id]}" alt="Painted setting for ${esc(p.name)}"></div><p class="reader-text">${esc(p.text)}</p></div>
      <div class="reader-foot"><p>${esc(p.play)} · ${esc(p.author)} · ${p.year}<br>${length(p)} at 150 words per minute</p>
      <button class="btn primary" id="choose-piece">Choose this one</button></div></div>`;
    hint('Read the monologue, then tap Choose this one. The student speaks the text aloud; Read speaks instructions only.');
    $('close-reader').onclick = () => $('reader-dialog').close();
    $('choose-piece').onclick = () => {
      saved.choice = i;
      work();
      save();
      $('reader-dialog').close();
      state.reader = null;
      state.version = 0;
      state.tab = 'circ';
      state.beat = 0;
      state.word = null;
      state.elapsed = 0;
      setMode('prepare');
    };
    $('reader-dialog').showModal();
    feedback();
  }
  $('reader-dialog').addEventListener('close',() => {
    const i = state.reader;
    state.reader = null;
    if (state.mode === 'choose') {
      hint(L.welcomeChoose);
      $('piece-'+i)?.focus({preventScroll:true});
    }
  });
  function tabs() {
    return `<div class="tabs" role="group" aria-label="Prepare tab">
      <button id="tab-circ" class="btn" aria-pressed="${state.tab === 'circ'}">Circumstances</button>
      <button id="tab-score" class="btn" aria-pressed="${state.tab === 'score'}">Score</button></div>`;
  }
  function prepare() {
    const scoring = state.tab === 'score';
    hint(scoring ? 'Tap a space dot to add a beat change. Tap a word, then Stress or Pause after; tap again to remove.' : L.welcomeCirc);
    const questions = ['Who am I?','Where am I?','When is it?','Who am I talking to?','What do I want?','What is in my way?'];
    const side = scoring ? scorePanel() : questions.map((q,i) => `<div class="field"><label>${q}
      <textarea id="circ-${i}" aria-label="${q}" maxlength="200" data-circ="${i}">${esc(work().circ[i])}</textarea></label>
      ${i < 4 ? `<details><summary>What the play says</summary><div class="fact">${esc(piece().facts[i])}</div></details>` : ''}</div>`).join('');
    $('app').innerHTML = `<section class="workspace"><div class="script-area">${title()}<div class="toolbar">
      ${versionButtons()}${scoring ? [0,1,2].filter(i => i !== state.version).map(i =>
        `<button class="btn copy" data-copy="${i}">Copy ${'ABC'[state.version]} to ${'ABC'[i]}</button>`).join('') : ''}</div>
      <div class="script-scroll" id="script-scroll">${scoring ? scoreScript() : `<p class="plain-text">${esc(piece().text)}</p>`}</div></div>
      <aside class="side ${scoring ? 'score-side' : 'circ-side'} ${state.sheet ? 'sheet-open' : ''}" id="prepare-side">
      ${tabs()}${side}</aside></section>`;
    $('tab-circ').onclick = () => changeTab('circ');
    $('tab-score').onclick = () => changeTab('score');
    wireVersions();
    if (scoring) wireScore();
    else document.querySelectorAll('[data-circ]').forEach(el => {
      el.oninput = () => {
        work().circ[Number(el.dataset.circ)] = el.value;
        save();
        V.dropQueued(x => x.key === 'welcomeCirc');
      };
    });
  }
  function changeTab(t) {
    V.hush();
    state.tab = t;
    state.sheet = false;
    feedback();
    prepare();
    V.welcome();
    $('tab-'+t).focus({preventScroll:true});
  }
  function scoreScript() {
    let i = 0;
    const v = version();
    return `<div class="script score-script" id="score-script">${piece().text.split('\n').map(line =>
      `<span class="verse">${words(line).map(w => {
        const n = i++;
        return `<span class="token">${n ? `<button class="gap ${v.marks.includes(n) ? 'marked' : ''}" id="gap-${n}" data-gap="${n}"
          tabindex="-1" aria-label="${v.marks.includes(n) ? 'Remove' : 'Add'} beat change before ${esc(w)}"
          aria-pressed="${v.marks.includes(n)}"></button>` : ''}
          <button class="word ${v.stress.includes(n) ? 'stress' : ''} ${state.word === n ? 'selected' : ''}" id="word-${n}" data-word="${n}"
          tabindex="${n === 0 ? 0 : -1}" aria-label="Mark word ${n+1}, ${esc(w)}" aria-pressed="${state.word === n}">${esc(w)}</button>
          <span class="pause" id="pause-${n}" ${!v.pauses.includes(n) ? 'hidden' : ''}>//</span></span>`;
      }).join('')}</span>`).join('')}</div>`;
  }
  function options(list, value) {
    return list.map((x,i) => `<option value="${typeof value === 'number' ? i : esc(x)}"
      ${value === i || value === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
  }
  function scorePanel() {
    const v = version();
    const list = starts(v);
    state.beat = Math.min(state.beat,list.length-1);
    const start = selectedStart();
    const b = v.beats[start] || (v.beats[start] = newBeat());
    return `<button class="btn sheet-trigger primary" id="open-sheet">${state.sheet ? 'Close beat sheet' : 'Edit beat '+(state.beat+1)+' / marks'}</button>
      <div class="score-fields"><span class="eyebrow">Version ${'ABC'[state.version]} / actor’s score</span>
      <div><span class="selected-word" id="selected-word">${state.word === null ? 'Tap a word to mark it' : esc(words(piece().text)[state.word])}</span>
      <div class="mark-tools"><button class="btn" id="stress" ${state.word === null ? 'disabled' : ''}>Stress</button>
      <button class="btn" id="pause" ${state.word === null ? 'disabled' : ''}>Pause after</button>
      <button class="btn" id="clear-marks">Clear marks</button></div></div>
      <div class="beat-editor"><h3 id="beat-heading">BEAT ${state.beat+1} / ${list.length}</h3>
      <label class="full">Tactic<select id="tactic">${options(TACTICS.map(x => x[0]),b.tactic)}</select></label>
      <label>Pace<select id="pace">${options(['slow','middle','fast'],b.pace)}</select></label>
      <label>Volume<select id="volume">${options(['quiet','middle','full'],b.volume)}</select></label>
      <label class="full">Body<select id="body">${options(['still','move toward','move away','sit','stand','turn away'],b.body)}</select></label>
      </div><div class="beat-list" aria-label="Beats">${list.map((s,i) => `<button class="beat-row" data-beat="${i}" aria-pressed="${state.beat === i}">
      <b>${String(i+1).padStart(2,'0')}</b> ${esc(TACTICS[(v.beats[s] || newBeat()).tactic][0])}
      <small>word ${s+1}</small></button>`).join('')}</div>
      <label>Want, in your words<input id="want" aria-label="Want, in your words" maxlength="200" value="${esc(work().circ[4])}"></label>

  }
  function drawBrackets() {
    if (state.mode !== 'compare' || !$('brackets')) return;
    const p = currentPerformance();
    const parent = $('overlay-script').getBoundingClientRect();
    const paths = match(p.plan.marks,p.flags).pairs.map(pair => {
      const a = $('overlay-'+pair.mark).getBoundingClientRect();
      const b = $('overlay-'+pair.flag).getBoundingClientRect();
      const x1 = a.left-parent.left+3;
      const x2 = b.left-parent.left+b.width/2;
      const y1 = a.top-parent.top+3;
      const y2 = b.bottom-parent.top-3;
      if (Math.abs(a.top-b.top) < 8) {
        const y = Math.max(a.bottom,b.bottom)-parent.top+3;
        return `<path d="M ${x1} ${a.bottom-parent.top-3} V ${y} H ${x2} V ${y2}"/>`;
      }
      return `<path d="M ${x1-5} ${y1} h -5 v -5 h 12 M ${x2-5} ${y2} v 5 h 10 v -5"/>`;
    });
    $('brackets').innerHTML = paths.join('');
  }
  function render() {
    navigation();
    if (state.mode === 'choose') choose();
    if (state.mode === 'prepare') prepare();
    if (state.mode === 'rehearse') rehearse();
    if (state.mode === 'perform') perform();
    if (state.mode === 'compare') compare();
  }
  for (const m of ['choose','prepare','rehearse','perform','compare']) {
    $('m-'+m).onclick = () => {
      if (state.mode === m) V.welcome();
      else setMode(m);
    };
  }
  $('cancel-clear').onclick = () => $('clear-dialog').close();
  $('confirm-clear').onclick = () => {
    V.hush();
    saved = fresh();
    try {localStorage.removeItem(KEY);} catch {}
    state.performance = -1;
    state.version = 0;
    state.beat = 0;
    state.word = null;
    state.tab = 'circ';
    $('clear-dialog').close();
    $('saved').textContent = 'Work stays on this device';
    setMode('choose');
  };
  document.addEventListener('keydown',event => {
    if (state.mode !== 'rehearse' || event.code !== 'Space' || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
    event.preventDefault();
    if (event.repeat) return;
    if (!state.running) $('start').click();
    else moveBeat(event.shiftKey ? -1 : 1);
  });
  addEventListener('resize',() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.mode === 'compare') drawBrackets();
      if (state.mode === 'rehearse' && state.running) scrollBeat();
    },80);
  });
  Curio.init({clips:"voice:*",rate:.88,readFallback:() => $('hint').textContent});
  window.__tool = {
    state,setMode,allLines:V.allLines,vlog:V.log,match,
    get data() {return saved;}, get content() {return D;}, get vq() {return V.queue;},
    get heard() {return [...V.said];}
  };
  render();
  if (!storageReady) toast('Saved work could not be read. This session is still available while the page stays open.');
})();
</script>
</body>
</html>
