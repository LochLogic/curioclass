:root{

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--brand);color:#eef7f8}
h1{margin:0 auto 0 0;font:700 clamp(21px,2.6vw,29px)/1.1 'Segoe UI',system-ui,sans-serif}

.icon-btn[aria-pressed="true"]{background:var(--accent);color:#2a1a00;border-color:var(--accent)}

.stagewrap{position:relative;overflow:hidden;min-height:0}

.top{position:absolute;left:24px;right:24px;top:18px;display:flex;align-items:center;gap:14px}

.tabs button{border:0;background:transparent;min-height:48px;padding:0 22px;font-weight:700;font-size:17px;color:var(--muted)}

.top .hint{margin-left:auto;font-size:15px;color:var(--muted)}

.card{position:absolute;background:var(--card);border-radius:18px;box-shadow:0 1px 0 #0001,0 10px 26px #1c2a2e18;border:1px solid var(--line)}
.card h2{margin:0;font:800 13px 'Segoe UI',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* a hand drawing */
.hand{display:block;width:100%;height:100%;color:var(--hand)}
.mirror .hand{transform:scaleX(-1)}

.grid{left:24px;top:84px;width:780px;height:612px;padding:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-content:start}
.tile{position:relative;border:2px solid var(--line);background:#fff;border-radius:14px;height:136px;padding:8px 8px 26px;display:block}
.tile:hover{border-color:#8fb3bb}
.tile[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px #1f556333;background:#f4fafa}

.tile b{position:absolute;left:0;right:0;bottom:4px;font:800 18px/1 'Segoe UI',sans-serif}
.detail{left:824px;top:84px;width:432px;height:612px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.detail .big{height:262px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#fff,#eef4f3);border-radius:14px;padding:16px;position:relative}
.detail .big .hand{max-width:300px}
.detail .letter{position:absolute;left:14px;top:8px;font:900 64px/1 'Segoe UI',sans-serif;color:var(--brand)}
.detail p{margin:0;font-size:18px;line-height:1.45}
.detail .alike{display:flex;gap:8px;flex-wrap:wrap}
.detail .alike button{border:2px solid var(--line);background:#fff;border-radius:12px;width:62px;height:74px;padding:4px 4px 18px;position:relative}
.detail .alike button b{position:absolute;left:0;right:0;bottom:2px;font:800 14px 'Segoe UI',sans-serif}
.detail .note{font-size:15.5px;color:var(--muted)}

.window .frame{position:absolute;left:150px;top:40px;width:320px;height:360px}

.strip span.on{background:var(--brand);color:#fff}
.strip span.gap{background:transparent;min-width:18px}
.strip.hide span:not(.gap){color:transparent}
.strip.hide span.on{color:transparent}

.side{top:84px;bottom:24px;width:282px;padding:16px;display:flex;flex-direction:column;gap:12px}
.side.l{left:24px}.side.r{right:24px;left:auto}
.side p{margin:0;font-size:16px;line-height:1.45}
.side label{font-weight:700;font-size:15px}
.field{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:0 14px;font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#fff}
.field:focus{border-color:var(--brand);outline:none}
.btn{border:0;border-radius:12px;min-height:50px;padding:0 18px;font-weight:800;font-size:17px;background:var(--brand);color:#fff}
.btn.soft{background:#e4ecea;color:var(--ink)}
.btn.warm{background:var(--accent);color:#2a1a00}

.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}

.check{display:flex;align-items:center;gap:8px;font-size:15.5px}
.check input{width:20px;height:20px}
.tips{margin:0;padding-left:20px;font-size:15px;line-height:1.45;color:var(--ink)}
.tips li{margin-bottom:4px}
.under{left:330px;top:570px;width:620px;height:126px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.say{border-radius:12px;padding:10px 14px;font-size:17px;line-height:1.4;background:#e5f3ea;border-left:5px solid var(--good)}

.say:empty{display:none}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.choices button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:#fff;font:900 30px 'Segoe UI',sans-serif}
.choices button:hover:not(:disabled){border-color:var(--brand)}
.choices button.right{background:#e5f3ea;border-color:var(--good)}
.choices button.wrong{background:#f8e7e3;border-color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats span{background:#eef4f3;border-radius:12px;padding:8px 10px;font:800 24px/1.1 'Segoe UI',sans-serif}
.stats small{display:block;font:700 11.5px 'Segoe UI',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meter{height:12px;border-radius:6px;background:#e4ecea;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent));border-radius:6px;transition:width .4s}
.calm .window .layer{transition:none}

    const g = alikeFor(pick);
    $('grid').innerHTML = LETTERS.map(c => `<button class="tile${g && g[0].includes(c) && c !== pick ? ' look' : ''}" aria-pressed="${c === pick}" data-c="${c}" aria-label="Letter ${c}">${SVG[c]}<b>${c}</b></button>`).join('');
    $('grid').querySelectorAll('.tile').forEach(t => t.onclick = () => { pick = t.dataset.c; drawGrid(); drawDetail(); SFX.tick(); });
  }
  function drawDetail() {
    const g = alikeFor(pick);
    $('detail').innerHTML = `<h2>Letter ${pick}</h2>
      <div class="big"><span class="letter">${pick}</span>${SVG[pick]}</div>
      <p>${HOW[pick]}</p>
      ${'JZ'.includes(pick) ? '<p class="note">This letter moves. The arrow shows the path.</p>' : ''}
      ${g ? `<h2>Looks like</h2><div class="alike">${g[0].split('').filter(c => c !== pick).map(c => `<button data-c="${c}" aria-label="Letter ${c}">${SVG[c]}<b>${c}</b></button>`).join('')}</div><p class="note">${g[1]}</p>` : ''}`;
    $('detail').querySelectorAll('.alike button').forEach(b => b.onclick = () => { pick = b.dataset.c; drawGrid(); drawDetail(); SFX.tick(); });
  }
  document.addEventListener('keydown', e => {
    if (mode !== 'abc' || e.target.tagName === 'INPUT') return;
    const k = e.key.toUpperCase();
    if (LETTERS.includes(k)) { pick = k; drawGrid(); drawDetail(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      pick = LETTERS[(LETTERS.indexOf(pick) + (e.key === 'ArrowRight' ? 1 : 25)) % 26]; drawGrid(); drawDetail();
    }
  });

  // ---------- the signing window ----------
  // The hand stays in one place and the shape changes. A double letter slides a little to the side.
  let front = 'la', run = 0;
  function showHand(c, slide) {
    const back = front === 'la' ? 'lb' : 'la', nb = $(back), nf = $(front);
    nb.innerHTML = c ? SVG[c] : '';
    nb.style.transform = slide && !reduce ? 'translateX(34px)' : 'none';
    nb.style.opacity = 1; nf.style.opacity = 0;
    front = back;
  }
  function clearHand() { $('la').innerHTML = ''; $('lb').innerHTML = ''; }
  function drawStrip(word, on, hide) {
    $('strip').className = 'strip' + (hide ? ' hide' : '');
    $('strip').innerHTML = word.split('').map((c, i) => c === ' ' ? '<span class="gap"></span>' : `<span class="${i === on ? 'on' : ''}">${c}</span>`).join('');
  }
  // spell a word at lps letters per second. Each new call cancels the one before.
  async function spell(word, lps, {hide = false, onLetter} = {}) {
    const me = ++run, ms = 1000 / lps;
    $('window').style.setProperty('--fade', Math.round(Math.min(110, ms * .28)) + 'ms');
    $('cue').textContent = '';
    clearHand(); drawStrip(word, -1, hide);
    await wait(350);
    for (let i = 0; i < word.length; i++) {
      if (me !== run) return false;
      const c = word[i];
      if (c === ' ') { showHand(null); drawStrip(word, -1, hide); await wait(ms * 1.6); continue; }
      showHand(c, i > 0 && word[i - 1] === c && !(i > 1 && word[i - 2] === c));
      drawStrip(word, i, hide);
      onLetter && onLetter(i);
      await wait(c === 'J' || c === 'Z' ? ms * 1.5 : ms);  // the moving letters take a little longer
    }
    if (me !== run) return false;
    await wait(ms * .8);  // hold the last letter, then rest
    if (me !== run) return false;
    drawStrip(word, -1, hide);
    return true;
  }
  const stop = () => { run++; };

  // ---------- Spell it ----------
  const sp = {word: 'HELLO', speed: 0, loop: false, hide: false, playing: false};
  function spellPanels() {
    $('left').innerHTML = `<h2>Spell it</h2>
      <label for="word">Type a word or a name</label>
      <input class="field" id="word" maxlength="24" autocomplete="off" spellcheck="false" value="${sp.word}">
      <button class="btn" id="go">▶ Fingerspell it</button>
      <label>Speed</label>
      <div class="seg" id="speeds">${SPEEDS.map(([n], i) => `<button aria-pressed="${i === sp.speed}" data-i="${i}">${n}</button>`).join('')}</div>
      <label class="check"><input type="checkbox" id="loop"${sp.loop ? ' checked' : ''}> Keep repeating</label>
      <label class="check"><input type="checkbox" id="hideL"${sp.hide ? ' checked' : ''}> Hide the letters</label>
      <div style="flex:1"></div>
      <p style="color:var(--muted);font-size:14.5px">Try your own name, a friend's name, or your town.</p>`;
    $('right').innerHTML = `<h2>Fingerspelling tips</h2>
      <ul class="tips">
        <li>Use your <b>dominant hand</b>, held still beside your chin or shoulder, palm toward the viewer.</li>
        <li>Keep a <b>smooth, even rhythm</b>. Don't bounce on every letter.</li>
        <li><b>Double letters</b> (like the LL in HELLO) slide a little to the side, or bounce once.</li>
        <li>Don't say the letters out loud. Mouth the <b>whole word</b> if you like.</li>
        <li>Readers catch the <b>shape of the whole word</b>, not every single letter.</li>
        <li>Fingerspelling is for names, places and words without a sign. Most words have a sign of their own.</li>
      </ul>`;
    $('under').innerHTML = `<div class="row"><button class="btn soft" id="prev">◀ Letter</button><button class="btn soft" id="next">Letter ▶</button><button class="btn soft" id="stopB">■ Stop</button></div><div class="say" id="say"></div>`;
    const clean = v => v.toUpperCase().replace(/[^A-Z ]/g, '').replace(/ +/g, ' ').trimStart();
    $('word').oninput = e => { const v = clean(e.target.value); if (v !== e.target.value) e.target.value = v; };
    $('word').onkeydown = e => { if (e.key === 'Enter') play(); };
    $('go').onclick = play;
    $('speeds').querySelectorAll('button').forEach(b => b.onclick = () => { sp.speed = +b.dataset.i; spellPanels(); if (sp.playing) play(); });
    $('loop').onchange = e => { sp.loop = e.target.checked; };
    $('hideL').onchange = e => { sp.hide = e.target.checked; drawStrip(sp.word, -1, sp.hide); };
    $('prev').onclick = () => stepLetter(-1);
    $('next').onclick = () => stepLetter(1);
    $('stopB').onclick = () => { stop(); sp.playing = false; tell(''); };
  }
  let stepAt = -1;
  function stepLetter(d) {
    stop(); sp.playing = false;
    const w = sp.word.trim();
    if (!w) return;
    let i = stepAt;
    do { i = Math.max(0, Math.min(w.length - 1, i + d)); } while (w[i] === ' ' && i > 0 && i < w.length - 1);
    stepAt = i;
    $('window').style.setProperty('--fade', '90ms');
    showHand(w[i], i > 0 && w[i - 1] === w[i]); drawStrip(w, i, sp.hide);
    tell(`<b>${w[i]}</b>: ${HOW[w[i]]}`);
  }
  async function play() {
    const w = ($('word').value || '').trim();
    if (!w) { tell('Type a word first.', true); return; }
    sp.word = w; sp.playing = true; stepAt = -1;
    tell(`Fingerspelling at ${SPEEDS[sp.speed][1]} letters a second.`);
    for (;;) {
      const done = await spell(w, SPEEDS[sp.speed][1], {hide: sp.hide});
      if (!done) return;
      if (!sp.loop) { sp.playing = false; break; }
      clearHand(); await wait(700);
      if (!sp.playing) return;
    }
  }

  // ---------- Read it ----------
  const rd = {level: 'short', lps: 1.5, word: '', score: 0, streak: 0, best: 0, tries: 0, state: 'idle', last: []};
  try { rd.best = +localStorage.getItem('fingerspell-flash-best') || 0; } catch {}
  function readPanels() {
    $('left').innerHTML = `<h2>Read it</h2>
      <label>What to read</label>
      <div class="seg" style="flex-direction:column" id="levels">${LEVELS.map(([k, n]) => `<button aria-pressed="${k === rd.level}" data-k="${k}">${n}</button>`).join('')}</div>
      <div style="flex:1"></div>
      <p style="font-size:15px;color:var(--muted)">Each right answer speeds up the next word. A miss slows it down again.</p>`;
    $('levels').querySelectorAll('button').forEach(b => b.onclick = () => { rd.level = b.dataset.k; rd.streak = 0; readPanels(); nextWord(); });
    drawRight();
  }
  function drawRight() {
    const pct = Math.round((rd.lps - 1) / 5 * 100);
    $('right').innerHTML = `<h2>Your reading</h2>
      <div class="stats"><span><small>Read</small>${rd.score}</span><span><small>Streak</small>${rd.streak}</span>
      <span><small>Speed</small>${rd.lps.toFixed(2).replace(/0$/, '')}</span><span><small>Best speed</small>${rd.best ? rd.best.toFixed(2).replace(/0$/, '') : '-'}</span></div>
      <p style="font-size:14px;color:var(--muted)">Speed is in letters per second. Fluent signers fingerspell at about 5 or more.</p>
      <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div style="flex:1"></div>
      <h2>Reading tips</h2>
      <ul class="tips"><li>Watch the hand, not each letter. Let the word's shape come to you.</li><li>Missed one? Guess from the first and last letters and how long it was.</li></ul>`;
  }
  function pickWord() {
    const list = WORDS[rd.level];
    let w;
    do { w = list[Math.floor(Math.random() * list.length)]; } while (rd.last.includes(w) && list.length > 6);
    rd.last = [w, ...rd.last].slice(0, Math.min(8, list.length - 1));
    return w;
  }
  async function nextWord() {
    stop();
    rd.word = pickWord(); rd.tries = 0; rd.state = 'watch';
    if (rd.level === 'letter') return nextLetter();
    $('under').innerHTML = `<div class="row"><input class="field" id="guess" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Type what you saw" aria-label="The word you saw" style="flex:2">
      <button class="btn" id="checkB">Check</button></div>
      <div class="row"><button class="btn soft" id="replay">↻ Watch again</button><button class="btn soft" id="skip">Show me</button></div>`;
    const g = $('guess');
    g.oninput = () => { const v = g.value.toUpperCase().replace(/[^A-Z]/g, ''); if (v !== g.value) g.value = v; };
    g.onkeydown = e => { if (e.key === 'Enter') checkWord(); };
    $('checkB').onclick = checkWord;
    $('replay').onclick = () => watchIt();
    $('skip').onclick = () => reveal(false);
    $('count').textContent = `${rd.word.length} letters`;
    await watchIt();
  }
  async function watchIt() {
    $('cue').textContent = '';
    const ok = await spell(rd.word, rd.lps, {hide: true});
    if (ok && rd.state === 'watch') { clearHand(); $('cue').textContent = 'What did you see?'; $('guess') && $('guess').focus({preventScroll: true}); }
  }
  function checkWord() {
    if (rd.state !== 'watch') return;
    const g = ($('guess').value || '').trim();
    if (!g) return;
    if (g === rd.word) {
      rd.state = 'done'; rd.score++; rd.streak++;
      const at = rd.lps;
      if (rd.tries === 0) rd.lps = Math.min(6, rd.lps + .25);
      if (at > rd.best) { rd.best = at; try { localStorage.setItem('fingerspell-flash-best', at); } catch {} }
      SFX.good(); drawStrip(rd.word, -1, false); $('cue').textContent = '';
      $('under').innerHTML = `<div class="say">Yes! <b>${rd.word}</b>, read at ${at.toFixed(2).replace(/0$/, '')} letters a second.${rd.tries ? '' : ' The next one comes a little faster.'}</div><div class="row"><button class="btn" id="nextB">Next word →</button></div>`;
      $('nextB').onclick = nextWord; $('nextB').focus({preventScroll: true});
      drawRight();
    } else {
      rd.tries++; SFX.miss();
      if (rd.tries >= 2) return reveal(true, g);
      $('guess').value = '';
      $('cue').textContent = `Not ${g}. Watch once more.`;
      watchIt();
    }
  }
  async function reveal(missed, g) {
    rd.state = 'done'; rd.streak = 0;
    rd.lps = Math.max(1, rd.lps - .25);
    $('cue').textContent = '';
    $('under').innerHTML = `<div class="say warn">It was <b>${rd.word}</b>${g ? ` (you typed ${g})` : ''}. Here it is again, slowly, with the letters.</div><div class="row"><button class="btn" id="nextB">Next word →</button></div>`;
    $('nextB').onclick = nextWord;
    drawRight();
    await spell(rd.word, 1, {hide: false});
  }
  // one letter: see a handshape, pick its letter from four that look alike
  function nextLetter() {
    $('count').textContent = '';
    const c = rd.word, g = alikeFor(c);
    const pool = (g ? g[0].split('') : []).filter(x => x !== c).sort(() => Math.random() - .5);
    while (pool.length < 3) { const x = LETTERS[Math.floor(Math.random() * 26)]; if (x !== c && !pool.includes(x)) pool.push(x); }
    const opts = [c, ...pool.slice(0, 3)].sort(() => Math.random() - .5);
    $('window').style.setProperty('--fade', '90ms');
    showHand(c); drawStrip('', -1); $('cue').textContent = '';
    $('under').innerHTML = `<div class="choices" id="choices">${opts.map(x => `<button data-c="${x}">${x}</button>`).join('')}</div><div class="say" id="say" style="font-size:15.5px"></div>`;
    $('choices').querySelectorAll('button').forEach(b => b.onclick = () => {
      if (rd.state !== 'watch') return;
      if (b.dataset.c === c) {
        rd.state = 'done'; rd.score++; rd.streak++; SFX.good();
        b.classList.add('right'); drawStrip(c, 0, false);
        tell(`Yes, ${c}. ${HOW[c]}`);
        drawRight();
        setTimeout(() => { if (mode === 'read' && rd.level === 'letter' && rd.word === c) nextWord(); }, 1800 + 40 * HOW[c].length);
      } else {
        rd.tries++; rd.streak = 0; SFX.miss();
        b.classList.add('wrong'); b.disabled = true;
        tell(`That's ${b.dataset.c}: ${HOW[b.dataset.c]}`, true);
        drawRight();
      }
    });
  }

  function tell(html, warn) { const s = $('say'); if (!s) return; s.className = 'say' + (warn ? ' warn' : ''); s.innerHTML = html; }

  // ---------- modes ----------
  let mode = 'abc';
  function setMode(m) {
    stop(); sp.playing = false; mode = m;
    ['abc', 'spell', 'read'].forEach(k => $('t-' + k).setAttribute('aria-pressed', k === m));
    $('abc').hidden = m !== 'abc'; $('watch').hidden = m === 'abc';
    clearHand(); $('cue').textContent = ''; $('count').textContent = ''; drawStrip('', -1);
    if (m === 'abc') { $('hint').textContent = 'Tap a letter, or press any letter key.'; drawGrid(); drawDetail(); }
    else if (m === 'spell') {
      $('hint').textContent = 'Shown as you see a signer facing you.';
      spellPanels(); showHand(sp.word[0]); drawStrip(sp.word, 0, sp.hide);
    } else { $('hint').textContent = 'Watch the hand, then type the word.'; readPanels(); nextWord(); }
  }
  $('t-abc').onclick = () => setMode('abc');
  $('t-spell').onclick = () => setMode('spell');
  $('t-read').onclick = () => setMode('read');

  // ---------- sound ----------
  let ctx, sound = true;
  const audio = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(f, dur, gain, when = 0, type = 'triangle') {
    if (!sound) return;
    const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    tick: () => tone(1100, .05, .03),
    good: () => { tone(659, .18, .07); tone(988, .3, .07, .1); },
    miss: () => tone(196, .25, .08, 0, 'sine'),
  };
  $('sound').onclick = e => {
    sound = !sound;
    e.currentTarget.setAttribute('aria-pressed', sound);
    e.currentTarget.textContent = sound ? '🔔 Sound' : '🔇 Sound';
  };

  window.__fs = {setMode, spell, sp, rd, play, nextWord, checkWord, SVG};  // for checking frames
  setMode('abc');
})();
</script>
</body>
</html>
