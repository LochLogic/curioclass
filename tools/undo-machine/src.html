<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undo Machine · Ride out, ride home · Curio Class</title>
<meta name="description" content="Send numbers out along a chain of machines, then build the undo chain that brings every one home. Feel why undoing runs in reverse order, and watch squaring and rounding crash two numbers into one until a gate fixes it. Grade 11 Algebra 2. Works offline.">
<!--
Undo Machine (Curio Class)
Grade 11, Algebra 2 / Functions, module "Building and Inverting Functions": F-BF.A.1c (compose functions), F-BF.B.4a
(write an inverse), F-BF.B.4b (verify by composition), F-BF.B.4c (read inverse values from a graph or table), F-BF.B.4d
(make a function invertible by restricting the domain), F-BF.B.5 (exponents and logs are inverses).
Students drive, on their own laptops. Workshop: build any forward chain and any undo chain and run eight test numbers
out along the top line and home along the bottom one. Puzzles: twelve locked chains to undo, gate or prove impossible.
The one idea: undoing goes in reverse order, and a machine that forgets something (square, absolute value, round)
crashes two numbers into one output until a gate on the input keeps the fold on one side of zero.
Facts: OpenStax Precalculus 2e, sections 1.4, 1.7 and 6.3 (CC BY 4.0); Common Core State Standards for Mathematics.
Puzzle answers checked by direct arithmetic. Machines, conveyors, tokens, gate, chute and graph drawn in code; no images.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<link rel="stylesheet" href="kit:theme-912">
<style>
/* copper accent: 6.8:1 on --panel, 6.4:1 on --sec-bg, --brand-ink on it 7.2:1 */
:root{--brand:#e98a4c;--brand-ink:#1c1203;--bad:#ff9d8a;--plate:#121922;--card:#1b2431;--card-2:#222d3c;--belt:#0a0f16;--halo:#0b1017}
body:not(.stack){height:100vh}
main{min-height:0;grid-template-columns:minmax(0,1fr) 360px}
.floorcol{order:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.panel{order:2;min-height:0}
.stage{flex:1;min-height:0;background:radial-gradient(ellipse at 40% 30%,#141d29,#0a0f16 75%)}
#fitbox,#fitboxC{position:relative;width:100%;height:100%}
.scene{width:1200px;height:560px}
#sceneC{width:760px;height:520px}
body.wide #fitboxC,body:not(.wide) #fitbox{display:none}
#fl{display:block;overflow:visible;touch-action:manipulation}
/* compact: verdict and tip ride in a bar under the floor; Run and the mode buttons sit in short rows above the parts */

body.compact .cbar .vdetail{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
body.compact .cctl{display:flex;flex-direction:column;gap:6px}
body.compact .cctl .btnrow:empty{display:none}
body.compact .cctl .big-btn{flex:1;min-width:76px;font-size:15px;padding:0 8px;border-radius:8px}
body.compact .cctl .btn{flex:1 1 auto;font-size:13px;padding:0 6px}
body.compact .cctl .btnrow{flex-wrap:nowrap;gap:5px}

body.compact #myNum{min-width:0;width:100%}
body.compact #runRow,body.compact #pzBtns,body.compact #toolBtns{display:none}
body.compact .ltitle{font-size:13px;margin:0}
body.compact .goal{font-size:13px}
.invv{display:none}

body.compact .formula .inv{display:none}
/* formula strip */
.formula{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:baseline;padding:8px 14px;background:var(--head-bg);border-bottom:1px solid var(--line);
  font:600 17px/1.35 var(--readout-font);min-height:44px}
.formula .fx{display:inline-flex;gap:8px;align-items:baseline;white-space:nowrap}
.formula .fx b{font-weight:700}
.formula .f1 b{color:var(--gr-1)} .formula .f2 b{color:var(--gr-2)}
.formula sup,.eqs sup,.vdetail sup{font:700 .78em/0 'Segoe UI',system-ui,sans-serif;vertical-align:.55em;margin-left:1px}
.formula .dom{color:var(--muted);font-weight:400}
.formula .inv{color:var(--ok);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;white-space:normal}

.sw{display:inline-block;width:26px;height:0;border-top:3px solid;vertical-align:middle;position:relative;top:-4px}
.sw1{border-color:var(--gr-1)} .sw2{border-color:var(--gr-2);border-top-style:dashed} .sw3{border-color:var(--gr-3);border-top-style:dotted} .sw4{border-color:var(--gr-4);border-top-style:dashed;border-top-width:2px}
/* layouts (layout() in script): wide = 1000 px or wider and 700 px or taller; compact = a short landscape box such as
   the 16:10 embed (680x425 to 1000x625), panel beside the floor; stack = narrow or portrait, panel under the floor */
body.compact main{grid-template-columns:minmax(0,1fr) clamp(248px,30vw,300px)}
body.compact header{padding:4px 10px;gap:6px;flex-wrap:nowrap}
body.compact h1{font-size:17px;white-space:nowrap}
body.compact h1 small{display:none}
body.compact .seg button,body.compact .icon-btn{min-height:44px;padding:0 9px;font-size:14px;white-space:nowrap}
body.compact .panel{padding:8px 10px;gap:8px}
body.compact .sec{padding:6px 9px}
body.compact .sec>h2{margin-bottom:4px}
body.compact .hint{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.compact .formula{font-size:14px;padding:4px 10px;gap:2px 14px;min-height:0}
body.compact .formula .inv{font-size:13px}
body.compact .btn{font-size:14px;padding:0 8px}
body.compact .big-btn{min-height:44px}
body.compact .levels{grid-template-columns:repeat(12,44px);overflow-x:auto;padding-bottom:4px}
body.compact .vword{font-size:16px}
body.compact .bin{max-height:none}
body.stack{height:auto}
body.stack main{grid-template-columns:minmax(0,1fr);align-content:start}
body.stack .panel{border-left:0;border-top:1px solid var(--line)}
body.stack .stage{flex:none;height:auto;min-height:0}
body.stack #fitboxC{height:auto;aspect-ratio:760/520}
body.compact .bin{grid-template-columns:repeat(2,minmax(0,1fr))}
body.compact .part{gap:4px;padding:4px 5px}
body.compact .part .ps{min-width:1.8em;font-size:15px}
body.compact .part .pn{font-size:12.5px}
body.compact #binNote{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){header{gap:8px}.seg button,.icon-btn{padding:0 11px;font-size:15px;min-height:46px}.formula{font-size:14px}}
/* panel */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{display:inline-flex}
.grp .btn{border-radius:0;margin-left:-1px}
.grp .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.grp .btn:last-child{border-radius:0 8px 8px 0}
.small{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.35}
.small:empty{display:none}
.verdict{display:flex;flex-direction:column;gap:4px}
.vlight{display:flex;align-items:center;gap:10px}
.vic{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--btn-line);font:700 18px 'Segoe UI',system-ui,sans-serif;color:var(--muted);flex:none}
.vword{font:700 18px 'Segoe UI',system-ui,sans-serif}
.verdict.ok .vic{background:var(--ok);border-color:var(--ok);color:#06210f}
.verdict.ok .vword{color:var(--ok)}
.verdict.lost .vic{background:var(--warn);border-color:var(--warn);color:#2b0c05}
.verdict.lost .vword{color:var(--warn)}
.verdict.cant .vic{background:transparent;border-color:var(--bad);color:var(--bad);border-width:3px}
.verdict.cant .vword{color:var(--bad)}
.verdict.none .vic{border-style:dashed}
.verdict.unsure .vic{border-color:var(--warn);color:var(--warn);border-style:dashed}
.verdict.unsure .vword{color:var(--warn)}
.vdetail{margin:0;font-size:14px;line-height:1.4;color:var(--ink)}
.vdetail:empty{display:none}
.vdetail .num{font-family:var(--readout-font);white-space:nowrap}
.runrow{display:flex;gap:8px}
.runrow .big-btn{flex:1}
.myrow{display:flex;gap:6px;align-items:center}
.myrow input.num{width:7em;flex:1;min-width:0}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.levels .btn{padding:0;font-family:var(--readout-font);position:relative}
.levels .btn .ck{color:var(--ok);font-family:'Segoe UI',sans-serif;margin-left:2px}
.levels .btn[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.levels .btn[aria-current="true"] .ck{color:#06331a}
.ltitle{margin:6px 0 2px;font:700 16px 'Segoe UI',system-ui,sans-serif}
.goal{margin:0;font-size:15px;line-height:1.4}
.gaterow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gval{font:700 17px var(--readout-font);min-width:2.6em;text-align:center}
.glabel{margin:6px 0 0;font:600 15px var(--readout-font);color:var(--brand)}
.edname{margin:0 0 6px;font-weight:600}
.bin{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.part{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 8px;border-radius:8px;border:1px solid var(--btn-line);background:var(--card);color:var(--ink);text-align:left;touch-action:pan-y;user-select:none}
.part .ps{font:700 17px var(--readout-font);min-width:2.3em;text-align:center;color:var(--brand)}
.part .pn{font-size:13.5px;line-height:1.15}
.part[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.part[aria-pressed="true"] .ps{color:var(--brand-ink)}
.part:hover{border-color:var(--muted)}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:translate(-50%,-50%);box-shadow:0 6px 18px #0008}
.panel .tip{border-left-color:var(--focus)}
#gv{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.eqs{list-style:none;margin:6px 0 6px;padding:0;font:14px/1.6 var(--readout-font)}
.eqs li{display:flex;gap:8px;align-items:center}
.mfail{margin:6px 0 0;font-size:14px;color:var(--bad);font-weight:600}
.mfail:empty{display:none}
#gv .gr-label.vlab{fill:var(--bad);font:700 12px 'Segoe UI',system-ui,sans-serif;paint-order:stroke;stroke:var(--halo);stroke-width:4px}
/* the floor (SVG) */
.dock{fill:#141c27;stroke:var(--line);stroke-width:2}
.docklab{fill:var(--ink);font:800 calc(16px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;letter-spacing:.12em;text-anchor:middle}
.subl{fill:var(--muted);font:600 calc(12px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;letter-spacing:.08em;text-anchor:middle}
.linelab{fill:var(--muted);font:700 calc(12px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;letter-spacing:.14em}
.belt{fill:var(--belt);stroke:#2a3546;stroke-width:1.5}
.chev{fill:none;stroke:#334256;stroke-width:2;stroke-dasharray:8 18}
.running .chev.f{animation:beltF 1s linear infinite}
.running .chev.u{animation:beltU 1s linear infinite}
@keyframes beltF{to{stroke-dashoffset:-26}}
@keyframes beltU{to{stroke-dashoffset:26}}
.chute{fill:none;stroke:#0a0f16;stroke-width:28;stroke-linecap:round}
.chute2{fill:none;stroke:#2a3546;stroke-width:2;stroke-dasharray:6 8}
.tray{fill:#10161f;stroke:var(--line);stroke-width:2;stroke-dasharray:7 5}

.traylab{fill:var(--warn);font:800 calc(14px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;letter-spacing:.12em}
.trayempty{fill:var(--muted);font:italic calc(14px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif}
.traytxt{fill:var(--ink);font:600 calc(14px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif}
.traytxt .v{font-family:var(--readout-font);font-weight:700;fill:var(--warn)}
.slot{fill:rgba(255,255,255,.015);stroke:rgba(255,255,255,.13);stroke-width:1.5;stroke-dasharray:6 6}
.slot.hot{stroke:var(--brand);stroke-opacity:.7}
.slottxt{fill:#95a2b4;font:600 calc(13px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.curbox{fill:none;stroke:var(--focus);stroke-width:4;stroke-dasharray:10 6;pointer-events:none}
.curtxt{fill:var(--focus);font:700 calc(14px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.card{cursor:pointer;outline:none}
.card .body{fill:var(--card);stroke:var(--btn-line);stroke-width:1.5}
.card.und .body{stroke-dasharray:7 4}
.card .acc{pointer-events:none}
.card.fwd .acc{fill:var(--gr-1)} .card.und .acc{fill:var(--gr-2)} .card.lap .acc{fill:var(--gr-1)}
.card .sym{fill:var(--ink);font:700 30px 'Segoe UI',system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.card.und .sym{font-size:25px}
.card .sym.w{font-size:22px}
.card .nm{fill:var(--muted);font:600 calc(13px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.card.und .nm{font-size:calc(11.5px * var(--ts,1))}
.card .cb rect{fill:var(--card-2);stroke:var(--btn-line);stroke-width:1}
.card .cb:hover rect{stroke:var(--ink)}
.card .cb text{fill:var(--ink);font:700 20px 'Segoe UI',system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.card .cb.x text{font-size:16px}
.card .ring{fill:none;stroke:transparent;stroke-width:4}
.card:focus-visible .ring{stroke:var(--focus)}
.card.sel .ring{stroke:var(--focus);stroke-dasharray:8 5}
.card:focus-visible.sel .ring{stroke-dasharray:none}
.card.locked .body{fill:#161d28;stroke-dasharray:none;stroke:#3b4859}
.card.locked .sym{fill:#b9c4d2}
.card .lock{fill:var(--muted);font:calc(12px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;text-anchor:middle}
.card.lap{opacity:.8}
.card.ghostcard .body{fill:transparent;stroke:var(--focus);stroke-dasharray:4 4}
.card.ghostcard .sym{fill:var(--focus)} .card.ghostcard .nm{fill:var(--focus)}
.rd{fill:var(--brand);font:700 calc(15px * var(--ts,1)) var(--readout-font);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:4px}
.gatepost{fill:#3b4859}
.gatebar{fill:var(--brand);stroke:var(--brand-ink);stroke-width:1}
.gatesign rect{fill:#1b2431;stroke:var(--brand);stroke-width:1.5}
.gatesign text{fill:var(--ink);font:700 calc(14px * var(--ts,1)) var(--readout-font);text-anchor:middle}
.coltxt{fill:var(--bad);font:700 calc(14px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;text-anchor:middle}
.coltxt .v{font-family:var(--readout-font)}
.colchip rect{fill:#2a1a17;stroke:var(--bad);stroke-width:2}
.colchip text{fill:var(--ink);font:700 calc(14px * var(--ts,1)) var(--readout-font);text-anchor:middle}
.colx{fill:var(--bad);font:800 13px 'Segoe UI',system-ui,sans-serif;text-anchor:middle;letter-spacing:.06em}
.tok{pointer-events:none}
.tok rect{fill:var(--brand);stroke:#0b1017;stroke-width:1.5}
.tok text.tv{fill:var(--brand-ink);font:700 calc(14px * var(--ts,1)) var(--readout-font);text-anchor:middle}
.tok.dim rect{fill:#2b323c;stroke:var(--muted);stroke-dasharray:4 3}
.tok.dim text.tv{fill:var(--muted)}
.tok.home rect{fill:var(--ok)}
.tok.home text.tv{fill:#06210f}
.tok.lost rect{fill:#3a2620;stroke:var(--warn)}
.tok.lost text.tv{fill:var(--warn)}

.rejtag{fill:var(--warn);font:700 calc(12px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:3px}
</style>

<body>
<header>
  <h1>Undo Machine <small>Ride out on top. Ride home on the bottom.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-workshop" aria-pressed="true">Workshop</button>
    <button id="m-puzzles" aria-pressed="false">Puzzles</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <aside class="panel" id="panel">
    <section class="sec" id="levelSec" hidden>
      <h2 id="lvH">Puzzles</h2>
      <div class="levels" id="levels" role="group" aria-labelledby="lvH"></div>
      <p class="ltitle" id="lTitle"></p>
      <p class="goal" id="goal"></p>
    </section>
    <p class="hint" id="hint"></p>
    <section class="sec verdict" id="verdictSec" aria-live="polite">
      <div class="vlight"><span class="vic" id="vIcon" aria-hidden="true">○</span><span class="vword" id="vWord">Not run yet</span></div>
      <p class="vdetail" id="vDetail"></p>
    </section>
    <div class="cctl" id="cctl"><div class="btnrow" id="cr1"></div><div class="btnrow" id="cr2"></div><div class="btnrow" id="cr3"></div><div class="btnrow" id="cr4"></div></div>
    <div class="runrow" id="runRow"><button class="big-btn" id="runBtn">▶ Run</button></div>
    <div class="myrow" id="myRow">
      <label class="sr" for="myNum">Your number</label>
      <input class="num" id="myNum" inputmode="decimal" autocomplete="off" placeholder="Number" aria-describedby="tip">
      <button class="btn" id="sendBtn" data-short="Send">Send my number</button>
    </div>
    <div class="btnrow" id="pzBtns" hidden>
      <button class="btn" id="hintBtn">Hint</button>
      <button class="btn" id="cantBtn">Can't be undone</button>
      <button class="btn" id="resetBtn" data-short="Reset">Reset puzzle</button>
      <button class="btn" id="nextBtn" data-short="Next" disabled>Next puzzle</button>
    </div>
    <div class="btnrow" id="toolBtns">
      <button class="btn" id="gateBtn" aria-pressed="false">Gate</button>
      <button class="btn" id="graphBtn" aria-pressed="false">Graph</button>
      <button class="btn" id="randBtn" data-short="Random">Random chain</button>
      <button class="btn" id="clearUBtn">Clear undo</button>
      <button class="btn" id="clearBtn">Clear all</button>
    </div>
    <p class="tip" id="tip" aria-live="polite"></p>
    <section class="sec" id="gateSec" hidden>
      <h2>Gate</h2>
      <div class="gaterow">
        <div class="grp" role="group" aria-label="Gate direction"><button class="btn" id="gGe" aria-pressed="true" aria-label="greater than or equal to">≥</button><button class="btn" id="gLe" aria-pressed="false" aria-label="less than or equal to">≤</button></div>
        <div class="grp" role="group" aria-label="Gate value"><button class="btn" id="gDec" aria-label="Gate value down">−</button><button class="btn" id="gInc" aria-label="Gate value up">+</button></div>
        <span class="gval" id="gVal" aria-hidden="true">0</span>
      </div>
      <p class="glabel" id="gLabel" aria-live="polite"></p>
    </section>
    <section class="sec" id="editSec" hidden>
      <h2>Selected machine</h2>
      <p class="edname" id="edName"></p>
      <div class="btnrow">
        <button class="btn" id="edDec" aria-label="Number down by 1">− 1</button><button class="btn" id="edInc" aria-label="Number up by 1">+ 1</button>
        <button class="btn" id="edL" aria-label="Move one slot left">◀</button><button class="btn" id="edR" aria-label="Move one slot right">▶</button>
        <button class="btn" id="edDel">✕ Remove</button>
      </div>
    </section>
    <section class="sec" id="binSec">
      <h2 id="binH">Parts</h2>
      <p class="small" id="binNote">Drag a part onto a slot, or tap it and then tap a slot. Keyboard: Enter lifts it, arrow keys pick a slot, Enter drops, Escape cancels.</p>
      <div class="bin" id="bin" role="group" aria-labelledby="binH"></div>
    </section>

    renderGraph();   // draws the full mirror; now morph it from f when Motion is on
    if (Curio.reduce) return;
    const t0 = performance.now(), ms = 1200;
    const stepM = () => {
      const p = Math.min(1, (performance.now() - t0) / ms), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      plane().clear('vl'); $('mFail').textContent = '';
      drawMirror(e);
      morph = p < 1 ? setTimeout(stepM, 16) : null;
    };
    stepM();
  };

  // ---------- modes ----------
  function setMode(m) {
    if (m === state.mode && document.body.dataset.ready) return;
    hush(); stopRun();
    state.mode = m; state.sel = null; state.lift = null; state.cursor = null;
    for (const k of ['workshop', 'puzzles']) $('m-' + k).setAttribute('aria-pressed', k === m);
    tip('');
    if (m === 'puzzles' && !state.pz.loaded) { state.pz.loaded = true; loadLevel(state.pz.level); }
    else edited();
    once(m === 'workshop' ? 'workshop-welcome' : 'puzzles-welcome');
    document.body.dataset.ready = 1;
  }
  $('m-workshop').onclick = () => setMode('workshop');
  $('m-puzzles').onclick = () => setMode('puzzles');
  addEventListener('keydown', e => { if (e.key === 'Escape' && state.lift) dropLift('Cancelled.'); });

  // Read: the goal (Puzzles) and the current verdict, else the hint
  function readNow() {
    const parts = [];
    if (isPz()) parts.push(`Puzzle ${state.pz.level}, ${lvl().title}. ${lvl().goal}`);
    const v = state.verdict;
    const det = $('vDetail').cloneNode(true); det.querySelectorAll('.invv').forEach(e => e.remove());
    if (v && v.kind !== 'idle') parts.push(VERD[v.kind].word + '. ' + sayNum(det.textContent));
    else if (!isPz()) parts.push($('hint').textContent);
    hush();
    const text = parts.map(p => p.replace(/≥/g, 'at least').replace(/≤/g, 'at most'));
    reading = capped(say(text, true), text.join(' ') + text.join(' '));
  }

  // every line the tool can say, so the voice scripts can record them (window.__tool.allLines())
  const allLines = () => [...new Set(Object.values(L))];

  // ---------- layout: wide, compact (short landscape boxes) or stack (narrow); see the CSS note ----------
  let curLayout = null;
  // compact moves the verdict and tip under the floor and gathers Run and the mode buttons in short rows; the other
  // layouts put every element back in its first place
  const ORIG = {};
  for (const id of ['panel', 'runRow', 'pzBtns', 'toolBtns']) ORIG[id] = [...$(id).children].map(e => e.id);
  const COMPACT = {cr1: ['runBtn', 'cantBtn'], cr2: ['hintBtn', 'resetBtn', 'nextBtn'], cr3: ['myRow'], cr4: ['gateBtn', 'graphBtn', 'randBtn', 'clearUBtn', 'clearBtn'], cbar: ['verdictSec', 'tip']};
  function layout() {
    const w = innerWidth, h = innerHeight;
    const k = w >= 1000 && h >= 700 ? 'wide' : w >= 600 && w / h >= 1.25 ? 'compact' : 'stack';
    if (k === curLayout) return;
    curLayout = k;
    for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === k);
    if (k === 'compact') { for (const box in COMPACT) COMPACT[box].forEach(id => $(box).appendChild($(id))); }
    else for (const box in ORIG) ORIG[box].forEach(id => id && $(box).appendChild($(id)));
    for (const b of document.querySelectorAll('[data-short]')) {
      if (!b.dataset.full) b.dataset.full = b.textContent;
      b.textContent = k === 'compact' ? b.dataset.short : b.dataset.full;
      if (k === 'compact') b.setAttribute('aria-label', b.dataset.full); else b.removeAttribute('aria-label');
    }
    applyGeo(k === 'wide' ? 'full' : 'compact');
  }
  // switch the floor design: the SVG moves into that design's scene box (each box is fitted by Curio.fit)
  function applyGeo(name) {
    if (G === GEO[name] && $('gBase').childNodes.length) return;
    G = GEO[name];
    const svg = $('fl');
    $(name === 'full' ? 'scene' : 'sceneC').appendChild(svg);
    svg.setAttribute('viewBox', `0 0 ${G.W} ${G.H}`);
    svg.style.width = G.W + 'px'; svg.style.height = G.H + 'px';
    drawBase();
    fitText();
    if (!document.body.dataset.ready) return;
    stopRun(); state.results = null; resetTokens(); idleVerdict(); render();
  }
  // floor text grows (up to 1.3 times) when the floor is drawn small
  function fitText() {
    const box = $(G === GEO.full ? 'fitbox' : 'fitboxC').getBoundingClientRect(), sc = Math.min(box.width / G.W, box.height / G.H);
    if (!sc) return;
    const ts = +Math.min(G.dyn ? 1.5 : 1.3, Math.max(1, .8 / sc)).toFixed(2);
    if (ts === TS) return;
    TS = ts; $('fl').style.setProperty('--ts', ts);
    if (!document.body.dataset.ready) return;
    render();
    if (runS) runS.toks.forEach(t => setTok(t, t.label)); else resetTokens();
  }
  layout();
  addEventListener('resize', layout);

  Curio.init({clips: "voice:*", rate: .95, readFallback: () => $('hint').textContent});
  $('read').onclick = readNow;
  Curio.fit('fitbox', 'scene', 1200, 560);
  Curio.fit('fitboxC', 'sceneC', 760, 520);
  const ro = new ResizeObserver(fitText); ro.observe($('fitbox')); ro.observe($('fitboxC'));

  // for checking frames
  window.__tool = {state, setMode, allLines, FM, LEVELS, fmtV, loadLevel, skipRun, render,
    place: (line, idx, p, a) => { const ok = place(line, idx, p); if (ok && a != null) { cur()[line][Math.min(idx, cur()[line].length - 1)].a = a; edited(); } return ok; },
    setLines(F, U) { const Lc = cur(); if (F) Lc.F = F.map(([p, a]) => item(p, a)); if (U) Lc.U = U.map(([p, a]) => item(p, a)); edited(); },
    setGate(on, dir = 'ge', c = 0) { Object.assign(cur().gate, {on, dir, c}); edited(); },
    run: () => startRun(TOKENS, false), send: n => { $('myNum').value = n; sendMine(); },
    verdict: () => ({kind: state.verdict.kind, word: $('vWord').textContent, detail: $('vDetail').textContent}),
    formula: () => $('formula').textContent, tray: () => $('gTray').textContent, solved: () => [...solved],
    tokens: () => runS ? runS.toks.map(t => ({x: t.x, label: t.label, tag: t.tag.textContent, cls: t.el.getAttribute('class')})) : [],
    graph(on = true) { if (state.graph !== on) $('graphBtn').click(); }, mirror() { $('mirrorBtn').click(); },
    hint: () => { $('hintBtn').click(); return $('tip').textContent; }, cant: () => { $('cantBtn').click(); return [$('tip').textContent, $('vDetail').textContent]; },
    tip: () => $('tip').textContent, spoken: () => [...said], queued: () => [...queued], last: () => Curio.last};
  setMode('workshop');
})();
</script>
</body>
