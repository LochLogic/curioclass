<body>
<header>
  <h1>Sound and<br>Picture Book <small>Same pictures. A different story.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-plan" aria-pressed="true">💡 Plan</button>
    <button id="m-make" aria-pressed="false">🖌 Make</button>
    <button id="m-play" aria-pressed="false">📖 Play</button>
    <button id="m-swap" aria-pressed="false">⇄ Swap</button>
  </div>
  <button class="icon-btn" id="read">🔊 Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<main>
  <div class="workspace" id="workspace"></div>
  <div class="bottom"><p class="hint" id="hint" aria-live="polite"></p><p class="privacy" id="save-status">Book stays on this device.</p></div>
</main>
<dialog id="chooser" aria-labelledby="dialog-title">
  <div class="dialog-head"><h2 id="dialog-title"></h2>
    <button id="dialog-read">🔊 Read</button><button id="close-dialog">✓ Close</button></div>
  <div id="dialog-content"></div>
  <p class="dialog-hint" id="dialog-hint"></p>
</dialog>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ART = {
    forest:'art:forest', pond:'art:pond', cave:'art:cave', campsite:'art:campsite', hill:'art:hill', meadow:'art:meadow',

  const ANIMALS = [['raccoon','Raccoon'],['turtle','Turtle'],['frog','Frog'],['fox','Fox']];
  const THINGS = [['lantern','Lantern'],['umbrella','Umbrella'],['basket','Berry basket'],['map','Map'],['rowboat','Rowboat']];
  const EVENTS = [['walk','Goes for a walk','🐾'],['storm','A storm comes','⛈'],['lost','Gets lost','🗺'],

  const FX = [['thunder','Thunder','⛈'],['splash','Splash','💦'],['footsteps','Footsteps','🐾'],['snore','Snore','☾'],

  const WORDS = ['Beginning','Middle','End'];
  const IDEAS = ['Tap Snap on page 2, then Snore on page 3.',
    'Tap Make, page 2, then Action. Choose Thunder.',
    'Tap page 1, then page 3 to swap whole pages.',
    'Tap Make, page 2, then Background. Choose Crickets.'];
  const L = {
    plan:'Our book has a beginning, a middle and an end. Tap Who, choose a character, then tap a page.',
    where:'Now, where does each part happen? Tap Where, choose a place, then tap a page.',
    ready:"That's a plan. Tap Make it.", make:'Build this page. Tap Place, then add a character.',

    ideas:IDEAS,
    ui:['Sample book','Make it','New book','Place','Characters','Things','Background','Action','Happy','Scared','Sleepy','Flip',

  L.extra = [];

    const from = state.swapChip;
    if (from.i === i && from.kind === kind) {
      state.swapChip = null; $('chip-'+kind+'-'+i).setAttribute('aria-pressed','false'); hint(L.swap); return;
    }
    swapSounds(from.i,from.kind,i,kind);
  }
  function swapSounds(i,kind,j,toKind) {
    if (kind !== toKind) {
      state.swapChip = null;
      document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed','false'));
      const b = $('chip-'+kind+'-'+i);
      b.classList.remove('slideback'); void b.offsetWidth; b.classList.add('slideback');
      hint(L.wrong); V.say('wrong',{now:true}); return;
    }
    if (i === j) return;
    if (state.book.pages[i][kind] === state.book.pages[j][kind]) {
      state.swapChip = null;
      document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed','false'));
      hint(L.sameSound); V.say('sameSound',{now:true}); return;
    }
    const before = [i,j].map(n => $('chip-'+kind+'-'+n).getBoundingClientRect());
    recordSwap();
    const moving = soundData(kind,state.book.pages[i][kind]);
    [state.book.pages[i][kind],state.book.pages[j][kind]] = [state.book.pages[j][kind],state.book.pages[i][kind]];
    swapped(`${moving?.[2] || '⇄'} ${moving?.[1] || 'Empty sound'} moved to page ${j+1}. Only sounds moved.`);
    animateExchange([i,j].map(n => $('chip-'+kind+'-'+n)),before);
  }
  function animateExchange(nodes,before) {
    if (Curio.reduce) return;
    nodes.forEach((node,index) => {
      const from = before[1-index], to = node.getBoundingClientRect();
      node.animate([{transform:`translate(${from.x-to.x}px,${from.y-to.y}px)`,opacity:.65},
        {transform:`translate(${(from.x-to.x)*.5}px,${(from.y-to.y)*.5+(index ? -14 : 14)}px)`,opacity:1},
        {transform:'translate(0,0)',opacity:1}],{duration:420,easing:'cubic-bezier(.2,.7,.3,1)'});
    });
  }
  function undoSwap() {
    const item = state.undo.pop();
    if (!item) return;
    state.book = item.book; state.change = item.change;
    save(true); preserveFocus(refresh); hint(L.undo); V.say('undo',{now:true});
    if (!$('undo').disabled) $('undo').focus({preventScroll:true}); else $('swap-play').focus({preventScroll:true});
  }
  function chipDown(e,i,kind,b) {
    if (e.button !== 0) return;
    const start = {x:e.clientX,y:e.clientY};
    let ghost = null;
    b.setPointerCapture(e.pointerId);
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX-start.x,ev.clientY-start.y) > 8) {
        ghost = b.cloneNode(true); ghost.removeAttribute('id'); ghost.classList.add('drag-ghost'); document.body.append(ghost);
      }
      if (ghost) { ghost.style.left = ev.clientX-80+'px'; ghost.style.top = ev.clientY-30+'px'; }
    };
    const up = ev => {
      b.removeEventListener('pointermove',move);
      if (!ghost) return;
      ghost.remove();
      const to = document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.chip');
      b.onclick = null;
      if (to) swapSounds(i,kind,Number(to.dataset.page),to.dataset.kind);
      else { hint('Drag a sound onto another sound chip.'); b.classList.add('slideback'); }
      setTimeout(() => { if (b.isConnected) b.onclick = () => pickChip(i,kind); },50);
    };
    b.addEventListener('pointermove',move);
    b.addEventListener('pointerup',up,{once:true});
  }
  function newBook() {
    openChooser('Start a new book?',L.newBook);
    const row = el('div','traybar');
    row.append(button('confirm-new','✓ Yes, start new',() => {
      state.book = {who:null,pages:[blank(),blank(),blank()]}; state.undo = []; state.change = ''; state.page = 0;
      save(); closeChooser(false); setMode('plan'); $('sample').focus({preventScroll:true});
    }),button('keep-book','📖 Keep my book',() => closeChooser(),'gold'));
    $('dialog-content').append(row); hint(L.newBook); speak('newBook');
  }
  for (const m of ['plan','make','play','swap']) $('m-'+m).onclick = () => {
    if (state.mode === m) { V.welcome(); return; }
    setMode(m);
  };
  addEventListener('keydown',e => {
    if (state.mode === 'play' && !$('chooser').open && ['ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();
      if (e.key === 'ArrowLeft') turn(Math.max(0,state.page-1));
      else if (state.page === 2) finish(); else turn(state.page+1);
    }
  });
  Curio.init({clips:"voice:*",rate:.88});
  Curio.onMotion(() => {
    if (Curio.reduce) document.getAnimations().forEach(a => a.cancel());
  });
  Curio.onSound(on => {
    stopAudio();
    if (state.mode === 'play') { preserveFocus(refresh); if (on && !state.end) startPage(); }
  });
  // Read stops the foreground effect before speaking, and leaves the background quiet.
  $('read').addEventListener('pointerdown',() => stopAudio(),{capture:true});
  $('read').addEventListener('keydown',e => { if (e.key === 'Enter' || e.key === ' ') stopAudio(); },{capture:true});
  window.__tool = {state,setMode,allLines:V.allLines,vlog:V.log,audioLog:audio.log,swapSounds,sample,validBook,
    get vq() { return V.queue; },get actionUntil() { return audio.actionUntil; }};
  setMode('plan');
})();
</script>
</body>
</html>
