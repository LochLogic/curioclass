<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Store · Counting coins and making change · Curio Class</title>
<meta name="description" content="Run a snack stand with the class: count the coins each customer pays, count up to make change, and close when the bell rings at 3:45. Grade 2 math, teacher-led. Works offline.">
<!--
CORNER STORE (Curio Class)
Grade 2 math, CCSS 2.MD.C.8 (solve word problems with dollar bills, quarters, dimes, nickels and pennies,
using $ and ¢) and 2.MD.C.7 (tell time to the nearest five minutes).
Teacher-led on a projector: animal neighbors buy snacks. The class counts the coins each one pays
(biggest coins first), then makes change by counting up from the price. Every customer moves the clock
five minutes; the bell rings at 3:45 and the day's takings are added up in dollars and cents.
Coins are drawn to their true relative sizes (dime smallest, quarter biggest).
One file, no network requests. Illustrations generated with Google Gemini, edited for Curio Class.
Content CC BY 4.0, code MIT. curioclass.org
-->
<style>
:root{
  --paper:#fbf6ea;--ink:#2a2622;--muted:#6d6257;--line:#eadcc0;--accent:#c8402e;--go:#2f7d4f;--focus:#2f5bd3;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#7a2f22;color:#fff6e8}
h1{margin:0 auto 0 0;font:800 clamp(22px,3vw,32px)/1.1 'Trebuchet MS','Segoe UI',sans-serif;letter-spacing:.01em}
h1 small{display:block;font:500 15px/1.3 'Segoe UI',sans-serif;color:#f3d2c4}
.icon-btn{border:2px solid #a2493a;background:#8d3a2c;color:#fff6e8;border-radius:999px;min-height:52px;padding:0 16px;font-weight:700;font-size:16px}
.icon-btn[aria-pressed="true"]{border-color:#ffd166;background:#9b4433}

main{display:grid;grid-template-columns:1fr;min-height:0}
@media (min-width:760px){main{grid-template-columns:minmax(0,1fr) 340px}}
.stage{position:relative;overflow:hidden;background:#b98a5a;min-height:340px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stage svg .tap{cursor:pointer}

.panel{background:#fffaf0;border-left:3px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
@media (max-width:759px){.panel{border-left:0;border-top:3px solid var(--line)}}
.panel h2{margin:4px 0 0;font:800 13px/1 'Segoe UI',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.status{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:17px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.status #till{color:var(--go)}
.hint{margin:0;font:600 16px/1.35 'Segoe UI',sans-serif;color:var(--muted)}
.hint b{color:var(--ink)}
.drawer{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#5a4636;border-radius:14px;padding:8px}
.drawer button{border:0;border-radius:10px;background:#f4ead6;display:grid;justify-items:center;align-content:center;gap:2px;min-height:96px;padding:4px 2px;font-weight:800;font-size:13px}
.drawer button svg{width:64px;height:64px;overflow:visible}
.drawer button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.small-btn{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;min-height:46px;font-weight:700}
.small-btn:disabled{opacity:.45;cursor:default}
.big{border:0;border-radius:16px;min-height:60px;font:800 20px/1 'Segoe UI',sans-serif;color:#fff;box-shadow:0 5px 0 #0004}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0004}
.big:disabled{opacity:.45;cursor:default}
.blue{background:#3a6ea5}.red{background:var(--accent)}.green{background:var(--go)}

.speech{position:relative;margin:0 0 30px 0;background:#fff;border:3px solid #2a2622;border-radius:22px;padding:10px 14px;font:700 21px/1.3 'Trebuchet MS','Segoe UI',sans-serif;color:#2a2622;box-shadow:0 5px 0 #0003}
.speech .tail{position:absolute;left:22px;top:calc(100% - 3px);width:44px;height:34px;overflow:visible}
/* motion */
.arrive{animation:arrive 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes arrive{from{transform:translateX(720px)}}
.leave{animation:leave 1s ease-in both}
@keyframes leave{to{transform:translateX(-820px)}}
.hop{animation:hop .5s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-22px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.drop{animation:drop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-60px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pop{from{opacity:0;scale:.5}}
.hand{transition:transform .9s cubic-bezier(.4,1.4,.5,1)}
.ring{animation:ring .12s linear 14;transform-box:fill-box;transform-origin:50% 0}
@keyframes ring{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.calm *{animation:none!important;transition:none!important}

@media (max-width:759px),(max-height:620px){
  header{padding:6px 12px}
  h1{font-size:19px} h1 small{display:none}
  .icon-btn{min-height:38px;font-size:13px;padding:0 10px}
  main{grid-template-columns:minmax(0,1fr) 270px}
  .panel{padding:8px 10px;gap:6px}
  .panel h2{display:none}
  .status{font-size:14px;padding:4px 8px}
  .hint{font-size:13px}
  .drawer button{min-height:0;font-size:11px}
  .drawer button svg{width:38px;height:38px}
  .big{min-height:42px;font-size:16px}
  .small-btn{min-height:34px}
}
</style>

<body>
<header>
  <h1>Corner Store <small>Count the coins, make the change, close at 3:45.</small></h1>
  <button class="icon-btn" id="labels" aria-pressed="true" title="Show or hide coin values">¢ Values</button>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <div class="stage">
    <svg id="stand" viewBox="0 0 1000 620" role="img" aria-labelledby="stand-desc">
      <desc id="stand-desc">A snack stand on a sunny street. A customer waits at the counter, with the coins they paid on the left and your change on the right.</desc>
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58b52"/><stop offset=".25" stop-color="#a86d3b"/><stop offset="1" stop-color="#7d4b25"/></linearGradient>
        <pattern id="grain" width="240" height="40" patternUnits="userSpaceOnUse"><path d="M0 12C60 8 120 18 240 12M0 30C80 26 160 36 240 29" stroke="#6b3e1e" stroke-width="2" fill="none" opacity=".35"/></pattern>
        <pattern id="awning" width="120" height="80" patternUnits="userSpaceOnUse"><rect width="60" height="80" fill="#d9442f"/><rect x="60" width="60" height="80" fill="#fff4e4"/></pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".3"/></filter>
      </defs>
      <!-- the street, oversized and mirrored so wide screens never show its edge; sky continues above on tall screens -->
      <rect x="-3000" y="-3000" width="7000" height="3100" fill="#b9d9f2"/>
      <image id="street" href="art:street" x="-300" y="-70" width="1600" height="895"/>
      <use href="#street" transform="translate(-600 0) scale(-1 1)"/>
      <use href="#street" transform="translate(2600 0) scale(-1 1)"/>
      <!-- striped awning across the top of the stand -->
      <rect x="-3000" y="-3000" width="7000" height="3052" fill="url(#awning)"/>
      <path id="scallops" fill="url(#awning)" filter="url(#shadow)"/>
      <!-- clock and menu on the left post -->
      <g transform="translate(112 152)" filter="url(#shadow)">
        <rect x="-6" y="-112" width="12" height="70" fill="#7d4b25"/>
        <circle r="56" fill="#3a2a1e"/><circle r="49" fill="#fffdf6"/>
        <g id="ticks"></g>
        <line id="hour" class="hand" x1="0" y1="6" x2="0" y2="-27" stroke="#2a2622" stroke-width="7" stroke-linecap="round"/>
        <line id="minute" class="hand" x1="0" y1="8" x2="0" y2="-40" stroke="#2a2622" stroke-width="4" stroke-linecap="round"/>
        <circle r="5" fill="#c8402e"/>
        <rect x="66" y="-17" width="86" height="34" rx="8" fill="#2a2622"/>
        <text id="digital" x="109" y="8" text-anchor="middle" font-family="Consolas,monospace" font-size="26" font-weight="700" fill="#ffd166">3:00</text>
      </g>
      <g id="menu" transform="translate(22 216)" filter="url(#shadow)"></g>
      <g id="customer" transform="translate(372 432)"></g>
      <g id="item" transform="translate(612 406)"></g>
      <!-- the counter -->
      <rect x="-3000" y="402" width="7000" height="2600" fill="url(#wood)"/>
      <rect x="-3000" y="402" width="7000" height="2600" fill="url(#grain)"/>
      <rect x="-3000" y="396" width="7000" height="16" fill="#d9a066"/>
      <rect x="-3000" y="410" width="7000" height="5" fill="#5e3618" opacity=".45"/>
      <g id="mats"></g>
      <g id="paid"></g>
      <g id="change"></g>
      <g id="say"></g>
      <g id="closed"></g>
    </svg>
  </div>

  <aside class="panel" aria-label="Store controls">
    <div class="status"><span id="who">Customer 1 of 9</span><span id="till">Till: $0.00</span></div>
    <h2>1. Count what they paid</h2>
    <button class="big blue" id="count">👆 Count it together</button>
    <p class="hint" id="paid-line">Or tap each coin on the counter, biggest first.</p>
    <h2>2. Make change</h2>
    <p class="hint" id="change-line">Count the money first.</p>
    <div class="drawer" id="drawer" role="group" aria-label="Cash drawer"></div>
    <div class="row"><button class="small-btn" id="undo">↩ Take one back</button><button class="small-btn" id="clear">Clear</button></div>
    <button class="big red" id="give">Give change</button>
  </aside>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';
  // Motion follows the device's "reduce motion" setting until the teacher picks, then the choice is remembered
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => {
    reduce = !reduce;
    try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {}
    showMotion();
  };
  const wait = ms => new Promise(r => setTimeout(r, ms));  // same pacing with motion off, so sounds stay in step
  const readMs = text => 1400 + text.length * 75;

  // ---------- money ----------
  // Diameters in millimeters, so the coins keep their real sizes next to each other
  const MM = 2.5;
  const COINS = {
    100: {name: 'dollar', label: '$1', bill: true},
    25: {name: 'quarter', label: '25¢', mm: 24.26},
    10: {name: 'dime', label: '10¢', mm: 17.91},
    5: {name: 'nickel', label: '5¢', mm: 21.21},
    1: {name: 'penny', label: '1¢', mm: 19.05},
  };
  const radius = v => COINS[v].bill ? 0 : COINS[v].mm * MM / 2;
  const cents = n => n >= 100 ? '$' + (n / 100).toFixed(2) : n + '¢';
  const dollars = n => '$' + (n / 100).toFixed(2);
  // A coin or bill, centered on 0,0
  function coinMarkup(v, showLabel = state.labels) {
    const c = COINS[v];
    if (c.bill) {
      return `<g><rect x="-74" y="-31" width="148" height="62" rx="4" fill="#d6e8cf" stroke="#5f8a57" stroke-width="3"/>
        <rect x="-66" y="-23" width="132" height="46" rx="3" fill="none" stroke="#86ad7d" stroke-width="2"/>
        <ellipse rx="17" ry="21" fill="#b9d4ae" stroke="#5f8a57" stroke-width="2"/>
        <path d="M-6 12C-8 0-7-10 1-12C9-10 9 0 7 12Z" fill="#7da173"/>
        <text x="-56" y="-6" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#3f6a38">1</text>
        <text x="48" y="20" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#3f6a38">1</text>
        <text x="40" y="-9" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#3f6a38">ONE</text>
        ${showLabel ? `<text y="50" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#2a2622" stroke="#fffaf0" stroke-width="5" paint-order="stroke">${c.label}</text>` : ''}</g>`;
    }
    // real coin pictures, sized by diameter so a dime stays smaller than a penny
    const r = radius(v);
    return `<g><circle r="${r}" cy="2" fill="#000" opacity=".28"/><image href="${COIN_ART[v]}" x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}"/>
      ${showLabel ? `<text y="50" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="19" font-weight="800" fill="#2a2622" stroke="#fffaf0" stroke-width="5" paint-order="stroke">${c.label}</text>` : ''}</g>`;
  }
  const COIN_ART = {25: 'art:quarter', 10: 'art:dime', 5: 'art:nickel', 1: 'art:penny'};  // written out so the bundler can inline them
  // Break an amount into coins. "few" uses the biggest coins; otherwise trade a quarter for dimes and nickels sometimes.
  function makeCoins(amount, few = true) {
    const out = [];
    for (const v of [25, 10, 5, 1]) {
      let n = Math.floor(amount / v);
      if (!few && v === 25 && n && Math.random() < .5) n--;
      for (let i = 0; i < n; i++) out.push(v);
      amount -= n * v;
    }
    return out;
  }

  // ---------- the store ----------
  const ITEMS = {
    apple: {name: 'apple', a: 'an apple', price: 18, art: 'art:apple', size: [220, 275], h: 92},
    lemonade: {name: 'lemonade', a: 'a lemonade', price: 25, art: 'art:lemonade', size: [220, 323], h: 120},
    pretzel: {name: 'pretzel', a: 'a pretzel', price: 35, art: 'art:pretzel', size: [220, 171], h: 84},
    cookie: {name: 'cookie', a: 'a cookie', price: 40, art: 'art:cookie', size: [220, 129], h: 70},
    juice: {name: 'juice box', a: 'a juice box', price: 45, art: 'art:juice', size: [220, 291], h: 108},
    popcorn: {name: 'popcorn', a: 'a bag of popcorn', price: 60, art: 'art:popcorn', size: [220, 322], h: 122},
  };
  const FOLKS = {
    bunny: {name: 'Bunny', art: 'art:bunny', size: [277, 400]},
    raccoon: {name: 'Raccoon', art: 'art:raccoon', size: [320, 400]},
    turtle: {name: 'Mr. Turtle', art: 'art:turtle', size: [388, 400]},
    fox: {name: 'Fox', art: 'art:fox', size: [216, 400]},
    hedgehog: {name: 'Hedgehog', art: 'art:hedgehog', size: [270, 400]},
  };
  const HELLO = ['Hi! Can I have {a}, please?', 'Hello! I would like {a}.', 'One {name}, please!', 'Ooh, {a}, please!', 'May I have {a}, please?'];
  const THANKS = ['Thank you! See you tomorrow!', 'Yum! Thanks!', 'Thanks a bunch!', 'That’s just right. Thank you!', 'Perfect change. Thanks!'];
  const CUSTOMERS = 9, OPEN = 15 * 60;  // 3:00 pm, in minutes

  const state = {day: [], n: 0, labels: true, sound: true, busy: false, counted: 0, change: [], till: 0, served: 0};
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // Nine customers: the first ones pay exactly (just counting), then change gets harder
  function planDay() {
    const kinds = ['exact', 'exact', 'round', 'round', 'exact', 'round', 'bill', 'round', 'bill'];
    const folks = shuffle(Object.keys(FOLKS));
    return kinds.map((kind, i) => {
      const item = pick(Object.keys(ITEMS)), price = ITEMS[item].price;
      let coins;
      if (kind === 'exact') coins = makeCoins(price, Math.random() < .5);
      else if (kind === 'bill') coins = [100];
      else {
        const pay = [25, 50, 75, 100].find(p => p > price);
        coins = pay === 100 && Math.random() < .5 ? [100] : makeCoins(pay, Math.random() < .6);
      }
      return {item, who: folks[i % folks.length], coins, paid: coins.reduce((s, v) => s + v, 0)};
    });
  }

  // ---------- sound ----------
  let ctx;
  const audio = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(type, f0, f1, dur, gain, when = 0) {
    if (!state.sound) return;
    const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, freq, gain, type = 'lowpass', when = 0) {
    if (!state.sound) return;
    const a = audio(), len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3;
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = type; f.frequency.value = freq; g.gain.value = gain;
    src.connect(f).connect(g).connect(a.destination); src.start(a.currentTime + when);
  }
  const SFX = {
    clink: v => { const f = v >= 25 ? 2600 : v === 10 ? 3400 : v === 5 ? 2300 : 2000; tone('sine', f, f * .97, .18, .14); tone('sine', f * 1.5, f * 1.45, .12, .06, .02); },
    bill: () => noise(.22, 1800, .35, 'bandpass'),
    count: k => tone('triangle', 520 + k * 60, 520 + k * 60, .14, .12),
    chaching: () => { noise(.12, 900, .5); tone('sine', 1568, 1568, .5, .14, .12); tone('sine', 2093, 2093, .6, .12, .2); },
    hmm: () => tone('sine', 300, 230, .45, .15),
    whoa: () => { tone('square', 700, 500, .12, .05); tone('square', 500, 350, .16, .05, .13); },
    tick: () => noise(.03, 4000, .3, 'highpass'),
    bell: () => { for (let i = 0; i < 18; i++) tone('triangle', 1150, 1150, .09, .12, i * .1); },
  };

  // ---------- drawing ----------
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.append(n);
    return n;
  };
  // awning scallops along the bottom edge
  (() => {
    let d = 'M-3000 50';
    for (let x = -3000; x < 4000; x += 60) d += `L${x} 50Q${x + 30} 104 ${x + 60} 50`;
    $('scallops').setAttribute('d', d + 'L4000 0L-3000 0Z');
    let t = '';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6, big = i % 3 === 0;
      t += `<line x1="${Math.sin(a) * (big ? 38 : 42)}" y1="${-Math.cos(a) * (big ? 38 : 42)}" x2="${Math.sin(a) * 47}" y2="${-Math.cos(a) * 47}" stroke="#2a2622" stroke-width="${big ? 4 : 2}"/>`;
    }
    $('ticks').innerHTML = t + [12, 3, 6, 9].map((h, i) => `<text x="${Math.sin(i * Math.PI / 2) * 29}" y="${-Math.cos(i * Math.PI / 2) * 29 + 6}" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#2a2622">${h}</text>`).join('');
  })();
  function drawMenu() {
    const rows = Object.values(ITEMS);
    let s = `<rect width="190" height="${36 + rows.length * 24}" rx="10" fill="#2f3b33" stroke="#7d4b25" stroke-width="6"/>
      <text x="95" y="25" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="19" font-weight="800" fill="#ffd166">SNACKS</text>`;
    rows.forEach((it, i) => {
      s += `<text x="14" y="${51 + i * 24}" font-family="Trebuchet MS,sans-serif" font-size="17" font-weight="700" fill="#f4f1e8">${it.name}</text>
        <text x="176" y="${51 + i * 24}" text-anchor="end" font-family="Trebuchet MS,sans-serif" font-size="18" font-weight="800" fill="#ffffff">${it.price}¢</text>`;
    });
    $('menu').innerHTML = s;
  }
  function drawMats() {
    $('mats').innerHTML = [[36, 'They paid'], [520, 'Your change']].map(([x, t]) =>
      `<rect x="${x}" y="428" width="444" height="182" rx="16" fill="#2f6b4a" stroke="#204d35" stroke-width="4"/>
       <rect x="${x + 8}" y="436" width="428" height="166" rx="11" fill="none" stroke="#5c9a77" stroke-width="2" stroke-dasharray="6 6"/>
       <text x="${x + 18}" y="460" font-family="Segoe UI,sans-serif" font-size="18" font-weight="800" fill="#d9f0e2">${t}</text>`).join('') +
      `<text id="paid-total" x="462" y="460" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#ffd166"></text>
       <text id="change-total" x="946" y="460" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#ffd166"></text>`;
  }
  // Lay coins out in one row, squeezing them together if the row gets long; returns their centers
  function layout(list, x0) {
    const widths = list.map(v => COINS[v].bill ? 150 : radius(v) * 2);
    const room = 404, natural = widths.reduce((s, w) => s + w + 14, -14);
    const squeeze = natural > room ? (room - natural) / Math.max(1, list.length - 1) : 0;
    let x = x0 + 22;
    return list.map((v, i) => { const at = {x: x + widths[i] / 2, y: COINS[v].bill ? 536 : 540}; x += widths[i] + 14 + squeeze; return at; });
  }
  function flag(parent, x, y, text, color) {
    const g = el('g', {class: 'pop', transform: `translate(${x} ${y})`}, parent);
    el('rect', {x: -30, y: -26, width: 60, height: 26, rx: 13, fill: color, stroke: '#fff', 'stroke-width': 2}, g);
    el('text', {y: -7, 'text-anchor': 'middle', 'font-family': 'Segoe UI,sans-serif', 'font-size': 17, 'font-weight': 800, fill: '#fff'}, g).textContent = text;
  }
  function drawPaid() {
    const c = state.day[state.n], g = $('paid');
    g.replaceChildren();
    const spots = layout(c.coins, 36);
    let run = 0;
    c.coins.forEach((v, i) => {
      const s = spots[i];
      const coin = el('g', {class: 'tap', transform: `translate(${s.x} ${s.y})`, tabindex: -1}, g);
      coin.innerHTML = `<g class="drop" style="animation-delay:${i * .12}s">${coinMarkup(v)}</g>`;
      coin.onclick = () => countNext();
      if (i < state.counted) {
        run += v;
        coin.style.opacity = 1;
        flag(g, s.x, s.y - (COINS[v].bill ? 36 : radius(v) + 6), cents(run), '#3a6ea5');
      }
    });
    $('paid-total').textContent = state.counted === c.coins.length ? cents(c.paid) : '';
  }
  function drawChange() {
    const c = state.day[state.n], g = $('change');
    g.replaceChildren();
    if (state.counted < c.coins.length) { $('change-total').textContent = ''; return; }
    const price = ITEMS[c.item].price;
    const spots = layout(state.change, 520);
    let run = price;
    // counting up starts at the price
    if (c.paid > price) {
      const st = el('g', {transform: 'translate(800 460)'}, g);
      el('text', {'text-anchor': 'middle', 'font-family': 'Segoe UI,sans-serif', 'font-size': 17, 'font-weight': 700, fill: '#d9f0e2'}, st).textContent = `start at ${cents(price)}`;
    }
    state.change.forEach((v, i) => {
      const s = spots[i];
      const coin = el('g', {class: 'tap', transform: `translate(${s.x} ${s.y})`}, g);
      coin.innerHTML = `<g class="${i === state.change.length - 1 ? 'drop' : ''}">${coinMarkup(v)}</g>`;
      coin.onclick = () => { if (!state.busy) { state.change.splice(i, 1); drawChange(); panel(); } };
      run += v;
      flag(g, s.x, s.y - (COINS[v].bill ? 36 : radius(v) + 6), cents(run), run > c.paid ? '#c8402e' : '#8a5a12');
    });
    const giving = state.change.reduce((s, v) => s + v, 0);
    $('change-total').textContent = state.change.length ? cents(giving) : '';
  }

  function customer(cls = 'arrive') {
    const c = state.day[state.n], f = FOLKS[c.who], h = 300, w = h * f.size[0] / f.size[1];
    $('customer').innerHTML = `<g class="${cls}"><g class="bob"><image href="${f.art}" x="${-w / 2}" y="${-h}" width="${w}" height="${h}"/></g></g>`;
  }
  function item(show = true) {
    // the snack sits up front on a little stand, with a big price tag
    const it = ITEMS[state.day[state.n].item], h = Math.min(170, it.h * 1.5), w = h * it.size[0] / it.size[1];
    $('item').innerHTML = show ? `<g class="drop"><ellipse cy="-4" rx="${Math.max(70, w * .6)}" ry="12" fill="#5e3618" opacity=".35"/>
      <image href="${it.art}" x="${-w / 2}" y="${-h - 4}" width="${w}" height="${h}" filter="url(#shadow)"/>
      <g transform="translate(${w / 2 + 2} ${-h * .5}) rotate(7)" filter="url(#shadow)"><path d="M0 0L20-22H112V22H20Z" fill="#fff6c9" stroke="#8a5a12" stroke-width="3" stroke-linejoin="round"/><circle cx="17" r="4.5" fill="#8a5a12"/>
      <text x="67" y="11" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="32" font-weight="800" fill="#2a2622">${it.price}¢</text></g></g>` : '';
  }
  function say(text) {
    $('say').replaceChildren();
    if (!text) return;
    const fo = el('foreignObject', {x: 586, y: 70, width: 384, height: 230}, $('say'));
    fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="speech pop" role="status">${text}<svg class="tail" viewBox="0 0 44 34" aria-hidden="true"><path d="M8 0L0 32L34 0Z" fill="#fff"/><path d="M8 1.5L0 32L34 1.5" fill="none" stroke="#2a2622" stroke-width="3" stroke-linejoin="round"/></svg></div>`;
  }
  function clock(min, animate = true) {
    const m = min % 60, hr = Math.floor(min / 60) % 12 || 12;
    $('minute').style.transform = `rotate(${m * 6}deg)`;
    $('hour').style.transform = `rotate(${(hr % 12 + m / 60) * 30}deg)`;
    $('digital').textContent = `${hr}:${String(m).padStart(2, '0')}`;
    if (animate) SFX.tick();
  }

  // ---------- panel ----------
  function drawDrawer() {
    $('drawer').innerHTML = [25, 10, 5, 1].map(v =>
      `<button data-v="${v}" aria-label="Give a ${COINS[v].name}, ${COINS[v].label}"><svg viewBox="-34 -34 68 68">${coinMarkup(v, false)}</svg>${COINS[v].name}<br>${COINS[v].label}</button>`).join('');
    $('drawer').querySelectorAll('button').forEach(b => b.onclick = () => {
      if (state.busy) return;
      const v = +b.dataset.v;
      if (state.change.length >= 10) return;
      state.change.push(v); SFX.clink(v);
      drawChange(); panel();
    });
  }
  function panel() {
    const c = state.day[state.n], closed = state.n >= CUSTOMERS;
    $('who').textContent = closed ? 'Closed' : `Customer ${state.n + 1} of ${CUSTOMERS}`;
    $('till').textContent = `Till: ${dollars(state.till)}`;
    const counting = !closed && state.counted < c.coins.length;
    $('count').disabled = state.busy || !counting;
    $('paid-line').innerHTML = closed ? 'The store is closed for the day.' : counting ? 'Or tap each coin on the counter, biggest first.' : `They paid <b>${cents(c.paid)}</b>.`;
    const price = closed ? 0 : ITEMS[c.item].price, need = closed ? 0 : c.paid - price;
    const changing = !closed && !counting && need > 0;
    $('change-line').innerHTML = closed ? 'Press Open again for a new day.' : counting ? 'Count the money first.' :
      need === 0 ? `The ${ITEMS[c.item].name} costs <b>${cents(price)}</b>. They paid exactly that!` :
      `The ${ITEMS[c.item].name} costs <b>${cents(price)}</b>. Count up from <b>${cents(price)}</b> to <b>${cents(c.paid)}</b>.`;
    $('drawer').querySelectorAll('button').forEach(b => b.disabled = state.busy || !changing);
    $('undo').disabled = $('clear').disabled = state.busy || !changing || !state.change.length;
    const give = $('give');
    give.className = 'big ' + (closed ? 'green' : 'red');
    give.textContent = closed ? '🌅 Open again' : need === 0 && !counting ? 'No change needed 👍' : 'Give change 🤲';
    give.disabled = !closed && (state.busy || counting || (need > 0 && !state.change.length));
  }

  // ---------- the day ----------
  async function next() {
    state.busy = true; state.counted = 0; state.change = [];
    $('paid').replaceChildren(); $('change').replaceChildren(); item(false); say('');
    drawMats(); panel();
    const c = state.day[state.n], it = ITEMS[c.item];
    customer('arrive');
    await wait(1100);
    const hi = pick(HELLO).replace('{a}', it.a).replace('{name}', it.name);
    say(hi); item(true);
    await wait(readMs(hi));
    const pay = 'Here you go!';
    say(pay);
    c.coins.some(v => v === 100) ? SFX.bill() : c.coins.forEach((v, i) => setTimeout(() => SFX.clink(v), i * 120));
    drawPaid();
    state.busy = false; panel();
  }
  function countNext() {
    const c = state.day[state.n];
    if (state.busy || state.counted >= c.coins.length) return;
    state.counted++;
    SFX.count(state.counted);
    drawPaid();
    if (state.counted === c.coins.length) {
      const price = ITEMS[c.item].price;
      say(c.paid === price ? `That’s ${cents(c.paid)}. Just right for ${it(c)}!` : `That’s ${cents(c.paid)}. ${cap(it(c))} is ${cents(price)}, so I need some change, please.`);
      drawChange();
    }
    panel();
  }
  const it = c => 'the ' + ITEMS[c.item].name;
  const cap = s => s[0].toUpperCase() + s.slice(1);
  $('count').onclick = async () => {
    const c = state.day[state.n];
    state.busy = true; panel();
    while (state.counted < c.coins.length) {
      state.busy = false; countNext(); state.busy = true;
      await wait(900);
    }
    state.busy = false; panel();
  };
  $('undo').onclick = () => { state.change.pop(); drawChange(); panel(); };
  $('clear').onclick = () => { state.change = []; drawChange(); panel(); };

  async function give() {
    if (state.n >= CUSTOMERS) return openDay();
    const c = state.day[state.n], need = c.paid - ITEMS[c.item].price;
    const giving = state.change.reduce((s, v) => s + v, 0);
    if (giving !== need) {
      const price = ITEMS[c.item].price;
      if (giving > need) { SFX.whoa(); say(`Whoa, that’s too much change! Count up from ${cents(price)} again. Stop at ${cents(c.paid)}.`); }
      else { SFX.hmm(); say(`Hmm, I paid ${cents(c.paid)}. Count up from ${cents(price)} to ${cents(c.paid)}. I think I need a little more.`); }
      return;
    }
    state.busy = true; panel();
    SFX.chaching();
    state.till += ITEMS[c.item].price; state.served++;
    const thanks = pick(THANKS);
    say(thanks);
    $('customer').firstElementChild.classList.replace('arrive', 'hop');
    $('item').replaceChildren();
    await wait(Math.max(1600, readMs(thanks) - 600));
    clock(OPEN + 5 * (state.n + 1));
    say('');
    $('customer').firstElementChild.className = 'leave';
    $('paid').replaceChildren(); $('change').replaceChildren();
    $('paid-total').textContent = $('change-total').textContent = '';
    await wait(1000);
    state.n++;
    if (state.n >= CUSTOMERS) return close();
    next();
  }
  $('give').onclick = give;

  async function close() {
    $('customer').replaceChildren(); $('item').replaceChildren();
    SFX.bell();
    $('closed').innerHTML = `<g class="ring" transform="translate(112 40)"><path d="M-22 26C-22 0-14-14 0-14C14-14 22 0 22 26Z" fill="#e8b23a" stroke="#8a5a12" stroke-width="3"/><circle cy="30" r="6" fill="#8a5a12"/></g>`;
    await wait(1800);
    const total = state.till;
    const text = `Closing time! The bell rang at 3:45. You helped ${state.served} customers and took in ${dollars(total)}. That’s ${total} cents!`;
    $('closed').innerHTML += `<g class="pop" filter="url(#shadow)"><rect x="290" y="120" width="480" height="250" rx="22" fill="#fffaf0" stroke="#7a2f22" stroke-width="5"/>
      <text x="530" y="178" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="40" font-weight="800" fill="#7a2f22">Closing time!</text>
      <text x="530" y="222" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#2a2622">${state.served} customers. The till has</text>
      <text x="530" y="296" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="62" font-weight="800" fill="#2f7d4f">${dollars(total)}</text>
      <text x="530" y="340" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#6d6257">That’s ${total}¢. A dollar is 100¢.</text></g>`;
    say('');
    $('say').dataset.text = text;
    state.busy = false; panel();
  }
  function openDay() {
    state.day = planDay(); state.n = 0; state.till = 0; state.served = 0;
    $('closed').replaceChildren(); delete $('say').dataset.text;
    clock(OPEN, false);
    next();
  }

  // ---------- header ----------
  $('labels').onclick = e => {
    state.labels = !state.labels;
    e.currentTarget.setAttribute('aria-pressed', state.labels);
    if (state.n < CUSTOMERS && state.day.length) { drawPaid(); drawChange(); }
  };
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
  };
  // Read aloud with the most natural voice this browser offers
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    // Chrome fills its voice list late; hold an early utterance until the good voices load, or it falls back to a robotic default
    const speak = speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      let done = false;
      const go = () => { if (done) return; done = true; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.getVoices();
  }
  $('read').onclick = () => {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const text = ($('say').dataset.text || $('say').textContent).trim().replace(/¢/g, ' cents');
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    const v = bestVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = .95; u.pitch = 1; speechSynthesis.speak(u);
  };

  drawMenu(); drawDrawer();
  window.__store = state; window.__close = close;  // for checking frames
  openDay();
})();
</script>
</body>
</html>
