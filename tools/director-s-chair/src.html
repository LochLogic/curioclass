Adapted from the kit starter. Stage engine: kit/stage.js. Scene: Sophocles, Antigone, F. Storr (1912), public domain.
Historical sources and simplifications are documented in notes.md. Content CC BY 4.0, code MIT.
Illustrations generated with OpenAI gpt-image, edited for Curio Class.

<style>

  --st-lines:#67583e;--st-pool:#fff1c6;--st-seat:#aec1ce;--st-bad:#ffb8a8;--st-part:#ffd590;--st-dark:#14212b}
body{grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
header{padding:10px 20px;gap:10px}
h1{font-family:Georgia,serif;font-weight:500;font-size:29px}
h1 small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
button{touch-action:manipulation}
.icon-btn,.seg button{min-height:44px;min-width:44px;font-size:14px;padding:0 13px}
main{display:block;min-height:0;position:relative}
#workspace{height:100%;min-height:0}
.page{height:100%;min-height:0}
.eyebrow{font:700 11px/1.4 'Segoe UI',sans-serif;letter-spacing:.17em;text-transform:uppercase;color:var(--brand)}
h2,h3,p{margin:0}
.tour{display:flex;flex-direction:column;padding:26px 28px 24px;gap:22px;
  background:radial-gradient(ellipse at 50% 0,#3c2b25 0,transparent 65%),#0d1219}
.tour-intro{display:flex;align-items:end;justify-content:space-between;gap:20px}
.tour h2{font:400 clamp(28px,3vw,46px)/1.1 Georgia,serif;margin:6px 0 10px}
.tour-intro p{font-size:15px;color:var(--muted);max-width:480px;line-height:1.5}
.tour-count{white-space:nowrap;border:1px solid #6b4838;border-radius:6px;padding:10px 16px;color:#f0d7bd;font-size:14px}
.houses{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
.house-card{position:relative;text-align:left;border:1px solid #6c5140;background:#141b25;padding:0;overflow:hidden;
  border-radius:4px 4px 16px 16px;display:flex;flex-direction:column;box-shadow:0 18px 28px #0005;min-width:0}
.house-card img{width:100%;height:64%;min-height:0;object-fit:cover;transition:filter .2s;filter:saturate(.85)}
.house-card:hover img{filter:saturate(1.15) brightness(1.1)}
.card-copy{padding:16px 15px;display:flex;flex-direction:column;flex:1;gap:9px;border-top:2px solid #ab7656}
.house-card h3{font:400 clamp(19px,1.8vw,28px)/1.12 Georgia,serif;color:#fff0d9}

.status{color:#ffb37c;font-size:12px;margin-top:auto;padding-top:9px}
.house-card::after{content:'↗';position:absolute;top:12px;right:12px;background:#10161fbd;border:1px solid #c8b89a80;
  border-radius:50%;width:32px;height:32px;display:grid;place-items:center;color:#fff5de}
.arrival{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr);gap:0;background:#10161f}

.arrival-art>img{width:100%;height:100%;object-fit:cover}

.arrival-panel{padding:22px 25px;display:flex;flex-direction:column;gap:15px;overflow:auto}

.rules{padding:0 0 0 20px;margin:0;color:#dbe1ea;font-size:14px;line-height:1.5}

.cast-role{display:flex;align-items:center;gap:13px;min-height:74px;border-top:1px solid #33404f;padding-top:5px}
.cast-role img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(2px 4px 3px #0008)}
.cast-role p{font-size:13px;color:#b4c0ce;line-height:1.4}
.cast-role strong{display:block;font-size:15px;color:#f5e4cc;margin-bottom:3px}
.scene-page{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,35%);height:100%}
.scene-stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#15212a}

  font-size:13px;color:#e9d9c0;pointer-events:none}
.house-heading strong{font:400 22px Georgia,serif}
.house-heading span{align-self:center;font-size:11px;color:#c4c9ca}
.scene-tools{position:absolute;left:12px;right:12px;bottom:7px;display:flex;gap:6px;align-items:center}

.focus-guide{position:absolute;top:53px;left:20px;font-size:10px;color:#e8dcca;background:#14212bcc;padding:5px 8px;

.live-lamp{display:inline-block;width:6px;height:6px;background:var(--brand);border-radius:50%;margin-right:7px;

@keyframes breathe{50%{opacity:.4;box-shadow:0 0 2px #ff9e5e}}

.directing-panel{background:#141b25;border-left:1px solid #765642;padding:14px;min-height:0;min-width:0;

.seatbar{display:flex;gap:8px;align-items:center;min-width:0}

.director-note{display:grid;grid-template-columns:230px minmax(0,1fr) 175px;gap:12px;align-items:center;background:#1d232a;

.director-note label{font:400 21px Georgia,serif;color:#ffe1bf}
.director-note label small{display:block;font:12px/1.4 'Segoe UI',sans-serif;color:#b6c0ce;margin-top:5px}

.save-actions{display:grid;grid-template-columns:1fr 60px;gap:6px}

function clarifyPlanLabels() {

  const texts=[...svg.querySelectorAll('text')];
  const labels=shown.cast.map(a => {
    const p=positions[a.id];

    const pose=texts.find(t => t.textContent===a.initials+' kneeling' || t.textContent===a.initials+' sitting');
    return node?{a,p,node,pose,box:node.getBBox()}:null;
  }).filter(Boolean);
  const crowded=labels.some(l => labels.some(other => {
    if (l===other) return false;
    const dx=Math.max(l.box.x-other.p.x,0,other.p.x-l.box.x-l.box.width);
    const dy=Math.max(l.box.y-other.p.y,0,other.p.y-l.box.y-l.box.height);
    return Math.hypot(dx,dy)<other.p.r+1;
  }));

  const W=svg.clientWidth,H=svg.clientHeight;

  const ns='http://www.w3.org/2000/svg';
  const boxes=[];
  const moved=[];
  columns.forEach((column,side) => {
    column.sort((a,b) => a.p.y-b.p.y);
    column.forEach((l,i) => {
      const label=l.pose?l.pose.textContent:l.a.initials;
      const width=Math.max(26,label.length*6+8);
      const x=side?W-width/2-4:width/2+4,y=13+(H-26)*(i+.5)/column.length;
      const edge=side?x-width/2-2:x+width/2+2;
      const line=document.createElementNS(ns,'path');

      line.setAttribute('fill','none');
      line.setAttribute('pointer-events','none');
      svg.append(line);
      const box=document.createElementNS(ns,'rect');

        box.setAttribute(key,String(value));
      }
      box.setAttribute('pointer-events','none');
      boxes.push(box);
      l.node.setAttribute('x',String(x));
      l.node.setAttribute('y',String(y+4));
      l.node.setAttribute('font-size','11');
      l.node.setAttribute('fill','#f5ead8');
      l.node.textContent=label;
      if (l.pose) {
        const background=l.pose.previousElementSibling;
        if (background?.tagName.toLowerCase()==='rect') background.remove();
        l.pose.remove();
      }
      moved.push(l.node);
    });
  });
  svg.append(...boxes,...moved);
  const seatLabel=texts.find(t => t.textContent===HOUSES[state.house].seats[state.seat].label);
  if (seatLabel) {
    seatLabel.setAttribute('x',String(W/2));
    seatLabel.setAttribute('y',String(H-4));

    seatLabel.setAttribute('font-size','11');

  }
}

    paths=[];

      const p=Stage.clone(end);
      const g=p.cast.find(a => a.id==='guard');
      g.x=x;
      g.facing=x===-1?90:270;
      paths.push(p);
    }
    paths.push(end);

  }
  if (id==='noh' && beat===0 && (state.choices[id][0] ?? 0)===0) {
    const bridgeEnd=Stage.clone(end);

  }

    paths=[turn,end];
  }
  if (id==='noh' && beat===3 && (state.choices[id][3] ?? 0)===1) {

// Tool-specific architectural finishes use the engine's camera, followed by code figures at their projected positions.

  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.clip();

    const pp=pts.map(p => cam.proj(p));

  if (id==='greek') {

    if (wallTop) {
      const horizon=Math.max(20,wallTop[1]);
      const sky=ctx.createLinearGradient(0,0,0,horizon);
      sky.addColorStop(0,'#b7cfd5');
      sky.addColorStop(1,'#d6ded3');
      ctx.fillStyle=sky;
      ctx.fillRect(0,0,W,horizon-1);

  }
  if (id==='noh') {

      }
    }
    for (const y of [0,5.4]) line([[-3,y,5.5],[3,y,5.5]],'#4d3928',8);
    for (let x=-2.7;x<=2.7;x+=.6) line([[x,0,5.55],[x,5.4,5.55]],'#554332',2);
    for (let t=0;t<1;t+=.08) {
      const x=-14+11.3*t,y=8-2*t;
      line([[x,y-1,.91],[x,y+1,.91]],'#8b693b88');
    }
  }
  if (id==='commedia') {
    // A painted town on cloth, with a visible center slit and timber frame.
    for (let i=0;i<6;i++) {
      const x=-3+i;
      const ht=1.6+(i%3)*.55;
      wallRect(x,x+.85,3.98,.2,ht,'#d7ae70','#815734');
      poly([[x-.1,3.96,ht],[x+.42,3.96,ht+.65],[x+.95,3.96,ht]],'#7c5238');
      wallRect(x+.3,x+.52,3.94,.4,1,'#654b38');
      wallRect(x+.2,x+.4,3.94,ht-.5,ht-.2,'#526761');
    }
    line([[0,3.92,0],[0,3.92,4]],'#51351eb3',2);
    for (let x=-3;x<3;x+=.3) line([[x,3.9,0],[x+.05,3.9,4]],'#f8d49a14');
    for (const x of [-3,3]) line([[x,0,-1.5],[x,4,-1.5]],'#4b3425',7);
  }
  if (id==='globe') {
    for (let x=-7;x<=7;x+=1.5) line([[x,yBack,0],[x,yBack,8]],'#4a301f',5);
    for (const z of [1,4.3,7.5]) line([[-7,yBack,z],[7,yBack,z]],'#583b28',7);
    for (const x of [-4,0,4]) wallRect(x-.85,x+.85,8.6,.05,3.2,'#372d28','#be9763');
    wallRect(-3,3,8.9,5,6.7,'#372d28','#be9763');
    for (let x=-3;x<=3;x+=.35) line([[x,8.0,5],[x,8.0,5.8]],'#dab77a',2);
    line([[-3,8,5.8],[3,8,5.8]],'#d2ae70',3);
    poly([[-4.5,5.7,8],[4.5,5.7,8],[4.5,8.8,8.5],[-4.5,8.8,8.5]],'#455361');
    for (let x=-4;x<=4;x+=1) line([[x,5.7,8],[x,8.8,8.5]],'#b59358',2);
  }
  if (id==='box') {
    wallRect(-5,5,yBack,0,.85,'#384337','#b4a179');
    for (let x=-4.7;x<5;x+=.5) for (let z=1.2;z<4;z+=.5) {
      line([[x,yBack,z-.12],[x+.1,yBack,z],[x,yBack,z+.12],[x-.1,yBack,z],[x,yBack,z-.12]],'#cfcc9c34');
    }
    wallRect(.8,2.2,6.24,0,2.8,'#453e30','#c3ad7d');
    wallRect(.95,2.05,6.22,.2,2.6,'#6a6247','#b39c6e');
    const knob=cam.proj([1.94,6.2,1.2]);
    if (knob) {ctx.fillStyle='#e3bc69';ctx.beginPath();ctx.arc(knob[0],knob[1],2.3,0,7);ctx.fill();}
    poly([[-4.88,2.5,1.1],[-4.88,4.4,1.1],[-4.88,4.4,3.2],[-4.88,2.5,3.2]],'#a2b6a1','#ddd5ad');
    line([[-4.85,3.45,1.1],[-4.85,3.45,3.2]],'#e6d9b3',3);
    line([[-4.85,2.5,2.15],[-4.85,4.4,2.15]],'#e6d9b3',3);
  }
  // Soft vignette gives the view a foreground while keeping its center clear.
  const grad=ctx.createRadialGradient(W*.5,H*.35,Math.min(W,H)*.18,W*.5,H*.5,Math.max(W,H)*.7);
  grad.addColorStop(0,'#0000');
  grad.addColorStop(1,'#080d1570');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

}
function paintFigures(v,h,st,seat,cam) {
  const ctx=v.canvas.getContext('2d');

  ctx.save();
  ctx.setTransform(ratio,0,0,ratio,0,0);
  const cast=st.snap.cast.filter(a => !a.off).sort((a,b) => {
    const ah=last.sight.cast[a.id]?.status==='hidden';

    if (!hidden) ctx.fill();
    const gradient=ctx.createLinearGradient(cx-b.w/2,0,cx+b.w/2,0);
    gradient.addColorStop(0,col);

    const waistY=bodyTop+bodyH*.48;

      const breadth=Math.max(.2,Math.cos(angle*Math.PI/180));
      ctx.beginPath();

      ctx.fillStyle='#eee4ce';
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle='#4c4740';
      for (const sign of [-1,1]) {
        ctx.beginPath();
        ctx.ellipse(cx+sign*r*.32*breadth,hy-r*.15,Math.max(.45,r*.13*breadth),Math.max(.4,r*.12),0,0,7);
        ctx.fill();
      }
    }
    if (!hidden) {
      const fs=Math.max(10,Math.min(22,b.w*.43));
      ctx.font='800 '+fs+'px Segoe UI, sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillStyle='#1b2029';
      ctx.fillText(a.initials,cx,bodyTop+Math.min((b.bottom-bodyTop)*.35,fs*1.1));
      if (h.id==='commedia' && st.beatIndex===5 && (state.choices.commedia[5] ?? 0)===0 &&
        ['guard','creon'].includes(a.id)) {
        const wave=Curio.reduce?-.5:Math.sin(performance.now()/170)*.7;
        ctx.strokeStyle=col;
        ctx.lineWidth=Math.max(2,b.w*.16);
        for (const sign of [-1,1]) {
          ctx.beginPath();
          ctx.moveTo(cx+sign*b.w*.3,bodyTop+b.w*.4);
          ctx.lineTo(cx+sign*b.w*(.8+wave*.2),bodyTop+b.w*(.35+wave));
          ctx.stroke();
        }
      }
      if (h.id==='box' && a.id==='guard' && st.beatIndex===0 && (state.choices.box[0] ?? 0)===0) {
        ctx.fillStyle='#343d46';
        ctx.beginPath();
        ctx.ellipse(cx+b.w*.4,bodyTop+b.w*1.1,b.w*.45,b.w*.15,-.2,0,7);
        ctx.fill();
      }
    }
    if (hidden && h.id==='commedia' && st.beatIndex===5 &&
      (state.choices.commedia[5] ?? 0)===0 && ['guard','creon'].includes(a.id)) {
      for (const sign of [-1,1]) {
        ctx.beginPath();
        ctx.moveTo(cx+sign*b.w*.3,bodyTop+b.w*.4);
        ctx.lineTo(cx+sign*b.w*.8,bodyTop-b.w*.1);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  if (last.leader?.id) {
    const b=last.figs[last.leader.id];
    if (b) {
      ctx.beginPath();
      ctx.ellipse(b.cx,b.top-14,10,5,0,0,7);
      ctx.fillStyle='#fff5d8';
      ctx.fill();
      ctx.strokeStyle='#272b30';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.cx,b.top-14,3,0,7);
      ctx.fillStyle='#272b30';
      ctx.fill();
    }
  }
  ctx.restore();
}
function renderCompare() {
  const ids=stagedIds();
  $('workspace').innerHTML=`<section class="page compare-page"><div class="compare-top"><h2>Your productions</h2><span class="eyebrow">Beat</span>
    ${[0,3,5,7].map(n => `<button class="btn" data-beat="${n}" aria-label="Compare beat ${n+1}"
      aria-pressed="${state.compareBeat===n}">${n+1}</button>`).join('')}</div>
    <div id="compare-grid" class="compare-grid ${ids.length===2?'two':''}"></div>
    <div class="director-note"><label for="note">Director's note<small>Which theater made the Guard most sympathetic, and how?</small></label>
    <textarea id="note" aria-label="Director's note" maxlength="600"
      placeholder="Point to a staging choice and what the audience could see."></textarea>
    <div class="save-actions"><button id="save" class="btn">Save on this device</button><button id="clear" class="btn">Clear</button>
    <p class="privacy" id="save-status" aria-live="polite">Your choices and note never leave this device.</p></div></div></section>`;
  $('note').value=state.note;
  $('note').oninput=() => state.note=$('note').value;
  $('save').onclick=() => {
    try {
      localStorage.setItem(SAVE_KEY,JSON.stringify({choices:state.choices,note:state.note}));
      $('save-status').textContent='Saved here. Your choices and note never leave this device.';
      hint('Saved on this device. Tap a beat number to compare another moment.');
      Curio.tone(523,.15,.04,'triangle');
    } catch {
      $('save-status').textContent='This browser could not save. Your work is still open.';
    }
  };
  $('clear').onclick=() => {
    try { localStorage.removeItem(SAVE_KEY); } catch {}
    state.choices=Object.fromEntries(IDS.map(id => [id,{}]));
    state.note='';
    setMode('tour');
    hint('Choices and note cleared on this device. Tap a theater to begin again.');
    $('house-greek').focus({preventScroll:true});
  };
  for (const b of document.querySelectorAll('[data-beat]')) b.onclick=() => {
    state.compareBeat=Number(b.dataset.beat);
    for (const x of document.querySelectorAll('[data-beat]')) x.setAttribute('aria-pressed',x===b);
    renderProductions();
    hint('Beat '+(state.compareBeat+1)+'. Compare the same words across your productions, then write your Director’s note.');
    Curio.tone(300+state.compareBeat*30,.07,.03);
  };
  renderProductions();
  hint(L.welcomeCompare);
}
function renderProductions() {
  const ids=stagedIds();

    const c=lastChoice(id,state.compareBeat);
    const option=c?.options[state.choices[id][c.beat]];
    return `<article class="production"><h3>${esc(DATA.houses[id].name)}</h3><div class="compare-view" id="compare-${id}"></div>
      <p><strong>${esc(option?.name || 'House default')}</strong>${esc(option?firstSentence(option.notice):'No directing choice yet.')}</p></article>`;
  }).join('');
  for (const id of ids) {
    const el=$('compare-'+id);
    applyPalette(el,id);
    const bs=makeBeats(id);
    const st={snap:bs[state.compareBeat].snap,beat:bs[state.compareBeat],beatIndex:state.compareBeat,
      prev:state.compareBeat?bs[state.compareBeat-1].snap:null,
      focus:false,weights:WEIGHTS};
    const h=HOUSES[id];
    const v=Stage.view.house(el,st,h.seats[0],{house:h,mini:true,margin:.055});
    decorate(v,h,st,h.seats[0]);

}
$('m-tour').onclick=() => setMode('tour');
$('m-compare').onclick=() => setMode('compare');
window.addEventListener('resize',() => {

Curio.init({clips:"voice:*",rate:.95,readFallback:() => state.playing?'':$('hint').textContent});
window.__tool={state,setMode,arrive,begin,jump,choose,makeBeats,initialSnap,applyChoice,HOUSES,WEIGHTS,
