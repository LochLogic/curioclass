<link rel="stylesheet" href="kit:curio">
<style>
:root {
  --paper: #f6efdf;
  --ink: #222e3a;
  --muted: #515e68;
  --brand: #234d77;
  --line: #b2b8b7;
  --focus: #ae4b12;
  --btn: #fcf8ee;
  --btn-line: #6e8191;
  --head-ink: #234d77;
  --panel: #f6efdf;
}
body {
  height: 100dvh;
  min-height: 100%;
  border: 7px solid var(--brand);
  overflow: hidden;
  background: var(--paper) url(art:parchment) center / 640px;
  grid-template-rows: auto minmax(0, 1fr);
}
button, select { min-height: 60px; min-width: 60px; }
button {
  border: 1.5px solid var(--btn-line);
  border-radius: 7px;
  padding: 0 19px;
  background: #fcf8ee;
  font-weight: 650;
  font-size: 18px;
}
button:hover:not(:disabled) { background: #eee8d9; }
button:active:not(:disabled) { background: #dce5ed; }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
button[aria-pressed="true"]:not(.icon-btn):hover:not(:disabled) { background: #173d62; color: #fff; }
header {
  display: grid;
  grid-template-columns: minmax(215px, 1fr) auto auto;
  gap: 16px;
  background: transparent;
  color: var(--brand);
  border-bottom: 1px solid #234d7740;
  padding: 14px 24px;
}
.identity { display: flex; align-items: center; gap: 12px; }
.identity img { width: 46px; height: 46px; object-fit: contain; }
h1 { font: 700 25px/1.15 'Segoe UI', sans-serif; }
h1 small { font: 400 13px/1.6 'Segoe UI', sans-serif; letter-spacing: .035em; }
.seg { border: 0; border-radius: 0; gap: 6px; overflow: visible; }
.seg button { border: 1.5px solid var(--btn-line); border-radius: 7px; padding: 0 16px; min-height: 60px; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.utilities { display: flex; gap: 6px; }
.icon-btn { border: 1px solid #8b969f; border-radius: 7px; font-size: 14px; min-height: 60px; padding: 0 10px; }
.utilities button[aria-pressed="true"] { background: transparent; color: var(--brand); border-color: #8b969f; }
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(80px, 1fr) auto auto auto;
  width: min(1080px, 100%);
  margin: 0 auto;
  padding: 16px 24px 10px;
  gap: 12px;
}
.settings { grid-row: 1; display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
.kinds, .length { display: flex; align-items: center; gap: 6px; }
.settings button { font-size: 16px; padding: 0 14px; }
.settings .label { font-size: 14px; color: var(--muted); margin-right: 4px; }
.length button { width: 60px; padding: 0; }
.stage {
  grid-row: 2;
  min-height: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: transparent;
}
.word-row { display: flex; align-items: center; justify-content: center; gap: 32px; position: relative; }
#reading { text-align: center; }
#word { font: 500 clamp(64px, 7vw, 96px)/1.2 'Century Gothic', 'Trebuchet MS', sans-serif; letter-spacing: .025em; }
#word-flag { position: absolute; right: -40px; top: 0; font-size: 24px; color: var(--brand); }
#count { margin: 16px 0 0; font-size: 15px; color: var(--muted); }
#clock { position: absolute; top: 6px; right: 8px; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.hourglass { width: 44px; height: 44px; flex: none; }
#pace { min-width: 120px; font-size: 14px; color: var(--muted); text-align: center; margin: 8px 0 0; }
.ready { text-align: center; max-width: 460px; }
.ready h2 { font-size: 26px; margin: 8px 0 12px; font-weight: 600; }
.ready p { color: var(--muted); line-height: 1.5; font-size: 17px; margin: 0; }
.hint { grid-row: 3; text-align: center; min-height: 42px; margin: 0; font-size: 17px; line-height: 1.4; color: var(--muted); }
.actions { grid-row: 4; display: flex; justify-content: center; gap: 10px; }
.actions button { min-width: 124px; }
.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.primary:hover:not(:disabled) { background: #173d62; }
.right { color: #215a39; border-color: #447759; background: #e8efdf; }
.notyet { color: #893d32; border-color: #9e6559; background: #f8e9df; }
.right:hover:not(:disabled) { background: #d6e5cf; }
.notyet:hover:not(:disabled) { background: #efd6c7; }
.secondary { display: flex; justify-content: center; gap: 8px; align-items: center; }
.secondary:not(:has(button:not([hidden]))) { display: none; }
.secondary button { font-size: 16px; padding: 0 16px; }
.bottom { grid-row: 5; display: grid; gap: 10px; }
.privacy { text-align: center; margin: 0; font-size: 12px; color: var(--muted); }
.result { width: min(600px, 100%); max-height: 100%; overflow: auto; text-align: center; padding: 6px; }
.result h2 { font-size: 30px; color: var(--brand); margin: 4px 0 10px; }
.result p { margin: 8px 0; }
#score { font-size: 28px; color: var(--ink); }
.review-words { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px 15px; font-size: 19px; margin: 12px 0; }
#missed { max-height: 105px; overflow: auto; }
#perfect { background: var(--brand); color: #fff; padding: 18px; width: 100%; font-size: 28px; border-radius: 16px; }
.result .detail { font-size: 14px; color: var(--muted); }
dialog { width: min(660px, calc(100vw - 30px)); max-height: calc(100dvh - 30px); border: 3px solid var(--brand);
  border-radius: 9px; background: var(--paper) url(art:parchment) center / 640px; padding: 18px; color: var(--ink); }
dialog::backdrop { background: #152a3d80; }
.dialog-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dialog-top h2 { margin: 0; font-size: 23px; }
#flag-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr)); gap: 8px; margin-top: 15px; }
#flag-list button { font-size: 24px; padding: 0 10px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
.confetti i { position: absolute; width: 9px; height: 16px; top: -25px; animation: fall 2400ms ease-in forwards; }
@keyframes fall { to { transform: translate(var(--drift), 105vh) rotate(540deg); } }
.calm .confetti { display: none; }
@media (max-width: 1120px) {
  header { grid-template-columns: 1fr auto; gap: 8px; padding: 8px 16px; }
  .seg { grid-column: 1 / -1; grid-row: 2; justify-content: center; }
  h1 { font-size: 22px; }
  h1 small { display: block; }
}
@media (max-height: 650px) and (min-width: 600px) {
  body { border-width: 5px; }
  header { padding: 5px 12px; gap: 5px; }
  h1 { font-size: 21px; }
  h1 small { display: none; }
  .identity img { width: 34px; height: 34px; }
  .icon-btn { min-height: 44px; }
  main { padding: 6px 16px; gap: 5px; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    grid-template-rows: auto minmax(90px, 1fr) auto auto auto; }
  .settings, .stage, .hint, .hint-row { grid-column: 1 / -1; }
  .actions { grid-column: 1; grid-row: 4; gap: 6px; }
  .actions button { min-width: 100px; }
  .bottom { display: contents; }
  .secondary { grid-column: 2; grid-row: 4; gap: 6px; }
  .secondary button { padding: 0 10px; font-size: 14px; }
  .privacy { grid-column: 1 / -1; grid-row: 5; }
  main:has(#start:not([hidden])) .actions, main:has(#results:not([hidden])) .actions { grid-column: 1 / -1; }
  .settings { gap: 12px; }
  .settings .label { display: none; }
  .settings button { padding: 0 12px; }
  #word { font-size: 60px; }
  #count { margin-top: 0; font-size: 12px; }
  #pace { margin: 0; font-size: 12px; }
  .hint { min-height: 24px; font-size: 14px; }
  .actions button { padding: 0 14px; }
  .secondary button { min-height: 60px; }
  .bottom { gap: 3px; }
  .privacy { font-size: 10px; }
  .ready h2 { font-size: 22px; margin: 0 0 5px; }
  .ready p { font-size: 14px; }
  .result h2 { font-size: 22px; margin: 0 0 4px; }
  #score { font-size: 23px; }
  #missed { max-height: 50px; margin: 4px; }
  .result p { margin: 3px; }
  .result { font-size: 13px; }
  .result .detail { font-size: 12px; }
  #perfect { padding: 9px; font-size: 22px; }
}
@media (max-width: 599px) {
  body { border-width: 5px; }
  header { grid-template-columns: 1fr; padding: 8px; gap: 8px; }
  .identity { justify-content: center; gap: 8px; }
  h1 { font-size: 21px; margin: 0; }
  h1 small { display: none; }
  .identity img { height: 32px; width: 32px; }
  .utilities { grid-row: 3; justify-content: center; }
  .utilities button { min-height: 44px; }
  .seg { grid-row: 2; gap: 5px; }
  .seg button { padding: 0 10px; font-size: 15px; }
  main { padding: 8px 10px; gap: 8px; grid-template-rows: auto minmax(105px, 1fr) auto auto auto; }
  .settings { gap: 8px; }
  .settings .label { display: none; }
  .settings button { padding: 0 13px; font-size: 15px; }
  #word { font-size: 72px; }
  #count { margin-top: 10px; }
  .hint { font-size: 15px; min-height: 42px; }
  .actions { flex-wrap: wrap; gap: 6px; }
  .actions button { padding: 0 12px; min-width: 100px; font-size: 18px; }
  .secondary { flex-wrap: wrap; gap: 6px; }
  .secondary button { padding: 0 12px; font-size: 15px; }
  .privacy { font-size: 10px; }
  .ready h2 { font-size: 24px; }
  .ready p { font-size: 16px; }
  #clock { top: 0; right: 2px; }
  .word-row { gap: 17px; }
  #word-flag { right: -27px; font-size: 20px; }
  .result h2 { font-size: 25px; }
  #perfect { padding: 10px; font-size: 23px; }
}

/* Polish (Curio Class): rounder, softly lit controls, pie countdown, ring timer */
button, select { border-radius:14px; box-shadow:inset 0 1px 0 #ffffffc8, inset 0 -2px 0 #1c2c400d, 0 2px 5px #1c2c401f;
  transition:background-color .15s, box-shadow .15s, transform .08s; }
button:hover:not(:disabled) { box-shadow:inset 0 1px 0 #ffffffc8, inset 0 -2px 0 #1c2c400d, 0 4px 11px #1c2c402b; }
button:active:not(:disabled) { transform:translateY(1px); box-shadow:inset 0 2px 3px #1c2c4026; }
button.primary, button[aria-pressed="true"] { box-shadow:inset 0 1px 0 #ffffff40, inset 0 -2px 0 #0000001f, 0 2px 6px #1c2c4033; }
.seg button, .modes button, .utilities button, .list-tabs button { border-radius:999px; }
.calm button { transition:none; } .calm button:active:not(:disabled) { transform:none; }
dialog { border-radius:18px; }
.hint-row { grid-row:3; display:flex; align-items:center; justify-content:center; gap:10px; }
.speak { min-width:52px; min-height:52px; width:52px; height:52px; padding:0; border-radius:50%; flex:none;
  display:inline-grid; place-items:center; color:var(--brand); }
.speak svg { width:24px; height:24px; }
#hourglass svg { width:44px; height:44px; display:block; margin:0 auto; }
.pie-face { fill:#fffaf0; stroke:#9aa3a9; stroke-width:1.5; }
#pie { fill:none; stroke-width:20; stroke:#3f8158; }
#hourglass[data-phase="yellow"] #pie { stroke:#c19225; }
#hourglass[data-phase="red"] #pie { stroke:#b46a5c; opacity:.55; }
.ring-timer { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-variant-numeric:tabular-nums; }
.ring-timer[hidden] { display:none; }
.ring-timer svg { width:28px; height:28px; }
.ring-track { fill:none; stroke:#23304a1a; stroke-width:4; }
#ring { fill:none; stroke:var(--brand); stroke-width:4; stroke-linecap:round; opacity:.75; }

<header>

    <button id="m-practice" aria-pressed="false">Practice test</button>
    <button id="m-challenge" aria-pressed="false">Challenge</button>
  </nav>
  <div class="utilities">
    <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
    <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  </div>
</header>
<main>
  <div class="settings" id="settings">
    <div class="kinds" role="group" aria-label="Word kinds">
      <span class="label">Word kinds</span>
      <button id="kind-cvc" aria-pressed="true" title="Short vowel, consonant vowel consonant">CVC</button>
      <button id="kind-cvce" aria-pressed="true" title="Long vowel with silent e">CVCe</button>
      <button id="kind-pairs" aria-pressed="true" title="Letter pairs sh, ch, th">sh ch th</button>
    </div>
    <div id="length" class="length" role="group" aria-label="Practice session length" hidden>
      <span class="label">Words</span>
      <button id="len-10" aria-pressed="false">10</button>
      <button id="len-20" aria-pressed="true">20</button>
      <button id="len-30" aria-pressed="false">30</button>
    </div>
  </div>
  <section class="stage" id="stage" aria-label="Reading area">
    <span id="clock" class="ring-timer" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-track" cx="18" cy="18" r="15"/><circle id="ring" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 18 18)"/></svg><span id="clock-text">1:00</span></span>
    <div id="reading">
      <div class="word-row">
        <div id="word"></div><span id="word-flag" aria-label="Flagged" hidden>⚑</span>
        <div class="hourglass" id="hourglass" hidden>
          <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="pie-face" cx="22" cy="22" r="20.5"/><circle id="pie" cx="22" cy="22" r="10" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 22 22)"/></svg>
        </div>
      </div>
      <p id="pace" hidden>Read aloud</p>
      <p id="count"></p>
    </div>
    <div class="ready" id="ready" hidden>
      <h2 id="ready-title"></h2><p id="ready-copy"></p>
    </div>
    <div class="result" id="results" tabindex="-1" hidden>
      <div id="perfect" hidden>30 out of 30. You did it!</div>
      <h2 id="result-title">Nicely done.</h2>
      <p id="score"></p><p id="result-copy"></p><p id="best" class="detail"></p>
      <p id="review-label" class="detail"></p><div id="missed" class="review-words"></div>
      <p id="unseen" class="detail"></p>
    </div>
  </section>
  <div class="hint-row"><p class="hint" id="hint"></p><button id="read" class="speak" aria-label="Read the instructions aloud" title="Read the instructions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>
  <div class="actions">
    <button id="back">← Back</button><button id="next" class="primary">Next →</button>
    <button id="start" class="primary" hidden>▶ Start</button>
    <button id="notyet" class="notyet" hidden>✕ Not yet</button><button id="right" class="right" hidden>✓ Right</button>
    <button id="again" class="primary" hidden>↻ Again</button>
    <button id="practice-these" hidden>↗ Practice these</button>
  </div>
  <div class="bottom">
    <div class="secondary">
      <button id="shuffle">⤨ Shuffle</button><button id="skip" hidden>↷ Skip</button>
      <button id="flag" aria-pressed="false">⚑ Flag</button><button id="flagged">⚑ Flagged (0)</button>
      <button id="all" hidden>↩ All</button>
    </div>
    <p class="privacy" id="privacy" hidden>Flags, settings and best scores stay on this device.</p>
  </div>
</main>
<dialog id="flags" aria-labelledby="flags-title">
  <div class="dialog-top"><h2 id="flags-title">Flagged words</h2><button id="close-flags">✕ Close</button></div>
  <p id="flags-help">Tap a word to open it in Explore.</p><div id="flag-list"></div>
</dialog>

    $('score').textContent = `${right} of ${state.deck.length} right`;

      el.textContent = w.word + (w.mark === 'skip' ? ' (skipped)' : '');
      return el;
    }));

      bit.style.background = ['#234d77', '#bf9240', '#558768', '#f7fafb'][i % 4];
