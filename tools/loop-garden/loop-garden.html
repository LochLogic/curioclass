LOOP GARDEN (Curio Class)
Grade 2 computer science, CSTA 1A-AP-08 (model daily processes by creating and following algorithms),
1A-AP-10 (develop programs with sequences and simple loops) and 1A-AP-11 (decompose steps).
Teacher-led on a projector. The class builds a program from big blocks (Step, Turn left, Turn right,
Plant, Repeat) and runs it; a rabbit gardener follows it one block at a time, lighting up each block as
it goes. Every garden can be planted the long way, but a Repeat block does it with fewer blocks, and
fewer blocks earn more stars. The last garden is free: no seed spots, just draw with flowers.

.spot{position:absolute;inset:18%;border-radius:50%;border:5px dashed #fff8;display:grid;place-items:center}
.spot::before{content:'';width:22%;height:22%;border-radius:50%;background:#f0d48a;box-shadow:-14px 8px 0 -2px #f0d48a,14px 8px 0 -2px #f0d48a}
.cell.done .spot{display:none}
.rock,.flower,.sprout{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);pointer-events:none}
.rock{width:86%;bottom:6%}
.flower{height:118%;transform-origin:50% 100%}
.sprout{width:62%}
.grow{animation:grow .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes grow{from{transform:translateX(-50%) scale(.2,.05)}}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:translateX(-50%) scale(.2)}}
#bunny{position:absolute;transform:translate(-50%,-100%);transition:left .5s ease-in-out,top .5s ease-in-out;pointer-events:none;z-index:5}
#bunny img{display:block;height:100%;margin:0 auto}
#bunny .face{position:absolute;left:50%;top:100%;width:46px;height:46px;margin:-30px 0 0 -23px;border-radius:50%;background:#fffd;box-shadow:0 2px 0 #0003;display:grid;place-items:center;z-index:-1}
#bunny.walk img{animation:hop .5s ease-in-out}
@keyframes hop{50%{transform:translateY(-12%)}}
#bunny.bump img{animation:bump .5s ease-in-out}
@keyframes bump{30%{transform:translateX(var(--bx,0))}60%{transform:translateX(calc(var(--bx,0) * -.3))}}
#bunny.yay img{animation:hop .6s ease-in-out 3}
.say{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:860px;background:#fffef8;border:4px solid #23301f;border-radius:18px;padding:6px 18px;font:700 22px/1.3 'Trebuchet MS','Segoe UI',sans-serif;box-shadow:0 5px 0 #0004;text-align:center;z-index:6}
.say:empty{display:none}
.stars{color:#f2b31b;letter-spacing:.1em;text-shadow:0 2px 0 #a8740a}
.calm #bunny{transition:none}
.calm *{animation:none!important}

.panel{background:#fbfdf6;border-left:3px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
@media (max-width:759px){.panel{border-left:0;border-top:3px solid var(--line)}}
.panel h2{margin:2px 0 0;font:800 13px/1 'Segoe UI',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.levels{display:flex;flex-wrap:wrap;gap:6px}
.levels button{min-width:46px;min-height:46px;border:2px solid var(--line);background:#fff;border-radius:12px;font:800 18px/1 'Trebuchet MS',sans-serif;display:grid;place-items:center;gap:1px;padding:4px 6px}
.levels button small{font-size:10px;color:#e0a00d;letter-spacing:.05em}
.levels button[aria-current="true"]{background:#35603a;border-color:#35603a;color:#fff}
.goal{margin:0;font:600 17px/1.35 'Segoe UI',sans-serif;color:var(--muted)}
.goal b{color:var(--ink)}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.blk{border:0;border-radius:12px;color:#fff;font:800 15px/1.1 'Trebuchet MS','Segoe UI',sans-serif;min-height:66px;display:grid;place-items:center;gap:2px;padding:6px 4px;box-shadow:inset 0 -5px 0 #0003,0 3px 0 #0002}
.blk:disabled{opacity:.4;cursor:default}
.blk svg{width:28px;height:28px}
.step{background:var(--step)}.left,.right{background:var(--turn)}.plant{background:var(--plant)}.repeat{background:var(--loop)}
.program{flex:1;min-height:160px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.program.target{border-color:#35603a}
.program>.empty{color:var(--muted);font-style:italic;margin:auto;text-align:center}
.pb{display:flex;align-items:center;gap:10px;border-radius:12px;color:#fff;font:800 19px/1 'Trebuchet MS',sans-serif;min-height:48px;padding:4px 6px 4px 12px;box-shadow:inset 0 -5px 0 #0003}
.pb svg{width:26px;height:26px;flex:none}
.pb .x{margin-left:auto;border:0;background:#0002;color:#fff;border-radius:9px;width:40px;height:40px;font-size:20px;line-height:1}
.pb.now{outline:5px solid #ffd23f;outline-offset:2px}
.loop{border-radius:14px;background:var(--loop);padding:0 0 10px 0;box-shadow:inset 0 -5px 0 #0003}
.loop>.pb{box-shadow:none}
.loop .count{display:flex;align-items:center;gap:4px}
.loop .count button{border:0;background:#0002;color:#fff;border-radius:9px;width:38px;height:38px;font:800 22px/1 sans-serif}
.loop .count b{min-width:26px;text-align:center;font-size:24px}
.loop .body{margin:2px 10px 0 26px;background:#fff6e8;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:52px;border:3px dashed transparent;cursor:pointer}
.loop .body.target{border-color:#35603a}
.loop .body .hint{color:#a26a1d;font:700 14px/1.2 'Segoe UI',sans-serif;margin:auto 0;text-align:center}
.loop .lip{color:#fff;font:800 14px/1 'Segoe UI',sans-serif;margin:6px 0 0 12px;display:flex;gap:8px;align-items:center}
.loop .lip button{border:0;background:#0002;color:#fff;border-radius:9px;min-height:34px;padding:0 10px;font-weight:800}
.row{display:flex;gap:8px}
.big{flex:1;border:0;border-radius:16px;min-height:60px;font:800 21px/1 'Trebuchet MS','Segoe UI',sans-serif;color:#fff;box-shadow:0 5px 0 #0004}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0004}
.big:disabled{opacity:.45;cursor:default}
.go{background:#2f8f4e}.gray{background:#6b7466}
.big.sm{min-height:46px;font-size:17px}
.count-line{font:700 15px/1 'Segoe UI',sans-serif;color:var(--muted)}

@media (max-width:759px),(max-height:640px){
  header{padding:6px 12px}
  h1{font-size:19px} h1 small{display:none}
  .icon-btn{min-height:38px;font-size:13px;padding:0 10px}
  main{grid-template-columns:minmax(0,1fr) 300px}
  .panel{padding:8px 10px;gap:6px}
  .levels button{min-width:36px;min-height:36px;font-size:15px}
  .goal{font-size:13px}
  .blk{min-height:48px;font-size:11px}
  .blk svg{width:20px;height:20px}
  .pb{min-height:38px;font-size:15px}
  .pb .x,.loop .count button{width:32px;height:32px}
  .big{min-height:44px;font-size:17px}
}
/* short boxes (the 16:10 preview, 800x500, 1000x625): Run and the blocks stay on screen without scrolling.
   The garden buttons go on one row, the Gardens heading hides, and the program list shrinks and scrolls inside. */
@media (max-height:640px){
  .panel{gap:5px}
  .panel>h2:first-child{display:none}
  .levels{flex-wrap:nowrap;gap:4px}
  .levels button{min-width:0;flex:1;min-height:34px;padding:2px;border-radius:9px}
  .levels button small{font-size:8px}
  .goal{line-height:1.3}
  .program{min-height:56px;padding:6px}
  .big,.big.sm{min-height:40px;font-size:16px;border-radius:12px}
}
</style>
</head>

<script>
// Curio Class kit: what every tool does the same way (motion, sound, read aloud, timing).
// Inlined by scripts/bundle_tool.py from a kit:curio script tag, before the tool's own script.
// One fix here reaches every tool on its next bundle. Docs: docs/KIT.md
const Curio = (() => {
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- motion: the Motion button, the OS reduced-motion setting, remembered across tools ----------
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  const motionFns = [];
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    const b = $('motion');
    if (b) { b.setAttribute('aria-pressed', !reduce); b.textContent = reduce ? '⏸ Motion' : '✨ Motion'; }
    motionFns.forEach(f => f(reduce));
  }

  // ---------- sound: the Sound button turns off chimes and narration (Read still speaks) ----------
  let sound = true;
  const soundFns = [];

  // ---------- speech: recorded clips first, then the best browser voice ----------
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    // Chrome fills its voice list late, so an early line waits for it; cancel() also drops a line still waiting,
    // or it would start after the next one and the tool would talk over itself
    const speak = speechSynthesis.speak.bind(speechSynthesis), cancel = speechSynthesis.cancel.bind(speechSynthesis), held = new Set();
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      held.add(u);
      const go = () => { if (!held.delete(u)) return; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.cancel = () => { held.forEach(u => u.onend && u.onend()); held.clear(); cancel(); };
    speechSynthesis.getVoices();
  }
  let clips = {}, rate = .9, talk = 0, clip = null, last = [], heard = false;
  // nothing speaks until the first tap or key: browsers block sound before that, and a tool shouldn't talk on load
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { heard = true; }, {once: true, capture: true});
  function stop() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (clips[text]) { clip = new Audio(clips[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = rate; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  // say one line or several in a row; resolves when the last one ends (or at once when sound is off).
  // force: speak even with Sound off or before the first tap (the Read button)
  async function say(parts, force) {
    if (!heard && !force) return;
    if (!sound && !force) return;
    stop();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(150); }
  }

  // ---------- chimes: a soft sine tone, through one shared audio context ----------
  let ctx = null;
  const audio = () => ctx || (ctx = new (window.AudioContext || window.webkitAudioContext)());
  function tone(freq, dur = .3, vol = .05, type = 'sine') {
    if (!sound) return;
    try {
      const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
    } catch {}
  }
  const yes = () => [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .35, .05), i * 110));

  // set everything up once the page is there: {clips: "voice:*", rate: .9, readFallback: () => text}
  function init(opts = {}) {
    clips = opts.clips || {}; if (opts.rate) rate = opts.rate;
    const m = $('motion');
    if (m) m.onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
    const s = $('sound');
    if (s) s.onclick = () => {
      sound = !sound;
      s.setAttribute('aria-pressed', sound); s.textContent = sound ? '🔔 Sound' : '🔇 Sound';
      if (!sound) stop();
      soundFns.forEach(f => f(sound));
    };
    const r = $('read');
    if (r) r.onclick = () => say(last.length ? last : [opts.readFallback ? opts.readFallback() : ($('hint') || {}).textContent || ''], true);
    showMotion();
  }
  // a stage of fixed design size, scaled to fit its box: fit('stage', 'scene', 1000, 620)
  function fit(stageId, sceneId, w = 1000, h = 620) {
    const go = () => { const r = $(stageId).getBoundingClientRect(); $(sceneId).style.setProperty('--s', Math.min(r.width / w, r.height / h)); };
    new ResizeObserver(go).observe($(stageId)); go();
  }

  return {
    init, say, stop, wait, tone, yes, audio, fit, bestVoice,
    get reduce() { return reduce; }, get sound() { return sound; }, get last() { return last; },
    onMotion: f => motionFns.push(f), onSound: f => soundFns.push(f),
  };
})();
</script>

  function placeBunny(walk = true) {
    const {x, y, d} = state.g, b = $('bunny');
    b.style.left = OX + (x + .5) * CELL + 'px';
    b.style.top = OY + (y + .86) * CELL + 'px';
    b.style.height = CELL * 1.3 + 'px';
    $('bunny-img').src = FACE[d];
    $('bunny-img').style.transform = d === 3 ? 'scaleX(-1)' : '';
    $('face').innerHTML = `<svg viewBox="0 0 28 28" width="30" height="30" style="transform:rotate(${d * 90}deg)"><path d="M14 3L4 15h6v10h8V15h6z" fill="#35603a"/></svg>`;
    b.classList.remove('walk', 'bump', 'yay');
    if (walk && !reduce) { void b.offsetWidth; b.classList.add('walk'); }
  }
  // the message box; `parts` is what Read and narration speak (every part is a line in voice/lines.json)
  let sayParts = [];
  function say(html, parts) { $('say').innerHTML = html; sayParts = parts || []; }

  // ---------- program editor ----------
  const blocks = list => list.reduce((n, b) => n + 1 + (b.body ? blocks(b.body) : 0), 0);
  function add(t) {
    if (state.running) return;
    SFX.click();
    const into = state.target ? state.target.body : state.prog;
    if (t === 'repeat') {
      const b = {t, n: 3, body: []};
      state.prog.push(b);
      state.target = b;  // new blocks go inside the loop until Done
    } else into.push({t});
    drawProgram();
  }
  function drawProgram() {
    const host = $('program');
    host.classList.toggle('target', !state.target);
    host.replaceChildren();
    if (!state.prog.length) host.innerHTML = '<p class="empty">Tap the blocks above to build a program.</p>';
    const row = (b, list) => {
      const d = document.createElement('div');
      d.className = 'pb ' + b.t;
      d.innerHTML = `${ICON[b.t]}<span>${LABEL[b.t]}</span>`;
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '✕'; x.title = 'Remove this block'; x.setAttribute('aria-label', 'Remove ' + LABEL[b.t]);
      x.onclick = e => {
        e.stopPropagation();
        if (state.running) return;
        list.splice(list.indexOf(b), 1);
        if (state.target === b) state.target = null;
        drawProgram();
      };
      b.el = d;
      return [d, x];
    };
    for (const b of state.prog) {
      if (b.t !== 'repeat') {
        const [d, x] = row(b, state.prog); d.append(x); host.append(d); continue;
      }
      const loop = document.createElement('div');
      loop.className = 'loop';
      const [head, x] = row(b, state.prog);
      head.querySelector('span').textContent = 'Repeat';
      const count = document.createElement('span');
      count.className = 'count';
      count.innerHTML = `<button aria-label="Fewer times">−</button><b>${b.n}</b><button aria-label="More times">+</button> times`;
      const [minus, plus] = count.querySelectorAll('button');
      minus.onclick = () => { if (!state.running && b.n > 2) { b.n--; SFX.click(); drawProgram(); } };
      plus.onclick = () => { if (!state.running && b.n < 9) { b.n++; SFX.click(); drawProgram(); } };
      head.append(count, x);
      const body = document.createElement('div');
      body.className = 'body' + (state.target === b ? ' target' : '');
      body.title = 'Tap to add blocks inside this loop';
      body.onclick = () => { if (!state.running) { state.target = b; drawProgram(); } };
      for (const c of b.body) { const [d, cx] = row(c, b.body); d.append(cx); body.append(d); }
      if (!b.body.length) body.innerHTML = '<p class="hint">Blocks you tap now go in here</p>';
      const lip = document.createElement('div');
      lip.className = 'lip';
      if (state.target === b) {
        const done = document.createElement('button');
        done.textContent = 'Done with loop ⤵';
        done.onclick = e => { e.stopPropagation(); state.target = null; drawProgram(); };
        lip.append(done);
      } else lip.innerHTML = '&nbsp;';
      loop.append(head, body, lip);
      host.append(loop);
    }
    const n = blocks(state.prog), L = LEVELS[state.lv];
    $('count').textContent = n ? `${n} block${n > 1 ? 's' : ''}` : '';
    for (const btn of $('palette').children) btn.disabled = state.running || (btn.dataset.t === 'repeat' && !!state.target);
    $('run').disabled = state.running || !n;
    $('undo').disabled = $('clear').disabled = state.running || !n;
    host.lastElementChild?.scrollIntoView?.({block: 'nearest'});
  }
  $('palette').innerHTML = Object.keys(LABEL).map(t => `<button class="blk ${t}" data-t="${t}">${ICON[t]}${LABEL[t]}</button>`).join('');
  for (const b of $('palette').children) b.onclick = () => add(b.dataset.t);
  $('undo').onclick = () => {

  // ---------- running ----------
  const STEP_MS = 650;
  let runN = 0;
  const fresh = () => { const r = runN, lv = state.lv; return () => r === runN && lv === state.lv; };
  async function run() {
    if (state.running || !state.prog.length) return;
    state.running = true; state.target = null;
    runN++;  // feedback from an earlier run that never started is dropped (its moment has passed)
    drawGarden(); drawProgram();
    const L = LEVELS[state.lv];
    say('');
    let ok = true;
    const doOne = async b => {
      b.el.classList.add('now'); b.el.scrollIntoView?.({block: 'nearest'});  // the short program list keeps the running block in view
      const g = state.g;
      if (b.t === 'step') {
        const nx = g.x + DX[g.d], ny = g.y + DY[g.d];
        const rock = (L.rocks || []).some(([a, c]) => a === nx && c === ny);
        if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h || rock) {
          SFX.bonk();
          const bn = $('bunny'); bn.style.setProperty('--bx', DX[g.d] * 18 + 'px');
          bn.classList.remove('bump'); void bn.offsetWidth; if (!reduce) bn.classList.add('bump');
          const line = rock ? VO.rock : VO.edge;
          say(line, [line]); narrate('bonk#' + runN, [line], fresh());
          ok = false;
        } else { g.x = nx; g.y = ny; SFX.step(); placeBunny(); }
      } else if (b.t === 'left' || b.t === 'right') {
        g.d = (g.d + (b.t === 'left' ? 3 : 1)) % 4; SFX.turn(); placeBunny(false);

      for (let i = 0; i < b.n; i++) {
        b.el.classList.add('now');
        b.el.querySelector('.count b').textContent = `${i + 1}/${b.n}`;
        if (!b.body.length) await wait(STEP_MS);

  }
  function plant(x, y) {

    g.planted.add(key);

  function finish(ok) {
