<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sight Words · Curio Class</title>
<meta name="description" content="Quiet Dolch and Fry sight word practice. Read aloud with a teacher or partner. Three modes, one word at a time. Works offline.">
<!--
Sight Words, Curio Class. Grade 2, CCSS RF.2.3f. Supplied words.json embedded unchanged.
Instructions use browser speech, never the target words. No microphone or automatic assessment.
Illustrations generated with OpenAI gpt-image, edited for Curio Class.
Content CC BY 4.0, code MIT. One offline file, no network requests.
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root {
  --paper:#f6efdf; --ink:#222e3a; --muted:#515e68; --line:#b2b8b7; --focus:#ae4b12;
  --brand:#234d77; --btn:#fcf8ee; --btn-line:#6e8191; --head-ink:#234d77; --panel:#f6efdf;
}
body {
  border:7px solid var(--brand); min-height:100%; height:100dvh;
  background:var(--paper) url(art:parchment) center / 700px;
  grid-template-rows:auto minmax(0,1fr) auto;
}
button, select {
  min-height:60px; min-width:60px; border:1px solid var(--btn-line); border-radius:7px;
  padding:8px 16px; background:#fffaf0; color:var(--ink); font:600 17px/1.2 'Segoe UI',sans-serif;
}
button:hover:not(:disabled) { background:#ebe7da; }
button:active:not(:disabled) { background:#dce6ec; }
button:disabled { opacity:.46; cursor:default; }
button.primary { background:var(--brand); color:#fffaf0; border-color:var(--brand); }
button[aria-pressed="true"] { border:2px solid var(--brand); background:var(--brand); color:#fff; }
button[aria-pressed="true"]:hover { background:#173d62; color:#fff; }
.utilities button[aria-pressed="true"] { background:transparent; color:var(--brand); border-color:#8b969f; }
.utilities button[aria-pressed="true"]:hover { background:#eee8d9; color:var(--brand); }
.set-choice[aria-pressed="true"] span { color:#fff; }
header {
  display:grid; grid-template-columns:minmax(150px,1fr) auto auto; gap:12px;
  padding:12px 24px; background:transparent; color:var(--brand); border-bottom:1px solid #244b7040;
}
h1 { display:flex; align-items:center; gap:8px; font:700 25px/1.15 'Segoe UI',sans-serif; white-space:nowrap; }
.flourish { width:34px; height:42px; object-fit:contain; }
.modes, .utilities { display:flex; gap:6px; }
.modes button { font-size:16px; }
.utilities button { font-size:13px; padding:4px 9px; }
main { display:block; padding:18px 28px 6px; min-height:0; overflow:auto; }
.screen { max-width:1060px; margin:0 auto; height:100%; }
h2 { margin:0 0 12px; font-size:23px; font-weight:600; color:var(--brand); }
p { margin:0; }
#picker { display:flex; flex-direction:column; gap:12px; }
.list-tabs { display:flex; gap:8px; }
.list-tabs button { min-width:120px; }
.set-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.set-grid.fry { grid-template-columns:repeat(5,1fr); }
.set-choice { text-align:left; padding:10px 16px; position:relative; }
.set-choice span { display:block; font-size:13px; color:var(--muted); font-weight:400; margin-top:4px; }
.set-choice[aria-pressed="true"]::after { content:'✓'; position:absolute; top:7px; right:9px; font-size:15px; }
.picker-bottom { display:flex; gap:12px; align-items:center; margin-top:auto; }
#selection-count { flex:1; font-size:14px; color:var(--muted); }
#mix { min-width:125px; }
#reader { display:flex; flex-direction:column; }
.word-meta { display:flex; align-items:center; justify-content:space-between; min-height:30px; gap:16px; }
#set-label, #counter, #timer { font-size:15px; color:var(--muted); }
#timer { font-variant-numeric:tabular-nums; white-space:nowrap; }
.word-space { display:flex; flex:1; min-height:130px; justify-content:center; align-items:center; gap:28px; }
.word-stack { text-align:center; min-width:0; }
#word { font:500 clamp(64px,7vw,96px)/1.2 'Century Gothic','Trebuchet MS',sans-serif; letter-spacing:.025em; }
#also { font-size:13px; color:var(--muted); min-height:20px; margin-top:12px; }
#word-flag { font-size:13px; color:var(--brand); height:22px; }
#hourglass { width:64px; text-align:center; flex:0 0 64px; }
#hourglass svg { width:30px; height:40px; display:block; margin:0 auto 6px; }
#sand { fill:#31613d; }
#hourglass[data-phase="yellow"] #sand { fill:#876100; }
#hourglass[data-phase="red"] #sand { fill:#a44537; }
#pace { font-size:12px; color:var(--muted); }
.actions { display:grid; gap:8px; grid-template-columns:repeat(2,1fr); margin:0 auto 8px; width:min(400px,100%); }
.actions:not(#explore-actions):not(#mark-actions) { grid-template-columns:repeat(3,1fr); width:min(620px,100%); }
#secondary-actions { grid-template-columns:repeat(4,1fr)!important; }
.mark-actions { grid-template-columns:repeat(2,1fr); }
#right { color:#245535; border-color:#60816a; background:#eef4e9; }
#not-yet { color:#873c31; border-color:#aa7a70; background:#faf0e7; }
.ready { display:flex; flex-direction:column; justify-content:center; gap:22px; max-width:550px; }
.ready p { font-size:18px; line-height:1.5; }
.ready label { display:flex; align-items:center; gap:16px; }
.ready select { flex:1; }
.ready-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
#result-score { font-size:30px; margin:16px 0; }
#results { display:flex; flex-direction:column; }
#best { color:var(--muted); margin-bottom:18px; }
.word-list { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
.word-list button { font-weight:400; }
#review-words { font-size:19px; line-height:1.8; margin:12px 0; overflow:auto; min-height:0; }
#celebration { padding:22px; background:#e5edf2; border:2px solid var(--brand); text-align:center; font-size:32px; }
.result-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:12px; flex-shrink:0; }
footer { padding:4px 28px 10px; max-width:1160px; width:100%; margin:auto; }
#hint { min-height:44px; margin:0; font-size:15px; line-height:1.4; display:flex; align-items:center; }
.privacy { font-size:11px; color:var(--muted); }
#hint, .privacy { justify-content:center; text-align:center; }
dialog {
  max-width:min(670px,calc(100vw - 30px)); max-height:80dvh;
  border:3px solid var(--brand); border-radius:8px; background:#faf3e4;
}
dialog::backdrop { background:#1a304c66; }
.dialog-head { display:flex; gap:20px; align-items:center; justify-content:space-between; }
.dialog-head h2 { margin:0; }
#flag-list { max-height:48dvh; overflow:auto; }
.confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:4; }
.confetti i { position:absolute; width:9px; height:15px; background:var(--brand); animation:fall 1.8s ease-in forwards; }
@keyframes fall { from { transform:translateY(-30px) rotate(0); } to { transform:translateY(105vh) rotate(400deg); } }
.calm .confetti { display:none; }
@media (max-width:1090px) {
  header { grid-template-columns:1fr auto; padding:6px 10px; gap:6px; }
  .modes { grid-column:1 / -1; grid-row:2; }
  .modes button { flex:1; }
  .utilities { grid-column:2; grid-row:1; }
}
@media (max-height:650px) and (min-width:640px) {
  body { border-width:6px; }
  header { display:flex; gap:6px; padding:6px; flex-wrap:nowrap; }
  h1 { font-size:18px; min-width:104px; gap:3px; }
  .flourish { width:20px; height:30px; }
  .modes { flex:1; gap:3px; }
  .modes button { padding:4px 6px; font-size:14px; }
  .utilities { gap:3px; }
  .utilities button { padding:3px; width:60px; font-size:12px; }
  main { padding:8px 14px 2px; }
  #picker { gap:8px; }
  #picker h2 { display:none; }
  .set-grid { gap:6px; }
  .set-choice { padding:5px 10px; font-size:15px; }
  .set-choice span { margin-top:2px; }
  footer { padding:2px 14px 4px; }
  #hint { min-height:30px; font-size:13px; }
  .privacy { font-size:10px; }
  .word-space { min-height:110px; }
  #word { line-height:1.1; }
  #word-flag { height:16px; }
  #also { min-height:16px; margin-top:0; font-size:12px; }
  .ready { gap:10px; }
  .ready h2 { margin-bottom:0; }
  .ready p { font-size:16px; }
  #results h2 { font-size:20px; margin:0 0 6px; }
  #celebration { padding:10px; font-size:24px; line-height:1.2; }
  #result-score { font-size:23px; margin:6px 0; }
  #best { margin-bottom:6px; }
  #review-label { font-size:13px; line-height:1.3; }
  #review-words { font-size:15px; line-height:1.4; margin:4px 0; }
  .result-actions { padding-top:6px; }
}
@media (max-width:639px) {
  body { border-width:6px; }
  h1 { font-size:19px; gap:3px; }
  .flourish { width:22px; height:32px; }
  .utilities { gap:3px; }
  .utilities button { width:60px; padding:2px; font-size:11px; }
  header { padding:4px; }
  .modes button { padding:4px 7px; font-size:14px; }
  main { padding:8px 10px 2px; }
  h2 { font-size:20px; margin-bottom:0; }
  #picker { gap:7px; }
  .list-tabs button { flex:1; }
  .set-grid, .set-grid.fry { grid-template-columns:repeat(2,1fr); gap:6px; }
  .set-choice { padding:6px 12px; font-size:15px; }
  .set-choice span { font-size:12px; margin-top:3px; }
  .picker-bottom { gap:6px; }
  #mix { min-width:90px; padding:5px; font-size:14px; }
  #selection-count { font-size:12px; }
  #open { padding:6px 12px; }
  footer { padding:2px 10px 6px; }
  #hint { font-size:13px; min-height:54px; }
  .privacy { font-size:10px; }
  .actions button { padding:5px; font-size:15px; }
  #secondary-actions button { font-size:13px; }
  #word { font-size:clamp(50px,13vw,72px); white-space:nowrap; }
  .word-space { gap:8px; }
  #hourglass { width:54px; flex-basis:54px; }
  #set-label, #counter { font-size:13px; }
  .ready { gap:18px; }
  #result-score { font-size:25px; }
}
</style>
</head>
<body>
<header>
  <h1><img class="flourish" src="art:flourish" alt="">Sight Words</h1>
  <nav class="modes" role="group" aria-label="Mode">
    <button id="m-explore" aria-pressed="true">Explore</button>
    <button id="m-practice" aria-pressed="false">Practice test</button>
    <button id="m-challenge" aria-pressed="false">Challenge</button>
  </nav>
  <div class="utilities">
    <button id="sound" aria-pressed="true">Sound</button>
    <button id="motion" aria-pressed="true">Motion</button>
    <button id="read" title="Read the instructions, never the word">Read</button>
  </div>
</header>
<main>
  <section class="screen" id="picker" aria-labelledby="picker-title">
    <h2 id="picker-title">Choose your words</h2>
    <div class="list-tabs" role="group" aria-label="Word list">
      <button id="list-dolch" aria-pressed="true">Dolch</button>
      <button id="list-fry" aria-pressed="false">Fry</button>
    </div>
    <div class="set-grid" id="sets" role="group" aria-label="Choose one or more sets"></div>
    <div class="picker-bottom">
      <button id="mix" role="switch" aria-checked="false">Mix: off</button>
      <span id="selection-count"></span>
      <button class="primary" id="open">Start →</button>
    </div>
  </section>
  <section class="screen" id="reader" hidden aria-label="Read one word">
    <div class="word-meta"><span id="set-label"></span><span id="counter"></span><span id="timer" hidden></span></div>
    <div class="word-space">
      <div class="word-stack"><div id="word-flag"></div><div id="word"></div><div id="also"></div></div>
      <div id="hourglass" data-phase="green" hidden aria-label="Reading pace: green, first four seconds">
        <svg viewBox="0 0 30 42" aria-hidden="true">
          <path d="M4 2h22M4 40h22M7 3c0 10 3 13 8 18-5 5-8 8-8 18M23 3c0 10-3 13-8 18 5 5 8 8 8 18"
            fill="none" stroke="#667078" stroke-width="2"/>
          <path id="sand" d="M9 9h12c-1 5-3 7-6 10-3-3-5-5-6-10M9 36l6-11 6 11z"/>
        </svg>
        <span id="pace">Try</span>
      </div>
    </div>
    <div class="actions" id="explore-actions">
      <button id="back">← Back</button><button id="next" class="primary">Next →</button>
    </div>
    <div class="actions mark-actions" id="mark-actions" hidden>
      <button id="not-yet">× Not yet</button><button id="right">✓ Right</button>
    </div>
    <div class="actions" id="secondary-actions">
      <button id="shuffle">⇄ Shuffle</button><button id="flag" aria-pressed="false">⚑ Flag</button>
      <button id="flagged">⚑ Flagged (0)</button><button id="change-sets">Sets</button>
    </div>
    <div class="actions" id="test-actions" hidden>
      <button id="skip">→ Skip</button><button id="test-flag" aria-pressed="false">⚑ Flag</button><button id="end">End</button>
    </div>
  </section>
  <section class="screen ready" id="ready" hidden>
    <h2 id="ready-title"></h2><p id="ready-copy"></p>
    <label id="length-label">Words <select id="length" aria-label="Practice session length">
      <option value="10">10</option><option value="20" selected>20</option><option value="30">30</option>
      <option value="all">The whole set</option>
    </select></label>
    <div class="ready-actions"><button id="begin" class="primary">Start</button><button id="ready-sets">Choose sets</button></div>
  </section>
  <section class="screen" id="results" hidden>
    <h2 id="result-title">Practice complete</h2>
    <div id="celebration" hidden>30 right in one minute!</div>
    <p id="result-score"></p><p id="best"></p><p id="review-label"></p><p id="review-words"></p>
    <div class="result-actions">
      <button id="practice-these" class="primary">Practice these</button>
      <button id="again">Try again</button><button id="result-sets">Choose sets</button>
    </div>
  </section>
</main>
<footer>
  <p id="hint"></p><p class="privacy">Picks, flags and best scores stay on this device. No recording.</p>
</footer>
<dialog id="flags-dialog" aria-labelledby="flags-title">
  <div class="dialog-head"><h2 id="flags-title">Flagged words</h2><button id="close-flags">Close</button></div>
  <div id="flag-list" class="word-list"></div>
  <p id="flags-empty">No flags yet. Close, then tap Flag on a word to save it here.</p>
</dialog>
<div id="confetti" class="confetti" hidden aria-hidden="true"></div>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const DATA = "json:words";
  const BOTH = new Set(DATA.on_both);
  const STORAGE = 'curio-sight-words-v1';
  const L = {
    picker:'Choose Dolch or Fry. Tap one or more sets, then tap Start.',
    explore:'Read the word out loud. Tap Next for another word. Tap Flag to save a word for later.',
    practice:'Read each word out loud. Tap Right or Not yet to move on. The hourglass never skips a word.',
    practiceReady:'Choose how many words to practice. Tap Start when you are ready.',
    challenge:'Read up to thirty words in one minute. Tap Right or Not yet for each word. Skip counts as Not yet.',
    challengeReady:'Thirty words in one minute. Tap Start when you are ready.',
    results:'Tap Practice these to read the words to try again, or tap Try again for a new session.',
    flags:'Tap a flagged word to read it, or tap Close to return.'
  };
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORAGE) || '{}') || {}; } catch {}
  const state = {
    mode:['explore','practice','challenge'].includes(saved.mode) ? saved.mode : 'explore', view:'picker',
    list:saved.list === 'Fry' ? 'Fry' : 'Dolch',
    picks:Array.isArray(saved.picks) ? saved.picks.filter(i => Number.isInteger(i) && DATA.sets[i]) : [0],
    mix:!!saved.mix,
    flags:new Set(Array.isArray(saved.flags) ? saved.flags.filter(w => typeof w === 'string') : []),
    best:saved.best && typeof saved.best === 'object' ? saved.best : {},
    deck:[], index:0, right:0, missed:[], skipped:[], length:'20', startedAt:0, wordAt:0,
    active:false, done:false, runKey:'', elapsed:0
  };
  const V = Curio.voice({
    lines:L, scope:() => state.view + ':' + state.mode, hint:false, read:() => $('hint').textContent,
    welcome:() => {
      if (state.view === 'picker') return 'picker';
      if (state.view === 'reader' && state.mode === 'explore') return state.deck.length > 1 ? ['explore',{needs:'#next'}] : null;
      if (state.view === 'reader') return state.mode;
      if (state.view === 'ready') return state.mode + 'Ready';
      return null;
    }
  });
  function save() {
    try {
      localStorage.setItem(STORAGE, JSON.stringify({mode:state.mode, list:state.list, picks:state.picks,
        mix:state.mix, flags:[...state.flags], best:state.best}));
    } catch { document.querySelector('.privacy').textContent = 'Saving is unavailable. Choices last until this page closes.'; }
  }
  function focus(id) { $(id).focus({preventScroll:true}); }
  function screen(view, focusId) {
    V.hush();
    $('confetti').hidden = true;
    state.view = view;
    for (const id of ['picker','reader','ready','results']) $(id).hidden = id !== view;
    $('hint').textContent = view === 'picker' ? L.picker : view === 'results' ? L.results
      : L[state.mode + (view === 'ready' ? 'Ready' : '')];
    if (focusId) queueMicrotask(() => { if (!$(focusId).hidden) focus(focusId); });
    if (view !== 'results') V.welcome();
  }
  function shuffled(items) {
    const out = items.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }
  function pool() {
    const seen = new Set();
    return DATA.sets.flatMap((set, i) => {
      if (!state.picks.includes(i)) return [];
      return set.words.filter(word => {
        if (seen.has(word.toLowerCase())) return false;
        seen.add(word.toLowerCase());
        return true;
      }).map(word => ({word, list:set.list, set:set.name}));
    });
  }
  function key() { return state.picks.slice().sort((a,b) => a - b).join(','); }
  function updatePicker() {
    for (const list of ['Dolch','Fry']) $('list-' + list.toLowerCase()).setAttribute('aria-pressed', state.list === list);
    $('sets').classList.toggle('fry', state.list === 'Fry');
    for (const button of $('sets').children) {
      const i = Number(button.dataset.set);
      button.hidden = DATA.sets[i].list !== state.list;
      button.setAttribute('aria-pressed', state.picks.includes(i));
    }
    $('mix').setAttribute('aria-checked', state.mix);
    $('mix').textContent = 'Mix: ' + (state.mix ? 'on' : 'off');
    $('selection-count').textContent = state.picks.length + ' set' + (state.picks.length === 1 ? '' : 's') + ' · ' + pool().length + ' words';
    $('open').disabled = !state.picks.length;
    $('hint').textContent = state.picks.length ? L.picker : 'Tap one or more sets to choose your words.';
  }
  DATA.sets.forEach((set,i) => {
    const button = document.createElement('button');
    button.id = 'set-' + i;
    button.className = 'set-choice';
    button.dataset.set = i;
    button.append(document.createTextNode(set.name));
    const count = document.createElement('span');
    count.textContent = set.words.length + ' words';
    button.append(count);
    button.onclick = () => {
      state.picks = state.picks.includes(i) ? state.picks.filter(x => x !== i) : [...state.picks,i];
      updatePicker();
      save();
    };
    $('sets').append(button);
  });
  function showPicker(moveFocus = true) {
    state.active = false;
    screen('picker', moveFocus ? 'list-' + state.list.toLowerCase() : null);
    updatePicker();
  }
  function setMode(mode, moveFocus = true) {
    if (!['explore','practice','challenge'].includes(mode)) return;
    if (mode === state.mode && moveFocus) return;
    state.active = false;
    state.mode = mode;
    for (const m of ['explore','practice','challenge']) $('m-' + m).setAttribute('aria-pressed', mode === m);
    save();
    if (state.view === 'picker' || !pool().length) showPicker(false);
    else openMode(moveFocus);
  }
  function openMode(moveFocus = true) {
    if (state.mode === 'explore') {
      state.deck = state.mix ? shuffled(pool()) : pool();
      state.index = 0;
      state.done = false;
      screen('reader', moveFocus ? 'next' : null);
      renderWord();
    } else {
      $('ready-title').textContent = state.mode === 'practice' ? 'Practice test' : 'One-minute Challenge';
      $('ready-copy').textContent = state.mode === 'practice'
        ? 'Read aloud with a partner. Take the time you need.'
        : '30 words. One minute. Read aloud, then mark Right or Not yet. Skip counts as Not yet.';
      $('length-label').hidden = state.mode !== 'practice';
      screen('ready', moveFocus ? 'begin' : null);
    }
  }
  function start() {
    const bank = shuffled(pool());
    const count = state.mode === 'challenge' ? 30 : state.length === 'all' ? bank.length : Number(state.length);
    state.deck = bank.slice(0,count);
    state.index = 0;
    state.right = 0;
    state.missed = [];
    state.skipped = [];
    state.done = false;
    state.active = true;
    state.runKey = key();
    state.startedAt = performance.now();
    state.wordAt = state.startedAt;
    screen('reader','right');
    renderWord();
  }
  function renderWord() {
    const item = state.deck[state.index];
    if (!item) return;
    const explore = state.mode === 'explore';
    $('word').textContent = item.word;
    $('also').textContent = BOTH.has(item.word.toLowerCase()) ? 'also ' + (item.list === 'Dolch' ? 'Fry' : 'Dolch') : '';
    $('set-label').textContent = item.list + ' · ' + item.set;
    $('counter').textContent = (state.index + 1) + ' of ' + state.deck.length;
    $('timer').hidden = state.mode !== 'challenge';
    $('hourglass').hidden = state.mode !== 'practice';
    $('explore-actions').hidden = !explore;
    $('secondary-actions').hidden = !explore;
    $('mark-actions').hidden = explore;
    $('test-actions').hidden = explore;
    $('back').disabled = state.index === 0;
    $('next').disabled = state.index === state.deck.length - 1;
    if (explore) $('hint').textContent = exploreHint();
    updateFlag();
    fitWord();
    tick();
  }
  function exploreHint() {
    if (state.deck.length === 1) return 'Read this word aloud. Tap Flag to save it, or Sets for more words.';
    if (state.index === state.deck.length - 1) return 'Last word. Tap Back, Shuffle, or Flagged to keep practicing.';
    return L.explore;
  }
  function fitWord() {
    if (state.view !== 'reader') return;
    $('word').style.fontSize = '';
    const style = getComputedStyle($('word'));
    const fontSize = parseFloat(style.fontSize);
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    context.font = style.font;
    const word = $('word').textContent;
    const width = context.measureText(word).width + word.length * fontSize * .025;
    const room = document.querySelector('.word-space').clientWidth - ($('hourglass').hidden ? 8 : 100);
    if (width > room) $('word').style.fontSize = Math.max(28,Math.floor(fontSize * room / width)) + 'px';
  }
  function updateFlag() {
    const item = state.deck[state.index];
    const flagged = item && state.flags.has(item.word.toLowerCase());
    $('word-flag').textContent = flagged ? '⚑ Flagged' : '';
    for (const id of ['flag','test-flag']) {
      $(id).setAttribute('aria-pressed', !!flagged);
      $(id).textContent = flagged ? '⚑ Unflag' : '⚑ Flag';
    }
    const count = state.deck.filter(item => state.flags.has(item.word.toLowerCase())).length;
    $('flagged').textContent = '⚑ Flagged (' + count + ')';
  }
  function toggleFlag() {
    const word = state.deck[state.index]?.word.toLowerCase();
    if (!word) return;
    if (state.flags.has(word)) state.flags.delete(word);
    else state.flags.add(word);
    updateFlag();
    save();
  }
  function navigate(delta) {
    if (state.mode !== 'explore' || state.view !== 'reader') return;
    state.index = Math.max(0,Math.min(state.deck.length - 1,state.index + delta));
    renderWord();
    $('hint').textContent = state.index === state.deck.length - 1
      ? 'Last word. Tap Back, Shuffle, or Flagged to keep practicing.' : L.explore;
    if (document.activeElement.disabled) focus(delta > 0 ? 'back' : 'next');
  }
  function mark(answer) {
    if (!state.active || state.view !== 'reader') return;
    if (state.mode === 'challenge' && performance.now() - state.startedAt >= 60000) {
      finish();
      return;
    }
    const item = state.deck[state.index];
    if (answer === 'right') state.right++;
    else if (answer === 'skip' && state.mode === 'practice') state.skipped.push(item);
    else state.missed.push(item);
    state.index++;
    if (state.index >= state.deck.length) finish();
    else {
      state.wordAt = performance.now();
      renderWord();
    }
  }
  function finish() {
    if (!state.active) return;
    state.elapsed = performance.now() - state.startedAt;
    state.active = false;
    state.done = true;
    state.review = [...state.missed,...state.skipped,...state.deck.slice(state.index)];
    const perfect = state.mode === 'challenge' && state.right === 30 && state.elapsed <= 60000;
    if (state.mode === 'challenge') {
      state.best[state.runKey] = Math.max(Number(state.best[state.runKey]) || 0,state.right);
      save();
    }
    $('result-title').textContent = state.mode === 'practice' ? 'Practice complete' : 'Challenge complete';
    $('result-score').textContent = state.right + ' of ' + state.deck.length + ' right';
    $('best').textContent = state.mode === 'challenge'
      ? 'Best for these sets: ' + state.best[state.runKey] + ' of 30 right.' : 'A little more practice, at your own pace.';
    $('review-label').textContent = state.review.length
      ? 'Try again: Not yet, skipped, and any words left.' : 'Every word marked Right. Nicely read!';
    $('review-words').textContent = state.review.map(item => item.word).join(' · ');
    $('practice-these').hidden = !state.review.length;
    $('celebration').hidden = !perfect;
    screen('results',state.review.length ? 'practice-these' : 'again');
    if (!state.review.length) $('hint').textContent = 'Tap Try again for a new session, or Choose sets for different words.';
    if (perfect) {
      Curio.yes();
      if (!Curio.reduce) {
        $('confetti').replaceChildren();
        for (let i = 0; i < 24; i++) {
          const piece = document.createElement('i');
          piece.style.left = Math.random() * 100 + '%';
          piece.style.background = ['#244b70','#a88039','#527d70'][i % 3];
          piece.style.animationDelay = Math.random() * .3 + 's';
          $('confetti').append(piece);
        }
        $('confetti').hidden = false;
        setTimeout(() => { $('confetti').hidden = true; },2300);
      }
    }
  }
  function tick() {
    if (state.view !== 'reader') return;
    const now = performance.now();
    if (state.mode === 'challenge' && state.active) {
      const remaining = Math.max(0,60000 - (now - state.startedAt));
      const seconds = Math.ceil(remaining / 1000);
      $('timer').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2,'0');
      if (!remaining) finish();
    }
    if (state.mode === 'practice' && state.active) {
      const elapsed = now - state.wordAt;
      const phase = elapsed < 4000 ? 'green' : elapsed < 8000 ? 'yellow' : 'red';
      $('hourglass').dataset.phase = phase;
      $('pace').textContent = {green:'Try',yellow:'Keep trying',red:'Take your time'}[phase];
      $('hourglass').setAttribute('aria-label','Reading pace: ' + phase + '. ' + $('pace').textContent);
    }
  }
  function showFlags() {
    $('flag-list').replaceChildren();
    const flagged = state.deck.filter(item => state.flags.has(item.word.toLowerCase()));
    $('flags-empty').hidden = !!flagged.length;
    flagged.forEach(item => {
      const button = document.createElement('button');
      button.textContent = item.word;
      button.onclick = () => {
        state.index = state.deck.indexOf(item);
        $('flags-dialog').close();
        renderWord();
        focus('flagged');
      };
      $('flag-list').append(button);
    });
    V.hush();
    $('hint').textContent = L.flags;
    $('flags-dialog').showModal();
    V.how('flags');
  }
  for (const mode of ['explore','practice','challenge']) $('m-' + mode).onclick = () => setMode(mode);
  for (const list of ['Dolch','Fry']) $('list-' + list.toLowerCase()).onclick = () => {
    state.list = list;
    updatePicker();
    save();
  };
  $('mix').onclick = () => { state.mix = !state.mix; updatePicker(); save(); };
  $('open').onclick = () => openMode();
  $('begin').onclick = start;
  $('length').onchange = () => { state.length = $('length').value; };
  $('back').onclick = () => navigate(-1);
  $('next').onclick = () => navigate(1);
  $('right').onclick = () => mark('right');
  $('not-yet').onclick = () => mark('missed');
  $('skip').onclick = () => mark('skip');
  $('end').onclick = finish;
  $('flag').onclick = toggleFlag;
  $('test-flag').onclick = toggleFlag;
  $('shuffle').onclick = () => {
    state.deck = shuffled(state.deck);
    state.index = 0;
    renderWord();
    $('hint').textContent = 'Words shuffled. Read aloud, then tap Next.';
  };
  $('flagged').onclick = showFlags;
  $('close-flags').onclick = () => $('flags-dialog').close();
  $('flags-dialog').onclose = () => { $('hint').textContent = exploreHint(); focus('flagged'); };
  for (const id of ['change-sets','ready-sets','result-sets']) $(id).onclick = () => showPicker();
  $('again').onclick = () => openMode();
  $('practice-these').onclick = () => {
    state.mode = 'explore';
    state.deck = state.review.slice();
    state.index = 0;
    for (const mode of ['explore','practice','challenge']) $('m-' + mode).setAttribute('aria-pressed',mode === 'explore');
    screen('reader',state.deck.length > 1 ? 'next' : 'flag');
    renderWord();
    if (state.deck.length === 1) $('hint').textContent = 'Read this word aloud. Tap Flag to save it, or Sets for more words.';
    save();
  };
  addEventListener('keydown',event => {
    if ($('flags-dialog').open || state.view !== 'reader' || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
    const k = event.key.toLowerCase();
    if (k === 'f') { event.preventDefault(); toggleFlag(); }
    else if (state.mode === 'explore' && ['arrowleft','arrowright'].includes(k)) {
      event.preventDefault();
      navigate(k === 'arrowright' ? 1 : -1);
    } else if (state.mode !== 'explore' && ['arrowright','r','arrowleft','n'].includes(k)) {
      event.preventDefault();
      mark(['arrowright','r'].includes(k) ? 'right' : 'missed');
    }
  });
  Curio.onMotion(reduced => { if (reduced) $('confetti').hidden = true; });
  Curio.init({clips:"voice:*",rate:.9});
  const utilityLabels = () => {
    $('sound').textContent = Curio.sound ? 'Sound on' : 'Sound off';
    $('motion').textContent = Curio.reduce ? 'Motion off' : 'Motion on';
  };
  Curio.onSound(utilityLabels);
  Curio.onMotion(utilityLabels);
  utilityLabels();
  setInterval(tick,80);
  new ResizeObserver(fitWord).observe(document.querySelector('.word-space'));
  addEventListener('visibilitychange',tick);
  window.__tool = {state,setMode,allLines:V.allLines,vlog:V.log,get vq() { return V.queue; },pool,tick,data:DATA};
  setMode(state.mode,false);
})();
</script>
</body>
</html>
