<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Style Match · Curio Class</title>
<meta name="description" content="Find a painting's visible tells, collect eighteen museum works, and repaint your own scene with six style recipes. Grades 3-5. Works offline.">
<!--
Art Style Match, Curio Class. Grades 3-5 visual arts: NCAS VA:Re7 and VA:Cn11.
Museum works: The Metropolitan Museum of Art Open Access and Art Institute of Chicago, public domain / CC0.
Individual object links and credits are in content.json and art/public-domain.json.
Illustrations generated with OpenAI gpt-image, edited for Curio Class.
The ten-tell recipe model is a classroom simplification, not a definition of every artwork in a movement.
One offline file. No automatic network requests. Content CC BY 4.0, code MIT.
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root {
  --paper: #fbf6ec;
  --ink: #2a1e22;
  --muted: #6b5a5e;
  --line: #d8c9b4;
  --focus: #d57614;
  --brand: #9b2457;
  --btn: #78163e;
  --btn-line: #c47b9a;
  --head-ink: #fff;
  --panel: #fbf6ec;
  --gold: #d7a93b;
  --felt: #173f45;
}
body {
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
header {
  background: var(--paper);
  color: var(--ink);
  border-top: 5px solid var(--brand);
  padding: 10px 22px;
  gap: 10px;
}
h1 {
  font: 700 clamp(23px, 2.3vw, 34px)/1.05 Georgia, serif;
  letter-spacing: -.04em;
}
h1 small {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0;
  margin-top: 4px;
  opacity: 1;
}
.icon-btn {
  min-height: 44px;
  min-width: 44px;
  padding: 0 12px;
  font-size: 13px;
  color: var(--ink);
  border: 1px solid var(--line);
  background: #fffaf3;
}
#sound {
  width: 88px;
  min-width: 88px;
}
#motion {
  width: 98px;
  min-width: 98px;
}
.seg {
  border: 1px solid var(--line);
  border-radius: 9px;
}
.seg button {
  min-height: 44px;
  min-width: 44px;
  padding: 0 16px;
  font-size: 14px;
  color: var(--ink);
  background: #eee6d8;
}
.seg button[aria-pressed="true"] {
  background: var(--brand);
  color: white;
}
button, a {
  -webkit-tap-highlight-color: transparent;
}
button:active {
  filter: brightness(.94);
}
button:disabled {
  cursor: default;
}
button:focus-visible, a:focus-visible {
  outline: 3px solid #f4bf47;
  outline-offset: 2px;
  box-shadow: 0 0 0 5px #2a1e22;
  z-index: 20;
}
main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 0;
  min-height: 0;
}
.stage {
  min-height: 0;
  background-color: var(--felt);
  background-image: linear-gradient(115deg, #102a3340, #123038aa), var(--felt-image);
  background-size: cover;
  border: 10px solid #483225;
  box-shadow: inset 0 0 0 2px #d9a858, inset 0 0 70px #0007;
  border-radius: 5px;
  margin: 0 0 12px 14px;
  padding: 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  color: var(--paper);
}
.stage::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px solid #d7a93b88;
  border-radius: 40px;
  pointer-events: none;
}
.table-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex: none;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-weight: 700;
  color: #ebce91;
}
.table-title {
  margin: 0;
  font: 500 clamp(20px, 2.2vw, 30px)/1.1 Georgia, serif;
}
.table-sub {
  margin: 4px 0 0;
  color: #fbf6ec;
  font-size: 13px;
}
.album-count {
    flex: none;
    white-space: nowrap;
  border: 1px solid #e8c87a99;
  padding: 8px 12px;
  border-radius: 50%;
  min-width: 54px;
  text-align: center;
  font: 600 16px Georgia, serif;
}
.view {
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 14px;
  flex: 1;
  min-height: 0;
  padding: 7px;
}
.painting-card {
  position: relative;
  min-width: 0;
  min-height: 44px;
  padding: 7px;
  background: linear-gradient(135deg, #fffdf8, #e6d7bc);
  border: 1px solid #e8d6ad;
  border-radius: 7px;
  box-shadow: 2px 6px 12px #0006;
  transform: rotate(var(--tilt, -1deg));
  display: flex;
  flex-direction: column;
  gap: 5px;
  color: var(--ink);
  text-align: left;
  transition: transform .2s, box-shadow .2s;
}
.painting-card:hover {
  transform: translateY(-4px) rotate(0);
  box-shadow: 2px 10px 14px #0008;
}
.painting-card img {
  width: 100%;
  min-height: 0;
  flex: 1;
  object-fit: contain;
  background: #d4c6a8;
}
.painting-card .mini-title {
  font: 600 11px/1.1 Georgia, serif;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.painting-card .collected {
  position: absolute;
  right: 5px;
  top: 5px;
  background: var(--brand);
  color: white;
  border-radius: 50%;
  padding: 3px 6px;
  font-size: 12px;
}
.panel {
  min-width: 0;
  overflow: auto;
  border: 0;
  padding: 14px 20px;
  gap: 14px;
  background: var(--paper);
}
.panel .eyebrow {
  color: var(--brand);
}
.hint {
  margin: 0;
  font: 500 17px/1.45 'Segoe UI', sans-serif;
  min-height: 78px;
}
.panel-rule {
  height: 1px;
  background: var(--line);
  width: 100%;
}
#context {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.note-title {
  font: 500 26px/1.1 Georgia, serif;
  margin: 0 0 8px;
}
.note-copy {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
  margin: 0;
}
.panel-art {
  width: 100%;
  height: 130px;
  position: relative;
  margin: 12px 0;
}
.recipe-sample {
  position: absolute;
  width: 70px;
  height: 95px;
  background: #eee4ce;
  border: 1px solid #aa8d5c;
  border-radius: 6px;
  box-shadow: 2px 5px 6px #0003;
  display: grid;
  place-items: center;
}
.recipe-sample:nth-child(1) {
  left: 10%;
  transform: rotate(-13deg);
  top: 7px;
}
.recipe-sample:nth-child(2) {
  left: 37%;
  transform: rotate(2deg);
  top: 0;
}
.recipe-sample:nth-child(3) {
  left: 64%;
  transform: rotate(14deg);
  top: 14px;
}
.recipe-sample svg {
  width: 44px;
  height: 44px;
}
.privacy {
  margin-top: auto;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
}
.wall-label {
  border-left: 3px solid var(--gold);
  padding-left: 13px;
}
.wall-label h2 {
  margin: 0 0 10px;
  font: italic 500 22px/1.2 Georgia, serif;
}
.wall-label p {
  margin: 8px 0;
  font-size: 14px;
  line-height: 1.4;
}
.wall-label a {
  color: #812047;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-size: 13px;
}
.control {
  border: 1px solid #b7a68c;
  border-radius: 7px;
  background: linear-gradient(#fffcf6, #eee3cf);
  color: var(--ink);
  min-height: 44px;
  min-width: 44px;
  padding: 7px 12px;
  font-weight: 650;
  font-size: 14px;
  box-shadow: 0 2px 0 #0002;
}
.control.primary {
  background: var(--brand);
  color: white;
  border-color: #7b1942;
}
.control.gold {
  background: #d7a93b;
  border-color: #b58a2d;
}
.control:disabled, .control[aria-disabled="true"] {
  opacity: .55;
}
.control[aria-disabled="true"] {
  cursor: progress;
}
.control[aria-pressed="true"] {
  background: #d7a93b;
  border-color: #2a1e22;
  box-shadow: inset 0 0 0 1px #2a1e22;
}
.toolbar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  flex: none;
}
.toolbar .control {
  padding: 5px 12px;
}
.framed-area {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: stretch;
    animation: card-unfold .35s ease;
}
.museum-frame {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.art-viewport {
  position: relative;
  overflow: hidden;
  flex: none;
  background: #33272a;
  border: 1px solid #2a1e22;
  outline: 8px ridge #b58a38;
  box-shadow: 0 0 0 10px #4b3120, 0 0 0 12px #e7c173, 8px 15px 24px #0008;
}
.picture-target {
  border: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: none;
  transition: transform .9s ease;
}
.picture-target img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}
.tell-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 44px;
  height: 44px;
  padding: 8px;
  border-radius: 50%;
  background: #ffe9a1;
  border: 3px solid #9b2457;
  color: var(--ink);
  box-shadow: 0 2px 8px #0008;
}
.zoom-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 48%;
  aspect-ratio: 1;
  border: 2px solid #ffedb3;
  border-radius: 50%;
  box-shadow: 0 0 0 500px #0004;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.tell-detail {
  min-height: 50px;
  color: #fbf6ec;
  text-align: center;
  font-size: 15px;
  margin: 0;
}
.style-reveal {
  border: 1px solid #d7a93b;
  border-radius: 8px;
  padding: 12px;
  font: 500 18px Georgia, serif;
}
.match-view {
  position: relative;
  display: grid;
  grid-template-rows: 70px minmax(0, 1fr) 100px;
  gap: 10px;
}
.styles-row {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
}
.style-card {
  position: relative;
  border: 2px solid #c9a45c;
  border-radius: 7px;
  background: #d7a93b;
  color: var(--ink);
  min-width: 0;
  min-height: 44px;
  padding: 5px;
  font: 650 12px/1.15 'Segoe UI', sans-serif;
  box-shadow: 1px 4px 8px #0005;
}
.style-card.covered {
  background: repeating-linear-gradient(45deg, #c49737 0 3px, #d7a93b 3px 8px);
  opacity: 1;
}
.style-card.covered::after {
  content: '✧';
  display: grid;
  place-items: center;
  position: absolute;
  inset: 7px;
  border: 1px solid #6d4e1e;
  font: 36px Georgia, serif;
}
.style-card.covered span {
  visibility: hidden;
}
.style-card.ready {
  animation: card-unfold .45s ease;
  background: #f9edcf;
}
.style-card small {
  display: block;
  font-size: 10px;
  margin-top: 4px;
}
.style-card svg {
  width: 16px;
  height: 16px;
}
.match-center {
  display: flex;
  min-height: 0;
  gap: 15px;
  align-items: stretch;
  justify-content: center;
}
.match-center .framed-area {
  max-width: 78%;
}
.played {
  flex: 0 0 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}
.played-chip {
  background: #fbf6ec;
  border: 2px solid #d7a93b;
  padding: 9px;
  border-radius: 7px;
  color: var(--ink);
  font-size: 12px;
  text-align: center;
  box-shadow: 3px 4px 9px #0005;
  animation: stick .3s ease;
}
.played-chip svg {
  width: 24px;
  height: 24px;
  display: block;
  margin: 0 auto 5px;
}
.hand {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  max-width: 650px;
  width: 100%;
  margin: auto;
  height: 100%;
}
.tell-card {
  border: 2px solid #d4bc8e;
  border-radius: 9px;
  background: linear-gradient(135deg, #fffdf6, #ecdfc2);
  color: var(--ink);
  padding: 7px;
  min-width: 0;
  min-height: 44px;
  font: 650 13px/1.15 'Segoe UI', sans-serif;
  box-shadow: 3px 5px 9px #0005;
  transform: rotate(var(--tilt, 0deg));
  transition: transform .15s;
}
.tell-card svg {
  display: block;
  width: 38px;
  height: 38px;
  margin: 0 auto 5px;
}
.tell-card[aria-pressed="true"] {
  outline: 3px solid #ffd86f;
  border-color: var(--brand);
  transform: translateY(-8px);
}
.tell-card.bounce {
  animation: bounce .35s ease;
  border-color: var(--brand);
}
.deal-back {
  width: 220px;
  max-width: 70%;
  align-self: center;
  aspect-ratio: .75;
  max-height: 100%;
  border: 10px double #d7a93b;
  border-radius: 13px;
  background: repeating-linear-gradient(45deg, #6d193d 0 5px, #792044 5px 10px);
  box-shadow: 5px 12px 20px #0007;
  display: grid;
  place-items: center;
  animation: waiting 5s ease-in-out infinite;
}
.deal-back span {
  font: 100px Georgia, serif;
  color: #e8c67b;
}
.match-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.match-actions #deal {
  grid-column: 1 / -1;
  font-size: 20px;
  min-height: 52px;
}
.draw-pile {
  margin: 3px auto;
  width: 75px;
  height: 52px;
  border: 4px double #dfbb71;
  border-radius: 5px;
  background: repeating-linear-gradient(45deg, #6d193d 0 3px, #8e2b55 3px 7px);
  box-shadow: 3px 3px #b5985f, 5px 5px #4c3727;
}
.artist-options {
  display: grid;
  gap: 8px;
}
.artist-hand {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  width: 100%;
  max-width: 650px;
  margin: auto;
  height: 100%;
}
.artist-hand .control {
  border: 3px double #b08b42;
  box-shadow: 3px 5px 9px #0005;
}
.artist-context {
  font-size: 14px;
  line-height: 1.45;
  color: var(--muted);
  margin: 0;
}
.won-seal {
  padding: 10px;
  border: 3px double #b88d35;
  border-radius: 7px;
  color: #812047;
  font: 600 22px Georgia, serif;
  text-align: center;
  animation: stick .3s ease;
}
.collection-receipt {
  min-width: 0;
  width: min(100%, 650px);
  height: 100%;
  margin: auto;
  padding: 8px 14px;
  border: 3px double #d7a93b;
  border-radius: 8px;
  background: linear-gradient(120deg, #fffdf6, #ead8ac);
  box-shadow: 3px 5px 12px #0006;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  animation: stick .4s ease;
}
.collection-receipt strong {
  font: 600 16px/1.15 Georgia, serif;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.collection-receipt small {
  font-size: 12px;
}
.receipt-tells {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}
.receipt-tells svg {
  width: 20px;
  height: 20px;
}
.album-count.earned {
  animation: album-stamp .65s ease;
  background: #f5d77a;
  color: var(--ink);
}
@keyframes album-stamp {
  30% { transform: scale(1.2) rotate(-8deg); }
}
@media (min-width: 1000px) and (min-height: 650px) {
  body[data-mode="album"] .album-grid {
    grid-template-rows: repeat(6, minmax(75px, 1fr));
    gap: 8px;
  }
  body[data-mode="album"] .album-row {
    padding-bottom: 6px;
  }
  body[data-mode="album"] .album-style {
    font-size: 14px;
  }
  body[data-mode="album"] .album-style small {
    margin: 3px 0;
  }
  body[data-mode="album"] .album-style svg {
    width: 18px;
    height: 18px;
  }
}
.scene-picks {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}
.scene-picks .control {
  font-size: 13px;
  padding: 6px;
}
.canvas-space {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
.canvas-mount {
  position: relative;
  width: 100%;
  max-width: 1280px;
  aspect-ratio: 1.6;
  border: 10px ridge #be9b59;
  box-shadow: 3px 10px 20px #0007;
  max-height: 100%;
}
#painting-canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.canvas-mount::after {
  content: '';
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 12px #0002;
  pointer-events: none;
}
.canvas-label {
  text-align: center;
  min-height: 30px;
  margin: 0;
  font: 500 21px Georgia, serif;
}
.make-tells {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.make-tell {
  display: flex;
  align-items: center;
  text-align: left;
  gap: 6px;
  font-size: 12px;
  padding: 5px 7px;
}
.make-tell svg {
  width: 24px;
  height: 24px;
  flex: none;
}
.style-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.style-buttons .control {
  font-size: 12px;
  padding: 5px;
}
.make-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.make-actions .control {
  flex: 1;
  font-size: 12px;
  padding: 5px;
}
.reference {
  width: 43%;
  height: 100%;
  min-height: 0;
}
.reference .museum-frame {
  height: calc(100% - 45px);
}
.reference p {
  font-size: 12px;
  text-align: center;
}
.album-grid {
  flex: 1;
  min-height: 0;
  overflow: auto;
  display: grid;
  grid-template-rows: repeat(6, minmax(95px, 1fr));
  gap: 10px;
}
.album-row {
  display: grid;
  grid-template-columns: minmax(120px, 1fr) repeat(3, minmax(44px, .8fr));
  gap: 10px;
  align-items: stretch;
  border-bottom: 1px solid #dfca9177;
  padding: 0 4px 10px;
}
.album-style {
  align-self: center;
  font: 500 16px/1.15 Georgia, serif;
}
.album-style small {
  display: block;
  margin: 5px 0;
  font: 11px 'Segoe UI', sans-serif;
}
.album-style svg {
  width: 20px;
  height: 20px;
  margin-right: 5px;
}
.album-slot {
  min-height: 44px;
  border: 2px dashed #d0b674;
  border-radius: 7px;
  background: #092d3544;
  display: grid;
  place-items: center;
}
.album-slot span {
  font: 36px Georgia, serif;
  color: #ead9ac;
}
.album-slot img {
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: 95px;
  object-fit: contain;
}
.album-slot.filled {
  background: #fbf6ec;
  border: 4px solid #e7d0a3;
  cursor: pointer;
  box-shadow: 2px 4px 8px #0005;
}
.confirm {
  background: #efe1c9;
  border: 1px solid #b9a381;
  padding: 12px;
  border-radius: 9px;
}
.confirm p {
  margin-top: 0;
}
.confirm .toolbar {
  justify-content: start;
}
@keyframes waiting {
  50% {
    transform: translateY(-5px) rotate(1deg);
  }
}
@keyframes card-unfold {
  from {
    transform: rotateY(90deg);
  }
  to {
    transform: rotateY(0);
  }
}
@keyframes stick {
  from {
    transform: translateX(-25px) rotate(-8deg);
    opacity: .1;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes bounce {
  25% {
    transform: translateX(8px) rotate(5deg);
  }
  70% {
    transform: translateX(-6px);
  }
}
.calm .deal-back, .calm .played-chip, .calm .style-card, .calm .tell-card,
.calm .collection-receipt, .calm .album-count {
  animation: none !important;
}
.calm .picture-target, .calm .painting-card, .calm .tell-card {
  transition: none;
}
@media (min-width: 1500px) {
  .stage {
    padding: 24px 36px;
  }
  .gallery {
    gap: 22px;
  }
  .painting-card {
    padding: 10px;

  }
  function recipeStyle() {
    return STYLES.find(s => s.recipe.length === state.effects.size && s.recipe.every(k => state.effects.has(k)));
  }
  function recipeLabel() {
    return recipeStyle() ? recipeStyle().name + ' recipe' : 'Your own style';
  }
  function updateMakeControls() {
    $('save-picture').setAttribute('aria-disabled', !!state.saving);
    TELLS.forEach(t => $('make-' + t.id)?.setAttribute('aria-pressed', state.effects.has(t.id)));
    SCENES.forEach((s, i) => $('scene-' + i)?.setAttribute('aria-pressed', state.scene === i));
    STYLES.forEach(s => $('make-style-' + s.id)?.setAttribute('aria-pressed', recipeStyle()?.id === s.id));
    $('canvas-label').textContent = recipeLabel();
    const style = recipeStyle();
    $('compare').disabled = !style || !WORKS.some(w => state.album.has(w.id) && w.style === style.id);
    $('compare').setAttribute('aria-pressed', state.compare);
    $('compare').title = $('compare').disabled ? 'Match a painting in this style to compare it here.' : 'Compare with a painting in your album';
  }
  function repaint() {
    state.makeTouched = true;
    if (state.compare) {
      state.compare = false;
      $('reference')?.remove();
      $('canvas-space').classList.remove('comparing');
    }
    updateMakeControls();
    renderPicture();
    Curio.tone(350 + state.effects.size * 40, .055, .035);
    hint(recipeLabel() + '. Tap another tell card, or tap Save picture.');
    if (!recipeStyle() && !V.heard('ownStyle')) V.how('ownStyle', {valid: () => !recipeStyle(), hint: false});
  }
  function sizeMount() {
    const space = $('canvas-space');
    const mount = $('canvas-mount');
    if (!space || !mount) return;
    const width = Math.min(1280, space.clientWidth * (state.compare && innerWidth >= 560 ? .54 : 1), space.clientHeight * 1.6);
    mount.style.width = width + 'px';
    mount.style.height = width / 1.6 + 'px';
  }
  async function drawBase() {
    const canvas = $('painting-canvas');
    if (!canvas) return;
    const sceneId = state.scene;
    const s = SCENES[sceneId];
    const images = await Promise.all([s.bg, s.subject].map(src => new Promise(resolve => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.src = src;
    })));
    if (state.scene !== sceneId || state.mode !== 'make' || state.effects.size) return;
    canvas.width = Math.max(1, canvas.clientWidth);
    canvas.height = Math.max(1, canvas.clientHeight);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(images[0], 0, 0, canvas.width, canvas.height);
    ctx.drawImage(images[1], ...s.place.map((v, i) => v * (i % 2 ? canvas.height : canvas.width)));
  }
  function renderPicture(width) {
    sizeMount();
    if (!state.brushReady) return drawBase();
    const c = $('painting-canvas');
    if (!c) return;
    renderStarted = performance.now();
    StyleBrush.render(state.scene, state.effects, width || Math.max(1, Math.round(c.clientWidth)),
      width ? Math.round(width / 1.6) : Math.max(1, Math.round(c.clientHeight)));
  }
  async function savePicture() {
    action();
    if (state.saving || !$('painting-canvas')) return;
    const scene = state.scene;
    const effects = new Set(state.effects);
    state.saving = true;
    $('save-picture').setAttribute('aria-disabled', 'true');
    hint('Saving this picture. You can keep changing the scene and tells.');
    try {
      await brushReadyPromise;
      const bitmap = await StyleBrush.snapshot(scene, effects, 1600, 1000);
      const out = document.createElement('canvas');
      out.width = 1600;
      out.height = 1000;
      out.getContext('2d').drawImage(bitmap, 0, 0);
      bitmap.close();
      const blob = await new Promise(resolve => out.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('Picture encoding failed');
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = 'curio-class-style-picture.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.savedWidth = 1600;
      if (state.mode === 'make') hint('Picture saved. Tap a scene or a tell card to keep making.');
    } catch {
      if (state.mode === 'make') hint('The picture could not be saved. Tap Save picture to try again.');
    } finally {
      state.saving = false;
      if ($('save-picture')) $('save-picture').setAttribute('aria-disabled', 'false');
    }
  }
  function compare() {
    action();
    state.compare = !state.compare;
    $('reference')?.remove();
    $('canvas-space').classList.toggle('comparing', state.compare);
    if (state.compare) {
      const style = recipeStyle();
      const referenceWork = WORKS.find(w => state.album.has(w.id) && w.style === style.id);
      const ref = document.createElement('div');
      ref.id = 'reference';
      ref.className = 'reference';
      const f = document.createElement('div');
      const caption = document.createElement('p');
      caption.textContent = referenceWork.title + ' · ' + referenceWork.artist;
      ref.append(f, caption);
      $('canvas-space').append(ref);
      Museum.frame(f, referenceWork);
      requestAnimationFrame(f.fit);
    }
    updateMakeControls();
    requestAnimationFrame(() => renderPicture());
    hint(state.compare ? 'Compare the tells in both pictures. Tap Side by side to return to your picture.' : L.welcomeMake);
  }
  function renderAlbum() {
    const grid = document.createElement('div');
    grid.className = 'album-grid';
    STYLES.forEach(s => {
      const row = document.createElement('div');
      row.className = 'album-row';
      const label = document.createElement('div');
      label.className = 'album-style';
      label.innerHTML = `${s.name}<small>${s.years}</small>${s.recipe.map(icon).join('')}`;
      row.append(label);
      WORKS.filter(w => w.style === s.id).forEach(w => {
        if (state.album.has(w.id)) {
          const b = button('', 'album-' + w.id, () => openLook(w.id), 'album-slot filled');
          b.setAttribute('aria-label', 'Open ' + w.title);
          const im = new Image();
          im.src = w.img;
          im.alt = w.title;
          b.append(im);
          row.append(b);
        } else {
          const slot = document.createElement('div');
          slot.className = 'album-slot';
          slot.setAttribute('aria-label', 'Empty painting slot');
          slot.innerHTML = '<span aria-hidden="true">✧</span>';
          row.append(slot);
        }
      });
      grid.append(row);
    });
    $('view').append(grid);
    const clear = button('Clear album', 'clear-album', () => {
      action();
      $('clear-confirm').hidden = false;
      hint(L.clearHow, 'clearHow', {valid: () => !$('clear-confirm').hidden});
    });
    clear.disabled = !state.album.size;
    const confirm = document.createElement('div');
    confirm.id = 'clear-confirm';
    confirm.className = 'confirm';
    confirm.hidden = true;
    confirm.innerHTML = '<p>Clear your whole album?</p>';
    const buttons = document.createElement('div');
    buttons.className = 'toolbar';
    buttons.append(button('Yes, clear', 'clear-yes', () => {
      action();
      state.album.clear();
      state.phase = 'idle';
      state.round = null;
      saveAlbum();
      setMode('album');
      $('m-match').focus({preventScroll: true});
    }), button('Keep album', 'clear-no', () => {
      action();
      confirm.hidden = true;
      hint(L.welcomeAlbum);
      clear.focus({preventScroll: true});
    }));
    confirm.append(buttons);
    $('context').append(clear, confirm);
    const cultures = document.createElement('p');
    cultures.className = 'note-copy';
    cultures.textContent = 'These recipes help us look. Each tradition has many more ways to make art.';
    $('context').append(cultures);
    hint(state.album.size ? L.welcomeAlbum : L.albumEmpty);
  }
  let resizeTimer;
  addEventListener('resize', () => {
    document.querySelectorAll('.museum-frame').forEach(f => { Museum.finish(f); f.fit?.(); });
    if (state.mode === 'match') {
      const small = matchMedia('(max-height:540px) and (min-width:560px)').matches;
      $('hand').style.gridRow = small ? '2' : '3';
      $('hand').style.gridColumn = small ? '2' : '';
      if ($('artist-options')) {
        $('artist-options').style.gridRow = small ? '2' : '3';
        $('artist-options').style.gridColumn = small ? '2' : '';
      }
      if ($('collection-receipt')) {
        $('collection-receipt').style.gridRow = small ? '2' : '3';
        $('collection-receipt').style.gridColumn = small ? '2' : '';
      }
    }
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (state.mode === 'make') renderPicture(); }, 150);
  });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    action();
    const zoomed = [...document.querySelectorAll('.museum-frame')].find(f => f.zoomed);
    if (zoomed) Museum.unzoom(zoomed);
    else if (state.mode === 'look' && state.opened) closeLook();
    else if (state.mode === 'match') {
      state.selected = null;
      updateMatch();
      hint(state.phase === 'tells' ? L.playHow : state.phase === 'style' ? L.pickStyle :
        state.phase === 'artist' ? L.pickArtist : state.phase === 'won' ?
          'Tap Deal for another painting, or tap Album to see your collection.' : L.welcomeMatch);
    }
  });
  for (const mode of ['look', 'match', 'make', 'album']) $('m-' + mode).onclick = () => {
    if (state.mode !== mode) return setMode(mode);
    const key = welcomeKey();
    if (key) {
      hint(L[key]);
      V.welcome();
    }
  };
  Curio.init({clips: "voice:*", rate: 1});
  window.__tool = {
    state, setMode, allLines: V.allLines, vlog: V.log, get vq() { return V.queue; },
    works: WORKS, tells: TELLS, styles: STYLES, deal, playTell, chooseStyle, chooseArtist,
    openLook, recipeStyle, renderPicture, ensureHand, candidates, saveAlbum, V,
  };
  setMode('look');
})();
</script>
</body>
</html>
