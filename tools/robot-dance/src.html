<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Dance · Step by step, card by card · Curio Class</title>
<meta name="description" content="Bolt the robot dances exactly what the picture cards say. Make a dance card by card, then play the Fix-It Show: watch Dot, find the wrong card (the bug) and fix it together. Kindergarten computer science. Works offline.">
<!--
Robot Dance (Curio Class)
Kindergarten, computer science, module Step-by-Step (Algorithms and Programming). CSTA K-12 Computer Science Standards,
2026 identifiers EK-ALG-PS-01, EK-PRO-PD-04, EK-PRO-TR-07 (2017 crosswalk: 1A-AP-08, 1A-AP-10, 1A-AP-14).
Teacher led on a projector or smartboard: the class calls out moves, points, votes and dances along standing up.
Dance Floor: tap moves to lay down picture cards, press Go, and Bolt dances every card in order.
Fix-It Show: 8 rounds. Dot knows the real dance; Bolt dances its own cards beside Dot and trips on the first step that
does not match. The class finds the wrong card (the bug) and fixes it (debugging), then teams earn stars.
Words: Code.org CS Fundamentals glossary (algorithm, bug, debugging); "a computer does exactly what the instructions
say" from the Code.org unplugged lesson "My Robotic Friends". Moves and rounds are original to Curio Class.
The card strip and step runner (program array of move ids, run(program, target, onStep)) are kept self contained so a
later robot family engine can lift them.
Everything is drawn in code; sounds are made in the browser. One file, no network requests.
Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root{
  --paper:#fbf6fb;--ink:#2a1830;--muted:#6a5670;--line:#ead9e8;--brand:#b0206a;--focus:#2f5bd3;--gold:#ffd23f;
  --btn:#8a1653;--btn-line:#e58ab8;--head-ink:#fff;--panel:#fffafd;--navy:#1d2346;--outl:#132036;
}
/* Page layouts, picked in script (relayout()), as in collision-lab:
   wide    (1000 px or wider and 700 px or taller): stage left, 360 px panel right, card strip under the stage;
           under 900 px tall ("short") the buttons come before the move tray.
   compact (a short landscape box such as the 16:10 preview, 680x425 to 1000x625): a 250 px icon panel beside the
           stage, buttons first, the card strip across the whole width so eight cards stay at least 64 px wide.
   stack   (narrow or portrait): stage, then the strip, then the move tray with Go beside it; the page scrolls.
   The stage SVG is drawn at its real pixel size and laid out again for every size (no fixed-design scaling). */
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 3px #fff}
body{height:100%;overflow:hidden}
body.stack{height:auto;overflow:auto}
header{gap:10px}
.i{width:26px;height:26px;flex:none;display:block}
.seg button{display:inline-flex;align-items:center;gap:8px;min-height:60px;padding:0 18px}
.seg button:disabled{opacity:.55;cursor:default}
.icon-btn{min-height:60px}
main{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage panel" "apron panel";min-height:0;overflow:hidden}
.stage{grid-area:stage;min-height:0;background:var(--navy)}
#sv{position:absolute;left:0;top:0;display:block}
.panel{grid-area:panel;background:var(--panel);gap:10px;padding:12px 14px}
.apron{grid-area:apron;position:relative;background:linear-gradient(#232a57,#151a37);border-top:4px solid #3c4486;
  padding:var(--apt,30px) 12px 10px;min-width:0}
body.compact main{grid-template-columns:minmax(0,1fr) 250px;grid-template-areas:"stage panel" "apron apron"}
@media (min-width:900px){body.compact main{grid-template-columns:minmax(0,1fr) 290px}}
body.stack main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"stage" "apron" "panel";overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* panel */
.hint{margin:0;min-height:2.9em}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border-radius:16px;outline:3px solid transparent;outline-offset:4px;transition:outline-color .2s}
.tray.pulse{outline-color:var(--brand);animation:pulse .7s ease}
@keyframes pulse{40%{transform:scale(1.03)}}
.mv{position:relative;display:flex;align-items:center;gap:8px;min-height:76px;border:2px solid var(--line);border-bottom:7px solid var(--c);
  border-radius:14px;background:#fff;padding:4px 30px 4px 6px;font:700 17px/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);text-align:left;
  box-shadow:0 3px 0 #0000000f}
.mv .ico{width:56px;height:64px;flex:none}
.mv .chip{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:6px;background:var(--c);color:var(--gi);padding:2px}
.mv .chip svg{width:18px;height:18px;display:block}
.mv:disabled,.pbtn:disabled{opacity:.45;cursor:default}
.mv:not(:disabled):hover{background:#fff4fa}
.go-row{display:flex;gap:8px}
#go{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:68px;font-size:26px;background:var(--gold);color:var(--ink)}
#go .i{width:30px;height:30px}
#go.stop{background:#fff;color:var(--ink);border:3px solid var(--ink)}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:64px;min-width:64px;border:2px solid #d9c3d6;background:#fff;
  border-radius:16px;font:700 16px/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);padding:4px 10px;box-shadow:0 4px 0 #0000001a;text-align:center}
.pbtn .i{color:var(--brand)}
.fx-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fx-row .pbtn{flex-direction:column;gap:3px;min-height:76px;font-size:15px;padding:4px 2px}
#next.ready{background:#ffe6f2;border-color:var(--brand);box-shadow:0 0 0 4px #b0206a40,0 0 16px #b0206a66}
.rounds{display:flex;gap:7px;justify-content:center;align-items:center;min-height:26px}
.rounds i{width:18px;height:18px;border-radius:50%;border:3px solid var(--brand);background:#fff;flex:none}
.rounds i.done{background:var(--brand)}
.rounds i.cur{width:24px;height:24px;box-shadow:0 0 0 3px #ffd23f}
.teams{display:flex;gap:8px;align-items:center}
#teams{flex-direction:column;gap:2px;font-size:14px;min-width:72px}
#teams[aria-pressed="false"]{background:#f1e9f0;color:var(--muted)}
#teams[aria-pressed="false"] .i{color:var(--muted)}
.badge{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:60px;padding:4px 8px;border-radius:999px;border:3px solid var(--line);
  background:#fff;font:800 28px 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink)}
.badge .i{width:32px;height:32px}
.badge.star .i{color:#d99a00}
.badge.moon .i{color:#4a5bd0}
.badge.on{border-color:#e0a800;box-shadow:0 0 0 4px #ffd23f99,0 0 18px #ffd23f}
.badge[hidden]{display:none}

/* the card strip */
.apron.flash{border-top-color:var(--gold);box-shadow:inset 0 0 0 4px var(--gold)}
#apron.rows2 #strip.one-row .cell:nth-child(n+6){display:none}
#strip{display:grid;grid-template-columns:repeat(var(--cols,8),var(--cw,100px));column-gap:var(--cgap,10px);row-gap:var(--rgap,0px);justify-content:center;position:relative}
.cell{position:relative;width:var(--cw);height:var(--ch);border-radius:14px}
.cell.empty{border:3px dashed #7782c4;background:#ffffff0a}
.card{position:absolute;inset:0;width:100%;height:100%;border:3px solid var(--outl);border-radius:14px;background:#fff;padding:0;overflow:visible;
  transition:transform .15s ease,box-shadow .15s;color:var(--ink)}
.card .band{position:absolute;left:0;right:0;top:0;height:18%;background:var(--c);border-radius:10px 10px 0 0;display:flex;justify-content:flex-end;align-items:center;padding-right:5%}
.card .band svg{height:78%;width:auto;aspect-ratio:1;color:var(--gi);display:block}
.card .num{position:absolute;left:-9px;top:-11px;width:var(--nd);height:var(--nd);border-radius:50%;background:#fff;border:3px solid var(--outl);
  font:800 calc(var(--nd)*.58)/1 'Trebuchet MS','Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.card .pose{position:absolute;left:4%;width:92%;top:20%;height:58%;display:block}
.card .w{position:absolute;left:2px;right:2px;bottom:3%;font:700 var(--wf)/1.02 'Trebuchet MS','Segoe UI',sans-serif;text-align:center;color:var(--ink)}
.card[aria-pressed="true"]{transform:translateY(-12px);box-shadow:0 0 0 6px var(--gold),0 0 0 9px var(--outl)}
.card.on{box-shadow:0 0 0 4px #fff,0 0 24px 10px var(--gold)}
.card:disabled{cursor:default}
.cell .bugb{display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--nd) * -.6);width:var(--nd);height:var(--nd);border-radius:50%;background:#d6203a;color:#fff;border:3px solid #fff;
  font:900 calc(var(--nd)*.7)/1 'Trebuchet MS',sans-serif;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 6px #0006}
.cell.bug .bugb{display:flex}
.cell.bug .card{animation:wob .32s ease-in-out 3}
@keyframes wob{25%{rotate:-6deg}75%{rotate:6deg}}
.card.flip{animation:flip .36s ease-out}
@keyframes flip{0%{scale:0 1}100%{scale:1 1}}
#ptr{position:absolute;width:34px;height:var(--ptrh,18px);left:0;top:0;pointer-events:none;transition:left .2s ease;filter:drop-shadow(0 0 6px var(--gold))}
#ptr svg{width:100%;height:100%;display:block}
.cbtns{display:flex;gap:16px;justify-content:flex-start;height:72px;align-items:center;margin-top:8px;position:relative}
.cbtns .in{display:flex;gap:16px;position:relative;transition:left .25s ease}
.cbtns button{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid var(--outl);padding:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 #0005;color:var(--ink)}
.cbtns button .i{width:30px;height:30px}
#cDel{color:#c0182f}
.cbtns button:disabled{opacity:.4;cursor:default}
.cbtns.off .in{visibility:hidden}

/* the stage overlays; in compact and stack the hint is a caption at the top of the stage */
.stage .hint{position:absolute;left:10px;right:10px;top:22px;z-index:2;margin:0;min-height:0;padding:4px 10px;border-radius:10px;background:#0b0e28d9;
  color:#fff;font-size:15px;line-height:1.3;text-align:center}
body.compact .stage .hint{font-size:12.5px;padding:3px 8px}
.finale{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:14px 22px;align-items:center;background:#fffaf2;border:4px solid var(--gold);
  border-radius:24px;padding:8px 14px;box-shadow:0 8px 30px #0008;z-index:3;max-width:calc(100% - 16px)}
.fin-teams{display:flex;gap:10px}
.fbadge{display:flex;align-items:center;gap:6px;font:900 44px/1 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink)}
.fbadge .i{width:46px;height:46px}
body.wide .finale{padding:16px 28px;border-width:6px}
body.wide .fbadge{font-size:72px}
body.wide .fbadge .i{width:74px;height:74px}
body.wide .fin-all .i{width:44px;height:44px}
body.stage-fin .stage .hint{display:none}
body.stage-fin #strip,body.stage-fin #cbtns{visibility:hidden}
.fbadge.star .i{color:#d99a00}
.fbadge.moon .i{color:#4a5bd0}
.fin-all{display:flex;gap:2px;color:#d99a00}
.fin-all .i{width:30px;height:30px}
#again{display:inline-flex;align-items:center;gap:8px;min-height:64px;background:var(--gold);color:var(--ink);white-space:nowrap}

/* short wide boxes (1280x720, 1366x768): the tray goes under the buttons, four across */
body.short .tray{grid-template-columns:repeat(4,minmax(0,1fr))}
body.wide.short .mv{flex-direction:column;gap:0;justify-content:center;text-align:center;min-height:86px;padding:4px 2px 2px;font-size:14px}
body.wide.short .mv .ico{width:44px;height:50px}
body.wide.short .mv .chip{width:18px;height:18px;right:3px;top:3px;padding:1px}
body.wide.short .mv .chip svg{width:16px;height:16px}
body.wide.short .hint{min-height:2.6em}

/* tight: a wide screen in a short window (1366x657, 1280x600) keeps 60 px targets */
body.tight .panel{gap:8px;padding:8px 12px}
body.tight .hint{font-size:15px;min-height:0}
body.tight #go,body.tight .go-row .pbtn{min-height:64px}
body.tight.wide.short .mv{min-height:72px}
body.tight.wide.short .mv .ico{width:38px;height:44px}
body.tight #teams,body.tight .badge{min-height:60px}
body.tight .rounds{min-height:20px}
body.tight .apron{padding-bottom:8px}
body.tight .finale{flex-wrap:nowrap;padding:8px 18px}
body.tight .fbadge{font-size:52px}
body.tight .fbadge .i{width:54px;height:54px}

/* compact: the 16:10 preview on the tool page */
body.compact header{padding:4px 8px;gap:5px;flex-wrap:nowrap;min-width:0}
body.compact h1{font-size:17px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.compact h1 small{display:none}
body.compact .seg{flex:none}
body.compact .seg button,body.compact .icon-btn{min-height:44px;padding:0 9px;font-size:13.5px;white-space:nowrap;gap:5px}
body.compact .seg .i{width:20px;height:20px}
body.compact .icon-btn{flex:none}
body.compact .panel{padding:6px 8px;gap:5px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-content:start}
body.compact .go-row,body.compact .fx-row{display:contents}
body.compact #tray,body.compact #rounds,body.compact #teamsBox{grid-column:1/-1}
body.compact[data-mode=df] #go{grid-column:span 3}
body.compact[data-mode=fx] #go .w{display:none}
body.compact .tray{gap:4px}
body.compact .mv{min-height:52px;padding:2px;justify-content:center;border-bottom-width:5px;border-radius:10px}
body.compact .mv .w,body.compact .mv .chip{display:none}
body.compact .mv .ico{width:34px;height:40px}
body.compact .go-row{gap:5px}
body.compact #go{min-height:46px;font-size:19px;border-radius:12px;padding:0 4px;min-width:0}
body.compact #go .i{width:22px;height:22px}
body.compact .pbtn{min-height:46px;min-width:0;border-radius:12px;padding:2px}
body.compact .pbtn .w{display:none}
body.compact .fx-row .pbtn{min-height:46px}
body.compact #teams{min-width:52px;min-height:44px}
body.compact .teams{gap:5px}
body.compact .badge{min-height:40px;font-size:20px;border-width:2px}
body.compact .badge .i{width:24px;height:24px}
body.compact .rounds{min-height:18px;gap:5px}
body.compact .rounds i{width:13px;height:13px;border-width:2px}
body.compact .rounds i.cur{width:17px;height:17px}
body.compact .apron{padding:var(--apt,24px) 8px 8px}
body.compact .cbtns,body.stack .cbtns,body.tight .cbtns{position:absolute;left:0;right:0;bottom:calc(100% - 14px);height:auto;margin:0;pointer-events:none;z-index:3}
body.compact .cbtns .in,body.stack .cbtns .in,body.tight .cbtns .in{pointer-events:auto;gap:12px}
body.compact .cbtns button{width:52px;height:52px}
body.compact .finale,body.stack .finale{flex-wrap:nowrap;padding:6px 10px;gap:10px}
body.stack .fbadge{font-size:30px}
body.stack .fbadge .i{width:32px;height:32px}
body.stack .fin-all .i{width:18px;height:18px}
body.stack #again{min-height:52px;font-size:16px;padding:0 12px}
body.compact .fbadge{font-size:30px}
body.compact .fbadge .i{width:32px;height:32px}
body.compact #again{min-height:50px;font-size:17px}

/* stack: stage, strip, then the tray with Go beside it */
body.stack .panel{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;border-left:0;border-top:3px solid var(--line);overflow:visible}
body.stack #tray{grid-column:1;grid-row:1;grid-template-columns:repeat(4,minmax(0,1fr))}
body.stack .go-row{grid-column:2;grid-row:1;flex-direction:column;width:clamp(86px,21vw,170px)}
body.stack #go{min-height:76px}
body.stack .fx-row,body.stack .rounds,body.stack .teams{grid-column:1/-1}
body.stack .mv{flex-direction:column;gap:0;justify-content:center;text-align:center;padding:4px 2px 2px;font-size:14px;min-height:84px}
body.stack .mv .ico{width:42px;height:48px}
@media (max-width:560px){
  .seg{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;width:100%}
  .seg button{min-height:52px;font-size:15px;padding:0 8px;justify-content:center}
  .icon-btn{min-height:52px;padding:0 12px;font-size:15px}
  body.stack .mv{min-height:62px;padding:2px}
  body.stack .mv .w,body.stack .mv .chip{display:none}
  body.stack .go-row .pbtn .w{display:none}
  body.stack #go{font-size:20px;min-height:62px}
  body.stack .go-row .pbtn{min-height:60px}
  body.stack .fx-row .pbtn{font-size:13px}
  .cbtns{gap:12px}
  .seg button,.icon-btn{min-height:46px}
}
</style>
</head>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const wait = Curio.wait;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const clamp01 = v => clamp(v, 0, 1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  const bump = t => Math.sin(Math.PI * clamp01(t));
  const now = () => performance.now();
  function mk(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // ======================================================================================
  // Content (spec: Content). Colors with a corner glyph each, so color is never the only signal.
  // ======================================================================================
  const MOVES = {
    clap:   {word: 'Clap',       color: '#e0a800', gi: '#2a1830', say: 'Clap!'},
    jump:   {word: 'Jump',       color: '#2e9a4f', gi: '#ffffff', say: 'Jump!'},
    spin:   {word: 'Spin',       color: '#7b4fd0', gi: '#ffffff', say: 'Spin!'},
    wave:   {word: 'Wave',       color: '#2b86d6', gi: '#ffffff', say: 'Wave!'},
    up:     {word: 'Hands Up',   color: '#e36a1c', gi: '#2a1830', say: 'Hands up!'},
    toes:   {word: 'Touch Toes', color: '#12938a', gi: '#ffffff', say: 'Touch your toes!'},
    wiggle: {word: 'Wiggle',     color: '#d63f8c', gi: '#ffffff', say: 'Wiggle!'},
    stomp:  {word: 'Stomp',      color: '#8a5a2b', gi: '#ffffff', say: 'Stomp!'},
  };
  const ORDER = ['clap', 'jump', 'spin', 'wave', 'up', 'toes', 'wiggle', 'stomp'];
  // Fix-It rounds: dot = the real dance, bolt = Bolt's buggy start (trip at the first mismatch)
  const ROUNDS = [
    {dot: ['wave', 'clap', 'jump'],                 bolt: ['wave', 'clap', 'spin']},
    {dot: ['clap', 'clap', 'stomp', 'up'],          bolt: ['clap', 'wiggle', 'stomp', 'up']},
    {dot: ['wiggle', 'toes', 'wiggle', 'jump'],     bolt: ['up', 'toes', 'wiggle', 'jump']},
    {dot: ['stomp', 'stomp', 'spin', 'clap', 'up'], bolt: ['stomp', 'stomp', 'spin', 'jump', 'up']},
    {dot: ['jump', 'clap', 'spin', 'wave'],         bolt: ['jump', 'spin', 'clap', 'wave']},
    {dot: ['toes', 'up', 'wiggle', 'stomp', 'clap'], bolt: ['toes', 'up', 'wiggle', 'clap', 'stomp']},
    {dot: ['wave', 'jump', 'spin', 'clap'],         bolt: ['wave', 'spin', 'clap']},
    {dot: ['clap', 'wiggle', 'jump', 'up'],         bolt: ['clap', 'wiggle', 'wiggle', 'jump', 'up']},
  ];

  // every fixed line (spec: Voice); the hint always shows one of h2..h13 or t24..t28
  const L = {
    w1: 'Welcome to Robot Dance! Meet Bolt. Bolt does exactly what the cards say.',
    h2: 'Tap a move to add a card. Then press Go, and dance along!',
    w3: 'Welcome to the Fix-It Show! Dot knows the dance. Bolt reads the cards. Can you find the wrong card?',
    h4: 'Press Watch Dot to see the dance. Then press Go.',
    h5: 'Now press Go and see if Bolt can do it too.',
    h6: 'Tap the wrong card. Then tap the right move.',
    h7: 'Use the arrows to move a card.',
    h8: 'Tap the trash can to take a card away.',
    h9: 'Add the missing move. Then use the arrows to move it into place.',
    hO: 'Tap the card in the wrong spot. Then use the arrows to move it.',
    hX: 'Tap the extra card. Then tap the trash can.',
    hS: 'Now tap the right move, or use the arrows or the trash can.',
    h10: 'Add a card first. Tap a move!',
    h11: "That's eight cards! Press Go to see your dance.",
    h12: 'All clear! Make a new dance.',
    h13: 'Ta-da! Bolt danced every card, in order.',
    rounds: [
      'Round one: the Hello Dance! Watch Dot first.',
      'Round two: Clap Clap Stomp! Watch Dot first.',
      'Round three: Wiggle Time! Watch Dot first.',
      'Round four: Robot Stomp! Watch Dot first.',
      'Round five: Mixed Up! Two cards are in the wrong order.',
      'Round six: Toes and Stomps! Two cards are in the wrong order.',
      "Round seven: Something's Missing! Watch Dot carefully.",
      'Round eight: One Too Many! Watch Dot carefully.',
    ],
    tStar: "Team Star, it's your turn!",
    tMoon: "Team Moon, it's your turn!",
    t24: 'Oops! Bolt tripped. Which card is wrong?',
    t25: 'Look at Dot. What move should Bolt do here?',
    t26: 'Uh oh! Bolt ran out of cards. Something is missing!',
    t27: 'Whoa! Bolt has an extra step. Dot was all done!',
    t28: 'Hooray! Bolt did the whole dance! You fixed the bug!',
    t29: 'A wrong card is called a bug. Finding and fixing it is called debugging!',
    s30: 'A star for Team Star!',
    s31: 'A star for Team Moon!',
    s32: 'Great job, everyone!',
    f33: "That's the show! Everybody take a bow!",
    f34: "Team Star and Team Moon, you're both dance champs!",
  };
  const FIXHINT = [L.h6, L.h6, L.h6, L.h6, L.hO, L.hO, L.h9, L.hX];
  const allLines = () => [...new Set([L.w1, L.h2, L.w3, L.h4, L.h5, L.h6, L.h7, L.h8, L.h9, L.hO, L.hX, L.hS, L.h10, L.h11, L.h12, L.h13,
    ...L.rounds, L.tStar, L.tMoon, L.t24, L.t25, L.t26, L.t27, L.t28, L.t29, L.s30, L.s31, L.s32, L.f33, L.f34,
    ...ORDER.map(m => MOVES[m].say)])];

  // ======================================================================================
  // State
  // ======================================================================================
  let uid = 1;
  const cardsOf = moves => moves.map(move => ({id: uid++, move}));
  const state = {mode: 'df', quick: false, dancing: null, sel: null, step: null, bug: null, bubble: null, thought: null,
    previewId: 0, evt: 0, bulbs: 'idle', bulbPhase: 0, allOnUntil: 0, flashUntil: 0};
  const df = {cards: [], hint: L.h2};
  const fx = {r: 0, cards: cardsOf(ROUNDS[0].bolt), fixed: Array(8).fill(false), star: Array(8).fill(null), trips: 0,
    teams: true, finale: false, show: 0, last: null, wins: 0, hint: L.h4};
  const prog = () => state.mode === 'df' ? df.cards : fx.cards;
  const beatMs = () => state.quick ? 900 : 1400;
  const teamOf = r => r % 2 ? 'moon' : 'star';
  let danceGen = 0;

  // timers that belong to a dance or a preview, so Stop can drop every sound still to come
  const timers = {dance: new Set(), pv: new Set()};
  function later(ms, fn, grp = 'dance') {
    const t = setTimeout(() => { timers[grp].delete(t); fn(); }, ms);
    timers[grp].add(t); return t;
  }
  function clearTimers(grp) { for (const t of timers[grp]) clearTimeout(t); timers[grp].clear(); }

  // ======================================================================================
  // Sounds: all synthesized with Curio.tone (silent when Sound is off)
  // ======================================================================================
  const T = (f, d, v, type) => Curio.tone(f, d, v, type);
  const seq = (fs, step, d, v, type, grp) => fs.forEach((f, i) => later(i * step, () => T(f, d, v, type), grp));
  const SND = {
    tick: () => T(1250, .045, .022, 'triangle'),
    clap: () => { T(2300, .03, .045, 'square'); T(3150, .025, .03, 'sawtooth'); T(1650, .03, .02, 'square'); },
    jump: g => seq([240, 300, 380, 480, 610, 760], 32, .08, .05, 'sine', g),
    spin: g => seq([320, 420, 540, 680, 820, 680, 540], 48, .09, .03, 'triangle', g),
    chime: f => T(f, .4, .035, 'sine'),
    up: g => { T(523, .35, .03); T(659, .35, .03); T(784, .35, .03); later(130, () => T(1046, .35, .035), g); },
    toes: g => seq([880, 760, 650, 560, 480, 410, 350], 55, .09, .04, 'triangle', g),
    wiggle: g => seq([440, 540, 440, 540, 440, 540, 440], 70, .07, .035, 'triangle', g),
    stomp: () => { T(85, .26, .14, 'sine'); T(58, .3, .1, 'triangle'); },
    boing: g => seq([170, 290, 210, 330, 240], 42, .08, .06, 'sine', g),
    slide: g => seq([1300, 1160, 1030, 910, 800, 700, 610, 530, 460, 400], 45, .07, .035, 'sine', g),
    fan: g => { Curio.yes(); later(420, () => seq([784, 988, 1175, 1568], 110, .25, .045, 'triangle', g), g); },
    slideCard: () => T(660, .06, .025, 'triangle'),
  };

  // ======================================================================================
  // Robots: a small rig (legs, torso, arms, head) posed from a handful of numbers each frame.
  // Bolt is boxy with a square head; Dot is round with a dome head.
  // ======================================================================================
  const C = {out: '#132036', teal: '#19a7a0', tealD: '#12857f', mag: '#b0206a', coral: '#ff8a65', coralD: '#e8704d', gold: '#ffd23f'};
  const GEO = {bolt: {LL: 56, legX: 17, torsoH: 74, shX: 47, shY: 64, neck: 4, eyeY: -47},
               dot:  {LL: 40, legX: 17, torsoH: 84, shX: 44, shY: 58, neck: 0, eyeY: -27}};
  const sw = w => ({stroke: C.out, 'stroke-width': w, 'stroke-linejoin': 'round'});
  function makeRobot(kind) {
    const g = mk('g', {class: 'robot'});
    const G = GEO[kind], bolt = kind === 'bolt';
    const legs = [0, 1].map(() => {
      const l = mk('g', {}, g);
      if (bolt) {
        mk('rect', {x: -8, y: -6, width: 16, height: 58, rx: 7, fill: C.tealD, ...sw(3.5)}, l);
        mk('rect', {x: -15, y: 44, width: 30, height: 13, rx: 6, fill: '#9db0cf', ...sw(3.5)}, l);
      } else {
        mk('rect', {x: -7, y: -6, width: 14, height: 42, rx: 7, fill: C.coralD, ...sw(3.5)}, l);
        mk('ellipse', {cx: 0, cy: 37, rx: 14, ry: 7.5, fill: '#7a3b52', ...sw(3.5)}, l);
      }
      return l;
    });
    const torso = mk('g', {}, g);
    if (bolt) {
      mk('rect', {x: -43, y: -74, width: 86, height: 76, rx: 13, fill: C.teal, ...sw(4)}, torso);
      mk('rect', {x: -41, y: -17, width: 82, height: 9, fill: C.tealD}, torso);
      mk('rect', {x: -23, y: -61, width: 46, height: 30, rx: 7, fill: '#0f5560', ...sw(2.5)}, torso);
      [[-12, '#ff5fae'], [0, C.gold], [12, '#e9fbff']].forEach(([x, f]) => mk('circle', {cx: x, cy: -46, r: 5, fill: f}, torso));
    } else {
      mk('ellipse', {cx: 0, cy: -42, rx: 45, ry: 44, fill: C.coral, ...sw(4)}, torso);
      mk('ellipse', {cx: -18, cy: -66, rx: 10, ry: 6, fill: '#ffb59c', transform: 'rotate(-30 -18 -66)'}, torso);
      mk('path', {d: starPath(0, -40, 19, 8.5, 5), fill: C.gold, ...sw(2.5)}, torso);
    }
    const head = mk('g', {}, g);
    let ant, screen, eyes, face, antY;
    if (bolt) {
      mk('rect', {x: -10, y: -12, width: 20, height: 14, fill: C.tealD, ...sw(3)}, head);
      mk('rect', {x: -48, y: -54, width: 11, height: 22, rx: 4, fill: C.mag, ...sw(3)}, head);
      mk('rect', {x: 37, y: -54, width: 11, height: 22, rx: 4, fill: C.mag, ...sw(3)}, head);
      antY = -74; ant = mk('g', {}, head);
      mk('line', {x1: 0, y1: 0, x2: 0, y2: -20, stroke: C.out, 'stroke-width': 4, 'stroke-linecap': 'round'}, ant);
      mk('circle', {cx: 0, cy: -27, r: 9, fill: C.mag, ...sw(3)}, ant);
      mk('rect', {x: -39, y: -74, width: 78, height: 64, rx: 13, fill: C.teal, ...sw(4)}, head);
      screen = mk('rect', {x: -29, y: -65, width: 58, height: 42, rx: 10, fill: '#fff', ...sw(2.5)}, head);
      face = mk('g', {}, head); eyes = mk('g', {}, face);
      mk('ellipse', {cx: -11, cy: -47, rx: 5, ry: 7, fill: C.out}, eyes);
      mk('ellipse', {cx: 11, cy: -47, rx: 5, ry: 7, fill: C.out}, eyes);
      mk('path', {d: 'M-10 -34 Q0 -27 10 -34', fill: 'none', stroke: C.out, 'stroke-width': 3, 'stroke-linecap': 'round'}, face);
    } else {
      antY = -43; ant = mk('g', {}, head);
      mk('line', {x1: 0, y1: 0, x2: 0, y2: -10, stroke: C.out, 'stroke-width': 3.5, 'stroke-linecap': 'round'}, ant);
      mk('path', {d: starPath(0, -15, 8, 3.6, 5), fill: C.gold, ...sw(2)}, ant);
      mk('rect', {x: -31, y: -11, width: 62, height: 13, rx: 6, fill: C.coralD, ...sw(3)}, head);
      mk('path', {d: 'M-34 -8 C-34 -55 34 -55 34 -8 Z', fill: C.coral, ...sw(4)}, head);
      screen = mk('rect', {x: -24, y: -38, width: 48, height: 22, rx: 11, fill: '#2a1830', ...sw(2)}, head);
      face = mk('g', {}, head); eyes = mk('g', {}, face);
      mk('circle', {cx: -9, cy: -27, r: 4.2, fill: '#9ff3ff'}, eyes);
      mk('circle', {cx: 9, cy: -27, r: 4.2, fill: '#9ff3ff'}, eyes);
      mk('path', {d: 'M-5 -20.5 Q0 -17 5 -20.5', fill: 'none', stroke: '#9ff3ff', 'stroke-width': 2, 'stroke-linecap': 'round'}, face);
    }
    const arms = [0, 1].map(() => {
      const a = mk('g', {}, g);
      if (bolt) {
        mk('rect', {x: -8, y: -6, width: 16, height: 56, rx: 8, fill: C.teal, ...sw(3.5)}, a);
        mk('circle', {cx: 0, cy: 58, r: 11, fill: '#dff4f2', ...sw(3.5)}, a);
        mk('circle', {cx: 0, cy: 0, r: 10, fill: C.tealD, ...sw(3)}, a);

  // a pose is a few numbers; arms: 0 hangs down, + swings out and up (180 = straight up), - swings in across the body

    stand: {},
    sit: {sit: 1, aL: 55, aR: 55, head: -10, tilt: 3, lookY: 3, ant: 20},
    puzzled: {head: 14, aL: 24, aR: 24, lookX: -3, ant: -18},
    bow: {bend: .7, crouch: 6, aL: -16, aR: -16, lookY: 4},

    watch: {lookX: 6, head: 5},

  function pose(R, P) {

    const sx = Math.sign(P.sx || 1) * Math.max(.06, Math.abs(P.sx));
    R.g.setAttribute('transform', `translate(${f2(R.x + P.dx * s)},${f2(R.floor - P.y * s)}) scale(${f2(s * sx * 1000) / 1000},${f2(s * 1000) / 1000})`);

    R.legs[0].setAttribute('transform', `translate(${f2(-G.legX + P.hipX * .3)},${f2(hipY - P.liftL)}) rotate(${f2(spl)}) scale(1,${f2(legSY)})`);

  // Each move: f(t) over the part of the beat it fills (t 0..1), key = the one held pose with Motion off, snd = [fraction, sound]

      key: {aL: -118, aR: -118, head: -3}, snd: [[.25, () => SND.clap()], [.75, () => SND.clap()]]},
    jump: {f: t => {

    spin: {f: t => { const u = ease(t), b = bump(t); return {sx: Math.cos(2 * Math.PI * u), aL: 8 + 70 * b, aR: 8 + 70 * b, ant: 25 * Math.sin(2 * Math.PI * u)}; },
      key: {sx: .5, aL: 165, aR: 70, ant: -20}, snd: [[0, g => SND.spin(g)]]},
    wave: {f: t => {

      }, key: {aR: 150, head: 6, lookX: 2}, snd: [[.27, () => SND.chime(1046)], [.5, () => SND.chime(1175)], [.73, () => SND.chime(1318)]]},
    up: {f: t => {

    toes: {f: t => { const e = ease(clamp01(Math.sin(Math.PI * t) * 1.5)); return {bend: e, crouch: 14 * e, reach: 1 + .1 * e, aL: 8 - 32 * e, aR: 8 - 32 * e, lookY: 3 * e}; },
      key: {bend: 1, crouch: 14, reach: 1.1, aL: -24, aR: -24, lookY: 3}, snd: [[.05, g => SND.toes(g)]]},

    stomp: {f: t => {

  const bolt = makeRobot('bolt'), dot = makeRobot('dot');
  dot.G = GEO.dot;

  function setBase(R, name, extra) {
    if (R.base === name && JSON.stringify(R.baseExtra) === JSON.stringify(extra || null)) return;
    R.from = R.cur ? {...R.cur} : null; R.fromT = now(); R.fromDur = name === 'stand' && R.base === 'sit' ? 420 : 300;

  // a move inside one beat: fills 80 percent of it

    const dur = beat * .8;

  function actPose(R, a, ms) {

    if (ms < a.m) return Curio.reduce ? P0(A.key) : P0(A.f(ms / a.mdur));

  // the eight pose pictures for cards, tray and bubbles: Bolt's own rig in each move's key pose
  function buildIcons() {
    const defs = $('defs').querySelector('defs');
    const tmp = mk('svg', {width: 400, height: 400, style: 'position:absolute;left:-9999px;top:0;visibility:hidden'});
    document.body.appendChild(tmp);
    for (const m of ORDER) {
      const R = makeRobot('bolt'); R.s = 1; R.x = 0; R.floor = 0;
      const wrap = mk('g', {}, tmp);   // its box includes the robot's own transform (a jump lifts it, a spin squeezes it)
      const shadow = mk('ellipse', {cx: 0, cy: 3, rx: 44, ry: 6, fill: '#0000002e'}, wrap);
      wrap.appendChild(R.g);
      pose(R, P0(ANIM[m].key));
      const ex = iconMarks(m, R); wrap.appendChild(ex);
      const b = wrap.getBBox(), bb = shadow.getBBox();
      const x0 = b.x - 6, y0 = b.y - 6, x1 = b.x + b.width + 6, y1 = bb.y + bb.height + 4;
      const w = Math.max(x1 - x0, (y1 - y0) * .78), cx = (x0 + x1) / 2;

      sym.appendChild(shadow); sym.appendChild(R.g); sym.appendChild(ex);

  }
  // motion marks drawn on the pictures only (Bolt at x 0, floor 0, shoulders near y -114)
  function iconMarks(m, R) {
    const g = mk('g', {fill: 'none', stroke: C.out, 'stroke-width': 4, 'stroke-linecap': 'round'});
    const line = (x1, y1, x2, y2) => mk('line', {x1, y1, x2, y2}, g);
    if (m === 'clap') for (const a of [-18, 0, 18, 162, 180, 198]) { const t = a * Math.PI / 180; line(f2(58 * Math.cos(t)), f2(-141 + 58 * Math.sin(t)), f2(72 * Math.cos(t)), f2(-141 + 72 * Math.sin(t))); }
    if (m === 'jump') { line(-24, -30, -24, -10); line(0, -26, 0, -6); line(24, -30, 24, -10); }
    if (m === 'spin') { mk('path', {d: 'M-78 -60 A78 20 0 0 0 70 -52', 'stroke-width': 5}, g); mk('path', {d: 'M56 -66 L72 -52 L52 -42', 'stroke-width': 5, 'stroke-linejoin': 'round'}, g); }
    if (m === 'wave') { mk('path', {d: 'M96 -186 Q104 -170 96 -154'}, g); mk('path', {d: 'M108 -194 Q120 -170 108 -146'}, g); }
    if (m === 'wiggle') { mk('path', {d: 'M-44 -52 Q-54 -32 -44 -12'}, g); mk('path', {d: 'M-58 -60 Q-72 -32 -58 -4'}, g); mk('path', {d: 'M52 -52 Q62 -32 52 -12'}, g); mk('path', {d: 'M66 -60 Q80 -32 66 -4'}, g); }

  }
  const useIco = (m, attrs) => { const u = mk('use', attrs); u.setAttribute('href', '#ico-' + m); return u; };

  // ======================================================================================
  // The stage: real pixel size, laid out again for every box
  // ======================================================================================
  const sv = $('sv');
  let S = {};
  function buildStage(W, H) {
    sv.setAttribute('width', W); sv.setAttribute('height', H); sv.setAttribute('viewBox', `0 0 ${W} ${H}`);
    sv.textContent = '';
    const fxm = state.mode === 'fx', compact = page === 'compact';
    const footY = Math.round(H - Math.max(12, H * .065) - (compact || page === 'stack' ? 40 : tight ? 48 : 0));
    const bulbR = Math.max(22, Math.round(H * .05)), topR = bulbR + (capH ? capH + 6 : 0);
    $('hint').style.top = capH ? Math.round(bulbR * .9) + 'px' : '';
    const BOLT_H = 238, JUMP = 40;
    // the move bubble sits above Bolt when there is room, else beside Bolt's head
    const sAbove = (footY - topR - 20) / (BOLT_H + JUMP + 82);
    const sSide = (footY - topR - 8) / (BOLT_H + JUMP);
    const side = sAbove < .62;
    let s = side ? sSide : sAbove;
    const bwOf = s => Math.round(74 * s + 18);
    if (fxm) s = Math.min(s, side ? (W - 2 * bwOf(s) - 40) / 520 : (W - 30) / 560);
    else s = Math.min(s, side ? (W - 2 * bwOf(s) - 30) / 300 : (W - 30) / 300);
    s = clamp(s, .32, 1.55);
    const bw = bwOf(s);
    let boltX, dotX;
    if (fxm) {
      if (side) { boltX = Math.round(10 + bw + 8 + 118 * s); dotX = Math.round(W - (10 + bw + 8 + 130 * s)); }
      else { boltX = Math.round(W * .31); dotX = Math.round(W * .7); }
    } else boltX = Math.round(W / 2);

    S = {W, H, s, footY, boltX, dotX, side, bw, tiles: [], bulbs: [], bulbKey: '', bubKey: '', thKey: ''};

    const defs = mk('defs', {}, sv);
    const lg = mk('linearGradient', {id: 'wall', x1: 0, y1: 0, x2: 0, y2: 1}, defs);
    mk('stop', {offset: 0, 'stop-color': '#151a3a'}, lg); mk('stop', {offset: 1, 'stop-color': '#232a58'}, lg);
    const fg = mk('linearGradient', {id: 'fade', x1: 0, y1: 0, x2: 0, y2: 1}, defs);
    mk('stop', {offset: 0, 'stop-color': '#fff', 'stop-opacity': .02}, fg); mk('stop', {offset: 1, 'stop-color': '#fff', 'stop-opacity': .14}, fg);
    mk('rect', {x: 0, y: 0, width: W, height: H, fill: 'url(#wall)'}, sv);
    // a few still stars in the night sky behind the stage
    let seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let i = 0, n = Math.round(W / 34); i < n; i++)
      mk('circle', {cx: f2(rnd() * W), cy: f2(bulbR + 8 + rnd() * Math.max(10, floorTop - bulbR - 30)), r: f2(.8 + rnd() * 1.3), fill: '#fff', opacity: f2(.25 + rnd() * .4)}, sv);
    // a curtain edge on both sides
    for (const sd of [0, 1]) {

                        : `M0 0 L${cw} 0 Q${cw * .8} ${floorTop * .5} ${cw * .45} ${floorTop} L0 ${floorTop} Z`, fill: '#7d1650', opacity: .85}, sv);
    }
    // checker floor in perspective
    mk('rect', {x: 0, y: floorTop, width: W, height: H - floorTop, fill: '#2b3266'}, sv);
    const rows = 6, cols = 16, vx = W / 2;
    const yAt = k => floorTop + (H - floorTop) * Math.pow(k / rows, 1.35);
    const xAt = (j, y) => vx + (j - cols / 2) / (cols / 2) * (W * .55) * (.62 + .9 * (y - floorTop) / (H - floorTop));
    for (let r = 0; r < rows; r++) for (let j = 0; j < cols; j++) {
      const ya = yAt(r), yb = yAt(r + 1);
      const pts = [[xAt(j, ya), ya], [xAt(j + 1, ya), ya], [xAt(j + 1, yb), yb], [xAt(j, yb), yb]];
      const base = (r + j) % 2 ? '#343c78' : '#2b3266';
      const el = mk('polygon', {points: pts.map(p => p.map(f2).join(',')).join(' '), fill: base}, sv);
      S.tiles.push({el, base, cx: (pts[0][0] + pts[2][0]) / 2, cy: (ya + yb) / 2, ya, yb});
    }
    mk('line', {x1: 0, y1: floorTop, x2: W, y2: floorTop, stroke: '#4b55a0', 'stroke-width': 2}, sv);
    // two soft spotlight cones from the top
    const beams = fxm ? [[W * .2, boltX], [W * .8, dotX]] : [[W * .22, boltX], [W * .78, boltX]];
    for (const [sx, tx] of beams) {
      const rw = 105 * s;
      mk('polygon', {points: `${f2(sx - 10)},0 ${f2(sx + 10)},0 ${f2(tx + rw)},${footY} ${f2(tx - rw)},${footY}`, fill: '#fff', opacity: .12}, sv);
      mk('ellipse', {cx: tx, cy: footY, rx: f2(rw * 1.05), ry: f2(Math.max(8, rw * .2)), fill: '#fff', opacity: .1}, sv);
    }
    // Dot's round star-shaped rug
    if (fxm) {
      const rug = mk('g', {transform: `translate(${dotX},${footY + 2}) scale(1,.24)`}, sv);
      mk('path', {d: starPath(0, 0, 96 * s, 78 * s, 10), fill: '#5e2463', stroke: C.gold, 'stroke-width': 7}, rug);
      mk('path', {d: starPath(0, 0, 50 * s, 22 * s, 5), fill: C.gold, opacity: .55}, rug);
    }
    // robots
    bolt.s = s; bolt.x = boltX; bolt.floor = footY; sv.appendChild(bolt.g);
    if (fxm) { dot.s = s * 1.1; dot.x = dotX; dot.floor = footY; sv.appendChild(dot.g); }
    // stars that circle Bolt's head after a trip
    S.stars = mk('g', {display: 'none'}, sv);
    for (let i = 0; i < 3; i++) mk('path', {d: starPath(0, 0, 9 * Math.max(.7, s), 4 * Math.max(.7, s), 5), fill: C.gold, stroke: C.out, 'stroke-width': 1.5}, S.stars);
    // the move bubble over Bolt
    {
      const g = mk('g', {}, sv);
      let cx, cy, tail;
      if (side) {
        cx = boltX - 118 * s - 8 - bw / 2; cy = Math.max(footY - 200 * s, topR + 4 + bw / 2);   // never under the caption
        tail = `${f2(bw / 2 - 2)},${f2(-bw * .12)} ${f2(bw / 2 + 14)},${f2(bw * .02)} ${f2(bw / 2 - 2)},${f2(bw * .14)}`;
      } else {
        cx = boltX; cy = footY - (BOLT_H + JUMP) * s - 14 - bw / 2;
        tail = `${f2(-bw * .14)},${f2(bw / 2 - 2)} ${f2(bw * .02)},${f2(bw / 2 + 14)} ${f2(bw * .14)},${f2(bw / 2 - 2)}`;
      }

      const frame = mk('rect', {x: -bw / 2, y: -bw / 2, width: bw, height: bw, rx: bw * .24, fill: '#fff', stroke: C.out, 'stroke-width': 3}, g);
      const tl = mk('polygon', {points: tail, fill: '#fff', stroke: C.out, 'stroke-width': 3, 'stroke-linejoin': 'round'}, g);
      mk('rect', {x: -bw / 2 + 2, y: -bw / 2 + 2, width: bw - 4, height: bw - 4, rx: bw * .22, fill: '#fff'}, g);   // hides the tail's inner edge

      let cx, cy, trail;
      const dotTop = footY - 190 * s * 1.1;
      if (side) { cx = dotX + 130 * s + 10 + tw / 2; cy = Math.max(footY - 200 * s, topR + 4 + tw * .64); trail = [[-tw * .62, tw * .36, .09], [-tw * .78, tw * .5, .06]]; }
      else { cx = dotX + 26 * s; cy = dotTop - 26 - tw / 2; trail = [[-tw * .3, tw * .66, .09], [-tw * .42, tw * .82, .06]]; }

      const blobs = [[0, 0, .5], [-tw * .34, -tw * .12, .3], [tw * .34, -tw * .12, .3], [-tw * .26, tw * .26, .28], [tw * .26, tw * .26, .28], [0, -tw * .34, .3]];
      for (const [x, y, r] of blobs) mk('circle', {cx: f2(x), cy: f2(y), r: f2(tw * r), fill: '#fff', stroke: C.out, 'stroke-width': 3}, g);
      for (const [x, y, r] of blobs) mk('circle', {cx: f2(x), cy: f2(y), r: f2(tw * r - 1.6), fill: '#fff'}, g);
      for (const [x, y, r] of trail) mk('circle', {cx: f2(x), cy: f2(y), r: f2(tw * r), fill: '#fff', stroke: C.out, 'stroke-width': 2.5}, g);
      const ring = mk('circle', {cx: 0, cy: 0, r: f2(tw * .47), fill: 'none', 'stroke-width': 5, stroke: 'transparent'}, g);
      const use = useIco('clap', {x: -tw * .38, y: -tw * .42, width: tw * .76, height: tw * .82});

    } else S.th = null;
    // the string of bulbs along the top edge: they blink on every beat
    const n = Math.max(8, Math.round(W / 40)), br = clamp(W / 170, 4.5, 8), by = Math.round(bulbR * .45);
    let wire = `M0 ${by - br}`;
    for (let i = 0; i <= n; i++) wire += ` Q${f2((i - .5) * W / n)} ${f2(by + br * .4)} ${f2(i * W / n)} ${f2(by - br)}`;
    mk('path', {d: wire, fill: 'none', stroke: '#0c0f24', 'stroke-width': 2}, sv);
    for (let i = 0; i < n; i++) {
      const c = mk('circle', {cx: f2((i + .5) * W / n), cy: f2(by + br * .4), r: f2(br), stroke: '#0c0f24', 'stroke-width': 1.5}, sv);
      S.bulbs.push(c);
    }
    S.conf = mk('g', {}, sv);
    S.confetti = [];
    S.flashT = null;
    drawOverlays(true);
  }

  // which tile is under a robot's stomping foot: it flashes gold for a moment
  function flashTile(R) {
    if (!S.tiles.length) return;
    const x = R.x + R.G.legX * R.s, y = R.floor + 4;
    let best = null, bd = 1e9;
    for (const t of S.tiles) { const d = (t.cx - x) ** 2 + (3 * (t.cy - y)) ** 2; if (d < bd) { bd = d; best = t; } }
    if (!best) return;
    best.el.setAttribute('fill', '#ffd23f');
    setTimeout(() => best.el.setAttribute('fill', best.base), 260);
  }

  // confetti for 2 s (Motion on); with Motion off the bulbs all turn on instead
  function celebrate() {
    if (Curio.reduce) { state.allOnUntil = now() + 2000; return; }
    const cols = ORDER.map(m => MOVES[m].color).concat(['#ffffff', '#ffd23f']);
    S.conf.textContent = ''; S.confetti = [];
    for (let i = 0; i < 70; i++) {
      const w = 6 + Math.random() * 7, h = 4 + Math.random() * 5;
      const el = mk('rect', {x: -w / 2, y: -h / 2, width: w, height: h, rx: 1.5, fill: cols[i % cols.length]}, S.conf);
      S.confetti.push({el, x: Math.random() * S.W, y: -20 - Math.random() * S.H * .5, vx: (Math.random() - .5) * 60,
        vy: 80 + Math.random() * 120, r: Math.random() * 360, vr: (Math.random() - .5) * 500});
    }
    S.confEnd = now() + 2000;
  }

  // per-frame drawing of the bubbles, bulbs, trip stars and confetti

    const t = now();
    const b = S.bub;
    if (b) {
      const k = state.bubble || '';
      if (force || k !== S.bubKey) {
        S.bubKey = k;
        const mv = MOVES[k];

        b.use.setAttribute('display', mv ? '' : 'none');
        if (mv) b.use.setAttribute('href', '#ico-' + k);
        b.q.setAttribute('display', k === '?' ? '' : 'none');
        b.ring.setAttribute('stroke', mv ? mv.color : 'transparent');
      }
    }
    if (S.th) {
      const k = state.thought || '';
      if (force || k !== S.thKey) {
        S.thKey = k;
        S.th.g.setAttribute('display', k ? '' : 'none');
        if (k) { S.th.use.setAttribute('href', '#ico-' + k); S.th.ring.setAttribute('stroke', MOVES[k].color); }
      }
    }
    // bulbs: dim at rest, every other one on each beat, flashing at the end of a dance
    if (S.bulbs.length) {
      let key;
      const allOn = t < state.allOnUntil || (state.bulbs === 'flash' && Curio.reduce);
      if (allOn) key = 'all';
      else if (state.bulbs === 'flash' || t < state.flashUntil) key = Curio.reduce ? 'all' : 'f' + (Math.floor(t / 170) % 2);
      else if (state.bulbs === 'beat') key = 'b' + (state.bulbPhase % 2);

        S.bulbs.forEach((c, i) => {

          c.setAttribute('fill', on ? '#ffd23f' : key === 'idle' ? '#b59a3a' : '#5b5130');
          c.setAttribute('filter', '');

        });
      }
    }

    if (S.stars) {
      const show = bolt.base === 'sit' && !bolt.act && state.mode === 'fx';
      S.stars.setAttribute('display', show ? '' : 'none');
      if (show) {
        const [hx, hy] = bolt.head0, rx = 46 * bolt.s, ry = 12 * bolt.s, a0 = Curio.reduce ? 0 : t / 420;
        [...S.stars.children].forEach((st, i) => {
          const a = a0 + i * 2 * Math.PI / 3;

        });

    }
    if (S.confetti && S.confetti.length) {

  }

  function frame() {
    const t = now();

    if (dot.g.isConnected) pose(dot, paramsOf(dot, t));

  }

  // ======================================================================================
  // The card strip
  // ======================================================================================
  const strip = $('strip'), cells = [], cardEls = new Map();
  for (let i = 0; i < 8; i++) {
    const c = document.createElement('div');
    c.className = 'cell empty'; c.setAttribute('role', 'listitem');
    c.innerHTML = '<span class="bugb" aria-hidden="true">?</span>';
    strip.appendChild(c); cells.push(c);
  }
  function makeCard(c) {
    const b = document.createElement('button');
    b.className = 'card'; b.dataset.uid = c.id;
    b.innerHTML = '<span class="band"><svg viewBox="0 0 24 24" aria-hidden="true"><use/></svg></span><span class="num" aria-hidden="true"></span>' +

  }
  function setCardMove(b, m) {

  function snapshot() { const m = new Map(); for (const [id, b] of cardEls) if (b.isConnected) m.set(id, b.getBoundingClientRect()); return m; }
  function renderStrip(o = {}) {
    const P = prog(), act = document.activeElement;
    for (const [id, b] of cardEls) if (!P.some(c => c.id === id)) { b.remove(); cardEls.delete(id); }
    cells.forEach((cell, i) => {
      const c = P[i];
      cell.classList.toggle('empty', !c);
      cell.classList.toggle('bug', state.bug === i);
      const cur = cell.querySelector('.card');
      if (!c) { if (cur) cur.remove(); return; }
      const b = cardEls.get(c.id) || makeCard(c);

      setCardMove(b, c.move);
      b.querySelector('.num').textContent = i + 1;
      b.setAttribute('aria-label', `Step ${i + 1}: ${MOVES[c.move].word}`);
      b.setAttribute('aria-pressed', state.sel === i);

      b.disabled = !!state.dancing;
    });

        if (!dx && !dy) continue;

        b.getBoundingClientRect();
        b.style.transition = ''; b.style.transition = 'translate .3s ease, transform .15s ease, box-shadow .15s';
        b.style.translate = '0px 0px';

      }
    }
    if (act && act.classList && act.classList.contains('card') && !act.isConnected === false && document.activeElement !== act) act.focus();

    syncCardBtns();
    placePtr();
  }
  function syncCardBtns() {
    const P = prog(), on = state.sel != null && state.sel < P.length && !state.dancing, fa = document.activeElement;
    $('cbtns').classList.toggle('off', !on);
    $('cLeft').disabled = !on || state.sel === 0;
    $('cRight').disabled = !on || state.sel === P.length - 1;
    $('cDel').disabled = !on;
    for (const b of $('cbIn').children) b.tabIndex = on ? 0 : -1;
    // an arrow that reaches the end of the strip turns off: focus goes to the other arrow, else the picked card
    if (on && fa && fa.disabled && (fa.id === 'cLeft' || fa.id === 'cRight')) {
      const o = $(fa.id === 'cLeft' ? 'cRight' : 'cLeft'), c = cells[state.sel] && cells[state.sel].querySelector('.card');
      if (!o.disabled) o.focus(); else if (c) c.focus();
    }
    if (!on) return;
    const cell = cells[state.sel], ap = $('apron').getBoundingClientRect(), cr = cell.getBoundingClientRect(), inn = $('cbIn');
    const w = inn.offsetWidth || 212, box = $('cbtns').getBoundingClientRect();
    // in compact the buttons float over the stage, so they stay left of the panel
    const right = page === 'compact' || tight ? $('stage').getBoundingClientRect().right : ap.right;
    const left = clamp(cr.left + cr.width / 2 - w / 2 - box.left, 6 + ap.left - box.left, right - box.left - w - 6);
    inn.style.left = Math.round(left) + 'px';
  }
  function placePtr() {
    const p = $('ptr'), i = state.step;
    if (i == null || i > 7 || !cells[i].offsetParent) { p.style.display = 'none'; return; }
    p.style.display = '';
    const c = cells[i];
    p.style.left = Math.round(c.offsetLeft + c.offsetWidth / 2 - 17) + 'px';
    p.style.top = Math.round(c.offsetTop - p.offsetHeight - 4) + 'px';
  }
  // the second row stays while the step or the "?" cell is in it
  function syncRows() {
    const one = prog().length <= 4 && !(state.bug >= 4) && !(state.step >= 4);
    if (one !== $('strip').classList.contains('one-row')) { $('strip').classList.toggle('one-row', one); queueMicrotask(() => relayout()); }
  }
  function setStep(i) { state.step = i; syncRows(); cells.forEach((c, k) => { const b = c.querySelector('.card'); if (b) b.classList.toggle('on', k === i); }); placePtr(); }

  function select(i) {
    state.sel = i; renderStrip();
    // after a trip, picking a card says what the card buttons and tray can do (once per round)
    if (state.mode === 'fx' && state.bug != null && !fx.finale) {
      setHint(L.hS);
      const r = fx.r, ok = () => state.mode === 'fx' && fx.r === r && state.sel != null;
      narrate('sel#' + fx.show + '#' + r, L.hS, {once: true, valid: ok});
    }
  }
  function deselect() { if (state.sel == null) return; state.sel = null; renderStrip(); }
  strip.addEventListener('click', e => {
    const b = e.target.closest('.card'); if (!b || state.dancing) return;
    const i = cells.indexOf(b.parentNode);
    if (state.sel === i) deselect(); else select(i);
  });
  strip.addEventListener('keydown', e => {
    const b = e.target.closest && e.target.closest('.card'); if (!b || state.dancing) return;
    const i = cells.indexOf(b.parentNode);
    if (state.sel === i) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); moveSel(-1, true); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); moveSel(1, true); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSel(); }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const j = i + (e.key === 'ArrowLeft' ? -1 : 1), n = cells[j] && cells[j].querySelector('.card');
      if (n) { e.preventDefault(); n.focus(); }
    }
  });
  // tapping the empty stage or the strip's background puts the picked card down
  for (const id of ['stage', 'apron']) $(id).addEventListener('pointerdown', e => {
    if (e.target.closest('.card, .cbtns button, .finale')) return;
    deselect();
  });

  function moveSel(d, byKey) {
    const P = prog(), i = state.sel;
    if (i == null || state.dancing) return;
    const j = i + d; if (j < 0 || j >= P.length) return;
    const before = snapshot();
    [P[i], P[j]] = [P[j], P[i]];
    state.sel = j;
    edited();
    renderStrip({flip: before});
    SND.slideCard();
    if (byKey) { const b = cells[j].querySelector('.card'); if (b) b.focus(); }
    live(`Card moved to step ${j + 1}.`);
  }
  function removeSel() {
    const P = prog(), i = state.sel;
    if (i == null || state.dancing) return;
    const hadFocus = document.activeElement && (document.activeElement.closest('.cbtns') || document.activeElement.classList.contains('card'));
    P.splice(i, 1); state.sel = null;
    edited();
    renderStrip();
    T(330, .12, .04, 'triangle');
    if (hadFocus) {
      const k = Math.min(i, P.length - 1), b = k >= 0 && cells[k].querySelector('.card');
      (b || $('tray').querySelector('.mv')).focus();
    }
    live('Card taken away.');
  }
  $('cLeft').onclick = () => moveSel(-1);
  $('cRight').onclick = () => moveSel(1);
  $('cDel').onclick = () => removeSel();

  // any change to the cards in the Fix-It Show: Bolt gets back up, the "?" and Dot's bubble go away
  function edited() {
    state.evt++;
    if (state.mode !== 'fx') return;
    state.bug = null; state.thought = null;
    if (bolt.base === 'sit' || bolt.base === 'puzzled') setBase(bolt, 'stand');
    if (dot.base === 'bow') setBase(dot, 'stand');
    if (!state.dancing) state.bubble = null;
    if (fx.hint === L.hS) setHint(L.h5);
  }

  // ======================================================================================
  // Tray, preview and the step runner
  // ======================================================================================
  const tray = $('tray');
  for (const m of ORDER) {
    const b = document.createElement('button');
    b.className = 'mv'; b.dataset.move = m;
    b.style.setProperty('--c', MOVES[m].color); b.style.setProperty('--gi', MOVES[m].gi);
    b.setAttribute('aria-label', MOVES[m].word);
    b.innerHTML = `<svg class="ico" aria-hidden="true"><use href="#ico-${m}" width="100%" height="100%"/></svg><span class="w">${MOVES[m].word}</span>` +
      `<span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#g-${m}"/></svg></span>`;
    b.onclick = () => pickMove(m);
    tray.appendChild(b);
  }
  function pickMove(m) {
    if (state.dancing) return;
    const P = prog();
    if (state.sel != null && state.sel < P.length) {
      const i = state.sel;
      P[i] = {id: P[i].id, move: m};
      state.sel = null;
      edited();
      renderStrip();
      const b = cells[i].querySelector('.card');
      if (b && !Curio.reduce) { b.classList.remove('flip'); b.getBoundingClientRect(); b.classList.add('flip'); setTimeout(() => b.classList.remove('flip'), 400); }
      live(`Step ${i + 1} is now ${MOVES[m].word}.`);
      preview(m);
      return;
    }
    if (P.length >= 8) {
      $('apron').classList.add('flash');
      setTimeout(() => $('apron').classList.remove('flash'), 900);
      setHint(L.h11); narrate('h11#' + state.evt, L.h11, {valid: hintStill(L.h11)});
      return;
    }
    P.push({id: uid++, move: m});
    edited();
    renderStrip();
    live(`Step ${P.length}: ${MOVES[m].word}.`);
    preview(m);
  }
  // Bolt does the move once at Slow timing; a new tap cancels it, and only the newest move name is said
  function preview(m) {
    cancelPreview();
    const id = ++state.previewId;
    if (bolt.base !== 'stand') setBase(bolt, 'stand');
    actMove(bolt, m, 1400, true, 'pv');
    state.bubble = m;
    later(1400 * .8, () => { if (state.previewId === id && !state.dancing) state.bubble = null; }, 'pv');
    narrate('mv' + id, MOVES[m].say, {valid: () => state.previewId === id});
  }
  function cancelPreview() {
    clearTimers('pv');
    if (bolt.act && !state.dancing) bolt.act = null;
    if (!state.dancing && MOVES[state.bubble]) state.bubble = null;
  }

  // the step runner: program and target are arrays of move ids; onStep(i, mine, theirs, result, beat) draws each beat.
  // result is ok, wrong (both have a step and they differ), ranout (no card i) or extra (Dot already done)
  async function run(program, target, onStep) {
    const g = danceGen;
    const n = target ? Math.max(program.length, target.length) : program.length;
    for (let i = 0; i < n; i++) {
      const b = program[i], d = target ? target[i] : undefined;
      const res = !target ? 'ok' : b === undefined ? 'ranout' : d === undefined ? 'extra' : b !== d ? 'wrong' : 'ok';
      const beat = beatMs();
      onStep(i, b, d, res, beat);
      await wait(res === 'ok' ? beat : beat + 650);
      if (g !== danceGen) return {result: 'stopped', step: i};
      if (res !== 'ok') return {result: res, step: i};
    }
    return {result: 'done', step: n};
  }
  function beatStart(i) {
    SND.tick();
    state.bulbs = 'beat'; state.bulbPhase++;
    setStep(i);
  }
  function startDance(kind) {
    cancelPreview();
    state.sel = null;
    danceGen++;
    state.dancing = kind;
    state.evt++;
    dropMoveNames();
    sync();
    renderStrip();
  }
  function endDance() {
    state.dancing = null;
    state.bulbs = 'idle';
    setStep(null);
    sync();
    renderStrip();
  }
  function stopDance() {
    danceGen++;
    clearTimers('dance'); clearTimers('pv');
    for (const R of [bolt, dot]) { R.act = null; setBase(R, 'stand'); }
    state.bubble = null; state.bug = null; state.thought = null;
    if (state.dancing) { state.dancing = null; }
    state.bulbs = 'idle'; state.allOnUntil = 0; state.flashUntil = 0;
    setStep(null);
    sync(); renderStrip();
  }
  async function getUp() {
    let w = 0;
    for (const R of [bolt, dot]) if (R.base !== 'stand') { setBase(R, 'stand'); w = 450; }
    state.bug = null; state.thought = null; state.bubble = null;
    renderStrip();
    if (w) await wait(w);
  }

  async function go() {
    if (state.dancing) { stopDance(); hush(); return; }
    const P = prog().map(c => c.move);
    if (!P.length) {
      cancelPreview();
      tray.classList.remove('pulse'); tray.getBoundingClientRect(); tray.classList.add('pulse');
      setTimeout(() => tray.classList.remove('pulse'), 900);
      setHint(L.h10); narrate('h10#' + state.evt, L.h10, {valid: hintStill(L.h10)});
      return;
    }
    startDance('go');
    const g = danceGen;
    await getUp();

      const m = moves[i];
      mk('rect', {x, y, width: cw, height: ch, rx: 10, fill: '#fff', stroke: C.out, 'stroke-width': 3}, ap);
      mk('path', {d: `M${x + 1.5} ${y + 14} V${y + 10} a8.5 8.5 0 0 1 8.5 -8.5 H${x + cw - 10} a8.5 8.5 0 0 1 8.5 8.5 V${y + 14} Z`, fill: MOVES[m].color}, ap);
      const u = useIco(m, {x: x + 6, y: y + 16, width: cw - 12, height: ch - 22}); ap.appendChild(u);
      mk('circle', {cx: x + 4, cy: y + 2, r: 10, fill: '#fff', stroke: C.out, 'stroke-width': 2.5}, ap);
      const tx = mk('text', {x: x + 4, y: y + 6.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, 'font-family': "'Trebuchet MS',sans-serif", fill: C.out}, ap);
      tx.textContent = i + 1;
      if (i === 2) mk('rect', {x: x - 4, y: y - 4, width: cw + 8, height: ch + 8, rx: 13, fill: 'none', stroke: '#ffd23f', 'stroke-width': 4}, ap);
    }
    mk('path', {d: `M${x0 + 2 * (cw + gap) + cw / 2 - 12} 293 h24 l-12 12 z`, fill: '#ffd23f', stroke: '#fff', 'stroke-width': 2}, ap);
    // copy the symbols the picture uses
    const used = new Set([...hold.querySelectorAll('use')].map(u => u.getAttribute('href')));
    const defs = mk('defs', {}, null); hold.insertBefore(defs, hold.firstChild);
    for (const id of used) { const s = document.querySelector(id); if (s) defs.appendChild(s.cloneNode(true)); }
    out.push(hold.outerHTML);
    // put the live stage back
    state.mode = keepMode; S = S0;
    sv.innerHTML = sv0; sv.setAttribute('width', sw0); sv.setAttribute('height', sh0); sv.setAttribute('viewBox', vb0);
    [bolt.s, bolt.x, bolt.floor] = saved.bolt; [dot.s, dot.x, dot.floor] = saved.dot;
    lastKey = ''; relayout();
    return out[0];
  }

  // for checking frames
  window.__tool = {state, setMode, allLines, L, MOVES, ROUNDS, df, fx, said, vlog, vq, pickMove, go, watchDot, startOver, nextRound,
    openRound, playAgain, select, deselect, moveSel, removeSel, previewSVG, run,
    get page() { return page; }, hint: () => $('hint').textContent, bolt, dot,
    stage: () => ({bubble: state.bubble, thought: state.thought, step: state.step, bug: state.bug, boltBase: bolt.base, dotBase: dot.base,
      boltAct: bolt.act && bolt.act.move, dotAct: dot.act && dot.act.move, dancing: state.dancing}),
    curio: () => ({last: Curio.last, sound: Curio.sound, reduce: Curio.reduce})};
  buildIcons();
  setMode('df');
  requestAnimationFrame(frame);
})();
</script>
