BEAT BUDDIES (Curio Class)
Music, grades K-2, National Core Arts Standards MU:Pr4 (read and perform simple rhythm patterns) and MU:Cr1
(improvise and create rhythm patterns), module "Steady Beat and Rhythm".
March: the buddies march to a steady beat at three speeds while hearts light up on every beat. The freeze game
stops the music at a surprise moment and everyone freezes.
Rhythm: four beat boxes. Bear = ta (one sound on a beat), Bunny = ti-ti (two quick sounds on one beat),
Snail = ta-a (one long sound across two beats), sleeping Owl = rest (a silent beat). The hearts keep the beat
underneath, so the class can see and hear the difference between the beat and the rhythm.
Echo: the buddies play a hidden pattern, the class claps it back, then it is revealed.
Teacher-led on a projector or smartboard. Illustrations generated with Google Gemini, edited for Curio Class.

<script>
// Curio Class kit: what every tool does the same way (motion, sound, read aloud, timing).
// Inlined by scripts/bundle_tool.py from a kit:curio script tag, before the tool's own script.
// One fix here reaches every tool on its next bundle. Docs: docs/KIT.md
const Curio = (() => {
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- motion: the Motion button, the OS reduced-motion setting, remembered across tools ----------
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  const motionFns = [];
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    const b = $('motion');
    if (b) { b.setAttribute('aria-pressed', !reduce); b.textContent = reduce ? '⏸ Motion' : '✨ Motion'; }
    motionFns.forEach(f => f(reduce));
  }

  // ---------- sound: the Sound button turns off chimes and narration (Read still speaks) ----------
  let sound = true;
  const soundFns = [];

  // ---------- speech: recorded clips first, then the best browser voice ----------
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    // Chrome fills its voice list late, so an early line waits for it; cancel() also drops a line still waiting,
    // or it would start after the next one and the tool would talk over itself
    const speak = speechSynthesis.speak.bind(speechSynthesis), cancel = speechSynthesis.cancel.bind(speechSynthesis), held = new Set();
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      held.add(u);
      const go = () => { if (!held.delete(u)) return; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.cancel = () => { held.forEach(u => u.onend && u.onend()); held.clear(); cancel(); };
    speechSynthesis.getVoices();
  }
  let clips = {}, rate = .9, talk = 0, clip = null, last = [], heard = false;
  // nothing speaks until the first tap or key: browsers block sound before that, and a tool shouldn't talk on load
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { heard = true; }, {once: true, capture: true});
  function stop() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (clips[text]) { clip = new Audio(clips[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = rate; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  // say one line or several in a row; resolves when the last one ends (or at once when sound is off).
  // force: speak even with Sound off or before the first tap (the Read button)
  async function say(parts, force) {
    if (!heard && !force) return;
    if (!sound && !force) return;
    stop();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(150); }
  }

  // ---------- chimes: a soft sine tone, through one shared audio context ----------
  let ctx = null;
  const audio = () => ctx || (ctx = new (window.AudioContext || window.webkitAudioContext)());
  function tone(freq, dur = .3, vol = .05, type = 'sine') {
    if (!sound) return;
    try {
      const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

  };
})();

      if (how === 'hop') img.animate([{transform: 'none'}, {transform: 'translateY(-54px) rotate(-6deg)'}, {transform: 'none'}], {duration: d, easing: 'ease-out'});
      if (how === 'stomp') img.animate([{transform: 'none'}, {transform: 'translateY(-20px)'}, {transform: 'translateY(0) scale(1.05,.95)'}, {transform: 'none'}], {duration: d + 80, easing: 'ease-in-out'});
      if (how === 'glide') img.animate([{transform: 'none'}, {transform: 'scaleX(1.06)'}, {transform: 'none'}], {duration: d});
    }
  }
  function marchCtl() {
    $('ctl').innerHTML = `${speedButtons()}
      <div class="speed" id="voices" role="group" aria-label="Instrument">${VOICES.map(([n], i) => `<button aria-pressed="${i === voice}" data-v="${i}">${n}</button>`).join('')}</div>
      <button class="big freeze" id="fz" aria-pressed="${mr.freezeGame}" title="The music stops at a surprise moment">🧊 Freeze game</button>
      <button class="big${mr.on ? ' stop' : ''}" id="go">${mr.on ? '■ Stop' : '▶ March!'}</button>`;
    wireSpeeds();
    $('voices').querySelectorAll('button').forEach(b => b.onclick = () => {
      voice = +b.dataset.v;
      $('voices').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (!mr.on) { audio(); music(1.6); const t = ctx.currentTime + .03; ['C5', 'E5', 'G5'].forEach((n, k) => VOICES[voice][1](hz(n), t + k * .18, .3)); }
    });
    $('go').onclick = () => mr.on ? stopMarch() : startMarch();
    $('fz').onclick = () => { mr.freezeGame = !mr.freezeGame; $('fz').setAttribute('aria-pressed', mr.freezeGame); planFreeze(clock ? clock.beat : 0); if (mr.freezeGame) cue(VO.freezeOn, {still: () => mode === 'march' && mr.freezeGame}); };
  }
  const planFreeze = b => { mr.nextFreeze = b + 8 + Math.floor(Math.random() * 12); };
  function startMarch() {
    mr.on = true; mr.frozen = false; $('freeze').hidden = true;
    marchCtl();
    planFreeze(0);
    let song = 0;  // where we are in the tune
    startClock(bpm(), (b, t) => {
      const spb = 60 / clock.bpm;
      if (mr.frozen) {
        if (b >= mr.until) { mr.frozen = false; music(); at(t, () => { $('freeze').hidden = true; $('marchtip').textContent = VO.tip.go; }); planFreeze(b); }
        else return;
      }
      if (mr.freezeGame && b >= mr.nextFreeze && b % 4 === 0) {  // stop on a downbeat, for four beats or so
        mr.frozen = true; mr.until = b + 4 + Math.floor(Math.random() * 3);
        at(t, () => { $('freeze').hidden = false; lightHeart(-1); $('marchtip').textContent = VO.tip.freeze; narrate(VO.tip.freeze, {still: () => mr.frozen}); anim($('freeze'), [{transform: 'translateX(-50%) scale(.6)', opacity: 0}, {transform: 'translateX(-50%) scale(1)', opacity: 1}], {duration: 260, easing: 'ease-out'}); });
        return;
      }
      const i = song % 32; song++;
      SND.kick(t, i % 4 === 0 ? .5 : .32);
      if (i % 2 === 1) noise(t, .07, .07, 5200, 'highpass', .5);  // a light brush on beats 2 and 4
      const notes = TUNE[i];
      notes.forEach((n, k) => { if (n) VOICES[voice][1](hz(n), t + k * spb / notes.length, spb / notes.length); });
      pluck(hz(BASS[i]), t, spb * .9, {gain: .3, partials: [[1, 1], [2, .3]], cutoff: 900});
      at(t, () => { lightHeart(i % 4); stepBuddies(spb); });
    });
  }
  function stopMarch() {
    mr.on = false; stopClock(); lightHeart(-1); $('freeze').hidden = true;
    $('marchtip').textContent = VO.tip.pat;
    marchCtl();
  }

  // ---------- Rhythm and Echo ----------
  const PRESETS = [
    ['bear', 'bear', 'bear', 'bear'], ['bear', 'bunny', 'bear', 'bunny'], ['bunny', 'bunny', 'bear', 'owl'],
    ['bear', 'bear', 'snail', 'tail'], ['bunny', 'bear', 'bunny', 'bear'], ['snail', 'tail', 'bunny', 'bear'],
    ['bear', 'owl', 'bear', 'owl'], ['bunny', 'bunny', 'snail', 'tail'],
  ];
  const ry = {pat: ['bear', 'bunny', 'bear', 'owl'], tool: 'bear', beat: true, notes: false, playing: false, loop: true,
              echo: {pat: null, level: 1, stage: 'ready'}};
  function setSlot(pat, i, card) {
    const p = pat.slice();
    if (p[i] === 'tail') i--;                              // tapping the back half of a snail
    if (p[i] === 'snail') p[i + 1] = 'bear';                // replacing a snail frees its second beat
    if (card === 'snail') {
      if (i === 3) i = 2;
      if (p[i + 1] === 'snail') p[i + 2] = 'bear';
      if (p[i] === 'tail') p[i - 1] = 'bear';
      p[i] = 'snail'; p[i + 1] = 'tail';
    } else p[i] = card;
    for (let k = 0; k < 4; k++) if (p[k] === 'tail' && p[k - 1] !== 'snail') p[k] = 'bear';
    return p;
  }
  function drawBoxes(pat, hidden) {
    let html = '';
    if (hidden) {
      $('boxes').innerHTML = [0, 1, 2, 3].map(i => `<div class="box filled hid" data-i="${i}" aria-label="Beat ${i + 1}: hidden"><span class="num">${i + 1}</span></div>`).join('');
      return;
    }
    for (let i = 0; i < 4; i++) {
      const c = pat[i];
      if (c === 'tail') continue;
      const span = c === 'snail' ? ' span2' : '';
      html += c ? `<button class="box filled${span}${hidden ? ' hid' : ''}" data-i="${i}" style="border-color:${hidden ? '' : CARDS[c].color}" aria-label="Beat ${i + 1}: ${hidden ? 'hidden' : CARDS[c].name + ', ' + CARDS[c].word}">
          <span class="num">${c === 'snail' ? `${i + 1} ${i + 2}` : i + 1}</span>
          <div class="pic"><img src="${IMG[c]}" alt=""></div>
          <div class="word" style="color:${CARDS[c].color}">${CARDS[c].word}</div>
          <div class="note"${ry.notes ? '' : ' hidden'}>${NOTE[c]}</div>
          ${c === 'owl' ? '<span class="zz">z z</span>' : ''}</button>`
        : `<button class="box" data-i="${i}"><span class="num">${i + 1}</span><span class="empty">Tap to add</span></button>`;
    }
    $('boxes').innerHTML = html;
    if (mode === 'rhy') $('boxes').querySelectorAll('.box').forEach(b => b.onclick = () => {
      ry.pat = setSlot(ry.pat, +b.dataset.i, ry.tool); SFX(ry.tool); drawBoxes(ry.pat);
    });
  }
  function drawPalette() {
    $('palette').innerHTML = Object.entries(CARDS).map(([k, c]) => `<button class="card" data-k="${k}" aria-pressed="${k === ry.tool}" style="border-left:10px solid ${c.color}"><img src="${IMG[k]}" alt=""><div><b style="color:${c.color}">${c.word}</b><span>${c.name}: ${c.tip}</span></div></button>`).join('')
      + `<div class="tools"><button class="toggle" id="tb" aria-pressed="${ry.beat}"><i></i>❤️ Hear the beat</button><button class="toggle" id="tn" aria-pressed="${ry.notes}"><i></i>♩ Show notes</button><button class="big soft" id="mix">🎲 Surprise me</button></div>`;
    $('palette').querySelectorAll('.card').forEach(b => b.onclick = () => { ry.tool = b.dataset.k; drawPalette(); SFX(ry.tool); const k = ry.tool; cue(VO.card[k], {still: () => mode === 'rhy' && ry.tool === k}); });
    $('tb').onclick = () => { ry.beat = !ry.beat; drawPalette(); };
    $('tn').onclick = () => { ry.notes = !ry.notes; drawPalette(); drawBoxes(ry.pat); };
    $('mix').onclick = () => { ry.pat = randomPattern(3); drawBoxes(ry.pat); if (!ry.playing) playPattern(ry.pat, {times: 1}); };
  }
  function SFX(card) {  // a preview of one card's sound
    audio(); const t = ctx.currentTime + .02, spb = 60 / bpm(); music(card === 'snail' ? spb * 2 + .3 : .8);
    if (card === 'bear') SND.drum(t);
    if (card === 'bunny') { SND.block(t, 1050); SND.block(t + spb / 2, 1050); }
    if (card === 'snail') SND.long(t, spb * 2 * .9);
  }
  function randomPattern(level) {
    const pool = level === 1 ? ['bear', 'bear', 'bunny'] : level === 2 ? ['bear', 'bunny', 'owl'] : ['bear', 'bunny', 'owl', 'snail'];
    for (;;) {
      let p = [];
      for (let i = 0; i < 4; i++) {
        let c = pool[Math.floor(Math.random() * pool.length)];
        if (c === 'snail' && i === 3) c = 'bear';
        p.push(c); if (c === 'snail') { p.push('tail'); i++; }
      }
      if (p.filter(c => c === 'owl').length < 2 && new Set(p).size > 1) return p;
    }
  }
  // Count in "1 2 3 4" on the woodblock, then play the pattern with the hearts keeping the beat underneath.
  function playPattern(pat, {times = 2, countIn = true, hidden = false, after} = {}) {
    ry.playing = true; rhyCtl();
    const total = (countIn ? 4 : 0) + 4 * times;
   
    startClock(bpm(), (b, t) => {
      const spb = 60 / clock.bpm;
      if (b >= total) { at(t, () => { endPlay(); after && after(); }); return false; }
      if (countIn && b < 4) {
        SND.block(t, b === 0 ? 1300 : 1000);
        at(t, () => { $('count').textContent = b + 1; lightHeart(b); anim($('count'), [{transform: 'translate(-50%,-50%) scale(1.3)', opacity: .4}, {transform: 'translate(-50%,-50%) scale(1)', opacity: 1}], {duration: 200}); });
        return;
      }
      const i = (b - (countIn ? 4 : 0)) % 4, c = pat[i];
      if (ry.beat) SND.heart(t);
      if (c === 'bear') SND.drum(t);
      if (c === 'bunny') { SND.block(t, 1050); SND.block(t + spb / 2, 1050); }
      if (c === 'snail') SND.long(t, spb * 2 * .92);
      at(t, () => { $('count').textContent = ''; lightHeart(i); showBeat(pat, i, spb, hidden); });
    });
  }
  function showBeat(pat, i, spb, hidden) {
    const boxes = [...$('boxes').children];
    let slot = i; if (pat[i] === 'tail' && !hidden) slot = i - 1;
    const el = boxes.find(b => +b.dataset.i === slot);
    boxes.forEach(b => b.classList.toggle('now', b === el));
    if (!el || hidden) return;
    const img = el.querySelector('img'), c = pat[slot];
    if (c === 'bear' && pat[i] !== 'tail') anim(img, [{transform: 'none'}, {transform: 'translateY(-26px)'}, {transform: 'scale(1.08,.92)'}, {transform: 'none'}], {duration: spb * 600});
    if (c === 'bunny') anim(img, [{transform: 'none'}, {transform: 'translateY(-40px)'}, {transform: 'none'}, {transform: 'translateY(-40px)'}, {transform: 'none'}], {duration: spb * 950});
    if (c === 'snail' && pat[i] !== 'tail') anim(img, [{transform: 'none'}, {transform: 'scaleX(1.12)'}, {transform: 'none'}], {duration: spb * 1900});
    if (c === 'owl') anim(el.querySelector('.zz'), [{opacity: 0, transform: 'translateY(10px)'}, {opacity: 1, transform: 'translateY(-14px)'}, {opacity: 0, transform: 'translateY(-30px)'}], {duration: spb * 1000});
  }
  function endPlay() {
    stopClock(); ry.playing = false; lightHeart(-1); $('count').textContent = ''; $('count').classList.remove('word');
    [...$('boxes').children].forEach(b => b.classList.remove('now'));
    rhyCtl();
  }
  function rhyCtl() {
    if (mode === 'rhy') {
      $('ctl').innerHTML = `${speedButtons()}
        <button class="big soft" id="clear">Start over</button>
        <button class="big${ry.playing ? ' stop' : ''}" id="go">${ry.playing ? '■ Stop' : '▶ Play'}</button>`;
      wireSpeeds();
      $('clear').onclick = () => { endPlay(); ry.pat = [null, null, null, null]; drawBoxes(ry.pat); banner(VO.build); cue(VO.build); };
      $('go').onclick = () => {
        if (ry.playing) return endPlay();
        if (ry.pat.some(c => !c)) { banner(VO.fill); cue(VO.fill); return; }
        banner(VO.clap); playPattern(ry.pat, {times: 4, after: () => { banner(VO.again); narrate(VO.again, {still: () => mode === 'rhy' && !ry.playing}); }});
      };
    } else if (mode === 'echo') {
      const e = ry.echo;
      $('ctl').innerHTML = `<div class="speed" id="lv" role="group" aria-label="Cards in the game">${[['bear', 'bunny'], ['bear', 'bunny', 'owl'], ['bear', 'bunny', 'owl', 'snail']].map((ks, i) => `<button aria-pressed="${e.level === i + 1}" data-l="${i + 1}" aria-label="Cards: ${ks.join(', ')}">${ks.map(k => `<img src="${IMG[k]}" alt="" style="height:34px;vertical-align:middle">`).join('')}</button>`).join('')}</div>
        ${speedButtons()}
        ${e.stage === 'ready' ? '<button class="big" id="go">▶ Listen</button>' : ''}
        ${e.stage === 'turn' ? '<button class="big" id="go">👀 Show me</button>' : ''}
        ${e.stage === 'shown' ? '<button class="big soft" id="again">↻ Hear it again</button><button class="big" id="go">Next one →</button>' : ''}`;
      wireSpeeds();
      $('lv').querySelectorAll('button').forEach(b => b.onclick = () => { e.level = +b.dataset.l; newEcho(); });
      if (e.stage === 'ready' || e.stage === 'turn' || e.stage === 'shown') $('go').onclick = e.stage === 'ready' ? listenEcho : e.stage === 'turn' ? showEcho : newEcho;
      if ($('again')) $('again').onclick = () => playPattern(e.pat, {times: 1});
    }
  }
  function banner(t) { $('banner').textContent = t; bannerV = [t]; }
  function newEcho() {
    endPlay();
    const e = ry.echo; e.pat = randomPattern(e.level); e.stage = 'ready';
    drawBoxes(e.pat, true); rhyCtl();
    banner(VO.listen); const pat = e.pat; narrate(VO.listen, {still: () => mode === 'echo' && e.stage === 'ready' && e.pat === pat});
  }
  function listenEcho() {
    const e = ry.echo; e.stage = 'playing'; rhyCtl(); banner(VO.listening);
    playPattern(e.pat, {times: 1, hidden: true, after: () => {
      // A breath before the class answers: a quiet pause, then "Ready... go!" on the beat,
      // then the hearts keep the beat for one bar while the class claps.
      e.stage = 'wait'; rhyCtl(); banner(VO.ready);
      setTimeout(() => {
        if (mode !== 'echo' || e.stage !== 'wait') return;
        e.stage = 'clap';
        startClock(bpm(), (b, t) => {
          if (b >= 6) { at(t, () => { endPlay(); e.stage = 'turn'; rhyCtl(); banner(VO.look); narrate(VO.look, {still: () => mode === 'echo' && e.stage === 'turn'}); }); return false; }
          if (b < 2) {
            SND.block(t, b ? 1300 : 1000);
            at(t, () => { $('count').classList.add('word'); $('count').textContent = b ? 'Go!' : 'Ready'; if (b) banner(VO.turn); });
            return;
          }
          SND.heart(t); at(t, () => { $('count').textContent = ''; lightHeart(b - 2); });
        });
      }, 1300);
    }});
  }
  function showEcho() {
    const e = ry.echo; e.stage = 'shown';
    drawBoxes(e.pat, false); rhyCtl();
    banner(e.pat.filter(c => c !== 'tail').map(c => CARDS[c].word).join('   ·   ')); bannerV = e.pat.filter(c => c !== 'tail').map(c => VO.card[c]);   // Read names each card
    playPattern(e.pat, {times: 1, countIn: false});
  }

  // ---------- voice ----------
  // Every spoken line, and nothing else, lives in VO (voice/lines.json lists each one; scratch checks compare the two).
  // voice:lines-start
  const VO = {
    welcome: {
      march: "Let's march with the beat buddies! Press March, and pat your knees on every heart.",
      rhy: "Let's make a rhythm with the animal cards!",
      echo: 'Echo time! The buddies play a rhythm. Then you clap it back.',
    },
    tip: {pat: 'Pat your knees on every heart!', freeze: 'Everybody freeze!', go: 'Go! Pat your knees on every heart!'},
    freezeOn: 'Freeze game! When the music stops, freeze like a statue.',
    card: {bear: 'Bear says ta. One sound.', bunny: 'Bunny says ti-ti. Two quick sounds.', snail: 'Snail says ta-a. One long sound.', owl: 'Owl says shh. A quiet beat.'},
    build: 'Tap a card below, then tap a box.',
    fill: 'Fill all four boxes first.',
    clap: 'Clap with the buddies!',
    again: 'Again? Or change a card.',
    listen: 'Listen to the buddies, then clap it back.',
    listening: 'Listen...',
    ready: 'Get ready to clap it back...',
    turn: 'Your turn! Clap it back.',
    look: "Was that it? Let's look.",
  };
  // voice:lines-end
  // The queue (the collision-lab pattern): one line at a time; a welcome per mode after the first tap; Read always wins.
  // Music rule: no line starts while the beat or a card sound plays (a freeze is quiet, so "Everybody freeze!" fits in it),
  // and the music starting cuts the talk at once. Lines still waiting keep waiting for quiet.
  const said = new Set(), queued = new Set(), vlog = [];
  let tapped = false, vq = Promise.resolve(), vgen = 0, readP = Promise.resolve(), reading = 0, vcount = 0, busyUntil = 0, bannerV = [];
  const lineMs = parts => parts.reduce((a, t) => a + 2500 + 80 * t.length, 0);
  const busy = () => (!!clock && !(mode === 'march' && mr.frozen)) || Date.now() < busyUntil;
  let cut = () => {};
  const cutP = () => new Promise(r => { cut = r; });
  function music(sec = 0) { Curio.stop(); cut(); reading = 0; readP = Promise.resolve(); busyUntil = Math.max(busyUntil, Date.now() + sec * 1000); }
  // once: said at most once (welcomes). still(): drop the line if its moment passed before it could start
  function narrate(parts, o = {}) {
    parts = [].concat(parts);
    const key = parts.join('|');
    if (!tapped || !soundOn || (o.once && (said.has(key) || queued.has(key)))) return false;
    queued.add(key); vcount++;
    const gen = vgen;
    vq = vq.then(async () => {
      await readP;
      while (busy() && gen === vgen) await wait(100);   // never over the beat
      if (gen !== vgen) return;                           // dropped by hush(): not marked said, so its trigger can queue it again
      queued.delete(key);
      if (o.still && !o.still()) return;
      if (o.once) said.add(key);
      vlog.push(...parts);
      await Promise.race([Curio.say(parts), wait(lineMs(parts)), cutP()]);
    });
    return true;
  }
  // short feedback: drop whatever is waiting or talking (never Read), then say this
  function cue(parts, o) {
    if (!tapped || !soundOn) return false;
    vgen++; queued.clear(); vq = readP; if (!reading) { Curio.stop(); cut(); }
    return narrate(parts, o);
  }
  // a stopped clip never fires "ended", so hush also lets go of the Read promise
  function hush() { vgen++; queued.clear(); vq = Promise.resolve(); readP = Promise.resolve(); reading = 0; Curio.stop(); cut(); }
  // Read: the music stops, then the instructions on screen are read
  function readNow() {
    const e = ry.echo;
    if (mr.on) stopMarch();
    if (clock || ry.playing) endPlay();
    if (mode === 'echo' && ['playing', 'wait', 'clap'].includes(e.stage)) { e.stage = 'ready'; drawBoxes(e.pat, true); rhyCtl(); banner(VO.listen); }
    busyUntil = 0; hush(); vcount++;
    const parts = mode === 'march' ? [$('marchtip').textContent] : bannerV.filter(Boolean), me = reading = vcount;
    if (!parts.length) return;
    vlog.push(...parts);
    readP = Promise.race([Curio.say(parts, true), wait(lineMs(parts)), cutP()]).catch(() => {}).then(() => { if (reading === me) reading = 0; });
  }
  $('read').onclick = readNow;
  // the mode's welcome (once), then what the banner asks
  function intro() {
    narrate(VO.welcome[mode], {once: true});
    if (mode === 'rhy' && bannerV[0] === VO.build) narrate(VO.build, {still: () => mode === 'rhy'});
    if (mode === 'echo' && ry.echo.stage === 'ready') narrate(VO.listen, {still: () => mode === 'echo' && ry.echo.stage === 'ready'});
  }
  // The first tap: decide after its own click has run. If it queued a line (or was Read), the welcome waits for another time.
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, e => {
    if (tapped) return; tapped = true;
    const n0 = vcount;
    const go = () => { removeEventListener('click', go, true); clearTimeout(fb); setTimeout(() => { if (vcount === n0) intro(); }); };
    addEventListener('click', go, true); const fb = setTimeout(go, 1500);
  }, true);

  // ---------- modes ----------
  let mode = 'march';
  function setMode(m) {
    stopClock(); hush(); busyUntil = 0; mr.on = false; ry.playing = false; mode = m;
    narrate(VO.welcome[m], {once: true});
    ['march', 'rhy', 'echo'].forEach(k => $('t-' + k).setAttribute('aria-pressed', k === m));
    $('march').hidden = m !== 'march'; $('rhy').hidden = m === 'march';
    $('hearts').className = 'hearts ' + (m === 'march' ? 'march' : 'rhy');
    drawHearts(); lightHeart(-1); banner(''); $('count').textContent = ''; $('freeze').hidden = true;
    if (m === 'march') { placeBuddies(true); marchCtl(); }
    else if (m === 'rhy') { drawBoxes(ry.pat); drawPalette(); $('palette').hidden = false; rhyCtl(); banner(VO.build); narrate(VO.build, {still: () => mode === 'rhy'}); }
    else { $('palette').hidden = true; newEcho(); }
  }
  $('t-march').onclick = () => setMode('march');
  $('t-rhy').onclick = () => setMode('rhy');
  $('t-echo').onclick = () => setMode('echo');
  $('sound').onclick = e => {
    soundOn = !soundOn;
    if (master) master.gain.value = soundOn ? .9 : 0;
    if (!soundOn) hush(); else if (tapped && !said.has(VO.welcome[mode])) intro();   // back on: the mode's welcome, if never said
    e.currentTarget.setAttribute('aria-pressed', soundOn);
    e.currentTarget.textContent = soundOn ? '🔔 Sound' : '🔇 Sound';
  };
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const go = $('go'); go && go.click();
  });

  window.__bb = {VO, vlog, said, hush, readNow, get reading() { return reading; }, get busy() { return busy(); }, setMode, ry, mr, startMarch, stopMarch, playPattern, setSlot, newEcho, listenEcho, showEcho, drawBoxes};  // for checking frames
  setMode('march');
})();
</script>
</body>
</html>
