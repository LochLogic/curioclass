<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Spy Science · Describing what I see · Curio Class</title>
<meta name="description" content="Four nature scenes (pond, garden, forest floor, beach) with things to find. Tap to zoom and hear the word, play I spy from clues, and build describing sentences: It is green. It is small. It has four legs. Grades K-2 English language development, teacher-led. Works offline.">
<!--
I SPY SCIENCE (Curio Class)
Grades K-2 English language development, WIDA ELD Standard 4 (the language of science), Inform: name and
describe living and nonliving things by color, size, shape, texture, parts and what they can do. Connects to
K-ESS3-1 and 1-LS1-1 (plants and animals and their parts).
Teacher-led on a projector. Explore (tap a thing to zoom in and hear its name and a describing sentence),
I spy (clues come one at a time; the class finds the thing) and Describe it (build a sentence from word cards,
then say it together).
One file, no network requests. Illustrations drawn with FLUX.1-schnell (Apache 2.0) on a local computer, edited
for Curio Class. Content CC BY 4.0, code MIT. curioclass.org
-->
<style>
:root{
  --paper:#f3faf4;--ink:#1f2d24;--muted:#526458;--line:#d2e8d8;--focus:#e0662a;--brand:#2b7a4b;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--brand);color:#f1fbf4}
h1{margin:0 auto 0 0;font:800 clamp(22px,3vw,32px)/1.1 'Trebuchet MS','Segoe UI',sans-serif}
h1 small{display:block;font:500 15px/1.3 'Segoe UI',sans-serif;color:#cdeed8}
.seg{display:inline-flex;border:2px solid #5fa77b;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#3a8d5b;color:#f1fbf4;min-height:52px;padding:0 16px;font-weight:700;font-size:16px}
.seg button[aria-pressed="true"]{background:#ffd34d;color:#3a2c00}
.icon-btn{border:2px solid #5fa77b;background:#3a8d5b;color:#f1fbf4;border-radius:999px;min-height:52px;padding:0 16px;font-weight:700;font-size:16px}

main{display:grid;grid-template-columns:1fr;min-height:0}
@media (min-width:760px){main{grid-template-columns:minmax(0,1fr) 340px}}
.stage{position:relative;overflow:hidden;min-height:340px;background:#a8d8b9 var(--bg) center/cover}
.scene{position:absolute;left:50%;top:50%;width:1000px;height:620px;transform:translate(-50%,-50%) scale(var(--s,1))}

.thing{position:absolute;border:0;background:none;padding:0;transform:translate(-50%,-50%);transition:transform .35s cubic-bezier(.3,1.4,.5,1),filter .3s}
.thing img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 4px #0003);pointer-events:none}
.thing:hover{transform:translate(-50%,-50%) scale(1.08)}
.thing.zoom{transform:translate(-50%,-50%) scale(1.7);z-index:5;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 14px #fff)}
.thing.found{transform:translate(-50%,-50%) scale(1.4);z-index:5}
.thing.dim{filter:grayscale(.6) brightness(.85)}
.ring{position:absolute;border:7px solid #ffd34d;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 4px #fff8,0 0 30px #ffd34d}
.ring.go{animation:ring 1.2s ease-out}
@keyframes ring{from{transform:translate(-50%,-50%) scale(2);opacity:0}}

.card{position:absolute;left:20px;bottom:16px;width:960px;background:#fffdf7f2;border-radius:24px;padding:12px 20px;box-shadow:0 6px 0 #0002;display:flex;gap:18px;align-items:center;min-height:96px}
.card .word{font:900 46px/1 'Trebuchet MS',sans-serif;color:var(--brand);flex:none}
.card .sent{font:700 24px/1.35 'Trebuchet MS',sans-serif}
.card:empty{display:none}
.clues{display:flex;flex-direction:column;gap:4px}
.clue{font:800 26px/1.25 'Trebuchet MS',sans-serif}
.clue.new{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}

/* sentence builder */
.chips{display:flex;flex-direction:column;gap:6px}
.chips .lbl{font:700 14px 'Segoe UI',sans-serif;color:var(--muted);margin:4px 0 -2px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:3px solid #cfe5d6;border-radius:999px;background:#fff;min-height:44px;padding:4px 14px;font:800 17px 'Trebuchet MS',sans-serif}
.chip[aria-pressed="true"]{background:#ffd34d;border-color:#c99a00}
.chip.no{opacity:.4;text-decoration:line-through}
.frame{display:inline-block;min-width:80px;border-bottom:4px solid #ffd34d;text-align:center;color:#2b7a4b}

.scenes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scenes button{border:3px solid transparent;border-radius:14px;min-height:56px;background:#e3f2e8;font:800 17px 'Trebuchet MS',sans-serif}
.scenes button[aria-pressed="true"]{border-color:#1f2d24;background:#ffd34d}

.panel{background:#fbfefc;border-left:3px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
@media (max-width:759px){.panel{border-left:0;border-top:3px solid var(--line)}}
.hint{margin:0;font:600 18px/1.35 'Segoe UI',sans-serif;color:var(--muted)}
.hint b{color:var(--ink)}
.big-btn{border:0;border-radius:16px;min-height:60px;font:800 20px/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:#fff;background:var(--brand);box-shadow:0 5px 0 #0004;padding:6px 10px}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.big-btn.soft{background:#e3f2e8;color:var(--ink)}
.big-btn.gold{background:#ffd34d;color:#3a2c00}
.big-btn:disabled{opacity:.45}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}.row .big-btn{flex:1}
.tip{margin:0;background:#eaf6ee;border-left:6px solid #5fa77b;border-radius:10px;padding:10px 12px;font:600 17px/1.4 'Segoe UI',sans-serif}
.tip:empty{display:none}
.calm .thing,.calm .ring.go,.calm .clue.new{transition:none;animation:none}

@media (max-width:759px),(max-height:640px){
  header{padding:6px 12px} h1{font-size:19px} h1 small{display:none}
  .seg button,.icon-btn{min-height:38px;font-size:13px;padding:0 10px}
  main{grid-template-columns:minmax(0,1fr) 270px}
  .panel{padding:8px 10px;gap:8px}
  .hint,.tip{font-size:14px}
  .big-btn{min-height:44px;font-size:16px}
  .chip{min-height:36px;font-size:14px;padding:2px 10px}
}
</style>
</head>
<body>
<header>
  <h1>I Spy Science <small>I see... It is... It has...</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-explore" aria-pressed="true">Explore</button>
    <button id="m-spy" aria-pressed="false">I spy</button>
    <button id="m-describe" aria-pressed="false">Describe it</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <div class="stage" id="stage">
    <div class="scene" id="scene">
      <div id="things"></div>
      <div class="card" id="card" aria-live="polite"></div>
    </div>
  </div>
  <aside class="panel">
    <p class="hint" id="hint"></p>
    <p class="lbl" style="margin:0;font:700 15px 'Segoe UI',sans-serif;color:var(--muted)">Place</p>
    <div class="scenes" id="scenes" role="group" aria-label="Place"></div>
    <div class="col" id="ctrl"></div>
    <p class="tip" id="tip"></p>
  </aside>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const fit = () => { const r = $('stage').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1000, r.height / 620)); };
  new ResizeObserver(fit).observe($('stage'));

  // ---------- the scenes ----------
  // each thing: x, y, w in scene units; describing words; clues for I spy (from general to exact)
  const SCENES = {
    pond: {name: 'Pond', bg: 'art:pond', things: [
      {id: 'frog', n: 'frog', x: 240, y: 400, w: 130, color: 'green', size: 'small', feel: 'smooth and wet', has: 'four legs', can: 'jump', living: true, img: 'art:frog'},
      {id: 'duck', n: 'duck', x: 560, y: 330, w: 170, color: 'brown and green', size: 'medium', feel: 'soft', has: 'feathers', can: 'swim', living: true, img: 'art:duck'},
      {id: 'lilypad', n: 'lily pad', x: 420, y: 440, w: 150, color: 'green', size: 'medium', feel: 'smooth', has: 'a flower', can: 'float', living: true, img: 'art:lilypad'},
      {id: 'dragonfly', n: 'dragonfly', x: 760, y: 140, w: 140, color: 'blue', size: 'small', feel: 'light', has: 'four wings', can: 'fly', living: true, img: 'art:dragonfly'},
      {id: 'cattail', n: 'cattail', x: 900, y: 250, w: 110, color: 'brown', size: 'tall', feel: 'fuzzy', has: 'a long stem', can: 'grow in water', living: true, img: 'art:cattail'},
      {id: 'rock', n: 'rock', x: 100, y: 480, w: 140, color: 'gray', size: 'medium', feel: 'hard and bumpy', has: 'no legs', can: 'sit still', living: false, img: 'art:rock'},
    ]},
    garden: {name: 'Garden', bg: 'art:garden', things: [
      {id: 'ladybug', n: 'ladybug', x: 330, y: 410, w: 70, color: 'red with black spots', size: 'tiny', feel: 'hard and shiny', has: 'six legs', can: 'fly', living: true, img: 'art:ladybug'},
      {id: 'sunflower', n: 'sunflower', x: 120, y: 230, w: 170, color: 'yellow', size: 'tall', feel: 'rough', has: 'big petals', can: 'turn to the sun', living: true, img: 'art:sunflower'},
      {id: 'snail', n: 'snail', x: 560, y: 450, w: 110, color: 'brown', size: 'small', feel: 'slimy', has: 'a shell', can: 'crawl slowly', living: true, img: 'art:snail'},
      {id: 'worm', n: 'worm', x: 760, y: 470, w: 120, color: 'pink', size: 'long and thin', feel: 'wiggly', has: 'no legs', can: 'dig in dirt', living: true, img: 'art:worm'},
      {id: 'butterfly', n: 'butterfly', x: 640, y: 160, w: 150, color: 'orange and black', size: 'small', feel: 'soft', has: 'four wings', can: 'fly', living: true, img: 'art:butterfly'},
      {id: 'bee', n: 'bee', x: 360, y: 180, w: 90, color: 'yellow and black', size: 'tiny', feel: 'fuzzy', has: 'six legs', can: 'make honey', living: true, img: 'art:bee'},
    ]},
    forest: {name: 'Forest floor', bg: 'art:forest', things: [
      {id: 'mushroom', n: 'mushroom', x: 220, y: 430, w: 120, color: 'red with white spots', size: 'small', feel: 'soft', has: 'a round cap', can: 'grow in the shade', living: true, img: 'art:mushroom'},
      {id: 'pinecone', n: 'pinecone', x: 450, y: 470, w: 100, color: 'brown', size: 'small', feel: 'bumpy and prickly', has: 'seeds inside', can: 'fall from a tree', living: false, img: 'art:pinecone'},
      {id: 'squirrel', n: 'squirrel', x: 760, y: 360, w: 170, color: 'gray', size: 'small', feel: 'fluffy', has: 'a bushy tail', can: 'climb trees', living: true, img: 'art:squirrel'},
      {id: 'fern', n: 'fern', x: 90, y: 300, w: 180, color: 'green', size: 'medium', feel: 'feathery', has: 'lots of tiny leaves', can: 'grow in the shade', living: true, img: 'art:fern'},
      {id: 'acorn', n: 'acorn', x: 600, y: 480, w: 70, color: 'brown', size: 'tiny', feel: 'smooth and hard', has: 'a little cap', can: 'grow into an oak tree', living: false, img: 'art:acorn'},
      {id: 'nest', n: 'nest', x: 520, y: 170, w: 150, color: 'brown', size: 'medium', feel: 'twiggy', has: 'three blue eggs', can: 'hold baby birds', living: false, img: 'art:nest'},
    ]},
    beach: {name: 'Beach', bg: 'art:beach', things: [
      {id: 'crab', n: 'crab', x: 300, y: 450, w: 130, color: 'red', size: 'small', feel: 'hard', has: 'two big claws', can: 'walk sideways', living: true, img: 'art:crab'},
      {id: 'seastar', n: 'sea star', x: 540, y: 480, w: 110, color: 'orange', size: 'small', feel: 'rough', has: 'five arms', can: 'stick to rocks', living: true, img: 'art:seastar'},
      {id: 'shell', n: 'shell', x: 760, y: 470, w: 100, color: 'white and pink', size: 'small', feel: 'smooth and hard', has: 'a spiral', can: 'wash up on the sand', living: false, img: 'art:shell'},
      {id: 'seagull', n: 'seagull', x: 700, y: 140, w: 170, color: 'white and gray', size: 'medium', feel: 'soft', has: 'a yellow beak', can: 'fly', living: true, img: 'art:seagull'},
      {id: 'seaweed', n: 'seaweed', x: 110, y: 430, w: 130, color: 'green', size: 'long', feel: 'slippery', has: 'long leaves', can: 'float in water', living: true, img: 'art:seaweed'},
      {id: 'jellyfish', n: 'jellyfish', x: 420, y: 300, w: 120, color: 'clear and pink', size: 'small', feel: 'squishy', has: 'long tentacles', can: 'sting', living: true, img: 'art:jellyfish'},
    ]},
  };
  const KEYS = Object.keys(SCENES);
  // keep every thing above the word card along the bottom
  for (const k of KEYS) for (const t of SCENES[k].things) t.y = Math.min(t.y, 492 - t.w / 2);
  const a = t => /^[aeiou]/.test(t.n) ? 'an' : 'a';
  const sentence = t => [`I see ${a(t)} ${t.n}.`, `It is ${t.color}.`, `It is ${t.size}.`, `It has ${t.has}.`, `It feels ${t.feel}.`, `It can ${t.can}.`];

  const state = {mode: 'explore', scene: 'pond', sound: true, spy: null, clues: 0, found: 0, desc: null, pick: {}};

  // ---------- sound ----------
  let ctx;
  const audio = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(f, dur = .2, gain = .07, when = 0, type = 'triangle') {
    if (!state.sound) return;
    const ac = audio(), o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    zoom: () => { tone(600, .12, .05, 0, 'sine'); tone(900, .15, .05, .08, 'sine'); },
    yes: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, .08, i * .09)),
    hmm: () => { tone(392, .2, .06, 0, 'sine'); tone(349, .25, .06, .2, 'sine'); },
    clue: () => tone(880, .12, .05, 0, 'sine'),
  };

  // ---------- draw a scene ----------
  function drawScene() {
    const sc = SCENES[state.scene];
    $('stage').style.setProperty('--bg', `url(${sc.bg})`);
    $('things').replaceChildren(...sc.things.map(t => {
      const b = document.createElement('button');
      b.className = 'thing'; b.dataset.id = t.id;
      Object.assign(b.style, {left: t.x + 'px', top: t.y + 'px', width: t.w + 'px', height: t.w + 'px'});
      b.innerHTML = `<img src="${t.img}" alt="">`;
      b.setAttribute('aria-label', t.n);
      b.onclick = () => tap(t.id);
      return b;
    }));
    $('scenes').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === state.scene));
  }
  $('scenes').replaceChildren(...KEYS.map(k => {
    const b = document.createElement('button'); b.dataset.k = k; b.textContent = SCENES[k].name;
    b.onclick = () => { state.scene = k; setMode(state.mode); };
    return b;
  }));
  const thing = id => SCENES[state.scene].things.find(t => t.id === id);
  const btn = id => $('things').querySelector(`[data-id="${id}"]`);
  function zoom(id) { $('things').querySelectorAll('.thing').forEach(b => { b.classList.toggle('zoom', b.dataset.id === id); }); }
  function ring(t) {
    const r = document.createElement('div');
    r.className = 'ring' + (reduce ? '' : ' go');
    Object.assign(r.style, {left: t.x + 'px', top: t.y + 'px', width: t.w * 1.6 + 'px', height: t.w * 1.6 + 'px'});
    $('things').append(r);
  }

  function tap(id) {
    if (state.mode === 'explore') return explore(id);
    if (state.mode === 'spy') return spyGuess(id);
    return describe(id);
  }

  // ---------- Explore ----------
  function explore(id) {
    const t = thing(id);
    zoom(id); SFX.zoom();
    const s = sentence(t);
    $('card').innerHTML = `<div class="word">${t.n}</div><div class="sent">${s.slice(1, 4).join(' ')}</div>`;
    $('tip').innerHTML = `<b>Is it living?</b> ${t.living ? `Yes, ${a(t)} ${t.n} is a living thing.` : `No, ${a(t)} ${t.n} is not living${t.id === 'pinecone' || t.id === 'acorn' ? ', but it came from a living tree' : ''}.`}`;
    say([`${cap(t.n)}.`, ...s.slice(1, 4)]);
  }
  const cap = s => s[0].toUpperCase() + s.slice(1);

  // ---------- I spy ----------
  function spyClues(t) {
    return [`I spy something ${t.color}.`, `It is ${t.size}.`, `It has ${t.has}.`, `It can ${t.can}.`];
  }
  function newSpy() {
    const pool = SCENES[state.scene].things.filter(t => t.id !== state.spy);
    state.spy = pool[Math.random() * pool.length | 0].id; state.clues = 1;
    zoom(null); $('things').querySelectorAll('.ring').forEach(r => r.remove());
    $('things').querySelectorAll('.thing').forEach(b => b.classList.remove('found', 'dim'));
    showClues(true);
    $('clue').disabled = false;
    $('tip').innerHTML = '';
    say(spyClues(thing(state.spy))[0]);
  }
  function showClues(fresh) {
    const c = spyClues(thing(state.spy)).slice(0, state.clues);
    $('card').innerHTML = `<div class="word" aria-hidden="true">👀</div><div class="clues">${c.map((x, i) => `<div class="clue${i === c.length - 1 && fresh && !reduce ? ' new' : ''}">${x}</div>`).join('')}</div>`;
  }
  function nextClue() {
    if (state.clues >= 4) return;
    state.clues++; SFX.clue(); showClues(true);
    if (state.clues >= 4) $('clue').disabled = true;
    say(spyClues(thing(state.spy))[state.clues - 1]);
  }
  function spyGuess(id) {
    const t = thing(id);
    if (id === state.spy) {
      state.found++;
      btn(id).classList.add('found'); ring(t); SFX.yes();
      $('things').querySelectorAll('.thing').forEach(b => b.classList.toggle('dim', b.dataset.id !== id));
      $('card').innerHTML = `<div class="word">${t.n}</div><div class="sent">You found it! ${sentence(t).slice(1, 4).join(' ')}</div>`;
      $('tip').innerHTML = `<b>Found ${state.found}!</b> Now let a child give the clues: "I spy something..."`;
      say([`You found it! The ${t.n}.`]);
    } else {
      SFX.hmm();
      const s = thing(state.spy), clue = spyClues(s).slice(0, state.clues).find(c => !spyClues(t).includes(c)) || '';
      $('tip').innerHTML = `That's ${a(t)} ${t.n}. ${clue ? `But the clue says: "${clue}"` : 'It fits so far! Ask for another clue.'}`;
      say([`That's ${a(t)} ${t.n}.`, clue ? 'Look at the clues again.' : 'Ask for another clue.']);
    }
  }

  // ---------- Describe it ----------
  const SLOTS = [['color', 'It is', 'color'], ['size', 'It is', 'size'], ['has', 'It has', 'parts'], ['feel', 'It feels', 'texture']];
  function describe(id) {
    state.desc = id; state.pick = {};
    zoom(id); SFX.zoom();
    const t = thing(id), others = SCENES[state.scene].things.filter(x => x.id !== id);
    $('ctrl').innerHTML = `<div class="chips">${SLOTS.map(([k, , lbl]) => {
      const opts = [t[k], ...others.map(x => x[k]).filter(v => v !== t[k])].filter((v, i, arr) => arr.indexOf(v) === i).slice(0, 3).sort();
      return `<p class="lbl">${lbl}</p><div class="chiprow">${opts.map(v => `<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="false">${v}</button>`).join('')}</div>`;
    }).join('')}</div><button class="big-btn gold" id="sayall">🗣️ Say it together</button>`;
    $('ctrl').querySelectorAll('.chip').forEach(c => c.onclick = () => chip(c));
    $('sayall').onclick = sayAll;
    buildCard();
    say(`${cap(t.n)}. Let's describe it.`);
  }
  function chip(c) {
    const t = thing(state.desc), k = c.dataset.k, v = c.dataset.v;
    if (t[k] === v) {
      state.pick[k] = v;
      $('ctrl').querySelectorAll(`.chip[data-k="${k}"]`).forEach(x => x.setAttribute('aria-pressed', x === c));
      SFX.clue();
      const [, start] = SLOTS.find(s => s[0] === k);
      say(`${start} ${v}.`);
    } else {
      c.classList.add('no'); SFX.hmm();
      say(`Hmm. Look closely at the ${t.n}.`);
    }
    buildCard();
  }
  function buildCard() {
    const t = thing(state.desc);
    $('card').innerHTML = `<div class="word">${t.n}</div><div class="sent">I see ${a(t)} ${t.n}. ${SLOTS.map(([k, start]) => `${start} <span class="frame">${state.pick[k] || '&nbsp;'}</span>.`).join(' ')}</div>`;
  }
  function sayAll() {
    const t = thing(state.desc);
    const parts = [`I see ${a(t)} ${t.n}.`, ...SLOTS.filter(([k]) => state.pick[k]).map(([k, start]) => `${start} ${state.pick[k]}.`)];
    if (parts.length < 5) $('tip').innerHTML = 'Pick a word in each row first, then say it together.';
    else { $('tip').innerHTML = '<b>Now everyone say it!</b> Then a volunteer says it without looking.'; SFX.yes(); }
    say(parts);
  }

  function setMode(m) {
    state.mode = m; stopTalk();
    for (const [id, k] of [['m-explore', 'explore'], ['m-spy', 'spy'], ['m-describe', 'describe']]) $(id).setAttribute('aria-pressed', m === k);
    drawScene(); $('card').innerHTML = ''; $('tip').innerHTML = '';
    if (m === 'explore') {
      $('ctrl').innerHTML = '';
      $('hint').innerHTML = '<b>Explore.</b> Tap something to zoom in and hear its name. Say it together: "I see a frog. It is green."';
      say(`The ${SCENES[state.scene].name.toLowerCase()}. What do you see?`);
    }
    if (m === 'spy') {
      $('ctrl').innerHTML = '<button class="big-btn gold" id="clue">💡 Next clue</button><button class="big-btn" id="newspy">New I spy →</button>';
      $('clue').onclick = nextClue; $('newspy').onclick = newSpy;
      $('hint').innerHTML = '<b>I spy.</b> Read the clue together. Children point to what they think it is. Tap it to check, or ask for the next clue.';
      state.spy = null; newSpy();
    }
    if (m === 'describe') {
      $('ctrl').innerHTML = '';
      $('hint').innerHTML = '<b>Describe it.</b> Tap something in the picture. Choose the right word for its color, size, parts and how it feels, then say the whole sentence together.';
      say('Tap something to describe.');
    }
  }
  $('m-explore').onclick = () => setMode('explore');
  $('m-spy').onclick = () => setMode('spy');
  $('m-describe').onclick = () => setMode('describe');
  addEventListener('keydown', e => { if (e.target.closest('button') || !/^[1-3]$/.test(e.key)) return; setMode(['explore', 'spy', 'describe'][e.key - 1]); });

  // ---------- sound and voice ----------
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
    if (!state.sound) stopTalk();
  };
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((x, y) => score(y) - score(x))[0] || null;
  }
  if ('speechSynthesis' in window) {
    const speak = speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      let done = false;
      const go = () => { if (done) return; done = true; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.getVoices();
  }
  const CLIPS = "voice:*";
  const ALL = () => KEYS.flatMap(k => SCENES[k].things);
  const allLines = () => [...new Set([
    ...ALL().flatMap(t => [`${cap(t.n)}.`, ...sentence(t), ...spyClues(t), `You found it! The ${t.n}.`, `That's ${a(t)} ${t.n}.`, `${cap(t.n)}. Let's describe it.`, `Hmm. Look closely at the ${t.n}.`]),
    ...ALL().flatMap(t => SLOTS.map(([k, start]) => `${start} ${t[k]}.`)),
    ...KEYS.map(k => `The ${SCENES[k].name.toLowerCase()}. What do you see?`), 'Look at the clues again.', 'Ask for another clue.', 'Tap something to describe.'])];
  let talk = 0, clip = null, last = [];
  function stopTalk() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (CLIPS[text]) { clip = new Audio(CLIPS[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = .88; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function say(parts, force) {
    if (!state.sound && !force) return;
    stopTalk();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(200); }
  }
  $('read').onclick = () => say(last.length ? last : [$('hint').textContent], true);

  showMotion();
  window.__spy = {state, setMode, tap, nextClue, allLines};  // for checking frames
  setMode('explore');
})();
</script>
</body>
</html>
