    <rect x="271" y="315" width="112" height="47" rx="7" fill="#fff4d1" stroke="#c9ac67" stroke-width="2"/>
    <rect x="391" y="315" width="86" height="47" rx="7" fill="#fff4d1" stroke="#c9ac67" stroke-width="2"/>
    <text x="214" y="346" font-size="23">sea</text><text x="327" y="346" font-size="23">turtles</text>
    <text x="434" y="346" font-size="23">eat</text>
    <text x="320" y="49" font-size="37" fill="#fffce9" stroke="#28594b" stroke-width=".7">Keyword Fishing</text>
