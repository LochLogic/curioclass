      <path d="M-20-23q-11 24 0 46m14-47q-9 24 1 49" fill="none" stroke="#fff1bb" stroke-width="8"/>
      <circle cx="29" cy="-7" r="7" fill="#fff9dc"/><circle cx="31" cy="-7" r="4" fill="#183e3b"/>
      <circle cx="32" cy="-9" r="1.5" fill="white"/>
      <path d="M39 10q8 4 11-1" fill="none" stroke="#9e542c" stroke-width="2"/>
      <path d="M0 0q15-8 14 13z" fill="#e9933b" stroke="#c57228"/>
    </g>
  </defs>
  <rect width="640" height="400" fill="url(#water)"/>
  <path d="M0 104Q90 31 177 83T340 68 504 82 640 59V145H0" fill="#8eaa79"/>
  <path d="M0 120Q124 64 232 111T435 101 640 91V150H0" fill="#5f8c6b" opacity=".75"/>
  <path d="M0 132Q170 117 340 135T640 129" fill="none" stroke="#edf5cf" stroke-width="24" opacity=".35"/>
  <g fill="none" stroke="#d2efd5" opacity=".45">
