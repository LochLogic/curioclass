<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Keyword Fishing</title>
  <desc id="desc">A red bobber and two golden fish on a misty lake. Word tiles read sea, turtles and eat.</desc>
  <defs>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#a3d8c4"/><stop offset=".4" stop-color="#438f91"/><stop offset="1" stop-color="#125a6b"/>
    </linearGradient>
    <linearGradient id="fish" x2="0" y2="1">
      <stop stop-color="#ffce79"/><stop offset=".6" stop-color="#f4a259"/><stop offset="1" stop-color="#c96d30"/>
    </linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#d6ad70"/><stop offset="1" stop-color="#8e6137"/></linearGradient>
    <radialGradient id="cap" cx=".3" cy=".2"><stop stop-color="#ff8b65"/><stop offset="1" stop-color="#b6291e"/></radialGradient>
    <g id="one-fish">
      <path d="M-38 0l-30-22 3 43z" fill="#d68733" stroke="#bc6f26" stroke-width="2"/>
      <path d="M-9-22q10-26 26 2" fill="#df923a"/>
