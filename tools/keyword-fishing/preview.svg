    <ellipse cx="322" cy="218" rx="75" ry="18"/><ellipse cx="322" cy="218" rx="48" ry="10"/>
  </g>
  <path d="M320 0v172" stroke="#fff8d1" stroke-width="1.5"/>
  <ellipse cx="320" cy="203" rx="22" ry="28" fill="#fff7db"/>
  <path d="M298 202a22 28 0 0 1 44 0z" fill="url(#cap)"/>
  <circle cx="320" cy="171" r="5" fill="none" stroke="#cbb064" stroke-width="3"/>
  <use href="#one-fish" transform="translate(170 219) rotate(-6)"/>
  <use href="#one-fish" transform="translate(475 245) rotate(7)"/>
  <path d="M0 307l103-16 34 109H0" fill="url(#wood)" stroke="#986b3d" stroke-width="3"/>
  <g stroke="#745134" fill="none" opacity=".65">
    <path d="M0 337l112-14M0 373l124-15M19 314l7 85M60 307l16 92M16 344l28 3m-3-27 21 2"/>
