.custom-form > .privacy, #custom-details, #custom-error { grid-column:1 / -1; }
#custom-details { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }

.custom-form > label { display:grid; grid-template-columns:1fr; align-content:start; }
.custom-form label { font-size:12px; }
@media (max-width:760px) and (min-height:551px), (max-width:599px) {
  .stage { height:460px; grid-template-rows:200px 1fr; }
  body.ours .build { position:fixed; left:10px; right:10px; bottom:8px; width:auto; z-index:8;
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; padding:0;
    background:var(--panel); box-shadow:0 3px 12px #0008; border:0; }
  body.ours .build > .section-label, body.ours .build > .privacy { display:none; }
  body.ours .build button { min-width:48px; font-size:11px; padding:4px; }
  body.ours .build #add-row { position:static; width:auto; font-size:12px; box-shadow:none; }
  body.ours .build #add-column { grid-column:1; grid-row:1; }
  body.ours .build #add-row { grid-column:2; grid-row:1; }
  body.ours .build #clear { grid-column:3; grid-row:1; }
  body.ours #save-status { grid-column:1 / -1; grid-row:2; min-height:12px; font-size:10px; line-height:12px; }
  body[data-card].ours .build { visibility:hidden; }
  body[data-card="shelf"] .overlay { position:fixed; top:var(--card-top,120px); left:8px; right:8px; bottom:8px; }
}
@media (max-width:599px) {
  .stage { height:424px; grid-template-rows:185px 1fr; }
}
@media (max-height:550px), (max-width:760px) {
  body[data-card="entry"] .overlay header { padding:0 6px; }
  body[data-card="entry"] .overlay h2 { font-size:14px; }
  body[data-card="entry"] .overlay-content { padding:2px 6px; }
  body[data-card="entry"] .overlay-actions { padding:4px 6px; }
  .entry-field { padding:3px; }
  .entry-field legend { font-size:10px; line-height:10px; }
  .answer-buttons { display:grid; grid-template-columns:repeat(var(--choice-count,2),minmax(0,1fr)); gap:3px; }
  .answer-buttons button { flex-direction:column; gap:1px; padding:2px; min-width:48px; font-size:10px;
    line-height:1.1; overflow-wrap:anywhere; }
  .answer-buttons img { width:28px; height:28px; }
}

<body>
<header id="top">
  <h1>Data Table Builder <small>Rows, columns, charts</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-sample" aria-pressed="true">▤ Sample class</button>
    <button id="m-ours" aria-pressed="false">▰ Our class</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" aria-label="Motion" title="Motion">◌ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true" aria-label="Sound" title="Sound">♫ Sound</button>
  <button class="icon-btn" id="read" aria-label="Read hint" title="Read hint">▸ Read</button>
</header>
<main>
  <aside class="panel" id="panel">
    <p class="hint" id="hint"></p>
    <section class="chart-controls" aria-label="Chart controls">
      <h2 class="section-label">Chart</h2>
      <div class="chart-buttons" role="group" aria-label="Chart type">
        <button id="chart-bar" aria-pressed="true"><span aria-hidden="true">▥</span>Bar graph</button>
        <button id="chart-dot" aria-pressed="false"><span aria-hidden="true">⠿</span>Dot plot</button>
        <button id="chart-list" aria-pressed="false"><span aria-hidden="true">☷</span>Sorted list</button>
      </div>
      <label class="split-row">Split by <select id="split"><option value="">No split</option></select></label>
    </section>
    <section class="question" aria-label="Questions">
      <h2 class="section-label">Questions</h2>
      <div class="q-nav">
        <button id="q-prev" aria-label="Previous question">← Previous</button>
        <span id="q-count"></span>
        <button id="q-next" aria-label="Next question">Next →</button>
      </div>
      <h3 id="q-title"></h3>
      <textarea id="own-question" class="own-question" maxlength="80" aria-label="Your own question" hidden></textarea>
      <p class="guess-label" id="guess-label">Guess first</p>
      <div id="guesses"></div>
      <button id="show" class="primary">Show me</button>
      <p id="q-result" aria-live="polite"></p>
      <p id="q-reason"></p>
    </section>
    <section class="build" id="build" aria-label="Build your table" hidden>
      <h2 class="section-label">Build</h2>
      <button id="add-column">＋ Add a column</button>
      <button id="add-row" class="primary">＋ Add my row</button>
      <p class="privacy">Answers stay on this device. Enter counts and choices, never names.</p>
      <p id="save-status" role="status"></p>
      <button id="clear">▱ Clear our class</button>
    </section>
  </aside>
  <section class="stage" id="stage" aria-label="Class table and chart">
    <div class="table-box">
      <div class="table-heading"><h2 id="table-title">ROOM 4 <span class="idle-sheen">✧</span></h2><span id="table-size"></span></div>
      <div id="table-scroll"><div id="table"></div></div>
      <p class="table-note" id="table-note"></p>
    </div>
    <div class="chart-box" id="chart-box">
      <div class="chart-heading"><h2 id="chart-title"></h2><span id="chart-kind"></span></div>
      <div id="chart-viewport">
        <svg id="chart" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="group" aria-label="Chart"></svg>
        <div id="sorted" hidden></div><div id="empty" class="empty" hidden></div>
        <div id="prediction-cover" class="prediction-cover" hidden>
          <div class="chalk-marks" aria-hidden="true"><i></i><i></i><i></i></div>
          <strong>Your prediction comes first</strong><span>Choose a guess, tap its column, then Show me.</span>
        </div>
      </div>
      <p id="chart-summary" aria-live="polite"></p>
      <div class="chalk-tray" aria-hidden="true"><i></i><i></i><i></i></div>
      <section id="overlay" class="overlay" role="dialog" aria-modal="false" aria-labelledby="overlay-title" hidden>
        <header><h2 id="overlay-title"></h2><button id="overlay-close" aria-label="Close card">×</button></header>
        <div id="overlay-content" class="overlay-content"></div>
        <div id="overlay-actions" class="overlay-actions"></div>
      </section>
    </div>
  </section>
</main>
<script src="kit:curio"></script>
<script src="kit:data-desk"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const clone = x => JSON.parse(JSON.stringify(x));
  const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const colors = ['#8fd3ff','#ffb38a','#c8f08f','#f7a8d8','#d0c2ff','#f2e6a0'];
  const shapes = ['circle','square','triangle','diamond','star','circle'];
  const images = {
    Apple:'art:icon-apple', Banana:'art:icon-banana', Grapes:'art:icon-grapes', Orange:'art:icon-orange',
    Strawberry:'art:icon-strawberry', Walk:'art:icon-walk', Bus:'art:icon-bus', Car:'art:icon-car', Bike:'art:icon-bike',
    Winter:'art:icon-winter', Spring:'art:icon-spring', Summer:'art:icon-summer', Fall:'art:icon-fall'
  };
  const picture = (v,c) => c && !c.custom && images[v] ? `<img src="${images[v]}" alt="">` : '';
  const kindName = c => c.kind === 'number' ? '# Number' : c.kind === 'yesno' ? '✓ Yes/No' : '☷ List';
  const shelf = [
    {key:'fruit', name:'Favorite fruit', kind:'list', choices:['Apple','Banana','Grapes','Orange','Strawberry']},
    {key:'season', name:'Favorite season', kind:'list', choices:['Winter','Spring','Summer','Fall']},
    {key:'way', name:'Way to school today', kind:'list', choices:['Walk','Bus','Car','Bike','Other']},
    {key:'whistle', name:'Can you whistle?', kind:'yesno', choices:['Yes','No']},
    {key:'boat', name:'Have you ever been on a boat?', kind:'yesno', choices:['Yes','No']},
    {key:'teeth', name:'Teeth lost', kind:'number', min:0, max:20},
    {key:'pockets', name:'Pockets today', kind:'number', min:0, max:12},
    {key:'letters', name:'Letters in my first name', kind:'number', min:1, max:15},
    {key:'jacks', name:'Jumping jacks in 10 seconds', kind:'number', min:0, max:30}
  ];
  const sampleColumns = ['fruit','teeth','whistle','way','pockets'].map(k => clone(shelf.find(c => c.key === k)));
  sampleColumns.find(c => c.key === 'way').choices = ['Walk','Bus','Car','Bike'];
  const raw = [
    ['Apple',8,'Yes','Car',2], ['Strawberry',9,'Yes','Bus',3], ['Banana',7,'No','Walk',1],
    ['Apple',10,'Yes','Car',4], ['Grapes',8,'No','Bus',2], ['Strawberry',6,'Yes','Car',0],
    ['Apple',11,'Yes','Bus',2], ['Orange',8,'No','Walk',5], ['Apple',9,'Yes','Car',3],
    ['Strawberry',5,'Yes','Bus',2], ['Banana',8,'No','Bus',1], ['Grapes',10,'Yes','Car',2],
    ['Apple',7,'Yes','Walk',6], ['Strawberry',9,'No','Car',2], ['Grapes',8,'Yes','Bus',3],
    ['Banana',12,'Yes','Car',0], ['Apple',6,'No','Bus',2], ['Orange',8,'Yes','Walk',4],
    ['Strawberry',10,'No','Car',1], ['Apple',9,'Yes','Car',2], ['Banana',7,'Yes','Bus',3],
    ['Strawberry',8,'No','Walk',2], ['Grapes',4,'Yes','Bike',1], ['Apple',9,'Yes','Bike',3]
  ];
  const makeMode = (columns,rows) => ({columns,rows,selected:columns[0]?.key || '',chart:'bar',split:'',card:0,
    guesses:{},reveals:{},inspected:{},ownQuestion:'',ownColumn:'',sort:null,marked:[],newest:null});
  const sampleRows = raw.map((r,i) => Object.fromEntries([['_id',i+1],...sampleColumns.map((c,j) => [c.key,r[j]])]));
  const state = {mode:'sample',overlay:null,sample:makeMode(sampleColumns,sampleRows),ours:makeMode([],[])};
  const current = () => state[state.mode];
  const selected = () => current().columns.find(c => c.key === current().selected);
  let t,view,tableController,charts=[],keySerial=0,lastTap=0,returnFocus=null,chartPick=-1;
  const L = {
    'w-sample':"This is Room 4's table. Each row is one student. Each column is one question. Tap a column name to chart it.",
    charts:'Same rows, new chart. Tap Bar graph, Dot plot or Sorted list.',
    split:'Now the chart splits into groups, so you can compare them.',
    card:"Guess first and tap the class's guess. Then tap the column that answers the question, and press Show me.",
    'w-ours':"Let's build our own table. Tap Add a column to choose what to ask.",
    kinds:'Each column has a kind: a list, a number, or yes or no. Add more columns, or tap Add my row.',
    entry:'Tap one answer for each column. Then tap Done.',
    counted:'Now the computer can count. Tap a column name and pick a chart.',
    ours:'That column answers it. Look at the chart and say what it shows.',
    own:'This chart counts the column you chose. Say how it helps answer your question.',
    answers:['Apple: 8 of 24.','Most often 8. From 4 to 12.','Yes 16, No 8. Twice as many can.',
      'Car 9, Bus 8, Walk 5, Bike 2.','56 pockets.','Car riders: 7 yes, 2 no. Bus riders: 5 yes, 3 no.'],
    rows:Array.from({length:40},(_,i) => `Row ${i+1} added.`)
  };
  const V = Curio.voice({lines:L,scope:() => state.mode,hint:false,read:() => {
    const text=$('hint').textContent;
    const intro=V.log.find(line => line.key === 'w-sample' && line.as === 'spoken');
    return state.mode === 'sample' && (!intro || intro.cut) && text !== L['w-sample'] ? [L['w-sample'],text] : text;
  },
    welcome:() => state.mode === 'sample' ? ['w-sample',{valid:() => !state.overlay}]
      : !current().columns.length && !state.overlay ? ['w-ours',{needs:'#add-column'}] : null});
  function hint(text) { $('hint').textContent=L[text] || text; }
  function collectionHint() {
    if (!current().columns.length) return L['w-ours'];
    return current().rows.length >=40
      ? 'The table is full. Tap a cell to edit it, or a column name to chart it.'
      : 'Tap Add my row, or tap a column name to chart the class.';
  }
  function how(key,valid=() => true,needs) {
    hint(key);
    if (!V.heard(key)) V.how(key,{valid,needs,hint:false});
  }
  function chartVisible() { return state.mode !== 'sample' || !!current().inspected[current().card]; }
  function inspectIfReady() {
    if (state.mode === 'sample' && validGuess()) current().inspected[current().card]=true;
  }
  function guideChart() {
    if (!current().rows.length) {
      if (current().columns.length) how('kinds',() => !state.overlay,'#add-row');
      else hint('w-ours');
    } else if (!chartVisible()) how('card',() => !state.overlay && !chartVisible());
    else how('charts',() => !state.overlay && chartVisible());
  }
  function ping() { Curio.tone(480,.055,.035,'sine'); }
  function dropMoment() {
    V.dropQueued();
    const stale=[L['w-sample'],L['w-ours'],L.split,L.entry,L.counted,L.ours,L.own,...L.answers,...L.rows];
    if (stale.includes(V.playing)) V.hush();
  }
  function validValue(c,v) {
    return c.kind === 'number' ? Number.isInteger(v) && v >= c.min && v <= c.max : c.choices.includes(v);
  }
  function load() {
    try {
      const saved=JSON.parse(localStorage.getItem('dtb-our-class'));
      if (!saved || !Array.isArray(saved.columns) || !Array.isArray(saved.rows)) return;
      const columns=saved.columns.slice(0,6).filter(c => c && /^[a-z][a-z0-9_-]{0,40}$/.test(c.key)
        && typeof c.name === 'string' && c.name.length <=(c.custom ? 24 : 32) && ['list','number','yesno'].includes(c.kind)
        && (c.kind === 'number' ? Number.isInteger(c.min) && Number.isInteger(c.max) && c.min >=0 && c.max <=100 && c.min <=c.max
          : Array.isArray(c.choices) && c.choices.length >=1 && c.choices.length <=6
            && c.choices.every(v => typeof v === 'string' && v.length >0 && v.length <=14)));
      if (new Set(columns.map(c => c.key)).size !== columns.length) return;
      const rows=saved.rows.slice(0,40).filter(r => r && columns.every(c => validValue(c,r[c.key])));
      const used=new Set();
      rows.forEach(r => {
        if (!Number.isInteger(r._id) || r._id <1 || r._id >40 || used.has(r._id)) {
          r._id=Array.from({length:40},(_,i) => i+1).find(i => !used.has(i));
        }
        used.add(r._id);
      });
      state.ours=makeMode(columns,rows.map(r => Object.fromEntries([['_id',r._id],...columns.map(c => [c.key,r[c.key]])])));
    } catch { /* Blocked or corrupt storage leaves a usable empty table. */ }
  }
  function persist() {
    if (state.mode !== 'ours') return;
    try {
      const m=current();
      localStorage.setItem('dtb-our-class',JSON.stringify({columns:m.columns,rows:m.rows}));
      $('save-status').textContent='Saved on this device.';
    } catch { $('save-status').textContent='Not saved. Keep this page open.'; }
  }
  function definitions(columns) {
    return Object.fromEntries(columns.map(c => [c.key,{label:c.name,type:c.kind === 'number' ? 'number' : 'text',
      kind:c.kind,choices:c.choices,values:c.choices,digits:0}]));
  }
  function attachTable() {
    const m=current();
    t=DataTable(m.rows,{columns:definitions(m.columns)});
    t.counts=key => t.count(key);
    t.on('change',() => {
      m.rows=t.rows.map(r => ({...r}));
      m.reveals={};
      m.inspected={};
      persist();
      renderTable();
      renderChart();
      renderQuestions();
      updateBuild();
    });
    renderTable();
  }
  function renderTable() {
    const m=current(),scroller=$('table-scroll'),sx=scroller.scrollLeft,sy=scroller.scrollTop;
    const active=document.activeElement,activeId=active?.id;
    if (tableController) tableController.destroy();
    $('table').replaceChildren();
    if (!m.columns.length) {
      $('table').innerHTML='<div class="empty"><strong>Our class, our questions.</strong><span>1 Choose columns. 2 Add rows. 3 Ask questions.</span></div>';
    } else {
      const rows=m.rows.slice();
      if (m.sort) {
        const c=m.columns.find(c => c.key === m.sort.key);
        rows.sort((a,b) => (c.kind === 'number' ? a[c.key]-b[c.key]
          : c.choices.indexOf(a[c.key])-c.choices.indexOf(b[c.key]))*m.sort.dir || a._id-b._id);
      }
      view=DataTable(rows,{columns:definitions(m.columns)});
      tableController=view.renderTable($('table'),{columns:m.columns.map(c => c.key),index:'Row',caption:state.mode === 'sample'
        ? 'Room 4, invented practice data' : 'Our class, device-only data'});
      if (state.mode === 'sample') {
        tableController.table.tabIndex=-1;
        scroller.tabIndex=0;
        scroller.setAttribute('role','region');
        scroller.setAttribute('aria-label','Room 4 sample table. Arrow keys enter the read-only cells.');
        scroller.onkeydown=e => {
          if (e.target === scroller && e.key.startsWith('Arrow')) {
            e.preventDefault();
            const cell=tableController.table.querySelector('tbody td');
            cell?.focus({preventScroll:true});
            revealCell(cell);
          }
        };
      } else {
        scroller.removeAttribute('tabindex');
        scroller.removeAttribute('role');
        scroller.removeAttribute('aria-label');
        scroller.onkeydown=null;
      }
      const head=tableController.table.tHead.rows[0];
      m.columns.forEach((c,j) => {
        const th=head.cells[j+1];
        th.innerHTML=`<div class="head-top"><button id="col-${c.key}" class="head-select" data-column="${c.key}"
          aria-pressed="${m.selected === c.key}" title="Chart ${esc(c.name)}">${esc(c.name)}<small>${kindName(c)}</small></button>
          <button id="sort-${c.key}" class="head-sort" aria-label="Sort ${esc(c.name)}" title="Sort up, down, off">↕</button></div>`;
        if (state.mode === 'ours') {
          const remove=document.createElement('button');
          remove.className='head-remove';
          remove.id='remove-'+c.key;
          remove.setAttribute('aria-label','Remove '+c.name);
          remove.textContent='×';
          remove.onclick=() => confirmCard('Remove this column and its answers?',() => removeColumn(c.key));
          th.querySelector('.head-top').appendChild(remove);
        }
        $('col-'+c.key).onclick=() => selectColumn(c.key);
        $('sort-'+c.key).onclick=() => {
          m.sort=m.sort?.key === c.key ? m.sort.dir === 1 ? {key:c.key,dir:-1} : null : {key:c.key,dir:1};
          ping();
          const body=tableController.table.tBodies[0];
          const records=new Map(m.rows.map(r => [r._id,r]));
          const entryOrder=new Map(m.rows.map((r,i) => [r._id,i]));
          const ordered=[...body.rows].sort((a,b) => {
            const aa=records.get(+a.dataset.row),bb=records.get(+b.dataset.row);
            return m.sort ? (c.kind === 'number' ? aa[c.key]-bb[c.key]
              : c.choices.indexOf(aa[c.key])-c.choices.indexOf(bb[c.key]))*m.sort.dir || aa._id-bb._id
              : entryOrder.get(aa._id)-entryOrder.get(bb._id);
          });
          ordered.forEach(row => body.appendChild(row));
          m.columns.forEach(col => {
            const direction=m.sort?.key === col.key ? m.sort.dir : 0;
            $('sort-'+col.key).textContent=direction === 1 ? '↑' : direction === -1 ? '↓' : '↕';
            $('sort-'+col.key).closest('th').setAttribute('aria-sort',direction === 1 ? 'ascending' : direction === -1 ? 'descending' : 'none');
          });
          hint('The chart keeps the same counts. Tap a column name to chart it.');
        };
        th.setAttribute('aria-sort',m.sort?.key === c.key ? m.sort.dir === 1 ? 'ascending' : 'descending' : 'none');
        $('sort-'+c.key).textContent=m.sort?.key === c.key ? m.sort.dir === 1 ? '↑' : '↓' : '↕';
      });
      [...tableController.table.tBodies[0].rows].forEach((tr,i) => {
        const row=rows[i];
        tr.dataset.row=row._id;
        tr.cells[0].textContent='Row '+row._id;
        if (m.marked.includes(row._id)) tr.classList.add('marked');
        if (row._id === m.newest) tr.classList.add('new-row');
        m.columns.forEach((c,j) => {
          const cell=tr.cells[j+1];
          cell.dataset.row=row._id;
          cell.dataset.column=c.key;
          cell.id=`cell-${row._id}-${c.key}`;
          cell.tabIndex=state.mode === 'ours' && i === 0 && j === 0 ? 0 : -1;
          cell.setAttribute('aria-label',`Row ${row._id}, ${c.name}: ${row[c.key]}`);
          if (state.mode === 'ours') {
            cell.classList.add('cell-edit');
            cell.onclick=() => entryCard(row._id,c.key);
          }
          cell.onkeydown=e => {
            if (e.key === 'Enter' && state.mode === 'ours') { e.preventDefault(); entryCard(row._id,c.key); }
            const dx=e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
            const dy=e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
            if (!dx && !dy) return;
            e.preventDefault();
            const visibleRows=[...tableController.table.tBodies[0].rows];
            const at=visibleRows.findIndex(el => +el.dataset.row === row._id);
            const rr=Math.max(0,Math.min(visibleRows.length-1,at+dy)),cc=Math.max(0,Math.min(m.columns.length-1,j+dx));
            const target=$(`cell-${visibleRows[rr].dataset.row}-${m.columns[cc].key}`);
            target.focus({preventScroll:true});
            revealCell(target);
          };
        });
        if (state.mode === 'ours') {
          const td=tr.insertCell();
          td.innerHTML=`<button class="row-remove" id="delete-row-${row._id}" aria-label="Delete row ${row._id}">⌫</button>`;
          td.firstChild.onclick=() => confirmCard(`Delete Row ${row._id}?`,() => {
            t.remove(t.rows.findIndex(r => r._id === row._id));
            closeCard();
          });
        }
      });
      if (state.mode === 'ours') { const h=document.createElement('th'); h.scope='col'; h.textContent='Delete'; head.appendChild(h); }
      paintColumn();
    }
    $('table-size').textContent=`${m.rows.length} ${m.rows.length === 1 ? 'row' : 'rows'}, `
      +`${m.columns.length} ${m.columns.length === 1 ? 'column' : 'columns'}`;
    $('table-title').innerHTML=(state.mode === 'sample' ? 'ROOM 4' : 'OUR CLASS')+' <span class="idle-sheen">✧</span>';
    $('table-note').innerHTML=state.mode === 'sample'
      ? 'Room 4 is made up for practice.<span>Kids have 20 baby teeth. Most lose them between about age 6 and age 12.</span>'
        +'<span class="sample-edit-note">This is a sample. Switch to Our class to make your own.</span>'
      : 'One row per student. Tap a cell to edit. Answers stay on this device.';
    scroller.scrollLeft=sx;
    scroller.scrollTop=sy;
    if (activeId && $(activeId) && !document.contains(active)) $(activeId).focus({preventScroll:true});
  }

    const wrap=document.createElement('div');
    wrap.className='stepper';
    wrap.innerHTML=`<button type="button" aria-label="Decrease">−</button><input id="${id}" type="number" min="${lo}"
      max="${hi}" step="1" inputmode="numeric" aria-label="Answer, ${lo} to ${hi}" placeholder="?">
      <button type="button" aria-label="Increase">＋</button>`;
    const input=wrap.querySelector('input'),buttons=wrap.querySelectorAll('button');
    if (value !== undefined && value !== null) input.value=value;
    const changed=() => {
      const v=input.value === '' ? null : Number(input.value),valid=Number.isInteger(v) && v >=lo && v <=hi;
      input.setAttribute('aria-invalid',!valid);
      onValue(valid ? v : null);
    };
    input.oninput=changed;
    buttons[0].onclick=() => { input.value=Math.max(lo,input.value === '' ? lo : Number(input.value)-1); changed(); ping(); };
    buttons[1].onclick=() => { input.value=Math.min(hi,input.value === '' ? lo : Number(input.value)+1); changed(); ping(); };
    return wrap;
  }
  function openCard(title,type) {
    dropMoment();
    V.hush();
    if (!state.overlay) returnFocus=document.activeElement;
    state.overlay=type;
    document.body.dataset.card=type;
    document.body.style.setProperty('--card-top',($('top').getBoundingClientRect().bottom+6)+'px');
    $('overlay-title').textContent=title;
    $('overlay-content').replaceChildren();
    $('overlay-content').scrollTop=0;
    $('overlay-actions').replaceChildren();
    $('overlay').hidden=false;
    document.querySelectorAll('#panel button,#panel select,#panel input,#panel textarea').forEach(el => { el.inert=true; });
    $('table-scroll').inert=true;
    ping();
  }
  function closeCard() {
    state.overlay=null;
    delete document.body.dataset.card;
    $('overlay').hidden=true;
    document.querySelectorAll('#panel button,#panel select,#panel input,#panel textarea').forEach(el => { el.inert=false; });
    $('table-scroll').inert=false;
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus({preventScroll:true});
    else if (!$('add-row').disabled && state.mode === 'ours') $('add-row').focus({preventScroll:true});
    else $('m-'+state.mode).focus({preventScroll:true});
    V.dropQueued();
    if (V.playing === L.entry) V.hush();
    hint(state.mode === 'ours' ? collectionHint() : L.charts);
  }
  function focusInCard(el) {
    if (!el) return;
    el.focus({preventScroll:true});
    const pane=$('overlay-content'),group=el.closest('.entry-field');
    const target=group && group.getBoundingClientRect().height <=pane.clientHeight ? group : el;
    const a=target.getBoundingClientRect(),b=pane.getBoundingClientRect();
    if (a.bottom >b.bottom) pane.scrollTop+=a.bottom-b.bottom+3;
    else if (a.top <b.top) pane.scrollTop-=b.top-a.top+3;
  }
  function actionButton(id,text,fn,primary=false) {
    const b=document.createElement('button');
    b.id=id;
    b.textContent=text;
    if (primary) b.className='primary';
    b.onclick=fn;
    $('overlay-actions').appendChild(b);
    return b;
  }
  function confirmCard(text,yes) {
    openCard('Check before erasing','confirm');
    $('overlay-content').innerHTML=`<p class="confirm-body">${esc(text)}</p>`;
    actionButton('confirm-no','No, keep it',closeCard);
    actionButton('confirm-yes','Yes',yes,true);
    $('confirm-no').focus({preventScroll:true});
    hint('Choose Yes to erase, or No to keep your table.');
  }
  function entryCard(rowId=null,onlyKey=null) {
    const m=current();
    if (state.mode !== 'ours' || !m.columns.length || (rowId == null && m.rows.length >=40)) return;
    const existing=m.rows.find(r => r._id === rowId),answers=existing ? {...existing} : {};
    const cols=onlyKey ? m.columns.filter(c => c.key === onlyKey) : m.columns;
    openCard(existing ? `Edit Row ${rowId}` : 'Add my row','entry');
    const fields=document.createElement('div');
    fields.className='entry-fields';
    $('overlay-content').appendChild(fields);
    let done;
    const valid=() => cols.every(c => validValue(c,answers[c.key]));
    cols.forEach(c => {
      const field=document.createElement('fieldset');
      field.className='entry-field';
      field.innerHTML=`<legend>${esc(c.name)}</legend>`;
      if (c.kind === 'number') {
        field.appendChild(numberControl('entry-'+c.key,answers[c.key],c.min,c.max,v => {
          answers[c.key]=v;
          done.disabled=!valid();
        }));
        const note=document.createElement('span');
        note.className='range-note';
        note.textContent=`Whole numbers from ${c.min} to ${c.max}`;
        field.appendChild(note);
      } else {
        const choices=document.createElement('div');
        choices.className='answer-buttons';
        choices.style.setProperty('--choice-count',c.choices.length);
        c.choices.forEach((value,j) => {
          const button=document.createElement('button');
          button.id=`entry-${c.key}-${j}`;
          button.innerHTML=picture(value,c)+(value === 'Yes' ? '✓ ' : value === 'No' ? '× ' : '')+esc(value);
          button.setAttribute('aria-pressed',answers[c.key] === value);
          button.onclick=() => {
            answers[c.key]=value;
            [...choices.children].forEach(el => el.setAttribute('aria-pressed',el === button));
            done.disabled=!valid();
            ping();
          };
          choices.appendChild(button);
        });
        field.appendChild(choices);
      }
      fields.appendChild(field);
    });
    actionButton('entry-cancel','Cancel',closeCard);
    done=actionButton('entry-done','Done',() => {
      if (!valid()) return;
      const was=m.rows.length;
      closeCard();
      if (existing) {
        t.batch(() => cols.forEach(c => t.set(t.rows.findIndex(r => r._id === rowId),c.key,answers[c.key])));
        hint('The answer changed. Look at the chart, then tap another cell or Add my row.');
      } else {
        const used=new Set(m.rows.map(r => r._id)),id=Array.from({length:40},(_,i) => i+1).find(i => !used.has(i));
        m.newest=id;
        t.add({_id:id,...answers});
        setTimeout(() => {
          if (m.newest !==id) return;
          m.newest=null;
          if (current() === m) document.querySelector(`#table tr[data-row="${id}"]`)?.classList.remove('new-row');
        },1400);
        revealCell($(`cell-${id}-${m.columns[0].key}`));
        hint(m.rows.length >=40 ? `Row ${id} added. The table is full. Tap a cell to edit it, or a column name to chart it.`
          : `Row ${id} added. Tap Add my row for the next student.`);
        const tap=lastTap;
        V.say(L.rows[id-1],{maxAge:3000,valid:() => lastTap === tap && !state.overlay,hint:false,now:true});
        if (was === 2) {
          hint('Now the computer can count. Tap a column name and pick a chart.');
          V.how('counted',{valid:() => current().rows.length >=3 && !state.overlay,hint:false});
        }
      }
      Curio.yes();
    },true);
    done.disabled=!valid();
    if (!V.heard('entry')) V.how('entry',{valid:() => state.overlay === 'entry',hint:false,now:true});
    hint('Tap one answer for each column. Done lights up when every answer is ready.');
    focusInCard(fields.querySelector('button,input'));
  }
  function columnShelf() {
    if (current().columns.length >=6) return;
    openCard('Choose a column','shelf');
    const grid=document.createElement('div');
    grid.id='shelf';
    shelf.forEach(c => {
      const b=document.createElement('button');
      b.id='shelf-'+c.key;
      b.className='shelf-card';
      b.innerHTML=picture(c.choices?.find(v => images[v]),c)+`<span>${esc(c.name)}<small>${kindName(c)}</small></span>`;
      b.disabled=current().columns.some(x => x.key === c.key);
      b.onclick=() => addColumn(clone(c));
      grid.appendChild(b);
    });
    $('overlay-content').appendChild(grid);
    actionButton('make-column','Make my own column',customColumn,true);
    hint('Tap a ready column, or Make my own column.');
    focusInCard(grid.querySelector('button:not(:disabled)'));
  }
  function customColumn() {
    openCard('Make my own column','custom');
    $('overlay-content').innerHTML=`<div class="custom-form">
      <label>Column name, up to 24 characters<input id="custom-name" maxlength="24" autocomplete="off" aria-label="Column name"></label>
      <label>Kind<select id="custom-kind"><option value="list">☷ List</option><option value="number"># Number</option>
        <option value="yesno">✓ Yes/No</option></select></label>
      <p class="privacy">Answers come from buttons, so the computer can count them exactly.</p>
      <div id="custom-details"></div><p class="error" id="custom-error" role="status"></p></div>`;
    const fields=() => {
      const kind=$('custom-kind').value;
      $('custom-details').innerHTML=kind === 'number'
        ? '<div class="custom-choices"><label>Smallest<input type="number" id="custom-min" min="0" max="100" value="0"></label>'
          +'<label>Biggest<input type="number" id="custom-max" min="0" max="100" value="100"></label></div>'
        : kind === 'yesno' ? '<p>Answers: ✓ Yes and × No</p>'
        : '<div class="custom-choices" id="custom-choices"><input aria-label="Choice 1" maxlength="14">'
          +'<input aria-label="Choice 2" maxlength="14"></div><button id="add-choice">Add a choice</button>';
      if ($('add-choice')) $('add-choice').onclick=() => {
        const n=$('custom-choices').children.length;
        if (n >=6) return;
        const input=document.createElement('input');
        input.maxLength=14;
        input.setAttribute('aria-label','Choice '+(n+1));
        $('custom-choices').appendChild(input);
        $('add-choice').setAttribute('aria-disabled',n+1 ===6);
        $('add-choice').hidden=n+1 ===6;
        focusInCard(input);
      };
    };
    $('custom-kind').onchange=fields;
    fields();
    actionButton('custom-back','Back to shelf',columnShelf);
    actionButton('save-column','Save column',() => {
      const name=$('custom-name').value.trim(),kind=$('custom-kind').value;
      const c={key:'custom-'+Date.now().toString(36)+'-'+(++keySerial),name,kind,custom:true};
      let error='';
      if (!name) error='Give the column a name.';
      else if (current().columns.some(c => c.name.toLowerCase() === name.toLowerCase())) error='That column name is already in the table.';
      if (kind === 'number') {
        c.min=$('custom-min').value === '' ? NaN : Number($('custom-min').value);
        c.max=$('custom-max').value === '' ? NaN : Number($('custom-max').value);
        if (![c.min,c.max].every(Number.isInteger) || c.min<0 || c.max>100 || c.min>c.max) error='Use whole-number limits from 0 to 100, smallest first.';
      } else {
        c.choices=kind === 'yesno' ? ['Yes','No'] : [...$('custom-choices').children].map(el => el.value.trim()).filter(Boolean);
        if (c.choices.length<1) error='Add at least one choice.';
        if (new Set(c.choices.map(v => v.toLowerCase())).size !== c.choices.length) error='Give each choice a different name.';
      }
      if (error) { $('custom-error').textContent=error; return; }
      addColumn(c);
    },true);
    hint('Name the column, choose its kind, then tap Save column.');
    focusInCard($('custom-name'));
  }
  function addColumn(c) {
    const m=current();
    if (m.columns.length >=6) return;
    if (m.rows.length) { backfillColumn(c); return; }
    commitColumn(c,[]);
  }
  function commitColumn(c,values) {
    const m=current();
    m.columns.push(c);
    m.rows.forEach((r,i) => r[c.key]=values[i]);
    m.selected=c.key;
    m.reveals={};
    m.inspected={};
    closeCard();
    attachTable();
    persist();
    updateBuild();
    updateSplit();
    renderChart();
    renderQuestions();
    if (m.columns.length <6) how('kinds',() => current().columns.length >0 && current().columns.length <6 && !state.overlay,'#add-row');
    else hint('Six columns are ready. Tap Add my row.');
  }
  function backfillColumn(c) {
    const m=current(),values=[];
    let i=0;
    function next() {
      openCard(`${c.name}: Row ${m.rows[i]._id}`,'backfill');
      const label=document.createElement('p');
      label.className='privacy';
      label.textContent=`New column: answer for each existing row. ${i+1} of ${m.rows.length}. Cancel keeps the table as it was.`;
      $('overlay-content').appendChild(label);
      let value=null;
      if (c.kind === 'number') $('overlay-content').appendChild(numberControl('backfill-number',null,c.min,c.max,v => {
        value=v;
        $('backfill-next').disabled=!validValue(c,v);
      }));
      else {
        const choices=document.createElement('div');
        choices.className='answer-buttons';
        choices.style.setProperty('--choice-count',c.choices.length);
        c.choices.forEach(v => {
          const b=document.createElement('button');
          b.innerHTML=picture(v,c)+esc(v);
          b.onclick=() => {
            value=v;
            [...choices.children].forEach(el => el.setAttribute('aria-pressed',el === b));
            $('backfill-next').disabled=false;
            ping();
          };
          choices.appendChild(b);
        });
        $('overlay-content').appendChild(choices);
      }
      actionButton('backfill-cancel','Cancel',closeCard);
      actionButton('backfill-next',i === m.rows.length-1 ? 'Save column' : 'Next row',() => {
        if (!validValue(c,value)) return;
        values.push(value);
        i++;
        if (i === m.rows.length) commitColumn(c,values);
        else next();
      },true).disabled=true;
      hint('Answer for the row named on the card, then tap Next row or Save column.');
      focusInCard($('overlay-content').querySelector('button,input'));
    }
    next();
  }
  function removeColumn(key) {
    const m=current();
    m.columns=m.columns.filter(c => c.key !==key);
    m.rows.forEach(r => delete r[key]);
    if (!m.columns.length) m.rows=[];
    if (m.selected === key) m.selected=m.columns[0]?.key || '';
    if (m.split === key) m.split='';
    if (m.sort?.key === key) m.sort=null;
    if (m.ownColumn === key) m.ownColumn='';
    m.card=0;
    m.reveals={};
    m.guesses={};
    m.inspected={};
    closeCard();
    attachTable();
    persist();
    updateBuild();
    updateSplit();
    renderChart();
    renderQuestions();
  }
  function updateBuild() {
    const m=current();
    $('build').hidden=state.mode !== 'ours';
    $('add-column').disabled=m.columns.length >=6;
    $('add-row').disabled=!m.columns.length || m.rows.length >=40;
    $('add-row').textContent=m.rows.length >=40 ? '40 rows, table full' : '＋ Add my row';
    $('clear').disabled=!m.columns.length && !m.rows.length;
    if (document.activeElement === $('add-column') && $('add-column').disabled) $('add-row').focus({preventScroll:true});
    if (document.activeElement === $('add-row') && $('add-row').disabled) $('m-ours').focus({preventScroll:true});
  }
  function setMode(mode,refresh=false) {
    if (!['sample','ours'].includes(mode)) return;
    if (state.mode === mode && t && !refresh) {
      if (state.overlay) closeCard();
      return;
    }
    V.hush();
    if (state.overlay) closeCard();
    state.mode=mode;
    document.body.classList.toggle('ours',mode === 'ours');
    $('m-sample').setAttribute('aria-pressed',mode === 'sample');
    $('m-ours').setAttribute('aria-pressed',mode === 'ours');
    attachTable();
    updateBuild();
    updateSplit();
    renderChart();
    renderQuestions();
    hint(mode === 'sample' ? 'w-sample' : collectionHint());
    V.welcome();
  }
  $('m-sample').onclick=() => setMode('sample');
  $('m-ours').onclick=() => setMode('ours');
  for (const kind of ['bar','dot','list']) $('chart-'+kind).onclick=() => {
    current().chart=kind;
    inspectIfReady();
    dropMoment();
    ping();
    renderChart();
    renderQuestions();
    guideChart();
  };
  $('split').onchange=() => {
    current().split=$('split').value;
    inspectIfReady();
    dropMoment();
    ping();
    renderChart();
    renderQuestions();
    if (current().split && chartVisible()) how('split',() => !!current().split && !state.overlay && chartVisible());
    else if (current().split) hint('Choose a guess, then tap Show me to compare the groups.');
    else hint('Tap a column or chart button to explore the whole class.');
  };
  $('add-column').onclick=columnShelf;
  $('add-row').onclick=() => entryCard();
  $('overlay-close').onclick=closeCard;
  $('clear').onclick=() => confirmCard('Erase every column and row on this device?',() => {
    closeCard();
    state.ours=makeMode([],[]);
    try { localStorage.removeItem('dtb-our-class'); } catch {}
    setMode('ours',true);
    $('save-status').textContent='Class table erased from this device.';
  });
  document.addEventListener('pointerdown',() => { lastTap++; },true);
  document.addEventListener('keydown',e => {
    lastTap++;
    if (e.key === 'Escape' && state.overlay) { e.preventDefault(); closeCard(); }
    if (e.key === 'Tab' && state.overlay) {
      const controls=[...$('overlay').querySelectorAll('button,input,select,textarea'),$('read'),$('sound'),$('motion')]
        .filter(el => !el.disabled && el.offsetParent);
      const at=controls.indexOf(document.activeElement);
      const next=controls[(at+(e.shiftKey ? -1 : 1)+controls.length)%controls.length];
      e.preventDefault();
      if ($('overlay-content').contains(next)) focusInCard(next);
      else next.focus({preventScroll:true});
    }
  },true);
  let resizeFrame=0;
  const observer=new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame=requestAnimationFrame(() => {
      if (state.overlay) document.body.style.setProperty('--card-top',($('top').getBoundingClientRect().bottom+6)+'px');
      renderChart();
    });
  });
  observer.observe($('chart-viewport'));
  Curio.onMotion(() => { if (t) renderChart(); });
  load();
  Curio.init({clips:"voice:*",rate:.9});
  setMode('sample');
  window.__tool={state,setMode,V,allLines:V.allLines,vlog:V.log,get vq() { return V.queue; },
    get table() { return t; },get charts() { return charts; },summary,selectColumn,renderChart,questions};
})();
</script>
</body>
</html>
