<title>Comeback Club · Practice, mistakes and goals · Curio Class</title>
<meta name="description" content="Train Bix, a little brain buddy, on real puzzles. A not-yet that you come back from with a strategy is worth more than a first-try win, and goals you pick open new rooms. Grades 3-5 social and emotional learning. Works offline.">
<!--
Comeback Club (Curio Class)
Grades 3-5, Social and Emotional Learning, module Growth Mindset and Goals. Standard: CASEL Self-Management (setting
personal goals, self-motivation, planning).
Students on laptops, or the teacher on a projector with the class voting. Modes: Gym (five puzzle rooms: Pattern Ladder,
Memory Mirror, Light Mat, Number Lift, Summit Circuit), Goals (pick one goal and a plan), Locker (Bix, stickers, stripes
and six Coach's corner cards).
The one idea: Bix's Know-how never goes down. A comeback (a solve after a not-yet or "I'm stuck") is worth 3, plus 1 if a
strategy card was used first, and adds a gold stripe; a first-try solve is worth 1; points come only on a puzzle's
first solve, so replays are free practice.
Facts: CASEL framework; Dweck (2006, 2015); Sisk et al. (2018) and Yeager et al. (2019) for why the tool only says
"practice helps"; APA "Building your resilience"; CDC "Coping with Stress". Light Mat starts checked by brute force over
all 512 press sets (unique solutions, Anderson and Feil 1998); Number Lift fewest moves by breadth-first search
(2026-10-26). Art (2026-10-26): Bix (six faces, painted pale and tinted per color) and Dot are gpt-image-2 paintings;
the gym hall is FLUX.1-schnell; the door, padlock, climbing wall, sneakers, gym bag, medal, five rooms, cork and locker
room are FLUX.2 klein. The headband and stripes, puzzles, labels, cards and stickers are drawn in code.
Saving happens only when Save Bix is pressed (localStorage curio-comeback-club); nothing is ever typed.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->

main{grid-template-columns:minmax(0,1fr) 360px;min-height:0}

/* panel */
.panel{gap:10px}
.hint{margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.btn{min-height:52px;min-width:44px;padding:0 12px;border-radius:14px;border:2px solid var(--btn-line);background:#fff;color:var(--ink);
  font-weight:700;font-size:16px;line-height:1.15}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.gold{background:var(--gold);border-color:#d9a400;color:var(--ink)}
.btn[aria-expanded="true"]{background:#efe8fb}

.rungs{display:flex;gap:4px;flex-wrap:wrap;margin:0;padding:0;list-style:none}

.meter{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:14px}

.stname{font-weight:800;color:var(--brand)}
.bar{height:14px;border-radius:7px;background:var(--off);margin:5px 0;overflow:hidden;border:1px solid #cfc6e3}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a52dc,var(--brand));border-radius:7px;transition:width .5s}
.small{font-size:13px;color:var(--muted)}
.stripes b{color:var(--ink)}

body.compact .sw{min-height:46px;font-size:11.5px}

.confirm{background:#fff7e6;border:2px solid #e6b450;border-radius:12px;padding:8px 10px}
.confirm p{margin:0 0 6px;font-weight:600}
/* tray: strategy cards, breathing, Ask a friend, Room complete, reflection, plan */
.tray{position:absolute;left:0;right:0;bottom:0;background:#fffdfa;border-top:3px solid var(--brand);box-shadow:0 -6px 18px #2a234026;
  padding:6px 8px 8px;z-index:2;animation:slideup .28s ease-out}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.tray-h{display:flex;align-items:center;gap:6px;margin:0 0 6px;flex-wrap:wrap}
.tray-h h2{flex:1 1 auto;margin:0;font:800 17px/1.2 'Trebuchet MS','Segoe UI',sans-serif;min-width:8em}
.tray-h .btn{min-height:44px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px}
.card{position:relative;min-height:52px;display:flex;align-items:center;gap:6px;border:2px solid var(--btn-line);border-radius:12px;background:#fff;

.card svg{flex:none;width:28px;height:28px}

/* scene */
.tg{cursor:pointer;outline:none}
.tg .ring{fill:none;stroke:transparent;stroke-width:4}
.tg .halo{fill:none;stroke:transparent;stroke-width:8}
.tg:focus-visible .ring{stroke:var(--focus)}
.tg:focus-visible .halo{stroke:var(--ink)}
.tg[aria-disabled="true"]{cursor:default}
.deco{pointer-events:none}
.bxw{transform-box:fill-box;transform-origin:50% 100%}
.a-hop{animation:hop .7s ease-out}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-34px)}70%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.a-jacks{animation:jbounce .5s ease-in-out 3}
@keyframes jbounce{0%,100%{transform:none}50%{transform:translateY(-16px)}}
.a-jacks .armsd{animation:jdown .5s steps(1) 3}
.a-jacks .armsu{animation:jup .5s steps(1) 3}
@keyframes jdown{0%{opacity:1}25%{opacity:0}75%{opacity:1}}
@keyframes jup{0%{opacity:0}25%{opacity:1}75%{opacity:0}}
.a-spin{animation:spin .9s ease-in-out;transform-origin:50% 50%}
@keyframes spin{0%{transform:none}25%{transform:scaleX(.08)}50%{transform:scaleX(-1)}75%{transform:scaleX(-.08)}100%{transform:none}}
.balls{opacity:0}
.a-juggle .balls{opacity:1;animation:fadeout 2.4s steps(1)}
@keyframes fadeout{0%{opacity:1}100%{opacity:0}}
.a-juggle .ball{animation:jug .8s linear 3}
.a-juggle .ball.b2{animation-delay:-.27s}
.a-juggle .ball.b3{animation-delay:-.53s}
@keyframes jug{0%{transform:translate(-108px,-168px)}25%{transform:translate(-56px,-250px)}50%{transform:translate(0px,-280px)}75%{transform:translate(56px,-250px)}100%{transform:translate(108px,-168px)}}
.a-fadein{animation:fadein .26s ease-out both}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
.a-fadeout{animation:fadeout2 .26s ease-out both}
@keyframes fadeout2{0%{opacity:1}100%{opacity:0}}
.a-cart{animation:cart 1.3s ease-in-out;transform-origin:50% 50%}
@keyframes cart{0%{transform:none}50%{transform:translateX(60px) rotate(180deg)}100%{transform:translateX(0) rotate(360deg)}}
.a-jump{animation:bigjump .9s ease-out}
@keyframes bigjump{0%,100%{transform:none}35%{transform:translateY(-60px) scale(1.05)}65%{transform:translateY(0) scaleY(.94)}80%{transform:none}}
.a-breathe{animation:breathe 8s ease-in-out 3;transform-origin:50% 70%}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.1)}}
.a-glow{animation:glow 2s ease-out}
@keyframes glow{0%{opacity:0}20%{opacity:1}80%{opacity:.9}100%{opacity:0}}
.glowc{opacity:0}
.a-drop{animation:drop .7s cubic-bezier(.3,1.5,.6,1)}
@keyframes drop{0%{transform:translateY(-90px);opacity:0}30%{opacity:1}100%{transform:none}}
.a-slide{animation:slidein .8s ease-out}
@keyframes slidein{0%{transform:translateX(50px);opacity:0}100%{transform:none;opacity:1}}
.a-rattle{animation:rattle .5s ease-in-out;transform-box:fill-box;transform-origin:50% 0%}
@keyframes rattle{0%,100%{transform:none}20%{transform:rotate(3deg)}40%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}80%{transform:rotate(-1deg)}}
.a-pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.a-flip{animation:flip .35s ease-out;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flip{0%{transform:scaleX(.05)}100%{transform:none}}
.a-pop{animation:pop .35s ease-out;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 3.2s linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}

  function hintText(p) {

  }
  function giveHint(fromFriend) {
    const me = P, v = here(me);
    me.hintUsed = true;
    if (me.kind === 'memory') { me.glow = me.seq[me.pos]; setTimeout(() => { if (P === me) { me.glow = -1; render(); } }, 1400); }
    else if (me.kind === 'light') { const sol = lightSolution(me.st); me.glow = sol.length ? sol[0] : -1; }
    else if (me.kind === 'lift') { let p = liftPath(me.floor, me.d); if (!p && !me.busy) { resetPuzzle(me); p = liftPath(0, me.d); } me.glow = p && p.length ? p[0].bi : -1; }
    const t = hintText(me);

    if (fromFriend) me.friend = t;
    narrate(t, {valid: v});
  }
  function startBreath() {

    setHint(CARD.breath.line);
    anim('bix', 'a-breathe', 3000 + 24000); anims.bix.t0 = now() + 3000;   // the 8 s breath cycle starts after the intro
    const step = i => {
      if (BR !== me) return;
      if (i >= 6) { endBreath(true); return; }
      me.phase = i;
      const t = i % 2 ? L.bOut : L.bIn;
      setHint(t); trayBreath();
      narrate(t, {valid: () => BR === me && me.phase === i});

  }
  function endBreath(finished, quiet) {
    const me = BR; if (!me) return;

  // ======================================================================================

  const goalShown = g => !g.room || S.open[g.room];
  function pickGoal(id) {
    if (S.goal) { if (S.goal === id) { openTray('plan'); setHint(H.goals2); } render(); return; }
    S.goal = id; S.plan = null; S.G = freshG();
    Curio.tone(600, .15, .04);
    openTray('plan'); setHint(H.goals2);
    panel(); render();
  }
  function pickPlan(id) {
    S.plan = id; closeTray(); setHint(H.goalsSet); Curio.yes();

    panel(); render();

  function changeGoal() { S.goal = null; S.plan = null; S.G = freshG(); closeTray(); setHint(H.goals1); panel(); render(); }
  function goalCheck() {
    if (!S.goal || BR) return;       // a breathing card finishes first

    if (!g.done(S.G)) { meter(); return; }
    S.goalsDone.push(g.id); S.goal = null; S.plan = null;
    const next = UNLOCK.find(r => !S.open[r]);
    if (next) { S.open[next] = true; S.newRoom = next; }
    addKH(5);
    if (P) { P.face = 'cheer'; }

    Curio.yes();
    narrate(next ? L.goalDone : L.goalDone2);

    if (state.tray && state.tray !== 'reflect') state.pendRef = true;   // cards, a friend or Room complete stay up; the reflection follows when it closes

  }
  function reflect(id) {

  }

  // ======================================================================================

  function trayBreath() {

  }
  tray.addEventListener('click', e => {

  // ======================================================================================

  const LAY = {};

  // ---------- Gym map ----------

    // the floor, drawn over the backdrop so doors and Bix stand on it
    s += `<rect x="0" y="${floorY}" width="${w}" height="${h - floorY}" fill="#e8c38e" opacity=".6"/><g stroke="#c99a63" stroke-width="1.5" opacity=".5">` +
      [...Array(6).keys()].map(i => `<path d="M0 ${f1(floorY + (h - floorY) * (i + 1) / 7)} H${w}"/>`).join('') + `</g><rect x="0" y="${floorY - 3}" width="${w}" height="6" fill="#c99a63"/>`;
    // five doors: four on the floor, the Summit door on top of a short climbing wall

      const base = isSum ? floorY - wallH : floorY, x = cx - dw / 2, y = base - dh;
      if (isSum) {   // the painted climbing wall, cropped to the wall box

      }

        d += `<use class="deco" href="#im-padlock" transform="translate(${f1(cx - lk * .42)} ${f1(ly - lk * .62)}) scale(${(lk * .84 / 85).toFixed(4)})"/>` +
          `<text x="${f1(cx)}" y="${f1(y + dh - 8)}" font-size="${f1(Math.max(11, fs * .92))}" text-anchor="middle" font-weight="800" fill="#2a2340" paint-order="stroke" stroke="#fff" stroke-width="3">Locked</text>`;
      } else if (S.newRoom === room) {

  }
  function bannerAt(cx, y, fs) {
    const t = state.banner.text, w = t.length * fs * .6 + 28;

      `<text x="${f1(cx)}" y="${f1(y + 1)}" font-size="${f1(fs)}" text-anchor="middle" fill="#fff" class="tt">${esc(t)}</text></g>`;
  }
  // ---------- Rooms ----------
  function roomScene() {
    const w = W, h = Hh;
    // the room's painting (Summit rungs use the summit room), under a paper wash so the puzzle reads
    let s = cover('room-' + P.room, 1024, 640, 0, 0, w, h, .5, 1) + `<rect width="${w}" height="${h}" fill="#fbf7ff" opacity=".55"/>`;
    s += `<rect x="0" y="${h - 18}" width="${w}" height="18" fill="#e8c38e"/><rect x="0" y="${h - 19}" width="${w}" height="3" fill="#c99a63"/>`;
    // Bix in the lower left: reserve a strip at the side or at the bottom, whichever leaves the puzzle bigger
    const pad = 10, bh = clamp(Math.min(h * .3, w * .3), 64, 190), bw = bh * .95;   // the painted Bix with its bag is about .9 bh wide

      `<text x="${pad + 4 + R.name.length * tfs * .58 + 10}" y="${f1(pad + tfs)}" font-size="${f1(tfs * .85)}" fill="#5f5878" font-weight="600">Rung ${P.rung + 1} of ${R.n}</text>`;
    if (lay.status) s += `<text x="${f1(w - pad - 4)}" y="${f1(pad + tfs)}" font-size="${f1(tfs * .85)}" text-anchor="end" font-weight="700" fill="#2a2340">${esc(lay.status)}</text>`;
    s += lay.draw();
    // Bix and, when asked, Dot with a friend's idea
    const bxX = pad + bh * .49, bxY = h - 20;

    if (P.friend) {
      const dh = bh * .5, dx = bxX + bw * .62, bwid = clamp(usedSide ? lay.box.w * .55 : w * .5, 150, 320), bfs = clamp(bwid / 19, 11, 16);
      s += dot(dx, bxY, dh);
      const ln = wrap(P.friend, bwid - 20, bfs), bhh = ln.length * bfs * 1.25 + 16;

    return s;
  }
  // each layout returns {score, draw, status}; score = the size of its smallest target
  function patLayout(A) {
    const p = P, d = p.d, n = d.seq.length + 1;
    const gapF = .2, size = Math.min((A.w - 8) / (n + (n - 1) * gapF), A.h * .3, 140);
    const labelsH = (d.j || d.sums) ? clamp(size * .34, 13, 22) + (d.cap ? clamp(size * .3, 13, 20) : 0) : 0, brH = d.br ? 14 : 0;
    const chH = clamp(Math.min(A.h * .36, size * 1.25), 60, 130), chGap = 10;
    const chW = Math.min((A.w - 3 * chGap) / 4, 190);
    const total = brH + size + labelsH + 18 + chH;
    const y0 = A.y + Math.max(0, (A.h - total) / 2) + brH;
    const score = Math.min(size * 1.4, chH, chW);
    return {score, box: A, draw: () => {
      let s = '';
      const g = size * gapF, rowW = n * size + (n - 1) * g, x0 = A.x + (A.w - rowW) / 2;
      const cx = i => x0 + i * (size + g) + size / 2, cy = y0 + size / 2;
      // brackets around each repeat (parts)
      if (p.parts && d.br) for (let i = 0; i < n; i += d.br) {
        const a = cx(i) - size / 2, b = cx(Math.min(n - 1, i + d.br - 1)) + size / 2;
        s += `<path class="deco" d="M${f1(a)} ${f1(y0 - 2)} v-8 H${f1(b)} v8" fill="none" stroke="#5a2fb8" stroke-width="3" stroke-linejoin="round"/>`;
      }
      d.seq.forEach((it, i) => {
        const lit = p.lit === i;
        s += `<rect x="${f1(cx(i) - size / 2)}" y="${f1(y0)}" width="${f1(size)}" height="${f1(size)}" rx="${f1(size * .16)}" fill="${lit ? '#fff4c2' : '#fff'}" stroke="${lit ? '#d9a400' : '#cfc6e3'}" stroke-width="${lit ? 5 : 2}"/>` + item(it, cx(i), cy, size);
      });
      const qi = n - 1;
      s += p.solved ? `<rect x="${f1(cx(qi) - size / 2)}" y="${f1(y0)}" width="${f1(size)}" height="${f1(size)}" rx="${f1(size * .16)}" fill="#eafbe9" stroke="#2e8b57" stroke-width="3"/>` + item(d.ans, cx(qi), cy, size)
        : `<rect x="${f1(cx(qi) - size / 2)}" y="${f1(y0)}" width="${f1(size)}" height="${f1(size)}" rx="${f1(size * .16)}" fill="#f3edfd" stroke="#5a2fb8" stroke-width="3" stroke-dasharray="7 5"/>` +
          `<text x="${f1(cx(qi))}" y="${f1(cy + size * .2)}" font-size="${f1(size * .55)}" text-anchor="middle" class="tt" fill="#5a2fb8">?</text>`;
      // jump labels (parts)
      const ly = y0 + size + clamp(size * .3, 12, 20), lfs = clamp(size * .26, 11, 18);
      if (p.parts && d.j) {
        d.j.forEach((t, i) => { s += `<text class="deco" x="${f1((cx(i) + cx(i + 1)) / 2)}" y="${f1(ly)}" font-size="${f1(t.length > 3 ? Math.max(11, lfs * .8) : lfs)}" text-anchor="middle" font-weight="800" fill="#5a2fb8">${esc(t)}</text>`; });
        s += `<text class="deco" x="${f1((cx(n - 2) + cx(n - 1)) / 2)}" y="${f1(ly)}" font-size="${f1(lfs)}" text-anchor="middle" font-weight="800" fill="#5f5878">?</text>`;
      }
      if (p.parts && d.sums) {
        d.sums.forEach((t, i) => { s += `<text class="deco" x="${f1(cx(i + 2))}" y="${f1(ly)}" font-size="${f1(Math.max(11, lfs * .85))}" text-anchor="middle" font-weight="800" fill="#5a2fb8">${esc(t)}</text>`; });
        s += `<text class="deco" x="${f1(A.x + A.w / 2)}" y="${f1(ly + lfs * 1.15)}" font-size="${f1(Math.max(11, lfs * .8))}" text-anchor="middle" font-weight="700" fill="#5a2fb8">${esc(d.cap)}</text>`;
      }
      // the four choices

    if (p !== page) { page = p; for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p); }
    const st = $('stage');
    if (page === 'stack') {
      const w = st.getBoundingClientRect().width || innerWidth, hh = document.querySelector('header').offsetHeight;
      const ctl = state.mode === 'gym' && state.view === 'room' ? 172 : state.mode === 'locker' ? 150 : 90;
      const th0 = tray.hidden ? 0 : tray.offsetHeight;   // the tray sits inside the stage: grow the stage so it never covers the puzzle
      st.style.height = Math.round(clamp(innerHeight - hh - ctl - th0, 300, Math.max(360, w * 1.5)) + th0) + 'px';
    } else st.style.height = '';
    const r = st.getBoundingClientRect(), th = tray.hidden ? 0 : tray.offsetHeight;
    const key = state.mode + ':' + Math.round(r.width) + 'x' + Math.round(r.height) + ':' + th;
    if (key === lastSize && !force) return;
    lastSize = key;
    W = Math.max(280, Math.round(r.width)); Hh = Math.max(200, Math.round(r.height - th));
    sv.setAttribute('width', W); sv.setAttribute('height', Hh); sv.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
    render();
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  new ResizeObserver(() => relayout()).observe(tray);
  addEventListener('resize', () => relayout());

  // keys: 1 to 3 switch modes; Escape closes the strategy cards
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= '1' && e.key <= '3') { const m = MODES[+e.key - 1]; if (state.mode !== m || state.view === 'room') setMode(m); }
    else if (e.key === 'Escape' && (state.tray === 'cards' || state.tray === 'friend' || state.tray === 'plan')) { closeTray(); $(state.mode === 'goals' ? 'm-goals' : 'stuck').focus(); }
  });

  Curio.onSound(on => { if (!on) hush(); else if (tapped) narrate(WELCOME(), {key: 'w-' + state.mode}); });
  Curio.onMotion(reduce => { if (reduce) { for (const k in anims) delete anims[k]; $('fx').textContent = ''; } render(); });
  Curio.init({clips: "voice:*", rate: .95, readFallback: () => $('hint').textContent});
  $('read').onclick = readNow;

  // every line the tool can say (scripts/voice.py records them)
  function allLines() {
    const out = [L.wGym, L.wBack, L.wGoals, L.wLocker, ...Object.values(ROOMLINE), ...NOTYET, ...FIRST, ...COMEBACK, L.stageUp, L.goalDone, L.goalDone2, L.summit,
      ...TAPBIX, L.locked, ...CARDS.map(c => c.line), L.bIn, L.bOut, L.bReady, ...Object.values(H),
      ...Object.values(TIPS).flatMap(t => [t.new, t.slow, t.parts]), TIPS.pattern.br, ...PAT.map(d => d.hint), SUMMIT_PAT.hint,
      ...PADS.map(p => 'Next is the ' + p.name + '.'), ...FACTS.map((f, i) => factLine(i))];
    return [...new Set(out)];
  }

  // for checking frames
  window.__tool = {state, setMode, allLines, get S() { return S; }, get P() { return P; }, get BR() { return BR; }, said, queued, log,
    enterRoom, startRung, leaveRoom, useCard, lightSolution, liftPath, stageOf, GOALS, PAT, LIGHT, LIFT,
    hint: () => $('hint').textContent, layout: () => ({page, W, H: Hh}), curio: () => ({last: Curio.last, sound: Curio.sound, reduce: Curio.reduce}),
    setS(o) { Object.assign(S, o); panel(); render(); }, render};
  state.welcomeBack = loadSave();
  setMode('gym');
})();
</script>
</body>
