SOUND ELEVATOR (Curio Class)
Grades K-2 music, National Core Arts Standards MU:Re7 (perceive and describe music: high and low pitch, loud
and soft dynamics, melodic direction).
Teacher-led on a projector. Eight floors are the eight notes of a C major scale (do re mi fa sol la ti do).
Ride (tap a floor; the elevator sings each floor it passes), High or low? (two notes behind closed doors: was the

<style>
:root{
  --paper:#f5f3ff;--ink:#232036;--muted:#5d5878;--line:#dcd7f2;--focus:#e0662a;--brand:#3d4fa8;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--brand);color:#f3f4ff}
h1{margin:0 auto 0 0;font:800 clamp(22px,3vw,32px)/1.1 'Trebuchet MS','Segoe UI',sans-serif}
h1 small{display:block;font:500 15px/1.3 'Segoe UI',sans-serif;color:#d0d6ff}
.seg{display:inline-flex;border:2px solid #7383d0;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#4c5fbf;color:#f3f4ff;min-height:52px;padding:0 14px;font-weight:700;font-size:16px}
.seg button[aria-pressed="true"]{background:#ffd34d;color:#3a2c00}
.icon-btn{border:2px solid #7383d0;background:#4c5fbf;color:#f3f4ff;border-radius:999px;min-height:52px;padding:0 16px;font-weight:700;font-size:16px}

main{display:grid;grid-template-columns:1fr;min-height:0}
@media (min-width:760px){main{grid-template-columns:minmax(0,1fr) 330px}}
.stage{position:relative;overflow:hidden;min-height:340px;background:linear-gradient(#7fb7ff,#cfe4ff 70%,#e9f2ff)}
.scene{position:absolute;left:50%;top:50%;width:1000px;height:620px;transform:translate(-50%,-50%) scale(var(--s,1))}

/* the building */
.bldg{position:absolute;left:250px;top:14px;width:330px;height:600px;background:#f2e3c9;border:6px solid #4a3b2a;border-bottom:0;border-radius:18px 18px 0 0;box-shadow:inset -18px 0 0 #e3cfac}
.roof{position:absolute;left:236px;top:0;width:358px;height:24px;background:#b0503a;border-radius:10px;border:5px solid #4a3b2a}
.floor{position:absolute;left:0;right:0;height:72px;border-top:4px solid #d8c29c}
.floor .lab{position:absolute;left:-210px;top:12px;width:190px;height:48px;border-radius:24px;display:flex;align-items:center;gap:10px;padding:0 14px;font:800 24px 'Trebuchet MS',sans-serif;color:#fff;background:var(--c);box-shadow:0 4px 0 #0003;transition:transform .2s}
.floor .lab small{font:700 16px 'Segoe UI',sans-serif;opacity:.9;margin-left:auto}
.floor.lit .lab{transform:scale(1.08)}
.floor .win{position:absolute;right:22px;top:14px;width:56px;height:44px;border-radius:8px;background:#9ccbe8;border:4px solid #4a3b2a}
.shaft{position:absolute;left:28px;top:0;bottom:0;width:150px;background:repeating-linear-gradient(#5b5d6e 0 4px,#6c6e80 4px 72px);border-left:5px solid #3a3b48;border-right:5px solid #3a3b48}
.car{position:absolute;left:30px;width:146px;height:68px;transition:none}
.car .box{position:absolute;inset:0;border-radius:10px;background:linear-gradient(#ffd34d,#f2b705);border:5px solid #4a3b2a;overflow:hidden;box-shadow:0 0 calc(var(--glow,0) * 60px) calc(var(--glow,0) * 22px) rgba(255,214,77,calc(var(--glow,0)))}
.car img{position:absolute;left:38px;bottom:0;height:62px;width:70px;object-fit:contain;object-position:50% 100%}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#9aa0b5,#c9cddb);border:3px solid #4a3b2a;transition:transform .6s}
.door.l{left:0}.door.r{right:0}
.car.open .door.l{transform:translateX(-100%)}.car.open .door.r{transform:translateX(100%)}
.waves{position:absolute;left:180px;top:50%;transform:translateY(-50%);pointer-events:none}

/* the panel of buttons */
.panelbox{position:absolute;left:620px;top:30px;width:350px;background:#3a3b48;border-radius:26px;padding:16px;box-shadow:0 8px 0 #0003;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{border:5px solid #20212b;border-radius:50%;width:100%;aspect-ratio:1;max-height:84px;max-width:84px;justify-self:center;background:#ececf2;font:900 30px 'Trebuchet MS',sans-serif;color:#20212b;box-shadow:0 5px 0 #0006;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.fb small{font:700 13px 'Segoe UI',sans-serif}
.fb.lit{background:var(--c);color:#fff;box-shadow:0 0 18px var(--c),0 5px 0 #0006}
.dial{position:absolute;left:620px;top:440px;width:350px;background:#fffdf8;border-radius:22px;padding:12px 18px;box-shadow:0 6px 0 #0002}
.dial label{display:flex;justify-content:space-between;font:800 20px 'Trebuchet MS',sans-serif}
.dial input{width:100%;height:44px;accent-color:#f2b705}
.dial .word{font:900 28px 'Trebuchet MS',sans-serif;text-align:center;color:var(--brand)}

.qcard{position:absolute;left:620px;top:30px;width:350px;min-height:390px;background:#fffdf8;border-radius:26px;padding:18px;box-shadow:0 8px 0 #0002;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.qcard .q{font:800 28px/1.25 'Trebuchet MS',sans-serif;text-align:center}
.qcard .res{font:800 24px/1.3 'Trebuchet MS',sans-serif;text-align:center;color:var(--brand);min-height:62px}
.ans{border:4px solid transparent;border-radius:20px;min-height:84px;font:900 30px 'Trebuchet MS',sans-serif;color:#fff;background:var(--c);box-shadow:0 5px 0 #0003}
.ans span{font-size:36px}
.ans.right{border-color:#2a9d4a;box-shadow:0 0 0 5px #2a9d4a66}
.ans.wrong{opacity:.4}
.contour{width:100%;height:120px}

.panel{background:#fbfaff;border-left:3px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
@media (max-width:759px){.panel{border-left:0;border-top:3px solid var(--line)}}

.big-btn{border:0;border-radius:16px;min-height:60px;font:800 20px/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:#fff;background:var(--brand);box-shadow:0 5px 0 #0004;padding:6px 10px}

  .panel{padding:8px 10px;gap:8px}

  .big-btn{min-height:44px;font-size:16px}
}

<header>
  <h1>Sound Elevator <small>Up is high, down is low.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-ride" aria-pressed="true">Ride</button>
    <button id="m-hl" aria-pressed="false">High or low?</button>
    <button id="m-ls" aria-pressed="false">Loud or soft?</button>
    <button id="m-echo" aria-pressed="false">Echo</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <div class="stage" id="stage">
    <div class="scene" id="scene">
      <div class="roof"></div>
      <div class="bldg" id="bldg"><div class="shaft"></div></div>
      <div class="panelbox" id="buttons" role="group" aria-label="Floors"></div>
      <div class="dial" id="dial">
        <label for="vol"><span>🤫 soft</span><span>loud 📣</span></label>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.55" aria-label="Volume">
        <div class="word" id="vword"></div>
      </div>
      <div class="qcard" id="qcard" hidden></div>
    </div>
  </div>
  <aside class="panel">
    <p class="hint" id="hint"></p>
    <div class="col" id="ctrl"></div>
    <p class="tip" id="tip"></p>
  </aside>
</main>

  // light a floor, glow by volume, draw sound waves
  function light(n, vol) {

    document.querySelectorAll('.fb').forEach(b => b.classList.toggle('lit', +b.dataset.n === n));

      const r = 18 + i * 16;

    await wait(1000); if (me !== state.run) return;
    await travel(q.b, me, .6, false); arrive(q.b, .6);
    $('res').innerHTML = `${right ? 'Yes! ' : ''}Floor ${q.a} to floor ${q.b}: the elevator went <b>${q.b > q.a ? 'up' : 'down'}</b>, so the sound got <b>${q.b > q.a ? 'higher' : 'lower'}</b>.`;
    $('score').textContent = `${state.score} of ${state.tries}`;
    right ? yes() : null;
    say(right ? `Yes! It went ${q.b > q.a ? 'up. Higher' : 'down. Lower'}!` : `It went ${q.b > q.a ? 'up. Higher' : 'down. Lower'}.`);
  }

  // ---------- Loud or soft? ----------
  async function lsRound() {
    const me = ++state.run;
    const loud = Math.random() < .5, n = 1 + Math.random() * 8 | 0, vol = loud ? .85 + Math.random() * .15 : .08 + Math.random() * .12;
    state.q = {loud, n, vol, answered: false};
    showQ('Listen. Is this note <b>loud</b> or <b>soft</b>?', [['loud', '📣 Loud', '#e63946'], ['soft', '🤫 Soft', '#43aa8b']]);
    say('Listen. Is this note loud or soft?');
    car.style.setProperty('--glow', 0); $('waves').replaceChildren();
    await wait(2300); if (me !== state.run) return;
    note(FL[n - 1].f, vol, 1.4);
  }
  function lsAnswer(k) {
    const q = state.q; if (!q || q.answered) return;
    q.answered = true; state.tries++;
    const right = (k === 'loud') === q.loud;
    if (right) state.score++;
    mark(k, q.loud ? 'loud' : 'soft');
    state.at = q.n; setCar(yOf(q.n)); car.classList.add('open');
    arrive(q.n, q.vol);
    $('res').innerHTML = `${right ? 'Yes! ' : ''}It was <b>${q.loud ? 'loud' : 'soft'}</b>. See how ${q.loud ? 'bright' : 'dim'} the elevator glows?`;
    $('score').textContent = `${state.score} of ${state.tries}`;
    right && yes();
    say(right ? `Yes! It was ${q.loud ? 'loud' : 'soft'}.` : `It was ${q.loud ? 'loud' : 'soft'}.`);
  }

  // ---------- Echo: a three-note tune and its shape ----------
  async function echoRound(replay) {
    const me = ++state.run;
    if (!replay) {
      const SH = [[1, 1], [2, -1], [-1, -1], [1, 2], [-2, 1], [2, 2], [-1, 2], [0, 2], [2, -2], [-2, -2], [2, 0]];
      let t;
      do { const st = SH[Math.random() * SH.length | 0], start = 1 + Math.random() * 8 | 0; t = [start, start + st[0], start + st[0] + st[1]]; } while (t.some(n => n < 1 || n > 8));
      state.q = {tune: t, shown: false};
      showQ('Listen to the tune. Then sing it back! Did it go up, down or both?', []);
      $('qcard').insertAdjacentHTML('beforeend', '<svg class="contour" id="contour" viewBox="0 0 320 120" aria-hidden="true"></svg>');
      say('Listen to the tune. Then sing it back!');
      await wait(2400);
      if (me !== state.run) return;
    }
    car.style.visibility = 'hidden';
    for (const n of state.q.tune) { if (me !== state.run) return; note(FL[n - 1].f, .6, .7); await wait(700); }
  }
  async function echoShow() {
    const q = state.q; if (!q) return;
    const me = ++state.run;
    car.style.visibility = 'visible';
    state.at = q.tune[0]; setCar(yOf(q.tune[0])); car.classList.add('open'); arrive(q.tune[0], .6);
    drawContour(1);
    for (let i = 1; i < 3; i++) {
      await wait(700); if (me !== state.run) return;
      if (q.tune[i] !== state.at) await travel(q.tune[i], me, .6, false);
      arrive(q.tune[i], .6); drawContour(i + 1);
    }
    const d = q.tune.slice(1).map((n, i) => Math.sign(n - q.tune[i]));
    const word = d.every(x => x > 0) ? 'up, up' : d.every(x => x < 0) ? 'down, down' : d.map(x => x > 0 ? 'up' : x < 0 ? 'down' : 'the same').join(', then ');
    $('res').innerHTML = `The tune went <b>${word}</b>.<br>Floors ${q.tune.join(', ')}: ${q.tune.map(n => FL[n - 1].sol).join(' ')}`;
    say(`The tune went ${word}.`);
  }
  function drawContour(k) {
    const s = $('contour'); if (!s) return;
    const t = state.q.tune.slice(0, k);
    s.innerHTML = `<polyline points="${t.map((n, i) => `${50 + i * 110},${110 - n * 12}`).join(' ')}" fill="none" stroke="#3d4fa8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>` +
      t.map((n, i) => `<circle cx="${50 + i * 110}" cy="${110 - n * 12}" r="13" fill="${FL[n - 1].c}" stroke="#232036" stroke-width="3"/>`).join('');
  }

  function showQ(q, answers) {
    $('qcard').innerHTML = `<div class="q">${q}</div>${answers.map(([k, t, c]) => `<button class="ans" data-k="${k}" style="--c:${c}">${t}</button>`).join('')}<div class="res" id="res" aria-live="polite"></div>`;
    $('qcard').querySelectorAll('.ans').forEach(b => b.onclick = () => state.mode === 'hl' ? hlAnswer(b.dataset.k) : lsAnswer(b.dataset.k));
  }
  function mark(picked, right) {
    $('qcard').querySelectorAll('.ans').forEach(b => { b.classList.toggle('right', b.dataset.k === right); b.classList.toggle('wrong', b.dataset.k === picked && picked !== right); });
  }

  function setMode(m) {
    state.mode = m; state.run++; stopTalk(); state.score = state.tries = 0;
    for (const [id, k] of [['m-ride', 'ride'], ['m-hl', 'hl'], ['m-ls', 'ls'], ['m-echo', 'echo']]) $(id).setAttribute('aria-pressed', m === k);
    const ride = m === 'ride';
    $('buttons').hidden = $('dial').hidden = !ride; $('qcard').hidden = ride;
    car.style.visibility = 'visible'; car.classList.add('open'); $('tip').innerHTML = '';
    if (ride) {
      $('ctrl').innerHTML = '<button class="big-btn gold" id="scale">🎵 Ride the whole scale</button>';
      $('scale').onclick = async () => { const me = ++state.run; const to = state.at < 5 ? 8 : 1; if (state.at !== to) { await travel(to, me); arrive(to); } };
      $('hint').innerHTML = '<b>Ride.</b> Tap a floor button. The elevator sings each floor it passes. Up is high, down is low. Turn the dial for loud and soft: louder makes the elevator glow brighter.';
      $('vword').textContent = volWord(state.vol);
      say('Going up! Tap a floor.');
    }
    if (m === 'hl') {
      $('ctrl').innerHTML = '<button class="big-btn" id="nq">New pair →</button><div class="score" id="score"></div>';
      $('nq').onclick = hlRound;
      $('hint').innerHTML = '<b>High or low?</b> The doors stay shut. Children show the second note with their hands: up for higher, down for lower. Then tap an answer to see the elevator ride.';
      hlRound();
    }
    if (m === 'ls') {
      $('ctrl').innerHTML = '<button class="big-btn" id="nq">New note →</button><div class="score" id="score"></div>';
      $('nq').onclick = lsRound;
      $('hint').innerHTML = '<b>Loud or soft?</b> Children make a big shape for loud or a tiny shape for soft. Then tap an answer and see the glow.';
      lsRound();
    }
    if (m === 'echo') {
      $('ctrl').innerHTML = '<button class="big-btn gold" id="again">🔁 Hear it again</button><button class="big-btn soft" id="show">👀 Show the shape</button><button class="big-btn" id="nq">New tune →</button>';
      $('again').onclick = () => echoRound(true); $('show').onclick = echoShow; $('nq').onclick = () => echoRound(false);
      $('hint').innerHTML = '<b>Echo.</b> Listen to three notes and sing them back on "loo." Move a hand up or down with the tune. Then show its shape.';
      echoRound(false);
    }
  }
  $('m-ride').onclick = () => setMode('ride');
  $('m-hl').onclick = () => setMode('hl');
  $('m-ls').onclick = () => setMode('ls');
  $('m-echo').onclick = () => setMode('echo');
  addEventListener('keydown', e => {
    if (e.target.closest('button,input')) return;
    if (/^[1-4]$/.test(e.key) && !e.altKey) setMode(['ride', 'hl', 'ls', 'echo'][e.key - 1]);
    if (state.mode === 'ride' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); floorTap(Math.max(1, Math.min(8, state.at + (e.key === 'ArrowUp' ? 1 : -1)))); }
  });

  // ---------- sound and voice ----------
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
    if (!state.sound) stopTalk();
  };
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    const speak = speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      let done = false;
      const go = () => { if (done) return; done = true; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.getVoices();
  }
  const CLIPS = {};
  const SHAPES = ['up, up', 'down, down', 'up, then down', 'down, then up', 'up, then the same', 'down, then the same', 'the same, then up', 'the same, then down'];
  const allLines = () => [...new Set([
    'Going up! Tap a floor.', 'Listen to two notes. Is the second note higher or lower?',
    'Yes! It went up. Higher!', 'Yes! It went down. Lower!', 'It went up. Higher.', 'It went down. Lower.',
    'Listen. Is this note loud or soft?', 'Yes! It was loud.', 'Yes! It was soft.', 'It was loud.', 'It was soft.',
    'Listen to the tune. Then sing it back!', ...SHAPES.map(s => `The tune went ${s}.`)])];
  let talk = 0, clip = null, last = [];
  function stopTalk() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (CLIPS[text]) { clip = new Audio(CLIPS[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = .95; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function say(parts, force) {
    if (!state.sound && !force) return;
    stopTalk();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(150); }
  }
  $('read').onclick = () => say(last.length ? last : [$('hint').textContent], true);

  showMotion();
  window.__elev = {state, setMode, floorTap, hlAnswer, lsAnswer, echoShow, allLines};  // for checking frames
  setMode('ride');
})();
</script>
</body>
</html>
