<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Estimation Station · Curio Class</title>
<meta name="description" content="Guess, choose a measuring tool, and load a freight train. Grade 2 length and number-line stories. Works offline.">
<!--
Estimation Station, Curio Class. Grade 2, 2.MD.1 through 2.MD.6.
Teacher-led Freight and exploratory Yard. No timer. Runs stay on this device.
Length facts: NIST Handbook 44 Appendix C; NIST SP 811; BIPM SI Brochure.
Illustrations generated with OpenAI gpt-image, edited for Curio Class.
Content CC BY 4.0. Code MIT. Started from kit/starter/src.html.
-->
<link rel="stylesheet" href="kit:curio">
<link rel="icon" href="data:,">
<style>
:root {
  --paper:#f7f2e7; --ink:#231f1a; --muted:#5e574d; --line:#c4aa7d; --focus:#1f6f8b;
  --brand:#9c3520; --btn:#87311f; --btn-line:#d6875d; --head-ink:#fff; --panel:#f7f2e7;
}
body {overflow:hidden; min-height:100%;}
header {padding:8px 18px; gap:10px; border-bottom:5px solid #612b1a; box-shadow:0 2px 6px #231f1a55; z-index:2;}
h1 {font:800 clamp(21px,2.6vw,33px)/1 Georgia,serif; letter-spacing:-.7px;}
h1 small {font-size:13px; letter-spacing:2px; margin-top:7px; text-transform:uppercase;}
header button,.seg button {min-height:60px;}
.seg {border-radius:12px;}
.seg button[aria-pressed="true"] {background:#e8a917; color:var(--ink);}
.icon-btn {border-radius:12px; padding:0 12px;}
main {grid-template-columns:minmax(0,1fr) 330px; overflow:hidden;}
.stage {min-height:0; display:flex; flex-direction:column; background:#d6b77e url('art:station-platform') center/cover;}
.race {height:100px; flex:none; position:relative; background:linear-gradient(#fff5d4ef,#f1dab9eb); border-bottom:3px solid #7d5433;}
.track {position:absolute; left:112px; right:24px; height:27px; border-block:3px solid #74614a;
  background:linear-gradient(90deg,transparent 40%,#9c352077 40% 60%,transparent 60%);
  background-size:calc(100% / 44) 100%; background-repeat:repeat-x;}
.track.this {top:15px;}
.track.last {top:56px;}
.track-label {position:absolute; left:12px; top:13px; font-size:13px; font-weight:800;}
.track-label.last {top:54px;}
.train {position:absolute; width:150px; height:43px; bottom:2px; display:flex; align-items:end;
  transition:left 1.2s cubic-bezier(.3,.7,.3,1); filter:drop-shadow(0 3px 2px #231f1a55);}
.train img {width:90px; height:40px; object-fit:contain;}
.train img:first-child {width:62px;}
.ghost {filter:grayscale(1) opacity(.65); border-bottom:2px dashed #485665;}
.job-dots {position:absolute; bottom:0; left:14px; font-weight:800; letter-spacing:6px; color:#6b3b27; font-size:12px;}
.work {position:relative; flex:1; min-height:0; margin:14px 15px 0; border:6px solid #6c4329;
  border-radius:7px 7px 0 0; background:#c9b48e url('art:tabletop') center/100% 100%;
  box-shadow:0 7px 0 #452a1a,0 14px 28px #231f1a55,inset 0 0 28px #50301633;}
.work.standing {background:#e5d7b7 url('art:platform-floor') center/100% 100%;}
#board {width:100%; height:100%; display:block; touch-action:none; user-select:none;}
#board text {font-family:'Trebuchet MS','Segoe UI',sans-serif; fill:var(--ink);}
.card {position:absolute; right:16px; top:13px; padding:9px 18px; min-width:175px; max-width:48%;
  background:linear-gradient(110deg,#fffbee,#f3dfb7); border:1px solid #ac8754; transform:rotate(2deg);
  box-shadow:2px 4px 6px #432b2255; border-radius:2px; font-size:15px; line-height:1.4; pointer-events:none;}
.card:before {content:''; position:absolute; left:45%; top:-8px; width:32px; height:13px; background:#ac775c99;}
.card b {display:block; font:800 22px Georgia,serif; text-transform:capitalize;}
.card .stamp {color:#28633d; border:2px solid #28633d; display:inline-block; padding:0 4px; transform:rotate(-6deg); font-weight:800;}
.card .stars {color:#704100; font-size:21px; letter-spacing:2px;}
.step-tag {position:absolute; left:12px; top:12px; background:#492d1c; color:#fff4d9; padding:6px 12px;
  font-size:13px; letter-spacing:2px; font-weight:800; border:1px solid #f7e0b588; border-radius:3px;}
.slip {position:absolute; top:10px; left:12px; right:12px; background:#fff9e8; padding:10px 14px;
  border-left:6px solid #9c3520; box-shadow:0 4px 6px #321d1c44; max-width:640px; font-size:17px;}
.slip strong {font:800 25px Georgia,serif; display:block; margin-top:6px;}
.tool-controls {display:flex; gap:6px; justify-content:center; min-height:68px; padding:7px 10px 3px; flex:none;}
.unit-relation {align-self:center; padding:5px 10px; background:#fff8df; border:1px solid #785034;
  border-radius:3px; font-size:14px; font-weight:800; box-shadow:0 2px 2px #432b2233;}
button.station {border:2px solid #785034; border-radius:7px; background:linear-gradient(#fff9e9,#e6cda0);
  min-height:60px; padding:4px 12px; font-weight:800; box-shadow:0 3px 0 #66432c;}
button:active {filter:brightness(1.08);}
button[aria-disabled="true"] {opacity:.53; cursor:default;}
button.station:hover {background:#fff3cc;}
.rack-wrap {background:linear-gradient(#5e3d29,#3e271d); border-top:4px solid #c49a5a; padding:8px 15px 6px; flex:none;}
.rack-label {color:#fff0cf; font-size:11px; font-weight:800; letter-spacing:3px; margin-bottom:4px;}
.rack {display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px;}
.rack button {height:82px; min-width:0; border:2px solid #c7a271; border-radius:5px;
  background:linear-gradient(135deg,#f8e7c3,#d3b17b); box-shadow:0 3px 0 #17100c; padding:1px 2px;
  font-size:14px; line-height:1.1; font-weight:800;}
.rack button svg {width:100%; height:38px; display:block;}
.tool-capacity {display:block; font-size:10px; line-height:11px;}
.rack button[aria-pressed="true"] {outline:4px solid #e8a917; outline-offset:-4px; background:#fff2c4;}
.shelf {display:flex; gap:8px; min-height:38px; align-items:center; color:#fff0cf; padding-top:6px; font-size:12px; overflow:hidden;}
.shelf span {display:flex; align-items:center; gap:4px; white-space:nowrap;}
.shelf img {width:32px; height:23px; object-fit:contain;}
.shelf .empty {font-style:italic; opacity:.8;}
.panel {padding:12px 14px; gap:10px; border-left:6px solid #65452d; background:
  repeating-linear-gradient(0deg,transparent 0 30px,#aa8b5c15 30px 31px),linear-gradient(110deg,#fff9e9,#ead9b8);
  overflow:hidden; box-shadow:inset 5px 0 15px #4f29152b;}
.portrait-row {display:flex; align-items:center; min-height:177px; gap:4px; position:relative;}
.portrait-row img {width:116px; height:150px; object-fit:contain; flex:none; align-self:end; filter:drop-shadow(1px 3px 1px #4f291544);}
.hint {font-size:20px; line-height:1.28; margin:0; font-weight:650;}
.ledger-title {font-size:11px; letter-spacing:3px; font-weight:800; color:#6d4731; margin:0;}
.display {background:#fffdf4; border:3px solid #826441; box-shadow:inset 0 3px 8px #5c3e2233; min-height:76px;
  border-radius:5px; display:flex; align-items:center; justify-content:space-between; padding:0 14px;}
#digits {font:800 52px/1 'Trebuchet MS',sans-serif; min-width:1ch;}
#display-unit {font-size:15px; color:var(--muted);}
.pad {display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
.pad button {height:60px; min-width:0; border-radius:7px; border:2px solid #b99b6c; background:linear-gradient(#fffdf3,#ecdfc5);
  font:800 26px 'Trebuchet MS',sans-serif; box-shadow:0 3px 0 #9e8256;}
.pad button.hit {background:#f3c758;}
.pad #back {font-size:17px;}
.pad #check {background:linear-gradient(#f7c64d,#e8a917); border-color:#8e5e13; font-size:18px;}
.panel .big-btn {font-size:20px; border-radius:7px; flex:none; background:#e8a917; color:#231f1a;}
.panel #new-run {background:#fff5dd; color:#714225; border:2px solid #ac865a; margin-top:auto; min-height:60px; font-size:17px;}
.privacy {font-size:11px; line-height:1.2; margin:0; color:var(--muted);}
.yard-shelf {background:#f7e7c9f2; border-bottom:4px solid #6b442b; padding:6px 10px; flex:none;}
.yard-items {display:grid; grid-template-columns:repeat(6,1fr); gap:5px;}
.yard-items button {min-height:65px; border:1px solid #9d774d; background:#fff6e2; border-radius:5px; padding:2px; font-size:11px;}
.yard-items img {width:48px; height:37px; object-fit:contain; display:block; margin:auto;}
.pages {display:flex; justify-content:space-between; align-items:center; margin-top:5px; font-size:12px;}
.pages button {min-height:60px; min-width:95px;}
.yard .shelf,.yard .rack-label {display:none;}
.yard .tool-controls.empty {display:none;}
.ended .tool-controls {display:none;}
.summary {position:absolute; inset:10px; z-index:3; background:#fff7e3f5; border:4px double #956134; padding:20px;
  overflow:auto; box-shadow:0 4px 20px #321b1855;}
.summary h2 {font:800 36px Georgia,serif; margin:0 0 8px; color:#9c3520;}
.summary .totals {font-size:23px; margin-bottom:15px;}
.recaps {display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.recaps article {padding:9px; background:#f5e3bc; border:1px solid #ad8852; font-size:13px;}
.recaps img {width:55px; height:35px; object-fit:contain; float:right;}
.recaps b {display:block; font-size:16px; text-transform:capitalize;}
.badge {display:inline-block; margin:12px 0; padding:8px 16px; border:3px double #28633d; color:#28633d; font-weight:800;}
.summary {padding:12px;}
.summary h2 {font-size:28px; margin-bottom:5px;}
.summary .totals {font-size:18px; margin-bottom:8px;}
.recaps {gap:6px;}
.recaps article {padding:5px; font-size:11px;}
.recaps b {font-size:13px;}
.recaps img {width:40px; height:25px;}
.summary .badge {font-size:13px; padding:4px 9px; margin:6px 0;}
.summary p {font-size:12px; margin:5px 0;}
@media (min-width:600px) and (max-height:850px) {
  .panel {gap:7px;}
  .portrait-row {display:block; min-height:130px;}
  .portrait-row img {float:left; width:96px; height:108px; margin-right:5px;}
  .hint {font-size:18px; line-height:1.25;}
  .ledger-title {display:none;}
}
.lantern {position:absolute; top:18px; right:12px; width:10px; height:10px; border-radius:50%; background:#ffd34d;
  box-shadow:0 0 15px 6px #ffc84777; animation:glimmer 3s ease-in-out infinite alternate; pointer-events:none;}
@keyframes glimmer {to {opacity:.5; box-shadow:0 0 8px 2px #ffc84733;}}
@keyframes pulse {50% {filter:drop-shadow(0 0 7px #9c3520);}}
@keyframes load {
  30% {transform:translateY(-18px) rotate(-3deg);}
  90% {opacity:1;}
  100% {transform:translate(var(--load-x,180px),var(--load-y,55px)) scale(.15); opacity:0;}
}
.load-item {transform-box:fill-box; transform-origin:center; animation:load 1.2s ease-in forwards;}
.wrong-lens {animation:pulse .5s ease-in-out 2;}
.calm .lantern,.calm .wrong-lens {animation:none;}
.calm .wrong-lens > circle {stroke:#9c3520; stroke-width:5px;}
.calm .load-item {animation:none; opacity:0;}
.calm .train {transition:none;}
.sr {position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
@media (max-width:1100px) {
  main {grid-template-columns:minmax(0,1fr) 270px;}
  header {gap:7px; padding:6px 10px;}
  .seg button,.icon-btn {padding:0 9px; font-size:14px;}
  .portrait-row {min-height:135px;}
  .portrait-row img {width:85px; height:115px;}
  .hint {font-size:17px;}
  .rack button {font-size:12px;}
}
@media (max-height:650px) and (min-width:600px) {
  header {padding:4px 8px; gap:5px; border-bottom-width:3px; flex-wrap:nowrap;}
  h1 {font-size:20px; letter-spacing:-.5px;}
  h1 small {display:none;}
  header button,.seg button {min-height:44px; padding:0 8px; font-size:12px;}
  main {grid-template-columns:minmax(0,1fr) 210px;}
  .race {height:45px;}
  .track {left:87px; height:14px; right:16px;}
  .track.this {top:6px;}
  .track.last {top:26px;}
  .track-label {left:6px; top:3px; font-size:10px;}
  .track-label.last {top:25px;}
  .train {height:23px; width:75px;}
  .train img {width:40px; height:23px;}
  .train img:first-child {width:34px;}
  .job-dots {left:auto; right:6px; font-size:10px; letter-spacing:3px;}
  .work {margin:7px 8px 0; border-width:4px;}
  .card {font-size:10px; min-width:110px; padding:4px 9px; top:8px; right:8px;}
  .card b {font-size:15px;}
  .card .stars {font-size:14px;}
  .step-tag {top:7px; left:7px; font-size:10px; padding:4px 6px; letter-spacing:1px;}
  .tool-controls {min-height:50px; padding:3px 5px; gap:4px;}
  button.station {min-height:44px; padding:2px 6px; font-size:11px;}
  .rack-wrap {padding:3px 7px; border-top-width:2px;}
  .rack-label {font-size:10px; letter-spacing:1px; margin-bottom:2px;}
  .rack {gap:4px;}
  .rack button {height:56px; font-size:10px;}
  .rack button svg {height:25px;}
  .shelf {min-height:25px; padding-top:3px; font-size:10px;}
  .shelf span:nth-last-child(n+4):not(:first-child) {display:none;}
  .shelf img {width:20px; height:16px;}
  .panel {padding:4px 7px; gap:3px; border-left-width:4px;}
  .portrait-row {min-height:68px;}
  .portrait-row img {width:48px; height:65px;}
  .hint {font-size:13px; line-height:1.2;}
  .ledger-title {font-size:10px; letter-spacing:2px;}
  .display {min-height:44px; padding:0 8px;}
  #digits {font-size:32px;}
  #display-unit {font-size:12px;}
  .pad {grid-template-columns:repeat(4,1fr); gap:4px;}
  .pad button {height:44px; font-size:21px;}
  .pad #back,.pad #check {font-size:11px;}
  .panel .big-btn,.panel #new-run {min-height:44px; font-size:14px;}
  .privacy {font-size:10px;}
  .panel .privacy {display:none;}
  .slip {font-size:12px; padding:5px 8px;}
  .slip strong {font-size:20px; margin-top:2px;}
  .yard-items button {min-height:44px; font-size:10px;}
  .yard-items img {height:25px; width:40px;}
  .pages button {min-height:44px;}
  .summary {padding:10px;}
  .summary h2 {font-size:24px;}
  .summary .totals {font-size:16px;}
  .recaps {gap:4px;}
  .recaps article {font-size:10px; padding:4px;}
  .recaps b {font-size:11px;}
}
@media (max-width:599px) {
  header {padding:5px 7px; gap:5px; justify-content:space-between;}
  h1 {font-size:20px; width:100%; text-align:center; margin:0;}
  h1 small {display:none;}
  header button,.seg button {min-height:44px; font-size:11px; padding:0 6px;}
  .icon-btn {min-height:44px; font-size:11px; padding:0 6px;}
  .seg {border-radius:7px;}
  .icon-btn {border-radius:7px;}
  main {grid-template-columns:1fr; grid-template-rows:minmax(280px,1fr) 260px;}
  .race {height:60px;}
  .track {left:85px; height:15px; right:12px;}
  .track.this {top:9px;}
  .track.last {top:33px;}
  .track-label {font-size:10px; top:7px; left:7px;}
  .track-label.last {top:32px;}
  .train {width:86px; height:25px;}
  .train img {width:48px; height:25px;}
  .train img:first-child {width:35px;}
  .job-dots {font-size:10px; right:4px; left:auto; letter-spacing:3px;}
  .work {margin:6px 7px 0; border-width:4px;}
  .card {font-size:10px; min-width:110px; padding:4px 7px; right:6px; top:6px;}
  .card b {font-size:14px;}
  .card .stars {font-size:13px;}
  .step-tag {left:6px; top:6px; font-size:10px; letter-spacing:1px; padding:4px;}
  .rack-wrap {padding:4px 6px;}
  .rack-label {font-size:10px; margin-bottom:2px;}
  .rack {gap:4px;}
  .rack button {height:60px; font-size:10px;}
  .rack button svg {height:27px;}
  .shelf {min-height:24px; font-size:10px; padding-top:3px;}
  .shelf img {width:20px; height:17px;}
  .shelf span:nth-last-child(n+4):not(:first-child) {display:none;}
  .tool-controls {min-height:49px; padding:3px 5px; gap:3px;}
  button.station {min-height:44px; padding:2px 5px; font-size:10px;}
  .panel {display:grid; grid-template-columns:138px minmax(0,1fr); grid-template-rows:44px 1fr 44px;
    gap:6px; padding:7px; border-top:4px solid #65452d; border-left:0;}
  .portrait-row {grid-row:1/3; grid-column:1; display:block; min-height:0;}
  .portrait-row img {float:left; width:55px; height:68px; margin-right:3px;}
  .hint {font-size:13px; line-height:1.23;}
  .ledger-title {display:none;}
  .display {grid-column:2; grid-row:1; min-height:44px; padding:0 7px;}
  #digits {font-size:30px;}
  #display-unit {font-size:10px;}
  .pad {grid-column:2; grid-row:2; grid-template-columns:repeat(4,1fr); gap:4px;}
  .pad button {height:44px; font-size:20px;}
  .pad #back,.pad #check {font-size:10px;}
  .panel .big-btn,.panel #new-run {grid-row:3; margin:0; min-height:44px; font-size:13px; padding:0 4px;}
  #next,#show-me {grid-column:2;}
  #new-run {grid-column:1;}
  .privacy {display:none;}
  .slip {font-size:12px; padding:5px 7px;}
  .slip strong {font-size:20px; margin-top:3px;}
  .yard-items {grid-template-columns:repeat(3,1fr);}
  .yard-items button {min-height:44px; font-size:10px;}
  .yard-items img {width:40px; height:24px;}
  .pages {margin-top:3px;}
  .pages button {min-height:44px;}
  .yard-shelf {padding:4px 7px;}
  body.yard .work {min-height:110px;}
  .summary {padding:10px;}
  .summary h2 {font-size:24px;}
  .summary .totals {font-size:16px;}
  .recaps {grid-template-columns:repeat(2,1fr); gap:4px;}
  .recaps article {font-size:10px; padding:5px;}
  .recaps b {font-size:12px;}
}
</style>
</head>
<body>
<header>
  <h1>Estimation Station<small>Guess it. Measure it. Load it.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-freight" aria-pressed="true">🚂 Freight</button>
    <button id="m-yard" aria-pressed="false">🧰 Yard</button>
  </div>
  <button class="icon-btn" id="read">🔊 Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<main>
  <section class="stage" id="stage" aria-label="Station work table">
    <div class="race" id="race">
      <span class="track-label">This run <b id="points">0</b></span>
      <span class="track-label last" id="ghost-label">Starter ghost</span>
      <div class="track this"><div class="train" id="train"><img src="art:freight-car" alt=""><img src="art:engine" alt=""></div></div>
      <div class="track last"><div class="train ghost" id="ghost"><img src="art:freight-car" alt=""><img src="art:engine" alt=""></div></div>
      <div class="job-dots" id="job-dots"></div><i class="lantern"></i>
    </div>
    <div class="yard-shelf" id="yard-shelf" hidden>
      <div class="yard-items" id="yard-items"></div>
      <div class="pages"><button class="station" id="page-back">← Back page</button><span id="page-label"></span>
        <button class="station" id="page-next">Next page →</button></div>
    </div>
    <div class="work" id="work">
      <svg id="board" role="img" tabindex="0" aria-label="Item and measuring tools. Use arrow keys to move a tool or trace a curve."></svg>
      <div class="step-tag" id="step-tag">1 · GUESS</div>
      <div class="card" id="card"></div>
      <div class="slip" id="slip" hidden></div>
      <section class="summary" id="summary" hidden aria-label="Your completed freight run"></section>
    </div>
    <div class="tool-controls" id="tool-controls">
      <button class="station" id="left" hidden>← Nudge left</button>
      <button class="station" id="right" hidden>Nudge right →</button>
      <button class="station" id="flip" hidden>⤾ Flip</button>
      <button class="station" id="mark" hidden>✎ Mark and move</button>
      <button class="station" id="place-zero" hidden>⇤ At zero</button>
      <button class="station" id="place-end" hidden>⇥ At end</button>
      <output class="unit-relation" id="unit-relation" hidden></output>
    </div>
    <div class="rack-wrap">
      <div class="rack-label" id="rack-label">THE TOOL RACK</div>
      <div class="rack" id="rack"></div>
      <div class="shelf" id="shelf"><span>Measured</span><span class="empty">Your finds go here.</span></div>
    </div>
  </section>
  <aside class="panel">
    <div class="portrait-row"><img id="hollis" src="art:mr-hollis" alt="Mr. Hollis, the station master">
      <p class="hint" id="hint" aria-live="polite"></p></div>
    <p class="ledger-title">YOUR FREIGHT LEDGER</p>
    <div class="display" aria-label="Your typed number"><output id="digits" aria-live="polite">?</output><span id="display-unit">inches</span></div>
    <div class="pad" id="pad"></div>
    <button class="big-btn" id="next" hidden>🚂 Next crate</button>
    <button class="big-btn" id="show-me" hidden>◉ Show me</button>
    <button class="big-btn" id="new-run">↻ New run</button>
    <p class="privacy">Runs stay only on this device.</p>
  </aside>

<script src="kit:curio"></script>

  let geometry = null;
  let drag = null;
  let stableTimer = 0;
  let wrongTimer = 0;
  let loadTimer = 0;

  const shuffle = list => list.map(x => [Math.random(),x]).sort((a,b) => a[0]-b[0]).map(x => x[1]);
  const copy = value => JSON.parse(JSON.stringify(value));
  const small = () => innerHeight <= 650 || innerWidth < 600;
  const sing = unit => ({inches:'inch',feet:'foot',centimeters:'centimeter',meters:'meter'})[unit];
  function words(number) {
    const ones = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven',

    const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

  }
  const lengthWords = (n,u) => words(n)+' '+(n===1 ? sing(u) : u);
  const lengthText = (n,u) => n+' '+(n===1 ? sing(u) : u);
  const itemIntro = name => name==='scissors' ? 'Scissors' : (/^[aeiou]/i.test(name)?'An ':'A ')+name;
  function speechParts(text) {

  }
  function speech(text, options={}) {

  function hint(text) {

    hint:false,
    read:readLines,
    welcome:() => state.mode === 'yard' ? (state.yardChosen ? null : 'yardWelcome') : state.step === 'guess' ? 'welcome' : null
  });

    V.how(key,{hint:false,needs,valid});
  }

  }

        item.secondL = item.bigL;

        item.secondUnit = item.smallUnit;
        item.secondL = item.smallL;

  }

  function resetJob(item) {

    state.entry = '';
    state.tool = null;
    state.offset = -2;
    state.moved = 0;
    state.chalkMax = 0;
    state.traced = false;
    state.traceProgress = 0;
    state.firstPick = null;
    state.stamp = false;
    state.jobPoints = 0;
    state.guess = null;
    state.guess2 = null;
    state.stars = 0;
    state.stars2 = 0;
    state.tries = 0;
    state.shown = false;
    state.second = false;
    state.firstLength = null;
    state.firstUnit = null;
    state.layout = null;
    state.reveal = false;
    state.wrong = false;
    state.done = false;
    state.step = item.kind === 'slip' ? 'place' : item.kind === 'ribbon' ? 'tool' : 'guess';

    $('summary').hidden = true;
    updateHint();
    render();
  }
  function updateHint() {
    const item = state.item;
    if (state.mode === 'yard') return hint(L.showHint);
    if (state.step === 'end') return hint('The train is loaded! Tap New run to race it, or tap Yard to explore.');
    if (state.step === 'guess') {
      return hint('Freight is here! Guess the length of the '+item.name+' in '+item.unit+'. Tap the numbers, then tap Check.');
    }
    if (state.step === 'guess2') {
      return hint('Now guess the same '+item.name+' in '+item.secondUnit+'. Tap the numbers, then tap Check.');
    }
    if (state.step === 'tool') return hint(item.kind === 'ribbon' ? L.ribbonCrate : L.guessed);
    if (state.step === 'place') return hint(L.placeHow);
    if (state.step === 'slip') return hint('Read the order. Use the tape to find the box. Type it, then tap Check.');
    if(state.tool && ['measure','red','blue'].includes(state.step) && Math.abs(state.offset)>.14 &&
      (item.orientation!=='curvy' || state.traced)) return hint(L.toolAlign);
    if(state.tool && ['measure','red','blue'].includes(state.step) && remains()) return hint(L.toolLong);
    if (state.step === 'red') return hint(L.readRed);
    if (state.step === 'blue') return hint(L.readBlue);
    if (state.step === 'difference') return hint(L.askDiff);
    if (state.step === 'result') return hint('Crate ready! Tap Next crate.');
    if(state.tool==='tape' && state.face!==(item.unit==='centimeters'?'centimeters':'inches')) return hint(L.face);
    if (item.orientation === 'curvy' && !state.traced) return hint(L.trace);

    return hint(L.readHow);
  }
  function announceJob() {
    if (state.item.kind === 'slip') {

    } else if (state.item.kind === 'ribbon') {

  }
  function newRun() {

    state.job = 0;
    state.points = 0;

  function setMode(mode) {

    $('yard-shelf').hidden = !yard;

  function supports(tool, unit) {
    if (unit === 'feet') return ['inch','yard','tape'].includes(tool.id);
    if (unit === 'meters') return tool.id === 'meter';
    return unit === 'centimeters' ? ['cm','meter','tape'].includes(tool.id) : ['inch','yard','tape'].includes(tool.id);
  }
  function capacity(tool, unit=state.item.unit) {
    if(tool.id==='tape') {

      if(unit==='inches') return state.face==='centimeters' ? 150/2.54 : 60;
      if(unit==='centimeters') return state.face==='centimeters' ? 150 : 60*2.54;

    if (unit === 'feet') return tool.id === 'inch' ? 1 : tool.id === 'yard' ? 3 : 5;

    if (tool.id === 'tape') return state.face === 'centimeters' ? 150 : 60;
    return tool.length;
  }
  function working(tool) {
    return supports(tool,state.item.unit) &&

  }
  function bestTools() {
    const works = TOOLS.filter(working);

  }
  function chooseTool(id) {
    if (state.mode === 'freight' && !['tool','measure','red','blue','difference'].includes(state.step)) return;

      state.firstPick = id;

    render();
    Curio.tone(470,.07,.04,'triangle');

      state.item.orientation==='curvy' ? 'trace' : Math.abs(state.offset)>.14 ? 'toolAlign' :
        remains() ? 'markHow' : 'readHow';
    speech('The '+tool.name+'.');
    how(instruction,state.mode==='yard' ? '#show-me' : instruction==='markHow' ? '#mark' : '#check',

      if (state.mode!=='freight' || state.generation!==generation || state.job!==job || !state.tool || state.entry ||
        !['measure','red','blue'].includes(state.step) || Math.abs(state.offset)>.14) return;
      const instructions = remains() ? [['markHow',{needs:'#mark',valid:()=>remains()}]] : [['readHow',{needs:'#check'}]];
      V.how(instructions,{hint:false,valid:()=>!!state.tool && !state.entry && ['measure','red','blue'].includes(state.step) &&
        (state.item.orientation!=='curvy' || state.traced)});

  }

    if (!state.tool || state.item.kind === 'slip') return false;

  }

    if (!state.tool || state.step === 'result') return;

    const target = state.step === 'blue' ? item.b : state.step === 'difference' ? item.a-item.b : item.L;
    const faceRight = state.tool !== 'tape' || state.face === (item.unit === 'centimeters' ? 'centimeters' : 'inches');
    const ready = state.step === 'difference' || (state.tool && Math.abs(state.offset)<.14 && !remains() &&

    state.tries++;

      state.wrong = true;

        Math.abs(state.offset)<.14 && remains() ? L.markHow : L.align) :
        state.step === 'difference' ? L.diffWrong1 : L.wrong1);

      Curio.tone(155,.14,.045,'triangle');

      return;
    }
    if (correct) {
      if (oldStep === 'difference') feedback = 'Yes! '+words(item.a)+' take away '+words(item.b)+' is '+words(target)+

  function lens(cx,cy,r,label,value,px,tool,unit,compact) {

      '<g class="'+(state.wrong?'wrong-lens':'')+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+
      '" fill="#fff8df" stroke="'+(state.reveal && label==='End'?'#1f6f8b':'#765138')+
      '" stroke-width="6"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r-4)+'" fill="none" stroke="#e8c78c"/>'+
      '<g clip-path="url(#'+id+')">'+
      '<rect x="'+(cx-r)+'" y="'+cy+'" width="'+r*2+'" height="'+r+'" fill="url(#wood)"/>'+
      '<path d="M'+(cx-r)+' '+cy+'h'+r*2+'" stroke="#6b4c29" stroke-width="2"/>'+
      '<path d="M'+(cx-r)+' '+(cy+r-8)+'h'+r*2+'" stroke="#b48749" opacity=".5"/>';

      if(used.some(other=>Math.abs(other.tx-candidate.tx)<(other.width+width)/2+3))continue;
      used.push({...candidate,width});

    });
    for(const unit of ['inches','feet','centimeters','meters']) {
      for(let number=0;number<=999;number++) {
        add('You guessed '+lengthWords(number,unit)+'. Now tap a tool on the rack.');
        add('You guessed '+words(number)+'.');
      }
      add('Now guess: how many '+unit+' long is it?');
    }
    for(let n=0;n<=44;n++) {
      add('The train is loaded! '+words(n)+(n===1?' point.':' points.')+' Your last run had '+words(n)+'.');
      if(n<=3)add(words(n)+(n===1?' star!':' stars!'));
    }
    add("Keep guessing, you'll get closer. You beat it! Race it again next time!");
    add('The Starter ghost had thirty two.');
    add('Crate ready! Tap Next crate.');
    add('The train is loaded! Tap New run to race it, or tap Yard to explore.');
    add('Read the order. Use the tape to find the box. Type it, then tap Check.');
    add('Read this piece. Tap Mark and move, add the pieces, then type the total and tap Check.');
    add('Tap another item on the shelf, or tap a tool to measure again.');
    DATA.ribbons.forEach(ribbon=>{
      [ribbon.a,ribbon.b,ribbon.a-ribbon.b].forEach(length=>remember(length,ribbon.unit));
      add('Yes! '+words(ribbon.a)+' take away '+words(ribbon.b)+' is '+words(ribbon.a-ribbon.b)+'. '+
        'The red ribbon is '+lengthWords(ribbon.a-ribbon.b,ribbon.unit)+' longer.');
    });
    DATA.slips.forEach(slip=>{
      add('Order slip! '+spokenNumbers(slip.text));
      const equations=[slip.a+' + '+slip.b+' = □',slip.b>slip.a ? slip.a+' + □ = '+slip.b : slip.a+' − '+slip.b+' = □'];
      equations.forEach(eq=>{
        add('Your number sentence: '+spokenNumbers(eq)+'. Type the box, then tap Check.');
      });
      const correctEquation=slip.kind==='join'?equations[0]:equations[1];
      const filled=spokenNumbers(correctEquation.replace('□',slip.answer));
      add('Yes! '+filled+'.');
      add("It's "+words(slip.answer)+'. '+filled+'.');
    });
    for(const {length,unit} of readings.values()) {
      add('Yes, '+lengthWords(length,unit)+'.');
      add("It's "+lengthWords(length,unit)+'. Look at where the item ends.');
    }
    return [...lines];
  }
  window.__tool={state,setMode,allLines,vlog:V.log,get vq(){return V.queue;},
    stars,bestTools,working,capacityFor,DATA,TOOLS,geometry:()=>geometry};
})();
</script>
