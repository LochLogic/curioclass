  // roads, sidewalks, a pond and trees in SVG
  (function map() {
    const s = $('map');
    s.innerHTML = `
      <rect x="0" y="0" width="1000" height="620" fill="#9fd47e"/>
      <g fill="#7cc061">${Array.from({length: 40}, (_, i) => `<circle cx="${(i * 97) % 1000}" cy="${(i * 53) % 620}" r="${4 + i % 5}"/>`).join('')}</g>

      <path d="M0,308 H1000 M0,472 H860 M235,150 V620 M440,150 V620 M640,150 V472 M860,150 V620" stroke="#6d6a66" stroke-width="44" fill="none"/>

      ${[[600, 40], [660, 90], [990, 230], [990, 400], [760, 590], [800, 560]].map(([x, y]) => `<g><circle cx="${x}" cy="${y}" r="26" fill="#3f8f3a"/><circle cx="${x - 8}" cy="${y - 8}" r="12" fill="#5aab4f"/></g>`).join('')}`;
  })();

  const state = {mode: 'explore', order: [], at: -1, right: 0, sound: true, names: true};

  // ---------- sound ----------
  let ctx;
  const audio = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(f, dur = .2, gain = .07, when = 0, type = 'triangle') {
    if (!state.sound) return;
    const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    tap: () => tone(660, .1, .05, 0, 'sine'),
    yes: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, .08, i * .09)),
    hmm: () => { tone(392, .2, .06, 0, 'sine'); tone(349, .25, .06, .2, 'sine'); },
  };

    $('places').replaceChildren(...P.map(p => {
      const b = document.createElement('button');
      b.className = 'place' + (state.names ? '' : ' hidename'); b.dataset.id = p.id;
      Object.assign(b.style, {left: p.x + 'px', top: p.y + 'px'});
      b.innerHTML = `<img src="${IMG[p.id]}" alt=""><span class="name">${p.n}</span>`;
      b.setAttribute('aria-label', p.n);
      b.onclick = () => tap(p.id);
      return b;
    }));
  }
  const pl = id => $('places').querySelector(`[data-id="${id}"]`);
  function mark(id, cls) { $('places').querySelectorAll('.place').forEach(b => b.classList.toggle(cls, b.dataset.id === id)); }
  function clearMarks() { $('places').querySelectorAll('.place').forEach(b => b.classList.remove('on', 'right', 'dim')); }
  function helper(p) {
    $('helper').innerHTML = p ? `<img src="${HELP[p.id]}" alt="${an(p.h)} ${p.h}"><b>${p.h}</b>` : '';
  }
  $('names').onchange = () => { state.names = $('names').checked; $('places').querySelectorAll('.place').forEach(b => b.classList.toggle('hidename', !state.names)); };

  function tap(id) {
    if (state.mode === 'explore') return explore(id);
    if (state.mode === 'where') return whereTap(id);
    return whoTap(id);
  }

  // ---------- Explore ----------
  function explore(id) {
    const p = byId[id];
    clearMarks(); mark(id, 'on'); SFX.tap(); helper(p);
    $('card').innerHTML = `<div class="big">This is the ${p.n}.</div><div class="sm">${cap(p.hs)} work here. They ${p.does}.</div>`;
    $('tip').innerHTML = id === 'fire' || id === 'police' || id === 'hospital' ? '<b>In an emergency,</b> call 911 or tell a grown-up right away.' : `<b>Say it:</b> "This is the ${p.n}. ${an(p.h) === 'an' ? 'An' : 'A'} ${p.h} works here."`;
    say([`This is the ${p.n}.`, `${cap(p.hs)} work here. They ${p.does}.`]);
  }

  // ---------- Where do I go? ----------
  function nextWhere() {
    if (state.at >= state.order.length - 1 || !state.order.length) { state.order = P.map(p => p.id).sort(() => Math.random() - .5); state.at = -1; state.right = 0; }
    state.at++;
    const p = byId[state.order[state.at]];
    clearMarks(); helper(null);
    $('card').innerHTML = `<div class="big">"${p.need}"</div><div class="sm">Where do I go? I go to the <span class="frame">&nbsp;</span>.</div>`;
    $('tip').innerHTML = '';
    $('score').textContent = `${state.at + 1} of ${state.order.length}`;
    say([p.need, 'Where do I go?']);
  }
  function whereTap(id) {
    const p = byId[state.order[state.at]], t = byId[id];
    if (id === p.id) {
      clearMarks(); mark(id, 'on'); mark(id, 'right'); SFX.yes(); helper(p);
      $('card').innerHTML = `<div class="big">"${p.need}"</div><div class="sm">I go to the <span class="frame">${p.n}</span>. ${an(p.h) === 'an' ? 'An' : 'A'} ${p.h} can help.</div>`;
      say([goLine(p), `${an(p.h) === 'an' ? 'An' : 'A'} ${p.h} can help.`]);
    } else {
      SFX.hmm(); pl(id).classList.add('dim');
      $('tip').innerHTML = `That's the ${t.n}. ${cap(t.hs)} ${t.does}. Try again!`;
      say([`That's the ${t.n}.`, 'Try again!']);
    }
  }

  // ---------- Who helps? ----------
  function nextWho() {
    if (state.at >= state.order.length - 1 || !state.order.length) { state.order = P.map(p => p.id).sort(() => Math.random() - .5); state.at = -1; }
    state.at++;
    const p = byId[state.order[state.at]];
    clearMarks(); helper(p);
    $('card').innerHTML = `<div class="big">This is ${an(p.h)} ${p.h}.</div><div class="sm">Where do they work? ${an(p.h) === 'an' ? 'An' : 'A'} ${p.h} works at the <span class="frame">&nbsp;</span>.</div>`;
    $('tip').innerHTML = '';
    $('score').textContent = `${state.at + 1} of ${state.order.length}`;
    say([`This is ${an(p.h)} ${p.h}.`, 'Where do they work?']);
  }
  function whoTap(id) {
    const p = byId[state.order[state.at]], t = byId[id];
    if (id === p.id) {
      clearMarks(); mark(id, 'on'); mark(id, 'right'); SFX.yes();
      const A = an(p.h) === 'an' ? 'An' : 'A';
      $('card').innerHTML = `<div class="big">${A} ${p.h} works at the <span class="frame">${p.n}</span>.</div><div class="sm">${cap(p.hs)} ${p.does}.</div>`;
      say([`${A} ${p.h} works at the ${p.n}.`, `${cap(p.hs)} ${p.does}.`]);
    } else {
      SFX.hmm(); pl(id).classList.add('dim');
      $('tip').innerHTML = `That's the ${t.n}. ${cap(t.hs)} work there. Try again!`;
      say([`That's the ${t.n}.`, 'Try again!']);
    }
  }

  function setMode(m) {
    state.mode = m; stopTalk(); state.order = []; clearMarks(); helper(null);
    for (const [id, k] of [['m-explore', 'explore'], ['m-where', 'where'], ['m-who', 'who']]) $(id).setAttribute('aria-pressed', m === k);
    $('card').innerHTML = ''; $('tip').innerHTML = '';
    if (m === 'explore') {
      $('ctrl').innerHTML = '';
      $('hint').innerHTML = '<b>Explore.</b> Tap a place. Hear its name, meet the helper who works there and say it together: "This is the library."';
      $('card').innerHTML = '<div class="big">Welcome to our town!</div><div class="sm">Tap a place to visit.</div>';
      say('Welcome to our town! Tap a place to visit.');
    }
    if (m === 'where') {
      $('ctrl').innerHTML = '<button class="big-btn" id="next">Next →</button><div class="score" id="score"></div>';
      $('next').onclick = nextWhere;
      $('hint').innerHTML = '<b>Where do I go?</b> Read the need together. Children answer with the frame "I go to the ___," then tap the place. Turn off place names for a challenge.';
      nextWhere();
    }
    if (m === 'who') {
      $('ctrl').innerHTML = '<button class="big-btn" id="next">Next helper →</button><div class="score" id="score"></div>';
      $('next').onclick = nextWho;
      $('hint').innerHTML = '<b>Who helps?</b> Meet a helper. Where do they work? Answer with "A ___ works at the ___," then tap the place.';
      nextWho();
    }
  }
  $('m-explore').onclick = () => setMode('explore');
  $('m-where').onclick = () => setMode('where');
  $('m-who').onclick = () => setMode('who');
  addEventListener('keydown', e => { if (e.target.closest('button,input') || !/^[1-3]$/.test(e.key)) return; setMode(['explore', 'where', 'who'][e.key - 1]); });

  // ---------- sound and voice ----------
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
    if (!state.sound) stopTalk();
  };
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    // Chrome fills its voice list late, so an early line waits for it; cancel() also drops a line still waiting,
    // or it would start after the next one and the tool would talk over itself
    const speak = speechSynthesis.speak.bind(speechSynthesis), cancel = speechSynthesis.cancel.bind(speechSynthesis), held = new Set();
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      held.add(u);
      const go = () => { if (!held.delete(u)) return; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.cancel = () => { held.forEach(u => u.onend && u.onend()); held.clear(); cancel(); };
    speechSynthesis.getVoices();
  }
  const CLIPS = {};
  const allLines = () => [...new Set([
    'Welcome to our town! Tap a place to visit.', 'Where do I go?', 'Where do they work?', 'Try again!',
    ...P.flatMap(p => { const A = an(p.h) === 'an' ? 'An' : 'A'; return [`This is the ${p.n}.`, `${cap(p.hs)} work here. They ${p.does}.`, p.need, goLine(p), `${A} ${p.h} can help.`, `That's the ${p.n}.`, `This is ${an(p.h)} ${p.h}.`, `${A} ${p.h} works at the ${p.n}.`, `${cap(p.hs)} ${p.does}.`]; })])];
  let talk = 0, clip = null, last = [], heard = false;
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { heard = true; }, {once: true, capture: true});
  function stopTalk() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (CLIPS[text]) { clip = new Audio(CLIPS[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = .88; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function say(parts, force) {
    if (!heard && !force) return;
    if (!state.sound && !force) return;
    stopTalk();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(200); }
  }
  $('read').onclick = () => say(last.length ? last : [$('hint').textContent], true);

  drawPlaces();
  showMotion();
  window.__town = {state, setMode, tap, allLines};  // for checking frames
  setMode('explore');
})();
</script>
</body>
</html>
