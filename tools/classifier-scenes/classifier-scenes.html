<!-- GENERATED from src.html by scripts/bundle_tool.py; edit src.html, not this file.

CLASSIFIER SCENES (Curio Class)
American Sign Language, grades 6-12, ACTFL Intermediate Mid (presentational and interpretive communication),
module "Classifiers and Space".
Twenty pictures. For each one students decide the ground (the larger object that stays still, usually set up
first and held on the non-dominant hand), choose a classifier handshape for each object, place the objects in
signing space from the signer's own point of view, and add movement. Then they play it back with an English
gloss and flip to the viewer's view, which is mirrored.
This is practice for the spatial grammar only. It does not replace watching and learning from Deaf signers;
classifier choices can vary between signers and regions, and the teacher notes say so.

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const anim = (node, frames, ms) => reduce ? wait(ms) : Promise.race([node.animate(frames, {duration: ms, easing: 'ease-in-out', fill: 'forwards'}).finished, wait(ms + 150)]);
  const fit = () => {
    const r = $('stage').getBoundingClientRect();
    $('scene').style.setProperty('--s', Math.min(r.width / 1000, r.height / 620));
  };
  new ResizeObserver(fit).observe($('stage'));

  const st = {i: 0, step: 0, ground: null, hs: [], pts: [], need: [], view: 'signer', lefty: false, done: new Set(), busy: false};

  // ---------- step 1: which stays still ----------
  function load(i) {
    if (st.busy) return;
    const s = SCENES[i];
    Object.assign(st, {i, step: 1, ground: null, hs: [], pts: [], need: [], view: 'signer'});
    $('pic').src = s.img; $('pic').alt = s.t; $('pic-t').textContent = s.t; $('pic-n').textContent = `Picture ${i + 1} of ${SCENES.length}`;
    $('gloss').innerHTML = '';
    viewer(false); draw();
    steps(1);
    $('q').innerHTML = 'Which one <b class="g">stays still</b>? That is the <b class="g">ground</b>. Signers usually set it up first and hold it on the non-dominant hand.';
    $('hs').hidden = true; $('say').textContent = ''; $('say').className = 'say'; acts();
    const opts = [...s.o.map((o, k) => [k, `The ${o.n}`]), ['both', 'They both move']];
    $('opts').replaceChildren(...opts.map(([k, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => pickGround(k);

    }));

  }
  function pickGround(k) {
    const s = SCENES[st.i];
    const ok = s.ground === k || (s.ground === 'either' && k !== 'both');
    if (!ok) {
      $('say').className = 'say warn';
      $('say').innerHTML = s.ground === 'both' ? 'Look again: in this picture <b>both</b> of them are moving. Neither one stays still.'
        : k === 'both' ? `Look again: one of them stays still. Which one doesn't move?`
        : `The ${s.o[k].n} ${s.o[k].move ? 'moves' : 'is the smaller thing, placed on or near the ground'}. The ground is usually bigger and stays still.`;
      return;
    }
    st.ground = k;
    $('say').className = 'say';
    $('say').innerHTML = s.ground === 'both' ? 'Right: both of them move, so each hand shows one of them, and both hands move at once.'
      : s.ground === 'either' ? `Right: both stay still, so either one can be the ground. You chose the ${s.o[k].n}, so set it up first.`
      : `Right: the ${s.o[k].n} stays still. Set it up first.`;
    st.step = 2;
    st.order = s.ground === 'both' ? [0, 1] : [k, ...s.o.map((_, j) => j).filter(j => j !== k)];
    st.h = 0;

  }

  // ---------- step 2: a handshape for each object ----------
  function pickHand() {
    const s = SCENES[st.i], j = st.order[st.h];
    steps(2);
    $('opts').replaceChildren();
    $('q').innerHTML = `Which classifier handshape shows the <b>${s.o[j].n}</b>?`;
    $('hs').hidden = false;
    $('hs').replaceChildren(...Object.entries(HS).map(([k, h]) => {
      const b = document.createElement('button');
      b.innerHTML = `<img src="${h.img}" alt=""><span><b>${h.n}</b><small>${h.use}</small></span>`;
      b.onclick = () => {
        if (k !== s.o[j].hs) { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); $('say').className = 'say warn';
          $('say').innerHTML = `${h.n} is for ${h.use}. Is the ${s.o[j].n} one of those?`; return; }
        st.hs[j] = k;

      return b;
    }));
  }

  // ---------- step 3: place in signing space ----------
  function startPlace() {
    const s = SCENES[st.i];
    // what to place, in order: each object's spot, and an end spot for movers
    st.need = [];
    for (const j of st.order) { st.need.push({j, end: false}); }
    if (s.ground === 'both') st.need = [{j: 0, end: false}, {j: 1, end: false}, {j: 0, end: true}, {j: 1, end: true}];
    else for (const j of st.order) if (s.o[j].move) st.need.push({j, end: true});
    st.pts = []; st.step = 3;
    $('hs').hidden = true; steps(3);
    prompt(); draw(); acts();
  }
  const pointFor = (j, end) => st.need.findIndex(n => n.j === j && n.end === end);
  function prompt() {
    const s = SCENES[st.i], n = st.need[st.pts.length];
    if (!n) return;
    const o = s.o[n.j], isGround = n.j === st.ground;
    $('q').innerHTML = n.end ? `Now tap where the <b>${o.n}</b> ends up.`
      : `Tap in the signing space to place the <b class="${isGround ? 'g' : ''}">${o.n}</b>${s.o[n.j].move ? ' where it starts' : ''}.`;
    $('say').className = 'say';
    $('say').innerHTML = st.pts.length ? $('say').innerHTML : 'You are looking over the signer\'s shoulder, so left and right match the picture.';
  }
  const local = e => {
    const r = $('space').getBoundingClientRect(), k = r.width / 580;
    return {x: Math.max(40, Math.min(540, (e.clientX - r.left) / k)), y: Math.max(60, Math.min(410, (e.clientY - r.top) / k))};
  };
  $('space').addEventListener('pointerdown', e => {
    if (st.step !== 3 || st.busy || st.pts.length >= st.need.length) return;
    st.pts.push(local(e)); st.drag = true; $('space').setPointerCapture(e.pointerId); cue();
    draw();
  });
  $('space').addEventListener('pointermove', e => { if (st.drag) { st.pts[st.pts.length - 1] = local(e); draw(); } else if (st.step === 3 && e.pointerType === 'mouse') cue(local(e)); });

  function check() {

    $('say').innerHTML = s.ground === 'both' ? 'Both hands move at once, each on its own side.' : `The ${s.o[st.ground].n} is set up first and held still while the ${s.o.filter((_, j) => j !== st.ground).map(o => o.n).join(' and ')} ${s.o.some(o => o.move) ? 'moves' : 'is placed'}.`;
    acts([['▶ Play it', play], ['Viewer\'s view', () => viewer(st.view === 'signer'), 'soft'], ['Next picture →', () => load((st.i + 1) % SCENES.length), 'go']]);
    play();
  }

  // ---------- step 4: play, gloss, and the viewer's view ----------

  }

    $('side-r').textContent = on ? 'signer\'s left →' : 'signer\'s right →';
    if (on) { $('say').className = 'say'; $('say').innerHTML = 'Facing the signer, everything is <b>mirrored</b>: what the signer puts on their right, you see on your left. The viewer flips it back in their head.'; }
    draw();
  }
  const X = x => st.view === 'viewer' ? 580 - x : x;

  // ---------- drawing the tokens ----------
  function hand(j, x) {
    const s = SCENES[st.i];
    const dom = st.lefty ? 'left' : 'right', non = st.lefty ? 'right' : 'left';
    if (s.ground === 'both') return x < 290 ? 'left hand' : 'right hand';
    return j === st.ground ? `${non} hand, holds still` : `${dom} hand`;
  }
  function draw() {
    const s = SCENES[st.i], box = $('toks'), g = $('path-g');
    box.replaceChildren(); g.replaceChildren();
    st.pts.forEach((p, k) => {
      const n = st.need[k], t = document.createElement('div');
      t.className = 'tok' + (n.j === st.ground ? ' g' : '') + (n.end ? ' ghost' : '') + (st.view === 'viewer' ? ' mirror' : '');
      t.style.left = X(p.x) + 'px'; t.style.top = p.y + 'px';
      t.dataset.j = n.j; if (n.end) t.dataset.end = 1;
      const h = HS[st.hs[n.j]];
      t.innerHTML = `<img src="${h.img}" alt=""><b>${s.o[n.j].n}${n.end ? ' (end)' : `<br>${hand(n.j, p.x)}`}</b>`;
      box.append(t);
      if (n.end) {
        const a = st.pts[pointFor(n.j, false)];
        const ln = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const mx = (X(a.x) + X(p.x)) / 2, my = Math.min(a.y, p.y) - 40;
        ln.setAttribute('d', `M${X(a.x)},${a.y} Q${mx},${my} ${X(p.x)},${p.y}`);
        ln.setAttribute('fill', 'none'); ln.setAttribute('stroke', '#d4621f'); ln.setAttribute('stroke-width', 4);
        ln.setAttribute('stroke-dasharray', '9 7'); ln.setAttribute('marker-end', 'url(#arrow)');
        g.append(ln);
      }
    });
    $('space').style.cursor = st.step === 3 && st.pts.length < st.need.length ? 'crosshair' : 'default';
  }

  // ---------- panel bits ----------
  function steps(n) {
    [...$('steps').children].forEach((s, k) => { s.classList.toggle('on', k < n - 1); s.classList.toggle('now', k === n - 1); });
    cue();
  }
  // a big cue inside the signing space says what to do next
  function cue(at) {
    const c = $('cue'), s = SCENES[st.i], n = st.need[st.pts.length];
    c.className = 'cue';
    if (st.step === 3 && n && !st.drag) {
      const g = n.j === st.ground, h = HS[st.hs[n.j]];
      c.innerHTML = `<div class="ghost${g ? ' g' : ''}"><img src="${h.img}" alt=""></div><span>Tap here to place the ${s.o[n.j].n}${n.end ? ' where it ends' : s.o[n.j].move ? ' where it starts' : ''}</span>`;
      if (at) { c.classList.add('follow'); const gh = c.firstChild; gh.style.left = (at.x - 30) + 'px'; gh.style.top = (at.y - 40) + 'px'; }
    } else if (st.step < 3) c.innerHTML = `<span>${st.step <= 1 ? 'Step 1: look at the picture, then answer on the right →' : 'Step 2: pick each handshape on the right →'}</span>`;
    else c.innerHTML = '';
  }
  function acts(list = []) {
    $('acts').replaceChildren(...list.map(([label, fn, cls]) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = fn; return b; }));
  }
  function list() {
    $('list').replaceChildren(...SCENES.map((s, k) => {
      const b = document.createElement('button');
      b.textContent = k + 1; b.title = s.t;
      b.setAttribute('aria-label', `Picture ${k + 1}: ${s.t}`);
      b.setAttribute('aria-current', k === st.i); b.classList.toggle('done', st.done.has(k));
      b.onclick = () => load(k);
      return b;
    }));
  }
  $('prev').onclick = () => load((st.i + SCENES.length - 1) % SCENES.length);
  $('next').onclick = () => load((st.i + 1) % SCENES.length);
  $('lefty').onclick = () => { st.lefty = !st.lefty; $('lefty').setAttribute('aria-pressed', st.lefty); draw(); };

  window.__cs = {st, load, pickGround, startPlace, check, play, viewer, draw, SCENES};  // for checking frames
  load(0);
})();
