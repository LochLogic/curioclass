<body>
<header>
  <h1>Input or Output?<small>In, think, out</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-try" aria-pressed="true">☝ Try It</button>
    <button id="m-cover" aria-pressed="false"><span class="note-icon" aria-hidden="true"></span> Cover It</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <aside class="panel">
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="picker" role="group" aria-label="Gadgets">
      <button class="gadget" id="g-tablet" aria-label="Tablet" aria-pressed="true"><img src="art:tablet" alt=""><span class="check">✓</span></button>
      <button class="gadget" id="g-game" aria-label="Game set" aria-pressed="false"><img src="art:game-controller" alt=""><span class="check">✓</span></button>
      <button class="gadget" id="g-speaker" aria-label="Smart speaker" aria-pressed="false">
        <img src="art:puck-speaker" alt=""><span class="check">✓</span></button>
      <button class="gadget" id="g-microwave" aria-label="Microwave" aria-pressed="false">
        <img src="art:microwave-shut" alt=""><span class="check">✓</span></button>
    </div>
    <button class="big-btn gold" id="go">☎ Video call</button>
    <div class="cover-controls" id="cover-controls" hidden>
      <div class="note-row">
        <button class="action" id="sticky" aria-pressed="false"><span class="note-icon" aria-hidden="true"></span> Sticky note</button>
        <button class="action" id="peel">↗ Peel off</button>
      </div>
      <div class="predict" role="group" aria-label="Prediction">
        <button class="guess" id="guess-in" aria-pressed="false"><span class="symbol" aria-hidden="true">▣?</span><span>The gadget can't tell</span></button>
        <button class="guess" id="guess-out" aria-pressed="false"><span class="symbol" aria-hidden="true">👁 👂?</span><span>We can't tell</span></button>
      </div>
    </div>
    <div class="definition"><b>→ Input</b>How a gadget finds things out.<b class="out">Output →</b>How a gadget shows us or does things.</div>
    <p class="pretend">Pretend gadgets. No camera or microphone is used.</p>
  </aside>
  <div class="stage" id="stage">
    <div class="lab" id="lab">
      <h2 class="scene-title" id="gadget-title">Tablet</h2>
      <div class="art-space" id="art-space"></div>
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div class="chip" id="chip"><span class="chip-face">···</span>THINK</div>
      <div class="status" id="status" hidden></div>
      <div class="hits" id="hits"></div>
    </div>
    <section class="board" id="board" aria-label="In, Think, Out board"></section>
  </div>
</main>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ART = {
    tablet:'art:tablet', otter:'art:otter-call', classWave:'art:class-wave', controller:'art:game-controller', tv:'art:game-tv',
    fox:'art:hero-fox', log:'art:game-log', speaker:'art:puck-speaker', open:'art:microwave-open', shut:'art:microwave-shut',

  };
  const L = {
    wTry:"Every gadget takes things in, thinks, and gives things out. Let's look inside!",
    tapPart:'Tap a part to see which way the dots go. Blue dots go in. Orange dots come out.',
    job:'Now press the big gold button to run the whole job.', gadget:'Tap a gadget picture to try another one.',
    wCover:"Let's cover a part with a sticky note and see what happens.", cover:'Tap Sticky note, then tap a part.',
    guess:"Who can't tell now, the gadget or us? Tap The gadget can't tell, or We can't tell. Then press the big gold button.",
    again:'Tap Sticky note to cover a new part, or Peel off to take it away.',
    touchscreen:"Touchscreen. It's an input and an output!", camera:'Camera. Input.', microphone:'Microphone. Input.',
    speaker:'Speaker. Output.', joystick:'Joystick. Input.', jump:'Jump button. Input.',
    motor:'Buzz motor. Output. It shakes the controller.', tv:'TV screen. Output.', volume:'Volume button. Input.',
    ring:'Light ring. Output.', keypad:'Keypad. Input.', door:'Door switch. Input. It feels when the door is shut.',
    display:'Display. Output.', beeper:'Beeper. Output.', light:'Inside light. Output.', heater:'Heater. Output. It warms the food.',
    hello:'Hello!', where:'Where are you?', play:'Play a song.',
    rInput:"You covered an input. The gadget can't find out what it needs, so it's stuck.",
    rOutput:"You covered an output. The gadget still did the job. We just can't see or hear it.",
    rBoth:"The touchscreen is both! Now the tablet can't feel your finger, and we can't see the screen.",
    rDoor:"The microwave can't tell the door is shut, so it won't start. That keeps you safe.",
    rVolume:"The job didn't need that input, so it still worked.", right:'Your guess was right!', look:"Let's look at the dots again.",
    inside:"That part is inside. We can't cover it, but it's an output: it warms the food.",
    all:'You found every part on this gadget!',
    inDefinition:'Input: how a gadget finds things out.', outDefinition:'Output: how a gadget shows us or does things.',
    runHint:'Press the big gold button to run again, or tap a part.', predictHint:'Tap a prediction, then press the big gold button.',
    stickyOn:'Tap a part to cover it with the sticky note.', peeled:'The note is off. Tap Sticky note to cover a part.',
    pickTablet:'Tablet. Tap a part.', pickGame:'Game set. Tap a part.', pickSpeaker:'Smart speaker. Tap a part.',
    pickMicrowave:'Microwave. Tap a part.', selectedIn:"The gadget can't tell. Press the big gold button.",
    selectedOut:"We can't tell. Press the big gold button.", video:'Video call.', jumpJob:'Jump!', soupJob:'Warm the soup.'
  };
  const part = (id,name,kind,icon,asset) => ({id,name,kind,icon,asset});
  const G = {
    tablet:{name:'Tablet',job:'☎ Video call',pick:'pickTablet',asset:ART.tablet,parts:[
      part('touchscreen','Touchscreen','both','◎'),part('camera','Camera','in','📷'),
      part('microphone','Microphone','in','🎤'),part('speaker','Speaker','out','♫')]},
    game:{name:'Game set',job:'↑ Jump!',pick:'pickGame',asset:ART.controller,parts:[
      part('joystick','Joystick','in','✥'),part('jump','Jump button','in','↑'),
      part('motor','Buzz motor','out','',ART.motor),part('tv','TV screen','out','▣')]},
    speaker:{name:'Smart speaker',job:'♫ Play a song',pick:'pickSpeaker',asset:ART.speaker,parts:[
      part('microphone','Microphone','in','🎤'),part('volume','Volume button','in','＋'),
      part('speaker','Speaker','out','♫'),part('ring','Light ring','out','◯')]},
    microwave:{name:'Microwave',job:'♨ Warm the soup',pick:'pickMicrowave',asset:ART.shut,parts:[
      part('keypad','Keypad','in','▦'),part('door','Door switch','in','',ART.switch),
      part('display','Display','out','▣'),part('beeper','Beeper','out','♫'),
      part('light','Inside light','out','☀'),part('heater','Heater','out','',ART.heater)]}
  };
  const ANCHOR = {
    tablet:{touchscreen:[.5,.48],camera:[.5,.04],microphone:[.35,.96],speaker:[.5,.96]},
    game:{joystick:[.32,.78],jump:[.68,.78],motor:[.5,.92],tv:[.5,.24]},
    speaker:{microphone:[.5,.44],volume:[.5,.21],speaker:[.5,.78],ring:[.26,.49]},
    microwave:{keypad:[.86,.62],door:[.18,.48],display:[.86,.28],beeper:[.95,.82],light:[.36,.26],heater:[.66,.15]}
  };
  const state = {mode:'try',gadget:'tablet',running:false,flowHold:false,phase:0,active:null,result:null,token:0,
    started:0,duration:5000,effectUntil:0,jobRuns:0,modes:{try:{},cover:{}}};
  for (const m of ['try','cover']) for (const g of Object.keys(G)) {
    state.modes[m][g]={found:[],note:null,prediction:null,armed:false,result:null};
  }
  const current = () => state.modes[state.mode][state.gadget];
  const gadget = () => G[state.gadget];
  const parts = () => gadget().parts;
  const V = Curio.voice({lines:L,scope:() => state.mode,hint:false,read:() => $('hint').textContent,
    speaks:'.part,#go',welcome:() => state.mode==='try'
      ? [['wTry',{valid:() => !state.running && !state.active}],['tapPart',{valid:() => !state.running && !state.active}]]
      : [['wCover',{valid:() => !current().note}],['cover',{valid:() => !current().note}]]});
  function say(key,valid,opts={}) {return V.say(key,{valid,hint:false,now:true,...opts});}
  function how(key,valid=() => true,needs,now=false) {
    $('hint').textContent=L[key];
    V.how(key,{valid,needs,hint:false,now});
  }
  function waitingHint() {
    if (state.mode==='try') return current().found.length ? 'runHint' : 'tapPart';
    if (current().result) return 'again';
    return current().armed ? 'stickyOn' : current().note ? 'predictHint' : 'cover';
  }
  function stop(hush=true) {
    state.token++;
    state.running=false;
    state.flowHold=false;
    state.active=null;
    state.phase=0;
    state.effectUntil=0;
    if (hush) V.hush();
    else V.dropQueued();
    $('status').hidden=true;
    resetEffects();
    drawWires();
  }
  function clearResult() {current().result=null;
  state.result=null;
  renderBoard();}
  function setMode(mode) {
    if (state.mode===mode) {
      $('hint').textContent=L[waitingHint()];
      if (!V.welcome() && !V.playing) V.how(waitingHint(),{hint:false,valid:() => !state.running});
      return;
    }
    stop();
    state.mode=mode;
    state.result=current().result;
    $('m-try').setAttribute('aria-pressed',mode==='try');
    $('m-cover').setAttribute('aria-pressed',mode==='cover');
    $('cover-controls').hidden=mode!=='cover';
    $('hint').textContent=L[waitingHint()];
    renderDevice();
    renderParts();
    renderBoard();
    updateControls();
    restoreResultScene();
    V.welcome() || V.how(waitingHint(),{hint:false,valid:() => !state.running});
  }
  function restoreResultScene() {
    if (state.mode!=='cover' || !current().result || !current().note) return;
    state.duration=state.gadget==='microwave' ? 5800 : 5000;
    const t=performance.now();
    state.started=t-state.duration;
    state.running=true;
    animateJob(t,true);
    state.running=false;
    state.flowHold=true;
    if (state.gadget==='microwave') $('art-space').classList.remove('micro-on');
    $('status').hidden=true;
    drawWires();
  }
  function chooseGadget(id) {
    stop();
    if (state.gadget!==id) {
      current().note=null;
      current().armed=false;
      current().prediction=null;
      current().result=null;
      state.gadget=id;
      current().note=null;
      current().armed=false;
      current().prediction=null;
      current().result=null;
    }
    state.result=current().result;
    $('hint').textContent=L[waitingHint()];
    renderDevice();
    renderParts();
    renderBoard();
    updateControls();
    restoreResultScene();
    if (state.mode==='try') say(gadget().pick,() => !state.running);
    else V.how('cover',{hint:false,valid:() => !state.running && !current().note,needs:'#sticky'});
    Curio.tone(300,.1,.025);
  }
  function updateControls() {
    for (const id of Object.keys(G)) {
      $('g-'+id).setAttribute('aria-pressed',id===state.gadget);
      $('g-'+id).classList.toggle('found',state.modes.try[id].found.length===G[id].parts.length);
    }
    $('go').textContent=gadget().job;
    $('gadget-title').textContent=gadget().name;
    $('sticky').setAttribute('aria-pressed',current().armed);
    $('guess-in').setAttribute('aria-pressed',current().prediction==='in');
    $('guess-out').setAttribute('aria-pressed',current().prediction==='out');
  }
  function microwaveDoor(closed) {
    $('microwave-art').src=closed ? ART.shut : ART.open;
    $('art-space').dataset.door=closed ? 'shut' : 'open';
  }
  function renderDevice() {
    const s=$('art-space');
    if (state.gadget==='tablet') {
      s.innerHTML=`<img class="device" src="${ART.tablet}" alt="Silver tablet">
        <div class="display tablet-screen" id="screen"><img class="otter" src="${ART.otter}" alt="Otter on a pretend call">
        <span class="hello" id="hello">Hello!</span><div class="class-box" id="class-box" aria-label="Pretend class picture">
        <svg viewBox="0 0 120 70" aria-hidden="true"><g fill="#436b7b">
        <circle cx="24" cy="24" r="10"/><path d="M7 64Q5 35 24 35T42 64Z"/>
        <circle cx="60" cy="20" r="10"/><path d="M43 64Q41 31 60 31T78 64Z"/>
        <circle cx="96" cy="24" r="10"/><path d="M79 64Q77 35 96 35T114 64Z"/></g></svg></div></div>`;
    } else if (state.gadget==='game') {
      s.innerHTML=`<img class="tv" src="${ART.tv}" alt="TV"><div class="display tv-screen" id="screen">
        <div class="ground"></div><img class="fox" id="fox" src="${ART.fox}" alt="Fox game hero">
        <img class="log" src="${ART.log}" alt="Log"></div><img class="controller" id="controller" src="${ART.controller}" alt="Controller">
        <span class="buzz" id="buzz">〰</span>`;
    } else if (state.gadget==='speaker') {
      s.innerHTML=`<img class="device" src="${ART.speaker}" alt="Smart speaker"><div class="ring" id="ring"></div>
        <div class="light-spark" id="light-spark"></div><div class="notes" id="notes">♪ ♫</div>`;
    } else {
      s.innerHTML=`<img class="device" id="microwave-art" src="${ART.open}" alt="Microwave">
        <div class="micro-light" id="micro-light"></div><img class="bowl" id="bowl" src="${ART.bowl}" alt="Soup bowl">
        <div class="micro-time" id="micro-time">0:30</div><div class="steam" id="steam">♨</div>`;
    }
    if (state.gadget==='microwave') microwaveDoor(false);
    layout();
  }
  function renderParts() {
    const old=document.activeElement && document.activeElement.id;
    $('hits').innerHTML=parts().map(p => `<button class="part" id="p-${p.id}" aria-label="${p.name}" title="${p.name}">
      ${p.asset ? `<img class="inside-pic" src="${p.asset}" alt="">` : `<span class="part-icon" aria-hidden="true">${p.icon}</span>`}
      <span>${p.name}</span></button>`).join('');
    for (const p of parts()) $('p-'+p.id).onclick=() => tapPart(p.id);
    if (old && $(old)) $(old).focus({preventScroll:true});
    updateParts(); layout();
  }
  function updateParts() {
    for (const p of parts()) {
      const b=$('p-'+p.id);
      if (!b) continue;
      const found=state.modes.try[state.gadget].found.includes(p.id);
      b.classList.toggle('tried',found);
      b.classList.toggle('untried',!found && state.mode==='try');
      b.classList.toggle('active',state.active===p.id);
      b.classList.toggle('covered',current().note===p.id && state.mode==='cover');
      b.setAttribute('aria-label',p.name+(current().note===p.id && state.mode==='cover' ? ', covered' : ''));
    }
    updateNote();
    syncClockLabels();
  }
  function updateNote() {
    let note=$('physical-note');
    if (state.mode!=='cover' || !current().note) {if (note) note.remove(); return;}
    if (!note) {
      $('art-space').insertAdjacentHTML('beforeend',`<img id="physical-note" class="cover-patch pop" src="${ART.note}" alt="Sticky note covers the part">`);
      note=$('physical-note');
    }
    const id=current().note,a=ANCHOR[state.gadget][id];
    note.style.left=a[0]*100+'%'; note.style.top=a[1]*100+'%';
    const whole=id==='touchscreen' || id==='tv';
    note.style.width=whole ? '94%' : '30%'; note.style.height=whole ? (id==='tv' ? '45%' : '86%') : '30%';
  }
  function tile(p,newId) {
    const img=p.asset || gadget().asset;
    const a=ANCHOR[state.gadget][p.id];
    return `<div class="tile ${p.id===newId ? 'new' : ''} ${p.kind==='both' ? 'both' : ''}" title="${p.name}${p.kind==='both' ? ': both input and output' : ''}">
      <div class="crop" style="background-image:url('${img}');background-size:${p.asset ? 'contain' : '450%'};
        background-position:${a[0]*100}% ${a[1]*100}%"></div>
      <span>${p.name}${p.kind==='both' ? ' ↔' : ''}</span></div>`;
  }
  function renderBoard(newId) {
    const r=current().result;
    if (state.mode==='cover' && r) {
      $('board').innerHTML=`<div class="result" role="status"><span class="result-symbol" aria-hidden="true">${r.symbol}</span>
        <h3>${r.title}</h3><p>${r.detail}</p>${r.prediction ? `<p class="match">${r.match ? '✓ '+L.right : '⌕ Let’s look'}</p>` : ''}</div>`;
      return;
    }
    const found=state.mode==='cover' ? parts() : parts().filter(p => current().found.includes(p.id));
    $('board').innerHTML=`<h3 class="board-title">In, think, out</h3><div class="columns">
      <div class="column in"><h3>IN →<small>(input)</small></h3><div class="tiles">${found.filter(p=>p.kind!=='out').map(p=>tile(p,newId)).join('')}</div></div>
      <div class="column think"><h3>THINK</h3><div class="mini-chip" aria-hidden="true">${found.some(p=>p.kind==='both') ? '↔' : '▦'}</div></div>
      <div class="column out"><h3>→ OUT<small>(output)</small></h3><div class="tiles">${found.filter(p=>p.kind!=='in').map(p=>tile(p,newId)).join('')}</div></div></div>`;
  }
  function syncClockLabels() {
    const time=$('micro-time');
    const button=$('p-display');
    if (!time || !button) return;
    const icon=button.querySelector('.part-icon');
    if (!icon) return;
    const compact=innerWidth<=560 || (innerWidth<=900 && innerHeight<=650);
    const show=compact && !(state.mode==='cover' && current().note==='display');
    icon.textContent=show ? time.textContent : '▣';
    icon.classList.toggle('clock-icon',show);
  }
  let positions=[];
  function layout() {
    const lab=$('lab').getBoundingClientRect();
    if (!lab.width) return;
    const size=innerHeight<=650 || innerWidth<=560 ? 72 : 76;
    const aspect={tablet:620/828,game:1.1,speaker:620/432,microwave:700/447}[state.gadget];
    const artWidth=Math.min(lab.width*.86,lab.height*.78*aspect);
    const artHeight=artWidth/aspect;
    Object.assign($('art-space').style,{inset:'auto',left:(lab.width-artWidth)/2+'px',
      top:(innerWidth>560 && innerWidth<=900 && innerHeight>=700 ? lab.height-artHeight-70
        : (lab.height-artHeight)/2-15)+'px',width:artWidth+'px',height:artHeight+'px'});
    const top=36,bottom=lab.height-(innerWidth<=560 ? 56 : 60)-size,rows=parts().length===6 ? 3 : 2;
    positions=parts().map((p,i) => {
      const col=i%2,row=Math.floor(i/2);
      const y=top+(Math.max(top,bottom)-top)*row/(rows-1);
      const x=col ? lab.width-size-3 : 3;
      const b=$('p-'+p.id);
      if (b) {b.style.left=x+'px'; b.style.top=y+'px';}
      return {id:p.id,x:x+size/2,y:y+size/2};
    });
    drawWires();
    updateNote();
    syncClockLabels();
  }
  function drawWires() {
    const w=$('lab').clientWidth,h=$('lab').clientHeight,cx=w/2,cy=h-36,t=performance.now();
    let svg=`<rect class="cutaway" x="${w*.18}" y="${h*.22}" width="${w*.64}" height="${h*.56}" rx="23"/>`;
    for (const p of parts()) {
      const pos=positions.find(q=>q.id===p.id);
      if (!pos) continue;
      const anchor=ANCHOR[state.gadget][p.id],box=$('art-space');
      const spot={x:box.offsetLeft+anchor[0]*box.offsetWidth,y:box.offsetTop+anchor[1]*box.offsetHeight};
      svg+=`<path class="wire" d="M${pos.x},${pos.y} L${spot.x},${spot.y} L${cx},${cy}"/>`;
      svg+=`<circle cx="${spot.x}" cy="${spot.y}" r="5" fill="#fff" stroke="#497f8e" stroke-width="2"/>`;
      let active=state.active===p.id,output=false;
      if (state.running || state.flowHold) {
        output=state.phase>=(state.gadget==='microwave' ? 800/state.duration : .3) && !blocksJob(current().note);
        active=output ? p.kind!=='in' : p.kind!=='out';
        if (output && blocksJob(current().note)) active=false;
      } else if (active) output=p.kind==='out' || (p.kind==='both' && state.effectUntil-t<1200);
      if (state.running || state.flowHold) $('p-'+p.id).classList.toggle('active',active);
      if (!active) continue;
      const color=output ? '#b8500b' : '#1f5fbf';
      const from=output ? {x:cx,y:cy} : spot,to=output ? spot : {x:cx,y:cy};
      const covered=state.mode==='cover' && current().note===p.id;
      if (covered && !output) {
        svg+=`<circle cx="${spot.x}" cy="${spot.y+30}" r="7" fill="${color}"/>`;
        continue;
      }
      const count=Curio.reduce ? 7 : 4;
      for (let k=0;k<count;k++) {
        const q=Curio.reduce || state.flowHold ? (k+.5)/count : (t/950+k/count)%1;
        if (covered && q>.74) continue;
        const x=from.x+(to.x-from.x)*q,y=from.y+(to.y-from.y)*q;
        svg+=`<circle class="flow-dot" cx="${x}" cy="${y}" r="5.5" fill="${color}" stroke="white" stroke-width="1.5"/>`;
      }
      const dx=to.x-from.x,dy=to.y-from.y,a=Math.atan2(dy,dx),mx=from.x+dx*.56,my=from.y+dy*.56;
      svg+=`<path class="arrow" stroke="${color}" d="M${mx-10*Math.cos(a-.55)},${my-10*Math.sin(a-.55)} L${mx},${my}
        L${mx-10*Math.cos(a+.55)},${my-10*Math.sin(a+.55)}"/>`;
    }
    $('wires').setAttribute('viewBox',`0 0 ${w} ${h}`);
    $('wires').innerHTML=svg;
  }
  function resetEffects() {
    $('art-space').className='art-space';
    for (const id of ['screen','ring','light-spark','notes','micro-time','micro-light','bowl']) if ($(id)) $(id).style.visibility='';
    if ($('fox')) {$('fox').style.left='3%';
    $('fox').style.bottom='12%';}
    if ($('controller')) $('controller').style.transform='';
    if ($('buzz')) $('buzz').style.opacity=0;
    if ($('hello')) $('hello').textContent='Hello!';
    if ($('micro-time')) $('micro-time').textContent='0:30';
    if ($('microwave-art')) microwaveDoor(false);
    if ($('ear-question')) $('ear-question').remove();
    $('chip').className='chip';
    $('chip').innerHTML='<span class="chip-face">···</span>THINK';
    updateParts();
  }
  function tapPart(id) {
    const p=parts().find(p=>p.id===id);
    stop(false); clearResult();
    const token=state.token;
    if (state.mode==='cover') {
      if (!current().armed) {
        $('sticky').classList.add('guide');
        setTimeout(() => $('sticky').classList.remove('guide'),700);
        Curio.tone(330,.1,.025);
        how('cover',() => !current().armed,'#sticky',true);
        return;
      }
      if (id==='heater') {
        say('inside',() => token===state.token);
        $('status').textContent='That part is inside.';
        $('status').hidden=false;
        const b=$('p-heater');
        if (!Curio.reduce) b.animate([{transform:'translateY(0)'},{transform:'translateY(-12px)'},{transform:'translateY(0)'}],350);
        how('stickyOn');
        Curio.tone(260,.15,.03);
        return;
      }
      current().note=id;
      current().prediction=null;
      current().armed=false;
      updateParts();
      updateControls();
      Curio.tone(180,.09,.025,'triangle');
      how('guess',() => !!current().note && !current().prediction && !state.running,['#guess-in','#guess-out','#go'],true);
      return;
    }
    state.active=id;
    state.effectUntil=performance.now()+2500;
    const fresh=!current().found.includes(id);
    if (fresh) current().found.push(id);
    updateParts();
    renderBoard(fresh ? id : null);
    updateControls();
    $('hint').textContent=L[id]+' '+L.job;
    say(id,() => token===state.token);
    Curio.tone(p.kind==='in' ? 450 : 650,.15,.035);
    partEffect(id);
    if (current().found.length===parts().length && fresh) {Curio.yes();
    say('all',() => token===state.token,{now:false});}
    setTimeout(() => {
      if (token!==state.token) return;
      $('hint').textContent=L.job;
      const teaching=p.kind==='both' ? ['inDefinition','outDefinition'] : [p.kind==='in' ? 'inDefinition' : 'outDefinition'];
      V.how([...teaching,'job'],{hint:false,valid:() => token===state.token && !state.running,needs:'#go'});
    },1300);
  }
  function partEffect(id) {
    const s=$('art-space');
    if (state.gadget==='tablet') {
      if (['touchscreen','speaker'].includes(id)) s.classList.add('call-on');
      if (id==='camera') s.classList.add('class-on');
      if (id==='microphone') {$('status').textContent='〰 → ▦';
      $('status').hidden=false;}
      if (id==='speaker') say('hello',() => state.active===id,{now:false});
    } else if (state.gadget==='game') {
      if (id==='tv') $('screen').style.boxShadow='0 0 18px #b8500b';
      if (id==='motor') {$('buzz').style.opacity=1;
      Curio.tone(90,.4,.035,'triangle');}
    } else if (state.gadget==='speaker') {
      if (id==='ring') s.classList.add('ring-on');
      if (id==='speaker') {s.classList.add('music-on');
      Curio.tone(262,.3,.045);}
      if (id==='volume') {s.classList.add('music-on');
      Curio.tone(650,.4,.06);}
    } else {
      if (id==='light') s.classList.add('micro-on');
      if (id==='heater') {microwaveDoor(true); s.classList.add('warm');}
      if (id==='display') $('micro-time').textContent='0:30';
      if (id==='beeper') beep();
      if (id==='door') microwaveDoor(true);
    }
  }
  function blocksJob(note) {
    return !!note && ['touchscreen','joystick','jump','microphone','keypad','door'].includes(note)
      && !(state.gadget==='tablet' && note==='microphone');
  }
  function outcome(note) {
    const p=parts().find(p=>p.id===note);
    if (!p) return null;
    let key=p.kind==='both' ? 'rBoth' : p.kind==='in' ? 'rInput' : 'rOutput';
    if (note==='door') key='rDoor';
    if (note==='volume') key='rVolume';
    const detail={
      touchscreen:"The tablet can't feel the tap. We can't see the call.",camera:'Otter sees a dark square.',
      microphone:state.gadget==='tablet' ? "Your words don't reach Otter." : 'It never heard the song request.',
      speaker:state.gadget==='tablet' ? 'Otter moves, but we hear nothing.' : 'The light is on. The song is silent.',
      joystick:"The fox can't move.",jump:'The fox stops at the log.',motor:'The game works. The controller does not buzz.',
      tv:'The game plays behind the note.',volume:L.rVolume,ring:'The song plays. The listening light is hidden.',
      keypad:"It can't tell how long. It won't start.",door:"It can't tell the door is shut. It won't start.",
      display:'The soup warms. The time is hidden.',beeper:'The soup warms. The finish is silent.',light:'The soup warms. The inside stays dark.'
    }[note];
    const match=p.kind==='both' || current().prediction===p.kind;
    return {key,detail,match,prediction:current().prediction,
      title:p.kind==='both' ? 'Both!' : note==='volume' ? 'It still worked!' : p.kind==='in' ? 'Input covered' : 'Output covered',
      symbol:p.kind==='both' ? '↔' : note==='volume' ? '♪ ✓' : p.kind==='in' ? '→ ▦ ?' : '▦ → ◉'};
  }
  let melodyIndex=-1;
  function runJob() {
    stop(false); clearResult();
    state.running=true;
    state.duration=state.gadget==='microwave' ? 5800 : 5000;
    state.started=performance.now();
    state.phase=0;
    state.jobRuns++;
    melodyIndex=-1;
    $('hint').textContent=L.runHint;
    $('chip').classList.add('lit');
    Curio.tone(390,.12,.03);
    const token=state.token;
    say({tablet:'video',game:'jumpJob',speaker:'play',microwave:'soupJob'}[state.gadget],() => token===state.token && state.running);
    if (state.gadget==='tablet') {
      const key=current().note==='camera' && state.mode==='cover' ? 'where' : 'hello';
      if (!(state.mode==='cover' && ['speaker','touchscreen'].includes(current().note))) {
        setTimeout(() => {if (token===state.token) say(key,() => token===state.token && state.running,{now:false});},1600);
      }
    }
  }
  function beep() {
    const token=state.token;
    for (let i=0;i<3;i++) setTimeout(() => {if (token===state.token) Curio.tone(880,.14,.035);},i*230);
  }
  const tune=[262,262,392,392,440,440,392,349,349,330,330,294,294,262];
  function melody(t) {
    const i=Math.floor((t-state.started-1400)/240);
    if (i>=0 && i<tune.length && i!==melodyIndex) {
      melodyIndex=i;
      Curio.tone(tune[i],i===6 || i===13 ? .4 : .22,.045);
    }
  }
  function animateJob(t,restoring=false) {
    const elapsed=t-state.started;
    state.phase=Math.min(1,elapsed/state.duration);
    const note=state.mode==='cover' ? current().note : null,blocked=blocksJob(note);
    $('chip').classList.toggle('lit',elapsed>700 && !blocked);
    if (blocked && elapsed>750) {$('chip').className='chip stuck';
    $('chip').textContent='?';}
    if (state.gadget==='tablet' && elapsed>1500 && note!=='touchscreen') {
      $('art-space').classList.add('call-on','class-on');
      $('art-space').classList.toggle('dark-camera',note==='camera');
      $('hello').textContent=note==='camera' ? 'Where are you?' : note==='speaker' ? '···' : 'Hello!';
      if (note==='microphone' && !$('ear-question')) {
        $('screen').insertAdjacentHTML('beforeend','<span class="ear-question" id="ear-question">?</span>');
      }
    }
    if (state.gadget==='game') {
      if (elapsed>1100) {
        let q=Math.min(1,(elapsed-1100)/3000);
        if (note==='joystick') q=0;
        if (note==='jump') q=Math.min(.49,q);
        if (Curio.reduce) q=q<.33 ? 0 : q<.66 ? .5 : 1;
        $('fox').style.left=(3+q*70)+'%';
        $('fox').style.bottom=(12+(note==='jump' || note==='joystick' ? 0 : Math.sin(q*Math.PI)*50))+'%';
      }
      $('screen').style.visibility=note==='tv' ? 'hidden' : '';
      const buzz=elapsed>4000 && !blocked && note!=='motor';
      $('buzz').style.opacity=buzz ? 1 : 0;
      if (buzz && !Curio.reduce) $('controller').style.transform=`translateX(${Math.sin(elapsed/25)*3}px)`;
      if (elapsed>4000 && elapsed<4070 && !blocked && note!=='motor') Curio.tone(85,.18,.025,'triangle');
    }
    if (state.gadget==='speaker' && elapsed>1300 && !blocked) {
      $('art-space').classList.add('ring-on','music-on');
      $('ring').style.visibility=note==='ring' ? 'hidden' : '';
      $('light-spark').style.visibility=note==='ring' ? 'hidden' : '';
      $('light-spark').style.left=(50+48*Math.cos(Curio.reduce ? 0 : elapsed/300))+'%';
      $('light-spark').style.top=(31+29*Math.sin(Curio.reduce ? 0 : elapsed/300))+'%';
      $('notes').textContent=note==='speaker' ? '♪♪♪ ▪' : '♪ ♫';
      if (!Curio.reduce) $('notes').style.transform=`translateY(${Math.sin(elapsed/250)*6}px)`;
      if (note!=='speaker') melody(t);
    }
    if (state.gadget==='microwave') {
      microwaveDoor(true);
      $('status').hidden=elapsed>900 || blocked;
      $('status').textContent=elapsed<300 ? '3' : elapsed<600 ? '3 → 0' : '3 → 0 → Start';
      if (!blocked) {
        $('art-space').classList.toggle('micro-on',elapsed>=800);
        const seconds=Math.min(30,Math.max(0,30-Math.floor((elapsed-800)/1000*6)));
        $('micro-time').textContent='0:'+String(seconds).padStart(2,'0');
        syncClockLabels();
        $('micro-time').style.visibility=note==='display' ? 'hidden' : '';
        $('micro-light').style.visibility=note==='light' ? 'hidden' : '';
        $('bowl').style.visibility=note==='light' ? 'hidden' : '';
        if (elapsed>2600 && note!=='light') $('art-space').classList.add('warm');
      }
    }
    if (elapsed>=state.duration && !restoring) finishJob(note);
  }
  function finishJob(note) {
    state.running=false;
    state.flowHold=true;
    const token=state.token;
    if (state.gadget==='microwave' && !blocksJob(note)) {
      $('micro-time').textContent='0:00';
      syncClockLabels();
      $('art-space').classList.remove('micro-on');
      if (note!=='beeper') beep();
    }
    if (state.gadget==='game' && note==='tv' && !blocksJob(note)) Curio.tone(660,.25,.04);
    if (state.mode==='cover' && note) {
      const r=outcome(note);
      current().result=r;
      state.result=r;
      renderBoard();
      $('hint').textContent=L.again;
      if (r.prediction) {
        if (r.match) Curio.yes();
        say([r.match ? 'right' : 'look',r.key],() => token===state.token && current().result===r);
      } else say(r.key,() => token===state.token && current().result===r);
      V.how('again',{hint:false,valid:() => token===state.token && !!current().result,needs:['#sticky','#peel']});
    } else {
      $('hint').textContent=L.gadget;
      V.how('gadget',{hint:false,valid:() => token===state.token && !state.running});
    }
  }
  $('m-try').onclick=() => setMode('try');
  $('m-cover').onclick=() => setMode('cover');
  for (const id of Object.keys(G)) $('g-'+id).onclick=() => chooseGadget(id);
  $('go').onclick=runJob;
  $('sticky').onclick=() => {
    const armed=!current().armed;
    stop(false); clearResult();
    current().armed=armed;
    updateParts();
    updateControls();
    how(armed ? 'stickyOn' : waitingHint(),() => !state.running,undefined,true);
    Curio.tone(300,.1,.025);
  };
  $('peel').onclick=() => {
    stop(false); clearResult();
    current().note=null;
    current().prediction=null;
    current().armed=false;
    updateParts();
    updateControls();
    how('peeled',() => !current().note,undefined,true);
    Curio.tone(430,.1,.025);
  };
  for (const kind of ['in','out']) $('guess-'+kind).onclick=() => {
    stop(false); clearResult();
    current().prediction=kind;
    updateParts();
    updateControls();
    how(kind==='in' ? 'selectedIn' : 'selectedOut',() => current().prediction===kind,'#go',true);
    Curio.tone(kind==='in' ? 440 : 550,.1,.025);
  };
  let lastFrame=0;
  function frame(t) {
    if (state.running) animateJob(t);
    if (state.active && t>state.effectUntil) {
      state.active=null;
      updateParts();
      drawWires();
    }
    if (state.active && state.gadget==='game') {
      const q=Math.max(0,Math.min(1,1-(state.effectUntil-t)/2500));
      if (state.active==='joystick') $('fox').style.left=(3+q*30)+'%';
      if (state.active==='jump') {
        $('fox').style.bottom=(12+(Curio.reduce ? (q<.33 ? 0 : q<.66 ? 45 : 0) : Math.sin(q*Math.PI)*45))+'%';
      }
      if (state.active==='motor' && !Curio.reduce) $('controller').style.transform=`translateX(${Math.sin(t/25)*3}px)`;
    }
    if (t-lastFrame>35 && (state.running || state.flowHold || state.active || lastFrame===0)) {drawWires(); lastFrame=t;}
    requestAnimationFrame(frame);
  }
  Curio.init({clips:"voice:*",rate:.9});
  Curio.onMotion(drawWires);
  new ResizeObserver(layout).observe($('lab'));
  window.__tool={state,setMode,chooseGadget,tapPart,runJob,outcome,blocksJob,G,L,allLines:V.allLines,vlog:V.log,
    get vq() {return V.queue;}};
  renderDevice();
  renderParts();
  renderBoard();
  updateControls();
  $('hint').textContent=L.tapPart;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
