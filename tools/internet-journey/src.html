<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Journey · Where does a message go? · Curio Class</title>
<meta name="description" content="Follow a party invite as it breaks into eight numbered pieces, hops from your tablet through Wi-Fi, an internet provider, routers and a message app's server to a friend's tablet, and see where every copy, and every private detail you added, ends up. Grade 3 computer science. Works offline.">
<!--
Internet Journey (Curio Class)
Grade 3, computer science, How We Use the Internet (Systems and Security). Standards: CSTA 2026 E3-SYS-NT-14,
E3-SYS-SE-13, E3-SYS-IM-15; CSTA 2017 1B-NI-04 (packets sent through many devices and reassembled) and 1B-NI-05
(protecting personal information).
Students or the teacher drive. Story: seven chapters ride along with an invite to Juno, one choice at each stop, and an
ending board showing where copies live. Trip map: tap any stop, send a test message, close a road and watch it reroute.
Facts: Khan Academy, "The Internet: Packets, routing and reliability"; Cloudflare Learning Center, "What is routing?" and
"What is HTTPS?"; FTC Consumer Advice, "Are Public Wi-Fi Networks Safe?" and "Kids and Socializing Online"; Common Sense
Education, "Private and Personal Information"; NANPA (555-0100 to 555-0199 are for fiction). Story, names and places are
original to Curio Class. The map, icons, envelopes and invite photos are drawn in code (kit/network.js).
One file, no network requests, nothing stored. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>

/* Layout (picked in script, relayout(), as in collision-lab):

   its real pixel size, so labels keep their size in every box. */

main>.panel{grid-column:2;grid-row:1}
main>.stage{grid-column:1;grid-row:1}
.stage{min-height:0;background:linear-gradient(var(--sky1),var(--sky2))}
#town{position:absolute;left:0;top:0;width:56%;height:100%;object-fit:cover;object-position:30% 60%;opacity:.7;pointer-events:none;

<body>
<header>
  <h1>Internet Journey <small>Where does a message go?</small></h1>

    <button id="m-story" aria-pressed="true">Story</button>
    <button id="m-map" aria-pressed="false">Trip map</button>

</header>
<main>
  <aside class="panel" id="panel">
    <section class="sec" id="storyP" data-modes="story">
      <p class="chap" id="chap"></p>

        <button class="big-btn gold" id="again">↻ Try other choices</button>

      </div>

      <div id="boardSlot"></div>
      <div id="hintSlotS"></div>

  const $ = id => document.getElementById(id);

    afterChoice(ch);
    return true;
  }

  // ======================================================================================
  // The story's beats
  // ======================================================================================
  const posFor = (ch, ph) => {
    const all = v => Array(8).fill(v), half = (a, b) => [a, a, a, a, b, b, b, b];
    const moved = ph === 'moving' || ph === 'next';
    if (ch === 1) return all('you');
    if (ch === 2) return moved ? all('ispA') : all('you');
    if (ch === 3) return moved ? half('srv', 'ispA') : all('ispA');
    if (ch === 4) return moved ? all('srv') : half('srv', 'ispA');
    if (ch === 5 || (ch === 6 && ph === 'intro')) return all('srv');
    return all('slot');
  };
  // put every piece where this chapter and phase leave it (after an interruption, or on a redraw)
  function settle() {
    const pos = posFor(state.ch, state.phase);
    gStory.node('rA').up = state.ch < 4;
    state.copy = state.ch >= 5;
    state.look = state.ch > 6 || (state.ch === 6 && state.phase !== 'intro');
    gStory.node('hot').hidden = state.ch < 2;
    gStory.node('maps').hidden = !state.look;
    state.trail = new Set(trailFor(state.ch, state.phase));
    state.flying.clear();
    state.pieces.forEach((p, i) => { if (pos[i] === 'slot') { p.slot = true; p.at = 'juno'; } else { p.slot = false; p.at = pos[i]; } });
  }
  function trailFor(ch, ph) {
    const t = [];
    const moved = ph === 'moving' || ph === 'next';
    const add = (...ids) => { for (let i = 1; i < ids.length; i++) t.push(net.key(ids[i - 1], ids[i])); };
    if (ch > 2 || (ch === 2 && moved)) add('you', state.choices[2] === 'B' ? 'hot' : 'home', 'ispA');
    if (ch > 3 || (ch === 3 && moved)) add('ispA', 'rA', 'srv');
    if (ch > 4 || (ch === 4 && moved)) add('ispA', 'rB', 'srv');
    if (ch > 6 || (ch === 6 && ph !== 'intro')) add('srv', 'rC', 'ispB', 'home2', 'juno'), add('srv', 'rD', 'ispB'), add('ispB', 'maps');
    return t;
  }

  async function openChapter(n, opts = {}) {
    const r = ++run;
    state.ch = n; state.phase = n === 7 ? 'end' : 'intro'; state.resOut = 0;
    if (n === 7) state.boardDone = false;
    settle();
    if (n === 4) gStory.node('rA').up = true;   // it closes in the opening beat
    renderPanel(); refresh();
    // a waiting how-to ("Press Next") has had its moment; story lines still queued (a result, Juno's question) are
    // never cut, so the chapter line waits its turn behind them
    V.dropQueued(x => x.kind === 'how');
    const cutHow = V.playing === L.next && !V.queue.length;   // "Press Next" still playing: it has had its moment
    if (n < 7) V.say(L.ch[n], {key: 'ch' + n, valid: () => state.ch === n && story(), hint: false, now: cutHow});
    await panTo(CH_STOP[Math.min(n, 6)], !opts.instant);
    if (!alive(r)) return;
    if (n === 4) {   // pieces 1 to 4 have passed; now Router A closes
      await pause(600); if (!alive(r)) return;
      gStory.node('rA').up = false; view.update(); renderStage();
      Curio.tone(330, .25, .04, 'triangle');
      live('Router A is closed.');
      await pause(500); if (!alive(r)) return;
    }
    if (n === 6) {   // the pieces cross the second half: odd by Router C, even by Router D; then Juno looks up the way
      await travel6(r); if (!alive(r)) return;
      await lookUp(r); if (!alive(r)) return;
    }
    if (n === 7) {
      renderStage();
      const e = ending();
      await pause(250 + (e.rows.length + 1) * 420); if (!alive(r)) return;
      V.say(e.line, {key: 'end', valid: () => state.ch === 7 && story(), hint: false});
      V.how('again', {needs: '#again', valid: () => state.ch === 7});
      if (lostFocus()) $('again').focus({preventScroll: true});
      return;
    }
    state.phase = 'choose';
    renderPanel(); renderStage();
    if (lostFocus()) focusFirstCard();
  }
  // a panel button that had focus went away (Next hid, a card was disabled): keyboard users keep their place. Nothing
  // moves focus on load, or when focus was somewhere else (the header, the map, the host page around an embed)
  let panelFocus = false;
  document.addEventListener('focusin', e => { panelFocus = !!(e.target.closest && e.target.closest('#panel')); });
  const lostFocus = () => panelFocus && (!document.activeElement || document.activeElement === document.body);
  // chapter 6: Juno asks a map website the way; a question goes out and the answer comes back (E3-SYS-NT-14)
  async function lookUp(r) {
    state.look = true;
    gStory.node('maps').hidden = false; view.update();
    renderPanel(); renderStage();
    V.say(L.look, {key: 'look', valid: () => state.ch === 6 && story(), hint: false});
    live(L.look);
    await pause(500); if (!alive(r)) return;
    const hops = ['juno', 'home2', 'ispB', 'maps'];
    await net.send(sv, gStory, {seq: '?', at: 'juno', dst: 'maps'}, hops, {speed: speedStory / T, token: 'numbered', onHop: id => { state.trail.add(net.key(prevOf(hops, id), id)); renderStage(); }});
    if (!alive(r)) return;
    Curio.tone(660, .12, .03);
    await net.send(sv, gStory, {seq: 'map', at: 'maps', dst: 'juno'}, [...hops].reverse(), {speed: speedStory / T, token: 'envelope'});
    if (!alive(r)) return;
    Curio.tone(780, .15, .03);
    live('The answer came back: the way to the party.');
    V.say(L.ask6, {key: 'ask6', valid: () => state.ch === 6 && story(), hint: false});
    await pause(300);
  }

  async function afterChoice(ch) {
    const r = run;
    state.phase = 'moving';
    if (ch === 1) cutInvite();
    Curio.tone(ch === 1 ? 600 : 560, .15, .035);
    let resP = null, isOut = false;
    const out = () => { if (isOut || !alive(r)) return; isOut = true; state.resOut = ch; resP = sayResult(ch); renderPanel(); renderStage(); };
    if (!(ch === 4 && state.choices[4] === 'A')) out();   // 4A: said when the pieces bounce
    renderPanel(); renderStage();
    await pause(ch === 1 ? 900 : 600); if (!alive(r)) return;
    if (ch === 2) await moveAll(r, [1, 2, 3, 4, 5, 6, 7, 8], ['you', state.choices[2] === 'B' ? 'hot' : 'home', 'ispA']);
    else if (ch === 3) await moveAll(r, [1, 2, 3, 4], ['ispA', 'rA', 'srv']);
    else if (ch === 4) {
      if (state.choices[4] === 'A') {
        // each piece goes on by Router B as soon as it bounces back, so A lands about one bounce (2 s) after B
        await Promise.all([5, 6, 7, 8].map((s, i) => (async () => {
          await fly(r, s, ['ispA', 'rA'], i * 250, {onDown: 'bounce', onBounce: () => { bouncedTag(); out(); }});
          if (alive(r)) await fly(r, s, ['ispA', 'rB', 'srv'], 0);
        })()));
        if (!alive(r)) return;
        out();
      } else await moveAll(r, [5, 6, 7, 8], ['ispA', 'rB', 'srv']);
    } else if (ch === 5) {
      await pause(400); if (!alive(r)) return;
      Curio.tone(700, .2, .03);
      await pause(700);
    } else if (ch === 6) {
      await pause(300);
      if (state.choices[6] === 'B') { drawPhones(); Curio.tone(440, .2, .03); }
      await pause(700);
    }
    if (!alive(r)) return;
    out();
    // Next shows once the result has been heard (Sound on), so a quick Next never drops it; at most 30 s of real time
    if (resP) { await Promise.race([resP, wait(30000)]); if (!alive(r)) return; }
    state.phase = 'next';
    renderPanel(); renderStage();
    if (lostFocus()) $('next').focus({preventScroll: true});
    V.how('next', {needs: '#next', valid: () => state.ch === ch && state.phase === 'next'});
  }
  // the result line: it waits behind the chapter's own line (or the welcome) and cuts in on anything else, so
  // neither the chapter line nor the result is lost. Returns a promise for its end when it will be spoken.
  function sayResult(ch) {
    const mine = new Set([L.wStory, L.ch[1], L.ch[ch], L.look, L.ask6]);
    const busy = (V.playing && mine.has(V.playing)) || V.queue.some(x => mine.has(x.text));
    V.dropQueued(x => !mine.has(x.text));
    live(resultLine(ch));
    const p = V.say(resultLine(ch), {key: 'res', valid: () => state.ch === ch && story(), hint: false, now: !busy, wait: true});
    return Curio.sound && V.tapped ? p : null;
  }
  // move a group of pieces along hops, 250 ms apart
  async function moveAll(r, seqs, hops) {
    await Promise.all(seqs.map((s, i) => fly(r, s, hops, i * 250)));
  }
  async function fly(r, seq, hops, delay, o = {}) {
    if (delay) { await pause(delay); if (!alive(r)) return 'stopped'; }
    const p = state.pieces[seq - 1];
    state.flying.add(seq); renderStage();
    const res = await net.send(sv, gStory, {seq, at: hops[0], dst: hops[hops.length - 1]}, hops,
      {speed: speedStory / T, token: 'envelope', onHop: (id, pk) => { state.trail.add(net.key(prevOf(hops, id), id)); p.at = id; renderStage(); }, ...o});
    if (!alive(r)) return 'stopped';
    state.flying.delete(seq);
    p.at = res === 'bounced' ? hops[0] : hops[hops.length - 1];
    renderStage();
    return res;
  }
  const prevOf = (hops, id) => hops[hops.indexOf(id) - 1];
  function bouncedTag() {
    // with Motion off there is no shake: a "bounced" tag shows for 1 s instead
    if (!Curio.reduce || $('bounced')) return;
    const p = view.pos('rA'), t = document.createElement('div');
    t.className = 'tag'; t.id = 'bounced'; t.textContent = 'bounced';
    t.style.left = Math.round(p.x - state.ui.pan + view.R + 4) + 'px'; t.style.top = Math.round(p.y - view.R - 4) + 'px';
    $('stage').appendChild(t);
    setTimeout(() => t.remove(), 1000);
  }
  // chapter 6: odd pieces by Router C, even by Router D; they land 1, 3, 5, 7, 2, 4, 6, 8 and slide into slots
  async function travel6(r) {
    state.pieces.forEach(p => { p.slot = false; p.at = 'srv'; });
    state.landOrder = [];
    renderStage();
    await Promise.all(state.pieces.map((p, i) => (async () => {
      const hops = p.seq % 2 ? ['srv', 'rC', 'ispB', 'home2', 'juno'] : ['srv', 'rD', 'ispB', 'home2', 'juno'];
      const res = await fly(r, p.seq, hops, i * 250);
      if (res !== 'arrived' || !alive(r)) return;
      state.landOrder.push(p.seq);
      await slide(r, p, state.pieces);
    })()));
    if (!alive(r)) return;
    Curio.yes();
    live('All 8 pieces are in order. The invite reads whole on Juno\'s tablet.');
    renderStage();
    await pause(600);
  }
  // a landed piece slides from the tablet into its numbered slot (Motion off: it jumps, same time)
  async function slide(r, p, list) {
    state.flying.add(p.seq);
    const tok = net.token(view, 'envelope', String(p.seq));
    const from = view.pos('juno'), s = slotPos(p.seq - 1), to = {x: s.x + s.sz / 2, y: s.y + s.sz / 2};
    net.place(tok, from.x, from.y);
    Curio.tone(620 + p.seq * 40, .14, .03);
    const dur = 320 * T, t0 = performance.now();
    if (Curio.reduce) await wait(dur);
    else await new Promise(res => { const st = () => { const f = Math.min(1, (performance.now() - t0) / dur); net.place(tok, from.x + (to.x - from.x) * f, from.y + (to.y - from.y) * f); f < 1 ? requestAnimationFrame(st) : res(); }; st(); });
    tok.remove();
    state.flying.delete(p.seq);
    if (r !== null && !alive(r)) return;
    p.slot = true; p.at = 'juno';
    renderStage();
  }

  function startOver() {
    run++; V.hush(); net.stop(sv);
    state.choices = {}; state.pieces = []; state.flying.clear(); state.trail.clear(); state.step1 = 0; state.boardDone = false;
    gStory.node('rA').up = true;
    view && view.update();
    openChapter(1);
    if (panelFocus) focusFirstCard();
  }
  $('send').onclick = () => { if (state.ch === 1 && state.phase === 'choose' && !$('send').disabled) afterChoice(1); };
  $('next').onclick = () => { if (state.phase === 'next' && state.ch < 7) openChapter(state.ch + 1); };
  $('restart').onclick = startOver;
  $('again').onclick = startOver;
  $('toMap').onclick = () => setMode('map');

  // ======================================================================================
  // Trip map
  // ======================================================================================
  function pickStop(id) {
    if (story()) return;
    state.map.sel = id; state.map.env = null;
    const n = gMap.node(id);
    const card = $('stopcard');
    card.className = 'stopcard';
    card.innerHTML = `<span class="ico">${net.icon(n.kind, 40, '#241b33')}</span><h2>${esc(n.label)}${n.up ? '' : ' (closed)'}</h2><p>${esc(STOPCARD[id])}</p>`;
    Curio.tone(600, .1, .025);
    renderStage();
  }
  function showEnvelope(pk) {
    state.map.env = pk.seq;
    const card = $('stopcard');
    card.className = 'stopcard';
    card.innerHTML = `<span class="ico" aria-hidden="true"><svg viewBox="0 0 40 30" width="40" height="30"><rect x="1" y="1" width="38" height="28" rx="3" fill="#fff8e1" stroke="#241b33" stroke-width="2"/><path d="M1 2l19 14L39 2" fill="none" stroke="#241b33" stroke-width="2"/></svg></span>` +
      `<h2>Piece ${pk.seq} of ${pk.of}</h2><div class="env" style="grid-column:1/-1"><span><b>To:</b> Juno, through the message app</span><span></span><span><b>From:</b> Your tablet</span><span></span></div>` +
      `<p style="display:flex;gap:8px;align-items:center"><svg viewBox="0 0 24 26" width="26" height="28" aria-hidden="true"><rect x="2" y="11" width="20" height="14" rx="3" fill="#f2c14e" stroke="#241b33" stroke-width="2"/><path d="M6 11V7a6 6 0 0 1 12 0v4" fill="none" stroke="#241b33" stroke-width="2.4"/></svg>` +
      `<span>The words inside are locked. Routers read only the outside.</span></p>`;
  }
  // "Hello Juno!" in 8 letter groups (2, 2, 2, 1, 1, 1, 1, 1 letters)
  function helloPieces() {
    const s = 'Hello Juno!', sizes = [2, 2, 2, 1, 1, 1, 1, 1], out = []; let i = 0;
    sizes.forEach((n, k) => { out.push({seq: k + 1, of: 8, src: 'you', dst: 'juno', data: s.slice(i, i + n)}); i += n; });
    return out;
  }
  async function sendTest() {
    if (story()) return;
    const id = ++state.map.testId, m = state.map;
    net.stop(sv); V.dropQueued(x => x.key === 'landed');
    state.flying.clear();
    m.word = 'Hello Juno!';
    m.pieces = helloPieces().map(p => ({...p, at: 'you', slot: false}));
    state.trail.clear();
    m.route = net.path(gMap, 'you', 'juno', {by: 'ms'});
    const toSrv = net.path(gMap, 'you', 'srv', {by: 'ms'});
    const fromSrvEven = net.path(gMap, 'srv', 'juno', {by: 'ms', avoid: n => n.id === 'rC'});
    m.routeEven = toSrv && fromSrvEven ? [...toSrv, ...fromSrvEven.slice(1)] : null;
    m.testing = true; m.landed = [];
    renderStage();
    Curio.tone(560, .12, .03);
    const speed = (m.speed === 'slow' ? .5 : 1) / T;
    const ok = () => state.map.testId === id && !story();
    await Promise.all(m.pieces.map((p, i) => (async () => {
      await pause(i * 250); if (!ok()) return;
      const hops = p.seq % 2 ? m.route : m.routeEven;
      state.flying.add(p.seq); renderStage();
      const pk = {seq: p.seq, of: 8, at: 'you', dst: 'juno'};
      const tok = net.token(view, 'envelope', String(p.seq), {aria: `Piece ${p.seq} of 8: look inside`, onPick: t => { if (t.__pkt) { Curio.tone(640, .1, .025); showEnvelope(t.__pkt); } }}); tok.__pkt = pk;
      const res = await net.send(sv, gMap, pk, hops, {speed, token: tok, onHop: (nid) => {
        state.trail.add(net.key(prevOf(hops, nid), nid)); p.at = nid; renderStage();
        if (p.seq === 1 && state.ui.windowed && !drag) panTo([nid]);   // a narrow map follows the first piece
      }});
      if (!ok()) return;
      state.flying.delete(p.seq);
      if (res !== 'arrived') { p.at = pk.at; renderStage(); return; }
      m.landed.push(p.seq);
      await slide(null, p, m.pieces);
    })()));
    if (!ok()) return;
    m.testing = false;
    renderStage();
    Curio.yes();
    m.tests = (m.tests || 0) + 1;
    V.say('landed', {valid: () => state.map.testId === id && !story(), hint: false});
    // then the next thing to try: look inside a moving piece (said once), or close a road
    if (!V.said.has('peek')) V.how(L.h.peek, {key: 'peek', needs: '#test', valid: () => !story()});
    else hint(m.closed ? L.h.peek : L.h.road);
  }
  $('test').onclick = sendTest;
  $('road').onclick = () => {
    const m = state.map;
    m.closed = !m.closed;
    gMap.node('rA').up = !m.closed;
    $('road').setAttribute('aria-pressed', m.closed);
    $('road').textContent = m.closed ? '⛔ Open the road' : '⛔ Close a road';
    view.update(); renderStage();
    if (m.sel === 'rA') pickStop('rA');
    Curio.tone(m.closed ? 330 : 520, .2, .035, 'triangle');
    if (m.closed) V.how('closed', {needs: '#test', valid: () => state.map.closed});
    else hint(L.wMap);
  };
  for (const sp of ['slow', 'quick']) $('sp-' + sp).onclick = () => {
    state.map.speed = sp;
    for (const k of ['slow', 'quick']) $('sp-' + k).setAttribute('aria-pressed', k === sp);
  };

  // ======================================================================================
  // Modes
  // ======================================================================================
  function refresh() { relayout(true); }
  function setMode(m) {
    if (m === state.mode && view) return;
    V.hush();
    run++; net.stop(sv);
    state.flying.clear();
    if (state.mode === 'story') {   // leaving Story: finish the beat in progress, so coming back shows the chapter as it ends
      if (state.phase === 'intro') state.phase = 'choose';
      if (state.phase === 'moving') { state.phase = 'next'; state.resOut = state.ch; }
      settle();
    } else {
      state.map.testing = false; state.map.testId++;
      state.map.pieces.forEach(p => { if (!p.slot) p.at = null; });
    }
    state.mode = m;
    document.body.dataset.mode = m;
    for (const k of ['story', 'map']) $('m-' + k).setAttribute('aria-pressed', k === m);
    if (m === 'story') { state.trail = new Set(trailFor(state.ch, state.phase)); }
    else { state.trail.clear(); state.map.pieces = []; }
    renderPanel();
    lastSize = ''; relayout(true);
    if (m === 'map') { hint(V.said.has('peek') ? (state.map.closed ? L.h.peek : L.h.road) : L.wMap); V.welcome(); }
    else {
      V.welcome();
      // the chapter line the switch cut off, told again (stop 1's comes with the welcome on a first visit)
      if (state.ch < 7 && state.phase === 'choose' && !(state.ch === 1 && !V.said.has('ch1')))
        V.say(state.ch === 6 ? L.ask6 : L.ch[state.ch], {key: state.ch === 6 ? 'ask6' : 'ch' + state.ch, valid: () => story(), hint: false});
    }
  }
  $('m-story').onclick = () => setMode('story');
  $('m-map').onclick = () => setMode('map');

  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => { relayout(); if (story()) renderPanel(); });

  Curio.init({clips: "voice:*", rate: .95});
  Curio.onMotion(() => renderStage());

  // tests and frames: the state, the engine, the story's moves
  window.__tool = {
    state, net, setMode, choose, ending, allLines: V.allLines, vlog: V.log, get vq() { return V.queue; },
    gStory, gMap, L, openChapter, startOver, sendTest, pickStop,
    next: () => $('next').click(), send: () => $('send').click(),
    timeScale: k => { T = k; }, layout: () => ({...state.ui}), hint: () => $('hint').textContent,
  };
  state.mode = 'story';
  document.body.dataset.mode = 'story';
  relayout(true);
  renderPanel();
  openChapter(1, {instant: true});
})();
</script>
</body>
</html>
