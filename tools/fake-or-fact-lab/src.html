<title>Fake or Fact Lab · Read inside, then read outside · Curio Class</title>
<meta name="description" content="Test six made-up pages and posts twice: first call each one from the page alone, then leave it and search what the rest of a made-up web says. Your lab table shows which read matched the fact-checkers. Grades 6-8 library and research. Works offline.">
<!--
Fake or Fact Lab (Curio Class)
Grades 6-8, library and research, module Is It Reliable? (Research). Standards: AASL Curate IV.B.3, AASL Engage VI.A.3,
C3 D3.2.6-8, CCSS W.6.8, W.7.8, W.8.8.
Students on laptops (alone or in pairs), or a teacher on a projector with a class vote at each verdict. Modes: Lab
(six specimens, each tested twice: an inside read of the page alone, then an outside read in new tabs) and Report
(the lab table, the two match counts and the Stanford lateral reading finding).
Facts: Wineburg and McGrew (2019), Teachers College Record 121(11) (fact-checkers read laterally and judged more
accurately); Digital Inquiry Group, Civic Online Reasoning (the three questions); Caulfield, SIFT (2019); ICANN
Registration Data Lookup (what a domain lookup shows); National Park Service, Denali, "Amphibians" (wood frogs freeze
solid and thaw in spring). Every site, person, post, study and organization is made up for Curio Class; every address
is a reserved name (.example, example.org). The verdict match rule and the three-verdict scale are the tool's own.
Uses the fact-check family engine (kit:fact-check, docs/families/fact-check.md).
Photos generated with FLUX (no people). Browser, pages, logos, avatars, jars and the table are drawn in code.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->

<style>

/* Three page layouts, picked in script (relayout()):

           panel, tray, browser). */
body.wide,body.compact{height:100vh;overflow:hidden}
main{min-height:0}
body.wide main{grid-template-columns:minmax(0,1fr) 360px}

body.wide .stage,body.compact .stage{grid-column:1;grid-row:1}
body.wide .panel,body.compact .panel{grid-column:2;grid-row:1}
body.stack{height:auto}
body.stack main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:start}
body.stack .stage{grid-row:1}
body.stack .panel{grid-row:2;border-left:0;border-top:3px solid var(--line);overflow:visible}

body.compact .icon-btn,body.compact .seg{flex:none}

.seg button svg{vertical-align:-3px;margin-right:4px}

/* ---------- panel ---------- */
.panel{gap:10px}
.hint{margin:0;min-height:calc(3 * 1.45em)}

.nbchip{display:none;border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:12px;min-height:44px;padding:0 10px;font-weight:800;font-size:14px;align-items:center;gap:6px}

body.compact .vlbl{display:none}
.verdict{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:4px 12px;font-weight:700;font-size:16px;text-align:left;line-height:1.2}

body.stack .verdict .vs{width:24px;height:24px;font-size:15px}
body.stack .verdict kbd{display:none}
.vrow{display:flex;flex-direction:column;gap:6px}
#lock,#next{display:flex;align-items:center;justify-content:center;gap:10px;flex:none}

.subrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#lock svg{flex:none}
body.compact #lock,body.compact #next{min-height:48px;font-size:17px}
.btn{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- stage ---------- */
.stage{background:var(--bench);min-height:0;display:flex;flex-direction:column}

body.compact .fc-body{padding:6px 14px 20px}

<header>
  <h1>Fake or Fact Lab <small>Read inside. Then read outside.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-lab" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 2h6M8 2v6L3 17h14L12 8V2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M5.5 13h9" stroke="currentColor" stroke-width="2"/></svg>Lab</button>
    <button id="m-report" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 8h16M2 12.5h16M8 3v14" stroke="currentColor" stroke-width="1.8"/></svg>Report</button>

      Curio.yes();
      V.dropQueued();          // the Pass 2 how lines no longer apply; the result the student just earned plays next
      V.say('expert', {valid: () => state.mode === 'lab' && state.spec === s && curPass() === 3});
      $('next').focus({preventScroll: true});
    }
  }
  function retest() {
    const s = state.spec;
    if (!state.first[s] && passOf(s) === 3) state.first[s] = {c1: fc.callOf(s, 1), c2: fc.callOf(s, 2)};   // keep the first try
    fc.clear(s);
    state.sessions[s] = null;
    save();
    openSpec(s, true);
    V.welcome();
  }
  function nextSpec() {
    const i = IDS.indexOf(state.spec);
    const nx = [...IDS.slice(i + 1), ...IDS.slice(0, i)].find(s => passOf(s) !== 3);
    if (!nx) { setMode('report'); $('m-report').focus({preventScroll: true}); return; }
    openSpec(nx);
    const b = $('jar-' + nx); if (b) b.focus({preventScroll: true});
  }

  const vchip = v => h('span', {class: 'vchip ' + v}, h('i', {'aria-hidden': 'true'}, VERDICT[v].sym), VERDICT[v].word);
  const match = (v, e) => v === e ? h('span', {class: 'mt yes'}, 'Matches') : h('span', {class: 'mt no'}, "Doesn't match");
  const secs = n => n + ' s';
  const tabsW = n => n === 1 ? '1 tab' : n + ' tabs';

  function drawPass() {
    const p = curPass(), el = $('pass');
    el.className = 'pass p' + p;
    const ic = FC.icon(p === 1 ? 'inside' : p === 2 ? 'search' : 'evidence', 18);
    const short = state.layout === 'compact';
    if (p === 3) { el.replaceChildren(ic, short ? 'Tested' : 'Tested: both passes'); return; }
    if (p === 1) el.replaceChildren(ic, short ? 'Pass 1: Inside' : 'Pass 1: Inside read', h('small', {}, 'Inside'));
    else if (p === 2) el.replaceChildren(ic, short ? 'Pass 2: Outside' : 'Pass 2: Outside read', h('small', {}, 'Outside'));
    else el.replaceChildren(ic, 'Tested: both passes');
  }
  function drawPanel() {
    const lab = state.mode === 'lab';
    $('labPanel').style.display = lab ? 'contents' : 'none';
    $('repPanel').hidden = lab; $('repPanel').style.display = lab ? 'none' : 'flex';
    $('repPanel').style.flexDirection = 'column'; $('repPanel').style.gap = '8px';
    if (!lab) {
      setHint(state.confirm ? L.hConfirm : rowIds().length ? (remaining() ? L.wReportMore : L.wReport) : L.hEmpty);
      $('confirm').hidden = !state.confirm; $('clear').hidden = state.confirm; $('clear').disabled = !rowIds().length && !fc.calls.length; return;
    }
    const p = curPass();
    drawPass();
    document.querySelector('.vgroup').hidden = p === 3;
    for (const v of VKEYS) { const b = $('v-' + v); b.setAttribute('aria-pressed', state.verdict === v ? 'true' : 'false'); b.disabled = p === 3; }
    const out = p !== 2 || outsideDone(state.spec);
    $('lock').disabled = !state.verdict || p === 3 || !out;
    $('lock').hidden = p === 3; $('next').hidden = p !== 3; $('retestRow').hidden = p !== 3;
    $('next').textContent = tested().length === IDS.length ? 'See the report' : 'Next specimen';
    if (p === 1) setHint(state.verdict ? L.h1v : L.h1);
    else if (p === 2) setHint(!out ? (state.verdict ? L.h2need : L.h2) : state.verdict ? L.h2v : browser.tabs > 1 ? L.h2b : L.h2);
    else setHint(tested().length === IDS.length ? L.hAll : !state.revealMin ? L.hReveal : L.hTested);
  }
  function drawReveal(animate) {
    const r = $('reveal'), s = state.spec, p = curPass();
    if (state.mode !== 'lab' || p !== 3) { r.hidden = true; return; }
    const c1 = fc.callOf(s, 1), c2 = fc.callOf(s, 2), E = SPEC[s].expert;
    const tog = h('button', {class: 'btn tog', type: 'button', 'aria-expanded': state.revealMin ? 'false' : 'true'}, state.revealMin ? 'Show' : 'Hide');
    tog.onclick = () => { state.revealMin = !state.revealMin; drawReveal(); drawPanel(); r.querySelector('.tog').focus({preventScroll: true}); };
    // the findings that decide it, each marked when the student's notebook has it
    const mine = new Set(fc.notes(s).map(n => n.id));
    const keys = SPEC[s].key.map(id => FIND[id]).filter(Boolean), got = keys.filter(n => mine.has(n.id)).length;
    const kl = h('ul', {class: 'rk'}, keys.map(n => { const T = FC.TAGS[n.tag] || FC.TAGS.inside, y = mine.has(n.id);
      return h('li', {style: '--kc:' + T.color}, h('div', {class: 'kt'}, FC.icon(T.icon, 14), T.word, h('span', {class: 'kf ' + (y ? 'y' : 'n')}, y ? 'You found this' : 'Not in your notebook')), h('div', {}, n.text)); }));
    r.replaceChildren(
      h('h2', {}, FC.icon('evidence', 20), 'What a fact-checker would find: ' + s, h('span', {class: 'sp'}), tog),
      h('div', {class: 'rv-body'},
        h('div', {class: 'rv-v'}, 'A fact-checker would say: ', vchip(E)),
        h('p', {class: 'rv-why'}, SPEC[s].why),
        h('p', {class: 'rv-h3'}, `What decides it (your notebook has ${got} of ${keys.length})`),
        kl,
        h('table', {class: 'rvt'},
          h('tr', {}, h('th', {}, 'Your inside call'), h('th', {}, 'Your outside call'), h('th', {class: 'xc'}, 'Fact-checker')),
          h('tr', {}, h('td', {}, vchip(c1.verdict), ' ', match(c1.verdict, E)), h('td', {}, vchip(c2.verdict), ' ', match(c2.verdict, E)), h('td', {class: 'xc'}, vchip(E))),
          h('tr', {}, h('td', {}, secs(c1.seconds) + ', ' + tabsW(c1.tabs)), h('td', {}, secs(c2.seconds) + ', ' + tabsW(c2.tabs)), h('td', {class: 'xc'}, ''))),
        h('p', {class: 'small'}, 'Every page in this lab is made up for practice. Added to your lab table, saved on this device only.')));
    r.classList.toggle('min', state.revealMin);
    r.hidden = false;
    if (animate && !Curio.reduce) { r.classList.add('enter'); void r.offsetWidth; requestAnimationFrame(() => r.classList.remove('enter')); }
  }
  function drawAll(animateReveal) { drawTray(); drawNotebook(false); drawPanel(); drawReveal(animateReveal); relayout(); }

  // ======================================================================================
  // REPORT
  // ======================================================================================
  const QS = [['who', "Who's behind it?", '#1d4ed8'], ['evidence', "What's the evidence?", '#0f766e'], ['others', 'What do other sources say?', '#9a3412']];
  function counts() {
    const rows = rowIds().map(s => ({s, ...rowOf(s), e: SPEC[s].expert}));
    return {rows, n: rows.length, a: rows.filter(r => r.c1.verdict === r.e).length, b: rows.filter(r => r.c2.verdict === r.e).length};
  }
  function drawReport() {
    const {rows, n, a, b} = counts(), el = $('report');
    const rep = h('div', {class: 'rep'}, h('h2', {}, 'Lab table'));
    if (!n) rep.append(h('p', {class: 'empty'}, 'No specimens tested yet. Each specimen you finish in the Lab adds a row here.'));
    else {
      rep.append(h('div', {class: 'tbl-wrap'}, h('table', {class: 'rtab'},
        h('tr', {}, ['Specimen', 'Inside call', 'Outside call', 'Fact-checker', 'Seconds inside', 'Seconds outside', 'Tabs opened outside'].map(t => h('th', {scope: 'col'}, t))),
        rows.map(r => h('tr', {}, h('td', {}, h('b', {}, r.s), ' ', SPEC[r.s].kind, r.retested ? h('span', {class: 'rtag', title: 'First try shown'}, 'retested') : null),
          h('td', {'data-l': 'Inside'}, vchip(r.c1.verdict), ' ', match(r.c1.verdict, r.e)),
          h('td', {'data-l': 'Outside'}, vchip(r.c2.verdict), ' ', match(r.c2.verdict, r.e)), h('td', {'data-l': 'Fact-checker'}, vchip(r.e)),
          h('td', {class: 'n', 'data-l': 'Seconds inside'}, r.c1.seconds), h('td', {class: 'n', 'data-l': 'Seconds outside'}, r.c2.seconds), h('td', {class: 'n', 'data-l': 'Tabs opened outside'}, r.c2.tabs))))));
      rep.append(h('div', {class: 'counts'},
        h('p', {class: 'count in', id: 'countIn'}, 'Inside read matched the fact-checker on ', h('b', {}, a), ' of ', h('b', {}, n), '.'),
        h('p', {class: 'count out', id: 'countOut'}, 'Outside read matched on ', h('b', {}, b), ' of ', h('b', {}, n), '.')));
      // one line on the student's own two reads
      const d = b - a, t = d === 1 ? '1 more time' : d + ' more times';
      rep.append(h('p', {class: 'react', id: 'react'}, d > 0 ? `Your outside read matched ${t} than your inside read. Which specimen fooled your inside read?`
        : d === 0 ? 'Your two reads matched the same number of times. Look for a row where they differ, or test another specimen.'
        : 'Your inside read matched more often this time. Which outside find led you away?'));
      if (rows.some(r => r.retested)) rep.append(h('p', {class: 'small'}, 'A retested row shows your first try.'));
    }
    rep.append(h('p', {class: 'concl'}, 'In a Stanford study, professional fact-checkers left an unfamiliar site quickly to see what others said about it, and judged sites more accurately than historians and college students who read the site closely.',
      h('small', {}, 'Wineburg and McGrew, 2019. Matches means your call was the same as the fact-checker\'s call in this lab.')));
    rep.append(h('div', {class: 'qs', role: 'list', 'aria-label': 'Three questions to ask'}, QS.map(([ic, t, c]) => h('div', {class: 'q', role: 'listitem', style: '--qc:' + c}, FC.icon(ic, 22), t))));
    el.replaceChildren(rep);
  }

  // ======================================================================================
  // MODES
  // ======================================================================================
  function setMode(m, fromOpen) {
    if (m === state.mode && !fromOpen) return;
    V.hush();
    state.mode = m; state.confirm = false; closeNb(false);
    $('m-lab').setAttribute('aria-pressed', m === 'lab'); $('m-report').setAttribute('aria-pressed', m === 'report');
    $('lab').hidden = m !== 'lab'; $('lab').style.display = m === 'lab' ? '' : 'none';
    $('report').hidden = m !== 'report';
    if (m === 'report') { fc.pause(); drawReport(); drawPanel(); drawReveal(); relayout(); V.welcome(); return; }
    if (!fromOpen) { openSpec(state.spec, true); V.welcome(); }
  }
  $('m-lab').onclick = () => setMode('lab');
  $('m-report').onclick = () => setMode('report');
  VKEYS.forEach(v => { $('v-' + v).onclick = () => pick(v); });
  $('lock').onclick = () => lockCall();
  $('retest').onclick = () => { retest(); $('v-trust').focus({preventScroll: true}); };
  $('next').onclick = () => nextSpec();
  $('clear').onclick = () => { state.confirm = true; drawPanel(); $('no').focus({preventScroll: true}); };
  // save the open pass's seconds and tabs when the page is hidden or closed
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  addEventListener('pagehide', () => save());
  $('no').onclick = () => { state.confirm = false; drawPanel(); $('clear').focus({preventScroll: true}); };
  $('yes').onclick = () => {
    fc.clear(); state.sessions = {}; state.first = {}; state.confirm = false; save();
    drawReport(); drawPanel(); drawTray(); $('m-lab').focus({preventScroll: true});
    Curio.tone(392, .2, .035);
  };

  // notebook pop-up (compact and stack)
  function placeNb() {
    const p = $('nbPop'), c = $('nbChip').getBoundingClientRect();
    const w = Math.min(340, innerWidth - 16);
    p.style.width = w + 'px';
    p.style.left = Math.max(8, Math.min(innerWidth - w - 8, c.right - w)) + 'px';
    if (c.top > innerHeight / 2) { p.style.top = ''; p.style.bottom = (innerHeight - c.top + 6) + 'px'; p.style.maxHeight = Math.max(160, c.top - 14) + 'px'; }
    else { p.style.bottom = ''; p.style.top = (c.bottom + 6) + 'px'; p.style.maxHeight = Math.max(160, innerHeight - c.bottom - 14) + 'px'; }
  }
  function openNb() { state.nbOpen = true; $('nbPop').hidden = false; $('nbChip').setAttribute('aria-expanded', 'true'); placeNb(); $('nbClose').focus({preventScroll: true}); }
  function closeNb(back = true) { if (!state.nbOpen) return; state.nbOpen = false; $('nbPop').hidden = true; $('nbChip').setAttribute('aria-expanded', 'false'); if (back) $('nbChip').focus({preventScroll: true}); }
  $('nbChip').onclick = () => state.nbOpen ? closeNb() : openNb();
  $('nbClose').onclick = () => closeNb();

  // keys: 1, 2, 3 pick a verdict; Enter locks (unless typing or on another control); Escape closes the notebook
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (e.key === 'Escape' && state.nbOpen) { closeNb(); return; }
    if (typing || state.mode !== 'lab') return;
    if (['1', '2', '3'].includes(e.key) && curPass() !== 3) { e.preventDefault(); pick(VKEYS[+e.key - 1]); return; }
    // Enter on a verdict that isn't the picked one picks it (the button's own click); it locks only from the body,
    // Lock my call or the picked verdict
    const onPicked = t.classList && t.classList.contains('verdict') && t.getAttribute('aria-pressed') === 'true';
    if (e.key === 'Enter' && state.verdict && (t === document.body || onPicked || t.id === 'lock')) { e.preventDefault(); lockCall(); }
  });

  // ======================================================================================
  // LAYOUT
  // ======================================================================================
  function pageLayout() { const w = innerWidth, hh = innerHeight; return w >= 1000 && hh >= 650 ? 'wide' : w >= 640 && w / hh >= 1.25 ? 'compact' : 'stack'; }
  function relayout() {
    const p = pageLayout();
    if (p !== state.layout) {
      state.layout = p; for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p);
      drawTray(); drawNotebook(false); if (state.mode === 'lab') drawPass();   // their words depend on the layout
    }
    document.body.classList.toggle('c300', innerWidth >= 800);
    document.body.classList.toggle('hx', p === 'stack' && innerWidth < 480);
    document.body.classList.toggle('big', p === 'wide' && innerWidth >= 1600);
    document.body.classList.toggle('nbc', p === 'stack' || (p === 'compact' && innerHeight < 600));
    if (!document.body.classList.contains('nbc')) closeNb(false);
    const bw = $('bwrap').getBoundingClientRect().width;
    document.body.classList.toggle('narrowb', bw > 0 && bw < 600);
    document.body.classList.toggle('tinyb', bw > 0 && bw < 390);
    document.body.classList.toggle('midb', bw > 0 && bw < 820);
    document.body.classList.toggle('tight', p !== 'stack' && innerWidth < 760);
    if (p === 'stack') {
      // the browser takes the height left after the header, the tray and the panel, so the page, the verdicts and
      // Lock my call are all on screen
      const head = document.querySelector('header').getBoundingClientRect().height, tray = state.mode === 'lab' ? $('tray').getBoundingClientRect().height : 0;
      const panel = $('panel').getBoundingClientRect().height, mu = state.mode === 'lab' ? $('madeup').getBoundingClientRect().height : 0;
      const left = innerHeight - head - tray - mu - panel - 4;
      $('bwrap').style.height = Math.max(innerWidth < 480 ? 170 : 300, left) + 'px';
      $('report').style.maxHeight = '';
    } else $('bwrap').style.height = '';
    if (state.nbOpen) placeNb();
  }
  new ResizeObserver(() => relayout()).observe(document.body);
  addEventListener('resize', () => relayout());

  // ======================================================================================
  // START
  // ======================================================================================
  Curio.init({clips: "voice:*", rate: .92});
  relayout();
  openSpec(IDS.find(s => passOf(s) !== 3) || 'S1', true);
  setMode('lab', true);
  drawAll();

  window.__tool = {state, fc, browser, setMode, openSpec, pick, lockCall, retest, nextSpec, counts, relayout, SPEC, WORLD, L, rowOf, FIND,
    allLines: V.allLines, vlog: V.log, get vq() { return V.queue; }, V};
})();
</script>
</body>
</html>
