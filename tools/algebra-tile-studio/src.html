<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algebra Tile Studio · Curio Class</title>
<meta name="description" content="Build expressions, close factor rectangles and complete the square with signed algebra tiles. Grade 9. Works offline.">
<link rel="icon" href="data:,">
<!--
Algebra Tile Studio, Curio Class. Grade 9, A-SSE.A.1, A-SSE.A.2, A-SSE.B.3a and A-SSE.B.3b.
Started from kit/starter/src.html. Uses the kit frame, theme, sound and Curio.voice.
Sources: CCSS Seeing Structure in Expressions; OpenStax Elementary Algebra 2e 7.3 and Intermediate Algebra 2e 9.2;
NCTM Illuminations Algebra Tiles. All card expansions independently recomputed in Scratch.
Illustrations generated with OpenAI gpt-image, edited for Curio Class.
The specified algebra-tiles engine is absent. Local polynomial and signed-cell helpers are isolated below.
One offline file. Nothing saved. Content CC BY 4.0, code MIT.
-->
<link rel="stylesheet" href="kit:curio">
<link rel="stylesheet" href="kit:theme-912">
<style>
:root{--brand:#6cc4ff;--brand-ink:#04192a;--focus:#a4e5ff}
body{overflow:hidden;min-height:0}
header{padding:12px 20px;gap:10px;flex-wrap:nowrap}
h1{font-size:24px;letter-spacing:-.6px}
h1 small{font-size:12px;letter-spacing:.03em;margin-top:5px}
.seg{border-radius:8px;border-width:1px}
.seg button,.icon-btn{min-height:44px;min-width:44px;font-size:14px;padding:0 13px}
.icon-btn{border-radius:8px;border-width:1px}
main{grid-template-columns:minmax(0,1fr) 328px;grid-template-areas:'stage panel';gap:12px;padding:12px;overflow:hidden}
.panel{grid-area:panel;border:1px solid #344253;border-radius:12px;padding:16px;gap:12px;
  background:linear-gradient(145deg,#202b39,#141b25 45%);box-shadow:inset 0 1px #ffffff16;overflow:auto}
.stage{grid-area:stage;min-height:0;border:1px solid #425468;border-radius:14px;display:flex;flex-direction:column;
  background:#0c1724;box-shadow:0 14px 24px #0004,inset 0 1px #ffffff30;overflow:hidden}
.tray{display:flex;gap:6px;align-items:center;padding:10px 12px;background:linear-gradient(#263447,#192533);
  border-bottom:1px solid #4c5d70;flex-wrap:wrap;z-index:2;box-shadow:0 4px 10px #0004}
.tray .btn{padding:0 12px;font-size:13px;background:linear-gradient(#354457,#243243);box-shadow:inset 0 1px #ffffff15}
.tray .kind{color:#0b1017;font-size:20px;min-width:54px;border:2px solid #0b1017;box-shadow:inset 0 2px #ffffff70,0 3px #0004}
#add-x2{background:linear-gradient(#a3dcff,#6cc4ff)}
#add-x{background:linear-gradient(#b2edb9,#7ee08a)}
#add-one{background:linear-gradient(#ffe4a6,#ffd166)}
.tray .sep{height:26px;width:1px;background:#607184;margin:0 3px}
.tray .btn:disabled{opacity:.45}
.matbox{position:relative;flex:1;min-height:0;overflow:hidden;background:#172a3a url('art:studio-mat') center/cover}
.matbox::before{content:'';position:absolute;inset:0;background:#07152270;pointer-events:none}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bench-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px;padding:5px 14px;
  background:#101c29;color:#b6c7da;border-top:1px solid #415268;font-size:11px;letter-spacing:.03em}
.lamp{width:6px;height:6px;background:#9ee5ff;border-radius:50%;box-shadow:0 0 8px #6cc4ff;display:inline-block;
  margin-right:7px;animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.calm .lamp{animation:none!important}
.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#a6b3c4;margin:0 0 6px}
.expression{font:600 25px/1.45 var(--readout-font);color:#e8edf3;min-height:38px;margin:0;overflow-wrap:anywhere}
.term{cursor:help;border-bottom:1px dotted #6f8398;display:inline-flex;min-width:44px;min-height:44px;
  align-items:center;white-space:nowrap}
.value{font-size:13px;color:#c1d2e3;line-height:1.5;margin:6px 0 0}
.hint{font-size:14px;line-height:1.45;min-height:62px;margin:0;flex-shrink:0}
.tip{font-size:13px;padding:10px 12px;min-height:55px;line-height:1.45;display:block!important}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions .btn{font-size:13px;padding:0 10px}
.actions .primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card-picker{display:flex;flex-direction:column;gap:5px}
label{font-size:12px;color:#c6d3e2}
select{min-height:44px;width:100%;border:1px solid #62789a;border-radius:6px;background:#0e1722;color:#e8edf3;
  font:600 14px 'Segoe UI',sans-serif;padding:0 8px}
.rewrite{border-top:1px solid #465368;padding-top:12px;font:14px/1.7 var(--readout-font);overflow-wrap:anywhere}
.rewrite strong{color:var(--brand);font-size:19px;font-weight:600;display:block}
.rewrite .minimum{font:14px/1.5 'Segoe UI',sans-serif;color:#d1efda;margin-top:8px}
.measure{border-top:1px solid #465368;padding-top:10px;margin-top:auto}
.measure label{display:flex;justify-content:space-between;align-items:center}
.measure output{font:13px var(--readout-font);color:var(--brand)}
.measure p{font-size:11px;margin:0;color:#a6b3c4}
.xprobe{border-top:1px solid #465368;padding-top:8px}
.xprobe label{display:flex;justify-content:space-between}
.xprobe p{font:12px/1.4 var(--readout-font);margin:0;min-height:34px}
body[data-mode="square"][data-filled="true"] #split,
body[data-mode="square"][data-filled="true"] #fill{display:none}
.tile{cursor:grab;outline:none}
.tile:active{cursor:grabbing}
.tile:focus-visible .tile-rim{stroke:#ffffff;stroke-width:4;stroke-dasharray:4 2}
.tile .tile-rim{stroke:#0b1017;stroke-width:2}
.tile.selected .tile-rim{stroke:#ffffff;stroke-width:3}
.tile-preview.selected .tile-rim{stroke:#ffffff;stroke-width:3}
.tile-preview{pointer-events:none}
.dense-diagram .cell{pointer-events:none;cursor:default}
.tile-nav{display:flex;align-items:center;gap:4px;padding:4px 8px;background:linear-gradient(#263447,#192533);
  border-top:1px solid #4c5d70;min-height:52px}
.tile-nav[hidden]{display:none}
.tile-nav label{flex:1;min-width:0}
.tile-nav select{font-size:12px;padding:0 4px}
.tile-nav .btn{width:44px;min-width:44px;padding:0;font-size:21px}
.tile-nav select:focus-visible,.tile-nav .btn:focus-visible{outline:3px solid #8fe3ff;outline-offset:1px}
.tile-nav.square-nav .move-tile{display:none}
.frame-closed{animation:edgeClose .4s ease-out}
@keyframes edgeClose{from{stroke:#fff;filter:drop-shadow(0 0 8px #9de9c6)}to{stroke:#9de9c6}}
.calm .frame-closed{animation:none}
.tile.bad .tile-rim{stroke:#ffb2a8;stroke-width:4}
.cell{fill:#07142155;stroke:#ffd16699;stroke-width:1.2;stroke-dasharray:4 5;cursor:crosshair}
.cell:hover{fill:#6cc4ff25;stroke:#eaf8ff}
.tile-label{font:700 16px 'Segoe UI',sans-serif;fill:#0b1017;pointer-events:none}
.sv-label{font:12px 'Segoe UI',sans-serif;fill:#d9e6f3;pointer-events:none}
.sv-small{font:11px 'Segoe UI',sans-serif;fill:#aec4d8;pointer-events:none}
.edge-label{font:600 20px var(--readout-font);fill:#bfeaff;pointer-events:none}
.scene-title{font:600 12px 'Segoe UI',sans-serif;fill:#b9cedf;letter-spacing:2px}
.ghost-tile{pointer-events:none;animation:cancelPair .25s ease-out forwards}
@keyframes cancelPair{to{opacity:0}}
.corner-new{animation:cornerIn .4s ease-out}
@keyframes cornerIn{from{opacity:.2;filter:brightness(2)}to{opacity:1}}
.calm .ghost-tile{display:none}
.sr{position:fixed;left:-10000px;width:1px;height:1px;overflow:hidden}
@media(max-height:899px){
  body:not([data-mode="mat"]) #expression-box{display:none}
  .panel{padding:12px;gap:8px}.panel .hint{font-size:13px;line-height:1.4;min-height:0}
  .panel .tip{font-size:12px;min-height:38px;padding:8px 10px}
  .rewrite{font-size:13px;line-height:1.5}.rewrite strong{font-size:18px}
  .rewrite .minimum{font-size:13px;line-height:1.35}.xprobe p{min-height:18px}
  .measure p{display:none}
}

  .tray{gap:10px;padding:14px 16px}.tray .btn{font-size:14px}.panel{gap:16px}
}

  .panel{padding:12px;gap:9px}.tray{padding:6px;gap:4px}.tray .btn{padding:0 8px}.tray .kind{min-width:44px}

}
@media(max-height:650px) and (min-width:600px){
  header{padding:5px 8px;gap:5px}h1{font-size:17px}h1 small{display:none}
  .seg button,.icon-btn{font-size:12px;padding:0 8px}main{padding:6px;gap:6px;grid-template-columns:minmax(0,1fr) 244px}
  .panel{padding:9px;gap:6px}.eyebrow{display:none}.expression{font-size:20px;min-height:29px}
  .hint{font-size:12px;min-height:51px}.tip{font-size:12px;min-height:44px;padding:6px 8px}
  .value{font-size:12px;margin:0}.measure{padding-top:4px}.measure p{display:none}
  .rewrite{font-size:12px;line-height:1.5;padding-top:5px}.rewrite strong{font-size:16px}
  .rewrite .minimum{font-size:12px;margin-top:4px}.xprobe{padding-top:3px}.xprobe p{min-height:17px}
  .actions .btn{font-size:12px;padding:0 7px}.tray .sep{display:none}.tray .btn{font-size:12px;padding:0 7px}
  .bench-foot .keys-help{display:none}.bench-foot{min-height:26px}
  body:not([data-mode="mat"]) #expression-box{display:none}
  .panel .hint{min-height:35px;font-size:12px;line-height:1.35}
  .panel .tip{min-height:30px}.rewrite .minimum{line-height:1.3}
  body[data-mode="square"][data-filled="true"] #probe-box,
  body[data-mode="square"][data-filled="true"] #tip{display:none!important}
}
@media(max-width:999px) and (min-height:651px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(310px,1fr) auto;grid-template-areas:'stage' 'panel'}
  .panel{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:8px 16px;overflow:auto;max-height:370px}
  .panel .measure{margin:0}.panel .hint{min-height:40px}.card-picker{grid-column:1/-1}
  .xprobe{grid-column:2;grid-row:3/6}.rewrite{grid-column:1}.actions{grid-column:1/-1}
  body:not([data-mode="mat"]) #expression-box{display:none}
  body:not([data-mode="mat"]) .panel{max-height:400px;grid-template-columns:1fr 1fr;
    grid-template-areas:'picker picker' 'hint hint' 'actions actions' 'tip rewrite' 'measure probe'}
  body:not([data-mode="mat"]) #picker{grid-area:picker}
  body:not([data-mode="mat"]) #hint{grid-area:hint;min-height:24px}
  body:not([data-mode="mat"]) .actions{grid-area:actions}
  body:not([data-mode="mat"]) #tip{grid-area:tip}
  body:not([data-mode="mat"]) #rewrite{grid-area:rewrite}
  body:not([data-mode="mat"]) .measure{grid-area:measure}
  body:not([data-mode="mat"]) .xprobe{grid-area:probe}
}
@media(max-width:599px){
  header{display:grid;grid-template-columns:repeat(3,1fr);padding:7px;gap:5px}
  h1{grid-column:1/-1;font-size:20px;text-align:center}h1 small{display:none}
  .seg{grid-column:1/-1;display:flex}.seg button{flex:1}
  .icon-btn{min-width:0;padding:0 4px;font-size:12px}
  main{padding:5px;gap:5px;grid-template-columns:1fr;grid-template-rows:minmax(250px,1fr) auto;grid-template-areas:'stage' 'panel'}
  .tray{padding:4px;gap:3px;justify-content:center}.tray .btn{font-size:11px;padding:0 2px;min-width:44px;
    width:44px;flex:0 0 44px;white-space:normal}
  .tray .sep{display:none}.tray .kind{font-size:17px}.bench-foot{min-height:25px;font-size:10px}
  .keys-help{display:none}.panel{max-height:310px;display:grid;grid-template-columns:1fr 1fr;padding:8px;gap:5px 10px}
  .eyebrow{display:none}.expression{font-size:19px;min-height:28px}.hint{font-size:12px;min-height:36px}
  .value{font-size:11px;margin:0}.tip{font-size:12px;padding:6px 8px;min-height:38px}
  .card-picker,.actions{grid-column:1/-1}.measure{padding-top:4px;margin:0}.measure p{display:none}
  .rewrite{font-size:11px;line-height:1.4;padding-top:5px}.rewrite strong{font-size:15px}.rewrite .minimum{font-size:12px}
  .xprobe{padding-top:3px;grid-column:2;grid-row:3/6}.xprobe p{font-size:11px;min-height:25px}
  body:not([data-mode="mat"]) #expression-box{display:none}
  body:not([data-mode="mat"]) .panel{max-height:355px;grid-template-columns:1fr 1fr;
    grid-template-areas:'picker picker' 'hint hint' 'actions actions' 'tip rewrite' 'measure probe'}
  body:not([data-mode="mat"]) #picker{grid-area:picker}
  body:not([data-mode="mat"]) #picker label{position:absolute;left:-10000px}
  body:not([data-mode="mat"]) #hint{grid-area:hint;min-height:28px}
  body:not([data-mode="mat"]) .actions{grid-area:actions}
  body:not([data-mode="mat"]) #tip{grid-area:tip}
  body:not([data-mode="mat"]) #rewrite{grid-area:rewrite}
  body:not([data-mode="mat"]) .measure{grid-area:measure}
  body:not([data-mode="mat"]) .xprobe{grid-area:probe}
}
</style>

<body>
<header>
  <h1>Algebra Tile Studio<small>Close the rectangle. Read the factors.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-mat" aria-pressed="true">Mat</button>
    <button id="m-frame" aria-pressed="false">Frame</button>
    <button id="m-square" aria-pressed="false">Square</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
  <button class="icon-btn" id="read">Read</button>
</header>
<main>
  <aside class="panel" id="panel">
    <div class="card-picker" id="picker" hidden>
      <label for="card">Choose an expression</label>
      <select id="card"></select>
    </div>
    <section id="expression-box">
      <p class="eyebrow" id="expression-label">Signed area on your mat</p>
      <p class="expression" id="expression" aria-live="polite">0</p>
      <p class="value" id="value"></p>
    </section>
    <p class="hint" id="hint"></p>
    <div class="actions" id="mat-actions"><button class="btn" id="clear">Clear mat</button></div>
    <div class="actions" id="frame-actions" hidden>
      <button class="btn primary" id="check">Check</button>
      <button class="btn" id="restart-frame">Start over</button>
      <button class="btn" id="no-rectangle">No rectangle</button>
    </div>
    <div class="actions" id="square-actions" hidden>
      <button class="btn primary" id="split">Split strips</button>
      <button class="btn primary" id="fill" disabled>Fill the corner</button>
      <button class="btn" id="restart-square">Start over</button>
    </div>
    <p class="tip" id="tip" aria-live="polite">Solid is positive. Hatched with a minus is negative.</p>
    <div class="rewrite" id="rewrite" hidden></div>
    <section class="xprobe" id="probe-box" hidden>
      <label for="probe">Number-line x <output id="probe-x">0</output></label>
      <input id="probe" type="range" min="-8" max="8" step="0.5" value="0">
      <p id="probe-value"></p>
    </section>
    <section class="measure">
      <label for="x-length">x length <output id="x-readout">x = 2.6</output></label>
      <input id="x-length" type="range" min="1.3" max="4.7" step="0.1" value="2.6">
      <p>Drawing length only. Unit tiles stay one unit.</p>
    </section>
  </aside>
  <section class="stage" id="stage" aria-label="Algebra working mat">
    <div class="tray" id="tray" role="group" aria-label="Tile tray">
      <button class="btn kind" id="add-x2" aria-label="Drop x squared tile">x²</button>
      <button class="btn kind" id="add-x" aria-label="Drop x tile">x</button>
      <button class="btn kind" id="add-one" aria-label="Drop unit tile">1</button>
      <span class="sep"></span>
      <button class="btn" id="flip" disabled>Flip</button>
      <button class="btn" id="turn" disabled>Turn</button>
      <button class="btn" id="remove" disabled>Remove</button>
      <button class="btn" id="zero">Zero pair</button>
    </div>
    <div class="matbox" id="matbox"><svg id="scene" role="group" aria-label="Algebra tiles and factor frame"></svg></div>
    <div class="tile-nav" id="tile-nav" hidden aria-label="Tile controls for the compact diagram">
      <label><span class="sr">Choose a tile</span><select id="tile-select" aria-label="Choose a tile"></select></label>
      <button class="btn move-tile" id="move-left" aria-label="Move selected tile left">←</button>
      <button class="btn move-tile" id="move-up" aria-label="Move selected tile up">↑</button>
      <button class="btn move-tile" id="move-down" aria-label="Move selected tile down">↓</button>
      <button class="btn move-tile" id="move-right" aria-label="Move selected tile right">→</button>
    </div>
    <div class="bench-foot"><span><i class="lamp"></i><span id="bench-mode">FREE MAT</span></span>
      <span class="keys-help">Arrows move · F flip · T turn · Delete remove</span><span id="bench-count">0 tiles</span></div>
  </section>
</main>
<p class="sr" id="announce" aria-live="polite"></p>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = $('scene');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const minus = n => String(n).replace(/-/g, '−');
  const text = (parent, x, y, value, cls = 'sv-label', more = {}) => {
    const el = node('text', {x, y, class: cls, ...more}, parent);
    el.textContent = value;
    return el;
  };
  function node(tag, attrs = {}, parent = svg) {
    const el = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
    parent.appendChild(el);
    return el;
  }

  // Exact integer coefficients in descending order. No numeric-value equivalence tests.
  const poly = tiles => tiles.reduce((p, t) => {
    p[t.kind === 'x2' ? 0 : t.kind === 'x' ? 1 : 2] += t.sign;
    return p;
  }, [0, 0, 0]);
  const equal = (a, b) => a.every((v, i) => v === b[i]);
  const product = (p, q) => [p[0] * q[0], p[0] * q[1] + p[1] * q[0], p[1] * q[1]];
  function fmt(p) {
    const parts = [];
    p.forEach((v, i) => {
      if (!v) return;
      const part = (i < 2 && Math.abs(v) === 1 ? '' : Math.abs(v)) + ['x²', 'x', ''][i];
      parts.push((parts.length ? (v < 0 ? ' − ' : ' + ') : (v < 0 ? '−' : '')) + part);
    });
    return parts.join('') || '0';
  }
  const linear = p => fmt([0, p[0], p[1]]);
  const FRAME = [
    [1, 5, 6], [1, 7, 12], [1, 6, 9], [1, -5, 6], [1, 1, -6], [1, 0, -9],
    [2, 7, 3], [2, 5, 2], [1, 1, 1], [1, 0, 4],
  ];
  const SQUARE = [[1, 6, 5], [1, 4, 7], [1, 8, 16], [1, -6, 10], [1, 2, -3], [1, -4, 0]];
  const L = {
    wMat: 'Press x squared, x or 1 to drop a tile, or drag one onto the mat. A red tile on a matching solid tile makes zero.',
    wFrame: 'Pick a card from the list. Then drag its tiles into the frame until they close into a rectangle.',
    wSquare: 'Pick a card from the expression list to start a square.',
    matAct: 'Press a tile button to add a tile. Select a tile to use its enabled tray controls, or move it with the arrow keys.',
    frameAct: 'Drag a pile tile into the frame, or select a tile and tap a dashed cell.',
    squareAct: 'Press Split strips to share the x strips evenly between two edges.',
    fillAct: 'Press Fill the corner. Every unit added inside gets a negative unit outside, so the expression stays the same.',
    probeAct: 'Drag the number-line dot, or use its arrow keys. Find where the inset square vanishes.',
    restoreAct: 'Press Start over to restore this expression and rebuild its square.',
    zeroHint: 'Stuck? Press Zero pair. It changes the picture, not the value.',
    gap: 'Not closed yet. Read the tip, move a tile, then press Check.',
    closed: 'It closes. The edges are the factors.',
    noRect: 'Right. No whole-number rectangle exists for this one.',
    noRectWrong: 'This one does close. Read the tip and keep building.',
    square: 'The square is done. What is left over is the smallest value.',
    zero: 'A positive tile and its matching negative make zero. The expression stays the same.',
    added: 'Added zero.',
    compactAct: 'Choose a tile from the tile list. Use the arrow buttons to place and move it. The enabled tray buttons edit that tile.',
    frameDone: 'Read the factors and zeros. Choose another expression card, or press Start over to build this one again.',
    pairProof: 'Compare every factor-pair sum in the tip with the middle coefficient. Then choose another expression card.',
  };
  const fresh = () => ({tiles: [], selected: null, lastKind: 'x', card: null, solved: false, noRect: false, message: '', revision: 0});
  const state = {mode: 'mat', xLen: 2.6, mat: fresh(), frame: fresh(),
    square: {...fresh(), split: false, filled: false, altered: false, probe: 0}};
  let nextId = 1;
  let geom = {};
  let pointer = null;
  let ghosts = [];
  let renderQueued = false;
  let modeReady = false;
  let eventSerial = 0;
  let denseInput = false;
  const current = () => state[state.mode];
  const V = Curio.voice({
    lines: L,
    scope: () => state.mode,
    hint: false,
    read: () => $('hint').textContent,
    welcome: () => {
      const m = current();
      if (state.mode === 'mat') return m.tiles.length ? null : 'wMat';
      return m.card === null ? (state.mode === 'frame' ? 'wFrame' : 'wSquare') : null;
    },
  });

    if (!pointer) return;
    if (pointer.probe) {
      const x = e.clientX - svg.getBoundingClientRect().left;
      state.square.probe = clamp(Math.round(((x - pointer.left) / pointer.lineW * 16 - 8) * 2) / 2, -8, 8);
      update();
      pointer.dot = svg.querySelector('[role="slider"]');
      return;
    }
    const dx = e.clientX - pointer.startX;
    const dy = e.clientY - pointer.startY;
    if (Math.hypot(dx, dy) > 4) pointer.moved = true;
    if (pointer.moved && pointer.group) {
      pointer.group.setAttribute('transform', `${pointer.base} translate(${dx},${dy})`);
      pointer.group.style.opacity = '.85';
    }
  });
  function endPointer(e) {
    if (!pointer) return;
    const p = pointer;
    pointer = null;
    if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
    if (p.probe) {
      update();
      return;
    }
    if (p.group) {
      p.group.setAttribute('transform', p.base);
      p.group.style.opacity = '';
    }
    if (p.moved) {
      const box = svg.getBoundingClientRect();
      const x = e.clientX - box.left;
      const y = e.clientY - box.top;
      if (state.mode === 'mat') {
        const dragged = current().tiles.find(t => t.id === p.id);
        const opposite = current().tiles.find(t => t.id !== p.id && t.kind === dragged?.kind && t.sign === -dragged.sign &&
          t.screen && x >= t.screen.x && x <= t.screen.x + t.screen.w && y >= t.screen.y && y <= t.screen.y + t.screen.h);
        if (opposite) place(p.id, opposite.col, opposite.row);
        else place(p.id, Math.round((x - 20) / geom.unit), Math.round((y - 46) / geom.unit));
      } else if (state.mode === 'frame' && geom.frame) {
        const f = geom.frame;
        const index = (v, arr) => clamp(arr.findIndex((a, i) => i < arr.length - 1 && v >= a && v < arr[i + 1]), 0, arr.length - 2);
        if (x < f.pileX - 15) place(p.id, index(x - f.x, f.xs), index(y - f.y, f.ys));
        else place(p.id, 0, 0, 'pile');
      } else if (state.mode === 'square' && !state.square.split) dragSquareStrip(p.id, x, y);
    }
    if (renderQueued || p.moved) render();
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', e => { pointer = null; render(); });
  for (const [id, kind] of [['add-x2', 'x2'], ['add-x', 'x'], ['add-one', '1']]) {
    $(id).addEventListener('click', () => add(kind));
    $(id).addEventListener('pointerdown', e => {
      const start = {x: e.clientX, y: e.clientY};
      const up = ev => {
        if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 10) return;
        const box = svg.getBoundingClientRect();
        if (ev.clientY >= box.top && ev.clientY < box.bottom && ev.clientX >= box.left && ev.clientX < box.right) {
          const t = add(kind);
          if (state.mode === 'mat' && t) place(t.id, Math.round((ev.clientX - box.left - 20) / geom.unit),
            Math.round((ev.clientY - box.top - 46) / geom.unit));
        }
      };
      addEventListener('pointerup', up, {once: true});
    });
  }
  for (const k of ['mat', 'frame', 'square']) $('m-' + k).onclick = () => setMode(k);
  for (const k of ['flip', 'turn', 'remove']) $(k).onclick = () => edit(k);
  $('tile-select').onchange = () => select(Number($('tile-select').value));
  for (const [name, dc, dr] of [['left', -1, 0], ['up', 0, -1], ['down', 0, 1], ['right', 1, 0]]) {
    $('move-' + name).onclick = () => {
      const tile = current().tiles.find(t => t.id === current().selected);
      if (!tile) return;
      if (tile.zone === 'pile') place(tile.id, 0, 0, state.mode === 'mat' ? 'mat' : 'frame');
      else place(tile.id, tile.col + dc, tile.row + dr, state.mode === 'mat' ? 'mat' : 'frame');
    };
  }
  $('zero').onclick = zeroPair;
  $('card').onchange = () => { if ($('card').value !== '') load(+$('card').value); };
  $('clear').onclick = () => {
    finishVisuals();
    if (state.mat.tiles.length) V.hush();
    Object.assign(state.mat, fresh());
    update();
    speak('matAct', () => state.mode === 'mat', true);
  };
  $('check').onclick = check;
  $('no-rectangle').onclick = noRectangle;
  $('split').onclick = splitStrips;
  $('fill').onclick = fillCorner;
  $('restart-frame').onclick = () => load(state.frame.card);
  $('restart-square').onclick = () => load(state.square.card);
  $('x-length').oninput = e => {
    state.xLen = Number(e.target.value);
    finishVisuals();
    update();
  };
  $('probe').oninput = e => {
    state.square.probe = Number(e.target.value);
    update();
  };
  new ResizeObserver(() => render()).observe($('matbox'));
  Curio.onMotion(() => { finishVisuals(); render(); });
  Curio.init({clips: 'voice:*', rate: .95, readFallback: () => $('hint').textContent});
  window.__tool = {state, setMode, load, check, expression: () => fmt(poly(current().tiles)),
    allLines: V.allLines, vlog: V.log, V, frameRead, add, place, edit, zeroPair, splitStrips, fillCorner, noRectangle,
    poly, product, equal, fmt, update, get geometry() { return geom; }, FRAME, SQUARE};
  setMode('mat');
})();
</script>
</body>
</html>
