<body>
<header>
  <h1>Act It Out<small>Pretend play and acting out a story</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-stories" aria-pressed="true">▤ Stories</button>
    <button id="m-trunk" aria-pressed="false">▣ Trunk</button>
  </div>
  <button class="icon-btn" id="read">🔊 Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<main>
  <section class="world home" id="home" aria-label="Choose a story">
    <img class="backdrop" data-art="little-stage" alt="">
    <div class="marquee">The class is the cast</div>
    <h2>Which story shall we become?</h2>
    <div class="story-tiles">
      <button class="story-tile" id="story-goats">
        <img class="landscape" data-art="meadow-bridge" alt="A little bridge to a grassy hill">
        <img class="keepsake" data-art="little-horns" alt=""><b>Billy Goats</b>
      </button>
      <button class="story-tile" id="story-gingerbread">
        <img class="landscape" data-art="cottage-kitchen" alt="A cozy kitchen with an oven">
        <img class="keepsake" data-art="icing-buttons" alt=""><b>Gingerbread Boy</b>
      </button>
      <button class="story-tile" id="story-turnip">
        <img class="landscape" data-art="veggie-garden" alt="A leafy vegetable garden">
        <img class="keepsake" data-art="straw-hat" alt=""><b>Big Turnip</b>
      </button>
    </div>
    <p id="hint" class="home-note" aria-live="polite"></p>
  </section>
  <section class="world player" id="player" hidden aria-label="Story stage">
    <img class="backdrop" id="story-backdrop" alt="">
    <div class="beat-card">
      <div class="beat-top"><span class="beat-kind" id="beat-kind"></span><span class="badge" id="acting"></span>
        <span class="beat-count" id="beat-count"></span></div>
      <p class="beat-line" id="beat-line"></p>
    </div>
    <div class="performance" id="performance">
      <div class="cast">
        <div class="cast-slot" id="sun-slot"><span class="badge side-label">☀ Sun side</span><div class="doll" id="sun-doll"></div></div>
        <div class="cast-slot" id="moon-slot"><span class="badge moon side-label">☾ Moon side</span><div class="doll" id="moon-doll"></div></div>
      </div>
      <img class="dress-trunk" id="story-trunk" data-art="trunk-closed" alt="Dress-up trunk" hidden>
      <div class="turnip" id="turnip" hidden>
        <img class="sprout" id="sprout" data-art="turnip-sprout" alt="A tiny turnip sprout">
        <img class="giant" id="giant" data-art="turnip-giant" alt="A giant turnip"><div class="soil"></div>
      </div>
      <div class="choices" id="choices" hidden>
        <button id="choice-a" aria-pressed="false"><span class="symbol"></span><span class="choice-word"></span></button>
        <button id="choice-b" aria-pressed="false"><span class="symbol"></span><span class="choice-word"></span></button>
      </div>
      <div class="ending" id="ending" hidden>
        <h2>The end</h2><p id="end-story"></p><button id="replay">⇄ Swap and play again</button><button id="end-home">⌂ Home</button>
      </div>
    </div>
    <div class="freeze-frame" id="story-frame" hidden><b>Freeze!</b></div>
  </section>
  <nav class="teacher-bar" id="teacher-bar" aria-label="Teacher story controls" hidden>
    <button id="back">← Back</button><button id="swap">⇄ Swap</button><button id="freeze">❄ Freeze</button>
    <button id="effect">♫ Sound effect<small id="effect-name"></small></button><button id="go-home">⌂ Home</button>
    <button id="next">Next ▶</button>
  </nav>
  <section class="trunk-view" id="trunk-view" hidden aria-label="Dress-up trunk">
    <div class="trunk-top">
      <div class="world trunk-stage" id="trunk-stage">
        <img class="backdrop" id="trunk-backdrop" data-art="little-stage" alt="">
        <div class="trunk-hint" id="trunk-hint"></div>
        <div class="trunk-performance" id="trunk-performance">
          <div class="doll" id="trunk-doll"></div><img class="dress-trunk" data-art="trunk-open" alt="Open dress-up trunk">
        </div>
        <div class="freeze-frame" id="trunk-frame" hidden><b>Freeze!</b></div>
      </div>
      <div class="wardrobe" id="wardrobe" aria-label="Costume pieces grouped by place"></div>
    </div>
    <div class="trunk-actions">
      <button id="backdrop">▧ Backdrop</button><button id="surprise">⚄ Surprise me</button>
      <button id="clear">↥ Take it all off</button><button id="ask">? Ask</button><button id="trunk-freeze">❄ Freeze</button>
    </div>
    <div class="sound-row" id="sound-row" aria-label="Sound effects"></div>
  </section>
</main>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const DATA = "json:content";
  const ART = {
    'turnip-sprout':'art:turnip-sprout', 'turnip-giant':'art:turnip-giant',
    'little-stage':'art:little-stage', 'meadow-bridge':'art:meadow-bridge', 'cottage-kitchen':'art:cottage-kitchen',
    'country-road':'art:country-road', 'wide-river':'art:wide-river', 'veggie-garden':'art:veggie-garden',
    'puppet-sun':'art:puppet-sun', 'puppet-moon':'art:puppet-moon', 'trunk-open':'art:trunk-open', 'trunk-closed':'art:trunk-closed',
    'little-horns':'art:little-horns', 'curly-horns':'art:curly-horns', 'straw-hat':'art:straw-hat', 'crown':'art:crown',
    'wizard-hat':'art:wizard-hat', 'fox-ears':'art:fox-ears', 'dog-ears':'art:dog-ears', 'mouse-ears':'art:mouse-ears',
    'cow-bell':'art:cow-bell', 'hair-bow':'art:hair-bow', 'pig-snout':'art:pig-snout', 'cat-whiskers':'art:cat-whiskers',
    'troll-nose':'art:troll-nose', 'icing-buttons':'art:icing-buttons', 'candy-bow':'art:candy-bow', 'apron':'art:apron',
    'shawl':'art:shawl', 'shaggy-cape':'art:shaggy-cape', 'big-boots':'art:big-boots', 'bushy-tail':'art:bushy-tail'
  };
  document.querySelectorAll('[data-art]').forEach(img => { img.src=ART[img.dataset.art]; });
  const pieces = DATA.pieces;
  const state = {
    mode:'stories', story:null, beat:0, swapped:false, frozen:false, choice:{}, outfits:[{},{}],
    trunk:{outfit:{}, backdrop:0, ask:0, taps:0, visitTaps:0}, revision:0
  };
  const backgrounds = ['little-stage','meadow-bridge','cottage-kitchen','country-road','wide-river','veggie-garden'];
  const L = DATA.lines;
  const swappedText = text => state.swapped ? text.replace(/Sun side|Moon side/g, word => word === 'Sun side' ? 'Moon side' : 'Sun side') : text;
  const currentBeat = () => state.story ? DATA.stories[state.story].beats[state.beat] : null;
  const V = Curio.voice({
    lines:DATA.voiceLines, scope:() => state.mode + ':' + state.story, hint:false,
    read:() => currentBeat() && state.mode === 'stories' ? [beatText(), $('hint').textContent] : $('hint').textContent,
    welcome:() => state.mode === 'trunk' ? ['trunkWelcome',L.trunkWelcome,
      {valid:() => state.trunk.taps === state.trunk.visitTaps}]
      : !state.story ? ['welcome',L.welcome,{valid:() => !state.story}] : null,
    speaks:'.story-tile, .costume-button, #surprise, #clear, #ask, #next, #replay'
  });
  let animations = [];
  let timers = [];
  let nodes = [];
  function settle() {
    state.revision++;
    timers.forEach(clearTimeout);
    timers = [];
    animations.forEach(a => { try { a.finish(); a.cancel(); } catch {} });
    animations = [];
    nodes.forEach(n => { try { n.stop(); } catch {} });
    nodes = [];
    document.querySelectorAll('.ping,.effect-flash').forEach(el => el.classList.remove('ping','effect-flash'));
    if (state.story === 'turnip' && state.beat === 1) {
      $('sprout').hidden=true;
      $('giant').style.opacity='1';
      $('giant').style.transform='none';
    }
  }
  function interrupt() { settle(); V.hush(); }
  function animate(el, frames, duration) {
    if (Curio.reduce || !el) return;
    animations.push(el.animate(frames, {duration,easing:'cubic-bezier(.2,.7,.3,1)'}));
  }
  function later(fn, delay) {
    const revision = state.revision;
    timers.push(setTimeout(() => { if (revision === state.revision) fn(); },delay));
  }
  function feedback() { Curio.tone(660,.075,.018); }
  function sound(name) {
    if (!Curio.sound) return;
    try {
      const ctx = Curio.audio();
      if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime;
      function tone(f, time, duration=.09, gain=.07, end) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.frequency.setValueAtTime(f,time);
        if (end) o.frequency.exponentialRampToValueAtTime(end,time+duration);
        g.gain.setValueAtTime(.0001,time);
        g.gain.exponentialRampToValueAtTime(gain,time+.006);
        g.gain.exponentialRampToValueAtTime(.0001,time+duration);
        o.connect(g).connect(ctx.destination);
        o.start(time);
        o.stop(time+duration+.02);
        nodes.push(o);
      }
      function noise(up) {
        const duration=.65;
        const b = ctx.createBuffer(1,ctx.sampleRate*duration,ctx.sampleRate);
        const data = b.getChannelData(0);
        for (let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
        const source = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        source.buffer=b;
        filter.type='lowpass';
        filter.frequency.setValueAtTime(up?300:2000,t);
        filter.frequency.exponentialRampToValueAtTime(up?2000:300,t+duration);
        gain.gain.setValueAtTime(.0001,t);
        gain.gain.exponentialRampToValueAtTime(.09,t+.05);
        gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
        source.connect(filter).connect(gain).connect(ctx.destination);
        source.start(t);
        source.stop(t+duration);
        nodes.push(source);
      }
      if (name === 'Trip trap') { tone(900,t); tone(1100,t+.12); }
      if (name === 'TRIP TRAP') { tone(450,t,.13,.1); tone(550,t+.22,.13,.1); }
      if (name === 'Splash') noise(false);
      if (name === 'Heave-ho') noise(true);
      if (name === 'Oven ding') { tone(1320,t,.85,.08); tone(2640,t,.45,.018); }
      if (name === 'Running feet') for (let i=0;i<8;i++) tone(i%2?850:700,t+i*.1,.055,.04);
      if (name === 'Snap') { tone(1700,t,.028,.055); tone(100,t,.15,.06); }
      if (name === 'Pop') { tone(600,t,.2,.08,150); tone(95,t,.17,.055); }
      if (name === 'sparkle') [1046.502,1318.51,1567.982].forEach((f,i) => tone(f,t+i*.09,.35,.04));
      if (name === 'camera') { tone(1800,t,.025,.025); tone(900,t+.035,.04,.018); }
    } catch {}
  }
  function setHint(text) {
    $('hint').textContent=text;
  }
  function doll(el, side, outfit) {
    el.replaceChildren();
    const wood = document.createElement('img');
    wood.src=ART['puppet-'+side];
    wood.alt=(side === 'sun' ? 'Sun' : 'Moon')+' wooden peg puppet';
    wood.className='wood';
    el.append(wood);
    const ns='http://www.w3.org/2000/svg';
    const face=document.createElementNS(ns,'svg');
    face.setAttribute('viewBox','0 0 100 231.111');
    face.setAttribute('class','face '+side);
    face.setAttribute('aria-hidden','true');
    const smile=el.closest('.lit') || state.mode === 'trunk' ? 'M41 64 Q50 77 59 64' : 'M43 65 Q50 71 57 65';
    face.innerHTML='<circle class="eyes" cx="39" cy="49" r="2.2"/><circle class="eyes" cx="61" cy="49" r="2.2"/>'
      +'<path class="mouth" d="'+(state.frozen?'M47 65 a4 5 0 1 0 8 0 a4 5 0 1 0 -8 0':smile)+'"/>';
    el.append(face);
    for (const id of Object.values(outfit)) {
      const piece=document.createElement('img');
      piece.src=ART[id];
      piece.alt=pieces[id].name;
      piece.className='piece '+pieces[id].place+' '+id;
      el.append(piece);
    }
  }
  function updateFreeze() {
    for (const prefix of ['story','trunk']) $(prefix+'-frame').hidden=!state.frozen;
    for (const id of ['freeze','trunk-freeze']) {
      $(id).textContent=state.frozen?'♨ Unfreeze':'❄ Freeze';
      $(id).setAttribute('aria-pressed',state.frozen);
    }
    $('player').classList.toggle('frozen',state.frozen);
    $('trunk-stage').classList.toggle('frozen',state.frozen);
  }
  function freeze() {
    interrupt();
    state.frozen=!state.frozen;
    updateFreeze();
    if (state.mode === 'trunk') doll($('trunk-doll'),'sun',state.trunk.outfit);
    else drawCast();
    const key=state.frozen?'freeze':'unfreeze';
    V.say(L[key],{valid:() => state.frozen === (key === 'freeze')});
    feedback();
  }
  function beatText() {
    const beat=currentBeat();
    if (!beat) return '';
    if (state.story === 'turnip' && beat.type === 'choose' && state.choice[state.beat] === 'b') return L.bear;
    let text=beat.line;
    if (beat.variants) text=beat.variants[state.choice[beat.choiceFrom] || 'a'];
    return swappedText(text);
  }
  function restoreCostumes() {
    state.outfits=[{},{}];
    const beats=DATA.stories[state.story].beats;
    for (let i=0;i<=state.beat;i++) {
      const b=beats[i];
      if (!b.pieces) continue;
      for (const [role,ids] of Object.entries(b.pieces)) {
        const targets=role === 'both' ? [0,1] : [Number(role) ^ Number(state.swapped)];
        for (const target of targets) for (const id of ids) state.outfits[target][pieces[id].place]=id;
      }
    }
  }
  function drawCast() {
    const b=currentBeat();
    const acting=b?.side;
    const both=acting === 'both' || acting == null;
    const active=Number(acting) ^ Number(state.swapped);
    $('sun-slot').classList.toggle('lit',both || active === 0);
    $('moon-slot').classList.toggle('lit',both || active === 1);
    doll($('sun-doll'),'sun',state.outfits[0]);
    doll($('moon-doll'),'moon',state.outfits[1]);
  }
  function growTurnip(moving=true) {
    const b=state.beat;
    $('turnip').hidden=state.story !== 'turnip' || b === 0;
    if (state.story !== 'turnip') return;
    $('turnip').classList.toggle('popped',b >= 9);
    $('sprout').hidden=b !== 1 || !moving;
    $('giant').style.opacity=b === 1 && moving?'0':'1';
    $('giant').style.transform='none';
    if (b === 1 && moving) {
      if (Curio.reduce) {
        $('giant').style.opacity='.25';
        $('giant').style.transform='scale(.25)';
        later(() => { $('giant').style.opacity='.65'; $('giant').style.transform='scale(.6)'; },2000);
        later(() => { $('giant').style.opacity='1'; $('giant').style.transform='none'; $('sprout').hidden=true; },4000);
      } else {
        animate($('giant'),[{transform:'scale(.08)',opacity:0},{transform:'scale(1)',opacity:1}],4000);
        $('giant').style.opacity='1';
        animate($('sprout'),[{opacity:1},{opacity:0}],4000);
        later(() => { $('sprout').hidden=true; },4000);
      }
    }
    if (b === 9 && moving) animate($('giant'),[{transform:'translateY(35%) rotate(-6deg)'},{transform:'translateY(-12%) rotate(7deg)'},
      {transform:'translateY(0) rotate(0)'}],650);
  }
  function paintBeat(moving=true) {
    const b=currentBeat();
    restoreCostumes();
    $('story-backdrop').src=ART[b.backdrop];
    $('player').classList.toggle('garden-story',state.story === 'turnip');
    $('player').classList.toggle('curtain-call',b.type === 'end');
    $('beat-line').textContent=beatText();
    $('beat-kind').textContent={tell:'▤ Story',dress:'▣ Dress up',act:'★ Your turn',choose:'? Choose',freeze:'❄ Freeze',end:'★ Curtain call'}[b.type];
    $('beat-count').textContent=(state.beat+1)+' / '+DATA.stories[state.story].beats.length;
    const bear=state.story === 'turnip' && b.type === 'choose' && state.choice[state.beat] === 'b';
    const side=bear || b.side === 'both' ? 'both' : b.side == null ? null : Number(b.side)^Number(state.swapped);
    $('acting').hidden=side == null;
    $('acting').textContent=side === 'both' ? '☀ ☾ Everyone' : side === 0 ? '☀ Sun side' : '☾ Moon side';
    $('acting').className='badge'+(side === 'both'?' everyone':side === 1?' moon':'');
    $('choices').hidden=b.type !== 'choose';
    $('performance').classList.toggle('choosing',b.type === 'choose');
    $('ending').hidden=b.type !== 'end';
    $('end-story').textContent=DATA.stories[state.story].title;
    $('back').disabled=state.beat === 0;
    $('next').disabled=b.type === 'end' || (b.type === 'choose' && !state.choice[state.beat]);
    $('effect').disabled=!b.sound;
    $('effect-name').textContent=b.sound || 'No sound this beat';
    if ($('next').disabled && document.activeElement === $('next')) {
      $(b.type === 'choose' ? 'choice-a' : 'replay').focus({preventScroll:true});
    }
    if ($('back').disabled && document.activeElement === $('back')) $('next').focus({preventScroll:true});
    if (b.type === 'choose') {
      for (const key of ['a','b']) {
        const btn=$('choice-'+key);
        btn.querySelector('.symbol').textContent=b.choices[key].icon;
        btn.querySelector('.choice-word').textContent=b.choices[key].name;
        btn.setAttribute('aria-pressed',state.choice[state.beat] === key);
      }
    }
    $('story-trunk').hidden=b.type !== 'dress';
    $('story-trunk').src=ART['trunk-closed'];
    drawCast();
    updateFreeze();
    growTurnip(moving);
    const hint=b.type === 'choose' && !state.choice[state.beat] ? L.chooseHint : b.type === 'end' ? L.endHint
      : ['act','dress','freeze'].includes(b.type) || bear ? L.actHint : L.nextHint;
    setHint(hint);
    if (moving && b.type === 'dress') {
      $('story-trunk').src=ART['trunk-open'];
      sound('sparkle');
      const trunk=$('story-trunk').getBoundingClientRect();
      const newPieces=Object.values(b.pieces || {}).flat();
      for (const slot of [0,1]) {
        for (const img of $(slot?'moon-doll':'sun-doll').querySelectorAll('.piece')) {
          if (!newPieces.includes(img.classList[2])) continue;
          const target=img.getBoundingClientRect();
          const x=trunk.x+trunk.width/2-target.x-target.width/2;
          const y=trunk.y+trunk.height/2-target.y-target.height/2;
          animate(img,[{transform:'translate('+x+'px,'+y+'px) scale(.25)',opacity:.3},
            {transform:'translate(0,0) scale(1)',opacity:1}],500);
        }
      }
    }
    if (b.sound) sound(b.sound);
  }
  function narrateBeat(start=false) {
    const revision=state.revision;
    const valid=() => state.revision === revision;
    V.say(beatText(),{valid,key:'beat-'+state.story+'-'+state.beat});
    if (start) V.say(DATA.stories[state.story].title,{valid});
    const type=currentBeat().type;
    const key=type === 'choose'?'chooseHint':type === 'end'?'endHint':type === 'act' || type === 'dress'?'actHint':'nextHint';
    if (!V.heard(key)) V.how(L[key],{key,valid,needs:type === 'choose'?'#choice-a':type === 'end'?'#replay':'#next'});
  }
  function visit(index) {
    interrupt();
    state.beat=index;
    state.frozen=currentBeat().type === 'freeze';
    paintBeat();
    narrateBeat();
  }
  function startStory(id, swapped=false) {
    interrupt();
    state.mode='stories';
    state.story=id;
    state.beat=0;
    state.swapped=swapped;
    state.frozen=false;
    state.choice={};
    const departed=document.activeElement;
    showMode();
    paintBeat();
    if (departed && (departed.classList.contains('story-tile') || departed.id === 'replay')) {
      $('next').focus({preventScroll:true});
    }
    narrateBeat(true);
    feedback();
  }
  function next() {
    if (state.mode !== 'stories' || !state.story || $('next').disabled) return;
    const wasFrozen=state.frozen;
    if (wasFrozen) sound('camera');
    visit(state.beat+1);
    if (wasFrozen) sound('camera');
    else feedback();
  }
  function back() {
    if (state.mode === 'stories' && state.story && state.beat > 0) { visit(state.beat-1); feedback(); }
  }
  function swap() {
    if (state.mode !== 'stories' || !state.story) return;
    interrupt();
    state.swapped=!state.swapped;
    paintBeat(false);
    animate($('sun-doll'),[{transform:'translateX(80%)',opacity:.4},{transform:'translateX(0)',opacity:1}],400);
    animate($('moon-doll'),[{transform:'translateX(-80%)',opacity:.4},{transform:'translateX(0)',opacity:1}],400);
    V.say(L.swap);
    feedback();
  }
  function choose(key) {
    interrupt();
    state.choice[state.beat]=key;
    paintBeat(false);
    if (state.story === 'turnip' && key === 'b') V.say(L.bear);
    else V.say(currentBeat().choices[key].name);
    setHint(state.story === 'turnip' && key === 'b' ? L.actHint : L.nextHint);
    feedback();
  }
  function showMode() {
    const trunk=state.mode === 'trunk';
    $('m-stories').setAttribute('aria-pressed',!trunk);
    $('m-trunk').setAttribute('aria-pressed',trunk);
    $('home').hidden=trunk || !!state.story;
    $('player').hidden=trunk || !state.story;
    $('teacher-bar').hidden=trunk || !state.story;
    $('trunk-view').hidden=!trunk;
    $('hint').className=state.story ? 'story-hint' : '';
    (trunk ? $('trunk-hint') : state.story ? document.querySelector('main') : $('home')).append($('hint'));
  }
  function setMode(mode) {
    interrupt();
    state.mode=mode;
    state.frozen=false;
    state.story=null;
    const departed=document.activeElement;
    showMode();
    if (mode === 'stories' && departed && ['go-home','end-home'].includes(departed.id)) {
      $('story-goats').focus({preventScroll:true});
    }
    updateFreeze();
    if (mode === 'trunk') {
      state.trunk.visitTaps=state.trunk.taps;
      renderTrunk();
      setHint(L.trunkWelcome);
    } else setHint(L.welcome);
    V.welcome();
    feedback();
  }
  function renderTrunk() {
    doll($('trunk-doll'),'sun',state.trunk.outfit);
    $('trunk-backdrop').src=ART[backgrounds[state.trunk.backdrop]];
    for (const btn of $('wardrobe').querySelectorAll('button')) {
      const id=btn.dataset.piece;
      btn.setAttribute('aria-pressed',state.trunk.outfit[pieces[id].place] === id);
    }
    updateFreeze();
  }
  function wear(id) {
    interrupt();
    const place=pieces[id].place;
    const removing=state.trunk.outfit[place] === id;
    if (removing) delete state.trunk.outfit[place];
    else state.trunk.outfit[place]=id;
    state.trunk.taps++;
    renderTrunk();
    animate($('trunk-doll'),[{transform:'translateY(8px)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}],350);
    sound('sparkle');
    V.say(pieces[id].name+(removing?' off.':' on.'),{valid:() =>
      removing ? state.trunk.outfit[place] !== id : state.trunk.outfit[place] === id});
    setHint(state.trunk.taps >= 2 ? L.askHint : L.trunkWelcome);
    if (state.trunk.taps >= 2 && !V.heard('askHint')) V.how(L.askHint,{key:'askHint',needs:'#ask'});
  }
  function surprise() {
    interrupt();
    const places=['head','face','body','feet','tail'].sort(() => Math.random()-.5).slice(0,Math.random()<.5?3:4);
    state.trunk.outfit={};
    for (const place of places) {
      const options=Object.keys(pieces).filter(id => pieces[id].place === place);
      state.trunk.outfit[place]=options[Math.floor(Math.random()*options.length)];
    }
    state.trunk.taps++;
    renderTrunk();
    animate($('trunk-doll'),[{transform:'scale(.9) rotate(-4deg)'},{transform:'scale(1.03) rotate(3deg)'},{transform:'none'}],450);
    sound('sparkle');
    setHint(L.askHint);
    V.say(L.surprise);
  }
  function clear() {
    interrupt();
    state.trunk.outfit={};
    state.trunk.taps++;
    renderTrunk();
    animate($('trunk-doll'),[{transform:'translateY(0)'},{transform:'translateY(-16px)'},{transform:'translateY(0)'}],350);
    sound('Pop');
    setHint(L.trunkWelcome);
    V.say(L.clear);
  }
  function ask() {
    interrupt();
    state.trunk.taps++;
    const text=DATA.questions[state.trunk.ask%DATA.questions.length];
    state.trunk.ask++;
    setHint(text+' '+L.askAgain);
    V.say(text);
    V.how(L.askAgain,{key:'askAgain',needs:'#ask'});
    feedback();
  }
  function setupWardrobe() {
    for (const place of ['head','face','body','feet','tail']) {
      const title=document.createElement('h3');
      title.textContent={head:'Head',face:'Face',body:'Body',feet:'Feet',tail:'Tail'}[place];
      const group=document.createElement('div');
      group.className='piece-group';
      for (const [id,piece] of Object.entries(pieces).filter(([,p]) => p.place === place)) {
        const btn=document.createElement('button');
        btn.className='costume-button';
        btn.id='wear-'+id;
        btn.dataset.piece=id;
        btn.setAttribute('aria-pressed','false');
        btn.innerHTML='<img src="'+ART[id]+'" alt=""><span>'+piece.name+'</span>';
        btn.onclick=() => wear(id);
        group.append(btn);
      }
      $('wardrobe').append(title,group);
    }
    DATA.sounds.forEach((entry,i) => {
      const btn=document.createElement('button');
      btn.id='sound-'+i;
      btn.innerHTML='<span>'+entry.icon+'</span>'+entry.name;
      btn.onclick=() => {
        interrupt();
        state.trunk.taps++;
        sound(entry.name);
        btn.classList.add('ping');
        later(() => btn.classList.remove('ping'),300);
      };
      $('sound-row').append(btn);
    });
  }
  $('m-stories').onclick=() => setMode('stories');
  $('m-trunk').onclick=() => setMode('trunk');
  for (const id of Object.keys(DATA.stories)) $('story-'+id).onclick=() => startStory(id);
  $('next').onclick=next;
  $('back').onclick=back;
  $('swap').onclick=swap;
  $('freeze').onclick=freeze;
  $('trunk-freeze').onclick=freeze;
  $('effect').onclick=() => {
    interrupt();
    sound(currentBeat().sound);
    $('effect').classList.add('effect-flash');
    later(() => $('effect').classList.remove('effect-flash'),400);
  };
  $('go-home').onclick=$('end-home').onclick=() => setMode('stories');
  $('replay').onclick=() => startStory(state.story,!state.swapped);
  $('choice-a').onclick=() => choose('a');
  $('choice-b').onclick=() => choose('b');
  $('backdrop').onclick=() => {
    interrupt();
    state.trunk.taps++;
    state.trunk.backdrop=(state.trunk.backdrop+1)%backgrounds.length;
    renderTrunk();
    feedback();
  };
  $('surprise').onclick=surprise;
  $('clear').onclick=clear;
  $('ask').onclick=ask;
  document.addEventListener('keydown',event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); next(); }
    if (event.key === 'ArrowLeft') { event.preventDefault(); back(); }
    if (event.key.toLowerCase() === 'f') { event.preventDefault(); if (state.story || state.mode === 'trunk') freeze(); }
    if (event.key.toLowerCase() === 's') { event.preventDefault(); swap(); }
  });
  Curio.onMotion(() => { settle(); V.hush(); });
  Curio.onSound(() => {
    settle();
    if (Curio.sound && state.mode === 'trunk') {
      state.trunk.visitTaps=state.trunk.taps;
      V.welcome();
    }
  });
  Curio.init({clips:"voice:*",rate:.9});
  const readCurrent=$('read').onclick;
  $('read').onclick=() => {
    settle();
    readCurrent();
  };
  setupWardrobe();
  setHint(L.welcome);
  showMode();
  window.__tool={state,setMode,startStory,next,back,swap,freeze,choose,wear,surprise,ask,clear,DATA,allLines:V.allLines,vlog:V.log,
    renderDoll:doll, get vq() { return V.queue; }, get voice() { return V; }};
})();
</script>
</body>
</html>
