<link rel="stylesheet" href="kit:curio">
<style>
:root {
  --paper:#fdf9f1; --panel:#fff; --ink:#1e2433; --muted:#5a6170; --line:#d5c9b8;

}
body { height:100dvh; min-height:0; overflow:hidden; }
header { padding:10px 18px; gap:8px; border-bottom:3px solid var(--ink); }
h1 { font-size:28px; letter-spacing:-1px; }

.seg { border-radius:9px; border-color:#b79acb; }

.comic figure:nth-child(2) { transform:rotate(.7deg); }

.story-text [tabindex] { cursor:pointer; }
.cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:minmax(0,1fr);

.scene-banner { width:55%; max-height:150px; aspect-ratio:4/1; object-fit:cover; border:2px solid var(--ink); border-radius:4px; }
.tag-step .comic { max-width:440px; }
.tag-step .comic figure { max-height:105px; }

.dot.current { outline:2px solid var(--brand); outline-offset:2px; }

.meaning.locked { cursor:default; }
.meaning.right { border-color:var(--ok); box-shadow:inset 4px 0 var(--ok); }
.meaning.wrong { border-color:var(--wrong); text-decoration:line-through; }
.meaning.right::before { content:'✓ '; color:var(--ok); font-weight:900; }
.meaning.wrong::before { content:'✕ '; color:var(--wrong); font-weight:900; }
.meaning-step .representation { flex:none; height:145px; padding:6px; }
.meaning-step .model-top .object-art { width:65px; height:65px; }

.meaning-step .representation table { font-size:12px; width:280px; }
.meaning-step .representation td,.meaning-step .representation th { padding:2px 10px; }
.meaning-step .rep-text { font-size:15px; }
.meaning-step .pair { font-size:18px; padding:7px 16px; }
.summary { margin:auto; background:#fff; border:3px solid var(--ink); box-shadow:9px 9px 0 #5b2a862a;

.summary .dots { margin:20px 0; }

.summary { display:flex; flex-direction:column; min-height:0; max-height:100%; }

.recap-item { display:grid; grid-template-columns:23px minmax(0,1fr); gap:2px 7px;
  padding:8px; border:1px solid var(--line); border-radius:5px; background:#fdf9f1; }
.recap-item .dot { grid-row:1/3; align-self:center; }

.crosshair { stroke:var(--brand); stroke-width:2; pointer-events:none; }

<body>
<header>
  <h1>Story Graphs<small>Read the shape. Tell the story.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-match" aria-pressed="true">Match</button>
    <button id="m-sketch" aria-pressed="false">Sketch</button>
    <button id="m-model" aria-pressed="false">Model</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
  <button class="icon-btn" id="read">Read</button>
</header>
<main>
  <div class="stage" id="stage" aria-label="Story notebook"></div>
  <aside class="panel">
    <div class="actions" id="actions"></div>
    <div class="bubble-area">
      <img class="lucia" id="lucia" src="art:lucia-talk" alt="Lucia, your eighth-grade storyteller">
      <p class="bubble" id="bubble"></p>
    </div>
    <div class="dots" id="dots" aria-label="Round marks"></div>
    <div class="privacy">
      <p>Your progress is saved on this device only. It never leaves it.</p>
      <button class="control" id="clear-progress">Clear progress</button>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </aside>
</main>
<dialog id="clear-dialog" aria-labelledby="clear-title">
  <h2 id="clear-title">Clear this notebook?</h2>
  <p>Clear all saved marks and bonus stories on this device?</p>
  <div class="action-row">
    <button class="control" id="keep-progress">Keep progress</button>
    <button class="control primary" id="confirm-clear">Clear saved progress</button>
  </div>
</dialog>
<script src="kit:curio"></script>
<script src="kit:graphing"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const DATA = "json:content";
  const L = {
  "wMatch": "Hi, I'm Lucia. Every graph here tells a story. Tap the graph that tells mine. One of them is a trap.",
  "matchChoose": "Happy with that one? Press Choose this graph.",
  "pickRight": "Yes, that graph tells it.",

  function dragChip(b,d,s) {

    let ghost=null;
    let moved=false;
    let suppressUntil=0;

      ghost?.remove();
      ghost=null;
      start=null;
    };
    const originalClick=b.onclick;
    b.onclick=e=>{
      if(Date.now()<suppressUntil) {e.preventDefault();return;}
      originalClick(e);
    };
    b.onpointerdown=e=>{
      if(b.disabled||e.button) return;
      start=[e.clientX,e.clientY];

    };
    b.onpointermove=e=>{
      if(!start) return;

      e.preventDefault();
      if(!moved) {
        moved=true;
        ghost=document.createElement('div');

        ghost.textContent=b.textContent;
        ghost.setAttribute('aria-hidden','true');
        document.body.append(ghost);
        Curio.tone(380,.04,.025);

      ghost.style.left=e.clientX+'px';
      ghost.style.top=e.clientY+'px';
    };
    b.onpointerup=e=>{
      if(!start) return;
      if(moved) {
        suppressUntil=Date.now()+300;
        const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-piece-index]');
        cleanup();
        if(target&&state.mode==='match'&&!round().done) {
          Curio.tone(460,.06,.035);
          setTag(d,s,+target.dataset.pieceIndex);
        } else hint('Drop the tag onto a numbered piece, or tap a tag to use it.');

  function sketchResult(id,pp,ss) {
    const ps=parts(pp,ss,true);
    const expected=DATA.sketch.find(s=>s.id===id);
    const target=parts(expected.p,expected.s,true);
    const same=ps.map((p,i)=>!!target[i]&&p.d===target[i].d&&p.s===target[i].s);
    const first=pp[0]?.[1], end=pp.at(-1)?.[1];
    const slope=i=>Math.abs(ps[i]?.slope ?? NaN);
    const valid=pp.length>=2&&pp[0][0]===0&&pp.every((p,i)=>p[0]>=0&&p[0]<=12&&p[1]>=0&&p[1]<=8&&(!i||p[0]>pp[i-1][0]));
    const rowRules=target.map(()=>true);
    const require=(i,condition)=>{rowRules[i]=rowRules[i]&&condition;};
    switch(id) {
      case 'K1': require(0,first===0); require(1,slope(1)>slope(0)); break;
      case 'K2':
        require(0,first===0);
        require(1,ps[1]?.b[1]===0&&slope(1)>slope(0));
        require(2,slope(2)>slope(0)&&ps[2]?.b[1]>ps[0]?.b[1]);
        break;
      case 'K3': require(0,first>0); require(2,end===0&&slope(0)===slope(2)); break;
      case 'K4': require(0,first>0); require(1,end===0); break;
      case 'K5': require(0,first===0); require(1,slope(1)>slope(0)); break;
      case 'K6': require(0,first===8); require(1,ps[1]?.b[1]===8); require(2,slope(2)<slope(0)); break;
      case 'K7': require(0,first===0); break;
    }
    const extra=rowRules.every(Boolean);
    const rowOK=same.map((ok,i)=>ok&&!!rowRules[i]);
    return {pass:valid&&ps.length===target.length&&same.every(Boolean)&&extra,ps,same,extra,rowOK};

    const piecePixels=[];
    parts(pp,w.shapes).forEach((p,i)=>{
      const mid=g.px(...bezier(p.a,p.b,p.s,.5));
      let placed=null;
      let best=-Infinity;
      const offsets=[[0,0]];
      [52,76,100].forEach(d=>{
        offsets.push([0,-d],[0,d],[-d,0],[d,0],[-d*.75,-d*.75],[d*.75,-d*.75],[-d*.75,d*.75],[d*.75,d*.75]);
      });
      for(const [dx,dy] of offsets) {
        const candidate=[Math.max(0,Math.min(g.width-6,mid[0]+dx)),
          Math.max(Math.min(24,g.height/2),Math.min(g.height-12,mid[1]+dy))];
        const clearance=Math.min(...pointPixels.concat(piecePixels).map(q=>Math.hypot(candidate[0]-q[0],candidate[1]-q[1])));
        if(clearance>best) {best=clearance;placed=candidate;}
        if(clearance>=48) break;
      }
      const [x,y]=placed;
      piecePixels.push(placed);
      if(Math.hypot(x-mid[0],y-mid[1])>8) {
        svg('line',{x1:mid[0],y1:mid[1],x2:x,y2:y,stroke:'#9374b3','stroke-width':1.3,
          'stroke-dasharray':'2 3','pointer-events':'none'},g.layer('labels'));
      }
      const b=svg('g',{id:'sketch-piece-'+i,class:'piece-dot',transform:`translate(${x},${y})`,role:'button',tabindex:0,
        'aria-label':`Select piece ${i+1}`,'aria-pressed':String(i===w.piece)},g.layer('labels'));
      svg('circle',{r:23},b);
      svg('text',{},b).textContent=i+1;
      b.onclick=e=>{e.stopPropagation();stopPlayback();w.piece=i;render();};
      b.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();stopPlayback();w.piece=i;render();}};
    });
    const [cx,cy]=g.px(...state.cross);
    svg('path',{d:`M${cx-7},${cy}h14M${cx},${cy-7}v14`,class:'crosshair'},g.layer('front'));
    if(pointIndex!==null&&pointIndex!==undefined) {
      el.querySelector(`[data-point="${pointIndex}"]`)?.focus({preventScroll:true});
    }
  }
  function playback() {
    stopPlayback();
    if(state.mode!=='sketch'||state.free||!plot) return;
    const r=round(), s=story();
    const pp=r.shown?s.p:r.points, ss=r.shown?s.s:r.shapes;
    const ps=parts(pp,ss,true);
    if(!ps.length) return;
    if(Curio.reduce) {lightRow(-2);return;}
    state.playing=true;
    const id=++playbackId;
    const duration=Math.min(5000,ps.length*1200), begin=performance.now();
    const dot=plot.point(...pp[0],{color:'var(--brand)',r:8,id:'playback'});
    const frame=now=>{
      if(id!==playbackId||!state.playing) return;
      const t=Math.max(0,Math.min(1,(now-begin)/duration))*ps.length;
      const i=Math.min(ps.length-1,Math.floor(t));
      dot.set(...bezier(ps[i].a,ps[i].b,ps[i].s,Math.min(1,t-i)));
      lightRow(i);
      if(t<ps.length) requestAnimationFrame(frame);
      else {state.playing=false;lightRow(-2);}
    };
    requestAnimationFrame(frame);
  }
  function parseNumber(value) {
    const s=String(value).trim().replace(/^\$/,'').replaceAll('−','-').replaceAll(',','');
    if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s)) return null;
    const a=s.split('/').map(Number);
    const n=a.length===2?a[0]/a[1]:a[0];
    return Number.isFinite(n)?n:null;
  }
  const equal=(a,b)=>a!==null&&Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(b));
  function modelNote(m,b,s) {
    if(equal(m,s.b)&&equal(b,s.m)) return 'Your two numbers look swapped. Which one is there at the start, before anything changes?';
    if(m!==0&&Math.sign(m)!==Math.sign(s.m)) return s.m<0?
      "Your line goes up, but the story's amount goes down.":"Your line goes down, but the story's amount goes up.";
    if(equal(m,1/s.m)) return 'You divided the change in x by the change in y. Rate of change is change in y over change in x.';
    if(equal(m,s.m)&&s.p[0][0]!==0&&equal(b,s.p[0][1])) {
      return 'Your b is the y of the first point, but that point is not at the start. Work back to where x is 0.';
    }
    return "Your line misses the story's points. Check each number.";
  }
  function renderModel() {
    const r=round(), s=story();
    if(r.numbersSettled) $('stage').classList.add('meaning-step');
    chapter('Build the model');
    storyArea('object');
    const rep=document.createElement('div');
    rep.className='representation';
    rep.id='representation';
    $('stage').append(rep);
    if(!s.kind.startsWith('graph')&&(!r.checked||s.kind==='table')) {
      if(s.kind==='table') {
        const table=document.createElement('table');
        table.innerHTML=`<thead><tr><th>${s.symbols[0]} (${s.symbols[2]})</th><th>${s.symbols[1]} (${s.symbols[3]})</th></tr></thead>`;
        const body=document.createElement('tbody');
        s.p.forEach(([x,y])=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${x}</td><td>${y}</td>`;body.append(tr);});
        table.append(body);
        rep.append(table);
      } else if(s.kind==='two points') {
        rep.innerHTML=`<div class="rep-text"><div>${s.symbols[0]}: ${s.symbols[2]}, ${s.symbols[1]}: ${s.symbols[3]}</div>`+
          s.p.map(p=>`<span class="pair">(${p.join(', ')})</span>`).join('')+'</div>';
      } else {
        const board=document.createElement('div');
        board.className='description-board';
        const painting=document.createElement('img');
        painting.className='description-art';
        painting.src=ART[s.art];
        painting.alt='';
        const text=document.createElement('div');
        text.className='rep-text';
        text.innerHTML=`A steady story has a starting amount<br>and a change for each ${s.symbols[2].replace(/s$/,'')}.`;
        board.append(painting,text);
        rep.append(board);
      }
    }
    const eq=document.createElement('div');
    eq.className='equation';
    eq.id='equation';
    const symbol=document.createElement('span');
    symbol.textContent=s.symbols[1]+' =';
    eq.append(symbol);
    ['m','b'].forEach((name,i)=>{
      if(i) {const sign=document.createElement('span');sign.textContent=s.symbols[0]+' +';eq.append(sign);}
      const field=document.createElement('div');
      field.className='number-field';
      const inp=document.createElement('input');
      inp.type='text';
      inp.inputMode='decimal';
      inp.id='number-'+name;
      inp.value=r[name];
      inp.maxLength=40;
      inp.readOnly=!!r.numbersSettled;
      inp.setAttribute('aria-invalid',String(!!r.invalid?.includes(name)));
      inp.oninput=()=>{
        r[name]=inp.value;
        $('model-check').disabled=!r.m.trim()||!r.b.trim()||!!r.numbersSettled;
        hint('Type both numbers, then press Check. Fractions such as 3/20 also work.');
        save();
      };
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkModel();}};
      const label=document.createElement('label');
      label.htmlFor=inp.id;
      label.textContent=i?'initial value (b)':'rate of change (m)';
      inp.setAttribute('aria-label',label.textContent);
      field.append(inp,label);
      eq.append(field);
    });
    $('stage').append(eq);
    const a=row();
    button('model-check','Check',checkModel,{parent:a,primary:true,disabled:!r.m.trim()||!r.b.trim()||!!r.numbersSettled});
    button('next','Next story',next,{parent:a,disabled:!r.done});
    const note=document.createElement('p');
    note.className='note';
    note.id='model-note';
    note.textContent=r.note||'';
    $('actions').append(note);
    if(r.numbersSettled) renderMeanings();
    if(r.done) {
      bubble('Two numbers, and two meanings. That is a model of this story.',r.mark==='Matched'?'cheer':'think');
      hint('Compare the checked meanings with the story. Press Next story.');
    } else if(r.numbersSettled) {
      bubble(r.shown?'The numbers are shown. You can still explain what they mean.':'Now give each number its meaning in this story.');
      hint('Tap one meaning card for each number. Each choice locks.');
    } else {
      bubble('Where does this story start? How fast does the amount change?');
      hint(!r.m&&!r.b?'Type the rate of change and the initial value in the two boxes, then press Check.':
        'Type both numbers, then press Check.');
    }
  }
  function checkModel() {
    const r=round(), s=story();
    if(r.numbersSettled||!r.m.trim()||!r.b.trim()) return;
    const m=parseNumber(r.m), b=parseNumber(r.b);
    r.invalid=['m','b'].filter((_,i)=>[m,b][i]===null);
    if(r.invalid.length) {
      r.note='✕ Type a number, like 4, -3.5 or 3/20';
      render();
      return;
    }
    r.tries++;
    r.checked={m,b};
    r.numberOK=equal(m,s.m)&&equal(b,s.b);
    if(r.numberOK) {
      r.numbersSettled=true;
      r.note='✓ Both numbers fit every point.';
      Curio.yes();
      speak('modelRight',false,{now:true});
    } else if(r.tries>=2) {
      r.numbersSettled=true;
      r.shown=true;
      r.m=String(s.m);
      r.b=String(s.b);
      r.note='Shown: compare these numbers with the story.';
      speak('modelShown',false,{now:true});
    } else {
      r.note=modelNote(m,b,s);
      speak('modelWrong',false,{now:true});
    }
    render();
    save();
  }
  function drawModel() {
    const r=round(), s=story(), el=$('representation');
    if(!el||(!s.kind.startsWith('graph')&&!r.checked)) return;
    if(getComputedStyle(el).display==='none') return;
    const givenTable=el.querySelector('table');
    el.replaceChildren();
    let graphHost=el;
    if(givenTable) {
      el.classList.add('with-graph');
      el.append(givenTable);
      graphHost=document.createElement('div');
      graphHost.className='model-graph';
      el.append(graphHost);
    }
    const xs=s.p.map(p=>p[0]), ys=s.p.map(p=>p[1]);
    const maxX=s.id==='R4'?10:s.id==='R5'?45:s.id==='R9'?14:Math.max(...xs)*1.12;
    const maxY=s.id==='R4'?100:s.id==='R5'?8:s.id==='R9'?8:Math.max(...ys,s.b)*1.15;
    const grid=s.id==='R4'?[1,10]:s.id==='R5'?[5,.5]:s.id==='R9'?[1,1]:[Math.max(1,Math.ceil(maxX/8)),Math.max(1,Math.ceil(maxY/8))];
    const g=plot=makePlane(graphHost,`${s.symbols[1]} (${s.symbols[3]})`,{model:true,x:[0,maxX],y:[0,maxY],
      grid,labels:[grid[0]*2,grid[1]*2],tickFormat:v=>Plane.fmt(v),xLabel:`${s.symbols[0]} (${s.symbols[2]})`});
    const domain=s.id==='R5'?[10,40]:[0,Math.max(...xs)];
    if(s.kind.startsWith('graph')||r.numbersSettled) {
      g.segment([domain[0],s.m*domain[0]+s.b],[domain[1],s.m*domain[1]+s.b],{color:1,width:3});
    }
    if(r.checked) {
      g.fn(x=>r.checked.m*x+r.checked.b,{color:2,domain:[0,maxX],width:3,label:'Your checked model'});
      s.p.forEach(([x,y])=>{
        const value=r.checked.m*x+r.checked.b;
        if(equal(value,y)) g.point(x,y,{color:2,shape:'diamond',r:10});
        else g.segment([x,y],[x,value],{color:'var(--wrong)',width:2});
      });
    }
    s.p.forEach(([x,y])=>g.point(x,y,{color:1,r:5}));
  }
  function renderMeanings() {
    const r=round(), s=story();
    const box=document.createElement('div');
    box.className='meanings';
    box.id='meanings';
    s.meanings.forEach((cards,col)=>{
      const c=document.createElement('div');
      c.className='meaning-col';
      const h=document.createElement('h3');
      h.textContent=`What does ${Math.abs(col?s.b:s.m)} mean here?`;
      c.append(h);
      r.meaningOrder[col].forEach((index,j)=>{
        const b=document.createElement('button');
        b.className='meaning';
        b.id=`meaning-${col}-${j}`;
        b.textContent=cards[index];
        if(r.meanings[col]!==null) {
          b.classList.add('locked');
          b.setAttribute('aria-disabled','true');
          if(index===0) b.classList.add('right');
          if(index===r.meanings[col]&&index!==0) b.classList.add('wrong');
        }
        b.onclick=()=>{
          stopPlayback();
          if(r.meanings[col]!==null) return;
          r.meanings[col]=index;
          const eventId=index===0 ? 'meaningRight' : 'meaningWrong';
          if(index===0) Curio.yes();
          else {r.note=cards[0];Curio.tone(190,.08,.035);}
          if(col===0) {
            speak(eventId,false,{now:true,key:eventId+'-m'});
            if(r.pendingMeaningB) {
              speak(r.pendingMeaningB,false,{key:r.pendingMeaningB+'-b'});
              r.pendingMeaningB=null;
            }
          } else if(r.meanings[0]!==null) speak(eventId,false,{now:true,key:eventId+'-b'});
          else r.pendingMeaningB=eventId;
          if(r.meanings.every(v=>v!==null)) {
            const both=r.meanings.every(v=>v===0);
            settle(r.numberOK&&r.tries===1&&both?'Matched':r.shown&&r.meanings.every(v=>v!==0)?'Shown':'Partly');
            if(r.addedSpare) speak('spareAdded',true);
          }
          render();
          save();
        };
        c.append(b);
      });
      box.append(c);
    });
    $('stage').append(box);
  }
  document.addEventListener('keydown',e=>{
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
    const el=e.target;
    if(el.tagName!=='BUTTON') return;
    const group=el.closest('.cards,.tag-grid,.meaning-col,.seg');
    if(!group) return;
    const bs=[...group.querySelectorAll('button')].filter(b=>!b.disabled);
    const i=bs.indexOf(el);
    if(i<0) return;
    e.preventDefault();
    bs[(i+(['ArrowLeft','ArrowUp'].includes(e.key)?-1:1)+bs.length)%bs.length].focus({preventScroll:true});
  });
  modes.forEach(m=>$('m-'+m).onclick=()=>setMode(m));
  $('clear-progress').onclick=()=>{
    stopPlayback();
    V.hush();
    $('clear-dialog').showModal();
    $('keep-progress').focus({preventScroll:true});
  };
  const closeConfirm=()=>{
    $('clear-dialog').close();
    $('clear-progress').focus({preventScroll:true});
  };
  $('keep-progress').onclick=closeConfirm;
  $('clear-dialog').addEventListener('cancel',e=>{e.preventDefault();closeConfirm();});
  $('confirm-clear').onclick=()=>{
    V.hush();
    modes.forEach(m=>state[m]=newMode(m));
    state.free=false;
    save();
    render();
    closeConfirm();
  };
  Curio.init({clips:"voice:*",rate:.95});
  Curio.onMotion(()=>{stopPlayback();if(Curio.reduce)lightRow(-2);});
  let resizeTimer;
  new ResizeObserver(()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{stopPlayback();planes=[];drawPlanes();},80);
  }).observe($('stage'));
  window.__tool={state,setMode,allLines:V.allLines,vlog:V.log,get vq(){return V.queue;},
    data:DATA,parseNumber,sketchResult,modelNote,parts,reads,bezier,render,addPoint,checkSketch,checkModel,
    get plot(){return plot;}};
  render();
})();

</script>
</body>
