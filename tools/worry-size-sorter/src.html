  .panel:has(#keepNext) #panelContent {display:grid; grid-template-columns:1fr 1fr}

}

<body>
<header>
  <h1>Worry Size Sorter <small>Size it. Try a tool. Get help.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-sort" data-mode="sort" aria-pressed="true">🧺 Sort</button>
    <button id="m-clues" data-mode="clues" aria-pressed="false">💓 Body clues</button>
    <button id="m-tools" data-mode="tools" aria-pressed="false">🛠 Tools</button>
    <button id="m-week" data-mode="week" aria-pressed="false">📅 My week</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">Read</button>
</header>
<main>
  <section class="stage" id="stage" aria-label="Activity"></section>
  <aside class="panel" aria-label="Instructions and choices"><p id="hint" role="status"></p><div id="panelContent"></div></aside>
</main>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const D = "json:worry-data";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const art = {
    'ws-kid-stand':'art:ws-kid-stand','ws-kid-fists':'art:ws-kid-fists','ws-kid-shoulders':'art:ws-kid-shoulders',
    'ws-kid-toes':'art:ws-kid-toes','ws-kid-loose':'art:ws-kid-loose','ws-basket':'art:ws-basket',
    'ws-cloud-big':'art:ws-cloud-big','ws-cloud-mid':'art:ws-cloud-mid','ws-cloud-small':'art:ws-cloud-small',
    'ws-worry-box':'art:ws-worry-box','ws-icon-morning':'art:ws-icon-morning',
    'ws-icon-afterschool':'art:ws-icon-afterschool','ws-icon-bedtime':'art:ws-icon-bedtime',
    'ws-card-test':'art:ws-card-test','ws-card-book':'art:ws-card-book','ws-card-podium':'art:ws-card-podium',
    'ws-card-pool':'art:ws-card-pool','ws-card-bench':'art:ws-card-bench','ws-card-boxes':'art:ws-card-boxes',
    'ws-card-kitchen':'art:ws-card-kitchen','ws-card-folder':'art:ws-card-folder','ws-card-door':'art:ws-card-door',
    'ws-card-bedside':'art:ws-card-bedside','ws-card-tablet':'art:ws-card-tablet',
    'ws-card-bus':'art:ws-card-bus','ws-card-calendar':'art:ws-card-calendar'

  const icons = ['□','☁','✊','▣'];
  const sizes = ['Small','Medium','Big'];
  const meanings = ['I can handle it with a tool.','A tool, and talk it over with someone.','Tell a trusted adult. Now.'];
  const whos = ['A grown-up at home','My teacher','A friend','Me (a note or alarm)'];
  const times = ['Morning','After school','Bedtime'];
  const becauseClues = ['fast heart','fast breathing','tight muscles','busy thoughts'];
  const adults = ['Parent or caregiver','Grandparent','Teacher','School counselor','Coach','Doctor'];
  const ways = ['I need to tell you something important.','Something is worrying me and I need help.',

  const tooBig = 'Tell a trusted adult if a worry: lasts for weeks, gets in the way of school, home or play, '

  const L = {
    wSort:'Every worry is real. Its size is how much help it needs. Drag the card into Small, Medium or Big.',
    sortPremise:'Every worry is real. Its size is about how much help it needs.',
    wClues:'Worry shows up in your body. Tap a ring on the kid to see where.',
    wTools:'Pick a tool. First, tap the meter to show how worried your body feels.',
    wWeek:'Pick a tool for your week plan.',
    weekTime:'Pick a time of day for your practice.',
    weekWho:'Pick who helps you remember.',
    weekBecause:'Pick the body clue this tool helps.',
    weekNext:'Tap Next to continue your plan.',
    weekSet:'Tap Set my goal to start your week.',
    howAfter:'Tap the meter again. How does your body feel now?',
    big:'This one is Big. Tell a trusted adult. Keep telling until someone helps.',
    bIn:'Breathe in.',bHold:'Hold.',bOut:'Breathe out.',sqz:'Squeeze your fists.',letgo:'Now let go.',
    sqzShoulders:'Lift your shoulders.',sqzFeet:'Curl your toes.',
    meterDown:'Your meter went down. You reported feeling calmer.',meterOther:"That's okay. Try another tool, or talk to someone.",
    meterCalm:'You started calm. Practicing can help you get ready for a hard day.',
    meterStopped:'You stopped early. Check how you feel. You can try again, or talk to someone.',
    goalSet:'Your goal is set. Check off each day you do it.',checked:'Checked. Nice work.',
    weekEnd:'Your week is done. Tap any reflection chips that fit. Then choose your next week.',
    weekEarly:'Look at your week so far. Choose what fits, or leave the chips blank. Then choose your next week.',
    breathDone:'Tap Done to check your meter, or tap One more round.',
    breathLimit:'Tap Done, then rate your meter again.',
    squeezeShoulders:'Tap Next part. Pull your shoulders up to your ears, then let go when the picture changes.',
    squeezeFeet:'Tap Next part. Curl your toes, then let go when the picture changes.',
    startBreath:'Tap Start. Follow the dot around the square. Stay comfortable; never strain.',
    startTalk:'Tap a Facts, Plan or Brave reply. Say it out loud, or in your head.',
    startSqueeze:'Tap Start. Make two tight fists, then let go when the picture changes.',
    startBox:'Tap Fold it. Then tap Put it in the box.',
    boxed:'Your worry is in the box. Pick a worry time with a grown-up, 10 minutes, not at bedtime, to open it and talk.',
    private:'You never have to tell the class. Tell one grown-up you trust.',
    keepTelling:"If that grown-up doesn't help, keep telling until someone does.",danger:'Danger right now? Call 911.',
    cardText:D.cards.map(c=>c.text),cardReasons:D.cards.map(c=>c.reason),clueText:D.clues.map(c=>c.text),
    talkText:Object.values(D.talk).flat(),ways,tooBig
  };
  const state = {
    mode:'sort',order:[],index:0,picked:false,placements:[],last:null,ended:false,
    tool:0,toolStep:1,before:null,after:null,sourceCard:null,worry:'s1',replies:[],running:false,
    phase:0,count:4,phaseCount:4,rounds:0,targetRounds:2,squeezePart:0,folded:false,boxed:false,practiceDone:false,
    clue:null,results:{},tried:[],helpers:[],week:null,builder:{tool:null,when:null,who:null,clue:null},
    buildRow:0,reflect:false,resetConfirm:false,storageOK:true,reflectionPicks:{help:[],barrier:[]},bigUntil:0
  };
  let timer=0;
  let raf=0;
  let runToken=0;
  let ghost=null;
  let dragStart=null;
  let suppressClick=false;
  const V = Curio.voice({
    lines:L,scope:()=>state.mode+(state.mode==='tools'?state.tool:''),hint:false,
    speaks:'#worryCard,.basket,.meter button',
    welcome:()=> {
      if(state.mode==='sort' && !state.picked && !state.last && !state.ended) return 'wSort';
      if(state.mode==='clues' && state.clue===null) return 'wClues';
      if(state.mode==='tools' && state.toolStep===1) return 'wTools';
      if(state.mode==='week' && !state.week) return 'wWeek';
      return null;
    },
    read:()=>[$('hint').textContent,...readPanel()]
  });
  function readPanel() {
    if(state.mode==='sort') {
      const c=currentCard();
      if(state.last?.card.size==='Big') {
        return [L.sortPremise,state.last.card.text,state.last.card.reason,L.big,...adults,...ways,L.keepTelling,L.danger,L.private];
      }
      return c?[L.sortPremise,c.text,...sizes.map((s,i)=>s+'. '+meanings[i]),$('panelContent').innerText]:
        [L.sortPremise,$('panelContent').innerText];
    }
    return [$('panelContent').innerText];
  }
  function cue(key,valid=()=>true) {V.say(key,{valid,hint:false,now:true});}
  function how(key) {V.how(key,{hint:false,now:true});}
  function hint(text) {$('hint').textContent=text;}
  function img(name,cls='',alt='') {
    return `<img src="${art[name]}" class="${cls}" alt="${esc(alt)}" draggable="false">`;
  }
  function btn(id,text,primary=false,extra='') {
    return `<button id="${id}" class="action ${primary?'primary':''}" ${extra}>${text}</button>`;
  }
  function bind(id,fn) {
    const el=$(id);
    if(el) el.onclick=()=>{Curio.tone(440,.045,.025);fn();};
  }
  function preserveRender(fn) {
    const id=document.activeElement?.id;
    fn();
    if(id && $(id) && !$(id).disabled) $(id).focus({preventScroll:true});
  }
  function shuffle(a) {
    const arr=[...a];
    for(let i=arr.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }
  function newSort() {
    const small=shuffle(D.cards.filter(c=>c.size==='Small'));
    const medium=shuffle(D.cards.filter(c=>c.size==='Medium'));
    const easy=shuffle([...small.slice(1),...medium.slice(1)]);
    const big=shuffle(D.cards.filter(c=>c.size==='Big'));
    state.order=[small[0],medium[0]];
    const slots=shuffle([0,1,2,3,4,5,6]).slice(0,5);
    for(let i=0;i<=easy.length;i++) {
      if(slots.includes(i)) state.order.push(big.pop());
      if(i<easy.length) state.order.push(easy[i]);
    }
    state.index=0;
    state.picked=false;
    state.last=null;
    state.placements=[];
    state.ended=false;
  }
  function currentCard() {return state.order[state.index];}
  function stopRun() {
    runToken++;
    clearTimeout(timer);
    cancelAnimationFrame(raf);
    state.running=false;
  }
  function setMode(mode,fromSort=false) {
    if(state.mode===mode && !fromSort) return;
    const moveFocus=document.activeElement?.tagName!=='BODY' && !document.activeElement?.closest('header');
    stopRun();
    V.hush();
    removeGhost();
    state.mode=mode;
    if(mode==='tools') resetTool();
    if(mode==='tools' && !fromSort) state.sourceCard=null;
    if(mode==='week' && state.week && dayIndex(state.week.start)>=7) state.reflect=true;
    render();
    if(moveFocus) {
      const next=mode==='tools'?$('meter3'):mode==='sort'?($('nextWorry')||$('worryCard')||$('makeWeek')):
        mode==='clues'?$('clue0'):state.week?($('help0')||$('day0')):document.querySelector('.builder .choice');
      next?.focus({preventScroll:true});
    }

  }
  function render() {
    document.body.dataset.mode=state.mode;

    if(state.mode==='sort') renderSort();
    if(state.mode==='clues') renderClues();
    if(state.mode==='tools') renderTools();
    if(state.mode==='week') renderWeek();
  }
  function renderSort() {
    const c=currentCard();
    const held=state.picked?'Picked up. Tap a basket.':'Tap or drag to pick up';
    const card=state.ended?'<div class="goal-card"><h2>Every worry has a place.</h2><p>Big worries get help.</p></div>':
      `<div class="card-stack"><button id="worryCard" class="worry-card ${state.picked?'picked':''} ${state.last?'placed':''}"
      aria-pressed="${state.picked}" aria-label="${esc(c.text)} Pick up worry card" ${state.last?'aria-disabled="true"':''}>
      ${img(c.art)}<span class="card-text">${esc(c.text)}</span></button>
      <p class="card-caption">${state.last?'Sorted. Look at the help beside it.':held}</p></div>`;
    $('stage').innerHTML=`<div class="sort-world">${card}
      <p class="principle">${L.sortPremise}</p>
      <div class="baskets">${sizes.map((s,i)=> {
        const items=state.placements.filter(p=>p.basket===s);
        return `<button id="basket${i}" class="basket" style="--basket:var(--${s.toLowerCase()})" aria-label="${s}. ${meanings[i]}">
          ${img('ws-basket','basket-art')}<span class="basket-label"><b>${s}</b><span class="meaning">${meanings[i]}</span></span>
          <span class="thumbs">${items.map(p=>img(p.card.art,'',p.card.text)).join('')}</span>
          <span class="basket-count">${items.length?items.length+' sorted':''}</span></button>`;
      }).join('')}</div></div>`;
    sizes.forEach((s,i)=>bind('basket'+i,()=>place(s)));
    if(c && !state.ended) {
      bind('worryCard',()=> {
        if(suppressClick) {suppressClick=false;return;}
        if(state.last) return;
        state.picked=!state.picked;
        preserveRender(renderSort);
      });
      $('worryCard').onpointerdown=startDrag;
    }
    if(state.ended) {renderSortEnd();return;}
    if(!state.last) {
      hint(state.picked?'Picked up. Tap Small, Medium or Big. Or use an arrow key and Enter.':
        'Drag the card into Small, Medium or Big. Or tap the card, then tap a basket.');
      $('panelContent').innerHTML=`<p class="eyebrow">How much help?</p><h2>Make room for the worry.</h2>
        <p>Small and Medium can feel different to different people.</p>
        <p class="note">Big worries go to a trusted adult, every time.</p>
        <p class="muted">${state.placements.length} of 13 sorted</p>`;
      return;
    }
    const last=state.last;
    if(last.card.size==='Big') {
      hint('Tell one grown-up you trust. Tap Next worry when you are ready.');
      $('panelContent').innerHTML=`<h2>${last.requested==='Big'?'Yes, this one is Big.':'This one is Big.'}</h2>
        <p>${esc(last.card.reason)}</p><div class="big-panel"><h3>Big worries go to a trusted adult, every time.</h3>
        <div class="adult-chips">${adults.map(a=>`<span>${a}</span>`).join('')}</div>
        <div class="ways"><b>Ways to start</b>${ways.map(w=>`<p>“${esc(w)}”</p>`).join('')}</div>
        <p>${L.keepTelling}</p><b>${L.danger}</b><p>${L.private}</p></div>
        ${btn('nextWorry',performance.now()<state.bigUntil?'Listening…':'Next worry ▶',true)}
        <p class="muted">${state.placements.length} of 13 sorted</p>`;
    } else {
      hint('Tap Try a tool on it, or tap Next worry.');
      const note=last.basket==='Big'?'<p>Telling a trusted adult is never wrong. A coping tool could also help with this worry.</p>':
        `<p>One way to size it: ${last.card.size}.</p><p class="note"><b>It gets bigger if</b> ${esc(last.card.reason)}</p>`;
      $('panelContent').innerHTML=`<h2>${last.basket==='Big'?'Telling is never wrong.':'You put it in '+last.basket+'.'}</h2>
        ${note}${btn('tryTool','Try a tool on it',true)}${btn('nextWorry','Next worry ▶')}
        <p class="muted">${state.placements.length} of 13 sorted</p>`;
      bind('tryTool',()=> {
        state.sourceCard=last.card.id;
        state.worry=last.card.id;
        setMode('tools',true);
      });
    }
    bind('nextWorry',nextWorry);
  }
  function renderSortEnd() {
    const count=state.placements.filter(p=>p.basket==='Big').length;
    const extra=state.placements.filter(p=>p.basket==='Big' && p.card.size!=='Big').length;
    const note=extra?`You put ${extra} in Big that a tool could also help. Telling is never wrong; a tool can help while you wait.`:
      !state.tried.length?'Pick one worry and try a tool on it.':'Tools you tried: '+state.tried.map(i=>names[i]).join(', ')+'.';
    hint('Tap Make my week goal, or tap Sort again.');
    $('panelContent').innerHTML=`<p class="eyebrow">Your sort</p><h2>You sorted 13 worries.</h2>
      <p>Big: ${count}. Every Big one goes to a trusted adult.</p><p class="note">${note}</p>
      ${btn('makeWeek','Make my week goal ▶',true)}${!state.tried.length?btn('endTool','Try a tool'):''}${btn('sortAgain','Sort again')}`;
    bind('makeWeek',()=>setMode('week'));
    bind('endTool',()=>setMode('tools'));
    bind('sortAgain',()=>{V.hush();newSort();renderSort();$('worryCard').focus({preventScroll:true});});
  }
  function place(requested) {
    if(state.ended) return;
    if(state.last) {finishBigSlide();return;}
    if(!state.picked) {
      hint(requested+': '+meanings[sizes.indexOf(requested)]+' Tap the card to pick it up.');
      return;
    }
    const focusID=document.activeElement?.id||'';
    const card=currentCard();
    const basket=card.size==='Big'?'Big':requested;
    state.last={card,basket,requested};
    state.placements.push(state.last);
    state.picked=false;
    V.dropQueued(line=>line.key!=='big');
    state.bigUntil=card.size==='Big' && Curio.sound?performance.now()+4000:0;
    renderSort();
    const target=$('basket'+sizes.indexOf(basket));
    if(focusID==='worryCard' || focusID.startsWith('basket')) target.focus({preventScroll:true});
    if(!Curio.reduce) target.classList.add('settle');
    Curio.tone(card.size==='Big'?330:550,.15,.06);
    if(card.size==='Big') {
      const item=state.last;
      if(requested!=='Big' && !Curio.reduce) {
        const el=$('worryCard');
        const a=el.getBoundingClientRect();
        const b=target.getBoundingClientRect();
        const x=b.x+b.width/2-a.x-a.width/2;
        el.animate([{transform:'translate(0,0)'},
          {transform:`translate(${x}px,${b.y-a.y}px) scale(.2) rotate(8deg)`,opacity:.1}],{duration:600,easing:'ease-in-out'});
      }
      Promise.race([V.say('big',{wait:true,hint:false,valid:()=>state.mode==='sort'}),
        Curio.wait(Curio.sound?4000:0)]).then(()=> {
        if(state.last===item) {
          state.bigUntil=0;
          if($('nextWorry')) $('nextWorry').textContent='Next worry ▶';
        }
      });
    }
  }
  function finishBigSlide() {$('worryCard')?.getAnimations().forEach(a=>a.finish());}
  function nextWorry() {
    if(!state.last) return;
    finishBigSlide();
    if(performance.now()<state.bigUntil) {
      $('nextWorry').textContent='Listening…';
      const item=state.last;
      setTimeout(()=>{if(state.mode==='sort' && state.last===item) nextWorry();},Math.max(1,state.bigUntil-performance.now()));
      return;
    }
    V.dropQueued(line=>line.key!=='big');
    state.index++;
    state.last=null;
    state.picked=false;
    if(state.index>=state.order.length) state.ended=true;

  }
  function inside(e,r) {return e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;}
  function removeGhost() {
    ghost?.remove();

  }
  function startDrag(e) {
    if(state.last || e.button!==0) return;

    dragStart={x:e.clientX,y:e.clientY,id:e.pointerId};
    const card=e.currentTarget;
    card.setPointerCapture(e.pointerId);

      if(!dragStart) return;
      if(!ghost && Math.hypot(ev.clientX-dragStart.x,ev.clientY-dragStart.y)>7) {
        state.picked=true;

        ghost.style.top=(ev.clientY-70)+'px';
        document.querySelectorAll('.basket').forEach(b=>b.classList.toggle('over',inside(ev,b.getBoundingClientRect())));
      }
    };
    card.onpointerup=ev=> {
      const dragged=!!ghost;
      const target=[...document.querySelectorAll('.basket')].find(b=>inside(ev,b.getBoundingClientRect()));
      if(dragged && !target && !Curio.reduce) {
        const returning=ghost;
        const home=card.getBoundingClientRect();
        dragStart=null;
        document.querySelectorAll('.over').forEach(b=>b.classList.remove('over'));
        returning.animate([{opacity:.9},{left:(home.x+home.width/2-95)+'px',top:home.y+'px',
          transform:'rotate(0deg)',opacity:0}],{duration:300,easing:'ease-out',fill:'forwards'});
        Curio.wait(300).then(()=>{if(ghost===returning) removeGhost();});
      } else removeGhost();
      if(dragged) {
        suppressClick=true;
        if(target) place(sizes[Number(target.id.slice(-1))]);
        else {state.picked=false;renderSort();}
        setTimeout(()=>{suppressClick=false;},100);
      }
    };
    card.onpointercancel=()=>{removeGhost();state.picked=false;renderSort();};
  }
  function renderClues() {
    $('stage').innerHTML=`<div class="kid-world"><div class="kid-wrap">${img('ws-kid-stand','','A child standing relaxed')}
      <svg class="body-leaders" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M20 36L45 32 M83 42L59 34 M55 52L50 44 M14 66L38 60"/></svg>
      ${D.clues.map((c,i)=>`<button class="hotspot" id="clue${i}" aria-pressed="${state.clue===i}"
        aria-label="${i+1}. ${c.name}">${i+1}</button>`).join('')}</div></div>`;
    const c=state.clue===null?null:D.clues[state.clue];
    hint('Tap a numbered ring to open a body clue.');
    $('panelContent').innerHTML=`<p class="eyebrow">Listen to your body</p><h2>${c?esc(c.name):'Where do you notice worry?'}</h2>
      <p>${c?esc(c.text):'Worry is your body getting ready for a challenge. Tap a ring to see where it shows up.'}</p>
      ${c?`<p class="note"><b>Try:</b> ${esc(c.tools)}</p>`:''}
      <div class="clue-index">${D.clues.map((c,i)=>`<span>${i+1} ${c.name}</span>`).join('')}</div>
      <details ${innerHeight>640?'open':''}><summary>When is a worry too big to carry?</summary><p>${tooBig}</p></details>`;
    D.clues.forEach((c,i)=>bind('clue'+i,()=> {
      state.clue=i;
      V.hush();
      preserveRender(renderClues);
      V.how(c.text,{hint:false,valid:()=>state.clue===i});
    }));
  }
  function resetTool() {
    state.toolStep=1;
    state.before=null;
    state.after=null;

  function rate(n) {

      how(['startBreath','startTalk','startSqueeze','startBox'][state.tool]);
    } else if(state.toolStep===3) {
      state.after=n;
      state.results[state.tool]={before:state.before,after:n};
      if(!state.tried.includes(state.tool)) state.tried.push(state.tool);
      V.hush();
      preserveRender(()=>{renderToolPicture();renderToolPanel();});
      const key=!state.practiceDone?'meterStopped':n===1 && state.before===1?'meterCalm':n<state.before?'meterDown':'meterOther';
      cue(key,()=>state.toolStep===3);
    }

  function meterResult(b,a) {

    if(a>b) return 'Your meter went up. That happens. Try a different tool, or talk to someone.';

    return "Same as before. That's okay. Not every tool works every time. Try another one.";

  function startBreathing() {

  function breathingPhase(token) {
    if(token!==runToken || !state.running) return;
    const phase=state.phase%4;
    state.phaseCount=state.count;
    const duration=state.phaseCount*1000;
    const serial=state.phase;
    V.dropQueued();
    cue(['bIn','bHold','bOut','bHold'][phase],()=>state.running && state.phase===serial);
    const paths=['M45 395V45','M45 45H395','M395 45V395','M395 395H45'];
    $('activeSide').setAttribute('d',paths[phase]);
    $('phaseLabel').textContent=['Breathe in','Hold','Breathe out','Hold'][phase];
    $('roundLabel').textContent='Round '+(state.rounds+1)+' · count of '+state.phaseCount;
    const starts=[[45,395],[45,45],[395,45],[395,395]];
    const ends=[[45,45],[395,45],[395,395],[45,395]];
    const start=performance.now();
    function frame(now) {
      if(token!==runToken || !state.running) return;
      const f=Curio.reduce?0:Math.min(1,(now-start)/duration);
      $('breathDot').setAttribute('cx',starts[phase][0]+(ends[phase][0]-starts[phase][0])*f);
      $('breathDot').setAttribute('cy',starts[phase][1]+(ends[phase][1]-starts[phase][1])*f);
      $('breathCount').textContent=Math.min(state.phaseCount,Math.floor((now-start)/1000)+1);
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    timer=setTimeout(()=> {
      cancelAnimationFrame(raf);
      state.phase++;
      if(state.phase%4===0) state.rounds++;
      if(state.rounds>=state.targetRounds) {
        state.running=false;
        state.practiceDone=true;
        V.dropQueued();
        $('phaseLabel').textContent='Another round?';
        $('breathCount').textContent='✓';
        $('roundLabel').textContent=state.rounds+' rounds practiced';
        preserveRender(renderToolPanel);
        $('stopTool').focus({preventScroll:true});
        how(state.rounds>=4?'breathLimit':'breathDone');
      } else breathingPhase(token);
    },duration);
  }
  function squeezeWords() {

  }
  function startSqueeze() {

  function squeezePhase(loose,duration,token,done) {
    V.dropQueued();
    cue(loose?'letgo':['sqz','sqzShoulders','sqzFeet'][state.squeezePart],

    const start=performance.now();

      if(token!==runToken || !state.running) return;
      const f=Math.min(1,(now-start)/duration);
      if($('squeezeProgress')) $('squeezeProgress').style.width=(100*f)+'%';

  function localDate(date=new Date()) {
    return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
  }
  function dateNumber(s) {
    const [y,m,d]=s.split('-').map(Number);
    return Date.UTC(y,m-1,d)/86400000;
  }
  function dayIndex(start,today=localDate()) {return Math.max(0,dateNumber(today)-dateNumber(start));}
  function dateAt(start,i) {
    const [y,m,d]=start.split('-').map(Number);
    return new Date(y,m-1,d+i,12);
  }
  function saveWeek() {
    try {localStorage.setItem('wss-week',JSON.stringify({week:state.week,helpers:state.helpers}));}
    catch {state.storageOK=false;}
  }
  function loadWeek() {
    try {
      const raw=localStorage.getItem('wss-week');
      if(!raw) return;
      const saved=JSON.parse(raw);
      state.helpers=Array.isArray(saved.helpers)?saved.helpers.filter(i=>Number.isInteger(i)&&i>=0&&i<4):[];
      const w=saved.week;
      if(w && Number.isInteger(w.tool) && w.tool>=0 && w.tool<4 && times.includes(w.when) && whos.includes(w.who)
        && /^\d{4}-\d{2}-\d{2}$/.test(w.start) && Array.isArray(w.checks) && w.checks.length===7) {
        state.week={...w,checks:w.checks.map(Boolean)};

      <p class="note">${because()||'Your reason comes from a meter result or a body clue you pick.'}</p>
      ${b.tool===3?'<p class="note">Use the worry box earlier in the day. Pick Morning or After school, with time to let worries go before sleep.</p>':''}
      ${btn('setGoal','Set my goal',true,!goalReady()?'disabled':'')}<p class="muted">You do not need to feel worried to practice.</p>`;
    for(let i=0;i<4;i++) {
      bind('goalTool'+i,()=> {
        b.tool=i;
        if(i===3 && b.when===2) b.when=null;
        preserveRender(renderBuilder);
        builderHow();
      });
      bind('goalWho'+i,()=>{b.who=i;preserveRender(renderBuilder);builderHow();});
      bind('because'+i,()=>{b.clue=i;preserveRender(renderBuilder);builderHow();});
    }
    for(let i=0;i<3;i++) bind('goalTime'+i,()=>{b.when=i;preserveRender(renderBuilder);builderHow();});
    const builderStep=delta=> {
      state.buildRow=Math.max(0,Math.min(3,state.buildRow+delta));
      renderBuilder();
      const next=document.querySelector('.build-row.active button:not(:disabled)')||
        (!$('setGoal').disabled?$('setGoal'):$('builderBack'));
      next?.focus({preventScroll:true});
      builderHow();
    };
    bind('builderBack',()=>builderStep(-1));
    bind('builderNext',()=>builderStep(1));
    bind('setGoal',setGoal);
  }
  function builderKey() {
    const b=state.builder;
    const compact=innerWidth<600 || (innerHeight<=640 && innerWidth>=600);
    let key='wWeek';
    if(compact) {
      const selected=[b.tool!==null,b.when!==null,b.who!==null,goalReady()][state.buildRow];
      key=state.buildRow<3 && selected?'weekNext':['wWeek','weekTime','weekWho',goalReady()?'weekSet':'weekBecause'][state.buildRow];
    } else {
      key=b.tool===null?'wWeek':b.when===null?'weekTime':b.who===null?'weekWho':goalReady()?'weekSet':'weekBecause';
    }
    return key;
  }
  function builderHow() {
    const key=builderKey();
    const controls={wWeek:'#goalTool0',weekTime:'#goalTime0',weekWho:'#goalWho0',weekBecause:'#because0',
      weekNext:'#builderNext',weekSet:'#setGoal'};
    V.how(key,{hint:false,now:true,needs:controls[key],valid:()=>state.mode==='week' && !state.week && builderKey()===key});
  }
  function setGoal() {
    if(!goalReady()) return;
    const b=state.builder;
    const when=times[b.when];
    const timePhrase=['in the morning','after school','at bedtime'][b.when];
    const who=whos[b.who];
    const helper=who==='Me (a note or alarm)'?'A note or alarm helps me remember.':who+' helps me remember.';
    const sentence=`I will do ${names[b.tool]} ${timePhrase} every day this week. ${helper} ${because()}`;
    state.week={tool:b.tool,when,who,start:localDate(),checks:Array(7).fill(false),sentence};
    state.reflect=false;
    state.reflectionPicks={help:[],barrier:[]};
    saveWeek();
    V.hush();
    renderWeek();
    $('day0').focus({preventScroll:true});
    cue('goalSet');
  }
  const checkedSpoken=new Set();
  function checkDay(i) {
    const w=state.week;
    if(!w || !Number.isInteger(i) || i<0 || i>6) return;
    if(i>dayIndex(w.start)) {
      hint('Come back on '+dateAt(w.start,i).toLocaleDateString('en-US',{weekday:'long'})+' to check this one.');
      return;
    }
    w.checks[i]=!w.checks[i];
    saveWeek();
    preserveRender(renderWeek);
    const key='checked-'+localDate();
    if(w.checks[i] && !checkedSpoken.has(key)) {checkedSpoken.add(key);cue('checked');}
  }
  function weekLine(n) {
    return n===7?"Every day! That's a habit starting.":n>=4?'Most days. Nice work.':n>=1?'A start. What got in the way?':
      'The week got away. That happens. Try an easier time of day.';
  }
  function renderReflection() {
    const n=state.week.checks.filter(Boolean).length;
    const early=dayIndex(state.week.start)<7;
    const helped=['My helper reminded me','I did it at the same time','It made me feel better','It was quick'];
    const barriers=['I forgot','I was busy',"I didn't feel worried",'It felt silly','Someone interrupted'];
    const chips=(group,items)=>`<div class="chip-group">${items.map((s,i)=>`<button id="${group}${i}"
      aria-pressed="${state.reflectionPicks[group].includes(i)}">${s}</button>`).join('')}</div>`;
    hint('Tap any chips that fit, or leave them blank. Then choose your next week.');
    $('stage').innerHTML=`<div class="week-world"><div class="reflection"><p class="eyebrow">Your week, your learning</p>
      <h2>${early?'So far, you practiced':'You did it'} ${n} of 7 days.</h2>
      <p>${early?'Your week is still underway. This is a check-in.':weekLine(n)}</p>
      <h3>What helped, if anything?</h3>${chips('help',helped)}
      <h3>What got in the way, if anything?</h3>${chips('barrier',barriers)}</div>${privacy()}</div>`;
    $('panelContent').innerHTML=`<h2>Next week I will</h2>${btn('keepNext','Keep this goal',true)}
      ${btn('changeTime','Change the time')}${btn('changeTool','Try a different tool')}`;
    for(const [group,items] of [['help',helped],['barrier',barriers]]) {
      items.forEach((s,i)=>bind(group+i,()=> {
        const list=state.reflectionPicks[group];
        const at=list.indexOf(i);
        if(at<0) list.push(i);
        else list.splice(at,1);
        preserveRender(renderReflection);
      }));
    }
    const next=change=> {
      const w=state.week;
      state.builder={tool:change==='tool'?null:w.tool,when:change==='time'?null:times.indexOf(w.when),who:whos.indexOf(w.who),clue:null};
      state.week=null;
      state.reflect=false;
      state.buildRow=change==='time'?1:0;
      saveWeek();
      renderWeek();
      const field=change==='time'?'goalTime0':change==='tool'?'goalTool0':'goalTool'+state.builder.tool;
      $(field)?.focus({preventScroll:true});
    };
    bind('keepNext',()=>next('keep'));
    bind('changeTime',()=>next('time'));
    bind('changeTool',()=>next('tool'));
  }
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{Curio.tone(440,.05,.025);setMode(b.dataset.mode);});
  addEventListener('keydown',e=> {
    if(e.altKey || e.ctrlKey || e.metaKey || e.target.tagName==='SELECT') return;
    if(state.mode==='sort' && state.picked) {
      if(['1','2','3'].includes(e.key)) {e.preventDefault();place(sizes[Number(e.key)-1]);return;}
      if(e.key==='Escape') {
        e.preventDefault();
        state.picked=false;
        renderSort();
        $('worryCard').focus({preventScroll:true});
        return;
      }
      if(e.key.startsWith('Arrow')) {
        e.preventDefault();
        const old=Number(document.activeElement.id.slice(-1));
        const delta=['ArrowLeft','ArrowUp'].includes(e.key)?-1:1;
        const next=Number.isFinite(old)?(old+delta+3)%3:0;
        $('basket'+next).focus({preventScroll:true});
        return;
      }
    }
    if(['1','2','3','4'].includes(e.key)) {
      e.preventDefault();
      setMode(['sort','clues','tools','week'][Number(e.key)-1]);
    }
  });
  Curio.init({clips:"voice:*",rate:.95});
  Curio.onMotion(reduce=> {
    if(reduce) document.getAnimations().filter(a=>a.effect.getTiming().iterations!==Infinity).forEach(a=>a.finish());
  });
  loadWeek();
  newSort();
  render();
  window.__tool={state,setMode,allLines:V.allLines,vlog:V.log,get vq(){return V.queue;},
    meterResult,dayIndex,weekLine,goalReady,checkDay,newSort,place,rate,afterTool,localDate,render};
})();
</script>
</body>
</html>
