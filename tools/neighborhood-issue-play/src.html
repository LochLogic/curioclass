<body data-step="Street">

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const STEPS = ['Street','Characters','Theater','Scenes','Perform'];
  const SCENES = ['The problem','The clash','A try at a fix'];
  const N = [

    if (scene===1) {
      if (slot===3) return b?'And you are in mine.':c.blocker==='Nobody'?'Then we agree.':`${wantClause(c)}, but an obstacle remains.`;
      if (slot===0) return `${wantClause(c)}. That is what we need!`;
      if (slot===1) return b?`But I want ${want(c)}. That matters too!`:
        `${wantClause(c)}, but ${c.blocker==='The rules'?'the rules say no':c.blocker==='Time'?'there is not enough time':
        c.blocker==='Money'?'there is not enough money':'nobody stands in my way'}.`;
      return b?`You are in my way, ${neighbor(b.id).name}.`:`${wantClause(c)}, but nobody here is stopping me.`;
    }
    if (slot===0) return state.fix?`What if we tried this? ${state.fix}`:'What could we try together?';

    $('top').onclick=() => {
      stopRun(); V.hush(); renderStage(); updatePerformanceControls(); $('reflection-wrap').hidden=true;
      $('hint').textContent=L.welcomePerform; sound();
    };
    $('bow').onclick=() => {
      stopAuto(); run.bowed=true; renderStage(); updatePerformanceControls(); $('reflection-wrap').hidden=false;
      $('controls').prepend($('reflection-wrap'));
      $('controls').scrollTop=0;
      $('reflection').focus({preventScroll:true});
      $('hint').textContent=L.reflect; V.say('bow',{valid:() => run.bowed}); clap();
    };
    $('reflection').oninput=e => { state.reflection=e.target.value; save(); };
    updatePerformanceControls();
  }
  function clap() {
    if (!Curio.sound) return;
    stopClap();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    clapContext=ctx;
    const length=Math.floor(ctx.sampleRate*.12);
    const buffer=ctx.createBuffer(1,length,ctx.sampleRate);
    const samples=buffer.getChannelData(0);
    for (let i=0;i<length;i++) samples[i]=(Math.random()*2-1)*Math.exp(-i/(length*.18));
    for (let i=0;i<7;i++) {
      const source=ctx.createBufferSource();
      const gain=ctx.createGain();
      source.buffer=buffer; gain.gain.value=.05;
      source.connect(gain); gain.connect(ctx.destination); source.start(ctx.currentTime+i*.13);
    }
    clapTimer=setTimeout(stopClap,1500);
  }
  function stopClap() {
    clearTimeout(clapTimer);
    if (clapContext) { clapContext.close().catch(() => {}); clapContext=null; }
  }
  function render() {
    const focus=document.activeElement;
    const focusId=focus?.id;
    const scrollTop=$('controls').scrollTop;
    document.body.dataset.step=state.step;
    makeSteps();
    $('panel-title').textContent={Street:'Listen on the street',Characters:'Build your cast',Theater:'Set the paper stage',
      Scenes:'Write a little drama',Perform:'Your opening night'}[state.step];
    $('hint').textContent=stepHint();
    renderStage();
    if (state.step==='Street') streetControls();
    if (state.step==='Characters') characterControls();
    if (state.step==='Theater') theaterControls();
    if (state.step==='Scenes') sceneControls();
    if (state.step==='Perform') performControls();
    $('controls').scrollTop=scrollTop;
    if (focusId && focus!==document.body && $(focusId) && !$(focusId).disabled && !$('confirm-dialog').open) {
      $(focusId).focus({preventScroll:true});
    } else if (focusId && focus!==document.body && !$('confirm-dialog').open) {
      const next=$('actions').querySelector('button:not(:disabled)')||
        $('controls').querySelector('button:not(:disabled),select:not(:disabled),input:not(:disabled),textarea');
      next?.focus({preventScroll:true});
    }
  }
  document.addEventListener('keydown',e => {
    if (state.step!=='Perform'||$('confirm-dialog').open||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;
    if (e.code==='Space'||e.key==='Enter') { e.preventDefault(); nextLine(); }
  });
  new ResizeObserver(fitTheater).observe($('stage'));
  Curio.onMotion(() => { if (state.step==='Perform') renderStage(); });
  Curio.onSound(on => { if (!on) stopClap(); });
  Curio.init({clips:"voice:*",rate:.94});
  window.__tool={state,run,setMode,allLines:V.allLines,vlog:V.log,checks,suggestion,lineText,readback,
    get vq() { return V.queue; },get revision() { return revision; },data:{neighbors:N,problems:P},render};
  render(); V.welcome();
})();
</script>
</body>
</html>
