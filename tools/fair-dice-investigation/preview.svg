    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#93603c"/><stop offset="1" stop-color="#3a211b"/></linearGradient>
    <linearGradient id="ivory" x2="1" y2="1"><stop stop-color="#fff9dc"/><stop offset="1" stop-color="#d2c4a1"/></linearGradient>
