<!--
SIZE OF EVERYTHING (Curio Class)
Math, grade 8, Common Core 8.EE.A (integer exponents, scientific notation, estimating how many times larger,
operations with numbers in scientific notation). Module "Exponents, Roots and Scientific Notation".
Zoom: one slider through 43 powers of ten, from a proton (about 10^-15 m) to the observable universe (about 10^27 m),
with 39 real things drawn to scale side by side, each with its size in scientific notation, standard form and units.
Compare: two things within 1,000 times of each other; how many times bigger, with copies lined up when it is 12 or less, worked as (a / b) x 10^(m - n), plus a single-digit estimate.
Place it: put a thing on a power-of-ten line; stars for landing within one or two powers.
Write it: slide the decimal point between standard form and scientific notation and watch the exponent count the hops.
Sizes are typical published values (NASA, NIST, encyclopedias), rounded; living things vary. Oort cloud size is an estimate.
Illustrations generated with Google Gemini, edited for Curio Class. Sound synthesized in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<style>

<body>
<header>
  <h1>Size of Everything <small>From a proton to the whole visible universe, in powers of ten.</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<div class="stagewrap" id="stagewrap">
  <div class="scene" id="scene">
    <div class="top">
      <div class="tabs" role="group" aria-label="Mode">
        <button data-mode="zoom" aria-pressed="true">🔭 Zoom</button>
        <button data-mode="cmp" aria-pressed="false">⚖️ Compare</button>
        <button data-mode="place" aria-pressed="false">📍 Place it</button>
        <button data-mode="write" aria-pressed="false">✏️ Write it</button>
      </div>
    </div>

    <div id="zoomview">
      <div class="world" id="world" aria-label="Things drawn to scale. Use the slider, the arrow keys or the mouse wheel to zoom.">
        <div class="sky" id="sky"></div>
        <canvas id="stars" width="1440" height="640"></canvas>
        <div class="ground" id="ground"></div>
        <div id="objs"></div>
        <div id="labs"></div>
        <div class="gapnote" id="gapnote"></div>
        <div class="bar" id="bar"><i></i><span></span></div>
      </div>
      <div class="readout card" id="readout" aria-live="polite"></div>
      <div class="dock">
        <div class="zbtns">
          <button class="b navy" id="zin" title="Zoom in one power of ten (minus key)">÷10 Smaller</button>
          <button class="b navy" id="zout" title="Zoom out one power of ten (plus key)">×10 Bigger</button>
        </div>
        <div class="slider">
          <input type="range" id="zr" min="-14.4" max="27.3" step="0.01" aria-label="Screen width, power of ten in meters">
          <div class="track"></div><div class="ticks" id="ticks"></div><div class="thumb" id="thumb"></div>
        </div>
        <div class="zbtns">
          <button class="b go" id="tour">▶ Tour</button>
          <div style="font:700 14px 'Segoe UI',sans-serif;color:var(--muted);text-align:center" id="wide">Screen width</div>
        </div>
      </div>
    </div>

    <div id="cmpview" class="cmp" hidden>
      <div class="cstage" id="cstage"></div>
      <div class="chooser" id="chooser" hidden></div>
      <div class="cside">
        <div class="pick"><button id="pa"></button><button id="pb"></button></div>
        <div class="card"><div class="math" id="math"></div></div>
        <div style="display:flex;gap:10px"><button class="b" id="swap">⇄ Swap</button><button class="b" id="rand">🎲 Surprise pair</button></div>
      </div>
    </div>

    <div id="placeview" class="place" hidden>
      <div class="pcard"><div class="pic" id="ppic"></div><div class="card" id="ptext"></div></div>
      <div class="pmsg" id="pmsg"></div>
      <div class="line" id="pline"></div>
      <div style="position:absolute;left:70px;right:70px;top:650px;display:flex;justify-content:space-between;align-items:center">
        <div class="prog" id="pprog"></div>
        <div style="display:flex;gap:10px"><button class="b" id="phint">💡 Hint</button><button class="b go" id="pgo">Place it here</button></div>
      </div>
    </div>

    <div id="writeview" class="write" hidden>
      <div class="wtop"><div class="pic" id="wpic"></div><div class="card" id="wtext"></div></div>
      <div class="hops" id="hops"></div>
      <div class="digits" id="digits" aria-live="polite"></div>
      <div class="wctl">
        <button class="b navy" id="wl">◀ Move point left</button>
        <button class="b navy" id="wr">Move point right ▶</button>
        <button class="b go" id="wcheck">Check</button>
      </div>
      <div class="wmsg" id="wmsg"></div>
      <div style="position:absolute;left:70px;right:70px;top:700px;display:flex;justify-content:space-between;align-items:center">
        <div class="prog" id="wprog"></div>
        <button class="b" id="wnext" hidden>Next ▶</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));

  // ---------- sound ----------
  let ac = null, soundOn = true;
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').textContent = soundOn ? '🔔 Sound' : '🔕 Sound'; };
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, at, dur, {type = 'triangle', gain = .12, slide = 0} = {}) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  let lastTick = 0;
  const SFX = {
    tap: () => tone(660, 0, .08, {type: 'sine', gain: .08}),
    // one soft tick each time the view passes a power of ten, higher when small, lower when big
    tick: z => { const now = performance.now(); if (now - lastTick < 60) return; lastTick = now; tone(880 * Math.pow(2, -(z + 15) / 18), 0, .09, {type: 'sine', gain: .05}); },
    whoosh: up => tone(up ? 300 : 900, 0, .35, {type: 'sine', gain: .06, slide: up ? 3 : 1 / 3}),
    good: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .4)),
    ok: () => [523, 659].forEach((f, i) => tone(f, i * .1, .35)),
    miss: () => tone(330, 0, .35, {gain: .08, slide: .75}),
    click: () => tone(1200, 0, .04, {type: 'square', gain: .03})
  };

  // ---------- the things ----------
  // [id, name, coefficient, exponent (meters), what is measured, upright?, fact, glow (painted on black)]
  const RAW = [
    ['proton', 'Proton', 1.7, -15, 'across', 0, 'Protons sit in the center of every atom. About 60,000 of them in a row would reach across one hydrogen atom.'],
    ['hydrogen', 'Hydrogen atom', 1.06, -10, 'across', 0, 'The smallest atom: one proton and one electron. Almost all of it is empty space.'],
    ['water', 'Water molecule', 2.8, -10, 'across', 0, 'One drop of water holds more than 10<sup>21</sup> of these molecules.'],
    ['dna', 'DNA strand', 2, -9, 'wide', 0, 'Only 2 nanometers wide, but the DNA in one of your cells would stretch about 2 meters if it were unwound.'],
    ['virus', 'Flu virus', 1, -7, 'across', 0, 'Too small for a classroom microscope. Scientists see viruses with electron microscopes.'],
    ['bacterium', 'E. coli bacterium', 2, -6, 'long', 0, 'Most kinds of E. coli live harmlessly in your gut. About 500 would fit end to end across the period at the end of this sentence.'],
    ['bloodcell', 'Red blood cell', 7.5, -6, 'across', 0, 'You have roughly 25 trillion (2.5 × 10<sup>13</sup>) of them, carrying oxygen all over your body.'],
    ['pollen', 'Sunflower pollen grain', 3, -5, 'across', 0, 'The spikes help pollen cling to bees as they fly from flower to flower.'],
    ['hair', 'Human hair', 7, -5, 'wide', 0, 'Hair width varies from about 20 to 180 micrometers. You can see a hair because it is long, not because it is wide.'],
    ['mite', 'Dust mite', 2.5, -4, 'long', 0, 'Just too small to see. Dust mites live in carpets and bedding and eat flakes of skin.'],
    ['sand', 'Grain of sand', 1, -3, 'across', 0, 'Sand grains range from 0.06 to 2 millimeters. This coarse grain is about 1 millimeter.'],
    ['ant', 'Ant', 5, -3, 'long', 0, 'Many common ants are about 5 millimeters long and can carry several times their own weight.'],
    ['bee', 'Honeybee', 1.5, -2, 'long', 0, 'A honeybee beats its wings about 230 times every second.'],
    ['golfball', 'Golf ball', 4.27, -2, 'across', 0, 'The rules of golf say a ball must be at least 42.67 millimeters across.'],
    ['apple', 'Apple', 8, -2, 'across', 0, 'A medium apple is about 8 centimeters across.'],
    ['basketball', 'Basketball', 2.4, -1, 'across', 0, 'A full-size basketball is about 24 centimeters across.'],
    ['teen', 'You (age 13)', 1.6, 0, 'tall', 1, 'About 1.6 meters, a typical height at 13. One meter, 10<sup>0</sup>, is the middle of this whole journey.'],
    ['giraffe', 'Giraffe', 5.5, 0, 'tall', 1, 'The tallest land animal. Adult males stand about 5.5 meters to the tips of their horns.'],
    ['bus', 'School bus', 1.2, 1, 'long', 0, 'A full-size school bus is about 12 meters (40 feet) long.'],
    ['whale', 'Blue whale', 2.5, 1, 'long', 0, 'The largest animal known to have ever lived. Big ones reach about 25 to 30 meters.'],
    ['liberty', 'Statue of Liberty', 9.3, 1, 'tall', 1, 'From the ground to the tip of the torch, pedestal included: about 93 meters.'],
    ['eiffel', 'Eiffel Tower', 3.3, 2, 'tall', 1, 'About 330 meters to the tip of its antenna.'],

      <div style="border-top:2px dashed #d8cfbd;margin:8px 0"></div>
      <div>Divide: <span style="white-space:nowrap">(${trimC(big.c)} ÷ ${trimC(small.c)}) × ${expo(big.e)} ÷ ${expo(small.e)}</span></div>
      <div>= ${trimC(+q.toPrecision(3))} × ${expo(de)} <span style="color:var(--muted);font-size:16px">(subtract the exponents: ${big.e} − (${small.e}) = ${de})</span></div>
      <div class="eq">≈ ${trimC(+qc.toPrecision(3))} × ${expo(qe)} times as big</div>
      <div style="font-size:17px;color:var(--muted)">Quick estimate: ${ba} × ${expo(big.e + bx)} ÷ ${sa} × ${expo(small.e + sx)} ≈ ${+(ba / sa).toPrecision(2)} × ${expo((big.e + bx) - (small.e + sx))}</div>
      <p style="font-family:'Segoe UI',sans-serif;font-size:17px;margin-top:8px">${count ? `It would take about <b>${count}</b> ${plural(small)} lined up to match ${the(big)}.` : `That number is too big to count out: ${expo(qe)} is a 1 with ${qe} zeros.`}</p>`;
    drawCmp(big, small, ratio);
  }
  const the = o => /^(The |Earth|Jupiter|Mount|Burj|Eiffel|Statue|Orbit|Oort|Orion|Omega|Large|Milky|Local|Laniakea|Observable|You)/.test(o.name) ? o.name.replace(/^The /, 'the ').replace(/^You \(age 13\)/, 'you') : 'a ' + o.name.toLowerCase();
  const plural = o => ({'You (age 13)': '13-year-olds', 'The Moon': 'Moons', 'The Sun': 'Suns', 'Earth': 'Earths', 'Jupiter': 'Jupiters', 'E. coli bacterium': 'E. coli bacteria', 'Grain of sand': 'grains of sand', 'Human hair': 'hairs, side by side,', 'DNA strand': 'DNA strands, side by side,', 'Sunflower pollen grain': 'pollen grains'})[o.name] || o.name.replace(/^The /, '').toLowerCase() + (o.name.endsWith('s') ? 'es' : 's');
  function drawCmp(big, small, ratio) {
    const W = 880, H = 560, [top, bot] = skyAt(Math.log10(big.foot) + .2);
    let html = `<div style="position:absolute;inset:0;background:linear-gradient(${top},${bot})"></div>`;
    // the big one fills most of the stage
    // a small enough ratio is shown as copies of the small thing lined up (or stacked, for tall things) to match the big one
    const lineUp = ratio > 1.05 && ratio <= 12, stack = lineUp && big.up && small.up;
    const P = lineUp ? (stack ? 400 / big.h : Math.min(380 / big.w, 400 / big.h)) : Math.min(560 / big.w, 400 / big.h);
    const bw = big.w * P, bh = big.h * P, bx = 60, by = 470 - bh;
    html += `<img src="${big.src}" alt="${big.name}" style="position:absolute;left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;${big.glow ? 'mix-blend-mode:screen' : ''}">`;
    html += `<div class="cl" style="left:${bx + bw / 2}px;top:482px">${big.name}<br>${sciHTML(big.c, big.e)} m</div>`;
    const sw = small.w * P, sh = small.h * P, sx = Math.min(bx + bw + 30, 700), sy = 470 - sh;
    if (lineUp) {
      const n = Math.ceil(ratio - 1e-9), x0 = bx + bw + 40;
      for (let i = 0; i < n; i++) {
        const part = Math.min(1, ratio - i);  // the last copy is cut to the part that fits
        const st = stack ? `left:${x0}px;top:${470 - (i + 1) * sh}px;width:${sw}px;height:${sh}px;clip-path:inset(${(1 - part) * 100}% 0 0 0)` : `left:${x0 + i * sw}px;top:${470 - sh}px;width:${sw}px;height:${sh}px;clip-path:inset(0 ${(1 - part) * 100}% 0 0)`;
        html += `<img src="${small.src}" alt="" style="position:absolute;${st};${small.glow ? 'mix-blend-mode:screen;' : ''}${i % 2 ? 'filter:brightness(.92)' : ''}">`;
      }
      // a bracket shows the copies match the big one
      html += stack ? `<div style="position:absolute;left:${x0 + sw + 12}px;top:${470 - bh}px;width:10px;height:${bh}px;border:3px solid #fff;border-left:0"></div>`
                    : `<div style="position:absolute;left:${x0}px;top:${478}px;width:${bw}px;height:10px;border:3px solid #fff;border-top:0"></div>`;
      html += `<div class="cl" style="left:${x0 + (stack ? sw / 2 : bw / 2)}px;top:${stack ? 482 : 496}px">${+ratio.toPrecision(2)} ${plural(small)}<br>${sciHTML(small.c, small.e)} m each</div>`;
    } else if (Math.max(sw, sh) >= 8) {
      html += `<img src="${small.src}" alt="${small.name}" style="position:absolute;left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;${small.glow ? 'mix-blend-mode:screen' : ''}">`;
      html += `<div class="cl" style="left:${sx + sw / 2}px;top:482px">${small.name}<br>${sciHTML(small.c, small.e)} m</div>`;
    } else {
      // too small to see: a dot at true size (at least 2 px) and a magnifier
      const dx = sx + 4, dy = 466;
      html += `<div style="position:absolute;left:${dx - 2}px;top:${dy - 2}px;width:${Math.max(3, sw)}px;height:${Math.max(3, sh)}px;background:#ffe08a;border-radius:50%;box-shadow:0 0 0 3px #ffe08a55"></div>`;
      const cx = 760, cy = 150, r = 95;
      const ang = Math.atan2(cy - dy, cx - dx), len = Math.hypot(cx - dx, cy - dy) - r;
      html += `<div class="leader" style="left:${dx}px;top:${dy}px;width:${len}px;transform:rotate(${ang}rad)"></div>`;
      html += `<div class="inset" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px"><img src="${small.src}" alt="${small.name}"></div>`;
      const mag = Math.round(Math.log10(150 / Math.max(sw, sh, 1e-300)));
      html += `<div class="cl" style="left:${cx}px;top:${cy + r + 8}px">${small.name}<br>${sciHTML(small.c, small.e)} m<br><span style="color:#ffe08a">shown about ${expo(mag)} times bigger</span></div>`;
    }
    $('cstage').innerHTML = html;
  }
  function openChooser(which) {
    choosing = which; const cur = which === 'a' ? cA : cB;
    const other = which === 'a' ? cB : cA;
    $('chooser').innerHTML = `<h3>Choose thing ${which.toUpperCase()} <small style="font-weight:600;font-size:15px">Things within 1,000 times the size of the ${other.name.toLowerCase()} can be picked, so both fit in the picture.</small></h3>` +
      OBJ.map(o => `<button data-o="${o.id}" class="${o === cur ? 'on' : ''}" ${o !== other && near(o, other) ? '' : 'disabled style="opacity:.3"'}><img src="${o.src}" alt="">${o.name}</button>`).join('');
    $('chooser').hidden = false;
    $('chooser').querySelectorAll('[data-o]').forEach(b => b.onclick = () => { SFX.tap(); if (choosing === 'a') cA = BY[b.dataset.o]; else cB = BY[b.dataset.o]; $('chooser').hidden = true; renderCmp(); });
    ($('chooser').querySelector('.on') || $('chooser').querySelector('button:not([disabled])')).focus();
  }
  $('pa').onclick = () => openChooser('a'); $('pb').onclick = () => openChooser('b');
  $('swap').onclick = () => { [cA, cB] = [cB, cA]; SFX.tap(); renderCmp(); };
  // a surprise pair is always near enough in size to see both
  $('rand').onclick = () => {
    const pairs = []; for (const a of OBJ) for (const b of OBJ) if (a !== b && near(a, b) && a.m / b.m > 1.5) pairs.push([a, b]);
    [cA, cB] = pairs[Math.floor(Math.random() * pairs.length)]; SFX.tap(); renderCmp();
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('chooser').hidden) $('chooser').hidden = true; });

  // ---------- place it ----------
  const LO = -16, HI = 27, LINEW = 1300;
  const xOf = n => (n - LO) / (HI - LO) * LINEW;
  let PL = null;
  function newPlace() {
    const pool = OBJ.filter(o => o.id !== 'teen').sort(() => Math.random() - .5).slice(0, 10);
    PL = {list: pool, i: 0, guess: 0, done: false, res: [], hint: false};
    renderPlace();
  }
  function renderPlace() {
    const o = PL.list[PL.i];
    $('ppic').innerHTML = `<img src="${o.src}" alt="${o.name}">`;
    $('ptext').innerHTML = `<div class="kicker">Thing ${PL.i + 1} of ${PL.list.length}</div><h2>${o.name}</h2><p>How big is it ${o.what.replace(', estimated', '')}? Drag the pin to the power of ten you think is closest, then press <b>Place it here</b>.</p>`;
    let h = '<div class="axis"></div>';
    for (let n = LO; n <= HI; n++) { h += `<div class="tk" style="left:${xOf(n)}px;${n % 3 ? 'height:14px;top:56px' : ''}"></div>`; if (n % 3 === 0) h += `<div class="tl" style="left:${xOf(n)}px">${expo(n)}</div>`; }
    for (const id of ['hydrogen', 'teen', 'earth', 'milkyway']) { const L = BY[id]; h += `<div class="lm" style="left:${xOf(L.e + Math.log10(L.c))}px;top:110px"><img src="${L.src}" alt="">${L.name === 'You (age 13)' ? 'You' : L.name}</div>`; }
    h += `<div class="pin" id="pin" style="left:${xOf(PL.guess)}px" tabindex="0" role="slider" aria-label="Your guess, power of ten" aria-valuemin="${LO}" aria-valuemax="${HI}" aria-valuenow="${PL.guess}"><svg viewBox="0 0 44 64"><path d="M22 62 C22 62 4 34 4 22 a18 18 0 0 1 36 0 C40 34 22 62 22 62Z" fill="#c4472c" stroke="#fff" stroke-width="3"/><circle cx="22" cy="22" r="7" fill="#fff"/></svg></div>`;
    h += `<div id="ptruth"></div>`;
    $('pline').innerHTML = h;
    $('pprog').innerHTML = PL.list.map((_, i) => `<i class="${PL.res[i] === 3 ? 'ok' : PL.res[i] ? 'meh' : ''} ${i === PL.i ? 'now' : ''}"></i>`).join('');
    $('pmsg').innerHTML = `Your guess: <b>about ${expo(PL.guess)} m</b>`;
    $('pgo').textContent = 'Place it here'; $('pgo').disabled = false; $('phint').disabled = false;
    const pin = $('pin'); let dragging = false;
    const setG = n => { PL.guess = Math.max(LO, Math.min(HI, n)); pin.style.left = xOf(PL.guess) + 'px'; pin.setAttribute('aria-valuenow', PL.guess); $('pmsg').innerHTML = `Your guess: <b>about ${expo(PL.guess)} m</b>`; };
    const toN = e => { const r = $('pline').getBoundingClientRect(), s = r.width / LINEW; return Math.round((e.clientX - r.left) / s / LINEW * (HI - LO) + LO); };
    $('pline').onpointerdown = e => { if (PL.done) return; dragging = true; $('pline').setPointerCapture(e.pointerId); const n = toN(e); if (n !== PL.guess) SFX.click(); setG(n); };
    $('pline').onpointermove = e => { if (!dragging) return; const n = toN(e); if (n !== PL.guess) { SFX.click(); setG(n); } };
    $('pline').onpointerup = () => dragging = false;
    pin.onkeydown = e => { if (PL.done) return; if (e.key === 'ArrowLeft') { setG(PL.guess - 1); SFX.click(); e.preventDefault(); } if (e.key === 'ArrowRight') { setG(PL.guess + 1); SFX.click(); e.preventDefault(); } };
  }
  $('phint').onclick = () => {
    const o = PL.list[PL.i], you = BY.teen;
    const k = Math.round(Math.log10(o.m / you.m));
    $('pmsg').innerHTML = k === 0 ? 'Hint: it is about the same size as you.' : `Hint: it is ${k > 0 ? 'bigger' : 'smaller'} than you. ${Math.abs(k) <= 3 ? 'Not by many powers of ten.' : Math.abs(k) <= 9 ? 'By quite a few powers of ten.' : 'By a huge number of powers of ten.'}`;
    SFX.tap();
  };
  $('pgo').onclick = () => {
    if (PL.done) { // next
      PL.i++; PL.done = false;
      if (PL.i >= PL.list.length) { finishPlace(); return; }
      PL.guess = 0; renderPlace(); return;
    }
    const o = PL.list[PL.i], t = o.e + Math.log10(o.c), off = Math.abs(PL.guess - t);
    const stars = off <= 1 ? 3 : off <= 2 ? 2 : off <= 4 ? 1 : 0;
    PL.res[PL.i] = stars || .5; PL.done = true;
    $('ptruth').innerHTML = `<div class="hitzone" style="left:${xOf(t - 1)}px;width:${xOf(t + 1) - xOf(t - 1)}px"></div><div class="truth" style="left:${xOf(t)}px;top:96px"><i></i>${sciHTML(o.c, o.e)} m</div>`;
    const pw = Math.round(t);
    $('pmsg').innerHTML = `<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>${o.name}: <b>${sciHTML(o.c, o.e)} m</b>, about ${words(o.m)}. ${off <= 1 ? 'Right in the neighborhood!' : `You were ${Math.round(off)} powers of ten ${PL.guess > t ? 'too big' : 'too small'}: that is about ${Math.round(off) <= 6 ? Math.pow(10, Math.round(off)).toLocaleString('en-US') : expo(Math.round(off))} times off.`}`;
    (stars === 3 ? SFX.good : stars ? SFX.ok : SFX.miss)();
    $('pgo').textContent = PL.i < PL.list.length - 1 ? 'Next ▶' : 'See my score'; $('phint').disabled = true;
    $('pprog').innerHTML = PL.list.map((_, i) => `<i class="${PL.res[i] === 3 ? 'ok' : PL.res[i] ? 'meh' : ''} ${i === PL.i ? 'now' : ''}"></i>`).join('');
  };
  function finishPlace() {
    const total = PL.res.reduce((a, b) => a + Math.floor(b), 0);
    $('ppic').innerHTML = '<div style="font-size:96px">🏆</div>';
    $('ptext').innerHTML = `<div class="kicker">All ${PL.list.length} placed</div><h2>${total} of ${PL.list.length * 3} stars</h2><p>${total >= 24 ? 'You have a great feel for powers of ten.' : total >= 15 ? 'Good estimating. The far ends, atoms and galaxies, are the hardest.' : 'Try the Zoom tour, then play again. Use yourself, 10<sup>0</sup> m, as a landmark.'}</p>`;
    $('pline').innerHTML = ''; $('pmsg').innerHTML = '';
    $('pgo').textContent = 'Play again'; $('phint').disabled = true;
    $('pgo').onclickSaved = true; PL.again = true;
    SFX.good();
  }
  const placeGo = $('pgo').onclick;
  $('pgo').onclick = () => { if (PL && PL.again) { newPlace(); return; } placeGo(); };

  // ---------- write it ----------
  let WR = null;
  function newWrite() {
    const pool = OBJ.filter(o => o.e >= -9 && o.e <= 9 && o.e !== 0).sort(() => Math.random() - .5).slice(0, 8);
    WR = {list: pool.map((o, i) => ({o, dir: i % 2 ? 'std' : 'sci'})), i: 0, res: []};
    startWrite();
  }
  function startWrite() {
    const r = WR.list[WR.i], o = r.o;
    r.D = trimC(o.c).replace('.', '');
    r.p = r.dir === 'sci' ? o.e + 1 : 1; // digits before the point
    r.tries = 0; r.done = false;
    $('wpic').innerHTML = `<img src="${o.src}" alt="${o.name}">`;
    $('wtext').innerHTML = r.dir === 'sci'
      ? `<div class="kicker">${WR.i + 1} of ${WR.list.length} · to scientific notation</div><h2>${o.name}</h2><p>It is ${standard(o.c, o.e)} meters ${o.what.replace(', estimated', '')}. Move the decimal point until there is <b>one digit, not zero, in front of it</b>. Each hop changes the power of ten by one.</p>`
      : `<div class="kicker">${WR.i + 1} of ${WR.list.length} · to standard form</div><h2>${o.name}</h2><p>It is ${sciHTML(o.c, o.e)} meters ${o.what.replace(', estimated', '')}. Move the decimal point until the power of ten is <b>10<sup>0</sup></b>, which is just 1. Then you have the number written out.</p>`;
    $('wnext').hidden = true; $('wmsg').innerHTML = '';
    drawDigits();
    $('wprog').innerHTML = WR.list.map((_, i) => `<i class="${WR.res[i] === 2 ? 'ok' : WR.res[i] ? 'meh' : ''} ${i === WR.i ? 'now' : ''}"></i>`).join('');
  }
  function drawDigits() {
    const r = WR.list[WR.i], o = r.o, D = r.D, p = r.p, k = o.e - (p - 1);
    let chars = [];
    if (p <= 0) chars = ['0', '.', ...'0'.repeat(-p), ...D].map((c, i) => [c, c === '0' && i !== 0 ? 1 : c === '0' ? 1 : 0]);
    else if (p >= D.length) chars = [...D, ...'0'.repeat(p - D.length)].map((c, i) => [c, i >= D.length ? 1 : 0]);
    else chars = [...D.slice(0, p), '.', ...D.slice(p)].map(c => [c, 0]);
    // padding zeros the hops created are shown lighter
    $('digits').innerHTML = chars.map(([c, z]) => c === '.' ? '<div class="pt">.</div>' : `<div class="d ${z ? 'z' : ''}">${c}</div>`).join('') + `<div class="x">× ${expo(k)}</div>`;
    const start = r.dir === 'sci' ? o.e + 1 : 1, hops = p - start;
    $('hops').innerHTML = hops ? `${Math.abs(hops)} hop${Math.abs(hops) > 1 ? 's' : ''} ${hops < 0 ? 'left' : 'right'}: the exponent went ${hops < 0 ? 'up' : 'down'} by ${Math.abs(hops)}` : 'Same number, written two ways: the hops trade places with the exponent.';
    $('wl').disabled = r.done || p <= -10; $('wr').disabled = r.done || p >= 14;
  }
  $('wl').onclick = () => { const r = WR.list[WR.i]; r.p--; SFX.click(); drawDigits(); };
  $('wr').onclick = () => { const r = WR.list[WR.i]; r.p++; SFX.click(); drawDigits(); };
  $('wcheck').onclick = () => {
    const r = WR.list[WR.i], o = r.o; if (r.done) return;
    const k = o.e - (r.p - 1); r.tries++;
    const ok = r.dir === 'sci' ? r.p === 1 : k === 0;
    if (ok) {
      r.done = true; WR.res[WR.i] = r.tries === 1 ? 2 : 1; SFX.good();
      $('wmsg').innerHTML = r.dir === 'sci' ? `Yes! <b>${standard(o.c, o.e)} = ${sciHTML(o.c, o.e)}</b>. ${o.e < 0 ? `A small number has a <b>negative</b> exponent: the point hopped ${-o.e} places right.` : `A big number has a <b>positive</b> exponent: the point hopped ${o.e} places left.`}`
        : `Yes! <b>${sciHTML(o.c, o.e)} = ${standard(o.c, o.e)}</b>. ${o.e < 0 ? `A negative exponent means hop ${-o.e} places left, filling in zeros.` : `A positive exponent means hop ${o.e} places right, filling in zeros.`}`;
      $('wnext').hidden = false; $('wnext').textContent = WR.i < WR.list.length - 1 ? 'Next ▶' : 'See my score'; $('wnext').focus();
      drawDigits();
      $('wprog').innerHTML = WR.list.map((_, i) => `<i class="${WR.res[i] === 2 ? 'ok' : WR.res[i] ? 'meh' : ''} ${i === WR.i ? 'now' : ''}"></i>`).join('');
    } else {
      SFX.miss();
      if (r.dir === 'sci') $('wmsg').innerHTML = r.p < 1 ? 'Not yet: there is no digit in front of the point. Hop it to the <b>right</b>.' : `Not yet: there ${r.p > 1 ? `are ${r.p} digits` : 'is one digit'} in front of the point. Scientific notation keeps exactly one. Hop it to the <b>left</b>.`;
      else $('wmsg').innerHTML = `Not yet: the power is still ${expo(k)}. Hop the point to the <b>${k > 0 ? 'right' : 'left'}</b> until it is 10<sup>0</sup>.`;
    }
  };
  $('wnext').onclick = () => {
    SFX.tap(); WR.i++;
    if (WR.i < WR.list.length) { startWrite(); return; }
    const total = WR.res.reduce((a, b) => a + b, 0);
    $('wpic').innerHTML = '<div style="font-size:80px">🏆</div>';
    $('wtext').innerHTML = `<div class="kicker">All ${WR.list.length} written</div><h2>${WR.res.filter(x => x === 2).length} of ${WR.list.length} on the first try</h2><p>The rule: count the hops. Hop left, the exponent goes up. Hop right, it goes down.</p>`;
    $('digits').innerHTML = ''; $('hops').innerHTML = ''; $('wmsg').innerHTML = '';
    $('wnext').textContent = 'Play again'; $('wnext').onclick = () => { $('wnext').onclick = nextW; newWrite(); };
    $('wl').disabled = $('wr').disabled = true;
  };
  const nextW = $('wnext').onclick;

  // ---------- modes ----------
  let mode = 'zoom';
  function setMode(m) {
    mode = m; stopTour();
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    $('zoomview').hidden = m !== 'zoom'; $('cmpview').hidden = m !== 'cmp'; $('placeview').hidden = m !== 'place'; $('writeview').hidden = m !== 'write';
    if (m === 'cmp') renderCmp();
    if (m === 'place' && !PL) newPlace();
    if (m === 'write' && !WR) newWrite();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { SFX.tap(); setMode(b.dataset.mode); });
  document.addEventListener('keydown', e => { if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.altKey && document.activeElement.tagName !== 'INPUT') setMode(['zoom', 'cmp', 'place', 'write'][+e.key - 1]); });

  // things painted on black: the size belongs to the bright part, not the whole square
  function brightWidth(im) {
    const c = document.createElement('canvas'); c.width = 200; c.height = Math.round(200 / (im.naturalWidth / im.naturalHeight)); const g = c.getContext('2d');
    g.drawImage(im, 0, 0, c.width, c.height); const d = g.getImageData(0, 0, c.width, c.height).data;
    let lo = c.width, hi = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) { const k = (y * c.width + x) * 4; if (d[k] + d[k + 1] + d[k + 2] > 120) { if (x < lo) lo = x; if (x > hi) hi = x; } }
    return hi > lo ? (hi - lo + 1) / c.width : 1;
  }
  // pictures first: the layout needs each one's shape
  Promise.all(OBJ.map(o => new Promise(res => { const im = new Image(); im.onload = () => { o.ar = im.naturalWidth / im.naturalHeight || 1; if (o.glow) o.fx = brightWidth(im); res(); }; im.onerror = () => { o.ar = 1; res(); }; im.src = o.src; })))
    .then(() => { layout(); buildWorld(); ready = true; setZ(0.75); });
  window.__soe = {OBJ, BY, setZ, standard, words, setMode, get z() { return z; }};
})();
</script>
</body>
</html>
