  header { padding:5px 8px; gap:4px; border-top-width:3px; } h1 { width:100%; font-size:25px; margin-bottom:3px; }
  h1 small { display:none; } .modebar { padding:2px 8px 6px; }
  .modebar .seg { display:flex; width:100%; } .modebar .seg button { flex:1; font-size:12px; padding:0 6px; }
  .save-note { display:none; } main { display:flex; flex-direction:column; }
  .privacy-compact { display:inline; } #room-name { display:none; }
  .stage { order:0; padding:5px; overflow:visible; } .room-top { min-height:22px; margin-bottom:3px; }
  .wall { width:100%; border-width:2px; } .spot { width:44px; height:44px; }
  .number { font-size:15px; } .wall-label { width:55px; max-height:23px; left:5px; }
  .stage-tools { min-height:48px; } .stage-tools .seg button { font-size:12px; padding:0 12px; }
  .detail { min-height:71px; gap:6px; padding:5px; } .detail-art { width:60px; height:60px; }
  .detail h2 { font-size:16px; } .detail p { font-size:11px; } .fear { font-size:10px; }
  .detail:not(:has(.detail-art)),.choosing .detail { display:none; }
  .fear-note { display:none; }
  .showing .stage-tools { min-height:22px; }
  .panel { order:1; border-left:0; border-top:4px solid #92704b; padding:7px; gap:4px; overflow:visible; }
  .panel-head { gap:4px; }
  #primary { order:-2; }
  .panel-actions { order:-2; }
  .choosing #context > .brief,.choosing #context > .progress { display:none; }
  .placing:has(.detail-art) #context { display:none; }
  .your-show .wall { width:min(100%,320px); }
  .stage:has(.fears) .wall { width:min(100%,340px); }
  .your-show .work-card img { height:24px; }
  .comparing .panel { order:0; }
  .comparing .stage { order:1; }
  .hint { min-height:40px; font-size:12px; } .crate { grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; }
  .work-card img { height:32px; } .work-card b { font-size:11px; } .work-card small { font-size:10px; }
  .panel h2 { font-size:19px; } .rooms { gap:5px; } .compare { gap:5px; }
  .compare-fact { font-size:11px; padding:5px; } .compare-table { gap:0 5px; }
  .compare-fact strong { font-size:10px; } .room-card figcaption { font-size:17px; }
  .closing { font-size:17px; } .protect button { font-size:11px; padding:0 6px; }
}
@media (max-height:550px) and (min-width:601px) {
  .showing .wall { width:min(100%,calc((100dvh - 224px)*1.77778)); }
  .showing .stage-tools { min-height:24px; }
  .your-show .work-card b { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; text-overflow:ellipsis; }
  .your-show .theme-mark { position:absolute; top:1px; left:1px; padding:0 2px; background:#fff9e9;
    border:1px solid #a48658; border-radius:3px; line-height:12px; }
}
@media (max-width:1000px) and (min-width:601px) and (max-height:800px) {
  .choosing #context > .brief { display:none; }
}
@media (max-width:600px) {
  .your-show.choosing #context h2 { display:none; }
  .showing .panel { gap:3px; }
  .placing .wall { width:min(100%,320px); }
}

<body>
<header>
  <h1>Traveling Art Show <small>getting art ready for a show</small></h1>
  <button class="icon-btn" id="read">Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
</header>
<nav class="modebar" aria-label="Tool modes">
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-look" aria-pressed="true">Look around</button>
    <button id="m-shows" aria-pressed="false">Shows</button>
    <button id="m-compare" aria-pressed="false">Library and museum</button>
  </div>
  <span class="save-note">Show progress saves here. It never leaves this device.</span>
</nav>
<main>
  <!-- The panel comes first for keyboard access to choices before spot markers. -->
  <aside class="panel" id="panel">
    <div class="panel-head">
      <div class="steps" id="steps" hidden></div>
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="panel-actions">
        <button class="big-btn gold" id="primary" hidden></button>
        <button class="secondary" id="reveal-again" hidden>Look around this month</button>
      </div>
    </div>
    <div id="context"></div>
    <div class="crate" id="crate" aria-label="Crate of artworks"></div>
    <div id="extra"></div>
    <div class="nav-shows" id="show-nav" hidden>
      <button class="secondary" id="previous">Previous show</button>
      <button class="secondary" id="restart">Start show over</button>
      <button class="secondary" id="next">Next show</button>
    </div>
  </aside>
  <section class="stage" id="stage" aria-label="Library display">
    <div id="library">
      <div class="room-top"><span class="eyebrow" id="room-name">Town library · Explore</span>
        <span class="privacy-compact">Saved here only. Nothing leaves this device.</span><span class="calendar" id="calendar">One day</span></div>
      <div class="wall-wrap"><div class="wall" id="wall" aria-label="Ten library display spots">
        <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="paper-wave">
          <feTurbulence type="fractalNoise" baseFrequency=".025 .06" numOctaves="1" seed="3" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter></defs></svg>
        <img class="room-art" src="art:library-wall" alt="Library with sunny window, heater, story rug, door shelf, glass case, pedestal, nook and desk.">
        <img class="library-host" src="art:librarian" alt="The town librarian welcomes visitors beside the desk.">
        <div class="dust" aria-hidden="true"></div>
      </div></div>
      <div class="stage-tools" id="stage-tools"></div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="compare" id="compare" hidden></div>
  </section>
</main>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const MONTHS = ['October','January','June'];
  const ICON = {sun:'☀',heat:'♨',hands:'☝',bumps:'▣'};
  const WORKS = [
    ['W1','Pumpkin Patch','Rosa M.','chalk pastel on colored paper','Chalk pastel','flat','art:w1-pastel',
      'The farm stand on Mill Road, with crows on the fence.',['sun','hands'],['glass']],
    ['W2','Rainy Main Street','Theo K.','watercolor on paper','Watercolor','flat','art:w2-watercolor',
      'Main Street shops in the rain, with puddles.',['sun','heat','hands'],['glass','sleeve']],
    ['W3','Pond Bowl','Ana P.','fired, glazed clay','Glazed clay','3D','art:w3-bowl',
      'Frogs painted around the town pond.',['hands','bumps'],['cover']],
    ['W4','Leaf Parade','Jamal R.','glued paper collage','Paper collage','flat','art:w4-collage',
      'The fall parade on Main Street, with dogs marching.',['sun','heat','hands'],['glass']],
    ['W5','Paper Heron','Mei L.','folded paper sculpture','Folded paper','3D','art:w5-heron',
      'A heron standing in a river.',['heat','hands','bumps'],['cover']],
    ['W6','Our Bridge','Sam O.','printed photo (inkjet)','Inkjet photo','flat','art:w6-photo',
      'The old bridge over the river, with ducks below.',['sun','heat','hands'],['glass','sleeve']],
    ['W7','River Stripes','Lily A.','yarn weaving','Yarn weaving','flat','art:w7-weaving',
      'Blue and green stripes like moving water.',['sun','hands'],['glass']],
    ['W8','Library Cat','Omar D.','marker poster','Marker poster','flat','art:w8-poster',
      'The library’s cat watching the fish tank.',['sun','hands'],['glass','sleeve']]
  ].map(([id,title,artist,material,short,kind,art,subject,fears,stops]) => ({id,title,artist,material,short,kind,art,subject,fears,stops}));
  const SPOTS = [
    ['S1','window wall','wall',18,15,['sun','sun','sun']],
    ['S2','window sill','shelf',6.5,54,['sun','sun','sun']],
    ['S3','wall over the heater vent','wall',28,42,['','heat','']],
    ['S4','story rug wall, low','wall',20,66,['hands','hands','hands']],
    ['S5','story rug wall, high','wall',43,17,['','','']],
    ['S6','shelf by the front door','shelf',42,60,['bumps','bumps','bumps']],
    ['S7','locked glass case','case',63,46,['','','']],
    ['S8','pedestal in the middle','pedestal',55,74,['','sun','hands']],
    ['S9','quiet nook wall','wall',79,50,['','','sun']],
    ['S10','wall behind the desk','wall',90,19,['','','']]
  ].map(([id,name,kind,x,y,hazards]) => ({id,name,kind,x,y,hazards}));
  const SHOWS = [
    {title:'Our Town',month:0,criterion:'Shows a place in our town.',brief:'The town library wants six works about places in our town.',
      fit:['W1','W2','W3','W4','W6','W8'],reasons:{W5:'a heron, but no place in town',W7:'stripes, no place in town'}},
    {title:'Water All Around',month:1,criterion:'Shows water.',brief:'Find six works that show water, even in an unexpected place.',
      fit:['W2','W3','W5','W6','W7','W8'],reasons:{W1:'no water in this scene',W4:'a parade, but no water'}},
    {title:'Animals We Know',month:2,criterion:'Shows an animal.',brief:'Find six works with animals. Look carefully at the little details.',
      fit:['W1','W3','W4','W5','W6','W8'],reasons:{W2:'shops and puddles, but no animal',W7:'stripes, but no animal'}}
  ];
  const COMPARE = [
    ['Who watches the art?','The librarian, now and then.','Guards and cameras, all day.'],
    ['Light?','Sunny windows.','Low light for works on paper: about 50 lux, a tenth of a bright office.'],
    ['Air?','Heater in winter, open doors.','Temperature and humidity kept steady all year.'],
    ['Can people touch?','Kids can reach the low walls.','Barriers, cases and “please do not touch”.'],
    ['What is it for?','Lending books and bringing neighbors together.','Collecting, caring for, studying and showing art.']
  ];
  const WHY = {
    sun:'Light fades dyes and colored paper. Marker and construction paper fade fastest.',
    heat:'Warm, dry air from a vent makes paper curl and wave and glue let go.',
    hands:'Fingers smudge chalk, pull yarn, and bend paper.',
    bumps:'A knock sends a bowl or a paper sculpture to the floor.'
  };
  const L = {
    welcomeLook:'Welcome to the library. Tap a number on the wall to watch one day in that spot.',
    fearHow:'Now tap an artwork to see what it is afraid of.',
    tryHow:'Drag an artwork onto a spot to see a month there. Or tap a card, then tap a spot.',
    welcomeShows:'Read the theme. Tap six artworks to put them in the show, then tap Check my six.',
    placeHow:'Tap Look around this month to find the dangers. Then drag each artwork to a safe spot.',
    protectHow:'Pick how to protect it: a glass frame, a sleeve, or nothing.',
    labelHow:'Pick the right material for each label. Then tap Open the show.',
    moveHow:'Tap an artwork, then tap a numbered spot. Pick protection below the wall.',
    openHow:'Tap Open the show to watch a month. Tap anywhere during the run to jump to results.',
    allFine:'All six look just like the day they arrived. The show was a success.',
    compareWelcome:'Tap a row to compare the library and the museum.',
    fine:'Looks just like the day it arrived.'
  };
  function resultPhrase(w,c) {
    if (c === 'sun') return 'faded: the sun hit it about 4 hours a day.';
    if (c === 'heat') return 'curled: the heater blew warm, dry air on it all month.';
    if (c === 'sleeve') return 'smudged inside its sleeve: plastic rubs chalk.';
    if (c === 'bumps') return w.id === 'W3' ? 'cracked: knocked off the shelf.' : 'crushed: knocked off the shelf.';
    if (w.id === 'W1') return 'smudged: fingers rubbed the chalk.';
    if (w.id === 'W7') return 'has pulled threads: fingers pulled the yarn.';
    if (w.id === 'W3') return 'cracked: picked up and dropped.';
    if (w.id === 'W5') return 'crushed: busy hands bent the paper.';
    return 'bent and fingerprinted: busy hands touched the paper.';
  }
  WORKS.forEach(w => {
    [...w.fears,...(w.id === 'W1' ? ['sleeve'] : [])].forEach(c => L[w.id+'-'+c] = w.title+' '+resultPhrase(w,c));
    SHOWS.forEach((s,i) => { if (s.reasons[w.id]) L['wrong-'+i+'-'+w.id] = w.title+': '+s.reasons[w.id]+'.';
    });
  });
  Object.entries(WHY).forEach(([k,v]) => { L['why-'+k] = v;
  });
  L.claySun = 'Fired clay glaze does not fade in a month.';
  L.yarnHeat = 'Yarn does not curl in warm air.';
  COMPARE.forEach((r,i) => { L['compare-'+i] = r[0]+' Library: '+r[1]+' Museum: '+r[2];
  });
  const blank = () => ({chosen:[],placed:{},protect:{},labels:{},ideas:{},step:1,reached:1,
    checked:false,revealed:false,finished:false,theme:0,month:0});
  const state = {mode:'look',show:0,month:0,selected:null,spot:null,compareRow:0,shows:[0,1,2,3].map(blank),
    explore:{},exploreProtect:{},running:false,results:false,day:0,runToken:0,preview:null,loops:[],loopToken:0};
  let labelLayoutKey = '';
  const current = () => state.shows[state.show];
  const theme = () => SHOWS[state.show === 3 ? current().theme : state.show];
  const month = () => state.mode === 'look' ? state.month : state.show === 3 ? current().month : theme().month;
  const placements = () => state.mode === 'look' ? state.explore : current().placed;
  const protections = () => state.mode === 'look' ? state.exploreProtect : current().protect;
  const work = id => WORKS.find(w => w.id === id);
  const spot = id => SPOTS.find(s => s.id === id);
  const esc = text => String(text).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  try {
    const saved = JSON.parse(localStorage.getItem('traveling-art-show') || 'null');
    if (saved && Array.isArray(saved.shows)) {
      state.shows = state.shows.map((s,i) => {
        const p = saved.shows[i];
        if (!p || !Array.isArray(p.chosen)) return s;
        s.chosen = [...new Set(p.chosen.filter(id => work(id)))].slice(0,6);
        for (const [id,sid] of Object.entries(p.placed || {})) {
          if (s.chosen.includes(id) && spot(sid) && !Object.values(s.placed).includes(sid)) s.placed[id] = sid;
        }
        for (const id of s.chosen) {
          s.protect[id] = ['glass','sleeve','cover','nothing'].includes(p.protect?.[id]) ? p.protect[id] : 'nothing';
          s.labels[id] = typeof p.labels?.[id] === 'string' ? p.labels[id] : '';
          s.ideas[id] = typeof p.ideas?.[id] === 'string' ? p.ideas[id].slice(0,120) : '';
        }
        s.step = Math.max(1,Math.min(4,Number(p.step)||1));
        s.reached = Math.max(s.step,Math.min(4,Number(p.reached)||1));
        s.checked = !!p.checked;
        s.revealed = !!p.revealed;
        s.finished = !!p.finished;
        s.theme = Math.max(0,Math.min(2,Number(p.theme)||0));
        s.month = Math.max(0,Math.min(2,Number(p.month)||0));
        return s;
      });
      state.show = Math.max(0,Math.min(3,Number(saved.show)||0));
    }
  } catch {}
  const save = () => {
    try { localStorage.setItem('traveling-art-show',JSON.stringify({show:state.show,shows:state.shows}));
    } catch {}
  };
  const hint = text => { $('hint').textContent = text;
  };
  SPOTS.forEach(s => MONTHS.forEach((_,m) => { L['spot-'+s.id+'-'+m] = describeSpot(s.id,m); }));
  WORKS.forEach(w => {
    L[w.id+'-fine'] = w.title+'. '+L.fine;
    L[w.id+'-kind'] = w.title+' needs '+(w.kind === 'flat' ? 'a wall spot or the case.' : 'a shelf, a pedestal or the case.');
  });
  for (let n=0;n<6;n++) L['choose-count-'+n] = 'Choose exactly six works. You have '+n+'.';
  L.fineEnemy = 'Fine with this enemy in our one-month model.';
  const V = Curio.voice({lines:L,scope:() => state.mode+':'+state.show,hint:false,read:() => $('hint').textContent,
    welcome:() => {
      if (state.mode === 'look' && !state.selected && !state.spot) return ['welcomeLook',{valid:() => !state.selected && !state.spot}];
      if (state.mode === 'shows' && current().step === 1) return ['welcomeShows',{valid:() => !current().chosen.length}];
      return state.mode === 'compare' ? 'compareWelcome' : null;
    },speaks:'.spot-button,.work-card,#primary'});
  function how(key,valid=() => true,needs) {
    hint(L[key]);
    V.how(key,{valid,needs,hint:false});
  }
  function keepFocus(fn) {
    const id = document.activeElement?.id;
    fn();
    if (id && $(id) && !$(id).disabled) $(id).focus({preventScroll:true});
  }
  function damageFor(w,sid,p='nothing',m=month()) {
    const s = spot(sid), effects = [];
    if (!s) return effects;
    if (w.id === 'W1' && p === 'sleeve') effects.push('sleeve');
    const h = s.hazards[m];
    if (w.fears.includes(h) && !(h === 'hands' && w.stops.includes(p))) effects.push(h);
    return effects;
  }
  function effectClass(w,c) {
    if (c === 'sun') return 'faded';
    if (c === 'heat') return 'curled';
    if (c === 'sleeve') return 'smudged';
    if (c === 'bumps' || c === 'hands' && w.kind === '3D') return w.id === 'W3' ? 'cracked' : 'crushed';
    return w.id === 'W1' ? 'smudged' : w.id === 'W7' ? 'pulled' : 'bent';
  }
  function effectSVG(w,causes) {
    if (causes.some(c => effectClass(w,c) === 'cracked')) {
      return '<svg viewBox="0 0 100 100"><path d="M44 18 56 39 45 48 61 64 53 82 M45 48 30 53 M61 64 76 61" '
        +'fill="none" stroke="#35251d" stroke-width="3"/><path d="M47 19 59 39 48 48 64 64 56 82" '
        +'fill="none" stroke="#fff4d2" stroke-width="1"/></svg>';
    }
    if (causes.some(c => effectClass(w,c) === 'pulled')) {
      return '<svg viewBox="0 0 100 100"><path d="M29 43 Q5 75 29 80 T45 67 Q52 102 63 78 T88 84 M43 32 Q65 58 85 39" '
        +'fill="none" stroke="#216f72" stroke-width="4"/></svg>';
    }
    return '';
  }
  const HAND = '<svg class="touch-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M11 22V8q0-5 5-4v17V13q0-4 5-3v12-7'
    +'q0-4 5-2v11-5q0-3 5-1v12q0 7-8 8H14L4 25q-2-5 3-5z" fill="#f3d36b" stroke="#674b2f" stroke-width="2"/></svg>';
  const CART = '<svg class="cart-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M3 6h6l5 24h20M11 13h24l-4 12H14" '
    +'fill="#ac9b83" stroke="#65492d" stroke-width="3"/><circle cx="17" cy="34" r="3" fill="#49382b"/>'
    +'<circle cx="30" cy="34" r="3" fill="#49382b"/><path d="M15 9h14v9H15z" fill="#8a2b1f"/></svg>';
  function hazardHTML(h) {
    if (h === 'sun') return '<div class="sun-patch"></div>';
    if (h === 'heat') return '<div class="heat-lines">∿ ∿ ∿</div>';
    return h === 'hands' ? HAND : h === 'bumps' ? CART : '<div class="no-hazard"></div>';
  }
  const protectionName = p => ({glass:'Glass frame',sleeve:'Sleeve',cover:'Clear cover',nothing:'Nothing'}[p] || 'Nothing');
  function buildSpots() {
    SPOTS.forEach((s,i) => {
      const el = document.createElement('div');
      el.id = 'spot-'+s.id;
      el.className = 'spot';
      el.style.left = s.x+'%';
      el.style.top = s.y+'%';
      el.innerHTML = '<div class="hazard-loop" hidden></div><button class="spot-button" id="place-'+s.id+'">'
        +'<span class="mounted" hidden></span><span class="effect"></span><span class="number">'+(i+1)+'</span></button>'
        +'<span class="hazard-icons" hidden></span><div class="wall-label" hidden></div>';
      el.querySelector('button').onclick = () => tapSpot(s.id);
      el.querySelector('button').onkeydown = e => {
        const d = ['ArrowRight','ArrowDown'].includes(e.key) ? 1 : ['ArrowLeft','ArrowUp'].includes(e.key) ? -1 : 0;
        if (d) { e.preventDefault();
          $('place-'+SPOTS[(i+d+10)%10].id).focus({preventScroll:true});
        }
      };
      $('wall').append(el);
    });
  }
  function paintSpots() {
    $('wall').classList.toggle('month-running',state.running);
    const placed = placements();
    for (const s of SPOTS) {
      const id = Object.keys(placed).find(id => placed[id] === s.id), w = work(id), el = $('spot-'+s.id);
      const p = id ? protections()[id] || 'nothing' : 'nothing';
      let causes = [], level = 0;
      if (w && state.mode === 'shows' && (state.running || state.results)) {
        causes = damageFor(w,s.id,p);
        level = state.day < 10 ? 0 : state.day < 20 ? .34 : state.day < 30 ? .67 : 1;
      }
      if (w && state.mode === 'look' && state.preview?.spot === s.id) { causes = damageFor(w,s.id,p);
        level = state.preview.level;
      }
      const classes = w && level > 0 ? causes.map(c => effectClass(w,c)) : [];
      el.className = ['spot',w ? 'has-work' : '',w?.kind === '3D' ? 'three-d' : '',
        state.spot === s.id ? 'chosen' : '',p,...classes].join(' ');
      el.style.setProperty('--damage',level);
      $('place-'+s.id).setAttribute('aria-label',s.id+' '+s.name+', '+s.kind+(w ? ', '+w.title+', '+protectionName(p) : ', empty'));
      const mount = el.querySelector('.mounted');
      mount.hidden = !w;
      if (w && mount.dataset.work !== id) { mount.innerHTML = '<img class="work-image" src="'+w.art+'" alt="">';
        mount.dataset.work = id;
      }
      el.querySelector('.effect').innerHTML = w ? effectSVG(w,causes) : '';
      const lb = el.querySelector('.wall-label');
      lb.hidden = !(w && state.mode === 'shows' && current().step >= 3);
      if (!lb.hidden) {
        lb.innerHTML = '<b>'+s.id.slice(1)+' · '+w.title+'</b><span class="byline">by '+w.artist+'</span>';
        lb.title = w.title+' by '+w.artist+'. '+(current().labels[id] || 'Material not chosen.')+' '+(current().ideas[id] || '');
      }
      const ic = el.querySelector('.hazard-icons');
      ic.hidden = !(state.mode === 'shows' && current().revealed && s.hazards[month()]);
      ic.textContent = ICON[s.hazards[month()]] || '';
      ic.title = s.hazards[month()] || 'none';
      ic.setAttribute('aria-label',ic.title);
      const loop = el.querySelector('.hazard-loop'), active = state.loops.includes(s.id) || state.running && !!s.hazards[month()];
      loop.hidden = !active;
      if (active && loop.dataset.hazard !== s.hazards[month()]) {
        loop.innerHTML = hazardHTML(s.hazards[month()]);
        loop.dataset.hazard = s.hazards[month()];

      const w = work(id);
      return '<div class="label-card"><img class="label-thumb" src="'+w.art+'" alt=""><b>'+w.title+'</b><small>by '+w.artist+'</small>'
        +'<select id="material-'+id+'" aria-label="Material for '+w.title+'"><option value="">Pick the material</option>'
        +materialOptions(w).map(m => '<option>'+esc(m)+'</option>').join('')+'</select>'
        +'<input id="idea-'+id+'" aria-label="Optional idea sentence for '+w.title+'" maxlength="120" '
        +'placeholder="One sentence about the idea (optional)" value="'+esc(s.ideas[id] || '')+'"></div>';
    }).join('')+'</div>';
    updateLabelCount();
    s.chosen.forEach(id => {
      $('material-'+id).value = s.labels[id] || '';
      $('material-'+id).onchange = e => {
        s.labels[id] = e.target.value;
        s.finished = false;
        state.selected = id;
        V.dropQueued();
        paintSpots();
        renderDetail();
        updateLabelCount();
        save();
        hint('Label saved. Pick the next material, or tap Open the show when all six have a material.');
        Curio.tone(500,.06,.03);
      };
      $('idea-'+id).oninput = e => { s.ideas[id] = e.target.value.slice(0,120);
        state.selected = id;
        save();
        paintSpots();
        renderDetail();
      };
      for (const field of ['material-','idea-']) $(field+id).onfocus = () => {
        state.selected = id;
        renderDetail();
      };
    });
  }
  function updateLabelCount() {
    if ($('label-count')) $('label-count').textContent = current().chosen.filter(id => current().labels[id]).length+' of 6 materials labeled';
  }
  function renderResults() {
    const s = current();
    $('next').hidden = s.finished;
    $('extra').innerHTML = (s.finished ? '<button class="secondary" id="next-win">Next show →</button>' : '')
      +'<div class="result-list">'+s.chosen.map(id => {
      const w = work(id), causes = damageFor(w,s.placed[id],s.protect[id]);
      return '<article class="result-card"><img src="'+w.art+'" alt=""><div><b>'+w.title+'</b>'
        +'<span class="result-chip '+(!causes.length ? 'fine' : '')+'">'+(!causes.length ? '✓ fine' : '△ '+effectClass(w,causes[0]))+'</span>'
        +'<p>'+(!causes.length ? L.fine : causes.map(c => esc(resultPhrase(w,c))).join(' Also '))+'</p>'
        +(s.labels[id] !== w.material ? '<p class="sticky">Visitor note: This label says '+esc(s.labels[id])+'; it is '+w.material+'.</p>' : '')
        +'</div></article>';
    }).join('')+'</div>';
    if ($('next-win')) $('next-win').onclick = () => changeShow(1);
  }
  function renderTools() {
    if (state.mode === 'look') {
      $('stage-tools').innerHTML = '<div class="seg" role="group" aria-label="Month">'+MONTHS.map((m,i) => '<button id="month-'+i+'" '
        +'aria-pressed="'+(state.month === i)+'">'+m+'</button>').join('')+'</div>';
      MONTHS.forEach((m,i) => { $('month-'+i).onclick = () => { if (state.month !== i) changeMonth(i);
        };
      });
    } else $('stage-tools').innerHTML = '<span class="eyebrow">'+(state.show === 3 ? 'Your show · ' : '')+MONTHS[month()]+' · '+(state.results ? 'The month is over'
      : state.running ? 'Tap anywhere to see results' : current().step === 1 ? 'Choose with a theme.' : 'Ten spots. Six artworks. Your choices.')+'</span>';
  }
  function renderDetail() {
    const w = work(state.selected), sid = w && placements()[w.id];
    if (!(state.mode === 'shows' && current().step === 3 && !state.results)) $('wall').style.width = '';
    if (state.mode === 'shows' && current().step === 3 && !state.results) {
      const shown = w || work(current().chosen[0]);
      if (shown) {
        const s = current();
        $('detail').innerHTML = '<img class="detail-art" src="'+shown.art+'" alt="'+esc(shown.title)+'">'
          +'<div class="label-preview"><b>'+shown.title+'</b><p>by '+shown.artist+'</p><p>'
          +esc(s.labels[shown.id] || 'Choose its material in the label card.')+'</p>'
          +(s.ideas[shown.id] ? '<p>'+esc(s.ideas[shown.id])+'</p>' : '')+'</div>';
        requestAnimationFrame(fitLabelWall);
        return;
      }
    }
    if (w) {
      const choose = state.mode === 'shows' && current().step === 1;
      const protection = !!sid && !choose && !state.results && !state.running;
      $('detail').innerHTML = '<img class="detail-art" src="'+w.art+'" alt="'+esc(w.title)+'"><div class="detail-copy">'
        +'<h2>'+w.title+' <span style="font:400 11px Segoe UI">by '+w.artist+'</span></h2><p>'+esc(w.subject)+'</p>'
        +(choose ? '<p>'+w.material+' · Finished and signed.</p>' : protection ? '<div class="protect" role="group" aria-label="Protection for '+w.title+'">'
          +(w.kind === 'flat' ? ['glass','sleeve','nothing'] : ['cover','nothing']).map(p => '<button id="protect-'+p+'" '
            +'aria-pressed="'+((protections()[w.id] || 'nothing') === p)+'">'+protectionName(p)+'</button>').join('')+'</div>'
          : '<div class="fears">'+['sun','heat','hands','bumps'].map(e => '<button class="fear" id="fear-'+e+'" title="'+esc(w.fears.includes(e) ? WHY[e]
            : w.id === 'W3' && e === 'sun' ? 'Fired clay glaze does not fade in a month.' : w.id === 'W7' && e === 'heat'
              ? 'Yarn does not curl in warm air.' : 'Fine with this enemy in our one-month model.')+'"><b>'+ICON[e]+' '+e+'</b> '
            +(w.fears.includes(e) ? '△ hurts it' : '✓ fine')+'</button>').join('')+'</div><p class="fear-note" id="fear-note">'
            +esc(WHY[w.fears[0]])+'</p>')+'</div>';
      if (!choose && !protection) ['sun','heat','hands','bumps'].forEach(e => {
        $('fear-'+e).onclick = () => {
          const text = $('fear-'+e).title;
          $('fear-note').textContent = text;
          hint(text+' Tap a spot to try this artwork.');
          V.how(text,{valid:() => state.selected === w.id,hint:false});
          Curio.tone(400,.06,.03);
        };
      });
      if (protection) (w.kind === 'flat' ? ['glass','sleeve','nothing'] : ['cover','nothing']).forEach(p => {
        $('protect-'+p).onclick = () => setProtection(p);
      });
    } else if (state.spot) $('detail').innerHTML = '<div class="detail-copy"><h2>'+state.spot+' · '+spot(state.spot).name+'</h2><p>'
      +describeSpot(state.spot)+'</p><p>Tap an artwork in the crate, then tap a spot to try a month.</p></div>';
    else $('detail').innerHTML = '<div class="detail-copy"><h2>'+(state.results ? 'Your month at the library'
      : state.mode === 'shows' && current().step === 1 ? 'Choose for '+theme().title : 'Every material has its enemies.')+'</h2><p>'
      +(state.mode === 'look' ? '☀ Sun fades. ♨ Heat curls. ☝ Hands smudge. ▣ Bumps break.' : state.results
        ? 'Look at the artworks and their result cards. A new spot can make all the difference.' : current().step === 1
        ? theme().brief
          : 'A glass frame, sleeve or clear cover stops hands only. Sun and heat need a different spot.')+'</p></div>';
  }
  function fitLabelWall() {
    if (innerWidth <= 600 || state.mode !== 'shows' || current().step !== 3 || state.results) return;
    const stage = $('stage'), top = document.querySelector('.room-top');
    const css = getComputedStyle(stage);
    const padX = parseFloat(css.paddingLeft)+parseFloat(css.paddingRight);
    const padY = parseFloat(css.paddingTop)+parseFloat(css.paddingBottom);
    const available = stage.clientHeight-padY-top.offsetHeight-parseFloat(getComputedStyle(top).marginBottom)
      -$('stage-tools').offsetHeight-$('detail').offsetHeight-3;
    const width = Math.floor(Math.min(stage.clientWidth-padX,Math.max(100,available)*16/9));
    if ($('wall').style.width !== width+'px') $('wall').style.width = width+'px';
  }
  function renderCompare() {
    $('compare').innerHTML = '<div class="rooms"><figure class="room-card"><div class="room-picture">'
      +'<img src="art:library-wall" alt="Sunny town library.">'
      +'<img class="library-host" src="art:librarian" alt="The librarian holds a book beside the desk."></div>'
      +'<figcaption>The library</figcaption></figure><figure class="room-card"><img src="art:museum-gallery" '
      +'alt="Quiet museum with cases and barriers."><figcaption>The museum</figcaption></figure></div>'
      +'<div class="compare-table">'+COMPARE.map((r,i) => r.slice(1).map(t => '<div class="compare-fact '+(state.compareRow === i ? 'active' : '')+'">'
        +'<strong>'+r[0]+'</strong>'+t+'</div>').join('')).join('')+'</div>'
      +'<p class="closing">Your library show has to do a museum’s job without a museum’s tools.</p>';
  }
  function render() {
    document.body.classList.toggle('your-show',state.mode === 'shows' && state.show === 3);
    document.body.classList.toggle('showing',state.mode === 'shows');
    document.body.classList.toggle('choosing',state.mode === 'shows' && current().step === 1);
    document.body.classList.toggle('placing',state.mode === 'shows' && current().step === 2);
    document.body.classList.toggle('comparing',state.mode === 'compare');
    for (const m of ['look','shows','compare']) $('m-'+m).setAttribute('aria-pressed',state.mode === m);
    $('library').hidden = state.mode === 'compare';
    $('compare').hidden = state.mode !== 'compare';
    $('room-name').textContent = 'Town library · '+(state.mode === 'look' ? 'Explore' : state.show === 3 ? 'Your show' : theme().title);
    renderPanel();
    renderTools();
    renderDetail();
    paintSpots();
    if (state.mode === 'compare') renderCompare();
  }
  let drag = null, ghost = null, suppressClick = false, skipClickUntil = 0;
  $('crate').addEventListener('pointerdown',e => {
    const card = e.target.closest('.work-card');
    if (!card || state.mode === 'shows' && current().step !== 2) return;
    drag = {id:card.id.slice(5),x:e.clientX,y:e.clientY,moved:false,pointer:e.pointerId};
  });
  addEventListener('pointermove',e => {
    if (!drag || e.pointerId !== drag.pointer) return;
    if (!drag.moved && Math.hypot(e.clientX-drag.x,e.clientY-drag.y) > 8) {
      drag.moved = true;
      ghost = document.createElement('img');
      ghost.className = 'drag-ghost';
      ghost.src = work(drag.id).art;
      ghost.alt = '';
      document.body.append(ghost);
      state.selected = drag.id;
    }
    if (drag.moved) { e.preventDefault();
      ghost.style.left = e.clientX+'px';
      ghost.style.top = e.clientY+'px';
    }
  },{passive:false});
  addEventListener('pointerup',e => {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (d.moved) {
      ghost.remove();
      ghost = null;
      suppressClick = true;
      const target = document.elementFromPoint(e.clientX,e.clientY)?.closest('.spot');
      if (target) placeWork(d.id,target.id.slice(5));
      else { renderDetail();
        keepFocus(renderCrate);
        hint('Artwork picked up. Tap a numbered spot to place it.');
      }
      setTimeout(() => { suppressClick = false;
      },0);
    }
  });
  addEventListener('pointercancel',() => { drag = null;
    ghost?.remove();
    ghost = null;
  });
  addEventListener('click',e => {
    if (suppressClick || performance.now() < skipClickUntil) { e.preventDefault();
      e.stopImmediatePropagation();
    }
  },true);
  for (const ev of ['pointerdown','keydown']) addEventListener(ev,e => {
    if (!state.running || ev === 'keydown' && !['Enter',' ','Escape'].includes(e.key)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    skipClickUntil = performance.now()+500;
    finishRun();
  },true);
  for (const m of ['look','shows','compare']) $('m-'+m).onclick = () => setMode(m);
  $('previous').onclick = () => changeShow(-1);
  $('next').onclick = () => changeShow(1);
  $('restart').onclick = restart;
  $('reveal-again').onclick = () => {
    reveal(SPOTS.map(x => x.id));
    hint('Watch the spots. Covers stop hands only; a safe spot avoids sun and heat.');
    Curio.tone(390,.07,.03);
  };
  buildSpots();
  render();
  hint(L.welcomeLook);
  Curio.init({clips:"voice:*",rate:.9,readFallback:() => $('hint').textContent});
  Curio.onMotion(() => paintSpots());
  new ResizeObserver(() => arrangeLabels()).observe($('wall'));
  const labelFit = new ResizeObserver(fitLabelWall);
  labelFit.observe($('stage'));
  labelFit.observe($('detail'));
  window.__tool = {state,setMode,allLines:V.allLines,vlog:V.log,get vq(){return V.queue;
    },WORKS,SPOTS,SHOWS,
    damageFor,placeWork,selectWork,checkSix,goStep,startRun,finishRun,fixAgain,changeShow,render,
    get diagnostics(){return {month:month(),progress:current(),storage:'traveling-art-show'};
    }};
})();
</script>
</body>
</html>
