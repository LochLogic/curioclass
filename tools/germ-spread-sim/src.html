<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Germ Spread Sim · Germs and disease prevention · Curio Class</title>
<meta name="description" content="Watch a cold spread through a classroom of 24 over two school weeks, then switch on handwashing, covering coughs, staying home when sick and wiping shared things to see the outbreak shrink. Then scrub glowing germs off a hand for 20 seconds.">
<!--
GERM SPREAD SIM (Curio Class)
Health, grades 3-5, National Health Education Standards 1 (health concepts) and 7 (practice healthy behaviors),
module "Germs and Disease Prevention": how illness spreads and how to prevent it.
Classroom outbreak: one student comes to school with cold germs and feels fine. Over ten school days the class
works at desks, gathers on the rug, eats snack and goes out to recess. Germs travel by uncovered coughs, by hands
(touching your face, sharing, the door handle and pencil sharpener) and can spread a day before anyone feels sick.
Switch on habits (wash hands, cover coughs, stay home when sick, wipe shared things, flu shots) and run again with
the same first student to compare. Germ vision shows what eyes can't see.
Wash up: wet, soap, scrub for 20 seconds, rinse and dry, then check under a "black light" for missed spots, the
way classrooms test with glow-in-the-dark lotion. Water alone loosens far fewer germs than soap and scrubbing.
This is a teaching model, not a medical prediction: numbers are simplified so differences show in one class.
Steps follow CDC handwashing guidance (wet, lather, scrub 20 seconds, rinse, dry).
Illustrations generated with Google Gemini, edited for Curio Class. Sound synthesized in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<style>
:root{
  --paper:#eef4f1;--ink:#1d2a2a;--muted:#5a6a68;--focus:#2f5bd3;--brand:#1f7a6a;--gold:#ffcf3a;--card:#fbfffd;
  --sick:#e8743b;--home:#7b8fb0;--rec:#2f8fb3;--germ:#7ed321;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--brand);color:#eafffa}
h1{margin:0 auto 0 0;font:800 clamp(22px,2.8vw,32px)/1.1 Georgia,'Times New Roman',serif}
h1 small{display:block;font:400 14px/1.3 'Segoe UI',sans-serif;color:#c4ece4}
.icon-btn{border:1px solid #5fae9f;background:#2b927f;color:#fff;border-radius:999px;min-height:46px;padding:0 16px;font-weight:700;font-size:15px}
.icon-btn[aria-pressed="false"]{background:#114c41}

.stagewrap{position:relative;overflow:hidden;min-height:0;background:#cfe0da}
.scene{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:linear-gradient(#d9e8e2,#c7dbd3)}
.top{position:absolute;left:14px;right:24px;top:12px;display:flex;align-items:center;gap:12px;z-index:6}
.tabs{display:inline-flex;border-radius:999px;overflow:hidden;background:#fbfffdf0;box-shadow:0 3px 0 #0002}
.tabs button{border:0;background:transparent;min-height:54px;padding:0 22px;font:800 19px 'Segoe UI',sans-serif;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff}
.b{border:0;border-radius:14px;min-height:50px;padding:0 16px;font:800 17px 'Segoe UI',sans-serif;background:#fbfffd;color:var(--ink);box-shadow:0 4px 0 #0002;white-space:nowrap}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
.b.go{background:#2f8a4a;color:#fff;box-shadow:0 4px 0 #1d5e30}
.b.teal{background:var(--brand);color:#fff;box-shadow:0 4px 0 #0f4a40}
.b[aria-pressed="true"]{background:var(--gold);color:#3a2a00}
.b:disabled{opacity:.45;cursor:default}

/* classroom */
.room{position:absolute;left:10px;top:80px;width:1100px;height:615px;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px #0003}
.room>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.desk{position:absolute;width:74px;height:44px;margin:-6px 0 0 -37px;border-radius:8px;background:linear-gradient(#e2bf8c,#c99d62);box-shadow:0 4px 0 #8a6436,0 6px 8px #0003}
.desk.home::after{content:'🏠';position:absolute;right:-8px;top:-10px;font-size:20px}
.spot{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;display:grid;place-items:center;font-size:24px;pointer-events:none}
.spot i{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,#7ed321cc,#7ed32100 70%);opacity:0;transition:opacity .4s}
.germs .spot i{opacity:var(--load,0)}
.kid{position:absolute;width:52px;height:52px;margin:-26px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0003;transition:left var(--tick,.1s) linear,top var(--tick,.1s) linear,opacity .4s;z-index:2}
.kid img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#f4efe6}
.kid .ring{position:absolute;inset:-5px;border-radius:50%;border:5px solid transparent}
.kid.sick .ring{border-color:var(--sick)}
.kid.sick img{filter:saturate(.6) brightness(1.05) sepia(.25)}
.kid.rec .ring{border-color:var(--rec)}
.kid .badge{position:absolute;right:-10px;top:-12px;font-size:20px;filter:drop-shadow(0 1px 1px #0006)}
.kid .hands{position:absolute;left:50%;bottom:-8px;width:38px;height:14px;margin-left:-19px;border-radius:50%;background:radial-gradient(#7ed321ee,#7ed32100 70%);opacity:0;transition:opacity .2s}
.germs .kid .hands{opacity:var(--h,0)}
.kid .aura{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,#7ed32100 45%,#7ed32199 60%,#7ed32100 75%);opacity:0}
.germs .kid.carry .aura{opacity:1}
.kid.p0::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:3px dashed #fff}
.kid.out{opacity:0}
.kid img,.kid .ring{transition:transform .4s}
.kid.onrug img,.kid.onrug .ring{transform:scale(.8)}
.puff{position:absolute;pointer-events:none;z-index:3;border-radius:50%;background:radial-gradient(circle,#9be15dcc 0,#9be15d55 40%,#9be15d00 70%)}
.board{position:absolute;left:290px;top:84px;width:470px;height:64px;display:grid;place-items:center;text-align:center;font:700 21px/1.2 'Comic Sans MS','Segoe Print','Segoe UI',sans-serif;color:#2c4a8a;z-index:4;pointer-events:none}
.board small{display:block;font-size:15px;color:#5a6a68}

/* panel */
.panel{position:absolute;left:1122px;right:12px;top:80px;bottom:12px;background:#fbfffdf6;border-radius:18px;box-shadow:0 6px 0 #0002;padding:10px 12px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.panel h2{margin:0;font:800 19px Georgia,serif}
.hab{display:grid;grid-template-columns:1fr;gap:3px}
.hab .name{font:800 14px 'Segoe UI',sans-serif;display:flex;justify-content:space-between}
.seg{display:flex;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 2px #cfe0da}
.seg button{flex:1;border:0;background:transparent;min-height:36px;font:700 13.5px 'Segoe UI',sans-serif;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.row{display:flex;gap:6px}
.row .b{flex:1;min-height:46px;font-size:15px;padding:0 8px}
.runs{font:700 13.5px/1.35 'Segoe UI',sans-serif}
.runs div{display:flex;justify-content:space-between;gap:6px;border-radius:8px;padding:2px 6px}
.runs div.cur{background:#fff3c4}
.chart{position:absolute;left:10px;top:704px;width:1100px;height:94px;background:#fbfffdf2;border-radius:16px;box-shadow:0 4px 0 #0002;padding:6px 10px}
.chart svg{width:100%;height:100%}
.key{display:flex;gap:10px;font:700 12px 'Segoe UI',sans-serif;color:var(--muted)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:3px}
.result{position:absolute;left:250px;top:230px;width:620px;z-index:8;background:#fbfffd;border-radius:24px;box-shadow:0 20px 40px #0005;padding:22px 28px;text-align:center}
.result h2{margin:0 0 6px;font:800 30px Georgia,serif}
.result .n{font:900 64px/1 'Segoe UI',sans-serif;color:var(--sick)}
.result p{font:500 18px/1.45 'Segoe UI',sans-serif;margin:8px 0}

/* wash */
.wash{position:absolute;inset:80px 12px 12px 12px;border-radius:18px;background:linear-gradient(#dff0f6,#c5e2ec);overflow:hidden}
.sinkbg{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(#f4f7f8,#cfd9dd);border-top:6px solid #b9c7cc}
.handwrap{position:absolute;left:330px;top:20px;width:510px;height:640px}
.handwrap canvas{position:absolute;left:0;top:0;width:510px;height:640px;touch-action:none}
.uv .handwrap{filter:none}
.wash.uv{background:linear-gradient(#1b1036,#2a1650)}
.wash.uv .sinkbg{background:linear-gradient(#2a1d4d,#1b1036);border-color:#3b2a66}
.steps{position:absolute;left:24px;top:24px;width:280px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;border:0;border-radius:18px;min-height:66px;padding:0 16px;background:#fbfffd;box-shadow:0 4px 0 #0002;font:800 19px 'Segoe UI',sans-serif;text-align:left}
.step span{font-size:30px}
.step small{display:block;font:600 13px 'Segoe UI',sans-serif;color:var(--muted)}
.step.done{background:#d6f2df}
.step.now{box-shadow:0 0 0 4px var(--gold),0 4px 0 #0002}
.step:disabled{opacity:.5}
.wside{position:absolute;right:24px;top:24px;width:420px;display:flex;flex-direction:column;gap:12px}
.wcard{background:#fbfffdf4;border-radius:20px;box-shadow:0 5px 0 #0002;padding:14px 18px}
.wcard h2{margin:0 0 6px;font:800 22px Georgia,serif}
.wcard p{margin:6px 0;font:500 17px/1.4 'Segoe UI',sans-serif}
.timer{height:30px;border-radius:15px;background:#e3ece9;overflow:hidden;position:relative}
.timer i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#46b3e6,#2f8a4a);border-radius:15px}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font:900 16px 'Segoe UI',sans-serif}
.meter{font:900 44px 'Segoe UI',sans-serif;color:var(--brand)}
.flip{position:absolute;left:520px;top:600px}
.wash.uv .steps label{color:#e9e4ff}
</style>

<body>
<header>
  <h1>Germ Spread Sim <small>How colds spread in a classroom, and how to stop them.</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<div class="stagewrap" id="stagewrap">
  <div class="scene" id="scene">
    <div class="top">
      <div class="tabs" role="group" aria-label="Mode">
        <button data-mode="sim" aria-pressed="true">🏫 Classroom outbreak</button>
        <button data-mode="wash" aria-pressed="false">🧼 Wash up</button>
      </div>
    </div>
    <div id="simview">
      <div class="room" id="room"><img src="art:room" alt="A classroom seen from above"></div>
      <div class="board" id="board" aria-live="polite"></div>
      <div class="chart" id="chart"></div>
      <div class="panel" id="panel"></div>
    </div>
    <div id="washview" hidden></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));
  const anim = (el, kf, opt) => { if (reduce || !el || !el.animate) return null; return el.animate(kf, opt); };

  // ---------- sound ----------
  let ac = null, soundOn = true;
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').textContent = soundOn ? '🔔 Sound' : '🔕 Sound'; };
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, at, dur, {type = 'triangle', gain = .15, slide = 0} = {}) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, gain, freq, q = 1, type = 'bandpass') {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime, b = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  const SFX = {
    cough: () => { noise(.14, .18, 900, .8); setTimeout(() => noise(.12, .14, 800, .8), 170); },
    bell: () => [784, 988, 1175].forEach((f, i) => tone(f, i * .12, .5, {type: 'sine', gain: .12})),
    sick: () => tone(392, 0, .35, {gain: .1, slide: .7}),
    good: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .1, .45)),
    water: dur => noise(dur, .1, 2400, .4, 'highpass'),
    squish: () => noise(.18, .08, 700, 2),
    tick: () => tone(1200, 0, .04, {type: 'sine', gain: .05}),
  };

  // ---------- the class ----------
  const FACES = ['k1', 'k2', 'k3', 'k4', 'k5', 'k6', 'k7', 'k8'];
  const FACE_IMG = {k1: 'art:k1', k2: 'art:k2', k3: 'art:k3', k4: 'art:k4', k5: 'art:k5', k6: 'art:k6', k7: 'art:k7', k8: 'art:k8'};
  const GIRL = ['Maya', 'Rosa', 'Lena', 'Fatima', 'Ava', 'Hana', 'Priya', 'Noor', 'Jada', 'Zoe', 'Tess', 'Amira'];
  const BOY = ['Ben', 'Eli', 'Dev', 'Kai', 'Omar', 'Mateo', 'Gus', 'Kofi', 'Sam', 'Leo', 'Wes', 'Theo'];
  const N = 24;
  const KIDS = Array.from({length: N}, (_, i) => {
    const face = FACES[(i * 3 + Math.floor(i / 8)) % 8], girl = ['k1', 'k3', 'k5', 'k7'].includes(face);
    const name = face === 'k7' ? ['Fatima', 'Noor', 'Amira'][Math.floor(i / 8)] : (girl ? GIRL.filter(n => !['Fatima', 'Noor', 'Amira'].includes(n)) : BOY)[Math.floor(i / 2) % 9 + (i % 2) * 0];
    return {i, face, name};
  });
  // give everyone a different name
  const used = new Set();
  KIDS.forEach(k => { const pool = k.face === 'k7' ? ['Fatima', 'Noor', 'Amira'] : ['k1', 'k3', 'k5'].includes(k.face) ? GIRL : BOY; k.name = pool.find(n => !used.has(n)); used.add(k.name); });

  // places in the room (room coordinates, 1100 x 615)
  const P = {sink: [192, 112], door: [190, 578], doorOut: [150, 640], rug: [868, 448], sharp: [124, 282], bin: [385, 552], fountain: [192, 160]};
  const desk = i => [232 + (i % 6) * 96, 196 + Math.floor(i / 6) * 92];
  const rugSpot = i => { const ring = i < 2 ? 0 : i < 10 ? 1 : 2, k = ring === 0 ? i : ring === 1 ? i - 2 : i - 10, n = [2, 8, 14][ring], r = [14, 46, 84][ring], a = k / n * Math.PI * 2 + ring * .3; return [P.rug[0] - 8 + Math.cos(a) * r, P.rug[1] + Math.sin(a) * r * .86]; };
  const sinkSpot = i => [P.sink[0] + 46 + (i % 6) * 34, P.sink[1] + 48 + Math.floor(i / 6) * 34];
  const neighbors = i => [i - 1, i + 1, i - 6, i + 6].filter(j => j >= 0 && j < N && (Math.abs(j - i) !== 1 || Math.floor(j / 6) === Math.floor(i / 6)));

  // ---------- habits ----------
  const H = {wash: 0, cover: 0, home: 0, wipe: 0, shot: 0};
  const HABITS = [
    ['wash', '🧼 Wash hands with soap', ['Rarely', 'Sometimes', 'Always']],
    ['cover', '💪 Cover coughs', ['Don\'t', 'With hand', 'Into elbow']],
    ['home', '🏠 Stay home when sick', ['No', 'Yes']],
    ['wipe', '🧽 Wipe shared things', ['No', 'Every day']],
    ['shot', '💉 Flu shots in the class', ['None', 'Half', 'Most']],
  ];
  // ---------- the model ----------
  // Every random choice comes from a hash of (seed, day, tick, kid, channel), so a rerun with different habits
  // keeps the same luck: only the habits change the outcome.
  function rnd(...a) { let h = 2166136261 ^ SEED; for (const v of a) { h = Math.imul(h ^ (v + 0x9e3779b9), 16777619); h ^= h >>> 13; } h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return (h >>> 0) / 4294967296; }
  let SEED = 7;
  const TICKS = 120, DAYS = 10;
  // model rates, tuned so one class shows each habit's effect (see notes.md)
  const K = {handSick: .08, handPre: .04, coughSick: .02, coughPre: .006, air: .025, inHand: .006, elbow: .002, share: .025, face: .025, faceP: .08, snackP: .16, surfIn: .5, surfOut: .5, decay: .97};
  // phases of a school day, by tick
  const PH = [[0, 10, 'arrive', 'Good morning! Everyone comes in the door.'], [10, 40, 'desk', 'Work time at desks. Sharing supplies with neighbors.'], [40, 46, 'torug', 'Off to the rug for story time.'],
    [46, 66, 'rug', 'Story time: everyone close together on the rug.'], [66, 72, 'todesk', 'Back to desks.'], [72, 80, 'wash', 'Before snack: wash your hands?'], [80, 88, 'snack', 'Snack time! Hands near mouths.'],
    [88, 92, 'out', 'Recess! Out the door.'], [92, 100, 'recess', 'Recess outside.'], [100, 104, 'in', 'Back inside.'], [104, 114, 'desk2', 'Afternoon work at desks.'], [114, 120, 'leave', 'Home time.']];
  const phaseAt = t => PH.find(p => t >= p[0] && t < p[1]);
  let S;
  function reset() {
    S = {day: 0, t: 0, kids: KIDS.map(k => ({...k, st: 'S', d0: -1, hand: 0, home: false, vax: false, sickDays: 0, missed: 0, by: null})),
      surf: {door: 0, sharp: 0, bin: 0, fountain: 0}, hist: [], events: [], done: false, p0: Math.floor(rnd(99) * N)};
    S.kids.forEach((k, i) => k.vax = rnd(i, 77) < [0, .5, .9][H.shot]);
    const z = S.kids[S.p0]; z.st = 'I'; z.d0 = -1; z.vax = false; // starts contagious, no symptoms yet
  }
  // disease timeline (school days since infection): day 1 contagious with no symptoms, days 2-4 sick, day 5 better
  function stage(k) { if (k.st === 'S' || k.st === 'R') return k.st; const d = S.day - k.d0; return d < 1 ? 'E' : d < 2 ? 'I' : d < 5 ? 'X' : 'R'; }
  const contagious = st => st === 'I' || st === 'X';
  function infect(k, by, how) {
    if (k.st !== 'S') return;
    if (k.vax && rnd(S.day, S.t, k.i, 31) < .6) return; // flu shots: about 60% less likely to catch it (teaching value)
    k.st = 'E'; k.d0 = S.day; k.by = by; k.how = how;
    S.events.push({day: S.day, kid: k.i, by, how});
  }
  function startDay() {
    for (const k of S.kids) {
      const st = stage(k); if (st === 'R' && k.st !== 'R') k.st = 'R';
      k.home = st === 'X' && H.home === 1 && rnd(S.day, k.i, 5) < .95;
      k.hand = 0;
    }
    for (const s in S.surf) S.surf[s] *= H.wipe ? 0 : .5; // germs fade overnight; wiping clears them
  }
  const at = k => !k.home;
  function pos(k) {
    const t = Math.min(S.t, TICKS - 1), ph = phaseAt(t)[2], i = k.i, f = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
    if (k.home) return P.doorOut;
    const d = desk(i), u = p => Math.min(1, (t - p[0] + 1) / (p[1] - p[0]));
    switch (ph) {
      case 'arrive': return f(P.door, d, u(PH[0]));
      case 'desk': case 'desk2': case 'snack': return d;
      case 'torug': return f(d, rugSpot(i), u(PH[2]));
      case 'rug': return rugSpot(i);
      case 'todesk': return f(rugSpot(i), d, u(PH[4]));
      case 'wash': return washes(k) ? sinkSpot(i) : d;
      case 'out': return f(d, P.doorOut, u(PH[7]));
      case 'recess': return P.doorOut;
      case 'in': return f(P.doorOut, d, u(PH[9]));
      case 'leave': return f(d, P.doorOut, u(PH[11]));
    }
  }
  const washes = k => rnd(S.day, k.i, 11) < [.15, .55, .95][H.wash];

  function doStep(i) {

    if (i === 0) { W.water = true; SFX.water(1.2); say('Wet hands with clean water, warm or cold. Now add <b>soap</b>.'); setTimeout(() => { W.water = false; paint(); }, 1200); }
    if (i === 1) { W.soap = !W.soapless; SFX.squish(); say(W.soapless ? 'No soap this time. Scrub anyway and see what happens.' : 'Soap grabs onto germs and oils so water can wash them away. Now <b>scrub</b>: drag all over the hand. Turn it over too!'); }
    if (i === 2) { if (W.scrub < 1) { say('Drag on the hand to scrub. The timer counts while you scrub.'); return; } }
    if (i === 3) { // rinsing carries away loosened germs; without soap, much less comes off
      W.water = true; SFX.water(1.6); bubbleList.palm = []; bubbleList.back = []; W.rinsed = true;
      for (const side of ['palm', 'back']) { const g = germCv[side].getContext('2d'); g.globalCompositeOperation = 'destination-out'; g.fillStyle = `rgba(0,0,0,${W.soapless ? .1 : .25})`; g.fillRect(0, 0, 510, 640); g.globalCompositeOperation = 'source-over'; }
      setTimeout(() => { W.water = false; paint(); }, 1600);
      say('Rinse under running water. The germs slide off with the soap. Last step: <b>dry</b>.');
    }
    if (i === 4) {
      W.done = true; const left = paint(); W.uv = true; $('uv').setAttribute('aria-pressed', true); $('wash').classList.add('uv'); paint();
      $('wt').textContent = left <= 15 ? 'Squeaky clean!' : left <= 40 ? 'Pretty good!' : 'Lots of germs left';
      say(`Under the black light, <b>${left}%</b> of the germs are still there${W.scrub < 20 ? ` after only ${Math.round(W.scrub)} seconds of scrubbing` : ''}. ${W.soapless ? 'Water alone leaves far more germs behind. <b>Soap</b> makes the difference.' : left > 15 ? 'Look for glowing spots: thumbs, fingertips and the backs of hands get missed most.' : 'Great scrubbing!'} <button class="b teal" id="again" style="margin-top:8px">Wash again</button>`);
      $('again').onclick = () => { W.uv = false; W.rinsed = false; W.timerDone = false; newHands(); renderWash(); };
      SFX.good();
    }
    W.step++; renderSteps();
  }
  function renderSteps() { document.querySelectorAll('[data-step]').forEach(b => { const i = +b.dataset.step; b.className = `step ${i < W.step ? 'done' : ''} ${i === W.step ? 'now' : ''}`; b.disabled = i !== W.step; }); }

  // ---------- modes ----------
  let mode = 'sim';
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('simview').hidden = mode !== 'sim'; $('washview').hidden = mode !== 'wash';
    if (mode === 'wash') { pause(); renderWash(); }
  });
  const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
  Promise.all([loadImg('art:hand'), loadImg('art:handback')]).then(([a, b]) => { handImg.palm = a; handImg.back = b; });

  reset(); buildRoom(); draw(true); drawChart(); drawPanel();
  $('board').innerHTML = 'One student has cold germs and feels fine.<small>Press Start to watch two school weeks.</small>';
  window.__gs = {K, S: () => S, H, reset, tick, startDay, endDay, everSick, runs, setSeed: s => SEED = s,
    runAll: () => { reset(); while (!S.done) { startDay(); while (S.t < TICKS) tick(); endDay(); } return everSick(); }};
})();
</script>
