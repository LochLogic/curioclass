HAMBURGER PARAGRAPH (Curio Class)
Grade 2 writing, CCSS W.2.1, W.2.2 (introduce a topic, supply facts or reasons, provide a concluding statement).
Teacher-led on a projector: the class decides where each sentence goes. The top bun is the topic sentence,
the fillings are details, the bottom bun is the closing sentence. Sentences that are not about the topic
turn into an old boot. Serve it to the bear customer to find out if it holds together.
"Write your own" lets the class type a burger of their own.

<style>
:root{
  --paper:#fff8ee;--card:#fff;--ink:#2a211c;--muted:#6e6158;--line:#ecdcc4;--accent:#d2553a;--accent-ink:#9c3a24;
  --mustard:#f2b632;--ketchup:#c8402c;--focus:#2f5bd3;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:3px solid var(--ketchup);background:#fff}
h1{margin:0 auto 0 0;font:700 clamp(22px,3vw,32px)/1.1 Georgia,'Times New Roman',serif}
h1 small{display:block;font:italic 500 15px/1.3 Georgia,serif;color:var(--muted)}
.icon-btn{border:2px solid var(--line);background:#fff;border-radius:999px;min-height:52px;padding:0 16px;font-weight:700;font-size:16px}
.icon-btn[aria-pressed="true"]{border-color:var(--accent);background:#fff0ea}

main{display:grid;grid-template-columns:1fr;min-height:0}
@media (min-width:760px){main{grid-template-columns:minmax(0,1fr) 360px}}
.stage{position:relative;overflow:hidden;background:#f3d9b4;min-height:340px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.panel{background:#fff;border-left:3px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
@media (max-width:759px){.panel{border-left:0;border-top:3px solid var(--line)}}
.panel h2{margin:4px 0 0;font:700 13px/1 'Segoe UI',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topic{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;min-height:44px}
.topic[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.tray{display:grid;gap:8px}
.card{border:2px solid var(--line);background:#fffdf8;border-radius:12px;padding:10px 12px;text-align:left;font:600 16px/1.35 Georgia,serif;min-height:48px;box-shadow:0 3px 0 #0001}
.card[aria-pressed="true"]{border-color:var(--accent);background:#fff0ea;box-shadow:0 0 0 3px #d2553a33}
.tray .empty{color:var(--muted);font-style:italic;margin:0}
.places{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place{border:0;border-radius:14px;min-height:58px;font-weight:800;font-size:15px;line-height:1.15;color:#fff;box-shadow:0 4px 0 #0003;padding:6px 8px}
.place small{display:block;font-weight:600;font-size:12px;opacity:.9}
.place:disabled{opacity:.4;cursor:default}
.place:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #0003}
.p-top{background:#c98a2c}.p-fill{background:#4f9a43}.p-bottom{background:#a8692a}.p-trash{background:#6b6f7a}
.serve{border:0;border-radius:16px;min-height:62px;font:800 21px/1 'Segoe UI',sans-serif;color:#fff;background:var(--ketchup);box-shadow:0 5px 0 #8e2a1c}
.serve:active{transform:translateY(3px);box-shadow:0 2px 0 #8e2a1c}
.serve:disabled{opacity:.5}
.small-btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;min-height:44px;align-self:flex-start}
.write{display:grid;gap:8px}
.write label{display:grid;gap:4px;font-weight:700;font-size:13px;color:var(--muted)}
.write input{border:2px solid var(--line);border-radius:10px;padding:10px;font:600 16px Georgia,serif;color:var(--ink)}
.hidden{display:none!important}

/* the burger */
.layer.drop{animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-340px)}}
.tag{transition:opacity .4s}
.tag.drop{animation:fadein .5s .25s both}
@keyframes fadein{from{opacity:0}}
#burger{transition:transform 1.2s cubic-bezier(.5,0,.3,1)}
.wobble{animation:wobble .5s ease-in-out 3;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.slide-l{transition:transform 1.1s cubic-bezier(.5,0,.8,.4),opacity 1.1s;transform:translate(-260px,140px) rotate(-40deg);opacity:0}
.slide-r{transition:transform 1.1s cubic-bezier(.5,0,.8,.4),opacity 1.1s;transform:translate(260px,140px) rotate(40deg);opacity:0}
.fall{transition:transform 1s cubic-bezier(.6,0,1,.6),opacity 1s .4s;transform:translateY(260px);opacity:0}
.boot-glow{animation:bootglow .6s ease-in-out infinite alternate}
@keyframes bootglow{to{opacity:.25}}
.bear{transition:opacity .25s}
.bubble{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:80% 100%}
@keyframes pop{from{opacity:0;scale:.6}}
.flag{animation:flag .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flag{from{transform:scaleY(0)}}
.steam{animation:steam 2s ease-in-out infinite}
@keyframes steam{50%{transform:translateY(-8px);opacity:.35}}
.calm *{animation:none!important;transition:none!important}

/* the finished paragraph, written out like an order ticket */
.ticket{position:absolute;left:3%;top:6%;width:min(44%,440px);background:#fffef7;border-radius:6px;padding:18px 20px 22px;box-shadow:0 8px 24px #0003;
  font:500 clamp(15px,1.7vw,21px)/1.55 Georgia,serif;transform:rotate(-1.5deg);border-top:10px solid var(--ketchup);animation:pop .4s both}
.ticket h3{margin:0 0 8px;font:800 13px/1 'Segoe UI',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ketchup)}
.ticket p{margin:0;text-indent:1.6em}
.ticket .t-top{background:#f6dfae}.ticket .t-fill{background:#d9efcf}.ticket .t-bottom{background:#ecd3b1}
.ticket span{border-radius:4px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

@media (max-width:759px),(max-height:620px){
  header{padding:6px 12px}
  h1{font-size:19px} h1 small{display:none}
  .icon-btn{min-height:38px;font-size:13px;padding:0 10px}
  main{grid-template-columns:minmax(0,1fr) 300px}
  .panel{padding:8px 10px;gap:6px}
  .panel h2{display:none}
  .topic{padding:4px 9px;min-height:32px;font-size:12px}
  .card{padding:6px 8px;font-size:13px;min-height:0}
  .place{min-height:40px;font-size:12px}.place small{display:none}
  .serve{min-height:44px;font-size:16px}
  .ticket{font-size:13px;padding:10px 12px}
}

    let y = 600;
    const list = layers();
    const tagTop = 96, tagGap = Math.min(92, (590 - tagTop) / Math.max(list.length, 1));
    list.forEach((L, i) => {
      const [w, h] = sizeOf(L.art), lw = L.art === 'boot' ? W * .8 : W, lh = lw * h / w;
      const g = el('g', {class: 'layer' + (L.text === state.last ? ' drop' : ''), 'data-key': L.text}, stack);
      el('image', {href: ART[L.art], x: 470 - lw / 2, y: y - lh, width: lw, height: lh}, g);
      if (L.art === 'boot') el('rect', {class: 'boot-glow hidden', x: 470 - lw / 2 - 6, y: y - lh - 6, width: lw + 12, height: lh + 12, rx: 14, fill: 'none', stroke: '#f2b632', 'stroke-width': 5}, g);
      L.mid = y - lh * .5; L.topY = y - lh;
      y -= lh * (L.slot === 'bottom' ? .62 : L.slot === 'top' ? 1 : .55);
    });
    // Sentence tags in a column on the left, top bun at the top, with a line to their layer
    [...list].reverse().forEach((L, i) => {
      const ty = tagTop + i * tagGap;
      const g = el('g', {class: 'tag' + (L.text === state.last ? ' drop' : '')}, tags);
      el('path', {d: `M300 ${ty + 26}C330 ${ty + 26} 320 ${L.mid} 340 ${L.mid}`, fill: 'none', stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': '2 6', 'stroke-linecap': 'round', opacity: .9}, g);
      const fo = el('foreignObject', {x: 14, y: ty, width: 290, height: Math.max(52, tagGap - 6)}, g);
      const color = {top: '#f6dfae', fill: '#d9efcf', bottom: '#ecd3b1'}[L.slot];
      const b = document.createElement('button');
      b.className = 'tagbtn';
      b.style.cssText = `all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:${L.art === 'boot' ? '#eee6dc' : color};border:2px solid #2a211c;border-radius:10px;padding:5px 9px;font:600 15px/1.25 Georgia,serif;color:#2a211c;box-shadow:0 3px 0 #0003`;
      b.textContent = L.text;
      b.title = 'Take this sentence off the burger';
      b.setAttribute('aria-label', `${L.text} (on the ${L.slot === 'fill' ? 'filling' : L.slot + ' bun'}). Click to take it off.`);
      b.onclick = () => unplace(L.text);
      fo.append(b);
    });
    state.last = null;
  }

  // ---------- the bear ----------
  function bear(mood = 'bear', say = '') {
    const g = $('bear-g');
    const name = mood, [w, h] = sizeOf(name), bh = 360, bw = bh * w / h;
    g.innerHTML = `<image class="bear" href="${ART[name]}" x="${-bw / 2}" y="${-bh + 20}" width="${bw}" height="${bh}"/>`;
    if (say) {
      const fo = el('foreignObject', {x: -205, y: -626, width: 350, height: 200}, g);  // above the bear, clear of the burger's flag
      fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="bubble" style="position:relative;margin-bottom:20px;background:#fff;border:3px solid #2a211c;border-radius:20px;padding:10px 14px;font:700 19px/1.3 Georgia,serif;color:#2a211c;box-shadow:0 5px 0 #0002">${say}<div style="position:absolute;right:70px;bottom:-15px;width:24px;height:24px;background:#fff;border-right:3px solid #2a211c;border-bottom:3px solid #2a211c;transform:rotate(45deg)"></div></div>`;
      fo.firstChild.setAttribute('role', 'status');
    }
  }

  // ---------- panel ----------
  function drawTopics() {
    $('topics').innerHTML = Object.entries(TOPICS).map(([k, t]) =>
      `<button class="topic" data-k="${k}" aria-pressed="${k === state.topic}">${t.name}</button>`).join('');
    $('topics').querySelectorAll('.topic').forEach(b => b.onclick = () => { if (!state.busy) { state.topic = b.dataset.k; restart(); } });
  }
  function shuffled(list, seed) {
    // A fixed shuffle per topic, so the class sees the same order after Start over
    const a = [...list]; let s = seed;
    for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function placed() { return [state.top, state.bottom, ...state.fills, ...state.trash].filter(Boolean); }
  function drawTray() {
    const own = state.topic === 'own';
    $('build').classList.toggle('hidden', own);
    $('where').classList.toggle('hidden', own);
    $('write').classList.toggle('hidden', !own);
    if (own) return;
    const t = TOPICS[state.topic], used = placed();
    const left = shuffled(t.sentences.map(s => s[1]), t.name.length * 7 + 3).filter(s => !used.includes(s));
    $('tray').innerHTML = left.length
      ? left.map(s => `<button class="card" aria-pressed="${s === state.picked}">${s}</button>`).join('')
      : '<p class="empty">Every sentence has a place. Serve it!</p>';
    $('tray').querySelectorAll('.card').forEach(b => b.onclick = () => {
      state.picked = state.picked === b.textContent ? null : b.textContent;
      drawTray();
    });
    if (state.trash.length) $('tray').insertAdjacentHTML('beforeend', `<p class="empty">Not in this burger: ${state.trash.map(s => `“${s}”`).join(' ')}</p>`);
    document.querySelectorAll('.place').forEach(b => b.disabled = !state.picked);
  }

  function place(to) {
    const s = state.picked;
    if (!s) return;
    if (to === 'top') { if (state.top) state.fills.push(state.top); state.top = s; }
    else if (to === 'bottom') { if (state.bottom) state.fills.push(state.bottom); state.bottom = s; }
    else if (to === 'fill') state.fills.push(s);
    else state.trash.push(s);
    state.picked = null;
    hideTicket();
    if (to !== 'trash') { state.last = s; SFX.plop(); } else SFX.boing();
    bear();
    drawBurger(); drawTray();
  }
  function unplace(s) {
    if (state.busy) return;
    if (state.top === s) state.top = null;
    if (state.bottom === s) state.bottom = null;
    state.fills = state.fills.filter(x => x !== s);
    state.trash = state.trash.filter(x => x !== s);
    hideTicket(); bear(); drawBurger(); drawTray();
  }
  document.querySelectorAll('.place').forEach(b => b.onclick = () => place(b.dataset.to));

  // Write your own: typing fills the layers directly
  document.querySelectorAll('#write input').forEach(inp => inp.addEventListener('input', () => {
    const v = k => document.querySelector(`#write input[data-slot="${k}"]`).value.trim() || null;
    state.top = v('top'); state.bottom = v('bottom'); state.fills = ['f0', 'f1', 'f2'].map(v).filter(Boolean);
    hideTicket(); drawBurger();
  }));

  // ---------- serving ----------
  function verdict() {
    const t = TOPICS[state.topic], own = state.topic === 'own';
    const all = [state.top, ...state.fills, state.bottom].filter(Boolean);
    if (!all.length) return {kind: 'empty', mood: 'bear-huh', say: 'An empty plate? Pick a sentence and put it on the burger first.'};
    const boots = own ? [] : all.filter(s => roleOf(s) === 'off');
    if (boots.length) return {kind: 'boot', mood: 'bear-yuck', say: `A boot?! That sentence isn’t about ${t.about}. Take it off the burger!`};
    if (!state.top) return {kind: 'notop', mood: 'bear-huh', say: 'Where’s the top bun? A paragraph starts with a topic sentence that tells what it’s about.'};
    if (!state.bottom) return {kind: 'nobottom', mood: 'bear-huh', say: 'No bottom bun! A closing sentence holds the whole paragraph together.'};
    if (state.fills.length < 2) return {kind: 'thin', mood: 'bear-huh', say: 'Just bread? Add more details to the middle. Two or three is just right.'};
    if (!own) {
      if (roleOf(state.top) !== 'top') return {kind: 'wrongtop', mood: 'bear-huh', say: 'Hmm. That top bun doesn’t tell me what the whole paragraph is about.'};
      if (roleOf(state.bottom) !== 'bottom') return {kind: 'wrongbottom', mood: 'bear-huh', say: 'Hmm. That bottom bun doesn’t wrap things up. Which sentence sounds like an ending?'};
      const bad = state.fills.find(s => roleOf(s) !== 'fill');
      if (bad) return {kind: 'wrongfill', mood: 'bear-huh', say: `“${bad}” sounds like a bun, not a filling. Try moving it.`};
      if (t.ordered) {
        const order = t.sentences.filter(s => s[0] === 'fill').map(s => s[1]);
        const mine = state.fills.filter(s => order.includes(s));
        if (mine.join('|') !== order.filter(s => mine.includes(s)).join('|')) return {kind: 'order', mood: 'bear-huh', say: 'The steps are mixed up! Stack them in order: first, next, last.'};
      }
    }
    return {kind: 'yum', mood: 'bear-yum', say: 'Mmm! Topic, details and a closing. A perfect paragraph burger!'};
  }

  async function serve() {
    if (state.busy) return;
    state.busy = true; setBusy(true); hideTicket();
    const v = verdict(), burger = $('burger');
    if (v.kind !== 'empty') {
      // slide the plate along the counter to the bear
      burger.style.transform = 'translateX(90px)';
      await wait(1400);
    }
    const layersEls = [...$('stack').children];
    if (v.kind === 'notop') {
      burger.querySelector('#stack').classList.add('wobble');
      await wait(1500);
      SFX.crash();
      layersEls.forEach((g, i) => { if (i > 0 || !state.bottom) g.classList.add(i % 2 ? 'slide-r' : 'slide-l'); });
      await wait(1100);
    } else if (v.kind === 'nobottom') {
      SFX.crash();
      layersEls.forEach(g => g.classList.add('fall'));
      await wait(1200);
    } else if (v.kind === 'boot') {
      burger.querySelectorAll('.boot-glow').forEach(r => r.classList.remove('hidden'));
      SFX.boing();
    } else if (v.kind === 'yum') {
      SFX.bell();
      const top = layers().at(-1);
      $('topper').innerHTML = `<g class="flag"><path d="M470 ${top.topY + 10}V${top.topY - 70}" stroke="#c9a46a" stroke-width="5" stroke-linecap="round"/>
        <path d="M470 ${top.topY - 70}l52 14-52 14z" fill="#d2553a" stroke="#2a211c" stroke-width="2.5" stroke-linejoin="round"/></g>
        <g class="steam" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"><path d="M420 ${top.topY - 20}q-12-18 0-34t0-34"/><path d="M525 ${top.topY - 24}q-12-18 0-34t0-34"/></g>`;
      await wait(900);
    } else {
      SFX.boing();
    }
    bear(v.mood, v.say);
    if (v.kind === 'yum') { SFX.yum(); await wait(1600); showTicket(); }
    await wait(readMs(v.say));
    // the plate comes back unless the burger fell apart; then the class rebuilds
    if (v.kind === 'notop' || v.kind === 'nobottom') {
      burger.style.transform = '';
      // what fell off goes back to the sentence tray
      state.fills = [];
      if (v.kind === 'nobottom') state.top = null;
      drawBurger(); drawTray();
    } else if (v.kind !== 'yum') {
      burger.style.transform = '';
    }
    state.busy = false; setBusy(false);
  }
  function setBusy(on) { document.querySelectorAll('.serve, #restart, .topic').forEach(b => b.disabled = on); }

  function showTicket() {
    const span = (cls, s) => `<span class="${cls}">${s}</span>`;
    const text = [span('t-top', state.top), ...state.fills.map(s => span('t-fill', s)), span('t-bottom', state.bottom)].join(' ');
    $('ticket').innerHTML = `<h3>Order up! Your paragraph</h3><p>${text}</p>`;
    $('ticket').classList.remove('hidden');
    $('tags').style.opacity = 0;  // the ticket says it all now
  }
  function hideTicket() { $('ticket').classList.add('hidden'); $('tags').style.opacity = ''; $('burger').style.transform = ''; $('topper').replaceChildren(); }

  function restart() {
    if (state.busy) return;
    Object.assign(state, {top: null, fills: [], bottom: null, trash: [], picked: null, last: null});
    document.querySelectorAll('#write input').forEach(i => i.value = '');
    hideTicket(); bear(); drawTopics(); drawTray(); drawBurger();
  }
  $('serve').onclick = serve;
  $('restart').onclick = restart;

  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
  };
  // Read aloud with the most natural voice this browser offers
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  $('read').onclick = () => {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    // Read the finished paragraph, else what the bear said, else the picked sentence, else the whole burger top to bottom
    const ticket = !$('ticket').classList.contains('hidden') && $('ticket').querySelector('p').textContent;
    const said = $('bear-g').querySelector('.bubble')?.textContent;
    const text = ticket || said || state.picked || layers().reverse().map(l => l.text).join(' ') || 'Pick a sentence. Does it go on the top bun, in the middle, or on the bottom bun?';
    const u = new SpeechSynthesisUtterance(text);
    const v = bestVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = .92; u.pitch = 1.05; speechSynthesis.speak(u);
  };

  restart();
})();
</script>
</body>
</html>
