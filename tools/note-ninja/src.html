<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Ninja · Reading music · Curio Class</title>
<meta name="description" content="Read music on the staff: tap lines and spaces to hear and name notes in treble and bass clef, slice notes by naming them before they reach the ninja, and build measures of notes and rests that fit the time signature.">
<!--
NOTE NINJA (Curio Class)
Music, grades 3-5, National Core Arts Standards MU:Pr4 (read and perform using standard notation), module
"Reading Music".
Explore: a big staff in treble or bass clef. Tap a line or space (or a piano key) to place a note, hear it and
see its letter. Line and space helpers show the sayings. Note words asks for words spelled with note letters.
Note Ninja: notes slide toward the ninja; name each one (A to G) to slice it before it gets there. Five levels,
from treble lines to the grand staff with middle C.
Count the beats: pick a time signature and fill two measures with notes and rests that add up, then hear them
counted. Puzzle mode leaves a gap to fill.
Illustrations generated with Google Gemini, edited for Curio Class. Clefs are public domain drawings from
Wikimedia Commons. Sound synthesized in the browser. One file, no network requests. Content CC BY 4.0, code MIT.
curioclass.org
-->
<style>
:root{
  --ink:#231a2e;--muted:#6b6278;--paper:#fbf4e2;--paper2:#f2e6c8;--focus:#2f5bd3;--brand:#3b2d6b;
  --gold:#ffc83d;--red:#e0483a;--good:#2f9a5a;--line:#3a3046;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#2b2350;color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--brand);color:#f4efff}
h1{margin:0 auto 0 0;font:800 clamp(22px,2.8vw,31px)/1.1 'Trebuchet MS','Segoe UI',sans-serif}
h1 small{display:block;font:400 14px/1.3 'Segoe UI',sans-serif;color:#cfc4ef}
.icon-btn{border:1px solid #5a4b93;background:#4a3b85;color:#fff;border-radius:999px;min-height:44px;padding:0 15px;font-weight:700;font-size:15px}
.icon-btn[aria-pressed="false"]{background:#2e2458}

.stagewrap{position:relative;overflow:hidden;min-height:0}
.scene{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden}
.scene>img.bg{position:absolute;left:-10px;top:-10px;width:1460px;height:830px;object-fit:cover}
.top{position:absolute;left:24px;right:24px;top:18px;display:flex;align-items:center;gap:12px;z-index:6}
.tabs{display:inline-flex;border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 4px 0 #0003}
.tabs button{border:0;background:transparent;min-height:54px;padding:0 22px;font:800 19px 'Trebuchet MS',sans-serif;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff}
.hud{margin-left:auto;display:flex;gap:10px}
.hud span{background:#fffe;border-radius:14px;padding:5px 14px;font:900 24px/1.1 'Trebuchet MS',sans-serif;min-width:84px;text-align:center;box-shadow:0 3px 0 #0003}
.hud small{display:block;font:700 11px 'Segoe UI',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.paper{position:absolute;background:linear-gradient(#fdf8ea,var(--paper));border-radius:22px;box-shadow:0 10px 0 #0003,0 0 0 6px #e7d6ad inset;z-index:2}
svg.staff{position:absolute;left:0;top:0;width:1440px;height:810px;z-index:3;overflow:visible}
svg.staff .ln{stroke:var(--line);stroke-width:2.4}
svg.staff .led{stroke:var(--line);stroke-width:2.4}
svg.staff .hl{stroke:var(--gold);stroke-width:12;stroke-linecap:round;opacity:.75}
svg.staff .sp{fill:var(--gold);opacity:.45}
svg.staff text{font:800 22px 'Trebuchet MS',sans-serif;fill:#8a7f97}
.hit{position:absolute;z-index:4;cursor:crosshair}

.row{position:absolute;left:90px;right:90px;display:flex;gap:10px;justify-content:center;z-index:5;flex-wrap:wrap}
.btn{border:0;border-radius:16px;min-height:56px;padding:0 20px;font:800 19px 'Trebuchet MS',sans-serif;background:#fff;color:var(--ink);box-shadow:0 5px 0 #0003}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.btn.go{background:var(--good);color:#fff;box-shadow:0 5px 0 #1d6a3c}
.btn.warm{background:var(--gold);color:#3a2700}
.btn[aria-pressed="true"]{background:var(--brand);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border-radius:16px;overflow:hidden;box-shadow:0 5px 0 #0003;background:#fff}
.seg button{border:0;background:transparent;min-height:56px;padding:0 16px;font:800 18px 'Trebuchet MS',sans-serif;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

/* piano */
.piano{position:absolute;left:150px;top:528px;width:1140px;height:150px;z-index:4}
.piano button{position:absolute;top:0;border:0;padding:0;border-radius:0 0 10px 10px}
.piano .w{height:150px;background:linear-gradient(#fff,#f1ece4);box-shadow:inset 0 0 0 1.5px #8d8494;z-index:1}
.piano .k{height:92px;background:linear-gradient(#3c3348,#17121e);z-index:2}
.piano .w.on{background:linear-gradient(#ffe7a0,var(--gold))}
.piano .k.on{background:linear-gradient(#ffd660,#c78f00)}
.piano .w span{position:absolute;left:0;right:0;bottom:8px;font:800 15px 'Segoe UI',sans-serif;color:#8d8494}
.piano .w.c span{color:var(--brand)}

.say{position:absolute;left:50%;transform:translateX(-50%);z-index:6;background:#fff;border-radius:18px;padding:8px 22px;font:800 22px 'Trebuchet MS',sans-serif;box-shadow:0 5px 0 #0003;white-space:nowrap}
.say:empty{display:none}
.say.warn{color:var(--red)}
.say.good{color:var(--good)}
.mnemo{position:absolute;left:120px;top:124px;z-index:4;font:800 24px 'Trebuchet MS',sans-serif;color:var(--brand)}
.mnemo b{color:#b07a00;font-size:30px}

/* Note Ninja */
.ninja{position:absolute;left:24px;top:470px;height:300px;z-index:4;filter:drop-shadow(0 12px 6px #0006)}
.strike{position:absolute;z-index:3;width:6px;margin-left:-3px;background:repeating-linear-gradient(#e0483a 0 14px,transparent 14px 24px);border-radius:3px;opacity:.75}
.letters{position:absolute;left:300px;right:80px;top:640px;display:flex;gap:12px;z-index:5}
.letters button{flex:1;min-height:110px;border:0;border-radius:22px;background:linear-gradient(#fff,#efe7d6);box-shadow:0 7px 0 #0004;font:900 54px 'Trebuchet MS',sans-serif;color:var(--brand)}
.letters button:active,.letters button.press{transform:translateY(4px);box-shadow:0 3px 0 #0004}
.letters button.bad{background:#ffd9d3}
.over{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:#120c2acc}
.over>div{background:#fff;border-radius:26px;padding:26px 34px;text-align:center;max-width:820px;box-shadow:0 12px 0 #0004}
.over h2{margin:0 0 6px;font:900 38px 'Trebuchet MS',sans-serif;color:var(--brand)}
.over p{font-size:19px;line-height:1.5;margin:8px 0 14px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0 16px}
.levels button{border:3px solid #e6def3;background:#faf7ff;border-radius:18px;padding:10px 6px;min-height:118px;font:800 16px/1.25 'Trebuchet MS',sans-serif}
.levels button b{display:block;font-size:30px;color:var(--brand)}
.levels button[aria-pressed="true"]{border-color:var(--brand);background:#efe9ff}
.bigscore{font:900 80px/1 'Trebuchet MS',sans-serif;color:var(--brand)}
.slash{position:absolute;z-index:6;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff,#ffe9a0,transparent);box-shadow:0 0 14px #fff;pointer-events:none;transform-origin:50% 50%}
.pop{position:absolute;z-index:7;font:900 40px 'Trebuchet MS',sans-serif;pointer-events:none;text-shadow:0 3px 0 #0003}

/* Count the beats */
.palette{position:absolute;left:90px;right:90px;top:492px;display:flex;gap:10px;z-index:5}
.palette button{flex:1;border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 #0003;min-height:122px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.palette button svg{height:74px;width:66px}
.palette button b{font:800 15px 'Trebuchet MS',sans-serif}
.palette button span{font:600 13.5px 'Segoe UI',sans-serif;color:var(--muted)}
.palette button:disabled{opacity:.4;cursor:default}
.palette button.pick{outline:5px solid var(--gold)}
.beats{position:absolute;z-index:4;display:flex;gap:6px}
.beats i{flex:1;height:22px;border-radius:7px;background:#e8dcc0;transition:background .2s}
.beats i.full{background:var(--good)}
.beats i.now{background:var(--gold)}
.tsig{position:absolute;z-index:4;font:900 64px/0.9 'Georgia','Times New Roman',serif;color:var(--ink);text-align:center;width:60px}
.explain{position:absolute;right:110px;top:124px;z-index:4;width:470px;font:600 16px/1.4 'Segoe UI',sans-serif;color:var(--muted);text-align:right}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.calm .shake{animation:none}
</style>
</head>
<body>
<header>
  <h1>Note Ninja <small>Read the staff: name the notes, slice them fast, and count the beats.</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<div class="stagewrap" id="stagewrap">
  <div class="scene" id="scene">
    <img class="bg" src="art:dojo" alt="">
    <div class="top">
      <div class="tabs" role="group" aria-label="Mode">
        <button id="t-ex" aria-pressed="true">🎼 Explore</button>
        <button id="t-ninja" aria-pressed="false">🥷 Note Ninja</button>
        <button id="t-count" aria-pressed="false">🥁 Count the beats</button>
      </div>
      <div class="hud" id="hud"></div>
    </div>
    <div class="paper" id="paper"></div>
    <svg class="staff" id="staff" viewBox="0 0 1440 810" aria-hidden="true"></svg>
    <div id="ex">
      <div class="mnemo" id="mnemo"></div>
      <div class="hit" id="hit" role="application" aria-label="Staff: click a line or space to place a note"></div>
      <div class="piano" id="piano"></div>
      <div class="row" id="exrow" style="top:706px"></div>
    </div>
    <div id="ninja" hidden>
      <img class="ninja" id="nj" src="art:ninja" alt="A red panda ninja">
      <img class="ninja" id="njc" src="art:ninjacheer" alt="" hidden>
      <div class="strike" id="strike"></div>
      <div class="letters" id="letters"></div>
    </div>
    <div id="count" hidden>
      <div class="explain" id="explain"></div>
      <div class="palette" id="palette"></div>
      <div class="row" id="ctrow" style="top:650px"></div>
    </div>
    <div class="say" id="say" aria-live="polite"></div>
    <div class="over" id="over" hidden></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const CLEF = "json:clefs";
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const anim = (el, kf, opt) => { if (reduce || !el.animate) return {finished: Promise.resolve()}; return el.animate(kf, opt); };
  function say(t, cls = '', top = 84) { const s = $('say'); s.textContent = t; s.className = 'say ' + cls; s.style.top = top + 'px'; }

  // ---------- the staff ----------
  // A staff step s counts lines and spaces from the bottom line (s = 0). Even steps are lines.
  const L = 'CDEFGAB', SEMI = [0, 2, 4, 5, 7, 9, 11];
  function pitch(clef, s) {
    const base = (clef === 'treble' ? 2 : 4) + s;           // bottom line: E4 in treble, G2 in bass
    const li = ((base % 7) + 7) % 7, oct = (clef === 'treble' ? 4 : 2) + Math.floor(base / 7);
    return {letter: L[li], oct, name: L[li] + oct, midi: 12 * (oct + 1) + SEMI[li]};
  }
  const stepOf = (clef, letter, oct) => (oct - (clef === 'treble' ? 4 : 2)) * 7 + L.indexOf(letter) - (clef === 'treble' ? 2 : 4);
  const Y = (st, s) => st.top + 4 * st.sp - s * st.sp / 2;
  function clefSVG(st) {
    if (st.clef === 'treble') {  // the drawing's curl sits on the G line
      const k = 7.1 * st.sp / 40.768;
      return `<path d="${CLEF.g}" transform="translate(${st.x0 + 10} ${Y(st, 2) - 25.2 * k}) scale(${k})" fill="#231a2e"/>`;
    }
    const k = st.sp / 590.5;     // the bass drawing's own staff lines start at y 6378, 590.5 apart
    return `<path d="${CLEF.f}" transform="translate(${st.x0 + 14 - 1239 * k} ${st.top - 6378 * k}) scale(${k})" fill="#231a2e"/>`;
  }
  const clefIcon = (clef, h = 34) => clef === 'treble'
    ? `<svg viewBox="0 0 16 41" style="height:${h}px;vertical-align:middle" aria-hidden="true"><path d="${CLEF.g}" fill="currentColor"/></svg>`
    : `<svg viewBox="1200 6350 1720 1980" style="height:${h * .55}px;vertical-align:middle" aria-hidden="true"><path d="${CLEF.f}" fill="currentColor"/></svg>`;
  function staffSVG(st) {
    let h = '';
    for (let i = 0; i < 5; i++) h += `<line class="ln" x1="${st.x0}" x2="${st.x1}" y1="${st.top + i * st.sp}" y2="${st.top + i * st.sp}"/>`;
    return h + clefSVG(st);
  }
  // a note head (with stem and ledger lines). kind: 'q' filled, 'h' hollow with stem, 'w' hollow without
  function noteSVG(st, x, s, {kind = 'q', color = '#231a2e', stem = true, dot = false, cls = ''} = {}) {
    const y = Y(st, s), rx = st.sp * .66, ry = st.sp * .47;
    let h = '';
    for (let l = -2; l >= s; l -= 2) h += `<line class="led" x1="${x - rx * 1.7}" x2="${x + rx * 1.7}" y1="${Y(st, l)}" y2="${Y(st, l)}"/>`;
    for (let l = 10; l <= s; l += 2) h += `<line class="led" x1="${x - rx * 1.7}" x2="${x + rx * 1.7}" y1="${Y(st, l)}" y2="${Y(st, l)}"/>`;
    const hollow = kind !== 'q';
    h += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-22 ${x} ${y})" fill="${hollow ? 'none' : color}" stroke="${color}" stroke-width="${hollow ? st.sp * .16 : 0}"/>`;
    if (hollow) h += `<ellipse cx="${x}" cy="${y}" rx="${rx * .55}" ry="${ry * .5}" transform="rotate(-35 ${x} ${y})" fill="none"/>`;
    if (stem && kind !== 'w') {
      const up = s < 4, sx = up ? x + rx * .9 : x - rx * .9;
      h += `<line x1="${sx}" x2="${sx}" y1="${y + (up ? -2 : 2)}" y2="${y + (up ? -3.4 : 3.4) * st.sp}" stroke="${color}" stroke-width="${st.sp * .1}"/>`;
    }
    if (dot) h += `<circle cx="${x + rx * 1.7}" cy="${s % 2 === 0 ? y - st.sp / 2 : y}" r="${st.sp * .14}" fill="${color}"/>`;
    return `<g class="${cls}">${h}</g>`;
  }

  // ---------- sound ----------
  let ctx, master, soundOn = true;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = soundOn ? .9 : 0;
      const c = ctx.createDynamicsCompressor(); c.threshold.value = -12;
      master.connect(c).connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const mhz = m => 440 * 2 ** ((m - 69) / 12);
  function pluck(m, t, dur = .8, gain = .22) {  // a warm plucked tone, a bit like a koto
    audio(); t = t || ctx.currentTime + .01;
    for (const [mul, g, type] of [[1, gain, 'triangle'], [2, gain * .25, 'sine'], [3, gain * .08, 'sine']]) {
      const o = ctx.createOscillator(), v = ctx.createGain();
      o.type = type; o.frequency.value = mhz(m) * mul;
      v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + .006); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(v).connect(master); o.start(t); o.stop(t + dur + .05);
    }
  }
  function held(m, t, dur, gain = .16) {  // a held tone whose length you can hear (for long notes)
    audio();
    const o = ctx.createOscillator(), v = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = mhz(m); f.type = 'lowpass'; f.frequency.value = 1400;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(gain, t + .02); v.gain.setValueAtTime(gain * .8, t + Math.max(.03, dur - .06)); v.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(f).connect(v).connect(master); o.start(t); o.stop(t + dur + .05);
  }
  let nb;
  function noise(t, dur, gain, freq, type = 'bandpass') {
    audio(); t = t || ctx.currentTime + .01;
    if (!nb) { nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nb; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
  }
  const SFX = {
    slash: () => { audio(); const t = ctx.currentTime; noise(t, .18, .35, 3500, 'highpass'); },
    miss: () => { audio(); const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(90, t + .3); g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g).connect(master); o.start(t); o.stop(t + .4); },
    gong: () => { audio(); const t = ctx.currentTime; [110, 164.8, 220.5, 277].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.12 / (i + 1), t); g.gain.exponentialRampToValueAtTime(.0001, t + 2.4); o.connect(g).connect(master); o.start(t); o.stop(t + 2.5); }); },
    click: (t, hi) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = hi ? 1500 : 1000; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .05); o.connect(g).connect(master); o.start(t); o.stop(t + .06); },
    taiko: t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + .15); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g).connect(master); o.start(t); o.stop(t + .4); noise(t, .06, .2, 900); },
    chime: () => { [76, 79, 84].forEach((m, i) => pluck(m, ctx.currentTime + .02 + i * .09, .7, .14)); },
  };
  $('sound').onclick = e => {
    soundOn = !soundOn;
    if (master) master.gain.value = soundOn ? .9 : 0;
    e.currentTarget.setAttribute('aria-pressed', soundOn);
    e.currentTarget.textContent = soundOn ? '🔔 Sound' : '🔇 Sound';
  };

  // ---------- Explore ----------
  const ex = {clef: 'treble', names: false, help: null, notes: [], word: null};
  const EX = {x0: 110, x1: 1330, top: 206, sp: 36};
  const SLOT0 = 330, SLOTW = 92, SLOTS = 11;
  const NOTE_WORDS = ['BAG', 'CAB', 'BED', 'FACE', 'CAGE', 'BEAD', 'EGG', 'ADD', 'DAD', 'BEEF', 'FADE', 'DECADE', 'CAFE', 'BADGE', 'GAB', 'ACE', 'AGE', 'BEE', 'FEED', 'CABBAGE', 'BAGGAGE', 'FACED', 'DECAF'];
  const SAYINGS = {
    treble: {lines: ['EGBDF', 'Every Good Bird Does Fly'], spaces: ['FACE', 'the spaces spell FACE']},
    bass: {lines: ['GBDFA', 'Good Burritos Don\'t Fall Apart'], spaces: ['ACEG', 'All Cows Eat Grass']},
  };
  function drawExplore(ghost) {
    const st = {...EX, clef: ex.clef};
    let h = '';
    if (ex.help === 'lines') for (let i = 0; i < 5; i++) h += `<line class="hl" x1="${st.x0 + 130}" x2="${st.x1}" y1="${Y(st, i * 2)}" y2="${Y(st, i * 2)}"/>`;
    if (ex.help === 'spaces') for (let i = 0; i < 4; i++) h += `<rect class="sp" x="${st.x0 + 130}" width="${st.x1 - st.x0 - 130}" y="${Y(st, i * 2 + 2) + 3}" height="${st.sp - 6}" rx="6"/>`;
    h += staffSVG(st);
    if (ex.names || ex.help) {
      for (let s = 0; s <= 8; s++) {
        if (ex.help === 'lines' && s % 2) continue;
        if (ex.help === 'spaces' && !(s % 2)) continue;

    const v = VAL[k];
    const bi = ct.bars.findIndex(b => ct.top - used(b) > 0);
    if (bi < 0) { say('Both measures are full. Press Play, or Undo.', '', 84); return; }
    const room = ct.top - used(ct.bars[bi]);
    if (k === 'wr' && (ct.top !== 4 || ct.bars[bi].length)) { say('A whole rest fills a whole empty measure.', 'warn', 84); return; }
    if (v.beats > room) {
      $('palette').classList.remove('shake'); void $('palette').offsetWidth; $('palette').classList.add('shake');
      say(`Only ${room} beat${room > 1 ? 's' : ''} left in measure ${bi + 1}. Try something shorter.`, 'warn', 84);
      SFX.miss(); return;
    }
    ct.bars[bi].push(k);
    audio(); if (!v.rest) held(69, ctx.currentTime + .01, Math.min(v.beats, 2) * .45);
    const left = ct.top - used(ct.bars[bi]);
    say(left ? `${left} beat${left > 1 ? 's' : ''} left in measure ${bi + 1}.` : bi === 0 ? 'Measure 1 is full! On to measure 2.' : 'Both measures are full. Press ▶ Play!', left ? '' : 'good', 84);
    drawCount();
  }
  function ctRow() {
    $('ctrow').innerHTML = `<div class="seg" id="ts" role="group" aria-label="Time signature">${[2, 3, 4].map(n => `<button aria-pressed="${ct.top === n}" data-n="${n}">${n}/4</button>`).join('')}</div>
      <button class="btn" id="undo">↶ Undo</button><button class="btn" id="clr">Clear</button>
      <button class="btn" id="clk" aria-pressed="${ct.click}">⏱ Count-in clicks</button>
      <button class="btn warm" id="pz">🧩 Puzzle</button>
      <button class="btn go" id="play">${ct.playing ? '■ Stop' : '▶ Play'}</button>`;
    $('ts').querySelectorAll('button').forEach(b => b.onclick = () => { ct.top = +b.dataset.n; ct.bars = [[], []]; ct.puzzle = null; ctRow(); drawCount(); say(`${ct.top}/4: ${ct.top} beats in each measure.`, '', 84); });
    $('undo').onclick = () => { ct.puzzle = null; const b = ct.bars[1].length ? ct.bars[1] : ct.bars[0]; b.pop(); drawCount(); say(''); };
    $('clr').onclick = () => { ct.puzzle = null; ct.bars = [[], []]; drawCount(); say('Tap notes and rests to fill the measures.', '', 84); };
    $('clk').onclick = () => { ct.click = !ct.click; ctRow(); };
    $('pz').onclick = newPuzzle;
    $('play').onclick = () => ct.playing ? stopCount() : playCount();
  }
  let cTimer = [];
  function stopCount() { cTimer.forEach(clearTimeout); cTimer = []; ct.playing = false; ct.beat = -1; drawCount(); ctRow(); }
  function playCount() {
    if (ct.puzzle) { say('Fill the gap first!', 'warn', 84); return; }
    const full = ct.bars.filter(b => used(b) === ct.top);
    if (!ct.bars[0].length || used(ct.bars[0]) < ct.top) { say('Fill measure 1 first.', 'warn', 84); return; }
    audio(); ct.playing = true; ctRow();
    const spb = .62, t0 = ctx.currentTime + .1, lead = ct.click ? ct.top : 0;
    for (let i = 0; i < lead; i++) { SFX.click(t0 + i * spb, i === 0); cTimer.push(setTimeout(() => say(`${COUNTS[i]}...`, '', 84), (i * spb + .1) * 1000)); }
    let beat = 0;
    full.forEach((bar, bi) => {
      bar.forEach(k => {
        const v = VAL[k], t = t0 + (lead + beat) * spb;
        if (!v.rest) {
          if (k === 'e2') { pluck(69, t, .3); pluck(69, t + spb / 2, .3); SFX.taiko(t); }
          else { held(69, t, v.beats * spb * .95); SFX.taiko(t); }
        }
        beat += v.beats;
      });
    });
    for (let b = 0; b < beat; b++) cTimer.push(setTimeout(() => { ct.beat = b; drawCount(); say(`Count: ${COUNTS[b % ct.top]}`, '', 84); }, ((lead + b) * spb + .1) * 1000));
    cTimer.push(setTimeout(() => { stopCount(); say('Clap it with your class, counting out loud!', '', 84); }, ((lead + beat) * spb + .4) * 1000));
  }
  // Puzzle: two full measures with one gap. Which note or rest fits?
  function newPuzzle() {
    stopCount();
    const fill = () => { const out = []; let left = ct.top; while (left > 0) { const opts = ['q', 'q', 'e2', 'h', 'qr', 'hd', 'hr'].filter(k => VAL[k].beats <= left); const k = opts[Math.floor(Math.random() * opts.length)]; out.push(k); left -= VAL[k].beats; } return out; };
    ct.bars = [fill(), fill()];
    const bi = Math.floor(Math.random() * 2), at = Math.floor(Math.random() * ct.bars[bi].length);
    ct.puzzle = {bar: bi, at, answer: ct.bars[bi][at]};
    say(`Which note or rest fits the gap in measure ${bi + 1}?`, '', 84);
    drawCount(); ctRow();
  }
  function solve(k) {
    const p = ct.puzzle, need = VAL[p.answer].beats;
    if (VAL[k].beats === need && k !== 'wr') {
      ct.bars[p.bar][p.at] = k; ct.puzzle = null;
      say(`Yes! The gap was ${need} beat${need > 1 ? 's' : ''}. ${VAL[k].name} fits. Press ▶ Play.`, 'good', 84); SFX.chime();
      drawCount(); ctRow();
    } else {
      SFX.miss();
      say(`${VAL[k].name} is ${k === 'wr' ? 'a whole measure' : VAL[k].beats + ' beat' + (VAL[k].beats > 1 ? 's' : '')}. Count the beats around the gap.`, 'warn', 84);
    }
  }

  // ---------- modes ----------
  let mode = 'ex';
  function setMode(m) {
    gm.running = false; stopCount(); mode = m;
    ['ex', 'ninja', 'count'].forEach(k => { $('t-' + k).setAttribute('aria-pressed', k === m); $(k).hidden = k !== m; });
    $('over').hidden = true; say('');
    const P = $('paper').style;
    if (m === 'ex') { Object.assign(P, {left: '90px', top: '110px', width: '1260px', height: '390px'}); drawPiano(); exRow(); drawExplore(); }
    if (m === 'ninja') {
      Object.assign(P, {left: '230px', top: '100px', width: '1150px', height: '500px'});
      gm.notes = []; letterRow(); drawGameStaff(); levelPicker();
    }
    if (m === 'count') { Object.assign(P, {left: '90px', top: '110px', width: '1260px', height: '360px'}); ctRow(); drawCount(); say('Tap notes and rests to fill the measures.', '', 84); }
    hud();
  }
  $('t-ex').onclick = () => setMode('ex');
  $('t-ninja').onclick = () => setMode('ninja');
  $('t-count').onclick = () => setMode('count');

  window.__nn = {setMode, ex, gm, ct, addNote, startGame, answer, place, newPuzzle, solve, playCount, spawn, LEVELS};  // for checking frames
  setMode('ex');
})();
</script>
