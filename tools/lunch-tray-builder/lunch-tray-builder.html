LUNCH TRAY BUILDER (Curio Class)
Grades K-2 health, NHES 2024 Standard 1 (healthy eating: foods from each food group). Food groups follow USDA
MyPlate (myplate.gov): fruits, vegetables, grains, protein foods and dairy. Corn and peas count as vegetables;
beans count as protein here (MyPlate lets them count as either). Cookies and chips are "sometimes foods" that
don't fill a group. No calorie counts, no "good" or "bad" foods: every tray is a starting point to talk about.
Teacher-led on a projector. Build a lunch (foods land in their group's spot, and the tray says what's missing),
Sort it (the class decides each food's group) and Fix the tray (find the missing group on a ready-made lunch).
One file, no network requests. Illustrations: FLUX.2 [klein] 4B (Apache 2.0) on Cloudflare Workers AI. Illustrations: FLUX.1-schnell (Apache 2.0) on a local computer. All edited for Curio Class. Content CC BY 4.0, code MIT. curioclass.org

    {name: 'Rice and beans', foods: ['rice', 'beans', 'corn', 'peas', 'orange'], miss: ['dairy']},
  ];

  const state = {mode: 'build', tray: [], sortAt: -1, sortOrder: [], sortRight: 0, fixAt: -1, sound: true};

  // ---------- sound ----------
  let ctx;
  const audio = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(f, dur = .18, gain = .08, when = 0, type = 'triangle') {
    if (!state.sound) return;
    const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    plop: () => { tone(500, .1, .08, 0, 'sine'); tone(300, .12, .06, .06, 'sine'); },
    yes: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, .08, i * .1)),
    no: () => { tone(260, .2, .06, 0, 'sine'); tone(220, .3, .06, .18, 'sine'); },
    full: () => [392, 494, 587, 784, 988].forEach((f, i) => tone(f, .3, .07, i * .09)),
  };

  // ---------- legend ----------
  $('legend').innerHTML = GROUPS.map(g => `<span><i style="--c:var(--${g})"></i>${G[g].name}</span>`).join('');
  for (const g of GROUPS) $('s-' + g).insertAdjacentHTML('afterbegin', `<div class="lab"><span class="ok" aria-hidden="true">✔</span>${G[g].name}</div>`);

  // ---------- tray ----------
  function drawTray(newId) {
    for (const g of GROUPS) {
      const s = $('s-' + g);
      s.querySelectorAll('img').forEach(i => i.remove());
      const items = state.tray.filter(id => byId[id].g === g);
      s.classList.toggle('empty', !items.length);
      s.classList.remove('need');
      const max = g === 'dairy' ? 1 : 4;
      items.slice(-max).forEach(id => s.append(img(id, id === newId)));
      s.setAttribute('aria-label', `${G[g].name}: ${items.length ? items.map(i => byId[i].name).join(', ') : 'empty'}`);
    }
    const nap = $('napkin');
    nap.querySelectorAll('img').forEach(i => i.remove());
    state.tray.filter(id => byId[id].g === 'some').slice(-3).forEach(id => nap.append(img(id, id === newId)));
    [...$('shelf').children].forEach(b => b.classList.toggle('used', state.tray.includes(b.dataset.id)));
  }
  function img(id, fresh) {
    const i = document.createElement('img');
    i.src = IMG[id]; i.alt = byId[id].name;
    if (fresh) i.className = 'in';
    return i;
  }
  const missing = () => GROUPS.filter(g => !state.tray.some(id => byId[id].g === g));
  const list = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a.at(-1);

  // ---------- Build a lunch ----------
  function shelf() {
    $('shelf').replaceChildren(...F.map(f => {
      const b = document.createElement('button');
      b.className = 'food'; b.dataset.id = f.id;
      b.innerHTML = `<img src="${IMG[f.id]}" alt="">${f.name}`;
      b.setAttribute('aria-label', f.name);
      b.onclick = () => add(f.id);
      return b;
    }));
  }
  function add(id) {
    if (state.mode === 'sort') return;
    const f = byId[id];
    if (state.tray.includes(id)) {   // tapping again takes it off
      state.tray = state.tray.filter(x => x !== id);
      drawTray(); SFX.no();
      return say(`Took off the ${f.name}.`);
    }
    if (f.g === 'dairy' && state.tray.some(x => byId[x].g === 'dairy')) state.tray = state.tray.filter(x => byId[x].g !== 'dairy');
    state.tray.push(id);
    drawTray(id); SFX.plop();
    const miss = missing();
    if (state.mode === 'fix') return fixCheck(id);
    if (f.g === 'some') {
      $('tip').innerHTML = `<b>${cap(f.name)}</b> is a sometimes food. ${G.some.why}`;
      return say([`${cap(f.name)} is a sometimes food.`]);
    }
    $('tip').innerHTML = `<b>${cap(f.name)}</b> goes with <b>${G[f.g].name.toLowerCase()}</b>. ${G[f.g].why}`;
    if (!miss.length) return full();
    say([`${cap(f.name)}. ${G[f.g].name}.`]);
  }
  const cap = s => s[0].toUpperCase() + s.slice(1);
  function full() {
    SFX.full();
    $('tip').innerHTML = '<b>All five food groups!</b> This lunch has fruits, vegetables, grains, protein and dairy.';
    say('All five food groups! What a balanced lunch.');
  }
  function checkTray() {
    const miss = missing();
    if (!state.tray.length) { $('tip').innerHTML = 'The tray is empty! Tap foods on the shelf to add them.'; return say('The tray is empty! Tap foods to add them.'); }
    if (!miss.length) return full();
    for (const g of miss) $('s-' + g).classList.add('need');
    const words = miss.map(g => G[g].one);
    $('tip').innerHTML = `<b>Almost!</b> This tray still needs ${list(words)}. The glowing spots are empty.`;
    say(miss.length === 1 ? `Almost! This tray still needs ${words[0]}.` : `This tray still needs ${miss.length} food groups.`);
  }

  // ---------- Sort it ----------
  function nextSort() {
    if (state.sortAt < 0 || state.sortAt >= state.sortOrder.length - 1) {
      state.sortOrder = F.filter(f => f.g !== 'some').map(f => f.id).sort(() => Math.random() - .5).slice(0, 10);
      state.sortAt = -1; state.sortRight = 0;
    }
    state.sortAt++;
    state.tray = []; drawTray();
    const f = byId[state.sortOrder[state.sortAt]];
    $('sorter').innerHTML = `<span class="n">Food ${state.sortAt + 1} of ${state.sortOrder.length}</span><img id="sort-img" src="${IMG[f.id]}" alt="${f.name}"><b>${cap(f.name)}</b><span>Which food group? Drag it to the tray, or tap a spot.</span>`;
    $('sort-img').onpointerdown = e => drag(e, f.id);
    $('tip').innerHTML = '';
    say(`${cap(f.name)}. Which food group?`);
  }
  function sortDrop(g) {
    const f = byId[state.sortOrder[state.sortAt]];
    if (!f || state.tray.includes(f.id)) return;
    if (g === f.g) {
      state.tray = [f.id]; drawTray(f.id); SFX.yes(); state.sortRight++;
      const last = state.sortAt === state.sortOrder.length - 1;
      $('tip').innerHTML = `<b>Yes!</b> ${cap(f.name)} ${f.name.endsWith('s') ? 'are' : 'is'} ${G[g].one === 'a grain' ? 'a grain food' : G[g].one}. ${G[g].why}` + (last ? `<br><b>Done!</b> You sorted all ${state.sortOrder.length} foods.` : '');
      say([`Yes! ${G[g].name}.`]);
    } else {
      $('s-' + g).classList.add('need'); setTimeout(() => $('s-' + g).classList.remove('need'), 900);
      SFX.no();
      $('tip').innerHTML = `Not ${G[g].name.toLowerCase()}. Try again! ${hintFor(f)}`;
      say([`Not ${G[g].name.toLowerCase()}. Try again!`]);
    }
  }
  const hintFor = f => ({fruit: 'Hint: it grows from a flower and has seeds.', veg: 'Hint: it is a plant part, like a root, stem, leaf or seed.', grain: 'Hint: it is made from a grain like wheat, rice, oats or corn flour.', protein: 'Hint: it helps build muscles.', dairy: 'Hint: it is made from milk.'})[f.g];

  // drag a food onto a spot
  function drag(e, id) {
    e.preventDefault();
    const gh = document.createElement('img');
    gh.className = 'ghost'; gh.src = IMG[id]; document.body.append(gh);
    const move = ev => {
      gh.style.left = ev.clientX - 55 + 'px'; gh.style.top = ev.clientY - 55 + 'px';
      const over = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.dataset && n.dataset.g);
      document.querySelectorAll('.slot').forEach(s => s.classList.toggle('drop', s === over));
    };
    move(e);
    const up = ev => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up);
      gh.remove();
      const over = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.dataset && n.dataset.g);
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('drop'));
      if (over) sortDrop(over.dataset.g);
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  }
  document.querySelectorAll('.slot').forEach(s => s.onclick = () => { if (state.mode === 'sort') sortDrop(s.dataset.g); });

  // ---------- Fix the tray ----------
  function nextFix() {
    state.fixAt = (state.fixAt + 1) % FIX.length;
    const t = FIX[state.fixAt];
    state.tray = [...t.foods]; drawTray();
    $('tip').innerHTML = '';
    $('hint').innerHTML = `<b>Fix the tray: ${t.name}.</b> Look at each spot. Which food group is missing? Ask the class, then tap a food on the shelf to fill it.`;
    say(`${t.name}. Which food group is missing?`);
  }
  function fixCheck(id) {
    const miss = missing();
    const f = byId[id];
    if (!miss.length) return full();
    if (f.g === 'some') { $('tip').innerHTML = `${cap(f.name)} is a sometimes food. It doesn't fill a group.`; return say([`${cap(f.name)} is a sometimes food.`]); }
    $('tip').innerHTML = `<b>${cap(f.name)}</b> fills <b>${G[f.g].name.toLowerCase()}</b>. Still missing: ${list(miss.map(g => G[g].name.toLowerCase()))}.`;
    say([`${cap(f.name)}. ${G[f.g].name}.`, miss.length === 1 ? `Still missing ${G[miss[0]].one}.` : 'Still missing more.']);
  }

  function setMode(m) {
    state.mode = m;
    for (const [id, k] of [['m-build', 'build'], ['m-sort', 'sort'], ['m-fix', 'fix']]) $(id).setAttribute('aria-pressed', m === k);
    $('build-btns').hidden = m !== 'build'; $('sort-btns').hidden = m !== 'sort'; $('fix-btns').hidden = m !== 'fix';
    $('shelf').hidden = m === 'sort'; $('sorter').hidden = m !== 'sort';
    $('build-btns').hidden = m === 'sort';
    $('clear').hidden = m === 'fix';
    stopTalk(); $('tip').innerHTML = '';
    state.tray = []; drawTray();
    if (m === 'build') {
      $('hint').innerHTML = '<b>Build a lunch.</b> Children take turns choosing a food. It lands in its food group\'s spot. Can you fill all five spots? Tap a food again to take it off.';
      say('Let\'s build a lunch! Can we fill all five food groups?');
    }
    if (m === 'sort') { $('hint').innerHTML = '<b>Sort it.</b> Show the food. Ask: which food group? Let the class point, then drag the food to that spot, or tap the spot.'; state.sortAt = -1; nextSort(); }
    if (m === 'fix') { state.fixAt = -1; nextFix(); }
  }
  $('m-build').onclick = () => setMode('build');
  $('m-sort').onclick = () => setMode('sort');
  $('m-fix').onclick = () => setMode('fix');
  $('check').onclick = checkTray;
  $('clear').onclick = () => { state.tray = []; drawTray(); $('tip').innerHTML = ''; };
  $('next-sort').onclick = nextSort;
  $('next-fix').onclick = nextFix;
  addEventListener('keydown', e => { if (e.target.closest('button') || !/^[1-3]$/.test(e.key)) return; setMode(['build', 'sort', 'fix'][e.key - 1]); });

  // ---------- sound and voice ----------
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
    if (!state.sound) stopTalk();
  };
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    const speak = speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      let done = false;
      const go = () => { if (done) return; done = true; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.getVoices();
  }
  const CLIPS = {};
  const allLines = () => [...new Set([
    ...F.flatMap(f => f.g === 'some' ? [`${cap(f.name)} is a sometimes food.`, `Took off the ${f.name}.`] : [`${cap(f.name)}. ${G[f.g].name}.`, `Took off the ${f.name}.`, `${cap(f.name)}. Which food group?`]),
    'All five food groups! What a balanced lunch.', 'The tray is empty! Tap foods to add them.',
    ...GROUPS.flatMap(g => [`Almost! This tray still needs ${G[g].one}.`, `Yes! ${G[g].name}.`, `Not ${G[g].name.toLowerCase()}. Try again!`, `Still missing ${G[g].one}.`]),
    ...[2, 3, 4, 5].map(n => `This tray still needs ${n} food groups.`), 'Still missing more.',
    ...FIX.map(t => `${t.name}. Which food group is missing?`), 'Let\'s build a lunch! Can we fill all five food groups?'])];
  let talk = 0, clip = null, last = [];
  function stopTalk() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (CLIPS[text]) { clip = new Audio(CLIPS[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = .92; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function say(parts, force) {
    if (!state.sound && !force) return;
    stopTalk();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(150); }
  }
  $('read').onclick = () => say(last.length ? last : [$('hint').textContent], true);

  shelf();
  showMotion();
  window.__lunch = {state, setMode, add, sortDrop, checkTray, allLines};  // for checking frames
  setMode('build');
})();
</script>
</body>
</html>
