        </div>
        <div class="two">
          <div><h3>Interest profile</h3><div class="ibars">${[...T].map((t, i) => `<div><i style="height:${(c.riasec[i] - 1) / 6 * 70 + 4}px;background:${COL(t)}${mine.includes(t) ? ';box-shadow:0 0 0 3px #ff6b5755' : ''}"></i>${TYPES[t].icon}<span style="color:${COL(t)}">${t}</span></div>`).join('')}</div></div>
          <div><h3>What the work is like</h3><div class="ws">${WS.map(([k, n]) => `<div>${n}<i><b style="width:${(c.ctx[k] ?? .5) * 100}%"></b>${S.style[k] !== undefined && S.style[k] !== 1 ? `<em style="left:${S.style[k] / 2 * 100}%" title="Your pick"></em>` : ''}</i></div>`).join('')}</div>
          ${Object.values(S.style).some(v => v !== 1) ? '<p class="note" style="margin:6px 0 0">The coral marks show your picks.</p>' : ''}</div>
        </div>
        <div><h3>Strengths it uses</h3><div class="tags">${c.uses.map(s => `<span class="${S.strengths.includes(s) ? 'yes' : ''}">${STRENGTHS[s][0]} ${STRENGTHS[s][1]}</span>`).join('')}</div></div>
        <div class="try"><b>Try it now:</b> ${c.try}</div>
        <div><h3>Similar careers</h3><div class="sim">${sim.map(({o}) => `<button data-id="${o.id}">${o.emoji} ${o.name}</button>`).join('')}</div></div>
        <p class="note" style="margin:0">Pay and job counts: BLS, May 2025, national. Interests and work style: O*NET ${c.onet}.</p>
      </div>`;
    $('sheet').hidden = false;
    $('close').onclick = closeDetail;
    $('detail').querySelectorAll('.sim button').forEach(b => b.onclick = () => openDetail(b.dataset.id));
    $('close').focus();
    anim($('detail'), [{transform: 'translateY(30px) scale(.97)', opacity: 0}, {transform: 'none', opacity: 1}], {duration: 260, easing: 'ease-out'});
  }
  function closeDetail() { $('sheet').hidden = true; lastFocus && lastFocus.focus && lastFocus.focus(); }
  $('sheet').onclick = e => { if (e.target === $('sheet')) closeDetail(); };
  $('sheet').addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = [...$('detail').querySelectorAll('button')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });

  window.__cmq = {S, setView, openDetail, profile, score, CAREERS, fill: (vals, str, style) => { S.answers = vals.slice(); S.at = 36; S.strengths = str || []; S.style = style || {}; S.step = 3; save(); }};
  setView(S.step >= 3 && done() ? 'res' : 'quiz');
})();
</script>
</body>
</html>
