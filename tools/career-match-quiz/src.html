<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Match Quiz · Interests, strengths and careers · Curio Class</title>
<meta name="description" content="Sort 36 activity cards into Love it, Maybe and Not for me, pick your strengths and how you like to work, then see 83 real careers ranked by how well they match. Pay, training and job counts from O*NET and the Bureau of Labor Statistics. Grades 6-8 career exploration. Works offline.">
<!--
CAREER MATCH QUIZ (Curio Class)
Grades 6-8 career exploration, aligned to the Advance CTE Career Clusters framework (2024): self-knowledge of
interests and strengths, and exploring careers across the 14 clusters.
Students sort activity cards (Holland's six interest types: Realistic, Investigative, Artistic, Social,
Enterprising, Conventional, shown as Doer, Thinker, Creator, Helper, Persuader, Organizer), pick three strengths
and five work-style preferences, and see careers ranked by fit. Explore puts all 83 careers on the interest hexagon.
Data: interest profiles, Job Zones and work context from the O*NET 30.2 Database by the U.S. Department of Labor,
Employment and Training Administration (USDOL/ETA), used under CC BY 4.0; O*NET is a trademark of USDOL/ETA.
Curio Class modified the data (scaled and combined it) and USDOL/ETA has not approved, endorsed or tested these
modifications. Pay and employment: BLS Occupational Employment and Wage Statistics, May 2025, national.
The activity cards and career descriptions are original. A quiz like this is a conversation starter, not a test.
One file, no network requests. Illustrations generated with Google Gemini, edited for Curio Class.
Content CC BY 4.0, code MIT. curioclass.org
-->
<style>
:root{
  --bg:#fff7ef;--card:#fff;--ink:#1d2340;--muted:#5f6584;--line:#eadfd2;--focus:#2563eb;
  --coral:#ff6b57;--teal:#14a3a0;--sun:#ffc23d;--navy:#1d2a5b;
  --R:#e8743b;--I:#3b82c4;--A:#b45cc7;--S:#20a07a;--E:#e04869;--C:#6b6fd4;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--navy);color:#fff}
h1{margin:0 auto 0 0;font:800 clamp(21px,2.6vw,28px)/1.1 'Segoe UI',sans-serif;letter-spacing:-.01em}
h1 span{color:var(--sun)}
h1 small{display:block;font:400 14px/1.3 'Segoe UI',sans-serif;color:#c8cce6;letter-spacing:0}
.seg{display:inline-flex;background:#2a3a73;border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#e3e6f7;min-height:42px;padding:0 16px;border-radius:999px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--navy)}
.icon-btn{border:1px solid #3d4c86;background:#24346a;color:#fff;border-radius:999px;min-height:44px;padding:0 14px;font-weight:600;font-size:15px}
main{position:relative;min-height:0;overflow:auto}
.view{max-width:1240px;margin:0 auto;padding:18px 20px 28px}

/* ---------- quiz ---------- */
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.steps span{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.steps span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps span.done{color:var(--teal)}
.steps span.done::before{content:'✓'}
.deck{position:relative;height:360px;max-width:560px;margin:0 auto;perspective:1200px}
.qcard{position:absolute;inset:0;background:var(--card);border-radius:28px;box-shadow:0 14px 40px #1d234022,0 2px 0 #1d234012;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px;text-align:center;touch-action:none;user-select:none;border:2px solid var(--line)}
.qcard.under{transform:translateY(24px) scale(.95);opacity:.75}
.qcard.under2{transform:translateY(46px) scale(.9);opacity:.45}
.qcard .tint{position:absolute;inset:10px;border-radius:20px;z-index:-1}
.qcard{isolation:isolate}
.qcard .em{font-size:96px;line-height:1;filter:drop-shadow(0 6px 6px #0002)}
.qcard .txt{font:800 clamp(24px,3vw,32px)/1.2 'Segoe UI',sans-serif;max-width:440px}
.qcard .ask{color:var(--muted);font-size:15px}
.qcard .stamp{position:absolute;top:22px;padding:6px 14px;border:4px solid;border-radius:12px;font:900 26px/1 'Segoe UI',sans-serif;opacity:0;transform:rotate(-10deg)}
.qcard .stamp.love{left:22px;color:var(--S);border-color:var(--S)}
.qcard .stamp.nope{right:22px;color:var(--E);border-color:var(--E);transform:rotate(10deg)}
.qcard .stamp.maybe{left:50%;top:auto;bottom:22px;margin-left:-60px;color:#b98400;border-color:#e0a800;transform:none}
.answers{display:flex;justify-content:center;gap:12px;margin:24px auto 8px;flex-wrap:wrap}
.answers button{min-height:64px;min-width:150px;border-radius:18px;border:0;font:800 19px 'Segoe UI',sans-serif;box-shadow:0 4px 0 #0002;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.answers button:active{transform:translateY(2px);box-shadow:0 2px 0 #0002}
.a-nope{background:#ffe3e8;color:#a3173b}
.a-maybe{background:#fff1c9;color:#7a5600}
.a-love{background:#d6f5ea;color:#0d6b4f}
.answers kbd{font:600 12px 'Segoe UI';background:#fff9;border-radius:6px;padding:2px 6px;color:inherit}
.quizfoot{display:flex;justify-content:center;align-items:center;gap:16px;color:var(--muted);font-size:15px}
.bar{width:280px;height:10px;background:#efe5da;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:99px;transition:width .3s}
.link{border:0;background:none;color:var(--focus);text-decoration:underline;font-size:15px;min-height:40px;padding:0 4px}
.panelq{max-width:900px;margin:0 auto;text-align:center}
.panelq h2{font:800 30px/1.15 'Segoe UI',sans-serif;margin:6px 0 4px}
.panelq p.sub{color:var(--muted);margin:0 0 18px;font-size:17px}
.strengths{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;text-align:left}
.strengths button{display:flex;align-items:center;gap:10px;min-height:62px;border-radius:16px;border:2px solid var(--line);background:#fff;padding:8px 14px;font-weight:700;font-size:16px}
.strengths button b{font-size:28px}
.strengths button[aria-pressed="true"]{border-color:var(--teal);background:#e3f7f5;box-shadow:inset 0 0 0 1px var(--teal)}
.styles{display:grid;gap:12px;text-align:left}
.style{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:grid;grid-template-columns:220px 1fr;align-items:center;gap:12px}
.style h3{margin:0;font-size:17px}
.style h3 small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri button{min-height:54px;border-radius:12px;border:2px solid var(--line);background:#fffaf4;font-weight:700;font-size:15px;padding:4px 8px}
.tri button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.nextrow{display:flex;justify-content:center;gap:12px;margin-top:20px}
.go{border:0;border-radius:16px;min-height:58px;padding:0 28px;background:var(--coral);color:#fff;font:800 20px 'Segoe UI',sans-serif;box-shadow:0 4px 0 #c2412f}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #c2412f}
.go:disabled{opacity:.45;cursor:default}
.ghost{border:2px solid var(--navy);border-radius:16px;min-height:58px;padding:0 22px;background:#fff;color:var(--navy);font-weight:800;font-size:17px}
@media (max-width:700px){.style{grid-template-columns:1fr}.answers button{min-width:0;flex:1}}

/* ---------- results ---------- */
.res{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.res{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.box h2{margin:0 0 6px;font:800 13px/1 'Segoe UI';letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.code{display:flex;align-items:baseline;gap:10px;margin:2px 0 4px}
.code b{font:900 44px/1 'Segoe UI';letter-spacing:.06em}
.code b span{display:inline-block}
.hex{width:100%;max-width:360px;display:block;margin:0 auto}
.hex text{font:800 15px 'Segoe UI',sans-serif}
.top{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:12px}
.top img{width:120px;height:150px;object-fit:contain}
.top h3{margin:0 0 4px;font:800 22px 'Segoe UI'}
.top p{margin:0;font-size:15px;line-height:1.45}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:#f4ede5}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:38px;padding:0 12px;font-size:14px;font-weight:700}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.filters select{min-height:38px;border-radius:999px;border:1px solid var(--line);padding:0 12px;background:#fff;font-size:14px;font-weight:600}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 150px 110px;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px;min-height:66px;width:100%}
.row:hover{border-color:#cdbfae;box-shadow:0 3px 10px #1d234012}
.row .em{font-size:34px;text-align:center}
.row .nm{font-weight:800;font-size:17px}
.row .nm small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.row .fit{display:grid;gap:4px;font-weight:800;font-size:14px}
.row .fit i{display:block;height:8px;border-radius:99px;background:#efe5da;overflow:hidden}
.row .fit i b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3fd0b0)}
.row .pay{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.row .pay small{display:block;font-weight:500;color:var(--muted);font-size:12px}
@media (max-width:640px){.row{grid-template-columns:44px 1fr 90px}.row .pay{display:none}}
.empty{color:var(--muted);text-align:center;padding:30px}
.note{font-size:13px;color:var(--muted);line-height:1.45}

/* ---------- explore ---------- */
.exp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:980px){.exp{grid-template-columns:1fr}}
.map{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px}
.map svg{width:100%;max-height:calc(100vh - 110px);display:block;margin:0 auto}
.dot{cursor:pointer}
.dot circle{transition:r .15s}
.dot:hover circle,.dot:focus circle{r:22}
.dot text{font-size:20px;pointer-events:none}
.dot.dim{opacity:.12}
.legend{display:grid;gap:6px}
.legend button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:40px;padding:4px 10px;font-weight:700;font-size:14px}
.legend button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.legend button i{width:12px;height:12px;border-radius:50%;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;white-space:nowrap;transform:translate(-50%,-130%)}

/* ---------- detail ---------- */
.sheet{position:fixed;inset:0;background:#1d234066;display:flex;align-items:center;justify-content:center;z-index:20;padding:18px}
.detail{background:#fff;border-radius:26px;max-width:760px;width:100%;max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 30px 80px #0005;position:relative}
.dhead{display:flex;gap:16px;align-items:center;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dhead .em{font-size:64px;line-height:1}
.dhead h2{margin:0;font:800 30px/1.1 'Segoe UI'}
.dhead p{margin:4px 0 0;color:var(--muted);font-weight:600}
.close{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px}
.dbody{padding:16px 22px 22px;display:grid;gap:14px}
.does{font-size:19px;line-height:1.45;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{background:#fbf6f0;border-radius:14px;padding:10px 12px}
.fact span{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{font-size:20px;font-variant-numeric:tabular-nums}
.fact small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
@media (max-width:640px){.facts{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.dbody h3{margin:0 0 6px;font:800 13px/1 'Segoe UI';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ws{display:grid;gap:7px}
.ws div{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:14px;font-weight:600}
.ws i{display:block;height:10px;border-radius:99px;background:#efe5da;position:relative}
.ws i b{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--navy)}
.ws i em{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--coral);margin-left:-2px}
.ibars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:90px}
.ibars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;font-weight:800;gap:3px}
.ibars i{display:block;width:100%;border-radius:6px 6px 2px 2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{padding:5px 11px;border-radius:99px;background:#f2ebe3;font-size:14px;font-weight:700}
.tags span.yes{background:#d6f5ea;color:#0d6b4f}
.why{background:#eef8f7;border-left:5px solid var(--teal);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45}
.try{background:#fff6dc;border-left:5px solid var(--sun);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45}
.sim{display:flex;flex-wrap:wrap;gap:8px}
.sim button{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px}
.calm *{animation:none!important;transition:none!important}

@media print{
  header,.filters,.nextrow,.sheet,.noprint{display:none!important}
  body{background:#fff}
  .res{grid-template-columns:1fr 1fr}
  .row{break-inside:avoid}
}
@media (max-height:700px){.deck{height:300px}.qcard .tint{position:absolute;inset:10px;border-radius:20px;z-index:-1}
.qcard{isolation:isolate}
.qcard .em{font-size:74px}}
</style>
</head>
<body>
<header>
  <h1>Career <span>Match</span> Quiz <small>What do you like to do? Find careers that fit.</small></h1>
  <div class="seg" role="group" aria-label="View">
    <button id="tab-quiz" aria-pressed="true">1 · Quiz</button>
    <button id="tab-res" aria-pressed="false">2 · My matches</button>
    <button id="tab-exp" aria-pressed="false">3 · Explore</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<main id="main">
  <section class="view" id="v-quiz"></section>
  <section class="view" id="v-res" hidden></section>
  <section class="view" id="v-exp" hidden></section>
</main>
<div class="sheet" id="sheet" hidden><div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-title"></div></div>

<script>

  const IMG = {R: 'art:t-r', I: 'art:t-i', A: 'art:t-a', S: 'art:t-s', E: 'art:t-e', C: 'art:t-c'};
  const TYPES = {

  };
  const T = 'RIASEC';
  // card backgrounds cycle in fives so a color never hints at a type (types cycle in sixes)
  const TINTS = ['#fff1e8', '#eaf6ff', '#f1ecff', '#e9f8ef', '#fff7d9'];
  // 36 activity cards, six for each interest type
  const CARDS = [
    ['R', '🚲', 'Fix a broken bike'], ['I', '🧪', 'Do a science experiment'], ['A', '🎨', 'Paint a mural'], ['S', '📖', 'Teach a younger kid to read'], ['E', '🍋', 'Run your own small business'], ['C', '💵', 'Keep track of the money for a club'],

    ['R', '🐄', 'Take care of animals on a farm'], ['I', '🧩', 'Solve a really tricky puzzle'], ['A', '🎭', 'Act in a play'], ['S', '🥫', 'Volunteer at a food bank'], ['E', '👑', 'Be class president'], ['C', '📅', 'Make the practice schedule for a team'],

      <div class="box"><h2>Career clusters</h2><p class="note" style="margin:4px 0 10px">Each dot is a career, placed near the interest types it fits. Tap one to learn about it, or pick a cluster to light up its careers.${best.size ? ' <b style="color:var(--coral)">Dashed rings</b> mark your top ten matches.' : ''}</p>
        <div class="legend"><button data-k="" aria-pressed="${!ex.cluster}"><i style="background:linear-gradient(135deg,var(--R),var(--I),var(--A),var(--S),var(--E),var(--C))"></i>All ${CAREERS.length} careers</button>
        ${Object.entries(CLUSTERS).map(([k, n]) => `<button data-k="${k}" aria-pressed="${ex.cluster === k}"><i style="background:var(--navy)"></i>${n} <span style="margin-left:auto;opacity:.6">${CAREERS.filter(c => c.cluster === k).length}</span></button>`).join('')}</div></div></div>`;
    v.querySelectorAll('.legend button').forEach(b => b.onclick = () => { ex.cluster = b.dataset.k; drawExp(); });
    const tip = $('tip'), map = $('map');
    v.querySelectorAll('.dot').forEach(d => {
      d.onclick = () => openDetail(d.dataset.id);
      d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(d.dataset.id); } };
      d.onmouseenter = d.onfocus = () => {
        const c = CAREERS.find(c => c.id === d.dataset.id), r = d.getBoundingClientRect(), m = map.getBoundingClientRect();
        tip.textContent = c.name; tip.hidden = false; tip.style.left = (r.left + r.width / 2 - m.left) + 'px'; tip.style.top = (r.top - m.top) + 'px';
      };
      d.onmouseleave = d.onblur = () => tip.hidden = true;
    });
  }

  // ---------- career detail ----------
  let lastFocus = null;
  function openDetail(id) {
    const c = CAREERS.find(c => c.id === id); if (!c) return;
    lastFocus = document.activeElement;
    const p = done() ? profile() : null, sc = p ? score(c, p) : null, pay = payText(c), mine = p ? order(p).slice(0, 3) : [];
    const cc = code3(c);
    const sim = CAREERS.filter(o => o !== c).map(o => ({o, r: corr(o.riasec, c.riasec) + (o.cluster === c.cluster ? .15 : 0)})).sort((a, b) => b.r - a.r).slice(0, 4);
    const WS = [['outdoors', 'Outdoors'], ['people', 'With the public'], ['hands', 'Hands-on'], ['routine', 'Routine'], ['team', 'Teamwork']];
    let why = '';
    if (sc) {
      const shared = cc.filter(t => mine.includes(t));
      const parts = [];
      if (shared.length) parts.push(`it fits your <b>${shared.map(t => TYPES[t].name).join('</b> and <b>')}</b> side`);
      const good = Object.entries(S.style).filter(([k, v]) => v !== 1 && Math.abs(v / 2 - (c.ctx[k] ?? .5)) < .3).map(([k]) => WS.find(w => w[0] === k)[1].toLowerCase());
      if (good.length) parts.push(`the work style matches what you picked (${good.join(', ')})`);
      const str = S.strengths.filter(s => c.uses.includes(s));
      if (str.length) parts.push(`it uses your strength${str.length > 1 ? 's' : ''} in ${str.map(s => STRENGTHS[s][1].toLowerCase()).join(' and ')}`);
      why = `<div class="why"><b>${sc.fit}% match.</b> ${parts.length ? 'Why: ' + parts.join('; ') + '.' : 'It is not a close match to your answers, but it is worth a look if it sounds interesting.'}</div>`;
    }
    $('detail').innerHTML = `<button class="close" id="close" aria-label="Close">✕</button>
      <div class="dhead"><span class="em">${c.emoji}</span><div><h2 id="d-title">${c.name}</h2><p>${CLUSTERS[c.cluster]}</p></div></div>
      <div class="dbody">
        <p class="does">${c.does}</p>
        ${why}
        <div class="facts">
          <div class="fact"><span>Typical pay</span><b>${pay.big}</b><small>${pay.small}</small></div>
          <div class="fact"><span>Training</span><b style="font-size:17px">${ZONE[c.zone]}</b><small>${c.path}</small></div>
          <div class="fact"><span>People doing it</span><b>${c.jobs ? jobsText(c.jobs) : 'Not counted'}</b><small>${c.jobs ? 'jobs in the US (wage and salary)' : 'mostly self-employed, so BLS does not count them'}</small></div>
        </div>
        <div class="two">
          <div><h3>Interest profile</h3><div class="ibars">${[...T].map((t, i) => `<div><i style="height:${(c.riasec[i] - 1) / 6 * 70 + 4}px;background:${COL(t)}${mine.includes(t) ? ';box-shadow:0 0 0 3px #ff6b5755' : ''}"></i>${TYPES[t].icon}<span style="color:${COL(t)}">${t}</span></div>`).join('')}</div></div>
          <div><h3>What the work is like</h3><div class="ws">${WS.map(([k, n]) => `<div>${n}<i><b style="width:${(c.ctx[k] ?? .5) * 100}%"></b>${S.style[k] !== undefined && S.style[k] !== 1 ? `<em style="left:${S.style[k] / 2 * 100}%" title="Your pick"></em>` : ''}</i></div>`).join('')}</div>
          ${Object.values(S.style).some(v => v !== 1) ? '<p class="note" style="margin:6px 0 0">The coral marks show your picks.</p>' : ''}</div>
        </div>
        <div><h3>Strengths it uses</h3><div class="tags">${c.uses.map(s => `<span class="${S.strengths.includes(s) ? 'yes' : ''}">${STRENGTHS[s][0]} ${STRENGTHS[s][1]}</span>`).join('')}</div></div>
        <div class="try"><b>Try it now:</b> ${c.try}</div>
        <div><h3>Similar careers</h3><div class="sim">${sim.map(({o}) => `<button data-id="${o.id}">${o.emoji} ${o.name}</button>`).join('')}</div></div>
        <p class="note" style="margin:0">Pay and job counts: BLS, May 2025, national. Interests and work style: O*NET ${c.onet}.</p>
      </div>`;
    $('sheet').hidden = false;
    $('close').onclick = closeDetail;
    $('detail').querySelectorAll('.sim button').forEach(b => b.onclick = () => openDetail(b.dataset.id));
    $('close').focus();
    anim($('detail'), [{transform: 'translateY(30px) scale(.97)', opacity: 0}, {transform: 'none', opacity: 1}], {duration: 260, easing: 'ease-out'});
  }
  function closeDetail() { $('sheet').hidden = true; lastFocus && lastFocus.focus && lastFocus.focus(); }
  $('sheet').onclick = e => { if (e.target === $('sheet')) closeDetail(); };
  $('sheet').addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = [...$('detail').querySelectorAll('button')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });

  window.__cmq = {S, setView, openDetail, profile, score, CAREERS, fill: (vals, str, style) => { S.answers = vals.slice(); S.at = 36; S.strengths = str || []; S.style = style || {}; S.step = 3; save(); }};
  setView(S.step >= 3 && done() ? 'res' : 'quiz');
})();
</script>
</body>
</html>
