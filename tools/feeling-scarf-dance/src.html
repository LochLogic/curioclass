<!--

<link rel="stylesheet" href="kit:curio">
<style>
:root {

}
body { grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100dvh; min-height: 425px; overflow: hidden; }
button { min-width: 60px; min-height: 60px; touch-action: manipulation; }

.action.gold { background: #ffdb68; border-color: #b9812c; color: #3a2710; }

.part-word { position: absolute; top: 12px; right: 18px; font: 900 clamp(30px, 5vw, 65px) 'Trebuchet MS', sans-serif;

.turn .part-word { left: 0; right: 0; top: 10px; text-align: center; margin: auto; width: max-content; max-width: 96%; }
.counts { display: block; width: 100%; height: 34px; }
.mini-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px 10px; }
.mini { display: flex; align-items: center; justify-content: center; gap: 7px; border: 2px solid #cfb6c5;

.mini span { font-size: 16px; }

.note { font-size: 15px; margin-top: auto !important; }
.share { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; }

.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
.chip { text-align: left; min-height: 90px; font-size: clamp(16px, 2vw, 25px); padding: 12px; }
.chip[aria-pressed="true"] { background: #f3d7eb; border-color: var(--brand); }
.chip .tick { display: inline-block; font-size: 28px; width: 38px; color: var(--brand); }
footer { padding: 9px 18px; background: #fffafc; border-top: 1px solid var(--line); min-height: 57px; }
#hint { margin: 0; min-height: 36px; display: flex; align-items: center; font-size: 17px; line-height: 1.3; color: var(--ink); }
dialog { border: 3px solid #a77695; border-radius: 25px; width: min(900px, calc(100% - 24px)); padding: 15px;
  background: #fff9f4; color: var(--ink); box-shadow: 0 12px 45px #3f213860; }
dialog::backdrop { background: #311b3338; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.dialog-head h2 { margin: 0; font-size: 24px; }
dialog .options .choice { flex-direction: column; }
dialog .options svg { height: 55px; }
.breeze { position: absolute; left: 6%; bottom: 8%; width: 25px; height: 7px; border-radius: 50%; background: #fff6;
  animation: drift 7s ease-in-out infinite alternate; pointer-events: none; }
@keyframes drift { to { transform: translate(80px, -20px) rotate(15deg); } }
.calm .breeze { animation: none !important; }
@media (max-height: 650px) and (min-width: 601px) {

  .options svg { width: 30px; height: 30px; }
  .run-pane { grid-template-columns: minmax(0, 1fr) 215px; }
  .control-desk { padding: 6px; gap: 5px; }
  .control-desk h2, .control-desk .intro { display: none; }
  .control-desk .action { font-size: 16px; }
  .control-desk .actions { gap: 5px; }
  .control-desk .note { font-size: 13px; }
  .performance { grid-template-rows: minmax(0, 1fr) 26px 64px; }
  .mini-strip { padding: 2px 4px; gap: 3px; }
  .mini svg { width: 28px; height: 42px; }
  .mini span { font-size: 13px; }
  .mini b { font-size: 12px; }
  .part-word { font-size: 28px; padding: 0 9px; top: 6px; right: 7px; }
  .feeling-badge { font-size: 14px; top: 6px; left: 7px; padding: 5px 8px; }
  .feeling-badge .face { font-size: 20px; margin-right: 2px; }
  .audience-card { padding: 8px 12px; }
  .audience-card h2 { font-size: 23px; margin-bottom: 6px; }
  .chips { gap: 6px; margin-bottom: 6px; }
  .chip { min-height: 60px; padding: 5px; font-size: 18px; }
  footer { min-height: 40px; padding: 3px 12px; }
  #hint { min-height: 34px; font-size: 15px; }
}
@media (max-width: 600px) {
  body { min-height: 700px; }
  header { padding: 5px 9px; gap: 5px; justify-content: center; }
  h1 { width: 100%; text-align: center; font-size: 23px; }
  h1 small { display: none; }
  .icon-btn { flex: 1; padding: 0 4px; font-size: 14px; }
  .modes { padding: 0; }
  .seg { width: 100%; border: 0; border-radius: 0; }
  .seg button { flex: 1; min-width: 60px; padding: 0 4px; font-size: 14px; }
  .compose { padding: 6px; grid-template-rows: 126px minmax(90px, 1fr) auto 60px; gap: 6px; }
  .feeling-row { grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .feeling-row .choice { font-size: 14px; padding: 3px; }
  .face { font-size: 24px; margin-right: 1px; }
  .strip { gap: 5px; }
  .part { border-radius: 14px; padding: 3px; height: 100%; }
  .part .part-label { font-size: 17px; }
  .part .part-choice { font-size: 14px; }
  .part svg { max-height: 100px; }
  .options, .options.five { grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .options .choice { font-size: 14px; padding: 2px; gap: 0; }
  .options svg { width: 34px; height: 45px; }
  .choice-area { padding: 4px; }
  .choice-title { font-size: 14px; }
  .action { padding: 5px 10px; font-size: 17px; }
  .run-pane { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 1fr) auto; }
  .performance { grid-template-rows: minmax(0, 1fr) 28px 64px; }
  .control-desk { padding: 6px; border-left: 0; gap: 6px; display: grid; grid-template-columns: 1fr 2fr; }
  .control-desk h2, .control-desk .intro, .control-desk .note { display: none; }
  .control-desk .actions { gap: 5px; grid-template-columns: 1fr 1fr; }

  .control-desk #feeling-menu { font-size: 15px; }
  .mini { gap: 3px; }
  .mini svg { width: 28px; height: 42px; }
  .mini b { font-size: 12px; }
  .mini span { font-size: 13px; }
  .part-word { font-size: 28px; }
  .feeling-badge { padding: 5px; font-size: 14px; }
  .turn .feeling-badge { top: auto; bottom: 8px; }
  .share { padding: 6px; }
  .audience-card { padding: 12px; }
  .chips { grid-template-columns: 1fr; gap: 7px; }
  .chip { min-height: 65px; font-size: 17px; }

}
</style>

<body>
<header>
  <h1>Feeling Scarf Dance <small>Make a feeling move through the air.</small></h1>
  <button class="icon-btn" id="read">🔊 Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<nav class="modes" aria-label="Dance modes">
  <div class="seg">
    <button id="m-build" aria-pressed="true">▦ Build</button>
    <button id="m-watch" aria-pressed="false">◉ Watch</button>
    <button id="m-turn" aria-pressed="false">〰 Your turn</button>
    <button id="m-share" aria-pressed="false">👏 Share</button>
  </div>
</nav>
<main>
  <section id="build" class="compose painted" aria-label="Build a three-part dance">
    <div class="wash"></div>
    <div id="feelings" class="feeling-row" role="group" aria-label="Feeling"></div>
    <div id="build-strip" class="strip" role="group" aria-label="Dance parts"></div>
    <div class="choice-area">
      <span class="choice-title" id="choice-title">Start shape</span>
      <div id="choices" class="options five" role="group" aria-labelledby="choice-title"></div>
    </div>
    <div class="actions">
      <button id="idea" class="action">💡 Feeling idea</button>
      <button id="watch-it" class="action gold" disabled>▶ Watch it</button>
    </div>
    <i class="breeze" aria-hidden="true"></i>
  </section>
  <section id="run-pane" class="run-pane" hidden aria-label="Dance performance">
    <div class="performance">
      <div class="viewport" id="stage">
        <svg id="dance-scene" role="img" aria-label="A dancer holding a flowing scarf on a painted grassy hilltop"></svg>
        <div id="feeling-badge" class="feeling-badge"></div>
        <div id="part-word" class="part-word">Start</div>
      </div>
      <svg id="counts" class="counts" role="img" aria-label="Sixteen counts in groups of four, eight and four"></svg>
      <div id="mini-strip" class="mini-strip" role="group" aria-label="Change a dance part"></div>
    </div>
    <aside class="control-desk">
      <h2 id="run-title">Follow the silk</h2>
      <p class="intro" id="run-intro">A start, a moving middle, an end.</p>
      <button id="feeling-menu" class="action">☺ Feeling</button>
      <div class="actions" id="watch-actions">
        <button id="play" class="action gold" disabled>▶ Play</button>
        <button id="again" class="action" disabled>↻ Again</button>
        <button id="slow" class="action" aria-pressed="false">🐢 Slow</button>
      </div>
      <div class="actions" id="turn-actions" hidden>
        <button id="go" class="action gold" disabled>▶ Go</button>
        <button id="stop" class="action">■ Stop</button>
        <button id="mirror" class="action" aria-pressed="false">↔ Mirror</button>
      </div>
      <p class="note" id="run-note">Tap a part card to change it, even while it plays.</p>
    </aside>
  </section>
  <section id="share" class="share painted" hidden aria-label="Audience feedback">
    <div class="wash"></div>
    <div class="audience-card">
      <h2>👏 Audience, I saw...</h2>
      <div id="chips" class="chips"></div>
      <div class="actions">
        <button id="swap" class="action">⇄ Swap</button>
        <button id="go-again" class="action gold">▶ Go again</button>
      </div>
    </div>
  </section>
</main>
<footer><p class="hint" id="hint" aria-live="polite"></p></footer>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <div class="dialog-head">
    <h2 id="edit-title">Choose a part</h2>
    <button id="editor-read" class="action">🔊 Read</button>
    <button id="close-editor" class="action">✓ Done</button>
  </div>
  <div id="edit-choices" class="options"></div>
</dialog>
<script src="kit:curio"></script>
<script src="kit:dance"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);
    for (const key in attrs) node.setAttribute(key, attrs[key]);
    if (parent) parent.appendChild(node);
    return node;
  };
  const names = ['Start', 'Middle', 'End'];
  const shapes = ['Tiny ball', 'Tall tower', 'Wide star', 'Twisty', 'Lean'];
  const moves = ['Float', 'Swirl', 'Zap', 'Melt', 'Shiver', 'Leap'];
  const poseFor = index => [Dance.level('curl', 'low'), Dance.level('reach-up', 'high'),
    Dance.pose('arms-wide'), Dance.pose('twist'), Dance.pose('bend-side')][index];
  const feelings = [
    {name: 'Happy', face: '☺', color: '#f2b632', pattern: 'dots', bpm: 112, meter: 4, idea: [2, 5, 1]},
    {name: 'Sad', face: '☹', color: '#4f7fbf', pattern: 'stripes', bpm: 66, meter: 4, idea: [4, 3, 0]},
    {name: 'Calm', face: '😌', color: '#4aa38a', pattern: 'waves', bpm: 72, meter: 3, idea: [1, 0, 2]},
    {name: 'Mad', face: '😠', color: '#c43c2c', pattern: 'zigzags', bpm: 100, meter: 4, idea: [3, 2, 0]},
    {name: 'Surprised', face: '😮', color: '#8a5cc6', pattern: 'stars', bpm: 96, meter: 4, idea: [0, 2, 2]}
  ];
  const state = {mode: 'build', feeling: null, parts: [null, null, null], selected: 0,
    running: false, still: false, slow: false, mirror: false, count: null, freeze: false, checked: [false, false, false, false]};
  const L = {
    wBuild: "Let's make a dance about a feeling. First, tap a feeling.",
    happy: 'Happy.', sad: 'Sad.', calm: 'Calm.', mad: 'Mad.', surprised: 'Surprised.',
    feelingHow: 'How does your body show that feeling? Tap a start shape.',
    startHow: 'Now tap Middle and pick a middle move. How does the feeling move?',
    middleHow: 'Last, tap End and pick an end shape. How does the feeling finish?',
    complete: 'Your dance has a start, a middle and an end. Tap Watch it.',
    idea: 'Here is one idea. You can change any part.',
    wWatch: 'Watch the scarf. Tap Play.', watchEnd: 'Did the scarf show the feeling? How?',
    wTurn: 'Get your scarf, or use your hand. Find your start shape. Tap Go.',
    freeze: 'Freeze! Hold your end shape. And breathe.',
    wShare: 'Audience, what did you see? Tell the dancers.',
    chipStart: 'A clear start!', chipMiddle: 'The middle move!', chipEnd: 'A clear end!', chipFeeling: 'You felt it!',
    swap: 'Swap! Dancers, sit down. Audience, find your start shape.',
    startReady: 'Start shape chosen. Tap Middle to choose a middle move.',
    middleReady: 'Middle move chosen. Tap End to choose an end shape.',
    endReady: 'End shape chosen. Tap a feeling to finish your dance.',
    pickFeeling: 'Tap a feeling, then tap Feeling idea, or choose your three parts.',
    pickStart: 'Tap Start, then tap a start shape.', pickMiddle: 'Tap Middle, then tap a middle move.',
    pickEnd: 'Tap End, then tap an end shape.',
    stoppedWatch: 'Tap Play to watch, or tap a part card to change your dance.',
    stoppedTurn: 'Find your start shape. Tap Go to dance with the scarf.',
    shareHow: 'Tap the I saw chips that match what your audience noticed. Tap Swap for new dancers.',
    watchRun: 'Watch the scarf. Tap Stop to stop the dance, or tap a part card to change it.',
    turnRun: 'Follow the scarf. Tap Stop to stop, or tap Mirror to flip the view.',
    chooseStart: 'Tap a start shape. Tap Done to return to the dance.',
    chooseMiddle: 'Tap a middle move. Tap Done to return to the dance.',
    chooseEnd: 'Tap an end shape. Tap Done to return to the dance.',
    chooseFeeling: 'Tap a feeling. Tap Done to return to the dance.',
    buildStart: 'Tap a start shape. Tap Middle to choose the moving part.',
    buildMiddle: 'Tap a middle move. Tap End to choose the ending shape.',
    buildEnd: 'Tap an end shape. Tap Start or Middle to change another part.',
    afterWatch: 'Did the scarf show the feeling? Tap Your turn to dance it yourself.',
    swapHint: 'New dancers, find your start shape. Tap Go again when you are ready.',
    finishBuild: 'Tap Build to finish your dance. Choose a feeling, a start shape, a middle move and an end shape.',
    freezeHint: 'Hold your end shape. Then tap Share to tell what you saw.'
  };
  const ready = () => state.feeling !== null && state.parts.every(value => value !== null);
  const currentFeeling = () => feelings[state.feeling ?? 0];
  const missingHint = () => state.feeling === null ? L.pickFeeling : state.parts[0] === null ? L.pickStart :
    state.parts[1] === null ? L.pickMiddle : state.parts[2] === null ? L.pickEnd : '';
  let session = 0;
  let clock = null;
  let run = null;
  let music = null;
  let phrase = null;
  let editorPart = null;
  let editOpener = null;
  let freezeTimer = null;
  let musicFeeling = null;
  let changedAt = 0;
  let transitionFrom = null;
  let feelingEvent = 0;
  let modeInitialized = false;
  const V = Curio.voice({lines: L, scope: () => state.mode, hint: false, read: () => $('hint').textContent,
    welcome: () => {
      if (state.running || state.freeze || $('edit-dialog').open) return null;
      const key = {build: 'wBuild', watch: 'wWatch', turn: 'wTurn', share: 'wShare'}[state.mode];

      const part = n <= 4 ? 0 : n <= 12 ? 1 : 2;
      $('part-word').textContent = n <= 0 ? 'Ready ' + (n + 4) : names[part];
      miniCards.forEach((card, i) => card.classList.toggle('playing', n > 0 && i === part));
    });
    run = Dance.play(dancer, phraseProxy, {clock, onEnd: () => endRun(token),
      onFrame: () => drawRibbon(performance.now())});
    resetRibbon();
    $('play').textContent = '■ Stop';
    updateHint();
    clock.start();
  }
  function setMode(mode) {
    if (modeInitialized && state.mode === mode) {
      updateHint();
      return;
    }
    modeInitialized = true;
    stopRun();
    if ($('edit-dialog').open) closeEditor();
    state.mode = mode;
    state.still = false;
    $('build').hidden = mode !== 'build';
    $('run-pane').hidden = !['watch', 'turn'].includes(mode);
    $('share').hidden = mode !== 'share';
    $('run-pane').classList.toggle('turn', mode === 'turn');
    $('watch-actions').hidden = mode !== 'watch';
    $('turn-actions').hidden = mode !== 'turn';
    for (const m of ['build', 'watch', 'turn', 'share']) $('m-' + m).setAttribute('aria-pressed', String(m === mode));
    dancer.g.setAttribute('opacity', mode === 'turn' ? 0 : 1);
    floor.layers.shadow.setAttribute('opacity', mode === 'turn' ? 0 : 1);
    handGhost.setAttribute('visibility', mode === 'turn' ? 'visible' : 'hidden');
    $('dance-scene').setAttribute('aria-label', mode === 'turn' ? 'A scarf alone follows your dance, with a faint mark at the hand.' :
      'A dancer holding a flowing scarf on a painted grassy hilltop.');
    $('run-title').textContent = mode === 'turn' ? 'Your feeling, your dance' : 'Follow the silk';
    $('run-note').textContent = mode === 'turn' ? 'A scarf, a tissue, a towel or your hand all work.' :
      'Tap a part card to change it, even while it plays.';
    $('part-word').textContent = ready() ? 'Start' : 'Build first';
    if (state.feeling === null) $('feeling-badge').textContent = '◇ Choose a feeling';
    miniCards.forEach(card => card.classList.remove('playing'));
    dots.set(null);
    updateChips();
    refreshCards();
    updateHint();
    if (document.activeElement?.closest('[hidden]')) $('m-' + mode).focus({preventScroll: true});
    V.welcome();
    if (['watch', 'turn'].includes(mode) && !ready()) {
      V.how('finishBuild', {valid: () => !ready(), needs: '#m-build'});
    }
    requestAnimationFrame(relayout);
  }
  $('play').onclick = () => state.running ? stopRun() : startRun();
  $('again').onclick = startRun;
  $('go').onclick = startRun;
  $('stop').onclick = () => stopRun();
  $('slow').onclick = () => {
    state.slow = !state.slow;
    $('slow').setAttribute('aria-pressed', String(state.slow));
    if (clock && state.running) clock.setBpm(currentFeeling().bpm * (state.slow ? .7 : 1));
    Curio.tone(state.slow ? 330 : 440, .06, .03);
  };
  $('mirror').onclick = () => {
    state.mirror = !state.mirror;
    $('mirror').setAttribute('aria-pressed', String(state.mirror));
    applyMirror();
    Curio.tone(440, .06, .03);
  };
  function applyMirror() {
    const hand = dancer.world('rHa');
    const handY = hand ? floor.project(...hand)[1] : 0;
    const length = dancer.height * floor.scale(dancer.z) * 1.1;
    const dy = Curio.reduce ? Math.min(0, floor.h * .96 - handY - length) : 0;
    const transform = state.mode === 'turn' && state.mirror ?
      `translate(${floor.w}, ${dy}) scale(-1, 1)` : `translate(0, ${dy})`;
    for (const layer of [floor.layers.actors, floor.layers.shadow, ribbonLayer]) layer.setAttribute('transform', transform);
  }
  const chipKeys = ['chipStart', 'chipMiddle', 'chipEnd', 'chipFeeling'];
  const chipButtons = chipKeys.map((key, index) => {
    const b = button('<span class="tick" aria-hidden="true">○</span><span class="chip-label"></span>', 'choice chip', () => {
      state.checked[index] = !state.checked[index];
      updateChips();
      event(key);
      Curio.yes();
      updateHint();
    });
    b.id = 'chip-' + index;
    $('chips').appendChild(b);
    return b;
  });
  function updateChips() {
    const labels = ['I saw a clear start', 'I saw the middle move', 'I saw a clear end',
      'I felt it: ' + (state.feeling === null ? 'our feeling' : currentFeeling().face + ' ' + currentFeeling().name)];
    chipButtons.forEach((b, i) => {
      b.setAttribute('aria-pressed', String(state.checked[i]));
      b.querySelector('.tick').textContent = state.checked[i] ? '✓' : '○';
      b.querySelector('.chip-label').textContent = labels[i];
    });
  }
  $('swap').onclick = () => {
    state.checked.fill(false);
    updateChips();
    event('swap');
    hint(L.swapHint);
    Curio.tone(523, .1, .04);
  };
  $('go-again').onclick = () => setMode('turn');
  function relayout() {
    if ($('run-pane').hidden) return;
    const box = $('stage').getBoundingClientRect();
    if (!box.width || !box.height) return;
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    floor.resize(box.width, box.height,
      {x0: box.width * .03, x1: box.width * .97, yBack: box.height * .68, yFront: box.height * .91});
    const backdrop = floor.layers.bg.querySelector('image');
    backdrop.setAttribute('height', box.height);
    floor.layers.bg.appendChild(sceneWash);
    // Leave room for a full-length hanging scarf at the hand's highest point.
    dancer.scale = 1;
    floor.dancerHeight = box.height * .55 / floor.scale(43);
    dancer.render();
    const countWidth = $('counts').clientWidth;
    $('counts').setAttribute('viewBox', `0 0 ${countWidth} 30`);
    dots.layout({x: 4, y: 2, w: Math.max(100, countWidth - 28), h: 25});
    showCount(state.count);
    resetRibbon();
    applyMirror();
  }
  function showCount(n) {
    dots.set(n);
    [...dots.g.children].forEach((circle, i) => {
      circle.setAttribute('transform', `translate(${i >= 12 ? 20 : i >= 4 ? 10 : 0} 0)`);
    });
  }
  new ResizeObserver(relayout).observe($('stage'));
  Curio.onMotion(() => {
    if (Curio.reduce && phrase) dancer.set(phrase.at(Math.max(0, (state.count ?? 1) - 1)));
    resetRibbon();
  });
  // Read always stops the clock before it speaks, including during count-in or a quiet freeze.
  $('read').addEventListener('click', () => { if (state.running || state.freeze) stopRun(); }, true);
  // Turning Sound on during a run must not queue a welcome over the music.
  Curio.onSound(() => {
    if (state.running) {
      V.dropQueued();
      music?.mute(!Curio.sound || (state.feeling === 4 && state.count > 0 && state.count % 4 === 0));
    }
  });
  document.addEventListener('keydown', e => {
    if ($('edit-dialog').open || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
      if (['watch', 'turn'].includes(state.mode)) state.running ? stopRun() : startRun();
    }
    if (/^[1-5]$/.test(e.key)) chooseFeeling(Number(e.key) - 1);
    const part = {s: 0, m: 1, e: 2}[e.key.toLowerCase()];
    if (part !== undefined) {
      e.preventDefault();
      if (state.mode !== 'build') setMode('build');
      selectPart(part);
      buildOptions[0].focus({preventScroll: true});
    }
  });
  function idleFrame(time) {
    if (!state.running && !state.still && !state.freeze && !Curio.reduce && !$('run-pane').hidden && time - lastIdle >= 30) {
      drawRibbon(time);
      lastIdle = time;
    }
    requestAnimationFrame(idleFrame);
  }
  Curio.init({clips: "voice:*", rate: .9});
  rebuildPhrase();
  dancer.set(phrase.at(0));
  paintPattern();
  renderChoices();
  refreshCards();
  updateChips();
  setMode('build');
  requestAnimationFrame(idleFrame);
  window.__tool = {state, setMode, allLines: V.allLines, vlog: V.log, get vq() { return V.queue; },
    feelings, shapes, moves, chooseFeeling, choosePart, feelingIdea, startRun, stopRun, dancer, floor,
    get clock() { return clock; }, get phrase() { return phrase; }, get ribbon() { return ribbon; }, relayout};
})();
</script>
</body>
</html>
