<title>First Apartment Budget · A year on your own · Curio Class</title>
<meta name="description" content="Pick a real city, a real starting job and a place to live, then survive your first year on your own: paychecks with real 2026 tax rules, rent from HUD Fair Market Rents, local pay from BLS, surprise bills, credit cards, roommates and a year-end report card. Grades 9-12 personal finance. Works offline.">
<!--
FIRST APARTMENT BUDGET (Curio Class)
Grades 9-12 personal finance, National Standards for Personal Financial Education: Spending and Saving
(budgeting, needs and wants, paychecks and taxes), Managing Credit, Managing Risk (insurance, emergency funds).
A year-long simulation. Plan: choose a city, a starting job, a home, transportation and benefits; the paycheck and
monthly budget update live against the 30 percent housing guideline and the 50/30/20 rule. Live the year: twelve
months play out day by day with paydays every other Friday, bills on their due dates and surprise events that ask
for decisions (pay from checking, savings or a credit card). Report: a graded year-end review and a flow diagram
of where every dollar went. Class codes let a whole class play the same year of surprises.
Data:
- Rents: HUD Fair Market Rents, FY2026 (40th-percentile gross rent, which includes utilities; we split out an
  estimated utility bill).
- Starting pay: BLS Occupational Employment and Wage Statistics, May 2025, the 25th-percentile annual wage for each
  job in each metro area (our stand-in for starting pay). Denver's electrician-helper figure was suppressed by BLS
  and is estimated from the national figure.
- Federal income tax: 2026 brackets and $16,100 standard deduction (IRS Rev. Proc. 2025-32). FICA 7.65 percent.
  State and local income taxes are simplified approximations, described in the teacher notes.
- Food: USDA Food Plans (2025), average of the female and male 19-50 costs, plus 20 percent for a one-person home.
- Health premium: KFF 2025 Employer Health Benefits Survey, average worker contribution for single coverage
  ($1,440 a year).
- Credit card APR about 24 percent, near the Federal Reserve G.19 average of about 22 percent for accounts that
  carry a balance (2026), a little higher for a first card.
- Student loans at 6.39 percent (federal undergraduate rate for 2025-26), 10-year standard plan, 6-month grace.
Other prices (transit passes, car insurance for a young driver, phone plans) are rounded typical figures.
Educational simulation only, not financial advice.
One file, no network requests. Illustrations generated with Google Gemini, edited for Curio Class.
Content CC BY 4.0, code MIT. curioclass.org
-->

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PL = "json:places";
  const ART = {house: 'art:home-house', share: 'art:home-share', studio: 'art:home-studio', onebed: 'art:home-onebed', luxe: 'art:home-luxe',
               bike: 'art:ride-bike', transit: 'art:ride-bus', oldcar: 'art:ride-oldcar', newcar: 'art:ride-newcar'};
  const money = (n, cents) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0});
  const r2 = n => Math.round(n * 100) / 100;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  // ---------- the world ----------
  // State and local income tax, simplified. base: 'fed' = federal taxable income, 'w2' = wages after 401(k) and health,
  // 'nok' = wages after health only (Massachusetts taxes 401(k) money). sick: a state paid-sick-leave law.
  const CITY = {
    fortwayne: {tax: [{rate: .0454, base: 'w2', minus: 1000, n: 'Indiana + Allen County'}], transit: 40, transitMin: 55, ins: .85, climate: 'cold', sick: false, blurb: 'Low rents, lower pay, and you will want a car.'},
    columbus: {tax: [{rate: .0275, base: 'w2', minus: 26050, n: 'Ohio'}, {rate: .025, base: 'nok', minus: 0, n: 'Columbus city tax'}], transit: 62, transitMin: 45, ins: .85, climate: 'cold', sick: false, blurb: 'Affordable, growing, and it has a city income tax.'},
    houston: {tax: [], transit: 55, transitMin: 55, ins: 1.2, climate: 'hot', sick: false, blurb: 'No state income tax, huge and spread out.'},
    phoenix: {tax: [{rate: .025, base: 'w2', minus: 16100, n: 'Arizona'}], transit: 64, transitMin: 50, ins: 1.05, climate: 'hot', sick: true, blurb: 'Sunny, sprawling, and summer power bills bite.'},
    denver: {tax: [{rate: .044, base: 'fed', minus: 0, n: 'Colorado'}, {flat: 69, n: 'Denver head tax'}], transit: 88, transitMin: 40, ins: 1.15, climate: 'cold', sick: true, blurb: 'Mountains, good pay, high rents.'},
    boston: {tax: [{rate: .05, base: 'nok', minus: 4400, n: 'Massachusetts'}], transit: 90, transitMin: 30, ins: 1.0, climate: 'cold', sick: true, blurb: 'Great transit, very high rents.'},
    seattle: {tax: [], transit: 108, transitMin: 35, ins: 1.0, climate: 'mild', sick: true, blurb: 'No state income tax, top pay, steep rents.'},
  };
  // Starting-job details. loan: student loan balance; school: what it took; match: 401(k) match up to this percent.
  const JOB = {
    retail: {n: 'Retail sales associate', em: '🛍️', school: 'High school diploma', start: 18, hourly: true, cut: true, sickPay: false, match: 0, health: 'yes', cash: 1500},
    cook: {n: 'Restaurant line cook', em: '🍳', school: 'High school diploma', start: 18, hourly: true, cut: true, sickPay: false, match: 0, health: 'no', cash: 1200},
    warehouse: {n: 'Warehouse associate', em: '📦', school: 'High school diploma', start: 18, hourly: true, cut: false, sickPay: false, match: 3, health: 'yes', cash: 1500},
    service: {n: 'Customer service rep', em: '🎧', school: 'High school diploma', start: 18, hourly: true, cut: true, sickPay: false, match: 3, health: 'yes', cash: 1500},
    pharmtech: {n: 'Pharmacy technician', em: '💊', school: 'Certificate, about 6 months', start: 19, hourly: true, cut: false, sickPay: false, match: 4, health: 'yes', loan: 3000, cash: 1200},
    medassist: {n: 'Medical assistant', em: '🩺', school: 'Certificate, about 1 year', start: 19, hourly: true, cut: false, sickPay: false, match: 3, health: 'yes', loan: 5000, cash: 1200},
    electrician: {n: 'Electrician apprentice', em: '💡', school: 'Paid apprenticeship (you earn while you learn)', start: 18, hourly: true, cut: false, sickPay: false, match: 0, health: 'yes', cash: 1500, raise: 8},
    hvac: {n: 'HVAC technician', em: '❄️', school: 'Certificate, about 1 year', start: 19, hourly: true, cut: false, sickPay: false, match: 3, health: 'yes', loan: 8000, cash: 1200},
    nurse: {n: 'Registered nurse', em: '🏥', school: '4-year nursing degree', start: 22, hourly: true, cut: false, sickPay: true, match: 4, health: 'yes', loan: 27000, cash: 2000},
    accountant: {n: 'Staff accountant', em: '🧾', school: '4-year degree in accounting', start: 22, hourly: false, cut: false, sickPay: true, match: 5, health: 'yes', loan: 29000, cash: 2000},
    webdev: {n: 'Junior web developer', em: '💻', school: '4-year degree or bootcamp', start: 22, hourly: false, cut: false, sickPay: true, match: 4, health: 'yes', loan: 29000, cash: 2000},
  };

  function startYear() {

  function netWorth() { const fam = G.recurring.filter(x => x.n === 'Paying back family').reduce((a, x) => a + x.amt * x.left, 0); return G.chk + G.sav + G.k401 + G.deposit + G.carValue - G.card - G.loanBal - G.carLoan - fam; }
  const essentials = () => { const b = budget(); return b.lines.housing + b.lines.utilities + FOOD[S.food][1] + b.lines.transport + 15 + b.lines.insurance + b.lines.loans + STUFF * .6; };

  // ----- money movement (all go through here so overdrafts, card limits and category totals stay right) -----
  function post(label, amt, cat, acct = 'chk', silent) {
    // amt < 0 is money out
    const tx = {d: G.day, label, amt: r2(amt), cat, acct};
    if (acct === 'card') {
      if (amt < 0 && G.card - amt > CARD_LIMIT) {  // over the limit: the rest comes from checking
        const room = Math.max(0, CARD_LIMIT - G.card);

        return post(label + ' (card full)', amt + room, cat, 'chk', silent);
      }
      G.card = r2(G.card - amt);
    } else if (acct === 'sav') G.sav = r2(G.sav + amt);

  // ----- build a month's schedule -----
  function schedule(m) {

  // ----- run a month day by day -----

    for (let d = 1; d <= DAYS[m]; d++) {

      for (const e of evs.filter(e => e.d === d)) e.fn();
      while (pending.length) { const e = pending.shift(); updateHUD(); await showEvent(e); }

      G.savInt = (G.savInt || 0) + G.sav * HYSA / 365;
      updateHUD(); drawCal();

    G.hist.push({m, chk: G.chk, sav: G.sav, card: G.card, nw: netWorth(), well: G.well, score: G.score, k401: G.k401});
    G.monthLog.push({m, cats: G.mcats, pay: G.mgross, tax: G.mtax, k: G.mk, prem: G.mprem, chk: G.chk - start.chk});
    if (G.chk < -300) { G.crises++; G.day = DAYS[m]; await showEvent(CRISIS); G.hist[G.hist.length - 1].chk = G.chk; G.hist[G.hist.length - 1].nw = netWorth(); }

  function drawLive() {
    const v = $('v-live');
    if (!G) { v.innerHTML = ''; return; }
    const m = Math.min(G.month, 11);
    v.innerHTML = `<div class="hud" id="hud"></div>
      <div class="live"><div>
        <div class="stage">
          <div class="month-label">${G.month >= 12 ? 'Year complete' : `Month ${G.month + 1}: ${MONTHS[m]}`}<small>${PL.cities.find(c => c.id === S.city).name} · ${JOB[S.job].n} · ${HOME[S.home].n}</small></div>
          <div class="cal" id="cal"></div>
          <img class="home" src="${ART[S.home]}" alt="${HOME[S.home].n}">
          <img class="ride" src="${ART[S.ride]}" alt="${RIDE[S.ride].n}">
          <div class="floats" id="floats" aria-hidden="true"></div>
        </div>
        <div class="chart"><h2 class="sec" style="margin:4px 4px 0">Your year so far</h2><svg id="yr" viewBox="0 0 600 150" preserveAspectRatio="none" role="img" aria-label="Checking, savings and card balances by month"></svg>
          <div class="legend" style="padding:0 4px"><span style="--c:var(--navy)">Checking</span><span style="--c:var(--good)">Savings</span><span style="--c:var(--bad)">Card balance</span><span style="--c:var(--gold)">Net worth</span></div></div>
      </div>
      <div class="panel">
        <div class="box">
          ${G.month < 12 ? `<button class="go" id="play"${running ? ' disabled' : ''}>${running ? `Living ${MONTHS[m]}...` : `Live ${MONTHS[m]} ▶`}</button>
          <div class="speed" role="group" aria-label="Speed" style="margin-top:8px">${[[1, 'Normal'], [3, 'Fast'], [9, 'Instant']].map(([x, n]) => `<button data-s="${x}" aria-pressed="${speed === x}">${n}</button>`).join('')}</div>` : `<button class="go" id="torep">See the report ▶</button>`}
        </div>
        <div class="box"><h2 class="sec">This month's choices</h2>${lifestyleHTML(true)}</div>
        <div class="box"><h2 class="sec">Ledger</h2><div class="ledger" id="ledger"></div></div>
      </div></div>`;
    $('play') && ($('play').onclick = playMonth);
    $('torep') && ($('torep').onclick = () => setView('rep'));
    v.querySelectorAll('.speed button').forEach(b => b.onclick = () => { speed = +b.dataset.s; v.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    wireControls(v.querySelector('.panel'), full => { if (full) drawLive(); else refreshOutputs(v); });
    if (running) v.querySelectorAll('.panel [data-k]').forEach(el => el.disabled = true);
    updateHUD(); drawCal(); drawYear();
  }
  function updateHUD() {
    const h = $('hud'); if (!h || !G) return;
    const nw = netWorth(), wc = G.well >= 60 ? 'var(--good)' : G.well >= 40 ? 'var(--warn)' : 'var(--bad)';
    h.innerHTML = `<div><span>Checking</span><b class="${G.chk < 0 ? 'neg' : ''}">${money(Math.round(G.chk))}</b><small>day-to-day money</small></div>
      <div><span>Savings</span><b class="pos">${money(Math.round(G.sav))}</b><small>${(G.sav / essentials()).toFixed(1)} months of needs</small></div>
      <div><span>Credit card</span><b class="${G.card > 0 ? 'neg' : ''}">${money(Math.round(G.card))}</b><small>${Math.round(G.card / CARD_LIMIT * 100)}% of limit</small></div>
      <div><span>Credit score</span><b>${G.score}</b><small>${G.score >= 700 ? 'good' : G.score >= 640 ? 'fair' : 'poor'}</small></div>
      <div><span>Wellbeing</span><b>${G.well}</b><div class="wb"><i style="width:${G.well}%;background:${wc}"></i></div></div>
      <div><span>Net worth</span><b class="${nw >= 0 ? 'pos' : 'neg'}">${money(Math.round(nw))}</b><small>401(k) ${money(Math.round(G.k401))}</small></div>`;
    const lg = $('ledger');
    if (lg) lg.innerHTML = `<table>${G.ledger.slice(-60).reverse().map(t => `<tr><td>${t.d ? (MONTHS[Math.min(G.month, 11)].slice(0, 3) + ' ' + t.d) : ''}</td><td>${t.label}${t.acct === 'card' ? ' 💳' : t.acct === 'sav' ? ' 🏦' : ''}</td><td class="${t.amt > 0 ? 'pos' : ''}">${t.amt > 0 ? '+' : ''}${money(t.amt, true)}</td></tr>`).join('')}</table>`;
  }
  function drawCal() {
    const c = $('cal'); if (!c || !G || G.month >= 12) { if (c) c.hidden = true; return; }
    const m = G.month, off = FIRSTDOW[m];
    let h = '';
    for (let i = 0; i < off; i++) h += '<i></i>';
    for (let d = 1; d <= DAYS[m]; d++) h += `<i class="${d < G.day ? 'past' : d === G.day && running ? 'now' : ''}${PAYDAYS[m].includes(d) ? ' pay' : ''}">${d}</i>`;
    c.innerHTML = `<div class="mh"><span>${MONTHS[m]}</span><span>${PAYDAYS[m].length} paydays</span></div><div class="days">${'SMTWTFS'.split('').map(x => `<i style="color:#bbb">${x}</i>`).join('')}${h}</div>`;
  }
  function drawYear() {
    const svg = $('yr'); if (!svg || !G) return;
    const pts = [{chk: G.chk, sav: G.sav, card: G.card, nw: netWorth()}];
    const H = G.hist.length ? [{chk: startCash(), sav: 0, card: 0, nw: G.startNW}, ...G.hist] : [{chk: startCash(), sav: 0, card: 0, nw: G.startNW}];
    const all = H.flatMap(h => [h.chk, h.sav, h.card, h.nw]);
    const lo = Math.min(0, ...all), hi = Math.max(1000, ...all);
    const x = i => 20 + i / 12 * 570, y = v => 135 - (v - lo) / (hi - lo) * 120;
    const line = (k, col) => `<polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${H.map((h, i) => `${x(i)},${y(h[k])}`).join(' ')}"/>`;
    let g = `<line x1="20" x2="590" y1="${y(0)}" y2="${y(0)}" stroke="#d8cdb9"/>`;
    for (let i = 0; i <= 12; i++) g += `<text x="${x(i)}" y="148" text-anchor="middle" style="font:600 9px 'Segoe UI';fill:#9a9284">${i ? MONTHS[i - 1].slice(0, 1) : ''}</text>`;
    g += `<text x="22" y="${y(0) - 3}" style="font:600 9px 'Segoe UI';fill:#9a9284">$0</text><text x="22" y="20" style="font:600 9px 'Segoe UI';fill:#9a9284">${money(Math.round(hi))}</text>`;
    g += line('nw', 'var(--gold)') + line('card', 'var(--bad)') + line('sav', 'var(--good)') + line('chk', 'var(--navy)');
    svg.innerHTML = g;
  }

  // ================= REPORT =================
  function grades() {
    const ess = essentials(), months = Math.max(0, G.chk + G.sav) / ess, J = JOB[S.job];
    const take = G.monthLog.reduce((a, l) => a + l.pay - l.tax - l.k - l.prem, 0);
    const dnw = netWorth() - G.startNW;
    const avgW = G.wellHist.reduce((a, b) => a + b, 0) / G.wellHist.length;
    const matchShare = J.match ? clamp(G.match / Math.max(1, G.match + G.missedMatch), 0, 1) : 1;
    const R = [
      ['Safety net', 25, clamp(months / 3, 0, 1) * 25, `${months.toFixed(1)} months of needs in checking and savings (goal: 3)`],
      ['Debt and fees', 20, clamp(20 - G.card / 75 - Math.min(8, G.overdrafts * 2) - G.lates * 5 - (G.flags.collections ? 8 : 0) - G.crises * 3, 0, 20), `Card ${money(Math.round(G.card))} · ${G.overdrafts} overdrafts · ${G.lates} late payments${G.crises ? ` · ${G.crises} money crises` : ''}`],
      ['Future you', 15, matchShare * 10 + (G.score >= 700 ? 5 : G.score >= 660 ? 3 : 0), `${J.match ? Math.round(matchShare * 100) + '% of the 401(k) match' : 'No match offered'} · credit ${G.score}`],
      ['Growth', 15, clamp(dnw / Math.max(1, take) / .3, 0, 1) * 15, `Net worth ${dnw >= 0 ? 'up' : 'down'} ${money(Math.round(Math.abs(dnw)))} (${Math.round(dnw / Math.max(1, take) * 100)}% of take-home)`],
      ['Life', 25, clamp((avgW - 30) / 40, 0, 1) * 25, `Average wellbeing ${Math.round(avgW)}`],
    ];
    const total = Math.round(R.reduce((a, r) => a + r[2], 0));
    const letter = total >= 93 ? 'A' : total >= 90 ? 'A-' : total >= 87 ? 'B+' : total >= 83 ? 'B' : total >= 80 ? 'B-' : total >= 77 ? 'C+' : total >= 73 ? 'C' : total >= 70 ? 'C-' : total >= 60 ? 'D' : 'F';
    const goalOK = {
      fund1: months >= 1, fund3: months >= 3, nocard: G.card < 1, well50: avgW >= 50, well55: avgW >= 55, well60: avgW >= 60, nood: G.overdrafts === 0, nolate: G.lates === 0,
      sav500: G.sav >= 500, sav15k: G.sav >= 15000, nwup: dnw > 0, nw2k: dnw >= 2000, match: matchShare >= .999,
    };
    return {R, total, letter, take, dnw, avgW, goalOK};
  }
  function saveBest() {
    try {
      const g = grades(), key = 'first-apartment-best', all = JSON.parse(localStorage.getItem(key) || '{}'), k = S.challenge;
      if (!all[k] || g.total > all[k].total) all[k] = {total: g.total, letter: g.letter, city: S.city, job: S.job, home: S.home, seed: G.seed};
      localStorage.setItem(key, JSON.stringify(all));
    } catch {}
  }
  function drawRep() {
    const v = $('v-rep');
    if (!G || G.month < 12) { v.innerHTML = '<div class="box">Finish all twelve months to see your report.</div>'; return; }
    const g = grades(), ch = CH[G.plan.challenge];
    let best = {}; try { best = JSON.parse(localStorage.getItem('first-apartment-best') || '{}'); } catch {}
    v.innerHTML = `<div class="rep"><div class="box">
        <h2 class="sec">Year-end report · ${ch.em} ${ch.n}</h2>
        <div style="display:flex;align-items:center;gap:16px"><div class="grade">${g.letter}</div><div><b style="font-size:28px">${g.total}</b><span class="note"> / 100</span><p class="note">${PL.cities.find(c => c.id === S.city).name} · ${JOB[S.job].n}<br>${HOME[S.home].n} · ${RIDE[S.ride].n}<br>Class code <b>${G.seed}</b></p></div></div>
        <div class="rub">${g.R.map(([n, mx, x, sub]) => `<div><b>${n}</b><span class="money">${Math.round(x)} / ${mx}</span><i><b style="width:${x / mx * 100}%"></b></i><small>${sub}</small></div>`).join('')}</div>
        <h2 class="sec" style="margin-top:14px">Challenge goals</h2>
        <div class="goals">${ch.goals.map(([k, n]) => `<div><b>${g.goalOK[k] ? '✅' : '❌'}</b>${n}</div>`).join('')}</div>
        <div style="display:grid;gap:8px;margin-top:14px"><button class="go" id="again">↺ Replay the same year</button><button class="ghost" id="newplan">Change my plan</button></div>
        ${Object.keys(best).length ? `<h2 class="sec" style="margin-top:14px">Best on this device</h2><div class="best">${Object.entries(best).map(([k, b]) => `<div>${CH[k].em} ${CH[k].n}: <b>${b.letter} (${b.total})</b> <span class="note">${PL.cities.find(c => c.id === b.city).name}, ${JOB[b.job].n}</span></div>`).join('')}</div>` : ''}
      </div>
      <div style="display:grid;gap:14px">
        <div class="box sankey"><h2 class="sec">Where every dollar went this year</h2>${sankey()}</div>
        <div class="box"><h2 class="sec">The year in numbers</h2><div class="sumgrid" style="grid-template-columns:repeat(4,1fr)">
          <div><span>Earned (gross)</span><b>${money(Math.round(G.monthLog.reduce((a, l) => a + l.pay, 0)))}</b></div>
          <div><span>Taxes</span><b>${money(Math.round(G.monthLog.reduce((a, l) => a + l.tax, 0)))}</b></div>
          <div><span>Interest and fees</span><b class="${G.interest + G.fees > 0 ? 'neg' : ''}">${money(Math.round(G.interest + G.fees))}</b></div>
          <div><span>Net worth change</span><b class="${g.dnw >= 0 ? 'pos' : 'neg'}">${g.dnw >= 0 ? '+' : ''}${money(Math.round(g.dnw))}</b></div>
          <div><span>Savings</span><b>${money(Math.round(G.sav))}</b></div>
          <div><span>401(k)</span><b>${money(Math.round(G.k401))}</b></div>
          <div><span>Card balance</span><b>${money(Math.round(G.card))}</b></div>
          <div><span>Credit score</span><b>${G.score}</b></div></div>
          <p class="note">Net worth counts checking, savings, your 401(k), the security deposit you should get back and your car's value, minus the card, student loans and car loan. Missed 401(k) match this year: <b>${money(Math.round(G.missedMatch))}</b>.</p></div>
        <div class="box"><h2 class="sec">Think about it</h2><ul style="margin:4px 0 0;padding-left:20px;line-height:1.5;font-size:15px">${reflect(g).map(x => `<li>${x}</li>`).join('')}</ul></div>
      </div></div>`;
    $('again').onclick = () => { S.seed = G.seed; savePlan(); startYear(); };
    $('newplan').onclick = () => setView('plan');
  }
  function reflect(g) {
    const out = [], b = budget({gross: G.gross});
    const housing = b.h.gross / (G.gross / 12);
    out.push(`Housing took ${Math.round(housing * 100)}% of your gross pay. ${housing > .3 ? 'What would a roommate or a smaller place have changed?' : 'You stayed under the 30% guideline. What did that make possible?'}`);
    if (G.interest + G.fees > 0) out.push(`You paid ${money(Math.round(G.interest + G.fees))} in interest and fees, money that bought nothing. Which decision caused most of it?`);
    if (G.missedMatch > 1) out.push(`You left ${money(Math.round(G.missedMatch))} of free 401(k) match unclaimed. At 7% a year, that grows to about ${money(Math.round(G.missedMatch * 1.07 ** 45))} by age 65.`);
    if (g.avgW < 50) out.push('Your wellbeing averaged under 50. Was the money you saved worth how the year felt?');
    if (g.avgW >= 65 && g.total < 75) out.push('You had a good year emotionally but finished thin on savings. What is one want you could trim without missing it?');
    out.push('Replay with the same class code and change one thing. Which single change raised your score the most?');
    return out;
  }
  function sankey() {
    // two stages: gross pay splits into taxes, benefits and take-home; take-home splits into spending and saving
    const L = G.monthLog, sum = f => L.reduce((a, l) => a + f(l), 0);
    const gross = sum(l => l.pay), tax = sum(l => l.tax), k = sum(l => l.k), prem = sum(l => l.prem);
    const cats = {}; L.forEach(l => Object.entries(l.cats).forEach(([c, v]) => { if (!['income', 'transfer'].includes(c)) cats[c] = (cats[c] || 0) + v; }));
    const extra = G.ledger.filter(t => t.cat === 'income' && t.label !== 'Paycheck' && t.amt > 0 && t.acct === 'chk').reduce((a, t) => a + t.amt, 0);
    const take = gross - tax - k - prem + extra;
    const spent = Object.values(cats).reduce((a, b) => a + b, 0);
    const kept = take - spent;
    const left = [['Taxes', tax, 'tax'], ['401(k)', k, 'save'], ['Health plan', prem, 'health'], ['Take-home', take, 'navy']];
    const right = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, v]) => [CATN[c] || c, v, CATC[c] || 'other']);
    if (kept > 0) right.push(['Saved or kept', kept, 'save']);
    const W = 760, Hh = 400, total = Math.max(gross + extra, spent), sc = (Hh - 20 - right.length * 4) / Math.max(total, 1);
    const colr = c => c === 'navy' ? 'var(--navy)' : `var(--c-${c})`;
    let g = '', y0 = 10;
    // source bar
    g += `<rect x="10" y="10" width="16" height="${(gross + extra) * sc}" fill="var(--navy)" rx="3"/><text x="32" y="22">${extra ? 'Pay and other income' : 'Pay'} ${money(Math.round(gross + extra))}</text>`;
    // stage 1 bars
    let ys = 10, yl = 10; const x1 = 250;
    const mid = {};
    for (const [n, v, c] of left) {
      const h = v * sc; if (h <= 0) continue;
      g += `<path d="M26 ${ys} C140 ${ys} 140 ${yl} ${x1} ${yl} L${x1} ${yl + h} C140 ${yl + h} 140 ${ys + h} 26 ${ys + h}Z" fill="${colr(c)}" opacity=".28"/>`;
      g += `<rect x="${x1}" y="${yl}" width="16" height="${h}" fill="${colr(c)}" rx="3"/>`;
      if (n !== 'Take-home') g += `<text x="${x1 - 6}" y="${yl + Math.min(h / 2 + 4, h + 12)}" text-anchor="end">${n} ${money(Math.round(v))}</text>`;
      else { g += `<text x="${x1 + 22}" y="${yl + 14}">Take-home ${money(Math.round(v))}</text>`; mid.y = yl; mid.h = h; }
      ys += h; yl += h + 6;
    }
    // stage 2 from take-home
    let yt = mid.y, yr = 10; const x2 = 560;
    for (const [n, v, c] of right) {
      const h = Math.max(1, v * sc);
      g += `<path d="M${x1 + 16} ${yt} C${x1 + 160} ${yt} ${x1 + 160} ${yr} ${x2} ${yr} L${x2} ${yr + h} C${x1 + 160} ${yr + h} ${x1 + 160} ${yt + h} ${x1 + 16} ${yt + h}Z" fill="${colr(c)}" opacity=".3"/>`;
      g += `<rect x="${x2}" y="${yr}" width="14" height="${h}" fill="${colr(c)}" rx="3"/><text x="${x2 + 20}" y="${yr + Math.min(h / 2 + 4, 12)}">${n} ${money(Math.round(v))}</text>`;
      yt += h; yr += Math.max(h, 12) + 4;  // small slices get room for their labels
    }
    return `<svg viewBox="0 0 ${W} ${Math.max(Hh, yr + 10, yl + 10)}" role="img" aria-label="Flow of the year's pay into taxes, benefits and spending">${g}</svg>
      <p class="note">${kept < 0 ? `You spent ${money(Math.round(-kept))} more than you took home; the gap came from savings you started with or the credit card.` : ''} Spending on the card counts when you spent it, not when you paid the card.</p>`;
  }

  // keyboard: Space plays the next month
  document.addEventListener('keydown', e => {
    if (view === 'live' && e.key === ' ' && $('sheet').hidden && !running && G && G.month < 12 && !/INPUT|BUTTON|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); playMonth(); }
  });

  window.__fab = {S, get G() { return G; }, startYear, playMonth, setView, budget, taxes, grades, setSpeed: x => speed = x, autoAnswer: () => { const b = document.querySelector('#modal .choice'); b && b.click(); const p = document.querySelector('#modal .payrow:not([hidden]) button:not(:disabled)'); p && p.click(); const n = $('mnext'); n && n.click(); }};
  setView('plan');
})();
</script>
</body>
