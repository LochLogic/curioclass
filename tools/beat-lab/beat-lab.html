BEAT LAB (Curio Class)
Music, grades 9-12, National Core Arts Standards MU:Cr1 (imagine), MU:Cr2 (plan and make), MU:Cr3 (evaluate,
refine and present), module "Composing and Producing".
A pattern-based studio in the spirit of the classic step-sequencer apps:
- Channel rack: eight synthesized drums and four synths. Click or drag across the 16 steps; right-click for a
  softer ghost note. Each channel has a sound, volume and pan.
- Piano roll: write notes for the bass, chords, lead and arp. Scale lock keeps every row in the chosen key, and
  chord stamp drops a whole chord in the key with one click. Twelve synth presets with filter and envelope knobs.
- Song: eight patterns (A to H) stack in a 16-bar playlist, so drums, bass and melody can be separate patterns.
- Mixer: faders, pan, reverb and delay sends, mute and solo, meters. Master: volume, a DJ filter sweep, and
  sidechain pump that ducks the synths on every kick.
- Swing, tap tempo, undo, live keyboard playing and recording, four demo tracks, nine producer missions.
- Saves on this device; projects export as .json and tracks render to a .wav file.
All sound is synthesized in the browser with the Web Audio API. One file, no network requests.

  <div class="scene" id="scene">
    <div class="transport" id="transport"></div>
    <aside class="side" id="side"></aside>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1600, r.height / 900)); };
  new ResizeObserver(fit).observe($('stagewrap'));
  Element.prototype.setPointerCapture = (orig => function (id) { try { orig.call(this, id); } catch {} })(Element.prototype.setPointerCapture);
  const scale = () => parseFloat(getComputedStyle($('scene')).getPropertyValue('--s')) || 1;

  // ================= the channels and sounds =================
  const CH = [
    {id: 'kick', name: 'Kick', type: 'drum', c: '#ff6b6b', vol: .85},

  function stop() {

  // the playhead follows the audio clock
  let lastPh = [-1, -1];

    if (A && seq.playing) {

  // ================= knobs =================
  const KN = {};
  let knobN = 0;
  function arc(v, r = 15, cx = 18, cy = 18) {
    const a0 = -225 * Math.PI / 180, a1 = a0 + v * 270 * Math.PI / 180;
    const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${v * 270 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  // knob(label, get, set, opts): a value from 0 to 1. Drag up or down, scroll, use the arrow keys; double-click resets.
  function knob(label, get, set, {def = .5, fmt = v => Math.round(v * 100) + '%', color = 'var(--accent)', size = '', hint = '', center = false} = {}) {
    const id = 'k' + (knobN++);
    KN[id] = {get, set, def, fmt, color, label, hint, center};
    return `<div class="knob ${size}" data-knob="${id}" tabindex="0" role="slider" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" data-hint="${label}: ${hint} Drag up or down. Double-click resets.">${knobSVG(id)}<span>${label}</span></div>`;
  }
  function knobSVG(id) {
    const k = KN[id], v = clamp(k.get(), 0, 1), ang = (-225 + v * 270) * Math.PI / 180;
    let val = `<path class="v" d="${arc(v)}" stroke="${k.color}"/>`;
    if (k.center) {  // bipolar knobs light from the top centre outward
      const a = Math.min(v, .5), b = Math.max(v, .5);
      val = Math.abs(v - .5) < .01 ? '' : `<path class="v" d="${arcBetween(a, b)}" stroke="${k.color}"/>`;
    }
    return `<svg viewBox="0 0 36 36"><path class="t" d="${arc(1)}"/>${val}<circle class="c" cx="18" cy="18" r="10.5"/><line class="p" x1="${18 + 4 * Math.cos(ang)}" y1="${18 + 4 * Math.sin(ang)}" x2="${18 + 9 * Math.cos(ang)}" y2="${18 + 9 * Math.sin(ang)}"/></svg>`;
  }
  function arcBetween(a, b) {
    const r = 15, p = v => { const t = (-225 + v * 270) * Math.PI / 180; return [18 + r * Math.cos(t), 18 + r * Math.sin(t)]; };
    const [x0, y0] = p(a), [x1, y1] = p(b);

  function wireKnobs(root) {
    root.querySelectorAll('[data-knob]').forEach(el => {
      const k = KN[el.dataset.knob];
      const redraw = () => { el.querySelector('svg').outerHTML = knobSVG(el.dataset.knob); el.setAttribute('aria-valuenow', Math.round(k.get() * 100)); hint(`<b>${k.label}</b> ${k.fmt(k.get())}`); };
      el.setAttribute('aria-valuenow', Math.round(k.get() * 100));

        el.onpointerup = () => { el.onpointermove = null; saveSoon(); };
      };
      el.ondblclick = () => { pushUndo(); setV(k.def); saveSoon(); };
      el.onwheel = e => { e.preventDefault(); setV(k.get() - Math.sign(e.deltaY) * .03); saveSoon(); };
      el.onkeydown = e => {

  // ================= transport =================

  function transport() {

      <div class="sep"></div>

        ${knob('Filter', () => P.master.filter, v => P.master.filter = v, {def: .5, center: true, color: 'var(--accent2)', fmt: v => v < .49 ? 'low-pass ' + pct(.5 - v) : v > .51 ? 'high-pass ' + pct(v - .5) : 'off', hint: 'a DJ filter. Left muffles the whole mix, right thins it out. Sweep it during a build-up.'})}

    $('m-song').onclick = () => { P.songMode = true; transport(); saveSoon(); if (!songLen()) toast('The song is empty. Open the Song view and click cells to place patterns.'); };
    const bpm = $('bpm');
    const setBpm = v => { P.bpm = clamp(Math.round(v), 50, 200); bpm.querySelector('b').textContent = P.bpm; bpm.setAttribute('aria-valuenow', P.bpm); applyAllAudio(); };
    bpm.onpointerdown = e => { e.preventDefault(); bpm.setPointerCapture?.(e.pointerId); pushUndo(); const y0 = e.clientY, b0 = P.bpm; bpm.onpointermove = m => setBpm(b0 + (y0 - m.clientY) / scale() / 3); bpm.onpointerup = () => { bpm.onpointermove = null; saveSoon(); }; };

  let taps = [];

  function drawViz() {
    const cv = $('viz'); if (!cv) return;

    g.clearRect(0, 0, W, H);
    if (!A || !A.an) { g.fillStyle = '#2a2f3a'; for (let i = 0; i < 40; i++) g.fillRect(4 + i * 12.3, H - 4, 9, 2); return; }
    const d = new Uint8Array(A.an.frequencyBinCount); A.an.getByteFrequencyData(d);
    const bars = 40;
    for (let i = 0; i < bars; i++) {

  // ================= sidebar =================

  function side() {

      <h2>Track</h2>

  $('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;

        const p = JSON.parse(t); if (!p.pats || !p.ch) throw 0;
        const data = p.sampleData || {}; delete p.sampleData;
        pushUndo(); stop(); P = fixProject(Object.assign(newProject(), p));
        Promise.all(Object.entries(data).map(([id, s]) => idbPut(id, unb64(s)))).then(loadSamples);
        applyAllAudio(); renderAll(); saveSoon(); toast(`Opened ${P.name}.`);

  };
  const fname = ext => (P.name || 'beat-lab').replace(/[^\w\- ]+/g, '').trim().replace(/ +/g, '-').toLowerCase() + ext;
  function download(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  async function saveFile() {
    const data = JSON.parse(snap()); data.sampleData = {};
    for (const sm of P.samples || []) { const b = await idbGet(sm.id); if (b) data.sampleData[sm.id] = b64(b); }
    download(new Blob([JSON.stringify(data)], {type: 'application/json'}), fname('.json'));

  }
  const b64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
  const unb64 = str => { const s = atob(str), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };

  // ---------- WAV export: the same engine, rendered offline ----------
  async function exportWav() {
    const song = P.songMode && songLen() > 0, bars = song ? songLen() : 4, steps = bars * 16, d = sd();
    const secs = steps * d + 3, rate = 44100;
    toast('Rendering your track...');
    const oc = new OfflineAudioContext(2, Math.ceil(secs * rate), rate), E = makeEngine(oc, false);
    for (let s = 0; s < steps; s++) scheduleStep(E, s, .05 + s * d, song);
    const buf = await oc.startRendering();
    download(wav(buf), fname('.wav'));
    P.exported = true; saveSoon();
    toast(`Exported ${bars} bar${bars > 1 ? 's' : ''} (${Math.round(secs)} seconds) as a WAV file.`);
  }
  function wav(buf) {
    const n = buf.length, ch = 2, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
    const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
    out.setUint16(22, ch, true); out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true);
    w(36, 'data'); out.setUint32(40, n * ch * 2, true);
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    for (let i = 0, o = 44; i < n; i++) for (const s of [L[i], R[i]]) { out.setInt16(o, clamp(s, -1, 1) * 32767, true); o += 2; }
    return new Blob([out], {type: 'audio/wav'});
  }

  // ---------- your own samples: kept in this browser's IndexedDB, decoded once ----------
  const SAMPLE_BUF = {};
  const idb = () => new Promise((ok, no) => {
    const r = indexedDB.open('beat-lab', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('samples');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
  async function idbDo(mode, fn) {
    const db = await idb();
    return new Promise((ok, no) => { const tx = db.transaction('samples', mode), st = tx.objectStore('samples'), q = fn(st); tx.oncomplete = () => ok(q && q.result); tx.onerror = () => no(tx.error); });
  }
  const idbPut = (id, bytes) => idbDo('readwrite', st => st.put(bytes, id)).catch(() => {});
  const idbGet = id => idbDo('readonly', st => st.get(id)).catch(() => null);
  const idbDel = id => idbDo('readwrite', st => st.delete(id)).catch(() => {});
  const decoder = () => new OfflineAudioContext(2, 1, 44100);
  async function loadSamples() {
    for (const sm of P.samples || []) {
      if (SAMPLE_BUF[sm.id]) continue;
      const bytes = await idbGet(sm.id);
      if (bytes) try { SAMPLE_BUF[sm.id] = await decoder().decodeAudioData(bytes.slice(0)); } catch {}
    }
    if (ui.view === 'snd') renderView();
  }
  // trim silence at the start, keep at most 12 seconds, and store it as a WAV
  async function addSample(bytes, name) {
    let buf;
    try { buf = await decoder().decodeAudioData(bytes); } catch { toast('That file could not be read as audio. Try a WAV or MP3.'); return null; }
    const d0 = buf.getChannelData(0); let start = 0;
    while (start < d0.length && Math.abs(d0[start]) < .02) start++;
    start = Math.max(0, start - Math.floor(buf.sampleRate * .005));
    const len = Math.min(buf.length - start, buf.sampleRate * 12);
    if (len < buf.sampleRate * .02) { toast('That recording is silent. Try again a little closer to the microphone.'); return null; }
    const oc = new OfflineAudioContext(2, len, buf.sampleRate), src = oc.createBufferSource();
    src.buffer = buf; src.connect(oc.destination); src.start(0, start / buf.sampleRate);
    const out = await oc.startRendering();
    const wavBytes = await wav(out).arrayBuffer();
    const id = 's' + Date.now().toString(36) + Math.floor(Math.random() * 1e4);
    await idbPut(id, wavBytes);
    SAMPLE_BUF[id] = out;
    pushUndo();
    (P.samples = P.samples || []).push({id, name: name.slice(0, 28), dur: +out.duration.toFixed(2)});
    saveSoon();
    return id;
  }
  async function importFiles(files) {
    let last = null;
    for (const f of files) {
      if (f.size > 30e6) { toast(`${f.name} is too big (over 30 MB).`); continue; }
      last = await addSample(await f.arrayBuffer(), f.name.replace(/\.[^.]+$/, '')) || last;
    }
    if (last) { sb.cat = 'Your samples'; renderView(); toast('Added to Your samples. Press Use to put it on a channel.'); }
  }
  let rec = null;
  async function micRecord() {
    if (rec) { rec.stop(); return; }
    let stream;

    const chunks = [], mr = new MediaRecorder(stream);
    rec = mr; renderView();
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); clearTimeout(mr.cap); rec = null;
      const n = (P.samples || []).filter(s => s.name.startsWith('Mic take')).length + 1;
      const id = await addSample(await new Blob(chunks).arrayBuffer(), 'Mic take ' + n);
      sb.cat = 'Your samples'; renderView();
      if (id) { toast(`Recorded Mic take ${n}.`); hit(audio(), 'user:' + id, A.c.currentTime + .02, 1, 1, A.drums, 1); }
    };
    mr.start(); mr.cap = setTimeout(() => mr.state === 'recording' && mr.stop(), 10000);

  }
  function deleteSample(id) {
    pushUndo();
    P.samples = P.samples.filter(s => s.id !== id);
    P.ch.forEach((s, i) => { if (s.sound === 'user:' + id) s.sound = DEFAULT_SOUND[CH[i].id]; if (s.sample === id) { s.sample = null; s.preset = CH[i].preset; } });
    idbDel(id); delete SAMPLE_BUF[id];

  const sampleName = id => ((P.samples || []).find(s => s.id === id) || {}).name || 'missing sample';

    for (let s = 1; s < 16; s++) h += `<div class="vl${s % 4 === 0 ? ' beat' : ''}" style="left:${s / 16 * 100}%"></div>`;
    let above = 0, below = 0;
    ns.forEach((n, k) => {
      let r = rowOf(n.n);
      if (r < 0) {  // out of view, or out of the scale while scale lock is on
        if (n.n > rows[rows.length - 1]) { above++; return; }
        if (n.n < rows[0]) { below++; return; }
        r = rows.findIndex(m => m > n.n) - .5;
      }
      const out = !sc.includes(((n.n - P.key) % 12 + 12) % 12);
      h += `<div class="note${out ? ' out' : ''}" data-k="${k}" style="left:calc(${n.s / 16 * 100}% + 1px);width:calc(${n.l / 16 * 100}% - 2px);top:${H - (r + 1) * rh + 1}px;height:${rh - 2}px">${rh > 16 ? nname(n.n) : ''}<div class="rs"></div></div>`;
    });
    if (above) h += `<div class="more" style="top:4px">▲ ${above} note${above > 1 ? 's' : ''} higher (Oct +)</div>`;
    if (below) h += `<div class="more" style="bottom:4px">▼ ${below} note${below > 1 ? 's' : ''} lower (Oct −)</div>`;
    h += '<div class="ph" id="rollph" hidden></div>';
    g.innerHTML = h;
    // add, move, resize and delete notes
    g.oncontextmenu = e => e.preventDefault();
    g.onpointerdown = e => {
      e.preventDefault();
      const r = g.getBoundingClientRect(), k = scale();
      const pos = ev => ({s: clamp(Math.floor((ev.clientX - r.left) / r.width * 16), 0, 15), row: clamp(Math.floor((r.bottom - ev.clientY) / r.height * rows.length), 0, rows.length - 1)});
      const noteEl = e.target.closest('.note'), arr = notesOf(pat(), ch.id);
      pushUndo();
      if (noteEl) {
        const n = arr[+noteEl.dataset.k];
        if (e.button === 2) { arr.splice(+noteEl.dataset.k, 1); drawGrid(); side(); saveSoon(); return; }
        const resize = e.target.classList.contains('rs'), p0 = pos(e), s0 = n.s, l0 = n.l, r0 = rowOf(n.n);

            moved = true; n.s = clamp(s0 + p.s - p0.s, 0, 16 - n.l);
            if (r0 >= 0) { const nm = rows[clamp(r0 + p.row - p0.row, 0, rows.length - 1)]; if (nm !== n.n) { n.n = nm; previewNote(i, nm); } }
          }
          drawGridNotesOnly();
        };
        g.onpointerup = () => { g.onpointermove = g.onpointerup = null; if (!moved) { arr.splice(arr.indexOf(n), 1); } ui.len = n.l; drawGrid(); side(); saveSoon(); };
        return;
      }
      if (e.button === 2) return;
      const p = pos(e), m = rows[p.row];
      const add = ch.id === 'chords' && ui.stamp ? [0, 2, 4].map(d => { const ri = p.row + d; return ri < rows.length && ui.lock ? rows[ri] : stampNote(m, d); }) : [m];
      const made = [];
      add.forEach(nm => { if (nm != null && !arr.some(x => x.s === p.s && x.n === nm)) { const n = {s: p.s, l: Math.min(ui.len, 16 - p.s), n: nm, v: .9}; arr.push(n); made.push(n); } });
      audio(); add.forEach(nm => nm != null && previewNote(i, nm));
      drawGrid(); side(); saveSoon();
      // keep dragging to stretch the new note(s)
      if (!made.length) return;
      const s0 = p.s;
      g.setPointerCapture?.(e.pointerId);
      g.onpointermove = mv => { const q = pos(mv); if (q.s >= s0) { made.forEach(n => n.l = q.s - s0 + 1); drawGridNotesOnly(); } };
      g.onpointerup = () => { g.onpointermove = g.onpointerup = null; ui.len = made[0].l; drawGrid(); saveSoon(); };
    };

  // a chord tone d scale steps above m, worked out from the scale (used when scale lock is off)

    const j = idx + d, oct = Math.floor(j / sc.length);

  }

  // ---------- song ----------

  function setCell(c, b, pi, on) {

  // ---------- mixer ----------
  function renderMix() {
    const strip = (i) => {

  }

  // ---------- playhead ----------

  // ---------- hints and messages ----------

  const IDLE = '<b>Beat Lab</b> · Space plays and stops · click or drag across steps, right-click for a soft ghost note · Ctrl+Z undoes · hover over anything to learn what it does';
  function wireHints(root) {

  let toastT;

  // ================= the computer keyboard =================
  const KEYS = 'awsedftgyhujkolp;';  // chromatic, like a piano: white keys on the home row
  const LOCKKEYS = 'asdfghjkl;';     // scale lock: the home row walks up the scale
  const held = {};
  document.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); play(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(!e.shiftKey); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); doUndo(false); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'z' || k === 'x') { ui.kbOct = clamp(ui.kbOct + (k === 'z' ? -1 : 1), -2, 2); toast(`Keyboard octave ${ui.kbOct >= 0 ? '+' : ''}${ui.kbOct}`); return; }
    const i = IDX[ui.sel], s = P.ch[i], base = 12 * (s.oct + 1 + ui.kbOct) + P.key;

    else { const j = KEYS.indexOf(k); if (j >= 0) m = base + j; }

  const stepPos = now => seq.step - (seq.next - now) / sd();  // where the playhead is, in steps

  // ================= missions =================
  const MISSIONS = [
    ['Press ▶ (or Space) to hear the beat. Then give the <b>Closed hat</b> a step on every eighth note: steps 1, 3, 5, 7...', () => { const a = pat().steps.hat || []; return [0, 2, 4, 6, 8, 10, 12, 14].every(s => a[s]); }],
    ['Add a <b>Snare</b> or <b>Clap</b> on beats 2 and 4: steps 5 and 13. That\'s the backbeat.', () => ['snare', 'clap'].some(id => { const a = pat().steps[id] || []; return a[4] && a[12]; })],
    ['Turn the <b>Swing</b> knob past 20% and hear the hats start to bounce.', () => P.swing > .2],

  // ================= demo tracks =================
  const S16 = str => [...str].map(c => c === 'x' ? 1 : c === 'o' ? .5 : 0);

  function mk(steps = {}, notes = {}) { const p = blankPattern(); for (const k in steps) p.steps[k] = S16(steps[k]); for (const k in notes) p.notes[k] = notes[k]; return p; }
  function loadDemo(k) {

      const drums = {kick: 'x...x...x...x...', clap: '....x.......x...', open: '..x...x...x...x.', perc: '.o.o.o.o.o.o.o.o'};

      p.pats[2] = mk({crash: 'x...............'});

    }
    if (k === 2) {
      Object.assign(p, {name: 'Boom bap demo', bpm: 88, swing: .55, key: 2, scale: 'Minor'});
      set('kick', {sound: 'Boom Bap Kick'}); set('snare', {sound: 'Lo-fi Snare'}); set('hat', {sound: 'Dusty Hat'}); set('chords', {preset: 'Electric piano', cut: .4, rev: .3}); set('perc', {sound: 'Rim'});
      const drums = {kick: 'x......x.x......', snare: '....x.......x...', hat: 'x.o.x.o.x.o.x.ox', perc: '..........o.....'};
      const bass = N([[0, 3, 'D2'], [7, 2, 'D2'], [9, 3, 'F2']]);
      p.pats[0] = mk(drums, {bass, chords: [...CHD(0, 8, 'D3 F3 A3 C4 E4'), ...CHD(8, 8, 'G3 Bb3 D4 F4')]});
      p.pats[1] = mk(drums, {bass: N([[0, 3, 'Bb1'], [7, 2, 'Bb1'], [9, 3, 'A1']]), chords: [...CHD(0, 8, 'Bb2 D3 F3 A3'), ...CHD(8, 8, 'A2 C3 E3 G3')]});
