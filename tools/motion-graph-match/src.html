<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Graph Match · Drive the cart, read x, v and a · Curio Class</title>
<meta name="description" content="Drive a lab cart down a 10 m track by setting only its position, velocity or acceleration, and watch all three motion graphs draw at once. Read slopes and areas on your own run, then race a ghost of your best run on ten target graphs. Grade 11 physics. Works offline.">
<!--
Motion Graph Match (Curio Class)
Grade 11, physics, Motion and Kinematics. Standard: NGSS HS-PS2-1 (the net force readout F = m a ties the acceleration
graph to Newton's second law; the core of the tool is the kinematics the standard's data analysis rests on).
Students drive, alone or in pairs on laptops (also works on a projector with a student at the keyboard).
Explore: free drive with Hand (you set position), Throttle (you set velocity) or Pedal (you set acceleration); the
three graphs scroll like a strip chart (the last 12 s
stay in view) until you pause or clear. Show links reads slopes (x to v, v to a) and the area under v (change in x)
on a paused or finished run. Race: ten target graphs, matched inside a tolerance band, against a ghost of your best run.
Facts: OpenStax, University Physics Volume 1, chapter 3 (motion along a straight line) and section 5.3 (Newton's
second law); OpenStax, Physics (high school), chapter 2. Misconceptions targeted: McDermott, Rosenquist and van Zee,
Am. J. Phys. 55, 503 (1987); Beichner, Am. J. Phys. 62, 750 (1994). Target values are original, from the piecewise
definitions in spec.md (each one integrated and checked). Cart, track, sensor, graphs, thumbnails and arrows are drawn
in code. Background image: track-bench (no people).
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<link rel="stylesheet" href="kit:theme-912">
<style>
:root{--brand:#36c9dd;--brand-ink:#03191d;--you:#36c9dd;--tgt:#f2a93b;--tgt-band:rgba(242,169,59,.24);--ghost:#c9a0ff;
  --force:#ff8a8a;--halo:#0b1017;--neg:#ffb36b}
/* three page layouts, picked in script (relayout()):
   wide    (1000 px or wider and 700 px or taller): stage on the left, 360 px panel on the right;
   compact (a short landscape box such as the 16:10 embed, 680x425 to 1000x625): the same with a 290 px panel, a one-row
           header and the controls first in the panel, so they are visible without scrolling;
   stack   (narrow or portrait): the panel under the stage, the page scrolls.
   The stage SVG is drawn at its real pixel size (no scaling), so scene text keeps its size in every box. */
main{grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{min-height:0;background:radial-gradient(ellipse at 30% 20%,#121c2a,#0a0f17 72%)}
#sv{position:absolute;left:0;top:0;display:block;overflow:visible}
body.compact main{grid-template-columns:minmax(0,1fr) 290px}
@media (min-width:900px){body.compact main{grid-template-columns:minmax(0,1fr) 320px}}
body.compact header{padding:4px 8px;gap:4px;flex-wrap:nowrap;min-width:0}
body.compact h1{font-size:16px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.compact h1 small{display:none}
body.compact .seg{flex:none}
body.compact .seg button,body.compact .icon-btn{min-height:44px;padding:0 8px;font-size:13.5px;white-space:nowrap}
body.compact .icon-btn{flex:none}
body.compact .panel{padding:6px 8px;gap:6px}
body.compact .sec{padding:6px 8px}
body.compact .sec>h2{margin-bottom:4px;font-size:11px}
body.compact .hint{font-size:13.5px;line-height:1.35}
body.compact .btn{font-size:13.5px;padding:0 8px}
body.compact .p-ctl>h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.compact .vs{height:clamp(110px,calc(100vh - 300px),150px)}
body.compact .pk{min-height:44px}
body.compact .pk small{display:none}
body.compact .ctlgrid{grid-template-columns:118px 1fr}

/* compact: controls first (Explore: control, then the run buttons; Race: target and run buttons, results, control) */

body.compact[data-mode="race"] .p-race{order:0} body.compact[data-mode="race"] .p-res{order:0}
body.compact[data-mode="race"] .p-ctl{order:2} body.compact[data-mode="race"] .p-hint{order:3} body.compact .p-list{order:4}

  .seg{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;width:100%}

}

  border:2px solid var(--paper);box-shadow:0 0 0 1px var(--brand)}

  border-radius:999px;border:1px solid var(--neg);color:var(--neg);vertical-align:2px;margin-left:4px}

.cart{outline:none;cursor:grab}

<body>
<header>
  <h1>Motion Graph Match <small>Drive the cart, read x, v and a</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-explore" aria-pressed="true">Explore</button>
    <button id="m-race" aria-pressed="false">Race</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read" title="Read the hint aloud">🔊 Read</button>
</header>
<main>
  <div class="stage" id="stage">
    <svg id="sv" role="group" aria-label="The track and three motion graphs: position, velocity and acceleration against time"></svg>
  </div>
  <aside class="panel" id="panel">
    <p class="hint p-hint" id="hint"></p>
    <section class="sec p-race" data-modes="race" aria-label="Target and run">
      <p class="tname" id="tName"></p>
      <div class="btnrow">
        <button class="btn" id="start">▶ Start</button>
        <button class="btn" id="stop">■ Stop</button>
        <button class="btn" id="again">↺ Try again</button>
        <button class="btn" id="nextT">Next target ▶</button>
      </div>
      <p class="small" id="tNote"></p>
    </section>
    <section class="sec res p-res" id="res" hidden aria-label="Results">
      <h2>Results</h2>
      <dl class="readouts" id="resDl"></dl>
      <p class="rline" id="resLine"></p>
      <p class="small" id="kinkNote"></p>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn" id="all3" aria-pressed="false">Show all three</button>
        <button class="btn" id="replay">Replay</button>
        <button class="btn" id="again2">↺ Try again</button>
        <button class="btn" id="next2">Next target ▶</button>
      </div>
    </section>
    <section class="sec p-run" data-modes="explore" aria-label="Clock">
      <div class="btnrow">
        <button class="btn" id="go">▶ Go</button>

      <p class="small" id="runNote" aria-live="polite"></p>
    </section>
    <section class="sec p-ctl" aria-labelledby="ctlL">
      <h2 id="ctlL">Control</h2>
      <div class="ctlgrid">
        <div class="pick" role="group" aria-label="Control">
          <button class="btn pk" data-ctl="hand" aria-pressed="true"><span><span class="ico" aria-hidden="true">✋</span> Hand</span><small>you set position</small></button>
          <button class="btn pk" data-ctl="throttle" aria-pressed="false"><span>Throttle</span><small>you set velocity</small></button>
          <button class="btn pk" data-ctl="pedal" aria-pressed="false"><span>Pedal</span><small>you set acceleration</small></button>
        </div>
        <div class="surface" id="surface">
          <div id="sliderBox" hidden style="display:flex;flex-direction:column;align-items:center;gap:2px">
            <span class="vs-lab" id="vsLab">velocity</span>
            <div class="vs" id="vs" role="slider" tabindex="0" aria-orientation="vertical" aria-labelledby="vsLab">
              <div class="vs-track"></div><div class="vs-fill" id="vsFill"></div><div id="vsTicks"></div><div class="vs-thumb" id="vsThumb"></div>
            </div>
            <span class="vs-val" id="vsVal" aria-hidden="true">0 m/s</span>
            <label class="spring"><input type="checkbox" id="spring"> Spring back</label>
          </div>
          <p class="handnote" id="handNote">Drag the cart along the track. Or Tab to the cart and hold <kbd>←</kbd> or <kbd>→</kbd> (with <kbd>Shift</kbd> for slow).</p>
        </div>
      </div>
    </section>
    <section class="sec p-list" data-modes="race" aria-labelledby="listL">
      <h2 id="listL">Targets</h2>
      <div class="cards" id="cards"></div>
      <button class="linkbtn" id="forget">Forget my bests</button>
    </section>
  </aside>
</main>
<div class="sr" id="live" aria-live="polite"></div>
<script src="kit:curio"></script>
<script src="kit:graphing"></script>
<script>
/* ==== MOTION ENGINE (lift to a forces kit later) ==== */
// One cart on a 10 m track, stepped at 1/60 s, sampled every 0.05 s. No DOM code in this block.
// Controls: hand (you set position: the cart follows a target point), throttle (you set velocity), pedal (you set
// acceleration). Also the ten Race targets (piecewise motion, integrated exactly), scoring, and slope and area helpers.
const Motion = (() => {
  const DT = 1 / 60, STEPS = 3, SAMPLE = DT * STEPS, RUN = 12, N = 240, LEN = 10, VMAX = 3, AMAX = 2, MASS = 2.0;
  const BAND = {x: .4, v: .25, a: .15};
  const RANGE = {x: [0, 10], v: [-3, 3], a: [-2, 2]};
  const UNIT = {x: 'm', v: 'm/s', a: 'm/s²'};
  // Feel (tuned by simulation and by driving; spec numbers were first guesses):
  // hand: a tracker fits the pointer's own samples (by their timestamps) over the last 0.7 s (longer when the track is
  //   drawn small, so pixels are coarse), so whole-pixel steps and
  //   uneven frame timing average out: a straight line, with a curved (quadratic) fit blended in smoothly while the hand
  //   is clearly speeding up or slowing down; the window restarts when a 0.15 s fit disagrees by more than 0.35 m/s (a
  //   real start or turn). The cart asks for that pointer velocity (feed-forward, capped at 2 m/s) plus the speed that
  //   would close the gap braking at 1.2 m/s squared, softened near the point (offset 0.7 m/s) so small wobbles barely
  //   move it; when the pointer is held still its velocity fades out (0.1 to 0.3 s) and the offset eases to 0.2 m/s
  //   (0.3 to 0.7 s), so the cart closes the last gap briskly. Capped at 3 m/s; velocity changes are rate-limited to
  //   2 m/s squared, eased over 0.3 s. Tuned on pixel-quantized, timing-jittered input (28 to 90 px per meter, 60 Hz with
  //   30 percent jitter) and checked with real mouse drags: a steady drag trails by a few centimeters with a standard
  //   deviation in a of about 0.03 to 0.06 m/s squared; an eased stop draws a smooth slowing-down half, about 0.15 to
  //   0.3 s behind the hand; a hand that stops dead is overshot (from 1 m/s by about 0.3 to 0.45 m, against 0.25 m at the
  //   2 m/s squared limit), then the cart comes back.
  // throttle: the cart's velocity eases toward the slider over 0.2 s, never faster than 2 m/s squared.
  // pedal: the slider is the acceleration itself (no smoothing).
  const TUNE = {handWin: .7, handWinShort: .15, handTurn: .35, handStill: .3, handCurveA0: .1, handCurvePx: 4, handCurveA1: .35, handCurveTau: .25,
    handFF: 2, handBrake: 1.2, handSoft: .7, handSoftStill: .2,
    follow: .3, throttleLag: .2};
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // a cart: x (m), v (m/s), a (the acceleration applied in the last step)
  function cart(x0 = 1, v0 = 0) { return {x: x0, v: v0, a: 0, steps: 0, acc: 0, parked: 0, push: 0, top: false, stop: 0}; }

  // the hand tracker: add(t, p) for each pointer sample (t in s, p in m); get(now) -> {v, p}: the pointer's velocity and
  // where it is now, from a least-squares line through the recent samples (a pointer still for 0.3 s is at rest)
  // q: meters per screen pixel (whole-pixel steps make short fits noisy, so the turn test allows for them)
  function tracker(q = .01) {
    let ev = [], seg = -Infinity, w = 0, tw = null, lastV = 0;
    const fit = (h, now) => {
      const n = h.length; if (n < 2) return {v: 0, p: h.length ? h[n - 1][1] : null};
      let mt = 0, mp = 0; for (const e of h) { mt += e[0]; mp += e[1]; } mt /= n; mp /= n;
      let sxx = 0, sxy = 0; for (const e of h) { sxx += (e[0] - mt) ** 2; sxy += (e[0] - mt) * (e[1] - mp); }
      const v = sxx > 1e-9 ? sxy / sxx : 0; return {v, p: mp + v * (now - mt)};
    };
    // least-squares p = c0 + c1 u + c2 u squared, u = t - now: velocity now is c1, position now is c0
    const fit2 = (h, now) => {
      let s0 = 0, s1 = 0, s2 = 0, s3 = 0, s4 = 0, y0 = 0, y1 = 0, y2 = 0;
      for (const [t, p] of h) { const u = t - now, u2 = u * u; s0++; s1 += u; s2 += u2; s3 += u2 * u; s4 += u2 * u2; y0 += p; y1 += p * u; y2 += p * u2; }
      const det = s0 * (s2 * s4 - s3 * s3) - s1 * (s1 * s4 - s3 * s2) + s2 * (s1 * s3 - s2 * s2);
      if (Math.abs(det) < 1e-12) return null;
      const c0 = (y0 * (s2 * s4 - s3 * s3) - s1 * (y1 * s4 - s3 * y2) + s2 * (y1 * s3 - s2 * y2)) / det;
      const c1 = (s0 * (y1 * s4 - y2 * s3) - y0 * (s1 * s4 - s3 * s2) + s2 * (s1 * y2 - y1 * s2)) / det;
      const c2 = (s0 * (s2 * y2 - y1 * s3) - s1 * (s1 * y2 - y1 * s2) + y0 * (s1 * s3 - s2 * s2)) / det;
      return {v: c1, p: c0, a: 2 * c2};
    };
    return {
      set q(v) { q = v; },
      add(t, p) { ev.push([t, p]); while (ev.length && ev[0][0] < t - 1) ev.shift(); },
      reset() { ev = []; seg = -Infinity; w = 0; tw = null; lastV = 0; },
      get(now) {
        if (!ev.length) return {v: 0, p: null};
        const last = ev[ev.length - 1];
        const idle = now - last[0];
        if (idle >= TUNE.handStill) { w = 0; tw = null; return {v: 0, p: last[1], idle}; }
        // a pointer that is overdue (quiet for longer than its usual gap between samples, and for longer than it takes to
        // move 2 pixels at its last speed) is still where it was: a sample at "now" stops the fits from carrying it on
        // forward (no forward blip when a hand stops), while a slow creep with sparse samples is left alone
        const gaps = []; for (let i = Math.max(1, ev.length - 8); i < ev.length; i++) gaps.push(ev[i][0] - ev[i - 1][0]);
        gaps.sort((a, b) => a - b);
        const gap = gaps.length ? gaps[gaps.length >> 1] : 1 / 60;
        const overdue = idle > Math.max(1.5 * gap + 1 / 60, 2 * q / Math.max(Math.abs(lastV), .05));
        const all = overdue ? ev.concat([[now, last[1]]]) : ev;
        let short = all.filter(e => e[0] >= now - TUNE.handWinShort);
        if (short.length < 3) short = all.slice(-3);
        const vs = fit(short, now).v;
        // coarse pixels (a small window on screen) get a longer window: 0.7 s at 66 px per meter or more, about 0.87 s at 28
        const win = TUNE.handWin + 8 * Math.max(0, q - .015);
        let h = all.filter(e => e[0] >= Math.max(now - win, seg)), f = h.length >= 2 ? fit(h, now) : {v: vs, p: last[1]};
        if (Math.abs(vs - f.v) > TUNE.handTurn + 2 * q / TUNE.handWinShort) { seg = now - TUNE.handWinShort; h = all.filter(e => e[0] >= seg); f = h.length >= 2 ? fit(h, now) : {v: vs, p: last[1]}; }
        // speeding up or slowing down: a straight line runs behind (or ahead of) the hand, so a curved (quadratic) fit is
        // blended in by how clearly it shows an acceleration (more than 0.1 m/s squared plus 4 pixels' worth, fully by
        // 0.35 more), and the blend weight itself moves smoothly (over 0.25 s), so the two fits never flip frame to frame
        const g = h.length >= 6 ? fit2(h, now) : null;
        const want = g ? clamp((Math.abs(g.a) - TUNE.handCurveA0 - TUNE.handCurvePx * q) / TUNE.handCurveA1, 0, 1) : 0;
        if (tw != null && now > tw) w += (want - w) * Math.min(1, (now - tw) / TUNE.handCurveTau);
        tw = now;

  function renderHint() { $('hint').textContent = state.mode === 'race' ? HINT.race : HINT[state.ctl]; }
  function note(t) { $('runNote').textContent = t; }
  function tipFor(k) { return k === 'keys' ? 'The arrow keys on the cart work with Hand control. Pick Hand, or use the slider.' : ''; }
  function renderButtons() {
    const r = state.run;
    $('go').textContent = r === 'running' ? '❚❚ Pause' : '▶ Go';
    $('go').setAttribute('aria-label', r === 'running' ? 'Pause' : 'Go');
    $('links').setAttribute('aria-pressed', state.links);
    let n = r === 'idle' ? 'Drive to start the clock, or press Go.' : r === 'paused' ? 'Paused. Press Go to keep driving.' : '';
    if (state.links && r === 'running') n = 'Show links works on a paused run. Press Pause.';
    else if (state.links && r === 'paused') n = 'Move the pointer across the graphs, or Tab to a graph and use the arrow keys.';
    if (state.pendingStart) n += (n ? ' ' : '') + `Start at ${fmt(state.startAt)} m applies on Clear.`;
    note(n);
  }
  function cardBest(i) {
    const id = M.TARGETS[i].id, out = [];
    for (const c of ['hand', 'throttle', 'pedal']) { const b = bests[id + ':' + c]; if (b) out.push(`${CTL_NAME[c]} ${b.pct}%`); }
    return out.length ? 'Best: ' + out.join(', ') : '';
  }
  // a tiny thumbnail of a target's curve on its own graph
  function thumb(i) {
    const T = M.TARGETS[i], b = M.build(T), q = T.graph, W = 70, H = 34;
    // each thumbnail is scaled to its own curve (with zero in view for v and a), so small pushes still show their shape
    const ys = []; for (let k = 0; k <= 240; k++) ys.push(b.at[q](k * .05));
    let lo = Math.min(...ys, q === 'x' ? Infinity : 0), hi = Math.max(...ys, q === 'x' ? -Infinity : 0);
    const pad = Math.max(.1, (hi - lo) * .12); lo -= pad; hi += pad;
    const X = t => 15 + t / M.RUN * (W - 18), Y = v => 3 + (hi - v) / (hi - lo) * (H - 6);
    let d = '';
    for (const s of b.seg) for (let k = 0; k <= 12; k++) { const t = s.t0 + (s.t1 - s.t0) * k / 12; d += (k ? 'L' : 'M') + X(t).toFixed(1) + ',' + Y(b.at[q](Math.min(t, s.t1 - 1e-9))).toFixed(1); }
    const z = q === 'x' ? '' : `<line x1="15" x2="${W - 3}" y1="${Y(0)}" y2="${Y(0)}" stroke="#62789a" stroke-width="1"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect x=".5" y=".5" width="${W - 1}" height="${H - 1}" rx="3" fill="#0e1520" stroke="#2b3646"/>${z}<path d="${d}" fill="none" stroke="#f2a93b" stroke-width="2" stroke-dasharray="4 2.5"/><text x="7.5" y="${H / 2 + 4}" text-anchor="middle" font-size="10" font-family="Segoe UI,sans-serif" font-weight="700" fill="#a6b3c4">${q}</text></svg>`;
  }
  const thumbs = M.TARGETS.map((_, i) => thumb(i));
  function renderCards() {
    const box = $('cards');
    if (!box.children.length) M.TARGETS.forEach((T, i) => {
      const b = document.createElement('button'); b.className = 'card'; b.dataset.i = i;
      b.innerHTML = `${thumbs[i]}<span><span class="cn">${T.id}. ${T.name}</span><span class="cm"></span><span class="cb"></span></span>`;
      b.querySelector('span>span').style.display = 'block'; b.querySelector('.cm').style.display = 'block'; b.querySelector('.cb').style.display = 'block';
      b.onclick = () => { if (state.phase === 'run' || state.phase === 'count') return; loadTarget(i); };
      box.appendChild(b);
    });
    for (const b of box.children) {
      const i = +b.dataset.i, T = M.TARGETS[i], hard = M.hardWay(state.ctl, T.graph);
      b.setAttribute('aria-pressed', i === state.target);
      b.querySelector('.cm').innerHTML = `${GRAPH_WORD[T.graph]} graph, ${CTL_NAME[T.ctl]} suggested${T.v0 ? ', starts moving' : ''}${hard ? '<span class="tag">hard way</span>' : ''}`;
      b.querySelector('.cb').textContent = cardBest(i);
      b.disabled = state.phase === 'run' || state.phase === 'count' || state.phase === 'replay';
    }
  }
  // a focused button that is about to be disabled hands focus on, so keyboard users never land on the page body
  function keepFocus(fromIds, toId) { const a = document.activeElement; if (a && fromIds.includes(a.id)) focusLater(toId); }
  function renderRace() {
    if (state.mode !== 'race') return;
    const T = M.TARGETS[state.target], ph = state.phase, hard = M.hardWay(state.ctl, T.graph);
    $('tName').innerHTML = `Target ${T.id}: ${T.name} <span style="font-weight:400;color:var(--muted)">(${GRAPH_WORD[T.graph]})</span>${hard ? '<span class="tag">hard way</span>' : ''}`;
    const b = bests[bestKey()];
    let n = T.note ? T.note + ' ' : '';
    if (T.v0) n = `Starts moving at ${fmt(T.v0)} m/s. ` + n;
    if (ph === 'ready') n += b ? `Ghost: your best with ${CTL_NAME[state.ctl]}, ${b.pct} percent.` : `No ${CTL_NAME[state.ctl]} best yet for this target.`;
    if (ph === 'count') n = 'Get ready. The cart is held at the start.';
    if (ph === 'run') n = 'Stay inside the shaded band.';
    if (ph === 'replay') n = 'Replaying your run' + (ghost ? ' and the ghost.' : '.');
    $('tNote').textContent = n.trim();
    const busy = ph === 'run' || ph === 'count' || ph === 'replay';
    $('start').disabled = busy; $('stop').disabled = !(ph === 'run' || ph === 'count');
    const done = ph === 'done' || ph === 'replay';
    if (ph === 'replay') keepFocus(['all3', 'again2', 'next2'], 'replay');
    $('again').hidden = $('nextT').hidden = done;
    for (const p of document.querySelectorAll('.pk')) p.disabled = busy;
    $('res').hidden = !(done && state.result);
    if (state.result) {
      const r = state.result, q = T.graph;
      $('resDl').innerHTML = `<dt>Match</dt><dd>${r.pct}% <span style="color:var(--muted)">(time inside the band)</span></dd>` +
        `<dt>RMS error</dt><dd>${f2(r.rms)} ${M.UNIT[q]}${r.early ? ` <span style="color:var(--muted)">(first ${fmt(r.done * M.SAMPLE, 1)} s)</span>` : ''}</dd>` +
        `<dt>Best</dt><dd>${r.best}% <span style="color:var(--muted)">(${CTL_NAME[r.ctl]})</span>${r.hard ? '<span class="tag">hard way</span>' : ''}</dd>`;
      $('resLine').textContent = r.isNew ? 'New best' : `Best stays ${r.best} percent`;
      $('resLine').className = 'rline' + (r.isNew ? ' ok' : '');
      $('all3').setAttribute('aria-pressed', state.all3);
      $('replay').setAttribute('aria-disabled', ph === 'replay'); $('again2').disabled = ph === 'replay'; $('next2').disabled = ph === 'replay';
      $('all3').disabled = ph === 'replay';
    }
    renderCards();
  }

  // ======================================================================================
  // Narration: one welcome per mode; a line is marked said when it starts; nothing queued cuts off Read
  // ======================================================================================
  const said = new Set(), queued = new Map();
  let tapped = false, vq = Promise.resolve(), vgen = 0, readP = Promise.resolve();
  // the first tap unlocks sound; the welcome waits until that tap's own click has landed (a mode button gives the new
  // mode's welcome). A first tap on Read or Sound does not bring a welcome after it.
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, e => {
    if (tapped) return; tapped = true;
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (b && (b.id === 'read' || b.id === 'sound')) return;
    // a mode button switches mode on its click, which queues that mode's welcome; anything else gets this one first
    if (!(b && /^m-/.test(b.id))) narrate(WELCOME[state.mode]);
  }, true);
  // queued: key -> token; dropping a key (or a stop) makes its waiting task skip, and its trigger can queue it again
  function narrate(key) {
    if (!tapped || !Curio.sound || said.has(key) || queued.has(key)) return false;
    const tok = {}; queued.set(key, tok);
    const gen = vgen, line = L[key];
    vq = vq.then(async () => {
      await readP;
      if (gen !== vgen || queued.get(key) !== tok) return;
      queued.delete(key); said.add(key);
      await Promise.race([say(line), wait(2500 + 80 * line.length)]);
    });
    return true;
  }
  function hush() { vgen++; queued.clear(); vq = Promise.resolve(); readP = Promise.resolve(); Curio.stop(); }
  const dropLines = keys => keys.forEach(k => queued.delete(k));
  function readNow() { hush(); const h = $('hint').textContent; readP = Promise.race([say([h], true), wait(2500 + 80 * h.length)]).catch(() => {}); }

  // ======================================================================================
  // Modes
  // ======================================================================================
  function setMode(m) {
    hush();
    state.mode = m;
    document.body.dataset.mode = m;
    for (const k of ['explore', 'race']) $('m-' + k).setAttribute('aria-pressed', k === m);
    for (const el of document.querySelectorAll('[data-modes]')) el.hidden = !el.dataset.modes.split(' ').includes(m);
    $('res').hidden = true;
    for (const p of document.querySelectorAll('.pk')) p.disabled = false;
    if (m === 'explore') {
      B = null; ghost = null; state.phase = 'ready'; state.run = 'idle'; state.pendingStart = false;
      resetRun(state.startAt, 0); sl.throttle = 0; sl.pedal = 0;
      setControl(state.ctl, true);
      renderButtons();
    } else {
      state.run = 'idle';
      loadTarget(state.target, true);
    }
    renderHint(); renderStatic(); dirty = true;
    narrate(WELCOME[m]);
  }
  for (const k of ['explore', 'race']) $('m-' + k).onclick = () => setMode(k);

  // every line the tool can say (voice/lines.json records them all)
  const allLines = () => [...new Set([...Object.values(L), HINT.hand, HINT.throttle, HINT.pedal, HINT.race])];

  // ======================================================================================
  // Layout (see the CSS note)
  // ======================================================================================
  let page = null, lastSize = '';
  function pageLayout() { const w = innerWidth, h = innerHeight; return w >= 1000 && h >= 700 ? 'wide' : w >= 600 && w / h >= 1.25 ? 'compact' : 'stack'; }
  function relayout() {
    const p = pageLayout();
    if (p !== page) { page = p; for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p); }
    const st = $('stage');
    if (page === 'stack') { const w = st.getBoundingClientRect().width || innerWidth; st.style.height = Math.round(clamp(w * 1.2, 470, 700)) + 'px'; }
    else st.style.height = '';
    const r = st.getBoundingClientRect(), key = Math.round(r.width) + 'x' + Math.round(r.height);
    if (key !== lastSize) { lastSize = key; build(); }
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());

  Curio.init({clips: "voice:*", rate: .95, readFallback: () => $('hint').textContent});
  $('read').onclick = readNow;

  // for checking frames: drive(seconds, fn(t) -> {pointer, keyV, throttle, pedal}) steps the simulation by hand
  function drive(sec, fn) {
    manual = true;
    const n = Math.round(sec / M.DT);
    for (let k = 0; k < n && simOn(); k++) {
      const o = fn ? fn(cart.steps * M.DT) || {} : {};
      if ('pointer' in o) {
        const t = cart.steps * M.DT;
        if (o.pointer == null) drag = null;
        else { if (!drag) hand.reset(); if (!drag || drag.p !== o.pointer) hand.add(t, o.pointer); drag = {id: -1, p: o.pointer}; handNow = hand.get(t); }
      }
      if ('keyV' in o) { keyDir = o.keyV ? Math.sign(o.keyV) : 0; keySlow = Math.abs(o.keyV || 0) < .5; }
      if ('throttle' in o) sl.throttle = o.throttle;
      if ('pedal' in o) sl.pedal = o.pedal;
      stepOnce();
    }
    drag = null; keyDir = 0; vsShow(); manual = false; render();
    return {t: cart.steps * M.DT, x: cart.x, v: cart.v, a: liveA(), n: rec.x.length};
  }
  window.__tool = {state, setMode, allLines, setControl, loadTarget, drive, said, queued, M, sl, bests: () => bests,
    get rec() { return rec; }, get cart() { return cart; }, get B() { return B; }, get ghost() { return ghost; }, get G() { return G; },
    go: explorePlay, clear: exploreClear, start: raceStart, stopRun: raceStop, again: raceAgain, finish: () => finishRace(false),
    beginRun() { if (state.phase !== 'count') raceStart(); state.phase = 'run'; state.count = 0; renderRace(); },
    cursor(i) { state.cursor = i; render(); }, render, hint: () => $('hint').textContent,
    curio: () => ({last: Curio.last, sound: Curio.sound, reduce: Curio.reduce}), layout: () => ({page, G})};
  relayout();
  setMode('explore');
})();
</script>
</body>
</html>
