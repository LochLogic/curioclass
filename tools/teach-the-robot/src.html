<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teach the Robot · Show Kip examples · Curio Class</title>
<meta name="description" content="The class shows Kip the robot one pet at a time and says cat or dog. Kip remembers every example and guesses new pets from the one it remembers that looks most alike, so its guesses get better as the class teaches it more. Grade 2 computer science. Works offline.">
<!--
Teach the Robot (Curio Class)
Grade 2, computer science, module Teach the Machine (Algorithms and Programming). Standard E2-ALG-ML-02; CSTA 2017
crosswalk 1A-DA-07 (identify and describe patterns in data to make predictions); AI4K12 Big Idea 3 (computers can
learn from data). The teacher drives on a projector or smartboard; the class names each pet out loud.
Teach: show Kip 16 example pets one at a time, label each Cat or Dog, and try Mystery pets. Pet Parade: ten new pets
walk past, Kip guesses each, and Kip's Chart keeps one bar per run with the number of pets Kip remembered.
Kip guesses with the nearest-neighbor rule (k = 1) over six clues the class can see on every pet: ears, snout,
whiskers, size, dark coat and fluffy. Engine: kit/ml-lab.js (docs/families/ml-lab.md). Nearest neighbors: scikit-learn
user guide, "Nearest Neighbors". The pets and their clue values are made up for this tool; the parade scores were
computed with the engine. The 26 pets are illustrations drawn with FLUX.1-schnell (Apache 2.0) on a local computer,
edited for Curio Class; Kip, the lobby and the chart are drawn in code; sounds are made in the browser. One file, no
network requests.
Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root{
  --paper:#fbf7ef;--ink:#2b2238;--muted:#66597a;--line:#e6dccb;--brand:#16679a;--focus:#c2410c;
  --btn:#0f5580;--btn-line:#5d95bd;--head-ink:#fff;--panel:#fffdf8;
  --cat:#0f7c7a;--dog:#b5531a;--ok:#1f7a3f;--bad:#b42318;--wall:#f6e3c8;--floor:#c98f5a;--door:#8a5a3c;
}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 3px #fff}
/* three page layouts, picked in script (relayout()), as in collision-lab:
   wide    (1000 px or wider and 700 px or taller): stage on the left, 360 px panel on the right;
   compact (a short landscape box such as the 16:10 embed): a narrower panel and a one-row header;
   stack   (narrow or portrait): the stage above the panel, the page scrolls.
   The panel comes first in the page so Tab reaches its buttons before the wall cards (spec: tab order). */
main{grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{grid-column:1;grid-row:1;min-height:0;background:var(--wall)}
.panel{grid-column:2;grid-row:1}
#sv{position:absolute;left:0;top:0;display:block;touch-action:manipulation}
body.compact main{grid-template-columns:minmax(0,1fr) 290px}
@media (min-width:900px){body.compact main{grid-template-columns:minmax(0,1fr) 320px}}
body.compact header{padding:4px 8px;gap:6px;flex-wrap:nowrap;min-width:0}
body.compact h1{font-size:17px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.compact h1 small{display:none}
body.compact .seg{flex:none}
body.compact .seg button,body.compact .icon-btn{min-height:60px;padding:0 9px;font-size:14px;white-space:nowrap}
body.compact .icon-btn{flex:none}
body.compact .panel{padding:8px;gap:7px}
body.compact .hint{font-size:14px;line-height:1.35;min-height:4.05em}   /* three lines at 14 px, in both modes */
/* the parade panel gives the hint its three lines by letting Kip's Chart take what is left (not less than 72 px) */
body.compact .ctl[data-modes="parade"]{flex:1 1 auto;min-height:0}
body.compact .ctl[data-modes="parade"] .sec:last-child{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
body.compact #chart{height:auto;flex:1 1 auto;min-height:72px}
body.compact .big-btn{font-size:17px;padding:0 8px}
body.stack{height:auto}
body.stack main{grid-template-columns:minmax(0,1fr);align-content:start}
body.stack .panel{grid-column:1;grid-row:2;border-left:0;border-top:3px solid var(--line);overflow:visible;padding:8px 12px;gap:8px}
body.stack .hint{min-height:0}
@media (max-width:560px){
  .seg{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;width:100%}
  .seg button{min-height:60px;font-size:15px;padding:0 6px}
  .icon-btn{min-height:60px;padding:0 12px;font-size:15px}
}
/* K-2 targets: header buttons 60 px tall too (this tool's CSS, as robot-dance and computer-builder do) */
.seg button,.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:60px}
.ico{width:1.35em;height:1.35em;flex:none;display:block}
/* panel */
.hint{margin:0;min-height:2.9em;flex:none}
.ctl{display:flex;flex-direction:column;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;font-size:19px;line-height:1.1;text-align:left}
.big-btn .ico{width:34px;height:34px}
.big-btn.cat{background:var(--cat);--ib:var(--cat)}
.big-btn.dog{background:var(--dog);--ib:var(--dog)}
.big-btn.act{--ib:var(--brand)}
.big-btn.soft{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 #0000001a;--ib:#fff}
.big-btn.soft .ico{color:var(--brand)}
.big-btn.forget{background:#fff;color:var(--bad);border:3px solid var(--bad);box-shadow:0 4px 0 #0000001a}
.big-btn.stop{background:var(--ink)}
/* busy buttons stay focusable (aria-disabled) so a keyboard user keeps their place */
.big-btn:disabled,.big-btn[aria-disabled="true"]{opacity:.4;filter:saturate(.5);cursor:default}
.big-btn:not(:disabled):not([aria-disabled="true"]):active{transform:translateY(2px);box-shadow:0 2px 0 #0003}
.pulse{animation:pulse .5s ease-in-out 2;box-shadow:0 0 0 6px #ffd34d,0 5px 0 #0003!important}
/* the mode switcher clips outside shadows, so its pulse is drawn inside the button */
.seg button.pulse{animation:segpulse .5s ease-in-out 2;box-shadow:inset 0 0 0 6px #ffd34d!important}
@keyframes segpulse{0%,100%{background:#ffd34d;color:#2b2238}50%{background:#fff3c4;color:#2b2238}}
@keyframes pulse{50%{transform:scale(1.05)}}
.mem{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-weight:700;font-size:16px;color:var(--ink)}
.mem b{font:800 34px 'Trebuchet MS',sans-serif;color:var(--brand);line-height:1}
.mem{font-size:18px}
.paws{display:flex;flex-wrap:wrap;gap:3px;color:var(--brand)}
.paws .ico{width:24px;height:24px}
body.compact .mem{font-size:15px}
body.compact .mem b{font-size:24px}
body.compact .paws{display:none}
body.stack .paws .ico{width:18px;height:18px}
.sec{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.sec h2{margin:0 0 4px;font:800 16px 'Trebuchet MS',sans-serif;display:flex;align-items:center;gap:6px}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed #b9ab95;display:grid;place-items:center;font:700 14px 'Segoe UI',sans-serif;color:var(--muted);min-width:0}
.slot.cur{border:3px solid var(--brand);color:var(--brand)}
.slot.ok{background:var(--ok);border:2px solid var(--ok);color:#fff}
.slot.bad{background:var(--bad);border:2px solid var(--bad);color:#fff}
.slot .ico{width:72%;height:72%}
.tally{margin:6px 0 0;font:800 24px 'Trebuchet MS',sans-serif;text-align:center}
.tally:empty{display:none}
#chart{height:190px;position:relative}
body.compact .sec{padding:6px 8px}
body.compact .sec h2{font-size:14px;margin-bottom:2px}
body.compact .tally{display:none}   /* the stage shows the same "7 of 10" large; its room goes to Kip's Chart */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* stage pieces drawn in SVG */
.spin{animation:spin 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.card{cursor:pointer;outline:none}
.card .ring{display:none}
.card:focus-visible .ring{display:inline}
</style>

<body>
<header>
  <h1>Teach the Robot <small>Show Kip examples</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-teach" aria-pressed="true"><span data-ico="book"></span>Teach</button>
    <button id="m-parade" aria-pressed="false"><span data-ico="flag"></span>Pet Parade</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <aside class="panel" id="panel">
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="ctl" data-modes="teach">
      <button class="big-btn act" id="next"><span data-ico="paw"></span>Next pet</button>
      <button class="big-btn act" id="go-parade" hidden><span data-ico="flag"></span>Pet Parade</button>
      <div class="row2">
        <button class="big-btn cat" id="cat" disabled><span data-ico="cat"></span>Cat</button>
        <button class="big-btn dog" id="dog" disabled><span data-ico="dog"></span>Dog</button>
      </div>
      <div class="row2">
        <button class="big-btn soft" id="mystery"><span data-ico="ask"></span>Mystery pet</button>
        <button class="big-btn soft" id="over"><span data-ico="redo"></span>Start over</button>
      </div>
      <button class="big-btn forget" id="forget" hidden><span data-ico="trash"></span>Forget</button>
      <div class="mem" id="mem"><span>Kip remembers: <b id="memN">0</b></span><span class="paws" id="paws" aria-hidden="true"></span></div>
    </div>
    <div class="ctl" data-modes="parade" hidden>
      <button class="big-btn act" id="start"><span data-ico="play"></span>Start parade</button>
      <button class="big-btn stop" id="stop" hidden><span data-ico="stop"></span>Stop</button>
      <div class="sec">
        <h2>Kip's guesses</h2>
        <div class="slots" id="slots" role="list" aria-label="Parade score"></div>
        <p class="tally" id="tally"></p>
      </div>
      <div class="sec">
        <h2>Kip's Chart</h2>
        <div id="chart"></div>
      </div>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </aside>
  <div class="stage" id="stage"><svg id="sv" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Kip the robot in the pet hotel lobby, with Kip's memory wall"></svg></div>
</main>
<script src="kit:curio"></script>
<script src="kit:ml-lab"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const {wait} = Curio;
  const NS = 'http://www.w3.org/2000/svg';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;

  // ======================================================================================
  // Pets: six clues (0 to 1) that Kip compares, and the same values draw every pet
  // ======================================================================================
  const F = ['ears', 'snout', 'whiskers', 'size', 'dark', 'fluffy'];
  // name, is a, coat, pattern, ears, snout, whiskers, size, dark, fluffy (spec tables, in order)
  const pet = ([id, label, coat, pat, ...v]) => ({id, name: id, label, coat, pat, v: Object.fromEntries(F.map((f, i) => [f, v[i]]))});
  const DECK = [
    ['Marmalade', 'cat', '#e8913a', 'tabby', .75, .30, .70, .20, .30, .20],
    ['Bear', 'dog', '#4a2f1f', '', .50, .55, .50, .90, .85, .85],
    ['Inky', 'cat', '#1f1f24', '', .85, .25, .75, .30, .95, .20],
    ['Pebble', 'dog', '#f4f1ea', '', .30, .50, .40, .20, .05, .90],
    ['Snowball', 'cat', '#f7f5f0', '', .80, .20, .85, .35, .05, .85],
    ['Rocket', 'dog', '#8c8f96', 'white', .85, .65, .45, .70, .50, .70],
    ['Tiger', 'cat', '#7d7f86', 'stripes', .90, .30, .80, .60, .60, .30],
    ['Biscuit', 'dog', '#d9a441', '', .20, .65, .35, .60, .30, .40],
    ['Coco', 'cat', '#6e4a2e', '', .80, .25, .70, .30, .70, .20],
    ['Pudding', 'dog', '#c49a6c', '', .35, .15, .50, .30, .45, .10],
    ['Smoky', 'cat', '#8a8d94', '', .85, .20, .80, .50, .55, .95],
    ['Ziggy', 'dog', '#c8642c', 'white', .85, .55, .40, .35, .35, .30],
    ['Duchess', 'cat', '#efe1c2', '', .75, .30, .85, .65, .15, .70],
    ['Moose', 'dog', '#222226', '', .25, .75, .35, .95, .90, .30],

  ].map(pet);
  const PARADE = [
    ['Maple', 'cat', '#e39a4c', '', .85, .25, .80, .30, .35, .35],
    ['Nutmeg', 'cat', '#b08a68', 'tabby', .92, .27, .64, .28, .37, .30],

    ['Noodle', 'dog', '#f2efe8', '', .27, .65, .38, .44, .09, .78],
    ['Ghost', 'cat', '#f5f3ee', '', .80, .25, .85, .30, .10, .50],
    ['Shadow', 'dog', '#1e1e22', '', .20, .75, .35, .85, .90, .30],
    ['Pippin', 'dog', '#c0612e', '', .85, .55, .45, .30, .40, .30],
    ['Waffles', 'dog', '#b8905f', '', .30, .20, .50, .25, .50, .15],
    ['Bramble', 'cat', '#85888f', '', .85, .25, .90, .60, .55, .75],
    ['Juniper', 'dog', '#7a7d84', '', .80, .65, .40, .60, .60, .60],
  ].map(pet);
  const WORD = {cat: 'Cat', dog: 'Dog'};

  // ======================================================================================
  // Voice: every fixed line (spec "Voice"); how = once, then hint only; event = every time
  // ======================================================================================
  const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  const L = {
    teachWelcome: 'This is Kip. Kip is a robot that learns from examples. Tap Next pet to show Kip a pet.',
    catOrDog: 'Is it a cat or a dog? Say it out loud. Then tap Cat or Dog.',
    remCat: 'Kip remembers: that one is a cat!',
    remDog: 'Kip remembers: that one is a dog!',
    tryMystery: 'Now tap Mystery pet. Kip will guess!',
    predict: 'What will Kip guess? Say it out loud!',
    looks: 'Kip looks for the pet it remembers that looks the most alike.',
    thinkCat: "Kip thinks it's a cat!",
    thinkDog: "Kip thinks it's a dog!",
    right: 'Yes! Kip got it right!',
    wrong: 'Oops! Kip guessed wrong. Kip needs more examples.',
    wrongLabel: 'Oops! Kip remembered that pet wrong.',
    afterMystery: 'Tap Mystery pet again, or Next pet to teach Kip more.',
    afterMysteryAll: 'Tap Mystery pet again, or Pet Parade to count.',
    empty: "Kip doesn't remember any pets yet. Tap Next pet first!",
    emptyParade: "Kip doesn't remember any pets yet. Tap Teach first!",
    allCards: "That's every example card! Tap Pet Parade to see how Kip does.",
    forgetHow: 'Tap Forget to make Kip forget this pet. Tap the card again to keep it.',
    forgot: 'Kip forgot that one.',
    forgotHow: 'Tap Next pet to show it to Kip again.',
    over: "Starting over! Kip's memory is empty.",
    nextHow: 'Tap Next pet to show Kip a pet.',
    paradeWelcome: 'Welcome to the Pet Parade! Ten new pets will walk by. Count how many Kip gets right.',
    startHow: 'Tap Start parade.',
    score: NUM.map((w, i) => `Kip got ${w} out of ten right${i === 10 ? '!' : '.'}`),
    more: "That's more than last time!",
    same: "That's the same as last time.",
    fewer: "That's fewer than last time. Did Kip learn something wrong?",
    againHow: 'Tap Teach and show Kip more pets. Then run the parade again.',
    againAllHow: 'Kip has seen every pet! Tap Teach to try Mystery pets, or Start over to teach Kip again.',
    better: 'The more different pets Kip saw, the better Kip guessed!',
  };

  // ======================================================================================
  // State
  // ======================================================================================
  const state = {
    mode: 'teach',
    wall: [],            // what Kip remembers, in the order it was taught: {key, pet, idx, label, arriving}
    deck: DECK.map((_, i) => i),   // example cards still to show, in order
    mi: 0,               // next Mystery pet (cycles through the parade list)
    busy: false,         // a pet walking, Kip thinking, a card flying: panel buttons wait
    sel: null,           // the selected wall card's key
    arrivals: 0,         // counts pets walking in (a "Kip remembers" line is stale once another pet arrives)
    teach: {spot: null}, parade: {spot: null},   // the pet in the spotlight, per mode
    running: false,      // the parade
    slots: [],           // this parade's results, 'ok' or 'bad'
    runs: [],            // Kip's Chart: {right, mem}
    tally: null,         // the big "7 of 10" on the stage
    saidBetter: false,   // line 33 plays once per page load (or Start over)
    mysteries: 0,        // Mystery pets so far (the first one speaks the prediction and look-alike lines)
    tk: 0,               // a mode change, Stop or Start over cancels running sequences
    speed: 1,            // tests only: timing scale (1 = real)
  };
  let uid = 0;
  const spotOf = (m = state.mode) => state[m].spot;
  const waiting = () => { const s = state.teach.spot; return !!s && s.kind === 'example' && s.phase === 'wait'; };
  const W8 = ms => wait(ms * state.speed);

  // ======================================================================================
  // Icons (buttons, shelf headers, Kip's screen): 100 x 100, drawn in currentColor; details in var(--ib)
  // ======================================================================================
  const IB = 'style="fill:var(--ib,#fff)"', IBS = w => `style="fill:none;stroke:var(--ib,#fff);stroke-width:${w};stroke-linecap:round;stroke-linejoin:round"`;
  const ICON = {
    cat: `<path d="M17 50 L20 9 L45 31 Z M83 50 L80 9 L55 31 Z" fill="currentColor"/><circle cx="50" cy="58" r="33" fill="currentColor"/>
      <ellipse cx="37" cy="53" rx="5" ry="7" ${IB}/><ellipse cx="63" cy="53" rx="5" ry="7" ${IB}/><path d="M44 66 L56 66 L50 73 Z" ${IB}/>
      <path d="M33 70 L10 66 M33 75 L11 79 M67 70 L90 66 M67 75 L89 79" ${IBS(3.5)}/>`,
    dog: `<ellipse cx="20" cy="48" rx="12" ry="27" transform="rotate(18 20 48)" fill="currentColor"/><ellipse cx="80" cy="48" rx="12" ry="27" transform="rotate(-18 80 48)" fill="currentColor"/>
      <circle cx="50" cy="52" r="31" fill="currentColor"/><ellipse cx="50" cy="74" rx="20" ry="15" fill="currentColor"/>
      <circle cx="38" cy="47" r="5.5" ${IB}/><circle cx="62" cy="47" r="5.5" ${IB}/><ellipse cx="50" cy="66" rx="9" ry="6.5" ${IB}/>
      <path d="M50 72 V80 M42 80 Q50 86 58 80" ${IBS(3.5)}/>`,
    paw: `<ellipse cx="50" cy="66" rx="22" ry="19" fill="currentColor"/><ellipse cx="23" cy="44" rx="9" ry="12" fill="currentColor"/><ellipse cx="40" cy="27" rx="9" ry="12" fill="currentColor"/>
      <ellipse cx="60" cy="27" rx="9" ry="12" fill="currentColor"/><ellipse cx="77" cy="44" rx="9" ry="12" fill="currentColor"/>`,
    ask: `<circle cx="50" cy="50" r="44" fill="currentColor"/><path d="M36 38 Q36 22 50 22 Q65 22 65 36 Q65 46 54 50 Q50 52 50 60" ${IBS(9)}/><circle cx="50" cy="76" r="6" ${IB}/>`,
    redo: `<path d="M78 50 A28 28 0 1 1 64 26" style="fill:none;stroke:currentColor;stroke-width:11;stroke-linecap:round"/><path d="M54 10 L82 22 L60 42 Z" fill="currentColor"/>`,
    trash: `<rect x="20" y="22" width="60" height="10" rx="4" fill="currentColor"/><rect x="40" y="12" width="20" height="12" rx="3" fill="currentColor"/>
      <path d="M26 36 H74 L69 88 Q68 92 64 92 H36 Q32 92 31 88 Z" fill="currentColor"/><path d="M42 46 V80 M58 46 V80" ${IBS(5)}/>`,
    play: `<path d="M28 16 L84 50 L28 84 Z" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>`,
    stop: `<rect x="20" y="20" width="60" height="60" rx="8" fill="currentColor"/>`,
    book: `<path d="M50 26 Q32 14 8 18 V80 Q32 76 50 88 Q68 76 92 80 V18 Q68 14 50 26 Z" fill="currentColor"/><path d="M50 28 V84" ${IBS(5)}/>`,
    flag: `<path d="M20 10 V92" style="stroke:currentColor;stroke-width:9;stroke-linecap:round"/><path d="M24 14 Q50 4 62 16 Q74 26 90 18 V56 Q74 64 62 54 Q50 42 24 52 Z" fill="currentColor"/>`,
    check: `<path d="M20 52 L42 74 L82 28" style="fill:none;stroke:currentColor;stroke-width:15;stroke-linecap:round;stroke-linejoin:round"/>`,
    xmark: `<path d="M26 26 L74 74 M74 26 L26 74" style="fill:none;stroke:currentColor;stroke-width:15;stroke-linecap:round"/>`,
  };
  const iconSVG = (k, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${ICON[k]}</svg>`;
  document.querySelectorAll('[data-ico]').forEach(s => { s.outerHTML = iconSVG(s.dataset.ico); });
  $('m-teach').style.setProperty('--ib', 'var(--btn)'); $('m-parade').style.setProperty('--ib', 'var(--btn)');

  // ======================================================================================
  // SVG helpers
  // ======================================================================================
  const sv = $('sv');
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function text(parent, x, y, s, o = {}) {
    const t = el('text', {x, y, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central', fill: o.fill || '#2b2238',
      'font-size': o.size || 14, 'font-weight': o.weight || 700, 'font-family': o.font || "'Trebuchet MS','Segoe UI',sans-serif"}, parent);
    if (o.stroke) { t.setAttribute('stroke', o.stroke); t.setAttribute('stroke-width', o.sw || 4); t.setAttribute('paint-order', 'stroke'); t.setAttribute('stroke-linejoin', 'round'); }

    } else setHint(L[teachHow()]);
  }
  function forget() {
    if (state.busy || state.sel == null) return;
    const i = state.wall.findIndex(c => c.key === state.sel); if (i < 0) return;
    const [c] = state.wall.splice(i, 1);
    state.deck.unshift(c.idx);   // the card goes back to the front of the deck, so Next pet brings it again
    const sp = state.teach.spot; if (sp && sp.match === c.key) { sp.match = null; sp.line = 0; }
    state.sel = null; updateButtons(); drawShelves(); repaint();
    V.dropQueued();
    const h = both('forgot', 'forgotHow'); setHint(h.hint);
    V.say([['forgot', h], ['forgotHow', {kind: 'how', ...h, needs: '#next'}]]);
    live(`Kip forgot ${c.pet.name}`);
  }
  function startOver() {
    if (state.busy) return;
    state.tk++; V.hush();
    state.wall = []; state.deck = DECK.map((_, i) => i); state.mi = 0; state.sel = null;
    state.teach.spot = null; state.parade.spot = null; state.leaving = null;
    state.runs = []; state.slots = []; state.tally = null; state.saidBetter = false;
    updateButtons(); renderSlots(); renderChart(); drawShelves(); repaint();
    const h = both('over', 'nextHow'); setHint(h.hint);
    V.say([['over', h], ['nextHow', {kind: 'how', ...h, needs: '#next'}]]);
  }

  // ======================================================================================
  // Pet Parade: 10 pets, 3.5 s each (walk in 0.6 s, think 0.25 s, Kip's guess 2.0 s, truth 0.65 s)
  // ======================================================================================
  async function startParade() {
    if (state.running) return;
    if (!state.wall.length) { V.hush(); setHint(L.emptyParade); V.say('emptyParade', {needs: '#m-teach'}); pulse('m-teach'); return; }
    V.hush();
    const alive = aliveFor('parade'), mem = state.wall.length;
    state.running = true; state.slots = []; state.tally = null; state.busy = true;
    updateButtons(); renderSlots(); setHint(L.paradeWelcome);
    steer(['start'], 'stop');
    for (let i = 0; i < PARADE.length; i++) {
      const p = PARADE[i];
      petLeaves('parade');
      const sp = state.parade.spot = {pet: p, kind: 'parade', phase: 'walk', walk: 0, line: 0};
      repaint(); renderSlots();
      await anim(600, t => { sp.walk = t; paintDyn(); }, alive); if (!alive()) return;
      sp.walk = 1; sp.phase = 'think'; repaint();
      await W8(250); if (!alive()) return;
      const g = guessFor(p);
      sp.guess = g.label; sp.match = g.match; sp.phase = 'guess'; drawShelves(); repaint();
      await anim(400, t => { sp.line = t; paintDyn(); }, alive); if (!alive()) return;
      sp.line = 1; paintDyn();
      await W8(1600); if (!alive()) return;   // Kip's guess shows 2 s in all, so the class can call it out
      sp.phase = 'truth'; sp.ok = g.label === p.label; repaint();
      state.slots.push(sp.ok ? 'ok' : 'bad'); renderSlots();
      Curio.tone(sp.ok ? 784 : 262, .18, .045, sp.ok ? 'sine' : 'triangle');
      await W8(650); if (!alive()) return;
    }
    // the end: the tally, a new bar, the result lines
    const right = state.slots.filter(s => s === 'ok').length, prev = state.runs[state.runs.length - 1];
    const lessBefore = state.runs.some(u => u.right < 10);
    state.runs.push({right, mem});
    state.running = false; state.busy = false; state.tally = right;
    petLeaves('parade');
    updateButtons(); renderSlots(); renderChart(true); drawShelves(); repaint();
    live(`Kip got ${right} of 10 right`);
    if (right === 10) Curio.yes();
    const parts = [L.score[right]];
    if (prev) parts.push(right > prev.right ? 'more' : right === prev.right ? 'same' : 'fewer');
    if (right === 10 && lessBefore && !state.saidBetter) { state.saidBetter = true; parts.push('better'); }
    const nx = paradeHow(), hint = L.score[right] + ' ' + L[nx];
    setHint(hint);
    steer(['stop'], 'start');
    V.say(parts, {valid: () => !state.running, hint});
    V.how(nx, {valid: () => !state.running, needs: NEEDS[nx], hint});
  }
  function stopParade() {
    if (!state.running) return;
    state.tk++; V.hush();
    state.running = false; state.busy = false; state.slots = []; state.parade.spot = null; state.leaving = null;
    updateButtons(); renderSlots(); drawShelves(); repaint();
    setHint(L[paradeHow()]);
  }

  // ======================================================================================
  // Modes and layout
  // ======================================================================================
  function settle() {   // a mode change: finish or drop what was moving, keep each mode's state
    if (state.mode === 'teach') {
      const sp = state.teach.spot;
      if (sp && sp.phase === 'fly') finishFly();
      else if (sp && sp.kind === 'example' && sp.phase === 'walk') { sp.walk = 1; sp.phase = 'wait'; }
      else if (sp && sp.kind === 'mystery' && sp.phase !== 'truth') state.teach.spot = null;
    } else if (state.running) {
      state.running = false; state.slots = []; state.parade.spot = null;
    }
    state.busy = false; state.leaving = null;
  }
  function setMode(m) {
    V.hush();
    state.tk++; settle();
    if (m !== state.mode) state.sel = null;
    state.mode = m;
    document.body.dataset.mode = m;
    for (const k of ['teach', 'parade']) $('m-' + k).setAttribute('aria-pressed', k === m);
    for (const e of document.querySelectorAll('[data-modes]')) e.hidden = e.dataset.modes !== m;
    updateButtons(); renderSlots();
    lastSize = ''; relayout();
    if (m === 'parade') renderChart();
    if (m === 'teach') {
      setHint(L[teachHow()]);
      if (!welcome()) { const h = teachHow(); if (h !== 'teachWelcome') V.how(h, {needs: NEEDS[h]}); }
    } else {
      const h = paradeHow();
      setHint(L[h]);
      if (h === 'emptyParade') { V.say('emptyParade', {needs: '#m-teach', valid: () => !state.wall.length}); pulse('m-teach'); }
      else { welcome(); V.how(h, {needs: NEEDS[h], valid: () => !state.running}); }
    }
  }
  for (const k of ['teach', 'parade']) $('m-' + k).onclick = () => { if (state.mode !== k) setMode(k); };

  let page = null, lastSize = '';
  function pageLayout() { const w = innerWidth, h = innerHeight; return w >= 1000 && h >= 700 ? 'wide' : w >= 600 && w / h >= 1.25 ? 'compact' : 'stack'; }
  function relayout() {
    const p = pageLayout();
    if (p !== page) { page = p; for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p); lastSize = ''; }
    const st = $('stage');
    if (page === 'stack') {
      const w = st.getBoundingClientRect().width || innerWidth, L0 = layoutFor(w, 400);
      st.style.height = Math.round(L0.by1 + clamp(w * .34, 124, 250)) + 'px';
    } else st.style.height = '';
    const r = st.getBoundingClientRect(), key = Math.round(r.width) + 'x' + Math.round(r.height);
    if (key !== lastSize) {
      lastSize = key;
      const W = Math.max(280, Math.round(r.width)), H = Math.max(260, Math.round(r.height));
      sv.setAttribute('width', W); sv.setAttribute('height', H); sv.setAttribute('viewBox', `0 0 ${W} ${H}`);
      Lyt = layoutFor(W, H); build();
    }
    if (state.mode === 'parade') renderChart();
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  new ResizeObserver(() => { if (state.mode === 'parade') renderChart(); }).observe($('chart'));
  addEventListener('resize', () => relayout());

  // ======================================================================================
  // Input
  // ======================================================================================
  $('next').onclick = nextPet;
  $('cat').onclick = () => teachLabel('cat');
  $('dog').onclick = () => teachLabel('dog');
  $('mystery').onclick = mystery;
  $('forget').onclick = () => { forget(); steer(['forget'], 'next'); };
  $('go-parade').onclick = () => { setMode('parade'); $('start').focus({preventScroll: true}); };
  $('over').onclick = startOver;
  $('start').onclick = startParade;
  $('stop').onclick = () => { stopParade(); $('start').focus({preventScroll: true}); };
  sv.addEventListener('click', e => { const c = e.target.closest && e.target.closest('.card'); if (c) selectCard(+c.dataset.key); });
  sv.addEventListener('keydown', e => {
    const c = e.target.closest && e.target.closest('.card'); if (!c) return;
    const key = +c.dataset.key;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCard(key); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && state.sel === key) { e.preventDefault(); forget(); $('next').focus({preventScroll: true}); }
    else if (e.key === 'Escape' && state.sel != null) { e.preventDefault(); selectCard(state.sel); }
    else if (/^Arrow/.test(e.key)) {
      const cards = [...S.cards.querySelectorAll('.card')], i = cards.indexOf(c), d = e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1;
      const n = cards[(i + d + cards.length) % cards.length]; if (n) { e.preventDefault(); n.focus({preventScroll: true}); }
    }
  });
  Curio.onMotion(() => repaint());

  Curio.init({clips: "voice:*", rate: .95});   // Read speaks the hint (Curio.voice wires it)

  // ======================================================================================
  // For checking frames and tests
  // ======================================================================================
  // teach(n, labels): put deck cards 1..n on the wall at once (labels: optional list of 'cat'/'dog' overrides)
  function teachNow(n, labels = {}) {
    state.tk++; settle();
    state.wall = []; state.deck = DECK.map((_, i) => i); state.sel = null; state.teach.spot = null;
    for (let i = 0; i < n; i++) { const idx = state.deck.shift(); state.wall.push({key: ++uid, pet: DECK[idx], idx, label: labels[i] || DECK[idx].label}); }
    updateButtons(); drawShelves(); repaint();
    if (state.mode === 'teach') setHint(L[teachHow()]);
  }
  // the scene as a standalone SVG (for preview.svg): Maple in the spotlight with the look-alike line to Marmalade
  function previewSVG(W = 800, H = 500) {
    const keep = {Lyt, S, wall: state.wall, deck: state.deck, spot: state.teach.spot, mode: state.mode};
    const host = document.createElementNS(NS, 'svg');
    teachNow(6);
    state.mode = 'teach';
    const sp = state.teach.spot = {pet: PARADE[0], kind: 'mystery', phase: 'guess', walk: 1, line: 1};
    const g = guessFor(PARADE[0]); sp.guess = g.label; sp.match = g.match;
    host.setAttribute('xmlns', NS); host.setAttribute('viewBox', `0 0 ${W} ${H}`); host.setAttribute('width', W); host.setAttribute('height', H);
    const real = sv;
    Lyt = layoutFor(W, H);
    const svgSave = real.innerHTML;
    build(); host.innerHTML = real.innerHTML;
    for (const e of host.querySelectorAll('[tabindex],[role],[aria-label],[aria-pressed],[data-key]')) ['tabindex', 'role', 'aria-label', 'aria-pressed', 'data-key', 'class'].forEach(a => e.removeAttribute(a));
    for (const e of host.querySelectorAll('.ring')) e.remove();
    const match = state.wall.find(c => c.key === sp.match);
    Object.assign(state, {wall: keep.wall, deck: keep.deck, mode: keep.mode}); state.teach.spot = keep.spot; Lyt = keep.Lyt; real.innerHTML = svgSave; lastSize = ''; relayout();
    return {svg: '<?xml version="1.0" encoding="UTF-8"?>\n' + host.outerHTML.replace(/ class="[^"]*"/g, ''), match: match && match.pet.name};
  }
  window.__tool = {state, setMode, allLines: V.allLines, get vlog() { return V.log; }, get vq() { return V.queue; }, V, DECK, PARADE, L,
    teachNow, guessFor, previewSVG, drawPet, drawPortrait, nextPet, teachLabel, mystery, startParade, stopParade, forget, selectCard, startOver,
    hint: () => $('hint').textContent, layout: () => ({page, ...Lyt}), curio: () => ({sound: Curio.sound, reduce: Curio.reduce})};
  setMode('teach');
})();
</script>
</body>
