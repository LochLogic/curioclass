<style>
:root {

body { height:100dvh; min-height:0; overflow:hidden; grid-template-rows:48px minmax(0,1fr); }
header { height:48px; padding:0 14px; gap:8px; flex-wrap:nowrap; border-bottom:1px solid #5f3b55; }

#motion { width:92px; }

#toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#f0d6e6; color:#21101c;

<body>
<header>
  <h1>Illusion <span>Lab</span><small>YOU ARE THE SUBJECT</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
  <button class="icon-btn" id="read">Read</button>
</header>
<main>
  <nav aria-label="Laboratory stations" id="rail"></nav>
  <section class="work" aria-label="Experiment workbench">
    <div class="worktop">
      <h2 id="station-title">The Bench</h2>
      <div class="tabs" role="tablist" aria-label="Experiment step" id="tabs">
        <button id="tab-do" role="tab" aria-selected="true">Do</button>
        <button id="tab-compare" role="tab" aria-selected="false" disabled>Compare</button>
        <button id="tab-why" role="tab" aria-selected="false" disabled>Why</button>
      </div>
    </div>
    <div id="stage" class="stage"></div>
  </section>
  <aside class="panel" aria-label="Experiment controls">
    <p class="panel-label" id="panel-label">Field instructions</p>
    <div id="controls"></div>
    <p class="hint" id="hint"></p>
    <div id="progress"></div>
    <p class="caption" id="panel-note"></p>
  </aside>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="reset-dialog" aria-labelledby="reset-title">
  <h2 id="reset-title">Clear every result on this device?</h2>
  <div class="row"><button class="btn" id="cancel-reset">Cancel</button><button class="btn primary" id="yes-reset">Yes</button></div>
</dialog>
<script src="kit:curio"></script>

  function lockLine() {
    const r = state.run;

    if (r.length <= r.reference * .5 + .01 || r.length >= r.reference * 1.6 - .01) {

        r.trials.push({
          ...t,
          replay: true
        });
        r.limitReplayed = true;
      }
      toast('At the limit. This trial will run again.');
    } else {
      r.rows.push({
        ...t,
        reference: r.reference,
        set: r.length,
        illusion: (t.dir === 'out' ? r.reference - r.length : r.length - r.reference) / r.reference * 100
      });
    }
    r.i++;
    if (r.i === r.trials.length) {
      if (r.rows.length !== 8) return;

        mean: mean(r.rows.filter(t => t.angle).map(t => t.illusion))

      });

  const lineScale = w => Math.min(1.35, (w - 30) / 790);

  function drawLines() {
    const c = $('experiment');
    if (!c) return;
    const {
      x,
      w,
      h
    } = context(c), r = state.run, t = r.trials[r.i], s = lineScale(w);
    x.fillStyle = '#26262a';
    x.fillRect(0, 0, w, h);

    function figure(length, cx, y, dir) {
      const a = cx - length * s / 2,
        b = cx + length * s / 2;
      x.strokeStyle = '#e6e6e6';
      x.lineWidth = 3;
      x.lineCap = 'round';
      x.beginPath();
      x.moveTo(a, y);
      x.lineTo(b, y);
      if (dir !== 'plain') {
        const dx = Math.cos(t.angle * Math.PI / 360) * 50 * s,
          dy = Math.sin(t.angle * Math.PI / 360) * 50 * s;
        for (const [tip, sign] of [
            [a, dir === 'in' ? 1 : -1],
            [b, dir === 'in' ? -1 : 1]
          ]) {
          x.moveTo(tip + sign * dx, y - dy);
          x.lineTo(tip, y);
          x.lineTo(tip + sign * dx, y + dy);
        }
      }
      x.stroke();
    }
    figure(r.reference, w / 2, h * .34, t.dir === 'plain' ? 'plain' : t.dir === 'in' ? 'out' : 'in');
    figure(r.length, w / 2 + r.offset * s, h * .66, t.dir);
  }

  function renderShadow() {
    const r = state.run;
    canvas().setAttribute('aria-label', 'Checkerboard with square A outside the shadow, square B inside, and a swatch on a plain gray strip.');
    $('controls').innerHTML = `<div class="row">${button('darker','Darker')}${button('lighter','Lighter')}</div>` +

  }

  function adjustShadow(delta) {
    const r = state.run;
    measurement(true);
    r.started = true;
    const v = Math.max(0, Math.min(255, r.value + delta));
    r.moved += Math.abs(v - r.value);
    r.value = v;
    $('lock').disabled = r.moved < 3;
    hint(r.moved < 3 ? 'Keep adjusting the swatch with Lighter or Darker.' : 'When the swatch looks equal, press Lock it in.');
    tone();
    drawShadow();
  }

  function lockShadow() {
    const r = state.run;
    if (r.moved < 3) return;
    stopRepeat();
    if (r.value === 0 || r.value === 255) {
      toast('At the limit, run again.');
      shadowTrial(r);
      render();
      $('lighter').focus({
        preventScroll: true
      });
      return;
    }
    r.rows.push({
      trial: Math.floor(r.i / 2) + 1,
      target: r.i % 2 ? 'B' : 'A',
      value: r.value,
      true: r.i < 2 ? 110 : 121
    });
    r.i++;
    measurement(false);
    if (r.i === 4) finish({
      rows: r.rows
    });
    else {
      shadowTrial(r);
      render();
      $('lighter').focus({
        preventScroll: true
      });
      if (r.i % 2 && !V.heard('ssB')) how('ssB', () => state.run.i % 2 === 1);
    }
    tone();
  }

  function shadowGeometry(w, h) {
    const boardW = w * .77,
      boardH = Math.min(h * .65, boardW * .7),
      ox = w * .04,
      oy = (h - boardH) / 2;
    const point = (col, row) => [ox + boardW * (.12 * (1 - row / 6) + col / 8 * (.76 + .24 * row / 6)), oy + row / 6 * boardH];
    return {
      point,
      boardW,
      boardH,
      ox,
      oy
    };
  }

  function drawShadow() {
    const c = $('experiment');
    if (!c) return;
    const {
      x,
      w,
      h
    } = context(c), r = state.run;
    const trial = state.step === 'do' ? Math.floor(r.i / 2) : +(r.viewTrial || 0);
    const light = trial ? 220 : 200,
      dark = trial ? 121 : 110;
    const g = shadowGeometry(w, h),
      p = g.point;
    const center = (col, row) => p(col + .5, row + .5);
    const A = center(1, 4),
      B = center(4, 2);
    const tile = (col, row, color) => {
      x.beginPath();
      [p(col, row), p(col + 1, row), p(col + 1, row + 1), p(col, row + 1)].forEach(([xx, yy], i) => i ? x.lineTo(xx, yy) : x.moveTo(xx, yy));
      x.closePath();
      x.fillStyle = color;
      x.fill();
    };
    x.fillStyle = '#26262a';
    x.fillRect(0, 0, w, h);
    for (let row = 0; row < 6; row++)
      for (let col = 0; col < 8; col++) {
        const value = (row + col) % 2 === 0 ? light : dark;
        tile(col, row, `rgb(${value},${value},${value})`);
      }
    x.save();
    x.beginPath();
    [p(0, 0), p(8, 0), p(8, 6), p(0, 6)].forEach(([xx, yy], i) => i ? x.lineTo(xx, yy) : x.moveTo(xx, yy));
    x.closePath();
    x.clip();
    x.filter = 'blur(12px)';
    x.fillStyle = 'rgba(0,0,0,.45)';
    x.beginPath();
    x.ellipse(B[0] + g.boardW * .05, B[1] - g.boardH * .1, g.boardW * .23, g.boardH * .55, -.52, 0, Math.PI * 2);
    x.fill();
    x.restore();
    // Exact stimulus interiors are painted after the soft boundary, so both sample pixels are identical.
    tile(1, 4, `rgb(${dark},${dark},${dark})`);
    tile(4, 2, `rgb(${dark},${dark},${dark})`);
    if (!r.hide) {
      const cx = g.ox + g.boardW * .83,
        cy = g.oy + g.boardH * .13,
        radius = g.boardW * .085,
        ch = g.boardH * .33;
      const grad = x.createLinearGradient(cx - radius, 0, cx + radius, 0);
      grad.addColorStop(0, '#617668');
      grad.addColorStop(.35, '#b2c3ad');
      grad.addColorStop(1, '#435547');
      x.fillStyle = '#0004';
      x.beginPath();
      x.ellipse(cx + radius * .4, cy + ch, radius * 1.3, radius * .35, 0, 0, 7);
      x.fill();
      x.fillStyle = grad;
      x.fillRect(cx - radius, cy, radius * 2, ch);
      x.beginPath();
      x.ellipse(cx, cy + ch, radius, radius * .32, 0, 0, Math.PI);
      x.fill();
      x.fillStyle = '#c4d0be';
      x.beginPath();
      x.ellipse(cx, cy, radius, radius * .32, 0, 0, 7);
      x.fill();
      x.strokeStyle = '#e0e5d655';
      x.stroke();
    } else {
      x.fillStyle = '#808080';
      x.fillRect(0, 0, w, h);
      tile(1, 4, `rgb(${dark},${dark},${dark})`);
      tile(4, 2, `rgb(${dark},${dark},${dark})`);
    }
    if (r.bridge) {
      x.strokeStyle = `rgb(${dark},${dark},${dark})`;
      x.lineWidth = Math.max(10, g.boardH * .08);
      x.beginPath();
      x.moveTo(...A);
      x.lineTo(...B);
      x.stroke();
    }
    x.fillStyle = trial ? '#000' : '#fff';
    x.font = `600 ${Math.max(12,Math.min(24,w*.033))}px Segoe UI`;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('A', ...A);
    x.fillText('B', ...B);
    if (state.step === 'do') {
      const sx = w * .85,
        sy = h * .38,
        sw = w * .12,
        sh = h * .24;
      x.fillStyle = '#808080';
      x.fillRect(w * .82, 0, w * .18, h);
      x.fillStyle = `rgb(${r.value},${r.value},${r.value})`;
      x.fillRect(sx, sy, sw, sh);
      x.fillStyle = '#000';
      x.font = `${Math.max(10,Math.min(15,w*.023))}px Segoe UI`;
      x.fillText('Swatch', sx + sw / 2, sy + sh + 20);
    }
    state.shadowPixels = {
      A: {
        x: A[0] + g.boardW * .03,
        y: A[1] + g.boardH * .02
      },
      B: {
        x: B[0] + g.boardW * .03,
        y: B[1] + g.boardH * .02
      },
      trueGray: dark
    };
  }

  function inhibit(input, k) {

  function eyeReady() {
    const r = state.run;
    return r.visited.length === 7 && r.prediction && ['step', 'dark', 'light'].every(p => r.patterns.includes(p));
  }

  function eyeDone() {
    const r = state.run;
    if (r.prediction && r.k === .4 && !r.patterns.includes(r.pattern)) r.patterns.push(r.pattern);
    if ($('eye-compare')) $('eye-compare').disabled = !eyeReady();
    $('progress').textContent = `${r.visited.length} of 7 stages visited; ${r.patterns.length} of 3 patterns tested`;
    eyeGuide();
  }

  function eyeGuide() {
    const r = state.run;
    if (!r.prediction) hint(L.eyeHow);
    else if (r.k < .4) hint('Slide Neighbor inhibition all the way right to test this pattern.');
    else if (r.visited.length < 7) hint('Tap each stage without a check mark to follow the whole pathway.');
    else if (r.patterns.length < 3) hint('Choose an untested Pattern: Step edge, Patch on dark, or Patch on light. Keep the slider all the way right.');
    else hint('All three patterns are tested. Press Compare to review the edge and interior signals.');
  }

  function drawEye() {
    if (!$('eye-canvas')) return;
    const r = state.run,
      {
        x,
        w,
        h
      } = context($('eye-canvas')),
      input = eyeInput(r.pattern),
      output = inhibit(input, r.k);
    x.fillStyle = '#26262a';
    x.fillRect(0, 0, w, h);
    const left = 15,
      right = w - 15,
      top = 30,
      bottom = h - 25,
      dx = (right - left) / 24;
    input.forEach((v, i) => {
      const gray = Math.round(v * 255);
      x.fillStyle = `rgb(${gray},${gray},${gray})`;
      x.fillRect(left + i * dx, 0, dx - 1, 18);
    });
    x.strokeStyle = '#6d6d76';
    x.lineWidth = 1;
    x.beginPath();
    x.moveTo(left, top);
    x.lineTo(left, bottom);
    x.lineTo(right, bottom);
    x.stroke();

    function curve(values, color, dash) {
      x.strokeStyle = color;
      x.lineWidth = 2.5;
      x.setLineDash(dash);
      x.beginPath();
      values.forEach((v, i) => {
        const xx = left + (i + .5) * dx,
          yy = bottom - v * (bottom - top);
        i ? x.lineTo(xx, yy) : x.moveTo(xx, yy);
      });
      x.stroke();
      x.setLineDash([]);
    }
    curve(input, '#b9bec6', [5, 4]);
    if (r.prediction) curve(output, '#f28fc4', []);
    else {
      x.fillStyle = '#eee';
      x.font = '14px Segoe UI';
      x.textAlign = 'center';
      x.fillText('Predict first', w / 2, h * .65);
    }
    if ($('k-value')) $('k-value').textContent = r.prediction ? fmt(r.k, 2) : '';
    if (r.prediction) {
      $('eye-values').textContent = r.pattern === 'step' ?
        `Edge ${fmt(output[11],2)} / ${fmt(output[12],2)}; plateaus ${fmt(output[4],2)} / ${fmt(output[20],2)}` :
        `Patch edge ${fmt(output[8],2)}; patch interior ${fmt(output[11],2)}. Input stays the same inside the patch.`;
    } else $('eye-values').textContent = 'Output is hidden until you commit to Edge or Middle.';
    state.eyeValues = {
      input,
      output: r.prediction ? output : null
    };
  }

    render();
    hint('Tap the change. Or move the scene crosshair with arrow keys, then press Enter.');
    $('picture-box').focus({
      preventScroll: true
    });
    tone();
    drawChange();
  }

  function inSpot(s, x, y) {
    const boxes = [s.box];
    if (s.shift) boxes.push([s.box[0] + s.shift[0], s.box[1] + s.shift[1], s.box[2], s.box[3]]);
    return boxes.some(([bx, by, bw, bh]) => x >= bx - .04 && x <= bx + bw + .04 && y >= by - .04 && y <= by + bh + .04);
  }

  function chooseSpot(x, y) {
    const r = state.run;
    if (r.phase !== 'spot') return;
    if (r.alternations < 1) {
      changeMiss();
      hint(r.manual ? 'See both pictures first. Press Flip, then Spotted it.' : 'See both pictures first, then press Spotted it.');
      return;
    }
    if (inSpot(SCENES[r.order[r.i]], x, y)) {
      r.phase = 'kind';
      render();
      how('scKind', () => r.phase === 'kind', ['#kind-0']);
      $('kind-0').focus({
        preventScroll: true
      });
      tone();
    } else changeMiss();
  }

  function pickKind(kind) {
    const r = state.run;
    if (r.phase !== 'kind') return;
    if (kind === SCENES[r.order[r.i]].kind) endScene(true);
    else {
      r.kindMisses++;
      changeMiss();
    }
  }

  function changeMiss() {
    const r = state.run;
    r.misses++;
    if (r.misses >= 3) endScene(false);
    else {
      measurement(true);
      r.phase = 'running';
      r.nextBeat = performance.now() + 560;
      r.blank = false;
      render();
      hint(r.manual ? 'That location or kind did not match. Press Flip to watch again, then Spotted it.' :
        'That location or kind did not match. Watch again, then press Spotted it.');
      tone();
    }
  }

  function endScene(found) {
    const r = state.run,
      s = SCENES[r.order[r.i]];
    V.hush();
    r.phase = 'done';
    r.blank = false;
    r.rows.push({
      scene: s.base,
      interest: s.interest,
      alternations: r.alternations,
      misses: r.misses,
      found: found && !r.kindMisses,
      located: found,
      kindMisses: r.kindMisses,
      noGap: r.i === 6
    });
    measurement(false);
    render();
    hint(found && !r.kindMisses ? 'Change recorded. Press Next scene.' :
      found ? 'Location recorded; the kind needed correction. Compare the frames, then press Next scene.' :
      'Not found. Compare the two frames, then press Next scene.');
    $('next-scene').focus({
      preventScroll: true
    });
    tone();
  }
  async function nextScene() {
    const r = state.run;
    if (r.phase !== 'done') return;
    if (r.i === 6) {
      finish({
        rows: r.rows,
        practice: r.practice
      }, !r.practice);
      return;
    }
    r.i++;
    r.phase = 'ready';
    r.alternations = 0;
    r.misses = 0;
    r.kindMisses = 0;
    r.frame = 0;
    r.blank = false;
    render();
    if (r.i === 6) {
      const generation = state.generation;
      const earliest = performance.now() + 600 + 62 * L.scNoGap.length;
      hint(L.scNoGap);
      await V.how('scNoGap', {
        wait: true,
        valid: () => state.station === 'change' && r.phase === 'ready'
      });
      await Curio.wait(Math.max(0, earliest - performance.now()));
      while (V.playing?.key === 'scNoGap' || V.queue.some(line => line.key === 'scNoGap')) {
        if (generation !== state.generation) return;
        await Curio.wait(100);
      }
      if (generation !== state.generation) return;
      r.noGapReady = true;
      $('change-start').disabled = false;
      hint('Press Start: No gap. Watch how fast you find this one.');
    } else hint('Press Start for the next scene.');
    $('change-start').focus({
      preventScroll: true
    });
  }

  function manualFlip() {
    const r = state.run;
    if (r.phase !== 'running' || !r.manual || r.blank) return;
    const now = performance.now();
    if (now < (r.nextManualAt || 0)) return;
    // Keep manual blank flashes at the same maximum rate as automatic flicker.
    r.nextManualAt = now + 720;
    if (r.i === 6) {
      r.frame = 1 - r.frame;
      r.alternations++;
      drawChange();
      return;
    }
    r.blank = true;
    r.manualUntil = performance.now() + 160;
    drawChange();
    tone();
  }

  function drawChange() {
    if (!$('change-canvas')) return;
    const r = state.run,
      c = $('change-canvas'),
      {
        x,
        w,
        h
      } = context(c),
      id = r.order[r.i];
    if (!picturesReady) {
      x.fillStyle = '#26262a';
      x.fillRect(0, 0, w, h);
      return;
    }
    if (r.phase === 'ready') {
      x.fillStyle = '#26262a';
      x.fillRect(0, 0, w, h);
      x.fillStyle = '#d4dae4';
      x.textAlign = 'center';
      x.font = '14px Segoe UI';
      x.fillText('Press Start', w / 2, h / 2);
      return;
    }
    if (r.phase === 'done' && !r.rows.at(-1).found) {
      const pictureHeight = h / 2;
      const top = (h - pictureHeight) / 2;
      x.fillStyle = '#26262a';
      x.fillRect(0, 0, w, h);
      x.drawImage(frames[id][0], 0, top, w / 2, pictureHeight);
      x.drawImage(frames[id][1], w / 2, top, w / 2, pictureHeight);
      const s = SCENES[id];
      x.strokeStyle = '#fff';
      x.lineWidth = 2;
      for (let f = 0; f < 2; f++) {
        const shift = s.kind === 2 && f === 1 ? s.shift : [0, 0];
        const box = s.place || s.box;
        x.strokeRect(f * w / 2 + (box[0] + shift[0]) * w / 2,
          top + (box[1] + shift[1]) * pictureHeight, box[2] * w / 2, box[3] * pictureHeight);
      }
      return;
    }
    if (r.blank) {
      x.fillStyle = SCENES[id].average || '#8d8c80';
      x.fillRect(0, 0, w, h);
    } else x.drawImage(frames[id][r.frame], 0, 0, w, h);
    if (r.cross && r.phase === 'spot') {
      const [cx, cy] = r.cross;
      x.strokeStyle = '#fff';
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(cx * w - 12, cy * h);
      x.lineTo(cx * w + 12, cy * h);
      x.moveTo(cx * w, cy * h - 12);
      x.lineTo(cx * w, cy * h + 12);
      x.stroke();
    }
  }
  const TRIGRAMS = ['TLV', 'PGQ', 'LSK', 'WBG', 'SPH', 'NJC', 'VKD', 'RSF', 'NWH', '582'];

  function renderCount() {
    const r = state.run;
    $('stage').innerHTML = '<div class="memory-stage"><div class="memory-card"><div class="memory-word" id="memory-word"></div></div>' +
      '<p class="caption" id="memory-caption"></p><div class="count-bar" id="count-bar"></div></div>';
    progress(r.i, 10);
    if (r.phase === 'ready') {
      $('memory-word').textContent = r.i === 9 ? 'Digits next' : 'Hold it in mind';
      $('memory-caption').textContent = 'No writing. Keep it in your head.';
      $('controls').innerHTML = button('count-start', r.i ? 'Next trial' : 'Start', 'primary');
      $('count-start').onclick = startCount;
      hint(r.i ? L.cbNext : L.cbHow);
    } else if (r.phase === 'show') {
      $('memory-word').textContent = TRIGRAMS[r.i];
      $('memory-caption').textContent = r.i === 9 ? 'Remember these digits.' : 'Remember these letters.';
      hint('Keep it in your head. Counting starts next.');
    } else if (r.phase === 'counting') {
      $('memory-word').textContent = r.number;
      $('memory-caption').textContent = 'Count backward by threes. Tap the next number.';
      $('controls').innerHTML = r.choices.map((v, i) => button('count-choice-' + i, String(v), 'wide')).join('');
      r.choices.forEach((v, i) => $('count-choice-' + i).onclick = () => countChoice(v));
      hint('Tap the number that is three less. Keep counting until recall opens.');
    } else if (r.phase === 'recall') {
      $('memory-word').textContent = 'Recall';
      $('memory-caption').textContent = 'Keep the original order.';
      $('controls').innerHTML = `<label for="recall">Type the three ${r.i===9?'digits':'letters'}</label>` +
        `<input id="recall" type="text" aria-label="Type the three ${r.i===9?'digits':'letters'}" maxlength="3"` +
        ' autocomplete="off" autocorrect="off" spellcheck="false">' +
        button('submit-recall', 'Submit', 'primary');
      $('recall').oninput = () => {
        $('recall').value = $('recall').value.toUpperCase();
      };
      $('submit-recall').onclick = submitCount;
      $('recall').onkeydown = e => {
        if (e.key === 'Enter') submitCount();
      };
      hint(`Type the three ${r.i===9?'digits':'letters'}, then press Submit. An empty answer is a result too.`);
    }
    $('panel-note').textContent = 'Counting matters. Low counting accuracy is marked rehearsal possible and excluded from delay averages.';
  }

  function startCount() {
    const r = state.run;
    if (r.phase !== 'ready') return;
    measurement(true);
    r.started = true;
    r.phase = 'show';
    r.showUntil = performance.now() + 1500;
    r.correctSteps = 0;
    r.steps = 0;
    r.number = Math.floor(rand(300, 1000));
    render();
    $('nav-count').focus({preventScroll:true});
    tone();
  }

  function countChoices() {
    const r = state.run;
    r.choices = shuffle([r.number - 3, r.number - 2, r.number - 4]);
    r.stepUntil = performance.now() + 3000;
  }

  function countChoice(value) {
    const r = state.run;
    if (r.phase !== 'counting') return;
    // Each newly displayed step must be inspected. Fast alternating/mashing cannot manufacture counting accuracy.
    if (performance.now() - r.choiceAt < 250) return;
    r.steps++;
    if (value === r.number - 3) r.correctSteps++;
    r.number = value;
    countChoices();
    r.choiceAt = performance.now();
    render();
    tone();
    $('count-choice-0').focus({
      preventScroll: true
    });
  }

  function countRecall() {
    const r = state.run;
    if (r.phase !== 'counting') return;
    r.phase = 'recall';
    measurement(false);
    render();
    how('cbRecall', () => r.phase === 'recall', ['#recall', '#submit-recall']);
    $('recall').focus({
      preventScroll: true
    });
  }

  function submitCount() {
    const r = state.run;
    if (r.phase !== 'recall') return;
    V.hush();
    const answer = $('recall').value.trim().toUpperCase();
    const right = [...TRIGRAMS[r.i]].filter((c, i) => answer[i] === c).length;
    r.rows.push({
      trial: r.i + 1,
      delay: r.delays[r.i],
      answer,
      right,
      all: right === 3,
      steps: r.steps,
      correct: r.correctSteps,
      accuracy: r.steps ? r.correctSteps / r.steps : 0,
      eligible: r.steps > 0 && r.correctSteps / r.steps >= .7
    });
    r.i++;
    if (r.i === 10) finish({
      rows: r.rows
    });
    else {
      r.phase = 'ready';
      render();
      how('cbNext', () => r.phase === 'ready', ['#count-start']);
      $('count-start').focus({
        preventScroll: true
      });
    }
    tone();
  }
  const LISTS = [
    ['snow', 'cold', 'ice', 'sled', 'mittens', 'frost', 'scarf', 'December', 'freezing', 'coat', 'shovel', 'blizzard', 'boots', 'chilly',
      'snowman'
    ],
    ['sand', 'waves', 'shore', 'ocean', 'towel', 'sun', 'surf', 'shells', 'tide', 'swim', 'umbrella', 'salt', 'coast', 'sunscreen', 'seagull']
  ];

  function recognition() {
    const a = shuffle(['sand', 'waves', 'towel', 'tide', 'sunscreen', 'seagull', 'pencil', 'garden', 'candle', 'ladder', 'violin']);
    a.splice(2 + Math.floor(Math.random() * 8), 0, 'beach');
    return a;
  }
  const normalize = s => s.trim().toLowerCase().replace(/s$/, '');

  function renderWords() {
    const r = state.run;
    $('stage').innerHTML = '<div class="memory-stage"><div class="memory-card"><div class="memory-word" id="memory-word"></div></div>' +
      '<p class="caption" id="memory-caption"></p><div class="chips" id="recall-chips"></div><div class="count-bar" id="count-bar"></div></div>';
    if (r.phase === 'ready') {
      $('memory-word').textContent = 'Just read.';
      $('memory-caption').textContent = 'Let each word arrive. Keep the words in your head.';
      $('controls').innerHTML = button('words-start', 'Start', 'primary');
      $('words-start').onclick = () => startList(0);
      hint(L.wlHow);
    } else if (r.phase === 'list' || r.phase === 'blank') {
      $('memory-word').textContent = r.phase === 'list' ? LISTS[r.list][r.word] : '';
      $('memory-caption').textContent = '';
      $('controls').innerHTML = button('list-restart', 'Start over');
      $('list-restart').onclick = () => {
        r.seenTwice[r.list] = true;
        startList(r.list);
      };
    } else if (r.phase === 'recall') {
      $('memory-word').textContent = 'What stayed?';
      $('memory-caption').textContent = 'Add every word you remember. Remove a chip to change your answer.';
      $('controls').innerHTML = '<label for="word-recall">Type a word</label>' +
        '<input id="word-recall" type="text" aria-label="Type a word" autocomplete="off" autocorrect="off" spellcheck="false">' +
        button('add-word', 'Add word') + button('recall-done', 'Done', 'primary');
      $('add-word').onclick = addWord;
      $('word-recall').onkeydown = e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addWord();
        }
      };
      $('recall-done').onclick = doneRecall;
      drawChips();
      hint('Type a word and press Enter to add it. Press Done when finished.');
    } else if (r.phase === 'list2ready') {
      $('memory-word').textContent = 'A fresh list.';
      $('memory-caption').textContent = 'Read the next list. Then decide which words appeared.';
      $('controls').innerHTML = button('second-list', 'Start next list', 'primary');
      $('second-list').onclick = () => startList(1);
      hint('Press Start next list. Read each word, then use Seen or New in the test.');
    } else if (r.phase === 'recognize' || r.phase === 'tag') {
      $('memory-word').textContent = r.test[r.answers.length];
      $('memory-caption').textContent = r.phase === 'tag' ? 'How does it feel familiar?' : 'Did this word appear in the second list?';
      $('controls').innerHTML = r.phase === 'recognize' ? '<div class="row">' + button('seen', 'Seen') + button('new', 'New') + '</div>' :
        button('picture', 'Picture it', 'wide') + button('know', 'Just know', 'wide') +
        '<p class="caption">Picture it: I can picture it on the screen.<br>Just know: It feels familiar.</p>';
      if (r.phase === 'recognize') {
        $('seen').onclick = () => {
          r.phase = 'tag';
          render();
          $('picture').focus({
            preventScroll: true
          });
          how('wlTag', () => r.phase === 'tag', ['#picture', '#know'], true);
        };
        $('new').onclick = () => answerWord(false, null);
      } else {
        $('picture').onclick = () => answerWord(true, 'Picture it');
        $('know').onclick = () => answerWord(true, 'Just know');
      }
      hint(r.phase === 'tag' ? 'Tap Picture it if you can picture the word on screen, or Just know if it feels familiar.' : L.wlTest);
      $('progress').textContent = `Word ${r.answers.length+1} of 12`;
    }
  }

  function startList(list) {
    const r = state.run;
    measurement(true);
    r.started = true;
    r.list = list;
    r.word = 0;
    r.phase = 'list';
    r.wordAt = performance.now();
    hint('Read each word. The list will finish on its own.');
    render();
    $('list-restart').focus({preventScroll:true});
    tone();
  }

  function drawChips() {
    const r = state.run;
    $('recall-chips').innerHTML = r.recall.map((w, i) => `<button class="chip" id="chip-${i}" aria-label="Remove ${esc(w)}">${esc(w)} ×</button>`)
      .join('');
    r.recall.forEach((w, i) => $('chip-' + i).onclick = () => {
      r.recall.splice(i, 1);
      drawChips();
      $('word-recall').focus({
        preventScroll: true
      });
    });
  }

  function addWord() {
    const r = state.run,
      raw = $('word-recall').value.trim().slice(0, 50);
    if (raw && !r.recall.some(w => normalize(w) === normalize(raw))) r.recall.push(raw);
    $('word-recall').value = '';
    drawChips();
    tone();
    $('word-recall').focus({
      preventScroll: true
    });
  }

  function doneRecall() {
    const r = state.run;
    if (r.phase !== 'recall') return;
    V.hush();
    if ($('word-recall').value.trim()) addWord();
    if (!r.recall.length) toast("Nothing typed. That's a result too.");
    r.phase = 'list2ready';
    measurement(false);
    render();
    how('wlNext', () => r.phase === 'list2ready', ['#second-list']);
    $('second-list').focus({
      preventScroll: true
    });
  }

  function answerWord(seen, tag) {
    const r = state.run;
    V.hush();
    const word = r.test[r.answers.length];
    r.answers.push({
      word,
      seen,
      tag,
      type: word === 'beach' ? 'lure' : LISTS[1].includes(word) ? 'studied' : 'unrelated'
    });
    if (r.answers.length === 12) {
      finish({
        recall: r.recall,
        studied: r.recall.filter(w => LISTS[0].some(s => normalize(s) === normalize(w))).length,
        lureRecall: r.recall.some(w => normalize(w) === 'winter'),
        answers: r.answers,
        seenTwice: r.seenTwice
      });
    } else {
      r.phase = 'recognize';
      render();
      $('seen').focus({
        preventScroll: true
      });
    }
    tone();
  }

  function tick(now) {
    const r = state.run;
    if (r && state.step === 'do') {
      if (state.station === 'change' && r.phase === 'running') {
        if (r.manual) {
          if (r.blank && now >= r.manualUntil) {
            r.blank = false;
            r.frame = 1 - r.frame;
            r.alternations++;
            drawChange();
          }
        } else if (now >= r.nextBeat) {
          if (r.i === 6) {
            r.frame = 1 - r.frame;
            r.alternations++;
            r.nextBeat = now + 560;
          } else if (r.blank) {
            r.blank = false;
            r.frame = 1 - r.frame;
            r.alternations++;
            r.nextBeat = now + 560;
          } else {
            r.blank = true;
            r.nextBeat = now + 160;
          }
          drawChange();
        }
        if (r.alternations >= 83) endScene(false);
      }
      if (state.station === 'count') {
        if (r.phase === 'show' && now >= r.showUntil) {
          r.phase = 'counting';
          r.countEnd = now + r.delays[r.i] * 1000;
          countChoices();
          r.choiceAt = now;
          render();
          $('count-choice-0').focus({
            preventScroll: true
          });
        }
        if (r.phase === 'counting') {
          if (now >= r.countEnd) countRecall();
          else if (now >= r.stepUntil) {
            r.steps++;
            r.number -= 3;
            countChoices();
            r.choiceAt = now;
            render();
          }
          if ($('count-bar')) $('count-bar').style.transform = `scaleX(${Math.max(0,(r.countEnd-now)/(r.delays[r.i]*1000))})`;
        }
      }
      if (state.station === 'words') {
        if (r.phase === 'list' && now - r.wordAt >= 1500) {
          r.word++;
          r.wordAt = now;
          if (r.word === 15) r.phase = 'blank';
          $('memory-word').textContent = r.phase === 'list' ? LISTS[r.list][r.word] : '';
        } else if (r.phase === 'blank' && now - r.wordAt >= 1000) {
          measurement(false);
          if (r.list === 0) {
            r.phase = 'recall';
            r.recallEnd = now + 120000;
            render();
            how('wlRecall', () => r.phase === 'recall', ['#word-recall', '#recall-done']);
            $('word-recall').focus({
              preventScroll: true
            });
          } else {
            r.phase = 'recognize';
            render();
            how('wlTest', () => r.answers.length === 0);
            $('seen').focus({
              preventScroll: true
            });
          }
        }
        if (r.phase === 'recall') {
          if ($('count-bar')) $('count-bar').style.transform = `scaleX(${Math.max(0,(r.recallEnd-now)/120000)})`;
          if (now >= r.recallEnd) doneRecall();
        }
      }
    }
    requestAnimationFrame(tick);
  }

  function svg(body, view = '0 0 700 260', height = null) {
    const description = body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const size = height ? ` style="height:${height}px"` : '';
    return `<svg class="result-chart"${size} data-layout-width="${plotWidth()}" viewBox="${view}" ` +
      `role="img" aria-label="${esc(description)}">${body}</svg>`;
  }

  function plotWidth() {
    const box = $('results'), style = getComputedStyle(box);
    return box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  }

  function lineChart(data) {
    const groups = [45, 90, 135, 0],
      labels = ['45°', '90°', '135°', 'Controls'];
    const vals = groups.map(g => mean(data.rows.filter(t => t.angle === g).map(t => t.illusion)));
    const span = Math.max(10, ...vals.map(v => Math.abs(v || 0))) * 1.3;
    const width = plotWidth();
    if (width < 600) {
      const left = Math.min(66, width * .38), right = width - 10, zero = (left + right) / 2;
      const at = v => zero + v / span * (right - left) / 2;
      let body = '<text x="4" y="18">Illusion size (%)</text>' +
        `<line x1="${zero}" x2="${zero}" y1="34" y2="220" stroke="#e8edf3"/>`;
      groups.forEach((g, i) => {
        const y = 53 + i * 48, px = at(vals[i]);
        const labelX = Math.max(left+18,Math.min(right-22,px));
        body += `<text x="4" y="${y+5}">${labels[i]}</text>` +
          `<line x1="${left}" x2="${right}" y1="${y}" y2="${y}" stroke="#777780"/>` +
          `<circle cx="${px}" cy="${y}" r="5" fill="#f28fc4"/>` +
          `<rect x="${labelX-23}" y="${y-27}" width="46" height="18" fill="#26262a"/>` +
          `<text x="${labelX}" y="${y-12}" text-anchor="middle">${fmt(vals[i])}%</text>`;
      });
      body += '<text x="4" y="244">0: perfect match</text>';
      return svg(body, `0 0 ${width} 260`, 260);
    }
    const y = v => 120 - v / span * 80;
    let body = '<line x1="75" x2="660" y1="120" y2="120" stroke="#e8edf3"/>' +
      '<text x="75" y="22">Illusion size (%)</text><text x="445" y="22">0: perfect match</text>';
    groups.forEach((g, i) => {
      const xx = 140 + i * 155;
      body += `<circle cx="${xx}" cy="${y(vals[i])}" r="6" fill="#f28fc4"/><text x="${xx}" y="220" text-anchor="middle">${labels[i]}</text>` +
        `<text x="${xx}" y="${y(vals[i])-14}" text-anchor="middle">${fmt(vals[i])}%</text>`;
    });
    return svg(body);
  }

  function countChart(data) {
    const width = plotWidth();
    if (width < 600) return compactCountChart(data, width);
    const xx = d => 65 + (d - 3) / 15 * 570,
      yy = p => 205 - p * 1.65;
    let b = '<text x="40" y="20">All three in order (%)</text>';
    [0,50,100].forEach(p => {
      b += `<text x="50" y="${yy(p)+4}" text-anchor="end">${p}</text>` +
        `<line x1="65" x2="635" y1="${yy(p)}" y2="${yy(p)}" stroke="#55545e"/>`;
    });
    b += `<path d="M${xx(3)} ${yy(80)}L${xx(18)} ${yy(10)}" stroke="#5aa9ff" stroke-dasharray="6 5" fill="none"/>`;
    for (const [d, p] of [
        [3, 80],
        [18, 10]
      ]) {
      const x = xx(d),
        y = yy(p);
      b += `<path d="M${x} ${y-7}l7 7-7 7-7-7Z" fill="none" stroke="#5aa9ff" stroke-width="2"/>`;
    }
    [3, 6, 9, 12, 15, 18].forEach(d => {
      const rows = data.rows.filter(r => r.trial > 1 && r.trial < 10 && r.delay === d && r.eligible);
      if (rows.length) b += `<circle cx="${xx(d)}" cy="${yy(mean(rows.map(r=>r.all?100:0)))}" r="6" fill="#f28fc4"/>`;
      b += `<text x="${xx(d)}" y="230" text-anchor="middle">${d}s</text>`;
    });
    for (const [idx, offset, name] of [
        [0, -18, 'First trial'],
        [9, 18, 'Switched to digits']
      ]) {
      const r = data.rows[idx],
        x = xx(r.delay) + offset,
        y = yy(r.all ? 100 : 0);
      b += `<circle cx="${x}" cy="${y}" r="8" fill="${r.eligible?'#f28fc4':'#26262a'}" stroke="#f28fc4" stroke-width="2"/>` +
      `<text x="${x}" y="${y+4}" text-anchor="middle" style="font-size:10px;fill:${r.eligible?'#1f0a16':'#f28fc4'}">${idx?10:1}</text>`;
    }
    b += '<text x="65" y="258">1: First trial</text><text x="330" y="258">10: Switched to digits</text>' +
      '<text x="40" y="288">◇ Peterson and Peterson 1959, approximate: 80% at 3s; 10% at 18s</text>';
    return svg(b, '0 0 720 308');
  }

  function compactCountChart(data, width) {
    const at = delay => 30 + (delay - 3) / 15 * (width - 58);
    const yy = percent => 185 - percent * 1.4;
    let body = '<text x="4" y="18">All three in order (%)</text>';
    [0,50,100].forEach(p => {
      body += `<text x="0" y="${yy(p)+4}" style="font-size:10px">${p}</text>` +
        `<line x1="25" x2="${width-12}" y1="${yy(p)}" y2="${yy(p)}" stroke="#55545e"/>`;
    });
    body += `<path d="M${at(3)} ${yy(80)}L${at(18)} ${yy(10)}" stroke="#5aa9ff" stroke-dasharray="6 5" fill="none"/>`;
    for (const [delay,p] of [[3,80],[18,10]]) {
      const x = at(delay), y = yy(p);
      body += `<path d="M${x} ${y-5}l5 5-5 5-5-5Z" fill="none" stroke="#5aa9ff" stroke-width="2"/>`;
    }
    [3,6,9,12,15,18].forEach(delay => {
      const rows = data.rows.filter(r => r.trial > 1 && r.trial < 10 && r.delay === delay && r.eligible);
      if (rows.length) body += `<circle cx="${at(delay)}" cy="${yy(mean(rows.map(r=>r.all?100:0)))}" r="5" fill="#f28fc4"/>`;
      body += `<text x="${at(delay)}" y="206" text-anchor="middle" style="font-size:10px">${delay}s</text>`;
    });
    [0,9].forEach((index,i) => {
      const row = data.rows[index], x = at(row.delay) + (i ? 14 : -14), y = yy(row.all ? 100 : 0);
      body += `<circle cx="${x}" cy="${y}" r="8" fill="${row.eligible?'#f28fc4':'#26262a'}" stroke="#f28fc4" stroke-width="2"/>` +
        `<text x="${x}" y="${y+4}" text-anchor="middle" style="font-size:10px;fill:${row.eligible?'#1f0a16':'#f28fc4'}">${index+1}</text>`;
    });
    body += '<text x="4" y="232">1: First trial</text><text x="4" y="251">10: Switched to digits</text>' +
      '<text x="4" y="276" style="font-size:11px">◇ Peterson and Peterson</text>' +
      '<text x="4" y="292" style="font-size:11px">1959, approximate:</text>' +
      '<text x="4" y="308" style="font-size:11px">80% at 3s; 10% at 18s</text>';
    return svg(body, `0 0 ${width} 325`, 325);
  }

  function shadowBars(d) {
    const width = plotWidth();
    if (width < 600) {
      let body = '<text x="4" y="18">Your A and B matches</text>';
      for (let trial = 0; trial < 2; trial++) {
        const A = d.rows[trial*2], B = d.rows[trial*2+1], y = 48 + trial * 108;
        body += `<text x="4" y="${y}">Trial ${trial+1}: A ${A.value}, B ${B.value}</text>`;
        for (const [row,value] of [[0,A.value],[1,B.value]]) {
          body += `<text x="4" y="${y+23+row*22}">${row?'B':'A'}</text>` +
            `<rect x="22" y="${y+10+row*22}" width="${value/255*(width-30)}" height="17" fill="${row?'#b9b9c4':'#f28fc4'}"/>`;
        }
        const reference = 22 + A.true/255*(width-30);
        body += `<line x1="${reference}" x2="${reference}" y1="${y+6}" y2="${y+53}" stroke="#fff" stroke-width="2"/>` +
          `<text x="4" y="${y+75}">B minus A: ${B.value-A.value}</text>`;
      }
      body += '<text x="4" y="264">White line: true gray.</text>' +
        '<text x="4" y="283">110, then 121 sRGB steps.</text>';
      return svg(body, `0 0 ${width} 300`, 300);
    }
    let b = '<text x="25" y="25">Your matches (sRGB steps), beside the shared true gray</text>';
    for (let trial = 0; trial < 2; trial++) {
      const A = d.rows[trial * 2],
        B = d.rows[trial * 2 + 1],
        y = 65 + trial * 95;
      b += `<text x="25" y="${y}">Trial ${trial+1}</text><rect x="120" y="${y-20}" width="${A.value*1.5}" height="22" fill="#f28fc4"/>` +
        `<rect x="120" y="${y+8}" width="${B.value*1.5}" height="22" fill="#b9b9c4"/>` +
        `<line x1="${120+A.true*1.5}" x2="${120+A.true*1.5}" y1="${y-28}" y2="${y+35}" stroke="#fff" stroke-width="2"/>` +
        `<text x="510" y="${y-3}">A ${A.value} / B ${B.value}</text><text x="510" y="${y+22}">B minus A: ${B.value-A.value}</text>`;
    }
    b += '<text x="25" y="245">White line: true gray, 110 then 121. Orchid: your A. Gray: your B.</text>';
    return svg(b);
  }

  function keyNumber(id, d) {
    if (id === 'lines') return `${fmt(d.mean)}% mean fin illusion`;
    if (id === 'shadow') return `B minus A: ${d.rows[1].value-d.rows[0].value}, ${d.rows[3].value-d.rows[2].value} steps`;
    if (id === 'eye') return `Predicted ${d.prediction}; all patterns tested`;
    if (id === 'change') {
      const c = mean(d.rows.filter(r => r.interest === 'central' && !r.noGap && uncuedFind(r)).map(r => r.alternations));
      const m = mean(d.rows.filter(r => r.interest === 'marginal' && !r.noGap && uncuedFind(r)).map(r => r.alternations));
      const noGap = d.rows.find(row => row.noGap) || d.rows[6];
      const status = uncuedFind(noGap) ? `${noGap.alternations} alternations` :
        noGap.located ? 'Located; kind corrected' : noGap.found ? 'Found (earlier method)' : 'Not found';
      return `Central ${fmt(c)}, marginal ${fmt(m)}; no gap ${status}`;
    }
    if (id === 'count') return `${d.rows.filter(r=>r.all).length} of 10 all in order; ${d.rows.filter(r=>!r.eligible).length} hollow`;
    const lure = d.answers.find(a => a.type === 'lure');
    return `Lure recalled: ${d.lureRecall?'yes':'no'}; recognized: ${lure.seen?'Seen, '+lure.tag:'New'}`;
  }

  function uncuedFind(row) {
    // Earlier records do not distinguish a wrong location from a corrected kind.
    return row.found && (row.misses === 0 || row.kindMisses === 0);
  }

      '<p>This is a historical group of DNA exonerations. It is not a percentage of all witnesses or all convictions.</p>' +
      `<h3>${d?.lureRecall?'Your recall included an unshown word.':'A false word can feel real.'} What should a jury hear before trusting a confident witness?</h3>` +
      '<p class="source">Loftus and Palmer 1974. Innocence Project, DNA Exonerations in the United States (1989 to 2020).</p></article>';
    if ($('eyewitness-words')) $('eyewitness-words').onclick = () => setMode('words');
    $('controls').innerHTML = button('eyewitness-notebook', 'Notebook');
    $('eyewitness-notebook').onclick = () => setMode('notebook');
    hint(L.ewHow);
    $('panel-note').textContent = 'Discuss the evidence and its limits. This station has no score and asks for no personal testimony.';
  }

  function setStep(step) {
    if (!IDS.includes(state.station) || step !== 'do' && !result()) return;
    if (step === 'do' && state.run.complete) {
      runAgain();
      return;
    }
    if (state.measuring) return;
    const origin = document.activeElement;
    V.hush();
    state.step = step;
    render();
    if (origin && !origin.isConnected) $('tab-' + step).focus({preventScroll:true});
    tone();
  }

  function runAgain() {
    V.hush();
    state.generation++;
    measurement(false);
    state.run = newRun(state.station);
    state.step = 'do';
    render();
    focusControls();
    how(HOW[state.station]);
  }

  function draw() {
    if (state.step === 'compare' && $('results')) {
      const chart = $('results').querySelector('.result-chart');
      const redraw = {lines:lineChart, shadow:shadowBars, count:countChart, words:wordChart}[state.station];
      if (chart && redraw && Math.abs(+chart.dataset.layoutWidth - plotWidth()) > .5) {
        chart.outerHTML = redraw(result());
      }
    }
    if (state.station === 'lines' && state.step === 'do') drawLines();
    if (state.station === 'shadow' && state.step !== 'why') drawShadow();
    if (state.station === 'eye' && state.step === 'do') drawEye();
    if (state.station === 'change' && state.step === 'do') drawChange();
  }
  buildRail();
  for (const step of ['do', 'compare', 'why']) $('tab-' + step).onclick = () => setStep(step);
  $('cancel-reset').onclick = () => {
    $('reset-dialog').close();
    $('reset-all').focus({
      preventScroll: true
    });
  };
  $('yes-reset').onclick = () => {
    db = {};
    state.records = db;
    persist();
    $('reset-dialog').close();
    render();
    toast('All saved results cleared.');
    $('reset-all').focus({
      preventScroll: true
    });
  };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select') || state.step !== 'do') return;
    if (state.station === 'lines' && ['ArrowLeft', 'ArrowRight'].includes(e.key)) {
      e.preventDefault();
      adjustLine(e.key === 'ArrowLeft' ? -1 : 1);
    }
    if (state.station === 'shadow' && ['ArrowUp', 'ArrowDown'].includes(e.key)) {
      e.preventDefault();
      adjustShadow(e.key === 'ArrowUp' ? 2 : -2);
    }
    if (state.station === 'change' && e.code === 'Space') {
      e.preventDefault();
      spotted();
    }
  });
  Curio.init({
    clips: "voice:*",
    rate: .96,
    readFallback: () => $('hint').textContent
  });
  Curio.onMotion(reduced => {
    if (reduced && state.station === 'change' && state.step === 'do') {
      state.run.manual = true;
      state.run.blank = false;
      if ($('manual')) $('manual').setAttribute('aria-pressed', 'true');
      if ($('flip')) $('flip').disabled = state.run.phase !== 'running';
      if (state.run.phase === 'running') hint('Press Flip to compare the pictures. When you see the change, press Spotted it.');
      drawChange();
    }
  });
  // Read must not introduce speech into a measurement even when invoked from the keyboard.
  $('read').addEventListener('click', e => {
    if (state.measuring) {
      e.stopImmediatePropagation();
      V.hush();
    }
  }, true);
  new ResizeObserver(draw).observe($('stage'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.measuring && ['count', 'words'].includes(state.station)) {
      state.generation++;
      measurement(false);
      state.run = newRun(state.station);
      render();
      toast('The timed run was interrupted. Press Start for a fresh run.');
    }
  });
  window.__tool = {
    state,
    setMode,
    allLines: () => V.allLines(),
    vlog: V.log,
    get vq() {
      return V.queue;
    },
    inhibit,
    eyeInput,
    SCENES,
    normalize,
    get picturesReady() {
      return picturesReady;
    }
  };
  render();
  preload();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
