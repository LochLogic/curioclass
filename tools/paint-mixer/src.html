<title>Paint Mixer · Color theory and mixing · Curio Class</title>
<meta name="description" content="Mix virtual paint that behaves like the real thing: red, yellow and blue make the secondary and tertiary colors, white makes tints, black makes shades. Build the color wheel, paint a picture in one color, and mix to match target colors.">
<!--
PAINT MIXER (Curio Class)
Visual arts, grades 3-5, National Core Arts Standards VA:Cr2 (experiment with materials and approaches),
module "Color Theory and Mixing": the color wheel, warm and cool, tints and shades.
Mix: dab red, yellow, blue, white and black into the dish and stir. A checklist of discoveries ticks itself off
(orange, green, violet, a tertiary, a tint, a shade, brown). Save swatches with their recipes.
Color wheel: the 12-color wheel mixed from three primaries, with primary/secondary/tertiary labels, warm and
cool halves, complementary pairs and rings of tints and shades. Tap a color to mix it.
Tints and shades: a value ladder for any wheel color and a landscape painted only with that color.
Match: mix to match a target color in four levels, with stars and hints.
The paint is modeled, not faked: each paint has a reflectance curve across the visible spectrum and they mix
by Kubelka-Munk theory (absorption over scattering adds up), then convert through the CIE 1931 observer to screen
color. That is why blue and yellow make green here, red is stronger than yellow, and real-paint purples are dull.
Illustrations generated with Google Gemini, edited for Curio Class. Sound synthesized in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<style>

<body>
<header>
  <h1>Paint Mixer <small>Mix real-acting paint: primaries, secondaries, tints and shades.</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<div class="stagewrap" id="stagewrap">
  <div class="scene" id="scene">
    <img class="bg" src="art:table" alt="">
    <div class="top">
      <div class="tabs" role="group" aria-label="Mode">
        <button data-mode="mix" aria-pressed="true">🎨 Mix</button>
        <button data-mode="wheel" aria-pressed="false">🌈 Color wheel</button>
        <button data-mode="value" aria-pressed="false">◐ Tints and shades</button>
        <button data-mode="match" aria-pressed="false">🎯 Match</button>
      </div>
    </div>
    <div class="paints" id="paints" role="group" aria-label="Paints"></div>
    <div class="dish" id="dish"><canvas id="well" width="360" height="360" aria-label="Mixing dish"></canvas><div class="gloss"></div><div class="empty" id="empty">Tap a paint to add a dab</div></div>
    <div class="recipe" id="recipe" aria-live="polite"></div>
    <div class="wellbtns">
      <button class="b" id="undo">↶ Undo dab</button>
      <button class="b" id="clean">🧽 Clean dish</button>
    </div>
    <div class="panel" id="panel"></div>
    <div class="say" id="say" aria-live="polite"></div>
    <img class="raccoon" id="raccoon" src="art:raccoon" alt="Raccoon painter">
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));
  const anim = (el, kf, opt) => { if (reduce || !el.animate) return; el.animate(kf, opt); };

  // ---------- paint engine: Kubelka-Munk mixing of reflectance curves ----------
  // Each paint is a reflectance curve over the visible spectrum. Paints mix by adding their absorption-to-
  // scattering ratios (K/S), the way real pigments do, so blue and yellow really make green.
  const WL = []; for (let w = 380; w <= 730; w += 5) WL.push(w);
  const g = (x, mu, s1, s2) => { const t = (x - mu) / (x < mu ? s1 : s2); return Math.exp(-.5 * t * t); };
  // CIE 1931 color matching functions (multi-lobe fit by Wyman, Sloan and Shirley)
  const XB = WL.map(l => 1.056 * g(l, 599.8, 37.9, 31) + .362 * g(l, 442, 16, 26.7) - .065 * g(l, 501.1, 20.4, 26.2));
  const YB = WL.map(l => .821 * g(l, 568.8, 46.9, 40.5) + .286 * g(l, 530.9, 16.3, 31.1));
  const ZB = WL.map(l => 1.217 * g(l, 437, 11.8, 36) + .681 * g(l, 459, 26, 13.8));
  const sum = a => a.reduce((s, v) => s + v, 0), XW = sum(XB), YW = sum(YB), ZW = sum(ZB);
  const sig = x => 1 / (1 + Math.exp(-x));
  const curve = f => WL.map(f);
  const PAINTS = {
    red:    {name: 'Red', tip: 'primary', strength: .55, R: curve(l => .04 + .86 * sig((l - 600) / 10) + .14 * sig((440 - l) / 12))},
    yellow: {name: 'Yellow', tip: 'primary', strength: 1.15, R: curve(l => .05 + .87 * sig((l - 505) / 12))},
    blue:   {name: 'Blue', tip: 'primary', strength: .8, R: curve(l => .035 + .55 * g(l, 460, 40, 52) + .2 * sig((l - 655) / 14))},
    white:  {name: 'White', tip: 'makes tints', strength: 3, R: curve(() => .93)},
    black:  {name: 'Black', tip: 'makes shades', strength: .3, R: curve(() => .035)},
  };
  const IDS = Object.keys(PAINTS), HUES = ['red', 'yellow', 'blue'];
  const ks = r => (1 - r) * (1 - r) / (2 * r), unks = k => 1 + k - Math.sqrt(k * k + 2 * k);
  for (const p of Object.values(PAINTS)) p.KS = p.R.map(ks);
  function mixCurve(rec) {
    let tot = 0; const k = WL.map(() => 0);
    for (const [id, n] of Object.entries(rec)) {
      if (!n) continue; const p = PAINTS[id], w = n * p.strength; tot += w;
      for (let i = 0; i < k.length; i++) k[i] += w * p.KS[i];
    }
    if (!tot) return null;
    return k.map(v => unks(v / tot));
  }
  function curveXYZ(R) {
    let X = 0, Y = 0, Z = 0;
    for (let i = 0; i < R.length; i++) { X += R[i] * XB[i]; Y += R[i] * YB[i]; Z += R[i] * ZB[i]; }
    return [X / XW * .9505, Y / YW, Z / ZW * 1.089];
  }
  const gam = v => { v = Math.max(0, v); return v <= .0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - .055; };
  function xyzRGB([X, Y, Z]) {
    const r = 3.2406 * X - 1.5372 * Y - .4986 * Z, gg = -.9689 * X + 1.8758 * Y + .0415 * Z, b = .0557 * X - .204 * Y + 1.057 * Z;
    return [r, gg, b].map(v => Math.round(Math.min(1, gam(v)) * 255));
  }
  function xyzLab([X, Y, Z]) {
    const f = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
    const fx = f(X / .9505), fy = f(Y), fz = f(Z / 1.089);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }
  const cache = {};
  function mix(rec) {
    const key = IDS.map(i => rec[i] || 0).join(','); if (cache[key]) return cache[key];
    const R = mixCurve(rec); if (!R) return null;
    const xyz = curveXYZ(R), rgb = xyzRGB(xyz);
    return cache[key] = {rgb, lab: xyzLab(xyz), css: `rgb(${rgb.join(',')})`};
  }
  const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

  // ---------- naming what is in the dish ----------
  const PAIR = {
    'red,yellow': ['orange', 'red-orange', 'yellow-orange'],
    'blue,yellow': ['green', 'blue-green', 'yellow-green'],
    'blue,red': ['violet', 'blue-violet', 'red-violet'],
  };
  function hueOf(rec) {
    const hs = HUES.filter(h => rec[h]);
    if (!hs.length) return null;
    if (hs.length === 1) return {name: hs[0], kind: 'primary'};
    if (hs.length === 3) {
      const tot = sum(hs.map(h => rec[h])), top = hs.reduce((a, b) => rec[a] >= rec[b] ? a : b);
      return {name: rec[top] / tot >= .6 ? `${top === 'red' ? 'reddish' : top === 'yellow' ? 'yellowish' : 'bluish'} brown` : 'brown', kind: 'brown'};
    }
    const key = [...hs].sort().join(','), [a, b] = key.split(','), ra = rec[a], rb = rec[b], hi = ra >= rb ? a : b, ratio = Math.max(ra, rb) / Math.min(ra, rb);
    const [sec, t1, t2] = PAIR[key];
    if (ratio < 1.5) return {name: sec, kind: 'secondary'};
    if (ratio <= 3) return {name: hi === a ? t1 : t2, kind: 'tertiary'};
    return {name: `${hi} with a little ${hi === a ? b : a}`, kind: 'lean'};
  }
  function describe(rec) {
    const h = hueOf(rec), w = rec.white || 0, k = rec.black || 0;
    if (!h) {
      if (w && k) return {name: w / (w + k) > .6 ? 'light gray' : w / (w + k) < .4 ? 'dark gray' : 'gray', how: 'white + black make gray', kind: 'gray'};
      if (w) return {name: 'white', how: 'white makes tints', kind: 'white'};
      if (k) return {name: 'black', how: 'black makes shades', kind: 'black'};
      return null;
    }
    const how = {primary: 'a primary color: you can\'t mix it from other paints', secondary: 'a secondary color: two primaries mixed evenly',
      tertiary: 'a tertiary color: a primary next to a secondary', brown: 'all three primaries together make brown', lean: 'mostly one primary'}[h.kind];
    let name = h.name, kind = h.kind, extra = how;
    if (w && k) { name = `grayish ${h.name}`; kind = 'tone'; extra = `a tone: ${h.name} + gray`; }
    else if (w) { name = h.name === 'red' ? 'pink (light red)' : `light ${h.name}`; kind = 'tint'; extra = `a tint: ${h.name} + white`; }
    else if (k) { name = `dark ${h.name}`; kind = 'shade'; extra = `a shade: ${h.name} + black`; }
    return {name, how: extra, kind, hue: h};
  }
  const cap = s => s[0].toUpperCase() + s.slice(1);

  // ---------- sound ----------
  let ac = null, soundOn = true;
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').textContent = soundOn ? '🔔 Sound' : '🔕 Sound'; };
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; }
  function plop(pitch = 1) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), gn = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(420 * pitch, t); o.frequency.exponentialRampToValueAtTime(120 * pitch, t + .12);
    gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(.35, t + .01); gn.gain.exponentialRampToValueAtTime(.0001, t + .18);
    o.connect(gn).connect(c.destination); o.start(t); o.stop(t + .2);
  }
  function swish(dur = .9) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime, n = c.createBufferSource(), b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = b; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(500, t); for (let i = 1; i <= 4; i++) f.frequency.linearRampToValueAtTime(i % 2 ? 1400 : 600, t + dur * i / 4);
    const gn = c.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(.09, t + .1); gn.gain.linearRampToValueAtTime(.0001, t + dur);
    n.connect(f).connect(gn).connect(c.destination); n.start(t);
  }
  function chime(good) {
    const c = soundOn && ctx(); if (!c) return;
    (good ? [523, 659, 784, 1047] : [440, 392]).forEach((f, i) => {
      const t = c.currentTime + i * .1, o = c.createOscillator(), gn = c.createGain();
      o.type = 'triangle'; o.frequency.value = f; gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(.2, t + .01); gn.gain.exponentialRampToValueAtTime(.0001, t + .5);
      o.connect(gn).connect(c.destination); o.start(t); o.stop(t + .55);
    });
  }

  // ---------- the paints ----------

      <path d="M0 168 Q120 118 250 150 T520 140 T640 150 V236 H0Z" fill="${t1}"/>
      <path d="M0 196 Q160 160 330 186 T640 180 V236 H0Z" fill="${base}"/>
      <rect x="120" y="120" width="14" height="72" fill="${s2}"/><circle cx="127" cy="110" r="34" fill="${s1}"/><circle cx="112" cy="122" r="20" fill="${s1}"/><circle cx="144" cy="120" r="22" fill="${s2}"/>
      <path d="M380 196 l40 -46 l40 46z" fill="${s1}"/><rect x="392" y="196" width="56" height="2" fill="${s3}"/>
      <path d="M0 220 Q200 200 640 216 V236 H0Z" fill="${s3}"/></svg>`;
  }

  // ===== Match =====
  const LEVELS = [
    {name: 'Secondary', targets: [['Orange', {red: 1, yellow: 1}], ['Green', {yellow: 1, blue: 1}], ['Violet', {red: 1, blue: 1}]]},
    {name: 'Tertiary', targets: [['Red-orange', {red: 2, yellow: 1}], ['Yellow-orange', {yellow: 3, red: 1}], ['Yellow-green', {yellow: 2, blue: 1}],
      ['Blue-green', {blue: 2, yellow: 1}], ['Blue-violet', {blue: 2, red: 1}], ['Red-violet', {red: 2, blue: 1}]]},
    {name: 'Tints and shades', targets: [['Bubblegum pink', {red: 1, white: 2}], ['Sky blue', {blue: 1, white: 3}], ['Navy', {blue: 3, black: 1}],
      ['Lemonade', {yellow: 2, white: 2}], ['Forest green', {yellow: 1, blue: 1, black: 1}], ['Lavender', {red: 1, blue: 1, white: 3}], ['Maroon', {red: 3, black: 1}]]},
    {name: 'Tricky', targets: [['Chocolate', {red: 2, yellow: 1, blue: 1}], ['Peach', {red: 1, yellow: 2, white: 3}], ['Olive', {yellow: 3, blue: 1, black: 1}],
      ['Mint', {yellow: 1, blue: 1, white: 4}], ['Storm gray', {white: 2, black: 1, blue: 1}], ['Pumpkin', {red: 2, yellow: 3}], ['Teal', {blue: 3, yellow: 2}]]},
  ];
  let lvl = 0, tgt = null, matched = 0, checked = false, order = [];
  function renderMatch() {
    $('panel').innerHTML = `<div class="card"><div class="levels" id="levels">${LEVELS.map((l, i) => `<button class="b" data-lv="${i}">${i + 1}. ${l.name}</button>`).join('')}</div>
      <div class="target"><div class="tdisc" id="tdisc"><div class="half2" id="mine" style="width:0"></div><span class="lbl" id="lt" style="left:30px">target</span><span class="lbl" id="ly" style="right:30px" hidden>yours</span></div>
      <div class="tinfo"><div style="font:700 16px 'Segoe UI';color:var(--muted)">Mix this color:</div><div class="tn" id="tn"></div><div class="stars" id="stars"></div><p id="tp"></p></div></div>
      <div class="mbtns"><button class="b go" id="chk">✔ Check my mix</button><button class="b" id="hint">💡 Hint</button><button class="b pur" id="next">Next color ▶</button><span class="tally" id="tally"></span></div></div>`;
    $('levels').querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { lvl = +b.dataset.lv; order = []; newTarget(); });
    $('chk').onclick = check; $('hint').onclick = hint; $('next').onclick = newTarget;
    if (!tgt) newTarget(); else drawTarget();
  }
  function newTarget() {
    if (!order.length) { order = LEVELS[lvl].targets.map((_, i) => i).sort(() => Math.random() - .5); if (tgt && order[0] === tgt.i && order.length > 1) order.push(order.shift()); }
    const i = order.shift(), [name, r] = LEVELS[lvl].targets[i];
    tgt = {i, name, rec: r, c: mix(r)}; checked = false; setDabs([], false); drawTarget();
    say(`Can you mix <b>${name.toLowerCase()}</b>? Add dabs to the dish, then press <b>Check my mix</b>. ${lvl === 0 ? 'Which two primaries make it?' : lvl === 2 ? 'Do you need white, or black?' : ''}`);
  }
  function drawTarget() {
    $('levels').querySelectorAll('[data-lv]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.lv === lvl));
    $('tdisc').style.background = tgt.c.css; $('tn').textContent = tgt.name;
    $('mine').style.width = checked ? '50%' : '0'; $('ly').hidden = !checked;
    if (!checked) { $('stars').innerHTML = ''; $('tp').textContent = ''; }
    $('tally').textContent = matched ? `⭐ ${matched} matched` : '';
  }
  function matchAfter() { if (checked) { checked = false; drawTarget(); } }
  function starsFor(d) { return d < 6 ? 3 : d < 11 ? 2 : d < 17 ? 1 : 0; }
  function check() {
    if (!mixed) return say('The dish is empty. Add some paint first!');
    const d = dE(mixed.lab, tgt.c.lab), st = starsFor(d);
    checked = true; drawTarget(); $('mine').style.background = mixed.css;
    $('stars').innerHTML = [0, 1, 2].map(i => `<span class="${i < st ? '' : 'off'}">⭐</span>`).join('');
    anim($('mine'), [{opacity: 0}, {opacity: 1}], {duration: 300});
    if (st === 3) { matched++; chime(true); $('tally').textContent = `⭐ ${matched} matched`; $('tp').textContent = `Recipe: ${IDS.filter(k => tgt.rec[k]).map(k => tgt.rec[k] + ' ' + k).join(' + ')}`; say(`A perfect match! ${cap(tgt.name)} is ${IDS.filter(k => tgt.rec[k]).map(k => tgt.rec[k] + ' ' + k).join(' + ')}. Press <b>Next color</b>.`); }
    else { chime(false); $('tp').textContent = st ? 'Close! Look at both halves.' : 'Not yet. Compare the two halves.'; say(compare(mixed.lab, tgt.c.lab) + ' Press <b>Hint</b> if you are stuck.'); }
  }
  function compare(m, t) {
    const dl = m[0] - t[0], parts = [];
    if (Math.abs(dl) > 6) parts.push(dl > 0 ? 'Yours is <b>lighter</b> than the target.' : 'Yours is <b>darker</b> than the target.');
    const cm = Math.hypot(m[1], m[2]), ct = Math.hypot(t[1], t[2]);
    if (ct - cm > 10) parts.push('Yours is <b>duller</b>. Did a third primary sneak in?');
    const hm = Math.atan2(m[2], m[1]), ht = Math.atan2(t[2], t[1]); let dh = (hm - ht) * 180 / Math.PI; dh = ((dh + 540) % 360) - 180;
    if (Math.abs(dh) > 12 && cm > 12 && ct > 12) parts.push('The color itself is a bit off.');
    return parts.join(' ') || 'Very close!';
  }
  // hint: the single dab change (add one, or take one away) that gets closest to the target
  function hint() {
    let best = null;
    const tryRec = (r, txt) => { const c = mix(r); if (!c) return; const d = dE(c.lab, tgt.c.lab); if (!best || d < best.d) best = {d, txt}; };
    if (dabs.length < MAXDABS) IDS.forEach(k => tryRec(addRec(rec, {[k]: 1}), `adding a dab of <b>${k}</b>`));
    IDS.forEach(k => { if (rec[k]) { const r = {...rec, [k]: rec[k] - 1}; tryRec(r, `taking out one <b>${k}</b> dab (press Undo if it was the last one, or clean and remix)`); } });
    if (!mixed) { const first = IDS.filter(k => tgt.rec[k]); return say(`Start with <b>${first.slice(0, 2).join(' and ')}</b>.`); }
    const now = dE(mixed.lab, tgt.c.lab);
    if (!best || best.d >= now - .5) return say(`You're as close as one dab can get you. Try <b>cleaning the dish</b> and mixing ${IDS.filter(k => tgt.rec[k]).join(', ')} again in different amounts.`);
    say(`Try ${best.txt}.`);
  }

  // keyboard: 1-5 add paints, backspace undoes, c cleans
  addEventListener('keydown', e => {
    if (e.target.closest('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
    const n = +e.key; if (n >= 1 && n <= 5) { addDab(IDS[n - 1]); e.preventDefault(); }
    else if (e.key === 'Backspace') { $('undo').click(); e.preventDefault(); }
    else if (e.key === 'c' || e.key === 'C') $('clean').click();
  });

  setDabs([], false); setMode('mix');
  window.__pm = {mix, describe, addDab, setDabs, setMode, WHEEL, LEVELS, get rec() { return rec; }, get tgt() { return tgt; }, check, hint, pickWedge, wview, newTarget, set lvl(v) { lvl = v; order = []; }};
})();
</script>
