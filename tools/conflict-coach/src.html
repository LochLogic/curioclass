<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conflict Coach · Say the hard thing two ways · Curio Class</title>
<meta name="description" content="Replay five ordinary arguments between two middle schoolers: swap a blaming line for an I-statement or a reflective listen, rewind any line, and watch the other kid's face, reply and the conversation meter change. Build an I-statement from tiles, then practice with a partner. Grades 6-8 social and emotional learning. Works offline.">
<!--
Conflict Coach (Curio Class)
Grades 6-8, Social and Emotional Learning, module Conflict Resolution (SEL). Standard: CASEL Relationship Skills
(communicating effectively, listening actively, resolving conflicts constructively).
Students in pairs on one laptop, or a teacher on a projector with the class voting on each move (keys 1 to 4 or A to D,
R rewinds, N goes on). Scenes: three turns per fictional scene (Say it, Hear them, Fix it), four lines to pick from, a
conversation meter, and Rewind, which keeps the taken-back line on the stage as a faded "Last time" bubble.
Line Builder: an I-statement from tiles, with a coach check of each part. Partner Cards: Speaker and Listener cards to
read aloud, swap and print.
Sources: CASEL, "What Is the CASEL Framework?"; Thomas Gordon, Parent Effectiveness Training (1970) and Gordon Training
International, "I-Messages"; Carl R. Rogers and Richard E. Farson, "Active Listening" (1957). The coach says "usually"
and "easier to hear", never "always" or "proven". Every scene is fictional and ordinary; there is no text box, and
nothing is stored except the list of Clean run scenes and the kit's Motion setting.
Characters, meter and bench are drawn in code; backdrops are local FLUX.1-schnell paintings with no people.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>

   stack   (narrow or portrait): the panel under the stage, the page scrolls.
   The stage is drawn at its real pixel size (SVG plus HTML bubbles), never scaled, so text keeps its size. */

.stage{min-height:0;background:#f3e3cf}
#sv{position:absolute;left:0;top:0;display:block}

body.stack{height:auto}

body.stack .panel{border-left:0;border-top:3px solid var(--line)}
@media (max-width:560px){
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;border-radius:14px;width:100%}
  .seg button{min-height:44px;font-size:14px;padding:0 6px}

/* focus on the brown header: white ring (5.47:1 on brand, 6.97:1 on btn); the kit's .seg clips outlines, so its buttons get an inset ring */
header :focus-visible{outline-color:#fff}
.seg button:focus-visible{outline:3px solid #fff;outline-offset:-6px;box-shadow:inset 0 0 0 2px #26211f}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{margin:0}
.panel h2{margin:0;font:700 13px 'Segoe UI',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:44px;border-radius:10px;border:2px solid var(--brand);background:#fff;color:var(--brand);font-weight:700;font-size:15px;padding:0 12px}

.btn[aria-pressed="true"]{background:var(--brand);color:#fff}

/* scene picker: full cards on the Scenes start screen, a row of face chips everywhere else */
.picker{display:flex;flex-direction:column;gap:6px}
.scard{display:grid;grid-template-columns:48px 1fr;gap:2px 10px;align-items:center;text-align:left;min-height:56px;

.scard svg{grid-row:1 / span 2;width:48px;height:48px}
.scard b{font-size:16px}
.scard b small{font-weight:500;color:var(--muted);font-size:14px}
.scard .su{font-size:13.5px;line-height:1.35;color:var(--muted)}
.scard .ck{position:absolute;right:8px;top:6px;font-size:13px;font-weight:700;color:var(--s4)}
.picker.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}

body.compact .picker.full .scard{min-height:48px;padding:3px 8px}
body.compact .picker.full .scard svg{width:38px;height:38px}
.turnlab{margin:0;font:700 14px 'Segoe UI',system-ui,sans-serif;color:var(--brand)}
body.compact .turnlab{font-size:13px}
/* the four move cards */
.moves{display:flex;flex-direction:column;gap:6px}
.move{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:start;text-align:left;min-height:44px;
  border:2px solid var(--line);border-radius:12px;background:var(--card);padding:7px 10px 7px 7px;font-size:15px;line-height:1.35}
.move .let{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.move .tag{grid-column:2;font-size:13px;font-weight:700;color:var(--brand)}
.move .tag:empty{display:none}

.move.picked{opacity:1;border:3px solid var(--brand);background:#fff3ea}
body.compact .move{font-size:13px;line-height:1.28;padding:4px 6px 4px 4px;grid-template-columns:22px 1fr;gap:2px 6px}

.coach{background:#fbf1e6;border-left:5px solid var(--brand);border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.4}

body.compact .coach{font-size:13px;padding:5px 8px;line-height:1.3}
.clip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}

.clip li span{color:var(--muted)}

.clip .clean::before{content:'\2713  '}
body.compact .clip ol{font-size:13px}
/* line builder */
.rowtabs{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
body.tabbed .rowtabs{display:grid}
.rowtabs button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;line-height:1.1;padding:2px}
.rowtabs button[aria-pressed="true"]{border-color:var(--brand);background:#fbe7dc}
.rowtabs button .f{display:block;font-weight:500;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow h3{margin:0 0 2px;font:700 14px 'Segoe UI',system-ui,sans-serif}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:4px}

.tile[aria-pressed="true"]{border-color:var(--brand);background:#fbe7dc;font-weight:700}
body.tabbed .trow:not(.on){display:none}
body.tabbed .trow h3{display:none}
body.compact .tile{font-size:13px}
.lbrows{display:flex;flex-direction:column;gap:6px}
.capp,.cap.capp{position:static;margin-top:6px;font-size:13.5px;line-height:1.35;padding:6px 10px}
.lbbtns{display:grid;grid-template-columns:auto auto auto;gap:6px}
.lbbtns .btn{padding:0 8px;font-size:14.5px}
body.picking #hint{order:-1}
#scenesSec{display:flex;flex-direction:column;gap:6px}
#scenesSec>*{margin-top:0!important}
body.compact #coach{order:-2}
body.compact #actRow{order:-1}
body.stack #coach{order:-2}
body.stack #actRow{order:-1}
.lastp{background:#fbf3e8;border:2px dashed #8a6d4f;border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.35;color:var(--muted)}

body.compact .lastp{font-size:13px;padding:4px 8px}
body.compact .lastp,body.stack .lastp{order:-1}
/* stage overlays: bubbles, captions, ending card, the line builder frame, partner cards */
.bub{position:absolute;background:#fff;color:var(--ink);border:2px solid #d7c2ac;border-radius:16px;padding:8px 12px;

.bub .who{display:block;font-size:.78em;font-weight:700;color:var(--muted);margin-bottom:1px}
.bub.their::after{content:'';position:absolute;right:-12px;top:18px;border:10px solid transparent;border-left:14px solid #fff;border-right:0}
.bub.their::before{content:'';position:absolute;right:-16px;top:16px;border:12px solid transparent;border-left:16px solid #d7c2ac;border-right:0}
.bub.you{background:var(--you);border-color:#d9bf98}
.bub.you::after{content:'';position:absolute;left:22px;bottom:-14px;border:10px solid transparent;border-top:14px solid var(--you);border-bottom:0}
.bub.you::before{content:'';position:absolute;left:20px;bottom:-18px;border:12px solid transparent;border-top:16px solid #d9bf98;border-bottom:0}
.bub.last{background:#fbf3e8;opacity:1;color:var(--muted);border:2px dashed #8a6d4f;box-shadow:none}

.bub.last::after,.bub.last::before{display:none}
.bub.rise{opacity:0;transform:translateY(26px)}

.bub.fade{opacity:0}
.cap{position:absolute;background:#fffdf9ee;border:2px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.4}
.cap b{display:block;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.endcard{position:absolute;background:#fffdf9;border:3px solid var(--ink);border-radius:18px;padding:14px 18px;text-align:center;

.endcard .big{display:flex;justify-content:center;align-items:center;gap:10px;font:800 1.35em 'Trebuchet MS','Segoe UI',sans-serif}
.endcard .big svg{flex:none}
.endcard.rise{opacity:0;transform:scale(.94)}
.calm .endcard.rise{transform:none}
.lbframe{position:absolute;background:#fffdf9;border:2px solid var(--line);border-radius:16px;padding:10px 14px;line-height:2.05;
  font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:700;pointer-events:auto}
.slot{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 1px 0 2px;line-height:1.2;min-height:44px;justify-content:center;
  border:0;border-bottom:3px dashed var(--brand);background:#fbe7dc;border-radius:8px 8px 2px 2px;padding:3px 8px;font:inherit;line-height:1.2;color:var(--ink)}
.slot.full{border-bottom-style:solid;background:#fff1e3}
.slot .num{color:var(--brand);font-weight:800}
.slot .mk{display:block;font:700 max(10.5px,.55em) 'Segoe UI',system-ui,sans-serif;margin-top:3px;padding:1px 6px;border-radius:999px;white-space:nowrap}
.slot .mk.ok{background:#e3f0e4;color:#20502a}
.slot .mk.trap{background:#f9e0dd;color:#7d221d}
.slot .mk.empty{background:#efe7df;color:var(--ink)}
.pcwrap{position:absolute;display:flex;gap:14px;justify-content:center;align-items:stretch;pointer-events:auto;perspective:1200px}
.pcard{flex:1 1 0;max-width:580px;background:#fffdf9;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;line-height:1.42;
  box-shadow:0 6px 0 #0002;transform-style:preserve-3d}
.pcard h3{margin:0 0 2px;line-height:1.2;font:800 1.25em 'Trebuchet MS','Segoe UI',sans-serif;display:flex;align-items:center;gap:8px}
.pcard .who{font-size:max(11px,.82em);font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pcard p{margin:6px 0}
.pcard .frame{background:#fbe7dc;border-radius:10px;padding:6px 10px;font-weight:700}
.pcard .lab{font-size:max(11px,.8em);font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.05em;display:block}
.pcard.flip{animation:flip .5s ease-in-out}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.both{position:absolute;background:#fffdf9;border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;line-height:1.4;pointer-events:auto}
.both b{color:var(--brand)}
.bothp{margin-top:6px;background:#fffdf9;border:2px dashed var(--ink);border-radius:12px;padding:6px 10px;font-size:13.5px;line-height:1.35}
.bothp b{color:var(--brand)}

#printCards{display:none}
@media print{
  @page{margin:14mm}
  body{display:block;background:#fff;color:#000;min-height:0}
  header,main{display:none!important}
  #printCards{display:block}
  #printCards .pc{border:2px solid #000;border-radius:10px;padding:12px 16px;margin:0 0 14px;break-inside:avoid;font:14pt/1.45 'Segoe UI',Arial,sans-serif}
  #printCards h2{margin:0 0 4px;font:800 18pt 'Trebuchet MS',Arial,sans-serif}
  #printCards .meta{font-size:11pt;margin:0 0 8px}
  #printCards p{margin:6px 0}
  #printCards .lab{font-weight:700;font-size:11pt;text-transform:uppercase;letter-spacing:.05em;display:block}
  #printCards .frame{border:1.5px dashed #000;padding:6px 10px;font-weight:700}
}
</style>

<body>
<header>
  <h1>Conflict Coach <small>Say the hard thing two ways and watch what changes.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-scenes" aria-pressed="true">Scenes</button>
    <button id="m-builder" aria-pressed="false">Line Builder</button>
    <button id="m-partner" aria-pressed="false">Partner Cards</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <div class="stage" id="stage">
    <svg id="sv" role="img" aria-label="The bench"></svg>
    <div id="lay"></div>
  </div>
  <aside class="panel" id="panel">
    <div class="picker full" id="picker" role="group" aria-label="Scenes"></div>
    <button class="btn" id="clearChecks" data-modes="scenes">Clear checks</button>
    <p class="turnlab" id="turnLab"></p>
    <p class="hint" id="hint"></p>
    <div data-modes="scenes" id="scenesSec">
      <div class="moves" id="moves" role="group" aria-label="What you could say"></div>
      <div class="row" id="actRow" hidden style="margin-top:6px">
        <button class="btn" id="rewind" title="Key R">⟲ Rewind</button>
        <button class="btn go" id="next" title="Key N">Next ▶</button>
      </div>
      <div class="row" id="endRow" hidden style="margin-top:6px">
        <button class="btn" id="endRewind" title="Key R">⟲ Rewind</button>
        <button class="btn" id="replay">Replay scene</button>
        <button class="btn go" id="nextScene">Next scene</button>
        <button class="btn" id="pickScene">Pick a scene</button>
      </div>
      <div class="lastp" id="lastPanel" hidden></div>
      <div class="coach" id="coach" hidden style="margin-top:6px"><b>Coach</b><span id="coachTxt"></span></div>
      <div class="clip" id="clip" hidden style="margin-top:6px"><h2>Coach clipboard</h2><ol id="clipList"></ol><p class="clean" id="cleanMsg" hidden>Clean run. Every move was a strong one.</p></div>
    </div>
    <div data-modes="builder" id="builderSec" hidden>
      <div class="rowtabs" id="rowTabs" role="group" aria-label="Sentence parts"></div>
      <div class="lbrows" id="lbRows"></div>
      <div class="lbbtns" style="margin-top:6px">
        <button class="btn" id="lbCheck">Check my line</button>
        <button class="btn go" id="lbSay" disabled>Say it to them</button>
        <button class="btn" id="lbClear">Clear</button>
      </div>
      <div class="cap capp" id="checkPanel" hidden></div>
    </div>
    <div data-modes="partner" id="partnerSec" hidden>
      <div class="row">
        <button class="btn go" id="swap">⇄ Swap roles</button>
        <button class="btn" id="pcNext">Next scene</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="showBoth" aria-pressed="false">Show both sides</button>
        <button class="btn" id="print">🖨 Print cards</button>
      </div>
      <div class="bothp" id="bothPanel" hidden></div>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </aside>
</main>
<div id="printCards"></div>
<script src="kit:curio"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const {say, wait} = Curio;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

  // ======================================================================================
  // Content (the spec's Content section, word for word)
  // ======================================================================================
  const MOVES = {
    istate: {name: 'I-statement', d: 2, s: true, coach: 'I-statement. You said how you feel, what happened and what you need, without blaming. That is easier to hear.'},
    half: {name: 'Half an I-statement', d: 1, coach: 'Half an I-statement. You named a feeling, but not what you need. Add an ask.'},
    blame: {name: 'You-statement', d: -1, coach: 'You-statement. It starts with what they did wrong, so people usually defend themselves.'},
    brush: {name: 'Brush-off', d: 0, coach: 'Brush-off. It avoids the fight now, but the problem is still there.'},
    reflect: {name: 'Reflective listen', d: 2, s: true, coach: 'Reflective listen. You said back their feeling and their reason. They can tell you heard them.'},
    fixfast: {name: 'Fix it too fast', d: 0, coach: 'Fix it too fast. You jumped to a solution before showing you heard them.'},
    defend: {name: 'Yeah-but', d: -1, coach: 'Yeah-but. You went back to your side before they finished theirs.'},
    dismiss: {name: 'Dismiss', d: -1, coach: 'Dismiss. Telling someone their reason doesn\'t count makes them dig in.'},
    both: {name: 'Both-sides plan', d: 2, s: true, coach: 'Both-sides plan. It meets your need and theirs.'},
    ask: {name: 'Ask what works', d: 2, s: true, coach: 'Ask what works. Inviting their idea makes it a plan you made together.'},
    givein: {name: 'Give in', d: 0, coach: 'Give in. It ends the argument, but your need disappears. Try one that works for both.'},
    demand: {name: 'Demand', d: -1, coach: 'Demand. An order, not a plan. It usually starts the fight again.'},
  };
  const TURNS = [
    {key: 'say', label: 'Say it', moves: ['istate', 'half', 'blame', 'brush'], hint: 'h-say'},
    {key: 'hear', label: 'Hear them', moves: ['reflect', 'fixfast', 'defend', 'dismiss'], hint: 'h-hear'},
    {key: 'fix', label: 'Fix it', moves: ['both', 'ask', 'givein', 'demand'], hint: 'h-fix'},
  ];
  const STOPS = [
    {word: 'Heated', lines: ['Heated'], icon: 'flame', c: '--s0'},
    {word: 'Tense', lines: ['Tense'], icon: 'zig', c: '--s1'},
    {word: 'Calm', lines: ['Calm'], icon: 'flat', c: '--s2'},
    {word: 'Listening', lines: ['Listening'], icon: 'ear', c: '--s3'},
    {word: 'Working it out', lines: ['Working', 'it out'], icon: 'hands', c: '--s4'},
  ];
  const POSTURE_WORDS = ['brows down, mouth tight, arms crossed, turned away', 'half turned away, hands gripped in the lap', 'calm, hands on knees',
    'facing you, head tilted, listening', 'facing you with a small smile, one hand open'];
  const ENDS = ['stuck', 'stuck', 'okay', 'worked', 'worked'];
  const ENDNAME = {stuck: 'Still stuck', okay: 'Okay for now', worked: 'Worked it out'};

  // ======================================================================================
  function setMode(m) {
    hush(); clearTimers(); moment++;
    state.mode = m;
    document.body.dataset.mode = m;
    for (const k of ['scenes', 'builder', 'partner']) $('m-' + k).setAttribute('aria-pressed', k === m);
    for (const el of document.querySelectorAll('[data-modes]')) el.hidden = !el.dataset.modes.split(' ').includes(m);
    $('turnLab').hidden = true;
    if (m === 'scenes') {
      // switching modes resets the scene: back to the picker
      Object.assign(state, {phase: 'picker', turn: 0, meter: 1, picks: [null, null, null], last: null, stage: 0});
      renderScenesPanel();
    } else if (m === 'builder') { lbReset(); setPosture(2, true); buildLB(); setHint(L['h-builder']); }
    else { state.pc = {swapped: false, both: false}; $('showBoth').setAttribute('aria-pressed', 'false'); setHint(L['h-partner']); }
    renderPicker();
    lastSize = ''; relayout(true);
    narrate(WELCOME[m]);
  }
  for (const k of ['scenes', 'builder', 'partner']) $('m-' + k).onclick = () => { if (state.mode !== k) setMode(k); };
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());

  // projector keys in Scenes: 1 to 4 or A to D pick, R rewinds, N goes on
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || state.mode !== 'scenes') return;
    const k = e.key.toLowerCase();
    const i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (k.length === 1 && i >= 0 && state.phase === 'turn' && !state.picks[state.turn]) { e.preventDefault(); pick(i); const b = $('moves').children[i]; if (b) b.focus(); }
    else if (k === 'r' && ((state.phase === 'turn' && state.picks[state.turn] && state.stage >= 3) || state.phase === 'end')) { e.preventDefault(); rewind(); }
    else if (k === 'n' && state.phase === 'turn' && state.stage >= 3) { e.preventDefault(); next(); }
  });

  Curio.onSound(on => { if (on && tapped) narrate(WELCOME[state.mode]); });
  Curio.onMotion(() => drawStage());
  Curio.init({clips: "voice:*", rate: .95, readFallback: () => $('hint').textContent});
  $('read').onclick = readNow;

  window.__tool = {state, setMode, allLines, startScene, pick, rewind, next, finishNow, toPicker, chooseScene, said, queued, started, MOVES, TURNS, SC,
    lbPick: (r, ti) => { state.lb.slots[r] = ti; lbChanged(r); }, lbCheck: () => $('lbCheck').click(), lbSay: () => $('lbSay').click(),
    hint: () => $('hint').textContent, layout: () => ({page, G}), clean: () => clean.slice(),
    curio: () => ({last: Curio.last, sound: Curio.sound, reduce: Curio.reduce})};
  setMode('scenes');
})();
</script>
</body>
