<title>How Animals See · Structures and senses · Curio Class</title>
<meta name="description" content="Drag an animal's eye across a meadow to see it the way a bee, dog, eagle, owl or rattlesnake does: ultraviolet flowers, red-green color blindness, eagle-sharp detail, owl night vision and heat-sensing pits. Then explore how each eye works and how far around each animal can see.">
<!--
HOW ANIMALS SEE (Curio Class)
Science, grade 4, NGSS 4-LS1-1 (structures that support survival), 4-LS1-2 (animals take in information through their
senses), 4-PS4-2 (light reflecting from objects and entering the eye allows objects to be seen).
Look through: a meadow by day and by night; drag a lens to see through a bee's, dog's, eagle's, owl's or rattlesnake's eyes.
  Bee: false-color ultraviolet (UV shown as purple, red looks dark) and a compound-eye mosaic; flowers show UV bullseyes.
  Dog: two kinds of color cones, simulated with the Machado et al. (2009) deuteranopia matrix, slightly less sharp.
  Eagle: the same scene about four times sharper, shown as a closer look. Owl: rod-rich night vision, bright but grayish.
  Rattlesnake: the pit organs sense heat; warm-blooded animals glow, a toad (cold-blooded) barely shows.
Inside the eye: labeled diagrams and the path light takes from the Sun to an object to the eye to the brain.
Field of view: drag a fox around five animals; eyes in front see depth, eyes on the sides watch almost all around.
Who's looking?: guess which animal's view you are seeing.
These views are simplified pictures of what scientists have measured; no one knows exactly what an animal experiences.
Illustrations drawn with FLUX.1-schnell (Apache 2.0) on a local computer, edited for Curio Class. Sound synthesized in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<style>

</style>

<body>
<header>
  <h1>How Animals See <small>Look at one meadow through five different kinds of eyes.</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<div class="stagewrap" id="stagewrap">
  <div class="scene" id="scene">
    <div class="top">
      <div class="tabs" role="group" aria-label="Mode">
        <button data-mode="look" aria-pressed="true">👁️ Look through</button>

    <div id="lookview">
      <div class="view" id="view" aria-label="The meadow. Drag or move the circle to look through the animal's eyes."><canvas id="vc" width="1500" height="844"></canvas>
        <div class="lensring" id="ring"></div><div class="lenstag" id="tag"></div></div>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));

  // ---------- sound ----------
  let ac = null, soundOn = true;
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').textContent = soundOn ? '🔔 Sound' : '🔕 Sound'; };
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, at, dur, {type = 'triangle', gain = .12, slide = 0} = {}) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    tap: () => tone(700, 0, .08, {type: 'sine', gain: .08}),
    pick: () => [660, 880].forEach((f, i) => tone(f, i * .07, .18, {type: 'sine', gain: .08})),
    good: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .4)),
    miss: () => tone(330, 0, .35, {gain: .08, slide: .75}),
    buzz: () => tone(220, 0, .3, {type: 'sawtooth', gain: .03, slide: 1.05})
  };

  // ---------- art ----------
  const SRC = {meadow: 'art:meadow', susan: 'art:susan', marigold: 'art:marigold', primrose: 'art:primrose', sunflower: 'art:sunflower', cornflower: 'art:cornflower',
    redball: 'art:redball', blueball: 'art:blueball', yellowball: 'art:yellowball', rabbit: 'art:rabbit', mouse: 'art:mouse', toad: 'art:toad',
    bee: 'art:bee', dog: 'art:dog', owl: 'art:owl', snake: 'art:snake', eagle: 'art:eagle', horse: 'art:horse', fox: 'art:fox', rabbithead: 'art:rabbithead'};
  const IM = {};
  const W = 1500, H = 844;
  // things placed in the meadow: [art, center x, bottom y, height] in a 1500 x 844 picture; listed back to front
  // flowers carry their ultraviolet pattern: [head center x, y, radius] as fractions of the picture, and the size of the dark middle
  // (a flower head facing us is as wide as its cutout and sits at the top, above the stem; the sunflower plant is set by hand)
  const FLOWER = {susan: {mid: .5}, marigold: {mid: .42}, primrose: {mid: .55}, sunflower: {head: [.5, .18, .177], mid: .5}, cornflower: {mid: 0}};
  const DAY = [['rabbit', 1130, 470, 40], ['susan', 230, 600, 150], ['cornflower', 520, 590, 140], ['marigold', 790, 615, 140], ['primrose', 1000, 600, 150],
    ['sunflower', 1360, 740, 440], ['yellowball', 620, 705, 82], ['redball', 960, 735, 86], ['blueball', 370, 785, 84],
    ['primrose', 110, 820, 200], ['susan', 1110, 835, 215], ['cornflower', 1270, 844, 175], ['marigold', 640, 860, 205], ['susan', 830, 870, 180]];
  const NIGHT = [['rabbit', 1080, 590, 130], ['toad', 330, 730, 90], ['mouse', 760, 770, 100], ['susan', 150, 860, 190], ['cornflower', 1290, 860, 170]];

  // ---------- view builders ----------
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  function compose(list, g = mk().getContext('2d'), zoom = 1, cx = 0, cy = 0) {
    g.save(); if (zoom !== 1) { g.translate(cx, cy); g.scale(zoom, zoom); g.translate(-cx, -cy); }
    g.drawImage(IM.meadow, 0, 0, W, H);
    for (const [n, x, y, h] of list) { const im = IM[n], w = h * im.naturalWidth / im.naturalHeight; g.drawImage(im, x - w / 2, y - h, w, h); }
    g.restore(); return g.canvas;
  }
  function uvMap(list) { // brightness of ultraviolet light: sky some, leaves little, petals a lot except the flower's middle
    const g = mk().getContext('2d'), base = compose(list).getContext('2d').getImageData(0, 0, W, H), d = base.data;
    const out = g.createImageData(W, H), o = out.data;
    for (let i = 0; i < d.length; i += 4) { const r = d[i], gg = d[i + 1], b = d[i + 2], sky = b > r + 20 && b > gg ? 1 : 0; const v = sky ? b * .75 : Math.min(r, gg, b) * .35; o[i] = o[i + 1] = o[i + 2] = v; o[i + 3] = 255; }
    g.putImageData(out, 0, 0);
    for (const [n, x, y, h] of list) {
      const F = FLOWER[n]; if (!F) continue;
      const im = IM[n], w = h * im.naturalWidth / im.naturalHeight, L = x - w / 2, T = y - h;
      const t = mk().getContext('2d'); t.canvas.width = Math.ceil(w); t.canvas.height = Math.ceil(h);
      const [hx, hy, hr] = F.head ? [F.head[0] * w, F.head[1] * h, F.head[2] * h] : [w / 2, w / 2, w / 2];
      const gr = t.createRadialGradient(hx, hy, 0, hx, hy, hr);
      if (F.mid) { gr.addColorStop(0, '#000'); gr.addColorStop(F.mid * .92, '#000'); gr.addColorStop(F.mid, '#fff'); gr.addColorStop(1, '#fff'); }
      else { gr.addColorStop(0, '#bbb'); gr.addColorStop(1, '#bbb'); }
      t.fillStyle = gr; t.beginPath(); t.arc(hx, hy, hr, 0, 7); t.fill(); // only the flower head reflects ultraviolet
      t.globalCompositeOperation = 'destination-in'; t.drawImage(im, 0, 0, w, h);
      // only the petals reflect: stems and leaves stay dark in ultraviolet
      const p = t.getImageData(0, 0, t.canvas.width, t.canvas.height), pd = p.data, src = mk().getContext('2d');
      src.canvas.width = t.canvas.width; src.canvas.height = t.canvas.height; src.drawImage(im, 0, 0, w, h); const sd = src.getImageData(0, 0, src.canvas.width, src.canvas.height).data;
      for (let i = 0; i < pd.length; i += 4) { const leaf = sd[i + 1] > sd[i] + 10 && sd[i + 1] > sd[i + 2]; if (leaf) pd[i] = pd[i + 1] = pd[i + 2] = 20; }
      t.putImageData(p, 0, 0);
      g.drawImage(t.canvas, L, T);
    }
    return g.canvas;
  }
  const px = c => c.getContext('2d').getImageData(0, 0, W, H);
  function beeView() {
    const base = px(compose(DAY)), uv = px(uvMap(DAY)), d = base.data, u = uv.data;
    // bees have ultraviolet, blue and green receptors and none for red: red goes dark, ultraviolet shows as purple
    for (let i = 0; i < d.length; i += 4) { const g = d[i + 1], b = d[i + 2], v = u[i]; d[i] = Math.min(255, g * .22 + v * .95); d[i + 1] = g * .82; d[i + 2] = Math.min(255, b * .7 + v * .85); }
    // compound eye: thousands of little lenses, each one sees one patch (staggered like a honeycomb)
    const S = 11, out = new ImageData(W, H), o = out.data;
    for (let row = 0, y0 = 0; y0 < H; row++, y0 += S) {
      for (let x0 = row % 2 ? -S / 2 : 0; x0 < W; x0 += S) {
        let R = 0, G = 0, B = 0, n = 0;
        for (let y = y0; y < y0 + S && y < H; y += 2) for (let x = Math.max(0, x0 | 0); x < x0 + S && x < W; x += 2) { const k = (y * W + x) * 4; R += d[k]; G += d[k + 1]; B += d[k + 2]; n++; }
        if (!n) continue; R /= n; G /= n; B /= n;
        for (let y = y0; y < y0 + S && y < H; y++) for (let x = Math.max(0, Math.round(x0)); x < x0 + S && x < W; x++) {
          const dx = (x - x0 - S / 2) / (S / 2), dy = (y - y0 - S / 2) / (S / 2), edge = 1 - Math.max(0, Math.hypot(dx, dy) - .75) * .9;
          const k = (y * W + x) * 4; o[k] = R * edge; o[k + 1] = G * edge; o[k + 2] = B * edge; o[k + 3] = 255;
        }
      }
    }
    const c = mk(); c.getContext('2d').putImageData(out, 0, 0); return c;
  }
  const lin = v => { v /= 255; return v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  const srgb = v => 255 * (v <= .0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - .055);
  function dogView() {
    const c = mk(), g = c.getContext('2d'); g.filter = 'blur(2.5px)'; g.drawImage(compose(DAY), 0, 0); g.filter = 'none';
    const im = g.getImageData(0, 0, W, H), d = im.data;
    // Machado, Oliveira and Fernandes (2009), deuteranopia, severity 1: dogs have blue and yellow cones only
    for (let i = 0; i < d.length; i += 4) {
      const r = lin(d[i]), gg = lin(d[i + 1]), b = lin(d[i + 2]);
      d[i] = srgb(Math.max(0, Math.min(1, .367322 * r + .860646 * gg - .227968 * b)));
      d[i + 1] = srgb(Math.max(0, Math.min(1, .280085 * r + .672501 * gg + .047413 * b)));
      d[i + 2] = srgb(Math.max(0, Math.min(1, -.01182 * r + .04294 * gg + .968881 * b)));
    }
    g.putImageData(im, 0, 0); return c;
  }
  let skyMask = null;
  function nightify(c, bright) { // moonlight: little color, blue cast; bright = how much the eye gathers
    const g = c.getContext('2d'), im = g.getImageData(0, 0, W, H), d = im.data;
    for (let i = 0; i < d.length; i += 4) {
      const L = .3 * d[i] + .59 * d[i + 1] + .11 * d[i + 2], col = bright > .6 ? .12 : .22;
      d[i] = (L + (d[i] - L) * col) * bright * .78; d[i + 1] = (L + (d[i + 1] - L) * col) * bright * .9; d[i + 2] = Math.min(255, (L + (d[i + 2] - L) * col) * bright * 1.15 + 6);
    }
    g.putImageData(im, 0, 0);
    // stars and the Moon in the sky
    const r = rng(7);
    for (let i = 0; i < 160; i++) { const x = r() * W, y = r() * H * .42; if (!skyMask[(y | 0) * W + (x | 0)]) continue; g.fillStyle = `rgba(255,255,240,${(.25 + r() * .6) * Math.min(1, bright * 1.6)})`; g.beginPath(); g.arc(x, y, r() * 1.6 + .5, 0, 7); g.fill(); }
    const mg = g.createRadialGradient(1240, 110, 10, 1240, 110, 90); mg.addColorStop(0, `rgba(255,252,230,${Math.min(1, .55 + bright)})`); mg.addColorStop(.38, `rgba(255,250,225,${Math.min(1, .5 + bright)})`); mg.addColorStop(.42, `rgba(220,230,255,${.25 * bright + .1})`); mg.addColorStop(1, 'rgba(200,215,255,0)');
    g.fillStyle = mg; g.beginPath(); g.arc(1240, 110, 90, 0, 7); g.fill();
    return c;

  const FOV = {you: ['You', 180, 120, 'Your eyes face forward. Both eyes see most of what is in front of you, which lets you judge distance, but you can\'t see behind you.'],

    dog: ['Dog', 250, 60, 'Dogs, once hunters, have eyes a little to the sides: a wider view than ours, with less overlap. It changes by breed.'],
    horse: ['Horse', 350, 65, 'Horses are prey. Eyes on the sides of the head watch almost all the way around. There are blind spots right behind and just in front of the nose.'],
    rabbit: ['Rabbit', 350, 30, 'Rabbits can see nearly all the way around without turning, so a fox can hardly sneak up, but they don\'t judge distance well straight ahead.']};
  let F = 'you', fox = [480, 140], seenState = null;
  function drawFov() {
    const [name, tot, bin] = FOV[F], cx = 480, cy = 340, R = 290;
    const arc = (a0, a1, col) => { // angles in degrees, 0 = straight ahead (up), clockwise
      const p = a => [cx + R * Math.sin(a * Math.PI / 180), cy - R * Math.cos(a * Math.PI / 180)];
      const [x0, y0] = p(a0), [x1, y1] = p(a1);
      return `<path d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1} Z" fill="${col}"/>`;
    };
    const head = F === 'you' ? EYE_ICON : SRC[F === 'rabbit' ? 'rabbithead' : F];
    const ang = Math.atan2(fox[0] - cx, -(fox[1] - cy)) * 180 / Math.PI, d = Math.abs(ang);
    const st = d <= bin / 2 ? 'both' : d <= tot / 2 ? 'one' : 'none';
    if (st !== seenState && seenState !== null) (st === 'none' ? SFX.buzz : SFX.tap)();
    seenState = st;
    $('fov').innerHTML = `<svg viewBox="0 0 960 640" aria-label="Seen from above: the colored areas are what the ${name.toLowerCase()} can see">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#00000030"/>
      ${arc(-tot / 2, tot / 2, '#ffffff66')}${arc(-bin / 2, bin / 2, '#f4c430aa')}
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R - 20}" stroke="#ffffff99" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="${cx}" y="${cy - R - 28}" text-anchor="middle" class="lbl" style="fill:#fff">facing this way</text>
      <clipPath id="hc"><circle cx="${cx}" cy="${cy}" r="58"/></clipPath><circle cx="${cx}" cy="${cy}" r="62" fill="#fdfdf6"/>
      <image href="${head}" x="${cx - 58}" y="${cy - 58}" width="116" height="116" clip-path="url(#hc)" preserveAspectRatio="xMidYMid slice"/>
      <g id="foxg" style="cursor:grab"><image href="${SRC.fox}" x="${fox[0] - 70}" y="${fox[1] - 40}" width="140" height="80" preserveAspectRatio="xMidYMid meet"/>
      <circle cx="${fox[0]}" cy="${fox[1]}" r="62" fill="none" stroke="${st === 'none' ? '#d0846a' : st === 'one' ? '#fff' : '#f4c430'}" stroke-width="5" stroke-dasharray="${st === 'none' ? '8 8' : ''}"/></g>
      <g transform="translate(24 560)"><rect width="22" height="22" fill="#f4c430aa" rx="4"/><text x="32" y="18" class="lbl" style="fill:#fff">Both eyes: sees depth (${bin}°)</text>
      <rect y="34" width="22" height="22" fill="#ffffff88" rx="4"/><text x="32" y="52" class="lbl" style="fill:#fff">One eye (${tot}° in all)</text></g>
    </svg>`;
    $('finfo').innerHTML = `<div class="kicker">${name}</div><div class="fovmsg">${st === 'both' ? '👀 Seen with both eyes' : st === 'one' ? '👁️ Seen with one eye' : '🙈 The fox is in the blind spot!'}</div>
      <p>${FOV[F][3]}</p><p style="color:var(--muted)">Drag the fox around. Predators like owls have eyes in front; prey like rabbits and horses have eyes on the sides.</p>`;
  }
  let fdrag = false;
  $('fov').onpointerdown = e => { fdrag = true; $('fov').setPointerCapture(e.pointerId); moveFox(e); };
  $('fov').onpointermove = e => { if (fdrag) moveFox(e); };
  $('fov').onpointerup = () => fdrag = false;
  function moveFox(e) { const b = $('fov').getBoundingClientRect(); fox = [Math.max(70, Math.min(890, (e.clientX - b.left) / b.width * 960)), Math.max(50, Math.min(600, (e.clientY - b.top) / b.height * 640))]; drawFov(); }
  $('fov').tabIndex = 0;
  $('fov').onkeydown = e => { const d = {ArrowLeft: [-30, 0], ArrowRight: [30, 0], ArrowUp: [0, -30], ArrowDown: [0, 30]}[e.key]; if (d) { fox = [Math.max(70, Math.min(890, fox[0] + d[0])), Math.max(50, Math.min(600, fox[1] + d[1]))]; drawFov(); e.preventDefault(); } };
  function setFov(k) { F = k; seenState = null; whoButtons($('who3'), Object.keys(FOV).map(n => [n, FOV[n][0]]), F, setFov, n => n === 'you' ? EYE_ICON : SRC[n === 'rabbit' ? 'rabbithead' : n]); drawFov(); }

  // ---------- who's looking ----------
  let Q = null;
  function newQuiz() {
    const r = [...ORDER, ...ORDER].sort(() => Math.random() - .5).slice(0, 8);
    Q = {list: r, i: 0, res: []}; showQ();
  }
  function showQ() {
    const k = Q.list[Q.i], g = $('qc').getContext('2d');
    // a random window of the animal's view, so rounds don't repeat
    const zoom = 1.6, cw = W / zoom, ch = 705 / zoom;
    let x0 = Math.random() * (W - cw), y0 = H - ch - Math.random() * (H * .35);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, 705);
    if (k === 'eagle') { const big = mk(); compose(DAY, big.getContext('2d'), 4, 1130, 430); x0 = Math.min(W - cw, 1130 - cw / 2); y0 = Math.min(H - ch, 430 - ch / 2); g.drawImage(big, x0, y0, cw, ch, 0, 0, W, 705); }
    else g.drawImage(getView(k), x0, y0, cw, ch, 0, 0, W, 705);
    const opts = [k, ...ORDER.filter(n => n !== k).sort(() => Math.random() - .5).slice(0, 2)].sort(() => Math.random() - .5);
    $('qopts').innerHTML = opts.map(n => `<button class="b" data-q="${n}"><img src="${SRC[n]}" alt="">${ANIMALS[n].name}</button>`).join('');
    $('qmsg').innerHTML = `Round ${Q.i + 1} of ${Q.list.length}: whose eyes are these?`;
    $('qprog').innerHTML = Q.list.map((_, i) => `<i class="${Q.res[i] === 1 ? 'ok' : Q.res[i] === 0 ? 'no' : ''} ${i === Q.i ? 'now' : ''}"></i>`).join('');
    $('qopts').querySelectorAll('[data-q]').forEach(b => b.onclick = () => answer(b.dataset.q));
  }
  const CLUE = {bee: 'The mosaic of little dots and purple ultraviolet bullseyes give the bee away.', dog: 'Blues and yellows but no reds or greens: dog eyes.', eagle: 'A tiny rabbit far off by the fence, seen up close and sharp: eagle eyes.', owl: 'A night scene that looks bright but nearly colorless: owl eyes.', snake: 'Glowing warm animals in the dark: a rattlesnake\'s heat-sensing pits.'};
  function answer(n) {
    const k = Q.list[Q.i]; if (Q.res[Q.i] !== undefined) return;
    const ok = n === k; Q.res[Q.i] = ok ? 1 : 0; (ok ? SFX.good : SFX.miss)();
    $('qopts').querySelectorAll('[data-q]').forEach(b => { b.disabled = true; if (b.dataset.q === k) b.classList.add('right'); else if (b.dataset.q === n) b.classList.add('wrong'); });
    const last = Q.i === Q.list.length - 1;
    $('qmsg').innerHTML = `${ok ? 'Yes! ' : `It was the ${ANIMALS[k].name.toLowerCase()}. `}${CLUE[k]} <button class="b go" id="qn" style="margin-left:8px">${last ? 'See my score' : 'Next ▶'}</button>`;
    $('qprog').innerHTML = Q.list.map((_, i) => `<i class="${Q.res[i] === 1 ? 'ok' : Q.res[i] === 0 ? 'no' : ''} ${i === Q.i ? 'now' : ''}"></i>`).join('');
    $('qn').focus();
    $('qn').onclick = () => {
      SFX.tap();
      if (!last) { Q.i++; showQ(); return; }
      const sc = Q.res.reduce((a, b) => a + b, 0);
      $('qopts').innerHTML = `<button class="b go" id="qagain">Play again</button>`;
      $('qmsg').innerHTML = `<b>${sc} of ${Q.list.length}.</b> ${sc >= 7 ? 'You know your animal eyes!' : 'Try Look through again and drag the circle around, then play again.'}`;
      $('qagain').onclick = newQuiz;
    };
  }

  // ---------- modes ----------
  let mode = 'look';
  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    $('lookview').hidden = m !== 'look'; $('eyeview').hidden = m !== 'eye'; $('fovview').hidden = m !== 'fov'; $('quizview').hidden = m !== 'quiz';
    if (m === 'eye') setEye(E);
    if (m === 'fov') setFov(F);
    if (m === 'quiz' && !Q) newQuiz();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { SFX.tap(); setMode(b.dataset.mode); });
  document.addEventListener('keydown', e => { if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.altKey) setMode(['look', 'eye', 'fov', 'quiz'][+e.key - 1]); });

  Promise.all(Object.entries(SRC).map(([k, s]) => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { IM[k] = im; res(); }; im.src = s; })))
    .then(() => {
      // the sky, for stars at night and cold air in heat vision
      const d = px(compose([])).data; skyMask = new Uint8Array(W * H);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) { const y = j / W | 0; skyMask[j] = y < H * .5 && d[i + 2] > d[i] + 15 && d[i + 2] >= d[i + 1] - 5 ? 1 : 0; }
      setAnimal('bee');
    });
  window.__has = {setMode, setAnimal, getView, views, DAY, NIGHT, FLOWER, get lens() { return lens; }, set lens(v) { lens = v; drawLook(); }};
})();
</script>
