HOW ANIMALS SEE (Curio Class)
Science, grade 4, NGSS 4-LS1-1 (structures that support survival), 4-LS1-2 (animals take in information through their
senses), 4-PS4-2 (light reflecting from objects and entering the eye allows objects to be seen).
Look through: a meadow by day and by night; drag a lens to see through a bee's, dog's, eagle's, owl's or rattlesnake's eyes.
  Bee: false-color ultraviolet (UV shown as purple, red looks dark) and a compound-eye mosaic; flowers show UV bullseyes.
  Dog: two kinds of color cones, simulated with the Machado et al. (2009) deuteranopia matrix, slightly less sharp.
  Eagle: the same scene about four times sharper, shown as a closer look. Owl: rod-rich night vision, bright but grayish.
  Rattlesnake: the pit organs sense heat; warm-blooded animals glow, a toad (cold-blooded) barely shows.
Inside the eye: labeled diagrams and the path light takes from the Sun to an object to the eye to the brain.
Field of view: drag a fox around five animals; eyes in front see depth, eyes on the sides watch almost all around.
Who's looking?: guess which animal's view you are seeing.
These views are simplified pictures of what scientists have measured; no one knows exactly what an animal experiences.

      s = `<path d="M120 300 Q140 200 330 190 Q520 185 600 250 Q630 300 600 350 Q520 415 330 410 Q140 400 120 300Z" fill="#9c8a62" stroke="#5e5238" stroke-width="5"/>
        <circle cx="430" cy="250" r="26" fill="#2a2418" ${P('eye')}/><circle cx="438" cy="244" r="7" fill="#e8d9a0"/>
        <ellipse cx="560" cy="282" rx="12" ry="7" fill="#2a2418" ${P('nostril')}/>
        <ellipse cx="505" cy="290" rx="20" ry="14" fill="#1a160f" ${P('pit')}/>
        <circle cx="505" cy="290" r="34" fill="none" stroke="#f4c430" stroke-width="5"/>
        <g ${P('pit')}><path d="M640 420 Q700 360 760 420 L760 560 L640 560 Z" fill="#7a6a48"/><path d="M655 440 Q700 400 745 440" stroke="#e0521f" stroke-width="8" fill="none"/>
        <path d="M700 420 L700 380" stroke="none"/><text x="700" y="590" class="lbl" text-anchor="middle">inside a pit</text></g>
        <path d="M535 300 L640 430" stroke="#8a7f6a" stroke-width="3" stroke-dasharray="6 6"/>
        <g><ellipse cx="840" cy="250" rx="40" ry="24" fill="#b08868"/><circle cx="868" cy="236" r="8" fill="#b08868"/><path d="M800 254 q-30 10 -40 -8" stroke="#b08868" stroke-width="4" fill="none"/>
        <path class="heat${mv}" d="M800 260 Q760 300 700 410"/><path class="heat${mv}" d="M810 270 Q740 330 715 420"/><path class="heat${mv}" d="M790 250 Q700 320 690 410"/></g>
        ${L(430, 200, 'Eye', 'eye', 'middle')}${L(590, 240, 'Nostril', 'nostril')}${L(470, 345, 'Pit', 'pit', 'middle')}${L(840, 210, 'Warm mouse', 'none', 'middle')}${L(780, 500, 'Heat-sensing skin', 'pit')}`;
    }
    $('eyesvg').innerHTML = `<svg viewBox="0 0 960 640" role="img" aria-label="${EYES[E].name} eye diagram">${s}</svg>`;
    $('eyesvg').querySelectorAll('[data-p]').forEach(el => el.onclick = () => { partOn = el.dataset.p; SFX.tap(); diagram(); einfo(); });
  }
  const PARTS = {
    you: [['cornea', 'Cornea', 'The clear front window of the eye. It starts bending light.'], ['iris', 'Iris and pupil', 'The colored iris makes the pupil, the dark hole, bigger in dim light and smaller in bright light.'],
      ['lens', 'Lens', 'Bends the light so it lands in focus on the retina. The picture lands upside down, and your brain flips it.'], ['retina', 'Retina', 'A layer of light-sensing cells: rods for dim light and three kinds of cones for color.'],
      ['nerve', 'Optic nerve', 'Carries the signals from the retina to the brain.'], ['brain', 'Brain', 'The brain turns the signals into the picture you see.']],
    dog: [['cornea', 'Cornea', 'The clear front window. Dogs have a slightly larger cornea than people, which lets in more light.'], ['lens', 'Lens', 'Focuses light on the retina. Dogs can\'t focus on things very close up as well as we can.'],
      ['retina', 'Retina', 'Lots of rods for dim light, and only two kinds of cones, so red and green look alike.'], ['tapetum', 'Shiny layer (tapetum)', 'A mirror-like layer behind the retina bounces light back for a second chance to be seen. It makes dogs\' eyes glow in the dark.'],
      ['nerve', 'Optic nerve', 'Carries the signals to the brain.'], ['brain', 'Brain', 'Turns the signals into a picture.']],
    owl: [['cornea', 'Huge cornea', 'A big front window lets in as much light as possible.'], ['lens', 'Big lens', 'A large lens gathers the faint light of the night.'], ['ring', 'Bony ring', 'Little bones hold the eye in a tube shape. The eye can\'t turn, so the owl turns its head.'],
      ['retina', 'Retina full of rods', 'Rods work in dim light. Owls have far more of them than cones, so they see well at night but not many colors.'], ['nerve', 'Optic nerve', 'Carries the signals to the brain.']],
    bee: [['compound', 'Compound eye', 'Each big eye is made of thousands of tiny units. Each one sees one small dot of the world, like one tile in a mosaic.'], ['one', 'One tiny eye unit', 'Each unit has its own lens, a crystal cone, light-sensing cells (some sense ultraviolet) and a nerve.'],
      ['ocelli', 'Three simple eyes', 'On top of the head. They sense how bright it is, which helps the bee fly level and keep its direction.']],
    snake: [['pit', 'Pit', 'A deep hollow on each side of the face with a thin, heat-sensing skin stretched inside. It feels the warmth coming off animals nearby.'], ['eye', 'Eye', 'Rattlesnakes also see with their eyes. The brain puts the eye picture and the heat picture together.'], ['nostril', 'Nostril', 'For breathing. The pit is the hole between the nostril and the eye.']]
  };
  function einfo() {
    const list = PARTS[E], cur = list.find(p => p[0] === partOn);
    $('einfo').innerHTML = `<div class="kicker">${EYES[E].name}</div><h2>${cur ? cur[1] : 'Tap a part'}</h2><p>${cur ? cur[2] : E === 'you' ? 'Light from the Sun bounces off the apple and into your eye. Without light bouncing into your eye, you can\'t see anything.' : 'Tap a label or a part of the drawing.'}</p>
      <div class="parts">${list.map(p => `<button data-pp="${p[0]}" aria-pressed="${p[0] === partOn}">${p[1]}</button>`).join('')}</div>
      ${E === 'you' || E === 'dog' || E === 'owl' ? `<button class="b" id="lights" style="margin-top:12px">${lightsOn ? '🌑 Turn the Sun off' : '☀️ Turn the Sun on'}</button>` : ''}`;
    $('einfo').querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { partOn = b.dataset.pp; SFX.tap(); diagram(); einfo(); });
    if ($('lights')) $('lights').onclick = () => { lightsOn = !lightsOn; SFX.tap(); diagram(); einfo(); };
  }
  function setEye(k) { E = k; partOn = null; whoButtons($('who2'), Object.keys(EYES).map(n => [n, n === 'snake' ? 'Snake' : EYES[n].name]), E, setEye, n => n === 'you' ? EYE_ICON : SRC[n]); diagram(); einfo(); }

  // ---------- field of view ----------
  // degrees: total field around the head, and the part both eyes share (depth). Typical published values; they vary.
  const FOV = {you: ['You', 180, 120, 'Your eyes face forward. Both eyes see most of what is in front of you, which lets you judge distance, but you can\'t see behind you.'],
    owl: ['Owl', 110, 70, 'Owls hunt, so their eyes face forward: lots of depth for judging the pounce, but a narrow view. Their flexible neck makes up for it.'],
    dog: ['Dog', 250, 60, 'Dogs, once hunters, have eyes a little to the sides: a wider view than ours, with less overlap. It changes by breed.'],
    horse: ['Horse', 350, 65, 'Horses are prey. Eyes on the sides of the head watch almost all the way around. There are blind spots right behind and just in front of the nose.'],
    rabbit: ['Rabbit', 350, 30, 'Rabbits can see nearly all the way around without turning, so a fox can hardly sneak up, but they don\'t judge distance well straight ahead.']};
  let F = 'you', fox = [480, 140], seenState = null;
  function drawFov() {
    const [name, tot, bin] = FOV[F], cx = 480, cy = 340, R = 290;
    const arc = (a0, a1, col) => { // angles in degrees, 0 = straight ahead (up), clockwise
      const p = a => [cx + R * Math.sin(a * Math.PI / 180), cy - R * Math.cos(a * Math.PI / 180)];
      const [x0, y0] = p(a0), [x1, y1] = p(a1);
      return `<path d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1} Z" fill="${col}"/>`;
    };
    const head = F === 'you' ? EYE_ICON : SRC[F === 'rabbit' ? 'rabbithead' : F];
    const ang = Math.atan2(fox[0] - cx, -(fox[1] - cy)) * 180 / Math.PI, d = Math.abs(ang);
    const st = d <= bin / 2 ? 'both' : d <= tot / 2 ? 'one' : 'none';
    if (st !== seenState && seenState !== null) (st === 'none' ? SFX.buzz : SFX.tap)();
    seenState = st;
    $('fov').innerHTML = `<svg viewBox="0 0 960 640" aria-label="Seen from above: the colored areas are what the ${name.toLowerCase()} can see">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#00000030"/>
      ${arc(-tot / 2, tot / 2, '#ffffff66')}${arc(-bin / 2, bin / 2, '#f4c430aa')}
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R - 20}" stroke="#ffffff99" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="${cx}" y="${cy - R - 28}" text-anchor="middle" class="lbl" style="fill:#fff">facing this way</text>
      <clipPath id="hc"><circle cx="${cx}" cy="${cy}" r="58"/></clipPath><circle cx="${cx}" cy="${cy}" r="62" fill="#fdfdf6"/>
      <image href="${head}" x="${cx - 58}" y="${cy - 58}" width="116" height="116" clip-path="url(#hc)" preserveAspectRatio="xMidYMid slice"/>
      <g id="foxg" style="cursor:grab"><image href="${SRC.fox}" x="${fox[0] - 70}" y="${fox[1] - 40}" width="140" height="80" preserveAspectRatio="xMidYMid meet"/>
      <circle cx="${fox[0]}" cy="${fox[1]}" r="62" fill="none" stroke="${st === 'none' ? '#d0846a' : st === 'one' ? '#fff' : '#f4c430'}" stroke-width="5" stroke-dasharray="${st === 'none' ? '8 8' : ''}"/></g>
      <g transform="translate(24 560)"><rect width="22" height="22" fill="#f4c430aa" rx="4"/><text x="32" y="18" class="lbl" style="fill:#fff">Both eyes: sees depth (${bin}°)</text>
      <rect y="34" width="22" height="22" fill="#ffffff88" rx="4"/><text x="32" y="52" class="lbl" style="fill:#fff">One eye (${tot}° in all)</text></g>
    </svg>`;
    $('finfo').innerHTML = `<div class="kicker">${name}</div><div class="fovmsg">${st === 'both' ? '👀 Seen with both eyes' : st === 'one' ? '👁️ Seen with one eye' : '🙈 The fox is in the blind spot!'}</div>
      <p>${FOV[F][3]}</p><p style="color:var(--muted)">Drag the fox around. Predators like owls have eyes in front; prey like rabbits and horses have eyes on the sides.</p>`;
  }
  let fdrag = false;
  $('fov').onpointerdown = e => { fdrag = true; $('fov').setPointerCapture(e.pointerId); moveFox(e); };
  $('fov').onpointermove = e => { if (fdrag) moveFox(e); };
  $('fov').onpointerup = () => fdrag = false;
  function moveFox(e) { const b = $('fov').getBoundingClientRect(); fox = [Math.max(70, Math.min(890, (e.clientX - b.left) / b.width * 960)), Math.max(50, Math.min(600, (e.clientY - b.top) / b.height * 640))]; drawFov(); }
  $('fov').tabIndex = 0;
  $('fov').onkeydown = e => { const d = {ArrowLeft: [-30, 0], ArrowRight: [30, 0], ArrowUp: [0, -30], ArrowDown: [0, 30]}[e.key]; if (d) { fox = [Math.max(70, Math.min(890, fox[0] + d[0])), Math.max(50, Math.min(600, fox[1] + d[1]))]; drawFov(); e.preventDefault(); } };
  function setFov(k) { F = k; seenState = null; whoButtons($('who3'), Object.keys(FOV).map(n => [n, FOV[n][0]]), F, setFov, n => n === 'you' ? EYE_ICON : SRC[n === 'rabbit' ? 'rabbithead' : n]); drawFov(); }

  // ---------- who's looking ----------
  let Q = null;
  function newQuiz() {
    const r = [...ORDER, ...ORDER].sort(() => Math.random() - .5).slice(0, 8);
    Q = {list: r, i: 0, res: []}; showQ();
  }
  function showQ() {
    const k = Q.list[Q.i], g = $('qc').getContext('2d');
    // a random window of the animal's view, so rounds don't repeat
    const zoom = 1.6, cw = W / zoom, ch = 705 / zoom;
    let x0 = Math.random() * (W - cw), y0 = H - ch - Math.random() * (H * .35);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, 705);
    if (k === 'eagle') { const big = mk(); compose(DAY, big.getContext('2d'), 4, 1130, 430); x0 = Math.min(W - cw, 1130 - cw / 2); y0 = Math.min(H - ch, 430 - ch / 2); g.drawImage(big, x0, y0, cw, ch, 0, 0, W, 705); }
    else g.drawImage(getView(k), x0, y0, cw, ch, 0, 0, W, 705);
    const opts = [k, ...ORDER.filter(n => n !== k).sort(() => Math.random() - .5).slice(0, 2)].sort(() => Math.random() - .5);
    $('qopts').innerHTML = opts.map(n => `<button class="b" data-q="${n}"><img src="${SRC[n]}" alt="">${ANIMALS[n].name}</button>`).join('');
    $('qmsg').innerHTML = `Round ${Q.i + 1} of ${Q.list.length}: whose eyes are these?`;
    $('qprog').innerHTML = Q.list.map((_, i) => `<i class="${Q.res[i] === 1 ? 'ok' : Q.res[i] === 0 ? 'no' : ''} ${i === Q.i ? 'now' : ''}"></i>`).join('');
    $('qopts').querySelectorAll('[data-q]').forEach(b => b.onclick = () => answer(b.dataset.q));
  }
  const CLUE = {bee: 'The mosaic of little dots and purple ultraviolet bullseyes give the bee away.', dog: 'Blues and yellows but no reds or greens: dog eyes.', eagle: 'A tiny rabbit far off by the fence, seen up close and sharp: eagle eyes.', owl: 'A night scene that looks bright but nearly colorless: owl eyes.', snake: 'Glowing warm animals in the dark: a rattlesnake\'s heat-sensing pits.'};
  function answer(n) {
    const k = Q.list[Q.i]; if (Q.res[Q.i] !== undefined) return;
    const ok = n === k; Q.res[Q.i] = ok ? 1 : 0; (ok ? SFX.good : SFX.miss)();
    $('qopts').querySelectorAll('[data-q]').forEach(b => { b.disabled = true; if (b.dataset.q === k) b.classList.add('right'); else if (b.dataset.q === n) b.classList.add('wrong'); });
    const last = Q.i === Q.list.length - 1;
    $('qmsg').innerHTML = `${ok ? 'Yes! ' : `It was the ${ANIMALS[k].name.toLowerCase()}. `}${CLUE[k]} <button class="b go" id="qn" style="margin-left:8px">${last ? 'See my score' : 'Next ▶'}</button>`;
    $('qprog').innerHTML = Q.list.map((_, i) => `<i class="${Q.res[i] === 1 ? 'ok' : Q.res[i] === 0 ? 'no' : ''} ${i === Q.i ? 'now' : ''}"></i>`).join('');
    $('qn').focus();
    $('qn').onclick = () => {
      SFX.tap();
      if (!last) { Q.i++; showQ(); return; }
      const sc = Q.res.reduce((a, b) => a + b, 0);
      $('qopts').innerHTML = `<button class="b go" id="qagain">Play again</button>`;
      $('qmsg').innerHTML = `<b>${sc} of ${Q.list.length}.</b> ${sc >= 7 ? 'You know your animal eyes!' : 'Try Look through again and drag the circle around, then play again.'}`;
      $('qagain').onclick = newQuiz;
    };
  }

  // ---------- modes ----------
  let mode = 'look';
  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    $('lookview').hidden = m !== 'look'; $('eyeview').hidden = m !== 'eye'; $('fovview').hidden = m !== 'fov'; $('quizview').hidden = m !== 'quiz';
    if (m === 'eye') setEye(E);
    if (m === 'fov') setFov(F);
    if (m === 'quiz' && !Q) newQuiz();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { SFX.tap(); setMode(b.dataset.mode); });
  document.addEventListener('keydown', e => { if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.altKey) setMode(['look', 'eye', 'fov', 'quiz'][+e.key - 1]); });

  Promise.all(Object.entries(SRC).map(([k, s]) => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { IM[k] = im; res(); }; im.src = s; })))
    .then(() => {
      // the sky, for stars at night and cold air in heat vision
      const d = px(compose([])).data; skyMask = new Uint8Array(W * H);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) { const y = j / W | 0; skyMask[j] = y < H * .5 && d[i + 2] > d[i] + 15 && d[i + 2] >= d[i + 1] - 5 ? 1 : 0; }
      setAnimal('bee');
    });
  window.__has = {setMode, setAnimal, getView, views, DAY, NIGHT, FLOWER, get lens() { return lens; }, set lens(v) { lens = v; drawLook(); }};
})();
</script>
