      </div>
    </div>
  </section>
  <section class="mode" id="backstage" aria-label="Direct Pom" hidden>
    <div class="bare stage">
      <img class="backdrop" src="art:park" alt="">
      <div class="puppet-window">
        <div class="puppet" id="back-pom">
          <img class="closed" src="art:pom-closed" alt="Pom on the bare stage">
          <img class="open" src="art:pom-open" alt="">
        </div>
      </div>
      <p id="target" hidden></p>
      <div class="audience-card" id="audience-card" hidden>
        <div class="eyebrow">The audience sees</div><div class="feeling" id="audience-feeling" aria-live="polite"></div>
      </div>
    </div>
    <div class="console">
      <div class="control-group"><h2>Head</h2><div class="choices" id="head-controls"></div></div>
      <div class="control-group"><h2>Voice</h2><div class="choices" id="voice-controls"></div></div>
      <div class="control-group"><h2>Bounce</h2><div class="choices" id="bounce-controls"></div></div>
      <div class="actions">
        <div class="talk-actions">
        <button id="say">▱ Say it</button>
        <button id="line"><svg id="line-picture" viewBox="0 0 80 64" aria-hidden="true"></svg><span>Line 1</span></button>
        <button id="audience" class="gold">◉ Audience says</button>
        </div>
        <div class="target-actions">
        <button id="try" aria-pressed="false">☆ Try it</button>
        <button id="next-target" hidden>➜ Next target</button>
        </div>
      </div>
      <p class="changed" id="changed">Change one thing. Watch Pom.</p>
    </div>
  </section>
  <section class="mode" id="likeme" aria-label="Feelings like mine" hidden>
    <div class="shelf stage">
      <img class="shelf-bg" src="art:shelf" alt="Bedroom shelf with books and a little plant">
      <div class="puppet-window">
        <div class="puppet" id="like-pom">
          <img class="closed" src="art:pom-closed" alt="Pom resting on a shelf">
          <img class="open" src="art:pom-open" alt="">
        </div>
      </div>
      <div class="feeling-ring" id="feelings"></div>
    </div>
    <div class="like-panel">
      <p id="life-prompt">Puppets have feelings like we do. Tap a feeling.</p>
      <div id="votes" class="vote" hidden></div>
      <button id="vote" class="gold" aria-pressed="false">▣ Ending vote</button>
    </div>
  </section>
</main>
<footer><p id="hint" class="hint" aria-live="polite"></p></footer>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const feelings = ['sad','calm','proud','happy','excited','worried'];
  const table = [
    [['sad','sad','sad'],['sad','worried','worried'],['worried','worried','worried']],
    [['calm','calm','happy'],['calm','happy','excited'],['worried','worried','excited']],
    [['proud','proud','happy'],['proud','happy','excited'],['happy','excited','excited']]
  ];
  const presets = {sad:[0,0,0],calm:[1,0,0],proud:[2,0,0],happy:[2,1,1],excited:[2,2,2],worried:[0,2,1]};
  const labels = [['Down','Straight','Up'],['Slow','Middle','Fast'],['Still','Small','Big']];
  const scenes = [
    {line:'This is Pom, a sock puppet. Pom has a brand new red kite.', settings:[2,1,1], n:6, f:'happy'},
    {line:'Whoosh! The wind lifts the kite up high.', settings:[2,2,2], n:8, f:'excited'},
    {line:'Oh no! The kite is stuck in the tall tree.', settings:[0,2,1], n:7, f:'worried'},
    {line:'Pom tugs and tugs. The kite will not come down.', settings:[0,0,0], n:5, f:'sad'},
    {line:'What happens next? Tap an ending.', settings:[1,0,0], n:0, f:'calm'}
  ];
  const endings = [
    {name:'Dot helps', icon:'🧦🧦', line:"Pom's friend Dot comes by with a long stick. Together they wiggle the kite free!",
      settings:[2,2,2], n:8, f:'excited', vote:'Some people like it when a friend helps.'},
    {name:'A new kite', icon:'🪁✂', line:'Pom finds paper and string, and makes a brand new kite, all by herself.',
      settings:[2,0,0], n:6, f:'proud', vote:'Some people like it when you fix it yourself.'},
    {name:'Wait for the wind', icon:'〰', line:'Pom sits under the tree and waits. A soft breeze drops the kite right down.',
      settings:[1,0,0], n:5, f:'calm', vote:'Some people like a quiet, patient ending.'}
  ];
  const state = {mode:'show', scene:0, ending:null, revealed:false, back:[2,1,1], line:0,
    try:false, target:0, met:false, like:null, voteOpen:false, vote:null, changes:0, started:false};
  const L = {
    wShow:'Welcome to the puppet show! Watch Pom. Then tap Next.',
    wBack:"You're the puppeteer now. Change one thing at a time: Head, Voice or Bounce.",
    wLike:'Puppets have feelings like we do. Tap a feeling.',
    question:'How does Pom feel? Tell me. Then tap Show me.',
    ending:'Choose an ending. Tap Dot helps, A new kite, or Wait for the wind.',
    change:'What do you see now? Say it. Then tap Audience says.',
    flip:'Only one thing changed, and the feeling changed!',
    scenes:scenes.map(s => s.line), endings:endings.map(e => e.line), votes:endings.map(e => e.vote),
    reveal:feelings.map(f => revealLine(f)), audience:feelings.map(f => audienceLine(f)),
    praise:feelings.map(f => `Yes! Pom looks ${f}!`), life:feelings.map(f => lifeLine(f)),
    targets:feelings.map(f => `Make Pom look ${f}. Tap Head, Voice or Bounce.`),
    voteHow:'Tap the ending you like. Tell Pom why.',
    voteWhy:'Why do you like that ending? How did it make you feel?',
    voteMore:'Tell Pom why. Tap the chosen ending again to hear another reason.',
    start:'Tap Pom to start the show.',
    backRead:[], settingsRead:[], hints:[], lineHints:scenes.slice(0,4).concat(endings).map(s => s.line + ' Tap Say it.')
  };
  function lifeLine(f) {
    const moments = {happy:'Pom felt happy with a brand new red kite.',excited:'Pom felt excited when the wind lifted the kite.',
      worried:'Pom felt worried when the kite got stuck.',sad:'Pom felt sad when the kite would not come down.',
      proud:'Pom felt proud after making a new kite.',calm:'Pom felt calm while waiting for the wind.'};
    return `${moments[f]} When did you feel ${f}? Tell Pom, or pass.`;
  }
  function revealLine(f) {
    const [h,v,b] = presets[f];
    return `Pom feels ${f}. Head ${labels[0][h].toLowerCase()}, ${labels[1][v].toLowerCase()} voice, ${labels[2][b].toLowerCase()} bounce.`;
  }
  function audienceLine(f) { return `The audience sees ${f === 'excited' ? 'an' : 'a'} ${f} Pom.`; }
  const backLine = () => state.line < 4 ? scenes[state.line] : endings[state.ending ?? 0];
  let flipPending = false;
  let flipDone = false;
  let flipSpeaking = false;
  for (let h=0; h<3; h++) for (let v=0; v<3; v++) for (let b=0; b<3; b++) {
    L.backRead.push(`Pom reads as ${table[h][v][b]}. Head ${labels[0][h]}. Voice ${labels[1][v]}. Bounce ${labels[2][b]}.`);
    L.settingsRead.push(`Head ${labels[0][h]}. Voice ${labels[1][v]}. Bounce ${labels[2][b]}.`);
  }
  const showHint = () => {
    if (!state.started) return L.start;
    if (state.scene === 4) return L.ending;
    if (!state.revealed) return L.question;
    return state.scene === 5 ? 'Tap Play again, or choose a different ending.' :
      'Tap Next to keep watching, or Again to watch this part.';
  };
  L.hints = ['Tap Next to keep watching, or Again to watch this part.', 'Tap Play again, or choose a different ending.',
    'Tap Head, Voice or Bounce. Then tap Audience says.', 'Tap Say it to hear Pom, or Line to change the story line.'];
  let serial = 0;
  let targetTimer;
  let babbleTimer;
  let activeNodes = [];
  let audio;
  let babbleLog = [];
  let entryActions = 0;
  const feeling = settings => table[settings[0]][settings[1]][settings[2]];
  const current = () => state.scene === 5 ? endings[state.ending ?? 0] : scenes[state.scene];
  const V = Curio.voice({
    lines:L, scope:() => state.mode + ':' + state.scene, hint:false,
    welcome:() => state.mode === 'show' ? (!state.scene ? ['wShow',{valid:() => state.scene === 0}] : null) :
      state.mode === 'backstage' ? (!entryActions ? ['wBack',{valid:() => !entryActions}] : null) :
      (!entryActions ? ['wLike',{valid:() => !entryActions}] : null),
    speaks:'#next, #back, #again, #say, #line, .ending-button',
    read:() => state.mode === 'show' ? [current().line,$('hint').textContent] :
      state.mode === 'backstage' ? [($('audience-card').hidden ? L.settingsRead : L.backRead)
        [state.back[0]*9+state.back[1]*3+state.back[2]],$('hint').textContent] :
      [$('life-prompt').textContent,$('hint').textContent]
  });
  function face(f) {
    const mouths = {sad:'M15 36 Q24 26 33 36',calm:'M17 32 Q24 36 31 32',proud:'M16 31 Q25 36 33 28',
      happy:'M14 29 Q24 42 34 29',excited:'M15 29 Q24 44 33 29 Z',worried:'M17 34 Q20 30 24 34 T32 34'};
    const brows = {sad:'M12 20 Q16 20 20 17 M28 17 Q32 20 36 20',calm:'M13 17 L20 17 M28 17 L35 17',
      proud:'M13 17 L20 15 M28 15 L35 17',happy:'M13 18 Q17 13 21 18 M27 18 Q31 13 35 18',
      excited:'M12 16 Q17 9 22 16 M26 16 Q31 9 36 16',worried:'M13 17 Q18 11 21 12 M27 12 Q30 11 35 17'};
    return `<svg class="face" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#ffe09a"/>
      <path d="${brows[f]} ${mouths[f]}" fill="none" stroke="#403523" stroke-width="3" stroke-linecap="round"/>
      <g fill="#403523"><circle cx="17" cy="24" r="2"/><circle cx="31" cy="24" r="2"/></g></svg>`;
  }
  function feelingHTML(f) { return face(f) + `<span>${f}</span>`; }
  function controlIcon(k,i) {
    const start = '<svg class="control-icon" viewBox="0 0 40 40" aria-hidden="true">';
    if (k === 0) {
      return start + `<g transform="rotate(${[32,0,-25][i]} 20 32)">` +
        '<path d="M13 33 L13 14 Q14 6 23 7 Q33 8 32 16 Q31 21 22 20 L22 33 Z" ' +
        'fill="#ed9d48" stroke="#43382a" stroke-width="2"/><path d="M13 26 H22 M14 30 H22" ' +
        'stroke="#0b7a72" stroke-width="3"/><circle cx="24" cy="12" r="2" fill="#43382a"/></g></svg>';
    }
    if (k === 1) return `<span aria-hidden="true">${['🐌','👟','🐇'][i]}</span>`;
    return start + (i === 0 ? '<circle cx="20" cy="29" r="3" fill="#43382a"/>' :
      `<path d="M6 31 Q20 ${i === 1 ? 12 : -16} 34 31" fill="none" stroke="#43382a" stroke-width="3"/>`) + '</svg>';
  }
  const hint = text => { $('hint').textContent = text; };
  function stopBabble() {
    clearTimeout(babbleTimer);
    for (const node of activeNodes) { try { node.stop(); } catch {} }
    activeNodes = [];
    document.querySelectorAll('.puppet').forEach(p => p.classList.remove('talking'));
  }
  function cancel(stopVoice = true) {
    serial++;
    stopBabble();
    clearTimeout(targetTimer);
    if (stopVoice) V.hush();
    else V.dropQueued();
  }
  // Two or three sine and noise blips make each syllable. Mouth timing also runs with Sound off.
  function blip(duration, pitch) {
    if (!Curio.sound) return;
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const n = 2 + Math.round(Math.random());
    for (let i=0; i<n; i++) {
      const t = audio.currentTime + i*duration/n;
      const d = duration/n*.78;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.setValueAtTime((300+i*65)*pitch,t);
      osc.frequency.exponentialRampToValueAtTime((420-i*35)*pitch,t+d);
      gain.gain.setValueAtTime(.0001,t);
      gain.gain.exponentialRampToValueAtTime(.07,t+.008);
      gain.gain.exponentialRampToValueAtTime(.0001,t+d);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t+d);
      activeNodes.push(osc);
      const buffer = audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let k=0; k<data.length; k++) data[k] = (Math.random()*2-1)*.013*(1-k/data.length);
      const noise = audio.createBufferSource();
      const filter = audio.createBiquadFilter();
      noise.buffer = buffer;
      filter.type = 'lowpass';
      filter.frequency.value = 1300*pitch;
      noise.connect(filter).connect(audio.destination);
      noise.start(t);
      activeNodes.push(noise);
    }
  }
  function babble(n, settings, done = () => {}) {
    stopBabble();
    const me = serial;
    const ms = [260,150,95][settings[1]];
    const pitch = [.85,1,1.15][settings[1]];
    const puppets = state.mode === 'show' ? [$('show-pom'),...(!$( 'show-dot').hidden ? [$('show-dot')] : [])] :
      [$(state.mode === 'backstage' ? 'back-pom' : 'like-pom')];
    let syllable = 0;
    babbleLog.push({n,ms,pitch,mode:state.mode,t:performance.now()});
    function tick() {
      if (me !== serial) return;
      if (syllable >= n) { stopBabble(); done(); return; }
      puppets.forEach(p => p.classList.add('talking'));
      blip(ms/1000*.8,pitch);
      syllable++;
      babbleTimer = setTimeout(() => {
        puppets.forEach(p => p.classList.remove('talking'));
        babbleTimer = setTimeout(tick,ms*.25);
      },ms*.75);
    }
    tick();
  }
  let tilt = -18;
  let fromTilt = tilt;
  let toTilt = tilt;
  let tiltTime = performance.now();
  let bounceAmplitude = 12;
  let bounceFrequency = 1.2;
  let targetAmplitude = 12;
  let targetFrequency = 1.2;
  let phase = 0;
  let previousFrame = performance.now();
  function pose(settings) {
    fromTilt = tilt;
    toTilt = [28,0,-18][settings[0]];
    tiltTime = performance.now();
    targetAmplitude = [0,12,34][settings[2]];
    targetFrequency = [0,1.2,2.2][settings[2]];
    if (Curio.reduce) { tilt = toTilt; bounceAmplitude = targetAmplitude; bounceFrequency = targetFrequency; }
  }
  function frame(now) {
    const dt = Math.min(.05,(now-previousFrame)/1000);
    previousFrame = now;
    const p = Math.min(1,(now-tiltTime)/250);
    tilt = Curio.reduce ? toTilt : fromTilt + (toTilt-fromTilt)*(1-(1-p)**3);
    const mix = 1-Math.exp(-dt*14);
    bounceAmplitude += (targetAmplitude-bounceAmplitude)*mix;
    bounceFrequency += (targetFrequency-bounceFrequency)*mix;
    if (!Curio.reduce) phase += dt*bounceFrequency*Math.PI*2;
    const stage = state.mode === 'show' ? $('theater') : $(state.mode === 'backstage' ? 'backstage' : 'likeme');
    const scale = Math.min(1.3,stage.clientHeight/450);
    const y = Curio.reduce ? 0 : -bounceAmplitude*(.5-.5*Math.cos(phase))*scale;
    const ids = state.mode === 'show' ? ['show-pom','show-dot'] : [state.mode === 'backstage' ? 'back-pom' : 'like-pom'];
    ids.forEach(id => { $(id).style.transform = `translateY(${y}px) rotate(${tilt}deg)`; });
    requestAnimationFrame(frame);
  }
  function renderShow() {
    const scene = current();
    $('theater').className = 'theater scene-' + state.scene;
    $('theater').dataset.ending = state.ending ?? '';
    $('scene-line').textContent = scene.line;
    $('dots').innerHTML = scenes.concat([endings[0]]).map((s,i) => `<span class="${i===state.scene ? 'now' : ''}"></span>`).join('');
    $('dots').setAttribute('aria-label',`Scene ${state.scene+1} of 6`);
    $('question').hidden = state.scene === 4;
    if (state.revealed && document.activeElement === $('reveal')) $('again').focus({preventScroll:true});
    $('reveal').hidden = state.revealed;
    $('reveal-feeling').hidden = !state.revealed;
    $('reveal-feeling').innerHTML = feelingHTML(scene.f) + `<small class="clue-text">${revealLine(scene.f).split('. ')[1]}</small>`;
    $('endings').hidden = state.scene < 4;
    if (state.scene === 4 && document.activeElement === $('next')) $('ending-0').focus({preventScroll:true});
    $('next').disabled = state.scene === 4;
    $('next').textContent = state.scene === 5 ? '↻ Play again' : 'Next ▶';
    $('show-dot').hidden = !(state.scene === 5 && state.ending === 0);
    $('stick').hidden = $('show-dot').hidden;
    $('kite').src = state.scene === 5 && state.ending === 1 ? images.newKite : images.kite;
    $('kite').alt = state.scene === 5 && state.ending === 1 ? 'New yellow and green kite' : 'Red kite';
    $('stuck-kite').hidden = !(state.scene === 5 && state.ending === 1);
    endings.forEach((e,i) => $('ending-'+i).setAttribute('aria-pressed',state.ending === i && state.scene === 5));
    hint(showHint());
    pose(scene.settings);
  }
  async function playScene({welcome = false} = {}) {
    cancel();
    state.started = true;
    state.revealed = false;
    renderShow();
    if (welcome && state.scene === 0) V.welcome();
    const me = serial;
    const scene = current();
    await V.say(scene.line,{wait:true,valid:() => me === serial});
    if (me !== serial) return;
    if (state.scene === 4) { V.how('ending',{needs:'#ending-0',valid:() => state.scene === 4}); return; }
    babble(scene.n,scene.settings,() => {
      if (!state.revealed && me === serial) V.say('question',{needs:'#reveal',valid:() => !state.revealed && me === serial});
    });
  }
  const images = {kite:'art:kite',newKite:'art:new-kite'};
  function chooseEnding(i) {
    state.ending = i;
    state.scene = 5;
    Curio.yes();
    playScene();
  }
  function nextScene(delta) {
    if (!state.started) { playScene({welcome:true}); return; }
    if (delta > 0 && state.scene === 4) return;
    state.scene = state.scene === 5 && delta > 0 ? 0 : Math.max(0,state.scene+delta);
    if (!state.scene) state.ending = null;
    playScene();
  }
  function updateControls() {
    $('backstage').dataset.head = state.back[0];
    ['head','voice','bounce'].forEach((name,k) => {
      for (let i=0; i<3; i++) $(name+'-'+i).setAttribute('aria-pressed',state.back[k] === i);
    });
  }
  function renderLinePicture() {
    const scene = backLine();
    const picture = (src,x,y,w,h,turn = 0) =>
      `<image href="${src}" x="${x}" y="${y}" width="${w}" height="${h}" transform="rotate(${turn} 28 64)"/>`;
    const park = $('theater').querySelector('.backdrop').src;
    const pom = $('show-pom').querySelector('.closed').src;
    const dot = $('show-dot').querySelector('.closed').src;
    const kite = state.line === 4 && state.ending === 1 ? images.newKite : images.kite;
    const inTree = state.line >= 2 && state.line <= 3;
    $('line-picture').innerHTML = picture(park,0,0,80,64) +
      (state.line === 4 && (state.ending ?? 0) === 0 ? picture(dot,0,22,25,50) : '') +
      picture(pom,12,12,32,60,[28,0,-18][scene.settings[0]]) +
      picture(kite,inTree ? 57 : 42,state.line === 1 ? 0 : inTree ? 14 : 29,18,34);
    $('line').title = scene.line;
  }
  function checkTarget(changed = false) {
    if (!state.try) return;
    const met = feeling(state.back) === feelings[state.target];
    if (met && changed) {
      state.met = true;
      renderTarget();
      Curio.yes();
      const target = state.target;
      V.say(`Yes! Pom looks ${feelings[target]}!`,{
        valid:() => state.mode === 'backstage' && state.try && state.met && state.target === target &&
          feeling(state.back) === feelings[target]});
      clearTimeout(targetTimer);
      targetTimer = setTimeout(nextTarget,2000);
    } else if (!met) {
      state.met = false;
      clearTimeout(targetTimer);
      renderTarget();
    }
  }
  function change(k,i) {
    const old = state.back[k];
    if (old === i) {
      $('audience-card').hidden = true;
      return;
    }
    const before = feeling(state.back);
    serial++;
    V.hush();
    V.dropQueued();
    state.back[k] = i;
    state.changes++;
    entryActions++;
    $('audience-card').hidden = true;
    updateControls();
    pose(state.back);
    $('changed').innerHTML = `${['Head','Voice','Bounce'][k]}: ${controlIcon(k,old)} ${labels[k][old]} → ` +
      `${controlIcon(k,i)} ${labels[k][i]}`;
    hint(state.try ? L.targets[state.target] : V.heard('change') ? L.hints[2] : L.change);
    const me = serial;
    flipPending = before !== feeling(state.back);
    const valid = () => state.mode === 'backstage' && me === serial && $('audience-card').hidden;
    Curio.tone(330 + k*90,.07,.04);
    babble(backLine().n,state.back,() => {
      if (valid() && !state.try) V.how('change',{needs:'#audience',valid});
    });
    checkTarget(true);
  }
  function renderTarget() {
    $('target').hidden = !state.try;
    $('next-target').hidden = !state.try;
    $('try').setAttribute('aria-pressed',state.try);
    $('target').innerHTML = `${state.met ? '✓' : 'Make Pom look'} ${feelingHTML(feelings[state.target])}`;
  }
  function nextTarget() {
    clearTimeout(targetTimer);
    state.target = (state.target+1)%6;
    state.met = false;
    renderTarget();
    hint(L.targets[state.target]);
    const target = state.target;
    V.say(L.targets[target],{valid:() => state.mode === 'backstage' && state.try && state.target === target});
  }
  async function audience() {
    serial++;
    stopBabble();
    const f = feeling(state.back);
    $('audience-card').hidden = false;
    $('audience-feeling').innerHTML = feelingHTML(f);
    hint('Tap Head, Voice or Bounce. Then tap Audience says.');
    V.dropQueued();
    const me = serial;
    const valid = () => state.mode === 'backstage' && me === serial && !$('audience-card').hidden && feeling(state.back) === f;
    const start = V.log.length;
    await V.say(audienceLine(f),{now:true,wait:true,valid});
    const result = V.log.slice(start).find(e => e.as === 'spoken' && e.text === audienceLine(f));
    if (!valid() || !result || result.cut || !flipPending || flipDone || flipSpeaking) return;
    flipSpeaking = true;
    const index = V.log.length;
    await V.say('flip',{wait:true,valid});
    const line = V.log.slice(index).find(e => e.as === 'spoken' && e.key === 'flip');
    if (line && !line.cut) { flipDone = true; flipPending = false; }
    flipSpeaking = false;
  }
  function like(f) {
    cancel(false);
    state.like = f;
    $('likeme').dataset.head = presets[f][0];
    entryActions++;
    pose(presets[f]);
    $('life-prompt').textContent = lifeLine(f);
    feelings.forEach(x => $('feel-'+x).setAttribute('aria-pressed',x === f));
    hint($('life-prompt').textContent);
    V.say($('life-prompt').textContent,{now:true,valid:() => state.like === f});
    Curio.tone(440,.09,.06);
  }
  function vote(i) {
    const again = state.vote === i;
    state.vote = i;
    endings.forEach((e,k) => $('vote-'+k).setAttribute('aria-pressed',k === i));
    const line = again ? endings[i].vote : L.voteWhy;
    $('life-prompt').textContent = line;
    hint(L.voteMore);
    V.say(line,{now:true,
      valid:() => state.mode === 'likeme' && state.vote === i && state.voteOpen &&
        $('life-prompt').textContent === line});
    Curio.yes();
  }
  function setMode(mode) {
    if (mode === state.mode) return;
    cancel();
    state.mode = mode;
    entryActions = 0;
    for (const m of ['show','backstage','likeme']) {
      $(m).hidden = m !== mode;
      $('m-'+m).setAttribute('aria-pressed',m === mode);
    }
    if (mode === 'show') { renderShow(); playScene({welcome:true}); }
    else if (mode === 'backstage') {
      updateControls();
      renderLinePicture();
      renderTarget();
      pose(state.back);
      if (state.try && state.met) targetTimer = setTimeout(nextTarget,2000);
      hint(state.try ? L.targets[state.target] : L.wBack);
      V.welcome();
    } else {
      pose(state.like ? presets[state.like] : presets.calm);
      hint(state.voteOpen ? (state.vote === null ? L.voteHow : L.voteMore) : state.like ? lifeLine(state.like) : L.wLike);
      V.welcome();
    }
  }
  ['head','voice','bounce'].forEach((name,k) => {
    labels[k].forEach((label,i) => {
      const b = document.createElement('button');
      b.id = name+'-'+i;
      b.setAttribute('aria-pressed',state.back[k] === i);
      const icon = controlIcon(k,i);
      b.innerHTML = icon + ' ' + label;
      b.onclick = () => change(k,i);
      $(name+'-controls').append(b);
    });
  });
  feelings.forEach(f => {
    const b = document.createElement('button');
    b.id = 'feel-'+f;
    b.innerHTML = feelingHTML(f);
    b.setAttribute('aria-pressed','false');
    b.onclick = () => like(f);
    $('feelings').append(b);
  });
  endings.forEach((e,i) => {
    for (const [parent,prefix,fn] of [[$('endings'),'ending-',chooseEnding],[$('votes'),'vote-',vote]]) {
      const b = document.createElement('button');
      b.id = prefix+i;
      b.className = 'ending-button';
      b.setAttribute('aria-pressed','false');
      b.innerHTML = `<span class="symbol" aria-hidden="true">${e.icon}</span><span>${e.name}</span>`;
      b.onclick = () => fn(i);
      parent.append(b);
    }
  });
  for (const m of ['show','backstage','likeme']) $('m-'+m).onclick = () => setMode(m);
  $('next').onclick = () => nextScene(1);
  $('back').onclick = () => nextScene(-1);
  $('again').onclick = () => playScene({welcome:!state.started});
  $('reveal').onclick = () => {
    if (!state.started) { playScene({welcome:true}); return; }
    state.revealed = true;
    V.hush();
    renderShow();
    V.say(revealLine(current().f),{now:true,valid:() => state.revealed});
    Curio.yes();
  };
  $('say').onclick = () => {
    serial++;
    V.hush();
    babble(backLine().n,state.back);
    hint(L.hints[3]);
  };
  $('line').onclick = () => {
    serial++;
    V.dropQueued();
    stopBabble();
    state.line = (state.line+1)%5;
    $('line').querySelector('span').textContent = 'Line '+(state.line+1);
    renderLinePicture();
    const line = backLine();
    hint(line.line + ' Tap Say it.');
    const me = serial;
    V.say(line.line,{now:true,wait:true,valid:() => state.mode === 'backstage' && serial === me}).then(() => {
      if (state.mode === 'backstage' && serial === me) babble(line.n,state.back);
    });
  };
  $('audience').onclick = audience;
  $('try').onclick = () => {
    cancel();
    state.try = !state.try;
    V.dropQueued();
    state.met = false;
    renderTarget();
    hint(state.try ? L.targets[state.target] : L.change);
    if (state.try) {
      const target = state.target;
      V.say(L.targets[target],{valid:() => state.mode === 'backstage' && state.try && state.target === target});
    }
  };
  $('next-target').onclick = nextTarget;
  $('vote').onclick = () => {
    V.hush();
    state.voteOpen = !state.voteOpen;
    $('votes').hidden = !state.voteOpen;
    $('vote').setAttribute('aria-pressed',state.voteOpen);
    $('life-prompt').textContent = state.voteOpen ? (state.vote !== null ? L.voteWhy : L.voteHow) :
      state.like ? lifeLine(state.like) : L.wLike;
    hint(state.voteOpen ? (state.vote === null ? L.voteHow : L.voteMore) : state.like ? lifeLine(state.like) : L.wLike);
    if (state.voteOpen) V.how('voteHow',{valid:() => state.mode === 'likeme' && state.voteOpen});
  };
  document.addEventListener('keydown',e => {
    if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
    if (state.mode === 'show' && ['ArrowRight','ArrowLeft'].includes(e.key)) {
      e.preventDefault();
      nextScene(e.key === 'ArrowRight' ? 1 : -1);
    }
    if (state.mode !== 'backstage') return;
    const k = {h:0,v:1,b:2}[e.key.toLowerCase()];
    if (k !== undefined) {
      e.preventDefault();
      change(k,(state.back[k]+1)%3);
    }
    if (e.key.toLowerCase() === 'a') { e.preventDefault(); audience(); }
  });
  Curio.init({clips:"voice:*",rate:.9});
  $('read').addEventListener('click',() => {
    serial++;
    stopBabble();
  });
  Curio.onSound(on => { if (!on) stopBabble(); });
  Curio.onMotion(() => pose(state.mode === 'show' ? current().settings : state.mode === 'backstage' ? state.back : presets[state.like || 'calm']));
  $('theater').addEventListener('click',e => {
    if (!state.started && !e.target.closest('button')) playScene({welcome:true});
  });
  requestAnimationFrame(frame);
  renderShow();
  hint(L.start);
  renderLinePicture();
  window.__tool = {state,setMode,allLines:V.allLines,vlog:V.log,feeling,table,presets,scenes,endings,
    change,chooseEnding,playScene,babbleLog,get vq() { return V.queue; },get tilt() { return tilt; }};
})();
</script>
</body>
</html>
