<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowy Mail Route · Arrow by arrow through the snow · Curio Class</title>
<meta name="description" content="Pip the mail penguin walks exactly the arrow cards the class lays down and leaves numbered footprints in the snow, so a wrong turn points straight at the wrong card. Grade 1 computer science: sequences and debugging. Works offline.">
<!--
Snowy Mail Route (Curio Class)
Grade 1, computer science, module Code a Path (Algorithms and Programming). CSTA K-12 Computer Science Standards,
2026 identifiers E1-ALG-PS-01, E1-PRO-PD-04, E1-PRO-TR-07, E1-ALG-IM-03 (2017 crosswalk: 1A-AP-08, 1A-AP-10, 1A-AP-14).
Teacher led on a projector or smartboard: the class calls out arrows, traces the route in the air with a finger and
votes on where Pip will stop.
Snow Town: tap a house to address the letter, lay arrow cards, press Go. Mail Route: 8 levels, 5 to build and 3 to fix.
After every run each card leaves numbered footprints; tap a footprint to find the card that made it.
Words: Code.org CS Fundamentals glossary (algorithm, bug, debugging, program). Arrow paths on a grid as a first
sequencing activity: Code.org unplugged "Graph Paper Programming". Maps, levels and bugs are original to Curio Class.
The card strip, program and runner come from the robot family engine (kit/robot.js, docs/families/robot.md).
Everything is drawn in code; sounds are made in the browser. One file, no network requests.
Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root{
  --paper:#f5f9fd;--ink:#1c2433;--muted:#55607a;--line:#d8e3f0;--brand:#b3261e;--focus:#1d5fd1;--gold:#ffd23f;
  --btn:#8f1d17;--btn-line:#e7928c;--head-ink:#fff;--panel:#fbfdff;
  --sky:#24345a;--snow:#ffffff;--grid:#cfdcec;--bank:#9db6d6;--navy:#1f2a4a;
  --up:#2563c9;--right:#7a3fc0;--down:#1c8247;--left:#bb520e;
  --tb:72px;--pb:64px;--pw:370px;
}
/* Page layouts, picked in script (relayout()), as in robot-dance and collision-lab:
   wide    (1000 px or wider and 700 px or taller, or 1100 and 560): map left with the card strip under it, panel right.
   compact (a short landscape box such as the 16:10 preview, 680x425 to 1000x625): panel beside the map, the strip
           across the whole width, the hint as a caption in the map's sky.
   stack   (narrow or portrait): map, strip, then the arrow tray with Go beside it; the page scrolls.
   The map is drawn at its real pixel size and laid out again for every size. */
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 3px #fff}
body{height:100%;overflow:hidden}
body.stack{height:auto;overflow:auto}
header{gap:10px}
.i{width:26px;height:26px;flex:none;display:block}
.seg button{display:inline-flex;align-items:center;gap:8px;min-height:60px;padding:0 18px}
.seg button[aria-disabled="true"]{opacity:.55;cursor:default}
.icon-btn{min-height:60px}
main{grid-template-columns:minmax(0,1fr) var(--pw);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage panel" "apron panel";min-height:0;overflow:hidden}
.stage{grid-area:stage;min-height:0;background:#e6eef8}
#map{position:absolute;left:0;top:0;display:block}
.panel{grid-area:panel;background:var(--panel);gap:10px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;
  grid-template-areas:"hint hint" "tray tray" "guess go" "step speed" "lv lv";align-content:start;overflow:auto}
.apron{grid-area:apron;position:relative;background:linear-gradient(#dbe6f3,#cddbec);border-top:4px solid #b9cbe2;padding:0 12px 4px;min-width:0}
body.compact main{grid-template-areas:"stage panel" "apron apron"}
body.stack main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"stage" "apron" "panel";overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* panel */
#hint{grid-area:hint;margin:0;font-size:18px;line-height:1.4}
.tray{grid-area:tray;justify-self:center;display:grid;grid-template-columns:repeat(3,var(--tb));grid-template-rows:repeat(3,var(--tb));gap:8px;
  border-radius:18px;outline:3px solid transparent;outline-offset:5px;transition:outline-color .2s}
.tray.pulse{outline-color:var(--brand);animation:pulse .7s ease}
@keyframes pulse{40%{transform:scale(1.04)}}
.ar{width:var(--tb);height:var(--tb);border:0;border-radius:16px;background:var(--c);color:#fff;padding:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 #0003,inset 0 -4px 0 #0002}
.ar svg{width:64%;height:64%;display:block}
.ar[data-op="up"]{grid-area:1/2}.ar[data-op="left"]{grid-area:2/1}.ar[data-op="right"]{grid-area:2/3}.ar[data-op="down"]{grid-area:3/2}
.tray .pip-hub{grid-area:2/2;display:flex;align-items:center;justify-content:center;pointer-events:none}
.tray .pip-hub svg{width:70%;height:70%}
.ar:not([aria-disabled="true"]):hover{filter:brightness(1.08)}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--pb);min-width:0;border:2px solid #c9d6e8;background:#fff;
  border-radius:16px;font:700 18px/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);padding:4px 10px;box-shadow:0 4px 0 #0000001a;text-align:center}
.pbtn .i{color:var(--brand)}
[aria-disabled="true"]{opacity:.45;cursor:default}
#guess{grid-area:guess}
#guess[aria-pressed="true"]{background:#ffe9e7;border-color:var(--brand);box-shadow:0 0 0 4px #b3261e40}
#go{grid-area:go;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:calc(var(--pb) + 8px);font-size:26px;background:var(--gold);color:var(--ink);padding:0 10px;min-width:0}
#go .i{width:30px;height:30px}
#go.stop{background:#fff;color:var(--ink);border:3px solid var(--ink)}
#step{grid-area:step}
#speed{grid-area:speed}
.lv{grid-area:lv;display:flex;gap:10px}
.lv .pbtn{flex:1 1 0}
#next.ready{background:#fff1d6;border-color:#c98a00;box-shadow:0 0 0 4px #ffd23f99,0 0 16px #ffd23f}
/* the level bar: a button that opens the level picker; its dots say which level is open and which are delivered */
#dots{flex:1.25 1 0;display:grid;grid-template-columns:repeat(8,auto);gap:4px;justify-content:center;align-content:center}
#dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--brand);background:#fff;display:block}
#dots i.done{background:var(--brand)}
#dots i.cur{box-shadow:0 0 0 3px var(--gold),0 0 0 4px var(--ink)}
#dots[aria-expanded="true"]{background:#fff1d6;border-color:#c98a00}
.picker{position:absolute;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;background:#f5f9fdf5;border:3px solid #b9cbe2;border-radius:16px;box-shadow:0 8px 24px #0003}
.picker[hidden]{display:none}
.picker button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:0;border:3px solid #c9d6e8;border-radius:14px;background:#fff;
  font:800 var(--pk-f,22px)/1 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);padding:2px;box-shadow:0 4px 0 #0000001a}
.picker button svg{width:var(--pk-i,40px);height:var(--pk-i,40px);display:block}
.picker button.cur{border-color:var(--ink);box-shadow:0 0 0 4px var(--gold)}
.picker button .ok{position:absolute;right:4px;top:4px;width:var(--pk-k,20px);height:var(--pk-k,20px);border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.picker button .ok svg{width:70%;height:70%}

/* the card strip (kit/robot.js draws it; these are this tool's colors) */
#strip{--rb-line:#1c2433;--rb-empty:#5f7397;--rb-glow:#ffd23f;--rb-sel:#ffd23f;--rb-pulse:#ffb300}
.rb-card{background:var(--c,#fff)}
.rb-card .rb-face svg{width:62%;height:62%;color:#fff;display:block}
.rb-cell.empty{background:#ffffff70}
#cbtns{--rb-line:#1c2433}

/* the map overlays: square buttons and footprint buttons sit over the drawn map */
#sq,#fp{position:absolute;left:0;top:0;width:0;height:0}
.sq{position:absolute;border:0;padding:0;background:transparent;border-radius:6px;pointer-events:none}
.sq.on{pointer-events:auto;cursor:pointer}
.sq.on:hover{background:#1d5fd114}
body.guessing .sq.on:hover{background:#b3261e1f}
.fpb{position:absolute;border:0;padding:0;background:transparent;border-radius:50%;cursor:pointer}
.fpb[hidden]{display:none}
body.guessing .fpb,body.walking .fpb{pointer-events:none}
.stage .hint{position:absolute;z-index:2;margin:0;color:#fff;font-size:14px;line-height:1.3;background:#141f3cf0;border-radius:9px;padding:4px 9px;box-shadow:0 0 0 1px #ffffff2e}
.letter-cap{position:absolute;z-index:2}

/* drawn scene animation (Motion off removes the movement; timing stays) */
.flake{animation:fall linear infinite}
.calm .flake{animation:none}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(var(--fy,60px))}}
.fp-new{animation:fpin .35s ease-out both}
@keyframes fpin{from{opacity:0}to{opacity:1}}
.fp-fade{transition:opacity .3s;opacity:0}
.fp-pulse{animation:fpp 1.1s ease-in-out infinite}
@keyframes fpp{50%{opacity:.35}}
.calm .fp-pulse{animation:none}
.puff-new{animation:puff .5s ease-out both}
@keyframes puff{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.hearts{animation:hearts 1.6s ease-out both}
@keyframes hearts{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(var(--hy,-40px))}}
.burst{animation:burst .7s ease-out both}
@keyframes burst{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.3)}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}

/* short wide boxes (1280x720, 1366x768) */
body.short #hint{font-size:17px}
body.short .panel{gap:8px;padding:10px 12px}

/* compact: the 16:10 preview on the tool page */
body.compact header{padding:4px 8px;gap:5px;flex-wrap:nowrap;min-width:0}
body.compact h1{font-size:17px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.compact h1 small{display:none}
body.compact .seg{flex:none}
body.compact .seg button,body.compact .icon-btn{min-height:44px;padding:0 9px;font-size:13.5px;white-space:nowrap;gap:5px}
body.compact .seg .i{width:20px;height:20px}
body.compact .icon-btn{flex:none}
body.compact .panel{padding:6px 8px;gap:6px;grid-template-columns:calc(var(--tb) * 3 + 8px) minmax(0,1fr);
  grid-template-areas:"tray guess" "tray go" "tray step" "lv speed";grid-template-rows:repeat(3,var(--tb)) var(--pb)}
body.compact #speed .w{display:none}
body.compact .tray{gap:4px;justify-self:start}
body.compact .ar{border-radius:11px}
body.compact .pbtn{font-size:14px;padding:2px 6px;border-radius:12px;gap:4px;min-height:0}
body.compact .pbtn .i{width:22px;height:22px}
body.compact #go{font-size:18px;min-height:0;border-radius:12px;gap:6px}
body.compact #go .i{width:22px;height:22px}
body.compact .lv{gap:5px}
body.compact .lv .pbtn .w{display:none}
body.compact #dots,body.stack #dots{grid-template-columns:repeat(4,auto);gap:3px 4px;flex:1 1 0}
body.compact #dots i,body.stack #dots i{width:8px;height:8px;border-width:2px}
body.compact #dots i.cur,body.stack #dots i.cur{box-shadow:0 0 0 2px var(--gold),0 0 0 3px var(--ink)}
body.compact .apron{padding:0 8px 2px}
body.compact #hint{font-size:14px;line-height:1.3}
body.stack #hint{font-size:16px;line-height:1.3}

/* stack: map, strip, then the tray with Go beside it */
body.stack .panel{border-left:0;border-top:3px solid var(--line);overflow:visible;grid-template-columns:calc(var(--tb) * 3 + 16px) minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"tray guess go" "tray step speed" "tray lv lv";grid-template-rows:repeat(3,var(--tb));padding:10px 12px}
body.stack .tray{justify-self:start}
body.stack .pbtn{min-height:0;flex-direction:column;gap:2px;font-size:15px;padding:2px 4px}
body.stack #go{min-height:0;flex-direction:column;gap:2px;font-size:19px}
@media (max-width:560px){
  .seg{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;width:100%}
  .seg button{min-height:60px;font-size:15px;padding:0 8px;justify-content:center}
  .icon-btn{min-height:60px;padding:0 12px;font-size:15px}
  body.stack .pbtn{font-size:13px}
  body.stack .lv .pbtn .w{display:none}
  /* a phone: the four arrows in one row with Go beside them, the other buttons in a row below */
  body.stack .panel{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-areas:"tray tray tray tray tray go" "guess step speed lv lv lv";
    grid-template-rows:var(--tb) var(--pb);gap:8px;padding:8px 12px}
  body.stack .lv{gap:6px}
  body.stack .tray{grid-template-columns:repeat(4,var(--tb));grid-template-rows:var(--tb);gap:8px}
  body.stack .ar[data-op="left"]{grid-area:1/1}body.stack .ar[data-op="up"]{grid-area:1/2}body.stack .ar[data-op="down"]{grid-area:1/3}body.stack .ar[data-op="right"]{grid-area:1/4}
  body.stack .tray .pip-hub{display:none}
  body.stack #hint{font-size:15px}
}
</style>
</head>

<header id="hdr">
  <h1>Snowy Mail Route <small>Arrow by arrow through the snow</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-town" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flake"/></svg>Snow Town</button>
    <button id="m-route" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-env"/></svg>Mail Route</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>

<main>
  <aside class="panel" id="panel">
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="tray" id="tray" role="group" aria-label="Arrow cards: tap one to add it"></div>
    <button class="pbtn" id="guess" aria-pressed="false" aria-label="Guess"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flag"/></svg><span class="w">Guess</span></button>
    <button class="big-btn gold" id="go" aria-label="Go"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg><span class="w">Go</span></button>
    <button class="pbtn" id="step" aria-label="Step"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-foot"/></svg><span class="w">Step</span></button>

      <button class="pbtn" id="clear" aria-label="Clear"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-broom"/></svg><span class="w">Clear</span></button>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const wait = Curio.wait;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
  function mk(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  // ======================================================================================================
  // Content (spec: Content). Columns 1 to 6 left to right, rows 1 to 4 top to bottom.
  // ======================================================================================================
  const OPS = {
    up:    {word: 'Up',    dx: 0,  dy: -1, color: '#2563c9', rot: 0},
    right: {word: 'Right', dx: 1,  dy: 0,  color: '#7a3fc0', rot: 90},
    down:  {word: 'Down',  dx: 0,  dy: 1,  color: '#1c8247', rot: 180},
    left:  {word: 'Left',  dx: -1, dy: 0,  color: '#bb520e', rot: 270},
  };
  const SHORT = {U: 'up', D: 'down', L: 'left', R: 'right'};
  const ops = s => s.split(/\s+/).filter(Boolean).map(c => SHORT[c]);
  const HOUSES = {
    star:  {name: 'Star',  roof: '#f2c230', roofD: '#8a6a00'},
    heart: {name: 'Heart', roof: '#e77fa6', roofD: '#8a2a52'},
    moon:  {name: 'Moon',  roof: '#2b3a73', roofD: '#121a3a'},
    fish:  {name: 'Fish',  roof: '#1f9c9c', roofD: '#0b4f4f'},
    tree:  {name: 'Tree',  roof: '#3f9a4a', roofD: '#1b4e22'},
    sun:   {name: 'Sun',   roof: '#f08a24', roofD: '#8a4300'},
  };
  const TOWN = {
    start: [1, 4],
    houses: {fish: [1, 1], star: [2, 1], heart: [6, 1], moon: [4, 2], sun: [3, 4], tree: [6, 4]},
    banks: [[2, 3], [3, 2], [5, 3]],
  };
  const LEVELS = [
    {name: 'First Delivery', kind: 'build', start: [1, 2], house: ['star', 4, 2], others: [['heart', 4, 4]], banks: [], cards: '', best: 'R R R'},
    {name: 'Down the Lane', kind: 'build', start: [1, 1], house: ['heart', 4, 3], others: [['moon', 6, 1]], banks: [], cards: '', best: 'R R R D D'},
    {name: 'The Snowbank', kind: 'build', start: [1, 3], house: ['moon', 5, 3], others: [['star', 5, 1]], banks: [[3, 2], [3, 3]], cards: '', best: 'D R R R R U'},
    {name: 'Wrong Way', kind: 'fix', start: [1, 4], house: ['fish', 5, 2], others: [['sun', 2, 1]], banks: [[3, 3], [3, 4]], cards: 'U U R R D R', best: 'U U R R R R', fix: 'U U R R R R'},
    {name: 'Long Lane', kind: 'build', start: [1, 1], house: ['tree', 5, 4], others: [['sun', 3, 4]], banks: [[2, 2], [2, 3], [4, 2], [4, 3]], cards: '', best: 'R R R R D D D'},
    {name: 'One Too Many', kind: 'fix', start: [2, 1], house: ['sun', 6, 2], others: [['fish', 1, 4]], banks: [[4, 1], [4, 2]], cards: 'D D R R R R R U', best: 'D D R R R R U', fix: 'D D R R R R U'},
    {name: 'Mixed Up', kind: 'fix', start: [1, 4], house: ['star', 6, 1], others: [['heart', 1, 1]], banks: [[2, 2], [2, 3], [5, 4]], cards: 'R U R U U R R R', best: 'R R U U U R R R', fix: 'R R U U U R R R'},
    {name: 'Big Town', kind: 'build', start: [1, 4], house: ['heart', 5, 4], others: [['moon', 3, 1], ['fish', 6, 4]], banks: [[2, 3], [2, 4], [4, 1], [4, 2], [4, 3], [6, 3]], cards: '', best: 'U U R R D D R R'},
  ];
  // a map: {start, houses: {key: [c, r]}, banks: Set of "c,r", target}
  const K = (c, r) => c + ',' + r;
  function mapOf(mode, n) {
    if (mode === 'town') return {start: TOWN.start, houses: {...TOWN.houses}, banks: new Set(TOWN.banks.map(b => K(...b)))};
    const lv = LEVELS[n], houses = {[lv.house[0]]: [lv.house[1], lv.house[2]]};
    for (const [k, c, r] of lv.others) houses[k] = [c, r];
    return {start: lv.start, houses, banks: new Set(lv.banks.map(b => K(...b))), target: lv.house[0]};
  }
  const houseAt = (m, c, r) => Object.keys(m.houses).find(k => m.houses[k][0] === c && m.houses[k][1] === r) || null;
  // the walk, without drawing (for tests and the teacher notes): {result: 'end'|'bank'|'edge', step, at, path}
  function simulate(m, list) {
    let [c, r] = m.start; const path = [];
    for (let i = 0; i < list.length; i++) {
      const d = OPS[list[i]], nc = c + d.dx, nr = r + d.dy;
      if (nc < 1 || nc > 6 || nr < 1 || nr > 4) return {result: 'edge', step: i + 1, at: [c, r], path};
      if (m.banks.has(K(nc, nr))) return {result: 'bank', step: i + 1, at: [c, r], path};
      c = nc; r = nr; path.push([c, r]);
    }
    return {result: 'end', step: list.length, at: [c, r], path};
  }

  // every fixed line (spec: Voice), plus the how lines the build added so every waiting moment names its control
  const L = {
    wTown: 'Welcome to Snow Town! Pip the penguin carries the mail. Pip walks exactly what the arrows say.',
    hTown: "Tap a house to choose where the letter goes. Then tap the arrows to make Pip's path.",

    empty: 'Add an arrow card first!',
    full: "That's twelve cards! Press Go to see where Pip walks.",
    delivered: 'Delivered! Pip followed every arrow.',
    wrongHouse: "Oh! That's the wrong house. Tap the footprints to see where Pip turned.",
    snow: 'Pip stopped in the snow. Is there a card missing?',
    bank: 'Flump! Pip bumped into a snowbank. Which card sent Pip that way?',
    edge: "Flump! That's the edge of town. Which card sent Pip that way?",
    cleared: 'All clear. Make a new path!',
    guessYes: 'Your guess was right! Pip stopped right on your flag.',
    guessNo: 'Pip stopped somewhere else. Look at the footprints.',
    allDone: "That's every level! Pip's mail bag is empty. Thank you, mail carriers!",
    up: 'Up!', down: 'Down!', left: 'Left!', right: 'Right!',
    // added in the build (handoff.md): the hint names the next control at every waiting moment
    hBuild: "Tap the arrows to make Pip's path. Then press Go.",
    hFix: 'Press Go to watch Pip walk. Then find the card that is wrong.',
    hFix6: 'Press Go to watch Pip walk. Then find the extra card.',
    hFix7: 'Press Go to watch Pip walk. Then find the two cards in the wrong order.',
    hLast: 'Tap the last footprint. The card after it made Pip bump.',
    hFirst: 'Pip bumped before the first footprint. Tap card one to change it.',
    hPick: 'Tap a letter to open that level.',
    fixedBug: 'Delivered! You fixed the bug. Finding and fixing a bug is called debugging.',
    home: 'Pip walked back to the Post Office! Look at the footprints.',
    hFlag: 'Tap the square where you think Pip will stop.',

    hWalk: 'Watch Pip walk the cards. Press Stop to stop.',
    hPaused: 'Press Step for the next card, or Go to walk the rest.',
    hSel: 'Tap an arrow to change this card, or use the buttons under it.',
    hHouse: 'Tap a house to send a new letter.',
    hNext: 'Press Next for the next letter.',
    hAgain: 'Press Next to play again from level one.',
  };
  // how lines spoken the first time their moment comes up (then the hint only)
  const SPEAK_HOW = new Set(['hFlag', 'hGo', 'hPaused', 'hSel', 'hHouse', 'hPick']);
  const HINTS = Object.keys(L).filter(k => /^h[A-Z]/.test(k));

  // ======================================================================================================
  // State
  // ======================================================================================================
  const town = {list: [], map: mapOf('town'), address: 'star', delivered: new Set()};
  const route = {list: [], level: 0, done: new Array(8).fill(false), map: mapOf('route', 0)};
  const state = {
    mode: 'town', quick: false, guessing: false, evt: 0, asked: 0, preWalk: 0, walkHow: false,
    w: {pip: [1, 4], face: 'down', pose: 'stand', feet: [], puff: null, outcome: null, last: null, flag: null, open: null, ran: false, empty: false, bugAt: null, bumpAt: null},
  };
  const M = () => state.mode === 'town' ? town : route;
  const map = () => M().map;
  const W = () => state.w;
  const target = () => state.mode === 'town' ? town.address : route.map.target;
  let run = null;
  let picking = false;
  const walking = () => !!state.preWalk || !!(run && run.busy);
  const paused = () => !!(run && run.status === 'paused');

  // ======================================================================================================
  // The program and the card strip (robot family engine)
  // ======================================================================================================
  const prog = Robot.program({max: 12});
  const arrowSvg = op => `<svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(${OPS[op].rot}deg)"><use href="#a-up"/></svg>`;
  const strip = Robot.strip($('strip'), {
    prog, max: 12, layout: 'row', buttons: $('cbtns'), label: "Pip's arrow cards",
    bounds: () => $('apron'),
    renderCard: (c, i, face, btn) => { btn.style.setProperty('--c', OPS[c.op].color); face.innerHTML = arrowSvg(c.op); },
    cardLabel: (c, i) => `Card ${i + 1}: ${OPS[c.op].word}`,
    emptyFocus: () => $('tray').querySelector('.ar'),
    onSelect: (i, why) => {
      const w = W();
      if (i != null && w.bugAt != null && !walking()) strip.setBug(w.bugAt, '?');   // the class answered: now the badge
      pulseFeet(i); sync();
    },
    onMove: (i, j) => { tone(520, .08, .035, 'triangle'); live(`Card moved to number ${j + 1}.`); },
    onRemove: (i) => { tone(330, .12, .04, 'triangle'); live('Card taken away.'); },
  });
  // any edit: Pip goes back to the Post Office, the old footprints go (they no longer match the cards)
  prog.on(info => {
    state.evt++;
    resetWorld();
    M().list = prog.list.map(c => c.op);
  });

  // ======================================================================================================
  // Sounds (kit tones; silent with Sound off)
  // ======================================================================================================
  const tone = (f, d, v, t) => Curio.tone(f, d, v, t);
  const SND = {
    crunch() { tone(240, .06, .035, 'triangle'); setTimeout(() => tone(170, .07, .03, 'triangle'), 45); },
    flump() { tone(150, .26, .06); setTimeout(() => tone(98, .32, .05), 90); },
    tap() { tone(620, .05, .03, 'triangle'); },
    flag() { tone(700, .08, .035); setTimeout(() => tone(880, .1, .03), 70); },
    shrug() { tone(392, .16, .035); setTimeout(() => tone(330, .22, .03), 150); },
    pick() { tone(660, .08, .03); setTimeout(() => tone(990, .12, .03), 80); },
  };

  // ======================================================================================================
  // The map: drawn at real pixel size for the stage box (relayout), static layer once per size,
  // dynamic layer (Pip, footprints, flag, puff, doors) on every change
  // ======================================================================================================
  const sv = $('map');
  let G = null;           // geometry: {W, H, s, gx, gy, band, letter}
  let D = null;           // drawn layers
  const cx = c => G.gx + (c - .5) * G.s, cy = r => G.gy + (r - .5) * G.s;

  function symbol(kind, parent, x, y, size) {
    const g = mk('g', {transform: `translate(${x - size / 2} ${y - size / 2}) scale(${size / 24})`}, parent);
    const sw = 1.1;
    if (kind === 'star') mk('path', {d: 'M12 1.8l3 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17l-6.2 3.4 1.4-6.8-5.1-4.7 6.9-.8z', fill: '#f5b800', stroke: '#6e4d00', 'stroke-width': sw, 'stroke-linejoin': 'round'}, g);
    else if (kind === 'heart') mk('path', {d: 'M12 21.2s-8.8-5.4-8.8-11.4A5 5 0 0 1 12 6.8a5 5 0 0 1 8.8 3c0 6-8.8 11.4-8.8 11.4z', fill: '#e0457b', stroke: '#7d1438', 'stroke-width': sw, 'stroke-linejoin': 'round'}, g);
    else if (kind === 'moon') mk('path', {d: 'M15.2 2.2A9.8 9.8 0 1 0 21.8 17.4 7.8 7.8 0 1 1 15.2 2.2z', fill: '#3a4fb8', stroke: '#16205a', 'stroke-width': sw, 'stroke-linejoin': 'round'}, g);
    else if (kind === 'fish') {
      mk('path', {d: 'M2 12c3.2-5 8.4-6.4 12.6-4.4 1.8.9 3.1 2.4 3.9 4.4-.8 2-2.1 3.5-3.9 4.4C10.4 18.4 5.2 17 2 12z', fill: '#13898f', stroke: '#06474b', 'stroke-width': sw, 'stroke-linejoin': 'round'}, g);
      mk('path', {d: 'M17.6 12 22.6 7v10z', fill: '#13898f', stroke: '#06474b', 'stroke-width': sw, 'stroke-linejoin': 'round'}, g);
      mk('circle', {cx: 6.8, cy: 10.8, r: 1.5, fill: '#fff'}, g);
      mk('circle', {cx: 6.8, cy: 10.8, r: .75, fill: '#06292b'}, g);
    } else if (kind === 'tree') {
      mk('rect', {x: 10.4, y: 18.4, width: 3.2, height: 4.4, fill: '#7a4a2a', stroke: '#3a2010', 'stroke-width': .8}, g);
      mk('path', {d: 'M12 1.5l5.6 7.2h-3l4.8 6.2h-3.6l3.6 4.6H4.6l3.6-4.6H4.6l4.8-6.2h-3z', fill: '#2f8f3f', stroke: '#124a1c', 'stroke-width': sw, 'stroke-linejoin': 'round'}, g);
    } else if (kind === 'sun') {
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; mk('path', {d: `M${12 + 7.6 * Math.cos(a)} ${12 + 7.6 * Math.sin(a)}L${12 + 10.8 * Math.cos(a)} ${12 + 10.8 * Math.sin(a)}`, stroke: '#e07a00', 'stroke-width': 2.4, 'stroke-linecap': 'round'}, g); }
      mk('circle', {cx: 12, cy: 12, r: 5.6, fill: '#f8a51e', stroke: '#8a4b00', 'stroke-width': sw}, g);
    } else if (kind === 'env') {
      mk('rect', {x: 2.5, y: 5.5, width: 19, height: 13, rx: 2, fill: '#fff', stroke: '#b3261e', 'stroke-width': 1.8}, g);
      mk('path', {d: 'M3.2 6.4 12 13.2l8.8-6.8', fill: 'none', stroke: '#b3261e', 'stroke-width': 1.8, 'stroke-linejoin': 'round'}, g);
    }
    return g;
  }

  // a house filling square (c, r): wall, snowy roof, a door with the address symbol on a round sign
  function house(parent, c, r, s, kind) {
    const x = cx(c), y = cy(r), H = kind === 'po' ? {roof: '#b3261e', roofD: '#5e100c'} : HOUSES[kind];
    const g = mk('g', {class: 'house', 'data-k': kind}, parent);
    const lw = Math.max(1.4, s * .022), ink = '#3b4a66';
    mk('ellipse', {cx: x, cy: y + .42 * s, rx: .42 * s, ry: .06 * s, fill: '#9db6d6', opacity: .5}, g);
    const glow = mk('rect', {x: x - .47 * s, y: y - .47 * s, width: .94 * s, height: .94 * s, rx: .14 * s, fill: 'none', stroke: '#ffd23f', 'stroke-width': Math.max(4, s * .06), class: 'addr', opacity: 0}, g);
    mk('rect', {x: x - .36 * s, y: y - .1 * s, width: .72 * s, height: .5 * s, fill: kind === 'po' ? '#fff' : '#fff6e6', stroke: ink, 'stroke-width': lw}, g);
    mk('path', {d: `M${x - .45 * s} ${y - .07 * s} L${x} ${y - .44 * s} L${x + .45 * s} ${y - .07 * s} Z`, fill: H.roof, stroke: H.roofD, 'stroke-width': lw, 'stroke-linejoin': 'round'}, g);
    // snow on the roof: a lumpy white cap with a blue edge
    const t = y - .44 * s;
    const capY = t + .197 * s, bump = k => `Q${x + (.24 - (k + .5) * .12) * s} ${capY + .07 * s} ${x + (.24 - (k + 1) * .12) * s} ${capY}`;
    mk('path', {d: `M${x - .24 * s} ${capY} L${x} ${t + .01 * s} L${x + .24 * s} ${capY} ${[0, 1, 2, 3].map(bump).join(' ')} Z`, fill: '#fff', stroke: '#9db6d6', 'stroke-width': lw * .8, 'stroke-linejoin': 'round'}, g);
    // the doorway and the door (it swings open on a delivery)
    const dw = .42 * s, dh = .44 * s, dx = x - dw / 2, dy = y + .4 * s - dh;
    mk('path', {d: `M${dx} ${dy + dh} V${dy + dw / 2} a${dw / 2} ${dw / 2} 0 0 1 ${dw} 0 V${dy + dh} Z`, fill: '#ffcf6a', stroke: ink, 'stroke-width': lw}, g);
    const door = mk('g', {class: 'door'}, g);
    mk('path', {d: `M${dx} ${dy + dh} V${dy + dw / 2} a${dw / 2} ${dw / 2} 0 0 1 ${dw} 0 V${dy + dh} Z`, fill: '#8a5530', stroke: ink, 'stroke-width': lw}, door);
    mk('circle', {cx: x, cy: y + .17 * s, r: .19 * s, fill: '#fff', stroke: ink, 'stroke-width': lw}, door);
    symbol(kind === 'po' ? 'env' : kind, door, x, y + .17 * s, .34 * s);
    // a small envelope badge on the roof once a letter is delivered here
    const badge = mk('g', {class: 'badge', display: 'none'}, g);
    mk('circle', {cx: x + .32 * s, cy: y - .3 * s, r: .14 * s, fill: '#fff', stroke: '#b3261e', 'stroke-width': lw}, badge);
    symbol('env', badge, x + .32 * s, y - .3 * s, .2 * s);
    return {g, door, glow, badge, dx, dy, dw, dh};
  }

  function bankShape(parent, c, r, s) {
    const x = cx(c), y = cy(r), g = mk('g', {class: 'bank'}, parent);
    mk('rect', {x: x - s / 2, y: y - s / 2, width: s, height: s, fill: '#e2ebf6'}, g);
    mk('ellipse', {cx: x, cy: y + .36 * s, rx: .46 * s, ry: .09 * s, fill: '#9db6d6'}, g);
    const d = `M${x - .46 * s} ${y + .36 * s} C${x - .5 * s} ${y + .05 * s} ${x - .36 * s} ${y - .14 * s} ${x - .2 * s} ${y - .12 * s} C${x - .14 * s} ${y - .36 * s} ${x + .12 * s} ${y - .38 * s} ${x + .18 * s} ${y - .16 * s} C${x + .36 * s} ${y - .2 * s} ${x + .5 * s} ${y + .04 * s} ${x + .46 * s} ${y + .36 * s} Z`;
    mk('path', {d, fill: '#fbfdff', stroke: '#7f9cc4', 'stroke-width': Math.max(1.6, s * .025), 'stroke-linejoin': 'round'}, g);
    // blue shading on the lower right, a highlight and two sparkles, so the mound never reads as a hole
    mk('path', {d: `M${x + .46 * s} ${y + .36 * s} C${x + .48 * s} ${y + .12 * s} ${x + .36 * s} ${y - .06 * s} ${x + .22 * s} ${y - .08 * s} C${x + .26 * s} ${y + .1 * s} ${x + .12 * s} ${y + .26 * s} ${x - .1 * s} ${y + .36 * s} Z`, fill: '#c6d7ee'}, g);
    mk('path', {d: `M${x - .3 * s} ${y + .02 * s} q${.08 * s} ${-.12 * s} ${.2 * s} ${-.12 * s}`, fill: 'none', stroke: '#fff', 'stroke-width': Math.max(2, s * .04), 'stroke-linecap': 'round'}, g);
    for (const [a, b] of [[-.05, .14], [.24, .2]]) sparkle(g, x + a * s, y + b * s, s * .045, '#9db6d6');
    return g;
  }
  function sparkle(parent, x, y, r, color) {
    mk('path', {d: `M${x - r} ${y}H${x + r}M${x} ${y - r}V${y + r}`, stroke: color, 'stroke-width': Math.max(1, r * .45), 'stroke-linecap': 'round'}, parent);
  }

  // ---------- Pip: a round navy and white penguin with an orange beak and a red mail bag ----------
  // drawn in units: feet at (0, 0), height 1. face: up | down | left | right; pose: stand | shrug
  function drawPip(g, face, pose, letter) {
    g.innerHTML = '';
    const N = '#1f2a4a', E = '#0b1122', O = '#f08a24', OD = '#a3530c', BAG = '#c62828', BAGD = '#7e1515', sw = .028;
    const side = face === 'left' || face === 'right';
    const k = mk('g', {transform: face === 'left' ? 'scale(-1 1)' : null}, g);
    mk('ellipse', {cx: 0, cy: 0, rx: .38, ry: .07, fill: '#7f9cc4', opacity: .45}, k);
    const env = (x, y, w, rot) => {
      if (letter === false) return;
      const e = mk('g', {transform: `translate(${x} ${y}) rotate(${rot})`}, k);
      mk('rect', {x: -w / 2, y: -w * .34, width: w, height: w * .68, rx: w * .08, fill: '#fff', stroke: BAGD, 'stroke-width': sw * .8}, e);
      if (letter) { const s2 = mk('g', {transform: face === 'left' ? 'scale(-1 1)' : null}, e); symbol(letter, s2, 0, 0, w * .56); }
      else mk('path', {d: `M${-w * .42} ${-w * .26} L0 ${w * .02} L${w * .42} ${-w * .26}`, fill: 'none', stroke: BAGD, 'stroke-width': sw * .7}, e);
    };
    const bag = (x, y) => {
      mk('rect', {x, y, width: .3, height: .27, rx: .07, fill: BAG, stroke: BAGD, 'stroke-width': sw}, k);
      mk('path', {d: `M${x} ${y + .09} h.3`, stroke: BAGD, 'stroke-width': sw}, k);
    };
    if (!side) {
      const back = face === 'up';
      for (const fx of [-.14, .14]) mk('ellipse', {cx: fx, cy: -.02, rx: .12, ry: .055, fill: O, stroke: OD, 'stroke-width': sw}, k);
      // the strap across the body
      mk('path', {d: back ? 'M.22 -.78 L-.24 -.36' : 'M-.22 -.78 L.26 -.36', stroke: BAG, 'stroke-width': .06, 'stroke-linecap': 'round'}, k);
      if (pose === 'shrug' || pose === 'yay') {
        mk('ellipse', {cx: -.38, cy: -.6, rx: .075, ry: .2, fill: N, stroke: E, 'stroke-width': sw, transform: 'rotate(58 -.38 -.6)'}, k);
        mk('ellipse', {cx: .38, cy: -.6, rx: .075, ry: .2, fill: N, stroke: E, 'stroke-width': sw, transform: 'rotate(-58 .38 -.6)'}, k);
      } else {
        mk('ellipse', {cx: -.33, cy: -.42, rx: .075, ry: .21, fill: N, stroke: E, 'stroke-width': sw, transform: 'rotate(16 -.33 -.42)'}, k);
        mk('ellipse', {cx: .33, cy: -.42, rx: .075, ry: .21, fill: N, stroke: E, 'stroke-width': sw, transform: 'rotate(-16 .33 -.42)'}, k);
      }
      mk('ellipse', {cx: 0, cy: -.46, rx: .34, ry: .45, fill: N, stroke: E, 'stroke-width': sw}, k);
      if (back) {
        mk('ellipse', {cx: -.06, cy: -.6, rx: .16, ry: .2, fill: '#2d3c66'}, k);
        mk('path', {d: 'M-.07 -.04 L0 .05 L.07 -.04 Z', fill: N, stroke: E, 'stroke-width': sw}, k);
        mk('path', {d: 'M.22 -.78 L-.24 -.36', stroke: BAG, 'stroke-width': .06, 'stroke-linecap': 'round'}, k);
        env(-.3, -.5, .32, 10); bag(-.48, -.44);
      } else {
        mk('ellipse', {cx: 0, cy: -.4, rx: .25, ry: .35, fill: '#fff'}, k);
        for (const ex of [-.09, .09]) { mk('circle', {cx: ex, cy: -.62, r: .048, fill: E}, k); mk('circle', {cx: ex + .016, cy: -.637, r: .016, fill: '#fff'}, k); }
        mk('circle', {cx: -.17, cy: -.52, r: .036, fill: '#ff9fb2', opacity: .85}, k);

        env(.3, -.5, .32, -10); bag(.16, -.44);
      }
      if (pose === 'shrug') {
        const q = mk('text', {x: 0, y: -1.04, 'text-anchor': 'middle', 'font-size': .36, 'font-weight': 900, 'font-family': "'Trebuchet MS',sans-serif", fill: '#1d5fd1', stroke: '#fff', 'stroke-width': .05, 'paint-order': 'stroke'}, k);
        q.textContent = '?';
      }
    } else {
      // profile, facing right (left is the mirror)
      mk('ellipse', {cx: .1, cy: -.02, rx: .16, ry: .055, fill: O, stroke: OD, 'stroke-width': sw}, k);
      mk('ellipse', {cx: -.08, cy: -.02, rx: .12, ry: .05, fill: OD}, k);
      mk('path', {d: 'M-.3 -.8 L-.22 -.36', stroke: BAG, 'stroke-width': .06, 'stroke-linecap': 'round'}, k);
      mk('ellipse', {cx: 0, cy: -.46, rx: .31, ry: .45, fill: N, stroke: E, 'stroke-width': sw}, k);
      mk('ellipse', {cx: .1, cy: -.4, rx: .19, ry: .34, fill: '#fff'}, k);
      mk('circle', {cx: .15, cy: -.63, r: .048, fill: E}, k); mk('circle', {cx: .166, cy: -.647, r: .016, fill: '#fff'}, k);
      mk('circle', {cx: .2, cy: -.52, r: .034, fill: '#ff9fb2', opacity: .85}, k);
      mk('path', {d: 'M.24 -.61 L.44 -.555 L.24 -.5 Z', fill: O, stroke: OD, 'stroke-width': sw * .8, 'stroke-linejoin': 'round'}, k);
      mk('ellipse', {cx: -.05, cy: -.42, rx: .07, ry: .21, fill: '#17203c', stroke: E, 'stroke-width': sw, transform: 'rotate(-14 -.05 -.42)'}, k);

  }

  // footprints: a pair of toe-forward prints (three round toes ahead of a round pad) pointing the way Pip stepped,
  // tinted the card's color, with the card's number. On a plain square the prints sit left and Pip stands right, so
  // Pip never hides the last pair; on a house the number sits off the door and its picture.
  const FP_SLOTS = [[0, 0], [0, -.27], [0, .27], [.16, -.14], [.16, .14]];
  const onHouseSq = (m, c, r) => !!houseAt(m, c, r) || (c === m.start[0] && r === m.start[1]);
  function footAt(f, s) {
    const m = map(), [c, r] = f.sq, h = onHouseSq(m, c, r), o = FP_SLOTS[f.slot % FP_SLOTS.length];
    if (h) return {x: cx(c) - .31 * s, y: cy(r) + .3 * s, k: .6, nx: cx(c) - .37 * s, ny: cy(r) + .02 * s, house: [cx(c), cy(r) + .17 * s]};
    const x = cx(c) - .2 * s + o[0] * s, y = cy(r) + .1 * s + o[1] * s;
    return {x, y, k: f.slot ? .7 : 1, nx: cx(c) - .33 * s + o[0] * s * .5, ny: cy(r) - .3 * s + (f.slot ? o[1] * s * .4 : 0)};
  }
  function footShape(p, color) {
    const g = mk('g', {fill: color, stroke: '#fff', 'stroke-width': .06}, p);
    mk('ellipse', {cx: 0, cy: .12, rx: .19, ry: .23}, g);
    for (const [x, y, r] of [[-.17, -.2, .085], [0, -.27, .09], [.17, -.2, .085]]) mk('circle', {cx: x, cy: y, r}, g);
  }
  function drawFoot(parent, f, s, cls, numParent) {
    const P = footAt(f, s), {x, y} = P, op = OPS[f.op], L2 = s * .36 * P.k;
    const g = mk('g', {class: 'fpair' + (cls ? ' ' + cls : ''), 'data-i': f.i}, parent);
    const p = mk('g', {transform: `translate(${x} ${y}) rotate(${op.rot}) scale(${L2})`}, g);
    for (const [fx, fy] of [[-.24, .2], [.24, -.2]]) footShape(mk('g', {transform: `translate(${fx} ${fy})`}, p), op.color);
    // the card number in a circle beside the pair
    const nr = Math.max(10, s * .12 * Math.min(1, P.k + .2)), nx = P.nx;
    let ny = P.ny;
    // on a house the circle keeps clear of the door's picture (radius .19 s): at small sizes the 10 px floor would
    // reach into it, so the circle rises beside the roof instead (Final look item 3)
    if (P.house) { const need = .19 * s + nr + 2, dx = P.house[0] - nx; if (Math.hypot(dx, P.house[1] - ny) < need) ny = P.house[1] - Math.sqrt(Math.max(0, need * need - dx * dx)); }
    if (numParent) { const ng = mk('g', {class: g.getAttribute('class'), 'data-i': f.i}, numParent); g.num = ng; }
    const ng = g.num || g;
    mk('circle', {cx: nx, cy: ny, r: nr, fill: '#fff', stroke: op.color, 'stroke-width': Math.max(2, nr * .22)}, ng);
    const t = mk('text', {x: nx, y: ny + nr * .38, 'text-anchor': 'middle', 'font-size': Math.max(11, nr * 1.1), 'font-weight': 800, 'font-family': "'Trebuchet MS','Segoe UI',sans-serif", fill: '#1c2433'}, ng);
    t.textContent = f.i + 1;
    return {g, x, y, nx, ny, nr};
  }

  function drawFlag(parent, c, r, s) {
    const x = cx(c) + .27 * s, top = cy(r) - .38 * s, bot = cy(r) + .34 * s, g = mk('g', {class: 'flag'}, parent);
    mk('ellipse', {cx: x, cy: bot, rx: .07 * s, ry: .025 * s, fill: '#7f9cc4', opacity: .6}, g);
    mk('path', {d: `M${x} ${bot}V${top}`, stroke: '#3b2a1a', 'stroke-width': Math.max(2.5, s * .035), 'stroke-linecap': 'round'}, g);
    mk('path', {d: `M${x} ${top} L${x - .3 * s} ${top + .11 * s} L${x} ${top + .22 * s} Z`, fill: '#d62b2b', stroke: '#7a1010', 'stroke-width': Math.max(1.4, s * .018), 'stroke-linejoin': 'round'}, g);
    return g;
  }
  function drawPuff(parent, x, y, s, fresh) {
    const g = mk('g', {class: 'puff' + (fresh && !Curio.reduce ? ' puff-new' : ''), style: `transform-origin:${x}px ${y}px`}, parent);
    for (const [a, b, rr] of [[0, 0, .15], [-.15, .06, .11], [.15, .05, .12], [-.06, -.12, .1], [.09, -.11, .1], [0, .12, .1]])
      mk('circle', {cx: x + a * s, cy: y + b * s, r: rr * s, fill: '#fff', stroke: '#8fa9cf', 'stroke-width': Math.max(1.4, s * .02)}, g);
    return g;
  }

  // the static layer: sky band, snow field, squares, banks, houses, the Post Office and the letter card
  function drawStatic() {
    sv.innerHTML = '';
    sv.setAttribute('width', G.W); sv.setAttribute('height', G.H); sv.setAttribute('viewBox', `0 0 ${G.W} ${G.H}`);
    const m = map(), s = G.s;
    D = {houses: {}};
    const back = mk('g', {}, sv);
    mk('rect', {x: 0, y: 0, width: G.W, height: G.H, fill: '#e6eef8'}, back);
    // the dusk sky along the top, with a far row of roofs and lit windows
    mk('rect', {x: 0, y: 0, width: G.W, height: G.band, fill: '#24345a'}, back);
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < 9; i++) mk('circle', {cx: rnd() * G.W, cy: rnd() * G.band * .55, r: 1 + rnd() * 1.2, fill: '#fff', opacity: .7}, back);
    const hb = Math.min(G.band * .42, 34);
    for (let x = -10, k = 0; x < G.W; k++) {
      const w = 34 + rnd() * 40, h = hb * (.55 + rnd() * .45), y = G.band - h;
      mk('path', {d: `M${x} ${G.band} V${y + h * .3} L${x + w / 2} ${y} L${x + w} ${y + h * .3} V${G.band} Z`, fill: '#1a2645'}, back);
      if (k % 2 === 0) mk('rect', {x: x + w / 2 - 4, y: y + h * .45, width: 8, height: 7, fill: '#ffd77a', opacity: .9}, back);
      x += w + 4;
    }
    mk('rect', {x: 0, y: G.band - 3, width: G.W, height: 6, fill: '#fff'}, back);
    // falling snow in the sky (Motion off: it stays scattered in place)
    const flakes = mk('g', {}, back);
    for (let i = 0; i < 16; i++) {
      const fy = G.band * .9, d = 4 + rnd() * 4;
      mk('circle', {cx: rnd() * G.W, cy: -4 + rnd() * 6, r: 1.4 + rnd() * 1.6, fill: '#fff', opacity: .85, class: 'flake',
        style: `--fy:${fy}px;animation-duration:${d}s;animation-delay:${-rnd() * d}s`}, flakes);
    }
    // the snowy town
    const town = mk('g', {}, sv);
    mk('rect', {x: G.gx - 6, y: G.gy - 6, width: 6 * s + 12, height: 4 * s + 12, rx: 10, fill: '#cfdcec'}, town);
    for (let r = 1; r <= 4; r++) for (let c = 1; c <= 6; c++) {
      mk('rect', {x: G.gx + (c - 1) * s, y: G.gy + (r - 1) * s, width: s, height: s, fill: (c + r) % 2 ? '#ffffff' : '#fbfdff', stroke: '#cfdcec', 'stroke-width': Math.max(1.2, s * .012)}, town);
      if (!m.banks.has(K(c, r)) && (c * 7 + r * 3) % 4 === 0) sparkle(town, cx(c) - .3 * s, cy(r) - .32 * s, s * .035, '#cfe0f5');
    }
    for (const b of m.banks) { const [c, r] = b.split(',').map(Number); bankShape(town, c, r, s); }
    D.houses.po = house(town, m.start[0], m.start[1], s, 'po');
    for (const k in m.houses) D.houses[k] = house(town, m.houses[k][0], m.houses[k][1], s, k);
    // the letter: Pip's address, big enough to match from the back of the room
    const lh = G.letter, lw = Math.round(lh * 1.4), lx = 10, ly = Math.round((G.band - lh) / 2) - 1;
    const lt = mk('g', {class: 'letter'}, sv);
    mk('rect', {x: lx, y: ly, width: lw, height: lh, rx: lh * .14, fill: '#fff', stroke: '#b3261e', 'stroke-width': 3}, lt);
    mk('path', {d: `M${lx + 4} ${ly + 4} L${lx + lw / 2} ${ly + lh * .42} L${lx + lw - 4} ${ly + 4}`, fill: 'none', stroke: '#e7b7b3', 'stroke-width': 2}, lt);
    D.letterSym = mk('g', {}, lt);
    D.letterBox = {lx, ly, lw, lh};
    // the moving parts
    D.feet = mk('g', {}, sv);
    D.puff = mk('g', {}, sv);
    D.flag = mk('g', {}, sv);
    D.pip = mk('g', {class: 'pip'}, sv);
    D.pipBody = mk('g', {}, D.pip);
    D.nums = mk('g', {}, sv);
    D.fx = mk('g', {}, sv);
    D.pipKey = '';
    sv.setAttribute('aria-label', mapLabel());
    buildSquares();
    drawDyn();
  }
  function mapLabel() {
    const m = map(), names = Object.keys(m.houses).map(k => HOUSES[k].name + ' house').join(', ');
    return `A snowy town of 6 columns and 4 rows. Houses: ${names}. ${m.banks.size} snowbanks. Pip starts at the Post Office.`;
  }

  // ---------- the moving layer ----------
  const pipT = {x: 0, y: 0, sz: 1, tilt: 0, op: 1};
  // on a house Pip stands small at the right of the door, clear of its picture (Final look item 3)
  function pipSpot(c, r) {
    const m = map(), s = G.s, onHouse = !!houseAt(m, c, r) || (c === m.start[0] && r === m.start[1]);
    return onHouse ? {x: cx(c) + .45 * s, y: cy(r) + .45 * s, sz: .42 * s} : {x: cx(c) + .2 * s, y: cy(r) + .4 * s, sz: .62 * s};
  }
  function placePip() {
    D.pip.setAttribute('transform', `translate(${pipT.x} ${pipT.y}) rotate(${pipT.tilt}) scale(${pipT.sz})`);
    D.pip.setAttribute('opacity', pipT.op);
  }
  function paintPip() {
    const w = W(), letter = w.empty ? false : target(), key = w.face + w.pose + letter;
    if (key !== D.pipKey) { D.pipKey = key; drawPip(D.pipBody, w.face, w.pose, letter); }
    placePip();
  }
  function drawDyn(o = {}) {
    if (!D) return;
    const w = W(), s = G.s, m = map();
    // houses: the address glow (Snow Town), doors and badges
    for (const k in D.houses) {
      const h = D.houses[k];
      const isAddr = state.mode === 'town' && k === town.address;
      h.glow.setAttribute('opacity', isAddr ? 1 : 0);
      h.glow.classList.toggle('glow', isAddr && !Curio.reduce);
      const open = w.open === k;
      h.door.setAttribute('transform', open ? `translate(${h.dx} 0) scale(.22 1) translate(${-h.dx} 0)` : '');
      h.badge.setAttribute('display', (state.mode === 'town' ? town.delivered.has(k) : (route.done[route.level] && k === m.target)) ? '' : 'none');
    }
    D.letterSym.innerHTML = '';
    const b = D.letterBox;
    symbol(target(), D.letterSym, b.lx + b.lw / 2, b.ly + b.lh * .56, b.lh * .62);
    // footprints
    D.feet.innerHTML = ''; D.nums.innerHTML = '';
    D.fpEls = [];
    for (const f of w.feet) {
      const isNew = o.fresh === f && !Curio.reduce;
      const e = drawFoot(D.feet, f, s, isNew ? 'fp-new' : '', D.nums);
      if (isNew && e.g.num) e.g.num.style.animationDelay = (o.delay || 0) + 'ms';
      if (isNew) e.g.style.animationDelay = (o.delay || 0) + 'ms';
      D.fpEls.push(e);
    }
    pulseFeet(strip.sel, true);
    // the snow puff after a bump
    D.puff.innerHTML = '';
    if (w.puff) drawPuff(D.puff, w.puff.x, w.puff.y, s, o.puff);
    // the guess flag
    D.flag.innerHTML = '';
    if (w.flag) drawFlag(D.flag, w.flag[0], w.flag[1], s);
    paintPip();
    syncFootButtons();
  }

  // ---------- tweens: Motion off jumps to the end at once; the beat timing is the runner's, so it stays ----------
  let tw = null;
  function tween(ms, fn, done) {
    finishTween();
    if (Curio.reduce || ms <= 0) { fn(1); if (done) done(); return; }
    const t0 = performance.now(), me = {fn, done};
    tw = me;
    const tick = () => {
      if (tw !== me) return;
      const t = clamp((performance.now() - t0) / ms, 0, 1);
      fn(t);
      if (t < 1) requestAnimationFrame(tick); else { tw = null; if (done) done(); }
    };
    requestAnimationFrame(tick);
  }
  function finishTween() { const t = tw; tw = null; if (t) { t.fn(1); if (t.done) t.done(); } }
  function setPipAt(c, r) { Object.assign(pipT, pipSpot(c, r), {tilt: 0, op: 1}); placePip(); }

  // ======================================================================================================
  // Square and footprint buttons over the map
  // ======================================================================================================
  const sqBtns = [];
  function buildSquares() {
    const box = $('sq');
    if (!sqBtns.length) for (let r = 1; r <= 4; r++) for (let c = 1; c <= 6; c++) {
      const b = document.createElement('button');
      b.className = 'sq'; b.dataset.c = c; b.dataset.r = r; b.tabIndex = -1;
      b.onclick = () => tapSquare(c, r);
      b.addEventListener('keydown', e => squareKey(e, c, r));
      box.appendChild(b); sqBtns.push(b);
    }
    for (const b of sqBtns) {
      const c = +b.dataset.c, r = +b.dataset.r;
      Object.assign(b.style, {left: G.gx + (c - 1) * G.s + 'px', top: G.gy + (r - 1) * G.s + 'px', width: G.s + 'px', height: G.s + 'px'});
    }
    syncSquares();
  }
  function squareName(c, r) {
    const m = map(), h = houseAt(m, c, r);
    const what = h ? HOUSES[h].name + ' house' : c === m.start[0] && r === m.start[1] ? 'Post Office' : m.banks.has(K(c, r)) ? 'snowbank' : 'snow';
    return `Column ${c}, row ${r}: ${what}`;
  }
  function syncSquares() {
    const m = map(), g = state.guessing && !walking();
    for (const b of sqBtns) {
      const c = +b.dataset.c, r = +b.dataset.r, h = houseAt(m, c, r);
      const pickHouse = !g && state.mode === 'town' && !!h && !walking();
      const on = g || pickHouse;
      b.classList.toggle('on', on);
      b.tabIndex = on ? 0 : -1;
      b.setAttribute('aria-disabled', !on);
      const flag = W().flag && W().flag[0] === c && W().flag[1] === r;
      b.setAttribute('aria-label', (g ? 'Put the flag on ' : pickHouse ? 'Send the letter to ' : '') + squareName(c, r) + (flag ? ', flag here' : ''));
    }
  }
  function squareKey(e, c, r) {
    const d = {ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0]}[e.key];
    if (!d || !state.guessing) return;
    e.preventDefault();
    const nc = clamp(c + d[0], 1, 6), nr = clamp(r + d[1], 1, 4);
    sqBtns[(nr - 1) * 6 + nc - 1].focus({preventScroll: true});
  }
  const fpBtns = [];
  function syncFootButtons() {
    const box = $('fp'), feet = W().feet, s = G.s;
    while (fpBtns.length < feet.length) {
      const b = document.createElement('button');
      b.className = 'fpb'; b.tabIndex = -1;
      b.onclick = () => tapFoot(+b.dataset.i);
      box.appendChild(b); fpBtns.push(b);
    }
    fpBtns.forEach((b, k) => {
      const f = feet[k];
      b.hidden = !f;
      b.tabIndex = state.guessing ? -1 : 0;
      if (!f) return;
      const e = D.fpEls[k], size = Math.max(document.body.classList.contains('compact') || innerWidth < 560 ? 44 : 60, Math.min(s * .62, 96));  // 60 px at full screen (item 24)
      const x = (e.x + e.nx) / 2, y = (e.y + e.ny) / 2;
      b.dataset.i = f.i;
      Object.assign(b.style, {left: Math.round(x - size / 2) + 'px', top: Math.round(y - size / 2) + 'px', width: size + 'px', height: size + 'px'});
      b.setAttribute('aria-label', `Footprints of card ${f.i + 1}`);
    });
  }
  function pulseFeet(i, quiet) {
    if (!D || !D.fpEls) return;
    W().feet.forEach((f, k) => { const e = D.fpEls[k]; if (e) for (const x of [e.g, e.g.num]) if (x) x.classList.toggle('fp-pulse', f.i === i); });
  }

  // ======================================================================================================
  // Taps on the map
  // ======================================================================================================
  function tapSquare(c, r) {
    if (walking()) return;
    if (state.guessing) {
      const had = W().flag;
      W().flag = [c, r];
      SND.flag();
      live(`Flag on column ${c}, row ${r}.`);
      drawDyn(); sync();
      if (!had) state.evt++;
      return;
    }
    const h = houseAt(map(), c, r);
    if (state.mode === 'town' && h) {
      strip.deselect('map');
      if (town.address !== h) { town.address = h; W().flag = null; state.evt++; resetWorld(); }
      SND.pick();
      live(`The letter goes to the ${HOUSES[h].name} house.`);
      drawDyn(); sync();
    }
  }
  function tapFoot(i) {
    if (walking() || state.guessing || !prog.list[i]) return;
    if (strip.sel === i) strip.deselect('foot'); else strip.select(i, 'foot');
  }
  // tapping the map (not a house, a footprint or a guess square) puts the picked card down
  $('stage').addEventListener('pointerdown', e => {
    if (picking && !e.target.closest('#picker')) closePicker();
    if (e.target.closest('.sq.on, .fpb, #picker')) return;
    strip.deselect('map');
  });

  // ======================================================================================================
  // The tray: tap an arrow to add it, or to change the picked card
  // ======================================================================================================
  const tray = $('tray');
  for (const op of ['up', 'left', 'right', 'down']) {
    const b = document.createElement('button');
    b.className = 'ar'; b.dataset.op = op; b.style.setProperty('--c', OPS[op].color);
    b.setAttribute('aria-label', OPS[op].word);
    b.innerHTML = arrowSvg(op);
    b.onclick = () => pickArrow(op);
    tray.appendChild(b);
  }
  // the hub of the plus: a little Pip, so the arrows read as "which way Pip walks"
  const hub = document.createElement('div');
  hub.className = 'pip-hub'; hub.setAttribute('aria-hidden', 'true');
  hub.innerHTML = '<svg viewBox="-.55 -1.12 1.1 1.18"><g></g></svg>';
  tray.appendChild(hub);
  drawPip(hub.querySelector('g'), 'down', 'stand', null);
  tray.addEventListener('keydown', e => {
    const op = {ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'}[e.key];
    if (!op || e.altKey || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    pickArrow(op);
  });
  function pickArrow(op) {
    if (walking()) return;
    const i = strip.sel;
    if (i != null && prog.list[i]) {
      prog.replace(i, op);
      strip.flip(i);
      strip.deselect('replace');
      live(`Card ${i + 1} is now ${OPS[op].word}.`);
    } else if (prog.full) {
      strip.flash();
      const e = state.evt;
      hushTalk();
      V.say('full', {valid: () => state.evt === e});
      return;
    } else {
      prog.add(op);
      live(`Card ${prog.length}: ${OPS[op].word}.`);
    }
    SND.tap();
    V.say(op, {key: 'arrow', maxAge: 1800});
  }

  // ======================================================================================================
  // Walking: Go, Step, Stop (robot family runner) and what happens at the end
  // ======================================================================================================
  const beat = () => state.quick ? 700 : 1100;
  function resetWorld() {
    if (run && run.alive()) run.stop();
    run = null;
    state.preWalk = 0;
    finishTween();
    const w = W(), m = map();
    w.pip = [...m.start]; w.face = 'down'; w.pose = 'stand'; w.feet = []; w.puff = null; w.outcome = null; w.last = null; w.open = null; w.empty = false; w.bugAt = null; w.bumpAt = null;
    if (D) { setPipAt(...w.pip); drawDyn(); }
    strip.lock(false);

    const short = p === 'wide' && h < 900;
    document.body.classList.toggle('short', short);
    const hdrH = $('hdr').offsetHeight, bodyH = h - hdrH, root = document.documentElement.style;
    // panel and tray sizes
    const pw = p === 'wide' ? (w >= 1600 ? 420 : 370) : p === 'compact' ? Math.round(clamp(w * .36, 236, 330)) : w;
    const tb = p === 'wide' ? (bodyH < 600 ? 64 : 72) : p === 'compact' ? (bodyH < 400 ? 50 : bodyH < 470 ? 52 : 60) : (w < 560 ? 56 : 72);
    const pb = p === 'wide' ? (bodyH < 600 ? 60 : 64) : p === 'compact' ? (bodyH < 470 ? 44 : 52) : w < 560 ? 54 : tb;
    root.setProperty('--pw', pw + 'px'); root.setProperty('--tb', tb + 'px'); root.setProperty('--pb', pb + 'px');
    // the strip: twelve slots in a row (two rows of six on a phone), sized to the box
    const ap = $('apron'), aw = p === 'wide' ? w - pw : w;
    const cols = p === 'stack' && aw < 600 ? 6 : 12, rows = 12 / cols;
    const padX = p === 'compact' ? 8 : 12, gap = p === 'compact' ? 5 : Math.round(clamp(aw * .008, 6, 10));
    const cw = Math.min(104, Math.floor((aw - 2 * padX - (cols - 1) * gap) / cols));
    let ch = Math.round(clamp(cw * 1.02, 44, 96));
    if (p === 'wide') ch = Math.min(ch, Math.round(bodyH * .13));
    if (p === 'compact') ch = Math.min(ch, Math.round(bodyH * .135));
    if (p === 'stack' && cols === 6) ch = Math.min(ch, 48);
    ch = Math.max(ch, 44);
    const phone = p === 'stack' && cols === 6, ptrH = p === 'compact' || phone ? 12 : 18, btn = p === 'compact' ? 44 : phone ? 52 : 60;
    strip.size({cw, ch, gap, cols, rowGap: rows > 1 ? ptrH + 6 : 0, nd: Math.round(clamp(cw * .34, 20, 30)), pad: ptrH + (p === 'compact' || phone ? 4 : 8),
      ptrW: Math.round(ptrH * 1.9), ptrH, btn, btnGap: p === 'compact' ? 12 : 16, btnH: btn + (p === 'compact' || phone ? 6 : 12), btnTop: p === 'compact' || phone ? 3 : 6});
    // the stage: in stack it gets what is left, so the strip and the tray stay on screen
    const st = $('stage');
    capH = p === 'wide' ? 0 : captionHeight();
    // the panel keeps the tallest hint's height, so the tray and Go never move when the hint wraps
    $('hint').style.minHeight = p === 'wide' ? captionHeight() + 'px' : '';
    if (p === 'stack') {
      const room = h - hdrH - ap.offsetHeight - ($('panel').offsetHeight || 0);
      st.style.height = Math.round(clamp(room, Math.min(260, w * .62), Math.max(260, w * .8))) + 'px';
    } else st.style.height = '';
    const r = st.getBoundingClientRect(), key = state.mode + (state.mode === 'route' ? route.level : '') + p + Math.round(r.width) + 'x' + Math.round(r.height) + 'c' + capH;
    strip.place();
    if (key === lastKey) return;
    lastKey = key;
    layoutMap(Math.max(240, Math.round(r.width)), Math.max(180, Math.round(r.height)));
  }
  function layoutMap(Wd, Hd) {
    const letter = page === 'wide' ? 0 : page === 'compact' ? 38 : 42;
    let band;
    if (page === 'wide') band = Math.round(clamp(Hd * .14, 62, 100));
    else band = Math.max(capH + 12, letter + 12);
    const lh = page === 'wide' ? band - 14 : letter;
    const mx = Math.max(8, Wd * .02), my = page === 'wide' ? 10 : 4;
    const s = Math.floor(Math.min((Wd - 2 * mx) / 6, (Hd - band - 2 * my) / 4, 190));
    const gx = Math.round((Wd - 6 * s) / 2), gy = Math.round(band + (Hd - band - 4 * s) / 2);
    G = {W: Wd, H: Hd, s, gx, gy, band, letter: lh};
    // the caption sits in the sky band, right of the letter card
    const hint = $('hint');
    if (page !== 'wide') {
      const lw = Math.round(lh * 1.4) + 22;
      Object.assign(hint.style, {left: lw + 'px', right: '10px', top: Math.round((band - capH) / 2) + 'px'});
    } else Object.assign(hint.style, {left: '', right: '', top: ''});
    drawStatic();
    const w = W();
    setPipAt(...w.pip);
    drawDyn();
    if (picking) placePicker();
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());
  Curio.onMotion(() => { lastKey = ''; relayout(); });

  // ======================================================================================================
  // The card picture for preview.svg: Pip mid-route in Snow Town with a footprint trail
  // ======================================================================================================
  function previewSVG(Wd = 800, Hd = 500) {
    const keep = {G, D, w: state.w, mode: state.mode, html: sv.innerHTML, vb: sv.getAttribute('viewBox'), sw: sv.getAttribute('width'), sh: sv.getAttribute('height'), addr: town.address};
    state.mode = 'town'; town.address = 'heart';
    const stripH = 104, band = 64;
    const s = Math.floor(Math.min((Wd - 40) / 6, (Hd - stripH - band - 16) / 4));
    G = {W: Wd, H: Hd - stripH, s, gx: Math.round((Wd - 6 * s) / 2), gy: band + 8, band, letter: band - 14};
    const list = ops('U U U R R R R R');
    state.w = {pip: [4, 1], face: 'right', pose: 'stand', feet: [], puff: null, outcome: null, last: null, flag: [6, 1], open: null, ran: true};
    let p = [1, 4];
    list.slice(0, 5).forEach((op, i) => { const d = OPS[op]; p = [p[0] + d.dx, p[1] + d.dy]; state.w.feet.push({i, op, sq: p, slot: 0}); });
    drawStatic();
    D.feet.innerHTML = ''; D.nums.innerHTML = ''; D.fpEls = [];
    for (const f of state.w.feet) drawFoot(D.feet, f, s, '', D.nums);
    const sp = pipSpot(4, 1); Object.assign(pipT, {x: lerp(cx(3), sp.x, .6), y: sp.y, sz: .68 * s, tilt: 0, op: 1}); placePip();
    const out = mk('svg', {xmlns: NS, width: Wd, height: Hd, viewBox: `0 0 ${Wd} ${Hd}`});
    out.innerHTML = sv.innerHTML;
    const ap = mk('g', {}, out);
    mk('rect', {x: 0, y: Hd - stripH, width: Wd, height: stripH, fill: '#d4e0ef'}, ap);
    mk('rect', {x: 0, y: Hd - stripH, width: Wd, height: 4, fill: '#b9cbe2'}, ap);
    const cw = 52, gap = 9, x0 = (Wd - (12 * cw + 11 * gap)) / 2, y = Hd - stripH + 30, chh = 58;
    for (let i = 0; i < 12; i++) {
      const x = x0 + i * (cw + gap), op = list[i];
      if (!op) { mk('rect', {x, y, width: cw, height: chh, rx: 9, fill: '#ffffff70', stroke: '#8ea3c4', 'stroke-width': 2.5, 'stroke-dasharray': '6 5'}, ap); continue; }
      mk('rect', {x, y, width: cw, height: chh, rx: 9, fill: OPS[op].color, stroke: '#1c2433', 'stroke-width': 2.5}, ap);
      const a = mk('g', {transform: `translate(${x + cw / 2} ${y + chh / 2}) rotate(${OPS[op].rot}) translate(-15 -15) scale(1.25)`}, ap);
      mk('path', {d: 'M12 3.2 21 12.6h-5.4V21H8.4v-8.4H3z', fill: '#fff'}, a);
      mk('circle', {cx: x + 2, cy: y + 1, r: 10, fill: '#fff', stroke: '#1c2433', 'stroke-width': 2.2}, ap);
      const t = mk('text', {x: x + 2, y: y + 5.5, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 800, 'font-family': "'Trebuchet MS',sans-serif", fill: '#1c2433'}, ap);
      t.textContent = i + 1;
      if (i === 5) mk('rect', {x: x - 4, y: y - 4, width: cw + 8, height: chh + 8, rx: 12, fill: 'none', stroke: '#ffd23f', 'stroke-width': 4}, ap);
    }
    mk('path', {d: `M${x0 + 5 * (cw + gap) + cw / 2 - 11} ${y - 22} h22 l-11 12 z`, fill: '#ffd23f', stroke: '#fff', 'stroke-width': 2}, ap);
    const svgText = out.outerHTML.replace(/ class="[^"]*"/g, '').replace(/ style="[^"]*"/g, '');
    // put the live stage back
    G = keep.G; D = keep.D; state.w = keep.w; state.mode = keep.mode; town.address = keep.addr;
    lastKey = ''; relayout();
    return svgText.replace(/<use href="#a-up"\/>/g, '');
  }

  // ======================================================================================================
  // Start
  // ======================================================================================================
  Curio.init({clips: "voice:*", rate: .9});
  town.w = state.w;
  route.list = ops(LEVELS[0].cards);
  setMode('town', true);
  window.__tool = {
    state, town, route, prog, strip, L, LEVELS, TOWN, OPS, setMode, openLevel, go, step, stop, simulate, mapOf, ops,
    howNow, previewSVG, allLines: V.allLines, vlog: V.log, get vq() { return V.queue; }, get run() { return run; },
    get G() { return G; }, get page() { return page; }, V,
  };
})();
</script>
