SAFETY STREET (Curio Class)
Grades K-2 health, NHES 2024 Standard 1 (injury prevention: pedestrian, bike, car, fire, burn, water and
medicine safety) and Standard 5 (making a safe choice).
Teacher-led on a projector. Walk the street (seven stops, each with a choice between a safe and an unsafe idea;
an unsafe pick is explained and the class tries again), Safe or not? (thumbs up or down on sixteen cards) and
Crossing practice (stop at the curb, look left, right and left again, wait for the walk signal, keep looking).
Guidance follows common pediatric and safety-organization advice for young children (NHTSA, NFPA, the American
Red Cross, Safe Kids Worldwide): cross with a grown-up, wear a helmet, use a car seat or booster, get out and
stay out in a fire, swim only with a grown-up watching, and only take medicine from a trusted grown-up.
Nothing is scary on purpose: every stop ends with what to do.

.card img{width:150px;height:150px;object-fit:contain}
.card .q{font:800 29px/1.25 'Trebuchet MS',sans-serif}
.card .where{font:800 17px 'Segoe UI',sans-serif;color:var(--brand);text-transform:uppercase;letter-spacing:.08em}
.choices{position:absolute;left:270px;top:300px;width:710px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{border:5px solid transparent;border-radius:24px;background:#fffdf8;min-height:150px;box-shadow:0 7px 0 #0002;font:800 25px/1.25 'Trebuchet MS',sans-serif;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.choice.safe{border-color:#2a9d4a;background:#eafbef}
.choice.unsafe{border-color:#d8423a;background:#fdeceb}
.fb{position:absolute;left:270px;top:472px;width:710px;background:#fff;border-radius:20px;padding:12px 18px;font:700 22px/1.35 'Segoe UI',sans-serif;box-shadow:0 5px 0 #0002}
.fb:empty{display:none}

/* safe or not */
.sort{position:absolute;left:270px;top:76px;width:710px;display:flex;flex-direction:column;align-items:center;gap:16px}
.scard{width:560px;min-height:200px;background:#fffdf8;border-radius:28px;box-shadow:0 8px 0 #0002;border:5px solid #202a33;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px 30px;font:800 36px/1.25 'Trebuchet MS',sans-serif}
.scard.safe{border-color:#2a9d4a;background:#eafbef}
.scard.unsafe{border-color:#d8423a;background:#fdeceb}
.thumbs{display:flex;gap:20px}
.thumb{border:0;border-radius:24px;width:250px;min-height:120px;font:900 30px 'Trebuchet MS',sans-serif;color:#fff;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center}
.thumb span{font-size:54px;line-height:1}
.thumb.up{background:#2a9d4a}.thumb.down{background:#d8423a}

/* crossing practice */
.cross{position:absolute;inset:0}
.cross svg{width:100%;height:100%}
.look{position:absolute;left:270px;top:20px;width:710px;display:flex;gap:10px;justify-content:center}
.look .big-btn{min-width:150px}
.status{position:absolute;left:16px;top:92px;width:330px;text-align:left;background:#fffdf8e6;border-radius:16px;padding:8px 14px;font:900 24px/1.25 'Trebuchet MS',sans-serif;color:#202a33;text-shadow:0 2px 0 #fff}

.panel{background:#fbfdfe;border-left:3px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
@media (max-width:759px){.panel{border-left:0;border-top:3px solid var(--line)}}
.hint{margin:0;font:600 18px/1.35 'Segoe UI',sans-serif;color:var(--muted)}
.hint b{color:var(--ink)}
.big-btn{border:0;border-radius:16px;min-height:60px;font:800 20px/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:#fff;background:#2a3a8c;box-shadow:0 5px 0 #0004;padding:6px 12px}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.big-btn.soft{background:#e4ebf1;color:var(--ink)}
.big-btn.gold{background:#ffd34d;color:#3a2c00}
.big-btn.done{background:#2a9d4a}
.big-btn:disabled{opacity:.45}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}.row .big-btn{flex:1}
.tip{margin:0;background:#fff4e2;border-left:6px solid #edb35c;border-radius:10px;padding:10px 12px;font:600 17px/1.4 'Segoe UI',sans-serif}
.tip:empty{display:none}
.score{font:800 20px 'Trebuchet MS',sans-serif;color:#2a3a8c}

@media (max-width:759px),(max-height:640px){
  header{padding:6px 12px} h1{font-size:19px} h1 small{display:none}
  .seg button,.icon-btn{min-height:38px;font-size:13px;padding:0 10px}
  main{grid-template-columns:minmax(0,1fr) 260px}
  .panel{padding:8px 10px;gap:8px}
  .hint,.tip{font-size:14px}
  .big-btn{min-height:44px;font-size:16px}
}
</style>
</head>

  <button class="icon-btn" id="read">🔊 Read</button>
</header>

  // ---------- Walk the street ----------
  function drawPath() {
    $('path').innerHTML = STOPS.map((s, i) => `<i class="${i < state.at ? 'done' : i === state.at ? 'on' : ''}" title="${s.where}">${i < state.at ? '✅' : s.e}</i>`).join('');
  }
  function stop() {
    const s = STOPS[state.at];
    drawPath();
    $('card').innerHTML = `<img src="${s.img}" alt=""><div><div class="where">Stop ${state.at + 1}: ${s.where}</div><div class="q">${s.q}</div></div>`;
    // the safe choice is on a random side
    const opts = Math.random() < .5 ? [['safe', s.safe], ['unsafe', s.unsafe]] : [['unsafe', s.unsafe], ['safe', s.safe]];
    $('choices').replaceChildren(...opts.map(([k, t], i) => {
      const b = document.createElement('button');
      b.className = 'choice'; b.dataset.k = k; b.textContent = `${i + 1}. ${t}`;
      b.onclick = () => choose(b);
      return b;
    }));
    $('fb').textContent = '';
    $('ctrl').innerHTML = '<button class="big-btn soft" id="restart">↺ Start the walk over</button>';
    $('restart').onclick = () => { state.at = 0; state.safe = 0; stop(); };
    if (s.id === 'fire') SFX.alarm(); else SFX.step();
    say([s.q, `One: ${opts[0][1]}.`, `Two: ${opts[1][1]}.`]);
  }
  function choose(b) {
    const s = STOPS[state.at], safe = b.dataset.k === 'safe';
    b.classList.add(safe ? 'safe' : 'unsafe');
    if (safe) {
      $('choices').querySelectorAll('.choice').forEach(x => x.disabled = true);
      SFX.yes(); hop();
      $('fb').innerHTML = `<b>Safe choice!</b> ${s.yes}`;
      $('ctrl').innerHTML = `<button class="big-btn" id="next">${state.at === STOPS.length - 1 ? 'Finish the walk →' : 'Next stop →'}</button>`;
      $('next').onclick = () => { state.at++; state.at >= STOPS.length ? finish() : stop(); };
      say(['Safe choice!', s.yes]);
    } else {
      SFX.no(); shake();
      $('fb').innerHTML = `<b>Not safe.</b> ${s.no} Try the other choice.`;
      say(['Not safe.', s.no]);
    }
  }

  // ---------- Safe or not? ----------
  function nextSort() {
    if (state.sortAt >= state.sortOrder.length - 1 || !state.sortOrder.length) { state.sortOrder = SORT.map((_, i) => i).sort(() => Math.random() - .5).slice(0, 10); state.sortAt = -1; state.sortRight = 0; }
    state.sortAt++;
    const [t] = SORT[state.sortOrder[state.sortAt]];
    $('sort').innerHTML = `<div class="scard" id="scard">${t}</div><div class="thumbs"><button class="thumb up" data-v="1"><span aria-hidden="true">👍</span>Safe</button><button class="thumb down" data-v="0"><span aria-hidden="true">👎</span>Not safe</button></div>`;
    $('sort').querySelectorAll('.thumb').forEach(b => b.onclick = () => judge(+b.dataset.v));
    $('fb').textContent = '';
    $('score').textContent = `${state.sortAt + 1} of ${state.sortOrder.length}`;
    say([t + '.', 'Safe, or not safe?']);
  }
  function judge(v) {
    const [t, safe] = SORT[state.sortOrder[state.sortAt]], right = v === safe;
    $('scard').classList.add(safe ? 'safe' : 'unsafe');
    $('sort').querySelectorAll('.thumb').forEach(b => b.disabled = true);
    if (right) state.sortRight++;
    right ? (SFX.yes(), hop()) : (SFX.no(), shake());
    $('fb').innerHTML = `${right ? '<b>Yes!</b> ' : '<b>Think again.</b> '}That is ${safe ? '<b>safe</b>' : '<b>not safe</b>'}.`;
    say([right ? 'Yes!' : 'Think again.', safe ? 'That is safe.' : 'That is not safe.']);
  }

    const from = dir > 0 ? -280 : 1100, to = dir > 0 ? 1100 : -280;

    // race the timer: some browsers (and headless ones) never settle .finished for a background tab
    const an = g.animate([{transform: `translateX(${from}px)`}, {transform: `translateX(${to}px)`}], {duration: ms, easing: 'linear'});
    return Promise.race([an.finished.catch(() => {}), wait(ms + 100)]).then(() => g.remove());
  }
  async function crossing() {
    const me = ++state.run;
    state.looked = [];
    road(); carsG.replaceChildren();
    $('pup').style.left = '425px'; $('pup').style.bottom = '352px'; $('pup').style.width = $('pup').style.height = '150px';
    $('look').innerHTML = '<button class="big-btn" id="l1">👈 Look left</button><button class="big-btn" id="r1">Look right 👉</button><button class="big-btn" id="l2">👈 Left again</button><button class="big-btn gold" id="go" disabled>🚶 Cross!</button>';
    $('status').textContent = 'Stop at the curb. Wait for the walking person.';
    say('Stop at the curb. Wait for the walking person.');
    // cars pass while the hand is showing; then the signal changes
    const passes = 1 + Math.random() * 2 | 0;
    let looking = Promise.resolve();
    const lookBtn = (id, dir, label) => $(id).onclick = () => {
      if (state.looked.length !== ['l1', 'r1', 'l2'].indexOf(id)) { $('status').textContent = 'Look left first, then right, then left again.'; return say('Look left first, then right, then left again.'); }
      state.looked.push(id); $(id).classList.add('done'); tone(700 + state.looked.length * 120, .12, .05);
      $('pup').animate && !reduce && $('pup').animate([{transform: 'scaleX(1)'}, {transform: `scaleX(${dir})`}, {transform: 'scaleX(1)'}], {duration: 700});
      say(label);
      ready();
    };
    lookBtn('l1', -1, 'Left.'); lookBtn('r1', 1, 'Right.'); lookBtn('l2', -1, 'Left again.');
    let walk = false;
    const ready = () => { $('go').disabled = !(walk && state.looked.length === 3); if (walk && state.looked.length === 3) { $('status').textContent = 'The walking person is on. No cars coming. Cross with a grown-up!'; } };
    $('go').onclick = async () => {
      $('go').disabled = true; SFX.step(); hop();
      $('status').textContent = 'Keep looking while you cross!';
      say('Keep looking while you cross!');
      if (!reduce) await Promise.race([$('pup').animate([{bottom: '352px'}, {bottom: '96px'}], {duration: 2200, easing: 'linear', fill: 'forwards'}).finished.catch(() => {}), wait(2300)]);
      else await wait(2200);
      if (me !== state.run) return;
      $('pup').style.bottom = '96px';
      SFX.yes();
      $('status').textContent = 'Safe on the other side!';
      say('Safe on the other side!');
    };
    for (let i = 0; i < passes; i++) {
      if (me !== state.run) return;
      await wait(1200 + Math.random() * 1500);
      if (me !== state.run) return;
      await car(Math.random() < .5 ? 1 : -1, ['#e63946', '#3a86ff', '#ffbe0b', '#8338ec'][Math.random() * 4 | 0], 2600);
    }
    if (me !== state.run) return;
    await wait(1000);
    if (me !== state.run) return;
    walk = true; setSignal('walk'); SFX.walk();
    $('status').textContent = state.looked.length === 3 ? 'The walking person is on!' : 'The walking person is on! Did you look left, right and left?';
    say('The walking person is on!');
    ready();
  }

  function setMode(m) {
    state.mode = m; state.run++; stopTalk();
    for (const [id, k] of [['m-walk', 'walk'], ['m-sort', 'sort'], ['m-cross', 'cross']]) $(id).setAttribute('aria-pressed', m === k);
    const walkM = m === 'walk', cross = m === 'cross';
    $('path').hidden = $('card').hidden = $('choices').hidden = !walkM;
    $('sort').hidden = m !== 'sort'; $('cross').hidden = $('look').hidden = !cross; $('status').hidden = !cross;
    $('fb').textContent = ''; $('tip').innerHTML = '';
    $('pup').getAnimations().forEach(a => a.cancel());
    Object.assign($('pup').style, {left: '30px', bottom: '20px', width: '220px', height: '220px'});
    if (walkM) {
      $('hint').innerHTML = '<b>Walk the street.</b> Seven stops. Read each one, let the class vote (one finger or two), then tap the choice. An unsafe pick explains why, and you try again.';
      $('tip').innerHTML = 'Ask: what could happen? What\'s the safe thing to do?';
      state.at = 0; stop();
    }
    if (m === 'sort') {
      $('ctrl').innerHTML = '<button class="big-btn" id="next">Next card →</button><div class="score" id="score"></div>';
      $('next').onclick = nextSort;
      $('hint').innerHTML = '<b>Safe or not?</b> Read the card. Everyone shows thumbs up for safe or thumbs down for not safe, then tap the answer.';
      state.sortOrder = []; nextSort();
    }
    if (cross) {
      $('ctrl').innerHTML = '<button class="big-btn gold" id="again">↺ Practice again</button>';
      $('again').onclick = crossing;
      $('hint').innerHTML = '<b>Crossing practice.</b> Biscuit stops at the curb. Look left, right and left again (children turn their heads too). Wait for the walking person, then cross, and keep looking.';
      $('tip').innerHTML = 'Young children should always cross with a grown-up. This practices the habit.';
      crossing();
    }
  }
  $('m-walk').onclick = () => setMode('walk');
  $('m-sort').onclick = () => setMode('sort');
  $('m-cross').onclick = () => setMode('cross');
  addEventListener('keydown', e => { if (e.target.closest('button') || !/^[1-3]$/.test(e.key)) return; setMode(['walk', 'sort', 'cross'][e.key - 1]); });

  // ---------- sound and voice ----------
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
    if (!state.sound) stopTalk();
  };
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    // Chrome fills its voice list late, so an early line waits for it; cancel() also drops a line still waiting,
    // or it would start after the next one and the tool would talk over itself
    const speak = speechSynthesis.speak.bind(speechSynthesis), cancel = speechSynthesis.cancel.bind(speechSynthesis), held = new Set();
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      held.add(u);
      const go = () => { if (!held.delete(u)) return; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.cancel = () => { held.forEach(u => u.onend && u.onend()); held.clear(); cancel(); };
    speechSynthesis.getVoices();
  }
  const CLIPS = {};
  const allLines = () => [...new Set([
    ...STOPS.flatMap(s => [s.q, `One: ${s.safe}.`, `Two: ${s.safe}.`, `One: ${s.unsafe}.`, `Two: ${s.unsafe}.`, s.yes, s.no]), 'Safe choice!', 'Not safe.',
    'Biscuit made it all the way down Safety Street. You helped make safe choices at every stop!',
    ...SORT.map(([t]) => t + '.'), 'Safe, or not safe?', 'Yes!', 'Think again.', 'That is safe.', 'That is not safe.',
    'Stop at the curb. Wait for the walking person.', 'Look left first, then right, then left again.', 'Left.', 'Right.', 'Left again.',
    'Keep looking while you cross!', 'Safe on the other side!', 'The walking person is on!'])];
  let talk = 0, clip = null, last = [], heard = false;
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { heard = true; }, {once: true, capture: true});
  function stopTalk() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (CLIPS[text]) { clip = new Audio(CLIPS[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = .92; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function say(parts, force) {
    if (!heard && !force) return;
    if (!state.sound && !force) return;
    stopTalk();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(150); }
  }
  $('read').onclick = () => say(last.length ? last : [$('hint').textContent], true);

  showMotion();
  window.__safety = {state, setMode, choose, judge, crossing, allLines};  // for checking frames
  setMode('walk');
})();
