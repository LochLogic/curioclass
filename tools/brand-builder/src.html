:root {
  --paper:#f7f7f4; --panel:#ffffff; --ink:#18181b; --muted:#57575f; --line:#e2e2dc;
  --brand:#047857; --brand-ink:#ffffff; --focus:#905226; --head-bg:#ffffff;
  --btn:#ffffff; --btn-line:#c6ccc6; --head-ink:#18181b; --tip-bg:#f1f5f1;
  --sec-bg:#ffffff; --ok:#047857; --warn:#b42318; color-scheme:light;
}
body { font-family:'Instrument Sans','Segoe UI',sans-serif; grid-template-rows:74px minmax(0,1fr) 48px; overflow:hidden; }
header { padding:10px 24px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:nowrap; }
h1 { font:700 25px/1.1 'Instrument Sans',sans-serif; letter-spacing:-1px; white-space:nowrap; }
h1 small { font-size:12px; letter-spacing:0; margin-top:5px; }
button,input,select { font:inherit; }
button { min-height:44px; border:1px solid var(--btn-line); border-radius:7px; background:#fff; padding:7px 12px; }
button:hover { background:#eef5ef; }
button:active { transform:translateY(1px); }
button:disabled,button[aria-disabled="true"] { cursor:default; opacity:.48; }
button[aria-pressed="true"],button[aria-selected="true"] { border-color:var(--brand); background:#e5f2eb; color:#075e46; }
.seg { border:0; border-radius:6px; background:#f1f1ed; padding:3px; gap:2px; flex-shrink:0; }
.seg button { font-size:14px; min-height:44px; padding:0 14px; background:transparent; border-radius:4px; font-weight:600; }
.seg button { min-width:44px; }
.seg button[aria-pressed="true"] { background:#fff; color:var(--brand); box-shadow:0 1px 4px #0002; }
.icon-btn { font-size:12px; min-height:44px; padding:0 10px; border-radius:6px; font-weight:500; }
#read { min-width:44px; }
#motion,#sound { min-width:86px; }
#print-header { display:none; }
main { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:0; }
.stage { min-height:0; overflow:auto; padding:22px; background:var(--paper); }
.panel { border-left:1px solid var(--line); padding:16px; gap:12px; overflow:auto; min-height:0; }
.stage { grid-column:1; grid-row:1; }
.panel { grid-column:2; grid-row:1; }
.eyebrow { font-size:10px; letter-spacing:2px; text-transform:uppercase; font-weight:700; color:var(--muted); }
h2,h3,p { margin:0; }
.headline { font:500 clamp(27px,3vw,48px)/1.04 'Fraunces',Georgia,serif; letter-spacing:-1.5px; }
.sub { font-size:13px; line-height:1.45; color:var(--muted); }
.primary { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:650; }
.primary:hover { background:#065f46; }
.row { display:flex; align-items:center; gap:8px; }
.row > * { min-width:0; }
.between { justify-content:space-between; }
.full { width:100%; }
.mini-preview { height:84px; border:1px solid var(--line); border-radius:6px; background:#fff; padding:10px; flex-shrink:0; }
.mini-preview svg { width:100%; height:100%; }
.brief-hero { min-height:118px; display:flex; align-items:center; padding:22px; background:#eae9e2 url('art:bb-studio') center/cover;
  border:1px solid #deded5; border-radius:8px; margin-bottom:18px; }
.brief-hero .headline { max-width:65%; }
.brief-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.client { display:flex; flex-direction:column; align-items:flex-start; text-align:left; min-width:0; min-height:200px;
  border:1px solid #dadbd3; padding:16px; background:#fff; position:relative; box-shadow:0 2px 3px #33300004; }
.client[aria-pressed="true"] { box-shadow:inset 0 0 0 1px var(--brand); background:#fff; }
.client .symbol-sample { width:48px; height:48px; padding:5px; background:var(--tint); border-radius:7px; margin-bottom:10px; }
.client .symbol-sample svg { width:100%; height:100%; }
.client h3 { font-size:17px; line-height:1.15; letter-spacing:-.4px; }
.client p { font-size:12px; line-height:1.35; color:var(--muted); margin-top:7px; }
.client .tags { margin-top:auto; padding-top:12px; font-size:11px; color:#30463d; }
.card-constraint { font-size:10px; line-height:1.2; margin-top:6px; color:var(--muted); }
.saved-tick { position:absolute; right:12px; top:12px; font-size:11px; color:var(--brand); }
.client-number { font:11px var(--readout-font); color:#777; position:absolute; right:14px; bottom:14px; }
.client-details { display:flex; flex-direction:column; gap:15px; }
.client-details h2 { font:500 28px/1.08 'Fraunces',serif; }
.client-details h2,.sheet-head h2,.sheet-copy { overflow-wrap:anywhere; }
.words { display:flex; flex-wrap:wrap; gap:5px; }
.words span { background:#edf3ed; padding:6px 9px; border:1px solid #d9e5da; border-radius:4px; font-size:12px; }
.words span { max-width:100%; overflow-wrap:anywhere; }
.constraint { background:#f7f2e7; border-left:3px solid #a67b39; padding:12px; font-size:13px; line-height:1.45; }
.own-row { display:flex; gap:8px; margin-top:12px; }
.own-row button:first-child { flex:1; text-align:left; }
.compact-own { display:none; }
.privacy { font-size:11px; color:var(--muted); line-height:1.35; }
.field { position:relative; min-width:0; }
.field > label { position:absolute; top:4px; left:10px; font-size:10px; font-weight:650; color:var(--muted); z-index:1; pointer-events:none; }
.field > label { white-space:nowrap; max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis; }
.field input:not([type=range]),.field select { width:100%; min-height:46px; color:var(--ink); background:#fff;
  border:1px solid #c6ccc6; border-radius:5px; padding:17px 8px 3px; font-size:12px; }
.field.range { border:1px solid #c6ccc6; border-radius:5px; height:46px; padding:18px 8px 0; }
.field input[type=range] { margin:0; width:100%; height:24px; accent-color:var(--brand); }
.control-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.section-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; flex-shrink:0; }
.section-tabs button { padding:0 3px; border-radius:4px; font-size:12px; }
.section-tabs button[aria-expanded=true] { border-color:var(--brand); background:#e5f2eb; color:var(--brand); }
.section-body { display:flex; flex-direction:column; gap:10px; }
.history { display:grid; grid-template-columns:1fr 1fr 1.35fr; gap:5px; margin-top:auto; flex-shrink:0; }
.history button { font-size:12px; padding:0 5px; }
.design-stage { display:flex; flex-direction:column; padding:22px; overflow:hidden; gap:14px; }
.artboard { position:relative; flex:1; min-height:0; overflow:hidden; background:#fff; border:1px solid #d7dbd5;
  box-shadow:0 8px 25px #21392b0a; background-image:linear-gradient(#0000000f 1px,transparent 1px),
  linear-gradient(90deg,#0000000f 1px,transparent 1px); background-size:32px 32px; display:grid; place-items:center; }
.artboard::before,.artboard::after { content:''; position:absolute; width:12px; height:12px; border-color:#778f80; }
.artboard::before { left:12px; top:12px; border-left:1px solid; border-top:1px solid; }
.artboard::after { right:12px; bottom:12px; border-right:1px solid; border-bottom:1px solid; }
.artboard > svg { position:absolute; left:8%; top:10%; width:84%; height:80%; overflow:visible; }
.artboard .art-label { position:absolute; left:18px; bottom:14px; font:10px var(--readout-font); color:#68756d; }
.artboard .art-label { max-width:calc(100% - 36px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.design-meta { display:flex; justify-content:space-between; gap:10px; font-size:11px; color:var(--muted); }
.design-meta .words { min-width:0; }
.design-meta .words span { padding:4px 8px; }
.surface-strip { display:grid; grid-template-columns:repeat(3,1fr); height:126px; gap:10px; flex-shrink:0; }
.surface-peek { border:1px solid var(--line); overflow:hidden; border-radius:6px; padding:0; background:#e8e6dc; }
.surface-peek svg { width:100%; height:100%; display:block; }
.stage-title { display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:16px; }
.stage-title h2 { font:500 30px 'Fraunces',serif; letter-spacing:-.7px; }
.wall { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }

  function lum(hex) {
    const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);

  // SVG is the single source for the displayed mark and the offscreen raster tests.
  async function raster(body,size,view='0 0 100 100') {
    const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const img=new Image();
    const embedded=body.includes('<text')?`<style>${fontCSS}</style>`:'';
    const text=svg(embedded+body,view,`width="${size}" height="${size}"`);
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(text)));});
    ctx.drawImage(img,0,0,size,size);

  function alpha(canvas) { return canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,canvas.width,canvas.height).data; }

    const c=up.getContext('2d');c.imageSmoothingEnabled=true;c.imageSmoothingQuality='low';c.drawImage(small,0,0,256,256);
    const a=mask(reference),b=mask(up);let intersection=0,union=0;
    for(let i=0;i<a.length;i++){intersection+=a[i]&&b[i]?1:0;union+=a[i]||b[i]?1:0;}
    return union?intersection/union:0;

  function countRegions(m,w,diagonal=false) {
    const visited=new Uint8Array(m.length);let count=0;
    for(let i=0;i<m.length;i++) {
      if(!m[i]||visited[i])continue;
      count++;const stack=[i];visited[i]=1;
      while(stack.length) {
        const p=stack.pop(),x=p%w;
        const next=[p-w,p+w];if(x)next.push(p-1);if(x<w-1)next.push(p+1);
        if(diagonal){if(x)next.push(p-w-1,p+w-1);if(x<w-1)next.push(p-w+1,p+w+1);}
        for(const n of next)if(n>=0&&n<m.length&&m[n]&&!visited[n]){visited[n]=1;stack.push(n);}
      }
    }
    return count;
  }
  async function oneColor(d,size=100) {

    const regions=await Promise.all(colors.map(async color=>{
      const isolated=original.replace(/(fill|stroke)="(#[0-9a-f]{6})"/gi,(_,attribute,ink)=>
        `${attribute}="${ink.toLowerCase()===color?'#ffffff':'#000000'}"`);
      const coverage=alpha(await raster(isolated,size));
      const m=Uint8Array.from({length:size*size},(_,i)=>
        coverage[i*4]*coverage[i*4+3]/255>=128?1:0);

    const separate=regions.reduce((sum,n)=>sum+n,0);

    const joined=countRegions(mask(single),size,true);

      if(score>=.8){minimum=n;break;}
    }
    const icon=await raster(body,60),im=mask(icon),coverage=im.reduce((a,b)=>a+b,0)/im.length;
    const l=lockup(d),avatar=await raster(l.body,110,`0 0 ${l.w} ${l.h}`),am=mask(avatar);
    let outside=0;
    am.forEach((v,i)=>{if(v&&Math.hypot(i%110+.5-55,Math.floor(i/110)+.5-55)>50.6)outside++;});
    const printLockup=lockup(d);
    const shirtSize=Math.max(1,Math.round(100*Math.min(460/printLockup.w,350/printLockup.h)));
    const bagSize=Math.max(1,Math.round(100*Math.min(350/printLockup.w,320/printLockup.h)));
    const [shirtMerge,bagMerge]=await Promise.all([oneColor(d,shirtSize),oneColor(d,bagSize)]);
    const ratio=contrast(d.ink,'#ffffff'),tagRatio=ratio;
    const sign=lockup(d,'side');
    const nameSize=42*Math.min(730/sign.w,80/sign.h);
    const threshold=nameSize>=24?3:4.5;
    const namePass=ratio>=threshold&&(!d.tagline||!brief().tagline||tagRatio>=4.5);
    const primary=contrast(d.primary,'#ffffff'),secondary=contrast(d.secondary,'#ffffff');
    const bagInk=contrast(d.ink,'#c79c67');
    const gr=contrast(gray(d.primary),gray(d.secondary));
    results.tab={pass:similarity>=.8,metric:(100*similarity).toFixed(0)+'%',pixels:smallColor.toDataURL(),
      why:`At 16 px, the enlarged silhouette overlaps ${(similarity*100).toFixed(1)}% of the original. This tool asks for at least 80%. Thin strokes and small gaps can disappear.`,
      note:'Half-coverage masks, overlap divided by union. Bilinear enlargement; tool cutoff: 80%.'};
    results.phone={pass:coverage>=.3&&coverage<=.8,metric:(coverage*100).toFixed(0)+'% area',
      why:`The mark covers ${(coverage*100).toFixed(1)}% of its 60 px app icon. This tool accepts 30% to 80%. Change Scale or Container to balance presence and breathing room.`,
      note:'Measured mark coverage, not the white app-icon background. Tool cutoff: 30% to 80%.'};
    results.avatar={pass:outside===0,metric:outside+' px outside',
      why:`${outside} painted pixel${outside===1?' sits':'s sit'} outside the dotted safe circle. Try Mark only, or a more compact lockup. The safe circle is 92% of the 110 px avatar width.`,
      note:'The crop and safe-margin cutoff are this tool\'s own. The complete lockup is checked, including letters.'};
    results.sign={pass:namePass,metric:ratio.toFixed(1)+':1',
      why:`Ink on this white sign is ${ratio.toFixed(1)}:1. The name needs ${threshold.toFixed(1)}:1 here; a visible tagline needs 4.5:1. Choose darker Ink.`,
      note:'WCAG 2.1 text contrast: 4.5:1, or 3:1 for large text. Contrast is only one part of legibility.'};
    results.van={pass:(primary>=3&&secondary>=3)||d.container!=='none',metric:Math.min(primary,secondary).toFixed(1)+':1',
      why:`Primary is ${primary.toFixed(1)}:1 and secondary is ${secondary.toFixed(1)}:1 on the van white. Each needs 3:1, or use a container to define the mark.`,
      note:'WCAG 2.1 non-text contrast: 3:1. Accepting any container is a tool shortcut; a pale container alone does not meet WCAG.'};
    const monoWhy=merge=>{
      const colored=`${merge.separate} colored region${merge.separate===1?'':'s'}`;
      const ink=`${merge.joined} connected ink region${merge.joined===1?'':'s'}`;
      return merge.merge?`${colored} ${merge.separate===1?'becomes':'become'} ${ink}. Touching colors merge in one ink; try a line version.`:
        `${colored} ${merge.separate===1?'remains':'remain'} ${ink}. This mark keeps its separations when printed in one ink.`;
    };
    results.shirt={pass:!shirtMerge.merge,merge:shirtMerge.merge,metric:`${shirtMerge.separate} → ${shirtMerge.joined}`,why:monoWhy(shirtMerge),
      note:`Connected ink regions counted at ${shirtSize} px across the mark grid, matching the shirt print. Transparent gaps stay unprinted.`};
    results.bag={pass:!bagMerge.merge&&bagInk>=4.5,merge:bagMerge.merge,metric:`${bagMerge.separate} → ${bagMerge.joined} / ${bagInk.toFixed(1)}:1`,
      why:monoWhy(bagMerge)+` Ink on kraft is ${bagInk.toFixed(1)}:1; it needs 4.5:1.`,
      note:`Connected regions at ${bagSize} px across the mark grid, matching the bag print; contrast uses a representative kraft color.`};
    results.news={pass:gr>=1.5,metric:gr.toFixed(1)+':1 gray',
      why:gr>=1.5?`The two colors differ by ${gr.toFixed(1)}:1 in gray. Their tonal difference survives this print test.`:
      `These two colors print as the same gray. Their contrast is ${gr.toFixed(1)}:1; this tool asks for at least 1.5:1. Change Secondary lightness.`,
      note:'Grays preserve WCAG relative luminance. The 1.5:1 cutoff is this tool\'s own.'};
    if(token!==runToken||revision!==state.revision)return false;
    const old=state.results;
    state.results=results;state.minimum=minimum;state.testRevision=revision;state.testing=false;
    if(state.mode==='test') {
      updateTestResults();
      if(!state.tile) hint('welcomeTest',false);
      if(Object.values(results).every(r=>r.pass)) {
        Curio.yes();
        hint('allHold',false);V.say('allHold',{valid:()=>state.testRevision===revision&&!state.tile,hint:false});
      } else {
        const broken=surfaces.find(s=>old[s.id]?.pass&&!results[s.id].pass);
        if(broken) {
          hint('broke-'+broken.id,false);
          V.say('broke-'+broken.id,{valid:()=>state.revision===revision&&!state.tile,hint:false});
        }
      }
    }
    return results;
  }
  function scheduleTests() {
    clearTimeout(debounce);runToken++;
    state.testing=true;
    document.querySelectorAll('[data-tile] .test-row').forEach(row=>{
      row.className='test-row';row.textContent='Testing…';
    });
    if($('test-status'))$('test-status').textContent='Testing your mark…';
    debounce=setTimeout(()=>runTests().catch(testFailure),150);
  }
  function testFailure(error) {
    $('hint').textContent='The surface test could not finish. Return to Design and try again.';
    console.error(error);
  }
  function updateTestResults() {
    document.querySelectorAll('[data-tile]').forEach(el=>{
      const s=surfaces.find(s=>s.id===el.dataset.tile),r=state.results[s.id];
      el.querySelector('.photo').innerHTML=surface(s.id);
      const row=el.querySelector('.test-row');row.className='test-row '+(r.pass?'pass':'fail');
      row.innerHTML=`<b>${r.pass?'✓ Holds up':'× Breaks'}</b><span class="metric">${esc(r.metric)}</span>`;
    });
    if($('holds-count')) $('holds-count').innerHTML=Object.values(state.results).filter(r=>r.pass).length+
      '<span style="font-size:20px;color:#8a958e"> / 8</span>';
    if($('test-status')) $('test-status').textContent='Live results';
  }
  function openDialog(html) {
    V.hush();
    returnFocus=document.activeElement;
    $('dialog').className='';
    $('dialog').innerHTML=html;
    const head=$('dialog').querySelector('.dialog-head');
    const closeInHead=head?.querySelector('#close-dialog');
    const readButton='<button id="dialog-read">Read</button>';
    if(closeInHead) closeInHead.insertAdjacentHTML('beforebegin',readButton);
    else head?.insertAdjacentHTML('beforeend',readButton);
    $('dialog-read').onclick=()=>V.read();
    $('dialog').showModal();
    const close=$('close-dialog');if(close)close.onclick=closeDialog;
  }
  function closeDialog() {
    $('dialog').close();state.tile=null;
    V.hush();
    const allHold=state.mode==='test'&&Object.keys(state.results).length===8&&Object.values(state.results).every(r=>r.pass);
    hint(state.mode==='design'?state.section+'How':allHold?'allHold':'welcome'+state.mode[0].toUpperCase()+state.mode.slice(1),false);
    if(returnFocus?.isConnected) returnFocus.focus({preventScroll:true});
  }
  function symbolDialog() {
    openDialog(`<div class="dialog-head"><h2 id="dialog-title">Choose a symbol</h2><button id="close-dialog">Close</button></div>
      <div class="symbol-grid">${symbols.map(s=>`<button id="symbol-${s}" data-symbol="${s}" aria-label="${s==='hexagons'?'Three stacked hexagons':s}"
        title="${s}" aria-pressed="${design.symbol===s}">${mark({...design,symbol:s,container:'none',mono:'',scale:80,rotate:0})}</button>`).join('')}</div>`);
    hint('symbolsHow');
    document.querySelectorAll('[data-symbol]').forEach(el=>el.onclick=()=>{
      change({symbol:el.dataset.symbol});closeDialog();$('choose-symbol').title='Current symbol: '+design.symbol;
    });
  }
  function paletteDialog() {
    const colors=[...palette,...(state.role==='ink'?['#111111','#ffffff']:[])];
    openDialog(`<div class="dialog-head"><h2 id="dialog-title">${state.role[0].toUpperCase()+state.role.slice(1)} palette</h2>
      <button id="close-dialog">Close</button></div><div class="swatches">${colors.map((c,i)=>
      `<button class="swatch" id="swatch-${i}" data-swatch="${c}" style="background:${c}" aria-label="${state.role} ${c}"
      title="${c}" aria-pressed="${design[state.role]===c}"></button>`).join('')}</div>`);
    hint('paletteHow',false);
    V.how('paletteHow',{valid:()=>$('dialog').open,needs:'.swatch',hint:false});
    document.querySelectorAll('[data-swatch]').forEach(el=>el.onclick=()=>{
      change({[state.role]:el.dataset.swatch});closeDialog();
      const a=hsl(design[state.role]);$('hue').value=a[0];$('lightness').value=a[2];
      $('value-hue').textContent=a[0]+'°';$('value-lightness').textContent=a[2]+'%';
    });
  }
  async function openTile(id) {
    const revision=state.revision,client=state.brief;
    if(state.testRevision!==revision||!state.results[id])await runTests();
    if(state.mode!=='test'||state.revision!==revision||state.brief!==client)return;
    const s=surfaces.find(s=>s.id===id),r=state.results[id];if(!r)return;
    state.tile=id;V.dropQueued();
    openDialog(`<div class="dialog-head"><h2 id="dialog-title">${s.name}</h2><button id="close-dialog">Close</button></div>
      <div class="dialog-art">${surface(id)}</div><div class="why"><b class="${r.pass?'pass':'fail'}">${r.pass?'✓ Holds up':'× Breaks'} / ${s.test} / ${r.metric}</b>
      <p style="margin-top:8px">${esc(r.why)}</p><small>${esc(r.note)}</small>
      ${surfaceNotes(id)}
      ${!r.pass&&['shirt','bag'].includes(id)&&r.merge?mergeProof():''}</div>
      <button class="primary" id="fix-design">Fix in Design ↗</button>`);
    $('dialog').classList.add('surface-dialog');
    $('hint').textContent=r.pass?L.holdHow:L.fixHow;
    if(!r.pass)V.how('fixHow',{valid:()=>state.tile===id,needs:'#fix-design',hint:false});
    $('fix-design').onclick=()=>{
      const section=id==='bag'&&contrast(design.ink,'#c79c67')<4.5?'color':s.section;
      closeDialog();
      state.section=section;
      if(id==='sign'||(id==='bag'&&section==='color'))state.role='ink';
      if(id==='van')state.role='primary';
      if(id==='news')state.role='secondary';
      setMode('design');
      const control=id==='bag'&&section==='color'?'role-ink':s.control;
      $(control)?.focus({preventScroll:true});
    };
  }
  function surfaceNotes(id) {
    const sizes={avatar:[110,110],bag:[350,320],shirt:[460,350],van:[280,170],sign:[730,80],news:[230,148]};
    const layouts={van:'stacked',sign:'side',tab:'mark',phone:'mark'};
    const layout=layouts[id]||design.lockup;
    const l=lockup(design,layout);
    const [width,height]=sizes[id]||[60,60];
    const cap=l.cap*Math.min(width/l.w,height/l.h);
    const notes=[];
    if(design.face==='Pacifico'&&design.case==='upper') {
      notes.push('Script letters are made to join; in capitals they get hard to read.');
    }
    if(layout!=='mark'&&cap<6)notes.push('The name is too small to read here; use Mark only.');
    return notes.map(n=>`<small>${n}</small>`).join('');
  }
  function mergeProof() {
    const outline=`<g transform="translate(50 50) rotate(${design.rotate}) scale(${design.scale/100}) translate(-50 -50)">
      <path d="${paths[design.symbol]}" fill="none" stroke="#b42318" stroke-width="1.5" stroke-dasharray="3 2"/></g>`;
    return `<div class="row" style="margin-top:10px;gap:16px"><div style="width:80px">${mark()}</div>
      <span aria-hidden="true">→</span><div style="width:80px">${svg(symbolMarkup(design,'#18181b','#18181b',true)+outline,'0 0 100 100')}</div>
      <small>The red outline locates the merged ink region. The internal color boundary disappears.</small></div>`;
  }
  function confirmDialog(title,message,action) {
    openDialog(`<div class="dialog-head"><h2 id="dialog-title">${title}</h2></div><p class="sub">${message}</p>
      <div class="row" style="margin-top:16px"><button id="confirm-yes" class="primary">Yes, clear</button><button id="close-dialog">Keep it</button></div>`);
    hint('confirmHow',false);
    V.how('confirmHow',{valid:()=>$('dialog').open,needs:'#confirm-yes',hint:false});
    $('confirm-yes').onclick=()=>{closeDialog();action();};
    $('close-dialog').focus({preventScroll:true});
  }
  function ownDialog() {
    chooseBrief('own');
    openDialog(`<div class="dialog-head"><h2 id="dialog-title">My own business</h2><button id="close-dialog">Close</button></div>
      <div class="field"><label for="own-name">Business name</label>
      <input id="own-name" aria-label="Business name" maxlength="60" value="${esc(design.ownName)}"></div>
      <div class="control-grid" style="margin-top:10px">${[0,1,2].map(i=>`<div class="field"><label for="own-word-${i}">Personality word ${i+1}</label>
      <input id="own-word-${i}" aria-label="Personality word ${i+1}" maxlength="24" value="${esc(design.ownWords[i])}"></div>`).join('')}</div>
      <p class="privacy" style="margin:12px 0">Made-up business details only. Your text stays on this device.</p>
      <button class="primary" id="save-own">Start this brand ↗</button>`);
    hint('ownHow',false);
    V.how('ownHow',{valid:()=>$('dialog').open&&state.brief==='own',needs:'#save-own',hint:false});
    $('save-own').onclick=()=>{
      design.ownName=$('own-name').value.trim()||'Your business';
      design.ownWords=[0,1,2].map(i=>$('own-word-'+i).value.trim()||['clear','distinct','useful'][i]);
      save();closeDialog();setMode('design');
    };
  }
  function sheetPanel() {
    $('panel-content').innerHTML=`<div class="client-details"><p class="eyebrow">03 / BRAND GUIDELINES</p><h2>A system worth keeping.</h2>
      <button id="print-sheet" class="primary">Print sheet</button><h3 style="font-size:14px">Critique swap</h3>
      <p class="sub">Swap seats at this laptop. Let your partner look before you explain.</p>
      <ol class="critique">${['What do you notice first?',"Pick one word for this business. Is it one of the brief’s three?",
        'Which surface breaks it worst?',"Name one change you'd try first."].map(t=>`<li>${t}</li>`).join('')}</ol></div>`;
    $('print-sheet').onclick=()=>{V.dropQueued();window.print();};
  }
  function sheetStage() {
    const f=faces.find(f=>f[0]===design.face);
    const clear=lockup();
    const measuring=document.createElementNS(NS,'svg');
    measuring.innerHTML=symbolMarkup();
    measuring.style.cssText='position:fixed;visibility:hidden;width:100px;height:100px';
    document.body.append(measuring);
    const markHeight=measuring.getBBox().height;
    measuring.innerHTML=clear.body;
    const bounds=measuring.getBBox();
    measuring.remove();
    const margin=.25*markHeight;
    const box={x:bounds.x-margin,y:bounds.y-margin,w:bounds.width+2*margin,h:bounds.height+2*margin};
    const clearSVG=svg(`<rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}"
      fill="none" stroke="#75887b" stroke-dasharray="4 3"/>${clear.body}`,
      `${box.x-1} ${box.y-1} ${box.w+2} ${box.h+2}`);
    $('stage').innerHTML=`<article class="sheet" id="brand-sheet"><div class="sheet-head"><p class="eyebrow">Brand identity / ${esc(words().join(' · '))}</p>
      <h2>${esc(name())}</h2></div><div class="sheet-lockups">${[['side','Side by side'],['stacked','Stacked'],['mark','Mark only']].map(([k,t])=>
        `<div>${lockupSVG(design,k)}<small>${t}</small></div>`).join('')}</div>
      <h3>Clear space</h3><div class="clear-space" style="border:0;padding:0">${clearSVG}</div><p class="sheet-copy">Leave 25% of the mark's height on every side.
      This is the tool's own convention.</p><p class="sheet-copy"><b>Minimum mark width:</b> <span id="minimum-size">Testing…</span></p>
      <h3>Color specification</h3><div class="sheet-colors">${['primary','secondary','ink'].map(k=>`<div><div class="chip" style="background:${design[k]}"></div>
      <p><b>${k.toUpperCase()}</b><br>${design[k].toUpperCase()}<br>White ${contrast(design[k],'#ffffff').toFixed(1)}:1<br>Black ${contrast(design[k],'#000000').toFixed(1)}:1</p></div>`).join('')}</div>
      <h3>Typography</h3><p class="sheet-copy">${f[0]} / ${f[1]} / ${design.weight===700?'Bold':'Regular'}<br>
      SIL Open Font License 1.1. ${f[2]} Convention, not a rule.</p><h3>Brief fit / designer's judgment</h3>
      <div class="sheet-copy">${words().map((w,i)=>`<p><b>${esc(w||'Word '+(i+1))}: ${design.fit[i]}</b> · ${esc(design.notes[i]||'No design evidence noted yet.')}</p>`).join('')}</div>
      <div class="sheet-footer">Curio Class · Brand Builder · Saved on this device. Test cutoffs describe this simulation, not brand certification.</div></article>`;
    updateMinimum();
  }
  async function updateMinimum() {
    const revision=state.revision;
    const results=await runTests();
    if(!results||state.mode!=='sheet'||state.revision!==revision)return;
    if($('minimum-size')) $('minimum-size').textContent=state.minimum?state.minimum+' px (tested in 8 px steps; 80% silhouette overlap).':
      'No passing size through 256 px. Simplify the mark.';
  }
  function render() {
    document.querySelector('main').scrollTop=0;
    $('stage').className='stage'+(state.mode==='design'?' design-stage':'');
    $('stage').scrollTop=0;$('panel').scrollTop=0;updatePreview();
    if(state.mode==='brief'){briefPanel();briefStage();}
    if(state.mode==='design'){designPanel();designStage();}
    if(state.mode==='test'){testPanel();testStage();}
    if(state.mode==='sheet'){sheetPanel();sheetStage();}
  }
  function setMode(mode) {
    if(state.ready&&state.mode===mode)return;
    state.ready=true;
    const priorFocus=document.activeElement;
    V.hush();state.mode=mode;state.tile=null;state.page=0;
    state.testing=false;
    if(mode==='brief')state.cardOpened=false;
    ['brief','design','test','sheet'].forEach(k=>document.body.classList.toggle('mode-'+k,k===mode));
    if($('dialog').open)$('dialog').close();
    document.querySelectorAll('.seg button').forEach(el=>el.setAttribute('aria-pressed',el.id==='m-'+mode));
    render();
    const entryHint=mode==='design'&&(state.section!=='mark'||V.heard('welcomeDesign'))?
      state.section+'How':'welcome'+mode[0].toUpperCase()+mode.slice(1);
    hint(entryHint,false);
    $('print-header').hidden=mode!=='sheet'||innerWidth>600;
    if(priorFocus&&priorFocus!==document.body&&!priorFocus.isConnected) {
      $('m-'+mode).focus({preventScroll:true});
    }
    if(mode==='test') {
      state.testing=true;
      runTests().then(results=>{
        if(!results||state.mode!=='test'||state.tile)return;
        state.testing=false;
        if(Object.values(results).every(r=>r.pass))return;
        V.welcome();
        if(!V.heard('briefTile')&&brief().surface)V.how('briefTile',{valid:()=>!state.tile,hint:false});
      }).catch(testFailure);
    } else if(!V.welcome()&&mode==='design'&&entryHint!=='welcomeDesign') {
      V.how(entryHint,{hint:false,valid:()=>state.mode==='design'&&!state.tile});
    }
  }
  ['brief','design','test','sheet'].forEach(m=>$('m-'+m).onclick=()=>setMode(m));
  $('print-header').onclick=()=>{V.dropQueued();window.print();};
  $('dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
  let compact=compactWall();
  addEventListener('resize',()=>{
    $('print-header').hidden=state.mode!=='sheet'||innerWidth>600;
    if(compact!==compactWall()&&state.mode==='test'){compact=compactWall();testStage();}
  });
  document.addEventListener('keydown',e=>{
    if(state.mode==='design'&&!$('dialog').open&&(e.ctrlKey||e.metaKey)&&e.key==='z'
      &&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
      e.preventDefault();if(e.shiftKey)redo();else undo();
    }
  });
  Curio.init({clips:"voice:*",rate:1});
  window.__tool={state,setMode,allLines:V.allLines,vlog:V.log,get vq(){return V.queue;},get design(){return design;},
    change,runTests,contrast,lum,mark,lockup,oneColor,chooseBrief,openTile,undo,redo,save,
    get brands(){return brands;},surfaces,symbols,briefs,faces,render};
  setMode('brief');
  Promise.all(faces.flatMap(f=>(['Pacifico','Bebas Neue'].includes(f[0])?[400]:[400,700])
    .map(weight=>document.fonts.load(`${weight} 42px "${f[0]}"`)))).then(()=>{
    updatePreview();if(state.mode==='design')refreshArt();
  });
})();
</script>
