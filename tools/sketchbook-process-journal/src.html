<body>
<header>
  <h1>Sketchbook <i>Process Journal</i><small>Developing an idea from an issue and a tradition · Curio Class</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-sample" aria-pressed="true">Sample book</button>
    <button id="m-mine" aria-pressed="false">My book</button>
    <button id="m-map" aria-pressed="false">Idea map</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
  <button class="icon-btn" id="read">Read</button>
</header>
<main id="main">
  <div class="stage" id="stage"></div>
  <aside class="panel" id="panel">
    <div class="eyebrow" id="panelkicker"></div>
    <h2 id="paneltitle"></h2>
    <p id="panelintro"></p>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div id="panelactions"></div>
    <p class="status" id="saved" role="status"></p>
    <p class="bottom">Private by design. Your book stays on this device. Nothing leaves it.</p>
  </aside>
</main>
<dialog id="dialog" aria-labelledby="dialogtitle"><div class="modalinner" id="modalinner"></div></dialog>
<script src="kit:curio"></script>
<script>

    'wpa-a':'art:wpa-a', 'wpa-b':'art:wpa-b', 'sample-thumbs':'art:sample-thumbs', 'sample-study':'art:sample-study',
    'sample-rev1':'art:sample-rev1', 'sample-rev2':'art:sample-rev2', 'sample-plan':'art:sample-plan'
  };
  const L = {
    welcomeSample:"This is Theo's sketchbook. Tap Next page to see how the idea changed.",
    welcomeMine:'Tap an issue card, then tap Choose this issue.',
    pickTradition:'Now open Tradition. Tap a tradition card, then tap Choose this tradition.',

      ['All','Research','Tradition','Mine'].forEach(k => $('filter-'+k).setAttribute('aria-pressed',k === f));
      document.querySelectorAll('.node,.source-link').forEach(el => el.classList.toggle('dim',!matches({kind:el.dataset.kind})));
      hint('Tap a mark to inspect the page and the decision behind it.');
      tone();
    });
    const first = $('mapcanvas').querySelector('.node');
    if (first) {
      const scroller = $('mapscroll');
      const viewport = scroller.parentElement;
      if (first.offsetLeft+44 > scroller.clientWidth) scroller.scrollLeft = Math.max(0,first.offsetLeft-24);
      if (first.offsetTop+44 > viewport.clientHeight) viewport.scrollTop = first.offsetTop+44-viewport.clientHeight+12;
    }
  }
  function openNode(pi,ti) {
    V.dropQueued();
    const b = book();
    const p = b.pages[pi];
    const t = p.tags[ti];
    const old = isOld(t);
    const pic = pagePicture(p,b);
    modal(`Page ${pi+1} · ${t.aspect}`,`${pic ? `<img src="${pic}" alt="Page ${pi+1} drawing">` : ''}
      <div class="because" style="display:flex;align-items:center;gap:10px">${mark(t.kind)}<strong>${esc(sourceName(t))}</strong></div>
      ${old ? `<p class="muted">(from your old ${t.kind === 'research' ? 'issue' : 'tradition'})</p>` : ''}
      <p>${esc(t.note || 'No decision note yet.')}</p>`,[{text:'Back to map'},
        {text:'Open this page',id:'openNodePage',primary:true,run:() => {
          state.mode = state.book;
          state.page = pi;
          state.tagsOpen = false;
          V.hush();
          render();
          $('pageSelect').focus({preventScroll:true});
        }}]);
    tone();
  }
  for (const m of ['sample','mine','map']) $('m-'+m).onclick = () => setMode(m);
  Curio.init({clips:"voice:*",rate:.94});
  window.__tool = {state,setMode,openPage,allLines:V.allLines,vlog:V.log,get vq() {return V.queue;},
    get mine() {return mine;},get book() {return book();},DATA,ART,counts,render,save,addPage,histories,SWATCHES};
  render();
})();
</script>
</body>
</html>
