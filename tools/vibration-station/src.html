    state.humHeld = false;
    active.hum = 0;
    stopSound('hum');
    $('hum')?.setAttribute('aria-pressed', 'false');
    if (state.mode === 'find' && state.find.q === 3 && state.find.phase === 'test') {
      if (performance.now() - heldStamp >= 1000) completeFind();
      else {
        hint('humShort');
        say('humShort');
      }
    }
    drawAll(performance.now());
  }
  async function toggleMic() {
    if (micPending) return;
    if (state.mic) {
      turnMicOff();
      hint('t4');
      return;
    }
    micPending = true;
    const requestEpoch = ++micEpoch;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: true
      });
      if (requestEpoch !== micEpoch || $('mic-wrap').hidden) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
        micPending = false;
        return;
      }
      const ac = audioContext();
      analyser = ac.createAnalyser();
      analyser.fftSize = 1024;
      ac.createMediaStreamSource(micStream).connect(analyser);
      micData = new Float32Array(analyser.fftSize);
      state.mic = true;
      stopSound('hum');
      $('mic').textContent = '♩ Mic on';
      $('mic').setAttribute('aria-pressed', 'true');
      hint('micOn');
      how('micOn');
    } catch (e) {
      turnMicOff();
      hint('micOff');
      const cause = e?.name || 'unavailable';
      if (!micFailuresHeard.has(cause)) {
        micFailuresHeard.add(cause);
        say('micOff');
      }
    }
    micPending = false;
  }

  function turnMicOff() {
    micEpoch++;
    micStream?.getTracks().forEach(t => t.stop());
    micStream = null;
    analyser = null;
    state.mic = false;
    state.micLevel = 0;
    active.hum = 0;
    $('mic').textContent = '♩ Mic off';
    $('mic').setAttribute('aria-pressed', 'false');
  }

  function renderBench() {
    $('stage').innerHTML = image('bench', 'backdrop') + '<div class="bench-grid">' + ['band', 'drum', 'hum', 'pan'].map(k => stationMarkup(k)).join(
      '') + '</div><i class="idle-spark"></i>';
    ['band', 'drum', 'hum', 'pan'].forEach(bindStation);
    $('choices').innerHTML = btn('bench-find', 'Find out →', '⌕ ', 'action gold', state.stations.size < 2 ? 'hidden' : '');
    on('bench-find', () => setMode('find'));
    hint('Tap a rubber band to pluck it.');
    $('eyebrow').textContent = 'THE SOUND BENCH';
    $('mic-wrap').hidden = false;
    $('notebook-tag').hidden = true;
  }

  function enterQuestion(q) {
    const f = state.find;
    pendingNext = null;
    V.hush();
    silence();
    turnMicOff();
    f.q = q;
    f.phase = 'predict';
    f.prediction = null;
    f.order = shuffle([0, 1]);
    f.material = null;
    f.sticker = false;
    f.touchTrial = false;
    f.gap = false;
    f.plucked = false;
    f.pages[q] = null;
    renderFind();
    hint('q' + (q + 1));
    say('q' + (q + 1));
  }

  function renderFind() {
    const f = state.find;
    if (f.phase === 'claims') {
      renderClaims();
      return;
    }
    if (!f.order.length) f.order = shuffle([0, 1]);
    const kind = ['band', 'band', 'drum', 'hum', 'pan'][f.q];
    $('stage').innerHTML = image('bench', 'backdrop') + `<div class="question">${icon('investigate')}${Q[f.q]}</div>` +
      stationMarkup(kind, true) + '<div class="book-strip" id="book-strip"></div>';
    bindStation(kind);
    updateFindControls();
    renderBook();
    showFindPanel();
    $('eyebrow').textContent = 'OUR LAB BOOK · ' + (f.q + 1) + ' OF 5';
    $('notebook-tag').hidden = false;
    $('mic-wrap').hidden = !(f.q === 3 && ['test', 'result'].includes(f.phase));
  }

  function renderBook() {
    const f = state.find;
    $('book-strip').innerHTML = f.pages.map((p, i) => `<button class="book-page ${i===f.q?'current':''}" id="page-${i}"
      aria-label="${p?'Reopen':'Not finished'} investigation ${i+1}" ${p?'':'disabled'}>${i+1}<span class="page-word"> ${p?'We saw':'Guess + test'}</span>
      ${p?questionIcon(i,i!==1):''}</button>`).join('');
    f.pages.forEach((p, i) => {
      if (p) on('page-' + i, () => {
        preserve(() => enterQuestion(i), 'prediction-0');
      });
    });
  }

  function updateFindControls() {
    const f = state.find,
      k = ['band', 'band', 'drum', 'hum', 'pan'][f.q];
    const visible = f.phase === 'test' || f.phase === 'result';
    document.querySelector('.station-controls').hidden = !visible;
    document.querySelector('.band-targets')?.toggleAttribute('hidden', !visible);
    $('station-' + k).classList.toggle('touching', k === 'pan' && !f.gap);
    $('mic-wrap').hidden = !(f.q === 3 && ['test', 'result'].includes(f.phase));
  }

  function showFindPanel() {
    const f = state.find;
    $('notebook-tag').textContent = f.prediction === null ? 'We think… then we test.' :
      'We thought: ' + P[f.q][f.prediction] + (f.phase === 'result' ? ' · We saw: ' + (f.q === 1 ? 'sound stops' : 'a shake') : '');
    if (f.phase === 'predict') {
      $('choices').innerHTML = '<div class="choice-row">' + f.order.map((p, pos) =>
        btn('prediction-' + pos, P[f.q][p], questionIcon(f.q, p === 0), 'card', `data-prediction="${p}"`)).join('') + '</div>';
      f.order.forEach((p, pos) => on('prediction-' + pos, () => predict(p)));
    } else if (f.phase === 'plan') {
      $('choices').innerHTML = '<div class="row">' + ['rice', 'sand', 'sticker'].map(k => btn('plan-' + k, k[0].toUpperCase() + k.slice(1), image(
        k), 'card')).join('') + '</div>';
      ['rice', 'sand', 'sticker'].forEach(k => on('plan-' + k, () => {
        f.material = k;
        for (const material of ['rice', 'sand', 'sticker']) {
          $('plan-' + material).setAttribute('aria-pressed', material === k);
        }
        if (pendingNext) {
          pendingNext.classList.remove('next-wait');
          pendingNext.removeAttribute('aria-busy');
          pendingNext = null;
        }
        // The choice responds now. Keep its pictures present for the whole plan
        // explanation, then make the chosen test available without stale speech.
        afterNarration($('plan-' + k), () => {
          if (state.mode !== 'find' || f.q !== 2 || f.phase !== 'plan') return;
          f.phase = 'test';
          updateFindControls();
          if (f.material === 'sticker') {
            strike('drum', false);
          } else {
            hint('t3');
            say('t3');
            showFindPanel();
            focusControl('finger');
          }
        });
      }));
    } else if (f.phase === 'test') {
      if (f.q === 4) {
        $('choices').innerHTML = (!f.gap ? btn('move-pan', 'Move the pan →', '↔ ') : '') + btn('test-bang', 'Bang', image('spoon'));
        on('move-pan', () => {
          afterNarration($('move-pan'), () => {
            f.gap = true;
            updateFindControls();
            hint('moved');
            say('moved');
            showFindPanel();
            focusControl('test-bang');
          });
        });
        on('test-bang', () => strike('pan', true));
      } else {
        $('choices').innerHTML = '<div class="choice-row">' + f.order.map((p, pos) =>
          btn('locked-' + pos, P[f.q][p], questionIcon(f.q, p === 0), 'card',
            `disabled aria-pressed="${p===f.prediction}"`)).join('') + '</div>';
      }
    } else if (f.phase === 'result') {
      $('choices').innerHTML = btn('next', 'Next →', '', 'action gold');
      on('next', () => {
        if (f.q === 4) {
          f.phase = 'claims';
          renderClaims();
          if (f.phase !== 'claims') return;
          hint('toSam');
          say('claims');
          how('toSam');
          focusControl('claims-sam');
        } else {
          preserve(() => enterQuestion(f.q + 1), 'prediction-0');
        }
      });
    }
  }

  function predict(p) {
    const f = state.find;
    if (f.phase !== 'predict') return;
    f.prediction = p;
    f.phase = f.q === 2 ? 'plan' : 'test';
    const key = f.q === 2 ? 't3plan' : f.q === 4 ? 't5plan' : 't' + (f.q + 1);
    hint(key);
    say(['pred-' + f.q + '-' + p, key]);
    updateFindControls();
    showFindPanel();
    const next = f.q === 2 ? 'plan-rice' : f.q === 4 ? 'move-pan' : f.q === 3 ? 'hum' : 'band-0';
    focusControl(next);
  }

  function completeFind() {
    const f = state.find;
    if (f.phase !== 'test') return;
    const focusId = document.activeElement?.id;
    const expected = f.q === 1 ? 1 : 0;
    f.pages[f.q] = {
      prediction: f.prediction,
      material: f.material,
      sticker: f.sticker,
      touchTrial: f.touchTrial
    };
    f.phase = 'result';
    const key = f.q === 2 ? 'r3' + f.material : 'r' + (f.q + 1);
    hint((L[key]) + ' Tap Next.');
    say([key, f.prediction === expected ? 'match' : 'surprise']);
    how('nextHow', {
      needs: '#next',
      valid: () => f.phase === 'result'
    });
    showFindPanel();
    renderBook();
    $('mic-wrap').hidden = f.q !== 3;
    if (focusId && document.activeElement === document.body) focusControl('next');
  }

  function renderClaims() {
    const f = state.find;
    const missing = f.pages.findIndex(page => !page);
    if (missing !== -1) {
      enterQuestion(missing);
      focusControl('prediction-0');
      return;
    }

    function evidence(i) {
      const p = f.pages[i];
      const apparatus = ['shoebox', 'pinch', 'drum', 'tube', 'bowl'][i];
      return `<div class="evidence"><b>${image(apparatus,'apparatus-memory')}${i+1}. ${['Band','Hold still','Drum','Hum','Pan + bowl'][i]}</b>
        <div class="pair"><span>We thought${questionIcon(i,p.prediction===0)}</span>
        <span>We saw${questionIcon(i,i!==1)}</span></div>
        ${p.material?`<small>We put on: ${p.material}${p.sticker?' · We tried: sticker':''}</small>`:''}
        ${p.touchTrial?"<small>Pan touching: we couldn't tell</small>":''}</div>`;
    }
    $('stage').innerHTML = image('bench', 'backdrop') + `<section class="claims"><h2>Our discoveries</h2><div class="claim-columns">
      <div class="claim-group"><h3>Shaking makes sound</h3>${[0,1,2].map(evidence).join('')}</div>
      <div class="claim-group"><h3>Sound makes things shake</h3>${[3,4].map(evidence).join('')}</div></div></section>`;
    $('choices').innerHTML = btn('claims-sam', 'Reach Sam →', '☎ ', 'action gold') + btn('claims-bench', 'Bench', '▤ ');
    on('claims-sam', () => setMode('sam'));
    on('claims-bench', () => setMode('bench'));
    $('mic-wrap').hidden = true;
    $('notebook-tag').hidden = true;
    $('eyebrow').textContent = 'OUR EVIDENCE';
  }

  function setMode(mode) {
    pendingNext = null;
    V.hush();
    silence();
    if (mode === 'sam' || mode === 'find' && (state.find.q !== 3 || state.find.phase !== 'test')) turnMicOff();
    if (state.mode === 'sam' && state.sam.beats) {
      clearTimeout(sendTimer);
      state.sam.beats = 0;
    }
    state.mode = mode;
    state.step = mode === 'sam' ? state.sam.step : 0;
    ['bench', 'find', 'sam'].forEach(m => $('m-' + m).setAttribute('aria-pressed', m === mode));
    $('panel').classList.remove('chart-panel');
    $('panel').classList.remove('build-panel');
    $('stage').classList.remove('secret-scene');
    if (mode === 'bench') {
      renderBench();
      V.welcome();
    }
    if (mode === 'find') {
      renderFind();
      const f = state.find;
      const k = f.phase === 'predict' ? 'q' + (f.q + 1) : f.phase === 'claims' ? 'toSam' : f.phase === 'result' ? 'nextHow' :
        f.phase === 'plan' ? 't3plan' : f.q === 4 ? 't5plan' : 't' + (f.q + 1);
      hint(k);
      say(k);
    }
    if (mode === 'sam') {
      renderSam();
      samHint(true);
    }
  }

  function samHint(speak = false) {
    const s = state.sam;
    let k = 'samWelcome';
    if (s.done) k = 'endHow';
    else if (s.step === 0) k = s.works ? 'nextHow' : s.part === 0 ? 'samWelcome' : s.part === 1 ? (s.cup === 'paper' ? 'cupPaper' : 'cupCan') :
      s.part === 2 ? 'poked' : s.part === 3 ? 'threaded' : s.distance < 12 ? 'tied' : 'tight';
    else if (s.step === 1) k = s.works ? 'nextHow' : s.fixed ? {
      sag: 'fixSag',
      pinch: 'fixPinch',
      knot: 'fixKnot'
    } [s.fault] : s.tested ? 'cantHear' : 'fixScene';
    else if (s.step === 2) k = Object.keys(s.chart).length === 6 ? 'chartFull' : 'chartHow';
    else if (s.step === 3) k = s.secretDone ? 'secretNext' : 'secretAsk';
    else if (s.step === 4) k = s.locked ? 'ask-' + s.sends[s.sent] : 'codeHow';
    hint(s.step === 2 && k === 'chartHow' ? 'chartShort' : k);
    if (speak) {
      if (k === 'samWelcome') V.welcome() || how(k);
      else if (k === 'chartHow' || k === 'codeHow') how(k);
      else say(k);
    }
  }

  function samStep(step) {
    silence();
    clearTimeout(sendTimer);
    state.sam.beats = 0;
    state.sam.step = step;
    state.step = step;
    state.sam.pose = 'wave';
    state.sam.signal = 0;
    if (step === 3) state.sam.way = null;
    state.sam.outcome = '';
    state.sam.neighbors = false;
    if (step === 1) newFault();
    renderSam();
    samHint(true);
    focusControl(step === 1 ? 'talk' : step === 2 ? 'place-yard' : step === 3 ? 'secret-whisper' : 'code-0-1');
  }

  function newFault() {
    const s = state.sam;
    s.fault = ['sag', 'pinch', 'knot'][Math.floor(Math.random() * 3)];
    s.tested = false;
    s.fixed = false;
    s.first = null;
    s.wiggle = false;
    s.wrongTargets = [];
    s.works = false;
    s.distance = s.fault === 'sag' ? 7 : 12;
    s.pose = 'puzzled';
    s.outcome = '';
  }

  function renderSam() {
    const s = state.sam;
    $('eyebrow').textContent = ['BUILD A CUP PHONE', 'FIND THE STOPPED SHAKE', 'WHERE CAN SAM HEAR?', 'TELL ONLY SAM', 'OUR DRUM CODE'][s.step];
    $('mic-wrap').hidden = true;
    $('notebook-tag').hidden = true;
    $('panel').classList.toggle('chart-panel', s.step === 2 || s.step === 3);
    $('panel').classList.toggle('build-panel', s.step === 0);
    $('stage').classList.toggle('secret-scene', s.step === 3);
    $('stage').innerHTML = `<div class="sam-world">${image(s.step===4||s.place==='park'&&s.step===2?'park':'yard','backdrop')}
      <div class="step-strip">${['☎ Build','⌕ Fix it','◖ Test','☷ Secret','● Code'].map((t,i) =>
        `<span class="${i===s.step?'current':i<s.step?'done':''}">${t}</span>`).join('')}</div>
      <div class="world-label" id="world-label"></div>
      <svg id="string-layer" viewBox="0 0 1000 650" preserveAspectRatio="none" aria-hidden="true"></svg>
      ${image('wave','sam-person','Sam')}${image('paper','sam-cup','Sam’s cup')}${image('ben','ben-person','Ben')}
      ${image(s.cup==='paper'?'handsPaper':'handsCan','our-cup','Our cup phone')}
      ${image('bigDrum','test-device','Our drum')}
      ${image('neighbors','neighbor-kids','Children next door')}
      ${btn('target-sam','Sam ↔','','world-target')}${btn('target-ben','Ben ☝','','world-target')}
      ${btn('target-knot','Sam’s knot',icon('knot'),'world-target')}
      <div class="outcome" id="outcome" aria-live="polite"></div><i class="idle-spark"></i></div>`;
    if (s.step === 0) {
      $('choices').innerHTML = '<div class="row">' + btn('cup-paper', 'Paper cup', image('paper')) + btn('cup-can', 'Tin can', image('can')) +
        '</div>' +
        '<div class="row">' + btn('part-pencil', 'Pencil', image('pencil')) + btn('part-string', 'String', icon('string')) + '</div>' +
        btn('part-knot', 'Knot', icon('knot')) + btn('step-back', 'Step back →', '↔ ') + btn('talk', 'Talk', '◉ ') + btn('next', 'Next →', '',
          'action gold', 'hidden');
      on('cup-paper', () => buildPart('paper'));
      on('cup-can', () => buildPart('can'));
      on('part-pencil', () => buildPart('pencil'));
      on('part-string', () => buildPart('string'));
      on('part-knot', () => buildPart('knot'));
      on('step-back', stepBack);
      on('talk', talk);
      on('next', () => samStep(1));
      on('target-sam', stepBack);
      bindSamDrag();
      updateBuild();
    } else if (s.step === 1) {
      $('choices').innerHTML = btn('talk', 'Talk', '◉ ') + btn('louder', 'Talk louder', '◖ ') +
        '<div class="fix-record" id="fix-record"></div>' + btn('next', 'Next →', '', 'action gold', 'hidden');
      on('talk', talk);
      on('louder', () => fix('louder'));
      on('target-sam', () => fix('sag'));
      on('target-ben', () => fix('pinch'));
      on('target-knot', () => fix('knot'));
      $('stage').querySelector('.sam-person').onclick = () => fix('sag');
      $('stage').querySelector('.ben-person').onclick = () => fix('pinch');
      on('next', () => {
        if (!s.works) return;
        s.scene++;
        if (s.scene === 3) {
          samStep(2);
          return;
        }
        newFault();
        updateSam();
        $('next').hidden = true;
        hint('fixScene');
        say('fixScene');
        focusControl('talk');
      });
    } else if (s.step === 2 || s.step === 3) {
      const chart =
        '<table class="chart" aria-label="Where can Sam hear us?"><thead><tr><th></th><th>◌<br>Whisper</th><th>☎<br>Cup phone</th><th>●<br>Drum</th></tr></thead><tbody>' +
        ['yard', 'park'].map(p => `<tr id="row-${p}"><th>${p==='yard'?'⌂ Yard':'♧ Park'}</th>` + ['whisper', 'phone', 'drum'].map(w =>
          `<td id="cell-${p}-${w}" aria-label="${p}, ${w}, not tested">?</td>`).join('') + '</tr>').join('') + '</tbody></table>';
      $('choices').innerHTML = chart;
      if (s.step === 2) {
        $('choices').insertAdjacentHTML('beforeend', '<div class="row chart-select">' + btn('place-yard', 'Yard', '⌂ ') + btn('place-park', 'Park',
            '♧ ') + '</div>' +
          '<div class="row chart-select">' + btn('test-whisper', 'Whisper', '◌ ') + btn('test-phone', 'Cup phone', image('paper')) + btn(
            'test-drum', 'Drum', image('bigDrum')) + '</div>' +
          btn('next', 'Next →', '', 'action gold', Object.keys(s.chart).length < 6 ? 'hidden' : ''));
        ['yard', 'park'].forEach(p => on('place-' + p, () => {
          s.place = p;
          s.pose = 'wave';
          s.way = null;
          s.signal = 0;
          s.neighbors = false;
          s.outcome = '';
          updateSam();
          hint('choosePlace');
          how('choosePlace');
        }));
        ['whisper', 'phone', 'drum'].forEach(w => on('test-' + w, () => chartTest(w)));
        on('next', () => {
          if (Object.keys(s.chart).length === 6) samStep(3);
        });
      } else {
        $('stage').insertAdjacentHTML('beforeend', '<div class="secret-choices">' +
          btn('secret-whisper', 'Whisper', '◌ ') + btn('secret-phone', 'Cup phone', image('paper')) +
          btn('secret-drum', 'Drum', image('bigDrum')) + '</div>');
        $('choices').insertAdjacentHTML('beforeend', btn('next', 'Next →', '', 'action gold', s.secretDone ? '' : 'hidden'));
        ['whisper', 'phone', 'drum'].forEach(w => on('secret-' + w, () => secret(w)));
        on('next', () => {
          if (s.secretDone) samStep(4);
        });
      }
    } else if (s.step === 4) renderCode();
    updateSam();
    if (s.done) renderSamEnd();
  }

  function buildPart(part) {
    const s = state.sam;
    const required = [
      ['paper', 'can'],
      ['pencil'],
      ['string'],
      ['knot']
    ][s.part];
    if (!required?.includes(part)) return;
    if (s.part === 0) s.cup = part;
    s.part++;
    s.pose = 'hear';
    s.outcome = '';
    const key = s.part === 1 ? (s.cup === 'paper' ? 'cupPaper' : 'cupCan') : s.part === 2 ? 'poked' : s.part === 3 ? 'threaded' : 'tied';
    hint(key);
    say(key, {now: true});
    updateBuild();
    updateSam();
    focusControl(['', 'part-pencil', 'part-string', 'part-knot', 'step-back'][s.part]);
  }

  function updateBuild() {
    const s = state.sam;
    ['cup-paper', 'cup-can', 'part-pencil', 'part-string', 'part-knot', 'step-back'].forEach((id, i) => {
      const e = $(id);
      if (!e) return;
      const part = i < 2 ? 0 : i - 1;
      e.disabled = part !== s.part && !(part === 4 && s.part >= 4);
      e.classList.toggle('gold', part === s.part);
    });
    $('next').hidden = !s.works;
  }

  function stepBack() {
    const s = state.sam;
    if (s.step !== 0 || s.part < 4) return;
    if (s.distance >= 12) {
      say('stepMax');
      return;
    }
    s.distance = Math.min(12, s.distance + 1);
    s.pose = 'walk';
    updateSam();
    if (s.distance === 12) {
      hint('tight');
      say('tight');
    }
    const distance = s.distance;
    setTimeout(() => {
      if (state.mode === 'sam' && s.step === 0 && s.distance === distance) {
        s.pose = 'hear';
        updateSam();
      }
    }, 800);
  }

  function bindSamDrag() {
    [$('target-sam'), $('stage').querySelector('.sam-person')].forEach(e => {
      let x = null,
        last = null;
      e.style.touchAction = 'none';
      e.onpointerdown = ev => {
        x = ev.clientX;
        last = ev.clientX;
        e.setPointerCapture(ev.pointerId);
      };
      e.onpointermove = ev => {
        if (x === null) return;
        const step = Math.max(8, $('stage').clientWidth * .035);
        if (ev.clientX - last > step) {
          stepBack();
          last = ev.clientX;
        }
      };
      e.onpointerup = e.onpointercancel = () => {
        x = null;
      };
    });
  }

  function talk() {
    const s = state.sam;
    s.signal = performance.now() + 1800;
    if (Curio.sound) Curio.tone(220, .18, .07);
    if (s.step === 0) {
      if (s.part < 4) {
        s.pose = 'puzzled';
        s.outcome = '✕ Not heard';
        const k = s.part === 3 ? 'talkLoose' : s.part === 0 ? 'samWelcome' : s.part === 1 ? (s.cup === 'paper' ? 'cupPaper' : 'cupCan') : 'poked';
        hint(k);
        if (k === 'samWelcome') how(k);
        else say(k);
      } else if (s.distance < 12) {
        s.pose = 'puzzled';
        s.outcome = '✕ Not heard';
        hint('talkSlack');
        say('talkSlack');
      } else {
        s.pose = 'hear';
        s.works = true;
        s.outcome = 'Only Sam hears!';
        hint('Tap Next.');
        say('heard');
        how('nextHow');
        $('next').hidden = false;
        setTimeout(() => {
          if (state.mode === 'sam' && s.step === 0 && s.works) {
            s.pose = 'cheer';
            updateSam();
          }
        }, 1400);
      }
    } else if (s.step === 1) {
      if (!s.fixed) {
        s.tested = true;
        s.pose = 'puzzled';
        s.outcome = '✕ Not heard';
        hint('cantHear');
        say('cantHear');
      } else {
        s.works = true;
        s.pose = 'hear';
        s.outcome = 'Sam heard you!';
        hint('Tap Next.');
        say('heardFix');
        if (!s.records[s.scene]) s.records[s.scene] = {
          fault: s.fault,
          found: s.first === s.fault
        };
        if (s.scene === 2) say('fixDone');
        $('next').hidden = false;
      }
    }
    updateSam();
  }

  function fix(target) {
    const s = state.sam;
    if (s.step !== 1 || !s.tested || s.fixed) return;
    Curio.tone(310, .04, .025, 'triangle');
    if (s.first === null) s.first = target;
    if (target === s.fault) {
      const apply = () => {
        if (state.mode !== 'sam' || s.step !== 1 || s.fixed) return;
        s.fixed = true;
        s.distance = 12;
        s.pose = 'hear';
        s.outcome = 'The string is free to shake.';
        const key = {sag: 'fixSag', pinch: 'fixPinch', knot: 'fixKnot'}[target];
        hint(key);
        say(key);
        updateSam();
      };
      const explaining = [L.fixScene, L.cantHear].includes(V.playing) ||
        V.queue.some(line => [L.fixScene, L.cantHear].includes(line.text));
      if (explaining && Curio.sound) {
        const id = {sag: 'target-sam', pinch: 'target-ben', knot: 'target-knot'}[target];
        afterNarration($(id), apply);
      } else apply();
    } else {
      s.wiggle = true;
      s.signal = performance.now() + 2500;
      s.pose = 'puzzled';
      s.outcome = "Sam's string showed us";
      if (target === 'louder' || !s.wrongTargets.includes(target)) {
        s.wrongTargets.push(target);
        say([target === 'louder' ? 'louder' : {
          sag: 'notSam',
          pinch: 'notBen',
          knot: 'notKnot'
        } [target], 'lookWiggle']);
      }
      hint('lookWiggle');
    }
    updateSam();
  }

  function chartTest(way) {
    const s = state.sam;
    if (s.step !== 2) return;
    s.way = way;
    s.chart[s.place + '-' + way] = true;
    s.neighbors = way === 'drum' && s.place === 'yard';
    const heard = way === 'drum' || way === 'phone' && s.place === 'yard';
    s.pose = heard ? 'hear' : 'puzzled';
    s.signal = performance.now() + 1800;
    s.outcome = way === 'phone' && s.place === 'park' ? 'String ends here. Too far!' : heard ? (s.neighbors ? 'Sam + next door hear!' :
      'Sam hears!') : '✕ Not heard';
    const key = {
      whisper: 'wh',
      phone: 'cup',
      drum: 'drum'
    } [way] + (s.place === 'yard' ? 'Yard' : 'Park');
    if (way === 'drum') playSound('drum', 1);
    else if (Curio.sound) Curio.tone(way === 'phone' ? 220 : 350, .12, .03);
    say(key, {now: true});
    hint('Tap another place or way.');
    updateSam();
    if (Object.keys(s.chart).length === 6) {
      hint('chartFull');
      say('chartFull');
      $('next').hidden = false;
    }
  }

  function secret(way) {
    const s = state.sam;
    if (s.step !== 3 || pendingNext) return;
    if (s.secret === null) s.secret = way;
    afterNarration($('secret-' + way), () => {
      if (state.mode !== 'sam' || s.step !== 3) return;
      s.way = way;
      s.neighbors = way === 'drum';
      s.pose = way === 'whisper' ? 'puzzled' : 'hear';
      s.signal = performance.now() + 1800;
      const key = way === 'phone' ? 'secretCup' : way === 'drum' ? 'secretDrum' : 'secretWhisper';
      s.outcome = way === 'phone' ? 'Only Sam heard the secret!' : way === 'drum' ? 'Everyone heard the secret!' : '✕ Sam did not hear';
      if (way === 'drum') playSound('drum', 1);
      say(key);
      hint(way === 'phone' ? 'secretNext' : key);
      if (way === 'phone') {
        s.secretDone = true;
        $('next').hidden = false;
      }
      updateSam();
    });
  }

  function renderCode() {
    const s = state.sam;
    $('stage').insertAdjacentHTML('beforeend', '<div class="code-card">' + messages.map((m, i) =>
      `<div class="message-code">${image(m)}<b>${['Lunch','Play','Home'][i]}</b><div class="dot-tiles">` + [1, 2, 3, 4].map(k => btn(
        `code-${i}-${k}`, '●'.repeat(k), '', '',
        `aria-label="${['Lunch','Play','Home'][i]}, ${countWords[k]} beats" aria-pressed="${s.code[i]===k}"`)).join('') +
      '</div></div>').join('') + '</div><div id="message-ask" hidden></div>' + btn('send-drum', '<span>Tap</span>', image('bigDrum'), '',
      'hidden'));
    $('choices').innerHTML = '<div class="beat-count" id="beat-count" aria-label="Your beats"></div>' + btn('next', 'Next →', '', 'action gold',
      'hidden');
    messages.forEach((m, i) => [1, 2, 3, 4].forEach(k => on(`code-${i}-${k}`, () => chooseCode(i, k))));
    on('send-drum', beat);
    on('next', renderSamEnd);
    updateCode();
  }

  function chooseCode(i, k) {
    const s = state.sam;
    if (s.locked || s.code[i] === k) return;
    s.code[i] = k;
    updateCode();
    if (s.code.every(Boolean)) {
      if (new Set(s.code).size !== 3) {
        hint('codeSame');
        say('codeSame');
      } else {
        s.sends = shuffle(messages);
        hint('ask-' + s.sends[0]);
        say(['codeReady', 'ask-' + s.sends[0]]);
        $('send-drum').hidden = false;
        $('message-ask').hidden = false;
        updateCode();
      }
    }
  }

  function updateCode() {
    const s = state.sam;
    messages.forEach((m, i) => [1, 2, 3, 4].forEach(k => {
      const b = $(`code-${i}-${k}`);
      if (!b) return;
      b.setAttribute('aria-pressed', s.code[i] === k);
      b.disabled = s.locked;
    }));
    const ready = s.code.every(Boolean) && new Set(s.code).size === 3 && s.sends.length === 3;
    if ($('send-drum')) $('send-drum').hidden = !ready || s.done;
    if ($('message-ask')) {
      $('message-ask').hidden = !ready || s.done;
      if (ready && !s.done) $('message-ask').innerHTML = image(s.sends[s.sent] || s.sends[0]) + ['Lunch', 'Play', 'Home'][messages.indexOf(s.sends[s
        .sent] || s.sends[0])];
    }
  }

  function beat() {
    const s = state.sam;
    if (s.step !== 4 || s.done || !s.code.every(Boolean) || new Set(s.code).size !== 3) return;
    s.locked = true;
    s.beats++;
    s.signal = performance.now() + 1000;
    playSound('drum', 1);
    $('beat-count').innerHTML = Array.from({
      length: Math.min(12, s.beats)
    }, () => '<i></i>').join('');
    $('beat-count').setAttribute('aria-label', s.beats + ' beats');
    updateCode();
    clearTimeout(sendTimer);
    sendTimer = setTimeout(finishSend, 1500);
  }

  function finishSend() {
    const s = state.sam;
    if (state.mode !== 'sam' || s.step !== 4 || s.done) return;
    const count = s.beats;
    s.beats = 0;
    const actual = s.code.indexOf(count),
      target = messages.indexOf(s.sends[s.sent]);
    if (actual < 0 || count > 4) {
      s.pose = 'shrug';
      s.outcome = 'That beat count is not in our code.';
      say(count <= 10 ? 'none-' + count : 'noneMany');
      hint('ask-' + s.sends[s.sent]);
    } else {
      s.pose = ['run', 'kick', 'walk'][actual];
      s.outcome = 'Sam ' + actions[actual] + '.';
      if (actual === target) {
        say(`right-${count}-${messages[actual]}`);
        s.sent++;
        if (s.sent === 3) {
          s.done = true;
          say('samEnd');
          hint('Tap Next.');
          $('next').hidden = false;
        } else {
          say('ask-' + s.sends[s.sent]);
          hint('ask-' + s.sends[s.sent]);
        }
      } else {
        say(`wrong-${count}-${messages[actual]}`);
        hint('ask-' + s.sends[s.sent]);
      }
    }
    updateSam();
    updateCode();
  }

  function renderSamEnd() {
    const s = state.sam;
    if (!s.done) return;
    const focusId = document.activeElement?.id;
    const found = s.records.filter(r => r.found).length;
    $('stage').querySelector('.code-card')?.setAttribute('hidden', '');
    $('outcome').hidden = true;
    $('stage').insertAdjacentHTML('beforeend', `<section class="end-card"><h2>Our sound reached Sam!</h2>
      <div class="end-pictures">${messages.map(m => image(m)).join('')}</div>
      <p>Three messages. Our own drum code.</p><p>${s.code.map((k,i) => ['Lunch','Play','Home'][i]+': '+'●'.repeat(k)).join(' · ')}</p>
      <p>We found ${found} ${found===1?'fix':'fixes'} on our first try.</p>
      <p>${s.secret==='phone'?'Our first secret choice kept it secret.':'We tested a new way to keep a secret.'}</p></section>`);
    $('choices').innerHTML = btn('end-bench', 'Bench', '▤ ', 'action gold') + btn('end-find', 'Find out', '⌕ ');
    on('end-bench', () => setMode('bench'));
    on('end-find', () => setMode('find'));
    hint('endHow');
    say('endHow');
    if (focusId === 'next') focusControl('end-bench');
  }

  function updateSam() {
    const s = state.sam;
    if (!$('string-layer')) return;
    const world = $('stage').querySelector('.sam-world');
    world.querySelector('.sam-cup').hidden = true;
    world.querySelector('.backdrop').src = A[s.step === 4 || s.step === 2 && s.place === 'park' ? 'park' : 'yard'];
    const sam = world.querySelector('.sam-person');
    sam.src = A[s.pose] || A.wave;
    const far = s.step === 4 || s.step === 2 && s.place === 'park';
    sam.style.height = far ? '25%' : '48%';
    sam.style.width = far ? '10%' : '18%';
    sam.style.pointerEvents = s.step === 1 || s.step === 0 && s.part >= 4 ? 'auto' : 'none';
    sam.style.cursor = s.step === 1 ? 'pointer' : 'grab';
    world.querySelector('.ben-person').style.pointerEvents = s.step === 1 ? 'auto' : 'none';
    world.querySelector('.ben-person').style.cursor = 'pointer';
    sam.style.left = s.step === 0 ? (42 + s.distance * 2.4) + '%' : s.step === 1 && s.fault === 'sag' && !s.fixed ? '57%' : '77%';
    sam.style.bottom = far ? '30%' : '16%';
    if (s.step === 4 && ['run', 'walk', 'kick'].includes(s.pose)) sam.style.left = s.pose === 'kick' ? '76%' : '86%';
    world.querySelector('.ben-person').hidden = s.step !== 1;
    world.querySelector('.ben-person').src = A[s.fault === 'pinch' && !s.fixed ? 'benPinch' : 'ben'];
    world.querySelector('.our-cup').hidden = s.step === 4 || s.step === 0 && s.part === 0 || (s.step === 2 || s.step === 3) && s.way !== 'phone';
    world.querySelector('.test-device').hidden = !((s.step === 2 || s.step === 3) && s.way === 'drum');
    world.querySelector('.our-cup').src = A[s.cup === 'paper' ? 'handsPaper' : 'handsCan'];
    world.querySelector('.neighbor-kids').hidden = !s.neighbors;
    $('target-sam').hidden = !(s.step === 1 || s.step === 0 && s.part >= 4);
    $('target-ben').hidden = s.step !== 1;
    $('target-knot').hidden = s.step !== 1;
    $('target-sam').style.left = s.step === 0 ? (42 + s.distance * 2.4) + '%' : s.fault === 'sag' && !s.fixed ? '57%' : '77%';
    $('target-knot').style.left = s.fault === 'sag' && !s.fixed ? '57%' : '77%';
    $('world-label').textContent = s.step === 0 ? 'Build it, then talk.' : s.step === 1 ? `Fix ${s.scene+1} of 3` :
      s.step === 2 ? (s.place === 'yard' ? 'Across the yard' : 'Across the park') : s.step === 3 ? 'A secret for Sam' : 'Across the park';
    $('world-label').hidden = s.step === 4;
    let hearing = null;
    if (s.outcome && s.step < 2) {
      if (s.works) hearing = true;
      else if (s.outcome === '✕ Not heard' || s.step === 1 && s.tested && !s.fixed) hearing = false;
    } else if (s.outcome && s.step === 2) {
      hearing = s.way === 'drum' || s.way === 'phone' && s.place === 'yard';
    } else if (s.outcome && s.step === 3) {
      hearing = s.way !== 'whisper';
    }
    $('outcome').innerHTML = s.outcome ? (hearing === null ? '' : icon('ear', hearing)) + s.outcome : '';
    if ($('fix-record')) $('fix-record').innerHTML = s.records.map((r, i) =>
        `<span>${i+1}. ${r.found?'We found it':"Sam's string showed us"}</span>`).join('') +
      (s.first !== null && !s.records[s.scene] ? `<span>${s.scene+1}. ${s.first===s.fault?'We found it':"Sam's string showed us"}</span>` : '');
    if (s.step === 2 || s.step === 3) {
      ['yard', 'park'].forEach(p => {
        $('row-' + p).classList.toggle('active-row', s.step === 2 && p === s.place);
        ['whisper', 'phone', 'drum'].forEach(w => {
          const cell = $(`cell-${p}-${w}`),
            done = s.chart[p + '-' + w];
          const heard = w === 'drum' || w === 'phone' && p === 'yard';
          cell.innerHTML = done ? (w === 'phone' && p === 'park' ? '⌁✕' : icon('ear', heard) + (w === 'drum' && p === 'yard' ? '⁺' : '')) :
            '?';
          cell.setAttribute('aria-label', p + ', ' + w + ', ' + (done ? (heard ? 'heard' : 'not heard') : 'not tested'));
        });
      });
      ['yard', 'park'].forEach(p => $('place-' + p)?.setAttribute('aria-pressed', p === s.place));
    }
    drawString(performance.now());
  }

  function drawString(t) {
    const s = state.sam,
      svg = $('string-layer');
    if (!svg) return;
    if (s.step === 4 || (s.step === 2 || s.step === 3) && s.way !== 'phone') {
      const loud = s.step === 4 || s.way === 'drum';
      svg.innerHTML = s.signal > t ? (loud ?
        '<g fill="none" stroke="#1d6f7a" stroke-width="6" opacity=".8"><path d="M260 360q90 80 0 160M360 300q160 140 0 280M500 260q210 180 0 360"/></g>' :
        '<path d="M180 460q25 30 0 60m20-75q40 45 0 90" fill="none" stroke="#1d6f7a" stroke-width="5"/>') : '';
      return;
    }
    if (s.step === 0 && s.part < 3) {
      svg.innerHTML = '';
      return;
    }
    const stageBox = svg.getBoundingClientRect();
    if (!stageBox.width || !stageBox.height) return;
    // Object-fit contain leaves real letterboxing in a tall window. Anchor to
    // the painted figure, including its bottom alignment, rather than to percentages.
    const painted = (selector, bottom = false) => {
      const img = $('stage').querySelector(selector);
      const box = img.getBoundingClientRect();
      const ratio = (img.naturalWidth || 1) / (img.naturalHeight || 1);
      const width = Math.min(box.width, box.height * ratio);
      const height = width / ratio;
      return {
        x: (box.left - stageBox.left + (box.width - width) / 2) * 1000 / stageBox.width,
        y: (box.top - stageBox.top + (box.height - height) * (bottom ? 1 : .5)) * 650 / stageBox.height,
        w: width * 1000 / stageBox.width,
        h: height * 650 / stageBox.height
      };
    };
    const ours = painted('.our-cup');
    const sam = painted('.sam-person', true);
    const ben = painted('.ben-person', true);
    const samCup = $('stage').querySelector('.sam-cup');
    const builtInCup = s.pose === 'hear';
    const cupX = sam.x + sam.w * (builtInCup ? .14 : s.pose === 'cheer' ? .07 : .17);
    const cupY = sam.y + sam.h * (builtInCup ? .20 : s.pose === 'cheer' ? .10 : .53);
    samCup.hidden = builtInCup;
    samCup.style.left = (cupX - sam.w * .09) / 10 + '%';
    samCup.style.top = (cupY - sam.h * .06) / 6.5 + '%';
    samCup.style.width = sam.w * .19 / 10 + '%';
    samCup.style.height = sam.h * .12 / 6.5 + '%';
    const x1 = ours.x + ours.w * .52;
    const y1 = ours.y + ours.h * .48;
    const x2 = cupX;
    const y2 = cupY;
    const slack = s.step === 0 && s.distance < 12 || s.step === 1 && s.fault === 'sag' && !s.fixed;
    const untied = s.step === 1 && s.fault === 'knot' && !s.fixed;
    const parkEnd = s.step === 2 && s.place === 'park';
    const endX = parkEnd ? 440 : x2;
    const endY = untied ? Math.min(585, sam.y + sam.h) : parkEnd ? 560 : y2;
    const pinch = s.step === 1 && s.fault === 'pinch' && !s.fixed;
    const handX = ben.x + ben.w * .70;
    const handY = ben.y + ben.h * .34;
    const bendY = Math.min(630, Math.max(y1, endY) + 140);
    const path = slack || untied ? `M${x1} ${y1}Q${(x1+endX)/2} ${bendY} ${endX} ${endY}` :
      pinch ? `M${x1} ${y1}L${handX} ${handY}L${endX} ${endY}` : `M${x1} ${y1}L${endX} ${endY}`;
    let content = `<path d="${path}" fill="none" stroke="#fff9e7" stroke-width="8"/>
      <path d="${path}" fill="none" stroke="#86502a" stroke-width="3"/>`;
    content += `<circle cx="${x1}" cy="${y1}" r="9" fill="#e3bc76" stroke="#5f351d" stroke-width="3"/>`;
    content += `<path d="M${x1-7} ${y1}q7-12 14 0q-7 12-14 0" fill="none" stroke="#5f351d" stroke-width="3"/>`;
    if (untied || parkEnd) {
      content += `<path d="M${endX} ${endY}q25 14 31 0q-2-11-16-6q-9 6 3 12m11-9 8 8m-6-12 11 4"
        fill="none" stroke="#86502a" stroke-width="3" stroke-linecap="round"/>`;
    } else {
      content += `<path d="M${endX-8} ${endY}q8-13 16 0q-8 13-16 0" fill="#e3bc76" stroke="#5f351d" stroke-width="3"/>`;
    }
    if (s.step === 0 && s.part === 3) content +=
      '<circle cx="170" cy="490" r="17" fill="none" stroke="#b23a2a" stroke-dasharray="5 4" stroke-width="3"/>';
    const fault = s.step === 1 && !s.fixed;
    const limit = fault ? (s.fault === 'pinch' ? .5 : s.fault === 'sag' ? .45 : 1) : 1;
    const point = progress => {
      if (pinch) {
        const p = Math.min(1, progress / .5);
        return {x: x1 + (handX - x1) * p, y: y1 + (handY - y1) * p};
      }
      return {
        x: x1 + (endX - x1) * progress,
        y: slack || untied ? (1 - progress) ** 2 * y1 +
          2 * (1 - progress) * progress * bendY + progress ** 2 * endY : y1 + (endY - y1) * progress
      };
    };
    if (s.signal > t) {
      const progress = Curio.reduce ? limit : Math.min(limit, ((t % 1800) / 1800) * 1.5);
      const {x, y} = point(progress);
      content += `<path d="M${x-20} ${y}q7-17 14 0t14 0t14 0" fill="none" stroke="#1d6f7a" stroke-width="7"/>`;
    }
    // A missed first attempt leaves inspectable evidence, including with Motion off.
    if (s.wiggle && fault) {
      const {x, y} = point(limit);
      content += `<circle cx="${x}" cy="${y}" r="27" fill="#fff8" stroke="#b23a2a" stroke-width="5"/>`;
      content += `<path d="M${x-17} ${y}q6-15 12 0t12 0" fill="none" stroke="#1d6f7a" stroke-width="5"/>`;
    }
    svg.dataset.endpoint = JSON.stringify({x: endX, y: endY, cupX, cupY, loose: untied || parkEnd});
    svg.innerHTML = content;
  }

  function drawAll(t) {
    document.querySelectorAll('canvas[data-kind]').forEach(canvas => {
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(1, Math.round(rect.width)),
        h = Math.max(1, Math.round(rect.height));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      const c = canvas.getContext('2d');
      c.clearRect(0, 0, w, h);
      const k = canvas.dataset.kind;

      function paintedBounds(selector) {
        const img = canvas.parentElement.querySelector(selector),
          r = img.getBoundingClientRect();
        const ratio = (img.naturalWidth || 1) / (img.naturalHeight || 1);
        const iw = Math.min(r.width, r.height * ratio),
          ih = iw / ratio;
        return {
          x: r.left - rect.left + (r.width - iw) / 2,
          y: r.top - rect.top + (r.height - ih) / 2,
          w: iw,
          h: ih
        };
      }
      let anchor = {
        x: w * .5,
        y: h * .4
      };
      const live = (active[k] > t || k === 'hum' && state.micLevel > .02) &&
        (state.mode === 'bench' || state.mode === 'find' && ['test', 'result'].includes(state.find.phase));
      const f = state.find;
      if (k === 'band') {
        const obj = canvas.parentElement.querySelector('.object');
        const ih = Math.min(h * .97, w * .8 * (obj.naturalHeight || 507) / (obj.naturalWidth || 520));
        const it = h * .01 + (h * .97 - ih) / 2;
        anchor = {
          x: w * .5,
          y: it + ih * .29
        };
        [0, 1, 2].forEach(i => {
          const x = w * .5 + (i - 1) * ih * .065,
            y0 = it + ih * .12,
            y1 = it + ih * .46;
          c.lineCap = 'round';
          if (live && i === state.lastBand) {
            c.strokeStyle = '#1d6f7a44';
            c.lineWidth = 6 * state.pull;
            c.beginPath();
            c.moveTo(x, y0);
            c.bezierCurveTo(x - 6 * state.pull, y0 + h * .3, x + 6 * state.pull, y1 - h * .3, x, y1);
            c.stroke();
          }
          c.strokeStyle = ['#f0ba4e', '#e09264', '#b07150'][i];
          c.lineWidth = 3 + i * 2;
          c.beginPath();
          c.moveTo(x, y0);
          const shake = live && i === state.lastBand ? (Curio.reduce ? 6 : Math.sin(t * .06) * 6) * state.pull : 0;
          c.bezierCurveTo(x + shake, y0 + h * .3, x - shake, y1 - h * .3, x, y1);
          c.stroke();
          c.strokeStyle = '#fff7b5';
          c.lineWidth = 1;
          c.stroke();
        });
      } else {
        const b = paintedBounds(k === 'pan' ? '.bowl' : '.object');
        const x = b.x + b.w * (k === 'hum' ? .77 : .5);
        const y = b.y + b.h * (k === 'hum' ? .045 : .16);
        const rx = b.w * (k === 'hum' ? .19 : .44);
        const ry = b.h * (k === 'hum' ? .045 : .10);
        anchor = {
          x: k === 'pan' ? w * .23 : x,
          y
        };
        c.fillStyle = k === 'drum' ? '#fff2d6' : '#e4f6f070';
        c.strokeStyle = '#c6aa72';
        c.lineWidth = 2;
        c.beginPath();
        c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();
        const material = state.mode === 'find' && f.q === 2 ? (f.material || (f.sticker ? 'sticker' : 'rice')) : 'rice';
        if (material === 'sticker' && k === 'drum') {
          c.fillStyle = '#efb12f';
          c.font = Math.max(15, h * .21) + 'px serif';
          c.fillText('★', x - 8, y + 8);
        } else {
          for (let i = 0; i < 19; i++) {
            const px = x + Math.sin(i * 7.3) * rx * .8,
              py = y + Math.cos(i * 4.1) * ry * .6;
            let jump = live ? (Curio.reduce ? .6 : Math.abs(Math.sin(t * .018 + i * 1.7))) * amplitudes[k] * Math.min(1, h / 230) : 0;
            c.save();
            c.translate(px, py - jump);
            c.rotate(i * 1.2);
            c.fillStyle = k === 'hum' ? ['#bd5272', '#e8bc32', '#2d8b87'][i % 3] : material === 'sand' ? '#bf8e36' : '#fff8e8';
            c.strokeStyle = k === 'hum' ? '#7e4747' : '#ad936b';
            c.lineWidth = .7;
            c.beginPath();
            c.ellipse(0, 0, material === 'sand' ? 1.3 : Math.max(2, w * .008), 1.4, 0, 0, Math.PI * 2);
            c.fill();
            c.stroke();
            c.restore();
          }
        }
        if (k === 'pan' && state.mode === 'find' && f.gap) {
          c.strokeStyle = '#1d6f7a';
          c.lineWidth = 2;
          c.setLineDash([5, 4]);
          c.strokeRect(w * .43, h * .48, w * .12, h * .34);
          c.setLineDash([]);
        }
      }
      if (live) {
        c.lineWidth = Math.max(2, w * .008);
        c.strokeStyle = '#1d6f7a';
        const cx = anchor.x,
          cy = anchor.y;
        for (let i = 0; i < 3; i++) {
          const r = w * (.14 + i * .065) + (Curio.reduce ? 0 : (t % 700) / 700 * w * .035);
          c.globalAlpha = 1 - i * .16;
          c.beginPath();
          c.arc(cx, cy, r, -.7, .7);
          c.stroke();
        }
        c.globalAlpha = 1;
      }
      $('station-' + k)?.classList.toggle('glow', live);
    });
  }

  function tick(t) {
    const dt = Math.min(60, t - lastTime);
    lastTime = t;
    if (state.mic && analyser) {
      analyser.getFloatTimeDomainData(micData);
      const rms = Math.sqrt(micData.reduce((a, b) => a + b * b, 0) / micData.length);
      state.micLevel += (rms - state.micLevel) * Math.min(1, dt / 100);
      if (!allowed('hum')) {
        state.micLevel = 0;
        micAbove = 0;
      } else {
        if (state.micLevel > .06) micAbove += dt;
        else micAbove = 0;
        if (state.mode === 'find' && state.find.q === 3 && micAbove >= 1000 && state.find.phase === 'test') completeFind();
        if (state.mode === 'bench' && state.micLevel > .06) {
          how('humHow');
          firstStation('hum');
        }
        amplitudes.hum = state.humHeld ? 14 : state.micLevel < .06 ? 2 : Math.min(20, 6 + (state.micLevel - .06) * 160);
      }
    }
    if (t - lastDraw >= 32) {
      drawAll(t);
      if (state.mode === 'sam') drawString(t);
      lastDraw = t;
    }
    requestAnimationFrame(tick);
  }
  let lastDraw = 0;
  Curio.init({
    clips: "voice:*",
    rate: .9
  });
  Curio.onSound(on => {
    if (!on)
      for (const k in sounding) stopSound(k);
  });
  Curio.onMotion(() => {
    drawAll(performance.now());
    if (state.mode === 'sam') updateSam();
  });
  ['bench', 'find', 'sam'].forEach(m => on('m-' + m, () => {
    if (state.mode !== m) setMode(m);
  }));
  on('mic', toggleMic);
  document.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (button?.matches('.action,.card,.world-target,.dot-tiles button') && !button.closest('.station') && !button.disabled) {
      Curio.tone(460, .035, .018, 'triangle');
    }
  });
  addEventListener('blur', stopHum);
  addEventListener('pagehide', () => {
    silence();
    turnMicOff();
  });
  window.__tool = {
    state,
    setMode,
    allLines: V.allLines,
    vlog: V.log,
    get vq() {
      return V.queue;
    }
  };
  renderBench();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
