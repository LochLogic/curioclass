<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savings Plan · Sequences and series · Curio Class</title>
<meta name="description" content="Race two savings plans day by day: a sequence of deposits and the series that is the balance. Watch a doubling penny lose for ten days and then win by millions, see the sum shortcuts derived with your own numbers, then run a savings-plan desk for a season of customers. Grade 11 Algebra 2. Works offline.">
<!--
Savings Plan (Curio Class)
Grade 11, Algebra 2, Sequences and Series: F-IF.A.3 (sequences are functions on the integers, defined recursively) and
A-SSE.B.4 (derive and use the finite geometric series formula); the arithmetic series appears as its partner.
Students drive, on their own laptops. Race: two deposit plans side by side, each shown as a sequence (what goes in) and
its partial sums (what you have), with lead changes, a ledger and the two sum shortcuts derived with the plan's own
numbers. Plan Desk: a season of 8 invented customers with goals, deadlines and limits; build a plan that works, or say
it can't be done.
Facts: OpenStax, Algebra and Trigonometry 2e, sections 13.2 to 13.4 (CC BY 4.0); Common Core State Standards for
Mathematics (F-IF.A.3, A-SSE.B.4). Every preset and customer number is computed by the ledger below (each deposit rounded
to the cent, half up; the balance is the sum of rounded deposits). No real prices, rates or people.
Chart, ledger, cards, locks and checks drawn in code. Art: desk-surface, penny-coin, vault-door (no people).
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<link rel="stylesheet" href="kit:theme-912">
<style>
:root{--brand:#2fa37a;--brand-ink:#04140d;--halo:#0b1017;--goal:#ffd166;--cap:#ff8a8a}
/* three layouts, picked in script (layout()):
   wide    (1200 px or wider and 700 px or taller): chart with a controls bar under it, panel on the right
           (Race: the two plan cards side by side; Desk: customer card left of the chart, builder in the panel);
   compact (a short landscape box such as the 16:10 embed at 680x425 to 1000x625): chart left, compact panel right,
           the main controls first;
   stack   (narrow or portrait): chart on top, the panel under it. */
main{grid-template-columns:minmax(0,1fr) 380px}
body.wide.race main{grid-template-columns:minmax(0,1fr) 540px}
body.wide.desk main{grid-template-columns:minmax(0,1fr) 400px}
.graphcol{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.toprow{display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-height:0}
body.wide.desk .toprow{grid-template-columns:270px minmax(0,1fr)}
.custwide{overflow:auto;padding:10px;min-width:0}
.custwide:empty,body:not(.wide) .custwide,body.race .custwide{display:none}
.stagewrap{position:relative;min-width:0;min-height:0;display:flex;flex:1}
.stagewrap .stage{flex:1;min-height:0}
body.season .custwide,body.season #bar{display:none}
body.wide.desk.season .toprow{grid-template-columns:minmax(0,1fr)}
.stage{background:radial-gradient(ellipse at 30% 20%,#122028,#0a0f17 70%)}
body.desk .graphcol{background:linear-gradient(rgba(9,13,19,.86),rgba(9,13,19,.9)),url(art:desk-surface) center/cover}
body.desk .stage{background:rgba(10,15,23,.55)}
.scene{width:720px;height:490px}
#sv{display:block;width:720px;height:490px;overflow:visible;touch-action:pan-y}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;padding:8px 12px 10px;background:var(--head-bg);border-top:1px solid var(--line);align-items:flex-end}
body:not(.wide) .controls{display:none}
body.desk .controls{background:rgba(16,22,31,.92)}
.ctl{display:flex;flex-direction:column;gap:3px;min-width:0}
.glab,.ctl>label{font-size:13px;font-weight:600;color:var(--muted)}
.grp{display:inline-flex;gap:0;flex-wrap:nowrap}
.grp .btn{border-radius:0;margin-left:-1px}
.grp .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.grp .btn:last-child{border-radius:0 8px 8px 0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slot{width:250px;max-width:100%}
.slot .gr-slider{grid-template-columns:minmax(0,1fr) 5.6em;gap:0 8px}
.slot .gr-slider label{font-size:13px;color:var(--muted)}
.slot input.num{width:5.6em;padding:0 6px}
.clampmsg{margin:2px 0 0;font-size:13px;color:var(--warn);min-height:0}
.clampmsg:empty{display:none}
/* panel */
.panel{gap:10px}
.panel .tip{margin-top:auto}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
body.wide .presets{grid-template-columns:repeat(4,minmax(0,1fr))}
.presets .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font-size:14px;line-height:1.15}
.presets img{width:24px;height:24px;flex:none}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
body.wide .cards,body.stack.two .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.card>h2{display:flex;align-items:center;gap:6px;margin:0!important}
.card .swatch{flex:none}
.nmrow{display:flex;gap:6px;align-items:center}
.nmrow label{font-size:13px;color:var(--muted);font-weight:600}
.nm{min-height:44px;width:100%;min-width:0;padding:0 8px;border-radius:8px;border:1px solid var(--btn-line);background:#0b1017;color:var(--ink);font:600 15px 'Segoe UI',system-ui,sans-serif}
.typegrp{display:grid;grid-template-columns:1fr 1fr}
.typegrp .btn{font-size:13px;line-height:1.15;padding:2px 6px;border-radius:0}
.typegrp .btn:first-child{border-radius:8px 0 0 8px}
.typegrp .btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.card .slot{width:100%}
.card .slot .gr-slider{grid-template-columns:minmax(0,1fr) 5em;gap:0 6px}
.card .slot input.num{width:5em;font-size:15px}
.card.sec{padding:8px 10px}
body.wide .presets .btn{white-space:nowrap;font-size:13.5px;padding:0 4px}
body.wide #bar #leadSec{flex:1 1 100%;padding:6px 10px}
body.wide #bar .lead p{display:inline;margin-right:10px}
body.wide #bar .grp .btn{padding:0 10px;font-size:14px}
.nmrow .ltr{font:800 16px 'Segoe UI',system-ui,sans-serif;min-width:.8em}
.ytl{fill:var(--gr-text);font-weight:600}
#cDays{width:170px}
#cDays .gr-slider{grid-template-columns:minmax(0,1fr) 3.6em}
#cDays input.num{width:3.6em}
.everyrow{display:flex;align-items:center;gap:8px}
.everyrow .glab{min-width:3.2em}
.rule{margin:0;font:13px/1.5 var(--readout-font);color:var(--ink)}
.rule .rl{color:var(--muted);font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px}
.rule sup,.steps sup,.fbox sup{font-size:.72em}
.rule sub,.steps sub,.fbox sub{font-size:.72em}
dl.readouts{font-size:13.5px}
dl.readouts dd{word-break:break-word}
.lead p{margin:0 0 3px;font:14px/1.45 'Segoe UI',system-ui,sans-serif}
.lead p.first{font-weight:700}
.lead .note{color:var(--goal);font-size:13.5px;margin-top:6px}
.lead .note:empty{display:none}
.small{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.35}
.small:empty{display:none}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--goal);margin-left:6px;vertical-align:middle}
.lock svg{width:12px;height:13px}
.btn.wide{padding:0 14px}
/* graph text: grows when the stage is scaled down (--ts from the stage scale) */
.gtitle{fill:var(--ink);font:700 calc(14px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif}
.rd{fill:var(--ink);font:calc(13px * var(--ts,1)) var(--readout-font)}
.rd .rn{font-weight:700}
.gl{font:600 calc(12.5px * var(--ts,1)) 'Segoe UI',system-ui,sans-serif;paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.gl.lead{fill:var(--goal)}
.gl.off{fill:var(--warn)}
.gl.goal{fill:var(--goal)}
.gl.cap{fill:var(--cap)}
.gl.over{fill:var(--cap)}
#sv .gr-tick{font-size:calc(12.5px * var(--ts,1))}
#sv .gr-axlabel{font-size:calc(13.5px * var(--ts,1))}
.bar{fill:var(--gr-1);stroke:var(--paper);stroke-width:1}
.bar.overcap{fill:url(#overHatch);stroke:var(--cap);stroke-width:1.5}
.bar.grow{transform-box:fill-box;transform-origin:50% 100%;animation:barup 110ms ease-out}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cursor-hit{fill:transparent;cursor:crosshair}
#cursorG:focus{outline:none}
/* drawers: over the stage (full screen in the stacked layout) */
.drawer{position:absolute;inset:8px;z-index:5;background:#0e141d;border:1px solid var(--btn-line);border-radius:12px;display:flex;flex-direction:column;min-height:0;box-shadow:0 10px 30px #0008}
body.stack .drawer{position:fixed;inset:0;border-radius:0;z-index:20}
body.compact .drawer{position:fixed;left:8px;right:8px;bottom:8px;top:calc(var(--hb,52px) + 6px);z-index:20}
body.compact table.ledger{font-size:13px}
body.stack table.ledger{font-size:11px;letter-spacing:-.2px}
body.stack table.ledger th,body.stack table.ledger td{padding:3px 3px}
body.stack .drawer .dbody{padding-left:6px;padding-right:6px}
body.stack table.ledger td.tag .tagb{padding:0 3px}
.dhead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhead h2{margin:0 auto 0 0;font:700 16px 'Segoe UI',system-ui,sans-serif}
.dbody{overflow:auto;padding:8px 10px;min-height:0;flex:1}
table.ledger{width:100%;font-size:13.5px}
table.ledger thead th{position:sticky;top:0;background:#1a2330;z-index:1}
table.ledger td.tag{text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
.tagb{display:inline-block;border:1px solid var(--goal);color:var(--goal);border-radius:6px;padding:0 6px;font-size:12.5px;font-weight:700}
table.ledger tr.chg td{background:rgba(255,209,102,.07)}
.ledger-note{margin:0 0 6px;font-size:13px;color:var(--muted)}
.steps{margin:0;padding-left:22px;font:15px/1.5 'Segoe UI',system-ui,sans-serif}
.steps li{margin:0 0 10px}
.steps li.in{animation:fadein 250ms ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.steps .num{display:block;font:14px/1.6 var(--readout-font);color:var(--muted);margin-top:2px}
.steps .val{display:block;font:700 15px/1.5 var(--readout-font);color:var(--brand);margin-top:2px}
.cancel{display:grid;grid-template-columns:auto repeat(6,auto);gap:2px 8px;font:14px/1.6 var(--readout-font);color:var(--ink);margin-top:4px;justify-content:start;overflow-x:auto}
.cancel .st{position:relative;color:var(--muted)}
.cancel .st::after{content:'';position:absolute;left:-2px;right:-2px;top:52%;border-top:2px solid var(--cap);transform-origin:left;animation:strike 250ms ease-out}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cancel .rsep{grid-column:1/-1;border-top:1px solid var(--line)}
.stepcount{font-size:13px;color:var(--muted)}
/* Plan Desk */
.deskbar{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:6px 12px;background:rgba(16,22,31,.92);border-bottom:1px solid var(--line)}
.deskbar .who{font:700 15px 'Segoe UI',system-ui,sans-serif}
.deskbar .cash{font:700 15px var(--readout-font);color:var(--brand)}
.deskbar .sum{font-size:13.5px;color:var(--muted);flex-basis:100%}
.slots{display:flex;gap:4px;flex-wrap:wrap}
.slots span{min-width:58px;height:26px;padding:0 4px;border:1px solid var(--line);border-radius:6px;font:600 11.5px/24px 'Segoe UI',system-ui,sans-serif;color:var(--muted);text-align:center;white-space:nowrap}
.slots span.now{border-color:var(--focus);color:var(--ink)}
.slots span.good{color:var(--ok);border-color:var(--ok)}
.slots span.bad{color:var(--warn);border-color:var(--warn)}
.cust .cname{display:flex;align-items:center;gap:8px;margin:0;font:700 18px 'Segoe UI',system-ui,sans-serif}
.cust .cname img{width:34px;height:34px}
.cust .cfor{color:var(--muted);font:400 14px 'Segoe UI',system-ui,sans-serif}
.cust .cname{margin-bottom:6px!important}
.cust blockquote{margin:0 0 8px;padding:6px 10px;border-left:3px solid var(--brand);font:italic 15px/1.4 'Segoe UI',system-ui,sans-serif;color:var(--ink);background:#111821;border-radius:0 8px 8px 0}
.cust dl.readouts{font-size:14px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
body.wide .checks{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:4px;font-size:14px;line-height:1.35}
.checks .ic{font-weight:800;text-align:center}
.checks li.yes .ic{color:var(--ok)}
.checks li.no .ic{color:var(--warn)}
.checks .cw{font-weight:700}
.checks li.yes .cw{color:var(--ok)}
.checks li.no .cw{color:var(--warn)}
body.wide #checksSec{flex:1;min-width:0;background:transparent;border:0;padding:0}
.result{margin:0;font:15px/1.45 'Segoe UI',system-ui,sans-serif}
.result.good{color:var(--ok)}
.result.bad{color:var(--warn)}
.result+.result{margin-top:4px}
.confirm{border:1px solid var(--goal);border-radius:8px;padding:8px;margin-top:8px}
.confirm p{margin:0 0 6px;font-weight:700}
.fbox{font:15px/1.6 var(--readout-font)}
.fbox .q{display:inline-block;border:2px solid var(--goal);color:var(--goal);border-radius:4px;padding:0 5px;line-height:1.2;font-weight:700}
.fbox p{margin:0 0 4px}
.big-btn{font-size:16px}
.deskbtns{display:flex;flex-wrap:wrap;gap:6px}
.deskbtns .btn{flex:1 1 auto}
.summary .vault{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:8px;opacity:.9}
.summary table{width:100%;margin-top:8px;font-size:13.5px}
.summary td,.summary th{text-align:left!important;vertical-align:top}
.summary .tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:8px}
.summary .tot div{background:var(--sec-bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted)}
.summary .tot b{display:block;font:700 18px var(--readout-font);color:var(--ink)}
.summary .end{margin:10px 0 0;font-weight:700}
/* compact */
.cardtabs{display:none}
body.compact .cardtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
body.compact .cardtabs .btn{display:flex;align-items:center;gap:4px;padding:0 6px;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
body.compact .cardtabs .btn span{overflow:hidden;text-overflow:ellipsis}
body.compact .cardtabs .swatch{width:26px}
body.compact .cards .card:not(.on){display:none}
body.compact .card .nmrow{order:9}
body.compact .card .nmrow .swatch,body.compact .card .nmrow .ltr{display:none}
body.compact .card dl.readouts,body.compact .rule .rl,body.compact .rule .rl+br{display:none}
body.compact .card .slot .gr-slider{grid-template-columns:4.3em minmax(0,1fr) 4.8em;gap:0 6px}
body.compact .card .slot .gr-slider label{grid-column:auto;font-size:12px;line-height:1.15;color:var(--muted)}
body.compact .card .slot input.num{width:4.8em;font-size:14px;padding:0 5px}
body.compact .card.sec{padding:6px 8px;gap:5px}
body.compact .typegrp .btn{font-size:12.5px}
body.compact .cust .cname{font-size:16px}
body.compact .cust .cname img{width:26px;height:26px}
body.compact .cust .cfor{font-size:13px}
body.compact .cust blockquote{font-size:13.5px;padding:4px 8px;margin:4px 0 6px}
body.compact .cust dl.readouts{gap:1px 10px;font-size:13px}
body.compact .deskbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
body.compact .deskbtns #runBtn,body.compact .deskbtns #nextBtn{grid-column:1/-1;min-height:46px;order:-1}
body.compact .deskbtns .btn{padding:0 6px;font-size:13.5px}
body.compact main{grid-template-columns:minmax(0,1fr) 300px}
body.compact.race main,body.compact.desk main{grid-template-columns:minmax(0,1fr) 300px}
@media (min-width:980px){body.compact.race main,body.compact.desk main{grid-template-columns:minmax(0,1fr) 340px}}

body.compact h1{font-size:16px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}

body.stack .panel{border-left:0;border-top:1px solid var(--line)}

</style>

<body class="race">
<header>
  <h1>Savings Plan <small>Sequences and series, Curio Class</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-race" aria-pressed="true">Race</button>
    <button id="m-desk" aria-pressed="false">Plan Desk</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <div class="graphcol" id="graphcol">
    <div class="deskbar" id="deskbar" data-mode="desk" hidden>
      <span class="who" id="dbWho">Customer 1 of 8</span>
      <span class="cash" id="dbCash" aria-live="polite">Desk cash: $0</span>
      <div class="slots" id="slots" role="list" aria-label="Season so far"></div>
      <span class="sum" id="dbSum"></span>
    </div>
    <div class="toprow" id="toprow">
      <div class="custwide" id="custWide"></div>
      <div class="stagewrap" id="stagewrap">
        <div class="stage" id="stage">
          <div class="scene" id="scene">
            <svg id="sv" viewBox="0 0 720 490" role="group" aria-label="Chart">
              <defs>
                <pattern id="overHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <rect width="6" height="6" fill="rgba(255,138,138,.35)"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ff8a8a" stroke-width="2"/>
                </pattern>
              </defs>
              <g id="gRace">
                <text class="rd" id="rdDay" x="16" y="18"></text>
                <g id="rdA"></g><g id="rdB"></g>
                <text class="gtitle ytl" id="yTitle" x="94" y="84" text-anchor="end">dollars</text>
                <g id="gPlaneR"></g>
              </g>
              <g id="gDesk" style="display:none">
                <text class="gtitle" id="dTitle1" x="16" y="20">Balance (what you have)</text>
                <g id="gPlaneD1"></g>
                <text class="gtitle" id="dTitle2" x="16" y="314">Each deposit (what goes in)</text>
                <g id="gPlaneD2"></g>
              </g>
            </svg>
          </div>
        </div>
        <section class="drawer" id="ledger" role="dialog" aria-modal="false" aria-labelledby="ledgerH" hidden>
          <div class="dhead"><h2 id="ledgerH">Ledger</h2><button class="btn" id="ledgerClose">Close ledger</button></div>
          <div class="dbody" style="padding-top:0">
            <p class="ledger-note" id="ledgerNote" style="margin-top:8px"></p>
            <table class="inst ledger" id="ledgerTable"></table>
          </div>
        </section>
        <section class="drawer" id="shortcut" role="dialog" aria-modal="false" aria-labelledby="scH" hidden>
          <div class="dhead"><h2 id="scH">Shortcut</h2><span class="stepcount" id="scCount"></span></div>
          <div class="dbody"><ol class="steps" id="scSteps" aria-live="polite"></ol></div>
          <div class="dhead" style="border-top:1px solid var(--line);border-bottom:0">
            <button class="btn" id="scBack">◀ Back</button><button class="btn" id="scNext">Next step ▶</button><button class="btn" id="scClose">Close</button>
          </div>

<script src="kit:curio"></script>
<script src="kit:graphing"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const {say, wait} = Curio;
  const fmt = Plane.fmt;
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);

  // ---------- spoken lines (voice/lines.json lists every one) ----------
  const L = {
    'race-welcome': 'Two saving plans, one race. Change either plan and watch who pulls ahead, and when.',
    'race-penny': 'The doubling penny starts with one cent. Watch day eleven, then look at what day thirty asks you to put in.',
    'shortcut-multiply': 'Here is the shortcut for a multiply plan. Write the sum, multiply it by the ratio, and subtract. Almost everything cancels.',
    'shortcut-add': 'Here is the shortcut for an add plan. Write the sum forward and backward, then add the two rows. Every column is the same.',
    'desk-welcome': "Welcome to the Plan Desk. Each customer brings a goal, a deadline and a limit. Build a plan that works, or say it can't be done.",
    'cust-ana': 'Ana needs three hundred dollars for a bike in twenty weeks, never more than twenty five dollars a week. Any plan is fine.',
    'cust-ben': 'Ben adds one dollar more every week. He needs five hundred dollars in twenty six weeks. Pick his first deposit.',
    'cust-cam': "Cam's deposits grow ten percent every week. He needs four hundred dollars in twelve weeks. Pick his first deposit.",
    'cust-dee': 'Dee starts with five dollars and adds the same raise every week. She needs four hundred dollars in sixteen weeks.',
    'cust-eli': 'Eli wants to double every day for ten days and reach one hundred dollars, never more than sixty dollars in a day.',
    'cust-fay': "Fay's deposits shrink to eighty percent of the last one each week. She needs three hundred dollars in ten weeks.",
    'cust-gus': 'Gus can start with five dollars at most and never go over forty five a week. He needs nine hundred fifty dollars in forty weeks.',
    'cust-ivy': 'Ivy needs two thousand dollars in twenty weeks. She can start with twenty dollars and never go over one hundred fifty a week.',
    'desk-end': "That's the season. Look back at each plan, and at the one that could never work.",
  };

  // ======================================================================================
  // SAVINGS LEDGER (tool-only block: deposit sequences, partial sums, money words, sum formulas).
  // Money is kept in whole cents as BigInt, so every deposit rounds to the cent (half up) exactly and the balance
  // is the exact sum of the rounded deposits, at any size. A plan: {type: 'add' | 'mul', first (cents), add (cents),
  // times (hundredths: 110 means times 1.10), every (1 day or 7 days)}. Deposit k (k = 1, 2, ...) lands on day
  // every x (k - 1) + 1.
  // ======================================================================================
  const B = BigInt;
  const rhu = (num, den) => { // num / den rounded half up (den > 0); negative num rounds toward the nearer cent too
    if (num < 0n) return -rhu(-num, den);
    return (2n * num + den) / (2n * den);
  };
  // the first n deposits of a plan, in cents
  function depositList(p, n) {
    const out = [];
    if (p.type === 'add') { const a = B(p.first), d = B(p.add); for (let k = 0; k < n; k++) out.push(a + B(k) * d); return out; }
    const R = B(p.times);
    if (p.times === 100) { for (let k = 0; k < n; k++) out.push(B(p.first)); return out; }
    let num = B(p.first), den = 1n;
    for (let k = 0; k < n; k++) {
      const v = rhu(num, den); out.push(v);
      if (R < 100n && v === 0n) { for (let j = k + 1; j < n; j++) out.push(0n); break; }   // a shrinking plan that has reached 0 stays 0
      num *= R; den *= 100n;
    }
    return out;
  }
  // a plan over a horizon of D days: days, deposits, balances (BigInt cents) and the same as Numbers (dollars)
  function runPlan(p, D) {
    const days = []; for (let d = 1; d <= D; d += p.every) days.push(d);
    const dep = depositList(p, days.length), bal = []; let s = 0n;
    for (const v of dep) { s += v; bal.push(s); }
    return {p, days, dep, bal, n: days.length, depN: dep.map(v => Number(v) / 100), balN: bal.map(v => Number(v) / 100),
      total: s, last: dep[dep.length - 1] || 0n};
  }
  // the sum shortcut, exact, rounded to the cent: add S = n(a_1 + a_n) / 2; multiply S = a(1 - r^n) / (1 - r)
  function formulaCents(p, n) {
    if (p.type === 'add') { const a1 = B(p.first), an = a1 + B(n - 1) * B(p.add); return rhu(B(n) * (a1 + an), 2n); }
    if (p.times === 100) return B(n) * B(p.first);
    const R = B(p.times), H = 100n ** B(n);
    let num = B(p.first) * (R ** B(n) - H), den = (R - 100n) * (100n ** B(n - 1));
    if (den < 0n) { num = -num; den = -den; }
    return rhu(num, den);
  }
  // for a shrinking multiply plan: the most it can ever reach (the exact limit a / (1 - r), or the rounded ledger if higher)
  function shrinkLimit(p) {
    const exact = rhu(B(p.first) * 100n, B(100 - p.times));
    let s = 0n; for (const v of depositList(p, 4000)) { if (v === 0n) break; s += v; }
    return s > exact ? s : exact;
  }

  // ---------- money and number words ----------
  const commas = s => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const supNum = e => String(e).split('').map(c => c === '-' ? '⁻' : SUPS[+c]).join('');
  const TRILLION_C = 100000000000000n;   // $1 trillion in cents
  function sciText(v) { let [m, e] = v.toExponential(2).split('e'); return `$${m} × 10${supNum(+e)}`; }
  // cents (BigInt) as money: "$1,234.50"; above $1 trillion, "$1.07 × 10¹³" (three significant figures)
  function money(c) {
    c = B(c);
    if (c > TRILLION_C) return sciText(Number(c) / 100);
    const neg = c < 0n; if (neg) c = -c;
    const s = c.toString().padStart(3, '0');
    return (neg ? '−' : '') + '$' + commas(s.slice(0, -2)) + '.' + s.slice(-2);
  }
  // whole dollars without cents ("$300", "$1,700"), for goals, caps and limits
  const moneyShort = c => { c = B(c); return c % 100n === 0n && c <= TRILLION_C ? '$' + commas((c / 100n).toString()) : money(c); };
  // a number inside a formula: whole cents without decimals ("10", "0.01", "6.74")
  const fnum = c => { c = B(c); if (c > TRILLION_C) return sciText(Number(c) / 100).slice(1); const s = c.toString().padStart(3, '0'); return c % 100n === 0n ? commas(s.slice(0, -2)) : commas(s.slice(0, -2)) + '.' + s.slice(-2); };
  const rnum = t => String(+(t / 100).toFixed(2));   // a ratio inside a formula: 2, 1.1, 0.5
  const rfix = t => (t / 100).toFixed(2);              // a ratio in words, as the slider shows it: 2.00, 1.10, 0.80
  const say$ = t => t.replace(/\$(\d[\d.]*) × 10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g, (m, a, e) => `${a} times 10 to the ${e.split('').map(ch => ch === '⁻' ? 'minus ' : SUPS.indexOf(ch)).join('')} dollars`).replace(/−/g, 'minus ');
  // superscript exponents as real superscripts: HTML <sup>, and raised tspans in SVG (the readout font has no superscript 0)
  const SUPRE = /10([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g;
  const unsup = e => e.split('').map(ch => ch === '⁻' ? '−' : SUPS.indexOf(ch)).join('');
  const sups = html => String(html).replace(SUPRE, (m, e) => `10<sup>${unsup(e)}</sup>`);
  function svgText(parent, text, attrs = {}) {   // a tspan run, with any exponent raised
    let last = 0, m, up = false; SUPRE.lastIndex = 0;
    const add = (t, a) => { if (t) mk('tspan', a, parent).textContent = t; };
    while ((m = SUPRE.exec(text))) {
      add(text.slice(last, m.index) + '10', Object.assign({}, attrs, up ? {dy: '.3em'} : {}));
      add(unsup(m[1]), {dy: '-.42em', 'font-size': '72%'}); up = true;
      last = m.index + m[0].length;
    }
    add(text.slice(last) || (up ? ' ' : ''), Object.assign({}, attrs, up ? {dy: '.3em'} : {}));
  }
  // numbers on the chart axes
  function tickMoney(v) {
    if (Math.abs(v) < 1e-9) return '$0';
    if (v > 1e12) return sciText(v);
    if (v >= 1e9) return '$' + fmt(v / 1e9, 2) + ' billion';
    if (v >= 1e6) return '$' + fmt(v / 1e6, 2) + ' million';
    if (v >= 1000) return '$' + commas(Math.round(v));
    return '$' + (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(2));
  }
  function logTick(e) {   // a power of ten as money: "$0.01", "$1", "$10,000", "$10¹²"
    if (e < 0) return '$' + Math.pow(10, e).toFixed(Math.max(2, -e));
    if (e < 12) return '$' + commas('1' + '0'.repeat(e));
    return '$10' + supNum(e);
  }
  // input parsing: "$1,000.50", "6.74", ".5"
  function parseNum(text) {
    const s = String(text).trim().replace(/[$,\s]/g, '');
    if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return null;
    const v = Number(s); return isFinite(v) ? v : null;
  }
  const centsOf = v => Math.round(v * 100 + 1e-7);   // dollars typed or slid, to whole cents (half up)

  // rule text, both forms (HTML)
  function ruleHTML(p) {
    if (p.type === 'add') {
      const a = fnum(p.first), d = fnum(p.add);
      return [`a<sub>n</sub> = ${a} + (n − 1) × ${d}`, `a<sub>1</sub> = ${a}, a<sub>n</sub> = a<sub>n−1</sub> + ${d}`];
    }
    const a = fnum(p.first), r = rnum(p.times);
    return [`a<sub>n</sub> = ${a} × ${r}<sup>n − 1</sup>`, `a<sub>1</sub> = ${a}, a<sub>n</sub> = ${r} × a<sub>n−1</sub>`];
  }
  function ruleSay(p) {
    if (p.type === 'add') return `a n equals ${fnum(p.first)} plus n minus 1 times ${fnum(p.add)}`;
    return `a n equals ${fnum(p.first)} times ${rnum(p.times)} to the n minus 1`;
  }

  // ======================================================================================
  // State
  // ======================================================================================
  const PRESETS = [
    {label: 'Penny vs ten', days: 30, A: {name: 'Ten a week', type: 'add', first: 1000, add: 0, every: 7},
      B: {name: 'Doubling penny', type: 'mul', first: 1, times: 200, every: 1}},
    {label: 'Climb vs steady', days: 280, A: {name: 'Steady twenty', type: 'add', first: 2000, add: 0, every: 7},
      B: {name: 'Add a dollar', type: 'add', first: 100, add: 100, every: 7}},
    {label: 'Raise vs steady', days: 200, A: {name: 'Steady twenty', type: 'add', first: 2000, add: 0, every: 7},
      B: {name: 'Ten percent raise', type: 'mul', first: 500, times: 110, every: 7}},
    {label: 'Halving vs steady', days: 70, A: {name: 'Steady twenty', type: 'add', first: 2000, add: 0, every: 7},
      B: {name: 'Halving', type: 'mul', first: 6400, times: 50, every: 7}},
  ];
  const freshPlan = o => ({name: o.name, type: o.type, first: o.first, add: o.type === 'add' ? o.add : 0, times: o.type === 'mul' ? o.times : 100,
    every: o.every, mem: {add: o.type === 'add' ? o.add : null, mul: o.type === 'mul' ? o.times : null}});
  const state = {mode: 'race', tab: 'A', preset: 0, A: null, B: null, days: 30, view: 'have', fit: 'both', cursor: null,
    ledgerOpen: false, sc: null};
  const LIM = {first: [1, 100000], add: [0, 10000], times: [50, 300]};

  // ======================================================================================
  // RACE: the chart
  // ======================================================================================
  const niceNear = x => { if (!(x > 0)) return 1; const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e); return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * Math.pow(10, e); };
  const mant = s => Math.round(s / Math.pow(10, Math.floor(Math.log10(s) + 1e-9)));
  const isLog = () => state.fit === 'log';
  const labX = (lo, hi) => Math.max(1, niceNear((hi - lo) / 7));
  const gridX = (lo, hi) => { const l = labX(lo, hi); return l < 2 ? 1 : l / (mant(l) === 5 ? 5 : 2); };
  const logStep = (lo, hi) => { const r = hi - lo; return r <= 7 ? 1 : r <= 16 ? 2 : Math.max(2, niceNear(r / 7)); };
  const labY = (lo, hi) => isLog() ? logStep(lo, hi) : niceNear((hi - lo) / 5);
  const gridY = (lo, hi) => { if (isLog()) return hi - lo <= 40 ? 1 : logStep(lo, hi); const l = labY(lo, hi); return l / (mant(l) === 5 ? 5 : 2); };
  // two chart shapes: wide (720 x 490, for wide stages) and tall (560 x 540, for the near-square stage of the 16:10 embed and
  // of phones), so chart text stays about 10 px or more on screen; the planes are rebuilt when the shape changes
  const GEO = {
    wide: {w: 720, h: 490, names: true, rd: [18, 39, 60], ytl: [94, 84], RP: {left: 104, top: 94, W: 590, H: 340},
      D1: {left: 104, top: 36, W: 590, H: 236}, D2: {left: 104, top: 326, W: 590, H: 112}, t2: 314},
    tall: {w: 560, h: 540, names: false, rd: [18, 39, 60], ytl: [90, 84], RP: {left: 100, top: 94, W: 440, H: 386},
      D1: {left: 100, top: 36, W: 440, H: 286}, D2: {left: 100, top: 374, W: 440, H: 112}, t2: 362},
  };
  let geo = GEO.wide, RP = geo.RP, g = null, plotG, markG, labG;
  const curG = mk('g', {id: 'cursorG', tabindex: 0, role: 'slider', 'aria-label': 'Chart cursor. Left and Right arrows step from deposit to deposit.'});
  const curHit = mk('rect', {class: 'cursor-hit', x: 0, y: 0}, curG);
  const curFocus = mk('rect', {x: -3, y: -3, fill: 'none', stroke: 'var(--focus)', 'stroke-width': 3, rx: 4, visibility: 'hidden'}, curG);
  const curLine = mk('line', {stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-dasharray': '3 4', opacity: .6, y1: 0, 'pointer-events': 'none'}, curG);
  const curDots = mk('g', {'pointer-events': 'none'}, curG);
  function makeRacePlane() {
    const keep = g ? g.range : null;
    $('gPlaneR').textContent = '';
    g = Plane($('gPlaneR'), {x: [0, 30], y: [0, 100], width: RP.W, height: RP.H, left: RP.left, top: RP.top, grid: [gridX, gridY], labels: [labX, labY],
      ticks: 'edge', xLabel: 'day',
      tickFormat: (v, axis) => axis === 'x' ? commas(Math.round(v)) : isLog() ? (Math.abs(v - Math.round(v)) < 1e-6 ? logTick(Math.round(v)) : null) : tickMoney(v)});
    plotG = mk('g', {}, g.layer('plot'));
    markG = mk('g', {}, g.layer('front'));
    labG = mk('g', {}, g.layer('labels'));
    g.layer('labels').appendChild(curG);
    for (const [el, pad] of [[curHit, 0], [curFocus, 6]]) { el.setAttribute('width', RP.W + pad); el.setAttribute('height', RP.H + pad); }
    curLine.setAttribute('y2', RP.H);
    $('rdDay').setAttribute('y', geo.rd[0]);
    $('yTitle').setAttribute('x', geo.ytl[0]); $('yTitle').setAttribute('y', geo.ytl[1]);
    g.onView(drawRace);
    if (keep) g.view(keep.x, keep.y, {ms: 0});
  }
  const clampPx = v => Math.max(-1e5, Math.min(1e5, v));
  const P = (x, y) => { const [u, v] = g.px(x, y); return [clampPx(u), clampPx(v)]; };
  const yOf = v => isLog() ? (v > 0 ? Math.log10(v) : null) : v;
  const dotD = (u, v, r, shape) => shape === 'sq' ?
    `M${(u).toFixed(1)},${(v - r * 1.35).toFixed(1)}l${(r * 1.35).toFixed(1)},${(r * 1.35).toFixed(1)}l${(-r * 1.35).toFixed(1)},${(r * 1.35).toFixed(1)}l${(-r * 1.35).toFixed(1)},${(-r * 1.35).toFixed(1)}z` :
    `M${(u - r).toFixed(1)},${v.toFixed(1)}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0z`;
  let R = null;   // the current race: {A, B, rows, changes, D}

  function computeRace() {
    const D = state.days, a = runPlan(state.A, D), b = runPlan(state.B, D);
    const rows = []; let ia = 0, ib = 0, lead = null; const changes = [];
    let balA = 0n, balB = 0n;
    for (let d = 1; d <= D; d++) {
      let da = null, db = null;
      if (ia < a.n && a.days[ia] === d) { da = a.dep[ia]; balA = a.bal[ia]; ia++; }
      if (ib < b.n && b.days[ib] === d) { db = b.dep[ib]; balB = b.bal[ib]; ib++; }
      if (da == null && db == null) continue;
      const L2 = balA > balB ? 'A' : balB > balA ? 'B' : 'T';
      const row = {day: d, da, db, balA, balB, lead: L2, change: false, first: lead == null};
      if (lead != null && L2 !== lead) { row.change = true; changes.push(row); }
      lead = L2; rows.push(row);
    }
    R = {A: a, B: b, rows, changes, D, start: rows.length ? rows[0].lead : 'T'};
    return R;
  }
  // the lead readout: lines of text
  function leadLines() {
    const {rows, changes, start} = R;
    if (!rows.length) return ['No deposits yet.'];
    if (!changes.length) return [start === 'T' ? 'Tied the whole way.' : `${start} leads the whole way.`];
    const out = [start === 'T' ? 'Tied on day 1.' : `${start} leads from day 1.`];
    for (const c of changes.slice(0, 4)) {
      if (c.lead === 'T') out.push(`Tied on day ${c.day} at ${money(c.balA)}.`);
      else { const hi = c.lead === 'A' ? c.balA : c.balB, lo = c.lead === 'A' ? c.balB : c.balA; out.push(`${c.lead} takes the lead on day ${c.day} (${money(hi)} to ${money(lo)}).`); }
    }
    if (changes.length > 4) out.push(`and ${changes.length - 4} more.`);
    return out;
  }
  function leadNote() {
    const notes = [];
    for (const k of ['A', 'B']) {
      const p = state[k];
      if (p.type === 'mul' && p.times < 100) notes.push(`${p.times === 50 ? 'Halving' : 'Shrinking'} plans add less and less: this one can never pass ${moneyShort(shrinkLimit(p))}.` + (state.A.type === 'mul' && state.A.times < 100 && state.B.type === 'mul' && state.B.times < 100 ? ` (${k})` : ''));
    }
    return notes.join(' ');
  }

  // the y range for a fit: {have: balances, in: deposits}
  function seriesOf(k) { const r = R[k]; return state.view === 'have' ? r.balN : r.depN; }

    $('dbWho').textContent = `Customer ${desk.i + 1} of 8: ${c.name}`;
    $('dbSum').textContent = `${moneyShort(c.goal)} in ${c.n} ${per(c)}s, at most ${moneyShort(c.cap)} a ${per(c)}${c.firstMax != null ? `, first deposit at most ${moneyShort(c.firstMax)}` : ''}. Rule: ${c.rule}.`;
    renderSlots();
    dCard.show(desk.plan, {...c.fixed, every: true}, running || done);
    const ev = renderChecks();
    $('fbox').innerHTML = sups(formulaHTML());
    $('formulaSec').hidden = !desk.showFormula;
    $('formulaBtn').setAttribute('aria-expanded', desk.showFormula);
    $('formulaBtn').textContent = desk.showFormula ? 'Hide the formula' : 'Show the formula';
    for (const id of ['formulaBtn', 'runBtn', 'cantBtn']) $(id).disabled = running || done;
    $('runBtn').hidden = $('cantBtn').hidden = done;
    $('nextBtn').hidden = !done;
    $('nextBtn').textContent = desk.i === 7 ? 'Season summary ▶' : 'Next customer ▶';
    $('confirm').hidden = !desk.confirm;
    $('confirmQ').textContent = `Turn ${c.name} away?`;
    setDeskView(); drawDesk(growRow);
    $('sv').setAttribute('aria-label', `Plan Desk chart for ${c.name}: balance ${money(ev.total)} by ${per(c)} ${c.n} against a goal of ${moneyShort(c.goal)}; largest deposit ${money(ev.maxDep)} against a cap of ${moneyShort(c.cap)}.`);
  }
  function tickCash(to) {
    const from = desk.shownCash; desk.shownCash = to;
    if (Curio.reduce || to === from) { $('dbCash').textContent = `Desk cash: ${moneyShort(to)}`; return; }
    const t0 = performance.now(), ms = 600;
    const step = () => { const t = Math.min(1, (performance.now() - t0) / ms); $('dbCash').textContent = `Desk cash: ${moneyShort(Math.round((from + (to - from) * t) / 100) * 100)}`; if (t < 1) setTimeout(step, 30); else $('dbCash').textContent = `Desk cash: ${moneyShort(to)}`; };
    step();
  }
  function showResult(lines, good) {
    $('resultSec').hidden = false;
    $('result').innerHTML = sups(lines.map(t => `<p class="result ${good ? 'good' : 'bad'}">${good ? '✓ ' : '✗ '}${esc(t)}</p>`).join(''));
  }
  async function runPlan2() {
    if (desk.phase !== 'build') return;
    const c = cust(), p = {...desk.plan}, ev = evaluate(c, p), myI = desk.i;
    desk.phase = 'running'; desk.runRow = 0; desk.confirm = false; renderDesk();
    for (let k = 1; k <= ev.r.n; k++) {
      await wait(120);
      if (desk.i !== myI || desk.phase !== 'running') return;
      desk.runRow = k; drawDesk(k);
      if (k % 2 === 1 || k === ev.r.n) Curio.tone(520 + Math.min(18, k) * 18, .05, .02, 'triangle');
    }
    await wait(250);
    if (desk.i !== myI) return;
    const P = per(c), PP = Per(c);
    let lines, fee = 0, word, good = false, kind;
    if (!ev.firstOk) { lines = [`The first deposit is over ${moneyShort(c.firstMax)}. ${c.name} goes elsewhere.`]; word = 'over limit'; kind = 'first'; }
    else if (!ev.capOk) { lines = [`${PP} ${ev.over + 1} asks for ${money(ev.r.dep[ev.over])}, over the ${moneyShort(c.cap)} cap. ${c.name} goes elsewhere.`]; word = 'over cap'; kind = 'cap'; }
    else if (!ev.reach) { lines = [`Short by ${money(ev.gap)} at ${P} ${c.n}. ${c.name} goes elsewhere.`]; word = 'short'; kind = 'short'; }
    else { good = true; fee = 2000 + (ev.tight ? 1000 : 0); word = ev.tight ? 'tight' : 'works'; kind = ev.tight ? 'tight' : 'works';
      lines = [`Plan works: ${money(ev.total)} by ${P} ${c.n}. Fee $20.`]; if (ev.tight) lines.push('Tight plan, +$10.'); }
    if (c.impossible && !good) lines.push(`No plan can reach ${moneyShort(c.goal)} here. The best is ${moneyShort(c.best)}.`);
    desk.results[desk.i] = {word, good, fee, kind, did: describePlan(c, p, ev), lines};
    desk.cash += fee; desk.phase = 'done'; desk.runRow = ev.r.n;
    renderDesk(); showResult(lines, good);
    tickCash(desk.cash);
    if (good) Curio.yes();
    $('nextBtn').focus();
  }
  function describePlan(c, p, ev) {
    return `first ${money(p.first)}, ${p.type === 'add' ? `add ${money(p.add)}` : `times ${rfix(p.times)}`} each ${per(c)}: ${money(ev.total)}`;
  }
  function turnAway() {
    const c = cust(); desk.confirm = false;
    let lines, fee = 0, good = false;
    if (c.impossible) { lines = [`Right call. The best possible is ${moneyShort(c.best)}, short of ${moneyShort(c.goal)}. Fee $15.`]; fee = 1500; good = true; }
    else lines = [`This one could be done. One plan that works: ${modelText(c)}.`];
    desk.results[desk.i] = {word: 'turned away', good, fee, kind: good ? 'right' : 'wrong', did: 'turned away', lines};
    desk.cash += fee; desk.phase = 'done';
    renderDesk(); showResult(lines, good); tickCash(desk.cash);
    if (good) Curio.yes();
    $('nextBtn').focus();
  }
  function loadCustomer(i, speak = true) {
    desk.i = i; desk.plan = deskPlanFor(CUSTOMERS[i]); desk.phase = 'build'; desk.runRow = 0; desk.confirm = false;
    $('resultSec').hidden = true; $('result').innerHTML = '';
    renderCustCard(); renderDesk(); relabelDeskX();
    if (speak) narrate('cust-' + CUSTOMERS[i].key + '#' + desk.season);
  }
  function relabelDeskX() { if (!desk.plan) return; for (const t of $('gPlaneD2').querySelectorAll('.gr-axlabel')) if (t.textContent === 'week' || t.textContent === 'day') t.textContent = per(cust()); }
  function showSeason() {
    desk.phase = 'season'; seasonView();
    const res = desk.results, worked = res.filter(r => r && (r.kind === 'works' || r.kind === 'tight')).length, tight = res.filter(r => r && r.kind === 'tight').length;
    const right = res.filter(r => r && r.kind === 'right').length;
    const rows = CUSTOMERS.map((c, i) => { const r = res[i] || {did: 'not seen', lines: []}; return `<tr><th scope="row">${c.name}</th><td>${esc(r.word || '')}</td><td>${esc(r.did)}${r.fee ? ` (fee ${moneyShort(r.fee)})` : ''}</td><td>${esc(c.model ? modelText(c) : 'none: no plan can work. Right call: turn her away.')}</td></tr>`; }).join('');
    $('sumBody').innerHTML = `<img class="vault" src="art:vault-door" alt="">
      <div class="tot"><div><b>${worked} of 7</b>plans that worked</div><div><b>${tight}</b>tight plans</div><div><b>${right} of 1</b>right calls</div><div><b>${moneyShort(desk.cash)}</b>desk cash of a possible $225</div></div>
      <table class="inst"><caption class="vh">Each customer: what you did and a model plan</caption><thead><tr><th scope="col">Customer</th><th scope="col">Result</th><th scope="col">What you did</th><th scope="col">A model plan</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="end">Season over. Every plan here was a sequence; every goal was a sum.</p>`;
    $('summary').hidden = false; renderSlots();
    $('againBtn').focus();
    hush(); narrate('desk-end#' + desk.season);
  }
  function newSeason() {
    hush();
    desk.season = (desk.season || 0) + 1; desk.cash = 0; desk.shownCash = 0; desk.results = []; desk.showFormula = false;
    $('dbCash').textContent = 'Desk cash: $0';
    $('summary').hidden = true;
    loadCustomer(0, desk.season > 1); seasonView();
  }
  // while the season summary is up it takes the desk: the builder, checks and customer card step aside
  function seasonView() {
    const on = state.mode === 'desk' && desk.phase === 'season';
    document.body.classList.toggle('season', on);
    for (const id of ['custCard', 'builder', 'deskBtns', 'resultSec', 'formulaSec', 'checksSec']) $(id).hidden = on || (id === 'resultSec' && desk.phase !== 'done') || (id === 'formulaSec' && !desk.showFormula) || state.mode !== 'desk';
    $('dbWho').textContent = on ? 'Season over' : $('dbWho').textContent;
    if (on) $('dbSum').textContent = `Desk cash ${moneyShort(desk.cash)} of a possible $225.`;
    $('hint').innerHTML = on ? SEASON_HINT : MODES[state.mode].hint;
  }
  $('runBtn').onclick = runPlan2;
  $('cantBtn').onclick = () => { if (desk.phase !== 'build') return; desk.confirm = true; renderDesk(); $('yesAway').focus(); };
  $('yesAway').onclick = () => { if (desk.phase !== 'build') return; turnAway(); };
  $('keepWork').onclick = () => { desk.confirm = false; renderDesk(); $('cantBtn').focus(); };
  $('formulaBtn').onclick = () => { desk.showFormula = !desk.showFormula; renderDesk(); };
  $('nextBtn').onclick = () => { hush(); if (desk.i === 7) showSeason(); else { loadCustomer(desk.i + 1); $('runBtn').focus(); } };
  $('againBtn').onclick = () => { newSeason(); $('runBtn').focus(); };

  // ======================================================================================
  // Narration: a welcome on entering each mode (after the first tap), one at a time; Read always wins
  // ======================================================================================
  const said = new Set(), queued = new Set();   // said: started playing; queued: waiting in this generation
  let tapped = false, vq = Promise.resolve(), vgen = 0;
  addEventListener('pointerdown', firstTap, true); addEventListener('keydown', firstTap, true);
  function firstTap(e) {
    if (tapped) return; tapped = true;   // from here the tap's own handlers may narrate
    removeEventListener('pointerdown', firstTap, true); removeEventListener('keydown', firstTap, true);
    const isRead = !!(e.target && e.target.closest && e.target.closest('#read'));
    const saidBefore = said.size;
    // the opening mode's welcome waits until this tap's click has run. If the tap queued a line of its own (a preset,
    // a shortcut, a mode button) or is Read, the welcome is skipped without being marked said, so entering the mode
    // again plays it; otherwise it is queued now.
    let done = false;
    const go = () => {
      if (done) return; done = true; removeEventListener('click', go, true); clearTimeout(fallback);
      setTimeout(() => {
        if (isRead || queued.size || said.size > saidBefore) return;
        if (state.mode === 'race') narrate(state.preset === 0 && !raceEdited() ? ['race-welcome', 'race-penny'] : 'race-welcome');
        else if (desk.phase !== 'season') { narrate('desk-welcome'); narrate('cust-' + cust().key + '#' + desk.season); }
      });
    };
    addEventListener('click', go, true);
    const fallback = setTimeout(go, 900);   // a drag or a key that makes no click
  }
  const raceEdited = () => JSON.stringify([state.A, state.B].map(p => [p.type, p.first, p.add, p.times, p.every])) !== JSON.stringify([PRESETS[0].A, PRESETS[0].B].map(p => [p.type, p.first, p.type === 'add' ? p.add : 0, p.type === 'mul' ? p.times : 100, p.every]));
  function narrate(keys) {
    if (!tapped) return;
    for (const key of [].concat(keys)) {
      const line = L[key.split('#')[0]], gen = vgen;
      if (!line || said.has(key) || queued.has(key)) continue;
      queued.add(key);
      vq = vq.then(() => {
        if (gen !== vgen) return null;          // dropped by hush(): not marked, so its trigger can queue it again
        queued.delete(key); said.add(key);
        return Promise.race([say(line), wait(2500 + 80 * line.length)]);
      });
    }
  }
  function hush() { vgen++; vq = Promise.resolve(); queued.clear(); Curio.stop(); }
  function readNow() {
    const hint = $('hint').textContent;
    let more;
    if (state.mode === 'race') more = say$(leadLines().join(' ') + ' ' + leadNote());
    else if (desk.phase === 'season') more = `Season over. Desk cash ${moneyShort(desk.cash)} of a possible $225.`;
    else { const c = cust(); more = `${c.name} says: ${c.quote} Goal: ${moneyShort(c.goal)}. Deadline: ${c.n} ${per(c)}s. Most in one deposit: ${moneyShort(c.cap)}.` + (c.firstMax != null ? ` First deposit at most ${moneyShort(c.firstMax)}.` : '') + ` Fixed rule: ${c.rule}.`; }
    hush(); say([hint, more], true);
  }

  // ======================================================================================
  // Modes
  // ======================================================================================
  const TIPS = ['A sequence is a list: what goes in each time. A series is its running sum: what you have.',
    'An add plan grows by the same amount each time; a multiply plan grows by the same factor.',
    'The doubling penny loses for ten days. By day thirty, one deposit is more than all of the other plan.',
    'Hover over the chart, or Tab to it and use the arrow keys, to read any day.'];
  let tipI = -1;
  const SEASON_HINT = '<b>Season over.</b> Look back at what you did for each customer beside a model plan that works, then press Play the season again.';
  const MODES = {
    race: {hint: '<b>Race.</b> Two plans, side by side. Change either one and watch who pulls ahead, and when. Open the ledger for every deposit, or show the shortcut for the sum.'},
    desk: {hint: "<b>Plan Desk.</b> Build a plan that reaches the customer's goal by the deadline without breaking a limit, then press Run the plan. If no plan can work, say so."},
  };
  let modeReady = false;
  function setMode(m) {
    if (modeReady && state.mode === m) return;
    modeReady = true;
    hush();
    closeShortcut(true); closeLedger(true);
    state.mode = m;
    document.body.classList.toggle('race', m === 'race'); document.body.classList.toggle('desk', m === 'desk');
    for (const k in MODES) $('m-' + k).setAttribute('aria-pressed', k === m);
    $('hint').innerHTML = MODES[m].hint;
    tipI = (tipI + 1) % TIPS.length; $('tip').textContent = TIPS[tipI];
    for (const el of document.querySelectorAll('[data-mode]')) el.hidden = el.dataset.mode !== m;
    if (m === 'desk') { $('summary').hidden = desk.phase !== 'season'; }
    else $('summary').hidden = true;
    seasonView();
    $('gRace').style.display = m === 'race' ? '' : 'none'; $('gDesk').style.display = m === 'desk' ? '' : 'none';
    layout(true);
    if (m === 'race') raceChanged(); else renderDesk();
    if (m === 'race') narrate('race-welcome');
    else { narrate('desk-welcome'); if (desk.phase !== 'season') narrate('cust-' + cust().key + '#' + desk.season); }
  }
  for (const k in MODES) $('m-' + k).onclick = () => setMode(k);

  // every line the tool can say, so the voice scripts can record them (window.__tool.allLines())
  const allLines = () => [...new Set(Object.values(L))];

  // ---------- layout: wide, compact or stack (see the CSS note) ----------
  const ORDER = {
    wide: {race: {bar: ['cView', 'cFit', 'cDays', 'leadSec'], panel: ['cPresets', 'cardsSec', 'cShort', 'hint', 'tip']},
      desk: {bar: ['checksSec'], cust: ['custCard'], panel: ['builder', 'deskBtns', 'resultSec', 'formulaSec', 'hint', 'tip']}},
    compact: {race: {panel: ['cardsSec', 'cDays', 'cPresets', 'cView', 'cFit', 'leadSec', 'cShort', 'hint', 'tip']},
      desk: {panel: ['deskbar', 'custCard', 'deskBtns', 'resultSec', 'builder', 'checksSec', 'formulaSec', 'hint', 'tip']}},
    stack: {race: {panel: ['cPresets', 'cView', 'cFit', 'leadSec', 'cDays', 'cardsSec', 'cShort', 'hint', 'tip']},
      desk: {panel: ['custCard', 'builder', 'deskBtns', 'resultSec', 'checksSec', 'formulaSec', 'hint', 'tip']}},
  };
  let curLayout = null, curMode = null;
  function layout(force) {
    const w = innerWidth, h = innerHeight;
    const Lk = w >= 1200 && h >= 700 ? 'wide' : w >= 600 && w / h >= 1.25 ? 'compact' : 'stack';
    document.body.classList.toggle('two', w >= 600);
    if (Lk === curLayout && state.mode === curMode && !force) return;
    curLayout = Lk; curMode = state.mode;
    for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === Lk);
    document.body.style.setProperty('--hb', document.querySelector('header').getBoundingClientRect().height + 'px');
    const o = ORDER[Lk][state.mode], put = (parent, ids) => (ids || []).forEach(id => parent.appendChild($(id)));
    if (!o.panel.includes('deskbar')) $('graphcol').insertBefore($('deskbar'), $('toprow'));
    put($('panel'), o.panel); put($('bar'), o.bar); put($('custWide'), o.cust);
    if (!o.cust && $('custCard').parentNode !== $('panel')) $('panel').insertBefore($('custCard'), $('panel').firstChild);
  }
  addEventListener('resize', () => { layout(); document.body.style.setProperty('--hb', document.querySelector('header').getBoundingClientRect().height + 'px'); });

  Curio.init({clips: "voice:*", rate: .95, readFallback: () => $('hint').textContent});
  $('read').onclick = readNow;
  // the chart's shape and scale: tall in a near-square stage, wide otherwise; text on the chart grows when the stage is
  // scaled down (--ts), so it stays readable in the 16:10 embed
  function setGeo(kind) {
    if (geo === GEO[kind] && g) return false;
    geo = GEO[kind]; RP = geo.RP; DP1 = geo.D1; DP2 = geo.D2;
    $('sv').setAttribute('viewBox', `0 0 ${geo.w} ${geo.h}`);
    for (const el of [$('sv'), $('scene')]) { el.style.width = geo.w + 'px'; el.style.height = geo.h + 'px'; }
    makeRacePlane(); makeDeskPlanes();
    return true;
  }
  function fitStage() {
    const st = $('stage'), r = st.getBoundingClientRect();
    const kind = curLayout === 'stack' ? (innerWidth < 700 ? 'tall' : 'wide') : r.width / Math.max(1, r.height) < 1.2 ? 'tall' : 'wide';
    const changed = setGeo(kind);
    if (curLayout === 'stack') $('stagewrap').style.height = Math.round(Math.min(innerWidth * geo.h / geo.w + 8, innerHeight * .8)) + 'px';
    else $('stagewrap').style.height = '';
    const r2 = st.getBoundingClientRect(), sc = Math.min(r2.width / geo.w, r2.height / geo.h) || 1;
    $('scene').style.setProperty('--s', sc);
    const ts = Math.min(1.5, Math.max(1, .8 / sc)).toFixed(2);
    const tsChanged = $('sv').style.getPropertyValue('--ts') !== ts;
    if (tsChanged) $('sv').style.setProperty('--ts', ts);
    if (changed || tsChanged) { if (state.mode === 'race') { if (R) setRaceView(false); } else if (desk.plan) renderDesk(); }
  }
  new ResizeObserver(fitStage).observe($('stage'));

  // for checking frames
  window.__tool = {state, desk, setMode, allLines, loadPreset, computeRace, leadLines, leadNote, money, formulaCents, depositList, runPlan, evaluate, CUSTOMERS,
    get R() { return R; }, get g() { return g; }, get g1() { return g1; }, get g2() { return g2; }, get geo() { return geo; },
    setPlan(k, o) { Object.assign(state[k], o); raceChanged(); },
    setDays(d) { state.days = d; raceChanged(); },
    view(v) { document.querySelector(`[data-view="${v}"]`).click(); },
    fit(f) { document.querySelector(`[data-fit="${f}"]`).click(); },
    openLedger, closeLedger, openShortcut, closeShortcut, nextStep: () => $('scNext').click(), steps: () => [...$('scSteps').children].map(li => li.textContent),
    ledgerRow: d => R.rows.find(r => r.day === d), cursor(i) { state.cursor = i; drawCursor(); },
    deskPlan(o) { const c = cust(); for (const k in o) if (c.fixed[k] == null) desk.plan[k] = o[k]; renderDesk(); },
    run: runPlan2, turnAway, loadCustomer, showSeason, newSeason, checks: () => [...$('checks').children].map(li => li.textContent), result: () => $('result').textContent,
    typeFirst(k, text) { const b = cards[k].first.box; b.value = text; b.dispatchEvent(new Event('change')); }, cards};
  // start: Race with preset 1, the desk at customer 1
  desk.season = 1; desk.plan = deskPlanFor(CUSTOMERS[0]);
  state.A = freshPlan(PRESETS[0].A); state.B = freshPlan(PRESETS[0].B);
  layout(true);
  fitStage();
  renderCustCard();
  setMode('race');
})();
</script>
</body>
</html>
