.clip[aria-pressed="true"] {border-color:#131313;box-shadow:0 0 0 2px white;}
.clip.low-clip {outline:3px solid var(--brand);outline-offset:-3px;}

.playhead {position:absolute;top:0;bottom:0;width:2px;background:#b3261e;pointer-events:none;z-index:4;}

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

    shop:'art:mdc-shop', store:'art:mdc-store', main:'art:mdc-main', tools:'art:mdc-tools',

    p1:'art:mdc-p1', p2:'art:mdc-p2', p3:'art:mdc-p3', p4:'art:mdc-p4',
    set:'art:mdc-set', ana:'art:mdc-ana', walt:'art:mdc-walt', park:'art:mdc-park',
  };
  // The spec keeps people frames behind owner review. All three originals remain bundled for that review.
  const PORTRAITS_APPROVED = false;

  const paintedFrame = key => ART[!PORTRAITS_APPROVED && portraitKey(key) ? 'set' : key];
  const SHOOTS = [
    {id:1,short:'Release forms',name:'Release forms',art:'shop',roles:[],rule:'Any slot. Producer only. Schedule before all three interviews.'},
    {id:2,short:'Ana interview',name:'Interview Ana',art:'ana',roles:['camera','sound'],
      rule:'Tuesday or Thursday after school: clean. Saturday morning or week 2 Friday morning: noisy. Camera + sound.'},
    {id:3,short:'Walt interview',name:'Interview Walt',art:'walt',roles:['camera','sound'],rule:'Saturday only. Camera + sound.'},
    {id:4,short:'Park interview',name:'Interview Dr. Park',art:'park',roles:['camera','sound'],
      rule:'Wednesday or Thursday after school at the library. Camera + sound. Indoor shoot.'},
    {id:5,short:'Resole boot',name:'Resoling a boot',art:'boot1',roles:['camera'],rule:'Monday or Wednesday after school, Ana\'s boot days. Camera.'},
    {id:6,short:'Evening shop',name:'Storefront in evening light',art:'store',roles:['camera'],
      rule:'Any clear weekday after school. Camera. Rain blocks this outdoor shoot.'},
    {id:7,short:'Main Street',name:'Main Street storefronts',art:'main',roles:['camera'],
      rule:'Any clear slot. Camera. Includes the shop\'s tools wall. Rain blocks this outdoor shoot.'},
    {id:8,short:'Archive scan',name:'Archive scan + license request',art:'p1',roles:[],
      rule:'Friday after school or week 2 Friday morning. Producer only. Includes the archive license request.'},
    {id:9,short:'Shop sounds',name:'Shop sounds',art:'tools',roles:['sound'],
      rule:'Tuesday or Thursday after school, Saturday, or week 2 Friday morning. Sound.'},
  ];
  const CLIPS = [
    ['A1',28,2,'ana','Ana Ruiz','My father opened this shop in 1962. I swept the floor here when I was seven.'],
    ['A2',40,2,'ana','Ana Ruiz','People think a shoe is done when the sole wears through. That\'s when I start. '+
      'New sole, new heel, stitch it by hand, and it\'s good for ten more years.'],
    ['A3',35,2,'ana','Ana Ruiz','There were three shoe repair shops on this street when I was a girl. Now there\'s just me.'],
    ['A4',45,2,'ana','Ana Ruiz','Shoes are cheap now. A lot of them are glued, not stitched. Glue is hard to fix the same way.'],
    ['A5',30,2,'ana','Ana Ruiz','Every pair that comes in has a story. Wedding shoes. A soldier\'s boots. A kid\'s first cleats.'],
    ['A6',25,2,'ana','Ana Ruiz','When I close, I don\'t know who\'ll fix this town\'s shoes. Maybe nobody. Maybe you.'],
    ['W1',25,3,'walt','Walt','I\'ve brought my boots here for forty years. Same boots.'],
    ['W2',30,3,'walt','Walt','She fixed my wife\'s dancing shoes the day before our fiftieth anniversary.'],
    ['W3',20,3,'walt','Walt','You don\'t throw away something that can be fixed.'],
    ['H1',30,4,'park','Dr. Lena Park','In 1960, Main Street had three shoe repair shops, two tailors and a hat shop.'],
    ['H2',35,4,'park','Dr. Lena Park','When the mall opened out by the highway in 1974, fewer people walked downtown every year.'],
    ['H3',25,4,'park','Dr. Lena Park','Repair shops are how a town keeps things instead of replacing them.'],
    ['B1a',12,5,'boot1','','A worn boot on an iron last.'],
    ['B1b',10,5,'boot2','','A new sole laid on.'],
    ['B1c',15,5,'boot3','','An awl through leather, close.'],
    ['B2',10,6,'store','','The storefront in evening light.'],
    ['B3',12,7,'main','','Main Street storefronts, several empty.'],
    ['B4',8,7,'tools','','The wall of tools.'],
    ['B5',10,9,'store','','Shop sounds: door bell and machines.'],
    ['P1',6,8,'p1','','Storefront on opening day, 1962.'],
    ['P2',6,8,'p2','','Main Street, 1960.'],
    ['P3',6,8,'p3','','Newspaper page, 1974.'],
    ['P4',6,8,'p4','','Shelves of tagged shoes, 1980s.'],
  ].map(([id,len,shoot,art,speaker,text]) => ({id,len,shoot,art,speaker,text,kind:speaker?'interview':id[0]==='P'?'photo':'broll'}));
  const BYID = Object.fromEntries(CLIPS.map(c => [c.id,c]));
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const L = {
    welcomeSchedule:'Drag Release forms onto a day first. Then drag the shoots onto days that work.',
    scheduleHow:'Select a shoot card, then tap an open calendar slot. Tap a placed shoot to remove it.',
    fillHow:'Tap Fill in to cover that role yourself.',
    wrapHow:'Everything\'s scheduled. Tap Wrap shooting to see your footage.',
    welcomeEdit:'Drag clips onto the timeline. Aim for about five minutes.',
    editHow:'Select a clip in the bin and tap Add to end. Select a timeline clip to change it.',
    noFootage:'No footage was shot. Tap Start over to return to the calendar.',
    coverHow:'Long talking heads lose people. Tap the clip, then tap Cover to lay footage over it.',
    welcomeScreen:'Tap Screen it and watch the line under your cut.',
    screenHow:'Tap Screen it to test this cut, or Back to Edit to change it.',
    screening:'Watch the audience line. Tap Stop to interrupt the screening.',
    lowPoint:'Tap Back to Edit to fix the highlighted lowest point.',
    clean:'They stayed with you the whole way, and nobody was confused.',
    welcomePremiere:'Choose Where and Captions. Fill the title, date, Invite and Who should see this fields.',
    lockHow:'Your plan is complete. Tap Lock the plan to make the final sheet.',
    locked:'Your premiere sheet is ready. Tap Print sheet to keep a copy.',
    trimHow:'Set the in and out seconds, then tap Apply. Keep at least three seconds.',
    coverDialog:'Choose B-roll, then its cover length. Tap Apply to cover the interview\'s last seconds.',
    titleHow:'Type the speaker\'s name and role, then tap Apply.',
    captionHow:'Type the archive date and place, then tap Apply.',
    modelHow:'Read the model, then tap Close to return to your screening.',
    confirmWrap:'Tap Wrap anyway to finish without these shoots, or Cancel to return to the calendar.',
    confirmReset:'Tap Start over to clear this documentary, or Cancel to keep it.',
    briefOne:'Ruiz Shoe Repair has been on Main Street since 1962. Ana Ruiz, seventy one, runs it alone and plans to close next spring.',
    briefTwo:'Your crew has three weeks to shoot and one week to cut a five minute documentary for the town. Tap Close to return to the calendar.',
  };
  const fresh = () => ({version:1,mode:'schedule',schedule:{},wrapped:false,timeline:[],screenings:[],
    plan:{title:'The Last Repair',date:'',where:'Library screening',captions:true,invite:'',audience:'',locked:false}});
  let state = fresh();
  let saveFailed = false;
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE) || 'null');
    if (stored && stored.version===1 && stored.schedule && Array.isArray(stored.timeline)) {
      state = {...fresh(),...stored,plan:{...fresh().plan,...stored.plan}};
      state.timeline = state.timeline.filter(c => BYID[c.id]).map(c => ({...c,
        in:Math.max(0,Math.min(BYID[c.id].len-3,Math.round(c.in)||0)),
        out:Math.min(BYID[c.id].len,Math.max(3,Math.round(c.out)||BYID[c.id].len)),
      }));
    }
  } catch {}
  const ui = {week:0,shoot:1,slot:null,pending:null,bin:null,selected:null,playing:false,screening:false,playhead:0,run:null,viewMode:null};
  let serial = Date.now();
  let dialogApply = null;
  let dialogHint = '';
  let previousHint = '';
  let returnFocus = null;
  let lastFrame = '';
  let playbackGeneration = 0;
  let shopSoundSecond = -1;
  const V = Curio.voice({
    lines:L,scope:()=>state.mode,hint:false,
    read:()=> $('dialog').open ? dialogHint : $('hint').textContent,
    welcome:()=> {
      if ($('dialog').open || ui.playing || ui.screening) return null;
      if (state.mode==='schedule') return Object.keys(state.schedule).length ? null : 'welcomeSchedule';
      if (state.mode==='edit') return !available().length?'noFootage':state.timeline.length?null:'welcomeEdit';
      if (state.mode==='screen') return 'welcomeScreen';
      return state.plan.locked ? null : planIssues().length?'welcomePremiere':'lockHow';
    },
  });
  const escape = value => String(value ?? '').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const time = n => `${Math.floor(Math.max(0,n)/60)}:${String(Math.floor(Math.max(0,n)%60)).padStart(2,'0')}`;
  const length = c => Math.max(3,c.out-c.in);
  const runtime = () => state.timeline.reduce((sum,c)=>sum+length(c),0);
  const selected = () => state.timeline.find(c=>c.uid===ui.selected);
  const available = () => CLIPS.filter(c=>state.schedule[c.shoot]);
  const has = id => !!state.schedule[id];
  function save() {
    try {localStorage.setItem(STORAGE,JSON.stringify(state));}
    catch {saveFailed=true;}
    $('save-note').innerHTML = saveFailed ? 'Device save unavailable.<br>Keep this tab open.' :
      'Saved on this device only.<br>Fictional people, place and audience.';
  }
  function hint(text,key,opts={}) {
    $('hint').textContent = text;
    if (key) V.how(key,{...opts,hint:false});
  }
  function feedback(text,good=true) {
    hint(text);
    Curio.tone(good?560:185,.07,.04,good?'sine':'triangle');
  }
  function slotInfo(key) {
    const [week,day,part] = key.split('-').map(Number);
    return {week,day,part,order:week*30+day*3+part,
      rain:week===0&&(day===2||day===3)||week===1&&day===1||week===2&&(day===0||day===5)};
  }
  function slotLabel(key) {
    const s=slotInfo(key);
    return `Week ${s.week+1} ${DAYS[s.day]}, ${s.part===0?'morning':s.part===2?'afternoon':'after school'}`;
  }
  function validSlot(key) {
    const s=slotInfo(key);
    return s.week>=0&&s.week<3&&s.day>=0&&s.day<6 &&
      (s.day===5 ? [0,2].includes(s.part) : s.part===1||s.week===1&&s.day===4&&s.part===0);
  }

    const s=slotInfo(key);
    const shot=SHOOTS.find(c=>c.id===id);
    const reasons=[];
    if (!shot||!validSlot(key)) return {ok:false,reasons:['Choose a calendar slot.'],missing:[],crew:[]};
    const occupied=Object.entries(schedule).find(([k,v])=>+k!==id&&v.key===key);
    if (occupied) reasons.push('One shoot per slot. Remove the shoot already here first.');
    const after=s.part===1&&s.day<5;
    const fridayMorning=s.week===1&&s.day===4&&s.part===0;
    if (id===2 && !([1,3].includes(s.day)&&after||s.day===5&&s.part===0||fridayMorning)) {
      reasons.push('Ana is free Tuesday or Thursday after school, Saturday morning, or week 2 Friday morning.');
    }
    if (id===3&&s.day!==5) reasons.push('Walt is available Saturdays only.');
    if (id===4&&!(after&&[2,3].includes(s.day))) reasons.push('Dr. Park is available Wednesday or Thursday after school at the library.');
    if (id===5&&!(after&&[0,2].includes(s.day))) reasons.push('Boot days are Monday and Wednesday after school.');
    if (id===6&&!after) reasons.push('Evening light needs a weekday after-school slot.');
    if ([6,7].includes(id)&&s.rain) reasons.push('Rain blocks this outdoor shoot. Choose a clear day.');
    if (id===8&&!(s.day===4&&s.part===1||fridayMorning)) reasons.push('Archive scans: Friday after school or week 2 Friday morning.');

    }

  function model(cut=state.timeline) {

    const question=(text,id,at=t)=>questions.push({time:at,text,id});
    for (const c of cut) {
      const source=BYID[c.id];
      if (!source) continue;
      // Count actual cover source seconds once per use. Holding one frame is allowed;
      // reusing that same footage in another place must not bypass the saved-best guard.
      const roll=c.cover&&BYID[c.cover.id];
      if (roll) for (let s=0;s<Math.min(c.cover.seconds,roll.len);s++) {
        const sourceSecond=roll.id+':'+s;
        if (usedSourceSeconds.has(sourceSecond)) repeatedSeconds++;
        usedSourceSeconds.add(sourceSecond);

      if (source.kind==='interview'&&!seen.has(source.speaker)) {

        if (previous!==null&&kind!==previous) a=Math.min(100,a+5);

        if (kind==='interview') {

  function graphSVG(result,progress=Infinity) {

    const path=points.map((p,i)=>`${i?'L':'M'}${px(p.t)},${py(p.a)}`).join(' ');
    const previous=state.screenings.slice(-5).filter(r=>r!==result);

      ${(height<100?[0,100]:height<150?[0,50,100]:[0,20,40,60,80,100]).map(n=>`<text x="3" y="${py(n)+4}">${n}</text>`).join('')}
      <text x="${left}" y="${height-5}">0:00</text><text x="${right-38}" y="${height-5}">${time(duration)}</text>${ghosts}

    updateModes();
    if (state.mode==='schedule') {
      $('main').innerHTML=scheduleHTML();updateSchedule();
      const workspace=$('main').firstElementChild;
      workspace.prepend(workspace.querySelector('.shoot-panel'));
      hint(state.wrapped?'Shooting is wrapped. Open Edit to work with your footage.':Object.keys(state.schedule).length?L.scheduleHow:L.welcomeSchedule);
    } else if (state.mode==='edit') {
      $('main').innerHTML=editHTML();renderTimeline();updateEditor();
      const workspace=$('main').firstElementChild;
      workspace.prepend(workspace.querySelector('.edit-main'));
      hint(!available().length?L.noFootage:state.timeline.length?L.editHow:L.welcomeEdit);
    } else if (state.mode==='screen') {
      $('main').innerHTML=screenHTML();updateScreen();
      showSource(state.timeline[0],'screen');hint(L.welcomeScreen);
    } else {
      $('main').innerHTML=planHTML();
      updatePlan();
      hint(state.plan.locked?L.locked:planIssues().length?L.welcomePremiere:L.lockHow);
    }
  }
  let suppressClick=false;
  document.addEventListener('click',e=>{
    if (suppressClick) {suppressClick=false;return;}
    const b=e.target.closest('button');
    if (!b||b.disabled) return;
    const id=b.id;
    if (id.startsWith('m-')) return setMode(id.slice(2));
    if (b.dataset.shoot) return selectShoot(+b.dataset.shoot);
    if (b.dataset.weekTab) {ui.week=+b.dataset.weekTab;updateWeeks();return;}
    if (b.dataset.slot) {
      const entry=Object.entries(state.schedule).find(([,v])=>v.key===b.dataset.slot);
      if (entry) return selectShoot(+entry[0]);
      return place(ui.shoot,b.dataset.slot);
    }
    if (b.dataset.bin) {
      ui.bin=b.dataset.bin;
      if (!ui.playing) ui.selected=null;
      updateEditor();
      const source=BYID[ui.bin];
      const label=source.speaker?`${source.speaker} interview, ${source.len} seconds.`:source.text;
      hint(`${source.id}: ${label} Tap Add to end.`);
      Curio.tone(420,.035,.025);
      return;
    }
    if (b.dataset.uid) return selectClip(b.dataset.uid);
    if (id==='fill'&&ui.pending) return place(ui.pending.id,ui.pending.key,true);
    if (id==='brief') {
      modal('Your documentary brief',`<p>Ruiz Shoe Repair has been on Main Street since 1962. Ana Ruiz, 71, runs it alone and plans to close next spring.</p>
        <p>Your crew has three weeks to shoot and one week to cut a five-minute documentary for the town.</p>
        <p class="quiet">The people, shop, town, history and test audience are fictional.</p>`,'Close',()=>{closeModal();return true;},[L.briefOne,L.briefTwo]);
      V.how(['briefOne','briefTwo'],{valid:()=>$('dialog').open,hint:false});return;
    }
    if (id==='remove-shoot') return removeShoot();
    if (id==='wrap') return wrap();
    if (id==='add') return addClip();
    if (id==='play') return startPlayback();
    if (id==='stop'||id==='stop-screen') return stopPlayback();
    if (id==='screen-it') return startPlayback(true);
    if (id==='back-edit') return setMode('edit');
    if (['trim','cover','lower','caption'].includes(id)) return editDialog(id);
    if (id==='closer') {
      const c=selected();if (!c) return;
      const mark=!c.closer;state.timeline.forEach(x=>x.closer=false);c.closer=mark;
      afterEdit(true);
      feedback(mark?(state.timeline.at(-1)===c?`${c.id} is your ending line. It is already last.`:
        `${c.id} marked as the closer. Move it to the end for the ending to land.`):'Closer removed.');
      return;
    }
    if (id==='earlier'||id==='later') return moveClip(ui.selected,id==='earlier'?-1:1);
    if (id==='remove-clip') {
      const i=state.timeline.findIndex(c=>c.uid===ui.selected);
      if (i<0) return;
      state.timeline.splice(i,1);ui.selected=state.timeline[Math.min(i,state.timeline.length-1)]?.uid||null;
      afterEdit(true);feedback('Clip removed. Your other edits are kept.');return;
    }
    if (id==='cancel') return closeModal();
    if (id==='confirm') return dialogApply?.();
    if (id==='model-note') {
      modal('How the screening works',`<p>A model of a test audience, not real viewers. Starts at 80.</p>
        <p>After 20 continuous seconds of uncovered interview: minus 0.5 each second. B-roll, covers and photos: plus 0.5 a second, up to 90.
        Changing visual kind adds 5, up to 100. A cover breaks the interview streak.</p>
        <p>A first speaker without a name and role costs 5. An undated archive before the historian costs 5. Uncovered noisy audio costs 1 each second.
        A marked closer in the last slot adds 10. The line never goes below zero.</p>
        <p>This model waives the noise penalty during covers. Real B-roll does not fix noisy interview sound.</p>
        <p>Dashed lines show earlier cuts at the same elapsed times. Longer earlier cuts continue beyond this cut's time span.</p>
        <p>Repeating pretty footage can keep this model high. It cannot tell whether you found a story. Compare the cut, not just the number.</p>`,
        'Close',()=>{closeModal();return true;},L.modelHow);return;
    }
    if (id==='lock') {
      if (planIssues().length) return;
      V.hush();
      state.plan.locked=true;save();render();$('print')?.focus({preventScroll:true});V.say('locked');return;
    }
    if (id==='print') return window.print();
    if (id==='start-over') {
      modal('Start over?', '<p>This clears your schedule, footage, cut, screenings and premiere plan on this device.</p>', 'Start over',()=>{
        closeModal();stopPlayback(false);state=fresh();Object.assign(ui,{shoot:1,week:0,bin:null,selected:null,slot:null,pending:null});
        try {localStorage.removeItem(STORAGE);}catch {}
        render();return true;
      },L.confirmReset);
    }
  });
  document.addEventListener('input',e=>{
    if (e.target.dataset.sync) {$(e.target.dataset.sync).value=e.target.value;return;}
    if (e.target.id==='in-seconds'&&$('in-handle')) $('in-handle').value=e.target.value;
    if (e.target.id==='out-seconds'&&$('out-handle')) $('out-handle').value=e.target.value;
    if (!e.target.id.startsWith('plan-')) return;
    const name=e.target.id.slice(5);
    state.plan[name]=name==='captions'?e.target.value==='on':e.target.value;
    state.plan.locked=false;save();updatePlan();
  });
  $('dialog').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    if (e.button!==0) return;
    const b=e.target.closest('[data-drag]');
    if (!b||b.disabled) return;
    drag={id:b.dataset.drag,x:e.clientX,y:e.clientY,active:false};
    b.setPointerCapture(e.pointerId);
  });
  document.addEventListener('dragstart',e=>{if (e.target.closest('[data-drag]')) e.preventDefault();});
  document.addEventListener('pointermove',e=>{
    if (!drag) return;
    if (Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7) drag.active=true;
    if (!drag.active) return;
    const ghost=$('drag-ghost');ghost.hidden=false;
    const [kind,value]=drag.id.split(':');
    ghost.textContent=kind==='shoot'?SHOOTS[+value-1].short:
      kind==='timeline'?state.timeline.find(c=>c.uid===value)?.id||'Clip':value;
    ghost.style.left=(e.clientX+12)+'px';
    ghost.style.top=(e.clientY+10)+'px';
  });
  document.addEventListener('pointerup',e=>{
    if (!drag) return;
    const d=drag;drag=null;$('drag-ghost').hidden=true;
    if (!d.active) return;
    suppressClick=true;setTimeout(()=>suppressClick=false,100);
    const target=document.elementFromPoint(e.clientX,e.clientY);
    const [kind,value]=d.id.split(':');
    if (kind==='shoot') {
      const slot=target?.closest('[data-slot]');if (slot) place(+value,slot.dataset.slot);
    } else {
      const timeline=target?.closest('#timeline');if (!timeline) return;
      const before=target.closest('[data-uid]')?.dataset.uid;
      if (kind==='bin') addClip(value,before);
      else if (before&&before!==value) moveClip(value,0,before);
      else if (!before) moveClip(value,state.timeline.length-state.timeline.findIndex(c=>c.uid===value)-1);
    }
  });
  document.addEventListener('pointercancel',()=>{drag=null;$('drag-ghost').hidden=true;});
  document.addEventListener('keydown',e=>{
    const b=e.target.closest('[data-uid]');
    if (!b||$('dialog').open) return;
    if (e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)) {
      e.preventDefault();moveClip(b.dataset.uid,e.key==='ArrowLeft'?-1:1);
    }
  });
  addEventListener('resize',()=>{
    updateWeeks();
    if (ui.playing||ui.screening) showFrame(ui.playhead,true);
    if (state.mode==='screen'&&!ui.screening) updateScreen();
  });
  Curio.onMotion(()=>{if (ui.playing||ui.screening) showFrame(ui.playhead,true);});
  Curio.init({clips:"voice:*",rate:.98});
  if (!['schedule','edit','screen','premiere'].includes(state.mode)) state.mode='schedule';
  if (!state.wrapped&&state.mode!=='schedule') state.mode='schedule';
  if (state.mode==='screen'&&runtime()<270) state.mode='edit';
  if (state.mode==='premiere'&&!state.screenings.length) state.mode=state.wrapped?'edit':'schedule';
  for (const screening of state.screenings) {
    try {
      const label=screening.label;
      Object.assign(screening,model(JSON.parse(screening.signature)),{label});
    } catch {screening.repeatedSeconds=1;}
  }
  render();V.welcome();
  window.__tool={get state(){return state;},ui,SHOOTS,CLIPS,placement,place,model,runtime,available,addClip,clipNew,moveClip,
    setMode,render,save,planIssues,editDialog,startPlayback,stopPlayback,titleValid,captionValid,bestScreening,
    allLines:V.allLines,vlog:V.log,get vq(){return V.queue;}};
})();
</script>
