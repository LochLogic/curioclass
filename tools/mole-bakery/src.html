<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ATOMS = {
    H:{mass:1.008,cpk:'#ffffff'}, C:{mass:12.011,cpk:'#909090'}, O:{mass:15.999,cpk:'#ff0d0d'},
    Na:{mass:22.990,cpk:'#ab5cf2'}, K:{mass:39.0983,cpk:'#8f40d4'}, N:{mass:14.007,cpk:'#3050f8'}
  };
  // Limited to the simple formulas in this spec. Replace with kit/molecules.js when available.
  function parse(formula) {
    const out = {};
    for (const [,el,n] of formula.matchAll(/([A-Z][a-z]?)(\d*)/g)) out[el] = (out[el] || 0) + Number(n || 1);
    return out;
  }
  function molarMass(formula) {
    return Object.entries(parse(formula)).reduce((v,[el,n]) => v + ATOMS[el].mass * n, 0);
  }
  function tally(side) {
    const out = {};
    side.forEach(([formula,coef]) => Object.entries(parse(formula)).forEach(([el,n]) => out[el] = (out[el] || 0) + n * coef));
    return out;
  }
  const ITEMS = {
    soda:{name:'Baking soda',formula:'NaHCO3',art:'mb-soda',price:2,color:'#f0c8a0',shape:4},
    tartar:{name:'Cream of tartar',formula:'KHC4H4O6',art:'mb-tartar',price:10,color:'#ab5cf2',shape:0},
    vinegar:{name:'Vinegar, 5% acidity',formula:'HC2H3O2',art:'mb-vinegar',price:1,color:'#ff8a8a',shape:3},
    glucose:{name:'Glucose',formula:'C6H12O6',art:'mb-glucose',price:3,color:'#ffd36b',shape:6},
    ammonia:{name:"Baker's ammonia",formula:'NH4HCO3',art:'mb-ammonia',price:6,color:'#3050f8',shape:4}
  };
  Object.values(ITEMS).forEach(i => i.mm = molarMass(i.formula));
  const REACTIONS = {
    R1:{name:'Biscuit powder',items:['soda','tartar'],coefs:[1,1],gas:1,art:'mb-biscuits',product:'Biscuits',
      left:[['NaHCO3',1],['KHC4H4O6',1]],right:[['KNaC4H4O6',1],['H2O',1],['CO2',1]],
      eq:'NaHCO₃ + KHC₄H₄O₆ → KNaC₄H₄O₆ + H₂O + CO₂',note:'Baking soda + cream of tartar. One mole of each gives one mole of carbon dioxide.'},
    R2:{name:'Vinegar cake',items:['soda','vinegar'],coefs:[1,1],gas:1,art:'mb-cake',product:'Vinegar cake',
      left:[['NaHCO3',1],['HC2H3O2',1]],right:[['NaC2H3O2',1],['H2O',1],['CO2',1]],
      eq:'NaHCO₃ + HC₂H₃O₂ → NaC₂H₃O₂ + H₂O + CO₂',note:'Vinegar is modeled as 5 g acid per 100 g vinegar, using density close to 1 g/mL.'},
    R3:{name:'Bread fermentation',items:['glucose'],coefs:[1],gas:2,art:'mb-bread',product:'Bread',

  function calculate(rid=state.reaction, grams=state.grams, retention=null) {
    const r = REACTIONS[rid];
    const n = r.items.map((key,i) => Math.max(0,grams[i] || 0) * (key==='vinegar' ? .05:1) / ITEMS[key].mm);
    const capacities = n.map((v,i) => v / r.coefs[i]);
    const extent = Math.min(...capacities);
    const limiting = capacities.indexOf(extent);
    const leftovers = n.map((v,i)=> Math.max(0,v-extent*r.coefs[i]));
    const sodaIndex = r.items.indexOf('soda');
    const sodaExtra = ['R1','R2'].includes(rid) ? leftovers[sodaIndex] : 0;
    const extra = sodaExtra / 2;
    const made = extent * r.gas + extra;
    const yieldFactor = retention ?? (rid==='R3' && state.mode==='bakery' && week.day>=4 ? .9:1);
    const kept = made * yieldFactor;
    const leftGrams = leftovers.map((v,i)=>v*ITEMS[r.items[i]].mm);
    const fraction = i => n[i] > 0 ? leftovers[i]/n[i] : 0;
    let taste = 'clean';
    if (rid==='R5' && n[0]>0 || sodaIndex>=0 && fraction(sodaIndex)>.02+1e-12) taste='soapy';
    else if (r.items.some((key,i)=>['tartar','vinegar'].includes(key) && fraction(i)>.02+1e-12)) taste='sour';
    let co2 = (rid==='R4' ? extent:made)*molarMass('CO2');
    const parts = [];
    const add = (name,g,kind='product') => { if (g>1e-10) parts.push({name,g,kind}); };
    if (['R1','R2'].includes(rid)) {
      add(rid==='R1'?'Sodium potassium tartrate':'Sodium acetate',extent*molarMass(rid==='R1'?'KNaC4H4O6':'NaC2H3O2'));
      add('Reaction water',extent*molarMass('H2O'));
      add('Sodium carbonate (soapy)',extra*molarMass('Na2CO3'));
      add('Water from heated soda',extra*molarMass('H2O'));
      r.items.forEach((key,i)=> {
        if (key!=='soda') add((key==='vinegar'?'Acetic acid':ITEMS[key].name)+' left over',leftGrams[i],'leftover');
      });
      if (rid==='R2') add('Water already in vinegar',grams[1]*.95);
    } else if (rid==='R3') add('Ethanol baked off',extent*2*molarMass('C2H5OH'),'escaped');
    else if (rid==='R4') {
      add('Ammonia gas',extent*molarMass('NH3'),'gas');
      add('Water vapor',extent*molarMass('H2O'),'gas');
    } else {
      add('Sodium carbonate (soapy)',extent*molarMass('Na2CO3'));
      add('Water from heated soda',extent*molarMass('H2O'));
    }
    add('Carbon dioxide',co2,'gas');
    const gasMass = rid==='R4' ? extent*ITEMS.ammonia.mm : co2;
    const before = grams.reduce((a,b)=>a+b,0);
    const after = parts.reduce((a,b)=>a+b.g,0);
    return {rid,grams:[...grams],n,extent,limiting,leftovers,leftGrams,extra,made,kept,yieldFactor,gasMass,taste,
      before,after,parts,missing:r.items.filter((k,i)=>!n[i]),waste:leftGrams.reduce((a,b)=>a+b,0)};
  }

  function mixExact() {

  function bake() {

      +r.items.map(k=>({soda:'■ soda',tartar:'● tartar',vinegar:'▲ acid',glucose:'⬡ glucose',ammonia:'◆ ammonia'})[k]).join(' · ');
    $('scale-readout').textContent=fixed(calc.before)+' g';
    $('result-title').textContent=state.result?'Bake result':'What this mix can make';
    $('gas').textContent=sig(result.kept)+' mol'+(result.yieldFactor<1?' kept':' gas');
    const displayMass=result.gasMass*result.yieldFactor;
    $('gas-detail').textContent=fixed(displayMass)+' g '+(result.rid==='R4'?'three gases':'CO₂')
      +(result.yieldFactor<1?' kept':'')+' · '+Math.round(result.kept*24465).toLocaleString('en-US')
      +' mL ideal gas at 25 °C, 1 atm';
    if(result.yieldFactor<1) {
      $('gas-detail').textContent+=' · '+sig(result.made)+' mol made ('+fixed(result.gasMass)+' g) × 90%';
    }
    $('taste').textContent='Taste: '+result.taste+(result.taste==='soapy'?' · sodium carbonate':result.taste==='sour'?' · acid left over':'');
    $('leftovers').textContent='Left before oven: '+REACTIONS[result.rid].items.map((key,i)=>
      fixed(result.leftGrams[i])+' g '+(key==='vinegar'?'acetic acid':ITEMS[key].name)).join('; ')
      +(result.extra>0?' · Heated soda adds '+sig(result.extra)+' mol CO₂ by R5.':'');
    $('mass-check').textContent='Before '+fixed(result.before)+' g = after '+fixed(result.after)+' g ('+fixed(result.gasMass)+' g leavening gas).';
    $('mass-parts').innerHTML=result.parts.map(p=>'<li>'+p.name+': '+fixed(p.g)+' g</li>').join('');
    $('receipt').hidden=result.earned===undefined;
    $('receipt').textContent=result.earned===undefined?'':result.pass?'Paid in full · +'+result.earned+' coins'
      :'The customer took it at half price. +'+result.earned+' coins';
    $('rise-result').hidden=result.target===undefined;
    if(result.target) {
      $('rise-bar').style.width=Math.min(100,result.kept/result.target/1.5*100)+'%';
      $('rise-text').textContent=fixed(result.kept/result.target*100,1)+'% of target · full-price band 95 to 105%';
    }
    $('oven-bake').src=ART[r.art];
    $('oven-bake').alt=r.product+' in the oven';
    renderOrders(rebuild);
    renderPantry();
    drawDots();
    drawRise();
  }
  function drawRise() {
    const result=state.result || calculate();
    const ratio=result.target?result.kept/result.target:result.made>0?1:0;
    const rise=.85+Math.max(0,Math.min(1,ratio))*.15;
    $('oven-bake').style.setProperty('--rise',state.result?.85+(rise-.85)*state.progress:.85);
  }
  function shape(ctx,item,x,y,size,alpha) {
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(x,y);
    ctx.fillStyle=item.color;
    ctx.strokeStyle='#17141f';
    ctx.lineWidth=1;
    ctx.beginPath();
    if(!item.shape) ctx.arc(0,0,size,0,Math.PI*2);
    else {
      const offset=item===ITEMS.ammonia ? 0:Math.PI/4;
      for(let i=0;i<item.shape;i++) {
        const a=i*Math.PI*2/item.shape+offset;
        const px=Math.cos(a)*size;
        const py=Math.sin(a)*size;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  function drawDots() {
    const canvas=$('dots');
    const rect=canvas.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    const dpr=Math.min(2,devicePixelRatio||1);
    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;
    const ctx=canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    const w=rect.width;
    const h=rect.height;
    const calc=state.result || calculate();
    const r=REACTIONS[calc.rid];
    const unit=calc.n.some(v=>v/.001>120)?.01:.001;
    const p=state.result?state.progress:0;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(w*.10,h*.18);
    ctx.lineTo(w*.90,h*.18);
    ctx.quadraticCurveTo(w*.85,h*.96,w*.5,h*.95);
    ctx.quadraticCurveTo(w*.15,h*.96,w*.10,h*.18);
    ctx.clip();
    r.items.forEach((key,j)=> {
      const count=Math.ceil(calc.n[j]/unit-1e-9);
      const consumed=calc.extent*r.coefs[j]/unit;
      for(let i=0;i<count;i++) {
        const weight=Math.max(0,Math.min(1,calc.n[j]/unit-i));
        const consumedFraction=weight?Math.max(0,Math.min(1,(consumed-i)/weight)):0;
        const x=w*(.17+((i*37+j*19)%101)/101*.66);
        const y=h*(.32+((i*17+j*31)%61)/61*.48);
        const reactionProgress=Math.max(0,Math.min(1,p*1.7-i/Math.max(1,consumed)*.7));
        const reacting=consumedFraction>0;
        const heatProgress=Math.max(0,(p-.65)/.35);
        const heatedSoda=key==='soda' && ['R1','R2'].includes(calc.rid);
        const acidReacted=consumedFraction*reactionProgress;
        const alpha=weight*(1-acidReacted)*(heatedSoda?1-heatProgress:1);
        const actual=reacting?reactionProgress:0;
        const targetX=w*(.44+(i%2)*.12);
        const targetY=h*.6;
        shape(ctx,ITEMS[key],x+(targetX-x)*actual,y+(targetY-y)*actual,Math.max(2.7,Math.min(5,w/80)),alpha);
      }
    });
    ctx.restore();
    if(p>.65 && (calc.extra>0 || calc.rid==='R5')) {
      const carbonate=calc.rid==='R5'?calc.extent:calc.extra;
      const count=Math.ceil(carbonate/unit-1e-9);
      for(let i=0;i<count;i++) {
        const x=w*(.2+((i*29)%83)/83*.6);
        const y=h*(.72+((i*11)%17)/17*.12);
        const weight=Math.max(0,Math.min(1,carbonate/unit-i));
        shape(ctx,{color:'#ddd4c4',shape:4},x,y,3.5,weight*(p-.65)/.35);
      }
    }
    if(p>0) {
      const bubbles=Math.min(38,Math.ceil(calc.made/unit));
      for(let i=0;i<bubbles;i++) {
        const phase=(p*1.8+i*.137)%1;
        const x=w*(.2+((i*29)%79)/79*.6);
        const y=h*(.8-phase*.8);
        ctx.beginPath();
        ctx.arc(x,y,3+(i%4)*1.4,0,Math.PI*2);
        ctx.strokeStyle='#cfe3f1';
        ctx.lineWidth=1.5;
        ctx.globalAlpha=state.baking?.75:.3;
        ctx.stroke();
      }
      ctx.globalAlpha=1;
      if(calc.extra>0 || calc.rid==='R5') {
        ctx.fillStyle='#141b25';
        ctx.fillRect(w*.25,h*.84,120,18);
        ctx.fillStyle='#e9ddcc';
        ctx.font='11px Segoe UI';
        ctx.fillText('Na₂CO₃ remains',w*.27,h*.84+13);
      }
    }
  }
  const ART = {
    'mb-biscuits':'art:mb-biscuits','mb-cake':'art:mb-cake','mb-bread':'art:mb-bread','mb-cookies':'art:mb-cookies'
  };
  const PANTRY_ART = {
    'mb-soda':'art:mb-soda','mb-tartar':'art:mb-tartar','mb-vinegar':'art:mb-vinegar',
    'mb-glucose':'art:mb-glucose','mb-ammonia':'art:mb-ammonia'
  };
  $('reaction').innerHTML=Object.entries(REACTIONS).map(([key,r])=>'<option value="'+key+'">'+key+' · '+r.name+'</option>').join('');
  $('reaction').onchange=e=> {
    V.dropQueued();
    setReaction(e.target.value);
    state.edited=true;
    tell('Enter the ingredient grams, then press Bake. Mix exact matches the second ingredient to the first.');
  };
  $('m-kitchen').onclick=()=>setMode('kitchen');
  $('m-bakery').onclick=()=>setMode('bakery');
  $('bake').onclick=bake;
  $('exact').onclick=mixExact;
  $('end-day').onclick=()=>advanceDay();
  $('new-week').onclick=newWeek;
  $('decline').onclick=()=> {
    if(week.finished || activeOrder().status!=='open') { tell(L.next); return; }
    cancelBake();
    activeOrder().status='declined';
    save();
    render(false);
    tell('Order declined, no cost. '+L.next);
    Curio.tone(220,.07,.04);
  };
  Curio.init({clips:"voice:*",rate:.95,readFallback:()=>$('hint').textContent});
  Curio.onMotion(()=> {
    if(Curio.reduce && state.baking) {
      state.baking=false;
      state.progress=1;
      $('stage').classList.remove('baking');
      $('oven-caption').textContent='Bake ready';
    }
    drawDots();
    drawRise();
  });
  buildPantry();
  makeRows();
  render(true);
  tell(L.wKitchen);
  new ResizeObserver(()=> { drawDots(); drawRise(); }).observe($('bowl-wrap'));
  window.__tool = {
    state,setMode,set:(rid,grams)=>setReaction(rid,grams),bake,day:n=>advanceDay(n),buy,seed:()=>0,
    allLines:V.allLines,vlog:V.log,get vq(){return V.queue;},calculate,parse,molarMass,tally,
    changeGrams,chooseOrder,advanceDay,newWeek,REACTIONS,ITEMS
  };
})();
</script>
