<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess | Curio Class Recess</title>
  <meta name="description" content="Chess in a paper theatre: play seven computer opponents from gentle to strong, play a friend on one device, or solve quick puzzles. Free from Curio Class.">
<link rel="stylesheet" href="kit:recess">
<style>
* {
  box-sizing: border-box;
}
:root {
  color-scheme: dark;
  --stage-art: url("art:stage");
  --board-art: url("art:board");
  --paper-art: url("art:paper");
}
body {
  margin: 0;
  color: #fff4e0;
  background: #26091a;
  font-family: Georgia, serif;
}
body.recess {
  --rc-accent: #ffd27a;
  --rc-accent-ink: #301509;
  --rc-glass: #26091ae8;
}
button,
select {
  font: inherit;
}
button {
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 3px solid #ffd27a;
  outline-offset: 3px;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
[hidden] {
  display: none !important;
}
.theatre {
  min-height: 100svh;
  position: relative;
  isolation: isolate;
  padding: 88px 30px 25px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: #26091a var(--stage-art) center center / 100% 100% no-repeat;
}
.wing-art {
  display: none;
  pointer-events: none;
  position: absolute;
  z-index: -1;
}
.theatre::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: radial-gradient(ellipse at 27% 35%, #ffd27a20, transparent 55%);
  animation: lamplight 9s ease-in-out infinite alternate;
}
.stage {
  display: grid;
  grid-template-columns: 210px auto 210px;
  gap: 24px;
  align-items: center;
}
.wing {
  align-self: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  min-width: 0;
}
.eyebrow {
  color: #ffd27a;
  font:
    700 11px/1.4 system-ui,
    sans-serif;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin: 0;
}
.wing h1 {
  font-size: 42px;
  font-weight: 500;
  margin: 0;
  letter-spacing: -0.03em;
}
.wing h2 {
  font-size: 27px;
  margin: 0;
  font-weight: 500;
}
.puppet {
  width: 178px;
  height: 178px;
  background: url("art:puppets") 0 0 / 700% 200%;
  filter: drop-shadow(7px 12px 6px #0007);
}
.thinking .puppet {
  animation: thinking 2s ease-in-out infinite;
}
.thinking .puppet {
  background-position-y: 100%;
}
.status {
  min-height: 24px;
  font:
    14px/1.4 system-ui,
    sans-serif;
  color: #fff4e0;
}
.depth {
  height: 5px;
  width: 130px;
  border-radius: 8px;
  overflow: hidden;
  background: #fff4e026;
}
.depth i {
  display: block;
  height: 100%;
  width: 0;
  background: #ffd27a;
  transition: width 0.2s;
}
.fallen {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  align-items: center;
  min-height: 32px;
  width: 100%;
  gap: 0;
}
.fallen .piece {
  width: 30px;
  height: 32px;
  transform: scaleY(0.58) rotate(-12deg);
  margin: -4px;
}
.board-wrap {
  --size: min(600px, calc(100svh - 144px), calc(100vw - 560px));
  position: relative;
  padding: 14px;
  background: #4f2716 var(--board-art) center / 800px;
  background-blend-mode: multiply;
  border: 2px solid #d7a259;
  box-shadow:
    0 0 0 4px #28100c,
    0 8px 0 4px #17090b,
    16px 25px 35px #0008,
    -9px -8px 30px #ffd27a15;
}
.board {
  width: var(--size);
  height: var(--size);
  position: relative;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  background: var(--board-art) center / 100% 100%;
}
.square {
  position: relative;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  min-width: 0;
  min-height: 0;
}
.square::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.square.last::before {
  background: #ffd27a59;
  box-shadow: inset 0 0 0 2px #ffd27a70;
}
.square.selected::before {
  background: #ffd27a66;
  box-shadow: inset 0 0 0 3px #ffe1a1;
}
.square:focus-visible {
  outline: 3px solid #fff4e0;
  outline-offset: -4px;
  z-index: 3;
  box-shadow: inset 0 0 0 6px #6b3316;
}
.piece {
  display: block;
  width: 100%;
  height: 100%;
  position: relative;
  background: url("art:pieces") 0 0 / 600% 200% no-repeat;
  pointer-events: none;
  filter: drop-shadow(4px 6px 2px #30150966);
  transform-origin: 50% 82%;
}
.selected .piece {
  transform: translateY(-6px) rotate(-3deg);
  filter: drop-shadow(0 0 2px #ffd27a) drop-shadow(7px 12px 3px #30150977);
}
.square.dot::after {
  content: "";
  width: 22%;
  height: 22%;
  border-radius: 50%;
  background: #2a1a14;
  border: 2px solid #fff4e0;
  position: absolute;
  left: 39%;
  top: 39%;
  box-shadow: 1px 3px 3px #30150944;
  animation: bloom 0.12s ease-out;
}
.square.take::after {
  content: "";
  position: absolute;
  inset: 8%;
  border: 4px solid #2a1a14;
  outline: 2px solid #fff4e0;
  border-radius: 50%;
}
.square.check::before {
  box-shadow:
    inset 0 0 0 3px #fff4e0,
    inset 0 0 23px 13px #d23a2ebb;
}
.square.check .piece {
  animation: shudder 0.24s;
}
.square.clue {
  box-shadow: inset 0 0 0 4px #ffd27a;
}
.board.puzzle-solved .square.last::before {
  box-shadow: inset 0 0 0 3px #ffe4ab, inset 0 0 24px #ffd27a88;
}
.coordinate {
  position: absolute;
  pointer-events: none;
  color: #ffe4ab;
  font:
    10px system-ui,
    sans-serif;
}
.coord-file {
  bottom: 0;
  width: calc((100% - 28px) / 8);
  text-align: center;
}
.coord-rank {
  left: 1px;
  height: calc((100% - 28px) / 8);
  display: flex;
  align-items: center;
}
.prompt {
  width: 100%;
  min-height: 100px;
  padding: 14px;
  border-block: 1px solid #c4935866;
  background: #240e0cd9;
  font:
    16px/1.55 Georgia,
    serif;
  text-align: left;
  box-shadow: 0 10px 20px #0002;
}
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
}
.stage-button {
  min-height: 44px;
  padding: 8px 14px;
  color: #ffe5b6;
  border: 1px solid #c49358;
  background: #39150fe8 var(--board-art) 50% 50% / 1200px;
  background-blend-mode: multiply;
  border-radius: 5px;
  box-shadow: 0 3px 0 #190a08;
  font:
    600 14px system-ui,
    sans-serif;
}
.stage-button:hover {
  filter: brightness(1.2);
}
.stage-button[aria-pressed="true"] {
  box-shadow:
    inset 0 0 0 1px #ffd27a,
    0 3px 0 #190a08;
}
.turn-switch {
  display: flex;
  align-items: center;
  text-align: left;
  gap: 7px;
  font:
    13px/1.3 system-ui,
    sans-serif;
  min-height: 44px;
}
.turn-switch input {
  width: 22px;
  height: 22px;
  accent-color: #ffd27a;
}
.bill-turn {
  display: none;
}
.device-note {
  color: #e3c8a9;
  font:
    11px/1.4 system-ui,
    sans-serif;
  margin: 0;
}
.act-label {
  color: #ffd27a;
  font:
    14px/1.4 system-ui,
    sans-serif;
}
.veil {
  position: fixed;
  inset: 60px 0 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 16px;
  background: #17081755;
  backdrop-filter: blur(3px);
}
.programme {
  width: min(760px, 100%);
  max-height: calc(100svh - 96px);
  overflow-y: auto;
  padding: 34px 48px;
  font-family: Georgia, serif;
  background: #eeddbb var(--paper-art) center / 100% 100%;
  color: #351b19;
  box-shadow: 0 24px 80px #000a;
  text-align: center;
  position: relative;
}
.programme .eyebrow {
  color: #8e1530;
}
.programme h2 {
  font-size: clamp(38px, 5vw, 64px);
  line-height: 1.05;
  font-weight: 500;
  margin: 6px 0;
}
.programme h3 {
  font-size: 26px;
  margin: 12px 0;
  font-weight: 500;
}
.programme p {
  line-height: 1.5;
}
.programme .subtitle {
  font-size: 17px;
  margin: 8px 0 22px;
}
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.bill-button {
  min-height: 64px;
  padding: 12px;
  border: 1px solid #b78858;
  background: #fff4e088;
  color: #4c1b20;
  border-radius: 3px;
  box-shadow: 0 3px 0 #ae835c44;
  text-align: left;
}
.bill-button b {
  display: block;
  font-size: 20px;
  font-weight: 500;
}
.bill-button small {
  display: block;
  font:
    12px/1.4 system-ui,
    sans-serif;
  margin-top: 3px;
  color: #674c39;
}
.bill-button:hover,
.bill-button.active {
  background: #fff9e7;
  border-color: #8e1530;
}
.bill-button.primary {
  background: #8e1530;
  color: #fff4e0;
  text-align: center;
}
.bill-button.primary small {
  color: #fff4e0;
}
.programme .credit {
  font:
    11px/1.6 system-ui,
    sans-serif;
  color: #684a38;
  margin: 20px 0 0;
}
.puppet-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.puppet-choice {
  padding: 3px;
  border: 1px solid #b7885888;
  background: #fff4e050;
  color: #351b19;
  min-height: 100px;
}
.puppet-choice .puppet {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
}
.puppet-choice.active {
  outline: 2px solid #8e1530;
  background: #fff9e7;
}
.puppet-choice span {
  font:
    12px system-ui,
    sans-serif;
}
.side-choices {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 12px 0;
}
.side-choices button {
  min-height: 44px;
  padding: 6px 18px;
  background: #fff4e0;
  color: #351b19;
  border: 1px solid #a77951;
}
.side-choices .active {
  background: #4c1b20;
  color: #fff4e0;
}
.plays-like {
  min-height: 48px;
  font-size: 15px;
}
.back {
  background: none;
  border: none;
  color: #8e1530;
  text-decoration: underline;
  min-height: 44px;
  padding: 8px 16px;
}
.act-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.fan {
  position: fixed;
  z-index: 45;
  background: #eeddbb var(--paper-art) center / 100% 100%;
  color: #351b19;
  padding: 10px;
  box-shadow: 0 8px 30px #0008;
  border: 1px solid #c49358;
  max-width: 95vw;
}
.fan p {
  margin: 0 0 5px;
  text-align: center;
  font-size: 14px;
}
.fan button {
  width: 66px;
  height: 80px;
  background: transparent;
  color: #351b19;
  border: 1px solid #c49358;
}
.fan .piece {
  height: 60px;
}
.capture-ghost {
  position: fixed;
  z-index: 25;
  pointer-events: none;
  transform-origin: 50% 85%;
  animation: foldaway 0.5s ease-in forwards;
}
.mover {
  position: fixed;
  z-index: 26;
  pointer-events: none;
  animation: move-arc 0.2s ease-in-out;
}
.curtain-sweep {
  position: fixed;
  z-index: 35;
  pointer-events: none;
  top: 60px;
  bottom: 0;
  width: 25%;
  background: var(--stage-art) left top / 400% 100%;
  animation: curtain 0.5s ease-in-out;
}
.curtain-sweep.right {
  right: 0;
  transform: scaleX(-1);
}
.curtain-sweep.left {
  left: 0;
}
.attack-line {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  width: 100%;
  height: 100%;
}
.attack-line line {
  stroke: #2a1a14;
  stroke-width: 5;
  stroke-dasharray: 9 7;
  filter: drop-shadow(0 1px 1px #fff4e0);
}
@keyframes lamplight {
  to {
    opacity: 0.55;
  }
}
@keyframes thinking {
  50% {
    transform: translateY(-4px) rotate(1deg);
  }
}
@keyframes bloom {
  from {
    transform: scale(0);
  }
}
@keyframes shudder {
  25%,
  75% {
    transform: translateX(-3px);
  }
  50% {
    transform: translateX(3px);
  }
}
@keyframes foldaway {
  40% {
    transform: perspective(300px) rotateX(85deg);
  }
  to {
    transform: translateX(var(--exit)) perspective(300px) rotateX(85deg);
    opacity: 0;
  }
}
@keyframes move-arc {
  50% {
    margin-top: -12px;
  }
}
@keyframes curtain {
  50% {
    width: 52%;
  }
}
.calm *,
.calm *::before,
.calm *::after {
  animation: none !important;
  transition: none !important;
}
.calm .selected .piece {
  transform: none;
}
.calm .piece {
  transition: opacity 0.12s;
}
@media (min-width: 1600px) {
  .board-wrap {
    --size: min(740px, calc(100svh - 170px));
  }
  .stage {
    gap: 40px;
  }
}
@media (max-width: 1100px) and (min-width: 761px) {
  .theatre {
    padding: 76px 16px 18px;
  }
  .stage {
    grid-template-columns: 150px auto 160px;
    gap: 16px;
  }
  .board-wrap {
    --size: min(600px, calc(100svh - 126px), calc(100vw - 410px));
  }
  .puppet {
    width: 130px;
    height: 130px;
  }
  .wing h1 {
    font-size: 28px;
  }
  .prompt {
    font-size: 14px;
    min-height: 90px;
  }
}
@media (max-height: 590px) and (min-width: 600px) {
  .theatre {
    padding: 60px 8px 3px;
  }
  .stage {
    grid-template-columns: 110px auto 160px;
    gap: 12px;
  }
  .board-wrap {
    --size: min(calc(100svh - 73px), calc(100vw - 326px));
    padding: 4px;
    border-width: 1px;
  }
  .coordinate {
    color: #321709;
  }
  .coord-file {
    text-align: right;
    padding-right: 2px;
  }
  .wing {
    gap: 5px;
  }
  .puppet {
    width: 90px;
    height: 90px;
  }
  .wing h1 {
    font-size: 27px;
  }
  .wing h2 {
    font-size: 20px;
  }
  .prompt {
    min-height: 70px;
    padding: 8px;
    font-size: 13px;
  }
  .device-note {
    font-size: 10px;
  }
  .controls {
    gap: 5px;
  }
  .programme {
    padding: 18px 35px;
  }
  .programme h2 {
    font-size: 38px;
  }
  .programme .subtitle {
    margin-bottom: 10px;
  }
  .programme .credit {
    margin-top: 8px;
  }
  .bill-button {
    min-height: 54px;
    padding: 8px;
  }
}
@media (max-height: 590px) and (min-width: 600px) {
  .programme:has(.puppet-grid) {
    padding: 14px 24px;
  }
  .programme:has(.puppet-grid) .eyebrow {
    display: none;
  }
  .programme:has(.puppet-grid) h2 {
    font-size: 28px;
    margin: 0;
  }
  .programme:has(.puppet-grid) h3 {
    font-size: 18px;
    margin: 4px 0;
  }
  .puppet-choice {
    min-height: 80px;
    padding: 1px;
  }
  .puppet-choice .puppet {
    width: 60px;
    height: 60px;
    margin: auto;
  }
  .plays-like {
    min-height: 32px;
    font-size: 12px;
    line-height: 1.3;
    margin: 5px 0;
  }
  .side-choices {
    margin: 6px 0;
  }
  .side-choices button {
    padding: 3px 10px;
  }
  .programme .bill-button.primary {
    min-height: 44px;
    padding: 6px 16px;
  }
}
@media (max-width: 760px) and (min-height: 591px) {
  .theatre {
    padding: 70px 8px 20px;
    display: block;
    background-size: auto 100%;
  }
  .wing-art {
    display: block;
    top: 60px;
    bottom: 0;
    width: 16px;
    background: var(--stage-art) left top / auto 100%;
  }
  .wing-art.left {
    left: 0;
  }
  .wing-art.right {
    right: 0;
    background-position: right top;
  }
  .stage {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .wing {
    width: min(100%, 510px);
    gap: 7px;
  }
  .opponent {
    flex-direction: row;
    justify-content: center;
    min-height: 50px;
  }
  .opponent .puppet {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }
  .opponent h1,
  .opponent .eyebrow,
  .opponent .depth {
    display: none;
  }
  .opponent h2 {
    font-size: 21px;
  }
  .opponent .status {
    font-size: 12px;
  }
  .opponent .fallen {
    width: auto;
    flex: 1;
    justify-content: flex-end;
  }
  .board-wrap {
    --size: min(calc(100vw - 16px), 500px);
    padding: 0;
    border: 0;
  }
  .coordinate {
    color: #321709;
    z-index: 5;
    font-size: 10px;
  }
  .coord-file {
    bottom: 1px;
    width: 12.5%;
    text-align: right;
    padding-right: 2px;
  }
  .coord-rank {
    left: 2px;
    align-items: start;
    height: 12.5%;
    padding-top: 2px;
  }
  .your-wing {
    gap: 8px;
  }
  .prompt {
    min-height: 72px;
    padding: 10px 12px;
    font-size: 16px;
  }
  .controls {
    display: flex;
    justify-content: center;
  }
  .controls .stage-button {
    flex: 1;
    padding: 8px 9px;
  }
  .turn-switch {
    display: none;
  }
  .bill-turn {
    display: flex;
    color: #351b19;
    justify-content: center;
  }
  .programme {
    padding: 28px 23px;
    max-height: calc(100svh - 90px);
  }
  .programme h2 {
    font-size: 44px;
  }
  .menu-grid {
    grid-template-columns: 1fr;
  }
  .bill-button {
    min-height: 60px;
  }
  .puppet-grid {
    grid-template-columns: repeat(4, 1fr);
  }
  .puppet-choice {
    min-height: 82px;
  }
  .puppet-choice .puppet {
    max-width: 70px;
    margin: auto;
  }
  .plays-like {
    min-height: 66px;
  }
  .act-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .act-grid .bill-button b {
    font-size: 16px;
  }
  .programme .subtitle {
    font-size: 15px;
    margin-bottom: 15px;
  }
}
@media (max-height: 590px) and (min-width: 600px) {
  .programme:has(.act-grid) {
    padding: 14px 24px;
  }
  .programme:has(.act-grid) .eyebrow {
    display: none;
  }
  .programme:has(.act-grid) h2 {
    font-size: 28px;
    margin: 0;
  }
  .programme:has(.act-grid) h3 {
    font-size: 18px;
    margin: 4px 0;
  }
  .act-grid .bill-button {
    min-height: 50px;
    padding: 6px;
  }
}
.board.finale::after,
.board.quiet-end::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(circle at var(--mate-x, 50%) var(--mate-y, 50%), #ffd27a22 40px, #26091a80 190px);
  animation: finale-light 0.5s ease-out;
}
.board.quiet-end::after {
  background: #26091a40;
}
@keyframes finale-light {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.rc-arr {
  min-height: 44px;
  height: 44px;
}
.move-book {
  width: 100%;
  padding: 4px 8px 8px;
  color: #351b19;
  background: #eeddbb var(--paper-art) center / 100% 100%;
  border: 1px solid #b78858;
  box-shadow: 3px 5px 9px #0005;
  text-align: left;
}
.your-wing:has(.move-book:not([hidden])) {
  gap: 6px;
}

<script>
/* Chess rules and search, written for the Curio Class paper theatre. */

    ],
    [
      -15, -10, -10, -10, -10, -10, -10, -15, -10, 8, 0, 4, 4, 0, 8, -10, -10, 6, 8, 8, 8, 8, 6, -10, -10, 0, 8, 12, 12,

      -10, -10, -10, -10, -15,
    ],
    [
      0,
      0,
      4,
      8,
      8,
      4,
      0,
      0,

    ],
    [
      -10,
      -5,
      -5,
      0,
      0,
      -5,
      -5,
      -10,
      -5,
      0,
      0,
      0,
      0,
      0,
      0,
      -5,
      ...Array(4).fill([-5, 0, 4, 4, 4, 4, 0, -5]).flat(),

      0,
      0,
      0,
      0,
      0,
      0,
      -5,
      -10,
      -5,
      -5,
      0,
      0,
      -5,
      -5,
      -10,
    ],

  const rightsMask = new Uint8Array(128).fill(15);

  rightsMask[0] = 13;
  rightsMask[7] = 14;
  rightsMask[116] = 3;
  rightsMask[112] = 7;
  rightsMask[119] = 11;

  class Position {
    constructor(fen = START) {
      this.b = new Int8Array(128);

      this.moves = new Int32Array(1024 * 256);

      this.hi = 0;

      this.eg = 0;

      this.rights = 0;
      for (let i = 0; i < 4; i++) if ((fields[2] || '').includes('KQkq'[i])) this.rights |= 1 << i;
      this.ep = fields[3] && fields[3] !== '-' ? index(fields[3]) : -1;
      this.half = +(fields[4] || 0);
      this.full = +(fields[5] || 1);
      this.stateHash();
      return this;
    }
    fen() {
      let rows = [];
      for (let r = 7; r >= 0; r--) {
        let row = '',
          empty = 0;
        for (let f = 0; f < 8; f++) {
          const p = this.b[r * 16 + f];
          if (!p) {
            empty++;
            continue;
          }
          if (empty) {
            row += empty;
            empty = 0;
          }
          row += p > 0 ? names[p].toUpperCase() : names[-p];
        }
        if (empty) row += empty;
        rows.push(row);
      }
      const rights =
        'KQkq'
          .split('')
          .filter((_, i) => this.rights & (1 << i))
          .join('') || '-';
      return (
        rows.join('/') +
        ' ' +
        (this.side > 0 ? 'w' : 'b') +
        ' ' +
        rights +
        ' ' +
        (this.ep >= 0 ? square(this.ep) : '-') +
        ' ' +
        this.half +
        ' ' +
        this.full
      );
    }
    key() {
      return (this.lo >>> 0).toString(16) + ':' + (this.hi >>> 0).toString(16);
    }
    attacks(a, t) {
      const p = this.b[a],
        k = Math.abs(p),
        dx = (t & 7) - (a & 7),
        dy = (t >> 4) - (a >> 4);
      if (k === 1) return Math.abs(dx) === 1 && dy === (p > 0 ? 1 : -1);
      if (k === 2) return Math.abs(dx) * Math.abs(dy) === 2;
      if (k === 6) return Math.max(Math.abs(dx), Math.abs(dy)) === 1;
      let step = 0;
      if ((k === 3 || k === 5) && Math.abs(dx) === Math.abs(dy) && dx !== 0) step = Math.sign(dx) + 16 * Math.sign(dy);
      if ((k === 4 || k === 5) && (dx === 0) !== (dy === 0)) step = dx === 0 ? 16 * Math.sign(dy) : Math.sign(dx);

          a += 7;
          continue;

            this.b[a + 3] === this.side * 4 &&

            !this.b[a + 2] &&

            !this.attacked(a + 2, -this.side)

            n = this.emit(base, n, a, a + 2, 0, CASTLE);
          if (
            this.rights & (2 << shift) &&
            this.b[a - 4] === this.side * 4 &&
            !this.b[a - 1] &&
            !this.b[a - 2] &&
            !this.b[a - 3] &&
            !this.attacked(a - 1, -this.side) &&
            !this.attacked(a - 2, -this.side)
          )
            n = this.emit(base, n, a, a - 2, 0, CASTLE);
        }
      }
      return n;
    }
    make(m) {
      const a = from(m),
        t = to(m),
        p = this.b[a],
        capSq = m & EP ? t - this.side * 16 : t,
        cap = this.b[capSq];
      const z = this.ply * 16,
        st = this.stack;
      st[z] = m;
      st[z + 1] = p;
      st[z + 2] = cap;
      st[z + 3] = capSq;
      st[z + 4] = this.rights;
      st[z + 5] = this.ep;
      st[z + 6] = this.half;
      st[z + 7] = this.king[0];
      st[z + 8] = this.king[1];
      st[z + 9] = this.lo;
      st[z + 10] = this.hi;
      st[z + 11] = this.mg;
      st[z + 12] = this.eg;
      st[z + 13] = this.phase;
      st[z + 14] = this.full;
      this.stateHash();
      this.change(a, 0);
      if (cap) this.change(capSq, 0);
      this.change(t, promotion(m) ? this.side * promotion(m) : p);
      if (Math.abs(p) === 6) this.king[this.side > 0 ? 0 : 1] = t;
      if (m & CASTLE) {
        const ra = t > a ? a + 3 : a - 4,
          rt = t > a ? a + 1 : a - 1;
        this.change(ra, 0);
        this.change(rt, this.side * 4);
      }
      this.rights &= rightsMask[a] & rightsMask[t];
      this.ep = Math.abs(p) === 1 && Math.abs(t - a) === 32 ? (a + t) >> 1 : -1;
      this.half = Math.abs(p) === 1 || cap ? 0 : this.half + 1;
      if (this.side < 0) this.full++;
      this.side = -this.side;
      this.ply++;
      this.stateHash();
      return !this.attacked(this.king[this.side < 0 ? 0 : 1], this.side);
    }
    unmake() {
      const z = --this.ply * 16,
        st = this.stack,
        m = st[z],
        a = from(m),
        t = to(m);
      this.side = -this.side;
      this.b[a] = st[z + 1];
      this.b[t] = 0;
      this.b[st[z + 3]] = st[z + 2];
      if (m & CASTLE) {
        this.b[t > a ? a + 3 : a - 4] = this.side * 4;
        this.b[t > a ? a + 1 : a - 1] = 0;
      }
      this.rights = st[z + 4];
      this.ep = st[z + 5];
      this.half = st[z + 6];
      this.king[0] = st[z + 7];
      this.king[1] = st[z + 8];
      this.lo = st[z + 9];
      this.hi = st[z + 10];
      this.mg = st[z + 11];
      this.eg = st[z + 12];
      this.phase = st[z + 13];
      this.full = st[z + 14];
    }

      const base = this.ply * 256,
        count = this.generate();
      for (let i = 0; i < count; i++) {
        const ok = this.make(this.moves[base + i]);
        this.unmake();

      }

    if (!fullGame() || !$('menu').hidden || document.querySelector('.rc-veil') || pendingPromotion ||
        e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input,textarea,select')) return;
    if (reviewIndex === null && B.contains(e.target) && ['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    const index = reviewIndex ?? game.history.length;
    if (!['Home', 'End', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.key === 'End') backToGame();
    else reviewAt(e.key === 'Home' ? 0 : index + (e.key === 'ArrowLeft' ? -1 : 1));
  }, true);
  $('flip').onclick = () => {
    if (reviewIndex !== null) reviewFlip = !reviewFlip;
    else flip = !flip;
    render();
    if (reviewIndex === null) save();
  };
  $('hints').onclick = () => {
    hints = !hints;
    Recess.store('hints', hints);
    render();
  };
  $('clue').onclick = clue;
  $('auto-flip').onchange = (e) => {
    if (game) {
      game.autoFlip = e.target.checked;
      save();
    }
  };
  document.addEventListener('keydown', (e) => {
    const scoreCard = document.querySelector('.rc-card');
    if (scoreCard && e.key === 'Tab') {
      const buttons = [...scoreCard.querySelectorAll('button,input')].filter(
        (node) => !node.disabled && node.getClientRects().length,
      );
      const first = buttons[0],
        last = buttons.at(-1);
      if (!scoreCard.contains(document.activeElement) || (!e.shiftKey && document.activeElement === last)) {
        e.preventDefault();
        first?.focus({ preventScroll: true });
      } else if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last?.focus({ preventScroll: true });
      }
      return;
    }
    if (
      e.ctrlKey ||
      e.metaKey ||
      e.altKey ||
      e.target.closest('input,textarea,select') ||
      pendingPromotion ||
      document.querySelector('.rc-veil')
    )
      return;
    if (!$('menu').hidden) return;
    const key = e.key.toLowerCase();
    if (key === 'p') openPlaybill();
    else if (key === 'h') $('hints').click();
    else if (key === 'f') $('flip').click();
    else if (key === 'c') clue();
  });
  Recess.start({
    id: TEST ? 'chess-test' : 'chess',
    title: 'Chess',
    score: { label: 'Moves', lower: true },
    onUndo: undo,
    onRestart: restart,
    onNext: next,
  });
  Recess.onMotion((calm) => {
    if (calm) document.querySelectorAll('.mover,.capture-ghost,.curtain-sweep').forEach((n) => n.remove());
    document.getAnimations().forEach((a) => {
      if (calm && a.effect?.target?.classList?.contains('piece')) a.cancel();
    });
  });
  hints = Recess.store('hints') !== false;
  const saved = Recess.store('session');
  if (saved?.fen) {
    game = saved;
    pos.load(saved.fen);
    flip = !!saved.flip;
    lastMove = saved.last;
    run = ['puzzle', 'daily'].includes(saved.mode) ? Recess.store('run:' + saved.key) : null;
    if (run && run.index >= saved.ids.length) game.finished = true;
    setLevel();
  }
  render();
  drawMenu();
  if (game?.finished) awardComputer();
  // Worker benchmark is quiet and independent of game state.
  try {
    const bench = workerInstance();
    bench.onmessage = (e) => {
      if (e.data.kind === 'speed') {
        Recess.store('nodesPerSecond', e.data.nps);
        bench.terminate();
      }
    };
    bench.postMessage({ kind: 'speed' });
    setTimeout(() => bench.terminate(), 1500);
  } catch {
    /* The playable modes explain a missing worker if it is needed. */
  }
  addEventListener('resize', () => {
    if (pendingPromotion) cancelPromotion();
    render();
  });
  addEventListener('pagehide', () => {
    save();
    stopWorker();
  });
  new MutationObserver(() => {
    document.querySelector('.theatre').inert = !$('menu').hidden || !!document.querySelector('.rc-veil');
    // The shared shell owns a computer win card. Add only a chess replay exit to that card.
    const row = document.querySelector('.rc-card:has(.rc-starrow) .rc-row');
    if (row && fullGame() && game.won && !row.querySelector('.chess-replay')) {
      const replay = document.createElement('button');
      replay.className = 'stage-button chess-replay';
      replay.textContent = 'Replay the moves';
      replay.onclick = () => {
        Recess.close();
        document.querySelector('.theatre').inert = false;
        reviewAt(0);
        $('move-book').open = true;
        $('review-return').focus({ preventScroll: true });
      };
      row.append(replay);
    }
  }).observe(document.body, { childList: true });
  // Test hooks are opt-in. Their scores use the isolated chess-test storage namespace.
  if (TEST) {
    window.__chess = {
      E,
      get state() {
        return { game, run, fen: pos.fen(), thinking, busy, selected };
      },
      newGame,
      startAct,
      activate,
      playMove,
      undo,
      restart,
      openPlaybill,
      closeMenu,
      load(fen) {
        stopWorker();
        cancelPending();
        if (!game) newGame('friends');
        pos.load(fen);
        game.keys = [pos.key()];
        game.history = [];
        game.finished = false;
        game.won = false;
        selected = -1;
        lastMove = null;
        closeMenu(false);
        render();
        turnPrompt();
      },
      move(uci) {
        const m = pos.legal().find((m) => E.uci(m) === uci);
        if (m === undefined) return false;
        playMove(m);
        return true;
      },
      engineMatch: async (a, b, options = {}) => {
        const workers = [workerInstance(), workerInstance()],
          p = new E.Position(),
          keys = [p.key()],
          log = [];
        let total = 0,
          max = options.maxPlies || 300;
        while (total < max && !p.result(keys)) {
          const level = p.side > 0 ? a : b;
          const w = workers[p.side > 0 ? 0 : 1];
          let choice;
          if (level < 0) {
            const ms = p.legal();
            choice = E.uci(ms[Math.floor(Math.random() * ms.length)]);
          } else
            choice = await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(Error('worker cap')), E.LEVELS[level].time + 3000);
              w.onmessage = (e) => {
                if (e.data.kind === 'move') {
                  clearTimeout(timer);
                  log.push(e.data);
                  resolve(e.data.move);
                }
              };
              w.postMessage({ token: 1, fen: p.fen(), level, past: keys.slice(0, -1), options: options.engine || {} });
            });
          if (p.move(choice) === null) throw Error('illegal worker move');
          keys.push(p.key());
          total++;
        }
        workers.forEach((w) => w.terminate());
        return { a, b, plies: total, result: p.result(keys), winner: p.result(keys) === 'mate' ? -p.side : 0, log };
      },
    };
  }
})();

</script>
