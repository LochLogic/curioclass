<body>
<header>
  <h1>Roller Coaster Rounding<small>Hilltop Park · Curio Class</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-track" aria-pressed="true">Track</button>
    <button id="m-line" aria-pressed="false">Line</button>
    <button id="m-trains" aria-pressed="false">Trains</button>
  </div>
  <button id="motion" class="icon-btn" aria-pressed="true">Motion</button>
  <button id="sound" class="icon-btn" aria-pressed="true">Sound</button>
  <button id="read" class="icon-btn">Read</button>
</header>
<main>
  <div class="stage" id="stage">
    <img class="backdrop" src="art:park-backdrop" alt="">
    <div class="park-title"><span>Welcome to</span><b>Hilltop Park</b></div><div class="pennant"></div>
    <div id="scene"></div>
    <div id="lap" hidden><img src="art:coaster-car-riders" alt="Smiling riders on their lap"><b>Open</b></div>
  </div>
  <aside class="panel" id="panel">
    <p class="hint" id="hint" aria-live="polite"></p>
    <section id="track-panel" class="mode-panel" aria-label="Track controls">
      <div class="value-row"><span class="plaque">Held number</span><output id="held">47</output></div>
      <div class="row step-row" id="step-row">
        <button class="control" id="minus-large">-10</button><button class="control" id="minus-one">-1</button>
        <button class="control" id="plus-one">+1</button><button class="control" id="plus-large">+10</button>
      </div>
      <div class="row" id="hundred-extra" hidden>
        <button class="control" id="minus-ten">-10</button><button class="control" id="plus-ten">+10</button>
      </div>
      <button id="drop">Drop ↓</button>
      <div class="row" id="track-tabs"><button class="control" id="tens" aria-pressed="true">Tens track</button>
        <button class="control" id="hundreds" aria-pressed="false">Hundreds track</button></div>
      <div class="row" id="pan-row"><button class="control" id="back-window">Back 100</button>
        <button class="control" id="ahead-window">Ahead 100</button></div>
      <button class="control" id="tricky">Tricky drop</button>
    </section>
    <section id="line-panel" class="mode-panel" aria-label="Line controls" hidden>
      <div id="line-step" class="step-label"></div>
      <div class="row" id="line-actions">
        <button class="control" id="bundle" hidden>Bundle 10</button>
        <button class="control" id="break-ten" hidden>Break strip</button>
        <button class="control" id="break-hundred" hidden>Break roll</button>
        <button class="control" id="take" hidden>Take away</button>
        <button class="control" id="next" hidden>Next column</button>
      </div>
      <div class="row" id="judge" hidden><button class="control" id="sense">Makes sense</button>
        <button class="control" id="far">Far off</button></div>
      <label class="sr" for="line-picker">Choose a Line card</label><select id="line-picker"></select>
    </section>

      if(t!==token) return;
      const p=Math.min(1,(now-start)/4000); state.lapProgress=p;
      img.style.left=Curio.reduce?'0px':`${p*Math.max(0,$('lap').clientWidth-130)}px`;
      if(p<1) frame=requestAnimationFrame(tick); else { state.lap=false; img.hidden=true; }
    };
    frame=requestAnimationFrame(tick);
  }
  function loadTrain(id) {
    stopAction(); state.trainId=id; state.trainStep=id===-1?'explore':'tens';
    if(id>=0) [state.n,state.cars]=id<7?TRAINS[id]:[2+Math.floor(Math.random()*8),2+Math.floor(Math.random()*8)];
    $('answer').value=''; $('train-picker').value=String(id); state.wrongs=0;
    updateTrains(); hint(id===-1?'Tap + or − to build trains. Each car holds ten riders.':L.tens,id===-1?null:'tens');
  }
  function trainChange(key,d) {
    if(state.trainId!==-1) return;
    stopAction(false);
    state[key]=Math.max(1,Math.min(9,state[key]+d)); updateTrains();
    Curio.tone(300+state[key]*35,.07,.04); hint('Build another array with + or −, or choose a Train card.');
  }
  function updateTrains() {
    const focused=document.activeElement.id;
    const active=state.trainId!==-1,ready=state.trainStep==='done'||!active;
    $('trains-panel').dataset.card=String(active);
    $('n-count').textContent=state.n; $('c-count').textContent=state.cars;
    for(const [id,key,d] of [['n-minus','n',-1],['n-plus','n',1],['c-minus','cars',-1],['c-plus','cars',1]]) {
      $(id).disabled=active||state[key]+d<1||state[key]+d>9;
    }
    const total=state.n*state.cars;
    const trainsWord=state.n===1?'train':'trains';
    $('chain').textContent=`${state.n} ${trainsWord} × ${state.cars} ${unit(state.cars,1)} = `+
      `${ready||state.trainStep!=='tens'?total:'?'} ${unit(total,1)} = ${ready||state.trainStep==='capacity'?total*10:'?'} seats`;
    $('capacity').hidden=state.trainStep!=='capacity';
    const frag=document.createDocumentFragment();
    const strip=document.createElement('div'); strip.className='card-strip';
    const title=active?(state.trainId>=7?'More trains':'Train '+(state.trainId+1)):'Train yard · explore';
    strip.innerHTML=`<small>${title}</small><b>${state.n} ${trainsWord} of ${state.cars*10} seats</b>`;
    if([5,6].includes(state.trainId)) strip.innerHTML+='<p>Will they carry the 278 riders?</p>';
    frag.append(strip);
    const array=document.createElement('div'); array.className='array'; array.id='train-array';
    const ratio=matchMedia('(max-width:599px)').matches ? .53 : matchMedia('(max-height:650px)').matches ? .54 : .59;
    const rowH=Math.min(85,($('stage').clientHeight*ratio-(state.n-1)*4)/state.n);
    array.style.gridTemplateRows=`repeat(${state.n},${rowH}px)`;
    for(let r=0;r<state.n;r++) {
      const row=document.createElement('div'); row.className='train-row';
      row.style.gridTemplateColumns=`repeat(${state.cars},minmax(0,1fr))`;
      for(let c=0;c<state.cars;c++) {
        const car=document.createElement('div');
        car.className='train-car'+(c===0?' lead':'')+((r*state.cars+c+1)%10===0?' tenth':'');
        car.innerHTML=`<img src="${c===0?art.lead:art.car}" alt="Car with ten seats"><b>10</b>`; row.append(car);
      }
      array.append(row);
    }
    frag.append(array);
    const label=document.createElement('div'); label.className='array-label';
    label.textContent=ready?`${total} ${unit(total,1)} = ${total*10} seats`:state.trainStep==='tens'?'Count the cars. How many tens?':
      state.trainStep==='capacity'?'278 riders are waiting. Enough seats?':`${total} tens = ? seats`;
    frag.append(label); preserveScene(()=>$('scene').replaceChildren(frag));
    const opposite={'n-plus':'n-minus','n-minus':'n-plus','c-plus':'c-minus','c-minus':'c-plus'};
    rescueFocus(focused,active?'train-picker':opposite[focused]);
  }
  function finishTrain() {
    state.trainStep='done'; if(state.trainId<7) state.completedTrains.add(state.trainId);
    updateTrains(); board();
    const seats=state.n*state.cars*10;
    hint([5,6].includes(state.trainId)?seats>=278?`${seats} seats: enough, with ${seats-278} spare. Choose another Train card.`:
      `${seats} seats: ${278-seats} riders still wait. Choose another Train card.`:'All aboard! Choose another Train card, or explore.');
    lap('trainsDone');
  }
  function capacityChoice(enough) {
    if(state.trainStep!=='capacity') return;
    if(enough!==(state.n*state.cars*10>=278)) {
      hint('Compare the seats with 278 riders. Tap Enough or Not enough.');Curio.tone(180,.1,.05);return;
    }
    finishTrain();
  }
  function submit() {
    const text=$('answer').value;
    if(!/^\d{1,4}$/.test(text)) return;
    const value=Number(text); $('answer').value='';
    if(state.mode==='track') { setHeld(value); return; }
    stopAction(false);
    if(state.mode==='line') {
      const c=state.card;
      if(state.step==='estimate') {
        if(value!==cardEstimate(c)) {
          hint(`${c.op===1?'Add':'Subtract'} the stations: ${state.rounds[0]} `+
            `${c.op===1?'and':'minus'} ${state.rounds[1]}. Type it, then Enter.`);
          Curio.tone(180,.1,.05);
          return;
        }
        Curio.yes();
        if(c.claim!==undefined) { state.step='judge'; updateLine(); hint(L.clerk,'clerk'); }
        else initColumns();
      } else if(state.step==='columns') {
        if(c.op===-1&&!state.taken) { columnHint(); return; }
        if(value!==state.counts[state.col]) {
          state.misses++; Curio.tone(180,.08,.04); updateLine();
          hint(`Not quite. Count the ${names[state.col]} again. Type it, then Enter.`); return;
        }
        state.entered=true; Curio.yes();
        if(state.col===2) finishLine(); else { updateLine(); columnHint(); }
      } else if(state.step==='fix-slip') {
        if(value!==9) {
          hint('Count the tens, including the carried strip. Type the corrected tens digit, then Enter.');
          Curio.tone(180,.1,.05);return;
        }
        state.step='done'; updateLine(); hint('391. The carried strip makes nine tens. The columns agree. Choose another card.'); lap('check');
      }
    } else if(state.trainId!==-1) {
      const total=state.n*state.cars;
      if(state.trainStep==='tens') {
        if(value===total) { state.trainStep='seats'; updateTrains(); hint(L.seats,'seats'); Curio.yes(); }
        else trainWrong(value);
      } else if(state.trainStep==='seats') {
        if(value===total*10) {
          if([5,6].includes(state.trainId)) {
            state.trainStep='capacity'; updateTrains(); hint(`${value} seats for 278 riders. Tap Enough or Not enough.`,'capacity');
          } else finishTrain();
        } else trainWrong(value);
      }
    } else hint('Choose a Train card in the picker to enter an answer.');
  }
  function trainWrong(value) {
    const total=state.n*state.cars;
    state.wrongs++;
    if(state.trainStep==='seats'&&value===total) hint(`That's the cars. Each car is ten seats: ${total} tens is how many? Type seats, then Enter.`);
    else if(state.trainStep==='seats'&&value===total*100) hint(`Too big. ${total} tens is ${Math.floor(total/10)} ${unit(Math.floor(total/10),2)} `+
      `and ${total%10} ${unit(total%10,1)}. Type seats, then Enter.`);
    else if(value===state.n+state.cars*10) hint(`That adds them. ${state.n} equal trains is ${state.n} times. Count the cars, then type it.`);
    else hint('Count the cars in one train, then the trains. Type your answer, then Enter.');
    if(state.wrongs<=2) event('again');
    Curio.tone(180,.08,.04);
  }
  function setMode(mode) {
    stopAction(); state.mode=mode; $('answer').value='';
    setKeypad(false); $('stage').dataset.mode=mode;
    for(const m of ['track','line','trains']) {
      $('m-'+m).setAttribute('aria-pressed',m===mode); $(m+'-panel').hidden=m!==mode;
    }
    if(mode==='track') { trackControls(); drawTrack(); hint(`The car is held at ${state.held}. Tap Drop to see which way it rolls.`); }
    else if(mode==='line') loadLine(state.lineId,false);
    else {
      updateTrains();
      const step=state.trainStep;
      const key=step==='tens'?'tens':step==='seats'?'seats':step==='capacity'?'capacity':step==='done'?'chooseTrain':null;
      hint(key?L[key]:'Tap + or − to build trains. Each car holds ten riders.');
      if(key) sayHow(key);
    }
    V.welcome();
    if(mode==='line') sayHow('round',()=>state.mode==='line'&&state.step==='round');
  }
  function reset() {
    stopAction();
    if(state.mode==='track') { state.p=10; setHeld(47); }
    else if(state.mode==='line') loadLine(state.lineId,true,true);
    else { state.n=6; state.cars=4; loadTrain(-1); }
  }
  for(const mode of ['track','line','trains']) $('m-'+mode).onclick=()=>setMode(mode);
  $('drop').onclick=drop;
  for(const [id,d] of [['minus-one',-1],['plus-one',1],['minus-ten',-10],['plus-ten',10]]) $(id).onclick=()=>setHeld(clamp(state.held+d));
  $('minus-large').onclick=()=>setHeld(clamp(state.held-(state.p===10?10:100)));
  $('plus-large').onclick=()=>setHeld(clamp(state.held+(state.p===10?10:100)));
  $('tens').onclick=()=>setTrack(10); $('hundreds').onclick=()=>setTrack(100);
  $('back-window').onclick=()=>setHeld(state.held-100);
  $('ahead-window').onclick=()=>setHeld(Math.min(1000,state.held+100));
  $('tricky').onclick=()=> {
    state.tricky=(state.tricky+1)%tricky.length;
    const [n,p]=tricky[state.tricky],changed=state.p!==p;
    state.p=p;setHeld(n);
    if(changed&&p===100)sayHow('hundreds',()=>state.mode==='track'&&state.p===100);
  };
  $('bundle').onclick=bundle; $('break-ten').onclick=()=>breakPiece(1); $('break-hundred').onclick=()=>breakPiece(2);
  $('take').onclick=take; $('next').onclick=nextColumn; $('sense').onclick=()=>judge(true); $('far').onclick=()=>judge(false);
  $('n-minus').onclick=()=>trainChange('n',-1); $('n-plus').onclick=()=>trainChange('n',1);
  $('c-minus').onclick=()=>trainChange('cars',-1); $('c-plus').onclick=()=>trainChange('cars',1);
  $('enough').onclick=()=>capacityChoice(true); $('not-enough').onclick=()=>capacityChoice(false);
  $('line-picker').innerHTML=[...CARDS,...CLERKS].map(c=>`<option value="${c.id}">${c.id<9?'Card '+(c.id+1):c.time}</option>`).join('')+
    '<option value="13">More riders</option>';
  $('line-picker').onchange=e=>loadLine(Number(e.target.value));
  $('train-picker').innerHTML='<option value="-1">Explore trains</option>'+TRAINS.map((_,i)=>`<option value="${i}">Train ${i+1}</option>`).join('')+
    '<option value="7">More trains</option>';
  $('train-picker').onchange=e=>loadTrain(Number(e.target.value));
  const keypad=['1','2','3','4','5','6','7','8','9','0','Back','Enter'];
  for(const key of keypad) {
    const b=document.createElement('button'); b.textContent=key; b.id='key-'+key.toLowerCase();
    if(key==='Enter') b.className='enter'; if(key==='Back') b.className='back';
    b.onclick=()=> {
      if(key==='Enter') { setKeypad(false); submit(); }
      else if(key==='Back') $('answer').value=$('answer').value.slice(0,-1);
      else if($('answer').value.length<4) $('answer').value+=key;
      Curio.tone(410,.025,.025);
    };
    $('keypad').append(b);
  }
  const closeKeys=document.createElement('button');
  closeKeys.id='close-keys'; closeKeys.className='keypad-close'; closeKeys.textContent='Close keys';
  closeKeys.onclick=()=>setKeypad(false);
  $('keypad').append(closeKeys);
  $('answer').oninput=()=> { $('answer').value=$('answer').value.replace(/\D/g,'').slice(0,4); };
  $('answer').onkeydown=e=> { if(e.key==='Enter') { e.preventDefault(); submit(); } };
  $('keys-toggle').onclick=()=> {
    setKeypad(!$('keypad').classList.contains('open'));
  };
  $('reset').onclick=reset;
  document.addEventListener('click',()=> { if(state.lap) stopAction(false); },true);
  document.addEventListener('keydown',e=> {
    if(e.key==='Escape') setKeypad(false);
  });
  document.querySelector('main').prepend($('panel'));
  $('pan-row').after($('hundred-extra'));
  Curio.onSound(on=> { $('sound').textContent='Sound'; $('sound').title=on?'Sound on':'Sound off'; });
  Curio.init({clips:"voice:*",rate:.95});
  Curio.onMotion(()=> {
    if(state.mode==='track') drawTrack();
    else if(state.mode==='line'&&state.card)preserveScene(drawLine);
  });
  new ResizeObserver(()=> {
    if($('keypad').classList.contains('open')&&!$('keys-toggle').getClientRects().length) setKeypad(false);
    if(state.mode==='track') drawTrack(); else if(state.mode==='line'&&state.card) drawLine(); else if(state.mode==='trains') updateTrains();
  }).observe($('stage'));
  window.__tool={state,setMode,allLines:V.allLines,vlog:V.log,V,round,setHeld,setTrack,loadLine,loadTrain,
    roundChoice,submit,bundle,breakPiece,take,nextColumn,judge,selectSlip,capacityChoice,drop,generateCard,
    get cardData(){return CARDS;},get clerkData(){return CLERKS;}};
  board(); setMode('track');
})();
</script>
</body>
