<body>
<header>
  <h1>Skate Park Angles<small>Build a turn. Build a park.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-park" aria-pressed="false">Park</button>
    <button id="m-spin" aria-pressed="true">Spin Deck</button>
    <button id="m-ramp" aria-pressed="false">Ramp Shop</button>
    <button id="m-log" aria-pressed="false">Jump Log</button>
  </div>
  <button id="motion" class="icon-btn" aria-pressed="true">Motion</button>
  <button id="sound" class="icon-btn" aria-pressed="true">Sound</button>
  <button id="read" class="icon-btn">Read</button>
</header>
<main>
  <section class="stage" id="stage" aria-label="Skate park workshop">
    <canvas id="canvas" tabindex="0" aria-label="Turn dial. Drag the board, or use arrow keys to turn one degree."></canvas>
    <div class="stage-tag" id="stageTag">The turn deck</div>
    <div id="stageStatus" role="status" aria-live="polite"></div>
    <div class="life"></div>
    <div id="readout" aria-live="polite"></div>
    <div id="sceneHint" hidden></div>
    <div class="compact-pager" id="compactPager" hidden>
      <button id="previous" aria-label="Previous job">‹</button><span id="pageText"></span>
      <button id="next" aria-label="Next job">›</button>
      <button id="miniTip" hidden>Rae's tip</button>
    </div>
    <button class="stage-target" id="lip" aria-label="Ramp lip. Drag or use arrow keys to bend the ramp." hidden>↕</button>
    <button class="stage-target" id="proBody" aria-label="Protractor. Drag to move, arrows move, Q and E rotate." hidden>Move</button>
    <button class="stage-target" id="proRotate" aria-label="Rotate protractor. Drag or use Q and E." hidden>↻</button>
  </section>
  <aside class="panel" id="panel" aria-label="Workshop controls"></aside>
</main>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const A = {
    'park-bg':'art:park-bg', 'ground-strip':'art:ground-strip', 'plywood-texture':'art:plywood-texture',
    'board-top':'art:board-top', 'dev-roll':'art:dev-roll', 'dev-air':'art:dev-air', 'dev-spin':'art:dev-spin',
    'dev-land':'art:dev-land', 'dev-bail':'art:dev-bail', 'dev-nod':'art:dev-nod', 'rae-portrait':'art:rae-portrait',
    'rae-point':'art:rae-point', 'mina-air':'art:mina-air', 'walt-air':'art:walt-air', 'rae-air':'art:rae-air',
    'prop-rail':'art:prop-rail', 'prop-bench':'art:prop-bench', 'prop-light':'art:prop-light',
    'prop-planter':'art:prop-planter', 'prop-bikerack':'art:prop-bikerack', 'prop-tree':'art:prop-tree',
    'scoreboard-blank':'art:scoreboard-blank'
  };
  const images = {};
  const L = {
    wSpin:"I'm Rae. This is Dev's turn dial. Drag his board around, then tap Go.",
    addHow:'Tap Add a spin to stack another turn on top.',
    wRamp:'Every ramp makes an angle with the ground. Drag the protractor onto the corner and read it.',
    scaleHow:'Start from the zero that lies on the ground. Follow that scale up to the ramp.',
    bail:"Too steep for Dev today. He's fine. Try a gentler ramp.",
    wLog:'Watch the jump, read the pole, then tap that height on the line plot.',
    plotRight:'Got it.', plotMiss:'Count the eighths up from the last number on the pole, then tap again.',
    plotShown:'I placed that one. Watch where it goes.',
    askHow:'Use the line plot. Type your answer in feet, then tap Check.',
    wPark:'Every job you finish adds a piece to the park. Tap Ride to watch Dev skate it.',
    jobHow:'Type your answer with the keypad, then tap Check.',
    sketchHow:"Drag the ramp's lip to bend it. Check it with the protractor, then tap Check.",
    right:'Nailed it.', missLog:'Use the dot heights in feet. Count eighths, then try again.',
    missAdd:'You added. The total is already known. Take the part you know away from it.',
    missHundred:'A full turn is 360 degrees, not 100. Try again.',
    missScale:"That's the other scale. This angle is smaller than a square corner. Try this new ramp.",
    missCount:"That's how many jumps. The question asks for feet. Try again.",
    missOther:"Not yet. Check Rae's tip, then try again.", shown:"Here's how I'd do it. Watch the equation.",
    sessionDone:"Session logged. It's on the scoreboard now."
  };
  const LANDMARK = {0:'0 turn',30:'1/12 turn',45:'1/8 turn',60:'1/6 turn',90:'1/4 turn',120:'1/3 turn',
    135:'3/8 turn',150:'5/12 turn',180:'1/2 turn',210:'7/12 turn',225:'5/8 turn',240:'2/3 turn',
    270:'3/4 turn',300:'5/6 turn',315:'7/8 turn',330:'11/12 turn',360:'1 full turn'};
  const TRICKS = {180:'a one-eighty, half a turn',360:'a three-sixty, a full turn',
    540:'a five-forty, one and a half turns',720:'a seven-twenty, two turns',
    900:'a nine hundred, two and a half turns. Tony Hawk landed the first one at the 1999 X Games.'};
  const DATA = [[2,3,3,4,4,4,5,3,4,2],[4,5,6,6,6,7,8,5,6,7,9,6],[6,7,8,9,9,10,11,9,12,8,9,10]];
  const SESSION = ['Low kicker','Mid kicker','Big kicker'];
  const QA = [[3/8,2,1/8],[5/8,15/4,9/8],[3/4,9/2,7/8]];
  const QTEXT = [
    ['How much higher was the highest jump than the lowest?', 'Add up all the 4/8 ft jumps. How many feet is that?',
      'How much higher was the highest jump than the most common height?'],
    ['How much higher was the highest jump than the lowest?', 'Add up all the 6/8 ft jumps. How many feet is that?',
      'Add the two lowest jumps. How many feet is that?'],
    ['How much higher was the highest jump than the lowest?', 'Add up all the 9/8 ft jumps. How many feet is that?',
      "How much higher was Big's highest jump than Low's highest?"]
  ];
  const ANSWERTEXT = [['3/8','2','1/8'],['5/8','3 6/8','9/8'],['6/8','36/8','7/8']];
  const WORK = [
    ['5/8 - 2/8 = 3/8','4/8 + 4/8 + 4/8 + 4/8 = 16/8 = 2','5/8 - 4/8 = 1/8'],
    ['9/8 - 4/8 = 5/8','6/8 + 6/8 + 6/8 + 6/8 + 6/8 = 30/8 = 3 6/8','4/8 + 5/8 = 9/8'],
    ['12/8 - 6/8 = 6/8','9/8 + 9/8 + 9/8 + 9/8 = 36/8 = 4 1/2','12/8 - 5/8 = 7/8']
  ];
  const state = {
    mode:'spin', workshop:'explore', spins:[0], savedTrick:180, ramp:20, flip:false, showAngle:false,
    pro:{x:.65,y:.75,rot:0}, job:0, variants:{spin:[0,0,0,0,0,0],ramp:[0,0,0,0,0]},
    attempts:{}, helped:{}, done:{}, jobRamp:20, session:0, logs:[null,null,null], lowOverlay:false,
    ramps:{}, running:null, runStart:0, runTotal:0, token:0, feedback:'', result:false, tip:false,
    plotReady:false, jumpStart:0, plotMisses:0, selectedDot:null, selectedRow:0,
    q:0, qAttempts:0, qHelp:false, checkBusy:false
  };
  let W=1, H=1, geo={}, raf=0, resizeQueued=false, drag=null, cardEpoch=0;
  const storageKey='curio-class-skate-park-angles-v1';
  try {
    const s=JSON.parse(localStorage.getItem(storageKey));
    if (s && s.version===1) {
      for (const k of ['done','helped','ramps']) if (s[k] && typeof s[k]==='object') state[k]=s[k];
      if (Number.isInteger(s.savedTrick)) state.savedTrick=Math.max(0,Math.min(900,s.savedTrick));
      if (Array.isArray(s.logs) && s.logs.length===3) state.logs=s.logs;
    }
  } catch {}
  const V=Curio.voice({lines:L, scope:()=>`${state.mode}:${state.workshop}:${state.job}`,
    speaks:'#test, #ride', hint:false, read:()=>[$('prompt')?.textContent,$('feedback')?.textContent,$('hint')?.textContent,
      $('readout').hidden?'':Array.from($('readout').children).map(el=>el.textContent).join('. ')].filter(Boolean).join(' '),
    welcome:()=>{
      if (state.workshop==='jobs') return null;
      if (state.mode==='spin') return total()===0?'wSpin':null;
      if (state.mode==='log') {
        const log=state.logs[state.session];
        if (log && log.dots.length===log.order.length) return log.q<3?'askHow':null;
        return 'wLog';
      }
      return {ramp:'wRamp',park:'wPark'}[state.mode];
    }
  });
  const total=()=>state.spins.reduce((a,b)=>a+b,0);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const rad=n=>n*Math.PI/180;
  const currentKey=()=>`${state.mode}-${state.job}`;
  function persist() {
    try {localStorage.setItem(storageKey,JSON.stringify({version:1,done:state.done,helped:state.helped,
      ramps:state.ramps,savedTrick:state.savedTrick,logs:state.logs}));} catch {}
  }
  function speak(key,wait=false) {return V.say(key,{hint:false,wait});}
  function how(key,needs) {V.how(key,{hint:false,needs});}
  function hint(text) {
    if ($('hint')) $('hint').textContent=text;
    $('sceneHint').textContent=text;
  }
  function feedback(text,good=false) {
    state.feedback=text;
    if ($('feedback')) { $('feedback').textContent=text; $('feedback').className=good?'good':''; }
    if (!$('sceneHint').hidden) $('sceneHint').textContent=text || $('hint')?.textContent || '';
    draw();
  }
  function stop() {
    state.token++;
    state.running=null;
    cancelAnimationFrame(raf);
    draw();
  }
  function reroll() {
    if (state.workshop==='jobs' && ['spin','ramp'].includes(state.mode)) {
      const variants=state.variants[state.mode];
      variants[state.job]=(variants[state.job]+1)%3;
      delete state.attempts[currentKey()];
    }
  }
  function setMode(mode) {
    if (!['spin','ramp','log','park'].includes(mode)) return;

    state.mode=mode; state.workshop='explore'; state.job=0;
    state.result=false; state.tip=false; state.feedback='';

      const starts=Array.from({length:56},(_,i)=>i+5).filter(a=>Math.abs(a-j.answer)>=10);

  function getJob() {
    const i=state.job, v=state.variants[state.mode][i];
    if (state.mode==='spin') {
      if (i<2) {
        const fs=i===0?['1/4','1/2','3/4']:['3/8','5/8','1/8'];
        const answers=i===0?[90,180,270]:[135,225,45];
        return {prompt:`Dev turns ${fs[v]} of a full turn. How many degrees?`,answer:answers[v],parts:[answers[v]],slices:i===0?4:8,
          worked:`${fs[v]} × 360 = ${answers[v]} degrees`,tip:`Divide 360 into ${i===0?4:8} equal pieces, then count the pieces.`};
      }
      if (i===2) {
        const degrees=[120,60,240][v];
        return {prompt:`A ${degrees} degree spin is what fraction of a full turn?`,answer:degrees/360,parts:[degrees],slices:0,
          worked:`${degrees}/360 = ${['1/3','1/6','2/3'][v]} turn`,tip:'Write the angle over 360. Equal fractions count.'};
      }
      if (i===3) {
        const parts=[[90,45],[180,90],[45,30]][v];
        return {prompt:parts.join(' + ')+' = ?',answer:parts[0]+parts[1],parts,
          worked:`${parts.join(' + ')} = ${parts[0]+parts[1]}`,tip:'Both turns sweep forward. Add their degrees.'};
      }
      const parts=i===4?[[125],[70],[200]][v]:[[150,90],[100,150],[60,70]][v];
      const whole=i===4?[180,180,360][v]:[360,360,180][v];
      const answer=whole-parts.reduce((a,b)=>a+b,0);
      return {prompt:`${parts.join(' + ')} + ? = ${whole}`,answer,parts,whole,unknown:true,
        worked:`${whole} - ${parts.join(' - ')} = ${answer}`,tip:'The whole is already known. Take away every known part.'};
    }
    if (i<3) {
      const angle=[[20,35,48],[25,40,15],[30,40,25]][i][v];
      const answer=i===2?180-angle:angle;
      return {angle,answer,left:i===1,sketch:false,
        prompt:i===2?`The bank is ${angle}°. Measure the angle behind it, between the deck and ramp.`:
          `Measure this ramp. Start at the zero on the ground.`,
        worked:i===2?`${angle} + ${answer} = 180: a straight line is a half turn.`:`The protractor reads ${answer} degrees.`,
        tip:i===2?'The deck and ground form a half turn. Subtract the bank angle from 180.':
          'Center the protractor on the corner. Read from the zero on the ground.'};
    }
    const answer=i===3?[15,25,30][v]:[20,35,40][v];
    return {answer,left:i===4,sketch:true,prompt:`Build a ${answer}° ${i===3?'kicker opening right':'bank opening left'}.`,
      worked:`Built to ${answer}°.`,tip:'Measure from the zero on the ground. Drag the lip, then check the scale.'};

  function editAnswer(key) {

  function parseAnswer(raw) {
    const s=raw.trim();
    if (/\/\s*0(?:\s|$)/.test(s)) return {error:"A fraction can't have 0 pieces."};
    if (/^\d+(?:\.\d+)?$/.test(s)) return {value:Number(s)};
    let m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m) return +m[3]===0?{error:"A fraction can't have 0 pieces."}:{value:+m[1]+(+m[2]/+m[3])};
    m=s.match(/^(\d+)\s*\/\s*(\d+)$/);
    if (m) return +m[2]===0?{error:"A fraction can't have 0 pieces."}:{value:+m[1]/+m[2]};
    return {error:'Type a number, a fraction like 3/8, or a mixed number like 1 1/8.'};
  }
  function award(key,helped,angle) {

  async function finishJob(line) {
    const token=state.token, mode=state.mode, job=state.job;

    if (token!==state.token || state.mode!==mode || state.job!==job || !state.result) return;
    const count=mode==='spin'?6:5;
    const next=Array.from({length:count},(_,i)=>(job+i+1)%count).find(i=>!state.done[`${mode}-${i}`]);
    if (next===undefined) return;

  async function check() {

    const parsed=sketch?{value:state.jobRamp}:parseAnswer($('answer').value);

    if (!Number.isFinite(parsed.value)) return;

      // Help persists even if the student leaves before the spoken explanation finishes.
      award(key,true,j.angle??j.answer);
      if (sketch) state.jobRamp=j.answer;

    if (state.mode==='spin' && state.job>=4 && n===j.whole+j.parts.reduce((a,b)=>a+b,0)) line='missAdd';

    const ground=sceneHeight-15;
    cover('ground-strip',0,0,W,sceneHeight);
    const plotBase=H-(smallQuestions?85:questions?105:55), left=38, right=W-35, step=(right-left)/12;
    const dotSpace=smallQuestions?8:H<330?12:21, dotRadius=H<330?5:7;
    geo={left,right,step,plotBase,sceneHeight,dotSpace};
    const ph=Math.min(150,sceneHeight*.42);
    const poleX=W*.86, poleBottom=ground, poleTop=ph+20;
    const poleStep=(poleBottom-poleTop)/12;
    const jumpIndex=state.running==='jump' || state.plotReady?log.dots.length:Math.max(0,log.dots.length-1);
    const height=log.order[Math.min(jumpIndex,log.order.length-1)];
    const progress=state.running==='jump'?clamp((performance.now()-state.jumpStart)/1200,0,1):1;
    const wheelsY=poleBottom-height*poleStep;
    const y=Curio.reduce?wheelsY:ground+(wheelsY-ground)*Math.sin(progress*Math.PI/2);
    const person=['dev-air','mina-air','walt-air','rae-air'][jumpIndex%4];
    const x=W*.48;
    plywood({x:W*.12,y:ground,lipX:W*.29,lipY:ground-27});
    image(person,x-ph*.45,y-ph,ph*.85,ph);
    ctx.beginPath(); ctx.roundRect(poleX-13,poleTop-30,63,poleBottom-poleTop+42,4);
    ctx.fillStyle='#f4f2eef5'; ctx.fill(); ctx.strokeStyle='#93816a'; ctx.lineWidth=1.5; ctx.stroke();
    line(poleX,poleBottom,poleX,poleBottom-poleStep*12,'#32283f',5);
    for (let i=0;i<=12;i++) {
      const yy=poleBottom-i*poleStep;
      line(poleX-8,yy,poleX+9,yy,'#32283f',i%4?1.5:3);
      if (i%4===0) text(['0','1/2','1','1 1/2'][i/4],poleX+15,yy,12,'#241a36','left');
    }
    text('ft',poleX,poleBottom-poleStep*12-17,12,'#241a36');
    line(x+ph*.35,y,poleX,y,'#9a6b00',2,[6,4]);
    const counts=Array(13).fill(0);
    const chalk=ctx.createLinearGradient(0,sceneHeight,0,H);
    chalk.addColorStop(0,'#302738'); chalk.addColorStop(1,'#231e2a');
    ctx.fillStyle=chalk; ctx.fillRect(0,sceneHeight,W,H-sceneHeight);
    for (let i=0;i<18;i++) {
      const sx=(i*139+17)%W, sy=sceneHeight+30+(i*53)%Math.max(1,H-sceneHeight-65);
      line(sx,sy,sx+28,sy-2,'#f4f2ee06');
    }
    if (state.session===2 && state.lowOverlay) {
      const low=Array(13).fill(0);
      ctx.setLineDash([2,2]);
      DATA[0].forEach(v=>{const yy=plotBase-24-(low[v]++)*dotSpace;
        ctx.beginPath(); ctx.arc(left+v*step,yy,dotRadius,0,7); ctx.strokeStyle='#bcb3c6'; ctx.lineWidth=2; ctx.stroke();});
      ctx.setLineDash([]);
    }
    log.dots.forEach((d,i)=>{
      let yy=plotBase-24-(counts[d.height]++)*dotSpace;
      let xx=left+d.height*step;
      if (i===log.dots.length-1 && state.running==='landing' && !Curio.reduce) {
        const p=clamp((performance.now()-state.runStart)/650,0,1), eased=1-(1-p)**3;
        xx=x+(xx-x)*eased;
        yy=y+(yy-y)*eased-Math.sin(p*Math.PI)*24;
      }
      ctx.beginPath(); ctx.arc(xx,yy,dotRadius,0,7);
      ctx.fillStyle=d.helped?'#27212f':'#f3bf48'; ctx.fill(); ctx.strokeStyle='#f3bf48'; ctx.lineWidth=2; ctx.stroke();
    });
    if (state.session===2 && state.lowOverlay) {
      text('Low: dashed rings',W*.26,plotBase-10,10,'#c9bcd9');
      text('Big: solid edges',W*.74,plotBase-10,10,'#c9bcd9');
    }
    line(left,plotBase,right,plotBase,'#f4f2ee',2);
    for (let i=0;i<=12;i++) {
      line(left+i*step,plotBase-7,left+i*step,plotBase+7,'#f4f2ee',2);
      if (W>600 || i%2===0) text(i===0?'0':i===8?'1':i===12?'1 1/2':`${i}/8`,left+i*step,plotBase+24,
        W<430?10:12,'#f4f2ee');
    }
    text('HEIGHT IN FEET · EACH TICK IS 1/8',W/2,H-(smallQuestions?45:questions?61:11),W<430?10:11,'#c9bcd9');
    if (H>=330) text(state.plotReady?'READ THE POLE → PLACE THE DOT':log.dots.length===log.order.length?'YOUR JUMP RECORD':'WATCH THE JUMP',
      W/2,sceneHeight+22,W<430?11:13,state.plotReady?'#f3bf48':'#d6c6e8');
    if (state.running==='miss') {
      const dx=Curio.reduce?0:Math.sin((performance.now()-state.runStart)/30)*6;
      ctx.beginPath(); ctx.arc(left+state.selectedDot*step+dx,plotBase-24,9,0,7);
      ctx.strokeStyle='#fda49c'; ctx.lineWidth=3; ctx.stroke();
    }
    if (state.selectedDot!==null && (document.activeElement===canvas || document.activeElement?.closest('.tick-nav'))) {
      ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.strokeRect(left+state.selectedDot*step-10,plotBase-14,20,28);
    }
  }
  function drawPark() {
    cover('park-bg',0,0,W,H);
    const ground=H*.78, slots=Object.entries(state.ramps).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
    const props=['rail','bench','light','planter','bikerack','tree'];
    props.forEach((p,i)=>{
      if (!state.done['spin-'+i]) return;
      const tall=p==='light'||p==='tree';
      const width=tall?W*.12:W*.14, height=tall?H*.39:H*.14;
      const propGround=H*.66;
      image('prop-'+p,W*(.03+i*.15),propGround-height,width,height);
      if (state.helped['spin-'+i]) helpTag(W*(.03+i*.15)+width/2,propGround-height-12);
    });
    slots.forEach(([id,a],i)=>{
      const x=W*(.08+i*.15), len=Math.min(W*.12,120), h=Math.sin(rad(a))*len;
      plywood({x,y:ground,lipX:x+Math.cos(rad(a))*len,lipY:ground-h});
      text(`${a}°`,x+len/2,ground+22,12,'#261738');
      if (state.helped['ramp-'+id]) helpTag(x+len/2,ground+44);
    });
    const boardW=Math.min(330,W*.43), boardH=boardW*.68, boardX=W-boardW-15, boardY=H*.08;
    image('scoreboard-blank',boardX,boardY,boardW,boardH);
    text('CREW JUMP LOG',boardX+boardW/2,boardY+boardH*.18,clamp(W/65,10,16),'#f4e5c4');
    SESSION.forEach((s,i)=>{
      const label=W<600?`${s.split(' ')[0]}: ${DATA[i].length} logged`:`${s}: ${DATA[i].length} jumps logged`;
      if (state.done['log-'+i]) text(`${label}${state.helped['log-'+i]?' *':''}`,
        boardX+boardW/2,boardY+boardH*(.32+i*.12),
        clamp(W/80,10,13),'#f4e5c4');
    });
    if ([0,1,2].some(i=>state.done['log-'+i] && state.helped['log-'+i])) {
      helpTag(boardX+boardW/2,boardY+boardH+16,true);
    }
    const t=performance.now()-state.runStart;
    if (state.running==='park') {
      const p=clamp(t/12000,0,1);
      const frame=Curio.reduce?Math.floor(p*8)/8:p;
      const x=20+frame*(W-130);
      let air=0, angle=0;
      for (let i=0;i<slots.length;i++) {
        const rx=W*(.08+i*.15), a=+slots[i][1], local=(x-rx)/Math.max(60,W*.15);
        if (local>=0 && local<=1) {
          angle=a;
          if (a>35 && local>.35) {
            image('dev-bail',rx,ground-150,130,150);
            state.running='park-bailed';
            if ($('rideResult')) $('rideResult').textContent='Bailed. Try a gentler ramp in Ramp Shop.';
            $('stageStatus').textContent='Bailed'; speak('bail'); return;
          }
          air=Math.sin(local*Math.PI)*(a<15?22:a<25?65:Math.min(125,H*.3));
        }
      }
      const last=slots.length?W*(.08+(slots.length-1)*.15):W*.7;
      const spin=x>last && x<last+W*.2;
      image(air>5 && angle>=15?'dev-air':spin?'dev-spin':'dev-roll',x,ground-air-140,110,140);
      if ((angle>=25 && air>20)||spin) {
        spinBadge(x+55,ground-air,110,140);
      }
    } else if (state.running==='park-bailed') image('dev-bail',W*.35,ground-150,130,150);
    else image('dev-roll',W*.06,ground-170,135,170);
  }
  function tick() {
    cancelAnimationFrame(raf);
    const now=performance.now(), elapsed=now-state.runStart;
    draw();
    if (state.running==='jump' && now-state.jumpStart>=1200) {
      state.running=null; state.plotReady=true; updateLog(); draw(); return;
    }
    if (state.running==='spin' && elapsed>=Math.max(600,state.runTotal/360*1500)) {
      state.running=null; Curio.tone(720,.09,.05); draw(); return;
    }
    if (state.running==='nod' && elapsed>=550) {state.running=null; draw(); return;}
    if (state.running==='miss' && elapsed>=550) {state.running=null; draw(); return;}
    if (state.running==='landing' && elapsed>=650) {state.running=null; draw(); return;}
    if (state.running==='test') {
      if (state.ramp>35 && elapsed>=1200) {
        state.running='test-bailed'; drawRamp(); $('stageStatus').textContent='Bailed · Dev is fine';
        image('dev-bail',clamp(geo.lipX-80,0,W-150),geo.y-155,150,150); speak('bail'); return;
      }
      if (elapsed>=2400) {state.running=null; draw(); return;}
    }
    if (state.running==='park' && elapsed>=12000) {
      state.running=null;
      if ($('rideResult')) $('rideResult').textContent=`Run complete. Your ${state.savedTrick}° finish.`;
      Curio.yes(); draw(); return;
    }
    if (state.running && !state.running.endsWith('bailed') && state.running!=='answer') raf=requestAnimationFrame(tick);
  }
  function resize() {
    const rect=$('stage').getBoundingClientRect(); W=rect.width; H=rect.height;
    const ratio=Math.min(2,devicePixelRatio||1); canvas.width=Math.round(W*ratio); canvas.height=Math.round(H*ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0); draw();
  }
  function localPoint(e) {const rect=canvas.getBoundingClientRect(); return {x:e.clientX-rect.left,y:e.clientY-rect.top};}
  function pointerAngle(p,g=geo) {return Math.atan2(p.y-g.cy,p.x-g.cx)*180/Math.PI+90;}
  canvas.onpointerdown=e=>{
    const p=localPoint(e);
    if (state.mode==='spin' && state.workshop==='explore') {
      stop(); const a=pointerAngle(p); drag={type:'dial',last:a,accum:state.spins.at(-1)};
      canvas.setPointerCapture(e.pointerId); canvas.focus({preventScroll:true});
      Curio.tone(250,.04,.025); e.preventDefault();
    }
    if (state.mode==='log') {
      canvas.focus({preventScroll:true});
      const n=clamp(Math.round((p.x-geo.left)/geo.step),0,12);
      if (p.y>=geo.sceneHeight) {
        state.selectedDot=n; state.selectedRow=Math.max(0,Math.round((geo.plotBase-24-p.y)/geo.dotSpace));
        plot(n,state.selectedRow);
      }
    }
  };
  canvas.onpointermove=e=>{
    if (!drag || drag.type!=='dial') return;
    const a=pointerAngle(localPoint(e));
    let diff=a-drag.last; if (diff>180) diff-=360; if (diff<-180) diff+=360;
    drag.last=a;
    const index=state.spins.length-1, before=total()-state.spins[index];
    drag.accum=clamp(drag.accum+diff,0,900-before);
    state.spins[index]=Math.round(drag.accum);
    updateExplore(); draw();
  };
  canvas.onpointerup=()=>{
    drag=null;
    if (state.mode==='spin' && $('add')?.getAttribute('aria-disabled')==='false') how('addHow','#add');
  };
  canvas.onpointercancel=()=>{drag=null;};
  canvas.onkeydown=e=>{
    if (state.mode==='spin' && state.workshop==='explore' && e.key.startsWith('Arrow')) {
      e.preventDefault(); stop();
      const i=state.spins.length-1, prev=total()-state.spins[i];
      state.spins[i]=clamp(state.spins[i]+(['ArrowRight','ArrowUp'].includes(e.key)?1:-1)*(e.shiftKey?10:1),0,900-prev);
      updateExplore(); draw(); Curio.tone(320,.025,.02);
      if ($('add')?.getAttribute('aria-disabled')==='false' && !V.heard('addHow')) how('addHow','#add');
    }
    if (state.mode==='log') {
      if (e.key==='ArrowRight' || e.key==='ArrowLeft') {
        e.preventDefault(); state.selectedDot=clamp((state.selectedDot??0)+(e.key==='ArrowRight'?1:-1),0,12);
        $('stageStatus').textContent=`${state.selectedDot}/8 ft selected. Press Enter to place.`; draw();
      }
      if (e.key==='ArrowUp' || e.key==='ArrowDown') {
        e.preventDefault(); state.selectedRow=clamp(state.selectedRow+(e.key==='ArrowUp'?1:-1),0,4); draw();
      }
      if (e.key==='Enter' || e.key===' ') {e.preventDefault(); plot(state.selectedDot??0,state.selectedRow);}
    }
  };
  function changeRamp(p) {
    const g=rampGeo();
    const angle=clamp(Math.round(Math.atan2(g.y-p.y,(p.x-g.x)*g.direction)*180/Math.PI),5,60);
    if (state.workshop==='jobs') state.jobRamp=angle; else state.ramp=angle;
    draw();
  }
  function snap() {
    const g=rampGeo(), p=state.pro;
    if (Math.hypot(p.x*W-g.x,p.y*H-g.y)<=24 && Math.abs(p.rot)<=10) {
      p.x=g.x/W; p.y=g.y/H; p.rot=0;
      hint(L.scaleHow);
      how('scaleHow','#proBody'); Curio.tone(640,.07,.04);
    }
  }
  for (const id of ['lip','proBody','proRotate']) {
    const el=$(id);
    el.onpointerdown=e=>{
      e.preventDefault(); stop(); el.focus({preventScroll:true}); el.setPointerCapture(e.pointerId);
      const p=localPoint(e); drag={type:id,start:p,pro:{...state.pro}};
      if (id==='lip') changeRamp(p);
    };
    el.onpointermove=e=>{
      if (!drag || drag.type!==id) return;
      const p=localPoint(e);
      if (id==='lip') changeRamp(p);
      if (id==='proBody') {
        state.pro.x=clamp(drag.pro.x+(p.x-drag.start.x)/W,.05,.95);
        state.pro.y=clamp(drag.pro.y+(p.y-drag.start.y)/H,.2,.88); draw();
      }
      if (id==='proRotate') {
        const a=Math.atan2(p.y-state.pro.y*H,p.x-state.pro.x*W)*180/Math.PI+150;
        state.pro.rot=((Math.round(a)+540)%360)-180; draw();
      }
    };
    el.onpointerup=()=>{if (id!=='lip') snap(); drag=null; draw();};
    el.onpointercancel=()=>{drag=null;};
    el.onkeydown=e=>{
      if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','q','Q','e','E'].includes(e.key)) return;
      e.preventDefault(); stop();
      if (id==='lip') {
        const value=clamp((state.workshop==='jobs'?state.jobRamp:state.ramp)+
          (['ArrowUp','ArrowRight'].includes(e.key)?1:-1),5,60);
        if (state.workshop==='jobs') state.jobRamp=value; else state.ramp=value;
      } else {
        if (e.key==='ArrowLeft') state.pro.x-=2/W;
        if (e.key==='ArrowRight') state.pro.x+=2/W;
        if (e.key==='ArrowUp') state.pro.y-=2/H;
        if (e.key==='ArrowDown') state.pro.y+=2/H;
        if (e.key.toLowerCase()==='q') state.pro.rot--;
        if (e.key.toLowerCase()==='e') state.pro.rot++;
        state.pro.x=clamp(state.pro.x,.05,.95); state.pro.y=clamp(state.pro.y,.2,.88);
      }
      Curio.tone(280,.025,.02); draw();
    };
  }
  $('previous').onclick=()=>page(state.job-1); $('next').onclick=()=>page(state.job+1);
  $('miniTip').onclick=()=>{hint(getJob().tip); state.tip=true; Curio.tone(400,.05,.03);};
  for (const mode of ['park','spin','ramp','log']) $('m-'+mode).onclick=()=>setMode(mode);
  Curio.init({clips:"voice:*",rate:.95});
  Curio.onMotion(()=>draw());
  for (const [name,src] of Object.entries(A)) {
    const img=new Image(); img.onload=()=>draw(); img.src=src; images[name]=img;
  }
  new ResizeObserver(()=>{
    if (resizeQueued) return; resizeQueued=true;
    requestAnimationFrame(()=>{resizeQueued=false; resize();});
  }).observe($('stage'));
  renderPanel(); resize();
  window.__tool={state,setMode,setWorkshop,page,getJob,draw,allLines:V.allLines,vlog:V.log,
    parseAnswer,check,plot,total,DATA,QA,award,stop,ride,go,visitSession,
    get geo(){return geo;}, get vq(){return V.queue;}};
})();
</script>
</body>
