<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const L = {
    'w-lab': 'Welcome to the gym! You count the bounces, and the computer counts them too. Tap a ball. Then press Drop.',
    'tap-along': 'Every time the ball hits the floor, say bounce, and tap the hand!',
    sensor: 'The pad on the floor is a sensor. It feels every hit and tells the computer.',
    'w-ball': 'Which ball is the bounciest? Point to your guess. Then tap that ball on the card.',
    'drop-all': 'Now tap a ball and press Drop. Drop every ball, one at a time.',
    paper: 'Did you count on paper? Tap plus or minus to show your count.',
    same: 'The computer counted the same as you! Nice counting!',
    timing: 'Our totals match, but some taps did not match hits. Look at the circles. Tap Again to try.',
    paperSame: 'Our paper total matches the computer total. Tap Again to count once more.',
    corrected: 'The bouncy ball has the longest row. Compare its dots with the row you tried first.',
    fewer: 'You counted fewer than the computer. Look for the yellow circles. Those are the bounces you missed.',
    more: 'You counted more than the computer. The gray circles are extra taps.',
    fast: 'The bounces got small and fast at the end. Those are the hardest to count.',
    again: 'Again! The computer got the same number. It counts the same way every time.',
    bouncy: 'Bouncy ball: the computer counted fifteen.',
    basket: 'Basketball: the computer counted ten.',
    tennis: 'Tennis ball: the computer counted six.',
    beanbag: 'Beanbag: the computer counted one. Plop!',
    correct: "Yes! The bouncy ball has the longest row. It's the bounciest ball!",
    wrong: 'Look again. Which row is the longest? Tap it.',
    ready: 'Every ball has a count. Tap Show the chart!',
    'pick-row': 'Which ball is the bounciest? Tap its row.',
    replay: 'Tap Again to count the same ball, or tap another ball and press Drop.',
    dropping: 'Tap the hand every time the ball hits the pad.',
    totals: 'Compare the two counts. Tap Again to count the same ball once more.',
    paperFewer: 'Your paper count is fewer than the computer count. Tap Again to try the same ball.',
    paperMore: 'Your paper count is more than the computer count. Tap Again to try the same ball.',
    pickedBouncy: 'Bouncy ball. Press Drop when you are ready.',
    pickedBasket: 'Basketball. Press Drop when you are ready.',
    pickedTennis: 'Tennis ball. Press Drop when you are ready.',
    pickedBeanbag: 'Beanbag. Press Drop when you are ready.',
    slow: 'Slow is on. The same bounces play at half speed.',
    normal: 'Slow is off. The bounces play at normal speed.',
    graphBack: 'Tap a row to choose the bounciest ball. Tap Back to gym to try another drop.',
    title: 'Me vs the Counter. Who counts better?',
    privacy: 'Counts stay here, on this device.',
    fair: 'Every ball drops from the same height.',
    buttons: 'Bounce Lab. Bounciest Ball. Motion. Sound. Read. Drop. Bounce. Again. Slow. Our count. Show the chart. Start over. Skip.'
  };
  const BALLS = [
    {id:'bouncy', name:'Bouncy ball', e:.9, art:'art:ball-bouncy', pitch:780, pick:'pickedBouncy'},
    {id:'basket', name:'Basketball', e:.85, art:'art:ball-basket', pitch:350, pick:'pickedBasket'},
    {id:'tennis', name:'Tennis ball', e:.745, art:'art:ball-tennis', pitch:570, pick:'pickedTennis'},
    {id:'beanbag', name:'Beanbag', e:0, art:'art:beanbag', pitch:110, pick:'pickedBeanbag'}
  ];
  const FALL = Math.sqrt(3.6 / 9.8);
  for (const b of BALLS) {
    b.hits = [FALL];
    for (let n = 1; 2 * FALL * b.e ** n >= .25; n++) b.hits.push(b.hits.at(-1) + 2 * FALL * b.e ** n);
  }
  const fresh = () => ({ball:'bouncy', last:null, rows:{}, prediction:null, ask:true, graph:false, firstRow:null});
  const state = {mode:'lab', modes:{lab:fresh(), data:fresh()}, slow:false, running:false, time:0, taps:[],
    hitLog:[], hits:0, token:0, firstDrop:true, phase:'idle', selectedRow:null};
  const current = () => state.modes[state.mode];
  const ball = () => BALLS.find(b => b.id === current().ball);
  const V = Curio.voice({
    lines:L, scope:() => state.mode, hint:false, read:() => $('hint').textContent,
    welcome:() => {
      if (state.running) return null;
      if (state.mode === 'lab') return ['w-lab', {valid:() => state.phase === 'idle'}];
      return current().ask ? ['w-ball', {valid:() => current().ask && !state.running}] : null;
    },
    speaks:'#drop, #again, .ball-choice, .predict-ball, #skip, #chart-toggle, .graph-row'
  });
  const hint = text => { $('hint').textContent = L[text] || text; };
  const event = (key, token = state.token, extra = {}) => V.say(key, {
    valid:() => token === state.token && !state.running, hint:false, ...extra
  });
  function how(key, extra = {}) {
    const token = state.token;
    V.how(key, {hint:false, valid:() => token === state.token && !state.running, ...extra});
  }
  // Maximum in-order pairs, with minimum total gap as the tie-breaker.
  function match(hits, taps) {
    const dp = Array.from({length:hits.length + 1}, () => Array(taps.length + 1));
    function best(a, b) {
      if (!a) return b;
      return b.n > a.n || (b.n === a.n && b.gap < a.gap - 1e-10) ? b : a;
    }
    for (let i = hits.length; i >= 0; i--) {
      for (let j = taps.length; j >= 0; j--) {
        if (i === hits.length || j === taps.length) { dp[i][j] = {n:0, gap:0, pairs:[]}; continue; }
        let v = best(dp[i + 1][j], dp[i][j + 1]);
        const delta = taps[j] - hits[i];
        if (delta >= -.1500001 && delta <= .4000001) {
          const next = dp[i + 1][j + 1];
          v = best(v, {n:next.n + 1, gap:next.gap + Math.abs(delta), pairs:[[i,j], ...next.pairs]});
        }
        dp[i][j] = v;
      }
    }
    const pairs = dp[0][0].pairs;
    return {pairs, missed:hits.map((_,i) => i).filter(i => !pairs.some(p => p[0] === i)),
      extra:taps.map((_,i) => i).filter(i => !pairs.some(p => p[1] === i))};
  }
  function tallies(id, n) {
    $(id).replaceChildren();
    for (let a = 0; a < n; a += 5) {
      const g = document.createElement('span');
      const count = Math.min(5,n-a);
      g.className = 'tally-group' + (count === 5 ? ' full' : '');
      g.innerHTML = '<b></b>'.repeat(Math.min(4,count));
      $(id).append(g);
    }
  }
  function counts(me, computer) {
    $('me-number').textContent = me;
    $('counter-number').textContent = computer;
    $('paper-total').textContent = me;
    tallies('me-tallies', me);
    tallies('counter-tallies', computer);
  }
  function pulse(id) {
    $(id).classList.remove('pop');
    void $(id).offsetWidth;
    $(id).classList.add('pop');
  }
  function renderRows() {
    for (const b of BALLS) {
      const row = $('result-' + b.id);
      const tries = current().rows[b.id];
      row.querySelector('.tries').textContent = tries ? tries.map(t => t.me).join(',') : '?';
      row.querySelector('strong').textContent = tries ? tries.at(-1).count : '?';
      row.querySelector('.prediction-star').textContent = current().prediction === b.id ? '★' : '';
      $('graph-' + b.id).querySelector('.prediction-star').textContent = current().prediction === b.id ? '★' : '';
    }
    const ready = BALLS.every(b => current().rows[b.id]?.length);
    $('chart-toggle').disabled = !ready;
    $('chart-toggle').textContent = current().graph ? '↩ Back to gym' : ready ? '▥ Show the chart' : '🔒 Show the chart';
  }
  function render() {
    const c = current();
    const b = ball();
    $('stage').classList.toggle('data',state.mode === 'data');
    document.body.classList.toggle('data-mode',state.mode === 'data');
    $('mode-tools').hidden = state.mode !== 'data';
    $('result-strip').hidden = state.mode !== 'data' || c.ask || c.graph;
    $('prediction').hidden = state.mode !== 'data' || !c.ask;
    $('graph').hidden = state.mode !== 'data' || !c.graph;
    const covered = state.mode === 'data' && (c.ask || c.graph);
    for (const id of ['column','me-plate','counter-plate']) $(id).hidden = covered;
    document.querySelector('.cable').hidden = covered;
    document.querySelector('.fair').hidden = covered;
    $('timeline').hidden = state.running || !c.last || c.graph || (state.mode === 'data' && c.ask);
    $('ball').src = b.art;
    $('ball').alt = b.name;
    $('ball-label').textContent = b.name;
    $('stand').src = state.running || c.last ? 'art:drop-arm-open' : 'art:drop-arm-closed';
    for (const pick of document.querySelectorAll('.ball-choice')) {
      pick.setAttribute('aria-pressed',pick.dataset.ball === c.ball);
    }
    if (state.running) counts(state.taps.length,state.hits);
    else if (c.last) counts(c.last.me,c.last.count);
    else counts(0,0);
    $('stepper').classList.toggle('glow',!!c.last && !c.last.taps.length && !c.last.paper);
    renderRows();
    if (!$('timeline').hidden) drawTimeline();
    positionBall();
    drawCable();
  }
  function positionBall() {
    const b = ball();
    const t = state.time;
    let height = 1;
    let nearHit = false;
    if (state.running) {
      if (t < FALL) height = Math.max(0,1 - (t / FALL) ** 2);
      else {
        const i = b.hits.findLastIndex(v => v <= t);
        const next = b.hits[i + 1];
        const start = b.hits[i];
        if (next !== undefined) {
          const f = Math.min(1,(t - start) / (next - start));
          height = Curio.reduce ? (t-start < .09 ? 0 : f < .5 ? b.e ** (2 * (i+1)) : 0) :
            4 * f * (1-f) * b.e ** (2 * (i+1));
        } else height = 0;
        nearHit = t - start < .09;
      }
    } else if (current().last) height = 0;
    if (state.running && t < FALL && Curio.reduce) height = 1;
    const floor = $('column').clientHeight * .90 - $('ball').clientHeight;
    const initial = Math.max(0,$('column').clientHeight * .145 - $('ball').clientHeight * .5);
    const standWidth = $('column').clientHeight * 380 / 650;
    $('stand').style.width = standWidth + 'px';
    $('stand').style.left = ($('column').clientWidth * .55 - standWidth * .855) + 'px';
    $('ball').style.top = (initial + (1-height) * Math.max(0,floor-initial)) + 'px';
    $('ball').style.transform = !Curio.reduce && nearHit ? 'scale(1.22,.74)' : '';
    $('ball-shadow').style.opacity = .25 + .65 * (1-height);
    $('ball-shadow').style.transform = 'scale(' + (.65 + .35*height) + ')';
  }
  function drawCable() {
    const svg = document.querySelector('.cable');
    if (svg.hidden) return;
    const stage = $('stage').getBoundingClientRect();
    const pad = document.querySelector('.pad').getBoundingClientRect();
    const computer = document.querySelector('.computer').getBoundingClientRect();
    const x = pad.left - stage.left + pad.width * .88;
    const y = pad.bottom - stage.top - pad.height * .16;
    const endX = computer.left - stage.left + computer.width * .65;
    const endY = computer.bottom - stage.top - computer.height * .10;
    svg.style.left = '0';
    svg.style.top = '0';
    svg.style.width = '100%';
    svg.style.height = '100%';
    svg.setAttribute('viewBox',`0 0 ${stage.width} ${stage.height}`);
    const path = `M${x} ${y} C${x+45} ${y+25} ${endX+45} ${y+25} ${endX} ${endY}`;
    svg.querySelectorAll('path').forEach(p => p.setAttribute('d',path));
    svg.querySelectorAll('path')[1].setAttribute('transform','translate(0,-1)');
  }
  let clockAt = 0;
  function sync(now = performance.now()) {
    const next = Math.max(now,clockAt);
    if (state.running) state.time += (next-clockAt) / 1000 * (state.slow ? .5 : 1);
    clockAt = next;
  }
  function frame(now) {
    if (state.running) {
      sync(now);
      const b = ball();
      while (state.hits < b.hits.length && state.time >= b.hits[state.hits]) {
        const scheduled = b.hits[state.hits];
        state.hitLog.push({ball:b.id, index:state.hits, scheduled, actual:state.time, wall:now});
        state.hits++;
        counts(state.taps.length,state.hits);
        pulse('counter-plate');
        Curio.tone(b.pitch,.055,.12,b.e === 0 ? 'sine' : 'triangle');
        if (state.hits === 1) {
          if (V.playing === L['tap-along']) V.hush();
          else V.dropQueued(line => line.key === 'tap-along');
        }
      }
      $('lights').classList.toggle('hit', state.hits > 0 && state.time - b.hits[state.hits - 1] < .12);
      positionBall();
      if (state.time >= b.hits.at(-1) + 1) finish();
    }
    requestAnimationFrame(frame);
  }
  function start(again = false) {
    V.hush();
    state.token++;
    current().ask = false;
    current().graph = false;
    current().last = null;
    state.running = true;
    state.phase = 'running';
    state.time = 0;
    state.taps = [];
    state.hits = 0;
    state.wasAgain = again;
    state.firstDrop = false;
    $('tap').classList.remove('first-pulse');
    clockAt = performance.now();
    hint('dropping');
    render();
    const token = state.token;
    V.how('tap-along',{hint:false, valid:() => state.running && state.hits === 0 && token === state.token});
    Curio.tone(430,.045,.08);
  }
  function tap() {
    if (state.running) {
      sync();
      if (state.time <= ball().hits.at(-1) + 1) state.taps.push(state.time);
      counts(state.taps.length,state.hits);
      pulse('me-plate');
    }
    $('tap').classList.add('tap');
    clearTimeout(tap.timer);
    tap.timer = setTimeout(() => $('tap').classList.remove('tap'),110);
    Curio.tone(180,.035,.08);
  }
  function finish() {
    state.running = false;
    state.phase = 'result';
    $('lights').classList.remove('hit');
    const b = ball();
    const last = {ball:b.id, me:state.taps.length, count:b.hits.length, taps:[...state.taps], paper:false,
      matching:match(b.hits,state.taps)};
    current().last = last;
    const first = !current().rows[b.id];
    const rows = current().rows[b.id] ||= [];
    rows.push(last);
    if (rows.length > 3) rows.shift();
    render();
    pulse('counter-plate');
    const token = state.token;
    event(b.id,token);
    if (state.wasAgain) event('again',token);
    if (!last.me) {
      hint('paper');
      const keys = V.heard('sensor') ? ['paper'] : ['paper','sensor'];
      how(keys,{valid:() => token === state.token && !state.running && !last.paper, needs:'#plus'});
    } else compare();
    if (state.mode === 'data' && first && BALLS.every(x => current().rows[x.id]?.length)) {
      hint('ready');
      event('ready',token,{valid:() => token === state.token && !state.running && !current().graph, needs:'#chart-toggle'});
    }
  }
  function compare() {
    const last = current().last;
    if (!last) return;
    const key = last.me === last.count ? 'same' : last.me < last.count ? 'fewer' : 'more';
    const token = state.token;
    // Paper tallies have no timestamps, so never point at absent timeline rings.
    const fullyMatched = !last.matching.missed.length && !last.matching.extra.length;
    const spokenKey = last.paper ? (key === 'same' ? 'paperSame' : key === 'fewer' ? 'paperFewer' : 'paperMore') :
      key === 'same' && !fullyMatched ? 'timing' : key;
    event(spokenKey,token);
    teachSensor(token);
    const b = BALLS.find(x => x.id === last.ball);
    const late = !last.paper && (last.matching.missed.some(i => i >= 5) ||
      last.matching.extra.some(j => b.hits.length > 5 && last.taps[j] > b.hits[4]));
    if (key !== 'same' && late) event('fast',token);
    hint(last.paper ? 'totals' : 'replay');
  }
  function teachSensor(token) {
    if (!V.heard('sensor')) {
      how('sensor',{valid:() => token === state.token && !state.running && !current().graph && !current().ask});
    }
  }
  function paper(delta) {
    const last = current().last;
    if (!last || state.running) return;
    last.paper = true;
    last.me = Math.max(0,Math.min(30,last.me+delta));
    const compareKeys = new Set(['same','timing','paperSame','fewer','more','paperFewer','paperMore','paper','fast','sensor']);
    const oldComparePlaying = ['same','timing','paperSame','fewer','more','paperFewer','paperMore','fast'].some(k => L[k] === V.playing);
    if (oldComparePlaying) V.hush();
    else V.dropQueued(line => compareKeys.has(line.key));
    render();
    compare();
    Curio.tone(300 + last.me*12,.04,.08);
  }
  function select(id) {
    if (id === current().ball && state.phase === 'idle' && !current().ask && !current().graph) {
      Curio.tone(330,.04,.07);
      return;
    }
    const wasRunning = state.running;
    V.hush();
    state.token++;
    current().ball = id;
    current().last = null;
    current().graph = false;
    current().ask = false;
    state.time = 0;
    state.phase = 'idle';
    if (wasRunning) { start(); return; }
    render();
    hint(ball().pick);
    V.how(['tap-along',ball().pick],{hint:false, valid:() => !state.running && state.phase === 'idle', needs:'#drop'});
    Curio.tone(330,.04,.07);
  }
  function predict(id) {
    V.hush();
    state.token++;
    current().prediction = id;
    current().ask = false;
    if (id) current().ball = id;
    state.phase = 'idle';
    render();
    hint('drop-all');
    how('drop-all',{needs:'#drop'});
    if (document.activeElement.closest('#prediction')) $('drop').focus({preventScroll:true});
    Curio.tone(520,.07,.08);
  }
  function setMode(mode) {
    if (!state.modes[mode]) return;
    V.hush();
    state.token++;
    state.running = false;
    state.mode = mode;
    state.phase = current().last ? 'result' : 'idle';
    state.time = 0;
    $('lights').classList.remove('hit');
    $('m-lab').setAttribute('aria-pressed',mode === 'lab');
    $('m-data').setAttribute('aria-pressed',mode === 'data');
    render();
    if (current().graph) { hint('graphBack'); how('pick-row'); }
    else if (mode === 'data' && current().ask) { hint('w-ball'); V.welcome(); }
    else if (current().last) { hint('replay'); how('replay'); }
    else {
      const key = mode === 'lab' ? 'w-lab' : 'drop-all';
      hint(key);
      V.welcome() || how(key);
    }
  }
  function showChart() {
    if ($('chart-toggle').disabled) return;
    V.hush();
    state.token++;
    state.running = false;
    current().graph = !current().graph;
    render();
    if (current().graph) { hint('graphBack'); how('pick-row',{needs:'.graph-row'}); }
    else { hint('drop-all'); how('drop-all',{needs:'#drop'}); }
    Curio.tone(540,.06,.09);
  }
  function chooseRow(id) {
    state.selectedRow = id;
    current().firstRow ||= id;
    const correct = id === 'bouncy';
    const independent = current().firstRow === 'bouncy';
    for (const b of BALLS) {
      $('graph-' + b.id).classList.toggle('correct',correct && b.id === id);
      $('graph-' + b.id).classList.toggle('wrong',!correct && b.id === id);
    }
    V.hush();
    const key = correct ? (independent ? 'correct' : 'corrected') : 'wrong';
    event(key,state.token,{valid:() => current().graph && state.selectedRow === id});
    hint(key);
    if (correct && independent) Curio.yes();
    else Curio.tone(210,.09,.08);
  }
  function drawTimeline() {
    const last = current().last;
    if (!last) return;
    const svg = $('timeline-svg');
    const w = Math.max(180,svg.clientWidth);
    const h = Math.max(32,svg.clientHeight);
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    const left = w < 420 ? 44 : 68;
    const x = t => left + t / 10 * (w-left-14);
    const top = Math.max(8,h*.22);
    const bottom = h*.67;
    const b = BALLS.find(v => v.id === last.ball);
    const labelSize = Math.max(10,Math.min(14,h*.16));
    let out = `<text x="0" y="${top+4}" fill="#0f6e74" font-size="${labelSize}" font-weight="700">Pad</text>`;
    out += `<line x1="${left}" x2="${w-14}" y1="${top}" y2="${top}" stroke="#c4d6d2"/>`;
    if (!last.paper) {
      out += `<text x="0" y="${bottom+4}" fill="#b45309" font-size="${labelSize}" font-weight="700">Me</text>`;
      out += `<line x1="${left}" x2="${w-14}" y1="${bottom}" y2="${bottom}" stroke="#e6cfb3"/>`;
      for (const [i,j] of last.matching.pairs) {
        out += `<line x1="${x(b.hits[i])}" y1="${top}" x2="${x(last.taps[j])}" y2="${bottom}" stroke="#adbea9" stroke-width="1.5"/>`;
      }
      for (const i of last.matching.missed) {
        out += `<circle cx="${x(b.hits[i])}" cy="${top}" r="7" fill="#ffe89a" stroke="#a8750b" stroke-width="1.5"/>`;
      }
      for (let j = 0; j < last.taps.length; j++) {
        const extra = last.matching.extra.includes(j);
        out += `<path d="M${x(last.taps[j])-3} ${bottom+3}v-7m3 7v-9m3 9v-7" stroke="#b45309" stroke-width="2"/>`;
        if (extra) out += `<circle cx="${x(last.taps[j])}" cy="${bottom}" r="7" fill="none" stroke="#76716c" stroke-width="1.5"/>`;
      }
    } else {
      out += `<text x="${left}" y="${bottom}" fill="#6b5a48" font-size="${labelSize}">Paper count: ${last.me}. No tap times.</text>`;
    }
    for (const t of b.hits) out += `<path d="M${x(t)} ${top-5}v10" stroke="#0f6e74" stroke-width="2.5"/>`;
    out += `<text x="${left}" y="${h-1}" font-size="10" fill="#6b5a48">0</text>`;
    out += `<text x="${w-35}" y="${h-1}" font-size="10" fill="#6b5a48">10 s</text>`;
    svg.innerHTML = out;
    $('timeline-title').textContent = last.paper ? 'Paper count' : 'Our bounces';
    svg.setAttribute('aria-label',last.paper ? `Paper count ${last.me}. Sensor ${last.count}.` :
      `${last.matching.pairs.length} matched, ${last.matching.missed.length} missed, ${last.matching.extra.length} extra. Ten second timeline.`);
  }
  // Build controls once. Updating numbers never replaces a focused button.
  for (const b of BALLS) {
    const prediction = document.createElement('button');
    prediction.id = 'guess-' + b.id;
    prediction.className = 'predict-ball';
    prediction.setAttribute('aria-label','Predict ' + b.name);
    prediction.innerHTML = `<img src="${b.art}" alt="">`;
    prediction.onclick = () => predict(b.id);
    $('prediction-balls').append(prediction);
    const cell = document.createElement('div');
    cell.className = 'result-cell';
    cell.id = 'result-' + b.id;
    cell.innerHTML = `<img src="${b.art}" alt="${b.name}"><div><span class="prediction-star"></span>` +
      `Me: <span class="tries">?</span><br>▣ <strong>?</strong></div>`;
    $('result-strip').append(cell);
    const row = document.createElement('button');
    row.id = 'graph-' + b.id;
    row.className = 'graph-row';
    row.setAttribute('aria-label',b.name + ': ' + b.hits.length + ' dots');
    row.innerHTML = `<img src="${b.art}" alt=""><span class="prediction-star" aria-hidden="true"></span><span class="dots">` +
      b.hits.map((_,i) => `<i class="dot" style="animation-delay:${i*.045}s"></i>`).join('') +
      `</span><strong>${b.hits.length}</strong>`;
    row.onclick = () => chooseRow(b.id);
    $('graph').append(row);
  }
  $('drop').onclick = () => start();
  $('again').onclick = () => start(true);
  $('tap').onclick = tap;
  $('slow').onclick = () => {
    sync();
    state.slow = !state.slow;
    $('slow').setAttribute('aria-pressed',state.slow);
    if (!state.running) { hint(state.slow ? 'slow' : 'normal'); how(state.slow ? 'slow' : 'normal'); }
    Curio.tone(270,.055,.08);
  };
  document.querySelectorAll('.ball-choice').forEach(b => { b.onclick = () => select(b.dataset.ball); });
  $('m-lab').onclick = () => { if (state.mode !== 'lab') setMode('lab'); };
  $('m-data').onclick = () => { if (state.mode !== 'data') setMode('data'); };
  $('minus').onclick = () => paper(-1);
  $('plus').onclick = () => paper(1);
  $('skip').onclick = () => predict(null);
  $('chart-toggle').onclick = showChart;
  $('start-over').onclick = () => {
    V.hush();
    state.token++;
    state.running = false;
    state.modes.data = fresh();
    state.selectedRow = null;
    for (const b of BALLS) $('graph-' + b.id).classList.remove('correct','wrong');
    setMode('data');
    Curio.tone(260,.06,.08);
  };
  const tabOrder = ['m-lab','m-data','motion','sound','read',...BALLS.map(b => 'pick-' + b.id),
    'drop','tap','again','slow','minus','plus',...BALLS.map(b => 'graph-' + b.id),
    'chart-toggle','start-over',...BALLS.map(b => 'guess-' + b.id),'skip'];
  tabOrder.forEach((id,i) => { $(id).tabIndex = i + 1; });
  addEventListener('keydown',e => {
    if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.code === 'Space') { e.preventDefault(); tap(); }
    else if (e.code === 'KeyD') { e.preventDefault(); start(); }
  });
  new ResizeObserver(() => {
    if (!$('timeline').hidden) drawTimeline();
    positionBall();
    drawCable();
  }).observe($('stage'));
  Curio.onMotion(positionBall);
  Curio.init({clips:"voice:*",rate:.9});
  window.__tool = {state,setMode,allLines:V.allLines,vlog:V.log,match,BALLS,start,tap,
    get vq() {return V.queue;}, get last() {return current().last;}};
  setMode('lab');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
