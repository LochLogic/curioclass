<meta name="description" content="A dancer in a studio stretches, twists and curls at high, middle and low levels, then travels straight, curved and zigzag pathways that leave a ribbon on the floor. The class copies, guesses a hidden pathway by drawing it in the air, and draws new pathways for the dancer. Grades K-2 dance. Works offline.">
<!--
Levels and Pathways (Curio Class)
Grades K-2, arts (dance), module Moving Bodies (Dance). NCAS dance DA:Cr1.1.Ka, DA:Cr1.1.Kb, DA:Pr4.1.Ka, DA:Pr4.1.1a,
DA:Cr1.1.2b, DA:Re7.1.Kb, DA:Cr3.1.Kb, DA:Cr3.1.2b, DA:Pr5.1.Kb; SHAPE America S2 (movement concepts).
Teacher led on a projector or smartboard; the class stands in their own bubble space and copies.
Levels: six nonlocomotor moves (stretch, twist, bend, swing, shake, curl) at high, middle and low, plus Up and down.
Pathways: straight, curved and zigzag trips that paint a ribbon (pattern and icon show the level, never color alone).
Mystery path: the dancer travels with no ribbon; the class draws the path in the air, then names the level (8 rounds).
Draw a path: draw on the floor; the line is split into straight, curved and zigzag parts (Dance.readPath), the class
taps each numbered part to give it a level, and the dancer dances it part by part.
Sources (see notes.md): National Core Arts Standards, Dance (2014); Anne Green Gilbert, Creative Dance for All Ages,
2nd ed. (2015); Perpich Center for Arts Education, The Elements of Dance; SHAPE America Grade-Level Outcomes (2014).
Engine: kit/dance.js (docs/families/dance.md). Painted guides use a compact articulated atlas; ribbons are drawn in code.
Illustrations generated with OpenAI gpt-image, edited for Curio Class. Music and sounds are made in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->

      const b = tile(row, LVW[l], s => levelGlyph(s, l, 20, 21, 17, '#fff'), 'lv ' + l);
      b.dataset.level = l;
      b.onclick = () => tapLevel(l);
      tiles.level.push(b);
    }
  for (const row of document.querySelectorAll('[data-row="path"]'))
    for (const p of PATH_IDS) {
      const b = tile(row, cap(p), s => pathGlyph(s, p, 4, 8, 32, 24, '#00798c', 5));
      b.dataset.path = p;
      b.onclick = () => tapPath(p);
      tiles.path.push(b);
    }
  for (const row of document.querySelectorAll('[data-row="way"]'))
    for (const w of WAY_IDS) {
      const b = tile(row, cap(w), () => {});
      b.dataset.way = w;
      b.onclick = () => tapWay(w);
      tiles.way.push(b);
    }
  for (const m of MOVE_IDS) {
    const b = tile($('moves'), cap(m), () => {});
    b.dataset.move = m;
    b.onclick = () => doMove(m);
    tiles.move.push(b);
  }
  for (const p of PATH_IDS) {
    const b = tile($('y-paths'), cap(p), s => pathGlyph(s, p, 4, 8, 32, 24, '#00798c', 5));
    b.dataset.path = p;
    b.removeAttribute('aria-pressed');
    b.onclick = () => answerPath(p);
    tiles.yPath.push(b);
  }
  for (const l of LV) {
    const b = tile($('y-levels'), LVW[l], s => levelGlyph(s, l, 20, 21, 17, '#fff'), 'lv ' + l);
    b.dataset.level = l;
    b.removeAttribute('aria-pressed');
    b.onclick = () => answerLevel(l);
    tiles.yLevel.push(b);
  }
  // mini dancer poses on the move and way buttons. Each move has one fixed icon at every level: its own clearest shape
  // and a motion mark (arrows out for stretch, a turn arrow for twist, a side arc for bend, a swing arc, shake lines,
  // a round arrow for curl), so no two look alike
  const MOVE_ICON = {
    stretch: {
      pose: () => Dance.level(kf('stretch', 1), 'middle'),
      facing: 0
    },
    twist: {
      pose: () => Dance.level(kf('twist', 0), 'middle'),
      facing: 30
    },
    bend: {
      pose: () => Dance.level(kf('bend', 0), 'high'),
      facing: 0
    },
    swing: {
      pose: () => Dance.level(kf('swing', 0), 'middle'),
      facing: 0
    },
    shake: {
      pose: () => Dance.level(kf('shake', 1), 'middle'),
      facing: 0
    },
    curl: {
      pose: () => Dance.level(kf('curl', 0), 'middle'),
      facing: 20
    },
  };

  function motionMarks(svg, id) {
    const [vx, vy, vw, vh] = svg.getAttribute('viewBox').split(' ').map(Number), X = u => vx + u * vw, Y = v => vy + v * vh, sw = vw * .045;
    const g = mk('g', {
      fill: 'none',
      stroke: '#c2410c',
      'stroke-width': sw,
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round'
    }, svg);
    const head = (x, y, a) => {
      const L = vw * .07;
      mk('path', {
        d: `M ${x + L * Math.cos(a + 2.6)} ${y + L * Math.sin(a + 2.6)} L ${x} ${y} L ${x + L * Math.cos(a - 2.6)} ${y + L * Math.sin(a - 2.6)}`
      }, g);
    };
    if (id === 'stretch')
      for (const k of [-1, 1]) {
        const x0 = X(.5 + k * .36),
          x1 = X(.5 + k * .48),
          y = Y(.36);
        mk('line', {
          x1: x0,
          y1: y,
          x2: x1,
          y2: y
        }, g);
        head(x1, y, k > 0 ? 0 : Math.PI);
      }
    else if (id === 'twist') {
      mk('path', {
        d: `M ${X(.24)} ${Y(.5)} Q ${X(.5)} ${Y(.66)} ${X(.78)} ${Y(.5)}`
      }, g);
      head(X(.78), Y(.5), -.5);
    } else if (id === 'bend') {
      mk('path', {
        d: `M ${X(.78)} ${Y(.12)} Q ${X(.94)} ${Y(.3)} ${X(.86)} ${Y(.5)}`
      }, g);
      head(X(.86), Y(.5), 1.9);
    } else if (id === 'swing') {
      mk('path', {
        d: `M ${X(.12)} ${Y(.44)} Q ${X(.5)} ${Y(.86)} ${X(.88)} ${Y(.44)}`
      }, g);
      head(X(.88), Y(.44), -1);
      head(X(.12), Y(.44), Math.PI + 1);
    } else if (id === 'shake')
      for (const k of [-1, 1]) {
        const x = X(.5 + k * .4);
        mk('path', {
          d: `M ${x - vw * .04} ${Y(.42)} L ${x + vw * .04} ${Y(.5)} L ${x - vw * .04} ${Y(.58)} L ${x + vw * .04} ${Y(.66)}`
        }, g);
      }
    else if (id === 'curl') {
      mk('path', {
        d: `M ${X(.82)} ${Y(.62)} A ${vw * .36} ${vh * .36} 0 1 1 ${X(.72)} ${Y(.2)}`
      }, g);
      head(X(.72), Y(.2), -2.3);
    }
  }

  function drawMoveIcons() {
    if (drawMoveIcons.done) return;
    drawMoveIcons.done = true;
    for (const b of tiles.move) {
      const m = MOVE_ICON[b.dataset.move];
      paintDancer(Dance.icon(b._ic, m.pose(), {
        ...DCOL,
        facing: m.facing
      }), MOVE_IDS.indexOf(b.dataset.move) % 3);
      motionMarks(b._ic, b.dataset.move);
    }
  }
  for (const b of tiles.way) {
    const G = Dance.gaits[b.dataset.way],
      r = G.pose(b.dataset.way === 'slide' ? .35 : b.dataset.way === 'skip' ? .3 : .25, 1);
    paintDancer(Dance.icon(b._ic, Dance.pose(r.pose), {
      ...DCOL,
      facing: b.dataset.way === 'slide' ? 0 : 70
    }), WAY_IDS.indexOf(b.dataset.way) % 3);
  }
  const dis = (el, v) => {
    el.setAttribute('aria-disabled', v ? 'true' : 'false');
  };
  const isDis = el => el.getAttribute('aria-disabled') === 'true';

  function showPressed() {
    const dp = state.draw.parts,
      shown = state.mode === 'draw' && dp.length ? (dp.every(q => q.level === dp[0].level) ? dp[0].level : null) : state.level;
    for (const b of tiles.level) b.setAttribute('aria-pressed', b.dataset.level === shown);
    for (const b of tiles.path) b.setAttribute('aria-pressed', b.dataset.path === state.path);
    for (const b of tiles.way) b.setAttribute('aria-pressed', b.dataset.way === state.way);
    for (const b of tiles.move) b.setAttribute('aria-pressed', b.dataset.move === state.move && state.busy && state.kind === 'move');
    const ud = state.busy && state.kind === 'updown';
    for (const b of document.querySelectorAll('#c-levels .tile.lv')) dis(b, ud);
    for (const b of document.querySelectorAll('#c-draw .tile')) dis(b, state.busy);
    $('l-updown').setAttribute('aria-pressed', ud);
  }

  // ------------------------------------------------------------ the stage
  const sv = $('sv');
  const floor = Dance.floor(sv, 'studio', {
    w: 800,
    h: 500
  });
  const STUDIO_ART = 'art:sunlit-studio';
  // One compact painted rig for each guide. The kit owns motion and trails.
  // The cast changes only when entering a mode, keeping each trip's guide consistent.
  function makeStudioDancer(parent, options) {
    return paintDancer(Dance.dancer(parent, options), 0);
  }
  const G = {}; // the tool's own layers, inside the floor's
  G.mat = mk('g', {}, floor.layers.marks);
  G.star = mk('g', {}, floor.layers.marks);
  G.sparkle = mk('g', {}, floor.layers.marks);
  G.drawn = mk('g', {}, floor.layers.marks);
  for (const m of ['levels', 'paths', 'mystery', 'draw']) G['tr_' + m] = mk('g', {}, floor.layers.trail);
  G.pathLabels = mk('g', {'aria-hidden':'true'}, G.tr_paths);
  G.icons = mk('g', {}, floor.layers.trail.parentNode);
  floor.layers.trail.after(G.icons);
  G.guide = mk('g', {}, floor.layers.front);
  G.dots = mk('g', {}, floor.layers.front);
  G.ready = mk('g', {'aria-hidden':'true'}, floor.layers.front);
  let readyBeat = null;
  function drawReady(beat) {
    readyBeat = beat;
    G.ready.textContent = '';
    if (beat == null || !LAY) return;
    const r = clamp(floor.w * .025, 8, 17);
    const gap = r * 2.6;
    const cx = (LAY.counts.x + LAY.counts.w / 2);
    const cy = LAY.counts.y - r * 1.8;
    mk('rect', {x:cx-gap*2.2,y:cy-r*1.5,width:gap*4.4,height:r*3,rx:r*1.4,
      fill:'#fff8df',stroke:'#b48a29','stroke-width':2},G.ready);
    for (let i = 1; i <= 4; i++) mk('circle', {cx:cx+(i-2.5)*gap,cy,r,
      fill:i<=beat?'#ffd34d':'#fff',stroke:i===beat?'#00798c':'#b48a29',
      'stroke-width':i===beat?4:2},G.ready);
  }
  G.ink = mk('g', {}, floor.layers.front); // the line being drawn
  const counts = Dance.counts(floor.layers.front, null, {
    n: 8
  });
  const mirrorDancer = makeStudioDancer(floor.layers.mirror, {
    ...DCOL,
    floor,
    reflect: .35,
    ghost: .42,
    scale: .8
  });
  const dancer = makeStudioDancer(floor.layers.actors, {
    ...DCOL,
    floor
  });
  dancer.onMove(d => {
    mirrorDancer.scale = d.scale * .8;
  });
  dancer.onMove(d => mirrorDancer.set({
    pose: d.pose,
    x: d.x,
    z: d.z,
    facing: d.facing,
    lift: d.lift
  }));
  dancer.set({
    pose: 'stand',
    x: MAT.x,
    z: MAT.z,
    facing: 0
  });

  function setDancerVisible(show) {
    floor.layers.shadow.style.visibility = show ? '' : 'hidden';
    for (const d of [dancer, mirrorDancer]) {
      d.g.style.visibility = show ? '' : 'hidden';
      d.painted.style.visibility = show ? '' : 'hidden';
    }
  }

  let LAY = null; // the layout of the stage in pixels
  function drawStage() {
    const W = floor.w,
      H = floor.h;
    // Paint the environment at the current stage size, keeping the kit's exact floor projection and mirror clip.
    floor.layers.bg.querySelector('.studio-paint')?.remove();
    mk('image', {
      class: 'studio-paint',
      href: STUDIO_ART,
      x: 0,
      y: 0,
      width: W,
      height: H,
      preserveAspectRatio: 'none',
      'aria-hidden': 'true'
    }, floor.layers.bg);
    floor.layers.floor.style.visibility = 'hidden';
    floor.back.style.visibility = 'hidden';
    floor.deco.textContent = '';
    for (let i = 0; i < 10; i++) {
      mk('circle', {
        cx: W * (.63 + (i % 5) * .063),
        cy: H * (.08 + Math.floor(i / 5) * .12),
        r: 1.2 + i % 3,
        fill: '#fff6da',
        opacity: .5,
        class: 'studio-dust',
        style: `animation-delay:${-i * .7}s`
      }, floor.deco);
    }
    mk('rect', {
      x: 0,
      y: H - LAY.counts.h - 6,
      width: W,
      height: LAY.counts.h + 6,
      fill: '#fdf6e6',
      'fill-opacity': .93,
      stroke: '#c9aa72',
      'stroke-width': 2
    }, floor.deco);
    // the floor's projected outline for an ellipse or star given in floor units
    const fpoly = (pts) => pts.map(([x, z]) => {
      const p = floor.project(x, 0, z);
      return p[0].toFixed(1) + ',' + p[1].toFixed(1);
    }).join(' ');
    G.mat.textContent = '';
    G.star.textContent = '';
    G.sparkle.textContent = '';
    if (state.mode === 'levels') {
      const ring = r => Array.from({
        length: 48
      }, (_, i) => [MAT.x + r * Math.cos(i / 48 * 2 * Math.PI), MAT.z + r * .9 * Math.sin(i / 48 * 2 * Math.PI)]);
      mk('polygon', {
        points: fpoly(ring(11)),
        fill: '#bfe3df',
        opacity: .85,
        stroke: '#00798c',
        'stroke-width': 3,
        'stroke-dasharray': '10 7'
      }, G.mat);
      mk('polygon', {
        points: fpoly(ring(7.5)),
        fill: '#d6efec',
        opacity: .8
      }, G.mat);
    } else if (!(state.mode === 'mystery' && state.mys.gallery)) {
      const st = Array.from({
        length: 10
      }, (_, i) => {
        const r = i % 2 ? 2.1 : 5,
          a = -Math.PI / 2 + i * Math.PI / 5;
        return [STAR.x + r * Math.cos(a), STAR.z + r * Math.sin(a) * .9];
      });
      const glow = Array.from({
        length: 36
      }, (_, i) => [STAR.x + 7 * Math.cos(i / 36 * 2 * Math.PI), STAR.z + 6 * Math.sin(i / 36 * 2 * Math.PI)]);
      mk('polygon', {
        points: fpoly(glow),
        fill: '#fff3c4',
        opacity: .7
      }, G.star);
      mk('polygon', {
        points: fpoly(st),
        fill: '#f2b705',
        stroke: '#8a6100',
        'stroke-width': 2,
        'stroke-linejoin': 'round'
      }, G.star);
    }
    if (state.mode === 'mystery' && !state.mys.gallery) {
      // the magic floor: small twinkling sparkles in fixed spots
      let seed = 7;
      const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 26; i++) {
        const x = 4 + R() * 92,
          z = 3 + R() * 54,
          p = floor.project(x, 0, z),
          s = floor.scale(z) * (1 + R() * .9);
        const sp = mk('path', {
          d: `M ${p[0]} ${p[1] - s} Q ${p[0]} ${p[1]} ${p[0] + s} ${p[1]} Q ${p[0]} ${p[1]} ${p[0]} ${p[1] + s} Q ${p[0]} ${p[1]} ${p[0] - s} ${p[1]} Q ${p[0]} ${p[1]} ${p[0]} ${p[1] - s} Z`,
          fill: i % 3 ? '#ffffff' : '#ffe9a3',
          class: 'twinkle'
        }, G.sparkle);
        sp.style.animationDelay = (-R() * 2.4).toFixed(2) + 's';
      }
    }
    drawGuide();
    drawDots();
    drawParts();
    drawInk();
    counts.layout(LAY.counts);
    drawReady(readyBeat);
  }
  // the level guide on the left wall: three bands (cloud, table, grass); the band of the dancer's level glows
  function drawGuide() {
    const g = G.guide;
    const focusedLevel = document.activeElement?.classList.contains('lgband') ? document.activeElement.dataset.level : null;
    g.textContent = '';
    const {
      x,
      y,
      w,
      h
    } = LAY.guide, bh = h / 3, fs = clamp(w * .2, 11, 19);
    mk('rect', {
      x: x - 3,
      y: y - 3,
      width: w + 6,
      height: h + 6,
      rx: 12,
      fill: '#ffffff',
      stroke: '#b9d3d0',
      'stroke-width': 2
    }, g);
    LV.forEach((l, i) => {
      const on = state.shownLevel === l,
        by = y + i * bh;
      const displayOnly = state.mode === 'mystery';
      const band = mk('g', {
        class: 'lgband', role:displayOnly ? 'img' : 'button', tabindex:displayOnly ? -1 : 0,
        'aria-label':LVW[l] + ' level', 'aria-pressed':state.level === l, 'data-level':l
      }, g);
      band.onclick = e => { e.stopPropagation(); if (state.mode !== 'mystery') tapLevel(l); };
      band.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); band.onclick(e); }
      };
      band.setAttribute('aria-disabled', state.mode === 'mystery' || state.busy && state.mode === 'draw');
      band.style.cursor = state.mode === 'mystery' ? 'default' : 'pointer';
      if (!displayOnly) mk('rect', {x:x+(w-Math.max(60,w))/2,y:by,width:Math.max(60,w),height:bh,
        fill:'#fff','fill-opacity':.001,stroke:'none','pointer-events':'all'},band);
      mk('rect', {
        x,
        y: by + 2,
        width: w,
        height: bh - 4,
        rx: displayOnly ? 0 : 9,
        fill: on ? LVC[l] : displayOnly ? 'none' : '#f6fbfa',
        stroke: displayOnly ? 'none' : LVC[l],
        'stroke-width': on ? 4 : 2
      }, band);
      levelGlyph(band, l, x + w / 2, by + bh * .4, Math.min(w * .28, bh * .24), on ? '#fff' : LVC[l]);
      const t = mk('text', {
        x: x + w / 2,
        y: by + bh * .4 + Math.min(w * .28, bh * .24) + fs * 1.15,
        'text-anchor': 'middle',
        'font-size': fs,
        'font-weight': 800,
        fill: on ? '#fff' : LVC[l],
        'font-family': 'Trebuchet MS, Segoe UI, sans-serif'
      }, band);
      t.textContent = LVW[l];
      if (on) {
        mk('rect', {
          x: x - 5,
          y: by - 1,
          width: w + 10,
          height: bh + 2,
          rx: 12,
          fill: 'none',
          stroke: '#ffd34d',
          'stroke-width': 4,
          class: 'pulse-ring'
        }, band);
        const ax = x + w + 6,
          ay = by + bh / 2;
        mk('path', {
          d: `M ${ax} ${ay - 11} L ${ax + 14} ${ay} L ${ax} ${ay + 11} Z`,
          fill: LVC[l],
          stroke: '#fff',
          'stroke-width': 2
        }, band);
      }
    });
    if (focusedLevel) g.querySelector(`[data-level="${focusedLevel}"]`)?.focus({preventScroll:true});
  }

  function setShownLevel(l) {
    if (state.shownLevel === l) return;
    state.shownLevel = l;
    drawGuide();
    $('svdesc').textContent = descText();
  }
  // Mystery: 8 round dots, top right; filled for solved rounds, a ring on the current one
  function drawDots() {
    const g = G.dots;
    g.textContent = '';
    if (state.mode !== 'mystery') return;
    // two rows of four on the wall right of the mirror; with no room there, one row along the back edge of the floor
    const m = floor.mirror,
      room = m ? floor.w - (m.x + m.w) - 12 : 0;
    let r = LAY.dots.r,
      at;
    if (m && room >= 4 * 2.6 * 6) {
      r = Math.min(r, room / (4 * 2.6));
      const x0 = m.x + m.w + 6 + (room - 4 * 2.6 * r) / 2 + 1.3 * r;
      at = i => [x0 + (i % 4) * 2.6 * r, m.y + m.h * .45 + (i < 4 ? -1.35 : 1.35) * r];
    } else if (m && state.mys.gallery) {
      at = i => [m.x + m.w / 2 + (i - 3.5) * r * 2.7, m.y + m.h * .24];
    } else {
      const b0 = floor.project(50, 0, 0);
      at = i => [b0[0] + (i - 3.5) * r * 2.7, b0[1] + r * 1.7];
    }
    for (let i = 0; i < 8; i++) {
      const [cx, y] = at(i), solved = state.mys.solved[i], cur = i === state.mys.round && !state.mys.gallery;
      mk('circle', {
        cx,
        cy: y,
        r: cur ? r * 1.2 : r,
        fill: solved ? '#ffd34d' : '#ffffff',
        stroke: solved ? '#8a6100' : cur ? '#00798c' : '#9fb5b3',
        'stroke-width': cur ? 4 : 2
      }, g);
      if (solved) mk('path', {
        d: `M ${cx - r * .45} ${y} l ${r * .3} ${r * .35} l ${r * .6} ${-r * .7}`,
        fill: 'none',
        stroke: '#5b4200',
        'stroke-width': Math.max(2, r * .25),
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round'
      }, g);
    }
  }
  const descText = () => {
    if (state.mode === 'mystery' && state.mys.gallery) {
      return 'Eight pathway ribbons form a gallery on the studio floor. The dance guide bows beside them.';
    }
    const m = {
      levels: 'A dancer stands on a round mat in a dance studio.',
      paths: 'A dancer stands on a gold star at the front left of the studio floor.',
      mystery: 'The studio floor sparkles. A dancer stands on the gold star.',
      draw: 'An empty studio floor with a gold star. Draw a pathway from the star.'
    } [state.mode];
    return m + (state.shownLevel ? ` The level guide shows ${state.shownLevel} level.` : '');
  };

  // the ribbon's end badge: the pathway icon and, once known, the level icon
  function badge(path, lvl, small) {
    return (g, x, y, s) => {
      // the badge stands beside the end, on the side toward the middle of the floor, so the dancer never hides it
      const h = small ? clamp(floor.h * .045, 18, 30) : clamp(s * 5, 26, 44),
        w = lvl ? h * 2.1 : h * 1.2,
        side = small ? 0 : x > floor.w / 2 ? -1 : 1;
      const bx = x + side * (w * .5 + h * .5) - w / 2,
        by = y - h * (small ? 1.5 : 1.6);
      mk('circle', {
        cx: x,
        cy: y,
        r: Math.max(4, h * .14),
        fill: '#13282b'
      }, g);
      mk('line', {
        x1: x,
        y1: y,
        x2: bx + w / 2,
        y2: by + h,
        stroke: '#13282b',
        'stroke-width': 2.5
      }, g);
      mk('rect', {
        x: bx,
        y: by,
        width: w,
        height: h,
        rx: h / 2,
        fill: '#fff',
        stroke: lvl ? LVC[lvl] : '#c08a00',
        'stroke-width': 3
      }, g);
      pathGlyph(g, path, bx + h * .22, by + h * .28, h * .76, h * .44, lvl ? LVC[lvl] : '#8a6100', Math.max(2.5, h * .11));
      if (lvl) levelGlyph(g, lvl, bx + w - h * .62, by + h * .5, h * .36, LVC[lvl]);
    };
  }

  // ------------------------------------------------------------ runs: one dancer action at a time
  function stopRun() {
    if (S.play) S.play.stop();
    if (S.clock) S.clock.stop();
    if (S.music) S.music.stop();
    S.play = S.clock = S.music = null;
    counts.set(null);
    drawReady(null);
    G.mat.classList.remove('preparing');
    if (state.pending) {
      state.pending.remove();
      state.pending = null;
    } // a ribbon left half painted goes
    state.busy = false;
    state.traveling = false;
    state.kind = '';
  }

  function newRun(kind, keepVoice) {
    stopRun();
    if (!keepVoice) {
      if (['clear','clean','return','draw','s'].includes(kind)) {
        V.hush();
        readUntil = 0;
      } else {
        if (performance.now() < readUntil) V.dropQueued();
        else V.hush();
      }
    }
    state.run++;
    state.busy = true;
    state.kind = kind;
    G.mat.classList.toggle('preparing', kind === 'move' || kind === 'updown');
    showPressed();
    return state.run;
  }

  function endRun(tok) {
    if (!live(tok)) return;
    stopRun();
    showPressed();
    syncMystery();
  }
  // count-in, then the phrase on the clock with the tune; resolves true when it ran to its end
  async function runCounts(tok, {
    bpm,
    swing,
    phrase,
    trails,
    onCount,
    music = true,
    countIn = 4
  }) {
    if (countIn) {
      await afterRead(tok);
      if (!live(tok)) return false;
    }
    const clk = Dance.clock(bpm, {
      countIn
    });
    S.clock = clk;
    G.mat.classList.remove('preparing');
    clk.onCount((n, b) => drawReady(b.countIn ? b.beat : null));
    if (music) S.music = Dance.music({
      ...TRACK,
      swing: swing || 0
    }, clk);
    if (countIn || music) counts.bind(clk, Math.ceil(phrase.total / 8));
    if (onCount) clk.onCount((n, b) => {
      if (n <= phrase.total) onCount(n, b);
    }); // the clock ticks once past the end
    S.play = Dance.play(dancer, phrase, {
      clock: clk,
      trails: trails || []
    });
    clk.start();
    const why = await S.play.done;
    if (!live(tok)) return false;
    clk.stop();
    if (S.music) S.music.stop();
    S.clock = S.music = S.play = null;
    return why === 'end';
  }
  // walk back to a spot (the star) before a trip: a quick walk, no music, no count strip
  async function walkTo(tok, to) {
    const d = Math.hypot(dancer.x - to.x, dancer.z - to.z);
    if (d > 1) {
      const n = Math.max(2, 2 * Math.round(d / 18));
      const ok = await runCounts(tok, {
        bpm: WALK.bpm,
        countIn: 0,
        music: false,
        phrase: Dance.phrase([{
          gait: 'walk',
          counts: n,
          travel: Dance.path([
            [dancer.x, dancer.z],
            [to.x, to.z]
          ])
        }])
      });
      if (!ok) return false;
    }
    return Dance.tween(dancer, {
      pose: 'stand',
      facing: 0,
      x: to.x,
      z: to.z
    }, 300, () => live(tok));
  }

  // ------------------------------------------------------------ Levels
  // the gallery bow: a fold at the hips with the arms hanging, turned a little toward the ribbons so the fold shows from
  // the front (the kit's bow, seen straight on, hides the fold behind the head)
  const BOW = Dance.pose({
      lean: 40,
      head: 20,
      arms: [100, 80, 100, 80]
    }),
    BOW_FACING = -35;

  function movePhrase(id, levelFn, n) {
    const m = MOVES[id];
    return Dance.phrase([{
      poses: [kf(id, 0), kf(id, 1)],
      counts: n - 1,
      level: levelFn,
      dyn: m.dyn,
      at: MAT,
      facing: 0
    }, {
      poses: [kf(id, 1)],
      counts: 1,
      level: levelFn,
      dyn: 'smooth',
      at: MAT,
      facing: 0
    }]);
  }
  async function doMove(id) {
    const tok = newRun('move');
    state.move = id;
    state.lastMove = id;
    showPressed();
    const lvl0 = state.level,
      seq = [];
    dancer.set({pose: Dance.level(kf(id, 0), lvl0), facing:0, x:MAT.x, z:MAT.z});
    $('hint').textContent = L[id] + ' ' + L[atKey(lvl0)];
    await V.say([id, atKey(lvl0)], {
      now: true,
      wait: true,
      valid: () => live(tok)
    });
    if (!live(tok)) return;
    // floor to floor: pass through the curl's seated tuck so the change between two Low moves never lifts the head
    if (lvl0 === 'low' && state.shownLevel === 'low') await Dance.tween(dancer, {
      pose: Dance.level(kf('curl', 0), 'low'),
      facing: 0,
      x: MAT.x,
      z: MAT.z
    }, 250, () => live(tok));
    if (!live(tok)) return;
    setShownLevel(lvl0);
    await Dance.tween(dancer, {
      pose: Dance.level(kf(id, 0), lvl0),
      facing: 0,
      x: MAT.x,
      z: MAT.z
    }, 350, () => live(tok));
    if (!live(tok)) return;
    const levelFn = j => seq[j] || seq[seq.length - 1] || lvl0;
    const ok = await runCounts(tok, {
      bpm: 96,
      phrase: movePhrase(id, levelFn, 8),
      onCount: n => {
        if (n >= 1) {
          seq[n - 1] = state.level;
          setShownLevel(state.level);
          state.trace.push([n, state.level]);
        }
        if (n === 8) V.say('freeze', {
          valid: () => live(tok) && (state.busy || performance.now() - state.endAt < 1000)
        });
      }
    });
    if (!ok) return;
    state.endAt = performance.now();
    endRun(tok);
    V.how('wLevels', {
      valid: () => !state.busy && state.mode === 'levels'
    });
  }
  async function upDown() {
    const tok = newRun('updown');
    const id = state.lastMove,
      order = ['high', 'middle', 'low', 'middle', 'high'];
    state.move = id;
    $('hint').textContent = L.upDown;
    await V.say('upDown', {
      wait: true,
      valid: () => live(tok)
    });
    if (!live(tok)) return;
    setShownLevel('high');
    state.level = 'high';
    showPressed();
    await Dance.tween(dancer, {
      pose: Dance.level(kf(id, 0), 'high'),
      facing: 0,
      x: MAT.x,
      z: MAT.z
    }, 350, () => live(tok));
    if (!live(tok)) return;
    const ok = await runCounts(tok, {
      bpm: 96,
      phrase: movePhrase(id, j => order[Math.min(4, Math.floor(j / 8))], 40),
      onCount: n => {
        if (n >= 1) state.trace.push([n, order[Math.min(4, Math.floor((n - 1) / 8))]]); // for tests: the level of each count
        if (n >= 1 && (n - 1) % 8 === 0) {
          const l = order[(n - 1) / 8];
          state.level = l;
          setShownLevel(l);
          showPressed();
          V.say(atKey(l), {
            now: true,
            valid: () => live(tok)
          });
        }
        if (n === 40) V.say('freeze', {
          valid: () => live(tok) && (state.busy || performance.now() - state.endAt < 1000)
        });
      }
    });
    if (!ok) return;
    state.endAt = performance.now();
    endRun(tok);
    V.how('wLevels', {
      valid: () => !state.busy && state.mode === 'levels'
    });
  }

  function surprise() {
    let m, l, k = 0;
    do {
      m = MOVE_IDS[Math.floor(Math.random() * 6)];
      l = LV[Math.floor(Math.random() * 3)];
    } while (m + l === state.lastPair && ++k < 50);
    state.lastPair = m + l;
    state.level = l;
    showPressed();
    drawMoveIcons();
    doMove(m);
  }

  function tapLevel(l) {
    if (state.mode === 'draw' && state.busy) return;
    if (state.busy && state.kind === 'updown') return;
    state.level = l;
    showPressed();
    if (state.mode === 'levels') drawMoveIcons();
    V.dropQueued(x => /^at/.test(x.key) && !x.chain);
    if (state.busy && state.kind === 'move') { // takes effect on the next count
      V.say(atKey(l), {
        valid: () => state.busy && state.level === l
      });
      return;
    }
    if (state.mode === 'draw' && state.draw.parts.length) { // Draw a path: every part takes this level
      setDancerVisible(false);
      state.draw.parts.forEach(q => {
        q.level = l;
      });
      if (state.draw.ribbon && !state.busy) {
        state.draw.ribbon.remove();
        state.draw.ribbon = null;
      }
      drawParts();
      showPressed();
    }
    if (state.busy) return; // a trip: the next Go uses it
    const tok = ++state.run;
    setShownLevel(l);
    const at = state.mode === 'levels' ? MAT : {
      x: dancer.x,
      z: dancer.z
    };
    Dance.tween(dancer, {
      pose: state.mode === 'levels' ? Dance.level(kf(state.lastMove, 0), l) : restPose(l),
      facing: 0,
      ...at
    }, 450, () => live(tok));
    saySetting(atKey(l), () => state.level === l);
  }

  function settingsCue() {
    if (state.mode === 'levels') return ['chooseMove', '#moves .tile'];
    if (state.mode === 'paths') return ['pathReady', '#p-go'];
    return state.draw.parts.length ? ['danceIt', '#d-dance'] : ['wDraw', '#d-surprise'];
  }
  function saySetting(key, valid) {
    const [cue, control] = settingsCue();
    $('hint').textContent = L[cue];
    V.dropQueued();
    V.say(key, {valid, hint:false, now:true});
    V.how(cue, {
      hint:false, needs:control,
      valid:() => !state.busy && settingsCue()[0] === cue
    });
  }

  // ------------------------------------------------------------ Pathways
  function tapPath(p) {
    state.path = p;
    showPressed();
    if (state.busy) return;
    V.dropQueued();
    saySetting(p, () => state.path === p && !state.busy);
    previewPath();
  }

  function tapWay(w) {
    if (state.mode === 'draw' && state.busy) return;
    state.way = w;
    showPressed();
    if (state.busy) return;
    V.dropQueued();
    saySetting(w, () => state.way === w && !state.busy);
  }
  // a faint dashed preview of the chosen pathway on the floor (Pathways mode, while idle)
  function previewPath() {
    G.drawn.textContent = '';
    if (state.mode !== 'paths' || state.busy) return;
    const pts = PATHS[state.path].points.map(p => floor.project(p.x, 0, p.z).slice(0, 2).map(v => v.toFixed(1)).join(',')).join(' ');
    mk('polyline', {
      points: pts,
      fill: 'none',
      stroke: '#00798c',
      'stroke-width': 3,
      'stroke-dasharray': '3 9',
      'stroke-linecap': 'round',
      opacity: .55
    }, G.drawn);
  }
  const ribbons = [];
  async function pathGo() {
    const tok = newRun('trip');
    const sel = {
      path: state.path,
      way: state.way,
      level: state.level
    };
    G.drawn.textContent = '';
    if (!(await walkTo(tok, STAR)) || !live(tok)) return;
    await V.say([sel.path, sel.way], {
      wait: true,
      valid: () => live(tok)
    });
    if (!live(tok)) return;
    // up to three ribbons stay; older ones fade to half; a fourth trip clears the oldest
    if (ribbons.length >= 3) {
      ribbons.shift().remove();
      layoutPathBadges();
    }
    ribbons.forEach(r => r.fade(.5, 400));
    const tr = Dance.trail(dancer, {
      layer: G.tr_paths,
      style: sel.level
    });
    state.pending = tr;
    state.traveling = true;
    setShownLevel(sel.level);
    const ok = await runCounts(tok, {
      bpm: WAYS[sel.way].bpm,
      swing: WAYS[sel.way].swing,
      phrase: Dance.phrase([{
        gait: sel.way,
        counts: 16,
        travel: PATHS[sel.path],
        level: sel.level
      }]),
      trails: [tr]
    });
    if (!ok) return;
    state.pending = null;
    state.traveling = false;
    tr.pathLabel = sel;
    ribbons.push(tr);
    layoutPathBadges();
    await Dance.tween(dancer, {
      pose: restPose(sel.level),
      facing: 0
    }, 500, () => live(tok));
    if (!live(tok)) return;
    V.say('ribbon', {
      valid: () => live(tok) || !state.busy
    });
    endRun(tok);
    V.how('wPaths', {
      valid: () => !state.busy && state.mode === 'paths'
    });
  }
  function layoutPathBadges() {
    G.pathLabels.textContent = '';
    G.tr_paths.appendChild(G.pathLabels);
    ribbons.forEach((trail, i) => {
      const meta = trail.pathLabel;
      if (!meta) return;
      const middle = PATHS[meta.path].at(.28 + i * .25);
      const label = mk('g', {class:'dz-end path-label'}, G.pathLabels);
      cellBadge(meta.path, meta.level, middle.x, middle.z)(label);
    });
  }
  floor.onResize(layoutPathBadges);
  async function cleanFloor() {
    V.hush();
    readUntil = 0;
    if (state.busy && state.kind === 'trip') {
      newRun('clean');
      endRun(state.run);
    }
    const runAtClean = state.run;
    const old = ribbons.splice(0);
    layoutPathBadges();
    await Promise.all(old.map(r => r.fade(0, 500)));
    old.forEach(r => r.remove());
    if (state.mode !== 'paths' || state.run !== runAtClean) return;
    previewPath();
    $('hint').textContent = L.clean;
    V.say('clean', {
      valid: () => state.mode === 'paths' && !state.busy
    });
  }

  // ------------------------------------------------------------ Mystery path
  const M = state.mys;

  function syncMystery() {
    if (state.mode !== 'mystery') return;
    const R = ROUNDS[M.round],
      travel = state.busy;
    dis($('y-go'), travel || M.watched || M.gallery);
    dis($('y-again'), travel || !M.watched || M.gallery);
    $('y-again').hidden = M.gallery;
    $('y-go').hidden = M.gallery;
    $('y-paths').hidden = M.gallery;
    for (const b of tiles.yPath) {
      dis(b, travel || !M.watched || M.step !== 'path');
      b.classList.toggle('right', M.step !== 'path' && M.watched && b.dataset.path === R.path && !M.gallery);
    }
    $('y-levels').hidden = M.step === 'path' || M.step === 'go' || M.gallery;
    for (const b of tiles.yLevel) {
      dis(b, travel || M.step !== 'level');
      b.classList.toggle('right', M.step === 'solved' && b.dataset.level === R.level);
    }
    $('y-next').hidden = M.gallery;
    dis($('y-next'), travel || M.step !== 'solved');
    $('y-replay').hidden = !(M.gallery || M.round === 7 && M.step === 'solved');
    dis($('y-replay'), travel);
    drawDots();
  }
  async function mysTrip(replay) {
    const tok = newRun('mystery');
    const R = ROUNDS[M.round],
      r = M.round;
    if (!replay) M.step = 'go';
    syncMystery();
    $('hint').textContent = L.watchTrip;
    V.how('watchTrip', {hint:false, valid:() => live(tok) && state.kind === 'mystery'});
    if (!(await walkTo(tok, STAR)) || !live(tok)) return;
    const tr = replay ? null : Dance.trail(dancer, {
      layer: G.tr_mystery,
      style: 'plain',
      hidden: true
    });
    if (tr) state.pending = tr;
    state.traveling = true;
    const ok = await runCounts(tok, {
      bpm: WAYS[R.way].bpm,
      swing: WAYS[R.way].swing,
      phrase: Dance.phrase([{
        gait: R.way,
        counts: 16,
        travel: R.geo,
        level: R.level
      }]),
      trails: tr ? [tr] : []
    });
    if (!ok) return;
    state.traveling = false;
    if (tr) {
      state.pending = null;
      if (M.trails[r]) M.trails[r].remove();
      M.trails[r] = tr;
    }
    await Dance.tween(dancer, {
      pose: 'stand',
      facing: 0
    }, 450, () => live(tok));
    if (!live(tok)) return;
    M.watched = true;
    if (M.step === 'go') M.step = 'path';
    endRun(tok);
    if (M.step === 'path') V.how('askPath', {
      valid: () => M.round === r && M.step === 'path',
      needs: '#y-paths .tile'
    });
    else if (M.step === 'level') V.how('askLevel', {
      valid: () => M.round === r && M.step === 'level'
    });
  }
  async function answerPath(p) {
    const b = tiles.yPath.find(x => x.dataset.path === p);
    if (isDis(b) || M.step !== 'path') return;
    const R = ROUNDS[M.round],
      r = M.round;
    V.dropQueued();
    if (p === R.path) {
      M.step = 'level';
      Curio.yes();
      syncMystery();
      b.classList.add('glow');
      setTimeout(() => b.classList.remove('glow'), 2200);
      const tok = newRun('paint');
      const tr = M.trails[r];
      V.say('rightPath', {
        now: true,
        valid: () => M.round === r
      });
      if (tr) {
        tr.setStyle('plain');
        await tr.paintIn(1500, () => live(tok));
        // the path badge goes on only while the level is still open: a level answered during the paint has already
        // put on the full badge (and on round 8 the gallery its own), and must keep it
        if (M.round === r && M.step === 'level' && !M.gallery) tr.end(badge(R.path, null));
      }
      if (!live(tok)) return;
      endRun(tok);
      V.how('askLevel', {
        valid: () => M.round === r && M.step === 'level',
        needs: '#y-levels .tile'
      });
    } else wrong(r);
  }
  async function answerLevel(l) {
    const b = tiles.yLevel.find(x => x.dataset.level === l);
    if (isDis(b) || M.step !== 'level') return;
    const R = ROUNDS[M.round],
      r = M.round;
    // answered during the right-path paint: the paint finishes at once (paintIn shows the whole ribbon when its run
    // ends) so a fast answer then runs exactly as a slow one does, with the y-next button free for nextHow
    if (state.busy && state.kind === 'paint') {
      state.run++;
      stopRun();
      showPressed();
    }
    const keepPathReply = V.playing === L.rightPath || V.queue.some(x => x.key === 'rightPath');
    V.dropQueued(x => x.key !== 'rightPath');
    if (l === R.level) {
      M.step = 'solved';
      M.solved[r] = true;
      Curio.yes();
      const tr = M.trails[r];
      if (tr) {
        tr.setStyle(R.level);
        tr.end(badge(R.path, R.level));
      }
      setShownLevel(R.level);
      b.classList.add('glow');
      setTimeout(() => b.classList.remove('glow'), 2200);
      syncMystery();
      V.say('rightLevel', {
        kind: 'event',
        now: !keepPathReply,
        valid: () => M.round === r
      });
      if (r === 6 && !V.heard('circleCurved')) V.say([
        ['circleCurved', {kind:'how', hint:false}], ['nextHow', {kind:'how', needs:'#y-next'}]
      ], {valid:() => M.round === r && M.step === 'solved'});
      else if (r < 7) V.how('nextHow', {
        valid: () => M.round === r && M.step === 'solved',
        needs: '#y-next'
      });
      else gallery(); // round 8: the gallery starts now, its line follows the Yes
    } else wrong(r);
  }
  async function wrong(r) {
    Curio.tone(196, .4, .05, 'triangle');
    setTimeout(() => Curio.tone(165, .45, .045, 'triangle'), 180);
    const tok = newRun('wrong');
    syncMystery();
    await V.say('wrong', {
      wait: true,
      valid: () => live(tok)
    });
    if (!live(tok) || M.round !== r) return;
    mysTrip(true);
  }

  function hideMysteryRibbons() {
    M.trails.forEach(t => t && t.show(false));
  }
  async function nextRound() {
    if (isDis($('y-next'))) return;
    if (M.round >= 7) return;
    M.round++;
    M.step = 'go';
    M.watched = false;
    hideMysteryRibbons();
    setShownLevel(null);
    const tok = newRun('return'),
      r = M.round;
    syncMystery();
    drawStage();
    $('hint').textContent = L.returnStar;
    V.how('returnStar', { valid: () => live(tok) && state.kind === 'return' });
    if (!(await walkTo(tok, STAR))) return;
    endRun(tok);
    V.how('wMystery', {
      valid: () => M.round === r && M.step === 'go' && !state.busy,
      needs: '#y-go'
    });
  }
  async function gallery() {
    M.gallery = true;
    setShownLevel(null);
    const tok = newRun('gallery', true); // the Yes plays on; the gallery line follows it at once
    syncMystery();
    drawStage();
    $('hint').textContent = L.allDone;
    V.say('allDone', {
      valid: () => M.gallery
    });
    // the eight ribbons together, each in its own cell (4 across, 2 deep, x 1 to 85) with its badge at the top of the
    // cell, and the dancer bows at the right, beside them
    M.trails.forEach((t, i) => {
      if (!t) return;
      const s = .23,
        col = i % 4,
        row = Math.floor(i / 4),
        cx = 1 + col * 21,
        cz = 9 + row * 25;
      t.show(true);
      t.transform({
        s,
        ox: cx + (21 - 80 * s) / 2 - 10 * s,
        oz: cz + 2 - 8 * s
      });
      t.setStyle(ROUNDS[i].level);
      t.end(cellBadge(ROUNDS[i].path, ROUNDS[i].level, cx + 10.5, cz - .5));
    });
    await walkTo(tok, GALLERY_SPOT);
    if (!live(tok)) return;
    await Dance.tween(dancer, {
      pose: BOW,
      facing: BOW_FACING
    }, 900, () => live(tok));
    endRun(tok);
    if (live(tok)) V.how('replayHow', {needs:'#y-replay',valid:() => M.gallery && !state.busy});
  }
  // a gallery cell's badge: the pathway and level icons at the top middle of the cell, clear of its neighbours
  function cellBadge(path, lvl, fx, fz) {
    return g => {
      const p = floor.project(fx, 0, fz),
        h = clamp(floor.h * .045, 18, 28),
        w = h * 2.1,
        x = p[0] - w / 2,
        y = p[1] - h;
      mk('rect', {
        x,
        y,
        width: w,
        height: h,
        rx: h / 2,
        fill: '#fff',
        stroke: LVC[lvl],
        'stroke-width': 3
      }, g);
      pathGlyph(g, path, x + h * .22, y + h * .28, h * .76, h * .44, LVC[lvl], Math.max(2.5, h * .11));
      levelGlyph(g, lvl, x + w - h * .62, y + h * .5, h * .36, LVC[lvl]);
    };
  }

  function playAgain() {
    if (isDis($('y-replay'))) return;
    M.trails.forEach(t => t && t.remove());
    Object.assign(M, {
      round: 0,
      step: 'go',
      watched: false,
      solved: [],
      trails: [],
      gallery: false
    });
    setShownLevel(null);
    const tok = newRun('return');
    syncMystery();
    drawStage();
    walkTo(tok, STAR).then(() => {
      endRun(tok);
      V.how('wMystery', {
        valid: () => M.step === 'go' && !state.busy
      });
    });
  }

  // ------------------------------------------------------------ Draw a path: reading the line
  // Dance.readPath (kit/dance.js; the rule and its test table are in docs/families/dance.md and handoff.md) splits the
  // line into straight, curved and zigzag parts. Each part starts at the level chosen now; the class taps a part's
  // number badge to change its level.
  const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const plen = pts => pts.reduce((s, p, i) => i ? s + dist(p, pts[i - 1]) : 0, 0);

  function analyze(raw) {
    const res = Dance.readPath(raw || [], {
      start: STAR,
      floor
    });
    if (res.tooShort) return res;
    res.counts = clamp(Math.round(16 * res.length / 100), 8, 32);
    for (const p of res.parts) p.level = state.level;
    return res;
  }
  // the parts on the floor: a solid line in each part's level color, and over its middle a numbered badge (a button)
  // with the part's pathway and level icons; tapping it gives that part the next level
  function drawParts() {
    const oldBadges = [...G.icons.children];
    if (state.mode !== 'draw' || !state.draw.parts.length) {
      G.icons.textContent = '';
      if (state.mode === 'draw') G.drawn.textContent = '';
      return;
    }
    G.drawn.textContent = '';
    const P = p => floor.project(p.x, 0, p.z);
    const inkSegments = [];
    for (const part of state.draw.parts) {
      for (let i = 1; i < part.geo.length; i++) inkSegments.push([P(part.geo[i - 1]), P(part.geo[i])]);
    }
    for (const p of state.draw.parts) {
      const pts = p.geo.map(q => P(q).slice(0, 2).map(v => v.toFixed(1)).join(',')).join(' ');
      mk('polyline', {
        points: pts,
        fill: 'none',
        stroke: '#ffffff',
        'stroke-width': 9,
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round',
        opacity: .9
      }, G.drawn);
      mk('polyline', {
        points: pts,
        fill: 'none',
        stroke: LVC[p.level],
        'stroke-width': 4.5,
        'stroke-linecap': 'round',
        'stroke-linejoin': p.kind === 'zigzag' ? 'miter' : 'round'
      }, G.drawn);
    }
    const focused = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('part') ? +document
      .activeElement.dataset.i : -1;
    // Put each control directly on its own part. A small stage has no spare annotation
    // area: remote cards with routed leaders obscure the dance. No leaders are needed.
    const placed = [];
    const small = floor.w < 480;
    const plan = [];
    if (small) {
      const choices = state.draw.parts.map(p => {
        const path = Dance.path(p.geo);
        return Array.from({length:19}, (_,i) => (i+1)/20).sort((a,b)=>Math.abs(a-.5)-Math.abs(b-.5)).map(f => {
          const q = P(path.at(f));
          const cx = clamp(q[0],36,floor.w-36), cy = clamp(q[1],36,floor.h-LAY.counts.h-36);
          return {cx,cy,box:{x0:cx-32,x1:cx+32,y0:cy-32,y1:cy+32}};
        });
      });
      const overlaps = (a,b) => Math.min(a.x1,b.x1)+2 > Math.max(a.x0,b.x0) &&
        Math.min(a.y1,b.y1)+2 > Math.max(a.y0,b.y0);
      const order = state.draw.parts.map((p,i)=>({i,len:Dance.path(p.geo).length})).sort((a,b)=>a.len-b.len);
      let tries = 0;
      const pack = depth => {
        if (depth === order.length) return true;
        if (++tries > 100000) return false;
        const i = order[depth].i;
        for (const spot of choices[i]) {
          if (plan.some((o,j)=>j!==i && o && overlaps(spot.box,o.box))) continue;
          plan[i] = spot;
          if (pack(depth+1)) return true;
        }
        plan[i] = null;
        return false;
      };
      if (!pack(0)) plan.length = 0;
    }
    state.draw.parts.forEach((p, i) => {
      const path = Dance.path(p.geo);
      const s = small ? 26 : clamp(floor.scale(path.at(.5).z) * 5.2, 32, 42);
      const w = s * 2.3;
      const hw = small ? 64 : Math.max(64, w + s * .5 + 8);
      const hh = Math.max(64, s * 1.4);
      let best = null;
      for (const fraction of [.5,.35,.65,.2,.8,.1,.9]) {
        const q = P(path.at(fraction));
        const cx = clamp(q[0], hw / 2 + 4, floor.w - hw / 2 - 4);
        const cy = clamp(q[1], hh / 2 + 4, floor.h - LAY.counts.h - hh / 2 - 4);
        const box = {x0:cx-hw/2,x1:cx+hw/2,y0:cy-hh/2,y1:cy+hh/2};
        const overlap = placed.reduce((n,o) => n +
          Math.max(0,Math.min(box.x1,o.x1)-Math.max(box.x0,o.x0)) *
          Math.max(0,Math.min(box.y1,o.y1)-Math.max(box.y0,o.y0)), 0);
        const cost = overlap * 100 + Math.hypot(cx-q[0],cy-q[1]) * 10 + Math.abs(fraction-.5);
        if (!best || cost < best.cost) best = {cost,cx,cy,box};
      }
      if (plan[i]) best = plan[i];
      placed.push(best.box);
      const bx = best.cx - w / 2 + s * .25, y = best.cy;
      const g = oldBadges[i] || mk('g', {
        class:'part', role:'button', tabindex:0, 'data-i':i
      }, G.icons);
      g.textContent = '';
      g.setAttribute('aria-label', `Part ${i + 1}, ${p.kind}, ${p.level} level. Change its level`);
      mk('rect', {
        class:'hit', x:best.cx-hw/2, y:y-hh/2, width:hw, height:hh,
        rx:12, fill:'#ffffff', 'fill-opacity':.01, stroke:'none'
      }, g);
      mk('rect', {
        x: bx,
        y: y - s / 2,
        width: w,
        height: s,
        rx: s * .3,
        fill: '#fff',
        stroke: LVC[p.level],
        'stroke-width': 3
      }, g);
      pathGlyph(g, p.kind, bx + s * .32, y - s * .22, s * .9, s * .44, LVC[p.level], Math.max(3, s * .1));
      mk('line', {
        x1: bx + s * 1.36,
        y1: y - s * .32,
        x2: bx + s * 1.36,
        y2: y + s * .32,
        stroke: '#cfe3e1',
        'stroke-width': 2
      }, g);
      levelGlyph(g, p.level, bx + w - s * .48, y, s * .34, LVC[p.level]);
      mk('circle', {
        cx: bx,
        cy: y - s / 2,
        r: s * .34,
        fill: '#13282b',
        stroke: '#fff',
        'stroke-width': 2
      }, g);
      mk('text', {
        x: bx,
        y: y - s / 2 + s * .13,
        'text-anchor': 'middle',
        'font-size': Math.max(11, s * .38),
        'font-weight': 800,
        fill: '#fff',
        'font-family': 'Trebuchet MS, Segoe UI, sans-serif'
      }, g).textContent = i + 1;
      g.onclick = e => {
        e.stopPropagation();
        cyclePart(i);
      };
      g.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cyclePart(i);
        }
      };
      if (i === focused) g.focus({
        preventScroll: true
      });
    });
    oldBadges.slice(state.draw.parts.length).forEach(g => g.remove());
  }
  // the dancer's box in stage pixels (padded), so part badges can keep clear of it
  function dancerBox() {
    if (dancer.g.style.visibility === 'hidden' || !dancer.sj) return null;
    const pts = Object.values(dancer.sj);
    const pad = floor.scale(dancer.z) * dancer.height * .09 + 4;
    return {
      x0: Math.min(...pts.map(p => p[0])) - pad,
      x1: Math.max(...pts.map(p => p[0])) + pad,
      y0: Math.min(...pts.map(p => p[1])) - pad,
      y1: Math.max(...pts.map(p => p[1])) + pad
    };
  }
  // tap a part's badge: that part takes the next level (high, middle, low, high ...)
  function cyclePart(i) {
    const D = state.draw,
      p = D.parts[i];
    if (!p || state.busy) return;
    setDancerVisible(false);
    p.level = LV[(LV.indexOf(p.level) + 1) % 3];
    if (D.ribbon) {
      D.ribbon.remove();
      D.ribbon = null;
    }
    drawParts();
    showPressed();
    setShownLevel(p.level);
    saySetting(atKey(p.level), () => D.parts[i] === p);
  }

  function drawInk() {
    G.ink.textContent = '';
    const raw = state.draw.raw;
    if (!raw || raw.length < 2 || state.mode !== 'draw') return;
    mk('polyline', {
      points: raw.map(p => floor.project(p.x, 0, p.z).slice(0, 2).map(v => v.toFixed(1)).join(',')).join(' '),
      fill: 'none',
      stroke: '#13282b',
      'stroke-width': 4,
      'stroke-dasharray': '10 8',
      'stroke-linecap': 'round',
      'stroke-linejoin': 'round'
    }, G.ink);
  }

  function setDrawn(res, how) {
    setDancerVisible(false);
    V.hush();
    readUntil = 0;
    const D = state.draw;
    D.gen++;
    const gen = D.gen;
    if (D.ribbon) {
      D.ribbon.remove();
      D.ribbon = null;
    }
    if (res.tooShort) {
      D.parts = [];
      D.geo = null;
      drawParts();
      V.say('tooShort', {
        valid: () => D.gen === gen
      });
      setTimeout(() => {
        if (D.gen === gen) {
          D.raw = null;
          drawInk();
        }
      }, 1400);
      syncDraw();
      return;
    }
    D.raw = null;
    drawInk();
    D.parts = res.parts;
    D.geo = res.geo;
    D.counts = res.counts;
    drawParts();
    syncDraw();
    showPressed();
    const names = res.parts.map((p, i) => (i ? 'then' : 'first') + cap(p.kind));
    const seq = how === 'surprise' ? ['surprise', ...names] : names;
    // the names, then (once) how to change a part's level, then how to dance it
    V.say([...seq, ['tapPart', {
        kind: 'how'
      }],
      ['danceIt', {
        kind: 'how',
        needs: '#d-dance'
      }]
    ], {
      valid: () => D.gen === gen && D.parts.length > 0
    });
  }

  function syncDraw() {
    dis($('d-dance'), !state.draw.parts.length);
  }

  function allocateDrawCounts(lengths, total) {
    const sum = lengths.reduce((a, n) => a + n, 0) || 1;
    const extra = total - 2 * lengths.length;
    const quotas = lengths.map(n => extra * n / sum);
    const result = quotas.map(n => 2 + Math.floor(n));
    const order = quotas.map((n, i) => ({
        i,
        remainder: n - Math.floor(n)
      }))
      .sort((a, b) => b.remainder - a.remainder || a.i - b.i);
    const remaining = total - result.reduce((a, n) => a + n, 0);
    for (let i = 0; i < remaining; i++) result[order[i].i]++;
    return result;
  }
  async function danceIt() {
    const D = state.draw;
    if (!D.parts.length || isDis($('d-dance'))) return;
    const tok = newRun('dance'),
      gen = D.gen,
      way = state.way;
    setDancerVisible(true);
    // Share the exact 8-to-32-count budget by length, retaining at least two counts for each part.
    const parts = D.parts.map(p => ({
      kind: p.kind,
      level: p.level,
      geo: p.geo,
      len: plen(p.geo)
    }));
    const cs = allocateDrawCounts(parts.map(p => p.len), D.counts),
      cum = [0];
    cs.forEach(c => cum.push(cum[cum.length - 1] + c));
    const lvAt = c => {
      for (let i = 0; i < cs.length; i++)
        if (c < cum[i + 1]) return parts[i].level;
      return parts[parts.length - 1].level;
    };
    if (D.ribbon) {
      D.ribbon.remove();
      D.ribbon = null;
    }
    if (!(await walkTo(tok, STAR)) || !live(tok)) return;
    await V.say([way], {
      wait: true,
      valid: () => live(tok)
    });
    if (!live(tok)) return;
    const tr = Dance.trail(dancer, {
      layer: G.tr_draw,
      style: parts[0].level,
      styleAt: lvAt
    });
    state.pending = tr;
    state.traveling = true;
    setShownLevel(parts[0].level);
    const ok = await runCounts(tok, {
      bpm: WAYS[way].bpm,
      swing: WAYS[way].swing,
      phrase: Dance.phrase(parts.map((p, i) => ({
        gait: way,
        counts: cs[i],
        travel: Dance.path(p.geo),
        level: p.level
      }))),
      trails: [tr],
      onCount: n => {
        if (n >= 1) {
          const l = lvAt(n - .5);
          setShownLevel(l);
          state.trace.push([n, l]);
        }
      }
    });
    if (!ok) return;
    state.pending = null;
    D.ribbon = tr;
    const last = parts[parts.length - 1];
    tr.end(badge(last.kind, last.level));
    await Dance.tween(dancer, {
      pose: restPose(last.level),
      facing: 0
    }, 500, () => live(tok));
    if (!live(tok)) return;
    drawParts();
    V.say('doneDraw', {
      valid: () => D.gen === gen
    });
    endRun(tok);
  }
  // a surprise path of 2 or 3 parts from the star, checked with the same rule so the names always match the icons
  function surprisePath() {
    const kinds = ['straight', 'curved', 'zigzag'];
    for (let tries = 0; tries < 400; tries++) {
      const n = 2 + Math.floor(Math.random() * 2),
        want = [];
      while (want.length < n) {
        const k = kinds[Math.floor(Math.random() * 3)];
        if (k !== want[want.length - 1]) want.push(k);
      }
      let x = STAR.x,
        z = STAR.z,
        h = (-25 + Math.random() * 20) * Math.PI / 180;
      const pts = [{
        x,
        z
      }];
      const go = (len, step = 1) => {
        for (let d = 0; d < len; d += step) {
          x += Math.cos(h) * step;
          z += Math.sin(h) * step;
          pts.push({
            x,
            z
          });
        }
      };
      want.forEach((k, i) => {
        if (i) h += (Math.random() < .5 ? -1 : 1) * (75 + Math.random() * 25) * Math.PI / 180;
        if (k === 'straight') go(20 + Math.random() * 10);
        else if (k === 'curved') {
          const turnBy = (100 + Math.random() * 60) * Math.PI / 180 * (Math.random() < .5 ? -1 : 1),
            len = 32 + Math.random() * 10,
            steps = Math.round(len);
          for (let s = 0; s < steps; s++) {
            h += turnBy / steps;
            go(1);
          }
        } else {
          const sgn = Math.random() < .5 ? -1 : 1,
            base = h;
          for (let s = 0; s < 5; s++) {
            h = base + (s % 2 ? -1 : 1) * sgn * 55 * Math.PI / 180;
            go(10 + Math.random() * 3);
          }
          h = base;
        }
      });
      if (!pts.every(p => p.x >= 4 && p.x <= 96 && p.z >= 4 && p.z <= 57)) continue;
      if (crosses(pts)) continue; // a pathway that crosses itself is hard to follow
      const res = analyze(pts);
      if (res.tooShort || res.lead) continue;
      if (res.parts.map(p => p.kind).join() !== want.join()) continue;
      if (res.parts.some(p => p.kind === 'zigzag' && p.geo.length < 5)) continue; // a clear zigzag: three corners or more
      const mids = res.parts.map(p => Dance.path(p.geo).at(.5));
      if (mids.some((a, i) => mids.some((b, j) => j > i && dist(a, b) < 16))) continue; // the part badges stay apart
      // mixed levels: each part its own, never all the same
      const lv = res.parts.map(() => LV[Math.floor(Math.random() * 3)]);
      if (new Set(lv).size < 2) lv[1] = LV[(LV.indexOf(lv[0]) + 1 + Math.floor(Math.random() * 2)) % 3];
      res.parts.forEach((p, i) => {
        p.level = lv[i];
      });
      return res;
    }
    return analyze([{
      x: 10,
      z: 50
    }, {
      x: 60,
      z: 50
    }]);
  }
  // does a polyline cross itself (segments more than one apart that intersect)?
  function crosses(pts) {
    const q = pts.filter((_, i) => i % 2 === 0 || i === pts.length - 1);
    const X = (a, b, c, d) => {
      const o = (p, r, t) => Math.sign((r.x - p.x) * (t.z - p.z) - (r.z - p.z) * (t.x - p.x));
      return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
    };
    for (let i = 0; i < q.length - 1; i++)
      for (let j = i + 2; j < q.length - 1; j++)
        if (X(q[i], q[i + 1], q[j], q[j + 1])) return true;
    return false;
  }
  // pointer drawing on the floor
  let drawing = null;
  function cancelDrawing() {
    if (drawing != null && sv.hasPointerCapture(drawing)) sv.releasePointerCapture(drawing);
    drawing = null;
    state.draw.raw = null;
  }
  sv.addEventListener('pointerdown', e => {
    if (state.mode !== 'draw' || e.button > 0) return;
    if (e.target.closest && e.target.closest('.part')) return; // a part badge: its own tap
    V.hush();
    readUntil = 0;
    if (state.busy) {
      newRun('draw');
      endRun(state.run);
    }
    const r = sv.getBoundingClientRect(),
      p = floor.unmap(e.clientX - r.left, e.clientY - r.top);
    if (p.z < -6 || p.z > 70 || p.x < -10 || p.x > 110) return; // on the wall: not a drawing
    e.preventDefault();
    try {
      sv.setPointerCapture(e.pointerId);
    } catch {}
    drawing = e.pointerId;
    setDancerVisible(false);
    state.draw.gen++;
    V.dropQueued();
    state.draw.parts = [];
    drawParts();
    if (state.draw.ribbon) {
      state.draw.ribbon.remove();
      state.draw.ribbon = null;
    }
    state.draw.raw = [{
      x: clamp(p.x, 0, 100),
      z: clamp(p.z, 0, 60)
    }];
    drawInk();
    syncDraw();
  });
  sv.addEventListener('pointermove', e => {
    if (drawing !== e.pointerId) return;
    const r = sv.getBoundingClientRect(),
      p = floor.unmap(e.clientX - r.left, e.clientY - r.top);
    const q = {
        x: clamp(p.x, 0, 100),
        z: clamp(p.z, 0, 60)
      },
      raw = state.draw.raw,
      l = raw[raw.length - 1];
    if (dist(q, l) > .4) {
      raw.push(q);
      drawInk();
    }
  });
  const endDraw = e => {
    if (drawing !== e.pointerId) return;
    drawing = null;
    setDrawn(analyze(state.draw.raw || []));
  };
  sv.addEventListener('pointerup', endDraw);
  sv.addEventListener('pointercancel', endDraw);

  function clearDraw() {
    cancelDrawing();
    V.hush();
    readUntil = 0;
    if (state.busy) {
      newRun('clear');
      endRun(state.run);
    }
    const D = state.draw;
    D.gen++;
    D.raw = null;
    D.parts = [];
    D.geo = null;
    if (D.ribbon) {
      D.ribbon.remove();
      D.ribbon = null;
    }
    drawParts();
    drawInk();
    syncDraw();
    const tok = ++state.run;
    walkTo(tok, STAR);
    setDancerVisible(false);
    $('hint').textContent = L.clear;
    V.say('clear', {
      valid: () => state.mode === 'draw' && !D.parts.length
    });
  }

  // ------------------------------------------------------------ modes
  let modeReady = false;
  const MODES = ['levels', 'paths', 'mystery', 'draw'];

  function setMode(m) {
    if (modeReady && state.mode === m) return;
    modeReady = true;
    cancelDrawing();
    stopRun();
    V.hush();
    readUntil = 0;
    state.run++;
    state.mode = m;
    document.body.dataset.mode = m;
    for (const k of MODES) {
      $('m-' + k).setAttribute('aria-pressed', k === m);
      $('c-' + k).hidden = k !== m;
    }
    for (const k of MODES) G['tr_' + k].style.display = k === m ? '' : 'none';
    G.drawn.textContent = '';
    G.icons.textContent = '';
    const cast = {levels:0,paths:1,mystery:2,draw:0}[m];
    dancer.setCast(cast);
    mirrorDancer.setCast(cast);
    dancer.scale = m === 'levels' ? 1 : .7; // a smaller dancer on the travel floors, so the ribbons show
    setDancerVisible(m !== 'draw');
    if (m === 'levels') {
      dancer.set({
        pose: Dance.level(kf(state.lastMove, 0), state.level),
        x: MAT.x,
        z: MAT.z,
        facing: 0,
        lift: 0
      });
      state.shownLevel = state.level;
      drawMoveIcons();
    } else if (m === 'mystery') {
      const at = M.gallery ? GALLERY_SPOT : STAR;
      dancer.set({
        pose: M.gallery ? BOW : 'stand',
        ...at,
        facing: M.gallery ? BOW_FACING : 0,
        lift: 0
      });
      state.shownLevel = M.step === 'solved' || M.gallery ? (M.gallery ? null : ROUNDS[M.round].level) : null;
      if (!M.watched && M.step !== 'solved') M.step = 'go';
    } else {
      dancer.set({
        pose: restPose(state.level),
        ...STAR,
        facing: 0,
        lift: 0
      });
      state.shownLevel = state.level;
    }
    showPressed();
    relayout(true);
    if (m === 'paths') previewPath();
    if (m === 'mystery') syncMystery();
    if (m === 'draw') syncDraw();
    $('svdesc').textContent = descText();
    const howNow = {
      levels: 'wLevels',
      paths: 'wPaths',
      mystery: M.gallery ? 'replayHow' : M.step === 'path' ? 'askPath' : M.step === 'level' ? 'askLevel' : M.step === 'solved' ? 'nextHow' : 'wMystery',
      draw: state.draw.parts.length ? 'danceIt' : 'wDraw'
    } [m];
    $('hint').textContent = L[howNow] || L.allDone;
    if (!V.welcome() && howNow) V.how(howNow);
    if (m === 'mystery' && M.gallery) $('hint').textContent = L.replayHow;
  }
  for (const k of MODES) $('m-' + k).onclick = () => setMode(k);
  $('l-updown').onclick = () => upDown();
  $('l-surprise').onclick = () => surprise();
  $('p-go').onclick = () => pathGo();
  $('p-clean').onclick = () => cleanFloor();
  $('y-go').onclick = () => {
    if (!isDis($('y-go'))) mysTrip(false);
  };
  $('y-again').onclick = () => {
    if (!isDis($('y-again'))) mysTrip(true);
  };
  $('y-next').onclick = () => nextRound();
  $('y-replay').onclick = () => playAgain();
  $('d-dance').onclick = () => danceIt();
  $('d-surprise').onclick = () => {
    cancelDrawing();
    if (state.busy) {
      newRun('s');
      endRun(state.run);
    }
    setDrawn(surprisePath(), 'surprise');
  };
  $('d-clear').onclick = () => clearDraw();
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const i = '1234'.indexOf(e.key);
    if (i >= 0) {
      e.preventDefault();
      setMode(MODES[i]);
    }
  });

  // ------------------------------------------------------------ layout (real pixels per size)
  let page = '',
    lastKey = '';

  function pageLayout() {
    const w = innerWidth,
      h = innerHeight;
    if (w < 640 || h > w * 1.15) return 'stack';
    if (w >= 1000 && h >= 700) return 'wide';
    return 'compact';
  }

  function relayout(force) {
    const p = pageLayout();
    if (p !== page) {
      page = p;
      for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p);
    }
    document.body.classList.toggle('short', innerHeight < 900);
    document.body.classList.toggle('narrowhead', innerWidth < 900);
    document.body.classList.toggle('tiny', innerHeight < 560);
    const st = $('stage');
    if (page === 'stack') {
      const w = st.getBoundingClientRect().width || innerWidth;
      const smallPhone = innerWidth < 480;
      let stageHeight = Math.round(clamp(Math.min(w * (smallPhone ? .56 : .5), innerHeight * (smallPhone ? .5 : .29)),
        smallPhone ? 242 : 260, 520));
      // Draw has fewer panel rows: use its spare phone space for clear, full-size part badges.
      if (smallPhone && innerHeight >= 800 && state.mode === 'draw') stageHeight += 96;
      st.style.height = stageHeight + 'px';
    } else st.style.height = '';
    const r = st.getBoundingClientRect(),
      W = Math.max(280, Math.round(r.width)),
      H = Math.max(200, Math.round(r.height));
    const key = W + 'x' + H;
    if (key === lastKey && !force) return;
    lastKey = key;
    sv.setAttribute('width', W);
    sv.setAttribute('height', H);
    sv.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const gw = Math.round(clamp(W * .1, 56, 112)),
      stripH = Math.round(clamp(H * .075, 30, 52));
    const box = {
      x0: gw + 20,
      x1: W - 12,
      yBack: Math.round(H * .36),
      yFront: H - stripH - 8
    };
    // Leave two clear annotation rows above a phone drawing; retain the full floor width.
    if (innerWidth < 480 && innerHeight >= 800 && state.mode === 'draw') box.yBack = Math.round(H * .49);
    const gTop = Math.round(H * .06);
    LAY = {
      guide: {
        x: 10,
        y: gTop,
        w: gw,
        h: box.yFront - gTop - 6
      },
      counts: {
        x: box.x0 + (box.x1 - box.x0) * .2,
        y: H - stripH - 2,
        w: (box.x1 - box.x0) * .6,
        h: stripH
      },
      dots: {
        x: W - 18,
        y: Math.round(clamp(H * .045, 14, 26)),
        r: clamp(H * .016, 6, 11)
      }
    };
    floor.resize(W, H, box);
    // keep the reflection in step and redraw everything placed in floor units
    dancer.render();
    mirrorDancer.set({
      pose: dancer.pose,
      x: dancer.x,
      z: dancer.z,
      facing: dancer.facing,
      lift: dancer.lift
    });
    drawStage();
    if (state.mode === 'paths') previewPath();
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());

  Curio.onSound(() => { readUntil = 0; });
  Curio.init({
    clips: "voice:*",
    rate: .9
  });
  window.__tool = {
    state,
    setMode,
    allLines: V.allLines,
    V,
    vlog: V.log,
    get vq() {
      return V.queue;
    },
    dancer,
    floor,
    analyze,
    surprisePath,
    ROUNDS,
    MOVES,
    PATHS,
    WAYS,
    WALK,
    Dance,
    S,
    ribbons,
    setDrawn,
    kf,
    tapLevel,
    doMove,
    gallery,
    allocateDrawCounts,
    paintDancer
  };
  setMode('levels');
})();
</script>
