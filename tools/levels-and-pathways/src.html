<title>Levels and Pathways · Locomotor and nonlocomotor movement · Curio Class</title>
<meta name="description" content="A dancer in a studio stretches, twists and curls at high, middle and low levels, then travels straight, curved and zigzag pathways that leave a ribbon on the floor. The class copies, guesses a hidden pathway by drawing it in the air, and draws new pathways for the dancer. Grades K-2 dance. Works offline.">
<!--
Levels and Pathways (Curio Class)
Grades K-2, arts (dance), module Moving Bodies (Dance). NCAS dance DA:Cr1.1.Ka, DA:Cr1.1.Kb, DA:Pr4.1.Ka, DA:Pr4.1.1a,
DA:Pr4.1.2a, DA:Cr1.1.2b, DA:Re7.1.Kb, DA:Cr3.1.Kb, DA:Cr3.1.2b, DA:Pr5.1.Kb; SHAPE America S2 (movement concepts).
Teacher led on a projector or smartboard; the class stands in their own bubble space and copies.
Levels: six nonlocomotor moves (stretch, twist, bend, swing, shake, curl) at high, middle and low, plus Up and down.
Pathways: straight, curved and zigzag trips that paint a ribbon (pattern and icon show the level, never color alone).
Mystery path: the dancer travels with no ribbon; the class draws the path in the air, then names the level (8 rounds).
Draw a path: draw on the floor; the line is split into straight, curved and zigzag parts (Dance.readPath), the class
taps each numbered part to give it a level, and the dancer dances it part by part.
Sources (see notes.md): National Core Arts Standards, Dance (2014); Anne Green Gilbert, Creative Dance for All Ages,
2nd ed. (2015); Perpich Center for Arts Education, The Elements of Dance; SHAPE America Grade-Level Outcomes (2014).
Engine: kit/dance.js (docs/families/dance.md). Everything is drawn in code; music and sounds are made in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); if (at) for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const LV = ['high', 'middle', 'low'];
  const LVC = {high: '#1565c0', middle: '#2e7d32', low: '#b45309'};
  const LVW = {high: 'High', middle: 'Middle', low: 'Low'};
  const STAR = {x: 10, z: 50}, MAT = {x: 50, z: 38}, GALLERY_SPOT = {x: 93, z: 46}, WALK = {bpm: 168};

  // ------------------------------------------------------------ the narrator's lines (spec, Voice)
  const L = {
    wLevels: 'Let\'s dance at three levels: high, middle and low. Tap a move, and copy the dancer!',
    wPaths: 'A pathway is the line you make when you travel. Tap a pathway, then tap Go, and follow the dancer!',
    wMystery: 'The magic floor hides the pathway. Tap Go, watch the dancer, then draw the pathway in the air with one finger.',
    wDraw: 'Draw a pathway on the floor with your finger. Start at the star. Then tap Dance it.',
    copyMe: 'Copy me! Stay in your own bubble space.',
    stretch: 'Stretch!', twist: 'Twist!', bend: 'Bend!', swing: 'Swing!', shake: 'Shake!', curl: 'Curl!',
    atHigh: 'High level. Reach up to the sky!', atMiddle: 'Middle level. Stay in the middle.', atLow: 'Low level. Get close to the floor.',
    freeze: 'And freeze!',
    upDown: 'High, middle, low, middle, high. Follow me up and down!',
    straight: 'A straight pathway.', curved: 'A curved pathway.', zigzag: 'A zigzag pathway.',
    walk: 'Let\'s walk.', skip: 'Let\'s skip.', gallop: 'Let\'s gallop.', slide: 'Let\'s slide sideways.',
    ribbon: 'Look at the floor! The ribbon shows our pathway.',
    askPath: 'Which pathway was it? Draw it in the air, then tap straight, curved or zigzag.',
    askLevel: 'Which level was the dancer? Tap high, middle or low.',
    rightPath: 'Yes! Here\'s the ribbon.',
    rightLevel: 'Yes! That\'s the level.',
    nextHow: 'Tap Next for a new mystery.',
    wrong: 'Hmm, let\'s watch it again.',
    allDone: 'Eight mysteries solved! Look at all our ribbons.',
    firstStraight: 'First, straight.', firstCurved: 'First, curved.', firstZigzag: 'First, zigzag.',
    thenStraight: 'Then straight.', thenCurved: 'Then curved.', thenZigzag: 'Then zigzag.',
    tooShort: 'Draw a longer pathway, from the star across the floor.',
    tapPart: 'Tap a number to change that part\'s level.',
    danceIt: 'Now tap Dance it, and follow the dancer!',
    surprise: 'Here\'s a surprise pathway!',
    doneDraw: 'Great dancing! Draw a new one, or dance it again.',
  };
  const atKey = l => 'at' + l[0].toUpperCase() + l.slice(1);
  const cap = s => s[0].toUpperCase() + s.slice(1);

  // ------------------------------------------------------------ content (spec, Content)
  // the six nonlocomotor moves: keyframes A and B at each level (a 2-count A to B loop; count 8 holds B)
  const hug = [70, 70, 86, 166];
  // low level is on the floor: every low keyframe sits, kneels back on the heels or lies down, so its head is well
  // under any middle keyframe's (measured; see handoff.md). A lying shape turns (yaw) so it reads along the floor.
  const heels = {lLeg: [92, 4, 170], rLeg: [92, 4, 170]};
  const straddle = {lLeg: [90, 32, 0], rLeg: [90, 32, 0], lToe: .7, rToe: .7};
  const cross = {lLeg: [80, 44, 150], rLeg: [80, 44, 150]};
  const onBack = {pitch: -90, yaw: 72};
  const MOVES = {
    stretch: {dyn: 'smooth',
      high: [{toe: 1, arms: [160, 12, 168, 12]}, {toe: 1, arms: [179, 2, 180, 2], lean: -5}],
      middle: [{arms: [55, 0, 58, 0]}, {arms: [92, 0, 94, 0], lLeg: [0, 13, 0], rLeg: [0, 13, 0]}],
      low: [{...straddle, lean: 2, arms: [92, 0, 94, 0]}, {...straddle, lean: 58, head: 6, arms: [146, 90, 150, 90]}]},
    twist: {dyn: 'smooth',
      high: [{toe: 1, arms: [165, 12, 168, 12], twist: 38}, {toe: 1, arms: [165, 12, 168, 12], twist: -38}],
      middle: [{arms: [90, 0, 92, 0], twist: 42, lLeg: [0, 9, 0], rLeg: [0, 9, 0]}, {arms: [90, 0, 92, 0], twist: -42, lLeg: [0, 9, 0], rLeg: [0, 9, 0]}],
      low: [{...cross, lean: 14, arms: [90, 0, 92, 0], twist: 40}, {...cross, lean: 14, arms: [90, 0, 92, 0], twist: -40}]},
    bend: {dyn: 'smooth',
      high: [{toe: 1, arms: [172, 8, 176, 8], side: 22}, {toe: 1, arms: [172, 8, 176, 8], side: -22}],
      middle: [{arms: [20, 30, 24, 40]}, {lean: 58, head: 12, arms: [96, 90, 96, 90], lLeg: [0, 6, 4], rLeg: [0, 6, 4]}],
      low: [{...heels, side: 30, lArm: [40, -25, 55, 165], rArm: [168, 0, 176, 0]}, {...heels, side: -30, rArm: [40, -25, 55, 165], lArm: [168, 0, 176, 0]}]},
    swing: {dyn: 'swing',
      high: [{toe: 1, lArm: [140, 0, 146, 0], rArm: [160, 180, 166, 180], side: 10}, {toe: 1, rArm: [140, 0, 146, 0], lArm: [160, 180, 166, 180], side: -10}],
      middle: [{lArm: [95, 8, 100, 8], rArm: [58, 150, 62, 150], twist: 18, side: 6, lLeg: [0, 7, 14], rLeg: [0, 7, 14]},
        {rArm: [95, 8, 100, 8], lArm: [58, 150, 62, 150], twist: -18, side: -6, lLeg: [0, 7, 14], rLeg: [0, 7, 14]}],
      low: [{...heels, lean: 38, twist: 14, lArm: [70, 25, 74, 25], rArm: [40, 150, 44, 150]}, {...heels, lean: 38, twist: -14, rArm: [70, 25, 74, 25], lArm: [40, 150, 44, 150]}]},
    shake: {dyn: 'shake',
      high: [{toe: 1, arms: [168, 10, 176, 10]}, {toe: 1, arms: [158, 22, 166, 30]}],
      middle: [{arms: [38, 10, 44, 20], lLeg: [0, 8, 10], rLeg: [0, 8, 10]}, {arms: [28, 20, 34, 40], lLeg: [0, 8, 22], rLeg: [0, 8, 22], side: 6}],
      low: [{...onBack, arms: [92, 90, 100, 90], lLeg: [80, 10, 16], rLeg: [80, 10, 16]}, {...onBack, arms: [80, 70, 92, 60], lLeg: [94, 16, 30], rLeg: [94, 16, 30]}]},
    curl: {dyn: 'smooth',
      high: [{toe: 1, arms: hug, head: 16, lean: 6}, {toe: 1, arms: [152, 0, 162, 0], lean: -4}],
      middle: [{lean: 42, head: 34, lLeg: [26, 4, 46], rLeg: [26, 4, 46], arms: hug}, {arms: [112, 0, 114, 0], lean: -5}],
      // low: a tight seated tuck that opens into a seated star; both sit on the floor, so no in-between rises
      low: [{lLeg: [140, 4, 150], rLeg: [140, 4, 150], lean: 50, head: 30, arms: [24, -40, 40, -60]}, {...straddle, lean: -6, arms: [150, 30, 150, 30]}]},
  };
  const MOVE_IDS = Object.keys(MOVES);
  // a keyframe with its own high and low versions (Dance.level uses them)
  const kf = (id, i) => ({...MOVES[id].middle[i], high: MOVES[id].high[i], low: MOVES[id].low[i]});
  const WAYS = {walk: {bpm: 100, swing: 0}, skip: {bpm: 120, swing: .33}, gallop: {bpm: 120, swing: .33}, slide: {bpm: 100, swing: 0}};
  const WAY_IDS = Object.keys(WAYS);
  // pathways in floor units (0 to 100 across, 0 to 60 deep, star at x 10, z 50 at the front)
  const PATHS = {
    straight: Dance.paths.line([10, 50], [90, 50]),
    curved: Dance.paths.arc(50, 50, 40, 180, 360, 64),
    zigzag: Dance.paths.poly([[10, 50], [30, 20], [50, 50], [70, 20], [90, 50]]),
  };
  const PATH_IDS = ['straight', 'curved', 'zigzag'];
  // round 7: a full circle that ends back on the star (center 25, 35.5, through the star; z 14.6 to 56.4, on the floor)
  const CIRCLE = (() => { const cx = 25, cz = 35.5, r = Math.hypot(STAR.x - cx, STAR.z - cz), a0 = Math.atan2(STAR.z - cz, STAR.x - cx) * 180 / Math.PI; return Dance.paths.arc(cx, cz, r, a0, a0 + 360, 72); })();
  const ROUNDS = [
    ['straight', 'walk', 'middle'], ['zigzag', 'walk', 'high'], ['curved', 'slide', 'middle'], ['straight', 'gallop', 'low'],
    ['curved', 'skip', 'high'], ['zigzag', 'slide', 'low'], ['curved', 'walk', 'low', CIRCLE], ['zigzag', 'gallop', 'middle'],
  ].map(([path, way, level, geo]) => ({path, way, level, geo: geo || PATHS[path]}));
  // one original studio tune: C, A minor, F, G, two counts each; piano, soft bass, light shaker (eighth notes)
  const TRACK = {len: 8, sub: 2, vol: .55, parts: {
    piano: [[60, 64, 67], null, 76, 74, [57, 60, 64], null, 72, 69, [53, 57, 60], null, 69, 72, [55, 59, 62], null, 74, 71],
    bass: [36, null, null, 43, 33, null, null, 40, 29, null, null, 36, 31, null, null, 38],
    shaker: '.x.x.x.x.x.x.x.x'}};

  // ------------------------------------------------------------ state
  const state = {mode: 'levels', level: 'middle', move: null, lastMove: 'stretch', lastPair: '', path: 'straight', way: 'walk',

  // the Mystery welcome is the line for the round's current step (coming back mid-round, or Sound off and on)

    if (m.step === 'solved') return ['nextHow', {valid: () => m.step === 'solved' && !state.busy}];

  // ------------------------------------------------------------ icons drawn in code
  function svgIcon(draw, vb = '0 0 40 40') { const s = mk('svg', {viewBox: vb, 'aria-hidden': 'true'}); draw(s); return s; }
  function levelGlyph(g, lvl, cx, cy, r, color) {
    const a = {fill: color, stroke: 'none'};

      for (const [x, y, k] of [[-.45, .15, .42], [0, -.12, .55], [.45, .12, .42]]) mk('circle', {cx: cx + x * r, cy: cy + y * r, r: k * r, ...a}, g);

      for (const x of [-.7, .55]) mk('rect', {x: cx + x * r, y: cy - .1 * r, width: .17 * r, height: .85 * r, ...a}, g);

      const p = (x0, x1, tip) => `M ${cx + x0 * r} ${cy + .75 * r} Q ${cx + (x0 + x1) / 2 * r} ${cy} ${cx + tip * r} ${cy - .55 * r} Q ${cx + (x0 + x1) / 2 * r + .1 * r} ${cy + .1 * r} ${cx + x1 * r} ${cy + .75 * r} Z`;
      mk('path', {d: p(-.9, -.45, -.8) + p(-.35, .15, -.05) + p(.2, .65, .5) + p(.55, .95, .95), ...a}, g);

  function pathGlyph(g, kind, x, y, w, h, color, sw) {

  }
  const DCOL = {top: '#00798c', bottom: '#33393d', skin: '#a8714f', hair: '#2b1d16', shoe: '#f4ead9'};

  // ------------------------------------------------------------ panel buttons
  const tiles = {level: [], path: [], way: [], move: [], yPath: [], yLevel: []};
  function tile(parent, word, iconFn, cls = '') {
    const b = document.createElement('button');

  }
  for (const row of document.querySelectorAll('[data-row="level"]'))

  for (const row of document.querySelectorAll('[data-row="path"]'))
    for (const p of PATH_IDS) { const b = tile(row, cap(p), s => pathGlyph(s, p, 4, 8, 32, 24, '#00798c', 5)); b.dataset.path = p; b.onclick = () => tapPath(p); tiles.path.push(b); }
  for (const row of document.querySelectorAll('[data-row="way"]'))
    for (const w of WAY_IDS) { const b = tile(row, cap(w), () => {}); b.dataset.way = w; b.onclick = () => tapWay(w); tiles.way.push(b); }
  for (const m of MOVE_IDS) { const b = tile($('moves'), cap(m), () => {}); b.dataset.move = m; b.onclick = () => doMove(m); tiles.move.push(b); }
  for (const p of PATH_IDS) { const b = tile($('y-paths'), cap(p), s => pathGlyph(s, p, 4, 8, 32, 24, '#00798c', 5)); b.dataset.path = p; b.removeAttribute('aria-pressed'); b.onclick = () => answerPath(p); tiles.yPath.push(b); }
  for (const l of LV) { const b = tile($('y-levels'), LVW[l], s => levelGlyph(s, l, 20, 21, 17, '#fff'), 'lv ' + l); b.dataset.level = l; b.removeAttribute('aria-pressed'); b.onclick = () => answerLevel(l); tiles.yLevel.push(b); }
  // mini dancer poses on the move and way buttons. Each move has one fixed icon at every level: its own clearest shape
  // and a motion mark (arrows out for stretch, a turn arrow for twist, a side arc for bend, a swing arc, shake lines,
  // a round arrow for curl), so no two look alike
  const MOVE_ICON = {
    stretch: {pose: () => Dance.level(kf('stretch', 1), 'middle'), facing: 0},
    twist: {pose: () => Dance.level(kf('twist', 0), 'middle'), facing: 30},
    bend: {pose: () => Dance.level(kf('bend', 0), 'high'), facing: 0},
    swing: {pose: () => Dance.level(kf('swing', 0), 'middle'), facing: 0},
    shake: {pose: () => Dance.level(kf('shake', 1), 'middle'), facing: 0},
    curl: {pose: () => Dance.level(kf('curl', 0), 'middle'), facing: 20},
  };
  function motionMarks(svg, id) {
    const [vx, vy, vw, vh] = svg.getAttribute('viewBox').split(' ').map(Number), X = u => vx + u * vw, Y = v => vy + v * vh, sw = vw * .045;
    const g = mk('g', {fill: 'none', stroke: '#c2410c', 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, svg);
    const head = (x, y, a) => { const L = vw * .07; mk('path', {d: `M ${x + L * Math.cos(a + 2.6)} ${y + L * Math.sin(a + 2.6)} L ${x} ${y} L ${x + L * Math.cos(a - 2.6)} ${y + L * Math.sin(a - 2.6)}`}, g); };
    if (id === 'stretch') for (const k of [-1, 1]) { const x0 = X(.5 + k * .36), x1 = X(.5 + k * .48), y = Y(.36); mk('line', {x1: x0, y1: y, x2: x1, y2: y}, g); head(x1, y, k > 0 ? 0 : Math.PI); }
    else if (id === 'twist') { mk('path', {d: `M ${X(.24)} ${Y(.5)} Q ${X(.5)} ${Y(.66)} ${X(.78)} ${Y(.5)}`}, g); head(X(.78), Y(.5), -.5); }
    else if (id === 'bend') { mk('path', {d: `M ${X(.78)} ${Y(.12)} Q ${X(.94)} ${Y(.3)} ${X(.86)} ${Y(.5)}`}, g); head(X(.86), Y(.5), 1.9); }
    else if (id === 'swing') { mk('path', {d: `M ${X(.12)} ${Y(.44)} Q ${X(.5)} ${Y(.86)} ${X(.88)} ${Y(.44)}`}, g); head(X(.88), Y(.44), -1); head(X(.12), Y(.44), Math.PI + 1); }
    else if (id === 'shake') for (const k of [-1, 1]) { const x = X(.5 + k * .4); mk('path', {d: `M ${x - vw * .04} ${Y(.42)} L ${x + vw * .04} ${Y(.5)} L ${x - vw * .04} ${Y(.58)} L ${x + vw * .04} ${Y(.66)}`}, g); }
    else if (id === 'curl') { mk('path', {d: `M ${X(.82)} ${Y(.62)} A ${vw * .36} ${vh * .36} 0 1 1 ${X(.72)} ${Y(.2)}`}, g); head(X(.72), Y(.2), -2.3); }
  }
  function drawMoveIcons() {
    if (drawMoveIcons.done) return;
    drawMoveIcons.done = true;
    for (const b of tiles.move) { const m = MOVE_ICON[b.dataset.move]; Dance.icon(b._ic, m.pose(), {...DCOL, facing: m.facing}); motionMarks(b._ic, b.dataset.move); }
  }
  for (const b of tiles.way) {
    const G = Dance.gaits[b.dataset.way], r = G.pose(b.dataset.way === 'slide' ? .35 : b.dataset.way === 'skip' ? .3 : .25, 1);
    Dance.icon(b._ic, Dance.pose(r.pose), {...DCOL, facing: b.dataset.way === 'slide' ? 0 : 70});
  }
  const dis = (el, v) => { el.setAttribute('aria-disabled', v ? 'true' : 'false'); };
  const isDis = el => el.getAttribute('aria-disabled') === 'true';
  function showPressed() {
    const dp = state.draw.parts, shown = state.mode === 'draw' && dp.length ? (dp.every(q => q.level === dp[0].level) ? dp[0].level : null) : state.level;
    for (const b of tiles.level) b.setAttribute('aria-pressed', b.dataset.level === shown);
    for (const b of tiles.path) b.setAttribute('aria-pressed', b.dataset.path === state.path);

    for (const b of tiles.move) b.setAttribute('aria-pressed', b.dataset.move === state.move && state.busy && state.kind === 'move');
    const ud = state.busy && state.kind === 'updown';

    $('l-updown').setAttribute('aria-pressed', ud);
  }

  // ------------------------------------------------------------ the stage
  const sv = $('sv');
  const floor = Dance.floor(sv, 'studio', {w: 800, h: 500});
  const G = {};   // the tool's own layers, inside the floor's
  G.mat = mk('g', {}, floor.layers.marks);
  G.star = mk('g', {}, floor.layers.marks);
  G.sparkle = mk('g', {}, floor.layers.marks);
  G.drawn = mk('g', {}, floor.layers.marks);
  for (const m of ['levels', 'paths', 'mystery', 'draw']) G['tr_' + m] = mk('g', {}, floor.layers.trail);
  G.icons = mk('g', {}, floor.layers.trail.parentNode); floor.layers.trail.after(G.icons);
  G.guide = mk('g', {}, floor.layers.front);
  G.dots = mk('g', {}, floor.layers.front);
  G.ink = mk('g', {}, floor.layers.front);   // the line being drawn
  const counts = Dance.counts(floor.layers.front, null, {n: 8});
  const mirrorDancer = Dance.dancer(floor.layers.mirror, {...DCOL, floor, reflect: .35, ghost: .42, scale: .8});   // pulled toward the glass and a little smaller, so the head stays in the mirror
  const dancer = Dance.dancer(floor.layers.actors, {...DCOL, floor});
  dancer.onMove(d => { mirrorDancer.scale = d.scale * .8; } );
  dancer.onMove(d => mirrorDancer.set({pose: d.pose, x: d.x, z: d.z, facing: d.facing, lift: d.lift}));
  dancer.set({pose: 'stand', x: MAT.x, z: MAT.z, facing: 0});

  let LAY = null;   // the layout of the stage in pixels
  function drawStage() {
    const W = floor.w, H = floor.h;
    // the floor's projected outline for an ellipse or star given in floor units
    const fpoly = (pts) => pts.map(([x, z]) => { const p = floor.project(x, 0, z); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    G.mat.textContent = ''; G.star.textContent = ''; G.sparkle.textContent = '';
    if (state.mode === 'levels') {
      const ring = r => Array.from({length: 48}, (_, i) => [MAT.x + r * Math.cos(i / 48 * 2 * Math.PI), MAT.z + r * .9 * Math.sin(i / 48 * 2 * Math.PI)]);
      mk('polygon', {points: fpoly(ring(11)), fill: '#bfe3df', opacity: .85, stroke: '#00798c', 'stroke-width': 3, 'stroke-dasharray': '10 7'}, G.mat);
      mk('polygon', {points: fpoly(ring(7.5)), fill: '#d6efec', opacity: .8}, G.mat);
    } else {
      const st = Array.from({length: 10}, (_, i) => { const r = i % 2 ? 2.1 : 5, a = -Math.PI / 2 + i * Math.PI / 5; return [STAR.x + r * Math.cos(a), STAR.z + r * Math.sin(a) * .9]; });
      const glow = Array.from({length: 36}, (_, i) => [STAR.x + 7 * Math.cos(i / 36 * 2 * Math.PI), STAR.z + 6 * Math.sin(i / 36 * 2 * Math.PI)]);
      mk('polygon', {points: fpoly(glow), fill: '#fff3c4', opacity: .7}, G.star);
      mk('polygon', {points: fpoly(st), fill: '#f2b705', stroke: '#8a6100', 'stroke-width': 2, 'stroke-linejoin': 'round'}, G.star);
    }
    if (state.mode === 'mystery' && !state.mys.gallery) {
      // the magic floor: small twinkling sparkles in fixed spots
      let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 26; i++) {
        const x = 4 + R() * 92, z = 3 + R() * 54, p = floor.project(x, 0, z), s = floor.scale(z) * (1 + R() * .9);
        const sp = mk('path', {d: `M ${p[0]} ${p[1] - s} Q ${p[0]} ${p[1]} ${p[0] + s} ${p[1]} Q ${p[0]} ${p[1]} ${p[0]} ${p[1] + s} Q ${p[0]} ${p[1]} ${p[0] - s} ${p[1]} Q ${p[0]} ${p[1]} ${p[0]} ${p[1] - s} Z`,
          fill: i % 3 ? '#ffffff' : '#ffe9a3', class: 'twinkle'}, G.sparkle);
        sp.style.animationDelay = (-R() * 2.4).toFixed(2) + 's';
      }
    }
    drawGuide(); drawDots(); drawParts(); drawInk();
    counts.layout(LAY.counts);
  }
  // the level guide on the left wall: three bands (cloud, table, grass); the band of the dancer's level glows
  function drawGuide() {
    const g = G.guide; g.textContent = '';
    const {x, y, w, h} = LAY.guide, bh = h / 3, fs = clamp(w * .2, 11, 19);
    mk('rect', {x: x - 3, y: y - 3, width: w + 6, height: h + 6, rx: 12, fill: '#ffffff', stroke: '#b9d3d0', 'stroke-width': 2}, g);
    LV.forEach((l, i) => {
      const on = state.shownLevel === l, by = y + i * bh;
      const band = mk('g', {class: 'lgband'}, g);
      mk('rect', {x, y: by + 2, width: w, height: bh - 4, rx: 9, fill: on ? LVC[l] : '#f6fbfa', stroke: LVC[l], 'stroke-width': on ? 4 : 2}, band);
      levelGlyph(band, l, x + w / 2, by + bh * .4, Math.min(w * .28, bh * .24), on ? '#fff' : LVC[l]);
      const t = mk('text', {x: x + w / 2, y: by + bh * .4 + Math.min(w * .28, bh * .24) + fs * 1.15, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 800, fill: on ? '#fff' : LVC[l], 'font-family': 'Trebuchet MS, Segoe UI, sans-serif'}, band);
      t.textContent = LVW[l];
      if (on) {
        mk('rect', {x: x - 5, y: by - 1, width: w + 10, height: bh + 2, rx: 12, fill: 'none', stroke: '#ffd34d', 'stroke-width': 4, class: 'pulse-ring'}, band);
        const ax = x + w + 6, ay = by + bh / 2;
        mk('path', {d: `M ${ax} ${ay - 11} L ${ax + 14} ${ay} L ${ax} ${ay + 11} Z`, fill: LVC[l], stroke: '#fff', 'stroke-width': 2}, band);
      }
    });
  }
  function setShownLevel(l) { if (state.shownLevel === l) return; state.shownLevel = l; drawGuide(); $('svdesc').textContent = descText(); }
  // Mystery: 8 round dots, top right; filled for solved rounds, a ring on the current one
  function drawDots() {
    const g = G.dots; g.textContent = '';
    if (state.mode !== 'mystery') return;
    // two rows of four on the wall right of the mirror; with no room there, one row along the back edge of the floor
    const m = floor.mirror, room = m ? floor.w - (m.x + m.w) - 12 : 0;
    let r = LAY.dots.r, at;
    if (m && room >= 4 * 2.6 * 6) { r = Math.min(r, room / (4 * 2.6)); const x0 = m.x + m.w + 6 + (room - 4 * 2.6 * r) / 2 + 1.3 * r; at = i => [x0 + (i % 4) * 2.6 * r, m.y + m.h * .45 + (i < 4 ? -1.35 : 1.35) * r]; }

    for (let i = 0; i < 8; i++) {

      mk('circle', {cx, cy: y, r: cur ? r * 1.2 : r, fill: solved ? '#ffd34d' : '#ffffff', stroke: solved ? '#8a6100' : cur ? '#00798c' : '#9fb5b3', 'stroke-width': cur ? 4 : 2}, g);
      if (solved) mk('path', {d: `M ${cx - r * .45} ${y} l ${r * .3} ${r * .35} l ${r * .6} ${-r * .7}`, fill: 'none', stroke: '#5b4200', 'stroke-width': Math.max(2, r * .25), 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, g);
    }
  }
  const descText = () => {
    const m = {levels: 'A dancer stands on a round mat in a dance studio.', paths: 'A dancer stands on a gold star at the front left of the studio floor.',
      mystery: 'The studio floor sparkles. A dancer stands on the gold star.', draw: 'An empty studio floor with a gold star. Draw a pathway from the star.'}[state.mode];
    return m + (state.shownLevel ? ` The level guide shows ${state.shownLevel} level.` : '');

  // the ribbon's end badge: the pathway icon and, once known, the level icon
  function badge(path, lvl, small) {
    return (g, x, y, s) => {
      // the badge stands beside the end, on the side toward the middle of the floor, so the dancer never hides it
      const h = small ? clamp(floor.h * .045, 18, 30) : clamp(s * 5, 26, 44), w = lvl ? h * 2.1 : h * 1.2, side = small ? 0 : x > floor.w / 2 ? -1 : 1;
      const bx = x + side * (w * .5 + h * .5) - w / 2, by = y - h * (small ? 1.5 : 1.6);

  }

  // ------------------------------------------------------------ runs: one dancer action at a time
  function stopRun() {
    if (S.play) S.play.stop(); if (S.clock) S.clock.stop(); if (S.music) S.music.stop();
    S.play = S.clock = S.music = null;
    counts.set(null);
    if (state.pending) { state.pending.remove(); state.pending = null; }   // a ribbon left half painted goes
    state.busy = false; state.traveling = false; state.kind = '';
  }
  function newRun(kind, keepVoice) {
    stopRun(); if (!keepVoice) { V.hush(); readUntil = 0; }
    state.run++; state.busy = true; state.kind = kind;
    showPressed();
    return state.run;
  }
  function endRun(tok) { if (!live(tok)) return; stopRun(); showPressed(); syncMystery(); }
  // count-in, then the phrase on the clock with the tune; resolves true when it ran to its end
  async function runCounts(tok, {bpm, swing, phrase, trails, onCount, music = true, countIn = 4}) {
    if (countIn) { await afterRead(tok); if (!live(tok)) return false; }
    const clk = Dance.clock(bpm, {countIn});
    S.clock = clk;
    if (music) S.music = Dance.music({...TRACK, swing: swing || 0}, clk);
    if (countIn || music) counts.bind(clk, Math.ceil(phrase.total / 8));
    if (onCount) clk.onCount((n, b) => { if (n <= phrase.total) onCount(n, b); });   // the clock ticks once past the end
    S.play = Dance.play(dancer, phrase, {clock: clk, trails: trails || []});
    clk.start();
    const why = await S.play.done;
    if (!live(tok)) return false;
    clk.stop(); if (S.music) S.music.stop(); S.clock = S.music = S.play = null;
    return why === 'end';
  }
  // walk back to a spot (the star) before a trip: a quick walk, no music, no count strip
  async function walkTo(tok, to) {
    const d = Math.hypot(dancer.x - to.x, dancer.z - to.z);
    if (d > 1) {
      const n = Math.max(2, 2 * Math.round(d / 18));
      const ok = await runCounts(tok, {bpm: WALK.bpm, countIn: 0, music: false, phrase: Dance.phrase([{gait: 'walk', counts: n, travel: Dance.path([[dancer.x, dancer.z], [to.x, to.z]])}])});
      if (!ok) return false;
    }
    return Dance.tween(dancer, {pose: 'stand', facing: 0, x: to.x, z: to.z}, 300, () => live(tok));
  }

  // ------------------------------------------------------------ Levels
  // the gallery bow: a fold at the hips with the arms hanging, turned a little toward the ribbons so the fold shows from
  // the front (the kit's bow, seen straight on, hides the fold behind the head)
  const BOW = Dance.pose({lean: 40, head: 20, arms: [100, 80, 100, 80]}), BOW_FACING = -35;
  function movePhrase(id, levelFn, n) {
    const m = MOVES[id];
    return Dance.phrase([{poses: [kf(id, 0), kf(id, 1)], counts: n - 1, level: levelFn, dyn: m.dyn, at: MAT, facing: 0},
      {poses: [kf(id, 1)], counts: 1, level: levelFn, dyn: 'smooth', at: MAT, facing: 0}]);
  }
  async function doMove(id) {
    const tok = newRun('move');
    state.move = id; state.lastMove = id; showPressed();

  // ------------------------------------------------------------ Draw a path: reading the line
  // Dance.readPath (kit/dance.js; the rule and its test table are in docs/families/dance.md and handoff.md) splits the
  // line into straight, curved and zigzag parts. Each part starts at the level chosen now; the class taps a part's
  // number badge to change its level.
  const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const plen = pts => pts.reduce((s, p, i) => i ? s + dist(p, pts[i - 1]) : 0, 0);

  function drawParts() {
    G.icons.textContent = '';
    if (state.mode !== 'draw' || !state.draw.parts.length) { if (state.mode === 'draw') G.drawn.textContent = ''; return; }
    G.drawn.textContent = '';
    const P = p => floor.project(p.x, 0, p.z);
    for (const p of state.draw.parts) {
      const pts = p.geo.map(q => P(q).slice(0, 2).map(v => v.toFixed(1)).join(',')).join(' ');
      mk('polyline', {points: pts, fill: 'none', stroke: '#ffffff', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .9}, G.drawn);
      mk('polyline', {points: pts, fill: 'none', stroke: LVC[p.level], 'stroke-width': 4.5, 'stroke-linecap': 'round', 'stroke-linejoin': p.kind === 'zigzag' ? 'miter' : 'round'}, G.drawn);

    // clear, the spot with the least overlap wins (stage edge counted heaviest)
    const gd = LAY.guide, gz = gd ? {x0: gd.x - 8, x1: gd.x + gd.w + 24, y0: gd.y - 8, y1: gd.y + gd.h + 8} : null;   // the level guide and its pointer

      const path = Dance.path(p.geo), m = path.at(.5), s = clamp(floor.scale(m.z) * 5.2, 32, 46), w = s * 2.3;
      const g = mk('g', {class: 'part', role: 'button', tabindex: 0, 'data-i': i, 'aria-label': `Part ${i + 1}, ${p.kind}, ${p.level} level. Change its level`}, G.icons);
      const boxAt = (bx, y) => ({x0: bx - s * .4, x1: bx + w, y0: y - s * .85, y1: y + s * .5});
      let best = null;

          const bx = q[0] - w / 2 + s * .2 + dx * w, y = q[1] + dy * s, b = boxAt(bx, y);
          const off = Math.max(0, 4 - b.x0) + Math.max(0, b.x1 - (floor.w - 4)) + Math.max(0, 4 - b.y0) + Math.max(0, b.y1 - (floor.h - 4));
          const pad = {x0: b.x0 - 6, x1: b.x1 + 6, y0: b.y0 - 6, y1: b.y1 + 6};

      // the leader runs from the part to the badge's nearer edge

      mk('rect', {x: bx, y: y - s / 2, width: w, height: s, rx: s * .3, fill: '#fff', stroke: LVC[p.level], 'stroke-width': 3}, g);
      pathGlyph(g, p.kind, bx + s * .32, y - s * .22, s * .9, s * .44, LVC[p.level], Math.max(3, s * .1));

      levelGlyph(g, p.level, bx + w - s * .48, y, s * .34, LVC[p.level]);

      mk('text', {x: bx, y: y - s / 2 + s * .13, 'text-anchor': 'middle', 'font-size': s * .38, 'font-weight': 800, fill: '#fff', 'font-family': 'Trebuchet MS, Segoe UI, sans-serif'}, g).textContent = i + 1;

    drawParts(); syncDraw();
    showPressed();
    const names = res.parts.map((p, i) => (i ? 'then' : 'first') + cap(p.kind));
    const seq = how === 'surprise' ? ['surprise', ...names] : names;
    // the names, then (once) how to change a part's level, then how to dance it
    V.say([...seq, ['tapPart', {kind: 'how'}], ['danceIt', {kind: 'how', needs: '#d-dance'}]], {valid: () => D.gen === gen && D.parts.length > 0});
  }
  function syncDraw() { dis($('d-dance'), !state.draw.parts.length); }
  async function danceIt() {
    const D = state.draw;
    if (!D.parts.length || isDis($('d-dance'))) return;
    const tok = newRun('dance'), gen = D.gen, way = state.way;
    // one step per part, each at its own level; counts shared by length (2 or more each, even, so a gait's cycle ends)
    const parts = D.parts.map(p => ({kind: p.kind, level: p.level, geo: p.geo, len: plen(p.geo)})), sum = parts.reduce((a, p) => a + p.len, 0) || 1;
    const cs = parts.map(p => Math.max(2, 2 * Math.round(D.counts * p.len / sum / 2))), cum = [0];
    cs.forEach(c => cum.push(cum[cum.length - 1] + c));
    const lvAt = c => { for (let i = 0; i < cs.length; i++) if (c < cum[i + 1]) return parts[i].level; return parts[parts.length - 1].level; };
    if (D.ribbon) { D.ribbon.remove(); D.ribbon = null; }
    if (!(await walkTo(tok, STAR)) || !live(tok)) return;
    await V.say([way], {wait: true, valid: () => live(tok)});
    if (!live(tok)) return;
    const tr = Dance.trail(dancer, {layer: G.tr_draw, style: parts[0].level, styleAt: lvAt});
    state.pending = tr; state.traveling = true; setShownLevel(parts[0].level);
    const ok = await runCounts(tok, {bpm: WAYS[way].bpm, swing: WAYS[way].swing,
      phrase: Dance.phrase(parts.map((p, i) => ({gait: way, counts: cs[i], travel: Dance.path(p.geo), level: p.level}))), trails: [tr],
      onCount: n => { if (n >= 1) { const l = lvAt(n - .5); setShownLevel(l); state.trace.push([n, l]); } }});
    if (!ok) return;
    state.pending = null; D.ribbon = tr;
    const last = parts[parts.length - 1];
    tr.end(badge(last.kind, last.level));
    await Dance.tween(dancer, {pose: Dance.level('stand', last.level), facing: 0}, 500, () => live(tok));
    if (!live(tok)) return;
    V.say('doneDraw', {valid: () => D.gen === gen});
    endRun(tok);
  }
  // a surprise path of 2 or 3 parts from the star, checked with the same rule so the names always match the icons
  function surprisePath() {
    const kinds = ['straight', 'curved', 'zigzag'];
    for (let tries = 0; tries < 400; tries++) {
      const n = 2 + Math.floor(Math.random() * 2), want = [];
      while (want.length < n) { const k = kinds[Math.floor(Math.random() * 3)]; if (k !== want[want.length - 1]) want.push(k); }
      let x = STAR.x, z = STAR.z, h = (-25 + Math.random() * 20) * Math.PI / 180;
      const pts = [{x, z}];
      const go = (len, step = 1) => { for (let d = 0; d < len; d += step) { x += Math.cos(h) * step; z += Math.sin(h) * step; pts.push({x, z}); } };
      want.forEach((k, i) => {
        if (i) h += (Math.random() < .5 ? -1 : 1) * (75 + Math.random() * 25) * Math.PI / 180;
        if (k === 'straight') go(20 + Math.random() * 10);
        else if (k === 'curved') { const turnBy = (100 + Math.random() * 60) * Math.PI / 180 * (Math.random() < .5 ? -1 : 1), len = 32 + Math.random() * 10, steps = Math.round(len); for (let s = 0; s < steps; s++) { h += turnBy / steps; go(1); } }
        else { const sgn = Math.random() < .5 ? -1 : 1, base = h; for (let s = 0; s < 5; s++) { h = base + (s % 2 ? -1 : 1) * sgn * 55 * Math.PI / 180; go(10 + Math.random() * 3); } h = base; }
      });
      if (!pts.every(p => p.x >= 4 && p.x <= 96 && p.z >= 4 && p.z <= 57)) continue;
      if (crosses(pts)) continue;   // a pathway that crosses itself is hard to follow
      const res = analyze(pts);
      if (res.tooShort || res.lead) continue;
      if (res.parts.map(p => p.kind).join() !== want.join()) continue;
      if (res.parts.some(p => p.kind === 'zigzag' && p.geo.length < 5)) continue;   // a clear zigzag: three corners or more
      const mids = res.parts.map(p => Dance.path(p.geo).at(.5));
      if (mids.some((a, i) => mids.some((b, j) => j > i && dist(a, b) < 16))) continue;   // the part badges stay apart
      // mixed levels: each part its own, never all the same
      const lv = res.parts.map(() => LV[Math.floor(Math.random() * 3)]);
      if (new Set(lv).size < 2) lv[1] = LV[(LV.indexOf(lv[0]) + 1 + Math.floor(Math.random() * 2)) % 3];
      res.parts.forEach((p, i) => { p.level = lv[i]; });
      return res;
    }
    return analyze([{x: 10, z: 50}, {x: 60, z: 50}]);
  }
  // does a polyline cross itself (segments more than one apart that intersect)?
  function crosses(pts) {
    const q = pts.filter((_, i) => i % 2 === 0 || i === pts.length - 1);
    const X = (a, b, c, d) => { const o = (p, r, t) => Math.sign((r.x - p.x) * (t.z - p.z) - (r.z - p.z) * (t.x - p.x)); return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0; };
    for (let i = 0; i < q.length - 1; i++) for (let j = i + 2; j < q.length - 1; j++) if (X(q[i], q[i + 1], q[j], q[j + 1])) return true;
    return false;
  }
  // pointer drawing on the floor
  let drawing = null;
  sv.addEventListener('pointerdown', e => {
    if (state.mode !== 'draw' || e.button > 0) return;
    if (e.target.closest && e.target.closest('.part')) return;   // a part badge: its own tap
    V.said.add('wDraw');   // drawing already: the welcome would only come after the part names
    if (state.busy) { newRun('draw'); endRun(state.run); }
    const r = sv.getBoundingClientRect(), p = floor.unmap(e.clientX - r.left, e.clientY - r.top);
    if (p.z < -6 || p.z > 70 || p.x < -10 || p.x > 110) return;   // on the wall: not a drawing
    e.preventDefault();
    try { sv.setPointerCapture(e.pointerId); } catch {}
    drawing = e.pointerId;
    state.draw.gen++; V.dropQueued();
    state.draw.parts = []; drawParts();
    if (state.draw.ribbon) { state.draw.ribbon.remove(); state.draw.ribbon = null; }
    state.draw.raw = [{x: clamp(p.x, 0, 100), z: clamp(p.z, 0, 60)}];
    drawInk(); syncDraw();
  });
  sv.addEventListener('pointermove', e => {
    if (drawing !== e.pointerId) return;
    const r = sv.getBoundingClientRect(), p = floor.unmap(e.clientX - r.left, e.clientY - r.top);
    const q = {x: clamp(p.x, 0, 100), z: clamp(p.z, 0, 60)}, raw = state.draw.raw, l = raw[raw.length - 1];
    if (dist(q, l) > .4) { raw.push(q); drawInk(); }
  });
  const endDraw = e => {
    if (drawing !== e.pointerId) return;
    drawing = null;
    setDrawn(analyze(state.draw.raw || []));
  };
  sv.addEventListener('pointerup', endDraw);
  sv.addEventListener('pointercancel', endDraw);
  function clearDraw() {
    if (state.busy) { newRun('clear'); endRun(state.run); }
    const D = state.draw; D.gen++; D.raw = null; D.parts = []; D.geo = null;
    if (D.ribbon) { D.ribbon.remove(); D.ribbon = null; }
    drawParts(); drawInk(); syncDraw();
    const tok = ++state.run;
    walkTo(tok, STAR);
    V.how('wDraw');
  }

  // ------------------------------------------------------------ modes
  const MODES = ['levels', 'paths', 'mystery', 'draw'];
  function setMode(m) {
    stopRun(); V.hush(); state.run++;
    state.mode = m; document.body.dataset.mode = m;
    for (const k of MODES) { $('m-' + k).setAttribute('aria-pressed', k === m); $('c-' + k).hidden = k !== m; }
    for (const k of MODES) G['tr_' + k].style.display = k === m ? '' : 'none';
    G.drawn.textContent = ''; G.icons.textContent = '';
    dancer.scale = m === 'levels' ? 1 : .7;   // a smaller dancer on the travel floors, so the ribbons show
    if (m === 'levels') { dancer.set({pose: Dance.level(kf(state.lastMove, 0), state.level), x: MAT.x, z: MAT.z, facing: 0, lift: 0}); state.shownLevel = state.level; drawMoveIcons(); }
    else if (m === 'mystery') {
      const at = M.gallery ? GALLERY_SPOT : STAR;
      dancer.set({pose: M.gallery ? BOW : 'stand', ...at, facing: M.gallery ? BOW_FACING : 0, lift: 0});
      state.shownLevel = M.step === 'solved' || M.gallery ? (M.gallery ? null : ROUNDS[M.round].level) : null;
      if (!M.watched && M.step !== 'solved') M.step = 'go';
    } else { dancer.set({pose: Dance.level('stand', state.level), ...STAR, facing: 0, lift: 0}); state.shownLevel = state.level; }
    showPressed(); relayout(true);
    if (m === 'paths') previewPath();
    if (m === 'mystery') syncMystery();
    if (m === 'draw') syncDraw();
    $('svdesc').textContent = descText();
    const howNow = {levels: 'wLevels', paths: 'wPaths', mystery: M.gallery ? null : M.step === 'path' ? 'askPath' : M.step === 'level' ? 'askLevel' : M.step === 'solved' ? 'nextHow' : 'wMystery', draw: state.draw.parts.length ? 'danceIt' : 'wDraw'}[m];
    if (!V.welcome() && howNow) V.how(howNow);
    else if (!V.tapped || !Curio.sound) $('hint').textContent = L[{levels: 'wLevels', paths: 'wPaths', mystery: 'wMystery', draw: 'wDraw'}[m]];
    if (m === 'mystery' && M.gallery) $('hint').textContent = L.allDone;
  }
  for (const k of MODES) $('m-' + k).onclick = () => setMode(k);
  $('l-updown').onclick = () => upDown();
  $('l-surprise').onclick = () => surprise();
  $('p-go').onclick = () => pathGo();
  $('p-clean').onclick = () => cleanFloor();
  $('y-go').onclick = () => { if (!isDis($('y-go'))) mysTrip(false); };
  $('y-again').onclick = () => { if (!isDis($('y-again'))) mysTrip(true); };
  $('y-next').onclick = () => nextRound();
  $('y-replay').onclick = () => playAgain();
  $('d-dance').onclick = () => danceIt();
  $('d-surprise').onclick = () => { if (state.busy) { newRun('s'); endRun(state.run); } setDrawn(surprisePath(), 'surprise'); };
  $('d-clear').onclick = () => clearDraw();
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const i = '1234'.indexOf(e.key);
    if (i >= 0) { e.preventDefault(); setMode(MODES[i]); }
  });

  // ------------------------------------------------------------ layout (real pixels per size)
  let page = '', lastKey = '';
  function pageLayout() {
    const w = innerWidth, h = innerHeight;
    if (w < 640 || h > w * 1.15) return 'stack';
    if (w >= 1000 && h >= 700) return 'wide';
    return 'compact';
  }
  function relayout(force) {
    const p = pageLayout();
    if (p !== page) { page = p; for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p); }
    document.body.classList.toggle('short', innerHeight < 900);
    document.body.classList.toggle('narrowhead', innerWidth < 900);
    document.body.classList.toggle('tiny', innerHeight < 560);
    const st = $('stage');
    if (page === 'stack') { const w = st.getBoundingClientRect().width || innerWidth; st.style.height = Math.round(clamp(Math.min(w * .7, innerHeight * .5), 260, 520)) + 'px'; }
    else st.style.height = '';
    const r = st.getBoundingClientRect(), W = Math.max(280, Math.round(r.width)), H = Math.max(240, Math.round(r.height));
    const key = W + 'x' + H;
    if (key === lastKey && !force) return;
    lastKey = key;
    sv.setAttribute('width', W); sv.setAttribute('height', H); sv.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const gw = Math.round(clamp(W * .1, 56, 112)), stripH = Math.round(clamp(H * .075, 30, 52));
    const box = {x0: gw + 20, x1: W - 12, yBack: Math.round(H * .36), yFront: H - stripH - 8};
    const gTop = Math.round(H * .06);
    LAY = {guide: {x: 10, y: gTop, w: gw, h: box.yFront - gTop - 6},
      counts: {x: box.x0 + (box.x1 - box.x0) * .2, y: H - stripH - 2, w: (box.x1 - box.x0) * .6, h: stripH},
      dots: {x: W - 18, y: Math.round(clamp(H * .045, 14, 26)), r: clamp(H * .016, 6, 11)}};
    floor.resize(W, H, box);
    // keep the reflection in step and redraw everything placed in floor units
    dancer.render(); mirrorDancer.set({pose: dancer.pose, x: dancer.x, z: dancer.z, facing: dancer.facing, lift: dancer.lift});
    drawStage();
    if (state.mode === 'paths') previewPath();
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());

  Curio.init({clips: "voice:*", rate: .9});
  window.__tool = {state, setMode, allLines: V.allLines, V, vlog: V.log, get vq() { return V.queue; }, dancer, floor, analyze, surprisePath,
    ROUNDS, MOVES, PATHS, WAYS, WALK, Dance, S, ribbons, setDrawn, kf, tapLevel, doMove};
  setMode('levels');
})();
</script>
