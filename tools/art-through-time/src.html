<body>
<header>
  <h1>Art Through Time <small>art history and what changed it</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-timeline" aria-pressed="true">Timeline</button>
    <button id="m-changed" aria-pressed="false">What Changed?</button>
  </div>
  <button class="icon-btn" id="read">Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">Sound</button>
</header>
<main>
  <aside class="panel" aria-label="Museum desk">
    <p id="hint" class="hint" aria-live="polite"></p>
    <div id="detail"></div>
    <div class="filter-rack" id="filters-rack">
      <div class="filter-top">
        <button class="control" id="all" aria-pressed="false">All threads</button>
        <button class="control" id="spotlight">Spotlight ↗</button>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Thread types"></div>
      <p class="privacy">Session only. Nothing is saved or sent.</p>
    </div>
  </aside>
  <section class="stage" id="stage" aria-label="Art history timeline">
    <div class="gallery-top"><h2 id="stage-title">Every change has a thread.</h2><span id="opened-count">21 works · 12 events</span></div>

<script>
/* The shared art-museum engine is absent. The existing family adapter is embedded below. */
/* Tool-local adapter for the art-museum API specified in spec.md.
   The shared engine and family document do not exist in this checkout. */
const Museum = (() => {
  function frame(el, work, activate) {
    el.replaceChildren();
    el.className = 'museum-frame';
    const viewport = document.createElement('div');
    viewport.className = 'art-viewport';
    const image = document.createElement('img');
    image.src = work.img;
    image.alt = work.alt;
    image.draggable = false;
    const picture = document.createElement('button');
    picture.className = 'picture-target';
    picture.setAttribute('aria-label', 'Artwork: ' + work.title + '. Tap to look closer.');
    picture.append(image);
    picture.onclick = activate || (() => zoomTo(el, {x: .5, y: .5}));
    viewport.append(picture);
    el.append(viewport);
    el.work = work;
    el.viewport = viewport;
    el.picture = picture;
    el.zoomed = false;
    const fit = () => {
      if (!image.naturalWidth || !el.isConnected) return;
      const w = el.clientWidth - 28;
      const h = el.clientHeight - 28;
      const scale = Math.min(w / image.naturalWidth, h / image.naturalHeight);
      viewport.style.width = Math.max(44, image.naturalWidth * scale) + 'px';
      viewport.style.height = Math.max(44, image.naturalHeight * scale) + 'px';
    };
    image.onload = fit;
    if (image.complete) fit();
    el.fit = fit;
    el.observer = new ResizeObserver(fit);
    el.observer.observe(el);
    return el;
  }
  function finish(el) {
    el.picture?.getAnimations().forEach(a => a.finish());
  }
  function zoomTo(el, spot) {
    finish(el);
    const x = Math.max(-140, Math.min(0, 50 - spot.x * 240));
    const y = Math.max(-140, Math.min(0, 50 - spot.y * 240));
    el.picture.style.transform = `translate(${x}%, ${y}%) scale(2.4)`;
    el.picture.style.transformOrigin = '0 0';
    el.zoomed = true;
    el.classList.add('zoomed');
    if (document.activeElement?.classList.contains('tell-pin')) el.picture.focus({preventScroll: true});
    el.querySelectorAll('.tell-pin').forEach(p => p.hidden = true);
    let ring = el.viewport.querySelector('.zoom-ring');
    if (!ring) {
      ring = document.createElement('i');
      ring.className = 'zoom-ring';
      el.viewport.append(ring);
    }
    ring.style.left = `${spot.x * 240 + x}%`;
    ring.style.top = `${spot.y * 240 + y}%`;
  }
  function unzoom(el) {
    finish(el);
    if (!el.picture) return;
    el.picture.style.transform = '';
    el.zoomed = false;
    el.classList.remove('zoomed');
    el.querySelectorAll('.tell-pin').forEach(p => p.hidden = false);
    el.viewport.querySelector('.zoom-ring')?.remove();
  }
  function pins(el, spots, opts) {
    el.querySelectorAll('.tell-pin').forEach(p => p.remove());
    for (const spot of spots) {
      const pin = document.createElement('button');
      pin.className = 'tell-pin';
      pin.style.left = `clamp(22px, ${spot.x * 100}%, calc(100% - 22px))`;
      pin.style.top = `clamp(22px, ${spot.y * 100}%, calc(100% - 22px))`;
      pin.innerHTML = opts.icon(spot.key);
      pin.setAttribute('aria-label', spot.label + ': look closer');
      pin.onclick = () => {
        opts.onPin(spot);
        zoomTo(el, spot);
      };
      el.viewport.append(pin);
    }
  }
  function label(el, work) {
    el.replaceChildren();
    const title = document.createElement('h2');
    title.textContent = work.title;
    const artist = document.createElement('p');
    artist.textContent = work.attribution;
    const detail = document.createElement('p');
    detail.textContent = work.date + (work.made ? ' · ' + work.made : '');
    const link = document.createElement('a');
    link.href = work.url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = work.museum + ' ↗';
    el.append(title, artist, detail, link);
  }
  function pair(el, workA, workB) {
    el.replaceChildren();
    for (const work of [workA, workB]) {
      const mount = document.createElement('div');
      el.append(mount);
      frame(mount, work);
    }
  }
  function dispose(root) {
    root?.querySelectorAll('.museum-frame').forEach(f => f.observer?.disconnect());
  }
  return {frame, zoomTo, unzoom, pins, label, pair, finish, dispose};
})();

</script>

    else scroll.scrollLeft += (e.key === 'ArrowRight' ? 1 : -1) * scroll.clientWidth * .65;
  };
  document.querySelectorAll('[data-era]').forEach(b => b.onclick = () => {
    action();
    const years = {ancient: -550, 1000: 1250, 1500: 1550, 1800: 1865, 1900: 1907};
    document.querySelectorAll('[data-era]').forEach(el => el.setAttribute('aria-pressed', el === b));
    const compact = innerHeight < 520 || innerWidth < 601;
    zoomTo(compact ? 2 : 1, compact && b.dataset.era === '1500' ? 1515 : years[b.dataset.era]);
  });
  $('zoom-in').onclick = () => { action(); zoomTo(state.zoom * 1.5); };
  $('zoom-out').onclick = () => { action(); zoomTo(state.zoom / 1.5); };
  $('spotlight').onclick = () => {
    const choices = WORKS.filter(w => !state.opened.has(w.id));
    const w = shuffle(choices.length ? choices : WORKS)[0];
    zoomTo(1, w.year);
    openRecord(w.id);
    $('close-detail').focus({preventScroll: true});
  };
  $('all').onclick = () => {
    action();
    state.all = !state.all;
    updateFilters();
    drawThreads();
    Curio.tone(state.all ? 520 : 340, .055, .03);
  };
  for (const type of Object.keys(TYPES)) {
    const b = makeButton('', 'control', () => {
      action();
      state.filters.has(type) ? state.filters.delete(type) : state.filters.add(type);
      updateFilters();
      drawThreads();
      Curio.tone(420, .05, .03);
    });
    b.dataset.type = type;
    b.setAttribute('aria-pressed', 'true');
    b.innerHTML = icon(type) + type;
    $('filters').append(b);
    const item = document.createElement('span');
    item.className = 'legend-item ' + TYPES[type].key;
    item.innerHTML = `<i class="line"></i>${icon(type)}${type}`;
    $('legend').append(item);
  }
  $('m-timeline').onclick = () => setMode('timeline');
  $('m-changed').onclick = () => setMode('changed');
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const frame = document.querySelector('.museum-frame');
    if (frame?.zoomed) Museum.unzoom(frame);
    else if (state.mode === 'timeline' && state.selected) closeDetail();
  });
  Curio.init({clips: "voice:*", rate: .95});
  Curio.onMotion(() => { drawThreads(); document.querySelectorAll('.museum-frame').forEach(Museum.finish); });
  let resizeFrame;
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      const year = state.length ? centerYear() : 1550;
      layoutBand();
      goYear(year, false);
    });
  }).observe($('band-wrap'));
  state.zoom = innerHeight < 520 || innerWidth < 601 ? 2 : 1;
  setMode('timeline');
  goYear(innerWidth < 601 ? 1515 : state.zoom === 2 ? 1495 : 1540, false);
  window.__tool = {
    state, setMode, allLines: V.allLines, vlog: V.log, get vq() { return V.queue; },
    DATA, openRecord, pullThread, place, nextEvent, current, rightThreads, zoomTo, goYear, layoutBand, drawThreads,
  };
})();
</script>
</body>
</html>
