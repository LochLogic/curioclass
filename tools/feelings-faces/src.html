<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feelings Faces · Feelings and friends · Curio Class</title>
<meta name="description" content="Read faces for clues: eyebrows, eyes and mouth. Name the feeling, talk through short scenes about friends, choose a kind thing to say or do, and build faces with sliders. Grades K-2 health, teacher-led. Works offline.">
<!--
FEELINGS FACES (Curio Class)
Grades K-2 health, NHES 2024 Standard 4 (communication: expressing feelings, listening, kind words) and
Standard 8 (helping others), with CASEL Social Awareness (recognizing others' emotions, empathy).
Teacher-led on a projector. Eight feelings on six children's painted faces (Google Gemini, one portrait per child as the reference so
only the expression changes), with clue labels that point at the eyebrows, eyes and mouth. Face clues (guess, then see the
clues), What happened? (short scenes, then choose a kind response) and Make a face (sliders; the class copies
it and names it). Feelings are never wrong: the scenes accept more than one answer.
One file, no network requests. Illustrations generated with Google Gemini, edited for Curio Class.
Content CC BY 4.0, code MIT. curioclass.org
-->
<style>
:root{
  --paper:#fff7fb;--ink:#2d2333;--muted:#6a5a70;--line:#f2d9e6;--focus:#2f5bd3;--brand:#b0407a;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--brand);color:#fff5fa}
h1{margin:0 auto 0 0;font:800 clamp(22px,3vw,32px)/1.1 'Trebuchet MS','Segoe UI',sans-serif}
h1 small{display:block;font:500 15px/1.3 'Segoe UI',sans-serif;color:#ffd6ea}
.seg{display:inline-flex;border:2px solid #d474a6;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#c3528d;color:#fff5fa;min-height:52px;padding:0 16px;font-weight:700;font-size:16px}
.seg button[aria-pressed="true"]{background:#ffd34d;color:#3a2c00}
.icon-btn{border:2px solid #d474a6;background:#c3528d;color:#fff5fa;border-radius:999px;min-height:52px;padding:0 16px;font-weight:700;font-size:16px}

main{display:grid;grid-template-columns:1fr;min-height:0}
@media (min-width:760px){main{grid-template-columns:minmax(0,1fr) 340px}}
.stage{position:relative;overflow:hidden;min-height:340px;background:radial-gradient(circle at 30% 40%,#fff 0 30%,#ffe3ef 70%)}
.scene{position:absolute;left:50%;top:50%;width:1000px;height:620px;transform:translate(-50%,-50%) scale(var(--s,1))}

.face{position:absolute;left:30px;top:20px;width:470px;height:470px}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;transition:opacity .35s}
.face svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.calm .face img{transition:none}
.who{position:absolute;left:30px;top:490px;width:470px;text-align:center;font:800 30px 'Trebuchet MS',sans-serif;color:var(--muted)}
.callout{font:800 24px 'Trebuchet MS',sans-serif;fill:#2d2333}
.callout-bg{fill:#fff;stroke:#2d2333;stroke-width:3}

.side{position:absolute;left:530px;top:24px;width:440px;display:flex;flex-direction:column;gap:12px}
.story{background:#fff;border:4px solid #2d2333;border-radius:24px;padding:16px 20px;font:800 27px/1.3 'Trebuchet MS',sans-serif;box-shadow:0 5px 0 #0002}
.story small{display:block;font:700 19px/1.35 'Segoe UI',sans-serif;color:var(--muted);margin-top:8px}
.story:empty{display:none}
.feels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feel{border:3px solid transparent;border-radius:16px;background:var(--c);min-height:78px;font:800 17px/1.1 'Trebuchet MS',sans-serif;color:#2d2333;box-shadow:0 4px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.feel span{font-size:28px;line-height:1}
.feel[aria-pressed="true"]{border-color:#2d2333;transform:translateY(2px);box-shadow:0 2px 0 #0002}
.feel.right{border-color:#2a9d4a;box-shadow:0 0 0 4px #2a9d4a55}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{border:3px solid #e6cbd9;border-radius:18px;background:#fff;min-height:64px;padding:8px 14px;font:700 21px/1.25 'Trebuchet MS',sans-serif;text-align:left;display:flex;gap:10px;align-items:center}
.ans b{flex:none;width:34px;height:34px;border-radius:50%;background:#f4dbe8;display:grid;place-items:center}
.ans.good{border-color:#2a9d4a;background:#eafbef}
.ans.meh{border-color:#e9a23b;background:#fff6e5}
.ans.bad{border-color:#d8423a;background:#fdeceb}
.big-word{font:900 58px/1 'Trebuchet MS',sans-serif;color:var(--brand);text-align:center}

.sliders{display:flex;flex-direction:column;gap:2px;background:#fff;border-radius:22px;padding:8px 18px;box-shadow:0 5px 0 #0002}
.sliders label{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;font:800 19px 'Trebuchet MS',sans-serif}
.sliders input{width:100%;height:30px;accent-color:#b0407a}
.sliders .ends{display:flex;justify-content:space-between;font:600 13px 'Segoe UI',sans-serif;color:var(--muted);margin:-6px 0 2px 130px}

.panel{background:#fffbfd;border-left:3px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
@media (max-width:759px){.panel{border-left:0;border-top:3px solid var(--line)}}
.hint{margin:0;font:600 18px/1.35 'Segoe UI',sans-serif;color:var(--muted)}
.hint b{color:var(--ink)}
.big-btn{border:0;border-radius:16px;min-height:60px;font:800 20px/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:#fff;background:var(--brand);box-shadow:0 5px 0 #0004;padding:6px 10px}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.big-btn.soft{background:#f6e3ed;color:var(--ink)}
.big-btn.gold{background:#ffd34d;color:#3a2c00}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}.row .big-btn{flex:1}
.tip{margin:0;background:#fdeef5;border-left:6px solid #d474a6;border-radius:10px;padding:10px 12px;font:600 17px/1.4 'Segoe UI',sans-serif}
.tip:empty{display:none}

@media (max-width:759px),(max-height:640px){
  header{padding:6px 12px} h1{font-size:19px} h1 small{display:none}
  .seg button,.icon-btn{min-height:38px;font-size:13px;padding:0 10px}
  main{grid-template-columns:minmax(0,1fr) 260px}
  .panel{padding:8px 10px;gap:8px}
  .hint,.tip{font-size:14px}
  .big-btn{min-height:44px;font-size:16px}
}
</style>
</head>
<body>
<header>
  <h1>Feelings Faces <small>Look for clues. Name the feeling. Be a kind friend.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-clues" aria-pressed="true">Face clues</button>
    <button id="m-scene" aria-pressed="false">What happened?</button>
    <button id="m-make" aria-pressed="false">Make a face</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <div class="stage" id="stage">
    <div class="scene" id="scene">
      <div class="face" id="facebox" role="img" aria-label="A face"><img id="pa" alt=""><img id="pb" alt="" style="opacity:0"><svg id="face" viewBox="0 0 470 470" aria-hidden="true"></svg></div>
      <div class="who" id="who"></div>
      <div class="side" id="side">
        <div class="story" id="story" aria-live="polite"></div>
        <div class="feels" id="feels" role="group" aria-label="Feelings"></div>
        <div class="answers" id="answers"></div>
        <div class="sliders" id="sliders" hidden></div>
      </div>
    </div>
  </div>
  <aside class="panel">
    <p class="hint" id="hint"></p>
    <div class="col" id="ctrl"></div>
    <p class="tip" id="tip"></p>
  </aside>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const fit = () => { const r = $('stage').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1000, r.height / 620)); };
  new ResizeObserver(fit).observe($('stage'));
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, a, parent) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent && parent.append(e); return e; };

  // ---------- feelings as face settings ----------
  // brow: inner ends down (-1, angry) to up (+1, worried); lift: eyebrows low to high; eye: open 0-1.4;
  // mouth: frown -1 to smile +1; open: 0-1; wavy: a wobbly mouth; tear; nose: wrinkled
  const FEEL = {
    happy:     {e: '😊', c: '#ffe27a', p: {brow: 0, lift: .25, eye: .85, mouth: 1, open: .35}, clues: ['Eyebrows relaxed', 'Eyes crinkle', 'Big smile']},
    sad:       {e: '😢', c: '#a9c4e6', p: {brow: .85, lift: .1, eye: .55, mouth: -.8, open: 0, tear: 1}, clues: ['Eyebrows go up in the middle', 'Droopy eyes, maybe tears', 'Mouth turns down']},
    mad:       {e: '😠', c: '#ff9f80', p: {brow: -1, lift: -.7, eye: .7, mouth: -.45, open: .18}, clues: ['Eyebrows push down and together', 'Eyes look hard', 'Mouth tight or teeth showing']},
    scared:    {e: '😨', c: '#c3b4e8', p: {brow: .9, lift: .95, eye: 1.4, mouth: -.35, open: .55}, clues: ['Eyebrows up and pulled together', 'Eyes very wide', 'Mouth stretched open']},
    surprised: {e: '😮', c: '#9fe3d4', p: {brow: 0, lift: 1, eye: 1.4, mouth: 0, open: 1}, clues: ['Eyebrows way up', 'Eyes wide open', 'Mouth open in an O']},
    worried:   {e: '😟', c: '#d6dbe3', p: {brow: .7, lift: .35, eye: .9, mouth: -.25, open: 0, wavy: 1}, clues: ['Eyebrows tilt up in the middle', 'Eyes looking around', 'Wobbly mouth']},
    disgusted: {e: '🤢', c: '#cfe8a6', p: {brow: -.5, lift: -.3, eye: .45, mouth: -.55, open: .2, nose: 1}, clues: ['Eyebrows down', 'Nose wrinkles up', 'Mouth pulls down: yuck!']},
    calm:      {e: '😌', c: '#cfe6f7', p: {brow: 0, lift: 0, eye: .2, mouth: .4, open: 0}, clues: ['Eyebrows soft', 'Eyes relaxed, almost closed', 'Small, gentle smile']},
  };
  const NAMES = Object.keys(FEEL);
  const label = n => n === 'disgusted' ? 'grossed out' : n;
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const NEUTRAL = {brow: 0, lift: 0, eye: .8, mouth: .1, open: 0, wavy: 0, tear: 0, nose: 0};

  // six children (painted portraits below; the colors here are left from the old drawn faces and unused)
  const KIDS = [
    {name: 'Ana', skin: '#c68a5e', hair: '#2b1a12', style: 'curls'},
    {name: 'Jamal', skin: '#7a4a2e', hair: '#1a110c', style: 'short'},
    {name: 'Mei', skin: '#f1c8a0', hair: '#1c1714', style: 'bob'},
    {name: 'Leo', skin: '#f4cfb2', hair: '#c9832f', style: 'spiky'},
    {name: 'Priya', skin: '#a8714b', hair: '#20140f', style: 'braids'},
    {name: 'Sam', skin: '#e0ac84', hair: '#5a3a22', style: 'short'},
  ];

  // labels that point at eyebrows, eyes and mouth
  // painted faces (Gemini): one child, nine expressions each, so only the feeling changes between pictures
  const PHOTO = {
    ana: {neutral: 'art:ana-neutral', happy: 'art:ana-happy', sad: 'art:ana-sad', mad: 'art:ana-mad', scared: 'art:ana-scared', surprised: 'art:ana-surprised', worried: 'art:ana-worried', disgusted: 'art:ana-disgusted', calm: 'art:ana-calm'},
    jamal: {neutral: 'art:jamal-neutral', happy: 'art:jamal-happy', sad: 'art:jamal-sad', mad: 'art:jamal-mad', scared: 'art:jamal-scared', surprised: 'art:jamal-surprised', worried: 'art:jamal-worried', disgusted: 'art:jamal-disgusted', calm: 'art:jamal-calm'},
    mei: {neutral: 'art:mei-neutral', happy: 'art:mei-happy', sad: 'art:mei-sad', mad: 'art:mei-mad', scared: 'art:mei-scared', surprised: 'art:mei-surprised', worried: 'art:mei-worried', disgusted: 'art:mei-disgusted', calm: 'art:mei-calm'},
    leo: {neutral: 'art:leo-neutral', happy: 'art:leo-happy', sad: 'art:leo-sad', mad: 'art:leo-mad', scared: 'art:leo-scared', surprised: 'art:leo-surprised', worried: 'art:leo-worried', disgusted: 'art:leo-disgusted', calm: 'art:leo-calm'},
    priya: {neutral: 'art:priya-neutral', happy: 'art:priya-happy', sad: 'art:priya-sad', mad: 'art:priya-mad', scared: 'art:priya-scared', surprised: 'art:priya-surprised', worried: 'art:priya-worried', disgusted: 'art:priya-disgusted', calm: 'art:priya-calm'},
    sam: {neutral: 'art:sam-neutral', happy: 'art:sam-happy', sad: 'art:sam-sad', mad: 'art:sam-mad', scared: 'art:sam-scared', surprised: 'art:sam-surprised', worried: 'art:sam-worried', disgusted: 'art:sam-disgusted', calm: 'art:sam-calm'}
  };
  const KID_ID = ['ana', 'jamal', 'mei', 'leo', 'priya', 'sam'];
  // labels point at the eyebrows, eyes and mouth (spots as fractions of the 470px picture box: portraits share one framing)
  function drawClues(svg, clues) {
    const spots = [[235, 150, 12, 26], [200, 178, 0, 236], [235, 238, 120, 418]];
    clues.forEach((t, i) => {
      const [x, y, lx, ly] = spots[i], g = el('g', {}, svg);
      const tx = el('text', {x: lx + 12, y: ly + 24, class: 'callout'}, g); tx.textContent = t;
      const bb = tx.getBBox();
      const bg = el('rect', {x: bb.x - 10, y: bb.y - 6, width: bb.width + 20, height: bb.height + 12, rx: 12, class: 'callout-bg'});
      g.insertBefore(bg, tx);
      const ex = Math.max(bb.x - 10, Math.min(bb.x + bb.width + 10, x)), ey = y < bb.y ? bb.y - 6 : bb.y + bb.height + 6;
      g.insertBefore(el('line', {x1: x, y1: y, x2: ex, y2: ey, stroke: '#2d2333', 'stroke-width': 3}), bg);
      g.insertBefore(el('circle', {cx: x, cy: y, r: 8, fill: '#ffd34d', stroke: '#2d2333', 'stroke-width': 3}), bg);
      if (!reduce) g.animate([{opacity: 0, transform: 'translateY(8px)'}, {opacity: 1, transform: 'none'}], {duration: 400, delay: i * 500, fill: 'backwards'});
    });
  }
  // show a child's painted face for a feeling, cross-fading from the last one
  let curP = {...NEUTRAL}, tw = 0, which = 'a', shownSrc = '';
  function morph(k, to, clues) {
    const n = Object.keys(to).length === 0 ? 'neutral' : (NAMES.find(x => FEEL[x].p === to) || closest(to));
    curP = {...NEUTRAL, ...to}; tw++;
    const src = PHOTO[KID_ID[KIDS.indexOf(k)]][n];
    if (src !== shownSrc) {
      const next = which === 'a' ? 'b' : 'a';
      $('p' + next).src = src; $('p' + next).style.opacity = 1; $('p' + which).style.opacity = 0;
      $('p' + next).style.zIndex = 1; $('p' + which).style.zIndex = 0;
      which = next; shownSrc = src;
    }
    $('facebox').setAttribute('aria-label', `${k.name} looks ${n === 'neutral' ? 'calm and still' : label(n)}`);
    $('face').replaceChildren();
    if (clues) drawClues($('face'), clues);
  }

  // ---------- scenes ----------
  const SCENES = [
    {kid: 0, t: 'Ana\'s best friend is moving to another town.', f: ['sad', 'worried'],
      a: [['Say: "I\'m sorry. Do you want to make a card for her?"', 'good'], ['Say: "Don\'t be sad."', 'meh'], ['Walk away and play by yourself.', 'bad']]},
    {kid: 1, t: 'Someone knocked over Jamal\'s block tower on purpose.', f: ['mad', 'sad'],
      a: [['Say: "That wasn\'t fair. Want help building it again?"', 'good'], ['Laugh at the fallen blocks.', 'bad'], ['Knock over their tower too.', 'bad']]},
    {kid: 2, t: 'Mei hears a loud bang in the hallway.', f: ['scared', 'surprised'],
      a: [['Say: "That was loud! Let\'s tell the teacher."', 'good'], ['Say: "Boo!" to scare her more.', 'bad'], ['Stay close and say: "You\'re okay. I\'m here."', 'good']]},
    {kid: 3, t: 'Leo opens a present and it\'s the puppy book he wanted!', f: ['happy', 'surprised'],
      a: [['Say: "Wow! Can you show me the puppy pictures?"', 'good'], ['Say: "My present was better."', 'bad'], ['Smile and say: "Happy birthday!"', 'good']]},
    {kid: 4, t: 'Priya has to read out loud in front of the class tomorrow.', f: ['worried', 'scared'],
      a: [['Say: "Want to practice with me at recess?"', 'good'], ['Say: "Everyone will laugh."', 'bad'], ['Say: "You can do it. Take a big breath first."', 'good']]},
    {kid: 5, t: 'Sam finds old, smelly food at the bottom of his backpack.', f: ['disgusted', 'surprised'],
      a: [['Say: "Yuck! Let\'s find a trash can."', 'good'], ['Tell everyone that Sam\'s backpack is gross.', 'bad'], ['Hand him a paper towel.', 'good']]},
    {kid: 0, t: 'Ana reads a book on a beanbag while soft music plays.', f: ['calm', 'happy'],
      a: [['Read quietly next to her.', 'good'], ['Jump on the beanbag.', 'bad'], ['Ask quietly: "What\'s your book about?"', 'good']]},
    {kid: 1, t: 'Jamal can\'t find his mom at the busy store.', f: ['scared', 'worried'],
      a: [['Say: "Let\'s ask a store helper. They can find her."', 'good'], ['Say: "You\'re lost forever!"', 'bad'], ['Stay with him and wave for a grown-up.', 'good']]},
    {kid: 2, t: 'Mei tried really hard, but she didn\'t win the race.', f: ['sad', 'mad'],
      a: [['Say: "You ran so fast! Want to race again later?"', 'good'], ['Say: "Ha ha, I won!"', 'bad'], ['Say: "It\'s just a race."', 'meh']]},
    {kid: 3, t: 'Leo\'s friend says, "You can\'t play with us."', f: ['sad', 'mad'],
      a: [['Say: "Come play with me, Leo!"', 'good'], ['Say nothing and keep playing.', 'meh'], ['Say: "Yeah, go away."', 'bad']]},
  ];
  const ANS_FEED = {
    good: 'That\'s a kind choice. It helps your friend feel better.',
    meh: 'That might not help much. What could you say that shows you care?',
    bad: 'That could hurt. How would you feel if someone did that to you?',
  };

  const state = {mode: 'clues', kid: 0, feel: 'happy', scene: -1, sound: true, guessed: false, make: {...NEUTRAL}};

  // ---------- sound ----------
  let ctx;
  const audio = () => (ctx ||= new (window.AudioContext || window.webkitAudioContext)());
  function tone(f, dur = .2, gain = .07, when = 0, type = 'triangle') {
    if (!state.sound) return;
    const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    yes: () => [523, 659, 784].forEach((f, i) => tone(f, .25, .08, i * .1)),
    hmm: () => { tone(392, .2, .06, 0, 'sine'); tone(440, .25, .06, .2, 'sine'); },
    no: () => { tone(260, .2, .06, 0, 'sine'); tone(220, .3, .06, .18, 'sine'); },
    pop: () => tone(880, .1, .05, 0, 'sine'),
  };

  // ---------- feeling buttons ----------
  $('feels').replaceChildren(...NAMES.map(n => {
    const b = document.createElement('button');
    b.className = 'feel'; b.dataset.n = n; b.style.setProperty('--c', FEEL[n].c);
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<span aria-hidden="true">${FEEL[n].e}</span>${label(n)}`;
    b.onclick = () => pick(n);
    return b;
  }));
  const pressFeel = (n, right = []) => [...$('feels').children].forEach(b => { b.setAttribute('aria-pressed', b.dataset.n === n); b.classList.toggle('right', right.includes(b.dataset.n)); });
  function pick(n) {
    if (state.mode === 'clues') return guessFace(n);
    if (state.mode === 'scene') return guessScene(n);
    return makeFeel(n);
  }

  // ---------- Face clues ----------
  function nextFace() {
    const pool = NAMES.filter(n => n !== state.feel);
    state.feel = pool[Math.random() * pool.length | 0];
    state.kid = (state.kid + 1 + Math.random() * 4 | 0) % KIDS.length;
    state.guessed = false;
    const k = KIDS[state.kid];
    $('who').textContent = k.name;
    morph(k, FEEL[state.feel].p);
    pressFeel(null);
    $('story').innerHTML = `How does ${k.name} feel?<small>Look at the eyebrows, the eyes and the mouth.</small>`;
    $('tip').innerHTML = '';
    say('How does this friend feel? Look at the eyebrows, the eyes and the mouth.');
  }
  function showClues() {
    const k = KIDS[state.kid];
    morph(k, FEEL[state.feel].p, FEEL[state.feel].clues);
    SFX.pop();
    say(FEEL[state.feel].clues.map(c => c + '.'));
  }
  function guessFace(n) {
    const k = KIDS[state.kid], right = n === state.feel;
    pressFeel(n, right ? [n] : []);
    if (right) {
      SFX.yes(); state.guessed = true;
      morph(k, FEEL[n].p, FEEL[n].clues);
      $('story').innerHTML = `${k.name} feels <b>${label(n)}</b>.<small>Can you make a ${label(n)} face too?</small>`;
      $('tip').innerHTML = `<b>Clues:</b> ${FEEL[n].clues.join(', ').toLowerCase()}.`;
      say([`Yes! That's ${label(n)}.`, `Can you make a ${label(n)} face too?`]);
    } else {
      SFX.hmm();
      $('tip').innerHTML = `Hmm, look again. A ${label(n)} face has: ${FEEL[n].clues.join(', ').toLowerCase()}. Does ${k.name}'s face match?`;
      say(`Hmm, look again. Press Show the clues for help.`);
    }
  }

  // ---------- What happened? ----------
  function nextScene() {
    state.scene = (state.scene + 1) % SCENES.length;
    const s = SCENES[state.scene], k = KIDS[s.kid];
    state.kid = s.kid; state.guessed = false;
    $('who').textContent = k.name;
    morph(k, {});
    pressFeel(null);
    $('story').innerHTML = `${s.t}<small>How might ${k.name} feel?</small>`;
    $('answers').replaceChildren();
    $('feels').hidden = false;
    $('tip').innerHTML = '';
    say([s.t, `How might ${k.name} feel?`]);
  }
  function guessScene(n) {
    const s = SCENES[state.scene], k = KIDS[s.kid], fits = s.f.includes(n);
    pressFeel(n, s.f);
    morph(k, FEEL[n].p);
    state.guessed = true;
    const other = s.f.filter(x => x !== n).map(label);
    $('story').innerHTML = `${s.t}<small>${fits ? `Yes, ${k.name} might feel ${label(n)}.${other.length ? ` ${k.name} might also feel ${other.join(' or ')}.` : ''}` : `Some people might feel ${label(n)}. Feelings can be different! Many kids would feel ${s.f.map(label).join(' or ')}.`}</small>`;
    fits ? SFX.yes() : SFX.hmm();
    say([fits ? `Yes, ${k.name} might feel ${label(n)}.` : 'Feelings can be different!', `What could you say or do to help ${k.name}?`]);
    showAnswers();
  }
  function showAnswers() {
    const s = SCENES[state.scene];
    $('answers').replaceChildren(...s.a.map(([t, kind], i) => {
      const b = document.createElement('button');
      b.className = 'ans';
      b.innerHTML = `<b>${'ABC'[i]}</b>${t}`;
      b.onclick = () => {
        $('answers').querySelectorAll('.ans').forEach(x => x.classList.remove('good', 'meh', 'bad'));
        b.classList.add(kind);
        ({good: SFX.yes, meh: SFX.hmm, bad: SFX.no})[kind]();
        $('tip').innerHTML = `<b>${'ABC'[i]}.</b> ${ANS_FEED[kind]}`;
        say(ANS_FEED[kind]);
        if (kind === 'good') morph(KIDS[s.kid], FEEL.happy.p);
      };
      return b;
    }));
    $('feels').hidden = true;
  }

  // ---------- Make a face ----------
  const SL = [
    ['lift', 'Eyebrows', -1, 1, 'down', 'up'],
    ['brow', 'Brow tilt', -1, 1, 'angry', 'worried'],
    ['eye', 'Eyes', .1, 1.4, 'closed', 'wide'],
    ['mouth', 'Mouth', -1, 1, 'frown', 'smile'],
    ['open', 'Open', 0, 1, 'shut', 'open'],
  ];
  function makeMode() {
    $('sliders').innerHTML = SL.map(([k, t, lo, hi, a, b]) => `<label>${t}<input type="range" data-k="${k}" min="${lo}" max="${hi}" step="0.05" value="${state.make[k]}"></label><div class="ends"><span>${a}</span><span>${b}</span></div>`).join('');
    $('sliders').querySelectorAll('input').forEach(i => i.oninput = () => { state.make[i.dataset.k] = +i.value; state.make.tear = state.make.wavy = state.make.nose = 0; blend(KIDS[state.kid], state.make); nameIt(); });
    blend(KIDS[state.kid], state.make); nameIt();
  }
  // sliders: the two closest painted faces, the nearer one underneath and the other faded over it by how close it is,
  // so every slider move shows (a half-way face is half of each)
  function blend(k, p) {
    const d = n => SL.reduce((s, [key]) => s + (((n === 'neutral' ? NEUTRAL : {...NEUTRAL, ...FEEL[n].p})[key]) - p[key]) ** 2, 0);
    const [a, b] = ['neutral', ...NAMES].map(n => [n, Math.sqrt(d(n))]).sort((x, y) => x[1] - y[1]);
    const kid = PHOTO[KID_ID[KIDS.indexOf(k)]], w = a[1] + b[1] ? a[1] / (a[1] + b[1]) : 0;
    const lo = $('pa'), hi = $('pb');
    if (lo.getAttribute('src') !== kid[a[0]]) lo.src = kid[a[0]];
    if (hi.getAttribute('src') !== kid[b[0]]) hi.src = kid[b[0]];
    lo.style.zIndex = 0; hi.style.zIndex = 1; lo.style.opacity = 1; hi.style.opacity = w.toFixed(2);  // 0 at a painted face, .5 half way (so nothing jumps when the two swap)
    which = 'b'; shownSrc = '';  // the next named face cross-fades in from here
    curP = {...p};
    $('facebox').setAttribute('aria-label', `${k.name} looks ${a[0] === 'neutral' ? 'calm and still' : label(a[0])}`);
    $('face').replaceChildren();
  }
  function closest(p) {
    const d = n => SL.reduce((s, [k]) => s + ((FEEL[n].p[k] ?? NEUTRAL[k]) - (p[k] ?? NEUTRAL[k])) ** 2, 0);
    return NAMES.slice().sort((a, b) => d(a) - d(b))[0];
  }
  function nameIt() {
    const n = closest(state.make);
    $('story').innerHTML = `This looks <b>${label(n)}</b> ${FEEL[n].e}<small>Everyone, copy this face! What might make ${KIDS[state.kid].name} feel ${label(n)}?</small>`;
    pressFeel(n);
  }
  function makeFeel(n) {
    state.make = {...NEUTRAL, ...FEEL[n].p};
    morph(KIDS[state.kid], state.make);
    $('sliders').querySelectorAll('input').forEach(i => i.value = state.make[i.dataset.k]);
    pressFeel(n);
    $('story').innerHTML = `A <b>${label(n)}</b> face ${FEEL[n].e}<small>Move the sliders. Can you change it to a different feeling?</small>`;
    say(`A ${label(n)} face. Everyone, make a ${label(n)} face!`);
  }

  function setMode(m) {
    state.mode = m; stopTalk();
    for (const [id, k] of [['m-clues', 'clues'], ['m-scene', 'scene'], ['m-make', 'make']]) $(id).setAttribute('aria-pressed', m === k);
    $('sliders').hidden = m !== 'make'; $('answers').replaceChildren(); $('feels').hidden = false; $('tip').innerHTML = '';
    if (m === 'clues') {
      $('ctrl').innerHTML = '<button class="big-btn gold" id="clue-btn">🔍 Show the clues</button><button class="big-btn" id="next">Next face →</button>';
      $('clue-btn').onclick = showClues; $('next').onclick = nextFace;
      $('hint').innerHTML = '<b>Face clues.</b> Ask: how does this friend feel? How can you tell? Then tap a feeling. <b>Show the clues</b> points at the eyebrows, eyes and mouth.';
      nextFace();
    }
    if (m === 'scene') {
      $('ctrl').innerHTML = '<button class="big-btn" id="next">Next story →</button>';
      $('next').onclick = nextScene;
      $('hint').innerHTML = '<b>What happened?</b> Read the story. How might they feel? There can be more than one answer. Then choose a kind thing to say or do.';
      state.scene = -1; nextScene();
    }
    if (m === 'make') {
      $('ctrl').innerHTML = '<div class="row"><button class="big-btn soft" id="kid">👤 New friend</button><button class="big-btn soft" id="rst">↺ Reset</button></div>';
      $('kid').onclick = () => { state.kid = (state.kid + 1) % KIDS.length; $('who').textContent = KIDS[state.kid].name; makeMode(); };
      $('rst').onclick = () => { state.make = {...NEUTRAL}; makeMode(); };
      $('hint').innerHTML = '<b>Make a face.</b> Move the sliders and the tool guesses the feeling. Or tap a feeling to see its face. Everyone copies the face on the board.';
      $('who').textContent = KIDS[state.kid].name;
      makeMode();
    }
  }
  $('m-clues').onclick = () => setMode('clues');
  $('m-scene').onclick = () => setMode('scene');
  $('m-make').onclick = () => setMode('make');
  addEventListener('keydown', e => { if (e.target.closest('button,input') || !/^[1-3]$/.test(e.key)) return; setMode(['clues', 'scene', 'make'][e.key - 1]); });

  // ---------- sound and voice ----------
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
    if (!state.sound) stopTalk();
  };
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    // Chrome fills its voice list late, so an early line waits for it; cancel() also drops a line still waiting,
    // or it would start after the next one and the tool would talk over itself
    const speak = speechSynthesis.speak.bind(speechSynthesis), cancel = speechSynthesis.cancel.bind(speechSynthesis), held = new Set();
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      held.add(u);
      const go = () => { if (!held.delete(u)) return; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.cancel = () => { held.forEach(u => u.onend && u.onend()); held.clear(); cancel(); };
    speechSynthesis.getVoices();
  }
  const CLIPS = "voice:*";
  const allLines = () => [...new Set([
    'How does this friend feel? Look at the eyebrows, the eyes and the mouth.',
    ...NAMES.flatMap(n => FEEL[n].clues.map(c => c + '.')),
    ...NAMES.map(n => `Yes! That's ${label(n)}.`), ...NAMES.map(n => `Can you make a ${label(n)} face too?`),
    'Hmm, look again. Press Show the clues for help.',
    ...SCENES.flatMap(s => { const k = KIDS[s.kid].name; return [s.t, `How might ${k} feel?`, ...s.f.map(n => `Yes, ${k} might feel ${label(n)}.`), `What could you say or do to help ${k}?`]; }),
    'Feelings can be different!', ...Object.values(ANS_FEED), ...NAMES.map(n => `A ${label(n)} face. Everyone, make a ${label(n)} face!`)])];
  let talk = 0, clip = null, last = [], heard = false;
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { heard = true; }, {once: true, capture: true});
  function stopTalk() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (CLIPS[text]) { clip = new Audio(CLIPS[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = .92; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function say(parts, force) {
    if (!heard && !force) return;
    if (!state.sound && !force) return;
    stopTalk();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(150); }
  }
  $('read').onclick = () => say(last.length ? last : [$('story').textContent], true);

  showMotion();
  window.__faces = {state, setMode, pick, showClues, KIDS, FEEL, allLines};  // for checking frames
  setMode('clues');
})();
</script>
</body>
</html>
