<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song Form Builder · Musical form: AB, ABA and rondo · Curio Class</title>
<meta name="description" content="Build a song from section blocks A, B, C and D and hear it play. Change one note in A and every A changes, so AB, ABA and rondo become shapes you can see and hear. Then label six well-known songs by ear. Grades 3-5 music. Works offline.">
<!--
Song Form Builder (Curio Class)
Grades 3-5, music, Form and Composition. NCAS MU:Cr2 (organize and develop musical ideas), MU:Cr3 (refine and
complete), MU:Re7 (how structure shapes a response, in Listen).
Students drive (pairs on laptops), or a teacher on a projector with the class calling "same" or "new" in Listen.
Build: section blocks A to D (8 beats on a pentatonic grid) placed in an 8-slot song strip; every copy of a letter is
linked, twins (A prime) share the first 6 beats; the Form card names the form (strophic, binary, ternary, AABA, rondo,
through-composed). Listen: label each phrase of a song as same, almost the same or new.
Sources: National Core Arts Standards (nationalartsstandards.org); Britannica, "Musical form" and "Rondo"; Open Music
Theory, "AABA (32-bar song form)"; Beethoven, Symphony No. 9 finale (1824, IMSLP); Twinkle Twinkle ("Ah! vous dirai-je,
maman", 1761), Mary Had a Little Lamb (words by Sarah Josepha Hale, 1830; traditional tune), Row Row Row Your Boat (1881), Hot Cross Buns and
Frere Jacques (traditional): public domain melodies as sung in US classrooms (Library of Congress, Songs of America).
Starter songs written for Curio Class. Sounds are made in the browser (kit/music-studio.js, from melody-maker).
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root{
  --paper:#f4f7f2;--ink:#1c2430;--muted:#556070;--line:#d7e2df;--focus:#9d174d;
  --brand:#0e7490;--btn:#0b5f73;--btn-line:#4ea3b6;--head-ink:#fff;--panel:#fbfdfb;
  --card:#fff;--soft:#66717f;
  --bh:96px;--lf:30px;--cw:56px;--ch:48px;--gap:8px;--pad:12px;
}
body{overflow:hidden}
main{grid-template-columns:minmax(0,1fr) 360px;min-height:0}
/* the panel comes first in the page (Tab: panel, shelf, strip, editor); the grid puts the stage on the left */
.panel{grid-column:2;grid-row:1;gap:10px}
.stage{grid-column:1;grid-row:1;min-height:0;background:linear-gradient(#eaf3f1,#dfece9)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* three page layouts, picked in script (relayout):
   wide    (1000 px or wider and 700 px or taller): stage left, 360 px panel right;
   compact (a short landscape box such as the 16:10 embed, 680x425 to 1000x625): a 260 to 300 px panel, a one-row header;
   stack   (narrow or portrait): panel top (hint, Play, Form card), then the stage, then the settings; the page scrolls. */
body.compact main{grid-template-columns:minmax(0,1fr) 260px}
@media (min-width:900px){body.compact main{grid-template-columns:minmax(0,1fr) 300px}}
body.compact header{padding:4px 8px;gap:4px;flex-wrap:nowrap;min-width:0}
body.compact h1{font-size:16px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.compact h1 small{display:none}
body.compact .seg{flex:none}
body.compact .seg button,body.compact .icon-btn{min-height:44px;padding:0 8px;font-size:13.5px;white-space:nowrap}
body.compact .icon-btn{flex:none}
body.compact .panel{padding:6px 8px;gap:6px}
body.compact .hint{font-size:13.5px;line-height:1.35}
body.compact .big-btn{min-height:46px;font-size:17px}
body.compact .fc{padding:6px 8px}
body.compact .fc h2{display:none}
body.compact .fc .fc-let{font-size:17px}
body.compact .fc p{font-size:13px}
body.compact .lab{font-size:12.5px}
body.compact .btn{font-size:14px}
body.stack{overflow:auto;height:auto}
body.stack main{display:flex;flex-direction:column}
body.stack .panel{display:contents}
body.stack #pmain{order:1;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
body.stack .stage{order:2;overflow:visible}
body.stack #pmore{order:3;padding:10px 12px 24px;background:var(--panel);border-top:2px solid var(--line)}
@media (max-width:560px){
  .seg{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;width:100%}
  .seg button{min-height:44px;font-size:15px;padding:0 6px}
  .icon-btn{min-height:44px;padding:0 12px;font-size:15px}
}
#pmain,#pmore{display:flex;flex-direction:column;gap:inherit}
.hint{margin:0}
.big-btn{width:100%}
.big-btn[aria-disabled="true"]{opacity:.45;cursor:default}
.btn{min-height:44px;min-width:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  font-weight:700;font-size:15px;padding:0 10px;line-height:1.15}
.btn:hover{border-color:var(--brand)}
.btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.btn[aria-disabled="true"]{opacity:.4;cursor:default}
.btn.warn{border-color:#c9b9b9}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}
.lab{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin:0 0 3px}
select.sel{min-height:44px;width:100%;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  font:600 15px 'Segoe UI',system-ui,sans-serif;padding:0 8px}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.35}
/* the Form card */
.fc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.fc h2{margin:0 0 2px;font:800 12.5px 'Segoe UI',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fc .fc-let{font:800 22px 'Trebuchet MS','Segoe UI',sans-serif;letter-spacing:.06em;margin:0;min-height:1.2em;color:var(--ink)}
.fc p{margin:3px 0 0;font-size:14.5px;line-height:1.35}
.fc p:empty{display:none}
.fc .nm{font-weight:700;color:var(--brand)}
.fc .end{color:var(--muted)}
.fc .cp{color:var(--muted);font-style:italic}
/* the stage: build */
#sb,#sl{position:absolute;inset:0;display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad)}
body.stack #sb,body.stack #sl{position:static}
#sb>*{width:100%;max-width:var(--sbw,none);margin-inline:auto}
#strip,#lstrip{order:1;display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));flex:none}
#bar{order:2;flex:none;display:flex;align-items:center;gap:6px;min-height:44px}
#barlab{flex:1 1 auto;font-size:14px;color:var(--muted);line-height:1.25;min-width:0}
#barlab b{color:var(--ink)}
#shelfwrap,#editor{order:3;flex:1 1 auto;min-height:0;overflow:auto}
body.stack #shelfwrap,body.stack #editor{overflow:visible}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sw,112px),1fr));gap:var(--gap);align-content:start}
.shelf.flash{outline:4px solid var(--brand);outline-offset:3px;border-radius:12px}
.shtitle{font-size:13.5px;font-weight:800;color:var(--muted);margin:0 0 4px;letter-spacing:.04em}
/* a slot in the strip, and a block (strip, shelf, listen) */
.slot{position:relative;display:grid;place-items:center;height:var(--bh);border-radius:12px;border:2px dashed #9fb3b0;background:#f8fbfa;padding:0;color:var(--soft);
  font:700 calc(var(--lf) * .6) 'Trebuchet MS',sans-serif;touch-action:manipulation}
.slot>*{pointer-events:none}
.slot.full{border:0;background:none}
.slot.sel{outline:4px solid var(--ink);outline-offset:2px}
.slot.drop{outline:4px dashed var(--brand);outline-offset:2px}
.slot.cur{border-color:var(--brand);border-style:solid;border-width:3px}
.slot .ph{position:absolute;left:6%;right:6%;top:-7px;height:6px;border-radius:3px;background:var(--ink);opacity:0;z-index:2}
.slot.now .ph{opacity:1}
.slot.now{outline:5px solid var(--ink);outline-offset:3px;z-index:1}
.slot.home{outline:4px solid var(--brand);outline-offset:3px}
.slot.home .blk{transform:translateY(-4px);box-shadow:inset 0 -4px 0 #0002,0 6px 0 #0002}
.calm .slot.home .blk{transform:none}
.fc.fin{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand)}
body.big .fc .fc-let{font-size:34px}
body.big .fc p{font-size:19px}
body.big .fc h2{font-size:15px}
.blk{position:absolute;inset:0;border-radius:12px;background:var(--c);color:var(--k);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;overflow:hidden;box-shadow:inset 0 -4px 0 #0002;transition:transform .2s}
.calm .blk{transition:none}
.blk.twin{background:repeating-linear-gradient(135deg,var(--c) 0 8px,var(--d) 8px 13px)}
.mark{position:relative;width:calc(var(--lf) * 1.55);height:calc(var(--lf) * 1.55);display:grid;place-items:center;flex:none}
.mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mark b{position:relative;font:900 var(--lf)/1 'Trebuchet MS','Segoe UI',sans-serif;white-space:nowrap}
.skw{position:relative;width:86%;height:calc(var(--bh) * .26);flex:none;display:block}
.sk{position:absolute;inset:0;width:100%;height:100%;display:block}
.rest{position:absolute;inset:0;display:grid;place-items:center;font:700 max(11px,calc(var(--bh) * .13))/1 'Segoe UI',sans-serif;letter-spacing:.04em}
.slot .num{font-size:max(13px,calc(var(--lf) * .6))}
.slot.ripple .blk{animation:rip .3s ease-out}
@keyframes rip{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.calm .slot.ripple .blk{animation:none}
.calm .slot.ripple{outline:4px solid var(--ink);outline-offset:2px}
.slot.sel.ripple{outline-style:dashed}
.small .skw{display:none}
/* shelf cards */
.sec{display:flex;flex-direction:column;gap:4px;min-width:0}
.pick{position:relative;height:calc(var(--bh) * .9);min-height:56px;border:0;border-radius:12px;padding:0;background:none;touch-action:none}
.pick>*{pointer-events:none}
.pick[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.pick[aria-pressed="true"] .blk{transform:translateY(-3px)}
.pick .tag{position:absolute;right:4px;top:4px;background:var(--ink);color:#fff;border-radius:999px;font:700 11px 'Segoe UI',sans-serif;padding:2px 6px;opacity:0}
.pick[aria-pressed="true"] .tag{opacity:1}
.sec .row{gap:4px;flex-wrap:nowrap}
.sec .row .btn{flex:1 1 0;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}
#newsec{min-height:56px;border-style:dashed;align-self:start;height:calc(var(--bh) * .9 + 48px)}
.ghost{position:fixed;z-index:50;pointer-events:none;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:12px;opacity:.9;box-shadow:0 8px 20px #0004}
/* editor */
#editor{display:flex;flex-direction:column;gap:6px}
/* tight: the short preview box. No beat numbers or tip line, no label words, 1 px between cells, so 6 rows of 44 px fit */
#sb.editing #strip .slot{pointer-events:none;cursor:default}
#sb.tight #editor{gap:4px}
#sb.tight .beats,#sb.tight .edtip,#sb.tight .edlab-w,#sb.tight #edmini{display:none}
#sb.tight .grid,#sb.narrow .grid,#sb.narrow .beats{gap:1px}
#sb.tight .edbar{flex-wrap:nowrap;gap:6px}
#sb.tight .edname{font-size:15px}
#editor[hidden]{display:none}
.edbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.edname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-right:auto}
.edname .mini{position:relative;width:44px;height:44px;flex:none}
.edbar label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.edbar select.sel{width:auto}
.beats,.grid{display:grid;grid-template-columns:repeat(8,var(--cw));gap:2px;justify-content:start}
.beats div{text-align:center;font:700 12px 'Segoe UI',sans-serif;color:var(--muted);height:18px;line-height:18px}
.beats div.lk{color:var(--ink)}
.grid{grid-auto-rows:var(--ch)}
.cell{border:1px solid #c8d6d3;background:#fff;border-radius:6px;padding:0;font:600 12.5px 'Segoe UI',sans-serif;color:var(--soft);min-width:0}
.cell.on{background:var(--c);color:var(--k);font-weight:800;font-size:14px;border-color:transparent}
.cell.lock{background:repeating-linear-gradient(135deg,#eef2f1 0 6px,#e1e8e6 6px 10px);cursor:not-allowed}
.cell.lock.on{background:repeating-linear-gradient(135deg,var(--c) 0 6px,var(--d) 6px 10px)}
.cell:focus-visible{outline-offset:-4px;position:relative;z-index:1}
.cell.colnow{box-shadow:inset 0 0 0 3px var(--ink)}
.edtip{font-size:13px;color:var(--muted);margin:0;min-height:1.35em}
/* listen */
#lstrip{margin-inline:auto;width:100%}
.ask{order:2;display:flex;flex-direction:column;gap:6px;max-width:640px;width:100%;margin-inline:auto}
.askq{font-weight:800;font-size:15.5px;margin:0;line-height:1.3}
.arow{display:grid;grid-template-columns:1fr 1fr minmax(44px,.7fr);gap:6px}
.arow .btn,.alast .btn{display:flex;align-items:center;justify-content:center;gap:6px}
.alast{display:grid;grid-template-columns:1fr;gap:6px}
.lfoot{order:3;align-items:flex-start}
.lfoot #confirm{width:100%}
.arow.tw{grid-template-columns:2fr minmax(44px,.7fr)}
.chip{display:inline-block;width:1.2em;height:1.2em;border-radius:4px;vertical-align:-.2em;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>Song Form Builder <small>Musical form: AB, ABA and rondo</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-build" aria-pressed="true">Build</button>
    <button id="m-listen" aria-pressed="false">Listen</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read">🔊 Read</button>
</header>
<main>
  <aside class="panel" id="panel">
    <div id="pmain">
      <p class="hint" id="hint"></p>
      <button class="big-btn" id="play">▶ Play song</button>
      <button class="big-btn" id="listen" hidden>▶ Listen</button>
      <section class="fc" id="fc" aria-live="polite" aria-label="Form card">
        <h2>Form</h2>
        <p class="fc-let" id="fc-let"></p>
        <p class="nm" id="fc-name"></p>
        <p id="fc-note"></p>
        <p class="end" id="fc-end"></p>
        <p class="cp" id="fc-copies"></p>
      </section>
    </div>
    <div id="pmore">
      <div id="pl-top" hidden>
        <label class="lab" for="lsong">Song</label>
        <select class="sel" id="lsong"></select>
      </div>
      <div id="confirm" hidden>
        <p class="note" id="cfq" style="color:var(--ink);font-weight:700;margin:6px 0"></p>
        <div class="row"><button class="btn" id="yes">Yes</button><button class="btn" id="no">No</button></div>
      </div>
      <div id="pb-more">
        <span class="lab" id="speedlab">Speed</span>
        <div class="row" role="group" aria-labelledby="speedlab" id="speeds"></div>
        <label class="lab" for="starter" style="margin-top:8px">Starter songs</label>
        <select class="sel" id="starter"></select>
        <div class="row" style="margin-top:8px" id="clearrow"><button class="btn warn" id="clear">Clear song</button></div>
        <p class="note" style="margin-top:8px">Your song is saved on this device only. Nothing leaves it.</p>
      </div>
    </div>
  </aside>
  <div class="stage" id="stage">
    <div id="sb">
      <div id="shelfwrap">
        <p class="shtitle" id="shtitle">SHELF</p>
        <div class="shelf" id="shelf" role="group" aria-labelledby="shtitle"><button class="btn" id="newsec">＋ New section</button></div>
      </div>
      <div id="strip" role="group" aria-label="Song strip, 8 spaces"></div>
      <div id="bar">
        <span id="barlab"></span>
        <button class="btn" id="b-hear" hidden></button>
        <button class="btn" id="b-twin" hidden></button>
        <button class="btn" id="b-rm" hidden>✕ Remove</button>
      </div>
      <div id="editor" hidden>
        <div class="edbar">
          <div class="edname"><span class="mini" id="edmini"></span><span id="edlab"></span></div>
          <label><span class="edlab-w">Instrument</span> <select class="sel" id="instr" aria-label="Instrument"></select></label>
          <button class="btn" id="done">✓ Done</button>
        </div>
        <div class="beats" id="beats" aria-hidden="true"></div>
        <div class="grid" id="grid" role="group" aria-label="Notes: 8 beats across, 6 notes from low do to high do"></div>
        <p class="edtip" id="edtip"></p>
      </div>
    </div>
    <div id="sl" hidden>
      <div id="lstrip" role="group" aria-label="Song parts"></div>
      <div class="ask" id="ask">
        <p class="askq" id="askq" aria-live="polite"></p>
        <div id="arows"></div>
        <div class="alast"><button class="btn" id="a-new">✦ New</button></div>
      </div>
      <div class="ask lfoot" id="restartrow"><button class="btn warn" id="lrestart">↺ Start over</button></div>
    </div>
  </div>
</main>
<script src="kit:curio"></script>
<script src="kit:music-studio"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---------- content (spec: Content) ----------
  // sections: A to D; a twin is "Ap" (A prime, shown A′): its first 6 beats follow its parent, beats 7 and 8 are its own
  const SEC = {
    A: {color: '#c2410c', ink: '#fff', shape: 'circle', dark: '#8f300a'},
    B: {color: '#3b5bdb', ink: '#fff', shape: 'square', dark: '#2a43a8'},
    C: {color: '#f2b10a', ink: '#1c2430', shape: 'triangle', dark: '#c98f00'},
    D: {color: '#237032', ink: '#fff', shape: 'diamond', dark: '#17501f'},
  };
  const SHAPE_NAME = {circle: 'circle', square: 'square', triangle: 'triangle', diamond: 'diamond'};
  const SYL = ['do', 're', 'mi', 'sol', 'la', 'do′'];
  const INSTRS = {marimba: 'Marimba', flute: 'Flute', piano: 'Piano', box: 'Music box'};
  const SPEEDS = [['Slow', 84], ['Medium', 100], ['Quick', 120]];
  const _ = null;
  const STARTERS = {
    sunny: {name: 'Sunny Day', sections: {A: {notes: [0, 1, 2, 2, 3, 2, 1, 0], instr: 'marimba'}, B: {notes: [4, 4, 3, 3, 2, 2, 1, _], instr: 'flute'}}, strip: ['A', 'B', 'A']},
    rondo: {name: 'Rondo for Recess', sections: {A: {notes: [0, 2, 3, 5, 3, 2, 0, _], instr: 'marimba'}, B: {notes: [1, 1, 2, 1, 1, 1, 2, 3], instr: 'flute'},
      C: {notes: [5, 4, 3, 4, 5, _, 5, _], instr: 'box'}}, strip: ['A', 'B', 'A', 'C', 'A']},
    blank: {name: 'Blank', sections: {A: {notes: [_, _, _, _, _, _, _, _], instr: 'marimba'}, B: {notes: [_, _, _, _, _, _, _, _], instr: 'flute'}}, strip: []},
  };
  const NEW_INSTR = {C: 'box', D: 'piano'};
  // Listen songs (spec: Content, Listen songs): note names in C, lengths in beats (MS.parse), phrase ids by first appearance
  const SONGS = [
    {id: 'hcb', name: 'Hot Cross Buns', end: 'hcb', ph: {A: 'E D C:h', B: 'C:e C:e C:e C:e D:e D:e D:e D:e'}, form: ['A', 'A', 'B', 'A']},
    {id: 'mary', name: 'Mary Had a Little Lamb', end: 'mary', ph: {A: 'E D C D | E E E:h | D D D:h | E G G:h', Ap: 'E D C D | E E E E | D D E D | C:w'}, form: ['A', 'Ap']},
    {id: 'twinkle', name: 'Twinkle Twinkle', end: 'twinkle', ph: {A: 'C C G G | A A G:h | F F E E | D D C:h', B: 'G G F F | E E D:h | G G F F | E E D:h'}, form: ['A', 'B', 'A']},
    {id: 'ode', name: 'Ode to Joy', end: 'ode', ph: {A: 'E E F G | G F E D | C C D E | E:dq D:e D:h', Ap: 'E E F G | G F E D | C C D E | D:dq C:e C:h',
      B: 'D D E C | D E:e F:e E C | D E:e F:e E D | C D G3:h'}, form: ['A', 'Ap', 'B', 'Ap']},
    // 6/8 with the eighth note as 1 in the spec: halved here, so a dotted quarter is 1.5 beats
    {id: 'row', name: 'Row Row Row Your Boat', end: 'row', scale: .5, ph: {A: 'C:3 C:3 | C:2 D:1 E:3', B: 'E:2 D:1 E:2 F:1 | G:6',
      C: 'C5 C5 C5 G G G | E E E C C C', D: 'G:2 F:1 E:2 D:1 | C:6'}, form: ['A', 'B', 'C', 'D']},
    {id: 'frere', name: 'Frere Jacques', end: 'frere', ph: {A: 'C D E C', B: 'E F G:h', C: 'G:e A:e G:e F:e E C', D: 'C G3 C:h'},
      form: ['A', 'A', 'B', 'B', 'C', 'C', 'D', 'D']},
  ];
  for (const s of SONGS) for (const k in s.ph) s.ph[k] = MS.parse(s.ph[k], {scale: s.scale || 1});

  // ---------- voice (spec: Voice). Lines are the spoken forms; A′ is said "A prime" ----------
  const L = {
    welcomeBuild: 'Tap a block on the shelf, then tap a space in the song strip. Then press Play song.',
    playHow: 'Press Play song to hear your form.',
    editHow: 'Tap the grid to change the notes. Every copy of this section changes too.',

  const spoken = t => t.replace(/([A-D])′/g, '$1 prime');

  // ---------- state ----------
  const state = {

    sel: null, slot: null, focusSlot: 0, editing: null, cur: {r: 0, c: 0}, confirm: null,
    ver: 0, playedVer: -1, play: null,          // play: {kind: 'song' | 'sec' | 'phrase' | 'whole', id, player}

    l: {song: 0, labels: [], k: 0, phase: 'idle', miss: 0, wrong: false, tok: 0, msg: ''},

  const isTwin = id => id && id.length > 1;
  const base = id => id[0];
  const shown = id => id[0] + (isTwin(id) ? '′' : '');
  const notesOf = id => { const s = state.sections[id]; if (!s) return []; return isTwin(id) ? state.sections[s.parent].notes.slice(0, 6).concat(s.own) : s.notes; };
  const sameArr = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

  // ---------- form rules (spec: Form card rules) ----------
  function analyze(ids) {
    const map = {}; let next = 0;

    let key, name;
    if (!n) { key = null; name = ''; }
    else if (n === 1) { key = 'one'; name = 'Just one block so far. Add more blocks to make a form.'; }
    else if (distinct === 1 && !twins) { key = 'strophic'; name = 'Strophic: the same music every time, like verses of a song.'; }
    else if (distinct === 1) { key = 'twin'; name = 'A and its twin: the same start with a new ending.'; }
    else if (distinct === n && n >= 3) { key = 'through'; name = 'Through-composed: nothing comes back.'; }
    else if (b === 'AB') { key = 'binary'; name = 'Binary form: two parts.'; }
    else if (b === 'AABB') { key = 'binaryRepeat'; name = 'Binary form with each part repeated.'; }
    else if (b === 'ABA') { key = 'ternary'; name = 'Ternary form: away and back home.'; }
    else if (b === 'AABA') { key = 'aaba'; name = 'AABA: a shape used in many popular songs.'; }

  }
  // notes checks for the Build card: two letters with the same notes, a twin still the same as its parent, the ending
  function checks(ids, map) {
    const out = {same: null, twinSame: null, end: ''};
    const bases = [...new Set(ids.filter(id => !isTwin(id)))];
    for (let i = 0; i < bases.length && !out.same; i++) for (let j = i + 1; j < bases.length; j++)
      if (sameArr(notesOf(bases[i]), notesOf(bases[j]))) { const a = map[bases[i]], b = map[bases[j]], [x, y] = a < b ? [a, b] : [b, a]; out.same = `${x} and ${y} have the same notes, so they sound like ${x} ${x}.`; break; }
    const tw = ids.find(id => twinSame(id));
    if (tw) { const r = map[base(tw)]; out.twinSame = `${r}′ is still the same as ${r}. Change its last two beats.`; }
    if (ids.length) {
      const last = notesOf(ids[ids.length - 1]).filter(r => r !== null);

  }

  // ---------- drawing ----------
  function shapeSVG(shape, sw = 2.6) {
    const a = `fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linejoin="round" vector-effect="non-scaling-stroke"`;
    const s = shape === 'circle' ? `<circle cx="50" cy="50" r="46" ${a}/>` : shape === 'square' ? `<rect x="6" y="6" width="88" height="88" rx="10" ${a}/>`

  }
  // a tiny sketch of notes: pts [{beat, dur, y (0 low to 1 high)}] over `len` beats; a ring marks the playhead beat
  function sketchSVG(pts, len, label = 'rest') {
    const W = 80, Hh = 26, sx = W / len;

    for (const p of pts) s += `<rect x="${(p.beat * sx + .8).toFixed(1)}" y="${(Hh - 5 - p.y * (Hh - 7)).toFixed(1)}" width="${Math.max(1.6, p.dur * sx - 1.6).toFixed(1)}" height="4" rx="1.5" fill="currentColor"/>`;

    return s;
  }
  const secPts = id => notesOf(id).map((r, i) => r === null ? null : {beat: i, dur: 1, y: r / 5}).filter(Boolean);
  const phrasePts = ph => ph.events.map(e => ({beat: e.beat, dur: e.dur, y: clamp((e.semi + 5) / 17, 0, 1)}));

  const cells = [];
  for (let c = 0; c < 8; c++) { const d = document.createElement('div'); d.textContent = c + 1; $('beats').append(d); }
  for (let r = 5; r >= 0; r--) for (let c = 0; c < 8; c++) {

    s.instr = $('instr').value; save();

    if (tw && c < 6) { $('edtip').innerHTML = `${ICON.chain} Beats 1 to 6 follow ${base(id)}. Edit ${base(id)} on the shelf to change them.`; return; }
    stopPlay();

    arr[k] = r === null || arr[k] === r ? null : r;

    // every copy that changed: this letter, and its twin when beats 1 to 6 change
    const touched = state.strip.map((x, i) => (x === id || (!tw && c < 6 && x === id + 'p')) ? i : -1).filter(i => i >= 0);

    ripple(touched);

      // once per editor session: marked when it starts (valid is checked right then), so later taps don't queue it again

      const s = song(), done = l.phase === 'done', f = analyze(l.labels.filter(Boolean));
      $('fc-let').textContent = f.letters;
      $('fc-name').textContent = done ? f.name : `Label every part to see the form. ${l.labels.filter(Boolean).length} of ${s.form.length} done.`;
      $('fc-note').textContent = done ? f.renamed.join(' ') : '';
      $('fc-end').textContent = done ? L.end[s.end].replace(/ A prime/g, ' A′') : '';
      $('fc-copies').textContent = '';
      $('listen').innerHTML = lBusy() ? '■ Stop' : l.phase === 'idle' ? '▶ Listen' : l.phase === 'done' ? '▶ Play whole song' : '↻ Hear it again';
      setBtn($('listen'), !state.confirm);
      $('restartrow').hidden = l.phase === 'idle' && !state.confirm; $('lrestart').hidden = !!state.confirm;
      // answer buttons: shown for the letters (and labeled twins) so far; usable only while waiting for a label;
      // hidden at the end so Play whole song stands out
      const used = usedLetters(), canAns = l.phase === 'answer' && !state.confirm, done2 = l.phase === 'done';
      for (const x of AIDS) {
        AB[x].hidden = done2 || (isTwin(x) ? !l.labels.includes(x) : !used.includes(x));
        setBtn($('a-same-' + x), canAns); if (!isTwin(x)) setBtn($('a-almost-' + x), canAns);
        setBtn($('a-hear-' + x), canAns);
      }
      $('a-new').hidden = used.length >= 4 || done2;
      setBtn($('a-new'), canAns);
      $('ask').hidden = l.phase === 'idle';
      $('askq').textContent = l.phase === 'done' ? `All ${s.form.length} parts labeled.` : l.msg || (l.labels.length ? `Part ${l.k + 1} of ${s.form.length}` : `Part 1 of ${s.form.length}`);
      if (fe && fe.closest && fe.closest('#ask') && fe.closest('[hidden]')) $('listen').focus({preventScroll: true});
      drawLStrip();
    }
    relayout();
  }

  // ---------- modes ----------
  function setMode(m) {
    if (m === state.mode) return;
    stopPlay(); V.hush();
    if (state.mode === 'listen') lHalt();
    state.mode = m; state.sel = null; state.confirm = null;
    refresh(); relayout(true);
    V.welcome();
  }
  addEventListener('keydown', e => { if (e.key === 'Escape' && (state.sel || state.slot != null)) { state.sel = null; state.slot = null; refresh(); } });
  $('m-build').onclick = () => setMode('build');
  $('m-listen').onclick = () => setMode('listen');

  const V = Curio.voice({
    lines: L, scope: () => state.mode, hint: false, read: () => spoken(hintText()),
    welcome: () => state.mode === 'build'
      ? ['welcomeBuild', {valid: () => !state.strip.length && !state.play && !state.editing && !state.confirm}]
      : ['welcomeListen', {valid: () => state.l.phase === 'idle' && !state.play}],
  });

  // ---------- layout: real pixels per stage size ----------
  let page = '', lastKey = '';
  function pageLayout() { const w = innerWidth, h = innerHeight; return w >= 1000 && h >= 700 ? 'wide' : w >= 600 && w / h >= 1.25 ? 'compact' : 'stack'; }
  function relayout(force) {
    const p = pageLayout();
    if (p !== page) { page = p; for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p); }
    document.body.classList.toggle('big', page === 'wide' && innerWidth >= 1600 && innerHeight >= 900);   // a projector or big screen
    const st = $('stage'), r = st.getBoundingClientRect();
    const key = [page, state.mode, !!state.editing, Math.round(r.width), Math.round(r.height), lslots.length].join(':');
    if (key === lastKey && !force) return;
    lastKey = key;
    const W = Math.max(280, r.width), H = page === 'stack' ? 9999 : Math.max(240, r.height);
    const pad = W < 520 ? 8 : 12, gap = W < 520 ? 6 : 8, inner = W - 2 * pad;
    const sv = (k, v) => st.style.setProperty(k, v);
    sv('--pad', pad + 'px'); sv('--gap', gap + 'px');
    // the strip: one row of 8, or 2 rows of 4 when a block would be narrower than 50 px
    const n = state.mode === 'build' ? 8 : Math.max(1, lslots.length);
    let cols = n, bw = (inner - (cols - 1) * gap) / cols;
    // build slots are targets (44 px at least); listen parts only show, so they stay in one row down to 36 px
    const minW = state.mode === 'listen' ? 36 : state.editing && page === 'compact' ? 44 : 50;
    if (bw < minW && n > 4) { cols = Math.ceil(n / 2); bw = (inner - (cols - 1) * gap) / cols; }
    const maxBw = 150;
    if (bw > maxBw) bw = maxBw;
    const rows = Math.ceil(n / cols);
    let bh;
    if (page === 'stack') bh = clamp(bw * .82, 64, 104);
    else bh = clamp(Math.min(bw * 1.05, (H - 2 * pad) * (state.mode === 'build' ? .2 : .22)), 56, 130);
    let cw = 0, ch = 0, tight = false, narrow = false;
    if (state.mode === 'build' && state.editing) {
      cw = clamp((inner - 7 * 2) / 8, 44, 76);
      if (page !== 'stack') {
        // the editor's rows below the strip: toolbar 50, beat numbers 18 + 6, grid, tip 18 + 6 (3 gaps between the parts)
        let room = H - 2 * pad - 3 * gap - 50 - 24 - 24;
        if (room - rows * 56 - (rows - 1) * gap - 6 * 44 - 10 < 0) {
          tight = true;                          // a short box: drop the beat numbers and tip, 1 px cell gaps
          room = H - 2 * 6 - 2 * 4 - 44;
          bh = Math.min(bh, Math.max(40, (room - 6 * 44 - 5 - (rows - 1) * 4) / rows));
          ch = clamp((room - rows * bh - (rows - 1) * 4 - 5) / 6, 44, 60);
          sv('--pad', '6px'); sv('--gap', '4px');
        } else {
          ch = clamp((room - rows * bh - (rows - 1) * gap - 5 * 2) / 6, 44, 60);
          const over = rows * bh + (rows - 1) * gap + 6 * ch + 5 * 2 - room;
          if (over > 0) bh = Math.max(44, bh - over / rows);
        }
      } else {
        if ((inner - 14) / 8 < 44) {               // a phone: 1 px between cells and a 4 px edge so 8 columns of 44 px fit
          sv('--pad', '4px'); narrow = true;
          cw = Math.max(44, Math.floor((W - 8 - 7) / 8));
        }
        ch = clamp(cw * .8, 44, 56);
      }
    }
    $('sb').classList.toggle('narrow', narrow);
    $('sb').classList.toggle('tight', tight);
    $('sb').classList.toggle('editing', !!state.editing);
    const lf = clamp(Math.min(bh * .3, bw * .36), 14, 34);
    sv('--cols', cols); sv('--bh', Math.round(bh) + 'px'); sv('--lf', Math.round(lf) + 'px');
    sv('--cw', Math.floor(cw) + 'px'); sv('--ch', Math.floor(ch) + 'px');
    sv('--sw', Math.round(clamp(bw * 1.05, 124, 160)) + 'px');
    $('strip').style.maxWidth = $('lstrip').style.maxWidth = Math.round(cols * bw + (cols - 1) * gap) + 'px';
    sv('--sbw', Math.max(Math.round(cols * bw + (cols - 1) * gap), Math.min(inner, 640)) + 'px');   // shelf, bar and editor line up under the strip
    for (const s of ['strip', 'lstrip']) $(s).classList.toggle('small', bh < 56);
    reserve();
  }
  // reserve the hint's and Form card's height for their longest text, so the panel never jumps
  function reserve() {
    const hint = $('hint'), w = hint.clientWidth; if (!w) return;
    const m = hint.cloneNode(); m.removeAttribute('id'); Object.assign(m.style, {position: 'absolute', visibility: 'hidden', width: w + 'px', minHeight: '0'});
    hint.parentElement.append(m);
    let mx = 0; for (const t of Object.values(H)) { m.textContent = t; mx = Math.max(mx, m.offsetHeight); }
    m.remove(); hint.style.minHeight = mx + 'px';
    const fc = $('fc'), c = fc.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
    Object.assign(c.style, {position: 'absolute', visibility: 'hidden', width: fc.offsetWidth + 'px', minHeight: '0'});
    const ps = c.querySelectorAll('p');
    ps[0].textContent = 'A B A C A B A′ D'; ps[1].textContent = 'Through-composed: nothing comes back.';
    // on a phone the card reserves less (one note line, no copies line), so the shelf stays near the top
    ps[2].textContent = page === 'stack' ? 'Your B plays the A part.' : 'Your B plays the A part. A and B have the same notes, so they sound like A A.';
    ps[3].textContent = 'Ends away from do: sounds like it wants more.'; ps[4].textContent = page === 'stack' ? '' : '3 copies changed';
    fc.parentElement.append(c); const fh = c.offsetHeight; c.remove();
    fc.style.minHeight = fh + 'px';
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());

  // ---------- start ----------
  if (!restore()) { loadStarter('sunny'); state.strip = []; state.starter = ''; }
  Curio.init({clips: "voice:*", rate: .95});
  $('read').onclick = () => { if (state.mode === 'listen') lHalt(); else stopPlay(); refresh(); V.read(); };   // Read stops the music first
  buildLStrip();
  refresh(); relayout(true);

  // for checking frames
  window.__tool = {
    state, setMode, allLines: V.allLines, vlog: V.log, get vq() { return V.queue; }, V, analyze, checks, hintText, notesOf, MS,
    place, openEditor, setCell, relayout,
    layout: () => ({page, bh: getComputedStyle($('stage')).getPropertyValue('--bh'), lf: getComputedStyle($('stage')).getPropertyValue('--lf'),
      cw: getComputedStyle($('stage')).getPropertyValue('--cw'), ch: getComputedStyle($('stage')).getPropertyValue('--ch')}),
  };
})();
</script>
</body>
</html>
