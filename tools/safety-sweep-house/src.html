    "cleaners-bucket": "art:cleaners-bucket",
    "cleaners-apart": "art:cleaners-apart",
    "towel-burner": "art:towel-burner",
    "towel-hook": "art:towel-hook",
    "candle-sill": "art:candle-sill",
    "candle-out": "art:candle-out",
    "pillbox-table": "art:pillbox-table",
    "pillbox-gone": "art:pillbox-gone",
    "alarm-floor": "art:alarm-floor",
    "alarm-ceiling": "art:alarm-ceiling",
    "heater-blanket": "art:heater-blanket",
    "heater-clear": "art:heater-clear",
    "gummies-open": "art:gummies-open",
    "cabinet-high": "art:cabinet-high",
    "tub-full": "art:tub-full",
    "tub-empty": "art:tub-empty",
    "screen-glow": "art:screen-glow",
    "screen-glow-check": "art:screen-glow-check",
    "gate-propped": "art:gate-propped",
    "gate-latched": "art:gate-latched",
    "lighter-table": "art:lighter-table",
    "lighter-shelf": "art:lighter-shelf",
    "bucket": "art:bucket",
    "towel": "art:towel",
    "blanket": "art:blanket",
    "plug-chain": "art:plug-chain",
    "flowerpot": "art:flowerpot",
    "gummy-bottle": "art:gummy-bottle",
    "block-bin": "art:block-bin",
    "pot-back-burner": "art:pot-back-burner",
    "battery-candle": "art:battery-candle",
    "escape-map": "art:escape-map",
    "medicine-cabinet-high": "art:medicine-cabinet-high",
    "life-jacket-hook": "art:life-jacket-hook",
    "theo-blocks": "art:theo-blocks",
    "theo-walk": "art:theo-walk",
    "chip-dad": "art:chip-dad",
    "chip-grandma": "art:chip-grandma",
    "chip-theo": "art:chip-theo"
  };
  const L = DATA.lines;
  const H = DATA.hazards;
  const ROOMS = DATA.rooms;
  const people = ['You', 'Theo', 'Grandma June', 'Dad'];
  const helpRule = 'Medicine, fire, heat or climbing: get a grown-up first. ' +
    'You may move a cool blanket away from heat without touching the heater. If unsure, get a grown-up.';
  const icons = ['◉', '◇', '☷', '✓'];
  const state = {
    mode: 'explore',
    room: -1,
    active: null,
    look: null,
    safety: false,
    page: 0,
    confirm: false,
    seenLooks: Array(6).fill(false),
    progress: H.map(() => fresh()),
    selected: false
  };

  function fresh() {
    return {
      step: 'stop',
      think: null,
      peeks: [],
      tried: [],
      last: null,
      safe: false,
      told: false,
      acted: false,
      blocked: false,
      reported: false,
      fixed: false,
      who: [],
      distance: 1,
      reveal: false,
      done: false
    };
  }
  const progress = () => state.active === null ? null : state.progress[state.active];
  const hazard = () => state.active === null ? null : H[state.active];
  const roomDone = r => state.progress[r * 2].done && state.progress[r * 2 + 1].done;
  const total = () => ROOMS.filter((_, i) => roomDone(i)).length;
  const esc = t => String(t).replace(/[&<>"']/g, x => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  } [x]));
  const img = (name, cls = '', alt = '') => `<img class="${cls}" src="${ASSETS[name]}" alt="${esc(alt)}" draggable="false">`;
  const button = (id, text, cls = '') => `<button class="b ${cls}" id="${id}">${text}</button>`;
  let hintText = L.house;
  let holdTimer = null;
  let holdFrame = null;
  let heldNode = null;
  let drag = null;
  const V = Curio.voice({
    lines: L,
    scope: () => state.room + ':' + state.active + ':' + progress()?.step,
    welcome: () => state.room >= 0 && state.active === null && state.look === null && !state.safety && !state.confirm ? 'welcome' : null,
    welcomeAfter: true,
    hint: false,
    read: () => [hintText, currentText()].filter(Boolean).join(' ')
  });

  function currentText() {
    const h = hazard();
    const p = progress();
    if (state.confirm) return 'Start the sweep over? Tap Yes to start over, or No to keep your work.';
    if (state.safety) {
      const paged = innerWidth < 1000 || innerHeight < 650;
      const items = paged ? H.slice(state.page * 6, state.page * 6 + 6) : H;
      return items.map(h => h.habit).join(' ') + ' ' + L.poison;
    }
    if (state.look !== null) return 'Looks fine. ' + ROOMS[state.look].why;
    if (!h) return '';
    if (p.step === 'stop') return h.situation;
    if (p.step === 'think') return p.think === null ? 'Get a grown-up first. Or act now, then tell a grown-up.' :
      (h.adult ? 'Get a grown-up first. ' : 'Act now, then tell a grown-up. ') + helpRule;
    if (p.step === 'reveal') return reason(h.safer);
    if (p.step === 'choose' || p.step === 'safe') {
      return h.options.map((o, i) => o + '. ' + (p.safe || p.peeks.includes(i) || p.tried.includes(i) ? h.outcomes[i] : '')).join(' ') +
        (p.safe ? ' ' + h.habit : '');
    }
    return '';
  }

  function narrate(key, event = false, opts = {}) {
    const room = state.room;
    const active = state.active;
    const step = progress()?.step;
    const valid = () => state.room === room && state.active === active && progress()?.step === step;
    const finishing = [L.roomDone, L.houseDone, L.poison].includes(V.playing);
    if (event) V.say(key, {
      now: !finishing && ['safe', 'tried'].includes(key),
      valid,
      ...opts,
      hint: false
    });
    else V.how(key, {
      now: !finishing && !V.heard(key),
      valid,
      ...opts,
      hint: false
    });
  }

  function cancelHold() {
    clearTimeout(holdTimer);
    cancelAnimationFrame(holdFrame);
    if (heldNode) heldNode.style.setProperty('--hold', '0%');
    heldNode = null;
  }

  function update(focusId) {
    const prior = document.activeElement?.id;
    renderPanel();
    renderStage();
    renderNav();
    document.querySelector('.panel').inert = state.confirm || state.safety;
    $('strip').inert = state.confirm || state.safety;
    $('rooms-small').inert = state.confirm;
    [...$('stage').children].forEach(node => {
      node.inert = state.confirm ? !node.classList.contains('confirm') : state.safety && !node.classList.contains('safety');
    });
    $('hint').textContent = hintText;
    const restore = focusId || prior;
    if (restore) {
      const node = $(restore);
      if (node) node.focus({
        preventScroll: true
      });
      else if (prior)($('controls').querySelector('button') || $('house') || $('rooms-small')).focus({
        preventScroll: true
      });
    }
  }

  function openRoom(r) {
    cancelHold();
    drag = null;
    if (V.playing === L.roomDone) V.dropQueued();
    else V.hush();
    state.room = r;
    state.look = null;
    state.active = null;
    state.safety = false;
    state.selected = false;
    const resumable = [r * 2, r * 2 + 1].find(i => !state.progress[i].done && state.progress[i].step !== 'stop');
    if (resumable !== undefined) state.active = resumable;
    hintText = state.active === null ? L.roomIn : hintFor();
    update();
    if (state.active === null) narrate('roomIn');
    else speakStep();
    Curio.tone(440, .06, .025);
  }

  function house() {
    cancelHold();
    drag = null;
    if (![L.roomDone, L.houseDone, L.poison].includes(V.playing)) V.hush();
    V.dropQueued();
    state.room = -1;
    state.active = null;
    state.look = null;
    state.safety = false;
    state.selected = false;
    hintText = total() === 6 ? 'Every room is swept. Tap Safety card to revisit your habits.' : L.house;
    update();
  }

  function openHazard(id) {
    if (state.progress[id].done) {
      hintText = H[id].habit + ' Tap another object or House.';
      update();
      return;
    }
    V.dropQueued();
    state.active = id;
    state.look = null;
    state.selected = false;
    hintText = hintFor();
    update();
    speakStep();
    Curio.tone(520, .07, .03);
  }

  function hintFor() {
    const p = progress();
    const h = hazard();
    if (!p) return state.room === -1 ? L.house : L.roomIn;
    if (p.step === 'fix') {
      if (!p.told && h.adult) return 'Tap Tell ' + h.tell + ' first. ' + h.fix;
      if (p.acted && !p.told) return 'The scene is safer. Now tap Tell ' + h.tell + '.';
      if (h.action === 'chat' && p.blocked) return 'The player is blocked. Now tap Report.';
      return h.fix + (h.action === 'move' ? ' Or select the object, then tap its target.' : '');
    }
    if (p.step === 'think' && p.think !== null) return 'Read the help rule, then tap Choose.';
    if (p.step === 'reveal') return 'See who is safer and why. Tap Back to room.';
    return L[p.step] || L.roomIn;
  }

  function speakStep() {
    const p = progress();
    const keys = {
      stop: 'stop',
      think: 'think',
      choose: 'choose',
      safe: 'safe',
      fix: 'fix',
      who: 'who'
    };
    if (keys[p.step]) narrate(keys[p.step], p.step === 'safe');
  }

  function goStep(step) {
    const p = progress();
    if (!p) return;
    if (step === 'fix' && !p.safe) return;
    p.step = step;
    hintText = hintFor();
    update();
    speakStep();
    Curio.tone(480, .05, .025);
  }

  function renderPanel() {
    const h = hazard();
    const p = progress();
    const stageIndex = !p ? -1 : ['stop', 'think', 'choose', 'safe', 'fix', 'who', 'reveal'].indexOf(p.step);
    const index = stageIndex <= 1 ? stageIndex : stageIndex <= 3 ? 2 : 3;
    $('steps').innerHTML = ['Stop', 'Think', 'Choose', 'Check'].map((s, i) =>
      `<span class="step ${i === index ? 'current' : ''}"><i>${icons[i]}</i>${s}</span>`).join('');
    $('where').textContent = h ? ROOMS[h.room].name + ' / ' + h.title : state.room < 0 ? 'Your safety sweep' : ROOMS[state.room].name;
    const c = $('controls');
    if (state.safety) {
      c.innerHTML = '<h2 class="context-title">A safer house</h2><p class="situation">Twelve fixes, made by you.</p>' +
        '<div class="paper-note">Keep these habits. In real life, get a trusted grown-up whenever you need help.</div>';
      return;
    }
    if (!p) {
      c.innerHTML = state.room < 0 ?
        '<h2 class="context-title">One room at a time.</h2><p class="situation">Look closely. Some things are risky. Some just look that way.</p>' +
        '<div class="paper-note">Stop. Think about help. Compare choices. Then make the scene safer.</div>' +
        (total() === 6 ? button('show-card', 'Safety card', 'primary') : '') :
        '<h2 class="context-title">Take a closer look.</h2><p class="situation">Tap an object in the room. Find two hazards and decide what to do.</p>' +
        (roomDone(state.room) ? '<div class="paper-note">✓ Room swept! ' + L.roomDone + '</div>' : '');
      $('show-card')?.addEventListener('click', () => showSafety());
      return;
    }
    if (p.step === 'stop') {
      c.innerHTML = `<h2 class="context-title">${h.title}</h2><p class="situation">${esc(h.situation)}</p>` +
        button('think', 'Think →', 'primary');
      $('think').onclick = () => goStep('think');
    } else if (p.step === 'think') {
      c.innerHTML = '<h2 class="context-title">Grown-up first?</h2>' +
        (p.think === null ?
          button('adult', 'Get a grown-up first') + button('act', 'Act now, then tell a grown-up') :
          `<div class="paper-note"><p><b>${p.think === h.adult ? 'Yes, that fits.' : 'Here, the safer help choice is:'}</b></p>` +
          `<p>${h.adult ? 'Get a grown-up first.' : 'Act now, then tell a grown-up.'}</p>` +
          `<p>${helpRule}</p></div>` +
          button('choose', 'Choose →', 'primary'));
      for (const id of ['adult', 'act'])
        if ($(id)) $(id).onclick = () => {
          p.think = id === 'adult';
          hintText = hintFor();
          update('choose');
          Curio.tone(400, .06, .025);
        };
      $('choose')?.addEventListener('click', () => goStep('choose'));
    } else if (p.step === 'choose' || p.step === 'safe') {
      c.innerHTML = '<div class="choices">' + h.options.map((o, i) => {
        const flipped = p.safe || p.peeks.includes(i) || p.tried.includes(i);
        const tag = p.safe ? i === h.safe ? '✓ Safe' : '△ Risk' : p.tried.includes(i) ? '△ Tried' : 'Choice ' + (i + 1);
        return `<div class="option ${p.safe && i === h.safe ? 'safe' : p.tried.includes(i) ? 'tried' : ''}">` +
          `<button class="pick" id="option-${i}" ${p.safe ? 'disabled' : ''}><span class="card-label">${tag}</span>` +
          `${esc(flipped ? h.outcomes[i] : o)}</button>` +
          `<button class="peek" id="peek-${i}" aria-label="What could happen? Choice ${i+1}" title="What could happen?">↻</button></div>`;
      }).join('') + '</div>' + (p.safe ? button('check', 'Check →', 'primary') : '');
      for (let i = 0; i < 3; i++) {
        $('option-' + i).onclick = () => pick(i);
        $('peek-' + i).onclick = () => {
          p.peeks = p.peeks.includes(i) ? p.peeks.filter(x => x !== i) : [...p.peeks, i];
          p.last = i;
          update();
          Curio.tone(620, .045, .02);
        };
      }
      $('check')?.addEventListener('click', () => goStep('fix'));
    } else if (p.step === 'fix') {
      const mayTell = h.adult ? !p.told : p.acted && !p.told;
      c.innerHTML = `<h2 class="context-title">Make it safer</h2>` +
        (mayTell ? button('tell', 'Tell ' + h.tell, 'primary') : '') +
        (p.told ? `<div class="grownup">${img(h.tell === 'Dad' ? 'chip-dad' : 'chip-grandma')}` +
          `<span><b>${h.tell} is here.</b><br>${h.adult ? 'I’ll handle the grown-up part. Let’s finish safely.' : 'Thanks for telling me.'}</span></div>` :
          '') +
        (!h.adult && !p.acted ? '<div class="paper-note">Do the action in the scene. Then tell a grown-up.</div>' : '');
      $('tell')?.addEventListener('click', () => {
        p.told = true;
        if (h.id === 3) p.adultMoved = true;
        finishIfReady();
        hintText = hintFor();
        update();
        if (p.step === 'who') narrate('who');
        Curio.tone(580, .08, .03);
      });
    } else if (p.step === 'who' || p.step === 'reveal') {
      const reveal = p.step === 'reveal';
      c.innerHTML = '<h2 class="context-title">Who is safer now?</h2><div class="chip-grid">' +
        [...people, 'Everyone'].map((name, i) => {
          const correct = h.safer === 'Everyone' ? name === 'Everyone' || people.includes(name) : name === h.safer;
          const selected = p.who.includes(name) || p.who.includes('Everyone');
          const picture = i === 0 ? '<span aria-hidden="true">◉</span>' : i < 4 ? img(['', 'chip-theo', 'chip-grandma', 'chip-dad'][i]) : '◎';
          return `<button class="b person ${reveal && correct ? selected ? 'correct' : 'missed' : ''}" id="who-${i}"` +
            ` aria-pressed="${p.who.includes(name)}" ${reveal ? 'disabled' : ''}>${picture}<span>${name}` +
            (reveal && correct ? `<small>${selected ? '✓ Safer' : 'also safer'}</small>` : '') + '</span></button>';
        }).join('') + '</div>' +
        (reveal ? `<div class="paper-note">${esc(reason(h.safer))}</div>` + button('back-room', 'Back to room →', 'primary') :
          button('done', 'Done', 'primary'));
      if (!reveal) {
        $('done').disabled = p.who.length === 0;
        for (let i = 0; i < 5; i++) $('who-' + i).onclick = () => {
          const name = [...people, 'Everyone'][i];
          p.who = p.who.includes(name) ? p.who.filter(x => x !== name) : [...p.who, name];
          update();
          Curio.tone(500, .04, .025);
        };
        $('done').onclick = () => {
          if (!p.who.length || !p.fixed) return;
          p.step = 'reveal';
          hintText = hintFor();
          update('back-room');
        };
      } else $('back-room').onclick = complete;
    }
  }

  function reason(set) {
    return set === 'Everyone' ? 'Fire and fumes spread through a whole house.' :
      set === 'Theo' ? 'Keep medicine out of little kids’ reach. Grown-ups stay with them near water.' :
      'Your details and your account are yours to protect.';
  }

  function pick(i) {
    const p = progress();
    const h = hazard();
    if (!p || p.step !== 'choose' || p.think === null) return;
    p.last = i;
    if (i === h.safe) {
      p.safe = true;
      p.step = 'safe';
      hintText = L.safe;
      update('check');
      narrate('safe', true);
      Curio.yes();
    } else {
      const first = p.tried.length === 0;
      if (!p.tried.includes(i)) p.tried.push(i);
          hintText = L.tried;
      update();
      if (first) narrate('tried', true);
      Curio.tone(240, .1, .025);
    }
  }

  function sceneTop(title, subtitle) {
    return `<div class="scene-top">${button('house','⌂ House')}<div class="plaque">${esc(title)}` +
      (subtitle ? `<small>${esc(subtitle)}</small>` : '') + '</div></div>';
  }

  function renderStage() {
    const stage = $('stage');
    const h = hazard();
    const p = progress();
    stage.classList.toggle('deciding', !!p);
    if (state.room < 0) {
      stage.innerHTML = img('house-cutaway', 'backdrop') +
        ROOMS.map((room, i) => {
          const boxes = [
            [14, 52, 28, 35],
            [14, 19, 30, 31],
            [45, 19, 21, 31],
            [67, 19, 24, 31],
            [43, 52, 23, 35],
            [67, 52, 32, 38]
          ];
          const [x, y, w, ht] = boxes[i];
          const done = roomDone(i);
          return `<button id="room-${i}" class="house-room ${done ? 'lit' : ''}" style="left:${x}%;top:${y}%;width:${w}%;height:${ht}%"` +
            ` aria-label="${room.name}${done ? ', swept' : ''}">` +
            (done ? [i * 2, i * 2 + 1].map((n, j) => `<img class="mini-fixed" style="left:${10+j*43}%" src="${ASSETS[H[n].after]}" alt="">`).join(
              '') : '') +
            `<span>${done ? '☀' : '◌'} ${room.name}</span></button>`;
        }).join('') + (total() === 6 ? '<div class="porch"></div>' : '');
      for (let i = 0; i < 6; i++) $('room-' + i).onclick = () => openRoom(i);
    } else {
      const room = ROOMS[state.room];
      const doneCount = [state.room * 2, state.room * 2 + 1].filter(i => state.progress[i].done).length;
      stage.innerHTML = img(room.art, 'backdrop room-art') + sceneTop(room.name, 'Found ' + doneCount + ' of 2');
      $('house').onclick = house;
      if (!h) renderRoomObjects();
      else if (p.step === 'fix') renderFix();
      else renderFocus();
      if (state.look !== null) {
        stage.insertAdjacentHTML('beforeend', '<div class="look-card"><h2>✓ Looks fine</h2>' +
          esc(room.why) + '<br>' + button('keep-searching', 'Keep searching') + '</div>');
        $('keep-searching').onclick = () => {
          state.look = null;
          hintText = L.roomIn;
          update();
        };
      }
    }
    $('stage').insertAdjacentHTML('beforeend', '<span class="ambient" aria-hidden="true"></span>');
    if (state.safety) renderSafety();
    if (state.confirm) renderConfirm();
  }

  function renderRoomObjects() {
    const r = state.room;
    const positions = [
      [
        [13, 59, 25, 32],
        [80, 45, 17, 29],
        [83, 24, 14, 16]
      ],
      [
        [9, 28, 24, 38],
        [51, 51, 34, 36],
        [72, 12, 16, 22]
      ],
      [
        [15, 68, 25, 22],
        [62, 45, 29, 43],
        [8, 14, 18, 29]
      ],
      [
        [13, 35, 21, 27],
        [51, 44, 44, 48],
        [9, 9, 24, 25]
      ],
      [
        [10, 36, 34, 37],
        [55, 26, 34, 39],
        [57, 71, 31, 18]
      ],
      [
        [40, 27, 35, 54],
        [8, 48, 30, 36],
        [80, 14, 16, 24]
      ]
    ];
    const list = [r * 2, r * 2 + 1];
    for (let j = 0; j < 3; j++) {
      let [x, y, w, ht] = positions[r][j];
      const h = H[list[j]];
      const done = j < 2 && state.progress[h.id].fixed;
      if (done && h.id === 1)[x, y, w, ht] = [3, 20, 12, 35];
      if (done && h.id === 4)[x, y, w, ht] = [47, 2, 13, 17];
      if (done && h.id === 6)[x, y, w, ht] = [35, 7, 20, 25];
      if (done && h.id === 11)[x, y, w, ht] = [24, 10, 24, 16];
      const name = j < 2 ? done ? h.after : h.before : ROOMS[r].look;
      const label = j < 2 ? h.title : r === 4 ? 'Maya message' : ROOMS[r].look.replaceAll('-', ' ');
      let content = name ? img(name) : '<span class="plaque">Maya: gg! that was fun</span>';
      if (r === 4 && j < 2 && !done) {
        content =
          `<span class="plaque">${j===0 ? 'CoinKing_77<br>what school do you go to?' : 'YOU WON 10,000 COINS!<br>Type your password to claim.'}</span>`;
      }
      $('stage').insertAdjacentHTML('beforeend', `<button id="spot-${j}" class="hotspot" style="left:${x}%;top:${y}%;width:${w}%;height:${ht}%"` +
        ` aria-label="${label}">${content}` +
        (done ? '<span class="badge">✓</span>' : j === 2 && state.seenLooks[r] ? '<span class="badge blue">✓</span>' : '') + '</button>');
      $('spot-' + j).onclick = () => {
        if (j < 2) openHazard(h.id);
        else {
          state.look = r;
          state.seenLooks[r] = true;
          hintText = 'Looks fine. ' + ROOMS[r].why + ' Tap Keep searching.';
          update('keep-searching');
          narrate('lookalike');
          Curio.tone(660, .06, .02);
        }
      };
    }
    if ([1, 3, 5].includes(r)) $('stage').insertAdjacentHTML('beforeend', img(r === 1 ? 'theo-blocks' : 'theo-walk', 'theo'));
  }

  function renderFocus() {
    const p = progress();
    const h = hazard();
    const showAll = p.safe && ['safe', 'who', 'reveal'].includes(p.step);
    const showOne = !showAll && p.last !== null;
    const art = p.fixed ? h.after : h.before;
    const opts = showAll ? [0, 1, 2] : showOne ? [p.last] : [];
    $('stage').insertAdjacentHTML('beforeend', `<div class="focus-layout"><div class="focus-object ${opts.length ? '' : 'full'}">` +
      img(art) + (p.fixed ? '<span class="badge">✓</span>' : '') +
      (h.id === 8 && !p.fixed ? '<div class="stage-message">CoinKing_77:<br>what school do you go to?<br>I’ll send you free coins</div>' : '') +
      (h.id === 9 && !p.fixed ? '<div class="stage-message">YOU WON 10,000 COINS!<br>Type your password to claim.</div>' : '') +
      (p.fixed && h.id === 2 ? '<span class="smoke">〰</span>' : '') +
      '</div>' + (opts.length ? '<div class="outcomes">' + opts.map(i =>
        `<article class="outcome ${i===h.safe ? 'good' : ''}"><strong>${i===h.safe ? '✓ Safe result' : '△ What could happen'}</strong>` +
        `<p>${esc(h.outcomes[i])}</p>${i===h.safe ? `<p class="habit">${esc(h.habit)}</p>` : ''}</article>`).join('') + '</div>' : '') + '</div>');
  }

  function renderFix() {
    const p = progress();
    const h = hazard();
    const board = document.createElement('div');
    board.className = 'fix-board';
    board.id = 'fix-board';
    $('stage').append(board);
    const mayAct = !h.adult || p.told;
      const grownupArt = h.id === 4 && p.told || h.id === 3 && p.told || h.action === 'ruler';
    const small = !p.acted && (h.action === 'move' || h.action === 'ruler');
    const baseArt = p.acted || grownupArt || h.id === 0 ? h.after : h.before;
    board.innerHTML = h.id === 1 && p.told && !p.acted ? '' : img(baseArt, 'fix-scene' + (small ? ' small' : ''));
    if (h.adult && !p.told) {
      board.insertAdjacentHTML('beforeend', '<div class="stage-message">A grown-up handles this part. Tap Tell ' + h.tell + '.</div>');
      return;
    }
    if (p.acted) {
      board.insertAdjacentHTML('beforeend', '<span class="badge" style="right:15%;top:15%">✓</span>');
      if (h.id === 2) board.insertAdjacentHTML('beforeend', '<span class="smoke">〰</span>');
      if (h.id === 7) board.insertAdjacentHTML('beforeend', img(h.before, 'fix-scene drain-cover'));
      if (h.id === 10) board.insertAdjacentHTML('beforeend', img(h.before, 'fix-scene gate-swing'));
      return;
    }
    if (!mayAct) return;
    if (h.action === 'move' || h.action === 'ruler') {
      if (h.action === 'ruler') {
        board.insertAdjacentHTML('beforeend', '<div class="ruler"><span>0 ft</span><span>1 ft</span><span>2 ft</span>' +
          '<span>3 ft</span><span>4 ft</span></div><output class="ruler-value" id="distance"></output>');
      } else board.insertAdjacentHTML('beforeend', `<button class="target ${state.selected ? 'ready' : ''}" id="target">${esc(h.target)}</button>`);
      board.insertAdjacentHTML('beforeend',
        `<button class="fix-item ${h.action==='ruler' ? 'ruler-item' : ''} ${state.selected ? 'selected' : ''}"` +
        ` id="object" aria-label="${esc(h.object.replaceAll('-',' '))}, select then use target${h.action==='ruler' ? ' or arrow keys' : ''}">` +
        img(h.object) + '</button>');
      if (h.id === 7) $('target').style.top = '0%';
      if (h.id === 1) {
        $('target').style.left = '5%';
        $('target').style.top = '10%';
        $('object').style.left = '65%';
      }
      if (h.id === 3) $('target').style.top = '48%';
      if (h.id === 3) board.insertAdjacentHTML('beforeend', img('theo-blocks', 'theo'));
      $('object').onclick = () => {
        state.selected = !state.selected;
        $('object').classList.toggle('selected', state.selected);
        $('target')?.classList.toggle('ready', state.selected);
        hintText = h.action === 'ruler' ? 'Use arrow keys to move the blanket. Enter checks the distance.' : 'Now tap ' + h.target + '.';
        $('hint').textContent = hintText;
        Curio.tone(540, .04, .02);
      };
      $('object').onpointerdown = startDrag;
      $('object').onkeydown = e => {
        if (h.action !== 'ruler') return;
        if (['ArrowRight', 'ArrowUp', 'ArrowLeft', 'ArrowDown'].includes(e.key)) {
          e.preventDefault();
          p.distance = Math.max(0, Math.min(4, p.distance + (['ArrowRight', 'ArrowUp'].includes(e.key) ? .5 : -.5)));
          updateRuler();
        } else if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          checkDistance();
        }
      };
      if ($('target')) $('target').onclick = () => {
        if (state.selected) actionDone();
        else {
          hintText = 'Select the ' + h.object.replaceAll('-', ' ') + ' first, then tap the target.';
          $('hint').textContent = hintText;
        }
      };
      if (h.action === 'ruler') updateRuler();
    } else if (h.action === 'hold') {
      board.innerHTML =
        `<button class="hold" id="hold-action" aria-label="${h.id===4 ? 'Test alarm, hold 2 seconds' : 'Grandma blows candle out, hold 1 second'}">` +
        img(h.id === 4 ? 'alarm-ceiling' : 'candle-sill') + `<span>${h.id===4 ? 'Test · hold 2 s' : 'Hold 1 s'}</span></button>`;
      const node = $('hold-action');
      node.onpointerdown = e => {
        e.preventDefault();
        node.setPointerCapture(e.pointerId);
        beginHold(node);
      };
      node.onpointerup = cancelHold;
      node.onpointercancel = cancelHold;
      node.onlostpointercapture = cancelHold;
      node.onkeydown = e => {
        if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
          e.preventDefault();
          beginHold(node);
        }
      };
      node.onkeyup = e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cancelHold();
        }
      };
      node.onblur = cancelHold;
    } else if (h.action === 'chat' || h.action === 'close') {
      board.innerHTML = '<div class="screen-ui">' + (h.action === 'chat' ?
        '<h3>CoinKing_77</h3><p>what school do you go to?<br>I’ll send you free coins</p><div class="screen-actions">' +
        button('block', p.blocked ? '✓ Blocked' : 'Block') + button('report', 'Report') + '</div>' :
        '<h3>YOU WON 10,000 COINS!</h3><p>Type your password to claim.</p>' +
        '<button class="close-popup" id="close-popup" aria-label="Close pop-up">×</button>') + '</div>';
      if ($('block')) {
        $('block').disabled = p.blocked;
        $('report').disabled = !p.blocked;
        $('block').onclick = () => {
          p.blocked = true;
          hintText = hintFor();
          update('report');
          Curio.tone(470, .06, .03);
        };
        $('report').onclick = () => {
          if (p.blocked) {
            p.reported = true;
            actionDone();
          }
        };
      }
      $('close-popup')?.addEventListener('click', actionDone);
    } else if (h.action === 'tap') {
      board.innerHTML = `<button class="hold" id="put-away" aria-label="Watch Dad put the lighter away">${img(h.before)}` +
        '<span>Dad puts it away</span></button>';
      $('put-away').onclick = actionDone;
    }
  }

  function beginHold(node) {
    if (heldNode) return;
    const p = progress();
    const h = hazard();
    if (!p || p.step !== 'fix' || !p.told) return;
    const id = state.active;
    const start = performance.now();
    heldNode = node;
    Curio.tone(460, .04, .02);
    const tick = () => {
      if (!heldNode) return;
      node.style.setProperty('--hold', Math.min(100, (performance.now() - start) / h.duration * 100) + '%');
      holdFrame = requestAnimationFrame(tick);
    };
    tick();
    holdTimer = setTimeout(() => {
      if (state.active !== id || progress().step !== 'fix' || !heldNode) return;
      cancelHold();
      actionDone();
      if (h.id === 4) {
        Curio.tone(950, .22, .05);
        $('stage').classList.add('alarm-flash');
        setTimeout(() => $('stage').classList.remove('alarm-flash'), 600);
      }
    }, h.duration);
  }

  function startDrag(e) {
    if (e.button !== 0) return;
    const node = e.currentTarget;
    const p = progress();
    drag = {
      node,
      id: state.active,
      x: e.clientX,
      y: e.clientY,
      moved: false,
      rect: $('fix-board').getBoundingClientRect(),
      base: p.distance
    };
    node.setPointerCapture(e.pointerId);
    node.onpointermove = ev => {
      if (!drag) return;
      const dx = ev.clientX - drag.x;
      const dy = ev.clientY - drag.y;
      if (Math.hypot(dx, dy) > 6) drag.moved = true;
      if (hazard().action === 'ruler') {
        p.distance = Math.max(0, Math.min(4, drag.base + dx / (drag.rect.width * .59) * 4));
        updateRuler();
      } else node.style.transform = `translate(${dx}px,${dy}px)`;
    };
    node.onpointerup = ev => {
      if (!drag) return;
      const d = drag;
      drag = null;
      node.onpointermove = null;
      if (!d.moved) return;
      node.onclick = ev => ev.preventDefault();
      if (hazard().action === 'ruler') checkDistance();
      else {
        const r = $('target').getBoundingClientRect();
        if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) actionDone();
        else {
          node.style.transform = '';
          hintText = 'Move the object into the marked target, or select it and tap the target.';
          $('hint').textContent = hintText;
          setTimeout(() => {
            if ($('object') === node) node.onclick = () => {
              state.selected = true;
              node.classList.add('selected');
              $('target').classList.add('ready');
            };
          }, 0);
        }
      }
    };
    node.onpointercancel = () => {
      drag = null;
      node.style.transform = '';
    };
  }

  function updateRuler() {
    const d = progress().distance;
    const shown = Math.floor(d * 10) / 10;
    if ($('distance')) $('distance').textContent = shown + (shown === 1 ? ' foot' : ' feet');
    // Measure to the blanket's nearest edge, not its center. The ruler spans 59 percent of the board.
    if ($('object')) $('object').style.left = (27 + d / 4 * 59) + '%';
  }

  function checkDistance() {
    if (progress().distance >= 3) actionDone();
    else {
      hintText = 'Still too close. Move the blanket to 3 feet or farther, then press Enter.';
      $('hint').textContent = hintText;
      Curio.tone(260, .06, .025);
    }
  }

  function actionDone() {
    const p = progress();
    const h = hazard();
    if (!p || p.step !== 'fix' || !p.safe || h.adult && !p.told) return;
    if (h.action === 'chat' && (!p.blocked || !p.reported)) return;
    if (h.action === 'ruler' && p.distance < 3) return;
    const from = $('object')?.getBoundingClientRect();
    const target = $('target')?.getBoundingClientRect();
    const scene = $('stage').getBoundingClientRect();
    p.acted = true;
    state.selected = false;
    finishIfReady();
    hintText = hintFor();
    update();
    if (!Curio.reduce && from && target) {
      const flight = document.createElement('img');
      flight.src = ASSETS[h.object];
      flight.alt = '';
      flight.className = 'fix-flight';
      Object.assign(flight.style, {
        left: from.left - scene.left + 'px', top: from.top - scene.top + 'px',
        width: from.width + 'px', height: from.height + 'px'
      });
      flight.style.setProperty('--dx', target.left + target.width / 2 - from.left - from.width / 2 + 'px');
      flight.style.setProperty('--dy', target.top + target.height / 2 - from.top - from.height / 2 + 'px');
      $('stage').append(flight);
      flight.addEventListener('animationend', () => flight.remove(), {once: true});
    }
    Curio.yes();
    if (p.step === 'who') narrate('who');
  }

  function finishIfReady() {
    const p = progress();
    if (p.safe && p.acted && p.told) {
      p.fixed = true;
      p.step = 'who';
    }
  }

  function complete() {
    const p = progress();
    if (!p || p.step !== 'reveal' || !p.fixed) return;
    const r = state.room;
    p.done = true;
    state.active = null;
    hintText = roomDone(r) ? L.roomDone : 'Fix complete. Search for the other hazard, or tap House.';
    update();
    Curio.yes();
    if (total() === 6) showSafety(true);
    else if (roomDone(r)) narrate('roomDone', true);
  }

  function renderNav() {
    $('strip').innerHTML = button('nav-house', '⌂ House') + ROOMS.map((r, i) =>
      `<button class="b" id="nav-${i}" aria-current="${state.room===i}"><span class="lamp ${roomDone(i) ? 'on' : ''}">` +
      `${roomDone(i) ? '☀' : '◌'}</span>${r.name}</button>`).join('');
    $('nav-house').onclick = house;
    for (let i = 0; i < 6; i++) $('nav-' + i).onclick = () => openRoom(i);
    $('count').textContent = 'Rooms swept ' + total() + ' of 6';
  }

  function showSafety(earned = false) {
    if (total() !== 6) return;
    state.room = -1;
    state.active = null;
    state.safety = true;
    state.page = 0;
    hintText = 'Your Safety card is ready. Tap Close to explore, or Sweep again.';
    update('card-close');
    if (earned) V.say(['houseDone', ['poison', {
      kind: 'how',
      valid: () => state.safety
    }]], {
      hint: false
    });
    else narrate('poison');
  }

  function renderSafety() {
    const paged = innerWidth < 1000 || innerHeight < 650;
    const items = paged ? H.slice(state.page * 6, state.page * 6 + 6) : H;
    $('stage').insertAdjacentHTML('beforeend', '<section class="safety" role="dialog" aria-label="Your Safety card">' +
      '<h2>☀ Your Safety card</h2><div class="habit-list">' + items.map(h =>
        `<div class="habit-entry">${img(h.after)}<span>${esc(h.habit)}</span></div>`).join('') + '</div>' +
      '<div class="emergency">Poison Help: 1-800-222-1222<br>(free, any time, in the US)</div>' +
      '<div class="emergency">Fire: get out, stay out, then call 911 from outside.</div>' +
      '<div class="card-buttons">' + button('card-close', 'Close') +
      (paged ? button('card-page', state.page === 0 ? 'Next →' : '← Back') : '') +
      button('sweep-again', 'Sweep again') + '</div></section>');
    $('card-close').onclick = () => {
      state.safety = false;
      hintText = 'Every room is swept. Tap Safety card to revisit your habits.';
      update();
    };
    $('card-page')?.addEventListener('click', () => {
      state.page = 1 - state.page;
      update('card-page');
    });
    $('sweep-again').onclick = () => {
      state.confirm = true;
      update('reset-no');
    };
  }

  function renderConfirm() {
    $('stage').insertAdjacentHTML('beforeend', '<div class="confirm" role="dialog" aria-modal="true" aria-label="Start the sweep over?">' +
      '<b>Start the sweep over?</b><div class="card-buttons">' + button('reset-yes', 'Yes') + button('reset-no', 'No') + '</div></div>');
    $('reset-no').onclick = () => {
      state.confirm = false;
      update('sweep-again');
    };
    $('reset-yes').onclick = () => {
      cancelHold();
      V.hush();
      state.progress = H.map(() => fresh());
      state.seenLooks.fill(false);
      state.room = -1;
      state.active = null;
      state.safety = false;
      state.confirm = false;
      state.page = 0;
      state.look = null;
      hintText = L.house;
      update('room-0');
    };
  }
  $('rooms-small').onclick = house;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      cancelHold();
      if (state.confirm) {
        state.confirm = false;
        update('sweep-again');
      } else if (state.look !== null) {
        state.look = null;
        hintText = L.roomIn;
        update();
      } else house();
    }
    if (e.key === 'Tab' && state.confirm) {
      e.preventDefault();
      ($(document.activeElement.id === 'reset-no' ? 'reset-yes' : 'reset-no')).focus({
        preventScroll: true
      });
    }
  });
  window.addEventListener('resize', () => {
    if (state.safety) update();
  });
  Curio.onMotion(calm => {
    if (calm) document.querySelectorAll('.fix-flight').forEach(node => node.remove());
  });
  Curio.init({
    clips: "voice:*",
    rate: .95,
    readFallback: () => hintText
  });
  window.__tool = {
    state,
    allLines: V.allLines,
    vlog: V.log,
    get vq() {
      return V.queue;
    },
    setMode: () => house()
  };
  update();
})();
</script>
</body>
</html>
