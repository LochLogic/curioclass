/* A tabletop house with a field notebook, not the kit lesson frame. */
* {box-sizing:border-box}
html,body {margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;color:var(--ink)}
body {display:block;background:repeating-linear-gradient(4deg,#624530 0 3px,#674934 4px 9px)}
button {font:inherit;cursor:pointer;min-width:44px;min-height:44px}
button.b:disabled {opacity:.42;filter:grayscale(1);cursor:default;box-shadow:none;transform:none}
button.b:disabled:active {transform:none}
button[aria-disabled=true] {opacity:.5;filter:grayscale(1);cursor:default;box-shadow:none}
main {height:calc(100dvh - 62px);padding:8px 12px 0;display:grid;grid-template-columns:1fr;
  grid-template-rows:minmax(150px,1fr) auto;gap:8px;position:relative}
.world {grid-row:1;grid-column:1;gap:0;align-items:center;justify-content:center;overflow:hidden}
.stage {position:relative;overflow:hidden;width:min(100%,calc((100dvh - 270px)*1.77778));
  height:auto;aspect-ratio:16/9;max-height:none;border-radius:5px;border:5px solid #422f23;
  box-shadow:0 6px 22px #0008;flex:none}
.backdrop {object-fit:fill}
.deciding .room-art {transform:none;filter:brightness(.72)}
.panel {grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(200px,.75fr) minmax(0,2fr);
  padding:10px 14px;border-radius:3px;border:1px solid #a68a65;border-top:4px solid #a77b4c;

<body>

<main>
  <aside class="panel" aria-label="Safety sweep clipboard">
    <p class="eyebrow" id="where">Your safety sweep</p>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div id="steps" hidden></div>
    <div id="controls"></div>
  </aside>
  <section class="world" aria-label="House exploration">
    <div class="stage" id="stage"></div>
    <nav class="strip" id="strip" aria-label="Rooms"></nav>
    <div class="footer-count" id="count">Rooms swept 0 of 6</div>
  </section>
</main>
<footer class="deck">
  <button id="manual" aria-expanded="false" aria-controls="manual-drawer">Manual</button>
  <span class="maker-plate">Curio Class Curiosities · Safety Sweep House</span>
  <div class="power" aria-label="House controls">
    <button id="rooms-small">House</button><button id="motion">Motion</button>
    <button id="sound">Sound</button><button id="read">Read</button>
  </div>
</footer>
<section id="manual-drawer" class="manual" hidden aria-label="Manual"></section>
<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const DATA = "json:content";
  const ASSETS = {
    "house-cutaway": "art:house-cutaway",
    "room-kitchen": "art:room-kitchen",
    "room-living": "art:room-living",
    "room-hallway": "art:room-hallway",
    "room-bathroom": "art:room-bathroom",
    "room-gameroom": "art:room-gameroom",
    "room-backyard": "art:room-backyard",
    "cleaners-bucket": "art:cleaners-bucket",
    "cleaners-apart": "art:cleaners-apart",
    "towel-burner": "art:towel-burner",
    "towel-hook": "art:towel-hook",
    "candle-sill": "art:candle-sill",
    "candle-out": "art:candle-out",
    "pillbox-table": "art:pillbox-table",
    "pillbox-gone": "art:pillbox-gone",
    "alarm-floor": "art:alarm-floor",
    "alarm-ceiling": "art:alarm-ceiling",
    "heater-blanket": "art:heater-blanket",
    "heater-clear": "art:heater-clear",
    "gummies-open": "art:gummies-open",
    "cabinet-high": "art:cabinet-high",
    "tub-full": "art:tub-full",
    "tub-empty": "art:tub-empty",
    "screen-glow": "art:screen-glow",
    "screen-glow-check": "art:screen-glow-check",
    "gate-propped": "art:gate-propped",
    "gate-latched": "art:gate-latched",
    "lighter-table": "art:lighter-table",
    "lighter-shelf": "art:lighter-shelf",
    "bucket": "art:bucket",
    "towel": "art:towel",
    "blanket": "art:blanket",
    "plug-chain": "art:plug-chain",
    "flowerpot": "art:flowerpot",
    "gummy-bottle": "art:gummy-bottle",
    "block-bin": "art:block-bin",
    "pot-back-burner": "art:pot-back-burner",
    "battery-candle": "art:battery-candle",
    "escape-map": "art:escape-map",
    "medicine-cabinet-high": "art:medicine-cabinet-high",
    "life-jacket-hook": "art:life-jacket-hook",
    "theo-blocks": "art:theo-blocks",
    "theo-walk": "art:theo-walk",
    "chip-dad": "art:chip-dad",
    "chip-grandma": "art:chip-grandma",
    "chip-theo": "art:chip-theo"
  };
  const L = DATA.lines;
  const H = DATA.hazards;
  const ROOMS = DATA.rooms;
  const people = ['You', 'Theo', 'Grandma June', 'Dad'];
  const helpRule = 'Medicine, fire, heat or climbing: get a grown-up first. ' +
    'If you can make it safe without touching those, act now, then tell.';
  const icons = ['◉', '◇', '☷', '✓'];
  const state = {
    mode: 'explore',
    room: -1,
    active: null,
    look: null,
    safety: false,
    page: 0,
    confirm: false,
    seenLooks: Array(6).fill(false),
    progress: H.map(() => fresh()),
    selected: false
  };

  function fresh() {
    return {
      step: 'choose',
      think: null,
      peeks: [],
      tried: [],
      last: null,
      safe: false,
      told: false,
      acted: false,
      blocked: false,
      reported: false,
      fixed: false,
      who: [],
      distance: 1,
      reveal: false,
      done: false
    };
  }
  const progress = () => state.active === null ? null : state.progress[state.active];
  const hazard = () => state.active === null ? null : H[state.active];
  const roomDone = r => state.progress[r * 2].done && state.progress[r * 2 + 1].done;
  const total = () => ROOMS.filter((_, i) => roomDone(i)).length;
  const esc = t => String(t).replace(/[&<>"']/g, x => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  } [x]));
  const img = (name, cls = '', alt = '') => `<img class="${cls}" src="${ASSETS[name]}" alt="${esc(alt)}" draggable="false">`;
  const button = (id, text, cls = '') => `<button class="b ${cls}" id="${id}">${text}</button>`;
  let hintText = L.house;
  let holdTimer = null;
  let holdFrame = null;
  let heldNode = null;
  let drag = null;
  let keyboardInput = false;
  let suppressClick = false;
  const V = Curio.voice({
    lines: L,
    scope: () => state.room + ':' + state.active + ':' + progress()?.step,
    welcome: () => null,
    welcomeAfter: true,
    hint: false,
    read: () => !$('manual-drawer').hidden ? $('manual-drawer').innerText : [hintText, currentText()].filter(Boolean).join(' ')
  });

  function currentText() {
    const h = hazard();
    const p = progress();

    if (state.look !== null) return 'Looks fine. ' + ROOMS[state.look].why;
    if (!h) return '';



    if (p.step === 'choose' || p.step === 'safe') {
      return h.situation + ' ' + h.options.map((o, i) => o + '. ' + (p.safe || p.peeks.includes(i) || p.tried.includes(i) ? h.outcomes[i] :
          '')).join(' ') +
        (p.safe ? ' ' + h.habit : '');
    }
    return '';
  }

  function narrate(key, event = false, opts = {}) {
    // A Curiosity gives one quiet first-use hint; other speech waits for Read.
    if (key !== 'roomIn') return;
    const room = state.room;
    const active = state.active;
    const step = progress()?.step;
    const valid = () => state.room === room && state.active === active && progress()?.step === step;
    const finishing = false;
    if (event) V.say(key, {
      now: !finishing && ['safe', 'tried'].includes(key),
      valid,
      ...opts,
      hint: false
    });
    else V.how(key, {
      now: !finishing && !V.heard(key),
      valid,
      ...opts,
      hint: false
    });
  }

  function cancelHold() {
    clearTimeout(holdTimer);
    cancelAnimationFrame(holdFrame);
    if (heldNode) heldNode.style.setProperty('--hold', '0%');
    heldNode = null;
  }

  function update(focusId) {
    const prior = document.activeElement?.id;
    renderPanel();
    renderStage();
    renderNav();
    document.querySelector('.panel').inert = state.confirm || state.safety;
    $('strip').inert = state.confirm || state.safety;
    $('rooms-small').inert = state.confirm;
    [...$('stage').children].forEach(node => {
      node.inert = state.confirm ? !node.classList.contains('confirm') : state.safety && !node.classList.contains('safety');
    });
    $('hint').textContent = hintText;
    const restore = focusId || prior;
    if (restore) {
      const node = $(restore);
      if (node && node.getClientRects().length && !node.disabled) node.focus({
        preventScroll: true
      });
      else if (prior)($('room-0') || $('controls').querySelector('button') || $('house') || $('rooms-small')).focus({
        preventScroll: true
      });
    }
  }

  function openRoom(r) {
    cancelHold();
    drag = null;
    V.hush();
    state.monitor = false;
    state.room = r;
    state.look = null;
    state.active = null;
    state.safety = false;
    state.selected = false;
    const resumable = undefined;
    if (resumable !== undefined) state.active = resumable;
    hintText = state.active === null ? L.roomIn : hintFor();
    update();
    if (state.active === null) narrate('roomIn');
    else speakStep();
    Curio.tone(440, .06, .025);
  }

  function house() {
    cancelHold();
    drag = null;
    V.hush();
    V.dropQueued();
    state.monitor = false;
    state.room = -1;
    state.active = null;
    state.look = null;
    state.safety = false;
    state.selected = false;
    hintText = L.house;
    update('room-0');
  }

  function openHazard(id) {
    cancelHold();
    V.hush();
    state.monitor = false;
    state.active = id;
    state.look = null;
    state.selected = false;
    progress().step = 'choose';
    hintText = H[id].situation;
    update();
    narrate('inspect');
    Curio.tone(520, .07, .03);
  }

  function hintFor() {
    const p = progress();
    const h = hazard();
    if (!p) return state.room === -1 ? L.house : L.roomIn;
    if (p.step === 'fix') {
      if (!p.told && h.adult) return 'Tap Tell ' + h.tell + ' first.';
      if (p.acted && !p.told) return 'The scene is safer. Now tap Tell ' + h.tell + '.';
      if (p.fixed) return h.habit + ' Tap Room view or Reset this scene to explore again.';
      if (h.action === 'chat' && p.blocked) return 'The player is blocked. Now tap Report.';
      return (p.told ? h.remaining : h.fix) + (h.action === 'move' ? ' Or select the object, then tap its target.' : '');
    }
    return L.inspect;
  }

  function speakStep() {
    narrate(progress().step === 'fix' ? 'fix' : 'inspect');
  }

  function goStep(step) {
    if (!progress()) return;
    cancelHold();
    progress().step = step;
    hintText = hintFor();
    update();
    speakStep();
    Curio.tone(480, .05, .025);
  }

        button('block', p.blocked ? '✓ Blocked' : 'Block') + button('report', 'Report') + '</div>' :

  function beginHold(node) {
    if (heldNode) return;
    const p = progress();
    const h = hazard();
    if (!p || p.step !== 'fix' || !p.told) return;
    const id = state.active;
    const start = performance.now();
    heldNode = node;
    Curio.tone(460, .04, .02);
    const tick = () => {
      if (!heldNode) return;
      node.style.setProperty('--hold', Math.min(100, (performance.now() - start) / h.duration * 100) + '%');
      holdFrame = requestAnimationFrame(tick);
    };
    tick();
    holdTimer = setTimeout(() => {
      if (state.active !== id || progress().step !== 'fix' || !heldNode) return;
      cancelHold();
      actionDone();
      if (h.id === 4) {
        Curio.tone(950, .22, .05);
        $('stage').classList.add('alarm-flash');
        setTimeout(() => $('stage').classList.remove('alarm-flash'), 600);
      }
    }, h.duration);
  }

  function startDrag(e) {
    if (e.button !== 0) return;
    keyboardInput = false;
    const node = e.currentTarget;
    const p = progress();
    drag = {
      node,
      id: state.active,
      x: e.clientX,
      y: e.clientY,
      moved: false,
      rect: $('fix-board').getBoundingClientRect(),
      base: p.distance
    };
    node.setPointerCapture(e.pointerId);
    node.onpointermove = ev => {
      if (!drag) return;
      const dx = ev.clientX - drag.x;
      const dy = ev.clientY - drag.y;
      if (Math.hypot(dx, dy) > 6) drag.moved = true;
      if (hazard().action === 'ruler') {
        p.distance = Math.max(0, Math.min(4, drag.base + dx / $('stage').querySelector('.ruler').getBoundingClientRect().width * 4));
        updateRuler();
      } else node.style.transform = `translate(${dx}px,${dy}px)`;
    };
    node.onpointerup = ev => {
      if (!drag) return;
      const d = drag;
      drag = null;
      node.onpointermove = null;
      if (!d.moved) return;
      suppressClick = true;
      setTimeout(() => {
        suppressClick = false;
      }, 0);
      if (hazard().action === 'ruler') checkDistance();
      else {
        const r = $('target').getBoundingClientRect();
        if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) actionDone();
        else {
          node.style.transform = '';
          hintText = 'Move the object into the marked target, or select it and tap the target.';
          $('hint').textContent = hintText;

        }
      }
    };
    node.onpointercancel = () => {
      drag = null;
      node.style.transform = '';
    };
  }

  function updateRuler() {
    const d = progress().distance;
    const shown = Math.floor((d + 1e-9) * 10) / 10;
    if ($('distance')) $('distance').textContent = shown + (shown === 1 ? ' foot' : ' feet');
    if ($('object')) {
      $('object').style.left = (24 + d / 4 * 62) + '%';
      $('object').setAttribute('aria-label', 'Blanket clearance ' + shown + ' feet. Arrow keys move 6 inches. Enter checks.');
    }
  }

  function checkDistance() {
    if (progress().distance >= 3) actionDone();
    else {
      hintText = keyboardInput ? 'Still too close. Arrow keys move it 6 inches. Press Enter at 3 feet or more.' :
        'Still too close. Drag it to 3 feet or more.';
      $('hint').textContent = hintText;
      Curio.tone(260, .06, .025);
    }
  }

  function actionDone() {
    const p = progress();
    const h = hazard();
    if (!p || p.step !== 'fix' || h.adult && !p.told) return;
    if (h.action === 'chat' && (!p.blocked || !p.reported)) return;
    if (h.action === 'ruler' && p.distance < 3) return;
    const from = ($('object') || $('put-away'))?.getBoundingClientRect();
    const target = $('target')?.getBoundingClientRect();
    const scene = $('stage').getBoundingClientRect();
    p.acted = true;
    state.selected = false;
    finishIfReady();
    hintText = hintFor();
    update();
    if (!Curio.reduce && from && target) {
      const flight = document.createElement('img');
      flight.src = ASSETS[h.object];
      flight.alt = '';
      flight.className = 'fix-flight';
      Object.assign(flight.style, {
        left: from.left - scene.left + 'px',
        top: from.top - scene.top + 'px',
        width: from.width + 'px',
        height: from.height + 'px'
      });
      flight.style.setProperty('--dx', target.left + target.width / 2 - from.left - from.width / 2 + 'px');
      flight.style.setProperty('--dy', target.top + target.height / 2 - from.top - from.height / 2 + 'px');
      $('stage').append(flight);
      flight.addEventListener('animationend', () => flight.remove(), {
        once: true
      });
    }
    if (!Curio.reduce && h.action === 'tap' && from) {
      const flight = document.createElement('div');
      flight.className = 'adult-flight';
      flight.innerHTML = h.id === 11 ? '<svg viewBox="0 0 60 40"><rect x="12" y="13" width="35" height="20" rx="4" fill="#c74737"/>' +
        '<path d="M12 13h12v20H12z" fill="#c1c2b5"/><circle cx="17" cy="11" r="5" fill="#49515a"/></svg>' : img(h.object);
      Object.assign(flight.style, {
        left: from.left - scene.left + from.width / 2 - 30 + 'px',
        top: from.top - scene.top + from.height / 2 - 30 + 'px'
      });
      $('stage').append(flight);
      flight.addEventListener('animationend', () => flight.remove(), {
        once: true
      });
    }
    Curio.tone(580, .08, .03);

  }

  function finishIfReady() {
    const p = progress();
    if (p.acted && p.told) {
      p.fixed = true;
      p.done = true;
    }
  }


  function renderNav() {
    $('strip').innerHTML = button('nav-house', '⌂ House') + ROOMS.map((r, i) =>
      `<button class="b" id="nav-${i}" aria-current="${state.room===i}"><span class="lamp ${roomDone(i) ? 'on' : ''}">` +
      `${roomDone(i) ? '☀' : '◌'}</span>${r.name}</button>`).join('');
    $('nav-house').onclick = house;
    for (let i = 0; i < 6; i++) $('nav-' + i).onclick = () => openRoom(i);
    $('count').textContent = '';
  }




  $('rooms-small').onclick = house;
  document.addEventListener('keydown', e => {
    if (e.key === 'Tab') keyboardInput = true;
    if (e.key === 'Escape') {
      if (!$('manual-drawer').hidden) {
        closeManual();
        return;
      }
      cancelHold();
      if (state.look !== null) {
        state.look = null;
        hintText = L.roomIn;
        update();
      } else house();
    }
    if (e.key === 'Tab' && !$('manual-drawer').hidden) {
      const nodes = [$('manual'), ...$('manual-drawer').querySelectorAll('button,a[href]'), ...document.querySelectorAll('.power button')];
      const at = nodes.indexOf(document.activeElement);
      e.preventDefault();
      nodes[(at + (e.shiftKey ? -1 : 1) + nodes.length) % nodes.length].focus({
        preventScroll: true
      });
      return;
    }
    if (e.key === 'Tab' && false) {
      e.preventDefault();
      ($(document.activeElement.id === 'reset-no' ? 'reset-yes' : 'reset-no')).focus({
        preventScroll: true
      });
    }
  });
  window.addEventListener('resize', () => {
    if (state.monitor) update();
  });
  Curio.onMotion(calm => {
    if (calm) document.querySelectorAll('.fix-flight').forEach(node => node.remove());
  });

  function poisonLine(h) {
    return [0, 6].includes(h.id) ? '<p class="help-line">Poison Help (US): 1-800-222-1222 · free, 24/7</p>' : '';
  }

  function adultChip(h, acted) {
    const action = h.id === 1 ? 'I move the towel; you stand back.' : h.id === 6 ? 'I put the bottle up and away.' :
      h.id === 2 ? 'I blow out the candle.' : h.id === 11 ? 'I put the lighter out of reach.' : 'I handle this part.';
    return `<div class="adult-scene">${img(h.tell === 'Dad' ? 'chip-dad' : 'chip-grandma')}<span>${h.tell}: ${action}</span></div>`;
  }

  function gateArt(closed) {
    return `<svg class="gate-drawing ${closed ? 'closed' : ''}" viewBox="0 0 260 190" aria-label="${closed ? 'Latched' : 'Propped'} blue mesh gate" role="img">
      <defs><linearGradient id="post"><stop stop-color="#365a79"/><stop offset=".45" stop-color="#7c9cb2"/>
      <stop offset="1" stop-color="#294a69"/></linearGradient><pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0L6 6M6 0L0 6" stroke="#d3bbd8" stroke-width=".8"/></pattern></defs>
      <path d="M13 32L65 25V166L13 173Z" fill="#8f7aab" stroke="#315271" stroke-width="8"/>
      <path d="M13 32L65 25V166L13 173Z" fill="url(#mesh)"/>
      <g class="leaf"><path d="M65 25H226V166H65Z" fill="#887ba9" stroke="#315271" stroke-width="9"/>
      <path d="M65 25H226V166H65Z" fill="url(#mesh)"/>
      <path d="M71 43H78M71 139H78" stroke="#b0aa92" stroke-width="10"/>
      <path d="M208 62h25v12h-25z" fill="#a49d7e" stroke="#403e37" stroke-width="2"/></g>
      <path d="M60 18h13v161H60zM229 17h14v162h-14z" fill="url(#post)"/>
      <path d="M58 18l9-9 9 9M227 17l9-9 9 9" fill="#a2b7c9" stroke="#365a79" stroke-width="2"/>
      ${closed ? '' : '<path d="M175 144h39l-6 35h-27z" fill="#bd6c3a" stroke="#8b4d2d" stroke-width="3"/><ellipse cx="194" cy="144" rx="22" ry="6" fill="#965031"/>'}
    </svg>`;
  }

  function objectArt(h, fixed, inRoom = false) {
    if (h.id === 10) return gateArt(fixed);
    if (h.id === 7) return `<svg class="tub-drawing ${fixed ? 'empty' : ''}" viewBox="0 0 420 308" role="img" aria-label="${fixed ? 'Drained' : 'Full'} tub">
      <defs><linearGradient id="bath-water" x2=".3" y2="1"><stop stop-color="#82cfdf"/>
      <stop offset="1" stop-color="#4aa9c3"/></linearGradient></defs>
      <image href="${ASSETS['tub-empty']}" width="420" height="308"/>
      <g class="tub-water"><path d="M35 128Q63 107 158 83L306 47Q360 41 386 77Q404 104 366 129
        Q296 168 144 195Q67 207 40 174Q28 154 35 128Z" fill="url(#bath-water)" opacity=".88"/>
      <path d="M60 138q30-16 59-9t59-10t59-9t59-12M94 166q35-16 62-11t62-11t62-12"
        fill="none" stroke="#d0eef0" stroke-width="3" opacity=".8"/></g>
    </svg>`;
    if (h.id === 1 && inRoom) return fixed ? img('towel-hook') :
      '<svg viewBox="0 0 70 110" class="gate-drawing" aria-hidden="true"><path d="M6 30Q33 18 60 31V35H6Z" fill="#282d34"/>' +
      '<path d="M16 31Q11 14 25 20Q25 4 32 20Q43 7 44 31" fill="#6abcf1"/>' +
      '<path d="M40 28L62 36L58 100L34 91Z" fill="#c34f34" stroke="#8c3625" stroke-width="2"/>' +
      '<path d="M43 31L38 92M51 34L46 95M59 37L54 98" stroke="#f9d5a5" stroke-width="3"/></svg>';
    if (h.id === 3) return fixed ? (inRoom ? '' : img('block-bin')) :
      '<svg viewBox="0 0 120 60" class="gate-drawing" aria-hidden="true"><path d="M9 23L101 10L113 39L20 55Z" fill="#bfcdd9" stroke="#7995a5" stroke-width="3"/>' +
      '<path d="M12 20L100 6L98 0L10 12Z" fill="#d6dfdf"/><g fill="#f0b352"><ellipse cx="36" cy="29" rx="8" ry="4"/><ellipse cx="64" cy="25" rx="7" ry="4"/></g></svg>';
    if (h.id === 2 && inRoom) return '<svg viewBox="0 0 80 170" class="gate-drawing" aria-hidden="true">' +
      '<path d="M50 1H79V130Q62 119 49 132Z" fill="#e6cc9d"/><path d="M25 157v-56h14v56z" fill="#ffe3a5"/>' +
      (fixed ? '' : '<path d="M32 98Q15 83 32 62Q49 85 32 98Z" fill="#ffab2d"/>') +
      '<ellipse cx="32" cy="160" rx="22" ry="6" fill="#a78142"/></svg>';
    if (h.id === 8 || h.id === 9) return '<div class="screen-ui"><h3>' +
      (h.id === 8 ? 'CoinKing_77' : 'COINS!') + '</h3><p>' +
      (fixed ? 'Closed. Your details stay private.' : h.id === 8 ? 'what school do you go to? I’ll send you free coins' :
        'Type your password to claim.') + '</p></div>';
    if (h.id === 6 && fixed) return img('cabinet-high');
    return img(fixed ? h.after : h.before);
  }

  function closeManual() {
    $('manual-drawer').hidden = true;
    $('manual').setAttribute('aria-expanded', 'false');
    document.querySelector('main').inert = false;
    $('manual').focus({
      preventScroll: true
    });
  }

  function openManual() {
    if (!$('manual-drawer').hidden) return closeManual();
    $('manual-drawer').innerHTML = button('manual-close', 'Close') + '<h2>Manual</h2>' +
      '<h3>How to use the house</h3><p>Open any room. Tap an object. Compare actions in any order, or use Try the fix. ' +
      'Select an object, then its marked place, or drag it there. On the heater, arrow keys move the blanket 6 inches; Enter checks. ' +
      'Reset this scene restores that object. House changes rooms. Nothing is graded or saved.</p>' +
      '<h3>Help rule</h3><p>' + esc(helpRule) + '</p>' +
      '<p>This is a simplified safety model, not a prediction of a particular home. A grown-up handles medicine, flames, ' +
      'hot objects and climbing. A cool blanket is movable only without touching the heater. If unsure, get help.</p>' +
      '<h3>Things people have found</h3><p>A small change in distance can matter. A prize can ask for something private. ' +
      'The person nearest a hazard may need the most protection.</p>' +
      '<h3>Habits to keep</h3><p>Twelve fixes, made by you and your grown-ups.</p><div class="habit-list">' +
      H.map(h => `<div class="habit-entry">${habitIcon(h)}<span>${esc(h.habit)}</span></div>`).join('') + '</div>' +
      '<p><b>Poison Help (US): 1-800-222-1222 · free, 24/7.</b><br>Fire: get out, stay out, then call 911 from outside.</p>' +
      '<h3>Sources and licences</h3><p>Original fictional situations and paraphrases: Curio Class, CC BY 4.0. ' +
      'Code and vector drawings: MIT. Illustrations generated with OpenAI gpt-image, edited for Curio Class. ' +
      'No external pictures or datasets were imported. The federal guidance below is public domain in the US; source credits ' +
      'do not imply agency endorsement. Independent checks are linked for reference, with no text or pictures copied.</p>' +
      DATA.sources.map(s => `<p><a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a>: ${esc(s.claims)}. ` +
        `${esc(s.licence)}. Checked ${esc(s.checked)}. <a href="${s.check}" target="_blank" rel="noopener">Independent check</a>.</p>`).join(
        '');
    $('manual-drawer').hidden = false;
    $('manual').setAttribute('aria-expanded', 'true');
    document.querySelector('main').inert = true;
    $('manual-close').onclick = closeManual;
    $('manual-close').focus({
      preventScroll: true
    });
    narrate('manual');
  }

  function habitIcon(h) {
    if (h.id === 3 || h.id === 6) return img('cabinet-high');
    if (h.id === 8 || h.id === 9) return `<svg width="36" height="36" viewBox="0 0 36 36" aria-label="${h.id === 8 ? 'Chat' : 'Pop-up'}" role="img">
      <rect x="2" y="5" width="32" height="23" rx="2" fill="#234b67" stroke="#172b37"/>
      ${h.id === 8 ? '<path d="M7 10h22v10H16l-5 4v-4H7Z" fill="#fff1c7"/>' :
        '<path d="M10 10h17v14H10Z" fill="#fff1c7"/><path d="M22 11l4 4m0-4l-4 4" stroke="#a8321e" stroke-width="2"/>'}
      <path d="M18 28v4m-7 1h14" stroke="#172b37" stroke-width="3"/></svg>`;
    if (h.id === 10) return '<span style="width:36px;height:36px">' + gateArt(true) + '</span>';
    return img(h.after);
  }

  $('manual').onclick = openManual;

  Curio.init({
    clips: "voice:*",
    rate: .95,
    readFallback: () => hintText
  });
  window.__tool = {
    state,
    allLines: V.allLines,
    refresh: update,
    openRoom,
    openHazard,
    goStep,
    checkDistance,
    data: DATA,
    vlog: V.log,
    get vq() {
      return V.queue;
    },
    setMode: () => house()
  };
  update();
})();
</script>
</body>
</html>
