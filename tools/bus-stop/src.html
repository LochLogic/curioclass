      const x2=q.right-rect.left-7,y2=q.y+q.height/2-rect.y;
      const bend=Math.min(rect.width-2,Math.max(x1,x2)+15);
      paths+=`<path d="M${x1} ${y1} C${bend} ${y1},${bend} ${y2},${x2} ${y2}"/>`;
    }
    parent.insertAdjacentHTML('afterbegin',`<svg class="way-links" viewBox="0 0 ${rect.width} ${rect.height}" aria-hidden="true">`+
      `<g fill="none" stroke="#2b4c7e" stroke-width="3">${paths}</g></svg>`);
  }
  function moveKid(i) {
    const s=currentSplit();
    const button=$('areas').querySelector(`[data-kid="${i}"]`);
    const from=button.getBoundingClientRect();
    if(V.playing?.startsWith(`${cap(num(s.n))} is `)) V.hush();
    else V.dropQueued(line=>line.key.startsWith('kept:'));
    s.groups[i]=1-s.groups[i];chime();
    const focused=document.activeElement?.dataset.kid;
    renderSplit();
    if(!Curio.reduce && button.animate) {
      const to=button.getBoundingClientRect();
      button.animate([{transform:`translate(${from.x-to.x}px,${from.y-to.y}px)`},{transform:'none'}],
        {duration:220,easing:'ease-out'});
    }
    if(focused!==undefined) $('areas').querySelector(`[data-kid="${focused}"]`)?.focus({preventScroll:true});
  }
  function keep() {
    const s=currentSplit(),a=s.groups.filter(x=>x===0).length,b=s.n-a,list=splitList(s);
    if(list.includes(a)) {
      const key=s.n+':'+a;
      $('way-'+a).classList.remove('flash');void $('way-'+a).offsetWidth;$('way-'+a).classList.add('flash');
      if(!s.duplicates.has(key)){s.duplicates.add(key);say('duplicate');}
      return;
    }
    list.push(a);renderSplit();Curio.yes();
    $('way-'+a).classList.add('just-kept');
    const keptLine=`${cap(num(s.n))} is ${num(a)} and ${num(b)}.`;
    if(state.mode==='drive'&&list.length>=2&&!V.heard('driveOn')) {
      $('drive-on').hidden=false;
      V.how(keptLine+' '+L.driveOn,{key:'driveOn',hint:false,now:true,needs:'#drive-on',valid:()=>state.drive.phase==='split'});
    } else say(keptLine,{key:`kept:${s.n}:${a}`,valid:()=>s.groups.filter(x=>x===0).length===a});
    if(a!==b && list.includes(b)) {
      const key=s.n+':'+Math.min(a,b);
      if(!s.links.has(key)) {
        s.links.add(key);
        say(`${cap(num(a))} and ${num(b)}, ${num(b)} and ${num(a)}. Switch sides, still ${num(s.n)}!`);
      }
    }
    if(list.length===s.n+1) {
      $('ways').querySelectorAll('.way').forEach(el=>el.classList.add('all-found'));
      say(`You found every way to make ${num(s.n)}. ${cap(num(s.n+1))} ways!`);
    }
    if(state.mode==='drive' && list.length>=2) {
      $('drive-on').hidden=false;hint('driveOn');
    }
  }
  function splitNumber(delta) {
    const s=state.split,n=Math.max(2,Math.min(10,s.n+delta));
    if(n===s.n) return;
    V.hush();s.n=n;s.groups=Array(n).fill(0);renderSplit();say(`${cap(num(n))} riders.`);
  }
  function newExpress() {
    const e=state.express;
    e.facts=shuffle([...shuffle(D.facts.filter(f=>f[2]==='+')).slice(0,2),...shuffle(D.facts.filter(f=>f[2]==='-')).slice(0,3)]);
    Object.assign(e,{index:0,locked:false,shown:false,tickets:[],done:false});
  }
  function expressQuestion() {
    const e=state.express;
    if(e.done) return;
    const [a,b,op]=e.facts[e.index];
    const change=op==='+'?(b===1?' more gets on.':' more get on.'):(b===1?' gets off.':' get off.');
    const text=`${cap(num(a))} ${a===1?'rider':'riders'}. ${cap(num(b))}${change} How many now?`;
    if(!V.heard('express')) V.how(L.express+' '+text,{key:'express',hint:false,now:true,needs:'#show-me',valid:()=>!e.locked});
    else say(text,{valid:()=>!e.locked});
  }
  function renderExpress() {
    const e=state.express;
    state.stopKey='express-'+e.index;
    showWorld('school','Express stops',!e.locked);renderTickets(e.tickets);$('roads').hidden=true;$('cards').hidden=true;
    if(e.done) {
      hint('expressDone');$('number-tiles').hidden=true;$('show-me').hidden=true;return;
    }
    $('number-tiles').hidden=false;$('show-me').hidden=false;
    const [a,b,op]=e.facts[e.index],c=result(a,b,op),count=e.shown?c:a;
    [...$('five').children].forEach((seat,i)=>{
      const gone=!e.shown&&op==='-'&&i>=a-b&&i<a;
      seat.firstChild.className='counter '+(i<count?(gone?'gone':'solid'):'empty');
      seat.firstChild.textContent=gone?'↗':'';
    });
    [...$('number-tiles').children].forEach(tile=>{
      tile.disabled=e.locked;tile.className='number-tile';
      if(e.locked && Number(tile.dataset.number)===e.answer) tile.classList.add(e.answer===c?'chosen':'wrong');
    });
    $('show-me').disabled=e.locked;
    $('show-me').style.visibility=e.locked?'hidden':'';
    $('express-result').textContent=e.shown?equation([a,b,op,c]):e.locked?'◉':'';
    $('express-result').setAttribute('aria-label',e.shown?spoken([a,b,op,c]):'Watch the riders');
    renderRiders(b,op,!e.shown);
    hint(e.locked?'expressWatch':'express');
  }
  function answerExpress(value) {
    const e=state.express;
    if(state.mode!=='express'||e.locked||e.done) return;
    e.locked=true;e.answer=value;
    const [a,b,op]=e.facts[e.index],c=result(a,b,op);
    if(value===c) Curio.yes();else chime();
    const prefix=value===null?'':value===c?'Yes! ':'Look. ';
    e.line=prefix+spoken([a,b,op,c]);
    renderExpress();$('express-result').focus({preventScroll:true});finishExpress();
  }
  async function finishExpress() {
    const e=state.express,g=state.generation;
    if(e.transition===g+':'+e.index) return;
    e.transition=g+':'+e.index;
    const promise=say(e.line,{now:true,wait:true});
    renderRiders(e.facts[e.index][1],e.facts[e.index][2]);
    await Curio.wait(1500);
    if(g!==state.generation||state.mode!=='express') return;
    e.shown=true;renderExpress();
    await promise;await Curio.wait(1000);
    if(g!==state.generation||state.mode!=='express') return;
    const [a,b,op]=e.facts[e.index];e.tickets.push(equation([a,b,op,result(a,b,op)]));
    if(e.index===4) {
      e.done=true;render();say('expressDone');
    } else {
      e.index++;e.locked=false;e.shown=false;renderExpress();expressQuestion();
    }
  }
  for(let i=0;i<10;i++) {
    const seat=document.createElement('button');
    seat.className='seat';seat.id='seat-'+i;seat.innerHTML='<span class="counter empty"></span>';
    seat.onclick=()=>tapSeat(i);$('floor').append(seat);
  }
  for(let i=0;i<5;i++) {
    const seat=document.createElement('div');seat.className='seat';seat.innerHTML='<span class="counter empty"></span>';$('five').append(seat);
  }
  for(let i=0;i<6;i++) {
    const tile=document.createElement('button');tile.className='number-tile';tile.dataset.number=i;tile.id='number-'+i;
    tile.setAttribute('aria-label',cap(num(i)));tile.innerHTML=i+dots(i);tile.onclick=()=>answerExpress(i);$('number-tiles').append(tile);
  }
  $('roads').onclick=e=>{const b=e.target.closest('[data-road]');if(b) chooseRoad(b.dataset.road);};
  $('cup').onclick=addCounter;$('done').onclick=done;
  $('cards').onclick=e=>{
    const read=e.target.closest('[data-speak]'),card=e.target.closest('[data-card]');
    if(read){say(spoken(state.drive.stop.cards[Number(read.dataset.speak)]),{now:true});return;}
    if(card) pickCard(Number(card.dataset.card));
  };
  $('see-again').onclick=()=>{
    chime();const d=state.drive;
    renderRiders(d.stop.ten?d.stop.k+2:d.stop.k,d.stop.op,d.phase==='hold'||d.stop.ten);
    describeDrive(true);
  };
  $('go').onclick=()=>{
    state.drive.phase='show';$('go').hidden=true;renderDrive();describeDrive(true);
    (state.drive.stop.op==='+'?$('cup'):$('seat-0')).focus({preventScroll:true});
  };
  $('tell-first').onclick=()=>{state.tellFirst=!state.tellFirst;$('tell-first').setAttribute('aria-pressed',state.tellFirst);chime();};
  $('new-road').onclick=resetRoad;$('end-new-road').onclick=resetRoad;
  $('other-road').onclick=()=>{
    V.hush();state.generation++;const d=state.drive;
    d.phase='fork';d.count=d.forkCount;d.tickets=[...d.forkTickets];d.aboard=[...d.forkAboard];d.branch=null;d.index=2;
    state.stopKey=d.road+'-fork';render();say($('hint').textContent);
    $('roads').querySelector('button').focus({preventScroll:true});
  };
  $('express-ride').onclick=()=>setMode('express');
  $('drive-on').onclick=()=>{
    if(state.drive.phase!=='split'||splitList(state.drive.split).length<2) return;
    const s=state.drive.split,a=s.groups.filter(x=>x===0).length;
    state.drive.tickets.push(`${s.n} = ${a} + ${s.n-a}`);
    V.hush();state.drive.phase='show';beginStop(4);
  };
  $('areas').onclick=e=>{const b=e.target.closest('[data-kid]');if(b) moveKid(Number(b.dataset.kid));};
  $('keep').onclick=keep;$('more').onclick=()=>splitNumber(1);$('fewer').onclick=()=>splitNumber(-1);
  for(const k of Object.keys(D.routes)) $('place-'+k).onclick=()=>{
    state.split.place=k;renderSplit();
    V.how(`${D.routes[k].name}. ${L.split}`,{key:'place-'+k,hint:false,valid:()=>state.split.place===k});
  };
  $('place-cycle').onclick=()=>{
    const keys=Object.keys(D.routes);
    state.split.place=keys[(keys.indexOf(state.split.place)+1)%keys.length];
    renderSplit();
    const place=state.split.place;
    V.how(`${D.routes[place].name}. ${L.split}`,{key:'place-'+place,hint:false,valid:()=>state.split.place===place});
  };
  $('show-me').onclick=()=>answerExpress(null);
  $('again').onclick=()=>{V.hush();state.generation++;newExpress();render();expressQuestion();};
  for(const m of ['drive','split','express']) $('m-'+m).onclick=()=>setMode(m);
  document.addEventListener('keydown',e=>{
    if(state.mode==='express' && /^[0-5]$/.test(e.key)) {e.preventDefault();answerExpress(Number(e.key));}
  });
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    const kid=e.target.closest('[data-kid]');
    if(e.target.closest('#cup') && canEdit()) drag={type:'cup',x:e.clientX,y:e.clientY};
    else if(kid) drag={type:'kid',i:Number(kid.dataset.kid),x:e.clientX,y:e.clientY};
  });
  document.addEventListener('pointerup',e=>{
    if(!drag) return;
    const d=drag;drag=null;
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<12) return;
    if(d.type==='cup' && e.target.closest('#floor')) addCounter();
    if(d.type==='kid' && e.target.closest('.area')) {
      const destination=e.target.closest('.area').id==='area-left'?0:1;
      if(currentSplit().groups[d.i]!==destination) moveKid(d.i);
    }
  });
  document.querySelectorAll('[data-art]').forEach(el=>el.src=ART[el.dataset.art]);
  $('bus').addEventListener('load',positionDriver);
  new ResizeObserver(positionDriver).observe($('world'));
  new ResizeObserver(renderWayLinks).observe($('ways'));
  Curio.init({clips:"voice:*",rate:.9});
  window.__tool={state,setMode,allLines:V.allLines,vlog:V.log,get vq(){return V.queue;},
    chooseRoad,addCounter,tapSeat,done,pickCard,keep,moveKid,splitNumber,answerExpress,data:D};
  showWorld('school','Choose a road',false);render();
})();
</script>
</body>
</html>
