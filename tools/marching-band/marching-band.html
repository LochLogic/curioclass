MARCHING BAND (Curio Class)
Grade 2 math: odd and even (2.OA.C.3) and arrays as repeated addition (2.OA.C.4).
Teacher-led on a projector or smartboard; students call out what they see.
Two ways to line up the band:
  Partners: 1-20 musicians march in pairs. Does everyone get a partner? (odd and even)
  Rows:     up to 5 rows and 5 columns. 3 rows of 4 is 4 + 4 + 4 = 12. (arrays)

(() => {
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';
  // Motion follows the device's "reduce motion" setting until the teacher picks, then the choice is remembered
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => {
    reduce = !reduce;
    try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {}
    showMotion();
  };
  // Full-length illustrated musicians. Each painting is split at the crotch so its own legs can step:

    if (kind === 'trumpet') { tone('sawtooth', 523, 0.18, 0.12); tone('sawtooth', 659, 0.25, 0.12, 0.16); }
    if (kind === 'tuba') { tone('square', 87, 0.35, 0.12); }
    if (kind === 'flute') { tone('sine', 880, 0.3, 0.2); tone('sine', 988, 0.3, 0.15, 0.2); }
    if (kind === 'cymbals') { noise(0.6, 'highpass', 5000, 0.5); }
  }

  // ---------- layout ----------
  function positions() {
    // Partners: pairs side by side, two lines, front to back. Rows: an r by c grid.
    const out = [];
    if (state.mode === 'pairs') {
      const cols = Math.ceil(state.n / 2);
      for (let i = 0; i < state.n; i++) out.push({col: Math.floor(i / 2), row: i % 2, alone: state.n % 2 === 1 && i === state.n - 1});
      return {list: out, rows: 2, cols};
    }
    for (let r = 0; r < state.r; r++) for (let c = 0; c < state.c; c++) out.push({col: c, row: r, alone: false});
    return {list: out, rows: state.r, cols: state.c};
  }

  function draw() {
    const {list, rows, cols} = positions();
    // Rows stand on the field in perspective: the front line's feet at 535, each row behind a little smaller,
    // stacked so a row's feet sit just under the plumes in front (no figure covers another), the back row no higher than the field.
    const front = 535, field = 235, left = 40, right = 960, k = .84, tuck = .96;
    const gapX = Math.min(170, (right - left) / Math.max(cols, 1));
    let depth = 0;
    for (let d = 0; d < rows - 1; d++) depth += k ** d;
    const scale = Math.min(1.05, (gapX - 6) / widest, depth ? (front - field) / (FH * tuck * depth) : 9);
    const rowAt = [];
    for (let d = 0, y = front; d < rows; d++) { rowAt.push({y, s: scale * k ** d}); y -= FH * scale * k ** d * tuck; }
    const at = (col, row) => {
      const {y, s} = rowAt[rows - 1 - row];
      return {x: 500 + (col - (cols - 1) / 2) * gapX * s / scale, y, s};
    };
    band.replaceChildren();
    list.sort((a, b) => a.row - b.row);  // back rows first, so nearer rows draw in front
    list.forEach(p => {
      const inst = INSTRUMENTS[(p.col + p.row * 2) % INSTRUMENTS.length];
      const g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'musician' + (p.alone ? ' alone' : ''));
      const {x, y, s} = at(p.col, p.row);
      g.setAttribute('transform', `translate(${x} ${y}) scale(${s})`);
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', `${inst.k} player${p.alone ? ', no partner' : ''}`);
      const fw = FH * inst.size[0] / inst.size[1];
      const img = `<image href="${inst.art}" x="${-fw * inst.cx}" y="${-FH}" width="${fw}" height="${FH}"/>`;
      g.innerHTML = (p.alone ? `<ellipse class="glow" cx="0" cy="${-FH * .45}" rx="${FH * .36}" ry="${FH * .55}" fill="#f2c94c" opacity=".55"/>` : '') +
        `<ellipse cx="0" cy="-2" rx="${fw * .42}" ry="7" fill="#0003"/>` +
        `<g class="hopper"><g clip-path="url(#legl-${inst.k})"><g class="leg leg-l">${img}</g></g><g clip-path="url(#legr-${inst.k})"><g class="leg leg-r">${img}</g></g>` +
        `<g class="bob" clip-path="url(#body-${inst.k})">${img}</g></g>`;
      const hop = () => { g.classList.remove('hop'); void g.getBBox(); g.classList.add('hop'); play(inst.k); };
      g.addEventListener('click', hop);
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hop(); } });
      band.append(g);
    });
    if (state.mode === 'pairs') {
      // brackets that pair partners up
      for (let c = 0; c < Math.floor(state.n / 2); c++) {
        const r = document.createElementNS(SVGNS, 'path');
        const b = at(c, 0), f = at(c, 1), hb = gapX * .46 * b.s / scale, hf = gapX * .46;
        Object.entries({d: `M${b.x - hb} ${b.y - FH * b.s - 8}H${b.x + hb}L${f.x + hf} ${f.y + 12}H${f.x - hf}Z`, 'stroke-linejoin': 'round',
          fill: 'none', stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': '8 8', opacity: .8}).forEach(([k, v]) => r.setAttribute(k, v));
        band.prepend(r);
      }
    }
    sentence();
  }

  // ---------- the sentence along the bottom ----------
  function sentence() {
    const eq = $('eq'), say = $('say');
    if (state.mode === 'pairs') {
      const n = state.n, half = Math.floor(n / 2), odd = n % 2 === 1;
      eq.innerHTML = n === 1 ? '1 = <span class="em">1 alone</span>' : odd ? `${half} + ${half} + <span class="em">1</span> = ${n}` : `${half} + ${half} = ${n}`;
      say.textContent = pairsLine(n);
      sayLater();
      return;
    }
    const {r, c} = state, total = r * c;
    eq.innerHTML = Array(r).fill(c).join(' + ') + ` = <span class="em">${total}</span>`;
    say.textContent = rowsLine(r, c);
    (state.found[total] ||= new Set()).add(`${r} ${r === 1 ? 'row' : 'rows'} of ${c}`);
    const ways = [...state.found[total]];
    $('ways').innerHTML = `<b>Ways you've lined up ${total}:</b><div class="chips">${ways.map(w => `<span>${w}</span>`).join('')}</div>` +
      (ways.length === 1 ? '<div style="margin-top:8px">Can you find another way?</div>' : '');
    sayLater();
  }
  const cap = s => s[0].toUpperCase() + s.slice(1);
  // The spoken sentences: 20 for Partners (1 to 20) and 25 for Rows (1 to 5 by 1 to 5), all recorded
  function pairsLine(n) {
    const half = Math.floor(n / 2);
    if (n === 1) return 'One musician, no partner yet. One is odd.';
    if (n % 2) return `${cap(WORDS[n])} musicians make ${WORDS[half]} ${half === 1 ? 'pair' : 'pairs'}, and one has no partner. ${cap(WORDS[n])} is odd.`;
    return `Everyone has a partner! ${cap(WORDS[n])} is even: ${WORDS[half]} plus ${WORDS[half]}.`;
  }
  const rowsLine = (r, c) => `${cap(WORDS[r])} ${r === 1 ? 'row' : 'rows'} of ${WORDS[c]} ${r === 1 ? 'makes' : 'make'} ${WORDS[r * c]}. ${cap(WORDS[r * c])} is ${r * c % 2 ? 'odd' : 'even'}.`;

  // ---------- controls ----------
  function setMode(m) {
    const changed = state.mode !== m;
    state.mode = m;
    if (changed) { hush(); narrate('welcome-' + m, [WELCOME[m]]); }
    $('m-pairs').setAttribute('aria-pressed', m === 'pairs');
    $('m-rows').setAttribute('aria-pressed', m === 'rows');
    $('pairs-ctl').classList.toggle('hidden', m !== 'pairs');

    $(plus).onclick = () => { state[key] = Math.min(hi, state[key] + 1); sync(); draw(); };

    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (b && (b.id === 'sound' || b.id === 'read')) return;
    const go = () => { removeEventListener('click', go, true); clearTimeout(fb); setTimeout(() => { if (!queued.size && !nowKey && !sayTimer && !marchTimer) narrate('welcome-' + state.mode, [WELCOME[state.mode]]); }); };
    addEventListener('click', go, true); const fb = setTimeout(go, 1500);
  }, true);
  $('read').onclick = () => {
    if (marchTimer) stopMarch(true);   // Read stops the band first, so the sentence is never said over the music
    readNow([$('say').textContent]);
  };

  // for checking: every line the tool can speak, and each line that started
  window.__voice = {
    lines: () => [WELCOME.pairs, WELCOME.rows, ...Array.from({length: 20}, (_, i) => pairsLine(i + 1)),
      ...Array.from({length: 25}, (_, i) => rowsLine(Math.floor(i / 5) + 1, i % 5 + 1))],
    log: voiceLog,
  };

  // ---------- March! The band marches in place to "When the Saints Go Marching In" (traditional) ----------
  const BEAT = 0.42; // seconds per beat
  const C = 72, D = 74, E = 76, F = 77, G = 79, R = null;
  // [note, beats]
  const SAINTS = [
    [R, 1], [C, 1], [E, 1], [F, 1], [G, 4],
    [R, 1], [C, 1], [E, 1], [F, 1], [G, 4],
    [R, 1], [C, 1], [E, 1], [F, 1], [G, 2], [E, 2], [C, 2], [E, 2], [D, 4],
    [R, 2], [E, 1], [E, 1], [D, 1], [C, 3], [C, 1], [E, 2], [G, 2], [G, 1], [F, 3],
    [R, 1], [E, 1], [F, 1], [G, 2], [E, 2], [C, 2], [D, 2], [C, 4],
  ];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function brass(when, midi, dur) {
    const a = audio();
    [[1, 0.09, 'sawtooth'], [0.5, 0.05, 'square']].forEach(([mult, gain, type]) => {
      const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
      o.type = type; o.frequency.value = hz(midi) * mult;
      f.type = 'lowpass'; f.frequency.setValueAtTime(900, when); f.frequency.linearRampToValueAtTime(2200, when + 0.06);
      g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(gain, when + 0.03);
      g.gain.setValueAtTime(gain, when + Math.max(0.05, dur - 0.08)); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(f).connect(g).connect(bus || a.destination); o.start(when); o.stop(when + dur + 0.05);
    });
  }
  function drumHit(when, kind) {
    const a = audio(), len = a.sampleRate * 0.18, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = kind === 'bass' ? 'lowpass' : 'bandpass'; f.frequency.value = kind === 'bass' ? 160 : 1800;
    g.gain.value = kind === 'bass' ? 1.4 : 0.35;
    s.connect(f).connect(g).connect(bus || a.destination); s.start(when);
    if (kind === 'bass') {
      const o = a.createOscillator(), og = a.createGain();
      o.frequency.setValueAtTime(110, when); o.frequency.exponentialRampToValueAtTime(50, when + 0.15);
      og.gain.setValueAtTime(0.6, when); og.gain.exponentialRampToValueAtTime(0.0001, when + 0.2);
      o.connect(og).connect(bus || a.destination); o.start(when); o.stop(when + 0.25);
    }
  }
  function tuba(when, midi) {
    const a = audio(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz(midi); f.type = 'lowpass'; f.frequency.value = 500;
    g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(0.12, when + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, when + BEAT * 0.9);
    o.connect(f).connect(g).connect(bus || a.destination); o.start(when); o.stop(when + BEAT);
  }
  let bus = null;
  function playSaints() {
    const a = audio(), start = a.currentTime + 0.1;
    bus = a.createGain(); bus.connect(a.destination);
    let t = 0;
    SAINTS.forEach(([n, beats]) => { if (n) brass(start + t * BEAT, n, beats * BEAT * 0.95); t += beats; });
    const total = t;
    // oom-pah tuba (C and G) and drums on every beat, bass drum on 1 and 3
    for (let b = 0; b < total; b++) {
      const when = start + b * BEAT;
      drumHit(when, b % 2 === 0 ? 'bass' : 'snare');
      if (b % 2 === 0) tuba(when, b % 4 === 0 ? 36 : 43);
    }
    noiseAt(start + total * BEAT, 0.9);
    return total * BEAT + 0.4;
  }
  function noiseAt(when, dur) {
    const a = audio(), len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = 5000; g.gain.value = 0.45;
    s.connect(f).connect(g).connect(bus || a.destination); s.start(when);
  }

  let marchTimer = 0;
  function stopMarch(quiet) {
    const was = !!marchTimer;
    clearTimeout(marchTimer); marchTimer = 0;
    $('field').classList.remove('marching');
    $('march').setAttribute('aria-pressed', 'false');
    $('march').textContent = 'March! 🥁';
    if (bus) { bus.disconnect(); bus = null; }
    if (was && !quiet) narrate('welcome-' + state.mode, [WELCOME[state.mode]], {delay: 300});   // the band is done: the welcome, if never said
  }
  $('march').onclick = () => {
    if (marchTimer) return stopMarch();
    hush(); clearTimeout(sayTimer); sayTimer = 0;   // nothing is said while the band plays
    const field = $('field');
    field.style.setProperty('--step', `${BEAT * 2}s`);
    field.classList.add('marching');
    $('march').setAttribute('aria-pressed', 'true');
    $('march').textContent = 'Stop ■';
    const seconds = state.sound ? playSaints() : 8;
    marchTimer = setTimeout(stopMarch, seconds * 1000);
  };

  // keyboard shortcuts for the teacher at the board
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('button, [role=button]') && (e.key === 'Enter' || e.key === ' ')) return;
    if (e.key === '+' || e.key === '=') (state.mode === 'pairs' ? $('n-plus') : $('c-plus')).click();
    if (e.key === '-') (state.mode === 'pairs' ? $('n-minus') : $('c-minus')).click();
    if (e.key.toLowerCase() === 'm') $('march').click();
  });

  draw();
})();
</script>
</body>
</html>
