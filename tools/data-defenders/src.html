<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Defenders · Keeping data private, correct and available · Curio Class</title>
<meta name="description" content="An escape room in a made-up school after dark: fix the real weak spot in three locked rooms to learn confidentiality, integrity and availability, then sort six problems into C, I and A to open the exit. Grade 5 computer science. Works offline.">
<!--
Data Defenders (Curio Class)
Grade 5, computer science, The CIA Triad (Systems and Security). Standards: CSTA 2026 E5-SYS-SE-13, E5-SYS-NT-14
(2017 crosswalk 1B-NI-05). Teams of 2 or 3 on one laptop, or a teacher on a projector with table groups calling answers.
One mode, Escape: three locked rooms (Records Room = confidentiality, Grade Book Room = integrity, Server Closet =
availability), two puzzles in each of the first two and three in the Server Closet (the Network closet: wired and
wireless parts, then which devices stay online when the Wi-Fi access point fails), then the exit door where six
problems are sorted into C, I and A.
Facts: NIST CSRC Glossary (confidentiality, integrity, availability, least privilege, checksum); NIST SP 800-63B-4
section 3.1.1.2 (length, blocking common and context-specific passwords); UK NCSC "Most hacked passwords revealed"
(2019) for the common list; CISA (logs, backups kept apart from the original, denial of service); RFC 2606 and RFC 6761
(reserved example domains). Cedar Hollow, its people, scores, visits and the 500 visits per server are made up for
Curio Class; sums computed. Every address is a reserved name (cedarhollow.example). Nothing is stored or sent.
Uses the security family engine (kit:security, docs/families/security.md) and the network engine's map (kit:network,
docs/families/network.md) for the Network closet.
Background painting generated on this PC with FLUX (no people); doors, locks, puzzles, charts and logs drawn in code.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root{
  --paper:#f7f2e7;--panel:#ffffff;--ink:#2a2116;--muted:#64584a;--line:#e6dccb;--focus:#1d4ed8;
  --brand:#875a00;--btn:#875a00;--btn-line:#b88a2e;--head-ink:#ffffff;
  --night:#1e2a3a;--night-ink:#e6eef7;--gold:#ffd27a;--brass:#c99a3c;--brass-dk:#7a5410;
  --rC:#2f5ea8;--rI:#2e7d4f;--rA:#b0461f;--rX:#875a00;
  --ok:#1f7a46;--bad:#b42318;
  --sec-glow:#ffd27a;--sec-seal:#9a3412;
}
/* Three page layouts, picked in script (relayout()), as in collision-lab:
   wide    (1000 px or wider and 700 px or taller): stage on the left, 360 px panel on the right;
   compact (a short landscape box such as the 16:10 embed): a 290 to 320 px panel and a one-row header;
   stack   (narrow or portrait): the stage, then the panel; the hint and the puzzle's check controls move into the
           stage so they sit right by the puzzle. The panel comes first in the DOM so Tab goes header, panel, puzzle.
   Doors and stations are laid out at their real pixel size in every box (no scaled design). */
body.wide,body.compact{height:100vh;overflow:hidden}
main{min-height:0}
body.wide main{grid-template-columns:minmax(0,1fr) 360px}
body.compact main{grid-template-columns:minmax(0,1fr) 290px}
@media (min-width:900px){body.compact main{grid-template-columns:minmax(0,1fr) 320px}}
body.wide .stage,body.compact .stage{grid-column:1;grid-row:1}
body.wide .panel,body.compact .panel{grid-column:2;grid-row:1}
body.stack main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto;flex:none}
body.stack{height:auto}
body.stack main{align-content:start}
body.stack .stage{grid-row:1}
body.stack .panel{grid-row:2;border-left:0;border-top:3px solid var(--line)}
body.compact header{padding:4px 8px;gap:4px;flex-wrap:nowrap;min-width:0}
body.compact h1{font-size:17px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.compact h1 small{display:none}
body.compact .seg button,body.compact .icon-btn{min-height:44px;padding:0 9px;font-size:13.5px;white-space:nowrap}
body.compact .icon-btn,body.compact .seg{flex:none}
body.compact .panel{padding:8px 10px;gap:8px}
body.compact .hint{font-size:14.5px;line-height:1.35}
@media (max-width:560px){
  .seg button{min-height:44px;font-size:15px}
  .icon-btn{min-height:44px;padding:0 12px;font-size:15px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{display:inline-block;vertical-align:-4px;flex:none}

/* ---------- panel ---------- */
.btn{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;font-size:15.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.go{background:var(--brand);color:#fff}
.btn[aria-pressed="true"]{background:var(--brand);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 auto}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl:empty{display:none}
.ctl .big{min-height:52px;font-size:17px}
.res{margin:0;font-size:15px;line-height:1.4;border-left:4px solid var(--muted);padding:2px 0 2px 10px}
.res:empty{display:none}
.res.bad{border-color:var(--bad)}
.res.good{border-color:var(--ok)}
.res b{font-weight:700}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:6px;align-items:center}
.stepper output{text-align:center;font-weight:800;font-size:20px}
.stepper output small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.fixes{display:flex;flex-direction:column;gap:6px}
.fixes .btn{justify-content:flex-start;text-align:left;padding:6px 12px;line-height:1.3;min-height:48px;font-weight:600}
.fixes .btn.nope{border-style:dashed;border-color:var(--bad);color:var(--bad);background:#fdf3f2}
.lbl{margin:0;font-weight:700;font-size:14.5px}
.story{background:#fbf6ea;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.45}
.story h2{margin:0 0 4px;font:800 16px 'Trebuchet MS','Segoe UI',sans-serif;display:flex;gap:6px;align-items:center}
.story p{margin:0}
.story ul{margin:4px 0 0;padding-left:18px}
.clue{font-size:15px;line-height:1.4;background:#fff8e1;border:1px solid #f0d58a;border-radius:12px;padding:8px 12px;margin:0}
.clue:empty{display:none}
.timer{display:flex;flex-direction:column;gap:6px}
.timer .seg2{display:flex;gap:4px}
.timer .seg2 .btn{flex:1;padding:0 6px;font-size:14.5px}
.timer output{font:700 15px ui-monospace,Consolas,monospace}
.small{font-size:13px;color:var(--muted);margin:0;line-height:1.35}
.ask{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
body.compact .story{padding:6px 10px;font-size:13.5px}
body.compact .story h2{font-size:14.5px}
body.compact .btn{font-size:14px;padding:0 10px}
body.compact .ctl .big{min-height:46px;font-size:15.5px}
body.compact .res{font-size:13.5px}
body.compact .fixes .btn{font-size:13px;min-height:44px;padding:3px 8px}

/* ---------- stage ---------- */
.stage{background:var(--night);min-height:0}
body.stack .stage{overflow:visible;min-height:0}
#topSlot:empty{display:none}
#topSlot{padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
#topSlot .hint{margin:0}
#ctlDock:empty{display:none}
#ctlDock:not(:has(#ctl > *)){display:none}
#ctlDock{padding:10px 12px;background:#fff;border-top:1px solid var(--line)}

/* hallway */
.hall{position:absolute;inset:0;overflow:hidden;color:var(--night-ink)}
body.stack .hall{position:relative;inset:auto}
.hall .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.hall .shade{position:absolute;inset:0;background:linear-gradient(rgba(20,30,44,.55),rgba(20,30,44,.40) 45%,rgba(14,20,30,.62))}
.hall-in{position:relative;height:100%;display:flex;flex-direction:column}
.hall-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px}
.hall-top b{font:800 17px 'Trebuchet MS','Segoe UI',sans-serif;text-shadow:0 1px 3px #000a}
.compacthall .hall-top b{display:none}
.compacthall .hall-top{padding:6px 10px}
.chip{background:rgba(14,20,30,.78);border:1px solid #ffffff33;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.doors{margin-top:auto;display:grid;justify-content:center;align-items:stretch;padding:0 var(--gap) var(--gap);gap:var(--gap)}
.door{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:var(--dw);border-radius:10px;padding:4px}
.door:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.door .frame{position:relative;width:var(--dw);height:var(--dh);border:6px solid #2b2218;border-bottom:0;border-radius:6px 6px 0 0;
  background:radial-gradient(ellipse at 50% 60%,#fff2c8,#ffd27a 45%,#c98a24);perspective:700px;box-shadow:0 10px 24px #0008}
.door .leaf{position:absolute;inset:0;background:var(--dc);transform-origin:0 50%;transition:transform .45s ease-in;border-radius:2px;
  box-shadow:inset 0 0 0 3px #0003,inset 6px 0 0 #ffffff1a;display:flex;flex-direction:column;align-items:center}
.door:hover .leaf{filter:brightness(1.08)}
.door.opening .leaf{transform:rotateY(-78deg)}
.calm .door.opening .leaf{transform:none}
.calm .door.opening .frame{animation:flash .45s linear}
@keyframes flash{0%,100%{outline:0 solid var(--gold)}30%,70%{outline:5px solid var(--gold);outline-offset:2px}}
.leaf .win{margin-top:8%;width:56%;height:17%;border-radius:4px;background:linear-gradient(160deg,#9cc3e8,#2f4b6b 60%);border:3px solid #0004}
.leaf .emblem{margin-top:9%;width:calc(var(--du)*.42);height:calc(var(--du)*.42);border-radius:50%;background:#fff;color:var(--dc);display:grid;place-items:center;box-shadow:0 2px 0 #0003}
.leaf .emblem svg{width:62%;height:62%}
.leaf .shield{margin-top:7%;width:calc(var(--du)*.36);height:calc(var(--du)*.4)}
.leaf .lockplate{position:absolute;right:7%;top:55%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 3px;border-radius:8px;
  background:linear-gradient(#e8c26a,#a87a1c);box-shadow:0 2px 0 #0005}
.lockplate .ls{width:calc(var(--du)*.17);height:calc(var(--du)*.17);min-width:18px;min-height:18px;border-radius:50%;display:grid;place-items:center;background:#3a2c10;color:#8a7350;border:2px dashed #c9a35a}
.lockplate .ls svg{width:70%;height:70%}
.lockplate .ls.lit{background:var(--gold);color:#3a2c00;border:2px solid #fff3c4;box-shadow:0 0 8px var(--gold)}
.lockplate .kh{width:8px;height:12px;border-radius:4px 4px 2px 2px;background:#2b2218}
.exitleaf{background:linear-gradient(#a8802f,#7a5410)!important}
.exitsign{margin-top:7%;background:#14532d;color:#fff;font:800 calc(var(--du)*.12) 'Trebuchet MS',sans-serif;padding:1px 8px;border-radius:4px;letter-spacing:.06em}
.exitslots{margin-top:9%;display:flex;gap:4%;justify-content:center;width:100%}
.exitslots svg{width:calc(var(--du)*.25);height:calc(var(--du)*.28)}
.bigpad{margin-top:10%;width:calc(var(--du)*.3);height:calc(var(--du)*.3);color:#2b2218}
.doors.squat .leaf .win,.doors.squat .leaf .shield,.doors.squat .bigpad{display:none}
.doors.squat .leaf{justify-content:center}
.doors.squat .leaf .emblem{margin:0}
.doors.squat .exitsign{margin-top:0}
.doors.squat .exitslots{margin-top:6%}
.door .lab{text-align:center;line-height:1.2;max-width:calc(var(--dw) + 40px)}
.door .lab b{display:block;font:800 16px 'Trebuchet MS','Segoe UI',sans-serif;color:var(--night-ink);text-shadow:0 1px 3px #000}
.door .lab span{display:inline-block;margin-top:2px;font-size:13px;font-weight:700;color:var(--night-ink);background:rgba(14,20,30,.8);border-radius:999px;padding:1px 9px}
.door .lab span.done{color:#2a2116;background:var(--gold)}
.door.ready .frame{box-shadow:0 0 0 4px var(--gold),0 0 26px 8px var(--gold);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--gold),0 0 44px 18px var(--gold)}}
.calm .door.ready .frame{animation:flash 1s linear 3}
.lockplate.n3{top:46%}

/* room */
.room{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
body.stack .room{position:relative;inset:auto}
.rtop{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--rc);color:#fff;flex-wrap:wrap}
.rtop h2{margin:0;font:800 18px 'Trebuchet MS','Segoe UI',sans-serif;display:flex;gap:6px;align-items:center;margin-right:auto}
.back{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;font-size:15px}
.back:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.rlock{display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:12px;background:linear-gradient(#e8c26a,#a87a1c);box-shadow:0 2px 0 #0004}
.rlock .ls{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#3a2c10;color:#9c8460;border:2px dashed #d8b46a}
.rlock .ls svg{width:22px;height:22px}
.rlock .ls.lit{background:var(--gold);color:#3a2c00;border:2px solid #fff3c4;box-shadow:0 0 12px var(--gold)}
.rlock .cnt{font:800 13px 'Segoe UI',sans-serif;color:#2b1d00;padding:0 2px}
.rlock .ls.pop{animation:pop .6s ease-out}
.calm .rlock .ls.pop{animation:flash .6s linear}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.tabs{display:flex;gap:6px;padding:8px 10px 0}
.tabs:empty{display:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-height:44px;display:flex;gap:6px;align-items:center;justify-content:center;padding:0 10px;border-radius:10px 10px 0 0;
  background:#ece3d2;color:var(--muted);font-weight:700;font-size:15px;border:2px solid transparent;border-bottom:0}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);border-color:var(--rc)}
.tab:focus-visible{outline:4px solid var(--focus);outline-offset:-2px}
.compactui .rtop .tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tab .tick{color:var(--ok)}
.stations{flex:1;min-height:0;display:grid;gap:10px;padding:10px;overflow:auto;align-content:start}
.stations.split{grid-template-columns:1fr 1fr;align-items:stretch;align-content:stretch}
.stations.tabbed{padding-top:0}
body.stack .stations{overflow:visible}
.station{background:#fff;border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.stations.split .station.active{border-color:var(--rc)}
.stations.tabbed .station{border-color:var(--rc);border-top-left-radius:0;border-top-right-radius:0}
.st-head{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font:800 16px 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink)}
.st-head .ico{color:var(--rc)}
.st-head .state{margin-left:auto;font:700 13px 'Segoe UI',sans-serif;color:var(--muted)}
.st-head .state.done{color:var(--ok)}
.stations.tabbed .st-head{display:none}
.st-body{padding:10px 12px;overflow:auto;flex:1;min-height:0}
body.stack .st-body{overflow:visible}
.prompt{margin:0 0 8px;font-size:15px;line-height:1.4;color:var(--muted)}
.donebar{display:flex;gap:8px;align-items:center;margin:0 0 8px;padding:6px 10px;border-radius:10px;background:#e7f4ec;color:#14532d;font-weight:700;font-size:14.5px}
.compactui .prompt{font-size:13.5px;margin-bottom:6px}
.compactui .prompt.opt{display:none}
.back .short{display:none}
.compactui .back .full{display:none}
.compactui .back .short{display:inline}
.compactui .rtop{flex-wrap:nowrap;padding:4px 8px;gap:6px}
.compactui .rtop h2{font-size:15.5px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.compactui .back{padding:0 10px;font-size:14px}
.compactui .rlock{padding:3px 6px;gap:4px}
.compactui .rlock .ls{width:30px;height:30px}
.compactui .rlock .ls svg{width:18px;height:18px}
.compactui .rlock .cnt{display:none}
.compactui .tabs{padding:6px 8px 0}
.compactui .rtop .tabs{padding:0;flex:1;min-width:0;gap:4px}
.compactui .rtop .tab{border-radius:10px;background:#ffffff2e;color:#fff;border:2px solid #ffffff55;font-size:13px;min-width:0;flex:1 1 0}
.compactui .rtop .tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compactui .rtop .tab[aria-selected="true"]{background:#fff;color:var(--ink);border-color:#fff}
.compactui .rtop .tab .tick{color:inherit}
.tab .ts{display:none}
.compactui .rtop .tab .tl{display:none}
.compactui .rtop .tab .ts{display:inline}
.compactui.n3 .rtop .tab{padding:0 4px;gap:3px}
.compactui.n3 .rtop .tab>.ico{display:none}   /* three tabs in a short bar: the name says enough */
.tiny.n3 .rtop .tab{font-size:12px;padding:0 2px}
.tiny.n3 .rlock{gap:2px;padding:3px 4px}
.tiny.n3 .rlock .ls{width:24px;height:24px}
.tiny.n3 .rlock .ls svg{width:15px;height:15px}
.tabtop .back>span{display:none}
.tabtop .back{min-width:44px;padding:0;justify-content:center}
.doors.squat .leaf{flex-direction:row;justify-content:space-evenly;align-items:center}
.doors.squat .leaf .lockplate{position:static}
.compacthall .door .lab span{font-size:12px;white-space:nowrap}
.compacthall .door .lab b{font-size:15px}
.compactui .stations.tabbed{padding-top:8px}
.compactui .stations.tabbed .station{border-radius:14px}
.compactui .pws{grid-template-columns:1fr;gap:5px}
.compactui .pw{flex-direction:row;align-items:stretch;padding:4px}
.compactui .pw .test{flex:1;min-width:0}
.compactui .pw .btn.mini{flex:none;width:92px;white-space:normal;line-height:1.15;font-size:13px;padding:0 6px}
.compactui .plans{grid-template-columns:1fr 1fr;gap:5px}
.compactui .plan{padding:5px 6px;gap:4px}
.compactui .plan .pt{font-size:12.5px}
.compactui .day{font-size:12px}
.compactui .pool{grid-template-columns:1fr 1fr;padding:4px;gap:4px}
.compactui .slots{gap:4px;margin-top:6px}
.compactui .slotlist{padding:3px;gap:3px}
.compactui .sec-rowbody{gap:4px 6px;flex-wrap:nowrap}
.compactui .sec-rowname{min-width:0;font-size:14.5px;flex:none}
.tiny .sec-rowbody{flex-wrap:wrap}
.tiny .sec-slot{margin-left:0}
.tiny .sec-rowname{width:2.4em}
.compactui .card-x .sec-rowbody{padding:3px 6px}
.compactui .added{min-width:0;font-size:12px}
.added .ls{display:none}
.compactui .added .lf{display:none}
.compactui .added .ls{display:inline}
.compactui .i1btn .full{display:none}
.i1btn .short{display:none}
.compactui .i1btn .short{display:inline}
.compactui .sec-slot{gap:4px;flex-wrap:nowrap}
.pshort{display:none}
.compactui .pfull{display:none}
.compactui .pshort{display:inline}
.compactui .tab{font-size:14px;padding:0 6px}
.compactui .stations{padding:8px}
.compactui .st-body{padding:8px}
.compactui .st-head{padding:6px 10px;font-size:15px}

/* C1 grid */
.grid{display:grid;grid-template-columns:minmax(96px,1.4fr) repeat(4,minmax(52px,1fr));gap:4px;align-items:stretch}
.grid .colh{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:1px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1;padding-bottom:2px}
.grid .who{display:flex;flex-direction:column;justify-content:center;font-size:14.5px;font-weight:700;line-height:1.2;position:relative;padding-right:4px}
.grid .who small{font-weight:400;font-size:12.5px;color:var(--muted);font-style:italic}
.badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font:800 13px sans-serif;margin-left:4px;vertical-align:1px}
.cell{all:unset;box-sizing:border-box;cursor:pointer;min-height:48px;border-radius:10px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted);background:#faf7f0}
.cell[aria-checked="true"]{background:#e8f0fb;border-color:var(--rC);color:var(--rC)}
.room:not(.compactui) .cell{min-height:56px}
.cell:focus-visible{outline:4px solid var(--focus);outline-offset:1px}
.cell.pub{cursor:default;background:#f2efe6;border-style:dashed;color:var(--muted)}
.cell .ico{vertical-align:0}
.compactui .grid{grid-template-columns:minmax(84px,1.3fr) repeat(4,minmax(44px,1fr));gap:3px}
.compactui .cell{min-height:44px}
.compactui .grid .who{font-size:13px}
.compactui .grid .who small{font-size:11.5px}

/* C2 passwords */
.pws{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.pw{border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff}
.pw.picked{border-color:var(--ok)}
.pw .test{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;border-radius:8px;background:#f4efe4;padding:4px 10px;font:700 17px ui-monospace,Consolas,monospace;color:var(--ink);overflow-wrap:anywhere}
.pw .test:focus-visible{outline:4px solid var(--focus)}
.pw .test small{display:block;font:600 12px 'Segoe UI',sans-serif;color:var(--muted)}
.meter{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font:13px 'Segoe UI',sans-serif;margin-bottom:2px}
.pw .test .why{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.pwt{display:block}
.meter .bar{height:12px;border-radius:6px;background:#eee6d6;overflow:hidden;border:1px solid #d9cdb6}
.meter .bar i{display:block;height:100%}
.meter .w{font-weight:800}
.meter .why{grid-column:1/-1;color:var(--muted);line-height:1.3}
.b-Weak .bar i{width:33%;background:repeating-linear-gradient(45deg,#b42318 0 6px,#d9544a 6px 12px)}
.b-OK .bar i{width:66%;background:#b07a00}
.b-Strong .bar i{width:100%;background:#1f7a46}
.compactui .pw{padding:6px;gap:4px}
.compactui .pw .test{font-size:15px;min-height:44px}

/* I1 cards */
.cards{display:flex;flex-direction:column;gap:6px}
.card-x .sec-rowbody{padding:5px 8px}
.card-x.changed{border-color:var(--bad);border-width:2px}
.added{font-size:13.5px;color:var(--muted);min-width:7.5em}
.added b{color:var(--ink);font:700 15px ui-monospace,Consolas,monospace}
.mini{min-height:44px;font-size:14px;padding:0 10px}

/* I2 log */
.logwrap .sec-table td,.logwrap .sec-table th{padding:5px 7px}
.compactui .logwrap .sec-table{font-size:12.5px}
.compactui .logwrap .sec-table td small,.logwrap.narrow .sec-table td small{display:none}

/* A1 chart */
.chart{display:block}
.chart text{font:12.5px 'Segoe UI',system-ui,sans-serif;fill:var(--muted)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .cap{font-weight:700;fill:#7a2e10}
.chart .over{fill:var(--bad);font-weight:800}

/* A2 plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px}
.plan{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:#fff;min-height:44px}
.plan:hover{border-color:var(--rA)}
.plan:focus-visible{outline:4px solid var(--focus);outline-offset:1px}
.plan.picked{border-color:var(--ok);background:#f1f9f4}
.plan.nope{border-color:var(--bad);border-style:dashed}
.plan .pt{font-size:14.5px;line-height:1.3;color:var(--ink)}
.plan .pt b{font-size:16px;margin-right:4px}
.days{display:flex;gap:3px}
.day{flex:1;min-width:0;border-radius:6px;padding:2px 0;text-align:center;font-size:13px;font-weight:700;line-height:1.15;border:1px solid}
.day.kept{background:#e7f4ec;border-color:#9fd1b2;color:#14532d}
.day.lost{background:#fdecea;border-color:#f1a9a1;color:#8a1c12;text-decoration:line-through}
.day .ico{display:block;margin:0 auto}
body.wide .room:not(.compactui) .day{font-size:14px}
.plan .pwhy{font-size:13.5px;line-height:1.3;color:var(--ink);border-left:3px solid var(--bad);padding-left:7px}
.plan.picked .pwhy{border-color:var(--ok)}
.compactui .plan .pwhy{font-size:12.5px}

/* A3 network closet */
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px}
.part{border:2px solid var(--line);border-radius:12px;padding:6px 8px;display:grid;grid-template-columns:38px 1fr;gap:2px 8px;align-items:center;background:#fff;position:relative}
.part .pi{grid-row:1/3;color:#3b4252;display:grid;place-items:center}
.part .pn{font-weight:700;font-size:14.5px;line-height:1.2}
.part .pn small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.part .pn .ty{display:inline-block;font-size:11.5px;font-weight:700;color:#3b4252;background:#eef0f4;border-radius:999px;padding:0 7px;margin-top:2px}
.part .wb{grid-column:1/-1;display:flex;gap:4px;margin-top:4px}
.part .wb button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-height:44px;border-radius:9px;border:2px solid #c9bfae;display:flex;gap:5px;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);background:#faf7f0}
.part .wb button[aria-pressed="true"]{background:var(--rA);border-color:var(--rA);color:#fff}
.part .wb button:focus-visible{outline:4px solid var(--focus);outline-offset:1px}
.part.bad{border-color:var(--bad)}
.part .badge{position:absolute;top:4px;right:4px;margin:0}
.part.ok{border-color:var(--ok)}
.compactui .parts{grid-template-columns:1fr 1fr;gap:4px}
.compactui .part{padding:4px 6px;grid-template-columns:30px 1fr;gap:0 6px}
.compactui .part .pn{font-size:13px}
.compactui .part .pn small{font-size:12px;line-height:1.2}
.prompt.a3p{display:block}
.compactui .prompt.a3p{font-size:13px;margin:0 0 4px}
.compactui .part .wb button{font-size:12.5px;min-height:44px}
.tiny .part{grid-template-columns:1fr;padding:4px 5px}
.tiny .part .pi{display:none}
.tiny .part .wb{gap:3px}
.tiny .part .wb button{font-size:12px;padding:0 2px}
.tiny .part .wb button svg{display:none}
.netbox svg .a3pill{pointer-events:none}
.netbox svg{display:block;max-width:100%}
.netkey{font-size:13px;color:var(--muted);margin:4px 0 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.netkey i{display:inline-block;width:28px;height:0;border-top:3px solid #8a8a8a;vertical-align:middle;margin-right:5px}
.netkey i.wf{border-top-style:dashed}
.legend{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* exit */
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:6px;min-height:52px;padding:6px;border-radius:12px;background:#f2ead9;border:2px dashed #d8c9a8}
.pool:empty::before{content:attr(data-empty);color:var(--muted);font-size:14px;align-self:center}
.ecard{all:unset;box-sizing:border-box;cursor:grab;touch-action:none;background:#fff;border:2px solid #d8c9a8;border-radius:10px;padding:6px 9px;font-size:14px;line-height:1.3;color:var(--ink);min-height:44px;position:relative;box-shadow:0 2px 0 #0001}
.ecard:focus-visible{outline:4px solid var(--focus);outline-offset:1px}
.ecard[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--gold)}
.ecard.right{border-color:var(--ok);cursor:default;background:#f1f9f4;padding-right:28px}
.ecard.right::after{content:'✓';position:absolute;right:8px;top:5px;color:var(--ok);font-weight:900}
.ecard.drag{opacity:.9;z-index:20;cursor:grabbing;box-shadow:0 8px 20px #0004}
.ecard.shake{animation:shake .5s}
.calm .ecard.shake{animation:flashbad .5s linear}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes flashbad{0%,100%{outline:0 solid var(--bad)}30%,70%{outline:4px solid var(--bad)}}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.slotbox{border-radius:12px;border:2px solid var(--sc);background:#fff;display:flex;flex-direction:column;min-width:0}
.slotbox.over{box-shadow:0 0 0 4px var(--gold)}
.slothead{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:6px;align-items:center;padding:4px 8px;min-height:48px;background:var(--sc);color:#fff;border-radius:9px 9px 0 0}
.slothead:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.slothead .L{font:900 24px 'Trebuchet MS',sans-serif;width:30px;text-align:center}
.slothead span{font-size:12.5px;line-height:1.15;font-weight:600}
.slothead span b{display:block;font-size:14px}
.slotlist{display:flex;flex-direction:column;gap:4px;padding:5px;min-height:40px}
.room:not(.compactui) .ecard{font-size:15px;padding:8px 11px}
.compactui .ecard{font-size:12.5px;padding:4px 7px}
.compactui .slothead span:not(.L){font-size:0;min-width:0}
.compactui .slothead span b{font-size:12.5px;line-height:1.1;hyphens:manual;overflow-wrap:normal}
.compactui .slothead{padding:4px 6px;gap:4px;min-height:44px}
.compactui .slothead .L{width:auto;font-size:20px}

/* escape card */
.escape{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,20,30,.78);z-index:30;padding:12px;overflow:auto}
body.stack .escape{position:fixed}
.ecardbig{background:var(--paper);border:6px solid var(--brass);border-radius:18px;padding:18px 22px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 50px #000a}
.ecardbig h2{margin:0;font:900 28px 'Trebuchet MS',sans-serif;color:var(--brand)}
.ecardbig p{margin:6px 0}
.shields{display:flex;justify-content:center;gap:12px;margin:12px 0}
.shields div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;max-width:120px;line-height:1.2}
.shields svg{width:56px;height:62px}
</style>
</head>
<body>
<header>
  <h1>Data Defenders <small>Cedar Hollow Elementary</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-escape" aria-pressed="true">Escape</button>
  </div>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
  <button class="icon-btn" id="read" title="Read the hint aloud">🔊 Read</button>
</header>
<main>
  <aside class="panel" id="panel">
    <div id="hintHome"><p class="hint" id="hint" aria-live="polite"></p></div>
    <div id="ctlHome"><div class="ctl" id="ctl"></div></div>
    <div class="row" id="clueRow"><button class="btn" id="clue"></button></div>
    <p class="clue" id="clueText" aria-live="polite"></p>
    <div class="story" id="story"></div>
    <div class="timer">
      <p class="lbl" id="timerL">Team timer <output id="tleft"></output></p>
      <div class="seg2" role="group" aria-labelledby="timerL">
        <button class="btn" data-min="0" aria-pressed="true">Off</button>
        <button class="btn" data-min="20" aria-pressed="false">20 min</button>
        <button class="btn" data-min="30" aria-pressed="false">30 min</button>
      </div>
    </div>
    <div id="overBox"><button class="btn" id="over">↺ Start over</button></div>
    <p class="small">Cedar Hollow and everyone in it are made up. Nothing you do here is saved or sent anywhere.</p>
  </aside>
  <div class="stage" id="stage">
    <div id="topSlot"></div>
    <div class="hall" id="hall">
      <img class="bg" src="art:dd-night-hallway" alt="">
      <div class="shade"></div>
      <div class="hall-in">
        <div class="hall-top"><b>Cedar Hollow Elementary, after dark</b><span class="chip" id="progress"></span></div>
        <div class="doors" id="doors"></div>
      </div>
    </div>
    <div class="room" id="room" hidden>
      <div class="rtop">
        <button class="back" id="back"></button>
        <h2 id="rtitle"></h2>
        <div class="rlock" id="rlock" role="img"></div>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="stations" id="stations"></div>
    </div>
    <div id="ctlDock"></div>
    <div class="escape" id="escape" hidden></div>
  </div>
</main>
<script src="kit:curio"></script>
<script src="kit:network"></script>
<script src="kit:security"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const sec = Sec.pure;
  const h = Sec.h;
  const wait = ms => new Promise(r => setTimeout(r, ms));

    // the puzzles' own wrong texts

  function a3Errors() {

  // ---------- Exit: the CIA lock ----------
  BUILD.exit = body => {

    };

      const R = ROOMS[x];

  function placeSel(x) {

  }
  // move a card to a slot (or back to the pool with null), sliding from where it was (an outline flash with Motion off)
  function move(i, x, shake) {
    const S = state.exit;
    const old = document.querySelector(`.ecard[data-i="${i}"]`), r0 = old ? old.getBoundingClientRect() : null;
    S.place[i] = x; S.sel = null; S.res = '';
    renderRoom(); renderPanel();
    const now = document.querySelector(`.ecard[data-i="${i}"]`);
    if (!now || !r0) return;
    if (document.body.classList.contains('calm')) { if (shake) now.classList.add('shake'); return; }
    const r1 = now.getBoundingClientRect();
    now.animate([{transform: `translate(${r0.left - r1.left}px,${r0.top - r1.top}px)`}, {transform: 'none'}], {duration: 350, easing: 'ease-out'})
      .onfinish = () => { if (shake) now.classList.add('shake'); };
  }
  // drag a card onto a slot (pointer); a short press is a tap (select)

      if (drag) {

    });
    const hit = (s, e) => { const r = s.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
    const end = e => {
      if (!start) return;
      start = null;
      if (!drag) return;

  function exitOpen() {
