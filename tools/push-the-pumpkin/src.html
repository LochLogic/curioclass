<body>
<header>
  <h1>Push the Pumpkin<small>A little push. A big discovery.</small></h1>
  <div class="seg" role="group" aria-label="Mode">
    <button id="m-push" aria-pressed="true">✋ <span>Push</span></button>
    <button id="m-find" aria-pressed="false">⌕ <span>Find out</span></button>
    <button id="m-barn" aria-pressed="false">⌂ <span>Barn</span></button>
  </div>
  <button class="icon-btn" id="read">◖ <span>Read</span></button>
  <button class="icon-btn" id="motion" aria-pressed="true">✦ <span>Motion</span></button>
  <button class="icon-btn" id="sound" aria-pressed="true">♫ <span>Sound</span></button>
</header>
<main>
  <div class="stage" id="stage" aria-label="Autumn farm play scene">
    <canvas id="farm" tabindex="-1" role="img" aria-label="Jo and a ball at the middle of the farm path"></canvas>
    <button id="lane0" class="compare-hit" aria-label="Choose the object in the upper lane" hidden></button>
    <button id="lane1" class="compare-hit" aria-label="Choose the object in the lower lane" hidden></button>
    <div id="spots" hidden></div>
    <div id="wall" hidden></div>
  </div>
  <aside class="panel">
    <p class="hint" id="hint" aria-live="polite">Tap Go to give the ball a push.</p>
    <div id="push-controls" class="controls">
      <div class="row" id="objects"></div>
      <div class="row" id="strengths"></div>
      <div class="row" id="sides"></div>
      <button class="big-btn gold action" id="go"><img src="art:jo-small" alt="">Go <span>➜</span></button>
      <button class="clear" id="clear">♧ Clear flags</button>
    </div>
    <div id="find-controls" class="controls" hidden>
      <div id="find-strip" class="strip" aria-label="Five farm tests"></div>
      <div id="choices"></div>
      <div id="locked" class="lock" hidden>🔒 Our guess</div>
      <button class="big-btn gold action" id="test-go">Go ➜</button>
      <button class="big-btn gold action" id="test-next" hidden>Next ➜</button>
      <button class="big-btn gold action" id="wall-barn" hidden>⌂ Barn</button>
      <button class="clear" id="wall-push" hidden>✋ Push</button>
    </div>
    <div id="barn-controls" class="controls" hidden>
      <div id="barn-strip" class="strip" aria-label="Three barn designs"></div>
      <div id="tray" class="tray"></div>
      <button class="big-btn gold action" id="roll"><img src="art:ball" alt="">Roll ➜</button>
      <div id="thumbs" class="thumbs" hidden>
        <button id="yes" class="tile"></button>
        <button id="no" class="tile"></button>
      </div>
      <div id="analysis" class="thumbs" hidden></div>
      <button class="big-btn gold action" id="barn-next" hidden>Next ➜</button>
    </div>
    <p class="privacy">Our tries stay on this page. No work is saved.</p>
  </aside>
</main>

    if (q.phase === 'wall') return;
    const y1 = height*.44;
    const y2 = height*.78;
    const object = q.index < 2 ? q.index === 0 ? 'ball' : 'pumpkin' : q.index === 4 ? 'ball' : 'wagon';
    const size = Math.min(65,height*.14,width*.10);
    for (let lane = 0; lane < 2; lane++) {
      const y = lane ? y2 : y1;
      roundRect(width*.04,y-height*.12,width*.92,height*.19,30,'#d0aa77c9');
      fence(y-height*.08);
      const run = q.runs[lane];
      const progressValue = run ? progress(run,t) : 0;
      const moving = run && !run.stopped;
      let p = run ? run.from + (run.to-run.from) * (Curio.reduce && moving ? 0 : eased(progressValue)) : 0;
      if (q.index === 4 && !run) p = -5;
      const ob = run ? run.object : object;
      const jh = Math.min(150,height*.25,width*.2);
      let jx = postX(0)-size*.95;
      let pose = moving ? 'jo-small' : 'jo';
      let flip = false;
      if (q.index === 2 && lane === 1 && q.runs[0]) {
        jx = postX(0)+size*.95;
        flip = true;
      }
      if (q.index === 3 && lane === 1 && q.runs[0]) {
        jx = postX(run ? p : 0)+size*1.55;
        pose = moving ? 'jo-pull' : 'jo';
      }
      if (q.index === 4) {
        jx = postX(2)+size*.65;
        flip = true;
        pose = lane === 0 ? 'jo-aside' : moving && p < 1.6 ? 'jo' : 'jo-small';
      }
      if (q.index===3 && lane===1 && moving) {
        toy(ob,postX(p),y,size,p*3);
        pullHandle(postX(p),y,size,jx,y+size*.32,jh);
        jo(jx,y+size*.32,jh,pose,flip);
      } else {
        jo(jx,y+size*.32,jh,pose,flip);
        toy(ob,postX(p),y,size,p*3);
      }
      if (run?.stopped) flag({object:ob,p:run.to},y,true);
      if (q.phase !== 'compare') {
        roundRect(width*.025,y-height*.245,Math.min(130,width*.22),height*.075,8,'#fff6e8', '#d6b581');
        text('Try ' + (lane+1),width*.07,y-height*.207,Math.max(11,Math.min(16,width*.022)));
        if (run || (q.index===1 && lane===0)) {
          image(artFor(ob),width*.14,y-height*.207,28,28);
          const badgeSize = run ? run.size : q.firstBig ? 2 : 0;
          pathArrow(width*.18,y-height*.207,badgeSize===2?28:14,run?.side==='gate');
        }
      }
      if (q.comparison === 'miss' && run) {
        const n = Math.max(1,Math.round(Math.abs(run.to)));
        for (let i=0;i<n;i++) {
          ctx.fillStyle = NAVY;
          ctx.beginPath();
          ctx.arc(postX((i+1)*run.to/n),y+size*.65,Math.max(3,Math.min(6,width*.007)),0,7);
          ctx.fill();
        }
      }
    }
    canvas.setAttribute('aria-label','Two lanes for test ' + (q.index+1) + '. ' + $('hint').textContent);
  }
  function samplePath(path, p) {
    const lengths = path.slice(1).map((v,i) => Math.hypot((v[0]-path[i][0])*.0975,(v[1]-path[i][1])));
    const total = lengths.reduce((a,b) => a+b,0);
    let at = total*p;
    for (let i=0;i<lengths.length;i++) {
      if (at<=lengths[i] || i===lengths.length-1) {
        const q = lengths[i] ? Math.min(1,at/lengths[i]) : 1;
        return [path[i][0]+(path[i+1][0]-path[i][0])*q,path[i][1]+(path[i+1][1]-path[i][1])*q];
      }
      at-=lengths[i];
    }
    return path[path.length-1];
  }
  function drawBuckets(x,y,w,run,t) {
    const hit = run && progress(run,t) > .83;
    const tumble = hit && run.outcome === 'worked';
    const wobble = hit && run.outcome === 'wobble' && t-run.start < 3800;
    const positions = [[-.22,0],[.22,0],[0,-.5]];
    positions.forEach(([dx,dy],i) => {
      const angle = tumble ? [-.7,.8,1.7][i] : wobble && !Curio.reduce ? Math.sin(t*.022+i)*.13 : 0;
      const tx = x+dx*w+(tumble ? (i-1)*w*.45 : 0);
      const ty = y+dy*w+(tumble && i===2 ? w*.3 : 0);
      image('tin-bucket',tx,ty,w*.56,w*.62,angle);
    });
  }
  function drawBarn(t) {
    cover('barn-field');
    const level = state.level;
    const b = barn();
    const run = b.run;
    const groundY = height*.61;
    roundRect(width*.065,groundY-height*.045,width*.87,height*.09,height*.04,'#cfaa78db');
    fence(groundY-height*.075,true);
    const doorP = level===1?6:level===2?4:5;
    const bx = postX(doorP,width,true);
    const bw = Math.min(width*.26,260);
    const bh = bw*.789;
    const doorY = level===1?groundY:height*.32;
    image('barn-top',bx-bw*.17,doorY-bh*.34,bw,bh);
    const open = !!run?.judged && run.outcome==='worked';
    const dw = Math.max(28,bw*.41);
    const dh = Math.max(36,bh*.46);
    if (images['barn-door'].complete && images['barn-door'].naturalWidth) {
      const offset = open ? dw*.94 : 0;
      ctx.drawImage(images['barn-door'],bx-bw*.20+offset,doorY+bh*.16-dh,dw,dh);
    }
    if (level===2) image('pond',postX(8,width,true),groundY,width*.19,height*.21);
    if (level>1) image('pumpkin-patch',width*.47,height*.84,width*.55,height*.19);
    if (level===3) image('hay-pile',postX(8,width,true),groundY,width*.17,height*.18);
    const size = Math.min(57,width*.065,height*.12);
    const jh = Math.min(height*.30,190);
    const rolling = b.phase==='rolling';
    jo(postX(0,width,true)-size*.6,groundY+size*.3,jh,rolling?'jo-small':open?'jo-cheer':'jo');
    let at = [0,b.design.ramp===0?.56:.61];
    let prog = 0;
    if (run) {
      prog = progress(run,t);
      at = Curio.reduce && rolling ? run.path[0] : samplePath(run.path,eased(prog));
      const n = Math.floor(Math.min(t-run.start,run.duration)/200);
      for (let i=1;i<=n;i++) {
        const a = samplePath(run.path,eased(i*200/run.duration));
        ctx.fillStyle = NAVY+'8c';
        ctx.beginPath();
        ctx.arc(postX(a[0],width,true),height*a[1]+size*.35,Math.max(2.5,width*.0035),0,7);
        ctx.fill();
      }
    if (run.ghostStart && ['ghost','analysis','complete'].includes(b.phase)) {
        const gp = b.phase==='ghost' ? Curio.reduce ? 0 : Math.min(1,(t-run.ghostStart)/3000) : 1;
        const ghostPath = barnRunPath(level,model(level,{}),{});
        const real = samplePath(run.path,eased(gp));
        const ghost = samplePath(ghostPath,eased(gp));
        toy('ball',postX(ghost[0],width,true),height*ghost[1]+size*.5,size,0,.3);
        at = real;
        if (b.phase==='ghost') caption('Watch both balls',height*.095,width<600?15:22);
      }
      if (run.outcome==='pond' && prog===1) {
        ctx.strokeStyle = '#e5faff';
        ctx.lineWidth = 3;
        for (let i=0;i<3;i++) {
          ctx.beginPath();
          ctx.ellipse(postX(at[0],width,true),height*at[1]+size*.3,size*(.5+i*.24),size*(.14+i*.08),0,0,7);
          ctx.stroke();
        }
      }
      if (run.judged && run.outcome!=='worked') {
        ctx.strokeStyle = INK;
        ctx.lineWidth = 3;
        ctx.setLineDash([7,5]);
        ctx.beginPath();
        ctx.ellipse(postX(at[0],width,true),height*at[1],size*.8,size*.63,0,0,7);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (!['build','rolling'].includes(b.phase)) {
        for (const [piece,p] of Object.entries(run.design)) {
          image(artFor(piece),postX(p,width,true),groundY,Math.min(90,width*.12),Math.min(75,height*.17),
            piece==='up'?-.7:piece==='down'?.7:0,1,piece==='ramp' && p>0);
        }
      }
    }
    if (level===3) drawBuckets(bx,doorY-height*.015,Math.min(75,width*.09),run,t);
    toy('ball',postX(at[0],width,true),height*at[1],size,at[0]*3);
    if (b.phase!=='ghost') {
      caption(level===1?'Get the ball into the barn':level===2?'Turn the ball into the barn':'Knock down the buckets',height*.095,width<600?14:22);
    }
    drawTries(b);
    canvas.setAttribute('aria-label','Barn design ' + level + '. ' + (run?.stopped ? 'Ball stopped. ' : '') + $('hint').textContent);
  }
  function drawTries(b) {
    const compact = width<600 || height<420;
    const y = height*.91;
    const max = compact ? 12 : 7;
    const tries = b.tries.slice(-max);
    if (!tries.length) return;
    roundRect(width*.02,y-height*.065,width*.96,height*.13,10,'#fff6e9ed','#b58a52');
    if (compact) {
      tries.forEach((r,i) => {
        const x = width*.09+i*Math.min(29,width*.85/max);
        ctx.fillStyle = r.said===null?'#b9a388':NAVY;
        ctx.beginPath();
        ctx.arc(x,y,7,0,7);
        ctx.fill();
        if (r.said!==null && !r.correct) text('×',x,y,13,'#fff');
      });
      return;
    }
    const cell = width*.92/max;
    tries.forEach((r,i) => {
      const x = width*.04+i*cell;
      roundRect(x,y-height*.05,cell-6,height*.1,4,'#fffdf4','#dcc399');
      Object.keys(r.design).forEach((piece,j) => image(artFor(piece),x+16+j*20,y-height*.023,24,22));
      text('we said ' + (r.said===null?'?':r.said?'👍':'👎'),x+7,y+height*.01,11,INK,'left');
      text('it was ' + (r.said===null?'?':r.outcome==='worked'?'⌂ ●':'○ ●'),x+7,y+height*.035,11,INK,'left');
    });
  }
  function draw() {
    if (!ctx || !width || !height) return;
    ctx.clearRect(0,0,width,height);
    const t = now();
    if (state.mode==='push') drawPush(t);
    else if (state.mode==='find') drawFind(t);
    else drawBarn(t);
    if (!Curio.reduce) {
      const x = width*.83 + Math.sin(t/4500)*9;
      const y = height*.17 + Math.sin(t/2600)*5;
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(Math.sin(t/1900)*.3);
      ctx.fillStyle = '#be5926';
      ctx.beginPath();
      ctx.ellipse(0,0,6,3,.5,0,7);
      ctx.fill();
      ctx.restore();
    }
  }
  function tick(t) {
    if (state.mode==='push' && state.pushRun && !state.pushRun.flagged && progress(state.pushRun,t)>=1) finishPush(state.pushRun);
    if (state.mode==='find' && state.find?.busy) {
      for (let i=0;i<2;i++) {
        const r = test().runs[i];
        if (r && !r.stopped && progress(r,t)>=1) testStop(test(),i);
      }
    }
    if (state.mode==='barn') {
      const b = barn();
      if (b.phase==='rolling' && progress(b.run,t)>=1) barnStop(b);
      if (b.phase==='ghost' && t-b.run.ghostStart>=3000) ghostStop(b);
    }
    draw();
    requestAnimationFrame(tick);
  }
  Curio.init({clips:"voice:*",rate:.9});
  Curio.onMotion(draw);
  new ResizeObserver(resize).observe($('stage'));
  window.__tool = {
    state, setMode, allLines:V.allLines, vlog:V.log, get vq() { return V.queue; },
    model, allowed, distances, enterTest, place, renderBarn, draw, progress
  };
  updatePush();
  setMode('push');
  resize();
  requestAnimationFrame(tick);
})();
</script>
