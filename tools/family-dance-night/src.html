<!--
Family Dance Night, Curio Class. Teacher-led K-2 dance: DA:Re8, DA:Re9, DA:Cn11.
Built from kit/starter/src.html. Facts: Smithsonian Folklife, LOC, Britannica, Korea.net, NPS Jazz, Ladzekpo and GeoNames.
Illustrations generated with OpenAI gpt-image, edited for Curio Class. Original synthesized music, no recorded tune.
Map is Natural Earth public-domain land, Equal Earth projection, reused from the local world map data.
No automatic network requests. No dance progress saved.
Content CC BY 4.0, code MIT. curioclass.org. Sources and teaching notes in notes.md.
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root{

#place{font-size:19px;font-weight:800;margin:0}#origin{font-size:16px;line-height:1.4;margin:0}

.table-card.visited button{background:#fff0ac}.table-card button b{font-size:21px}

  filter:drop-shadow(0 9px 5px #482b2844)}
#vote-badge{position:absolute;bottom:16px;right:16px;max-width:60%;padding:9px 13px;background:#fff7dc;color:#7f1d1d;
  border:2px solid #bd6d41;border-radius:12px;font-weight:750;font-size:16px}
body:not(.home) #lights-badge{display:none}
.glow-bulb{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{opacity:.55}}
.calm .glow-bulb{animation:none!important}
@media (min-width:601px) and (max-width:999px) and (min-height:651px){
  main{grid-template-columns:1fr;grid-template-rows:300px minmax(0,1fr)}
  .panel{grid-column:1;grid-row:2;border-left:0;border-top:4px solid #7f1d1d}

}
@media (max-height:650px) and (min-width:601px){
  header{padding:4px 8px;gap:6px}h1{font-size:19px}h1 small{display:none}.icon-btn{padding:0 9px;font-size:14px}
  main{grid-template-columns:minmax(0,1fr) 340px}.panel{padding:3px;gap:2px}
  .tabs button{height:60px;font-size:11px;gap:1px}.tabs button b{font-size:19px}.tabbody{gap:5px}

  #copy .movebtn svg{height:35px;width:35px}#words,#from,#favorite-view{flex:none}
  .home-note{display:none}
  .movebtn{min-height:66px;font-size:14px;padding:3px 6px}.movebtn svg{width:42px;height:54px}
  .big-btn{font-size:16px}.footer .big-btn{font-size:13px}.words{gap:4px}.word{font-size:12px}
  #from-card{padding:5px;gap:3px}#map{height:86px}#place{font-size:15px}#origin{font-size:12px}
  .table-card img{height:clamp(75px,22vh,135px)}.table-card{width:19%}.table-card button{font-size:12px}
  #home-hint{top:6px;padding:6px 9px;font-size:12px}#lights-badge{top:6px;padding:8px 11px}

  #favorite-view{padding:5px;gap:6px}#favorite-view h2{font-size:16px}#favorite-view p{font-size:13px}
  .favorite-options{gap:4px}
}
@media (max-width:600px){
  header{padding:5px 8px;flex-wrap:wrap;gap:5px;justify-content:center}

  .icon-btn{flex:1;font-size:14px;padding:0 7px}body{overflow:auto;min-height:100vh;height:auto}
  main{display:flex;flex-direction:column}.stage{height:205px;min-height:205px;flex:none;order:0}
  .panel{border-left:0;border-top:4px solid #7f1d1d;padding:7px;gap:7px;overflow:visible;order:1}
  .tabs button{height:60px;font-size:12px}.tabbody{gap:7px;flex:none}.label{display:none}.dance-name{font-size:22px}
  .hint{min-height:55px;font-size:14px;padding:7px}.movebtn{min-height:72px;font-size:15px}.movebtn svg{height:55px}
  .footer .big-btn{font-size:14px}#map{height:120px}#origin{font-size:15px}#place{font-size:17px}
  #count{font-size:48px;top:53px;right:4px}#stage-title{font-size:16px;top:5px;left:6px;padding:6px;max-width:75%}
  #prop-table{width:25%;bottom:4%}#vote-badge{font-size:12px;bottom:6px;right:6px;padding:5px}
  body.home .stage{height:calc(100dvh - 100px);min-height:660px}.table-card{width:43%}
  .table-card img{height:110px}.table-card button{font-size:15px}.home-note{top:49%;padding:7px 11px}
  .home-note strong{font-size:20px}.home-note span{font-size:12px}
  #home-hint{top:5px;left:5px;padding:7px;font-size:12px;max-width:60%}#lights-badge{top:5px;right:5px;padding:8px;font-size:13px}
}
</style>

<body class="home">
<header>
  <h1>Family Dance Night <small>Seven tables. A whole world of movement. · Curio Class</small></h1>
  <button class="icon-btn" id="read">🔊 Read</button>
  <button class="icon-btn" id="motion" aria-pressed="true">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<main>
  <aside class="panel" id="panel" aria-label="Dance controls">
    <div class="tabs" role="tablist" aria-label="Explore the dance">
      <button id="tab-watch" role="tab" aria-selected="true" aria-controls="watch"><b>◉</b>Watch</button>
      <button id="tab-copy" role="tab" aria-selected="false" aria-controls="copy"><b>↔</b>Copy</button>
      <button id="tab-words" role="tab" aria-selected="false" aria-controls="words"><b>💬</b>Words</button>
      <button id="tab-from" role="tab" aria-selected="false" aria-controls="from"><b>⌖</b>Where from</button>
    </div>
    <div class="tabbody" id="watch" role="tabpanel">
      <p class="label">On the dance floor</p><h2 class="dance-name" id="dance-name"></h2>
      <div class="row"><button class="big-btn gold" id="play">▶ Play</button>
        <button class="big-btn soft" id="slow" aria-pressed="false">◷ Slow</button></div>
    </div>
    <div class="tabbody" id="copy" role="tabpanel" hidden>
      <button class="big-btn soft movebtn" id="move-0"><svg aria-hidden="true"></svg><span><small>Move 1</small><span></span></span></button>
      <button class="big-btn soft movebtn" id="move-1"><svg aria-hidden="true"></svg><span><small>Move 2</small><span></span></span></button>
      <button class="big-btn gold" id="count-in">● Count me in</button>
    </div>
    <div class="tabbody" id="words" role="tabpanel" hidden><div class="words" id="word-grid"></div></div>
    <div class="tabbody" id="from" role="tabpanel" hidden>
      <div id="from-card"><svg id="map" viewBox="0 0 360 180" role="img" aria-label="World map with the dance's home marked"></svg>
        <p id="place"></p><p id="origin"></p></div>
    </div>
    <div class="tabbody" id="favorite-view" hidden>
      <h2>♥ Favorite part</h2><p>Vote with your hands. Tap your favorite.</p><div class="favorite-options" id="favorites"></div>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="footer"><button class="big-btn soft" id="favorite">♡ Favorite part</button>
      <button class="big-btn" id="back">⌂ Back to the gym</button></div>
  </aside>
  <div class="stage" id="stage">
    <svg id="sv" aria-hidden="true"></svg><div id="home-tables"></div>
    <div class="home-note" id="home-note"><strong>Come dance!</strong><span>Pick a family's table.</span></div>
    <div id="home-hint">Tap a table to meet its dance.</div>
    <div id="lights-badge">💡 Lights <span id="lights">0 of 7</span></div>
    <div id="stage-title" hidden></div><div id="count" hidden></div><img id="prop-table" alt="" hidden>
    <div id="vote-badge" hidden></div>
  </div>
</main>
<script src="kit:curio"></script>
<script src="kit:dance"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  const art = {
    gym:'art:gym',lion:'art:table-lion',jarabe:'art:table-jarabe',irish:'art:table-irish',bhangra:'art:table-bhangra',

          {arms:[0,0,0,0],lLeg:[78,6,0],rToe:1,lift:.08},{arms:[0,0,0,0],lLeg:[-10,3,85],rLeg:[10,3,20]}],'sharp')]},
    {id:'bhangra',name:'Bhangra',icon:'✧',place:'Punjab, India and Pakistan',pin:[31.6,74.9],bpm:96,prop:'dhol drum',

    {id:'fan',name:'Korean Fan Dance',icon:'❀',place:'Korea',pin:[37.6,127],bpm:60,prop:'fans',

  function makeMusic(d,volume) {
    const pattern=(n,fn)=>Array.from({length:n},(_,i)=>fn(i));
    const notes=[60,64,67,69,67,64,62,60],parts={};
    if(d.id==='lion'){parts.kick='X...x...X...x...';
    parts.wood='....x.......x...';
    }
    if(d.id==='jarabe'){
      parts.pluck=pattern(48,i=>i%3===0?notes[Math.floor(i/3)%8]+7:null);
      parts.stamp='X..x..x..X..x..x';
    }
    if(d.id==='irish'){parts.tap='x.x.x.x.x.x.x.x.';
    parts.kick='X.......x.......';
    }
    if(d.id==='bhangra'){
      parts.kick='X...x...X...x...';
      parts.clap='...x...x...x...x';
      parts.pluck=pattern(32,i=>i%4===0?[62,65,69,72][i/4%4]:null);
    }
    if(d.id==='fan'){parts.wood='X.....x..x..';
    parts.kick='X.....x.....';
    }
    if(d.id==='second'){
      parts.bass=pattern(32,i=>i%4===0?[48,43,48,46][i/4%4]:null);
      parts.snare='..x...x...x...x.';
      parts.kick='X...x...X...x...';
    }
    if(d.id==='kpanlogo'){parts.kick='X..x..x.X..x..x.';
    parts.wood='x..x..x.x.x.x...';
    parts.shaker='xxxxxxxxxxxxxxxx';
    }
    const sub=['jarabe','fan'].includes(d.id)?3:2;
    // Repeat each short drum pattern through a complete sixteen-count loop.
    for(const key in parts)if(typeof parts[key]==='string')parts[key]=parts[key].repeat(Math.ceil(16*sub/parts[key].length)).slice(0,16*sub);
    return Dance.music({len:16,sub,swing:['bhangra','second'].includes(d.id)?.24:0,vol:volume,parts},clk);
  }
  function makeExtraAudio(d,volume) {

        if(!noise){

        }
        const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();

      }
      if(d.id==='jarabe')tone(freq(notes[beat%8]+12),'sawtooth',dur*.8,.1,1500);

        hiss(.2,3000,.015);
        drum(beat%3?190:95,.13);

    stop();
    },duck(v){if(out)out.gain.value=!Curio.sound?0:v?volume*.501:volume;
    }};
  }
  async function speakDuring(line,options={}) {
    const speech=++speechEpoch;
    if(music){music.stop();
    music=makeMusic(current(),.23);
    }
    if(extraAudio)extraAudio.duck(true);
    const token=state.runId;
    await V.say(line,{...options,wait:true});
    if(token!==state.runId||speech!==speechEpoch)return;
    if(music){music.stop();
    music=makeMusic(current(),.46);
    }
    if(extraAudio)extraAudio.duck(false);
  }
  function showCount(n) {
    state.count=n;
    state.countIn=n<=0;
    $('count').hidden=false;
    $('count').innerHTML=(n<=0?n+4:((n-1)%8)+1)+'<small>'+(n<=0?'GET READY':'COPY THE MOVE')+'</small>';
  }
  function startRun(moveIndex=null,countIn=false) {
    stopRun();
    const d=current(),token=state.runId;
    state.playing=true;
    state.shown=moveIndex===null?'both':moveIndex;
    if(moveIndex!==null)state.selected=moveIndex;
    const copy=moveIndex!==null||state.tab==='copy';
    clk=Dance.clock(d.bpm*((copy||state.slow)? .6:1),{meter:['jarabe','fan'].includes(d.id)?3:4,countIn:countIn?4:0});
    if(copy)poseMove(state.selected,0);
    hint(copy?'Copy the dancer like a mirror. Tap a move to try again.':'Watch the two moves. Tap Slow to copy, or tap Stop.');
    $('play').textContent='■ Stop';
    music=makeMusic(d,.46);
    extraAudio=makeExtraAudio(d,.46);
    const phrases=figure.map((r,i)=>{
      if(moveIndex!==null)return phraseFor(moveIndex,true,i);
      const a=phraseFor(0,false,i),b=phraseFor(1,false,i);
      return {total:16,at(c){return c<8?a.at(c):b.at(c-8);
      }};
    });
    let began=false;
    const begin=()=>{
      if(began||token!==state.runId)return;
      began=true;
      run=Dance.play(figure.map(r=>r.model),phrases,{clock:clk,loop:moveIndex===null,
        onFrame(pos){
          if(moveIndex===null)state.selected=Math.floor(Math.max(0,pos)%16/8);
          figure.forEach((r,i)=>decorateFigure(r,d,i));
        },onEnd(){
          if(token!==state.runId)return;
          stopRun(false);
          hint('Tap Words to describe the move, or tap another move.');
          V.how('words',{valid:()=>state.tab==='copy',needs:'#tab-words'});
        }});
      if(moveIndex!==null)speakDuring('move'+state.table+moveIndex,{valid:()=>token===state.runId});
    };
    clk.onCount(n=>{
      if(token!==state.runId)return;
      if(n>0&&pendingRead){pendingRead=false;
      stopRun(false);
      V.read();
      return;
      }
      if(n===1)begin();
      if(copy||n<=0)showCount(n);
      if(moveIndex===null)countStrip.set(n);
      if(n>0&&pendingWord){const line=pendingWord;
      pendingWord=null;
      speakDuring(line);
      }
      if(moveIndex===null&&n===17){
        hint('Tap Copy, then tap a move to try it.');
        if(!V.heard('copy'))speakDuring('copy',{kind:'how',valid:()=>state.tab==='watch',needs:'#tab-copy'});
      }
    });
    if(!countIn)begin();
    clk.start();
  }
  function answerWord(w) {
    const d=current(),fits=state.shown==='both'?d.moves.some(m=>m.words.includes(w)):d.moves[state.shown].words.includes(w);
    const key=(fits?'yes':'no')+w;
    state.lastAnswer={word:w,fits,shown:state.shown};
    document.querySelectorAll('.word').forEach(b=>b.setAttribute('aria-pressed',b.dataset.word===w));
    hint(L[key]);
    Curio.tone(fits?660:390,.13,.035);
    $('stage-title').textContent=d.name+' · '+w;
    if(state.playing)pendingWord=key;
    else V.say(key,{now:true});
  }
  function drawMap() {
    const svg=$('map');
    svg.textContent='';
    mk('path',{d:WORLD.d,transform:'translate(0 10) scale(.36)',fill:'#b8c7a3',stroke:'#778a73',
      'stroke-width':1.5,'stroke-linejoin':'round'},svg);
    const [lat,lon]=current().pin,t=Math.asin(Math.sqrt(3)/2*Math.sin(lat*Math.PI/180));
    const xx=2*Math.sqrt(3)*(lon*Math.PI/180)*Math.cos(t)/
      (3*(9*.003796*t**8+7*.000893*t**6-3*.081106*t*t+1.340264));
    const yy=.003796*t**9+.000893*t**7-.081106*t**3+1.340264*t;
    const x=(xx+WORLD.xmax)*WORLD.s*.36,y=(WORLD.ymax-yy)*WORLD.s*.36+10;
    mk('circle',{cx:x,cy:y,r:10,fill:'#fff8de',stroke:'#7f1d1d','stroke-width':2},svg);
    mk('circle',{cx:x,cy:y,r:4.5,fill:'#7f1d1d'},svg);
    mk('path',{d:`M${x} ${y+12}v13`,stroke:'#7f1d1d','stroke-width':3},svg);
    const label=mk('text',{x:x>240?x-12:x+12,y:y<34?y+21:y-11,'text-anchor':x>240?'end':'start',
      fill:'#4b1616','font-size':12,'font-weight':800,'paint-order':'stroke',stroke:'#faffef','stroke-width':3},svg);
    label.textContent=current().id==='bhangra'?'Punjab':current().id==='second'?'New Orleans':current().place.split(',')[0];
    $('map').setAttribute('aria-label','World map: '+current().place);
    $('place').textContent='⌖ '+current().place;
    $('origin').textContent=current().origin;
  }
  function makeFavorites() {
    const box=$('favorites');
    box.textContent='';
    const d=current();
    ['Move 1','Move 2','The music','The '+d.prop].forEach((name,i)=>{
      const b=document.createElement('button');
      b.className='big-btn soft';
      b.textContent=['↔ ','↔ ','♫ ','✧ '][i]+name;
      b.onclick=()=>{
        state.votes[state.table]=i<2?d.moves[i].name:name;
        $('vote-badge').textContent='♥ '+state.votes[state.table];
        $('vote-badge').hidden=false;
        [...box.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
        hint(L.favorite);
        Curio.tone(784,.2,.04);
        V.say('favorite');
      };
      box.appendChild(b);
    });
  }
  function toggleFavorite() {
    if(state.favorite){selectTab(state.tab);
    return;
    }
    stopRun();
    state.favorite=true;
    for(const k of ['watch','copy','words','from'])$(k).hidden=true;
    $('favorite-view').hidden=false;
    $('favorite').setAttribute('aria-pressed','true');
    hint(L.vote);
    V.how('vote',{valid:()=>state.favorite,needs:'#favorites button'});
  }
  DATA.forEach((d,i)=>{
    const card=document.createElement('div');
    card.className='table-card';
    card.id='table-card-'+i;
    card.innerHTML='<img alt="" src="'+art[d.id]+'"><button id="table-'+i+'"><b>'+d.icon+'</b><span>'+d.name+
      '</span><span class="tic" aria-hidden="true">✓</span></button>';
    card.querySelector('button').onclick=()=>openTable(i);
    $('home-tables').appendChild(card);
  });
  WORDS.forEach((w,i)=>{
    const b=document.createElement('button');
    b.className='word';
    b.dataset.word=w;
    b.id='word-'+w;
    b.setAttribute('aria-pressed','false');
    b.innerHTML='<b aria-hidden="true">'+WORD_ICONS[i]+'</b>'+w;
    b.onclick=()=>answerWord(w);
    $('word-grid').appendChild(b);
  });
  for(const tab of ['watch','copy','words','from'])$('tab-'+tab).onclick=()=>selectTab(tab);
  $('play').onclick=()=>{
    if(state.playing){stopRun();
    hint(L.watch);
    }
    else startRun();
  };
  $('slow').onclick=()=>{
    state.slow=!state.slow;
    $('slow').setAttribute('aria-pressed',state.slow);
    if(clk)clk.setBpm(current().bpm*(state.slow? .6:1));
    Curio.tone(state.slow?330:520,.1,.025);
  };
  for(let j=0;j<2;j++)$('move-'+j).onclick=()=>startRun(j);
  $('count-in').onclick=()=>startRun(state.selected,true);
  $('favorite').onclick=toggleFavorite;
  $('back').onclick=backHome;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&state.table!==null){e.preventDefault();
    backHome();
    }
    if(e.code==='Space'&&state.table!==null&&!e.repeat){
      e.preventDefault();
      if(state.playing){stopRun();
      hint(state.tab==='copy'?L.chooseMove:L.watch);
      }
      else startRun(state.tab==='copy'?state.selected:null);
    }
    const tabs=['watch','copy','words','from'];
    if(e.target.closest('.tabs')&&['ArrowLeft','ArrowRight'].includes(e.key)){
      e.preventDefault();
      selectTab(tabs[(tabs.indexOf(state.tab)+(e.key==='ArrowRight'?1:3))%4],true);
    }
  });
  Curio.init({clips:"voice:*",rate:.88});
  $('read').onclick=()=>{
    if(state.countIn){pendingRead=true;
    return;
    }
    if(state.playing)stopRun(false);
    V.read();
  };
  Curio.onSound(on=>{if(extraAudio)extraAudio.duck(!on);
  });
  Curio.onMotion(()=>{if(floor)drawLights();
  });
  floor=Dance.floor($('sv'),'square',{backdrop:art.gym,dancerFrac:.53});
  lightLayer=mk('g',{},floor.layers.marks);
  countStrip=Dance.counts(floor.layers.front,null,{n:8,mode:'numbers',on:'#f7d774',offLine:'#8a6344'});
  new ResizeObserver(relayout).observe($('stage'));
  hint(L.welcome);
  relayout();
  window.__tool={state,DATA,WORDS,L,setMode:selectTab,openTable,backHome,startRun,stopRun,poseMove,answerWord,
    allLines:V.allLines,vlog:V.log,get vq(){return V.queue;
    },get figures(){return figure;
    },get clock(){return clk;
    },
    painterNames,phraseFor,relayout};
})();
</script>
