<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Safari · Lines, shapes and colors · Curio Class</title>
<meta name="description" content="Go on a safari with Zebra. Lines draw themselves across the savanna (zigzag mountains, a wavy river, a spiral snail) and the class names each one. Then hunt for shapes, mix primary colors to help a chameleon hide, and draw with zigzag and wavy brushes.">
<!--
LINE SAFARI (Curio Class)
Visual arts, grades K-2, National Core Arts Standards VA:Cr1 (explore and imagine with art materials) and VA:Cr2
(experiment with materials), module "Lines, Shapes and Colors": the elements of art, primary and secondary colors.
Lines: ten stops. A line draws itself into the picture, the class names it, then moves it with their bodies and
the teacher draws along on the board. By the end the whole savanna is made of lines.
Shapes: a cut-paper safari camp made of circles, squares, triangles, rectangles, ovals, a diamond, stars and a
heart. Pick a shape and find every one.
Colors: red, yellow and blue paint. Mix two primaries to make a secondary color and turn the chameleon that
color, then help it hide on something the same color.
Draw: line brushes (straight, curvy, zigzag, wavy, dotted, spiral) and shape stamps.
Teacher-led on a projector or smartboard. Illustrations generated with Google Gemini, edited for Curio Class.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<style>
:root{
  --paper:#fbf6ea;--ink:#2e2418;--muted:#6b5c48;--focus:#2f5bd3;--brand:#c0612b;--gold:#ffcf3a;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);display:grid;grid-template-rows:auto 1fr;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--brand);color:#fff6ee}
h1{margin:0 auto 0 0;font:800 clamp(22px,2.8vw,32px)/1.1 'Trebuchet MS','Segoe UI',sans-serif}
h1 small{display:block;font:400 14px/1.3 'Segoe UI',sans-serif;color:#ffdcc6}
.icon-btn{border:1px solid #e08a5a;background:#d2733e;color:#fff;border-radius:999px;min-height:46px;padding:0 16px;font-weight:700;font-size:15px}
.icon-btn[aria-pressed="false"]{background:#8a4019}

.stagewrap{position:relative;overflow:hidden;min-height:0;background:#f2e6c8}
.scene{position:absolute;left:50%;top:50%;width:1440px;height:810px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:#fff}
.scene>img.bg{position:absolute;left:-12px;top:-12px;width:1464px;height:834px;object-fit:cover}
.top{position:absolute;left:24px;right:24px;top:16px;display:flex;align-items:center;gap:12px;z-index:8}
.tabs{display:inline-flex;border-radius:999px;overflow:hidden;background:#fffe;box-shadow:0 3px 0 #0003}
.tabs button{border:0;background:transparent;min-height:58px;padding:0 24px;font:800 21px 'Trebuchet MS',sans-serif;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff}
.big{border:0;border-radius:18px;min-height:58px;padding:0 22px;font:800 21px 'Trebuchet MS',sans-serif;background:#fff;color:var(--ink);box-shadow:0 5px 0 #0003}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.big.go{background:#2f8a4a;color:#fff;box-shadow:0 5px 0 #1d5e30}
.big.or{background:var(--brand);color:#fff;box-shadow:0 5px 0 #7a3a14}
.big[aria-pressed="true"]{background:var(--gold);color:#3a2a00}
.big:disabled{opacity:.4}
svg.layer{position:absolute;inset:0;width:1440px;height:810px;overflow:visible}
.zebra{position:absolute;left:10px;bottom:0;height:330px;z-index:5;filter:drop-shadow(0 8px 6px #0004);transform-origin:50% 100%}

/* lines */
.card{position:absolute;left:470px;top:88px;width:560px;z-index:7;background:#fffffff2;border-radius:28px;padding:14px 22px;box-shadow:0 10px 26px #0003;text-align:center}
.card .stop{font:800 16px 'Segoe UI',sans-serif;color:var(--muted);display:flex;justify-content:center;gap:6px;align-items:center}
.card .stop i{width:14px;height:14px;border-radius:50%;background:#e4d8c2;display:inline-block}
.card .stop i.on{background:var(--brand)}
.card .stop i.done{background:#c9a98a}
.card h2{margin:6px 0 4px;font:900 42px/1.05 'Trebuchet MS',sans-serif}
.card p{margin:4px 0;font:700 21px/1.3 'Segoe UI',sans-serif}
.card .move{background:#fff4d6;border-radius:16px;padding:8px 12px;margin-top:8px}
.card .btns{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.card .btns .big{min-height:52px;font-size:19px;padding:0 16px}
.ink{fill:none;stroke-linecap:round;stroke-linejoin:round}
#lines .old{opacity:.3;transition:opacity .6s}
#lines .glow{opacity:0;pointer-events:none}
canvas.trace{position:absolute;inset:0;width:1440px;height:810px;z-index:6;touch-action:none}

/* shapes */
.shape{cursor:pointer;transition:filter .2s}
.shape:hover{filter:brightness(1.08)}
.shape.found{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 8px #ffcf3a) drop-shadow(0 0 4px #ffcf3a)}
.shbar{position:absolute;left:20px;right:20px;bottom:14px;z-index:6;display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.shbtn{border:0;border-radius:20px;background:#fffffff0;box-shadow:0 5px 0 #0003;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:900 19px 'Trebuchet MS',sans-serif}
.shbtn svg{width:54px;height:54px}
.shbtn small{font:800 15px 'Segoe UI',sans-serif;color:var(--muted)}
.shbtn[aria-pressed="true"]{background:var(--gold)}
.shbtn.all small{color:#2f8a4a}
.msg{position:absolute;left:50%;transform:translateX(-50%);bottom:114px;z-index:7;background:#fff;border-radius:24px;padding:10px 28px;font:800 27px/1.25 'Trebuchet MS',sans-serif;box-shadow:0 8px 20px #0003;text-align:center;max-width:900px}

/* colors */
.cham{position:absolute;left:470px;top:270px;width:500px;z-index:4;transform-origin:50% 70%}
.cham img{display:block;width:100%;filter:drop-shadow(0 10px 6px #0004)}
.cham .tint{position:absolute;inset:0;mix-blend-mode:multiply;-webkit-mask:url(art:chamask) center/100% 100% no-repeat;mask:url(art:chamask) center/100% 100% no-repeat;transition:background-color .9s}
.calm .cham .tint{transition:none}
.pots{position:absolute;left:130px;bottom:24px;display:flex;gap:26px;z-index:6;align-items:flex-end}
.pot{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:900 22px 'Trebuchet MS',sans-serif}
.pot svg{width:140px;height:130px;overflow:visible}
.pot[aria-pressed="true"] svg{transform:translateY(-12px)}
.bowl{position:absolute;left:720px;bottom:26px;z-index:6;display:flex;align-items:center;gap:18px}
.eq{font:900 34px 'Trebuchet MS',sans-serif;background:#fffffff0;border-radius:20px;padding:10px 20px;box-shadow:0 5px 0 #0002;min-width:420px;text-align:center}
.eq small{display:block;font:800 17px 'Segoe UI',sans-serif;color:var(--muted)}
.thing{position:absolute;z-index:3;cursor:default}
.cside{position:absolute;right:24px;bottom:150px;z-index:6;display:flex;flex-direction:column;gap:10px}

/* draw */
.dtools{position:absolute;left:14px;top:90px;bottom:14px;width:236px;z-index:7;background:#fffffff2;border-radius:24px;box-shadow:0 6px 0 #0002;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.dtools .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tb{border:0;border-radius:14px;background:#f3ecdf;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 12px 'Segoe UI',sans-serif;padding:2px}
.tb svg{width:44px;height:30px}
.tb[aria-pressed="true"]{background:var(--gold)}
.sw{border:3px solid #fff;border-radius:50%;width:100%;aspect-ratio:1;box-shadow:0 2px 0 #0003}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:1px}
.dtools .lbl{font:800 13px 'Segoe UI',sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
canvas.paper{position:absolute;left:262px;top:88px;width:1164px;height:708px;border-radius:20px;background:#fff;box-shadow:0 6px 18px #0003;z-index:5;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<header>
  <h1>Line Safari <small>Name the lines, find the shapes, mix the colors.</small></h1>
  <button class="icon-btn" id="motion" aria-pressed="true" title="Turn animation on or off">✨ Motion</button>
  <button class="icon-btn" id="sound" aria-pressed="true">🔔 Sound</button>
</header>
<div class="stagewrap" id="stagewrap">
  <div class="scene" id="scene">
    <img class="bg" id="bg" src="art:savanna" alt="">
    <div class="top">
      <div class="tabs" role="group" aria-label="Mode">
        <button data-mode="lines" aria-pressed="true">〰 Lines</button>
        <button data-mode="shapes" aria-pressed="false">🔺 Shapes</button>
        <button data-mode="colors" aria-pressed="false">🎨 Colors</button>
        <button data-mode="draw" aria-pressed="false">✏ Draw</button>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));
  const anim = (el, kf, opt) => { if (reduce || !el || !el.animate) return null; return el.animate(kf, opt); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const SVGNS = 'http://www.w3.org/2000/svg';
  // pointer position in scene coordinates
  const scenePt = e => { const r = $('scene').getBoundingClientRect(), s = r.width / 1440; return [(e.clientX - r.left) / s, (e.clientY - r.top) / s]; };

  // ---------- sound ----------
  let ac = null, soundOn = true;
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').textContent = soundOn ? '🔔 Sound' : '🔕 Sound'; };
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, t0 = 0, d = .3, type = 'triangle', v = .18) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  }
  const tada = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .5));
  const boop = () => { tone(330, 0, .18, 'sine', .2); tone(262, .1, .2, 'sine', .2); };
  const ding = () => tone(880, 0, .35, 'sine', .2);
  // a pencil-scratch sound while a line draws
  function scratch(dur) {
    const c = soundOn && ctx(); if (!c || reduce) return;
    const t = c.currentTime, n = c.createBufferSource(), b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (.5 + .5 * Math.sin(i / c.sampleRate * 40));
    n.buffer = b; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 1.5;
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.05, t + .1); g.gain.setValueAtTime(.05, t + dur - .2); g.gain.linearRampToValueAtTime(.0001, t + dur);
    n.connect(f).connect(g).connect(c.destination); n.start(t);
  }

  // ---------- modes ----------
  let mode = 'lines';
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  function setMode(m) {
    mode = m; lineRun++;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    $('bg').hidden = m === 'draw';
    ({lines: renderLines, shapes: renderShapes, colors: renderColors, draw: renderDraw})[m]();
  }

  // ===== Lines =====
  const pts2d = pts => 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
  const wavy = (() => { const p = []; for (let x = -20; x <= 1460; x += 8) p.push([x, 642 + 20 * Math.sin(x / 120 * Math.PI * 2)]); return pts2d(p); })();
  const spiral = (() => { const p = []; for (let t = 0; t <= Math.PI * 5; t += .08) p.push([1080 + Math.cos(t) * t * 3.1, 724 + Math.sin(t) * t * 3.1]); return pts2d(p); })();
  const loopy = (() => { const p = []; for (let t = 0; t <= Math.PI * 5.5; t += .06) p.push([1040 + 20 * t - 40 * Math.sin(t), 240 - (20 - 40 * Math.cos(t))]); return pts2d(p); })();
  const grass = []; for (let x = 300; x <= 1420; x += 58) if (x < 1030 || x > 1140) grass.push(`M${x} 808 L${x} ${808 - 40 - (x * 37 % 45)}`);
  const rain = []; for (let k = 0; k < 7; k++) rain.push(`M${196 + k * 26} ${214 + (k % 2) * 14} L${170 + k * 26} ${290 + (k % 2) * 14}`);
  const STOPS = [
    {name: 'Horizontal line', paths: ['M0 522 L1440 522'], w: 9, color: '#8a6a32', say: 'It lies down flat, like the ground and the sky meeting far away.', move: 'Lie your arm down flat, side to side. Now be a sleepy horizontal line!'},
    {name: 'Vertical lines', paths: grass, w: 7, color: '#3f8f3a', say: 'They stand up tall, like grass growing straight up.', move: 'Stand up tall and straight like a vertical line. Reach to the sky!'},
    {name: 'Diagonal lines', paths: rain, w: 7, color: '#4a7fb5', say: 'They lean, like rain blowing in the wind, or a slide.', move: 'Lean your body to the side, like a slide. Can you lean the other way?',
      extra: 'M150 206 Q150 160 196 166 Q210 124 258 136 Q292 108 326 140 Q372 140 368 182 Q382 210 344 212 L160 212 Q140 212 150 206 Z'},
    {name: 'Zigzag line', paths: ['M470 522 L560 392 L640 470 L740 332 L840 462 L920 382 L1000 522'], w: 10, color: '#7a55a8', say: 'Up, down, up, down, with sharp points, like mountains!', move: 'Make a zigzag in the air with your finger: up, down, up, down!'},
    {name: 'Curved lines', paths: ['M1010 522 A130 130 0 0 1 1270 522', 'M1036 522 A104 104 0 0 1 1244 522', 'M1062 522 A78 78 0 0 1 1218 522'], w: 12, colors: ['#e8505b', '#f4a52b', '#4a9be0'], say: 'They bend smoothly, with no points at all, like a rainbow.', move: 'Draw a big rainbow over your head with both arms.'},
    {name: 'Wavy line', paths: [wavy], w: 10, color: '#2f7fd0', say: 'It goes up and down, smooth and gentle, like water in a river.', move: 'Make your arm a wavy river. Wiggle it slowly side to side.'},
    {name: 'Spiral line', paths: [spiral], w: 7, color: '#e07a1e', say: 'It curls around and around, like a snail shell.', move: 'Spin your finger in a spiral, from small to big!'},
    {name: 'Loopy line', paths: [loopy], w: 6, color: '#3a3a3a', say: 'It makes loops, like a bird doing loop-the-loops in the sky.', move: 'Fly like a bird and do a loop-the-loop!'},
    {name: 'Dotted line', paths: ['M430 806 Q540 660 790 560'], w: 13, color: '#8a5a2a', dotted: true, say: 'Dot, dot, dot! Little dots in a row, like footprints on the path.', move: 'Tap the dots on your knees: tap, tap, tap!'},
    {name: 'Thick and thin lines', paths: ['M1350 724 L1350 470', 'M1350 580 L1290 514', 'M1350 540 L1408 484', 'M1350 500 L1318 444', 'M1350 474 L1384 430'], ws: [30, 6, 6, 5, 5], color: '#5a3a1a', say: 'The tree trunk is a thick line. The branches are thin lines.', move: 'Make your body thick and wide, then thin and skinny!'},
  ];
  let stop = 0, revealed = false, lineRun = 0;
  function renderLines() {
    $('view').innerHTML = `<svg class="layer" id="lines" viewBox="0 0 1440 810" aria-hidden="true"></svg>
      <canvas class="trace" id="trace" width="1440" height="810" hidden></canvas>
      <img class="zebra" id="zebra" src="art:zebra" alt="Zebra explorer">
      <div class="card" id="card" aria-live="polite"></div>`;
    setupTrace();
    goStop(stop, true);
  }
  function lineEls(i, done) {
    const s = STOPS[i], g = document.createElementNS(SVGNS, 'g'); g.dataset.stop = i;
    if (s.extra) g.insertAdjacentHTML('beforeend', `<path class="ink" d="${s.extra}" stroke="${done ? '#9fb3c8' : '#2e2418'}" stroke-width="5" fill="#ffffffaa"/>`);
    s.paths.forEach((d, k) => {
      const col = done ? (s.colors ? s.colors[k] : s.color) : '#2e2418', w = s.ws ? s.ws[k] : s.w;
      g.insertAdjacentHTML('beforeend', `<path class="ink" d="${d}" stroke="${col}" stroke-width="${w}" ${s.dotted ? 'stroke-dasharray="0 28"' : ''}/>`);
    });
    if (i === 7) g.insertAdjacentHTML('beforeend', `<path class="ink" d="M1400 214 l12 -12 l12 12" stroke="${done ? s.color : '#2e2418'}" stroke-width="6"/>`);
    if (i === 6) g.insertAdjacentHTML('beforeend', `<path class="ink" d="M1032 750 Q1080 760 1130 750 Q1150 742 1146 724" stroke="${done ? '#b0703a' : '#2e2418'}" stroke-width="6"/>`);
    return g;
  }
  async function goStop(i, instant) {
    const run = ++lineRun; stop = Math.max(0, Math.min(STOPS.length, i)); revealed = false; clearTrace();
    const svg = $('lines'); svg.innerHTML = '';
    // lines from earlier stops stay in the picture but fade back, so the new one is the one to look at
    for (let k = 0; k < Math.min(stop, STOPS.length); k++) { const old = lineEls(k, true); if (stop < STOPS.length) old.classList.add('old'); svg.appendChild(old); }
    if (stop >= STOPS.length) return finale();
    drawCard();
    const glow = document.createElementNS(SVGNS, 'g'); glow.classList.add('glow'); svg.appendChild(glow);
    const g = lineEls(stop, false); svg.appendChild(g);
    if (reduce) return highlight(glow, g, run, true);
    // draw the new line stroke by stroke
    const paths = [...g.querySelectorAll('path')]; paths.forEach(p => p.style.opacity = 0);
    await wait(instant ? 300 : 150); if (run !== lineRun) return;
    scratch(Math.min(4, paths.length * .5 + 1.6));
    for (const p of paths) {
      if (run !== lineRun) return;
      const len = p.getTotalLength(), dash = p.getAttribute('stroke-dasharray');
      p.style.opacity = 1;
      const dur = Math.min(2200, 500 + len * 1.4) / Math.max(1, paths.length / 3);
      if (dash) {
        // dotted: the dots appear one at a time along the path, like footprints
        p.style.opacity = 0; const step = 28, n = Math.floor(len / step), ws = +p.getAttribute('stroke-width');
        for (let k = 0; k <= n; k++) {
          if (run !== lineRun) return;
          const q = p.getPointAtLength(k * step), c = document.createElementNS(SVGNS, 'circle');
          c.setAttribute('cx', q.x); c.setAttribute('cy', q.y); c.setAttribute('r', ws / 2); c.setAttribute('fill', '#2e2418'); c.classList.add('tmpdot'); g.appendChild(c);
          await wait(dur / n);
        }
        g.querySelectorAll('.tmpdot').forEach(c => c.remove()); p.style.opacity = 1;
      } else {
        p.style.strokeDasharray = `${len} ${len}`; p.style.strokeDashoffset = len;
        const a = p.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: dur, easing: 'ease-in-out', fill: 'forwards'});
        await Promise.race([a.finished, wait(dur + 200)]);
        p.style.strokeDashoffset = 0;
      }
    }
    highlight(glow, g, run);
  }
  // A soft yellow glow behind the new line that pulses a few times (or just stays, with motion off).
  async function highlight(glow, g, run, still) {
    if (run !== lineRun) return;
    glow.innerHTML = [...g.querySelectorAll('path')].map(p => `<path d="${p.getAttribute('d')}" stroke="#fff26a" stroke-width="${+p.getAttribute('stroke-width') + 26}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`).join('');
    if (still) { glow.style.opacity = .75; return; }
    const a = glow.animate([{opacity: 0}, {opacity: .9}, {opacity: .25}, {opacity: .9}, {opacity: .25}, {opacity: .9}, {opacity: .6}], {duration: 2200, easing: 'ease-in-out', fill: 'forwards'});
    await Promise.race([a.finished, wait(2400)]);
    if (run === lineRun) glow.style.opacity = .6;
  }
  function drawCard() {
    const s = STOPS[stop];
    const dots = STOPS.map((_, k) => `<i class="${k === stop ? 'on' : k < stop ? 'done' : ''}"></i>`).join('');
    $('card').innerHTML = `<div class="stop">Stop ${stop + 1} of ${STOPS.length} ${dots}</div>` + (revealed
      ? `<h2 style="color:${s.colors ? s.colors[0] : s.color}">${s.name}</h2><p>${s.say}</p><p class="move">🤸 ${s.move}</p>`
      : s.paths.length > 1 ? `<h2>What lines are these?</h2><p>Watch them draw. Can you name them?</p>`
      : `<h2>What kind of line is this?</h2><p>Watch it draw. Can you name it?</p>`) +
      `<div class="btns">${stop ? '<button class="big" id="prev">◀</button>' : ''}${revealed ? '' : '<button class="big or" id="reveal">✨ Name it!</button>'}<button class="big" id="drawalong" aria-pressed="${!$('trace').hidden}">✏ Draw along</button><button class="big go" id="next">${stop === STOPS.length - 1 ? 'Finish 🎉' : 'Next stop ▶'}</button></div>`;
    $('prev') && ($('prev').onclick = () => goStop(stop - 1));

          s.brush === 'circle' ? `M${x0 + r} ${y0} A${r} ${r} 0 1 0 ${x0 - r} ${y0} A${r} ${r} 0 1 0 ${x0 + r} ${y0}Z`

      }

  }

  setMode('lines');
  window.__ls = {setMode, goStop, reveal, STOPS, pickPot, startHide, get target() { return target; }, tapShapeIdx: i => tapShape(document.querySelector(`.shape[data-i="${i}"]`)), setTarget: k => document.querySelector(`[data-k="${k}"]`).click(),

})();
