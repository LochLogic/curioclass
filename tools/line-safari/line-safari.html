LINE SAFARI (Curio Class)
Visual arts, grades K-2, National Core Arts Standards VA:Cr1 (explore and imagine with art materials) and VA:Cr2
(experiment with materials), module "Lines, Shapes and Colors": the elements of art, primary and secondary colors.
Lines: ten stops. A line draws itself into the picture, the class names it, then moves it with their bodies and
the teacher draws along on the board. By the end the whole savanna is made of lines.
Shapes: a cut-paper safari camp made of circles, squares, triangles, rectangles, ovals, a diamond, stars and a
heart. Pick a shape and find every one.
Colors: red, yellow and blue paint. Mix two primaries to make a secondary color and turn the chameleon that
color, then help it hide on something the same color.
Draw: line brushes (straight, curvy, zigzag, wavy, dotted, spiral) and shape stamps.

  const $ = id => document.getElementById(id);

  try { const m = localStorage.getItem('curio-motion'); if (m) reduce = m === 'calm'; } catch {}
  function showMotion() {
    document.body.classList.toggle('calm', reduce);
    $('motion').setAttribute('aria-pressed', !reduce);
    $('motion').textContent = reduce ? '⏸ Motion' : '✨ Motion';
  }
  showMotion();
  $('motion').onclick = () => { reduce = !reduce; try { localStorage.setItem('curio-motion', reduce ? 'calm' : 'on'); } catch {} showMotion(); };
  const fit = () => { const r = $('stagewrap').getBoundingClientRect(); $('scene').style.setProperty('--s', Math.min(r.width / 1440, r.height / 810)); };
  new ResizeObserver(fit).observe($('stagewrap'));
  const anim = (el, kf, opt) => { if (reduce || !el || !el.animate) return null; return el.animate(kf, opt); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const SVGNS = 'http://www.w3.org/2000/svg';
  // pointer position in scene coordinates
  const scenePt = e => { const r = $('scene').getBoundingClientRect(), s = r.width / 1440; return [(e.clientX - r.left) / s, (e.clientY - r.top) / s]; };

  // ---------- sound ----------
  let ac = null, soundOn = true;
  $('sound').onclick = () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').textContent = soundOn ? '🔔 Sound' : '🔕 Sound'; };
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, t0 = 0, d = .3, type = 'triangle', v = .18) {
    const c = soundOn && ctx(); if (!c) return;
    const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .05);
  }
  const tada = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .5));

        for (let i = 1; i < P.length - 1; i++) g.quadraticCurveTo(...P[i], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
        g.lineTo(...P[P.length - 1]); g.stroke(); if (P.length === 1) { g.beginPath(); g.arc(x0, y0, g.lineWidth / 2, 0, 7); g.fill(); } break;
      case 'zigzag': { const st = 14 + s.size, q = resample(P, st), amp = 10 + s.size; line(q.map((p, i) => { const n = norm(q[Math.max(0, i - 1)], q[Math.min(q.length - 1, i + 1)]), k = i % 2 ? amp : -amp; return [p[0] + n[0] * k, p[1] + n[1] * k]; })); break; }
      case 'wavy': { const q = resample(P, 4), amp = 8 + s.size * .8, wl = 40 + s.size * 2; line(q.map((p, i) => { const n = norm(q[Math.max(0, i - 1)], q[Math.min(q.length - 1, i + 1)]), k = amp * Math.sin(i * 4 / wl * Math.PI * 2); return [p[0] + n[0] * k, p[1] + n[1] * k]; })); break; }
      case 'dotted': resample(P, s.size * 3).forEach(p => { g.beginPath(); g.arc(...p, s.size * .7, 0, 7); g.fill(); }); break;
      case 'spiral': { const pts = [], turns = 3.5; for (let t = 0; t <= turns * Math.PI * 2; t += .1) { const r = R * t / (turns * Math.PI * 2); pts.push([x0 + Math.cos(t) * r, y0 + Math.sin(t) * r]); } line(pts); break; }
      default: { // shape stamps: drag out from the middle
        const r = Math.max(14, R), path = new Path2D(
          s.brush === 'circle' ? `M${x0 + r} ${y0} A${r} ${r} 0 1 0 ${x0 - r} ${y0} A${r} ${r} 0 1 0 ${x0 + r} ${y0}Z`
          : s.brush === 'square' ? `M${x0 - r} ${y0 - r} h${2 * r} v${2 * r} h${-2 * r}Z`
          : s.brush === 'triangle' ? `M${x0} ${y0 - r} L${x0 + r * .95} ${y0 + r * .7} L${x0 - r * .95} ${y0 + r * .7}Z`
          : s.brush === 'star' ? star(x0, y0, r) : heart(x0, y0, r * .8));
        g.globalAlpha = .9; g.fill(path); g.globalAlpha = 1; g.lineWidth = 3; g.strokeStyle = '#0003'; g.stroke(path);
      }
    }
    g.restore();
  }

  setMode('lines');
  window.__ls = {setMode, goStop, reveal, STOPS, pickPot, startHide, get target() { return target; }, tapShapeIdx: i => tapShape(document.querySelector(`.shape[data-i="${i}"]`)), setTarget: k => document.querySelector(`[data-k="${k}"]`).click(),
    addStroke: (b, pts, c = '#2a6fd6', z = 8) => { strokes.push({brush: b, color: c, size: z, pts}); paint(); }, set hideGoal(v) { hideGoal = v; }};
})();
