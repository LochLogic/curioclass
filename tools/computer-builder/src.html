<title>Computer Builder · Every part has a power · Curio Class</title>
<meta name="description" content="Put computer parts on the desk and see each part's power: the screen lights up, the speakers sing. Give the computer jobs, then find the part Nibbles the mouse unplugged. Grade 1 computer science. Works offline.">
<!--
Computer Builder (Curio Class)
Grade 1, computer science, module Parts of a Computer (Systems and Security). CSTA K-12 Computer Science Standards,
2026 identifier E1-SYS-HW-11 (E1-SYS-SE-12, keeping accounts safe, is left to another tool); 2017 crosswalk 1A-CS-01,
1A-CS-02, 1A-CS-03.
Teacher led on a projector or smartboard; the class answers out loud. K-1 reads nothing: every control has a picture,
every fixed line is spoken, targets are at least 60 px.
Build: tap a part to put it on the desk, tap it there to see its power; seven parts unlock All in one (laptop, tablet).
Jobs: pick a job, put the parts it needs on the desk, press Try it. Missing: Nibbles unplugs one part; the class
works out which one from what the computer can't do.
Facts: GCFGlobal Computer Basics (basic parts, inside a computer, laptops, mobile devices); Code.org CS Fundamentals
glossary (hardware, input, output); Smithsonian's National Zoo (giant pandas eat bamboo). Sources in notes.md.
Parts, cables, desk, screens, job pictures, laptop and tablet are drawn in code; sounds are made in the browser.
One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->
<link rel="stylesheet" href="kit:curio">
<style>
:root{
  --paper:#f4f6fd;--ink:#1c2340;--muted:#55607f;--line:#cfd8f6;--focus:#c2410c;
  --brand:#2049b8;--btn:#ffffff;--btn-line:#cfd8f6;--head-ink:#ffffff;--panel:#ffffff;
  --wall:#e9eefb;--wood:#d9a86c;--edge:#b8834a;--glow:#ffd23f;--in:#08606a;--out:#9a3209;--ghost:#454e6e;--go:#17703d;
}
/* Page layouts, picked in script (relayout()):
   side    landscape boxes: stage left, panel right (360-400 px tall screens, 340 px under 900 px tall, a narrow
           icon panel in the 16:10 preview, where the hint becomes a caption on the stage).
   stack   narrow or portrait: stage on top, then the buttons, job cards and shelf; the page scrolls.
   The panel comes first in the page so Tab reaches its buttons before the parts on the desk.
   The stage SVG is drawn at its real pixel size and laid out again for every size. */
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 3px #fff}
body{height:100%;overflow:hidden}
body.stack{height:auto;overflow:auto}
header{gap:10px}
.i{width:26px;height:26px;flex:none;display:block}
.seg button{display:inline-flex;align-items:center;gap:8px;min-height:60px;padding:0 18px;color:var(--ink)}
.seg button+button{border-left:2px solid var(--btn-line)}
.icon-btn{min-height:60px;color:var(--ink)}
main{grid-template-columns:minmax(0,1fr) var(--pw,360px);grid-template-areas:"stage panel";min-height:0;overflow:hidden}
.stage{grid-area:stage;min-height:0;background:var(--wall)}
#sv{position:absolute;left:0;top:0;display:block;font-family:'Trebuchet MS','Segoe UI',sans-serif}
#hits{position:absolute;inset:0;pointer-events:none;z-index:2}
.hit{position:absolute;pointer-events:auto;background:transparent;border:0;border-radius:14px;padding:0;touch-action:none;cursor:pointer}
.hit[hidden]{display:none}
.hit:focus-visible{outline:4px solid var(--focus);outline-offset:0;box-shadow:0 0 0 3px #fff,inset 0 0 0 3px #fff}
.spot{position:absolute;pointer-events:auto;border-radius:50%;border:4px solid #fff;background:#2049b830;box-shadow:0 0 0 3px var(--brand);padding:0;cursor:pointer;
  animation:spot 1.8s ease-in-out infinite}
.spot::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--brand)}
.spot[aria-pressed="true"]{background:#ffd23f80;box-shadow:0 0 0 4px var(--ink)}
@keyframes spot{50%{transform:scale(1.1);box-shadow:0 0 0 7px #2049b855}}
.panel{grid-area:panel;gap:10px;padding:12px 14px}
body.stack main{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "panel";grid-template-rows:auto auto;align-content:start;overflow:visible}
body.stack .panel{border-left:0;border-top:3px solid var(--line);overflow:visible}
.hint{margin:0;min-height:2.9em;font-weight:600}
.stage .hint{position:absolute;left:8px;right:8px;top:6px;z-index:3;margin:0;min-height:0;padding:4px 10px;border-radius:10px;background:#1c2340e6;
  color:#fff;font-size:15px;line-height:1.3;text-align:center;pointer-events:none}
body.compact .stage .hint{font-size:13px;padding:3px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* panel buttons */
.row{display:flex;gap:8px}
.bb{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:0;border-radius:16px;padding:0 12px;
  font:800 21px/1.05 'Trebuchet MS','Segoe UI',sans-serif;box-shadow:0 5px 0 #0003;text-align:center}
.bb .i{width:30px;height:30px}
.bb.light{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 #1c234022}
.bb.light .i{color:var(--brand)}
#try{background:var(--go);color:#fff;flex:1.4 1 0}
#try:disabled{background:#cfe1d6;color:#4d6457;box-shadow:none;cursor:default}
#start{background:var(--brand);color:#fff}
#start:disabled{background:#d5dcf2;color:var(--muted);box-shadow:none;cursor:default}
#aio{background:var(--brand);color:#fff;position:relative}
#aio:disabled{background:#e3e8f6;color:var(--muted);box-shadow:none;cursor:default}
#aio .lock{display:none}
#aio:disabled .lock{display:block;position:absolute;right:6px;top:6px;width:20px;height:20px}
#aio.unlock{animation:unl 1s ease 1}
@keyframes unl{35%{transform:scale(1.08);box-shadow:0 0 0 8px var(--glow),0 5px 0 #0003}}
.kind{display:flex;border:3px solid var(--line);border-radius:16px;overflow:hidden;flex:2 1 0}
.kind button{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border:0;background:#fff;
  font:800 19px 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);padding:0 8px}
.kind button+button{border-left:3px solid var(--line)}
.kind button .i{color:var(--brand)}
.kind button[aria-pressed="true"]{background:var(--brand);color:#fff}
.kind button[aria-pressed="true"] .i{color:#fff}
#aioRow{flex-wrap:wrap}
#aioRow .kind,#aioRow #back{flex:1 1 100%}

/* the shelf */
.shelf{display:grid;grid-template-columns:repeat(var(--sc,2),minmax(0,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--th,100px);border:2px solid var(--line);
  border-bottom:6px solid #b9c5ee;border-radius:14px;background:#fff;padding:5px 4px 3px;font:700 var(--tf,15px)/1.05 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);min-width:0}
.tile .pic{flex:1 1 0;min-height:0;width:100%;display:block}
.tile .w{flex:none;white-space:nowrap}
.tile .on{flex:none;font:700 12px/1 'Segoe UI',sans-serif;color:var(--go);display:none}
.tile[aria-pressed="true"]{background:#eef7f1;border-color:#9fd0b2;border-bottom-color:var(--go)}
.tile[aria-pressed="true"] .pic{opacity:.55}
.tile[aria-pressed="true"] .on{display:block}
.tile:disabled{cursor:default;opacity:.6}
.chk{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--go);color:#fff;display:none;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px #fff}
.chk svg{width:18px;height:18px}
.tile[aria-pressed="true"] .chk,.job.done .chk{display:flex}
body.nonames .tile .w,body.nonames .tile .on{display:none}

/* job cards */
.jobs{display:grid;grid-template-columns:repeat(var(--cc,2),minmax(0,1fr));gap:8px}
.job{position:relative;height:var(--ch,86px);border:3px solid var(--line);border-radius:14px;background:#fff;padding:4px;display:flex;align-items:center;justify-content:center;min-width:0}
.job svg.pic{width:100%;height:100%;max-width:110px}
.job[aria-pressed="true"]{border-color:var(--brand);background:#e7edfc;box-shadow:0 0 0 3px #2049b855}
.job:disabled{cursor:default}

/* Missing: the round marker */
.plugs{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.plugs svg{width:32px;height:32px;color:#b5c0e3}
.plugs svg.done{color:var(--brand)}
.plugs svg.cur{background:#fff3c4;border-radius:50%;box-shadow:0 0 0 3px var(--glow)}

/* stage overlays */
.banner{position:absolute;left:50%;top:var(--bt,10px);transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;background:#fff;
  border:4px solid var(--brand);border-radius:18px;padding:3px 16px 3px 6px;font:800 var(--bf,22px)/1.1 'Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);
  box-shadow:0 6px 16px #1c234033;white-space:nowrap;pointer-events:none}
.banner svg{height:var(--bh,50px);width:calc(var(--bh,50px)*1.333);flex:none}
.banner.mini{left:6px;transform:none;padding:3px;border-radius:14px}
.banner.mini span{display:none}
.banner.pop{animation:grow .45s ease-out}
.banner.mini.pop{animation:growm .45s ease-out}
@keyframes grow{0%{transform:translateX(-50%) scale(.3);opacity:0}}
@keyframes growm{0%{transform:scale(.3);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.ghost{fill:#ffffff55;stroke:var(--ghost);stroke-dasharray:9 7;stroke-width:3.2}
.ghost.pulse{stroke:var(--brand);stroke-dasharray:none;stroke-width:6;fill:#2049b822;animation:gp .8s ease-in-out 3}
@keyframes gp{50%{stroke-width:11;fill:#2049b855}}

/* short side boxes (1280x720, 1366x768) and the 16:10 preview */
body.compact header{padding:4px 8px;gap:5px;flex-wrap:nowrap;min-width:0}
body.compact h1{font-size:17px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
body.compact h1 small{display:none}
body.compact .seg{flex:none}
body.compact .seg button,body.compact .icon-btn{min-height:44px;padding:0 9px;font-size:13.5px;white-space:nowrap;gap:5px}
body.compact .seg .i{width:20px;height:20px}
body.compact .icon-btn{flex:none}
body.compact .panel{padding:6px 8px;gap:6px}
body.compact .bb{min-height:46px;font-size:17px;border-radius:12px;gap:6px;padding:0 6px}
body.compact .bb .i{width:24px;height:24px}
body.compact .kind button{min-height:46px;font-size:15px}
body.compact .plugs svg{width:24px;height:24px}
body.compact .tile{border-bottom-width:4px;border-radius:10px;padding:3px}
body.compact .chk{width:20px;height:20px;right:2px;top:2px}
body.compact .chk svg{width:14px;height:14px}
body.compact .job{border-radius:10px;padding:2px}
/* stack: phones and portrait windows */
@media (max-width:560px){
  .seg{display:grid;grid-template-columns:repeat(3,1fr);border-radius:16px;width:100%}
  .seg button{padding:0 6px;justify-content:center;font-size:16px}
  .icon-btn{padding:0 12px;font-size:15px;flex:1 1 0}
  .bb{font-size:19px}
  .kind{flex:1 1 100%}
}
/* short phones (375 x 667): Motion, Sound and Read shrink to their icons beside the title, so the Jobs shelf fits */
@media (max-width:560px) and (max-height:740px){
  header{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;padding:6px 8px}
  h1{font-size:17px;align-self:center}
  header .seg{grid-column:1/-1;grid-row:2}
  header .icon-btn{width:48px;min-width:48px;flex:none;padding:0 0 0 13px;overflow:hidden;white-space:nowrap;text-align:left;font-size:18px;word-spacing:80px}
  .panel{gap:6px;padding:8px 10px}
  .bb{min-height:60px}
}
/* narrow tiles: a small check on the corner, so the part picture stays clear */
body.stack .chk,body.nonames .chk{width:20px;height:20px;right:-6px;top:-6px;z-index:1}
body.stack .chk svg,body.nonames .chk svg{width:13px;height:13px}
body.stack .tile[aria-pressed="true"] .pic,body.nonames .tile[aria-pressed="true"] .pic{opacity:.8}
</style>
</head>

    else if (a.classList.contains('tile') || a.classList.contains('job')) t = jobEls[state.job];

    else if (a.classList.contains('spot')) t = first('#hits .spot');

    if (live(t)) t.focus();
  }

  // ======================================================================================
  // Modes and layout
  // ======================================================================================
  function setMode(m) {
    stopAll();
    state.mode = m; state.aio = false; state.morph = null; state.spot = null; state.xray = false; state.popkb = false;
    state.success = false; state.dim.clear(); state.pulse = null;
    for (const k of ['build', 'jobs', 'missing']) $('m-' + k).setAttribute('aria-pressed', k === m);
    if (m === 'build') state.built.allSaid = false;

    if (m === 'missing') {

      const mi = state.mis; mi.out = null;

    state.kb = {i: 0, text: '', real: false};
    document.body.dataset.mode = m;
    setHint(L.w[m]);

  }
  for (const k of ['build', 'jobs', 'missing']) $('m-' + k).onclick = () => { if (state.mode !== k || state.aio) setMode(k); };

  const lay = {};
  let lastKey = '', capH = 0;
  const CAPS = () => [...Object.values(L.w), L.aioHint, L.noBox, L.noScreen, L.noSpeakers, L.spot.touchscreen, L.ok[5], L.ok[0], L.sym.mouse, L.job[5], L.allFixed, ...Object.values(L.how)];
  function captionHeight() {
    const h = $('hint'), keep = h.textContent;
    let mx = 0;
    for (const t of CAPS()) { h.textContent = t; mx = Math.max(mx, h.offsetHeight); }
    h.textContent = keep;
    return mx;
  }
  function fitPanel() {
    const P = $('panel'), stack = lay.stack;
    const cands = stack ? [{sc: 4, th: 76, cc: 3, ch: 68}, {sc: 4, th: 68, cc: 3, ch: 62}, {sc: 4, th: 62, cc: 3, ch: 60}]
      : [{sc: 2, th: 112, cc: 2, ch: 92}, {sc: 3, th: 100, cc: 3, ch: 84}, {sc: 3, th: 86, cc: 3, ch: 74}, {sc: 3, th: 72, cc: 3, ch: 64},
        {sc: 4, th: 64, cc: 3, ch: 60}, {sc: 4, th: 56, cc: 3, ch: 54}, {sc: 4, th: 50, cc: 3, ch: 48}, {sc: 4, th: 44, cc: 3, ch: 44}];
    for (const c of cands) {
      P.style.setProperty('--sc', c.sc); P.style.setProperty('--th', c.th + 'px'); P.style.setProperty('--cc', c.cc); P.style.setProperty('--ch', c.ch + 'px');
      const tw = tileEls.box.offsetWidth || 100;
      document.body.classList.toggle('nonames', c.th < 64 || tw < 76);
      P.style.setProperty('--tf', clamp(tw / 7.4, 11.5, 16).toFixed(1) + 'px');
      if (stack) { if ($('hdr').offsetHeight + P.offsetHeight + (innerHeight < 740 ? 178 : 240) <= innerHeight) break; continue; }
      if (P.scrollHeight <= P.clientHeight + 1) break;
    }
  }
  function relayout(force) {
    const w = innerWidth, h = innerHeight, ratio = w / h, b = document.body;
    const side = (w >= 760 && ratio >= 1.1) || (w >= 600 && ratio >= 1.25);
    const compact = side && h < 700 && !(w >= 1100 && h >= 560), short = side && !compact && h < 900;
    Object.assign(lay, {side, stack: !side, compact, short});
    b.classList.toggle('side', side); b.classList.toggle('stack', !side); b.classList.toggle('compact', compact); b.classList.toggle('short', short);
    const pw = !side ? 0 : compact ? clamp(Math.round(w * .34), 236, 330) : short ? 340 : (w >= 1500 ? 400 : 360);
    $('main').style.setProperty('--pw', pw + 'px');
    // the hint: in the panel on roomy screens, a caption on the stage in the preview and on phones
    const hint = $('hint'), panel = $('panel');
    if (side && !compact) { if (hint.parentNode !== panel) panel.insertBefore(hint, panel.firstChild); }
    else if (hint.parentNode !== $('stage')) $('stage').appendChild(hint);
    const st = $('stage');
    st.style.height = '';
    fitPanel();
    if (!side) {
      const hdr = $('hdr').offsetHeight, need = panel.offsetHeight;
      const smin = h < 740 ? 178 : 240;
      st.style.height = Math.round(clamp(h - hdr - need, smin, Math.max(smin, w * .82))) + 'px';
    }
    const r = st.getBoundingClientRect(), W = Math.max(240, Math.round(r.width)), H = Math.max(180, Math.round(r.height));
    capH = side && !compact ? 0 : captionHeight();
    // the job banner: across the top on roomy screens, a small picture badge under the caption otherwise
    const bn = $('banner'), mini = !side || compact;
    bn.classList.toggle('mini', mini);
    const bh = mini ? 40 : clamp(Math.round(H * .075), 40, 64);
    bn.style.setProperty('--bh', bh + 'px'); bn.style.setProperty('--bf', Math.round(clamp(bh * .44, 16, 28)) + 'px');
    bn.style.setProperty('--bt', (capH ? capH + 10 : 10) + 'px');
    const jobsTop = state.mode === 'jobs' && state.job != null && !mini ? bh + 26 : 0;
    const top = capH + 6 + jobsTop, dTop = state.aio ? 92 : 150;
    // the laptop and tablet get their own, larger scale: they only need the middle of the desk
    const k = state.aio ? Math.min(W / 660, (H - top - 10) / 460) : Math.min(W / 940, H / 640, (H - top) / (640 - dTop));
    const key = [W, H, k.toFixed(4), state.mode, state.aio].join('x');
    if (key === lastKey && !force) return;
    lastKey = key;
    Object.assign(G, {W, H, k, ox: state.aio ? W / 2 - 465 * k : (W - 930 * k) / 2, oy: state.aio ? H - 10 - 550 * k : H - 640 * k});
    buildStatic();
  }
  buildPanel();
  makeHits();
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());

  // ======================================================================================
  // Wiring
  // ======================================================================================
  $('try').onclick = tryIt;
  $('nextJob').onclick = nextJob;
  $('start').onclick = startRound;
  $('clear').onclick = clearDesk;
  $('aio').onclick = enterAio;
  $('back').onclick = backToDesk;
  $('k-laptop').onclick = () => setKind('laptop');
  $('k-tablet').onclick = () => setKind('tablet');
  Curio.onSound(on => { if (!on) hush(); else if (tapped) welcome(); });
  Curio.onMotion(() => { relayout(true); });
  Curio.init({clips: "voice:*", rate: .95, readFallback: () => $('hint').textContent});
  $('read').onclick = readNow;

  // preview.svg for the site card: the desk at 640 x 400 with a few parts placed and the keyboard's cable lit
  function previewSVG() {
    const keepG = {...G}, keepPlaced = [...state.placed], keepScr = state.scr, keepAio = state.aio;
    noArt = true; state.aio = false; state.morph = null;
    state.placed.clear(); ['box', 'screen', 'keyboard', 'mouse', 'speakers'].forEach(p => state.placed.add(p));
    const W = 640, H = 400, k = Math.min(W / 940, H / 610);

    glow('keyboard', true);
    const c = S.cab.keyboard[0], len = c.getTotalLength();
    for (const q of [.22, .5, .78]) { const pt = c.getPointAtLength(len * q), d = dotEl('in'); d.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`); }

    S.ghostL.querySelectorAll('.ghost').forEach(g => Object.entries({fill: '#ffffff55', stroke: C.ghost, 'stroke-dasharray': '9 7', 'stroke-width': 3.2}).forEach(([n, v]) => g.setAttribute(n, v)));
    const out = sv.outerHTML.replace('<svg id="sv" aria-hidden="true"', '<svg xmlns="http://www.w3.org/2000/svg" font-family="Trebuchet MS, Segoe UI, sans-serif"');
    noArt = false; state.aio = keepAio; state.placed.clear(); keepPlaced.forEach(p => state.placed.add(p)); state.scr = keepScr;

  }
  window.__tool = {previewSVG, state, setMode, allLines, vlog, L, JOBS, ROUNDS, G, lay, relayout, tryPart, placePart, removePart, pickJob, tryIt, startRound,
    enterAio, backToDesk, setKind, spotTap, missingTap, hush, get tapped() { return tapped; }, get vq() { return vq.map(q => q.text); }};
  setMode('build');
})();
