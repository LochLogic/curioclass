<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Neon pucks on a glowing arcade table. Play six computer rivals, a friend, or 25 short puzzles.">
    <title>Checkers | Curio Class Recess</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="kit:recess">
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
      }
      body.recess {
        --rc-accent: #ffa51f;
        --rc-accent-ink: #2b1600;
        --rc-glass: #0b1033df;
        margin: 0;
        color: #f4f6ff;
        background: #070a22 url('art:arcade') center / cover fixed;
        overflow: hidden;
        background-position: calc(50% + var(--arcade-x, 0px)) center;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: linear-gradient(90deg, #070a2230, #070a2260 45%, #070a2230);
        pointer-events: none;
      }
      button,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #7cffb2;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .rc-arr {
        height: 44px;
      }
      .screen {
        position: relative;
        height: 100dvh;
        padding: 76px 32px 24px;
      }
      .eyebrow {
        color: #7cffb2;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      .marquee {
        max-width: 1260px;
        margin: auto;
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        align-items: center;
        gap: 38px;
      }
      .hero {
        position: relative;
        height: min(77vh, 650px);
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid #8181ff80;
      }
      .hero > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
      }
      .hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, #070a22ed, transparent 60%);
      }
      .hero-copy {
        position: absolute;
        bottom: 30px;
        left: 30px;
        right: 24px;
        z-index: 1;
      }
      .hero h1 {
        margin-top: 14px;
        font-size: clamp(48px, 7.8vw, 108px);
        font-weight: 950;
        line-height: 0.94;
        letter-spacing: -0.055em;
      }
      .hero h1 span {
        color: #ffa51f;
        text-shadow: 0 0 30px #ffa51f60;
      }
      .hero-copy p {
        margin-top: 18px;
        color: #e0e5ff;
        font-size: 18px;
      }
      .menu-panel {
        max-width: 470px;
        width: 100%;
      }
      .menu-panel h2 {
        font-size: clamp(25px, 3vw, 42px);
        margin: 10px 0 22px;
        letter-spacing: -0.035em;
      }
      .menu-stack {
        display: grid;
        gap: 12px;
      }
      .action {
        min-height: 54px;
        padding: 13px 19px;
        color: #f4f6ff;
        text-align: left;
        background: #101637eb;
        border: 1px solid #707de08c;
        border-radius: 13px;
        font-weight: 750;
        transition:
          border-color 0.15s,
          transform 0.15s,
          box-shadow 0.15s;
      }
      .action:hover {
        border-color: #7cffb2;
        box-shadow: 0 0 25px #546eff2b;
        transform: translateY(-2px);
      }
      .action.primary {
        background: #ffa51f;
        border-color: #ffdc86;
        color: #2b1600;
        box-shadow:
          0 5px 0 #9a4d0b,
          0 0 32px #ffa51f25;
      }
      .action small {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-top: 4px;
        color: #aeb6e8;
      }
      .action.primary small {
        color: #472800;
      }
      .action .arr {
        float: right;
        font-size: 24px;
        line-height: 1;
      }
      .minor-row {
        display: flex;
        gap: 10px;
      }
      .minor-row > * {
        flex: 1;
      }
      .privacy {
        color: #aeb6e8;
        font-size: 12px;
        margin-top: 20px;
        line-height: 1.5;
      }
      .ladder {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .opponent {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 9px;
        align-items: center;
        padding: 8px;
        min-height: 87px;
      }
      .opponent img {
        width: 52px;
        height: 58px;
        object-fit: contain;
      }
      .opponent b {
        font-size: 17px;
      }
      .bulbs {
        display: flex;
        gap: 4px;
        margin: 6px 0 4px;
      }
      .bulbs i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #606685;
      }
      .bulbs i.on {
        background: #ffa51f;
        box-shadow: 0 0 6px #ffa51f;
      }
      .opponent small {
        font-size: 11px;
        line-height: 1.2;
        margin-top: 0;
      }
      .choice-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
      }
      select {
        min-height: 44px;
        padding: 8px 14px;
        border-radius: 9px;
        color: #f4f6ff;
        background: #151a4a;
        border: 1px solid #7d89d6;
      }
      .arena {
        display: grid;
        grid-template-columns: minmax(150px, 215px) minmax(0, 675px) minmax(180px, 215px);
        gap: 22px;
        max-width: 1220px;
        margin: auto;
        align-items: center;
        justify-content: center;
      }
      .side {
        position: relative;
        padding: 20px 16px;
        background: #0a1035e8;
        border: 1px solid #636bc075;
        border-radius: 18px;
      }
      .badge {
        display: block;
        width: 148px;
        height: 155px;
        object-fit: contain;
        margin: -12px auto 8px;
        filter: drop-shadow(0 0 20px #418bff35);
      }
      .side h2 {
        font-size: 28px;
        letter-spacing: -0.025em;
      }
      .side .eyebrow {
        font-size: 10px;
        margin-bottom: 8px;
      }
      .side p {
        color: #aeb6e8;
        line-height: 1.5;
        font-size: 13px;
        margin-top: 8px;
      }
      .player-name {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .side-mark {
        width: 13px;
        height: 13px;
        background: #ffa51f;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 15px #ffa51f60;
      }
      .side-mark.blue {
        background: none;
        border: 3px solid #51c7ff;
        box-shadow: 0 0 15px #51c7ff60;
      }
      .tray {
        min-height: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        margin-top: 12px;
      }
      .tray img {
        width: 27px;
        height: 29px;
        object-fit: contain;
        margin-right: -5px;
      }
      .prompt {
        margin: 18px 0;
        padding: 15px 12px;
        border-left: 2px solid #7cffb2;
        background: #151a4a90;
        border-radius: 0 10px 10px 0;
      }
      .prompt p {
        color: #f4f6ff;
        margin: 0;
        font-size: 15px;
        line-height: 1.45;
      }
      .side-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .side-actions .action {
        padding: 10px;
        text-align: center;
        min-height: 44px;
        font-size: 13px;
      }
      .side-actions .wide {
        grid-column: 1 / -1;
      }
      .board-wrap {
        width: min(100%, calc(100dvh - 114px));
        position: relative;
        justify-self: center;
      }
      .board-surface {
        aspect-ratio: 1;
        background: url('art:board') center / 100% 100%;
        position: relative;
        border-radius: 2%;
        box-shadow:
          0 25px 75px #0009,
          0 0 35px #6967ff38;
      }
      .grid {
        position: absolute;
        inset: 5.6%;
        touch-action: none;
      }
      .square {
        clip-path: circle(50%);
        position: absolute;
        width: max(12.5%, 44px);
        height: max(12.5%, 44px);
        margin-left: min(0px, calc((12.5% - 44px) / 2));
        margin-top: min(0px, calc((12.5% - 44px) / 2));
        border: 0;
        padding: 0;
        background: transparent;
        -webkit-tap-highlight-color: transparent;
      }
      .square:focus-visible {
        outline: none;
      }
      .puck {
        position: absolute;
        width: 94%;
        height: 94%;
        left: 3%;
        top: 1%;
        object-fit: contain;
        pointer-events: none;
      }
      .square .halo {
        width: 120%;
        height: 100%;
        left: -10%;
        top: 9%;
        opacity: 0.35;
      }
      .square.selected .puck:not(.halo) {
        transform: scale(1.08) translateY(-4%);
        filter: brightness(1.15) drop-shadow(0 0 9px #7cffb2a0);
      }
      .square.must::after,
      .square.selected::after,
      .square.clue::after,
      .square:focus-visible::after {
        content: '';
        position: absolute;
        inset: 7%;
        border-radius: 50%;
        border: 2px solid #ff5fd2;
        box-shadow: 0 0 12px #ff5fd2b0;
        pointer-events: none;
      }
      .square.must::after {
        animation: must 1.2s ease-in-out infinite;
      }
      .square.selected::after,
      .square.clue::after,
      .square:focus-visible::after {
        border-color: #7cffb2;
        box-shadow: 0 0 14px #7cffb280;
      }
      .square:focus-visible::after {
        animation: none;
      }
      .square.legal::before {
        content: '';
        position: absolute;
        inset: 40%;
        border-radius: 50%;
        background: #7cffb2;
        box-shadow: 0 0 18px #7cffb2;
      }
      .square.legal::before {
        animation: mint 0.9s ease-in-out infinite alternate;
      }
      .square.last {
        background: #7cffb214;
        border-radius: 5px;
        box-shadow: inset 0 0 0 1px #7cffb240;
      }
      .board-caption {
        display: flex;
        justify-content: space-between;
        color: #b7c4ff;
        margin-top: 9px;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .chain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }
      .chain polyline {
        fill: none;
        stroke: #7cffb2;
        stroke-width: 1;
        stroke-linecap: round;
        filter: drop-shadow(0 0 2px #7cffb2);
      }
      .thinking {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 9px 0;
        color: #7cffb2;
        font-size: 12px;
      }
      .thinking i {
        width: 5px;
        height: 5px;
        background: #7cffb2;
        border-radius: 50%;
        animation: lamps 0.8s infinite alternate;
      }
      .thinking i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .thinking i:nth-child(3) {
        animation-delay: 0.4s;
      }
      .square .piece {
        filter: drop-shadow(0 2px 4px #02051b90);
      }
      .flying {
        position: absolute;
        pointer-events: none;
        z-index: 10;
        width: 11.75%;
        height: 11.75%;
      }
      .particle {
        position: absolute;
        width: 12%;
        height: 12%;
        pointer-events: none;
        z-index: 12;
      }
      .crown-pop {
        position: absolute;
        width: 12%;
        height: 12%;
        pointer-events: none;
        z-index: 12;
      }
      .result {
        position: absolute;
        z-index: 15;
        top: 35%;
        left: 9%;
        width: 82%;
        background: #0b1138f5;
        padding: 22px;
        border: 1px solid #7cffb2;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 50px #000b;
      }
      .board-surface::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 13;
        border-radius: inherit;
        background: #070a22;
        opacity: 0;
        transition: opacity 220ms;
        pointer-events: none;
      }
      .board-surface.game-over::after {
        opacity: 0.5;
      }
      .result h2 {
        color: #7cffb2;
        font-size: 26px;
        margin-bottom: 8px;
      }
      .result p {
        color: #d5dcff;
        line-height: 1.5;
        font-size: 14px;
        margin-bottom: 14px;
      }
      .result .action {
        text-align: center;
      }
      .result[data-kind='puzzle'] {
        top: auto;
        bottom: 6%;
        border-color: #7cffb2;
        box-shadow: 0 10px 50px #000b, 0 0 28px #7cffb22b;
      }
      .help-copy {
        max-height: min(58vh, 470px);
        overflow: auto;
        padding-right: 10px;
        color: #d5dcff;
        line-height: 1.5;
        font-size: 15px;
      }
      .help-copy p {
        margin: 0 0 14px;
      }
      .help-copy strong {
        color: #7cffb2;
      }
      .round-row {
        display: grid;
        grid-template-columns: 36px 1fr;
        align-items: center;
        gap: 12px;
      }
      .round-row span {
        font-size: 27px;
        color: #ffa51f;
      }
      .round-row small {
        font-size: 12px;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        margin-top: 14px;
        min-height: 44px;
      }
      .toggle-row input {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        accent-color: #7cffb2;
      }
      .how-back {
        margin-top: 15px;
        width: 100%;
        text-align: center;
      }
      @keyframes must {
        50% {
          opacity: 0.5;
          box-shadow: 0 0 22px #ff5fd2;
        }
      }
      @keyframes lamps {
        to {
          opacity: 0.25;
        }
      }
      @keyframes mint {
        to {
          transform: scale(0.8);
          box-shadow: 0 0 7px #7cffb2;
        }
      }
      @keyframes shake {
        25%,
        75% {
          transform: translateX(3px);
        }
        50% {
          transform: translateX(-3px);
        }
      }
      .shake {
        animation: shake 0.28s;
      }
      body.calm *,
      body.calm *::before,
      body.calm *::after {
        animation: none !important;
        transition: none !important;
      }
      body.calm .square.selected .puck:not(.halo) {
        transform: none;
      }
      @media (max-width: 1100px) {
        .screen {
          padding: 72px 18px 12px;
        }
        .arena {
          grid-template-columns: minmax(125px, 170px) minmax(0, 640px) minmax(150px, 180px);
          gap: 12px;
        }
        .side {
          padding: 14px 12px;
        }
        .badge {
          width: 100px;
          height: 112px;
        }
        .side h2 {
          font-size: 23px;
        }
      }
      @media (max-height: 640px) and (min-width: 601px) {
        .screen {
          padding: 64px 12px 8px;
        }
        .arena {
          grid-template-columns: 130px minmax(0, 500px) 170px;
          gap: 10px;
        }
        .board-wrap {
          width: min(100%, calc(100dvh - 108px));
        }
        .side {
          padding: 12px 10px;
        }
        .badge {
          width: 70px;
          height: 75px;
          margin: 0 auto 4px;
        }
        .side p {
          font-size: 11px;
        }
        .side .prompt {
          margin: 8px 0;
          padding: 10px;
        }
        .side .prompt p {
          font-size: 12px;
        }
        .side .tray {
          min-height: 20px;
          margin-top: 7px;
        }
        .side h2 {
          font-size: 20px;
        }
        .your-side .eyebrow,
        .your-side .player-name,
        .your-side > .privacy {
          display: none;
        }
        .your-side .tray:empty {
          display: none;
        }
        .marquee {
          gap: 20px;
        }
        .hero {
          height: calc(100dvh - 88px);
        }
        .hero-copy {
          bottom: 20px;
          left: 20px;
        }
        .hero-copy p {
          font-size: 13px;
          margin-top: 10px;
        }
        .hero h1 {
          font-size: 58px;
        }
        .menu-panel h2 {
          font-size: 25px;
          margin: 7px 0 10px;
        }
        .menu-stack {
          gap: 7px;
        }
        .menu-stack > .action {
          min-height: 47px;
          padding: 8px 13px;
        }
        .privacy {
          margin-top: 9px;
          font-size: 10px;
        }
        .opponent {
          min-height: 66px;
          padding: 5px;
          grid-template-columns: 35px 1fr;
          gap: 5px;
        }
        .opponent img {
          width: 35px;
          height: 40px;
        }
        .opponent b {
          font-size: 14px;
        }
        .opponent small {
          font-size: 10px;
        }
        .choice-row {
          margin-top: 8px;
        }
        .ladder {
          gap: 5px;
        }
      }
      @media (max-width: 600px) {
        body.recess {
          background-image: url('art:portrait');
        }
        .screen {
          padding: 68px 8px 10px;
        }
        .marquee {
          display: flex;
          flex-direction: column;
          gap: 19px;
        }
        .hero {
          width: 100%;
          height: 31vh;
          min-height: 180px;
          border-radius: 18px;
        }
        .hero-copy {
          bottom: 16px;
          left: 20px;
        }
        .hero h1 {
          font-size: 54px;
        }
        .hero-copy p {
          font-size: 13px;
          margin-top: 9px;
        }
        .menu-panel {
          padding: 0 12px;
        }
        .menu-panel h2 {
          font-size: 25px;
          margin: 7px 0 14px;
        }
        .menu-stack {
          gap: 9px;
        }
        .action {
          min-height: 47px;
          padding: 10px 14px;
          font-size: 15px;
        }
        .action small {
          font-size: 12px;
        }
        .privacy {
          margin-top: 12px;
          font-size: 10px;
        }
        .arena {
          display: flex;
          flex-direction: column;
          gap: 9px;
        }
        .side.op-side {
          width: 100%;
          height: 61px;
          padding: 7px 12px 7px 69px;
          border-radius: 12px;
        }
        .op-side .badge {
          position: absolute;
          left: 8px;
          top: 5px;
          width: 49px;
          height: 50px;
          margin: 0;
        }
        .op-side .eyebrow,
        .op-side > p {
          display: none;
        }
        .op-side h2 {
          font-size: 20px;
        }
        .op-side .tray {
          position: absolute;
          right: 10px;
          top: 4px;
          max-width: 130px;
        }
        .op-side .thinking {
          margin: 2px 0;
          font-size: 10px;
        }
        .board-wrap {
          width: 100%;
          max-width: min(500px, calc(100dvh - 330px));
        }
        .board-caption {
          font-size: 10px;
          margin-top: 6px;
        }
        .side.your-side {
          width: 100%;
          padding: 10px 12px;
          border-radius: 12px;
        }
        .your-side .eyebrow,
        .your-side .player-name,
        .your-side > .privacy {
          display: none;
        }
        .your-side .tray {
          margin: 0;
          min-height: 25px;
        }
        .your-side .tray::before {
          content: 'TAKEN';
          color: #aeb6e8;
          font-size: 10px;
          letter-spacing: 0.12em;
          align-self: center;
          margin-right: 12px;
        }
        .prompt {
          margin: 6px 0 10px;
          padding: 10px 12px;
        }
        .prompt p {
          font-size: 14px;
        }
        .side-actions {
          grid-template-columns: repeat(4, 1fr);
        }
        .side-actions .wide {
          grid-column: auto;
        }
        .side-actions .action {
          padding: 8px;
          font-size: 12px;
        }
        .toggle-row {
          margin-top: 3px;
          min-height: 36px;
        }
        .opponent {
          min-height: 74px;
        }
        .opponent img {
          width: 43px;
          height: 48px;
        }
        .opponent {
          grid-template-columns: 43px 1fr;
        }
        .opponent small {
          font-size: 10px;
        }
        body.submenu .hero {
          height: 20vh;
          min-height: 120px;
        }
        body.submenu .hero h1 {
          font-size: 40px;
        }
        body.submenu .hero-copy p {
          display: none;
        }
      }
      @media (max-height: 640px) and (min-width: 601px) {
        body.submenu .hero {
          display: none;
        }
        body.submenu .marquee {
          grid-template-columns: 1fr;
        }
        body.submenu .menu-panel {
          max-width: 660px;
          justify-self: center;
        }
        body.submenu .privacy {
          margin-top: 6px;
          line-height: 1.3;
        }
        .ladder {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .opponent small {
          line-height: 1.1;
        }
        body[data-page='rounds'] .menu-stack {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        body[data-page='main'] .menu-stack {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        body[data-page='main'] #resume,

        body[data-page='main'] .minor-row {

    <script>
      // Shared by the table and its offline Worker. Square indices here are zero based.
      function CheckersEngine() {
        const row = (s) => s >> 2;
        const col = (s) => (s % 4) * 2 + (row(s) % 2 ? 0 : 1);
        const square = (r, c) => (r < 0 || r > 7 || c < 0 || c > 7 || (r + c) % 2 !== 1 ? -1 : r * 4 + (c >> 1));
        const dirs = [
          [1, -1],
          [1, 1],
          [-1, -1],
          [-1, 1],
        ];
        const step = Array.from({ length: 32 }, (_, s) => dirs.map(([r, c]) => square(row(s) + r, col(s) + c)));
        const leap = Array.from({ length: 32 }, (_, s) => dirs.map(([r, c]) => square(row(s) + 2 * r, col(s) + 2 * c)));
        const key = (p) => p.b.join(',') + ':' + p.side;
        const crowning = (v, s) => Math.abs(v) === 1 && (v > 0 ? row(s) === 7 : row(s) === 0);
        const notation = (m) => [m.from, ...m.path].map((s) => s + 1).join(m.cap.length ? 'x' : '-');
        const moveId = (m) => (m ? notation(m) : '');
        function initial() {
          return { b: Array.from({ length: 32 }, (_, i) => (i < 12 ? 1 : i >= 20 ? -1 : 0)), side: 1, quiet: 0, ply: 0 };
        }
        function position(p) {
          const b = Array(32).fill(0);
          for (const [k, v] of [
            ['am', 1],
            ['ak', 2],
            ['bm', -1],
            ['bk', -2],
          ])
            for (const s of p[k]) b[s - 1] = v;
          return { b, side: p.move === 'B' ? -1 : 1, quiet: 0, ply: 0 };
        }
        function moves(p) {
          const b = p.b,
            captures = [];
          for (let from = 0; from < 32; from++) {
            const v = b[from];
            if (v * p.side <= 0) continue;
            const ds = Math.abs(v) === 2 ? [0, 1, 2, 3] : v > 0 ? [0, 1] : [2, 3];
            function chain(at, path, taken, mask) {
              let more = false;
              for (const d of ds) {
                const mid = step[at][d],
                  to = leap[at][d];
                if (to < 0 || b[to] || b[mid] * v >= 0 || !b[mid] || mask & (1 << mid)) continue;
                more = true;
                const nextPath = [...path, to],
                  nextTaken = [...taken, mid];
                b[at] = 0;
                b[to] = v;
                if (crowning(v, to)) captures.push({ from, path: nextPath, cap: nextTaken, promote: true });
                else chain(to, nextPath, nextTaken, mask | (1 << mid));
                b[to] = 0;
                b[at] = v;
              }
              if (!more && taken.length) captures.push({ from, path, cap: taken, promote: false });
            }
            chain(from, [], [], 0);
          }
          if (captures.length) return captures.sort(compare);
          const quiet = [];
          for (let from = 0; from < 32; from++) {
            const v = b[from];
            if (v * p.side <= 0) continue;
            for (let d = 0; d < 4; d++) {
              if (Math.abs(v) === 1 && (v > 0 ? d > 1 : d < 2)) continue;
              const to = step[from][d];
              if (to >= 0 && !b[to]) quiet.push({ from, path: [to], cap: [], promote: crowning(v, to) });
            }
          }
          return quiet.sort(compare);
        }
        function compare(a, b) {
          if (a.from !== b.from) return a.from - b.from;
          for (let i = 0; i < Math.min(a.path.length, b.path.length); i++)
            if (a.path[i] !== b.path[i]) return a.path[i] - b.path[i];
          return a.path.length - b.path.length;
        }
        function apply(p, m) {
          const b = p.b.slice(),
            v = b[m.from],
            to = m.path[m.path.length - 1];
          b[m.from] = 0;
          for (const c of m.cap) b[c] = 0;
          b[to] = m.promote ? v * 2 : v;
          const next = { b, side: -p.side, quiet: Math.abs(v) === 1 || m.cap.length ? 0 : p.quiet + 1, ply: (p.ply || 0) + 1 };
          if (p.z1 !== undefined) {
            let a = p.z1 ^ sideHash[0],
              c = p.z2 ^ sideHash[1];
            for (const s of [m.from, ...m.cap, to]) {
              if (p.b[s]) {
                const z = zobrist[s][pieceType(p.b[s])];
                a ^= z[0];
                c ^= z[1];
              }
              if (b[s]) {
                const z = zobrist[s][pieceType(b[s])];
                a ^= z[0];
                c ^= z[1];
              }
            }
            next.z1 = a;
            next.z2 = c;
          }
          return next;
        }

          if (!moves(p).length) return { winner: -p.side, reason: 'blocked' };
          if (repetitions && (repetitions[key(p)] || 0) >= 3) return { winner: 0, reason: 'repeat' };
          if (p.quiet >= 80) return { winner: 0, reason: 'quiet' };
          return null;
        }
        function mirror(p) {
          return {
            b: p.b
              .slice()
              .reverse()
              .map((v) => -v),
            side: -p.side,
            quiet: p.quiet,
            ply: p.ply,
          };
        }
        function evaluate(p, strong) {
          const total = p.b.filter(Boolean).length;
          let score = 0,
            material = 0,
            lead = 0;
          for (let s = 0; s < 32; s++) {
            const v = p.b[s];
            if (!v) continue;
            const king = Math.abs(v) === 2,
              sign = Math.sign(v),
              advance = sign > 0 ? row(s) : 7 - row(s),
              n = s + 1;
            let val = king ? (strong ? 140 : 150) : 100;
            material += king ? 140 : 100;
            lead += sign * (king ? 140 : 100);
            if (!king) val += advance * (strong ? (total > 12 ? 3 : 6) : 4);
            if (strong) {
              if ([14, 15, 18, 19].includes(n)) val += king ? 8 : 5;
              if (king && [10, 11, 22, 23].includes(n)) val += 4;
              if (!king && total > 10 && (sign > 0 ? [1, 3].includes(n) : [30, 32].includes(n))) val += 12;
              if ([5, 12, 13, 20, 21, 28].includes(n)) val -= 2;
            } else {
              if (!king && advance === 0) val += 10;
              if ([14, 15, 18, 19].includes(n)) val += 6;
            }

          return score * p.side;
        }

        function random32() {
          state ^= state << 13;
          state ^= state >>> 17;
          state ^= state << 5;
          return state >>> 0;
        }
        const zobrist = Array.from({ length: 32 }, () => Array.from({ length: 4 }, () => [random32(), random32()]));

          if (p.hh) return p.hh;
          if (p.z1 !== undefined) return (p.hh = (p.z1 >>> 0).toString(36) + '.' + (p.z2 >>> 0).toString(36));

            b = p.side > 0 ? sideHash[1] : 0;
          for (let i = 0; i < 32; i++)

              const t = pieceType(p.b[i]);
              a ^= zobrist[i][t][0];
              b ^= zobrist[i][t][1];
            }
          p.z1 = a;
          p.z2 = b;
          return (p.hh = (a >>> 0).toString(36) + '.' + (b >>> 0).toString(36));
        }
        const table = new Map(),
          history = new Int32Array(1024);
        function clear() {
          table.clear();
          history.fill(0);
        }
        function search(p, rung, options = {}) {
          const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
          const start = now(),
            budget = options.budget ?? [0, 700, 900, 1200, 1800, 2600, 3000][rung];
          const deadline = start + budget,
            strong = rung >= 4,
            target = [0, 1, 2, 4, 6, 8, 64][rung];
          let nodes = 0,
            reached = 0,
            scores = [],
            best = null,
            completed = false;
          const abort = {};
          const counts = new Map();
          for (const [k, v] of Object.entries(options.repetitions || {})) {
            const [b, side] = k.split(':');
            counts.set(strong ? hash({ b: b.split(',').map(Number), side: +side }) : k, v);
          }
          if (strong) hash(p);
          const stateKey = strong ? hash : key;
          function run(pos, depth, alpha, beta, ply, extension) {
            nodes++;
            if ((nodes & 511) === 0 && now() >= deadline) throw abort;
            if (ply > 100) return evaluate(pos, strong);
            const list = moves(pos);
            if (!list.length) return -(strong ? 100000 : 10000) + ply;
            if (pos.quiet >= 80) return 0;
            const k = stateKey(pos),
              times = counts.get(k) || 0;
            if (times >= 3) return 0;
            const jump = list[0].cap.length > 0,
              capLimit = strong ? 8 : 6;
            if (depth <= 0 && (!jump || extension >= capLimit)) return evaluate(pos, strong);
            const h = strong ? hash(pos) : null,
              entry = strong ? table.get(h) : null;
            const alpha0 = alpha,
              beta0 = beta;
            // A quiet counter or repeated path changes draw value. Reuse only in matching contexts.
            const reusable = entry && entry.quiet === pos.quiet && entry.times === times && times <= 1;
            if (reusable && entry.depth >= depth && depth > 0 && Math.abs(entry.value) < 99000) {
              if (entry.bound === 0) return entry.value;
              if (entry.bound === 1) alpha = Math.max(alpha, entry.value);
              if (entry.bound === 2) beta = Math.min(beta, entry.value);
              if (alpha >= beta) return entry.value;
            }
            if (strong)
              list.sort((a, b) => {
                const av = moveId(a) === entry?.best ? 1 : 0,
                  bv = moveId(b) === entry?.best ? 1 : 0;
                return (
                  bv - av ||
                  b.cap.length - a.cap.length ||
                  history[b.from * 32 + b.path.at(-1)] - history[a.from * 32 + a.path.at(-1)] ||
                  compare(a, b)
                );
              });
            let value = -Infinity,
              bestId = '';
            for (const m of list) {
              const next = apply(pos, m),
                nk = stateKey(next),
                old = counts.get(nk) || 0;
              counts.set(nk, old + 1);
              let v;
              try {
                const used = strong && list.length === 1 && ply < 30 ? 0 : 1;
                v = -run(next, depth - used, -beta, -alpha, ply + 1, depth <= 0 ? extension + 1 : 0);
              } finally {
                if (old) counts.set(nk, old);
                else counts.delete(nk);
              }
              if (v > value) {
                value = v;
                bestId = moveId(m);
              }
              alpha = Math.max(alpha, v);
              if (alpha >= beta) {
                if (strong && !m.cap.length) history[m.from * 32 + m.path.at(-1)] += Math.max(1, depth * depth);
                break;
              }
            }
            if (strong && depth > 0 && times <= 1) {
              if (table.size >= 1000000) table.clear();
              table.set(h, {
                depth,
                value,
                bound: value <= alpha0 ? 2 : value >= beta0 ? 1 : 0,
                best: bestId,
                quiet: pos.quiet,
                times,
              });
            }
            return value;
          }
          const root = moves(p);
          if (!root.length) return { move: null, depth: 0, nodes: 0, ms: 0 };
          best = root[0];
          if (root.length === 1)
            return { move: best, depth: target === 64 ? 10 : target, nodes: 1, ms: now() - start, forced: true };
          const fromDepth = strong ? 1 : target;
          for (let depth = fromDepth; depth <= target; depth++) {
            if (rung === 6 && depth > 10 && now() - start >= 1000) break;
            const pass = [];
            const ordered = strong
              ? root
                  .slice()
                  .sort((a, b) => (moveId(b) === moveId(best) ? 1 : 0) - (moveId(a) === moveId(best) ? 1 : 0) || compare(a, b))
              : root;
            try {
              let rootBest = -Infinity;
              for (const m of ordered) {
                const next = apply(p, m),
                  nk = stateKey(next),
                  old = counts.get(nk) || 0;
                counts.set(nk, old + 1);
                let value;
                const threshold = strong ? rootBest - ((p.ply || 0) < 4 ? 15 : 0.001) : -Infinity;
                try {
                  value = -run(next, depth - 1, -Infinity, -threshold, 1, 0);
                } finally {
                  if (old) counts.set(nk, old);
                  else counts.delete(nk);
                }
                pass.push({ move: m, value });
                rootBest = Math.max(rootBest, value);
              }
              pass.sort((a, b) => b.value - a.value || compare(a.move, b.move));
              scores = pass;
              best = pass[0].move;
              reached = depth;
              completed = true;
            } catch (e) {
              if (e !== abort) throw e;
              break;
            }
            if (rung === 6 && depth >= 10 && Math.abs(scores[0].value) > 99000) break;
          }
          const random = options.random || (() => 0.99);
          if (scores.length) {
            if (!strong) {
              const own = p.b.filter((v) => v * p.side > 0).length,
                opp = p.b.filter((v) => v * p.side < 0).length;
              const chance = [0, 0.35, 0.15, 0.05][rung] + (rung <= 2 && own - opp >= 2 ? 0.25 : 0);
              const others = scores.filter((x) => moveId(x.move) !== moveId(best) && x.value > -5000);
              if (random() < chance && others.length) best = others[Math.floor(random() * others.length)].move;
            } else if ((p.ply || 0) < 4) {
              const close = scores.filter((x) => x.value >= scores[0].value - 15);
              best = close[Math.floor(random() * close.length)].move;
            }
          }
          return {
            move: best,
            depth: reached,
            nodes,
            ms: now() - start,
            completed,
            scores: scores.map((x) => ({ move: notation(x.move), value: x.value })),
          };
        }
        return {
          initial,
          position,
          moves,
          apply,
          key,
          notation,
          moveId,
          outcome,
          mirror,
          evaluate,
          search,
          clear,
          row,
          col,
          square,
          hash,
        };
      }

        const controls = [...card.querySelectorAll('button,input,select,[tabindex="0"]')]
          .filter((b) => !b.disabled && b.getClientRects().length);
        const first = controls[0], last = controls.at(-1);
        if (!first) return;
        if (e.shiftKey && (document.activeElement === first || !card.contains(document.activeElement))) {
          e.preventDefault();
          last.focus({ preventScroll: true });
        } else if (!e.shiftKey && (document.activeElement === last || !card.contains(document.activeElement))) {
          e.preventDefault();
          first.focus({ preventScroll: true });
        }
      });
      addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input,select,textarea,.rc-veil') || !onTable) return;
        const k = e.key.toLowerCase();
        if (k === 'h') {
          e.preventDefault();
          toggleHints();
        }
        if (k === 'f') {
          e.preventDefault();
          flip();
        }
        if (k === 'c') {
          e.preventDefault();
          clue();
        }
        if (k === 'p') {
          e.preventDefault();
          menu();
        }
      });
      addEventListener('resize', () => {
        if (onTable && G && !busy) render();
      });
      addEventListener('pagehide', () => {
        store();
        cancel();
      });
      let ac = null,
        unlocked = false;
      addEventListener(
        'pointerdown',
        () => {
          unlocked = true;
        },
        { once: true },
      );
      function tone(f, end, duration = 0.08, wave = 'square', volume = 0.06, delay = 0) {
        if (!Recess.sound || !unlocked) return;
        if (!ac) {
          const A = window.AudioContext || window.webkitAudioContext;
          if (!A) return;
          ac = new A();
        }
        if (ac.state === 'suspended') ac.resume();
        const t = ac.currentTime + delay,
          o = ac.createOscillator(),
          g = ac.createGain();
        o.type = wave;
        o.frequency.setValueAtTime(f, t);
        o.frequency.exponentialRampToValueAtTime(end, t + duration);
        g.gain.setValueAtTime(volume, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        o.connect(g).connect(ac.destination);
        o.start(t);
        o.stop(t + duration + 0.02);
      }
      function powerup() {
        tone(330, 660, 0.15, 'square', 0.05);
        if (Recess.calm) return;
        document.querySelectorAll('.square .piece').forEach((p, i) =>
          p.animate(
            [
              { transform: 'translateY(-30%) scale(.9)', opacity: 0 },
              { transform: 'scale(1.1,.86)', opacity: 1 },
              { transform: 'none', opacity: 1 },
            ],
            { duration: 300, delay: i * 20, easing: 'ease-out' },
          ),
        );
      }
      function winWave() {
        if (Recess.calm) return;
        for (const square of $('board').querySelectorAll('.square')) {
          const s = +square.dataset.s;
          if (G.position.b[s] * G.human <= 0) continue;
          square
            .querySelector('.piece')
            ?.animate(
              [
                { transform: 'translateY(0) scale(1)' },
                { transform: 'translateY(-14%) scale(.96,1.08)', offset: 0.45 },
                { transform: 'scale(1.1,.9)', offset: 0.8 },
                { transform: 'none' },
              ],
              { duration: 380, delay: E.row(s) * 35, easing: 'ease-out' },
            );
        }
      }
      function lowNotes() {
        tone(196, 196, 0.2, 'sine', 0.05);
        tone(165, 165, 0.2, 'sine', 0.05, 0.22);
      }
      async function animate(m, holdFinal = false) {
        const token = epoch,
          board = $('board'),
          v = G.position.b[m.from],
          original = board.querySelector(`[data-s="${m.from}"] .piece`);
        if (original) original.style.visibility = 'hidden';
        const fly = document.createElement('img');
        fly.src = pawnImage(v);
        fly.className = 'flying';
        fly.alt = '';
        board.append(fly);
        const stops = [m.from, ...m.path];
        for (let i = 1; i < stops.length; i++) {
          if (token !== epoch) return;
          const [x0, y0] = center(stops[i - 1]),
            [x1, y1] = center(stops[i]);
          fly.style.left = x1 - 5.875 + '%';
          fly.style.top = y1 - 5.875 + '%';
          const calm = Recess.calm,
            duration = calm ? 120 : m.cap.length ? 200 : 160;
          let frames;
          if (calm) frames = [{ opacity: 0 }, { opacity: 1 }];
          else {
            const w = board.clientWidth;
            frames = [
              { transform: `translate(${((x0 - x1) * w) / 100}px,${((y0 - y1) * w) / 100}px) scale(1,1)` },
              {
                transform: `translate(${((x0 - x1) * w) / 200}px,${((y0 - y1) * w) / 200 - (m.cap.length ? w * 0.0225 : 0)}px) scale(.94,1.15)`,
                offset: 0.5,
              },
              { transform: 'scale(1.12,.88)', offset: 0.9 },
              { transform: 'scale(1,1)' },
            ];
          }
          const anim = fly.animate(frames, { duration, easing: 'ease-in-out' });
          await anim.finished.catch(() => {});
          if (token !== epoch) return;
          if (m.cap.length) {
            Recess.play('capture');
            tone(440 * Math.pow(1.26, i - 1), 440 * Math.pow(1.26, i - 1));
            const cap = board.querySelector(`[data-s="${m.cap[i - 1]}"]`);
            if (cap) {
              const piece = cap.querySelector('.piece');
              if (piece)
                piece.animate(
                  calm ? [{ opacity: 1 }, { opacity: 0 }] : [{ filter: 'brightness(5)', opacity: 1 }, { opacity: 0 }],
                  { duration: calm ? 120 : 180, fill: 'forwards' },
                );
            }
            if (!calm) sparks(m.cap[i - 1]);
          } else Recess.play('place');
        }
        if (m.promote) {
          Recess.play('pop');
          tone(1046, 1046, 0.25, 'sine', 0.07);
          tone(1568, 1568, 0.25, 'sine', 0.035);
          fly.src = pawnImage(v * 2);
          if (!Recess.calm) {
            const crown = document.createElement('img');
            crown.className = 'crown-pop';
            crown.src = ART.crowns[0];
            const [x, y] = center(stops.at(-1));
            crown.style.left = x - 6 + '%';
            crown.style.top = y - 10 + '%';
            board.append(crown);
            const animation = crown.animate(
              [
                { transform: 'translateY(-40%) scale(1.4)', opacity: 0 },
                { transform: 'scale(1.1,.8)', opacity: 1, offset: 0.7 },
                { transform: 'none', opacity: 0 },
              ],
              { duration: 400 },
            );
            for (let j = 1; j < 4; j++) {
              await wait(65);
              if (token !== epoch) return;
              crown.src = ART.crowns[j];
            }
            await animation.finished.catch(() => {});
            crown.remove();
          }
        }
        if (!holdFinal) fly.remove();
      }
      function sparks(s) {
        const [x, y] = center(s),
          board = $('board');
        for (let i = 0; i < 6; i++) {
          const img = document.createElement('img');
          img.className = 'particle';
          img.src = ART.spark;
          img.alt = '';
          img.style.left = x - 6 + '%';
          img.style.top = y - 6 + '%';
          board.append(img);
          const a = (i * Math.PI) / 3,
            d = board.clientWidth * 0.1;
          const anim = img.animate(
            [
              { transform: 'scale(.4)', opacity: 1 },
              { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.1)`, opacity: 0 },
            ],
            { duration: 400, easing: 'ease-out' },
          );
          anim.finished.then(() => img.remove()).catch(() => img.remove());
        }
      }
      Recess.start({
        id: 'checkers',
        title: 'Checkers',
        score: { label: 'Moves', lower: true },
        onUndo: undo,
        onRestart: restart,
        onNext: next,
      });
      Recess.onMotion((calm) => {
        if (calm) document.getAnimations().forEach((a) => a.finish());
        if (calm) document.body.style.setProperty('--arcade-x', '0px');
      });
      addEventListener('pointermove', (e) => {
        if (!Recess.calm) document.body.style.setProperty('--arcade-x', ((e.clientX / innerWidth - 0.5) * 8).toFixed(1) + 'px');
      });
      menu();

      // Development hooks are available only when explicitly requested in the file URL.
      if (new URLSearchParams(location.search).has('test') || new URLSearchParams(location.search).has('ladder')) {
        window.checkersDev = {
          E,
          PUZZLES,
          workerSource,
          RIVALS,
          get state() {
            return G;
          },
          get run() {
            return run;
          },
          newGame,
          newPuzzleRound,
          daily,
          pick,
          attempt,
          undo,
          restart,
          menu,
          resume,
          clue,
          nextPuzzle,
          render,
          selfcheck: () => checkersSelfCheck(E, PUZZLES),
          get busy() {
            return busy;
          },
          setPosition(position) {
            cancel();
            G.position = position;
            G.reps = { [E.key(position)]: 1 };
            G.history = [];
            render();
            store();
          },
        };
        console.info('Checkers self-check', checkersSelfCheck(E, PUZZLES));
      }

      async function checkersLadder(gamesPerPair = 10) {
        const results = [],
          judger = CheckersEngine();
        for (let high = 2; high <= 6; high++) {
          const games = [];
          for (let game = 0; game < gamesPerPair; game++) {
            const pairWorkers = [
              new Worker(
                workerUrl || (workerUrl = URL.createObjectURL(new Blob([workerSource], { type: 'application/javascript' }))),
              ),
              new Worker(workerUrl),
            ];
            let p = judger.initial(),
              reps = { [judger.key(p)]: 1 },
              turns = 0;
            const random = Recess.rng('ballot-' + Math.floor(game / 2)),
              higherSide = game % 2 === 0 ? 1 : -1;
            for (let k = 0; k < 3; k++) {
              const ms = judger.moves(p);
              p = judger.apply(p, ms[Math.floor(random() * ms.length)]);
              reps[judger.key(p)] = (reps[judger.key(p)] || 0) + 1;
            }
            let result = null;
            try {
              while (!(result = judger.outcome(p, reps)) && turns < 400) {
                const index = p.side === higherSide ? 0 : 1,
                  w = pairWorkers[index],
                  level = high - index;
                const reply = await new Promise((resolve, reject) => {
                  const timer = setTimeout(() => reject(Error('Worker over 3.3 second budget')), 3300);
                  w.onmessage = (e) => {
                    clearTimeout(timer);
                    resolve(e.data);
                  };
                  w.onerror = reject;
                  w.postMessage({ position: p, repetitions: reps, level, token: game, clear: turns < 2 });
                });
                p = judger.apply(p, reply.move);
                turns++;
                reps[judger.key(p)] = (reps[judger.key(p)] || 0) + 1;
              }
            } finally {
              pairWorkers.forEach((w) => w.terminate());
            }
            games.push(result ? (result.winner === 0 ? 'draw' : result.winner === higherSide ? 'win' : 'loss') : 'limit');
            console.info('Ladder ballot', high, game + 1, games.at(-1));
          }
          const row = {
            high,
            wins: games.filter((x) => x === 'win').length,
            losses: games.filter((x) => x === 'loss').length,
            draws: games.filter((x) => x === 'draw').length,
          };
          results.push(row);
          console.table(results);
        }
        return results;
      }
      if (window.checkersDev) window.checkersDev.ladder = checkersLadder;
      if (new URLSearchParams(location.search).has('ladder')) checkersLadder().then((r) => console.info('Ladder finished', r));
    </script>
  </body>
