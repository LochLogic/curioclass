<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Lines · Gravity and Electrostatics · Curio Class</title>
<meta name="description" content="One layout of objects drawn twice, as a gravity field and as an electric field, so students see that both fall off as one over r squared and that the real difference is that charge has two signs and mass has one. Then the spreading argument for one over r squared, and real force pairs from a hydrogen atom to Earth and Moon. Grade 11 physics. Works offline.">
<!--
Field Lines (Curio Class)
Grade 11, physics. Standard: NGSS HS-PS2-4 (use Newton's law of gravitation and Coulomb's law to describe and predict
the gravitational and electrostatic forces between objects). Students drive, often alone on a laptop; also works on a
projector. Pure explore: no score, no timer, no win state.
Twin boards: every object is drawn on a gravity board and an electric board at once, with field lines, an arrow grid,
strength shading and a probe that reads both fields. Spread: 36 lines fanning out over r squared tiles, with a plot of
36 over r squared. Real pairs: gravity and electric forces for five real pairs on one log scale.
Facts: NIST CODATA 2018 (G, k, e, proton and electron mass, Bohr radius); NASA Earth and Moon Fact Sheets; OpenStax
College Physics 2e section 31.1 (nucleus scale); OpenStax University Physics Volume 1 section 13.2 and Volume 2
sections 5.4 and 5.6 (field directions, inverse square spreading); NGSS HS-PS2-4. Every Real pairs force and ratio is
computed live from the constants and was checked in Python on 2026-10-25. Board units on Twin boards are invented
(the constant is 1 on both boards so the pictures match).
Everything is drawn in code (SVG and canvas). One file, no network requests. Content CC BY 4.0, code MIT. curioclass.org
-->

<script>
(() => {
  const $ = id => document.getElementById(id);
  const {say, wait} = Curio;
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const txt = (parent, x, y, s, cls, anchor) => { const t = mk('text', {x, y, class: cls, 'text-anchor': anchor || 'start'}, parent); t.textContent = s; return t; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const MINUS = '−';
  const fmt2 = v => (Math.abs(v) < .005 ? 0 : v).toFixed(2);
  const state = {mode: 'tb'};

  // ======================================================================================
  // FIELD ENGINE: field math, line tracer, probe integrator, real-pair forces. No DOM code here,
  // so it can move to a kit file (kit/forces.js) later. Board units: a 12 by 12 board, constant 1.
  // ======================================================================================
  const F = (() => {
    const SIZE = 12, MARGIN = 2, PROBE_R = .12;
    const radius = s => .25 + .08 * s;
    // objects packed into arrays; gravity treats every object as negative (its field points in)
    function pack(objs, kind) {
      const n = objs.length, X = new Float64Array(n), Y = new Float64Array(n), Q = new Float64Array(n), R = new Float64Array(n);
      objs.forEach((o, i) => { X[i] = o.x; Y[i] = o.y; Q[i] = (kind === 'g' ? -1 : o.c) * o.s; R[i] = radius(o.s); });
      return {n, X, Y, Q, R};
    }
    // field at (x, y): sum of q / r^2 away from each object (q < 0 points toward it); inside a disc r = radius
    function fieldP(P, x, y, out) {
      let ex = 0, ey = 0;
      for (let i = 0; i < P.n; i++) {
        const dx = x - P.X[i], dy = y - P.Y[i], d2 = dx * dx + dy * dy;
        if (d2 === 0) continue;
        const d = Math.sqrt(d2), r = d < P.R[i] ? P.R[i] : d, m = P.Q[i] / (r * r) / d;
        ex += m * dx; ey += m * dy;
      }
      out[0] = ex; out[1] = ey; return out;
    }
    const field = (objs, kind, x, y) => fieldP(pack(objs, kind), x, y, [0, 0]);
    // field lines: 6 per size unit evenly around each object, RK4 with a fixed 0.05 unit step along the field
    // (positives) or against it (negatives). A line stops on another disc, 2 units outside the board, at a zero
    // point (the direction turns back on itself), or after 2000 steps. A line from a negative that ends on a
    // positive is dropped: it is already drawn from the positive. Arrows every 2 units point along the field.
    function trace(objs, kind, opt = {}) {
      const step = opt.step || .05, maxSteps = opt.maxSteps || 2000, per = opt.perSize || 6, every = opt.arrowEvery || 2;
      const P = pack(objs, kind), lines = [], arrows = [], f = [0, 0];
      const k1 = [0, 0], k2 = [0, 0], k3 = [0, 0], k4 = [0, 0];
      const dir = (x, y, sg, o) => { fieldP(P, x, y, f); const m = Math.hypot(f[0], f[1]); if (!(m > 1e-12)) return false; o[0] = sg * f[0] / m; o[1] = sg * f[1] / m; return true; };
      let steps = 0;
      // arrowheads: each line starts at its own phase (no rings of arrows), and one that would land within 0.45
      // units of another arrow is skipped (no piles where lines bunch together)
      const cell = new Map(), ckey = (x, y) => Math.floor(x / .5) * 4096 + Math.floor(y / .5);
      const crowded = (x, y) => { const cx = Math.floor(x / .5), cy = Math.floor(y / .5);
        for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const l = cell.get((cx + a) * 4096 + cy + b); if (l) for (let q = 0; q < l.length; q += 2) if ((l[q] - x) ** 2 + (l[q + 1] - y) ** 2 < .2) return true; }
        return false; };
      for (let i = 0; i < P.n; i++) {
        const sg = P.Q[i] > 0 ? 1 : -1, n = Math.round(per * objs[i].s);
        for (let j = 0; j < n; j++) {
          const a = 2 * Math.PI * (j + .5) / n;
          let x = P.X[i] + (P.R[i] + .01) * Math.cos(a), y = P.Y[i] + (P.R[i] + .01) * Math.sin(a);
          const pts = [x, y], la = [];
          let end = -1, arc = 0, next = .8 + ((j * .618034 + i * .37) % 1) * every, pdx = 0, pdy = 0;
          for (let s = 0; s < maxSteps; s++) {
            if (!dir(x, y, sg, k1) || !dir(x + k1[0] * step / 2, y + k1[1] * step / 2, sg, k2) ||
                !dir(x + k2[0] * step / 2, y + k2[1] * step / 2, sg, k3) || !dir(x + k3[0] * step, y + k3[1] * step, sg, k4)) break;
            let dx = (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) / 6, dy = (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) / 6;
            const dm = Math.hypot(dx, dy);
            if (dm < .3) break;                                // the samples disagree: a zero point
            dx *= step / dm; dy *= step / dm;
            if (s > 0 && dx * pdx + dy * pdy < 0) break;       // turned back: a zero point
            pdx = dx; pdy = dy; x += dx; y += dy; arc += step; steps++;
            pts.push(x, y);
            if (arc >= next) { la.push(x, y, Math.atan2(sg * dy, sg * dx)); next += every; }  // placed below, once the line is kept
            if (x < -MARGIN || y < -MARGIN || x > SIZE + MARGIN || y > SIZE + MARGIN) break;
            let hit = -1;
            for (let q = 0; q < P.n; q++) { if (q === i) continue; const ex = x - P.X[q], ey = y - P.Y[q]; if (ex * ex + ey * ey < P.R[q] * P.R[q]) { hit = q; break; } }
            if (hit >= 0) { end = hit; break; }
          }
          if (sg < 0 && end >= 0 && P.Q[end] > 0) continue;
          lines.push(pts);
          for (let q = 0; q < la.length; q += 3) {
            const ax = la[q], ay = la[q + 1];
            if (crowded(ax, ay)) continue;
            arrows.push(ax, ay, la[q + 2]);
            const k = ckey(ax, ay); if (!cell.has(k)) cell.set(k, []); cell.get(k).push(ax, ay);
          }
        }
      }
      return {lines, arrows, steps};
    }
    // release: the probe starts at rest and moves with acceleration equal to the field (unit mass or unit test
    // charge), velocity Verlet with dt = 0.002. Ends: 'landed' (touches a disc), 'escaped' (leaves the board),
    // 'time' (8 s), 'still' (no field at the start). pts holds x, y, t every 0.02 s. turns holds x, y, t where the
    // velocity reverses (a turnaround of a swing); side is how far the path ever strays from the line through the
    // start along the first pull (near 0: the probe swung along a straight line).
    function release(objs, kind, x0, y0, opt = {}) {
      const dt = opt.dt || .002, T = opt.T || 8, every = .02, P = pack(objs, kind), a = fieldP(P, x0, y0, [0, 0]);
      if (Math.hypot(a[0], a[1]) < 1e-6) return {pts: [x0, y0, 0], end: 'still', on: -1, t: 0, turns: [], side: 0};
      let x = x0, y = y0, vx = 0, vy = 0, ax = a[0], ay = a[1], t = 0, nextS = every, end = 'time', on = -1, side = 0;
      const pts = [x, y, 0], na = [0, 0], turns = [], am = Math.hypot(a[0], a[1]), ux = a[0] / am, uy = a[1] / am;
      while (t < T) {
        x += vx * dt + .5 * ax * dt * dt; y += vy * dt + .5 * ay * dt * dt;
        fieldP(P, x, y, na);
        const pvx = vx, pvy = vy;
        vx += .5 * (ax + na[0]) * dt; vy += .5 * (ay + na[1]) * dt; ax = na[0]; ay = na[1]; t += dt;
        if (pvx * vx + pvy * vy < 0) turns.push(x, y, t);
        side = Math.max(side, Math.abs((x - x0) * uy - (y - y0) * ux));
        for (let q = 0; q < P.n; q++) { const dx = x - P.X[q], dy = y - P.Y[q], R = P.R[q] + PROBE_R; if (dx * dx + dy * dy < R * R) { end = 'landed'; on = q; break; } }
        if (end === 'landed') break;
        if (x < 0 || y < 0 || x > SIZE || y > SIZE) { end = 'escaped'; break; }
        if (t >= nextS) { pts.push(x, y, t); nextS += every; }
      }
      pts.push(x, y, Math.min(t, T));
      return {pts, end, on, t: Math.min(t, T), turns, side};
    }
    // Spread: 36 lines through a screen r by r tiles at distance r (r squared tiles)
    const SPREAD_LINES = 36;
    const linesPerTile = r => SPREAD_LINES / (r * r);
    // offsets (0 to r) of the 6 lines per side, measured from one edge of the screen
    const lineOffsets = r => Array.from({length: 6}, (_, i) => (i + .5) * r / 6);
    // real constants: NIST CODATA 2018; Earth and Moon: NASA fact sheets
    const C = {G: 6.67430e-11, k: 8.9875517923e9, e: 1.602176634e-19, mp: 1.67262192369e-27, me: 9.1093837015e-31,
      a0: 5.29177210903e-11, ME: 5.9722e24, RE: 6.3710e6, MM: 7.346e22, DEM: 3.844e8};
    const gravity = (m1, m2, r) => C.G * m1 * m2 / (r * r);          // always attracts
    const coulomb = (q1, q2, r) => C.k * q1 * q2 / (r * r);          // positive: repel, negative: attract
    return {SIZE, MARGIN, PROBE_R, radius, field, trace, release, linesPerTile, lineOffsets, C, gravity, coulomb};
  })();

  // ======================================================================================
  // Narration: a welcome on entering each mode (after the first tap), one at a time; Read always wins
  // ======================================================================================
  const L = {
    'tb-welcome': 'Welcome to Field Lines. Each object has a mass and a charge. The left board shows its gravity, and the right board shows its electric field.',
    'tb-howto': 'Drag the objects to move them. Drag the small ring, the probe, to read the field at any spot.',
    'tb-negative': 'Mass comes in only one sign, so gravity always pulls. Charge comes in two, so it can push or pull.',
    'tb-double': 'Twice as far away, the field is one quarter as strong, on both boards.',

    const place = (el, xe, yb) => {
      const w = el.getComputedTextLength ? el.getComputedTextLength() : 120;
      if (xe + 8 + w <= W - 6) { el.setAttribute('x', (xe + 8).toFixed(1)); el.setAttribute('y', yb + S.rp.bh / 2 + 5); el.setAttribute('text-anchor', 'start'); }
      else {
        // above the bar, after its name label, ending at the bar end when there is room
        const lab = yb === S.rp.gy ? S.gLab : S.eLab, after = x0 + lab.getComputedTextLength() + 14;
        el.setAttribute('x', Math.max(after, Math.min(xe, W - 6) - w).toFixed(1)); el.setAttribute('y', yb - 7); el.setAttribute('text-anchor', 'start');
      }
    };
    place(S.gVal, gx, S.rp.gy);
    if (fe) {
      const ex = X(Math.abs(fe));
      S.eBar.setAttribute('width', Math.max(2, ex - x0).toFixed(1)); S.eBar.removeAttribute('visibility');
      sciSVG(S.eVal, Math.abs(fe), '', fe < 0 ? ' N, attract' : ' N, repel'); place(S.eVal, ex, S.rp.ey);
      sciSVG(S.ratio, ratio, 'Electric is ', ' times stronger.');
    } else {
      S.eBar.setAttribute('visibility', 'hidden');
      S.eVal.textContent = 'about 0: both are neutral overall'; S.eVal.setAttribute('x', x0); S.eVal.setAttribute('y', S.rp.ey + S.rp.bh / 2 + 5); S.eVal.setAttribute('text-anchor', 'start');
      S.ratio.textContent = 'Gravity wins here.';
    }
    S.ratio.setAttribute('fill', fe ? 'var(--ink)' : 'var(--grav)');
  }

  // ======================================================================================
  // Modes and layout
  // ======================================================================================
  function setMode(m) {
    hush();
    if (tb.run) finishRun();
    state.mode = m;
    document.body.dataset.mode = m;
    for (const k of ['tb', 'sp', 'rp']) $('m-' + k).setAttribute('aria-pressed', k === m);
    for (const el of document.querySelectorAll('[data-modes]')) el.hidden = !el.dataset.modes.split(' ').includes(m);
    cv.style.display = m === 'tb' ? '' : 'none';
    if (m === 'tb') { tbPanel(); setHint(H[tb.lastHint]); }
    else if (m === 'sp') { spPanel(); setHint(H.spStart); }
    else { rpPanel(); setHint(H.rpStart); }
    lastSize = ''; relayout();
    welcome(m);
  }
  for (const k of ['tb', 'sp', 'rp']) $('m-' + k).onclick = () => { if (state.mode !== k) setMode(k); };

  let page = null, lastSize = '';
  function pageLayout() { const w = innerWidth, h = innerHeight; return w >= 1000 && h >= 700 ? 'wide' : w >= 600 && w / h >= 1.25 ? 'compact' : 'stack'; }
  function relayout() {
    const p = pageLayout();
    if (p !== page) { page = p; for (const c of ['wide', 'compact', 'stack']) document.body.classList.toggle(c, c === p); }
    document.body.classList.toggle('short', page === 'wide' && innerHeight < 900);
    const st = $('stage');
    if (page === 'stack') {
      const w = st.getBoundingClientRect().width || innerWidth;
      const hh = state.mode === 'tb' ? (innerWidth < 720 ? 2 * (w - 24) + 36 + 44 : (w - 36) / 2 + 24 + 22) :
        state.mode === 'sp' ? clamp(w * 1.5, 520, 900) : clamp(w * .95, 440, 560);
      st.style.height = Math.round(hh) + 'px';
    } else st.style.height = '';
    const r = st.getBoundingClientRect(), key = state.mode + ':' + Math.round(r.width) + 'x' + Math.round(r.height);
    if (key === lastSize) return;
    lastSize = key;
    W = Math.max(280, Math.round(r.width)); Hh = Math.max(260, Math.round(r.height));
    dpr = Math.min(2, devicePixelRatio || 1);
    sv.setAttribute('width', W); sv.setAttribute('height', Hh); sv.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
    cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cv.style.width = W + 'px'; cv.style.height = Hh + 'px';
    sv.textContent = ''; S = {}; G = null;
    if (state.mode === 'tb') buildTB(); else if (state.mode === 'sp') buildSP(); else buildRP();
  }
  new ResizeObserver(() => relayout()).observe($('stage'));
  addEventListener('resize', () => relayout());
  addEventListener('keydown', e => { if (e.key === 'Escape' && state.mode === 'tb' && tb.sel != null) { select(null); live('Nothing selected'); } });
  Curio.onMotion(reduce => { if (reduce && tb.run) finishRun(); if (reduce && sp.anim) { sp.anim = null; sp.shown = sp.r; spDraw(); } });

  // every line the tool can say: the narration plus the hints (Read speaks the hint)
  const allLines = () => [...new Set([...Object.values(L), ...Object.values(H)])];

  Curio.init({clips: "voice:*", rate: .95, readFallback: () => $('hint').textContent});
  $('read').onclick = readNow;

  window.__tool = {state, setMode, allLines, F, tb, sp, rp, PAIRS, said, queued, applyPreset, presetClick, addObj, select, sizeSel, flipSel, removeSel,
    moveObj: (id, x, y, drop = true) => moveObj(objById(id), x, y, drop), moveProbe, scaleProbe, release, finishRun, clearPaths, setView, spSet, rpPick, rpStep,
    rpValues, probeFields, perf, cache: () => cache, hint: () => $('hint').textContent, layout: () => ({page, W, H: Hh, G}),
    readouts: () => ({g: $('rdG').textContent, e: $('rdE').textContent, d: $('rdD').textContent, rel: $('relRd').textContent}),
    curio: () => ({last: Curio.last, sound: Curio.sound, reduce: Curio.reduce})};
  applyPreset('opposite');
  tb.lastHint = 'start';
  setMode('tb');
})();
</script>
