  function tone(f, dur = .2, gain = .07, when = 0, type = 'triangle') {

    const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;

    await wait(400);
    for (const k of [3, 2, 1]) { if (me !== state.run) return; $('echo').textContent = `Your turn in ${k}...`; SFX.count(k); await wait(800); }
    if (me !== state.run) return;
    SFX.count(0);
    $('echo').textContent = '🗣️ Say it together!'; $('echo').classList.toggle('pulse', !reduce);
    for (const s of spans) { if (me !== state.run) return; spans.forEach(x => x.classList.remove('on')); s.classList.add('on'); await wait(per + 80); }
    spans.forEach(x => x.classList.remove('on'));
    $('echo').classList.remove('pulse'); $('echo').textContent = '⭐ Great!';
  }

  // ---------- What do I say? (picture only) ----------
  function nextGuess(sit) {
    if (state.at >= state.order.length - 1 || !state.order.length) { state.order = PH.map(p => p.id).sort(() => Math.random() - .5).slice(0, 8); state.at = -1; state.right = 0; }
    state.at++;
    const p = byId[state.order[state.at]];
    state.cur = p.id;
    const wrong = PH.filter(x => x.id !== p.id).sort(() => Math.random() - .5).slice(0, 2);
    const opts = [p, ...wrong].sort(() => Math.random() - .5);
    $('big').hidden = false; $('grid').hidden = true;
    $('big').style.setProperty('--c', CATS[p.cat].c);
    $('big').innerHTML = `<img src="${IMG[p.id]}" alt=""><div>${sit ? `<div class="story">${p.sit}</div>` : '<div class="story">What do you say?</div>'}<div class="phrase hide" id="phrase" style="font-size:38px">${words(p).map(w => `<span class="w">${w}</span>`).join(' ')}</div><div class="choices" id="choices">${opts.map(o => `<button class="ch" data-id="${o.id}">${o.p}</button>`).join('')}</div></div>`;
    $('choices').querySelectorAll('.ch').forEach(b => b.onclick = () => pick(b));
    $('tip').innerHTML = '';
    $('score').textContent = `${state.at + 1} of ${state.order.length}`;
    say(sit ? [p.sit, 'What do you say?'] : 'What do you say?');
  }
  function pick(b) {
    const p = byId[state.cur], ok = b.dataset.id === p.id;
    if (ok) {
      state.right++;
      b.classList.add('right'); $('phrase').classList.remove('hide'); SFX.yes();
      $('choices').querySelectorAll('.ch').forEach(x => x.disabled = true);
      $('tip').innerHTML = `<b>Yes!</b> Now everyone say it: "${p.p}"`;
      say(['Yes!', p.p]);
    } else {
      b.classList.add('wrong'); SFX.hmm();
      $('tip').innerHTML = `We say "${byId[b.dataset.id].p}" when: ${byId[b.dataset.id].sit.toLowerCase()} Try again!`;
      say('Try again!');
    }
  }

  function setMode(m) {
    state.mode = m; state.run++; stopTalk(); state.order = [];
    for (const [id, k] of [['m-learn', 'learn'], ['m-guess', 'guess'], ['m-sit', 'sit']]) $(id).setAttribute('aria-pressed', m === k);
    $('tip').innerHTML = '';
    if (m === 'learn') {
      $('grid').hidden = false; $('big').hidden = true;
      $('ctrl').innerHTML = '';
      $('hint').innerHTML = '<b>Learn.</b> Tap a phrase. Listen as each word lights up, then everyone says it together on the count.';
      say('Tap a phrase to learn it.');
    }
    if (m === 'guess') {
      $('ctrl').innerHTML = '<button class="big-btn" id="next">Next picture →</button><div class="score" id="score"></div>';
      $('next').onclick = () => nextGuess(false);
      $('hint').innerHTML = '<b>What do I say?</b> Look at the picture. Ask the class to say the phrase first, then tap it to check.';
      nextGuess(false);
    }
    if (m === 'sit') {
      $('ctrl').innerHTML = '<button class="big-btn" id="next">Next situation →</button><div class="score" id="score"></div>';
      $('next').onclick = () => nextGuess(true);
      $('hint').innerHTML = '<b>Situations.</b> Read the story together. What would you say? Children act it out with a partner, then tap the phrase.';
      nextGuess(true);
    }
  }
  $('m-learn').onclick = () => setMode('learn');
  $('m-guess').onclick = () => setMode('guess');
  $('m-sit').onclick = () => setMode('sit');
  addEventListener('keydown', e => { if (e.target.closest('button') || !/^[1-3]$/.test(e.key)) return; setMode(['learn', 'guess', 'sit'][e.key - 1]); });

  // ---------- sound and voice ----------
  $('sound').onclick = e => {
    state.sound = !state.sound;
    e.currentTarget.setAttribute('aria-pressed', state.sound);
    e.currentTarget.textContent = state.sound ? '🔔 Sound' : '🔇 Sound';
    if (!state.sound) stopTalk();
  };
  function bestVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
    const score = v => (/natural|neural/i.test(v.name) ? 50 : 0) + (/premium|enhanced/i.test(v.name) ? 40 : 0) +
      (/google/i.test(v.name) ? 30 : 0) + (/aria|jenny|ava|samantha|libby|sonia/i.test(v.name) ? 10 : 0) +
      (/en-US/i.test(v.lang) ? 5 : 0) + (v.default ? 1 : 0) - (/david|mark|zira|desktop/i.test(v.name) ? 20 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0] || null;
  }
  if ('speechSynthesis' in window) {
    const speak = speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak = u => {
      if (speechSynthesis.getVoices().length) return speak(u);
      let done = false;
      const go = () => { if (done) return; done = true; const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } speak(u); };
      speechSynthesis.addEventListener('voiceschanged', go, {once: true});
      setTimeout(go, 1500);
    };
    speechSynthesis.getVoices();
  }
  const CLIPS = {};
  const allLines = () => [...new Set([...PH.flatMap(p => [p.p, p.sit]), 'What do you say?', 'Yes!', 'Try again!', 'Tap a phrase to learn it.'])];
  let talk = 0, clip = null, last = [];
  function stopTalk() { talk++; if (clip) { clip.pause(); clip = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speakOne(text) {
    return new Promise(done => {
      if (CLIPS[text]) { clip = new Audio(CLIPS[text]); clip.onended = clip.onerror = () => done(); clip.play().catch(() => done()); return; }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(text);
      const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = .82; u.pitch = 1; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function say(parts, force) {
    if (!state.sound && !force) return;
    stopTalk();
    const me = talk;
    last = [].concat(parts);
    for (const p of last) { if (me !== talk) return; await speakOne(p); await wait(200); }
  }
  $('read').onclick = () => say(last.length ? last : [$('hint').textContent], true);

  grid();
  showMotion();
  window.__phrases = {state, setMode, learn, nextGuess, allLines};  // for checking frames
  setMode('learn');
})();
</script>
</body>
