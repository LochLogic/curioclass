<script src="kit:curio"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const show = (id,visible) => $(id).toggleAttribute('hidden',!visible);
  const ART = {
    base:'art:base', greenhouse:'art:greenhouse', solar:'art:surface-solar', crater:'art:ice-crater', airlock:'art:airlock',
    rover:'art:rover', ice:'art:ice-block', can:'art:watering-can', wrench:'art:wrench', key:'art:rover-key',
    medic:'art:first-aid', scientist:'art:science-kit', radio:'art:headset', planter:'art:greenhouse-planter'
  };
  const JOBS = [
    ['Plant Keeper','can','Plant Keeper, you water the greenhouse plants. Show me your watering can.'],
    ['Engineer','wrench','Engineer, you fix the machines. Show me your wrench.'],
    ['Rover Driver','key','Rover Driver, you drive the moon buggy. Turn the key and steer!'],
    ['Medic','medic','Medic, you keep the crew healthy. Open your first aid kit.'],
    ['Scientist','scientist','Scientist, you study moon rocks and ice. Hold up your magnifier.'],
    ['Radio Operator','radio','Radio Operator, you talk to Earth. Put on your headset.']
  ];
  // One drawing per meaning, shared by the buttons and both story maps.
  const ICONS = {
    battery:'<circle cx="12" cy="12" r="6" fill="#f2b632"/><path d="M12 2V0M2 12H0M4 4L2 2M20 4L22 2"/>' +
      '<rect x="13" y="23" width="29" height="20" rx="3" fill="#76959d"/><path d="M21 23V20H34V23"/>' +
      '<path d="M19 28V38M26 28V38M33 28V38" stroke="#ffe69a" stroke-width="4"/>',
    moon:'<path d="M33 5C12 1 2 24 16 38C25 47 39 41 43 31C20 39 16 14 33 5Z" fill="#b7c8d9"/>',
    ice:'<path d="M6 12L26 4L43 14V36L22 44L6 33Z" fill="#7ed1ed"/><path d="M6 12L22 23L43 14M22 23V44"/>' +
      '<path d="M13 16L17 19M29 28L36 25M12 27L17 31" stroke="#f0fcff"/>',
    wave:'<path d="M3 17Q9 8 15 17T27 17T39 17M3 28Q9 19 15 28T27 28T39 28M3 39Q9 30 15 39T27 39T39 39" ' +
      'fill="none" stroke="#227d9f" stroke-width="4"/>',
    blanket:'<path d="M5 13L33 5L43 32L15 43L5 36Z" fill="#db9a55"/><path d="M5 13L15 35L43 25M15 35V43"/>' +
      '<path d="M13 14L20 29M22 11L29 26M31 9L36 22M9 23L37 14" stroke="#ffe1a1"/>',
    door:'<path d="M7 43V5H39V43" fill="#94a7b8"/><path d="M12 9L32 15V43H12Z" fill="#e5edf2"/>' +
      '<circle cx="27" cy="30" r="2" fill="#f2b632"/><path d="M2 43H46"/>'
  };
  function icon(key) {
    return '<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="#263b4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' + ICONS[key] + '</svg>';
  }
  const BEATS = [
    null,
    {name:'Long night', art:'base', icon:'☾',
      radio:'Moon Base Luna, this is Mission Control. On the Moon, daylight lasts about two weeks, ' +
        'and the night lasts about two weeks too. The long night begins soon.',
      ada:'Crew! When the Sun goes down, our greenhouse gets no sunlight for two whole weeks. What do our plants need?'},
    {name:'Greenhouse', art:'greenhouse', icon:'🌱',
      radio:'Your plants need light, water, warmth and air. Right now, every meter is low.',
      ada:'We have three jobs before dark. Ready, crew?'},
    {name:'Batteries', art:'solar', icon:'⚡', choice:0,
      radio:'Our solar panels make power only while the Sun shines.', ada:'How do we keep the plant lamps on all night?',
      choices:[['battery','Fill the batteries now!',
        'Good thinking. The Sun is shining now, so the panels can fill the batteries.',2],
      ['moon','Wait until dark','Mission Control here. Remember: no Sun at night means no solar power. Your batteries are low.',0]]},
    {name:'Water', art:'crater', icon:'💧', choice:1,
      radio:'Your water tank is low. Scientists found ice hiding in dark craters near the Moon\'s south pole.', ada:'Where can we get water?',
      choices:[['ice','Ice in the dark crater','Great. Rover Driver, steer to the crater. Scientist, find the ice!',2],
      ['wave','A river','Mission Control here. Our maps show no rivers on the Moon. We found ice in the dark crater late, so our tank is still low.',1]]},
    {name:'Lift the ice', art:'crater', icon:'🧊',
      radio:'The ice block is heavy. But on the Moon, things weigh only about one sixth as much as on Earth.',
      ada:'Who can carry it? Show me how you lift it on the Moon!'},
    {name:'Warmth', art:'airlock', icon:'☀', choice:2,
      radio:'Moon nights are colder than a home freezer, and there is no air to breathe outside the base.', ada:'How do we keep the plants warm?',
      choices:[['blanket','Wrap the greenhouse in a blanket','Yes! A thick blanket keeps the warmth in.',2],
      ['door','Open the doors for air','Careful! There is no air outside. Opening the doors would let our air out. Engineer, shut them fast!',0]]},
    {name:'Brush off', art:'airlock', icon:'✧',
      radio:'Moon dust is sharp and sticky. Brush off your suits before you go inside.',
      ada:'Medic, check the crew. Everyone, brush off the dust!'},
    {name:'Night arrives', art:'greenhouse', icon:'☾', ada:'Crew, which choice made the biggest difference? Tell me why.'}
  ];
  const L = {
    welcome:'Mission Control to Moon Base Luna. Teacher, you are Commander Ada. Tap a job badge for each crew member.',
    premise:'Mission Control to Moon Base Luna. Teacher, you are Commander Ada. The class is your moon base crew.',
    crewHint:'Tap a job badge. Show the crew your prop.',
    ready:'When the crew is ready, tap Start mission.',
    choose:'Commander, read your card. When the crew answers, tap their choice.',
    next:'When the crew is done, tap Next.',
    old:'The old story fades. Tap a choice to make a new one.',
    map:'Tap a past choice in the story map to rewind.',
    mapEmpty:'No past choice is ready to rewind. Tap Back to the story.',
    reflect:'Tell Ada which choice helped. Tap New mission, or Rewind to try another way.',
    locked:'Tap Rewind to try a different crew line.',
    endFull:'Mission Control to Moon Base Luna. The long night is here, and your greenhouse is glowing. Great work, crew!',
    endTwo:'The long night is here. The greenhouse is OK, but one part is low. Can you rewind and fix it?',
    endLow:'The long night is here, and the plants are droopy. Rewind and make a different choice!',
    rewind3:'Rewinding to the batteries. What will you say this time?',
    rewind4:'Rewinding to the water. What will you say this time?',
    rewind6:'Rewinding to the warmth. What will you say this time?'
  };
  JOBS.forEach((j,i) => L['job' + i] = j[2]);
  BEATS.forEach((b,i) => {
    if (!b) return;
    if (b.radio) L['beat' + i] = b.radio;
    if (b.choices) {
      b.choices.forEach((c,j) => L['result' + i + j] = c[2]);
      [0,1].forEach(order => {
        const words = [0,1].map(j => b.choices[j ^ order][1].replace(/[!.]$/,''));
        L['options' + i + order] = 'Crew, you could say: ' + words[0] + '. Or: ' + words[1] + '.';
        L['choiceBeat' + i + order] = b.radio + ' ' + L['options' + i + order];
      });
    }
  });
  L.missionIntro = L.premise + ' ' + L.beat1;
  L.readCrewEmpty = L.welcome + ' ' + L.crewHint;
  L.readCrewReady = L.premise + ' ' + L.ready;
  [3,4,6].forEach(beat => [0,1].forEach(order => {
    L['rewindChoice' + beat + order] = L['rewind' + beat] + ' ' + L['choiceBeat' + beat + order];
  }));
  // Put a step's first instruction inside its transmission, ahead of the story line.
  // A fast Next or choice can cut a long message, but cannot strand a separate how-to behind it.
  const guided = {};
  function guide(howKey,eventKey,after=false) {
    const key = howKey + '_' + eventKey;
    L[key] = after ? L[eventKey] + ' ' + L[howKey] : L[howKey] + ' ' + L[eventKey];
    guided[key] = howKey;
    return key;
  }
  JOBS.forEach((_,i) => guide('ready','job' + i));
  BEATS.forEach((b,i) => {
    if (!b || i < 2 || i === 8) return;
    guide(b.choices ? 'choose' : 'next','beat' + i);
    if (b.choices) {
      [0,1].forEach(order => guide('choose','choiceBeat' + i + order));
      [0,1].forEach(order => guide('old','rewindChoice' + i + order));
      b.choices.forEach((_,j) => guide('next','result' + i + j));
      guide('old','rewind' + i);
    }
  });
  ['endFull','endTwo','endLow'].forEach(key => guide('reflect',key,true));
  const heardHow = key => V.heard(key) || Object.keys(guided).some(k => guided[k] === key && V.heard(k));
  const choiceOrder = () => Object.fromEntries([3,4,6].map(beat => [beat,Math.random() < .5 ? 0 : 1]));
  const state = {mode:'crew', beat:1, jobs:[], choices:{}, oldChoices:{}, order:choiceOrder(),
    visited:1, card:true, caption:L.welcome, map:false, revisionPrompt:false, rewoundBeat:null};
  let revision = 0;
  let noise = null;
  let activeRead = null;
  const V = Curio.voice({
    lines:L, scope:() => state.mode + ':' + state.beat,
    welcome:() => V.heard('welcome') || V.heard('premise') || V.heard('missionIntro') ? null :
      state.jobs.length ? 'premise' : ['welcome', {valid:() => !state.jobs.length}],
    speaks:'.job, #start, #next, #back, .choice, .map-options button',
    hint:false, read:readText
  });
  function meterValues() {
    const values = [1,1,1];
    [3,4,6].forEach((b,i) => {
      if (b <= state.beat && state.choices[b] !== undefined) values[i] += BEATS[b].choices[state.choices[b]][3];
    });
    return values;
  }
  function endingKey() {
    const full = meterValues().filter(n => n === 3).length;
    return full === 3 ? 'endFull' : full === 2 ? 'endTwo' : 'endLow';
  }
  function missionLine() {
    if (state.beat === 8) return L[endingKey()];
    const selected = state.choices[state.beat];
    return selected === undefined ? L[beatKey()] : BEATS[state.beat].choices[selected][2];
  }
  function beatKey() {
    return BEATS[state.beat].choices && state.choices[state.beat] === undefined ?
      'choiceBeat' + state.beat + state.order[state.beat] : 'beat' + state.beat;
  }
  function readText() {
    if (state.map) return hintText();
    if (state.mode === 'mission') return missionLine();
    return state.jobs.length ? L.readCrewReady : L.readCrewEmpty;
  }
  function stop() {
    revision++;
    activeRead = null;
    V.hush();
    if (noise) {
      try { noise.stop(); } catch {}
      noise = null;
    }
    $('radio').classList.remove('on');
  }
  function crackle() {
    if (!Curio.sound || !V.tapped) return;
    const ctx = Curio.audio();
    if (!ctx) return;
    const length = Math.floor(ctx.sampleRate * .2);
    const buffer = ctx.createBuffer(1,length,ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0; i<length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    filter.type = 'bandpass';
    filter.frequency.value = 1800;
    filter.Q.value = .7;
    gain.gain.value = .035;
    source.buffer = buffer;
    source.connect(filter).connect(gain).connect(ctx.destination);
    source.start();
    noise = source;
  }
  function speak(key,howKey) {
    if (howKey && !heardHow(howKey)) key = howKey + '_' + key;
    state.caption = L[key] || key;
    $('caption').textContent = state.caption;
    crackle();
    const rev = revision;
    V.say(key,{valid:() => rev === revision});
  }
  function hintText() {
    if (state.map) return [3,4,6].some(canRewind) ? L.map : L.mapEmpty;
    if (state.mode === 'crew') return state.jobs.length ? L.ready : L.crewHint;
    if (state.beat === 8) return L.reflect;
    if (state.revisionPrompt) return L.locked;
    const b = BEATS[state.beat];
    return b.choices && state.choices[state.beat] === undefined ? L.choose : L.next;
  }
  function instructionKey() {
    if (state.mode === 'crew') return state.jobs.length ? 'ready' : null;
    if (state.beat === 8) return 'reflect';
    if (state.beat === 1) return null;
    return BEATS[state.beat].choices && state.choices[state.beat] === undefined ? 'choose' : 'next';
  }
  function how() {
    $('hint').textContent = hintText();
    const rev = revision;
    const valid = () => rev === revision;
    const pending = key => V.queue.some(item => guided[item.key] === key);
    if (state.mode === 'crew' && state.jobs.length) {
      if (!heardHow('ready') && !pending('ready')) V.how('ready',{valid,needs:'#start'});
    } else if (state.mode === 'mission' && state.beat > 1 && state.beat < 8) {
      const choosing = BEATS[state.beat].choices && state.choices[state.beat] === undefined;
      const key = choosing ? 'choose' : 'next';
      if (!heardHow(key) && !pending(key)) V.how(key,{valid,needs:choosing ? '#choice-a' : '#next'});
    }
  }
  JOBS.forEach((j,i) => {
    const button = document.createElement('button');
    button.className = 'job';
    button.id = 'job-' + i;
    button.setAttribute('aria-pressed','false');
    button.innerHTML = '<img alt=""><span class="job-word"></span><span class="check" aria-hidden="true">✓</span>';
    button.querySelector('img').src = ART[j[1]];
    button.querySelector('.job-word').textContent = j[0];
    button.onclick = () => {
      stop();
      if (!state.jobs.includes(i)) state.jobs.push(i);
      render();
      Curio.tone(480 + i * 60,.09,.04);
      speak('job' + i,'ready');
      how();
    };
    $('jobs').append(button);
  });
  const mapNodes = BEATS.slice(1).map((b,i) => {
    const node = document.createElement('div');
    node.className = 'map-node' + (b.choices ? ' choice-node' : '');
    node.setAttribute('role','listitem');
    node.innerHTML = '<span class="map-dot" aria-hidden="true"><span></span></span><span class="node-label"></span>';
    node.querySelector('.node-label').textContent = b.name;
    $('map-strip').append(node);
    return node;
  });
  const meterEls = ['💡 Light','💧 Water','☀ Warm'].map(label => {
    const meter = document.createElement('div');
    meter.className = 'meter';
    meter.innerHTML = '<div class="meter-label"></div><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>';
    meter.querySelector('.meter-label').textContent = label;
    $('meters').append(meter);
    return meter;
  });
  const rewindButtons = [3,4,6].map(b => {
    const button = document.createElement('button');
    button.id = 'rewind-' + b;
    button.innerHTML = '<span aria-hidden="true"></span>' + BEATS[b].name;
    button.onclick = () => {
      closeMap(false);
      goBeat(b,true);
    };
    $('map-options').append(button);
    return button;
  });
  $('rover-vehicle').src = ART.rover;
  $('rover-cargo').src = ART.ice;
  $('ice').src = ART.ice;
  $('painted-leaves').setAttribute('href',ART.planter);
  $('painted-tray').setAttribute('href',ART.planter);
  const REACTIONS = {
    3:['Good plan, Engineer! Store that sunshine.','Hmm. Should we rewind and try again?'],
    4:['Great work, Rover Driver! Bring it home.','Our tank is still low. Shall we rewind and find more ice?'],
    6:['That keeps our warmth in. Well done, crew!','Engineer, shut those doors! Shall we rewind?']
  };
  function canRewind(beat) {
    return beat <= state.visited && (beat < state.beat || state.choices[beat] !== undefined);
  }
  function render() {
    const crew = state.mode === 'crew';
    const b = BEATS[state.beat];
    const choice = state.choices[state.beat];
    const choosing = !crew && b.choices;
    $('stage').classList.toggle('choosing',Boolean(choosing));
    const values = meterValues();
    $('backdrop').src = ART[crew ? 'base' : b.art];
    $('jobs').hidden = !crew;
    $('crew-title').hidden = !crew;
    $('meters').hidden = crew || state.beat === 1;
    $('beat-tag').hidden = crew;
    $('beat-tag').textContent = state.beat + ' / 8 · ' + b.name;
    $('map-strip').hidden = crew;
    $('controls').classList.toggle('crew-controls',crew);
    ['back','again','rewind','next'].forEach(id => $(id).hidden = crew);
    $('start').hidden = !crew;
    $('start').disabled = !state.jobs.length;
    $('next').disabled = Boolean(choosing && choice === undefined);
    $('next').textContent = state.beat === 8 ? '🚀 New mission' : '▶ Next';
    $('ada').hidden = !state.card;
    $('card').setAttribute('aria-pressed',String(state.card));
    let cardLine = crew ? 'Welcome to Moon Base Luna, crew! Tell me your job. Show me what you brought.' :
      choice !== undefined ? REACTIONS[state.beat][choice] : b.ada;
    const revising = !crew && state.rewoundBeat === state.beat && choice === undefined;
    if (revising) cardLine += ' Say the new line in your own words. What will you tell me?';
    $('ada').classList.toggle('revising',revising);
    $('ada-line').textContent = cardLine;
    JOBS.forEach((_,i) => $('job-' + i).setAttribute('aria-pressed',String(state.jobs.includes(i))));
    ['crew','mission'].forEach(m => $('m-' + m).setAttribute('aria-pressed',String(state.mode === m)));
    $('choices').hidden = !choosing;
    if (choosing) [0,1].forEach(i => {
      const button = $(i ? 'choice-b' : 'choice-a');
      const value = i ^ state.order[state.beat];
      button.dataset.choice = value;
      button.querySelector('.choice-icon').innerHTML = icon(b.choices[value][0]);
      button.querySelector('.choice-word').textContent = b.choices[value][1];
      button.setAttribute('aria-pressed',String(choice === value));
      button.classList.toggle('other',choice !== undefined && choice !== value);
    });
    meterEls.forEach((el,i) => {
      el.setAttribute('aria-label',['Light','Water','Warm'][i] + ': ' + values[i] + ' of 3');
      el.querySelectorAll('.dot').forEach((dot,j) => dot.classList.toggle('full',j < values[i]));
    });
    mapNodes.forEach((node,i) => {
      const n = i + 1;
      node.classList.toggle('current',n === state.beat);
      node.classList.toggle('future',n > state.beat);
      const chosen = state.choices[n] ?? state.oldChoices[n];
      node.querySelector('.map-dot').classList.toggle('old-icon',state.choices[n] === undefined && chosen !== undefined);
      node.querySelector('.map-dot span').innerHTML = chosen === undefined ? String(n) : icon(BEATS[n].choices[chosen][0]);
      const status = n > state.beat ? 'future or old story' :
        chosen !== undefined && state.choices[n] === undefined ? 'old choice, choose again' :
        n === state.beat ? 'current' : 'visited';
      node.setAttribute('aria-label',BEATS[n].name +
        (chosen === undefined ? '' : ': ' + BEATS[n].choices[chosen][1]) + ', ' + status);
    });
    rewindButtons.forEach((button,i) => {
      const n = [3,4,6][i];
      button.disabled = !canRewind(n);
      const chosen = state.choices[n] ?? state.oldChoices[n];
      button.querySelector('span').innerHTML = chosen === undefined ? String(n) : icon(BEATS[n].choices[chosen][0]);
      button.setAttribute('aria-label','Rewind to ' + BEATS[n].name +
        (chosen === undefined ? '' : ': ' + BEATS[n].choices[chosen][1]));
    });
    $('map-instruction').textContent = [3,4,6].some(canRewind) ?
      'Tap a past choice. Say a different line and watch what changes.' : L.mapEmpty;
    const night = !crew && state.beat === 8;
    $('night').classList.toggle('active',night);
    $('night').style.opacity = night ? String(.28 + (3 - values[0]) * .21) : '0';
    $('backdrop').style.filter = night ?
      'brightness(' + (.9 - (3 - values[0]) * .17) + ') saturate(' +
      ((.25 + values[0] * .2) * (values[1] < 3 ? .22 : 1)) + ')' +
      (values[1] < 3 ? ' sepia(.45)' : '') : '';
    $('chill').style.opacity = night && values[2] < 3 ? '.8' : '0';
    $('grow-lamps').classList.toggle('active',night);
    document.querySelectorAll('.lamp-beam').forEach((el,i) => el.toggleAttribute('hidden',i >= values[0]));
    document.querySelectorAll('.lamp-dark').forEach((el,i) => el.toggleAttribute('hidden',i + 1 < values[0]));
    show('leaf-layer',night);
    $('leaf-layer').classList.toggle('droopy',values[1] < 3 || values[2] < 3);
    $('leaf-layer').classList.toggle('cold-only',values[1] === 3 && values[2] < 3);
    $('leaf-layer').style.filter = night ?
      'brightness(' + (.65 + values[0] * .13) + ') saturate(' + (.25 + values[0] * .2) + ')' : '';
    $('rover').hidden = crew || state.beat !== 4;
    $('rover-cargo').hidden = crew || state.beat !== 4 || choice === undefined;
    $('rover').classList.toggle('late',state.beat === 4 && choice === 1);
    $('ice').hidden = crew || state.beat !== 5;
    $('ice').classList.toggle('float',!crew && state.beat === 5);
    const response = !crew && choice !== undefined && [3,6].includes(state.beat);
    show('response-object',response);
    show('battery-picture',state.beat === 3);
    show('warm-picture',state.beat === 6 && choice === 0);
    show('air-picture',state.beat === 6 && choice === 1);
    show('charge-path',choice === 0);
    document.querySelectorAll('.battery-cell').forEach((el,i) => el.setAttribute('fill',i < values[0] ? '#f2b632' : '#273b4a'));
    $('caption').textContent = state.caption;
    $('hint').textContent = hintText();
  }
  function setMode(mode) {
    if (mode === 'mission' && !state.jobs.length) {
      stop();
      $('hint').textContent = L.crewHint;
      V.how('crewHint',{needs:'#job-0'});
      $('job-0').focus({preventScroll:true});
      return;
    }
    const fromStart = document.activeElement === $('start');
    const fromMissionBar = ['back','again','rewind','next'].some(id => document.activeElement === $(id));
    stop();
    state.revisionPrompt = false;
    state.mode = mode;
    state.caption = mode === 'crew' ? (state.jobs.length ? L.premise : L.welcome) : missionLine();
    render();
    if (fromStart && mode === 'mission') $('next').focus({preventScroll:true});
    if (fromMissionBar && mode === 'crew') $('m-crew').focus({preventScroll:true});
    if (mode === 'crew') V.welcome();
    else speak(state.beat === 8 ? endingKey() : state.beat === 1 &&
      !V.heard('welcome') && !V.heard('premise') && !V.heard('missionIntro') ? 'missionIntro' :
      state.choices[state.beat] === undefined ? beatKey() :
      'result' + state.beat + state.choices[state.beat],instructionKey());
    how();
  }
  function invalidateFrom(beat) {
    state.visited = beat;
    Object.keys(state.choices).forEach(key => {
      if (+key >= beat) {
        state.oldChoices[key] = state.choices[key];
        delete state.choices[key];
      }
    });
  }
  function goBeat(beat,rewound=false) {
    if (rewound && !canRewind(beat)) return;
    stop();
    state.revisionPrompt = false;
    const choiceFocused = $('choices').contains(document.activeElement);
    const previous = state.beat;
    state.rewoundBeat = rewound || beat < previous ? beat : null;
    if (beat < previous || rewound) invalidateFrom(beat);
    state.beat = beat;
    state.visited = Math.max(state.visited,beat);
    render();
    if (choiceFocused && !BEATS[beat].choices) $('next').focus({preventScroll:true});
    if ($('next').disabled && document.activeElement === $('next')) $('choice-a').focus({preventScroll:true});
    if (rewound) $('choice-a').focus({preventScroll:true});
    $('rover').classList.remove('drive');
    speak(rewound ? 'rewindChoice' + beat + state.order[beat] : beat === 8 ? endingKey() : beatKey(),
      rewound ? 'old' : instructionKey());
    if (!rewound) how();
    $('hint').textContent = hintText();
  }
  function choose(value) {
    if (state.mode !== 'mission' || !BEATS[state.beat].choices) return;
    stop();
    const beat = state.beat;
    if (state.choices[beat] !== undefined && state.choices[beat] !== value) {
      state.revisionPrompt = true;
      $('hint').textContent = L.locked;
      V.how('locked',{needs:'#rewind'});
      Curio.tone(230,.1,.04);
      return;
    }
    state.revisionPrompt = false;
    state.rewoundBeat = null;
    invalidateFrom(beat);
    state.choices[beat] = value;
    // A new branch replaces every later choice. Ghost nodes remain until that beat is visited again.
    Object.keys(state.oldChoices).forEach(key => { if (+key === beat) delete state.oldChoices[key]; });
    render();
    Curio.tone(value ? 230 : 650,.1,.04);
    if (beat === 4) {
      $('rover').classList.remove('drive');
      void $('rover').offsetWidth;
      $('rover').classList.add('drive');
    }
    speak('result' + beat + value,'next');
    how();
  }
  function next() {
    if (state.mode !== 'mission' || $('next').disabled) return;
    if (state.beat === 8) newMission();
    else goBeat(state.beat + 1);
  }
  function back() {
    if (state.mode !== 'mission') return;
    if (state.beat === 1) setMode('crew');
    else goBeat(state.beat - 1);
  }
  function openMap() {
    stop();
    state.map = true;
    render();
    $('map-dialog').showModal();
    const firstChoice = rewindButtons.find(b => !b.disabled);
    V.how(firstChoice ? 'map' : 'mapEmpty',{needs:firstChoice ? '#' + firstChoice.id : '#close-map'});
  }
  function closeMap(restore=true) {
    stop();
    state.map = false;
    $('map-dialog').close();
    $('hint').textContent = hintText();
    if (restore) $('rewind').focus({preventScroll:true});
  }
  function newMission() {
    if (state.map) closeMap(false);
    stop();
    state.mode = 'mission';
    state.beat = 1;
    state.choices = {};
    state.oldChoices = {};
    state.order = choiceOrder();
    state.revisionPrompt = false;
    state.rewoundBeat = null;
    state.visited = 1;
    render();
    $('next').focus({preventScroll:true});
    speak('beat1');
    how();
  }
  $('m-crew').onclick = () => setMode('crew');
  $('m-mission').onclick = () => setMode('mission');
  $('start').onclick = () => setMode('mission');
  $('next').onclick = next;
  $('back').onclick = back;
  $('choice-a').onclick = () => choose(Number($('choice-a').dataset.choice));
  $('choice-b').onclick = () => choose(Number($('choice-b').dataset.choice));
  $('again').onclick = () => {
    stop();
    speak(state.beat === 8 ? endingKey() : state.choices[state.beat] === undefined ? beatKey() :
      'result' + state.beat + state.choices[state.beat]);
  };
  $('card').onclick = () => {
    stop();
    state.card = !state.card;
    render();
    Curio.tone(420,.06,.025);
  };
  $('rewind').onclick = openMap;
  $('close-map').onclick = () => closeMap();
  $('map-read').onclick = () => V.read();
  $('new-mission').onclick = newMission;
  $('map-dialog').addEventListener('cancel',e => {
    e.preventDefault();
    closeMap();
  });
  document.addEventListener('keydown',e => {
    if (state.map || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      next();
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      back();
    }
    if (e.key.toLowerCase() === 'r' && state.mode === 'mission') {
      e.preventDefault();
      openMap();
    }
    if (e.key.toLowerCase() === 'a') {
      e.preventDefault();
      $('card').click();
    }
  });
  document.addEventListener('pointerdown',e => {
    if (e.target.closest('button')) stop();
  },true);
  Curio.init({clips:"voice:*",rate:.9});
  // The kit exposes event playback, but not Read's completion. Keep this small Read adapter
  // on kit playback so both recorded audio and browser speech clear the lamp on completion.
  function readRadio() {
    stop();
    const text = readText();
    const rev = revision;
    activeRead = text;
    state.caption = text;
    V.log.push({t:Math.round(performance.now()),key:'read',kind:'read',text,as:'read'});
    crackle();
    Curio.say(text,true).finally(() => { if (revision === rev) activeRead = null; });
  }
  $('read').onclick = readRadio;
  $('map-read').onclick = readRadio;
  const motionClick = $('motion').onclick;
  $('motion').onclick = () => {
    stop();
    motionClick();
  };
  // Event playback and the Read adapter both follow the kit, including recorded audio.
  function radioState() {
    const playing = V.playing || activeRead;
    $('radio').classList.toggle('on',playing);
    let caption = playing || state.caption;
    // Compact choice screens already show the how-to in the hint and rewind request on Ada's card.
    // Keep the complete fact and both options in the radio without repeating those two instructions there.
    if (innerWidth >= 600 && innerHeight <= 640 && state.mode === 'mission' &&
      BEATS[state.beat].choices && state.choices[state.beat] === undefined && !state.map &&
      caption.includes(BEATS[state.beat].radio)) caption = missionLine();
    if ($('caption').textContent !== caption) $('caption').textContent = caption;
    requestAnimationFrame(radioState);
  }
  requestAnimationFrame(radioState);
  const layoutPanels = () => {
    $('stage').style.setProperty('--radio-height',$('radio').getBoundingClientRect().height + 'px');
    $('stage').style.setProperty('--card-height',$('ada').hidden ? '0px' : $('ada').getBoundingClientRect().height + 'px');
  };
  const panelObserver = new ResizeObserver(layoutPanels);
  panelObserver.observe($('radio'));
  panelObserver.observe($('ada'));
  window.__tool = {state,setMode,allLines:V.allLines,vlog:V.log,get vq() { return V.queue; },
    meterValues,endingKey,goBeat,choose,next,back,newMission};
  render();
})();
</script>
</body>
</html>
