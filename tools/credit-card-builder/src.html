<link rel="stylesheet" href="kit:curio">
<style>
:root {
  --paper:#f6efe3; --panel:#fffdf8; --ink:#2a2118; --muted:#6a5a48; --line:#e5d9c5;
  --brand:#b91c1c; --btn:#b91c1c; --btn-line:#e99883; --head-ink:#ffffff; --focus:#1d4ed8;
}
body {height:100dvh; min-height:0; overflow:hidden; grid-template-rows:auto auto minmax(0,1fr);}
header {padding:10px 20px; gap:10px; background:linear-gradient(110deg,#8c1918,#b91c1c 65%,#a81f1b);
  box-shadow:0 3px 7px #5b271b35; z-index:3;}
h1 {font:700 29px/1.1 Georgia,serif; letter-spacing:-.02em;}
h1 small {font-size:13px; margin-top:4px; letter-spacing:.035em;}
.seg {border-radius:7px; border-width:1px;}
.seg button,.icon-btn {min-height:44px; font-size:14px; padding:0 12px;}
.icon-btn {border-width:1px; border-radius:7px; min-width:44px;}
#sound {min-width:90px;}
#motion {min-width:98px;}
.seg button[aria-pressed=true] {background:#fff5da; color:#8d1d18;}
header :focus-visible {outline-color:#ffe194;}
button {min-height:44px;}
.projects {display:flex; padding:8px 20px; gap:10px; background:#e9d8bd;
  border-bottom:1px solid #c5ad88; box-shadow:inset 0 2px #fff9e5;}
.project-tab {flex:1; max-width:350px; border:1px solid #bba783; background:#fffaf0; border-radius:4px 10px 0 0;
  text-align:left; padding:5px 14px; box-shadow:2px 2px 0 #806e4d19; font-weight:750; font-size:15px;}
.project-tab small {float:right; color:var(--muted); font-size:12px; padding-top:3px;}
.project-tab[aria-pressed=true] {border-bottom:3px solid var(--brand); color:var(--brand); background:#fffdf8;}
.project-tab.complete small {background:#166534; color:#fff; padding:3px 7px; border-radius:2px;}
main {grid-template-columns:minmax(0,1fr) 325px; gap:0; padding:0;}
.stage {min-height:0; padding:18px 22px 22px; background:radial-gradient(ellipse at 30% 20%,#f9eacd,#dcc29c);
  display:flex; flex-direction:column; gap:12px; isolation:isolate;}
.stage::before {content:""; position:absolute; inset:0; opacity:.23; z-index:-1;
  background:repeating-linear-gradient(3deg,transparent 0 3px,#bba17828 4px 5px); pointer-events:none;}
.desk-label {font-size:11px; font-weight:800; letter-spacing:.16em; color:#6d4e32; text-transform:uppercase;}
.piece-row {display:flex; gap:8px; flex:none;}
#pieces {order:1;}
#build-work {order:2;}
.piece {flex:1; border:1px dashed #9b825e; border-radius:5px; padding:7px 12px; background:#fffaf0;
  text-align:left; font-size:13px; box-shadow:0 3px 4px #65492a12;}
.piece[aria-pressed=true] {outline:2px solid var(--brand); outline-offset:1px;}
.piece b {font-size:13px; margin-right:6px;}
.piece span {font-size:11px; color:var(--muted);}
.piece.made {border-style:solid;}
.piece.found {border:2px solid #166534; color:#166534;}
.piece.found span {color:#166534;}
.build-work {flex:1; min-height:0; display:grid; grid-template-columns:148px minmax(0,1fr); gap:22px;}
.mini-project {align-self:center; padding:15px 10px; background:#fffdf4; transform:rotate(-3deg);
  box-shadow:4px 9px 16px #67472539; position:relative; border:1px solid #d6c8a9;}
.mini-project::before {content:""; position:absolute; width:60px; height:18px; background:#f1d69fa3;
  left:calc(50% - 30px); top:-8px; transform:rotate(5deg);}
.mini-project h2 {font:700 19px Georgia,serif; text-align:center; margin:6px 0 12px;}
.mini-project p {font-size:11px; line-height:1.5; padding-bottom:8px; border-bottom:1px solid #dac8a9;}
.mini-project img {width:100%; aspect-ratio:4/3; object-fit:cover; border:4px solid #fff; box-shadow:1px 2px 5px #39281938;}
.mini-project small {font-size:10px; color:var(--muted);}
.mini-project.slides {background:transparent; box-shadow:none; border:0; padding:0; transform:none;}
.mini-project.slides::before {display:none;}
.mini-slide {background:#fffdf4; border:1px solid #d3bf96; padding:8px; margin:7px 0;
  box-shadow:3px 4px 5px #67472530; transform:rotate(-2deg);}
.mini-slide:nth-child(2) {transform:rotate(2deg);}
.mini-slide p {font-size:10px; border:0; margin:5px 0; padding:0;}
.mini-slide img {height:75px; object-fit:cover;}
.mini-project.report {background:repeating-linear-gradient(#fffdf4 0 21px,#d5e2e3 22px,#fffdf4 23px); transform:rotate(2deg);}
.viewer {min-width:0; min-height:0; display:flex; flex-direction:column; position:relative; border-radius:7px;
  box-shadow:3px 8px 20px #60422340,0 0 0 1px #9c815c60; background:#fffdf4; overflow:hidden;}
.viewer-bar {display:flex; align-items:center; justify-content:space-between; padding:6px 14px;
  background:#faf4e6; border-bottom:1px solid #dfcfb4; min-height:32px; color:#6b5439; font-size:11px;
  font-weight:800; letter-spacing:.12em; text-transform:uppercase;}
.viewer-bar i {width:7px; height:7px; border-radius:50%; background:#be9c4e; box-shadow:0 0 0 4px #eedda5; animation:glimmer 3s infinite;}
@keyframes glimmer {50% {box-shadow:0 0 0 6px #eedda540;}}
.source {flex:1; min-height:0; position:relative; overflow:auto;}
.chip {border:1px solid transparent; background:transparent; border-radius:4px; padding:5px 9px; line-height:1.25;
  font-size:15px; text-align:inherit; overflow-wrap:anywhere; min-width:44px; position:relative;}
.chip:hover {background:#ffedb0bb; border-color:#af8742; box-shadow:0 2px 0 #9b793833;}
.chip:active {background:#f8db8c;}
.chip:focus-visible {z-index:2;}
.book-cover {height:100%; min-height:290px; max-width:540px; margin:auto; position:relative; background:#f9f2df;}
.book-cover > img {width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
.cover-band {position:relative; padding:13px 18px 8px; display:flex; align-items:center; flex-direction:column;
  background:linear-gradient(#fff7e8f5 82%,#fff7e800); min-height:43%; text-align:center;}
.cover-title {font:700 clamp(22px,2.6vw,38px)/1.05 Georgia,serif;}
.cover-band .chip {display:block;}
.cover-band .byline {display:flex; justify-content:center; align-items:center; flex-wrap:wrap; margin:0;}
.cover-band .series {font-size:12px; letter-spacing:.04em; border:1px solid #c2ad81; background:#fff5dc; min-height:44px;}
.page-nav {display:flex; align-items:center; justify-content:center; gap:16px; padding:5px; background:#fff9eb;
  border-top:1px solid #ddcbaa; min-height:54px;}
.page-nav button {border:1px solid #c4b292; border-radius:5px; background:#fffdf6; min-width:44px; font-size:21px;}
.page-nav span {min-width:112px; text-align:center; font-size:13px; color:var(--muted);}
.text-page {min-height:100%; padding:24px; background:linear-gradient(90deg,#e3d3b8,#fff9e9 5%,#fffdf4 95%,#e6d8bd);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;}
.text-page h2 {margin:0; font:normal 32px Georgia,serif;}
.text-page p {margin:0; display:flex; flex-wrap:wrap; justify-content:center; align-items:center;}
.text-page .copyright {font-size:14px;}
.browser {padding:12px 20px 18px; min-height:100%; background:#fffdf8;}
.address {display:block; width:100%; min-height:44px; background:#f1eee5; border:1px solid #c5bda9; font-size:13px;
  text-align:left; font-family:Consolas,monospace;}
.site-name {font:bold 24px Georgia,serif; color:#265a52; margin-top:8px;}
.nav-chips {display:flex; gap:8px; border-bottom:1px solid #d8c8aa;}
.browser h2 {margin:9px 0 0; font:700 29px Georgia,serif;}
.browser h2 .chip {font:inherit;}
.browser p {margin:0 0 4px; line-height:1.5;}
.by-date {display:flex; flex-wrap:wrap; align-items:center;}
.ad {margin-top:12px; border:1px dashed #9f8359; background:#fff0c8; font-size:13px;}
.photo-view {padding:12px 18px; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  grid-template-rows:repeat(4,auto); gap:4px 14px; height:100%; min-height:0; align-content:center;}
.photo-view > img {grid-column:1; grid-row:1/5; width:100%; height:100%; max-height:400px; min-height:0;
  object-fit:cover; border:6px solid white;
  box-shadow:1px 3px 9px #43301b40;}
.photo-view h2 {margin:0; font:700 25px Georgia,serif;}
.photo-view h2,.photo-view p {grid-column:2;}
.photo-view h2 .chip {font:inherit;}
.photo-view p {margin:0; display:flex; align-items:center; flex-wrap:wrap;}
.photo-view .site-name {font-size:18px; margin:0;}
.panel {grid-column:2; grid-row:1; padding:16px 17px 10px; gap:12px; border-left:2px solid #cdb997;
  background:linear-gradient(100deg,#f9f0df,#fffdf8 10%); overflow:auto;}
.hint {font-size:15px; line-height:1.4; margin:0; height:72px; min-height:72px; overflow:auto; flex:none;}
.eyebrow {font-size:10px; letter-spacing:.15em; font-weight:800; color:var(--muted); text-transform:uppercase;}
.index-card {background:#fffbea; border:1px solid #cdb997; border-radius:3px; padding:12px;
  box-shadow:3px 5px 0 #d5c6a580,0 7px 14px #80674817; position:relative;}
.index-card::before {content:""; display:block; border-top:2px solid #d89784; margin:5px 0 8px;}
.index-card h2 {margin:0; font:normal 21px Georgia,serif;}
.slots {display:grid; gap:3px; margin-top:8px;}
.slots.web-slots {grid-template-columns:1fr 1fr;}
.slot-cell {min-width:0;}
.slot-cell .slot {width:100%;}
.slot-cell #access-date {width:100%;}
.web-slots .slot span {white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.slot {min-height:59px; border:1px solid transparent; border-bottom:1px solid #9cc3e6; background:transparent;
  padding:5px 6px; text-align:left; min-width:0;}
.slot small {display:block; color:var(--muted); font-size:11px; font-weight:650; margin-bottom:4px;}
.slot span {display:block; font-size:14px; overflow-wrap:anywhere; line-height:1.25;}
.slot[aria-pressed=true] {border:2px solid var(--brand); background:#fff4cf; border-radius:4px; box-shadow:0 0 0 3px #b91c1c12;}
.empty {color:#756d60; letter-spacing:.05em;}
.credit-line {font-size:13px; line-height:1.6; overflow-wrap:anywhere; margin:7px 0 0; min-height:62px;
  max-height:90px; overflow:auto;}
.credit-line .empty {letter-spacing:0;}
.actions {display:grid; grid-template-columns:1fr; gap:8px;}
.big-btn {min-height:50px; font-size:17px; border-radius:5px; box-shadow:0 4px 0 #7a1716;}
.secondary {border:1px solid #bfa884; background:#fffaf0; border-radius:4px; padding:4px 12px; font-size:13px;}
.footer {margin-top:auto; padding-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.footer small {font-size:10px; color:var(--muted); flex:1;}
#reset {padding:4px 7px; font-size:11px;}
.fly-chip {position:fixed; z-index:20; background:#fff2bb; border:1px solid #af8131; border-radius:4px; padding:8px;
  box-shadow:0 4px 12px #523d2933; pointer-events:none; font-size:14px;}
.trail {position:absolute; inset:0; padding:24px; background:#e5cda5; display:flex; flex-direction:column; gap:10px;}
.trail .piece-row {z-index:3;}
.trail-top {display:flex; align-items:center; justify-content:space-between; gap:10px; z-index:3;}
.trail-top h2 {margin:0; font:normal 27px Georgia,serif;}
.trail-scene {flex:1; min-height:0; position:relative; overflow:hidden; border-radius:8px;
  box-shadow:0 4px 15px #59391950; background:#fff9e9;}
.shelf-bg,.street-bg {position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.shelf-books {position:absolute; inset:14% 3% 36%; display:flex; gap:2%; align-items:end;}
.shelf-book {flex:1; height:100%; position:relative; min-width:0;}
.shelf-book img {width:100%; height:100%; object-fit:fill;}
.book-label {position:absolute; top:22%; left:14%; right:14%; bottom:30%; display:flex; flex-direction:column;
  gap:6px; justify-content:center; align-items:center; text-align:center; font-size:clamp(10px,1.05vw,16px); color:#302718;}
.book-label b {font-family:Georgia,serif;}
.book-label {background:linear-gradient(#fff8e5,#f4e3bb); padding:3px; border:1px solid #b29c6a; border-radius:3px;}
.book-label span {max-width:100%; overflow-wrap:anywhere;}
.shelf-book.match {filter:drop-shadow(0 0 9px #ffe081);}
.trail-path {position:absolute; left:5%; right:10%; bottom:19%; height:30%; border-bottom:3px dashed #fff5ce;
  border-radius:50%; filter:drop-shadow(1px 2px 0 #664b26);}
.reader {position:absolute; width:clamp(100px,19%,230px); left:3%; bottom:9%; z-index:4;
  filter:drop-shadow(2px 8px 5px #34250c55);}
.reader.flying {animation:journey 2s ease-in-out forwards;}
.reader.ended {left:65%; bottom:22%;}
.book-trail .reader.ended {bottom:20%; width:16%; max-width:160px; min-width:0;}
@keyframes journey {0% {left:3%; transform:rotate(-5deg);} 45% {bottom:40%; transform:rotate(7deg);} 100% {left:68%;}}
.result-paper {position:absolute; z-index:5; left:5%; right:5%; bottom:4%; padding:13px 17px;
  background:#fffbeaF5; border:2px solid #a5824c; box-shadow:0 3px 10px #50382038; border-radius:4px;}
.result-paper b {font:700 22px Georgia,serif; color:#7c3e16; margin-right:10px;}
.result-paper.good {border-color:#166534;}
.result-paper.good b {color:#166534;}
.result-paper p {font-size:14px; line-height:1.4; margin:5px 0 0;}
.destination {position:absolute; right:3%; bottom:22%; width:90px;}
.destination img {width:100%; display:block;}
.destination span {position:absolute; top:40%; left:5%; right:5%; background:#fff9e9; font-size:11px; text-align:center;}
.delivered {position:absolute; width:90px; right:10%; bottom:35%; z-index:6; animation:post 1s ease-in-out;}
.delivered.bounced {right:44%; bottom:22%; animation:bounce-post 1.2s ease-in-out;}
@keyframes bounce-post {
  0% {right:50%; bottom:60%; transform:rotate(-18deg);}
  55% {right:10%; bottom:35%; transform:rotate(0);}
  100% {right:44%; bottom:22%; transform:rotate(-25deg);}
}
@keyframes post {from {right:50%; bottom:60%; transform:rotate(-18deg) scale(1.3);} to {right:10%; bottom:35%;}}
.web-trail {position:absolute; inset:8% 8% 32%; display:flex; gap:12px; align-items:stretch;}
.web-route-card {flex:1; min-width:0; background:#fffdf8; border:1px solid #a4967a; box-shadow:3px 6px 0 #a58f6730;
  padding:15px; border-radius:7px; font-size:15px; overflow-wrap:anywhere;}
.web-route-card h3 {font:700 23px Georgia,serif; margin:8px 0;}
.web-route-card img {width:100%; height:60%; object-fit:contain; background:#f2e7d3;}
.web-route-card.good {outline:4px solid #166534;}
.route-grid {display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:16px;}
.route-mini {height:76px; border:1px solid #c3ad83; border-radius:3px; padding:9px 6px;
  background:linear-gradient(125deg,#fffdf4,#e8dcc4); box-shadow:2px 3px 0 #7a59351a; position:relative; overflow:hidden;}
.route-mini::before {content:''; display:block; width:62%; height:7px; background:#c3d7d2; margin-bottom:9px;
  box-shadow:0 15px 0 #d7c9aa,0 25px 0 #d7c9aa;}
.route-mini::after {content:''; position:absolute; top:0; left:0; right:0; height:5px; background:#8fafa4;}
.route-mini:nth-child(2n) {transform:rotate(2deg);}
.route-mini:nth-child(3n) {transform:rotate(-2deg);}
.photo-grid .route-mini {padding:4px; height:92px; background:#fffdf4;}
.photo-grid .route-mini::before,.photo-grid .route-mini::after {display:none;}
.photo-grid .route-mini img {height:100%; width:100%; object-fit:cover; background:#f0e0bf;}
.photo-grid .route-mini:nth-child(2n) img {object-position:left; transform:scale(1.25);}
.photo-grid .route-mini:nth-child(3n) img {object-position:right; filter:brightness(.86);}
.route-dots {height:13px; margin:-5px -5px 9px; border-bottom:1px solid #d8c6a3; color:#9e8160; letter-spacing:4px;}
.corner {position:absolute; inset:0; padding:20px; display:flex; flex-direction:column; gap:12px; overflow:hidden;}
.corner::before {content:""; position:absolute; inset:0; background:#fff6dc44; pointer-events:none;}
.why-cards {display:flex; gap:12px; position:relative;}
.why-cards p {flex:1; background:#fffaf0ed; border:1px solid #d2bc95; padding:12px; font-size:13px; line-height:1.4;
  margin:0; box-shadow:2px 4px 7px #5b492a25; transform:rotate(-1deg);}
.mail-street {position:relative; flex:1; min-height:0; display:grid; grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,minmax(0,1fr)); align-content:stretch;
  gap:14px 8px;}
.mailbox {position:relative; border:0; background:#fff9e63d; border-radius:7px; padding:0; min-width:0;
  height:100%; max-height:230px; padding-bottom:32px; display:flex; flex-direction:column; align-items:center; justify-content:end;}
.mailbox:hover {background:#fff9e6aa;}
.mailbox[aria-pressed=true] {box-shadow:0 0 0 3px #b91c1c; background:#fff9e6aa;}
.mailbox > img {height:100%; width:90%; object-fit:contain; filter:drop-shadow(2px 4px 2px #72502e40);}
.mailbox .tool-icon {position:absolute; width:34px; height:34px; bottom:28px; right:4px; object-fit:contain;}
.mailbox span {position:absolute; bottom:0; background:#fff8e5; border:1px solid #a48a5b; padding:2px 5px;
  font-size:11px; font-weight:700; border-radius:3px; max-width:100%; min-height:28px; line-height:1.2;}
.mailbox .post-mark {position:absolute; top:10%; right:2%; width:44px; height:35px; object-fit:contain;}
.team-cards {display:flex; gap:10px; position:relative;}
.team-card {flex:1; border:1px solid #b89c6e; background:#fffae9f0; border-radius:5px; padding:6px 12px; text-align:left;
  font-size:12px; display:flex; align-items:center; gap:10px;}
.team-card img {height:34px; width:44px; object-fit:contain;}
.team-card[aria-pressed=true] {outline:3px solid var(--brand); outline-offset:-3px;}
.creator-detail img.hero-mail {height:170px; width:100%; object-fit:contain; filter:drop-shadow(2px 7px 3px #795e3030);}
.creator-detail h2 {font:normal 24px Georgia,serif; margin:4px 0 8px;}
.creator-detail p {font-size:14px; line-height:1.5;}
.creator-detail {display:flex; flex-direction:column; gap:3px;}
.creator-detail .no-credit {order:-2;}
.creator-detail .mini-post {height:55px; width:80px; object-fit:contain; vertical-align:middle;}
.no-credit {width:100%; padding:10px; text-align:left; border:1px solid #b79d77; border-radius:4px; background:#fff6df;}
.no-credit[aria-checked=true] {background:#f0dfc9; border-color:#8b4f20;}
.unknown-project {border:1px dashed #97754a; background:#fffbea; padding:12px; font:700 19px Georgia,serif;}
.unknown-project {order:-1;}
.unknown-project img {width:70px; height:50px; object-fit:cover; float:right; margin-left:8px;}
.unknown-project small {display:block; font:12px/1.4 'Segoe UI',sans-serif; margin:4px 0;}
dialog {border:2px solid #ab8d61; border-radius:8px; background:#fffbea; max-width:310px; box-shadow:0 12px 50px #392b2380;}
dialog::backdrop {background:#31211566;}
dialog p {font-size:18px;}
dialog button {min-width:90px; margin:4px;}
.calm .reader.flying {animation:none; left:68%;}
.calm .viewer-bar i {animation:none;}
@media (max-height:900px) {
  .panel {display:grid; grid-template-columns:minmax(0,1fr) auto auto; grid-template-rows:auto auto auto auto;
    align-content:start;}
  .hint {grid-column:1/-1; grid-row:1;}
  #card-panel,#creator-detail {grid-column:1/-1; grid-row:2;}
  #card-actions,.footer {display:contents;}
  #test {grid-column:1; grid-row:3;}
  #clear {grid-column:2; grid-row:3;}
  #reset {grid-column:3; grid-row:3; align-self:stretch;}
  .footer small {grid-column:1/-1; grid-row:4;}
  .corner-mode .creator-detail {max-height:calc(100dvh - 355px); overflow:auto;}
  .actions {grid-template-columns:minmax(0,1fr) auto;}
  .big-btn {font-size:16px; padding:0 12px;}
  .index-card {padding:10px;}
  .slot {min-height:52px;}
  .credit-line {min-height:44px; max-height:60px; line-height:1.4;}
}
@media (min-width:1600px) {
  main {grid-template-columns:minmax(0,1fr) 380px;}
  .stage {padding:26px 35px;}
  .build-work {grid-template-columns:190px minmax(0,1fr); gap:35px;}
  .book-cover {max-width:650px;}
  .panel {padding:24px; gap:18px;}
  .slot {min-height:68px;}
  .slot span {font-size:16px;}
  .photo-view > img {max-height:520px;}
}
@media (max-height:650px), (max-width:1000px) {
  header {padding:6px 12px; gap:7px;}
  h1 {font-size:22px;}
  h1 small {display:none;}
  .seg button,.icon-btn {font-size:12px; padding:0 9px;}
  .projects {padding:4px 10px; gap:6px;}
  .project-tab {font-size:13px; padding:4px 8px;}

  }
  $('source').addEventListener('click', event => {
    const button = event.target.closest('[data-chip]');
    if (button) fill(button.dataset.chip,button);
    if (event.target.closest('#download')) {
      hint('Not needed for a credit. Tap a card slot, then a source detail.');
      Curio.tone(280,.08,.03);
    }
  });
  $('access-date').onclick = () => {
    if (state.trail) stopTrail();
    state.slot = 2;
    fill(accessDate(),$('access-date'));
  };
  function flip(direction) {
    V.dropQueued();
    state.page = (state.page + direction + 3) % 3;
    renderSource();
    hint(buildHint());
    Curio.tone(300 + state.page * 70,.05,.025);
  }
  $('prev').onclick = () => flip(-1);
  $('next').onclick = () => flip(1);
  $('test').onclick = startTrail;
  $('back').onclick = stopTrail;
  $('clear').onclick = () => {
    if (state.trail) stopTrail();
    V.hush();
    card().slots.fill('');
    card().found = false;
    card().made = true;
    showCard();
    save();
    hint('Card cleared. Tap a slot, then a detail on the source.');
    Curio.tone(250,.07,.03);
  };
  $('m-build').onclick = () => {
    if (state.mode === 'build' && !state.trail) V.welcome();
    else setMode('build');
  };
  $('m-corner').onclick = () => {
    if (state.mode === 'corner') V.welcome();
    else setMode('corner');
  };
  $('corner').addEventListener('click',event => {
    const button = event.target.closest('[data-creator]');
    if (!button) return;
    V.hush();
    if (state.creator !== null) {
      const previous = CREATORS[state.creator];
      const previousBox = $('corner').querySelector(`[data-creator="${state.creator}"]`);
      if (state.creator < 9 && previousBox) {
        previousBox.querySelector('img').src = ART[creatorEarned(previous) ? 'open' : 'closed'];
        const post = previousBox.querySelector('.post-mark');
        if (post) post.hidden = false;
      } else if (previousBox) {
        previousBox.querySelector('.team-status').textContent = creatorEarned(previous) ? '✓ Thank-you received' : 'No thank-you yet';
      }
    }
    state.creator = Number(button.dataset.creator);
    state.noCredit = false;
    document.querySelectorAll('[data-creator]').forEach(b => b.setAttribute('aria-pressed',b === button));
    showCreator();
    hint('Read the creator\'s story. Tap No credit to see what happens when a name is missing.');
    Curio.tone(490,.07,.03);
  });
  $('creator-detail').addEventListener('click',event => {
    if (!event.target.closest('#no-credit')) return;
    state.noCredit = !state.noCredit;
    const checked = state.noCredit;
    const c = CREATORS[state.creator];
    const button = $('no-credit');
    button.setAttribute('aria-checked',checked);
    button.textContent = 'No credit: ' + (checked ? 'on' : 'off');
    const old = $('creator-detail').querySelector('.unknown-project');
    if (old) old.remove();
    if (checked) {
      const p = document.createElement('div');
      p.className = 'unknown-project';
      const project = DATA[c[4]];
      p.innerHTML = image(project.photo,'',project.photoInfo.title) + `<small>${escape(project.name)}</small>` +
        (c[5] === 2 ? 'Photo' : 'Fact from') + ': ???';
      $('creator-detail').append(p);
    }
    $('creator-detail').querySelector('.hero-mail').src = ART[checked ? 'locked' : creatorEarned(c) ? 'open' : 'closed'];
    $('mail-status').innerHTML = checked ? 'With no name, nobody knows who to thank.' :
      creatorEarned(c) ? image('postcard','mini-post') + 'One thank-you received' : 'No thank-you yet';
    const mail = $('corner').querySelector(`[data-creator="${state.creator}"] > img`);
    if (mail && state.creator < 9) mail.src = ART[checked ? 'locked' : creatorEarned(c) ? 'open' : 'closed'];
    const post = $('corner').querySelector(`[data-creator="${state.creator}"] .post-mark`);
    if (post) post.hidden = checked;
    const teamStatus = $('corner').querySelector(`[data-creator="${state.creator}"] .team-status`);
    if (teamStatus) teamStatus.textContent = checked ? 'No credit: locked' :
      creatorEarned(c) ? '✓ Thank-you received' : 'No thank-you yet';
    hint(checked ? 'With no name, nobody knows who to thank. Tap No credit to restore the credit.' :
      'Credit restored. Tap another mailbox or return to Build.');
    if (checked) V.how('nocredit',{valid:() => state.noCredit});
    Curio.tone(checked ? 220 : 600,.08,.03);
  });
  $('reset').onclick = () => {
    if (state.trail) stopTrail();
    V.hush();
    $('reset-dialog').showModal();
  };
  $('reset-no').onclick = () => {$('reset-dialog').close(); $('reset').focus({preventScroll:true});};
  $('reset-yes').onclick = () => {
    V.hush();
    state.cards = fresh();
    state.postcards = [];
    try {localStorage.removeItem('ccb-progress');} catch {}
    $('reset-dialog').close();
    state.project = 0;
    state.piece = 0;
    state.page = 0;
    state.slot = 0;
    setMode('build');
    $('reset').focus({preventScroll:true});
  };
  Curio.init({clips:"voice:*",rate:.9});
  showCard();
  renderSource();
  hint(L['w-build']);
  window.__tool = {state,setMode,V,allLines:V.allLines,vlog:V.log,get vq() {return V.queue;},
    evaluate,DATA,CREATORS,accessDate,chooseProject,choosePiece,fill,startTrail,stopTrail,save};
})();
</script>
</body>
</html>
