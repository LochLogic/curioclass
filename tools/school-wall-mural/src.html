      (v === 'bus' && !state.ride && seen('bus') ? `<div class="bus-prompt" aria-label="What did you catch?">${features(i).map((f,k) =>
        `<button id="feature-${k}" data-feature="${k}" aria-pressed="${(state.features[i] || []).includes(k)}">${f}</button>`).join('')}</div>`+
        `<p class="notice" id="bus-result">${SK[i].focal} focal ${SK[i].focal === 1 ? 'shape':'shapes'}. A glance holds about three, in this tool’s guide.`+
        ` You marked ${(state.features[i] || []).length} of 3 features.</p>`:'')+
      (v === 'summers' ? `<div class="swatches" style="--swatch-count:${p.length}">${p.map(x =>
        `<div class="swatch" title="${x[0]}"><i style="background:${mix(x[2],loss(x[1],state.summers))}"></i>`+
        `<b><span class="full">${x[0]}</span><span class="brief">${x[0].match(/[A-Z]+[0-9]+/)?.[0] ||
          ({'Fluorescent pink':'Fl. pink','Phthalo green-blue':'Teal','Titanium white':'White','Carbon black':'Black','Yellow ochre':'Ochre'})[x[0]] || x[0]}</span></b>`+
        `<span class="full">${['','I · excellent','II · very good','III · not lasting'][x[1]]}</span>`+
        `<span class="brief">${['','I','II','III'][x[1]]}</span><br>${(loss(x[1],state.summers)*100).toFixed(1)}% lost</div>`).join('')}</div>`+
        '<p class="small">Model paint grades. Real products and formulations vary.</p>':'');
    positionWall();
    if (v === 'summers' && state.summers === 5) evidence(i).summerFive = revisionKey(i);
    document.querySelectorAll('[data-feature]').forEach(b => b.onclick = () => {
      const k = +b.dataset.feature,f = state.features[i] || (state.features[i] = []);
      if (f.includes(k)) f.splice(f.indexOf(k),1);
      else f.push(k);
      b.setAttribute('aria-pressed',f.includes(k));
      serial++;
      cue();
      $('bus-result').textContent = `${SK[i].focal} focal ${SK[i].focal === 1 ? 'shape':'shapes'}. A glance holds about three, in this tool’s guide. You marked ${f.length} of 3 features.`;
      $('hint').textContent = 'Mark what you caught, then tap Ride again or another view.';
    });
  }
  function stopRide() {clearTimeout(rideTimer);
  rideTimer = null;
  state.ride = false;
  }
  function ride() {
    stopRide();
    V.hush();
    state.ride = true;
    serial++;
    cue();
    state.features[chosen()] = [];
    renderStreetScene();
    $('hint').textContent = 'Watch the wall pass. After the ride, tap the features you caught.';
    state.rideStarted = performance.now();
    rideTimer = setTimeout(() => {
      state.ride = false;
      state.lastRideDuration = performance.now()-state.rideStarted;
      mark('bus');
      renderStreetScene();
      $('hint').textContent = L.busAsk;
      const stamp = serial;
      V.say('busAsk',{valid:() => serial === stamp && state.view === 'bus'});
      $('ride').textContent = 'Ride again';
    },1700);
  }
  function startBoard() {
    state.boardSketch = chosen();
    state.questions = scores(chosen()).map((score,k) => ({score,k})).sort((a,b) => a.score-b.score || a.k-b.k).slice(0,2).map(x => x.k);
    state.questions.push(7);
    state.boardStep = 0;
    state.answers = [];
  }
  function comparison(i,leader) {
    if (i === leader) return false;
    if (seen('across',i) && seen('across',leader) && angle(i,18) >= 15 && angle(leader,18) < 15) return true;
    if (seen('bus',i) && seen('bus',leader) && SK[i].focal <= 3 && SK[leader].focal > 3) return true;
    return seen('summers',i) && seen('summers',leader) &&
      evidence(i).summerFive === revisionKey(i) && evidence(leader).summerFive === revisionKey(leader) &&
      Math.max(...pigments(i).map(p => loss(p[1],5))) < Math.max(...pigments(leader).map(p => loss(p[1],5)));
  }
  function boardContent(k) {
    const i = chosen(),sk = SK[i],s = scores(i),w = state.weights[k] || 0,has = state.weights[k] !== null;
    const card = (text,ok = true,need = '',source = '') => ({text,ok,need,source});
    if (k === 0) return ['What does this have to do with Willow Street?',[
      card(`Mrs. Banks asked for history; our score is ${s[0]}.`,has,'Add Our history to the rubric first.','Rubric: Our history'),
      ...([2,3].includes(i) ? [card('Students will add a timeline panel.',true,'','Proposal; not yet tested')]:[])]];
    if (k === 1) return ['Can drivers and riders even tell what it is?',[
      card(`Across the street the smallest detail is ${angle(i,18).toFixed(1)} arcminutes.`,seen('across'),
        'Run the Across the street test first.','Street test: Across the street'),
      card(`Ken Ito rides by; on the bus test I caught ${(state.features[i] || []).length} of 3 features.`,seen('bus'),
        'Run Ride past in the Bus window test first.','Street test: Bus window')]];
    if (k === 2) return ['Isn’t it a bit dull?',[
      card(`Rosa asked for welcome; we weighted it ${w}.`,has,'Add Bright and welcoming to the rubric first.','Rubric: Bright and welcoming')]];
    if (k === 3) return ['Will it look like this in five years?',[
      card('With the swap, every pigment is I or II.',swapCount(i) > 0 && pigments(i).every(p => p[1] <= 2),
        'Apply the listed paint swaps first.','Revision: Swap paint'),
      card(`Five summers test: up to ${(Math.max(...pigments(i).map(p => loss(p[1],5)))*100).toFixed(1)}% color lost.`,
        seen('summers') && evidence(i).summerFive === revisionKey(i),'Set Summers to 5 in Five summers first.','Street test: Five summers, year 5')]];
    if (k === 4) return ['Who actually paints it?',[card(sk.student,true,'','Sketch plan: student painting role')]];
    if (k === 5) return ['Where’s the green Tomas asked for?',[
      card(`We weighted Nature and calm ${w}; this sketch scores ${s[5]}.`,has,
        'Add Nature and calm to the rubric first.','Rubric: Nature and calm')]];
    if (k === 6) return [`Can we afford ${sk.days} painting days?`,[
      card(`${sk.days} days, ${sk.colors} colors. Others: ${SK.filter((_,j) => j !== i).map(x => `${x.name} ${x.days} days`).join('; ')}.`,
        true,'','Sketch plans: cost and time comparison')]];
    const r = ranking(),ls = leaders(),margin = r.find(x => x.i === i).total-Math.max(...r.filter(x => x.i !== i).map(x => x.total));
    const leadClaim = ls.includes(i) ? `It ${margin === 0 ? 'tied for the lead':`led by ${margin} points`} under our rubric.` :
      `This pick trails the leader by ${-margin} points under our rubric.`;
    return ['Why this over the other three?',[
      card(leadClaim,ls.includes(i),
        'Make this sketch a leader under your rubric first.','Judge: weighted totals'),
      card('It wasn’t the leader, but it passed a street test the leader failed.',!ls.includes(i) && comparison(i,r[0].i),
        'Test this pick and the leader in a view where this pick performs better.','Street test: comparison with the leader')]];
  }
  function renderBoard() {
    if (!state.questions.length || state.boardSketch !== chosen()) startBoard();
    const i = chosen();
    $('controls').innerHTML = '<h3>Your presentation</h3><p class="small">'+SK[i].name+'</p>'+
      `<p class="small">${state.boardStep >= 3 ? 'All three questions addressed.':`Question ${state.boardStep+1} of 3. Locked cards name the evidence still needed.`}</p>`+
      '<button id="back-judge">Back to Judge</button><button id="present">Present again</button>'+
      (state.boardStep < 3 ? '<button id="unanswered">Leave unanswered</button>':'')+
      '<p class="small">The reply records your evidence and the concerns still open. There is no vote or approval.</p>';
    $('back-judge').onclick = () => setMode('judge');
    $('present').onclick = () => {V.hush();
    startBoard();
    serial++;
    preserve(renderBoard);
    hint('welcomeBoard');
    };
    if ($('unanswered')) $('unanswered').onclick = () => answerBoard(null);
    let content;
    if (state.boardStep >= 3) {
      const n = state.answers.filter(a => a && a.strong).length;
      const concerns = state.questions.filter((k,j) => !state.answers[j] || !state.answers[j].strong || (k < 7 && scores(i)[k] <= 2));
      content = `<div class="board-done"><p class="eyebrow">${SK[i].name} · Your presentation</p>`+
        `<h3>The board’s reply</h3><p>You answered ${n} of 3 with evidence from your tests and rubric.</p>`+
        (concerns.length ? concerns.map(k => `<p class="concern">We still worry about ${k === 7 ?
          'why this one beats the alternatives':CR[k][0].toLowerCase()}${k < 7 && scores(i)[k] <= 2 ?
          `: ${scores(i)[k]} of 4. ${reason(i,k)}`:'.'}</p>`).join(''):
        '<p>Your evidence addresses these questions. Keep the remaining tradeoffs visible when you present your plan.</p>')+
        '<p class="small">'+state.answers.map((a,j) => `${j+1}. ${a ? esc(a.text):'Left unanswered.'}`).join('<br>')+'</p></div>';
    } else {
      const [question,cards] = boardContent(state.questions[state.boardStep]);
      content = `<div class="board-question"><p class="eyebrow">Question ${state.boardStep+1} / 3</p><h3>${question}</h3>`+
        `<div class="answers">${cards.map((c,j) => `<button class="answer" id="answer-${j}" data-answer="${j}" aria-disabled="${!c.ok}">`+
        `${esc(c.text)}<small>${c.ok ? esc(c.source):'🔒 '+esc(c.need)}</small></button>`).join('')}</div></div>`;
    }
    $('workspace').innerHTML = '<p class="eyebrow">Willow Street · School board</p><h2>Make the case for your wall.</h2>'+
      `<div class="board-scene"><img class="backdrop" src="${ART.board}" alt="Community, School and Facilities representatives at a table, with your mural on an easel behind them">`+
      `<div class="easel">${painting(i)}</div><div class="nameplates"><span>Community</span><span>School</span><span>Facilities</span></div></div>`+content;
    document.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => {
      const c = boardContent(state.questions[state.boardStep])[1][+b.dataset.answer];
      if (!c.ok) {serial++;
      $('hint').textContent = c.need;
      V.how('lockedHow');
      cue();
      return;
      }
      answerBoard(c);
    });
  }
  function answerBoard(card) {
    state.answers.push(card ? {text:card.text,source:card.source,strong:!card.source.startsWith('Proposal')}:null);
    state.boardStep++;
    serial++;
    cue();
    renderBoard();
    if (state.boardStep >= 3) {
      $('hint').textContent = L.replyHow;
      V.dropQueued();
      V.say('boardDone',{now:true,valid:() => state.boardStep >= 3});
    }
    else hint('evidenceHow');
    ($('answer-0') || $('back-judge')).focus({preventScroll:true});
  }
  for (const m of ['listen','judge','street','board']) $('m-'+m).onclick = () => setMode(m);
  $('reset').onclick = () => {
    if (performance.now()-resetAt < 1000 && serial === resetSerial) return;
    resetAt = performance.now();
    stopRide();
    V.hush();
    Object.assign(state,fresh());
    serial++;
    setMode('listen',true);
    resetSerial = serial;
    try {localStorage.removeItem(STORAGE);
    } catch {}
    $('hint').textContent = 'Project reset. Tap a neighbor’s card to build a new rubric.';
  };
  new ResizeObserver(positionWall).observe($('stage'));
  Curio.init({clips:"voice:*",rate:.9});
  const allLines = () => [...new Set([...V.allLines(),...NB.map(n => n[2])])];
  window.__tool = {state,setMode,allLines,vlog:V.log,get vq(){return V.queue;
  },ranking,scores,angle,loss,
    boardContent,chosen,leaders,pigments,changeWeight,setView,ride,render,stopRide,revisionKey};
  setMode(state.mode,true);
})();
</script>
</body>
</html>
