<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Untangle · Curio Class Recess</title>
  <link rel="stylesheet" href="kit:recess">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body.recess {
      --rc-accent: #ffd166;
      --rc-accent-ink: #1b1630;
      --rc-glass: rgba(20,22,61,.78);
      color: #f4f1ff;
      background: #0a0b26;
      overscroll-behavior: none;
    }
    button { font: inherit; }
    .rc-card .rc-arr { min-height: 44px; }
    button:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
    .scenery, .scenery-veil { position: fixed; inset: 0; pointer-events: none; }
    .scenery { background-size: cover; background-position: center; transition: opacity .8s; }
    #land { animation: drift 40s ease-in-out infinite alternate; }
    .scenery-veil { background: rgba(10,11,38,.4); }
    #sky {
      position: absolute;
      inset: 64px 16px 64px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: visible;
    }
    #field { width: 100%; height: 100%; overflow: visible; display: block; touch-action: none; }
    #threads { filter: url(#thread-light); }
    .thread { stroke: #8fa8ff; stroke-width: 2; opacity: .85; }
    .thread.crossed { stroke: #ff9e6b; stroke-width: 3; opacity: 1; stroke-dasharray: 7 5; animation: fizz 1.44s linear infinite; }
    .crossing { fill: #14163d88; stroke: #ff9e6b; stroke-width: 2; filter: url(#thread-light); pointer-events: none; }
    .solved .thread { stroke: #ffd166; stroke-width: 2.5; stroke-dasharray: none; opacity: 1; animation: none; }
    .star { cursor: grab; outline: none; }
    .star .bead { pointer-events: none; transform-box: fill-box; transform-origin: center; transition: transform .12s; }
    .star .hit { fill: transparent; }
    .star .focus, .star .halo, .star .helper { fill: none; stroke: #ffd166; opacity: 0; pointer-events: none; }
    .star .focus { stroke-width: 3; }
    .star .halo { stroke: #fff6dc; stroke-width: 1.5; }
    .star:focus-visible .focus { opacity: 1; }
    .star.held { cursor: grabbing; }
    .star.held .bead { transform: scale(1.35); }
    .star.held .halo { opacity: .7; }
    .star.help .helper { opacity: .85; stroke-width: 2; animation: helper 2.8s ease-in-out infinite; }
    .star.troubled .bead { animation: twinkle 3s ease-in-out infinite alternate; }
    .star.held .bead { animation: none; }
    .star.settle .bead { animation: settle .16s ease-out; }
    .star.improved:not(.held) .halo { animation: knot-release .38s ease-out; }
    .speck { fill: #d8daff; opacity: .45; animation: twinkle var(--period) ease-in-out infinite alternate; }
    #reveal { opacity: 0; pointer-events: none; transition: opacity .5s; }
    .bloom #reveal { opacity: .86; }
    #fills { opacity: 0; transition: opacity .5s; pointer-events: none; }
    .solved #fills { opacity: 1; }
    .beam {
      stroke: #ffd166;
      stroke-width: 2;
      opacity: .4;
      filter: url(#thread-light);
      stroke-dasharray: var(--beam-length);
      animation: beam-sweep 1.5s ease-out both;
    }
    #beams { pointer-events: none; transition: opacity .3s; }
    #name-card {
      position: absolute;
      left: 50%;
      bottom: 1.5%;
      transform: translate(-50%, 12px);
      opacity: 0;
      white-space: nowrap;
      text-align: center;
      font-size: 26px;
      font-weight: 750;
      letter-spacing: .035em;
      text-shadow: 0 2px 16px #000, 0 0 30px #8fa8ff;
      transition: opacity .5s, transform .5s;
      pointer-events: none;
    }
    .bloom #name-card { opacity: 1; transform: translate(-50%, 0); }
    #hint {
      position: absolute;
      bottom: 7px;
      left: 0;
      right: 0;
      margin: 0;
      text-align: center;
      color: #b9b6e0;
      font-size: 15px;
      text-shadow: 0 1px 8px #0a0b26;
      pointer-events: none;
    }
    .solved #hint { display: none; }
    #world-name {
      position: fixed;
      top: 66px;
      right: 24px;
      color: #b9b6e0;
      text-transform: uppercase;
      letter-spacing: .17em;
      font-size: 11px;
      pointer-events: none;
      text-shadow: 0 2px 10px #0a0b26;
    }
    footer {
      position: fixed;
      bottom: max(8px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .glass {
      border: 1px solid #b9b6e03d;
      background: rgba(20,22,61,.9);
      color: #f4f1ff;
      border-radius: 25px;
      min-height: 44px;
      padding: 10px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px #05051c55, inset 0 1px #b9b6e00c;
    }
    button.glass { cursor: pointer; font-weight: 700; }
    button.glass:hover { border-color: #ffd166; background: #23264e; }
    #count { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
    #count.zero { color: #ffd166; }
    #moves { font-size: 15px; font-variant-numeric: tabular-nums; }
    .mobile { display: none; }
    .sr-only { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    #chart {
      border: 1px solid #8fa8ff55;
      border-radius: 26px;
      padding: 0;
      color: #f4f1ff;
      background: #0e1230;
      width: min(850px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      box-shadow: 0 32px 120px #000c, inset 0 0 50px #8fa8ff0b;
      overflow: hidden;
    }
    #chart::backdrop { background: #030416b8; backdrop-filter: blur(8px); }
    .chart-head {
      padding: 18px 22px 14px;
      background-size: cover;
      background-position: center 85%;
      position: relative;
      isolation: isolate;
    }
    .chart-head::before { content: ''; position: absolute; inset: 0; background: #0a0b2688; z-index: -1; }
    .chart-top, .chart-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chart-top { margin-bottom: 8px; }
    .chart-top span { font-size: 11px; letter-spacing: .16em; color: #d3ceef; text-transform: uppercase; }
    .chart-head button, .chart-foot button {
      color: #f4f1ff;
      background: #14163de8;
      border: 1px solid #b9b6e044;
      border-radius: 16px;
      min-width: 44px;
      min-height: 44px;
      padding: 8px 15px;
      cursor: pointer;
    }
    #chart-title { font-size: 23px; margin: 0; font-weight: 750; }
    #chart-meta { color: #d3ceef; font-size: 13px; margin: 5px 0 0; }
    .chart-nav > div { text-align: center; }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 104px));
      justify-content: center;
      gap: 8px;
      padding: 14px 20px 8px;
    }
    .sky-tile {
      height: clamp(44px, calc((100dvh - 238px) / 5), 104px);
      min-width: 44px;
      padding: 4px;
      position: relative;
      border: 1px solid #8fa8ff2e;
      border-radius: 15px;
      background-color: #171c3a;
      background-size: cover;
      color: #f4f1ff;
      cursor: pointer;
      overflow: hidden;
    }
    .sky-tile::before { content: ''; position: absolute; inset: 0; background: #0a0b2699; }
    .sky-tile:hover { border-color: #b9b6e0; }
    .sky-tile.first { border: 2px solid #ffd166; box-shadow: 0 0 16px #ffd16620; }
    .sky-tile.finale { border-width: 2px; border-color: #b9b6e080; box-shadow: inset 0 0 18px #8fa8ff20; }
    .sky-tile svg { width: 100%; height: 100%; position: relative; }
    .tile-number { position: absolute; left: 8px; top: 5px; font-size: 13px; font-weight: 750; }
    .tile-stars { position: absolute; bottom: 2px; right: 6px; color: #ffd166; font-size: 12px; }
    .tile-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: .75; }
    .tile-art.hidden-picture { opacity: .18; filter: brightness(.5); }
    #chart-daily { grid-column: 1 / -1; height: 44px; font-weight: 700; letter-spacing: .015em; }
    .worlds-grid { grid-template-columns: repeat(6, minmax(0, 120px)); }
    .world-tile { height: clamp(44px, calc((100dvh - 286px) / 4), 96px); }
    .world-tile .tile-number { top: 6px; left: 8px; }
    .world-tile .world-label { position: absolute; left: 6px; right: 6px; bottom: 9px; font-size: 12px; }
    .world-tile svg { position: absolute; right: 3px; top: 3px; width: 32px; height: 32px; }
    .chart-foot { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 12px; gap: 8px; }
    .chart-foot small { font-size: 11px; color: #b9b6e0; }
    @keyframes fizz { to { stroke-dashoffset: -24; } }
    @keyframes twinkle { to { opacity: .75; } }
    @keyframes helper { 50% { opacity: .35; } }
    @keyframes settle { 0% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes knot-release { from { opacity: .85; r: 15px; } to { opacity: 0; r: 38px; } }
    @keyframes drift { to { transform: translate3d(6px, -5px, 0) scale(1.012); } }
    @keyframes beam-sweep { from { stroke-dashoffset: var(--beam-length); } to { stroke-dashoffset: 0; } }
    body.calm *, body.calm *::before { animation: none !important; }
    body.calm .scenery { transition-duration: .2s; }
    body.calm .star .bead { transition: none; }
    body.calm .beam { stroke-dasharray: none; stroke-dashoffset: 0; }
    body.calm #reveal, body.calm #fills, body.calm #name-card { transition-duration: .2s; }
    @media (max-width: 760px) {
      .rc-info { gap: 6px; padding: 7px 10px; }
      .rc-title { font-size: 13px; }
      .rc-stars { font-size: 12px; }
      #sky { left: 12px; right: 12px; }
      footer { left: 12px; right: 12px; gap: 5px; }
      .glass { padding: 10px 12px; }
      #chart-open { width: 44px; min-width: 44px; padding: 8px; font-size: 23px; }
      #chart-open .desktop, #moves .desktop { display: none; }
      .mobile { display: inline; }
      #count { font-size: 15px; }
      #moves { font-size: 13px; padding: 12px 8px; }
      #hint { font-size: 13px; }
      #name-card { font-size: 18px; }
      #world-name { right: 16px; font-size: 10px; }
      #chart { border-radius: 20px; }
      .chart-head { padding: 10px 12px; }
      .chart-top { margin-bottom: 4px; }
      #chart-title { font-size: 18px; }
      #chart-meta { font-size: 11px; }
      .chart-grid { gap: 6px; padding: 12px 10px 6px; }
      .sky-tile { height: min(62px, calc((100dvh - 246px) / 5)); border-radius: 10px; }
      .chart-grid.first-skies { grid-template-columns: repeat(4, minmax(0, 70px)); }
      .first-skies .sky-tile { height: min(70px, calc((100dvh - 288px) / 5)); }
      .first-skies #chart-daily { height: 44px; }
      .worlds-grid { grid-template-columns: repeat(4, minmax(0, 80px)); }
      .world-tile { height: min(80px, calc((100dvh - 238px) / 6)); }
      .world-tile .world-label { display: none; }
      .world-tile:focus-visible .world-label { display: block; font-size: 10px; bottom: 4px; background: #0a0b26; }
      .chart-foot { padding: 4px 12px 10px; }
      .chart-foot small { max-width: 150px; font-size: 10px; }
    }
    @media (max-width: 400px) {
      .rc-info { gap: 4px; padding: 7px 8px; }
      .rc-title { font-size: 12px; }
      .rc-stars { font-size: 11px; }
    }
    @media (max-height: 500px) and (min-width: 600px) {
      .chart-head { padding: 6px 14px; }
      .chart-top { margin-bottom: 0; }
      .chart-top span { display: none; }
      .chart-head .chart-top { position: absolute; right: 70px; top: 8px; }
      .chart-top #worlds-button { min-height: 44px; }
      #chart-title { font-size: 18px; }
      .chart-grid { gap: 4px; padding: 6px 16px; }
      .chart-grid.first-skies { grid-template-columns: repeat(5, minmax(0, 104px)); }
      .chart-grid.worlds-grid { grid-template-columns: repeat(6, minmax(0, 120px)); }
      .sky-tile { height: max(44px, calc((100dvh - 175px) / 5)); }
      .first-skies .sky-tile { height: max(44px, calc((100dvh - 175px) / 5)); }
      .world-tile { height: max(44px, calc((100dvh - 175px) / 4)); }
      .chart-foot { padding: 2px 14px 6px; }
      .chart-foot button { min-height: 44px; }
    }
    @media (max-height: 450px) and (min-width: 600px) and (max-width: 760px) {
      .rc-hud {
        left: 12px;
        right: auto;
        top: 12px;
        width: 156px;
        display: grid;
        grid-template-columns: repeat(3, 48px);
        gap: 6px;
      }
      .rc-info { grid-column: 1 / -1; margin: 0; min-height: 32px; justify-content: center; }
      .rc-btn { width: 48px; padding: 0; justify-content: center; }
      #sky { top: 12px; bottom: 12px; left: 184px; right: 12px; }
      footer {
        left: 12px;
        right: auto;
        bottom: 12px;
        width: 156px;
        height: 144px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }
      footer .glass { text-align: center; padding: 10px 8px; }
      #chart-open { width: 156px; font-size: 15px; }
      #chart-open .desktop { display: inline; }
      #world-name { left: 14px; right: auto; top: 170px; width: 150px; font-size: 10px; letter-spacing: .08em; }
    }
  </style>
</head>
<body>
  <div id="land" class="scenery" aria-hidden="true"></div>
  <div id="previous-land" class="scenery" aria-hidden="true"></div>
  <div class="scenery-veil" aria-hidden="true"></div>
  <main id="sky" aria-label="Constellation sky">
    <svg id="field" aria-label="Drag stars until no lines cross">
      <defs>
        <clipPath id="field-clip"><rect id="field-clip-rect"/></clipPath>
        <filter id="thread-light" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="picture-fill">
          <stop offset="0" stop-color="var(--picture-color)" stop-opacity=".35"/>
          <stop offset="1" stop-color="var(--picture-color)" stop-opacity=".1"/>
        </radialGradient>
      </defs>
      <g id="specks" aria-hidden="true"></g>
      <g id="fills" aria-hidden="true"></g>
      <image id="reveal" aria-hidden="true"/>
      <g id="beams" aria-hidden="true" clip-path="url(#field-clip)"></g>
      <g id="threads" aria-hidden="true"></g>
      <g id="rings" aria-hidden="true"></g>
      <g id="stars"></g>
    </svg>
    <p id="hint">Drag a star. Make the lines stop crossing.</p>
    <div id="name-card" aria-hidden="true"></div>
  </main>
  <div id="world-name" aria-hidden="true">First Skies</div>
  <footer>
    <button id="chart-open" class="glass" aria-label="Star chart (C)"><span aria-hidden="true">✧</span><span class="desktop"> Star chart</span></button>
    <output id="count" class="glass" aria-live="off">3 crossings</output>
    <output id="moves" class="glass" aria-label="Moves"></output>
  </footer>
  <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <dialog id="chart" aria-labelledby="chart-title">
    <header class="chart-head">
      <div class="chart-top"><span>Untangle · Star chart</span><button id="worlds-button">Worlds</button></div>
      <div class="chart-nav">
        <button id="chart-prev" aria-label="Previous world">‹</button>
        <div><h2 id="chart-title"></h2><p id="chart-meta"></p></div>
        <button id="chart-next" aria-label="Next world">›</button>
      </div>
    </header>
    <div id="chart-grid" class="chart-grid"></div>
    <div class="chart-foot"><small>Saved on this device only.</small><button id="chart-back">Back to the sky</button></div>
  </dialog>

function seeded(seed) {
  let h = 1779033703 ^ String(seed).length;

    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

  const width = Math.max(...xs) - minX, height = Math.max(...ys) - minY;
  const homes = pts.map(([x, y]) => [
    80 + Math.floor((1680 * (x - minX) + width) / (2 * width)),
    80 + Math.floor((1680 * (y - minY) + height) / (2 * height))
  ]);
  const moved = shuffled(range(pts.length), random).slice(0, s || pts.length);
  const slots = shuffled(range(100), random);
  const start = homes.map(p => [...p]);
  const placed = homes.filter((_, i) => !moved.includes(i));
  let q = 0;
  for (const v of moved) {
    for (;;) {
      if (q >= slots.length) throw new Error('Invalid sky recipe');
      const slot = slots[q++];
      const point = [80 + 93 * (slot % 10), 80 + 93 * Math.floor(slot / 10)];
      const far = p => Math.max(Math.abs(point[0] - p[0]), Math.abs(point[1] - p[1])) >= 93;
      if (far(homes[v]) && placed.every(far)) {
        start[v] = point;
        placed.push(point);

      }
    }
  }
  return { key: 'R' + String(index + 1).padStart(3, '0'), family, pts, edges, polys, homes, start, moved, p: moved.length };
}

function fit(points, width, height, rotate = false) {
  let pts = points.map(p => [...p]);
  let xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const shapeWidth = Math.max(...xs) - Math.min(...xs);
  const shapeHeight = Math.max(...ys) - Math.min(...ys);
  const turn = height > width ? shapeWidth > shapeHeight : shapeHeight > shapeWidth;
  if (rotate && turn) pts = pts.map(([x, y]) => [y, -x]);
  xs = pts.map(p => p[0]);
  ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = .84 * Math.min(width / (maxX - minX || 1), height / (maxY - minY || 1));
  const ox = width / 2 - (minX + maxX) * scale / 2;
  const oy = height / 2 - (minY + maxY) * scale / 2;
  return { points: pts.map(([x, y]) => [x * scale + ox, y * scale + oy]), scale, ox, oy };

function projection(p, a, b) {
  const d = sub(b, a), length2 = d[0] ** 2 + d[1] ** 2;
  const t = length2 ? limit(((p[0] - a[0]) * d[0] + (p[1] - a[1]) * d[1]) / length2, 0, 1) : 0;
  return [a[0] + t * d[0], a[1] + t * d[1]];
}

function closest(a, b, c, d) {
  const v = sub(b, a), w = sub(d, c), denom = cross(v, w);
  if (Math.abs(denom) > 1e-10) {
    const t = cross(sub(c, a), w) / denom, u = cross(sub(c, a), v) / denom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      const p = [a[0] + t * v[0], a[1] + t * v[1]];
      return { distance: 0, point: p };
    }
  }
  const pairs = [[a, projection(a, c, d)], [b, projection(b, c, d)],
    [projection(c, a, b), c], [projection(d, a, b), d]];
  let best = null;
  for (const [p, q] of pairs) {
    const dist = distance(p, q);
    if (!best || dist < best.distance) best = { distance: dist, point: [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2] };
  }
  return best;
}

function trouble(points, edges, details = true) {
  const bad = new Set(), rings = [], perStar = points.map(() => 0);
  let count = 0;
  for (let i = 0; i < edges.length; i++) {
    const [a, b] = edges[i];
    for (let j = i + 1; j < edges.length; j++) {
      const [c, d] = edges[j];
      const shared = a === c || a === d ? a : b === c || b === d ? b : -1;
      let isTrouble = false, point;
      if (shared >= 0) {
        const farA = a === shared ? b : a, farB = c === shared ? d : c;
        const center = points[shared], p = points[farA], q = points[farB];
        const v = sub(p, center), w = sub(q, center);
        const angle = Math.atan2(Math.abs(cross(v, w)), v[0] * w[0] + v[1] * w[1]);
        const pa = projection(p, center, q), pb = projection(q, center, p);
        const da = distance(p, pa), db = distance(q, pb);
        isTrouble = angle < 4 * Math.PI / 180 || da < 7 || db < 7;
        const pair = da < db ? [p, pa] : [q, pb];
        point = [(pair[0][0] + pair[1][0]) / 2, (pair[0][1] + pair[1][1]) / 2];
      } else {
        const result = closest(points[a], points[b], points[c], points[d]);
        isTrouble = result.distance < 7;
        point = result.point;
      }
      if (isTrouble) {
        count++;
        if (details) {
          bad.add(i);
          bad.add(j);
          rings.push(point);
        }
      }
    }
  }
  for (let i = 0; i < points.length; i++) for (let j = i + 1; j < points.length; j++) {
    if (distance(points[i], points[j]) < 21.5) {
      count++;
      if (details) rings.push([(points[i][0] + points[j][0]) / 2, (points[i][1] + points[j][1]) / 2]);
    }
  }
  if (details) for (const e of bad) for (const v of edges[e]) perStar[v]++;
  return { count, bad, rings, perStar };
}

function slide(point, others, width, height) {
  const clamped = [limit(point[0], 12, width - 12), limit(point[1], 12, height - 12)];
  const free = p => p[0] >= 12 && p[0] <= width - 12 && p[1] >= 12 && p[1] <= height - 12
    && others.every(q => distance(p, q) >= 22);
  if (free(clamped)) return clamped;
  for (let radius = 2; radius <= 2 * Math.hypot(width, height); radius += 2) {
    for (let i = 0; i < 24; i++) {
      const t = i * Math.PI / 12;
      const candidate = [clamped[0] + radius * Math.cos(t), clamped[1] + radius * Math.sin(t)];
      if (free(candidate)) return candidate;
    }
  }
  return clamped;
}

function trueCrossings(points, edges) {
  let count = 0;
  for (let i = 0; i < edges.length; i++) for (let j = i + 1; j < edges.length; j++) {
    const [a, b] = edges[i], [c, d] = edges[j];
    if (a === c || a === d || b === c || b === d) continue;
    // The packed table's X includes touches and overlaps as intersections.
    if (closest(points[a], points[b], points[c], points[d]).distance < 1e-8) count++;
  }
  return count;
}

function dailySky(random) {
  const perim = t => {
    const s = Math.floor(t), f = t - s;
    return [[f, 0], [1, f], [1 - f, 1], [0, 1 - f]][s];
  };
  const meet = (a, b) => {
    const t = cross(sub(b.p, a.p), b.d) / cross(a.d, b.d);
    return [a.p[0] + t * a.d[0], a.p[1] + t * a.d[1]];
  };
  for (let rebuild = 0; rebuild < 20000; rebuild++) {
    let lines = [];
    for (let draw = 0; draw < 400 && lines.length < 6; draw++) {
      const t1 = 4 * random(), t2 = 4 * random();
      if (Math.floor(t1) === Math.floor(t2)) continue;
      const p = perim(t1), q = perim(t2), d = sub(q, p);
      if (lines.some(l => Math.abs(cross(d, l.d)) < .2079116908177593 * Math.hypot(...d) * Math.hypot(...l.d))) continue;
      let reject = false;
      for (let i = 0; i < lines.length; i++) for (let j = i + 1; j < lines.length; j++) {
        if (Math.abs(cross(d, sub(meet(lines[i], lines[j]), p))) / Math.hypot(...d) < .03) reject = true;
      }

    for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++) {

      belongs[j].push(pts.length);
      pts.push(meet(lines[i], lines[j]));
    }

      const l = lines[i];
      const along = id => (pts[id][0] - l.p[0]) * l.d[0] + (pts[id][1] - l.p[1]) * l.d[1];
      ids.sort((a, b) => along(a) - along(b));
      for (let k = 0; k < 4; k++) edges.push([ids[k], ids[k + 1]]);

    if ([[1300,620], [366,690]].some(([w,h]) => trouble(fit(pts, w, h).points, edges, false).count)) continue;
    let start;
    do {
      const order = shuffled(range(15), random);
      start = Array(15);
      order.forEach((v, k) => {
        const a = 2 * Math.PI * k / 15 - Math.PI / 2;
        start[v] = [Math.round((.5 + .42 * Math.cos(a)) * 10000) / 10, Math.round((.5 + .42 * Math.sin(a)) * 10000) / 10];
      });

    return { pts, edges, start, polys: [], beams: belongs, p: 15, name: 'Six beams of light', world: 0, fill: '#9ad7ff', daily: true };
  }

}

const award = (moves, pace) => moves <= pace ? 3 : moves <= 2 * pace ? 2 : 1;

</script>
  <script id="untangle-game">
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function svgElement(tag, attributes = {}) {
  const node = document.createElementNS(NS, tag);

}
const ADJECTIVES = (
  'Silver Sleepy Quiet Bright Little Wandering Northern Glowing Hidden Brave Gentle Shining Dreaming Frosty '
  + 'Golden Velvet Midnight Humming Drifting Sparkling Lucky Patient Secret Twinkling'
).split(' ');
const NOUNS = {
  g: 'Net Quilt Window Garden Ladder Map Weave Fence Bridge Raft Basket Kite'.split(' '),
  w: 'Web Wheel Flower Sun Shield Compass Daisy Snowflake Umbrella Clock Pinwheel Spiral'.split(' '),
  p: 'Lantern Crystal Shell Fan Gem Locket Ring Bell Drum Bubble Coin Mirror'.split(' ')
};
const KEYS = [...FIRST.map(s => s.key), ...RECORDS.map((_, i) => 'R' + String(i + 1).padStart(3, '0'))];
const state = {
  sky: null, positions: [], history: [], moves: 0, held: null, solved: false,
  width: 0, height: 0, report: null, stalls: 0, helped: false, roomHint: false,
  helper: -1, epoch: 0, awardDone: false, page: 0, overview: false, loading: false, transition: null
};
const nodes = { stars: [], threads: [], rings: [] };
let redraw = 0, dailyWorker = null, dailyCache = null, animation = 0, winTimer = 0;
let noteContext = null;
const activeNotes = new Set();
const day = () => {
  const date = new Date();
  return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
};
const dailyKey = () => 'daily:' + day();
const firstUnsolved = () => KEYS.find(key => !Recess.stars(key));

function skyFor(key) {
  if (key.startsWith('L')) {
    const sky = FIRST.find(s => s.key === key);
    return { ...sky, world: 0, p: sky.pts.length };
  }
  const index = Number(key.slice(1)) - 1;
  const sky = ladder(RECORDS[index], index, Recess.rng);
  const j = RECORDS.slice(0, index).filter(r => r[0] === sky.family).length;
  sky.name = 'The ' + ADJECTIVES[j % 24] + ' ' + NOUNS[sky.family][(j + Math.floor(j / 24)) % 12];
  sky.world = Math.floor(index / 25) + 1;

function levelLabel(sky) {
  if (sky.daily) return "Tonight's sky";
  const base = sky.world ? `${WORLDS[sky.world - 1].name} ${(Number(sky.key.slice(1)) - 1) % 25 + 1}`
    : `Sky ${Number(sky.key.slice(1))}`;
  return base + (Recess.store('named:' + sky.key) ? ' · ' + sky.name : '');
}

function announce(text) {
  $('announcement').textContent = '';
  requestAnimationFrame(() => { $('announcement').textContent = text; });
}

function chime(note = 0) {
  if (!Recess.sound || activeNotes.size >= 6) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;

function pixels() {

function setPoint(index, point) {

  });

    }

    const star = nodes.stars[i];
    star.setAttribute('transform', `translate(${x},${y})`);
    star.classList.toggle('held', state.held?.index === i);
    star.classList.toggle('troubled', !state.solved && report.perStar[i] > 0);
    star.classList.toggle('help', !state.solved && state.helper === i);
    const word = report.perStar[i] === 1 ? 'line' : 'lines';
    star.setAttribute('aria-label', `Star ${i + 1} of ${points.length}, ${report.perStar[i]} ${word} crossed`);
    star.setAttribute('aria-pressed', state.held?.index === i ? 'true' : 'false');

  $('count').textContent = count ? `${count} ${count === 1 ? 'crossing' : 'crossings'}` : '✦ No crossings';
  $('count').classList.toggle('zero', !count);

  const desktop = `Moves ${state.moves}` + (goal ? ` · ${goal[0]} within ${goal[1]}` : '');
  const mobile = `${state.moves}` + (goal ? ` / ${goal[0]} ${goal[1]}` : ' moves');

function buildSky() {

    }
    if (state.stalls >= 6 && !state.helped) {
      state.helped = true;
      state.helper = state.report.perStar.indexOf(Math.max(...state.report.perStar));
      $('hint').textContent = 'Try the star with the most dashed lines.';
    }
    const star = nodes.stars[held.index];
    star.classList.remove('settle', 'improved');
    void star.getBoundingClientRect();
    star.classList.add('settle');
    if (count < held.count) star.classList.add('improved');
  }
  draw();
  nodes.stars[held.index].focus({ preventScroll: true });
  const afterDrop = () => {
    const left = state.report.count;
    if (!left) complete();
    else announce(`${left} ${left === 1 ? 'crossing' : 'crossings'} left`);
  };
  if (slid && changed && !Recess.calm) {
    const final = state.positions.map(p => [...p]);
    setPoint(held.index, requested);
    glidePositions(final, 120, afterDrop);
  } else afterDrop();
}

function starKey(event, index) {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    if (state.held?.index === index) drop();
    else if (!state.held) lift(index);
  } else if (event.key === 'Escape' && state.held) {
    event.preventDefault();
    cancelLift();
    announce('Put back.');
  } else if (event.key.startsWith('Arrow') && state.held?.index === index) {
    event.preventDefault();
    const step = event.shiftKey ? 4 : 16;
    const delta = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[event.key];
    const p = pixels()[index];
    setPoint(index, [limit(p[0] + delta[0], 12, state.width - 12), limit(p[1] + delta[1], 12, state.height - 12)]);
    queueDraw();
  } else if (event.key === 'Tab' && state.held) {
    cancelLift();
  }
}

function pointerPoint(event) {
  const bounds = $('field').getBoundingClientRect();
  return [event.clientX - bounds.left, event.clientY - bounds.top];
}
$('field').addEventListener('pointerdown', event => {
  if (event.button !== 0 || state.held || !state.sky || state.loading) return;
  const p = pointerPoint(event), points = pixels();
  let index = -1, best = event.pointerType === 'touch' ? 32 : 26;
  points.forEach((q, i) => {
    const d = distance(p, q);
    if (d <= best) { best = d; index = i; }
  });
  if (index < 0) return;
  event.preventDefault();
  lift(index, event.pointerId);
  if (state.held) {
    $('field').setPointerCapture(event.pointerId);
    setPoint(index, p);
    queueDraw();
  }
});
addEventListener('pointermove', event => {
  if (state.held?.pointer !== event.pointerId) return;
  event.preventDefault();
  setPoint(state.held.index, pointerPoint(event));
  queueDraw();
});
addEventListener('pointerup', event => {
  if (state.held?.pointer !== event.pointerId) return;
  event.preventDefault();
  setPoint(state.held.index, pointerPoint(event));
  drop();
  if ($('field').hasPointerCapture(event.pointerId)) $('field').releasePointerCapture(event.pointerId);
});
addEventListener('pointercancel', event => {
  if (state.held?.pointer === event.pointerId) cancelLift();
});
addEventListener('blur', cancelLift);
$('field').addEventListener('dragstart', event => event.preventDefault());
// Keep following the pointer through delayed SVG capture-loss events. Up or cancel ends the lift.

function pictureGeometry() {
  const sky = state.sky, target = fit(sky.pts, state.width, state.height, !!sky.family);
  $('fills').replaceChildren(...sky.polys.map(poly => svgElement('polygon', {
    points: poly.map(i => target.points[i].join(',')).join(' '), fill: 'url(#picture-fill)'
  })));
  $('sky').style.setProperty('--picture-color', sky.fill);
  const reveal = $('reveal');
  if (!sky.world && !sky.daily) {
    reveal.setAttribute('href', ART.first[Number(sky.key.slice(1)) - 1]);
    reveal.setAttribute('x', target.ox);
    reveal.setAttribute('y', target.oy);
    reveal.setAttribute('width', 100 * target.scale);
    reveal.setAttribute('height', 100 * target.scale);
  } else if (sky.finale) {
    reveal.setAttribute('href', ART.worlds[sky.world - 1]);
    const size = Math.min(state.width, state.height) * .88;
    reveal.setAttribute('x', (state.width - size) / 2);
    reveal.setAttribute('y', (state.height - size) / 2);
    reveal.setAttribute('width', size);
    reveal.setAttribute('height', size);
  }
  return target.points;
}

function showBeams(target) {
  if (!state.sky.daily) return;
  $('beams').replaceChildren(...state.sky.beams.map(ids => {
    const a = target[ids[0]], b = target[ids[ids.length - 1]], d = sub(b, a), length = Math.hypot(...d);
    const beam = svgElement('line', { x1: a[0] - d[0] / length * 2000, y1: a[1] - d[1] / length * 2000,
      x2: b[0] + d[0] / length * 2000, y2: b[1] + d[1] / length * 2000, class: 'beam' });
    beam.style.setProperty('--beam-length', length + 4000);
    return beam;
  }));
  $('beams').style.opacity = 1;
  const epoch = state.epoch;
  setTimeout(() => { if (state.epoch === epoch) $('beams').style.opacity = 0; }, 1500);
}

function saveAward() {
  if (!state.solved || state.awardDone) return;
  state.awardDone = true;
  Recess.win({ score: state.moves, stars: award(state.moves, state.sky.p) });
}

function revealLanded(target) {
  const firstBloom = !$('sky').classList.contains('bloom');
  $('sky').classList.add('bloom');
  if (firstBloom) {
    const epoch = state.epoch;
    target.forEach((_, i) => setTimeout(() => { if (state.epoch === epoch) chime(Math.min(7, i % 8)); }, i * 40));
  }
  if (state.sky.daily && (firstBloom || $('beams').style.opacity === '1')) showBeams(target);
}

function settleReveal() {
  cancelAnimationFrame(animation);
  const target = pictureGeometry();
  state.positions = target.map(([x, y]) => [x / state.width, y / state.height]);
  revealLanded(target);
  draw();
}

function complete() {
  if (state.solved || state.held || state.report.count) return;
  state.solved = true;
  Recess.canUndo(false);
  Recess.store('named:' + state.sky.key, true);
  Recess.level(state.sky.key, levelLabel(state.sky));
  announce('No crossings. Solved!');
  $('sky').classList.add('solved');
  const epoch = state.epoch, origin = pixels(), target = pictureGeometry();
  $('name-card').textContent = state.sky.name;
  const duration = Recess.calm ? 0 : 900;
  const began = performance.now();
  function glide(now) {
    if (state.epoch !== epoch) return;
    const t = duration && !Recess.calm ? Math.min(1, (now - began) / duration) : 1;
    const ease = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
    state.positions = target.map((p, i) => [
      (origin[i][0] + (p[0] - origin[i][0]) * ease) / state.width,
      (origin[i][1] + (p[1] - origin[i][1]) * ease) / state.height
    ]);
    draw();
    if (t < 1) animation = requestAnimationFrame(glide);
    else {
      revealLanded(target);
    }
  }
  glide(began);
  winTimer = setTimeout(() => { if (state.epoch === epoch) saveAward(); }, Recess.calm ? 400 : state.sky.finale ? 2200 : 1600);
}

function undo() {
  if (state.solved || state.loading) return;
  cancelLift();
  // Commit a pending slide before touching its history. Its final position may solve the sky.
  finishTransition();
  if (state.solved) return;
  const last = state.history.pop();
  if (!last) return;
  const target = state.positions.map(p => [...p]);
  target[last.index] = last.before;
  state.moves--;
  Recess.canUndo(state.history.length > 0);
  Recess.play('slide');
  glidePositions(target, 160, () => {
    if (!state.report.count) complete();
    else announce(`${state.report.count} ${state.report.count === 1 ? 'crossing' : 'crossings'} left`);
  });
}

function restart() {
  const key = state.loading ? dailyKey() : state.sky.key;
  const origin = state.positions.map(p => [...p]);
  Recess.play('slide');
  loadSky(key);
  if (!state.loading && origin.length === state.positions.length) {
    const target = state.positions;
    state.positions = origin;
    glidePositions(target, 250);
  }
}

function finishTransition() {
  if (!state.transition) return;
  const { target, done } = state.transition;
  state.transition = null;
  cancelAnimationFrame(animation);
  state.positions = target.map(p => [...p]);
  draw();
  if (done) done();
}

function glidePositions(target, duration, done) {
  finishTransition();
  if (Recess.calm) {
    state.positions = target.map(p => [...p]);
    draw();
    if (done) done();
    return;
  }
  const origin = state.positions.map(p => [...p]), epoch = state.epoch, began = performance.now();
  state.transition = { target, done };
  function frame(now) {
    if (state.epoch !== epoch || !state.transition) return;
    const t = Math.min(1, (now - began) / duration), ease = 1 - (1 - t) ** 3;
    state.positions = target.map((p, i) => [
      origin[i][0] + (p[0] - origin[i][0]) * ease,
      origin[i][1] + (p[1] - origin[i][1]) * ease
    ]);
    draw();
    if (t < 1) animation = requestAnimationFrame(frame);
    else finishTransition();
  }
  animation = requestAnimationFrame(frame);
}

function nextSky() {
  const sky = state.sky;
  if (sky.daily) {
    const key = firstUnsolved();
    if (key) loadSky(key);
    else openChart();
    return;
  }
  const index = KEYS.indexOf(sky.key);
  if (index + 1 < KEYS.length) loadSky(KEYS[index + 1]);
  else openChart();
}

function pageKeys(page) {
  return page ? KEYS.slice(20 + (page - 1) * 25, 20 + page * 25) : KEYS.slice(0, 20);
}

function thumbnail(sky, done) {
  const points = done ? fit(sky.pts, 100, 100).points : sky.start.map(([x, y]) => [x / 10, y / 10]);
  const svg = svgElement('svg', { viewBox: '0 0 100 100', 'aria-hidden': true });
  for (const [a, b] of sky.edges) svg.append(svgElement('line', {
    x1: points[a][0], y1: points[a][1], x2: points[b][0], y2: points[b][1],
    stroke: done ? '#ffd166' : '#8fa8ff', 'stroke-width': done ? 1.3 : .7, opacity: done ? .85 : .5
  }));
  for (const [cx, cy] of points) svg.append(svgElement('circle', { cx, cy, r: 1.3, fill: '#fff6dc' }));
  return svg;
}

function chartButton(label, className, fn) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = className;
  button.setAttribute('aria-label', label);
  button.onclick = fn;
  return button;
}

function paintChart(focusIndex = -1) {
  const grid = $('chart-grid'), page = state.page, overview = state.overview;
  grid.replaceChildren();
  grid.className = 'chart-grid' + (overview ? ' worlds-grid' : !page ? ' first-skies' : '');
  document.querySelector('.chart-head').style.backgroundImage = `url("${ART.skies[page]}")`;
  $('worlds-button').textContent = overview ? 'Skies' : 'Worlds';
  $('chart-prev').disabled = overview;
  $('chart-next').disabled = overview;
  $('chart-title').textContent = overview ? 'Choose a world' : page ? WORLDS[page - 1].name : 'First Skies';
  const keys = pageKeys(page);
  const total = keys.reduce((sum, key) => sum + Recess.stars(key), 0);
  $('chart-meta').textContent = overview ? 'Every sky is open. Follow your curiosity.'
    : `${page ? `World ${page} of 22 · ` : ''}${total} of ${keys.length * 3} ★`;
  if (overview) {
    for (let w = 0; w <= 22; w++) {
      const group = pageKeys(w), solved = group.filter(key => Recess.stars(key)).length;
      const name = w ? WORLDS[w - 1].name : 'First Skies';
      const button = chartButton(`${name}, ${solved} of ${group.length} skies solved`, 'sky-tile world-tile', () => {
        state.page = w;
        state.overview = false;
        paintChart(0);
      });
      button.style.backgroundImage = `url("${ART.skies[w]}")`;
      const number = document.createElement('span'), label = document.createElement('span');
      number.className = 'tile-number';
      number.textContent = w || '✧';
      label.className = 'world-label';
      label.textContent = name;
      button.append(number, label);
      const ring = svgElement('svg', { viewBox: '0 0 32 32', 'aria-hidden': true });
      ring.append(svgElement('circle', { cx: 16, cy: 16, r: 12, fill: '#0a0b2677', stroke: '#8fa8ff55', 'stroke-width': 2 }));
      ring.append(svgElement('circle', { cx: 16, cy: 16, r: 12, fill: 'none', stroke: '#ffd166', 'stroke-width': 2,
        'stroke-dasharray': `${solved / group.length * 75.4} 75.4`, transform: 'rotate(-90 16 16)' }));
      button.append(ring);
      if (w && Recess.stars(group[group.length - 1])) {
        const picture = document.createElement('img');
        picture.src = ART.worlds[w - 1];
        picture.alt = '';
        picture.className = 'tile-art';
        button.prepend(picture);
      }
      grid.append(button);
    }
  } else {
    const first = firstUnsolved();
    keys.forEach((key, i) => {
      const sky = skyFor(key), stars = Recess.stars(key);
      const label = `${levelLabel(sky)}, ${stars} of 3 stars`;
      const tileClass = 'sky-tile' + (key === first ? ' first' : '') + (page && i === 24 ? ' finale' : '');
      const button = chartButton(label, tileClass, () => loadSky(key));
      button.style.backgroundImage = `url("${ART.skies[page]}")`;
      button.append(thumbnail(sky, !!stars));
      if (page && i === 24) {
        const picture = document.createElement('img');
        picture.src = ART.worlds[page - 1];
        picture.alt = '';
        picture.className = 'tile-art' + (stars ? '' : ' hidden-picture');
        button.prepend(picture);
      }
      const number = document.createElement('span'), starText = document.createElement('span');
      number.className = 'tile-number';
      number.textContent = i + 1;
      starText.className = 'tile-stars';
      starText.textContent = '★'.repeat(stars);
      button.append(number, starText);
      grid.append(button);
    });
    if (!page) {
      const daily = chartButton("Tonight's sky, a new tangle every day", 'sky-tile', () => loadSky(dailyKey()));
      daily.id = 'chart-daily';
      daily.textContent = "✧  Tonight's sky";
      grid.append(daily);
    }
  }
  if (focusIndex >= 0) grid.children[Math.min(focusIndex, grid.children.length - 1)]?.focus({ preventScroll: true });
}

function openChart() {
  cancelLift();
  if (state.solved) { saveAward(); Recess.close(); }
  state.overview = false;
  state.page = state.sky?.world || 0;
  paintChart();
  if (!$('chart').open) $('chart').showModal();
  $('chart-back').focus({ preventScroll: true });
}

function closeChart() {
  $('chart').close();
  $('chart-open').focus({ preventScroll: true });
}

function turnPage(delta) {
  state.overview = false;
  state.page = (state.page + delta + 23) % 23;
  paintChart(0);
}
$('chart-open').onclick = openChart;
$('chart-back').onclick = closeChart;
$('chart-prev').onclick = () => turnPage(-1);
$('chart-next').onclick = () => turnPage(1);
$('worlds-button').onclick = () => { state.overview = !state.overview; paintChart(0); };
$('chart').addEventListener('cancel', event => { event.preventDefault(); closeChart(); });
$('chart').addEventListener('keydown', event => {
  event.stopPropagation();
  const key = event.key, grid = $('chart-grid');
  if (key === 'PageDown' || key === 'PageUp') {
    event.preventDefault();
    turnPage(key === 'PageDown' ? 1 : -1);
  } else if (key === 'Home') {
    event.preventDefault();
    const first = firstUnsolved();
    state.page = first?.startsWith('R') ? Math.floor((Number(first.slice(1)) - 1) / 25) + 1 : 0;
    state.overview = false;
    paintChart(Math.max(0, pageKeys(state.page).indexOf(first)));
  } else if (key.toLowerCase() === 'w') {
    event.preventDefault();
    state.overview = !state.overview;
    paintChart(0);
  } else if (key.startsWith('Arrow')) {
    event.preventDefault();
    const columns = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    const index = [...grid.children].indexOf(document.activeElement);
    const delta = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: columns, ArrowUp: -columns }[key];
    const target = limit(index < 0 ? 0 : index + delta, 0, grid.children.length - 1);
    grid.children[target].focus({ preventScroll: true });
  }
});
let swipeStart = null;
$('chart-grid').addEventListener('touchstart', event => { swipeStart = event.touches[0].clientX; }, { passive: true });
$('chart-grid').addEventListener('touchend', event => {
  if (swipeStart === null || state.overview) return;
  const delta = event.changedTouches[0].clientX - swipeStart;
  swipeStart = null;
  if (Math.abs(delta) > 60) { event.preventDefault(); turnPage(delta < 0 ? 1 : -1); }
}, { passive: false });

Recess.start({ id: 'untangle', title: 'Untangle', score: { label: 'Moves', lower: true },
  onUndo: undo, onRestart: restart, onNext: nextSky });
document.body.insertBefore(document.querySelector('footer'), $('sky'));
let previousMotion = null;
Recess.onMotion(calm => {
  // The shell also repaints on score and Undo updates; respond only to a motion change.
  if (calm === previousMotion) return;
  previousMotion = calm;
  if (calm) finishTransition();
  if (calm && state.solved && state.sky) settleReveal();
});
$('rc-sound').addEventListener('click', () => {
  if (!Recess.sound) for (const voices of activeNotes) for (const voice of voices) {
    try { voice.stop(); } catch {}
  }
});
// Saving initials removes its form. Keep keyboard play on the shell's Next control.
document.addEventListener('click', event => {
  const save = event.target.closest?.('.rc-init .rc-go');
  if (!save) return;
  const card = save.closest('.rc-card');
  setTimeout(() => {
    if (!save.isConnected && card.isConnected) card.querySelector('.rc-row button')?.focus({ preventScroll: true });
  }, 0);
}, true);
// Keep the shared shell's modal cards named and keyboard-contained without changing the kit.
new MutationObserver(records => {
  for (const record of records) for (const node of record.addedNodes) {
    const card = node.querySelector?.('.rc-card');
    const heading = card?.querySelector('.rc-h');
    if (!heading) continue;
    heading.id = 'untangle-card-title';
    card.setAttribute('aria-labelledby', heading.id);
  }
}).observe(document.body, { childList: true });
document.addEventListener('keydown', event => {
  if (event.key !== 'Tab') return;
  const card = document.querySelector('.rc-veil .rc-card');
  if (!card) return;
  const controls = [...card.querySelectorAll('button:not(:disabled),input:not(:disabled)')];
  const first = controls[0], last = controls[controls.length - 1];
  if (!first) return;
  if (!card.contains(document.activeElement) || (event.shiftKey && document.activeElement === first)
      || (!event.shiftKey && document.activeElement === last)) {
    event.preventDefault();
    (event.shiftKey ? last : first).focus({ preventScroll: true });
  }
}, true);
addEventListener('keydown', event => {
  if (event.ctrlKey || event.metaKey || event.altKey || event.target.closest('input,textarea') || $('chart').open) return;
  if (event.key.toLowerCase() === 'c') {
    event.preventDefault();
    openChart();
  } else if (event.key === 'Escape' && state.held) {
    event.preventDefault();
    cancelLift();
  }
});
new ResizeObserver(() => {
  cancelLift();
  measure();
  if (!state.sky || state.loading) return;
  if (state.solved) settleReveal();
  else draw();
}).observe($('sky'));
measure();
loadSky(firstUnsolved() || 'L01');

</script>
</body>
</html>
